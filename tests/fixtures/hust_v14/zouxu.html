<p>人工智能与自动化学院青年教师、多谱信息智能处理技术全国重点实验室青年骨干，主要从事计算机视觉与智能感知计算相关的学术与应用技术研究。主持技术领域基金、联合基金青年人才基金等项目。近5年以通讯作者在IEEE TPAMI、CVPR、ICLR等领域顶级学术期刊或会议上发表A类论文十余篇，获2025年ICME最佳论文/最佳学生论文提名。指导硕士生和本科生组成的团队获2024年“挑战杯”竞赛“揭榜挂帅”专项赛全国特等奖。</p>
