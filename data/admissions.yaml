    school_page: e796ed6b529dd0456390bc31ce0d7e1bf2e6156a0ae3ad19d168b0f16a5dd02b
  fields:
    eligibility:
      text: 普通招考学业条件包括应届本科、本科毕业、达到附加条件的同等学力及已获硕博学历或学位等情形；不同情形须逐条核对，不能仅凭学历标签判断。
      quote: 学业水平
      locator: PDF第2—4页，第十—十三条
    exams:
      text: 初试采用笔试，科目以专业目录为准；复试为专业综合考核，面试为必要环节。
      quote: 面试
      locator: PDF第6页，第十八—十九条
    contact:
      text: 简章列出的招生办咨询电话为010-62782192，咨询邮箱为yjszb@mail.tsinghua.edu.cn；报名及院系附加要求还需看对应报名公告。
      quote: 咨询
      locator: PDF第8页，第二十三条；第4—5页，第十四条
