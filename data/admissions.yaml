      quote: 1. 网上报名 ： 系统开放时间（含修改报考信息） 第一阶段（秋季学期）： 2026 年 10 月 12 日― 2026 年 12 月 31 日（中午 12 时系统关闭）。 第二阶段（春季学期）： 2027 年 3 月 1 日― 2027 年 4 月 9 日（中午 12 时系统关闭）。 注： （ 1 ）上述时间为报名系统开放时间，各学院可在上述时间内设置报名时间和考核批次，每批次报名截止时间以各学院发布的招生办法为准。 （ 2 ）在各学院规定的报名时间内，以上两个阶段报名成功均视为有效报名（重复报名无效）。
