  fields:
    eligibility:
      text: 须获得本科高校推免资格，成绩优秀，符合品行、学术诚信及健康条件；科研成果或竞赛奖励可优先考虑。
      quote: 一、申请条件 (一)拥护中国共产党的领导，遵守中华人民共和国宪法和法律、诚实守信，品德良好。 (二)获得所在高校推免生资格，遴选推荐手续与材料齐全。 (三)不存在考试作弊和学术不端行为，在本科学习期间未受过任何影响录取的处罚或处分。 (四)成绩优秀，系统掌握本学科专业领域的基础理论、专业知识和基本技能;具有从事科学研究、专业实践的能力和基础，以及较强的创新意识和潜质。 (五)身体健康状况符合国家和我校规定的体检要求。 (六)申请人本科期间学习成绩优秀，专业成绩或综合成绩名列本专业前茅。 (七)申请人在本科阶段公开发表过学术论文，或取得科研成果，或在国内外重大竞赛中获奖，可优先考虑。
      locator: 一、申请条件
      source_ids:
      - tju_cs_recommend_v18
    materials:
      text: 硕士：申请表、身份证、学籍验证报告、盖章成绩与排名、外语证明、科研竞赛材料、手签诚信承诺。
      quote: (1)申请推免硕士生须提交以下材料(其中证件、证书类均需验原件留复印件) 1.《天津大学2027年硕士推免生申请表》。 2.有效居民身份证(正反面)。若身份证丢失，须提交临时身份证(有效期内)或公安机关开具的户籍证明(贴有本人近期一寸免冠照片、盖骑缝章)。 3.教育部学籍在线验证报告(中国高等教育学生信息网)。 4.大学学习成绩单及排名证明(加盖所在学校教务处公章)。 5.外语水平证明。 6.遴选推荐阶段提交的科研创新成果、竞赛奖项等材料。 7.考生诚信承诺书(打印纸质版，手写签名)。
      locator: 三（二）提交材料分学位清单
      source_ids:
      - tju_cs_recommend_v18
    exams:
      text: 线下机试与现场面试；材料审核合格方可参加，审核分不计总分；综合成绩100分，低于60分不录取。
      quote: (三)综合考核。 着重考察学生德、智、体、能、勤等多方面的综合素质，着重考察学生科研创新潜力，对学科的认识、学科知识的综合应用能力，考生知识背景等。 我学院选拔采用线下机试+现场面试的形式进行，考核时间学院确定后再通知考生，所有考核工作在2026年10月20日前完成。 1.学院材料审核专家组对考生提交材料进行审核打分，审核合格者方可进入后续考核，审核成绩不计入综合考核成绩。 2.学院考核专家组对考生专业素养、研究能力、科研志趣、创新潜质、科学精神、学术道德、专业伦理、社会主义核心价值观等进行全面考核。 (四)综合考核成绩。 综合考核成绩满分为100分，成绩保留一位小数。
      locator: 三（三）（四）；四（二）3
      source_ids:
      - tju_cs_recommend_v18
    timeline:
      text: 直博院内报名9月2—15日已过，计划9月18日前后考核；全国系统另列9月21—10月20日，具体考核以学院通知为准，不能把系统结束日当当前有名额保证。
      quote: (一)填报志愿。 9月21日教育部“推免申请系统”开通之前，所有申请我校的推免生，均须通过我校推免系统填报预报名。我校分批次审核推免生申请信息，通过我校推免系统向符合条件的考生发送考核通知。 1.凡有意申请推免硕士生(含本校生)： 登录天津大学硕士生招生管理系统(https://sszs.tju.edu.cn/10056/user/login/login)或天津大学研究生招生信息网(yzb.tju.edu.cn)(->服务系统->2027级推免硕士申请)进行网上报名。 2.凡有意申请直博生(含本校生)： 登录天津大学博士招生管理系统(http://202.113.8.92/bszs/)或天津大学研究生招生网(yzb.tju.edu.cn)(->服务系统->2027直博生申请)进行网上报名。 计算机学院直博报名时间为 9月2日-9月15日 ，考核时间计划9月18日前后，地点北洋园校区，考核具体安排后续通知。 3.特别说明：在我校推免系统预报名后，仍需在规定时间内登录教育部“推免服务系统”(网址：https://yz.chsi.com.cn/tm)填报志愿，否则报名无效，请务必注意。系统开放时间为9月21日-10月20日。
      locator: 三（一）填报志愿；年份据2026-09-11发布与文中2026考核结束日
      source_ids:
      - tju_cs_recommend_v18
    contact:
      text: 办公室022-27407657，sunjia@tju.edu.cn。
      quote: 六、联系方式 联系部门：天津大学计算机科学与技术学院办公室 电子邮箱：sunjia@tju.edu.cn 联系电话：022-27407657 通讯地址：天津市津南区海河教育园区雅观路135号天津大学北洋园校区55教学楼 邮政编码：300350 学院网址：http://cs.tju.edu.cn/ 学院微信公众号：天津大学计算机科学与技术学院 纪检监察举报投诉电话/邮箱：022-27407657/cs_tju@tju.edu.cn 其他未尽事宜或与教育部规定不一致的，以教育部文件为准。 天津大学计算机科学与技术学院 2026年9月11日
