    exams:
      text: 外语与综合考核按学院办法；同等学力另加政治理论和两门专业课。
      quote: 【审核阶段】 （四）多元考核 主要分为外国语考核和综合考核两个过程： 1. 外国语考核办法 由各学院根据学科需要组织外国语考核，具体办法或免考条件以各学院招生办法（详见附录 A ）为准。 2. 综合考核办法 分批次考核： 按照所报考学院制定的本学院、学科的综合考核办法执行，请查看各学院招生办法（详见附录 A ）。各学院综合考核批次时间、地点等安排将会在报考学院网站以及天津大学研招网上发布，届时请及时查阅并按要求参加有关考核（部分学院或根据生源报考情况一批次考核，详见各学院招生办法或届时咨询报考学院）。 以硕士毕业同等学力身份报考的人员，通过专业考核后，由学院安排组织加试政治理论课和两门专业课，满分均为 100 分，成绩须达到合格线（及格线）。
