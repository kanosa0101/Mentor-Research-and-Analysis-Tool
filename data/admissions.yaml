    timeline:
      text: 已预考核与直接申请两条流程有不同响应时限；9月24日固定待录取确认安排已过。CS直接申请复试通知4小时内接受；软件直接申请为1小时；两院待录取均1小时内确认。
      quote: 三、申请流程 申请者可选择以下两种方式之一申请我院： 方式一：已通过我校预考核的考生→在“全国推免服务系统”中申报我校； 全国推荐免试攻读研究生信息公开暨管理服务系统（ http://yz.chsi.com.cn/tm ）开通后，考核结果为待录取、递补录取的考生，须在系统开通后 6 小时内申报我学院，并在我院发出复试通知后 4 小时内确认；对于 9 月 24 日 14 ： 00 前发出的待录取通知，须在 9 月 24 日 15 ： 00 前确认；对于 9 月 24 日 14 ： 00 后发出的待录取通知，须在待录取发出后 1 小时内确认，学院将根据招生计划、考核结果、合格专业依次录取，逾期未报名或未在规定时间内完成复试、待录取确认者，需再次参加院系的面试选拔。 方式二：直接在“全国推免服务系统”中申报我校。 申请者须在“全国推荐免试攻读研究生信息公开暨管理服务系统”规定的时间内申报我校。 审核报名申请材料后，在系统中向考生发送复试通知，申请者请在 1 小时内接受复试，超过规定时间取消复试资格。确认参加复试的考生加钉钉群： 186570006646 。 学院根据招生计划以及考生复试情况确定其待录取资格，并向待录取的申请者发待录取通知，申请者请在 1 小时内完成待录取确认，超过规定时间取消待录取资格。 学院分批次审核“全国推荐免试攻读研究生信息公开暨管理服务系统”中申请信息，本着先申请先审核的原则，择优选拔，额满为止。
      locator: 三、申请流程；具体时限按学院正文
