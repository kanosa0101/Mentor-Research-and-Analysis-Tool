      quote: "三、招生专业和学制 \n我院2027 年普通招考类学术型博士招生专业和学制如下： \n序号 \n专业代码 \n专业名称 \n学制（年） \n1 \n083900 \n网络空间安全 \n4 \n注：如有变化，以入学当年有关制度为准。\n二、学习年限及学费 博士研究生基本学习年限为 3 ～ 4 年，具体学制可查阅各学院博士招生办法。学费每年 10000 元人民币（壹万元 / 年）。"
