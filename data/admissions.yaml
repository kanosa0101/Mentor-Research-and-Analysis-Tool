      locator: 一、申请条件
      source_ids:
      - dlut_ss_recommend_v18
    materials:
      text: 拟录取推免生须于2026年10月15日前提交思想政治与综合文化素质考核表；这是拟录取后的政审材料截止，不是报名截止；此正文未列完整申请材料清单。
      quote: 1. 思想政治素质和品德考核 学院采取“函调”的方式对考生的思想政治、道德品行及综合文化素质进行考核。所有被学院拟录取的推免生须于 2026 年 10 月 15 日前向拟录取学院提交《大连理工大学研究生思想政治与综合文化素质考核表》（附件 1 ）。对于考核不合格者学院将不予录取。
      locator: 五、复试内容及流程1
      source_ids:
