- id: dlut-cs-2027-master-recommend-v18
  school: dlut
  dept: cs
  level: dept
  title: 大连理工计算机学院2027硕士推免接收章程
  year: 2027
  degree: master
  route: recommend
  track: ordinary
  program: ''
  program_code: ''
  published_at: '2026-09-15'
  reviewed_at: '2026-10-15'
  review_hashes:
    dlut_cs_recommend_v18: b77cf754e4f139099278f71f7e8e733b7fad07c5bd933c9265c9ef672708b132
  source_id: dlut_cs_recommend_v18
  fields:
    eligibility:
      text: 须获得2027本科高校推免资格，入学前取得国家承认的本科毕业证，符合品行健康条件。
      quote: 一、申请条件 1.中华人民共和国公民。 2.拥护中国共产党的领导，品德良好，遵纪守法。 3.能够获得本科所在高校 202 7 年推荐免试资格的应届毕业生。考生 202 7 年入学前（具体入学时间按学校规定执行）必须取得国家承认的本科毕业证书，否则录取资格无效。 4.身体健康状况符合国家和我校规定的体检要求。
      locator: 一、申请条件
      source_ids:
      - dlut_cs_recommend_v18
    materials:
      text: 拟录取推免生须于2026年10月15日前提交思想政治与综合文化素质考核表；这是拟录取后的政审材料截止，不是报名截止；此正文未列完整申请材料清单。
      quote: 1.思想政治素质和品德考核 学院采取 “函调”的方式对考生的思想政治、道德品行及综合文化素质进行考核。所有被学院拟录取的推免生须于20 2 6 年 10月 15 日前向拟录取学院提交《大连理工大学研究生思想政治与综合文化素质考核表》（附件 1 ）。对于考核不合格者学院将不予录取。
      locator: 五、复试内容及流程1
      source_ids:
      - dlut_cs_recommend_v18
    timeline:
      text: 已预考核与直接申请两条流程有不同响应时限；9月24日固定待录取确认安排已过。CS直接申请复试通知4小时内接受；软件直接申请为1小时；两院待录取均1小时内确认。
      quote: 三、申请流程 申请者可选择以下 两 种方式之一申请我院： 方式 一 ： 已通过 我校 预考核的考生 →在“全国推免服务系统”中申报我校； 全国推荐免试攻读研究生信息公开暨管理服务系统（ http://yz.chsi.com.cn/tm ）开通后，考核结果为待录取、递补录取的考生，须 在 系统开通后 6小时内申报我学院，并在我院发出复试通知后 4 小时内确认 ； 对于 9月24日14：00前发出的待录取通知，须在9月24 日 15：00前确认；对于9月24日14：00后 发出 的 待录取通知 ， 须在待录取发出后 1 小时内确认，学院将根据招生计划、 考 核结果 、合格专业依次录取，逾期未报名或未在规定时间内完成复试、待录取确认者，需再次参加院系的面试选拔。 方式 二 ：直接在 “全国推免服务系统”中申报我校。 申请者须在 “全国推荐免试攻读研究生信息公开暨管理服务系统”规定的时间内申报我校。 审核报名申请材料后，在系统中向考生发送复试通知，申请者请在 4 小时内接受复试，超过规定时间取消复试资格。确认参加复试的考生加钉钉群： 184490003694。 学院根据招生计划以及考生复试情况确定其待录取资格，并向待录取的申请者发待录取通知，申请者请在 1 小时 内完成待录取确认，超过规定时间取消待录取资格。 学院分批次审核 “全国推荐免试攻读研究生信息公开暨管理服务系统”中申请信息，本着先申请先审核的原则，择优选拔，额满为止。
      locator: 三、申请流程；具体时限按学院正文
      source_ids:
      - dlut_cs_recommend_v18
    exams:
      text: 计算机学院面试为5分钟PPT与问答。
      quote: 2.综合面试 （ 1）5分钟 PPT介绍 ； （ 2）评委与考生问答。
      locator: 五、复试内容及流程2
      source_ids:
      - dlut_cs_recommend_v18
    contact:
      text: 李老师0411-84706007，liyuqi@dlut.edu.cn。
      quote: 七、联系方式 联 系 人：李老师 联系电话： 0411- 84706007 联系邮箱 ： liyuqi@dlut.edu.cn 联系地址：大连理工大学海山楼 A 1024
      locator: 七、联系方式
      source_ids:
      - dlut_cs_recommend_v18
