  title: 清华2027硕士推免：学校通用规则
  year: 2027
  degree: master
  route: recommend
  program: ''
  program_code: ''
  published_at: '2026-10-08'
  reviewed_at: '2026-10-14'
  source_id: school_pdf
  review_hashes:
    school_pdf: 44923127b8c927782afe8f5b4403eaa6286dd23158feb1c23313746e109cd250
    school_page: e796ed6b529dd0456390bc31ce0d7e1bf2e6156a0ae3ad19d168b0f16a5dd02b
  fields:
    eligibility:
      text: 推免申请要求取得当前本科院校的教育部推荐免试资格，并满足研究能力、诚信与健康等条件；取得免试资格不等于已录取。
      quote: 免试
      locator: PDF第1页，第六条
    contact:
      text: 推免申请先按清华相关通知完成校内申请；获得免试推荐及初步录取资格后，还须按通知完成研招网推免系统的报名与确认。
      quote: 申请
      locator: PDF第1—2页，第七条
    tuition:
      text: 学校收费并设奖助；具体学费依专业/项目附表核对，基本修业年限依培养方案。本摘要没有把某个专业价格套用到全校。
      quote: 学费
      locator: PDF第7页，第二十二条第3项及第8—14页附表
