      quote: "2. 提交申请材料 提交申请材料说明： 申请材料在初审阶段以 电子版形式 在报名系统中提交。申请人须将下述材料的（ 2 ） - （ 14 ）项按照《天津大学 2027 年报考攻读博士学位研究生申请材料模板》（ 模板 点击 此处 下载 ）格式要求按顺序转化为一个 PDF 文件 上传报名系统（ PDF 命名为：考生姓名 - 报考专业 - 报考导师 - 博士申请材料 ）。证书、证件、成绩单、能力证明材料等上传内容须清晰可见，附件总大小不超过 20MB ，如上传不成功，建议更换浏览器（搜狗高速浏览器）或网络环境等。 申请材料清单如下： （ 1 ）天津大学 2027 年报考攻读博士学位研究生登记表 该表由报名系统生成，通过初审（个人状态为“具备资格”）且缴费成功后，可下载打印；签署本人姓名并完成相应栏目的审批手续，现场确认时提交。 （ 2 ）申请信（ Cover Letter ） 自荐信，无 模板 ，可自行设计。 （ 3 ）个人简历（带照片） 无模板，可自行设计。 （ 4 ）现实表现情况表（ 模板点击此处下载 ） 包括思想政治素质和品德考核。主要内容包括考生的政治态度、思想表现、学习（工作）态度、道德品质、遵纪守法和心理健康等方面的情况。 （ 5 ）报考天津大学博士学位研究生研究计划书 （ 模板点击此处下载 ） 研究计划书应包含拟致力于研究的科学问题、已有基础、基本思路、研究方法以及预期目标等。 （ 6 ）本人有效身份证或军人证 （ 7 ）学历学位证书或在学硕士证明 提供本科阶段、硕士研究生阶段的毕业证书和学位证书；如在国外（境外）高校取得学位的考生，还须提供“教育部留学人员服务中心”的认证证书； 应届硕士毕业生提供《教育部学籍在线验证报告》，可登录中国高等教育学生信息网（学信网） https://www.chsi.com.cn/ 查询申请。 （ 8 ）学历学位证书证明材料 在提供学历学位证书基础上，考生视个人情况提供如下证明材料。 ※持 2002 年前（含）毕业的高等教育学历证书的考生需提供： 《中国高等教育学历认证报告》，可登录中国高等教育学生信息网（学信网） https://www.chsi.com.cn/ 查询申请，具体可参考查阅 本指引 。 ※持 2002 年后毕业的高等教育学历证书的考生需提供： 学信网上查询 《教育部学籍在线验证报告》（应届生身份考生）或《教育部学历证书电子注册备案表》（往届生身份考生）\
        \ 。 未能通过学历（学籍）网上校验的考生应提供上述 《中国高等教育学历认证报告》 。 ※硕士阶段仅有硕士学位证书的（单证）考生，应同时提供以下证明： a 硕士学位认证报告，可登录中国高等教育学生信息网（学信网） https://www.chsi.com.cn/ 查询申请； b 本科（含专升本以及自学考试本科学历等）阶段毕业证书的《中国高等教育学历认证报告》或《教育部学历证书电子注册备案表》。 （ 9 ）硕士课程成绩单 需提供硕士阶段的课程成绩单，并加盖 学校 培养单位公章（若为复印件需加盖档案管理部门公章）。 （ 10 ）硕士学位论文摘要 包括硕士论文题目、指导教师、论文摘要和创新性总结。 （ 11 ）代表性的科研成果以及获奖证书 包括代表性的学术论文、申请专利、获得科技奖励以及参与科研项目情况等；所获得的各类与申请博士有关的获奖证书。 （ 12 ）外国语水平证明材料 外国语水平证书、成绩单、留学经历证明等。 （ 13 ）以同等学力身份（见本招生简章一、（二） 3 ）报考的考生 须提供本科成绩单以及硕士课程成绩证明材料 以及 两篇以第一作者身份在报考专业或相近领域公开发表的学术论文（我校认定的核心期刊）。 （ 14 ）报考学院要求的其他材料以及能力证明材料 （ 15 ）《专家推荐书》 须下载空白《专家推荐书》 （ 模板点击此处下载 ） ，按照学院要求请至少两位专家填写推荐理由和意见 （其中一位原则上应为考生的硕士指导教师，其余要求职称应为副教授及以上；签名手写，其他内容手写、打印均可） ，由推荐人在信封封口处骑缝签字。\n我学院不单独组织现场确认，相关环节将与资格审查合并，采用\n线上的形式完成。 \n特别说明：现场确认时考生须携带招生简章中规定的所有申请材\n料，包括《中国高等教育学历认证报告》、《教育部学历证书电子注册\n备案表》以及《教育部留服认证报告》等，详细内容请查询我校2027\n年博士招生简章。"
      locator: 学校三申请阶段2；院系PDF现场确认段；quote以换行分隔独立原文段
      source_ids:
      - tju_phd_school_v18
      - tju_cyber_phd_pdf_v18
    timeline:
      text: 秋季2026-10-12至12-31中午12时，春季2027-03-01至04-09中午12时。全部申请材料在第二阶段后统一审核；2027春季统一考核，具体另发。软件/网安另明确秋季仅报名不审核。
      quote: "四、申请审核程序  \nA 申请阶段  \n我学院分别于2026 年秋季学期和2027 年春季学期（2027 年3-\n4 月）开展普通招考博士报名工作，报名时间分别为： \n第一阶段（秋季学期）：2026 年10 月12 日—2026 年12 月31 日\n中午12 时； \n第二阶段（春季学期）：2027 年3 月1 日—2027 年4 月9 日中午\n12 时。 \n报名流程和要求等按照《天津大学2027 年博士研究生招生简章》\n中规定的申请流程执行。两个阶段报名成功均视为有效报名，第一阶\n段仅报名不审核。请特别留意报名时间，在规定时间内提交报名信息，\n逾期不补。 \n1.资格审查 \n考生在博士招生管理系统中自主选择和申请导师。学院将成立申\n请材料审核小组，在第二阶段报名后由材料审查小组对全部申请人的\n材料统一进行审核。进入考核名单的考生硕士期间研究方向应为网络\n安全相关专业，或有相关基础。 \n材料审核评价的主要依据包括考生从事报考学科领域的工作经\n历、已取得的科研成果和发表的高水平学术论文、学科竞赛等（50 分）；\n申请材料所反映出来的考生继续攻读博士学位研究生所具备的专业\n知识、科研能力、综合素质和培养潜力等（50 分）。 \n根据学院招生计划数和考生情况，材料审核成绩分为合格和不合\n格两档，合格分数线根据当年审核情况划定。材料审核成绩合格的考\n生直接进入复试考核。材料审核成绩不合格的考生，不能进入下阶段\n考核。"
      locator: PDF第1—2页四A
      source_ids:
      - tju_cyber_phd_pdf_v18
    exams:
      text: 外语为面试，不单独英语笔试/机考；外语20%、基础40%、综合40%，任一不足60不录取。材料审核科研经历成果50分、专业能力潜力50分，合格线按当年审核划定。
      quote: "外国语考核办法： \n不单独设立英语笔试或机考，外国语考核采用面试形式考核，详\n见以下综合考核办法中说明。 \n综合考核办法：  \n1.考核方式：包括学术报告、现场抽题、专家提问等多元考核方\n式。重点考查考生的专业基础、综合素质、逻辑思维和创新能力、外\n国语水平等。 \n2.考核环节：包括外语应用能力测试、专业基础测试及专业综合\n测试三个环节。其中外语应用能力测试占20%、专业基础测试及专业\n综合测试各占40%。 \n外语应用能力测试主要考察考生的阅读、口语和外语科技写作能\n力。口语主要以对话、专业外语问答等的形式进行；阅读和写作主要\n通过现场阅读、现场外文资料翻译等形式进行。 \n专业基础测试以面试的形式考核，考生选择报考学科基础的一个\n选题进行PPT 讲解展示，选题一般为本方向或学科某基础课的一个核\n心章节，专家组根据讲解情况和回答问题情况给出成绩。 \n专业综合测试包括科研综合能力测试和综合考察。科研综合能力\n测试主要考察考生科技查新能力、已取得的科研成果情况、未来科研\n工作思路和规划、科研潜力等。并由面试专家对考生的科研情况进行\n综合考察。 \n3.分制：每一个考核环节的满分均为100 分。每位专家根据情况\n对考生进行无记名打分，所有专家的分数取平均值。外语应用能力测\n试、专业基础面试、专业综合面试三个环节中任一环节未达到及格线\n（60 分）的考生均属考核不合格，一概不予录取。 \n4.总成绩的计分办法： \n总分按照百分制计分。 \n总成绩=外语应用能力测试*20%+专业基础测试*40%+专业综合测\n试*40% \n \nC 录取阶段  \n1. \n考核时间：我院考核时间统一于2027 年春季学期组织，具体安\n排另行公布。\n录取规则  \n对于考核合格的学生，学院将根据考生总成绩从高到低顺序，并\n结合当年各专业招生指标数按顺序确定拟录取人员候选名单； \n2. 调剂原则 \n当有招生指标的博士生导师没有成绩合格的考生，且学院有剩余\n招生计划时，本着师生双向选择的原则，从报考其他导师的合格考生\n中进行调剂。\n材料审核评价的主要依据包括考生从事报考学科领域的工作经\n历、已取得的科研成果和发表的高水平学术论文、学科竞赛等（50 分）；\n申请材料所反映出来的考生继续攻读博士学位研究生所具备的专业\n\
        知识、科研能力、综合素质和培养潜力等（50 分）。 \n根据学院招生计划数和考生情况，材料审核成绩分为合格和不合\n格两档，合格分数线根据当年审核情况划定。材料审核成绩合格的考\n生直接进入复试考核。材料审核成绩不合格的考生，不能进入下阶段\n考核。"
