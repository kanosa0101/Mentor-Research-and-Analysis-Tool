    timeline:
      text: 秋季2026-10-12至12-31中午12时，春季2027-03-01至04-09中午12时。全部申请材料在第二阶段后统一审核；2027春季统一考核，具体另发。软件/网安另明确秋季仅报名不审核。
      quote: "四、申请审核程序\n我学院分别于2026 年秋季学期和2027 年春季学期（2027 年3-4\n月）开展普通招考博士报名工作，报名时间分别为\n  A 申请阶段\n：\n秋季学期：2026 年10 月12 日—2026 年12 月31 日（中午12 时\n系统关闭）。\n春季学期：2027 年3 月1 日—2027 年4 月9 日（中午12 时系统\n关闭）。\n考生在博士招生管理系统中自主选择和申请导师。学院将成立申\n请材料审核小组，在第二阶段报名后由材料审查小组对全部申请人的\n材料统一进行审核。进入考核名单的考生硕士期间研究方向应为人工\n智能、计算机科学与技术、软件工程等相关专业，或有相关基础\n报名流程和要求等按照《天津大学2027 年博士研究生招生简章》\n中规定的申请流程执行，请特别留意报名时间，在规定时间内提交报\n名信息，逾期不补。\n    1.资格审查\n。\n材料审核评价的主要依据包括考生从事报考学科领域的工作经\n历、已取得的科研成果和发表的高水平学术论文、学科竞赛等（50\n分）；申请材料所反映出来的考生继续攻读博士学位研究生所具备的\n专业知识、科研能力、综合素质和培养潜力等（50 分）。\n根据学院招生计划数和考生情况，材料审核成绩分为合格和不合\n格两档，合格分数线根据当年审核情况划定。材料审核成绩合格的考\n生直接进入复试考核。材料审核成绩不合格的考生，不能进入下阶段\n考核。"
      locator: PDF第1—2页四A
      source_ids:
      - tju_ai_phd_pdf_v18
    exams:
      text: 外语为面试，不单独英语笔试/机考；外语20%、基础40%、综合40%，任一不足60不录取。材料审核科研经历成果50分、专业能力潜力50分，合格线按当年审核划定。
      quote: "外国语考核办法：\n不单独设立英语笔试或机考，外国语考核采用面试形式考核，详\n见以下综合考核办法中说明\n特别说明：现场确认时考生须携带招生简章中规定的所有申请材\n料，包括《中国高等教育学历认证报告》、《教育部学历证书电子注\n册备案表》以及《教育部留服认证报告》等，详细内容请查询我校\n2027 年博士招生简章。\n   B 审核阶段\n。\n外语应用能力测试主要考察考生的阅读、口语和外语科技写作能\n力。口语主要以对话、专业外语问答等的形式进行；阅读和写作主要\n通过现场阅读、现场外文资料翻译等形式进行\n综合考核办法：\n    1.考核方式：包括学术报告、现场抽题、专家提问等多元考核\n方式。重点考查考生的专业基础、综合素质、逻辑思维和创新能力、\n外国语水平等。\n    2.考核环节：包括外语应用能力测试、专业基础测试及专业综合\n测试三个环节。其中外语应用能力测试占20%、专业基础测试及专业\n综合测试各占40%。\n。\n专业基础测试以面试的形式考核，考生选择报考学科基础的一个\n选题进行PPT 讲解展示，选题一般为本方向或学科某基础课的一个核\n心章节，专家组根据讲解情况和回答问题情况给出成绩。\n总分按照百分制计分。\n总成绩=外语应用能力测试*20%+专业基础测试*40%+专业综合测\n试*40\n专业综合测试包括科研综合能力测试和综合考察。科研综合能力\n测试主要考察考生科技查新能力、已取得的科研成果情况、未来科研\n工作思路和规划、科研潜力等。并由面试专家对考生的科研情况进行\n综合考察。\n    3.分制：每一个考核环节的满分均为100 分。每位专家根据情况\n对考生进行无记名打分，所有专家的分数取平均值。外语应用能力\n测试、专业基础面试、专业综合面试三个环节中任一环节未达到及格\n线（60 分）的考生均属考核不合格，一概不予录取。\n    4.总成绩的计分办法：\n%\n对于考核合格的学生，学院将根据考生总成绩从高到低顺序，并\n结合当年各专业招生指标数按顺序确定拟录取人员候选名单\n考核时间：我院考核时间统一于2027 年春季学期组织，具体安\n排另行公布。\n   C 录取阶段\n    1. 录取规则\n；\n当有招生指标的博士生导师没有成绩合格的考生，且学院有剩余\n招生计划时，本着师生双向选择的原则，从报考其他导师的合格考生\n\
        中进行调剂\n    2. 调剂原则\n。\n材料审核评价的主要依据包括考生从事报考学科领域的工作经\n历、已取得的科研成果和发表的高水平学术论文、学科竞赛等（50\n分）；申请材料所反映出来的考生继续攻读博士学位研究生所具备的\n专业知识、科研能力、综合素质和培养潜力等（50 分）。\n根据学院招生计划数和考生情况，材料审核成绩分为合格和不合\n格两档，合格分数线根据当年审核情况划定。材料审核成绩合格的考\n生直接进入复试考核。材料审核成绩不合格的考生，不能进入下阶段\n考核。"
      locator: PDF第3—4页B；第2页材料审核；quote以换行分隔独立原文段
