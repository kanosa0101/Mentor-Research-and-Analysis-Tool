      quote: 六、联系方式 （一）各学院咨询电话见附录 C ， 涉及招生办法、申请材料审核以及考核安排等请优先咨询报考学院 。通讯地址详询各学院。 （二）研究生招生办公室： 咨询邮箱： tjub27401195@126.com （优先） 联系电话： 022-27409520 。
