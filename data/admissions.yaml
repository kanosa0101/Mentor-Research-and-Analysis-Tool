  year: 2027
  degree: master
  route: recommend
  track: ordinary
  program: ''
  program_code: ''
  published_at: '2026-09-20'
  reviewed_at: '2026-10-15'
  review_hashes:
    nankai_software_recommend_pdf_v17: 518f49673d7f13b49482ebc1f9a1081d6ef074d3193a794a931c542d9b573229
  source_id: nankai_software_recommend_pdf_v17
  fields:
    eligibility:
      text: 须取得2027届本科推免资格；英语门槛及其他条件按原文逐项核验。软件硕士特别优秀者可按原文通过院方英语考核；直博须满足列举的英语条件之一。
      quote: '一、接收条件

        1．中华人民共和国公民，热爱祖国，遵纪守法，品德良好，身

        心健康。

        2．在本科就读高校可取得推荐资格的2027 届优秀应届本科毕业

        生。

        3．研究兴趣浓厚，具有较强的创新意识、创新能力和专业素养。

        4．诚实守信，学风端正，不存在任何有违学术道德、专业伦理

        等行为。

        5、对软件工程相关学科有浓厚的兴趣，愿意从事科学研究工作。

        6、英语水平（应符合以下任一项）：

        （1）通过全国大学英语六级考试（六级成绩425 分及以上）或

        通过全国大学英语四级考试且成绩为优秀（四级成绩550 分及以上）；

        （2）TOEFL 成绩90 分（120 分制）及以上或4.5 分（6 分制）

        及以上;

        （3）IELTS（A 类/学术类）成绩6 分及以上；

        （4）GRE 成绩在310 以上，GMAT 成绩在640 以上；

        （5）英语专业四级（及以上）考试合格。


        （6）硕士推免生如学业成绩、排名、发表高水平论文、专利等

        方面特别优秀，但不符合以上条件，需通过学院组织的英语考核。直

        博推免生必须符合（1）-（5）的任一项。'
      locator: 一、接收条件
    timeline:
      text: 2026年9月21日9:00—15:00报名，9月22日8:00起发送复试通知，9月24日14:00起确认待录取；9月时间的年份据2026-09-20发布日及2027级接收通知确定，时区为Asia/Shanghai。
      quote: '二、接收流程

        所有报名软件学院的硕士推荐免试生及直博生必须通过教育部

        “全国推荐免试攻读研究生信息公开管理服务系统”（网

