    quota:
      text: 院系公布计划含拟接收推免人数，统考人数以院系计划减去实际推免录取人数计算，最终计划仍可能调整；不能把总计划视作统考剩余名额。
      quote: 全国统一考试招生人数以院系公布的招生计划数减去实际接收的推荐免试生人数为准
      locator: 简章PDF第9页十（1）
    tuition:
      text: 硕士一般2或3年，具体学制以培养方案为准；学费按简章第11—16页附件的具体院系/专业/方式核对。专业学位、非全日制等不安排住宿，软微与深圳研究生院按院系安排；不可把学硕价格或住宿套用全部专业。
      quote: 学费标准见附件
      locator: 简章PDF第6—8页四—七，附件第11—16页
    funding:
      text: 奖助按研究生院/学生工作部门制度及院系规定核对；人事档案不转入者不提供奖学金、住宿和公费医疗，不能默认所有申请者同样享有。
