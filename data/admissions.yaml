      quote: （三） 考点 审核时间 考生按网报系统要求上传核验材料后，报考点根据相关规定组织专人对考生报名信息和材料进行审核。请考生及时登录研招网查看审核结果。 报考点审核、考生上传补充材料开始时间： 2026年10月26日9:00
