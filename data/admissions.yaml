      text: 须取得2027届本科推免资格；英语门槛及其他条件按原文逐项核验。
      quote: 一、接收条件 1 ．中华人民共和国公民。 2 ．拥护中国共产党的领导，遵纪守法，品德良好。 3 ．身心健康状况符合国家和我校规定的体检要求。 4 ．在本科就读高校可取得推荐资格的 2027 届优秀应届本科毕业生。 5 ．研究兴趣浓厚，具有较强的创新意识、创新能力和专业素养。 6 ．诚实守信，学风端正，不存在任何有违学术道德、专业伦理等行为。 7 ．教育部规定的其他条件要求。 8 、对计算机、网络空间安全、密码等相关学科有浓厚的兴趣，愿意从事科学研究工作。 9 、英语水平（应符合以下任一项）： （ 1 ）通过全国大学英语六级考试（六级成绩 425 分及以上）或通过全国大学英语四级考试且成绩为优秀（四级成绩 550 分及以上）； （ 2 ） TOEFL 成绩 90 分（ 120 分制）及以上或 4.5 分（ 6 分制）及以上 ; （ 3 ） IELTS （ A 类 / 学术类）成绩 6 分及以上； （ 4 ） GRE 成绩在 310 以上， GMAT 成绩在 640 以上； （ 5 ）英语专业四级（及以上）考试合格。
