      text: 学校申请考核招收军人生、文职人员、地方生，身份审批/在职单位同意等条件分别适用；外语近五年须满足七项之一，含托福75、雅思6、六级425或通过校英语测试。学业能力须满足五项之一（论文、应届成绩、特别推荐等），院系可提高标准。不是CS本科即可申请，不与推免直博互换。
      quote: 各招生学科在以上基础上提高标准或增设其他考核条件，具体在各学院招生细则中明确。
