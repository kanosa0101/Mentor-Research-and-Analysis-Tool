      quote: "2. 综合面试 （ 1 ）英文自我介绍（时长 2 分钟） （ 2 ） 8 分钟 PPT 介绍，介绍内容须包含： \x81 专业排名信息； \x82 本科课程及成绩介绍； \x83 外语能力； \x84 参与科研创新类项目、竞赛情况； 其他信息。 3 、评委与考生问答。"
      locator: 五、复试内容及流程2
