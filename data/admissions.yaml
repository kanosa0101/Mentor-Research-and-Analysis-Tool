  fields:
    eligibility:
      text: 取得或预计取得本校推免资格，并满足品行、学术诚信、当年章程目录及健康要求；不据此判断CS本科跨专业是否合格。
      quote: 二、申请资格 1、 凡已取得或预计能取得所在本科毕业学校推荐免试资格的考生均可报名。 2、 遵纪守法，品行优良，无任何违法违纪受处分记录 。 3、 学风端正，无任何考试作弊或剽窃他人学术成果记录 。 4、 符合我校当年招生简章和招生专业目录中规定的报考条件 。 5、 身心健康，符合国家及我校的相关体检要求。
      locator: 二、申请资格
      source_ids:
      - sdu_cs_recommend_v18
    materials:
      text: 申请报告、思政表、盖章本科成绩单、外语证明、获奖、代表成果、相关服役志愿等证明、回避说明、签名诚信承诺书、2027接收申请汇总表及学院其他材料。
      quote: 四、申请材料 1、申请攻读研究生报告，内容包括个人信息简介，学习、科研简要经历，对申请专业的认识及未来学习科研规划等； 2、思想政治素质和品德考核表； 3、本科阶段成绩单，须加盖学校教务主管部门公章； 4、外语水平证明或外语资格考试成绩单； 5、重要获奖证书； 6、体现自身学术水平的代表性学术论文、出版物或原创性工作成果等材料； 7、在校期间参军入伍服兵役、参加志愿服务、到国际组织实习等证明材料； 8、回避情况说明。凡有直系亲属或利益相关人员在我校工作，尤其是在所申请推免的校内招生单位工作的，要主动说明报备。对未按规定报备声明回避关系且影响推免过程和结果公平公正的学生，学校将取消其推免录取资格； 9、本人签名的诚信承诺书； 10、2027年接收推荐免试硕士研究生申请汇总表。 11、我校相关招生单位要求提供的其他材料。
      locator: 四、申请材料1—11
      source_ids:
      - sdu_cs_recommend_v18
    timeline:
      text: 本轮预报名为2026-09-01 09:00至09-11 17:00，已结束。未预报名者可在全国系统开通后申请，但学院视剩余计划决定是否考核，不能据此认为当前仍有名额。
      quote: '三 、预报名 1、 报名开始时间： 202 6 年 9月1日 09 ： 0 0-9月 11 日 17:00 。 2、 登录山东大学研究生招生管理服务平台（ https://yanzhao.sdu.edu.cn），选择“推免预报名”，首次登录系统请注册，已报考夏令营的考生无需再次注册 。 3、 登录系统后，系统列出可报考的项目列表，每个项目为一个招生单位。每名考生最多可选择三个招生单位，每个招生单位内仅可选择一个专业报考 。 4、 报名信息提交后，在报名时间段如需修改信息，可点击志愿列表中 “修改”按钮进行修改，修改后请再次提交 ； 5、 请认真核对报名信息，确保为提交状态，未提交的报名信息无效 。 6、 报名后请关注系统审核结论，如信息被退回修改，请在规定时间内按要求修改后重新提交 。 7、 学院将于 9月中旬起择优分批次通知考生参加复试。复试方式和复试内容将在本网站公布。

        4．未参加我 院 预报名的推免生，可在教育部开通 “全国推荐免试攻读研究生信息公开暨管理服务系统”后，登录系统进行报名。我 院 将根据招生计划剩余情况决定是否发放复试通知和组织复试，具体安排 将另行通知 。'
      locator: 三、预报名；五、其他事项第4项；quote以换行分隔独立原文段
      source_ids:
      - sdu_cs_recommend_v18
    contact:
      text: 苏老师，0532-58630610，cs_graduate@sdu.edu.cn；培养地青岛。
      quote: 六 、咨询方式 联系人：苏老师 电话： 0532-58630610 邮箱： cs_graduate@sdu.edu.cn 学院网站： http://www.cs.sdu.edu.cn 地址：山东省青岛市即墨区滨海路 72号 计算机科学与技术学院研究生招生办公室 202 6 年 8 月 31 日
