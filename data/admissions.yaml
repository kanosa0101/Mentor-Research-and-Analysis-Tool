      text: 本简章适用校本部、燕园/新燕园、软微及深圳研究生院，医学部另行公布。应届本科、已毕业本科、符合条件的同等学力、已获硕博学历学位均须逐条核对；同等学力额外要求在国家核心期刊以第一或第二作者发表至少一篇相关学术论文。在读研究生报名前须培养单位同意，复试通过并退学后方能取得拟录取资格。
      quote: 须在国家核心期刊上发表一篇
      locator: 简章PDF第1—2页二（一）
    materials:
      text: 所有报考者须填报信息、缴费并按所选报考点上传核验材料；照片通过学信网APP拍摄上传。仅选择北大1101报考点且对应核验失败/身份类型者，按1101清单补身份证正反面、学籍在线验证报告或学历备案/认证报告、必要的户籍社保或在读研究生同意证明等；此清单不能套用其他报考点。具体材料与模板须打开附件逐项核对。
      quote: 考生直接通过学信网APP在线拍摄并上传本人照片。
      locator: 网报公告PDF第1—3页二；1101报考点材料清单PDF第1—4页
      source_ids:
      - pku_2027_registration_v14
      - pku_2027_1101_materials_v14
    exams:
      text: 初试时间按教育部统一规定，科目依2027专业目录；复试有笔试、面试、实践等，面试必需。须同时达到学校与院系复试要求，同等学力至少加试两门。具体院系科目/附加要求仍需查院系，本记录仅学校通用。
      quote: 必要环节
      locator: 简章PDF第4—5页二（三）（四）
    timeline:
      text: 正式报名2026年10月15—24日，每日9:00—22:00；10月24日22:00前须上传本人材料并网上支付初试费。预报名已完成填报、缴费、生成报名号者不重复报名。材料审核不通过仍须及时补正，不能只完成填报。
      quote: 10月24日22:00
      locator: 网报公告PDF第1—3页二（一）（五）
      source_ids:
