  fields:
    eligibility:
      text: 已获硕士或应届硕士，或学士满6年且满足同等学力课程、论文/成果条件；至少两名本领域副教授或相当职称推荐；还须满足学院条件。仅普通学术博士，专业博士另发。
      quote: 一、报考条件 （一）拥护中国共产党的领导，具有正确的政治方向，热爱祖国，愿意为社会主义现代化建设服务，遵纪守法，品行端正。 （二）考生的学位必须符合下列 条件之一 ： 1. 已获硕士学位的人员（其中境外所获得学位者需出具“教育部留学人员服务中心”的认证证书）； 2. 应届硕士毕业生（最迟须在入学前取得硕士学位证或硕士毕业证）； 3. 获得学士学位 6 年及以上（从获得学士学位之日到录取当年入学之日），达到与硕士毕业生同等学力人员。以硕士毕业同等学力身份报考的人员，须提交： 3.1 本科成绩单以及在报考专业已经学过的硕士课程成绩证明（包括全部必修课和学位课，且成绩合格）； 3.2 在报考专业或相近领域以第一作者身份在我校认定的核心期刊上发表的学术论文 2 篇，或在科学研究等本职工作中已取得重要成果，其中至少有一项科研成果获得国家级或省部级奖励。 （三）身体和心理健康状况符合国家规定的体检要求。 （四）有至少两名所报考学科专业领域内的副教授（或相当专业技术职称的专家）的书面推荐意见。 （五）现役军人报考天津大学博士研究生，须按照原解放军总政治部的有关规定办理。 （六）拟报考学院、学部（以下简称“各学院”）要求的其他条件（详见附录 A 各学院 2027 年博士学位研究生招生办法）。 不符合上述报名条件的考生，不能进入审核阶段。
      locator: 一、报考条件；五（十六）
      source_ids:
      - tju_phd_school_v18
    materials:
      text: 初审电子材料第2—14项按模板合并PDF≤20MB；含自荐、简历、现实表现、计划、身份证、学历学位/在读及认证、硕士成绩、论文摘要、科研获奖、外语、同等学力和学院要求。登记表初审及缴费后下载，专家推荐书另按要求密封。
      quote: 2. 提交申请材料 提交申请材料说明： 申请材料在初审阶段以 电子版形式 在报名系统中提交。申请人须将下述材料的（ 2 ） - （ 14 ）项按照《天津大学 2027 年报考攻读博士学位研究生申请材料模板》（ 模板 点击 此处 下载 ）格式要求按顺序转化为一个 PDF 文件 上传报名系统（ PDF 命名为：考生姓名 - 报考专业 - 报考导师 - 博士申请材料 ）。证书、证件、成绩单、能力证明材料等上传内容须清晰可见，附件总大小不超过 20MB ，如上传不成功，建议更换浏览器（搜狗高速浏览器）或网络环境等。 申请材料清单如下： （ 1 ）天津大学 2027 年报考攻读博士学位研究生登记表 该表由报名系统生成，通过初审（个人状态为“具备资格”）且缴费成功后，可下载打印；签署本人姓名并完成相应栏目的审批手续，现场确认时提交。 （ 2 ）申请信（ Cover Letter ） 自荐信，无 模板 ，可自行设计。 （ 3 ）个人简历（带照片） 无模板，可自行设计。 （ 4 ）现实表现情况表（ 模板点击此处下载 ） 包括思想政治素质和品德考核。主要内容包括考生的政治态度、思想表现、学习（工作）态度、道德品质、遵纪守法和心理健康等方面的情况。 （ 5 ）报考天津大学博士学位研究生研究计划书 （ 模板点击此处下载 ） 研究计划书应包含拟致力于研究的科学问题、已有基础、基本思路、研究方法以及预期目标等。 （ 6 ）本人有效身份证或军人证 （ 7 ）学历学位证书或在学硕士证明 提供本科阶段、硕士研究生阶段的毕业证书和学位证书；如在国外（境外）高校取得学位的考生，还须提供“教育部留学人员服务中心”的认证证书； 应届硕士毕业生提供《教育部学籍在线验证报告》，可登录中国高等教育学生信息网（学信网） https://www.chsi.com.cn/ 查询申请。 （ 8 ）学历学位证书证明材料 在提供学历学位证书基础上，考生视个人情况提供如下证明材料。 ※持 2002 年前（含）毕业的高等教育学历证书的考生需提供： 《中国高等教育学历认证报告》，可登录中国高等教育学生信息网（学信网） https://www.chsi.com.cn/ 查询申请，具体可参考查阅 本指引 。 ※持 2002 年后毕业的高等教育学历证书的考生需提供： 学信网上查询 《教育部学籍在线验证报告》（应届生身份考生）或《教育部学历证书电子注册备案表》（往届生身份考生）
        。 未能通过学历（学籍）网上校验的考生应提供上述 《中国高等教育学历认证报告》 。 ※硕士阶段仅有硕士学位证书的（单证）考生，应同时提供以下证明： a 硕士学位认证报告，可登录中国高等教育学生信息网（学信网） https://www.chsi.com.cn/ 查询申请； b 本科（含专升本以及自学考试本科学历等）阶段毕业证书的《中国高等教育学历认证报告》或《教育部学历证书电子注册备案表》。 （ 9 ）硕士课程成绩单 需提供硕士阶段的课程成绩单，并加盖 学校 培养单位公章（若为复印件需加盖档案管理部门公章）。 （ 10 ）硕士学位论文摘要 包括硕士论文题目、指导教师、论文摘要和创新性总结。 （ 11 ）代表性的科研成果以及获奖证书 包括代表性的学术论文、申请专利、获得科技奖励以及参与科研项目情况等；所获得的各类与申请博士有关的获奖证书。 （ 12 ）外国语水平证明材料 外国语水平证书、成绩单、留学经历证明等。 （ 13 ）以同等学力身份（见本招生简章一、（二） 3 ）报考的考生 须提供本科成绩单以及硕士课程成绩证明材料 以及 两篇以第一作者身份在报考专业或相近领域公开发表的学术论文（我校认定的核心期刊）。 （ 14 ）报考学院要求的其他材料以及能力证明材料 （ 15 ）《专家推荐书》 须下载空白《专家推荐书》 （ 模板点击此处下载 ） ，按照学院要求请至少两位专家填写推荐理由和意见 （其中一位原则上应为考生的硕士指导教师，其余要求职称应为副教授及以上；签名手写，其他内容手写、打印均可） ，由推荐人在信封封口处骑缝签字。
      locator: 三申请阶段2，清单1—15
