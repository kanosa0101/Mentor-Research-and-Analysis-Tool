    exams:
      text: 外语不单独笔试机考，采用面试；外语20%、基础40%、综合40%，任一环节不足60不录取。考核统一2027春季，具体另发。
      quote: '外国语考核办法：

        不单独设立英语笔试或机考，外国语考核采用面试形式考核，详

        见以下综合考核办法中说明。

        综合考核办法：

        1. 考核方式：包括学术报告、现场抽题、专家提问等多元考核

        方式。重点考查考生的专业基础、综合素质、逻辑思维和创新能力、

        外国语水平等。

        2. 考核环节：包括外语应用能力测试、专业基础测试及专业综

        合测试三个环节。其中外语应用能力测试占20%、专业基础测试及专

        业综合测试各占40%。

        外语应用能力测试主要考察考生的阅读、口语和外语科技写作能

        力。口语主要以对话、专业外语问答等的形式进行；阅读和写作主要

        通过现场阅读、现场外文资料翻译等形式进行。

        专业基础测试以面试的形式考核，考生选择报考学科基础的一个

        选题进行PPT 讲解展示，选题一般为本方向或学科某基础课的一个

        核心章节，专家组根据讲解情况和回答问题情况给出成绩。

        专业综合测试包括科研综合能力测试和综合考察。科研综合能力

        测试主要考察考生科技查新能力、已取得的科研成果情况、未来科研

        工作思路和规划、科研潜力等。并由面试专家对考生的科研情况进行

        综合考察。

        3. 分制：每一个考核环节的满分均为100 分。每位专家根据情

        况对考生进行无记名打分，所有专家的分数取平均值。外语应用能力

        测试、专业基础面试、专业综合面试三个环节中任一环节未达到及格

        线（60 分）的考生均属考核不合格，一概不予录取。

        4. 总成绩的计分办法：总分按照百分制计分。总成绩=外语应用

        能力测试*20%+专业基础测试*40%+专业综合测试*40%

        考核时间：我院考核统一于2027 年春季学期组织，具体安排另

        行公布。'
      locator: PDF第2—4页B审核阶段
