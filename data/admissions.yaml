    dept_page: e839bca2c4b3d23f8d9892c44a49e7d77139e87de72976c10cdf9e9590ed9970
  fields:
    eligibility:
      text: 入围综合考核者须先通过现场资格审查；本办法不适用于工程硕博士培养改革专项，专项须查另一办法。
      quote: 不适用于
      locator: PDF第1页第二节，第2—3页第五节
    materials:
      text: 资格审查时须出示有效居民身份证、学生证并配合核验；这不是完整报名材料清单，其他材料仍需查申请通知。
      quote: 身份证和学生证
      locator: PDF第1页，第二节
    exams:
      text: 现场上机与综合面试；综合成绩权重为上机20%、综合能力面试5%、专业面试75%。
      quote: 上机考试
      locator: PDF第2页，第三节
    timeline:
      text: 资格审查与综合考核的具体时间地点另行通知，需关注申请服务系统邮件和短信；本办法未给出可据此填写的申请截止日期。
      quote: 另行通知
      locator: PDF第1—2页，第二、三节
    contact:
      text: 院系申诉联系方式：010-62783054；jsjxyjsb@mailoa.tsinghua.edu.cn。咨询事项需核对其用途，不能等同导师私人邮箱。
      quote: 电子邮箱
      locator: PDF第3页，第六节
