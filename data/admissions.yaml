        核验 材料及标准 1. 往届毕业生 ①“户籍在陕”考生：须上传本人有效居民户口簿（包括盖有省级公安机关户口专用章、户口登记机关户口专用章的户口簿首页和登载本人户籍信息的“常住人口登记卡”页）；集体户口仅提供个人单页。 ②“户籍不在陕”但“在陕工作”考生：须上传最近3个月的社保或公积金缴费证明。
        2. 学籍学历校验未通过考生 ①应届毕业生：须上传有效期内的《教育部学籍在线验证报告》。在2027年入学前可取得国家承认本科毕业证书的自学考试或网络教育本科考生，还须上传省级高等教育自学考试办公室或就读高校出具的届时毕业证明、成绩证明等材料。
        ②往届毕业生：须上传有效期内的《教育部学历证书电子注册备案表》（2002年以后毕业的往届生）或《中国高等教育学历认证报告》（2002年以前毕业的往届生），以及《教育部学籍在线验证报告》。 ③国（境）外毕业生：须上传经相关专业机构认证的国（境）外教育机构合法学历学位认证书，国（境）外应届生须上传学生证等相关证明。
        ④在读研究生：须上传所在培养单位出具的校级研究生学籍管理部门盖章的“同意报考”的证明。 ⑤姓名或身份证号码变更等个人原因导致无法通过校验的考生：还须上传本人信息变更的证明（记载曾用名和现用名的户口簿或公安机关出具的制式证明）。 3.身份证件系统比对不通过的考生
        对于报考时证件类型为非居民身份证的考生；或者报考时证件类型为居民身份证但身份核验未通过的考生,均须提供身份证原件照片（国徽面和人像面），要求身份证边框完整，字迹清晰可见，且应在有效期内。 4. 报考我校单独考试的考生 须上传所在工作单位同意报考研究生的介绍信、相关领域两名具有高级专业技术职称专家的推荐信、《西北工业大学单独考试硕士研究生报名审批表》（西北工业大学研招网下载）。需经西北工业大学研究生招生办公室审核通过后，方能确定考试资格。
        5. 在陕就读的第二学士学位考生 须上传加盖培养单位公章的在读证明。 6. 其他特殊情况 按照报考点审核意见补充材料。 （五） 审核结果反馈 1.对于材料不符合要求的考生，应根据提示补充提交相关材料，等待再次审核。
