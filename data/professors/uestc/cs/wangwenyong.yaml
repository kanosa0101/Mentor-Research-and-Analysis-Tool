bio_raw: '1984-09至1988-06，北京航空航天大学，计算机系统结构与软件工程，学士

  1988-09至1991-06，电子科技大学，微型计算机研究所，硕士，

  2006-09至2011-06，电子科技大学，信息与通信工程，博士

  1991-3至1994-7，电子科技大学，微机所，助教、讲师

  1994-8至1995-1，国家教委科技司（借调），研究员

  1995-3至2001-2，电子科技大学信息中心，副主任，副教授

  2003-3至2005-9，电子科技大学信息中心（西南地区网络中心）主任

  2006-6至2007-6，电子科技大学信息中心，教授

  2007-7至2009-11，电子科技大学-东莞信息工程研究院，院长

  2009-12至今，电子科技大学计算机学院，教授

  2011-9至今，电子科技大学计算机学院，教授，博士生导师，院学术委员会委员

  2020-6至今，云网超融合四川省工程研究中心，主任'
