bio_raw: '1981年-1984年，俄罗斯新西伯利亚国立大学，本硕连读5年项目。

  1984年-1988年，俄罗斯新西伯利亚国立大学，博士

  1988年至1990年，俄罗斯塔什干大学，助理教授

  1991年-1992年，美国华盛顿大学，交换学者

  1992年-1995年，美国康奈尔大学，访问科学家

  1994年-1995年，美国康奈尔大学，访问助理教授

  1995年-1997年，美国康奈尔大学，H.C.Wang助理教授

  1996年-1997年，日本北陆先端科学技术大学院大学，访问副教授

  1998年9月-1998年10月，美国威斯康星大学，访问副教授

  1999年1月-1999年3月，美国芝加哥大学，访问讲师

  2002年，日本北陆先端科学技术大学院大学，访问教授

  2002年8月-2003年1月，德国海德堡大学，Humboldt Fellow

  2003年9月-2003年12月，美国芝加哥大学，访问教授

  2004年-2021年，新西兰奥克兰大学，教授

  2005年7月-2005年9月，美康奈尔大学，访问教授

  2006年1月-2006年7月，新加坡国立大学，访问研究员

  2007年-2010年，美国康奈尔大学，兼职教授

  2012年8月-2013年8月，新加坡国立大学，访问教授

  2013年8月-2014年1月，日本京都产业大学，访问教授

  2016年-2019年，日本东京大学，客座学者

  2020年1月至今，电子科技大学，教授'
