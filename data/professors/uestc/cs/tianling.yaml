bio_raw: '田玲，女，1981年8月，四川成都人，教授/博导，下一代互联网数据处理技术国家地方联合工程实验室主任。

  2006.03-2010.12，电子科技大学，计算机科学与工程学院，博士

  2003.09-2006.03，电子科技大学，计算机科学与工程学院，硕士

  1999.09-2003.07，电子科技大学，计算机科学与工程学院，学士

  2008.09-2009.05，University of Central Arkansas，USA，访问学者

  2013.01-2013.12，Georgia State University，USA，访问学者

  2017.06-2017.08，University of California, San Diego，USA，访问学者

  2018.08至今，电子科技大学，计算机科学与工程学院，教授、博导

  2006.05 – 2018.07，电子科技大学，计算机科学与工程学院，助教、讲师、副教授'
