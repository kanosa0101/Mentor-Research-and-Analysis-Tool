bio_raw: '1982年-1986年：重庆大学，本科；

  1986年-1989年：西安交通大学，理学硕士，工学硕士；

  1995.年-1998年：重庆大学，工学博士；

  1999.09，中国人民解放军后勤工程学院教授；

  2000.09，中国人民解放军后勤工程学院博士生导师；

  1999年-2000年：香港浸会大学博士后研究员；

  2001.09享受国务院政府特殊津贴；

  2001年-2002年：香港浸会大学访问学者；

  2002.02-2003.02在法国普罗旺斯大学做访问学者；

  2004.05任“2004年国际计算机学术大会”、“第三届国际小波分析应用学术大会”、

  “第二届国际智能体媒介技术学术大会”程序委员会主席；

  2004.09被评为教育部新世纪优秀人才计划获得者；

  2004年-至今：电子科技大学，教授，博士生导师；

  2006.01-2009.12被聘为电子科技大学计算机科学与工程学院、国家示范性软件学院副院长，分管学科建设、学术活动、研究生工作、国际合作与交流；

  2005.11-2006.11在加拿大圭尔夫大学（University of Guelph）做访问学者一年；

  2006.12受聘为加拿大圭尔夫大学（University of Guelph）客座教授（Adjunct Professor）；

  2007.12任国际信息计算与自动化学术大会（2007International Conference on Information Computing and
  Automation）主席；

  2008.09负责的本科生课程《计算机系统与网络空间安全》获四川省精品课程；

  2008.12任IEEE感知计算与智能分析国际学术大会（The IEEE International Conference on Apperceiving Computing
  and Intelligence Analysis 2008）主席；

  2009.10任IEEE感知计算与智能分析国际学术大会（The IEEE International Conference on Apperceiving Computing
  and Intelligence Analysis 2009）主席；

  2010.12任IEEE感知计算与智能分析国际学术大会（The IEEE International Conference on Apperceiving Computing
  and Intelligence Analysis 2009）主席；

  2010.10-2010.12作为“博士生导师短期访问计划”被国家留学基金委作为“高级访问学者”公派到美国华盛顿大学作学术访问，期间还访问了斯坦福大学、哈佛大学、麻省理工学院、耶鲁大学等美国名校；

  2011.04-2011.05访问美国UT Dallas和University of Chicago；

  2012.12任IEEE小波智能体媒介技术与信息处理国际学术会议（The IEEE International Conference on Wavelet Active
  Media Technology and Information Processing 2012）主席；

  2012.05-2012.06访问苏黎世理工大学、日内瓦大学；

  2013.10-2013.11访问美国东北大学、南非开普敦大学；

  2013.12任The 10th IEEE International Computer Conference on Wavelet Active Media
  Technology and Information Processing 2013）国际学术会议主席；

  2014.12任The 11th IEEE International Computer Conference on Wavelet Active Media
  Technology and Information Processing 2014）国际学术会议主席；

  2015.12任The 12th IEEE International Computer Conference on Wavelet Active Media
  Technology and Information Processing 2015）国际学术会议主席；

  2016.12任The 13th IEEE International Computer Conference on Wavelet Active Media
  Technology and Information Processing 2016）国际学术会议主席；

  2017.12任The 14th IEEE International Computer Conference on Wav'
