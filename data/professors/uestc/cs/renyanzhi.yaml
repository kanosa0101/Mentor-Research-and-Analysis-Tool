bio_raw: '2001年-2005年:电子科技大学通信工程本科

  2005年-2008年:电子科技大学通信与信息系统硕士导师：唐友喜教授（二级教授）

  2008.年-2015年:美国斯蒂文斯理工学院博士导师：陈迎迎教授（ACM/IEEE Fellow）

  2015年-2017年:华为美国新泽西研究院 实习工程师、工程师

  2017年5月- 2017年8月:京东成都研究院 高级工程师

  2017年8月- 2019年7月：电子科技大学计算机科学与工程学院 讲师

  2019年8月- 2024年4月：电子科技大学计算机科学与工程学院 副教授

  2024年5月-至今：电子科技大学计算机科学与工程学院 教授'
