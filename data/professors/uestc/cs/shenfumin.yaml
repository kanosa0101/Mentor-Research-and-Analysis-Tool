bio_raw: '2003年-2007年：山东大学数学与应用数学专业本科学习

  2007年-2014年：南京理工大学模式识别与智能系统（国家重点学科）专业博士研究生学习

  2010年-2012年：澳大利亚阿德莱德大学计算机视觉（澳洲排名第一）专业联合培养博士

  2014年-2016年：电子科技大学计算机科学与工程学院担任讲师,从事科研教学工作

  2016年-2017年：电子科技大学计算机科学与工程学院担任副教授,从事科研教学工作

  2017年-至今：电子科技大学计算机科学与工程学院担任“校百人”教授、博导'
