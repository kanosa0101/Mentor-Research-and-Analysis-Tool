bio_raw: '1986年-1990年:浙江大学，计算机应用，本科;

  1994年-1997年:重庆邮电大学，计算机应用，硕士;

  1997年-2001年:韩国仁荷大学(Inha Univ.)，电子计算工学科，博士;

  2000年-2002年:韩国仁荷大学(Inha Univ.)，电子计算工学科，兼职讲师;

  2001年-2003年:韩国GEOMania株式会社附属研究所，责任研究员;

  2003年-至今:电子科技大学(UESTC)计算机学院，副教授;

  2006年9-12月:美国杜克大学(Duke Univ.)计算机学院，访问学者;

  2012年2 - 8月:韩国KAIST电子计算工学科，访问学者；

  2012年-2013年:韩国电子通信研究院(ETRI)大数据研究所，客座研究员;'
