bio_raw: '1982年-1986年:四川大学,本科;

  1986年-1989年:中国科学院系统所,硕士;

  1996年-1999年:四川大学,博士;

  1993年-1995年:中国科学院成都计算机应用研究所,研究助理;

  1996年-1996年:澳门联合国大学国际软件技术研究所,访问学者;

  1997年-2000年:中国科学院成都计算机应用研究所,副研究员;

  1999年-1999年:美国纽约州立大学石溪分校高级信息管理人才培训;

  2000年-2006年:中国科学院成都计算机应用研究所,副所长,研究员,博导;

  2006年-至今:电子科技大学,教授,博导;'
