bio_raw: '研究方向

  具身智能交互感知、视觉导航

  重大装备智能运维、预测性维护

  世界模型预测推理

  荣誉奖励：

  2021年 IEEE Transactions on Industrial Informatics 最佳论文奖（IF 12.3）

  2021年-至今 全球前2%顶尖科学家（World''s Top 2% Scientists）

  2022年 德国洪堡学者、中国科协青年托举人才

  2024年 IJCAI 2024 Runner-up Paper Award、IEEE ARM 2024 Best Paper Award Finalist

  2025年 吴文俊人工智能青年科技奖、IROS 2025 Best Paper Finalist*2、Nokov New Generation Star Project

  2026年 ACM MM 2026 Outstanding Paper Award

  工作经历

  2024 - 至今    上海交通大学 自动化系  长聘教轨副教授

  2019 - 2024    天津大学 人工智能学院  长聘/英才副教授

  2017 - 2019    卡耐基梅隆大学 计算机科学学院 联合培养博士/博士后研究员

  2009 - 2019    西安交通大学 机械工程  本硕博连读

  科研项目

  主持 国自然面上项目 开放环境连续视觉语言导航及其自主进化研究

  主持 国自然青年项目 小样本下动态图网络的鲁棒学习研究

  主持 天津市应用基础研究项目 知识与数据联合驱动的可解释图神经网络研究

  主持 青年人才托举工程 机器学习

