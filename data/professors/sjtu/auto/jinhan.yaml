bio_raw: '研究方向

  疾病无创早筛技术与仪器；智能传感器与仪器。

  工作经历

  2020年至今 上海交通大学自动化与感知学院

  教育背景

  2009年于中国科学技术大学获CSC国家奖学金赴海外攻读博士学位；

  2012年于日本九州大学产学研中心获工学博士学位（商用气体传感研发方向），之后于以色列理工学院从事博士后研究 (呼气式疾病早筛技术与传感器)

  教学工作

  《

  智能传感技术

  》、《学术论文写作》

  科研项目

  已先后主持相关研究方向国家重大仪器研制项目课题、国家高层次青年人才项目、国家自然科学基金面上、香港Incu-Tech项目、上海市一带一路等项目。

  研究成果

  回国工作期间已以第一作者或第一通讯作者身份在Cell Biomaterials、Cell Reports Physical Science、ACS Nano、Advced
  Science、Nano Letters、Nano-Micro Letters、Chemical Engineering Journal、Rare Metals、ACS
  Sensors、Nano Research 等期刊发表论文八十余篇；授权美国等国内外专利14件；成果被人民日报、新华网、解放日报等主流媒体报道。

  荣誉奖励

  2026年入选英国皇家生物学会Fellow （Royal Society of Biology Fellow，FRSB）；

  2025年中国仪器仪表学会技术发明二等奖（

  1/6）；

  2025年军民两用技术创新应用大赛金奖

  （

  1/5）；

  2025年

  国际功能材料协会Scientist Medal

  （个人）

  ；

  2024年光学工程学会德阳传感技术与成果展优秀成果；

  2024年上海市优秀发明奖（1/10）；

  2023年获产学合作创新奖（个人）；

  2022年获中国发明协会发明创新成果奖一等奖（1/6）；

  2022年获中国传感器创新创业大赛特等奖；

  2021年获全国发明展会发明创业奖项目奖银奖（1/3）；

  2021年获中国发明协会发明创业奖创新奖二等奖（1/6）；

  2021年获国际功能材料协会（IAAM）青年科学家奖（IAAM Young Scientist Medal）。

  学术任职

  英国皇家生物学会Fellow

  （

  FRSB）;

  中国智能传感功能材料与器件学会常务委员；

  中国医工交叉协会专业委员；

  Chinese Chemical Letters（中科院大类一区，IF：9.5）期刊编委；

  香港Qi Diagnostics Ltd首席研发顾问。'
