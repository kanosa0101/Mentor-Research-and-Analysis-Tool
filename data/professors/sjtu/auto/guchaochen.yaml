bio_raw: '研究方向

  （1）精密仪器与复杂光机电系统

  （2）视觉感知与机器人自主控制

  （3）运动控制与高性能伺服系统

  招生要求：

  1. 控制工程、机械工程、电子工程等专业背景；

  2. 专业基础扎实、实践能力强、理论联系实际；

  3. 有情怀，志于科学技术进步、民族工业发展。

  博士后招聘：（ 2-3名）

  1.  国内外知名高校毕业，

  在相关研究方向具有长期研究积累；

  2.  具有

  复杂工程问题的理论分析和架构能力、

  实操落地经验。

