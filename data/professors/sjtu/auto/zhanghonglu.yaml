bio_raw: '研究方向

  生物界面感知与分析；生物测量与信息存储；人工智能+

  工作经历

  2023年至今       长聘教轨副教授，上海交通大学自动化与感知学院/化学生物协同物质创制全国重点实验室

  2020–2023年    准聘教授，华南理工大学生物医学科学与工程学院

  2016–2020年   助理研究员，加州伯克利大学/HHMI, 合作导师：Carlos Bustamante（美国科学院院士）

  2014–2016年    博士后，中科院上海应用物理所/加州伯克利大学，合作导师：樊春海/Carlos Bustamante

  教育背景

  2009–2014年    理学博士，中国科学院大学，导师：樊春海

  2005–2009年    理学学士，福州大学，国家理科基地班

  教学工作

  承担本科生与研究生课程：

  《科学仪器原理与应用》

  《计量学》

  《生物微纳加工与器件》

  《生物医学综合实验》

  科研项目

  主持或参与国家自然科学基金面上项目两项、上海市科委首批概念验证项目、科技部重点研发计划青年项目、医工交叉及其他省市级科研项目等。

  研究成果

  目前已发表SCI论文30余篇，包括以第一或通讯作者在Science Advances、Nature Communications（3篇）、PNAS、Matter、Nature
  Protocols（3篇）、JACS等高水平学术期刊。申请国内外发明专利20余项，已授权专利7项，软件著作权2项。

