  荣誉奖励

  广东省珠江青年拔尖人才计划、广州市高层次人才计划、中央高校经费校级杰出青年等。

  学术任职

  担任中国分析测试协会核酸分析分会委员、全国专业标准化分技术委员会委员、中国仪器仪表学会高级会员、中国生物工程学会终身会员、

