bio_raw: '研究方向

  预测控制，复杂系统优化与控制

  工作经历

  2020年7月-2024年4月，上海交通大学自动化系，博士后

  2024年5月-至今，上海交通大学自动化系，助理研究员

  科研项目

  1. 国家自然科学基金青年科学基金项目，分段仿射系统的分布式模型预测控制研究，在研，主持。

  2. 中国博士后科学基金第69批面上资助，混杂系统的强化学习分布式模型预测控制研究，结题，主持。

  3. 横向项目，数字孪生行为与规则模型开发，在研，主持。

  4. 国家自然科学基金重点项目，车联网环境下复杂混合交通系统优化调控理论与关键技术，在研，参与。

  5. 国家自然科学基金国际（地区）合作与交流项目，实时数据驱动的多阶段批次过程协同优化控制设计与应用研究，在研，参与。'
