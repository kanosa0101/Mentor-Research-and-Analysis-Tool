  教育背景

  何建平

  ，现为上海交通大学自动化与感知学院教授，博士生导师，入选2018年国家青年特聘专家。2009年至2013年在浙江大学攻读工学博士学位，师从中国工程院院士孙优贤教授；2014年至2017年期间在加拿大维多利亚大学从事博士后研究工作，合作导师为加拿大工程院院士Lin
  Cai教授。2017年加入上海交通大学自动化系，2019-2022年曾任上海交通大学自动化系系副主任。

  担任旗舰期刊IEEE Trans. Control of Network Systems,、IEEE Trans. Vehicular Technology等4本SCI期刊编委，曾任IEEE
  Trans. Automatic Control、IEEE Tran. Industrial Informatics等期刊客座编委。担任中国自动化学会信息物理系统控制与决策专委会委员、中国指挥与控制学会集群智能与协同控制专委会委员、上海市自动化学会理事等职务。担任2026全球国际水下机器人大赛中国大陆区域赛主席。近五年来发表Automatica/IEEE汇刊论文50余篇，谷歌学术引用5200余次，H因子42。主持科技部国际合作重点、国家自然科学基金委面上、腾讯犀牛鸟、华为无线资源优化、福龙马草坪机器人等项目。

  曾获2025浙江省自然科学一等奖、2024中国自动化学会自然科学一等奖、2018教育部自然科学一等奖等奖励，10余篇论文获最佳会议论文奖/最佳学生论文奖及提名奖。其指导/协助指导的多名学生获国家级人才项目资助；获中国自动化学会优秀博士学位论文；获国家自然科学基金博士生和青年学生项目；获国家奖学金、交大学术之星、交大优博等荣誉。毕业学生在ETH、Oxford、KTH等名校深造，部分毕业学生已在交大、浙大、福大等著名大学任教职。

