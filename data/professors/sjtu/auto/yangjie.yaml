  研究成果

  已承担国家和省部级30多项科研项目。7项成果获省部级成果奖，已授权发明专利40多项。入选教育部“跨世纪优秀人才培养计划”、上海市 “曙光优秀学者”“曙光跟踪计划”。担任6个期刊编委（其中2个SCI期刊）。在国内外出版专著5部，在国内外学术期刊和会议上发表论文400多篇，其中300多篇被SCI检索，谷歌引用超过27000次，H-index 85。担任20多个国际会议的大会主席、组委会主席、分会议主席。在国际著名大学或会议做特邀报告超过10次。指导的博士论文4次获全国优秀博士论文。培养的博士8人次获国家级高层次人才，10多人获聘教授。10多人担任企业首席科学家或技术高管。

  荣誉奖励

  1、2020年“高维复杂模式识别的特征选择和降维及半监督学习研究”获上海市自然科学奖二等奖。杨杰是该奖项的第一位获奖者。

  2、2014年“高维海量数据模式识别关键技术研究与应用”获教育部自然科学奖二等奖。杨杰是该奖项的第一位获奖者。

  3、“图像特征点定位配准技术及其应用”获2010年上海市政府科技发明二等奖。杨杰是该奖项的第一位获奖者。

  4、《机器学习理论及其应用》获2008年上海市政府自然科学奖三等奖。杨杰是该奖项的第一位获奖者。

  5、“现场场景匹配算法及其应用”获2004年上海市政府科技进步二等奖。杨杰是该奖项的第一位获奖者。

  6、“分层截骨及图像叠加技术在复杂颅面畸形矫正中的应用”获2003年上海市政府科技进步二等奖。杨杰是该奖项的第二位获奖者。

  7、2001年，“冶金化工行业建模、优化与故障诊断的数据挖掘技术”获教育部科技进步二等奖。杨杰是该奖项的第一位获奖者。

  8、“家庭远程医疗监测咨询智能系统”获2001年上海市知识产权局技术发明大赛一等奖。杨杰是该奖项的第一位获奖者。'
