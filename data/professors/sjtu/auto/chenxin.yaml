bio_raw: '研究方向

  AI+PNT；GNSS信号处理技术；导航安全与对抗；电磁信号大模型及应用

  课题组长期招收：博士生、硕士生（含中电科联培）

  工作经历

  2026/01 – 至今，上海交通大学自动化与感知学院，教授

  2017/01 –

  2025/12，上海交通大学电子信息与电气工程学院，副教授

  2013/05 – 2016/12，上海交通大学电子信息与电气工程学院，讲师

  教育背景

  意大利都灵理工大学，电子与通信工程专业，博士

  美国迈阿密大学，电子与电气工程系，博士访问交流

  教学工作

  承担《数字电子技术》、《定位导航》本科课程教学

  [3] 指导学生获得

  第十三届（2022）中国卫星导航年会青年优秀论文：

  基于先验误差补偿的陷阱式 GNSS/INS 组合导航目标欺骗算法

  [2] 指导学生获得

  第十二届（2021）中国卫星导航年会青年优秀论文：

  基于捕获函数和自动增益控制联合的欺骗检测技术

  [1] 指导学生获得

  第十一届（2020）中国卫星导航年会青年优秀论文：

  基于电磁指纹的 GNSS 干扰源智能识别技术

  科研项目

  中国移动产学研合作项目，卫星导航欺骗干扰智能检测识别技术，2026-06至2026-12，主持。

  国家自然科学基金面上项目，2026-01至2029-12，主持。

  上海市协同创新重点项目，导航对抗场景下高精度导航定位关键技术研究，2025-01至2026-12，课题负责人。

  上海交通大学深蓝计划重点基金，基于航运AIS大数据的海洋卫星导航电磁环境监测及干扰源定位技术研究，2024-01至2026.12，主持。

  智能空间信息国家级重点实验室开放基金，航运AIS数据近实时GNSS干扰监测方法研究，2024-01至2025-06，主持。

  广东电网电力科学研究院，北斗卫星导航信号安全防护技术研究, 2022-3至2024-8，主持。

  国家电网公司总部科技项目，北斗系统的电力物联网应用研究，2019-10至2020-12，主持。

  科技部重点研发项目课题，GNSS干扰识别技术研究，2018-05至2021-04，主持。

  全国北斗卫星导航标准制修订项目，北斗卫星导航系统采集回放仪性能要求及测试方法，2018-01至2019-12，主持。

  国家自然科学基金面上项目，基于多状态约束的惯性/里程计信息融合方法研究，2017/01-2020/12，参与。

  上海市科技创新行动计划项目，GNSS软件无线电中频原数据格式国际标准，2016/08-2019/07，主持。

  国家自然科学基金青年项目，面向北斗B1信号利用阵列天线抑制极近多径的算法研究，2014-01至2016-12，主持。

  中兴通讯产学研合作项目，支持A-Beidou协议的验证与测试方法研究，2013/11至2014/11，主持。

  研究成果

  一直从事卫星导航领域信号处理算法研究，现为IEEE高级会员，ION会员，曾担任ION GNSS+、ION Pacific PNT等国际会议分论坛主席。主持国家自然科学基金企业联合重点项目、面上项目、国家重点研发计划课题、上海市联合创新项目、上海交通大学深蓝计划重点基金、企业产学研等项目30余项。在IEEE
  J. Sel. Areas Commun., IEEE Trans. Wireless Commun., IEEE Trans. Aerosp. Electron.
  Syst., SATNAV等国际知名期刊发表文章20余篇，ESI高被引论文1篇，授权发明专利10余项，撰写英文著作1部，牵头制定国家标准1项。

  获评上海市东方英才青年人才，江苏省333高层次人才计划。

