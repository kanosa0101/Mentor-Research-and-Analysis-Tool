bio_raw: '研究方向

  惯性导航技术;检测技术

  工作经历

  本人最高学历为博士研究生。自2002年3月起一直在上海交通大学仪器科学与工程系工作，先后被聘任为助教、助研和高级实验师。

  科研项目

  1.《检测技术》国家一流课程建设，2020年批准，排名4

  2.“自制相关测速实验设备的升级改造”，2019年度上海交通大学决策咨询课题，2019-2021

  3.“用于聚焦超声热疗过程实时监测的电阻抗技术研究”，国家自然科学基金面上项目，2014-2017，排名2

  荣誉奖励

  曾获上海交通大学教学成果一等奖、招生工作先进个人、实验室先进工作者以及上海市惯性技术学会工作积极分子等荣誉称号。'
