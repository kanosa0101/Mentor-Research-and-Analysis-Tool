bio_raw: '研究方向

  罗骋韬博士针对传感器、换能器、滤波器等压电器件中的关键敏感元材料-铁电材料研发中的关键科学问题进行了深入系统的研究。罗骋韬博士的研究结果为无铅铁电材料尽早取代目前主流的铅基铁电材料，为新铁电材料的制备、以及增强已有铁电材料的压电性能指明了发展方向，并为发展新一代高性能压电器件奠定了坚实的基础。

  目前，罗骋韬博士的工作在开展畴工程技术提高单晶材料性能的同时，还在和研究团队成员一起研究大幅度提高压电换能器的灵敏度、频率带宽、电声效率、能量密度、降低其体积重量的应用实践。目前，
  罗骋韬博士已经获得了国家自然科学基金青年基金项目、 上海市扬帆计划项目以及上海海外领军人才支持。在大功率压电换能器方向正在与中山大学、清华大学、 中国科学院上海硅酸盐研究所等研究团队合作参与一项国家重点研发计划项目。同时，
  罗骋韬博士也正在与南方电网等企业开展基于高性能弛豫铁电单晶材料的传感器科研合作项目。

  工作经历

  罗骋韬,长聘教轨副教授,2011年复旦大学材料物理专业本科毕业,2016年获得美国弗吉尼亚理工大学材料科学与工程专业博士学位（铁电压电物理方向,导师Dwight
  Viehland教授）,期间参与美国橡树岭国家实验室联合培养项目,于美国橡树岭国家实验室和美国阿贡国家实验室进行了近两年的研究工作（无铅压电材料方向,导师Olivier
  Delaire教授）。2017年于北卡罗莱纳州立大学机械与航天系从事博士后研究（针对超声换能器的材料优化方向,导师Xiaoning Jiang教授）。2020年加入上海交通大学电子信息与电气工程学院仪器科学与工程系。

