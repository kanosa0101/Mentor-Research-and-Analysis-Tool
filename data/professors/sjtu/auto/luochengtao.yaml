  科研项目

  已经获得上海市2021年度“科技创新行动计划”扬帆计划项目和1项国防科技创新特区项目的支持,同时也正在积极申请及参与其它国家及企业科研合作项目。

  研究成果

  自攻读博士学位以来,罗骋韬博士针对传感器、换能器、滤波器等压电器件中的关键敏感元材料-铁电材料研发中的关键科学问题：

  1）如何由机理出发,发展高性能、绿色无铅铁电材料;

  2）如何大幅提高现有铁电材料的压电响应、发展新一代高性能压电器件,进行了深入系统的研究。罗骋韬博士的研究结果为无铅铁电材料尽早取代目前主流的铅基铁电材料,为新铁电材料的制备、以及增强已有铁电材料的压电性能指明了发展方向,并为发展新一代高性能压电器件奠定了坚实的基础。

  罗骋韬博士已在SCI英文期刊上发表学术论文19篇（第一或共同第一作者9篇）,论文已被SCI引用233次（排除自引）,H因子9,在国际学术会议、著名的学校和研究所作演讲报告10次,并参与多项美国DOE,ONR项目,在国际前沿研究领域-先进无铅压电材料、压电单晶结构和性能研究方面积累了丰富的经验。'
