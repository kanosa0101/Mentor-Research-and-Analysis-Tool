bio_raw: '研究方向

  无人机无人船机器人控制、故障诊断与容错控制、多传感器融合、组合导航、目标检测、同步定位与建图

  工作经历

  2012年6月在上海交通大学电子信息与电气工程学院博士后出站并留校任教;

  教育背景

  2004年4月获西安交通大学测试计量及仪器硕士学位;

  2009年12月获上海交通大学控制理论与控制工程博士学位;

  科研项目

  1.测绘无人机研发，2014/07-2015/06，40万，主持

  2.核安全级仪控系统软件可靠性及验证和确认技术研究，2014/10-2015/06，15万，主持

  3.安全级优选控制机箱测试及优化，2014/11-2015/06，168万，主持

  4.基于扩频融合信号的异步水声定位研究，2015/01-2018/12，83万元，主持

  5.安全级优选控制机箱改造，2015/09-2015/12，99.3万，主持

  6.多技术融合的多旋翼无人机系统应用技术研究（3标段），2015/09-2016/12， 225万，主持

  7.月球着陆地面飞行演示验证平台， 2018/08-2018/12，60万，主持

  8.无人机防雷电能力研究，2020/5-2022/5，45万，主持

  9.胃肠镜麻醉机器人研制，2020/12-2022/12，15万，合作

  研究成果

  Zhu C， Zhao J， Wang H， et al. Stereovision-based initial pose estimation relative
  to non-cooperative space targetJ. IET Radar， Sonar & Navigation， 2020， 14(7): 973-980.

  王红雨， 尹午荣， 汪梁， 等. 基于 HSV 颜色空间的快速边缘提取算法J. 上海交通大学学报， 2019， 53(7): 765-772.

  王红雨， 汪梁， 尹午荣， 等. 结合目标检测的多尺度相关滤波视觉跟踪算法J. 光学学报， 2019， 39(1): 0115004.

  Wang H， Zhao X， Bai H， et al. Design of a Symmetrical Quad-rotor Biplane Tail-Sitter
  Aircraft without Control Surfaces and Experimental VerificationC//MATEC Web of Conferences.
  EDP Sciences， 2018， 151: 04009.

  Bai H， Wang H Y， Shao S H. Fault detection and isolation for a quadrotor via unknown
  input observerJ. Journal of Chinese Inertial Technology， 2013， 21(1): 125-130.

  荣誉奖励

  四旋翼飞行器建模及位置跟踪控制（英文）获得中国科协技术协会精品科技期刊工程项目二等奖;

  倾转机身式混合多态无人机获得第十四届挑战杯上海市大学生课外科技作品竞赛一等奖（指导老师）

  多态飞行器获得中航工业杯第三届国际无人飞行器创新大奖赛创意赛优秀奖

  学术任职

  《无人机》编委'
