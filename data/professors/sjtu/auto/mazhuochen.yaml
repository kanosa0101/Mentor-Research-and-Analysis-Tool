bio_raw: '研究方向

  微型医疗机器人；微纳机器人导航规划控制；微纳操作

  欢迎自动化、人工智能、机械电子、仪器等方向的优秀同学加盟！

  工作经历

  2021年 至今      上海交通大学，自动化与感知学院/医疗机器人研究院，长聘教轨副教授

  2018年-2020年    博士后，清华大学，精仪系

  教育背景

  2010年-2016年    博士，吉林大学，电子科学与工程学院

  2006年-2010年    本科，吉林大学，电子科学与工程学院

  科研项目

  作为负责人主持如下项目：

  1.  国家自然科学基金面上项目（在研）

  2.  国家自然科学基金青年科学基金项目（在研）

  3.  上海市面上项目（在研）

  4.  机器人技术与系统国家重点实验室开放课题（在研）

  5.  机器人学国家重点实验室开放课题（在研）

  6.  博士后面上一等项目（已结题）

  7.  博士后特别资助项目（已结题）

  作为骨干参与如下项目：

  8.  国家重点研发计划智能机器人专项-医工交叉新概念机器人（在研）

  9.  教育部联合基金重点项目（在研）

  10.上海市重大专项（在研）

  11.国自然国际合作与交流项目（在研）

