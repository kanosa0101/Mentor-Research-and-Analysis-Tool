bio_raw: '研究方向

  学术研究主要集中在人机环智能系统理论与工程、航空人为因素、模式识别、精密测量等领域。

  工作经历

  于2006年12月起加入上海交通大学航空航天学院，现为上海交大电信学院自动化系教授，人机环智能系统研究所主任。在此之前，任英国Cranfield University
  工程学院高级讲师和图像处理实验室主任。

  现任国际期刊《Journal of Strain Analysis for Engineering Design》、《Journal of Aviation Psychology
  and Applied Human Factors》、《SAGE Open Engineering》编委。

  教育背景

  傅山出生于1964年8月。1985年西北工业工大航空电子工程专业本科毕业。1995年在英国Heriot-Watt University 获Ph.D.学位。

  教学工作

  现主要讲授的课程有通识核心课程“工程心理学”、本科生专业课“航空人为因素与飞行安全”、研究生专业课“人机工效与人为因素”和“民用飞机适航管理与符合性验证技术概论”。

  科研项目

  在英国期间曾负责多项欧共体、英国国家级科研项目，并承担过多项工业应用科研项目。加入上海交通大学以来，已承担多项国家级和省部级项目，所有项目紧密服务于国家重大工程项目，包括ARJ21和C919民机型号及预研型号任务。主持的代表性项目包括国家“973”项目课题：“民用飞机驾驶舱人机工效综合评估理论与方法”、重大专项课题：“C919大型客机人为因素适航要求和符合性验证方法研究”、民机型号研制项目“ARJ21-700驾驶舱人为因素适航符合性验证”。

  研究成果

  开创以“人在环复杂系统理论”为基础的“航空人为因素”研究领域，在国内外同行中独树一帜，相对于以传统工程心理学为基础的人为因素研究，在定量分析、实时监测、系统预测等方面都有着较为明显的优势。自主开发的实验平台及相关实验系统与技术已成为国内行业样板。成为国内在该领域首个承担型号适航审定任务的高校科研团队，确立了在国内高校中的领先地位。'
