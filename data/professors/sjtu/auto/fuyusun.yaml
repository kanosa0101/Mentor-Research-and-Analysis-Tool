title: 助理研究员
email: fu_yusun@sina.com
bio_raw: '研究方向

  1）工业通信与信息系统，特别是无速率编码理论、方法及应用

  2）工业互联网与安全，特别是可信计算与后量子密码理论及应用

  工作经历

  2020-至今，上海交通大学，电子信息与电气工程学院/自动化与感知学院

  2001-2019年，华为技术有限公司，无线产品线

  教育背景

  2001年获上海交通大学控制理论与控制工程专业博士学位。

  科研项目

  近年主持/主研的代表性科研项目

  ：

  [1] 极不可靠无线环境下监控系统的音视频同步传输方案研究，企业项目（2025.12-2026.11）

  [2] 支持多协议的跨平台、工业软件可信链接及API工具，国家重点研发计划项目课题（2019YFB1705703，2019.12-2022.11）

  [3]

  面向工业场景的无速率编码技术研究，企业项目（2024.1-2024.12）

  [4]

  无速率编码在物联网中的应用研究，企业项目（2022.12-2024.1）

  [5]

  安全可信的新型工业控制器体系关键技术研究及应用示范，宁波市重点研发计划项目（2024Z111， 2024.2-2027.1）

  [6]

  属性基加密理论及在工业互联网安全中的应用研究，企业项目（2022.7-2023.6）

  [7] 城市水务工控网络系统安全防护体系关键技术研究及应用示范，宁波市重点研发计划项目（2021Z022， 2021.7-2023.6）

  [8] 电力5G业务应用安全评估技术研究与应用，企业项目（2021.10-2023.9）

  [9] 基于人工智能的工控安全创新技术研究与开发，企业项目（2024.8-2025.6）

  [10] 城市智能交通网络安全防护，企业项目（2019.7-2021.6）

  研究成果

  1）论文与专利方面

  ：

  在国内外重要刊物和会议上发表论文80多篇，申请US/WO/CN国内外专利60多件，已授权30多件，其中2项专利与国际标准有关。近年以第一作者或通信作者发表的代表性论文如下：

  [1] Z. Wang,

  Y. Fu

  and W. Yan. Latency-Bounded Reliability Oriented Rateless Codes for Multi-Connectivity
  Networks Toward URLLC: A Knowledge-Guided RL Framework and Algorithm Design. IEEE
  Internet of Things Journal, Early Access, doi: 10.1109/JIOT.2026.3739417.

  [2] W. Chen,

  Y. Fu

  , Z. Wang and X. Lin. Privacy-Preserving Attribute-Based Bilateral Access Control
  with Zero-Knowledge Pre-Verification for IIoT. IEEE Internet of Things Journal.
  IEEE Internet of Things Journal, vol. 13, no. 19, pp. 45151-45169, 2026.

  [3] H. Huang,

  Y. Fu

  and J. Yin. Latency-Reliability Trade-off for Timeliness and Accuracy of Dynamic
  Systems Using Rateless Codes. IEEE Internet of Things Journal, vol. 13, no. 5, pp.
  8398-8412, 2026.

  [4] X. Lin,

  Y. Fu

  , Z. Wang and J. Yin. A Code-based Anonymous Authentication Scheme for Vehicular
  Ad Hoc Networks. IEEE Internet of Things Journal, vol. 12, no. 24, pp. 55708-55724,
  2025.

  [5] Z. Wang,

  Y. Fu

  and X. Lin. An Attribute-Based Encryption Cross-Domain Data Sharing Scheme Based
  on RLWE for IoT-Enabled Consumer Electronics. IEEE Transactions on Consumer Electronics,
  vol. 71, no. 4, pp. 9301-9314, 2025.

  [6] Z. Wang,

  Y. Fu

  and H. Huang. Latency-Bounded Reliability-Oriented Degree Distribution of Rateless
  Codes: A Knowledge-Assisted Reinforcement Learning Method. IEEE Communications Letters,
  vol. 29, no. 10, pp. 2366-2370, 2025.

  [7] H. Huang, J. Yin,

  Y. Fu

  and Z. Wang. Ripple-Oriented Degree Distribution of Rateless Codes: A Backward Design
  Approach for Finite Block Lengths. IEEE Transactions on Vehicular Technology, vol.
  74, no. 11, pp. 17304-17320, 2025.

  [8] Z. Wang,

  Y. Fu

  and X. Lin. Attribute-Based Bilateral Access Control with Sanitization and Trust
  Management for IIoT. IEEE Internet of Things Journal, vol. 12, no. 8, pp. 10818-10833,
  2025.

  [9] J. Yin,

  Y. Fu

  , J. Tang and H. Huang. Optimized Degree Distribution of Rateless Codes with Lower
  Complexity. IEEE Communications Letters, vol. 28, no. 3, pp. 458-462, 2024.

  [10] Z. Wang and

  Y. Fu

  . A Unified Attribute-Based Encryption Data Sharing Scheme Matching Industrial Internet
  Framework. IEEE Internet of Things Journal, vol. 11, no. 5, pp. 9153-9170, 2024.

  [11] Y. Yu, Q. Lu and

  Y. Fu

  . Dynamic Trust Management for the Edge Devices in Industrial Internet. IEEE Internet
  of Things Journal, vol. 11, no. 10, pp. 18410-18420, 2024.

  [12] M. Yuan, Y. Qiao,

  Y. Fu

  and J. Tang. Fountain Codes for Reliable and Deterministic Packet Transmission in
  Industrial Cloud Control Systems. IEEE Internet of Things Journal, vol. 10, no.
  8, pp. 7114-7125, 2023.

  [13] Y. Qiao,

  Y. Fu

  and M. Yuan. Communication–Control Co-Design in Wireless Networks: A Cloud Control
  AGV Example. IEEE Internet of Things Journal, vol. 10, no. 3, pp. 2346-2359, 2023.

  [14]

  伏玉笋

  , 杨根科. 无线超可靠低时延通信：关键设计分析与挑战. 通信学报, 2020, 41(08): 187-203.

  [15]

  伏玉笋

  , 杨根科. 人工智能在移动通信中的应用：挑战与实践. 通信学报, 2020, 41(09): 190-201.

  2）产业化方面

  ：

  2001-2019年期间，先后从事3G/4G/5G无线通信系统理论及关键技术研究与产品化的研发工作，其成果被广泛应用于3G/4G/5G无线网络，为华为无线产品的性能竞争力从追赶到超越业界，最终持续全球领先做出了突出贡献。

  学术任职

  IEEE ICC、IEEE WCNC、IEEE PIMRC等的TPC member。'
