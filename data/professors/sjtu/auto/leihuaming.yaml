bio_raw: '研究方向

  研究方向：电磁与智能传感

  电磁探测与传感：电磁探测；微弱磁场、电场测量；无线供能；海洋电磁技术。

  智能无损检测与系统：涡流检测；漏磁检测；电磁超声/声学检测。

  微弱信号检测：微弱信号检测与仪器，低噪声设计。

  工作经历

  2025-               上海交通大学  自动化与感知学院

  2005-2025       上海交通大学  电子信息与电气工程学院  仪器科学与工程系

  --2012.01-2012.07  英国 Newcastle University 访问学者

  --2014.08-2015.08  江苏常熟高新区科技局 副局长（挂职）

  教育背景

  2001-2005  上海交通大学  仪器科学与技术（博士）

  1998-2001  华北工学院（现中北大学）测试计量技术及仪器（硕士）

  1994-1998

  华北工学院（现中北大学）检测技术及仪器仪表（学士）

  教学工作

  本科生课程：

  《电子测量技术与仪器》、《测试与控制电路》、《工程实践与科技创新I》等

  研究生课程：

  《微弱信号检测》、《声学检测》等

  科研项目

  部分代表性项目：

  1. 中船重工集团科技攻关项目，2024-2026，48万元

  2. 泡沫式管道涡流内检测器原理样机研制，企业纵向，2022-2024，45万元

  3. 适应复杂环境的高精度非接触位移传感器技术研究（参与），重点研发计划，2022-2024，375万元

  4. 某部委科技攻关项目，2019-2021，58万

  5. 气体泄漏检测仪研发，企业纵向，2018-2022，60万元

  6. 任务4：骨外科手术导航探测器，重点研发计划子任务，2015-2017，13万元

  7. 超声信号稀疏分量压缩及其硬件实现，国家自然科学基金项目，2008。

  荣誉奖励

  2025，中国造船工程学会科学技术奖，特等奖，排名25

  2025，

  上海交通大学2025年本科招生工作先进个人

  2025，

  2025年TI杯全国大学生电子设计竞赛，优秀指导教师

  2024，

  上海高校市级一流本科课程，成员

  2023，

  《电子测量与仪器学报2022年度优秀论文》，指导教师'
