  【部分发明专利】

  1.  多维度去交错后的TOA差分统计雷达信号分选方法

  2. 一种基于三元组网络的多功能雷达信号分选方法

  3. 基于增量学习融合网络的多功能雷达行为辨识方法及装置

  4. 一种多基线相位干涉仪虚拟相线边界折叠处理方法及系统

  5. 基于正确解模糊概率优化的宽带相位干涉仪阵型设计方法

  6. 一种非规则共形阵列辐射源测向与极化波束合成方法

  7.  脉冲多普勒雷达多批次假目标模拟方法及装置

  8. 基于FPGA的可重构雷达目标/干扰模拟器及实现方法

  9.  超宽带雷达目标回波信号模拟方法及模拟器

  10. 机载雷达非均匀杂波高精度快速仿真方法与杂波模拟装置

  多项关键技术已在某干扰对抗系统、某侦察处理系统、某自适应信号处理系统和某电磁环境模拟等系统中取得重要应用。相关科研成果获省部级科技进步奖2项

  。

