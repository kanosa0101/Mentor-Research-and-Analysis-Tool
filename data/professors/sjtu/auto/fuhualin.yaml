bio_raw: '研究方向

  胃癌病理学,老年痴呆症病理学

  教育背景

  1999-2006 美国南加州大学生化与分子生物学专业博士

  2007-2009 美国加州大学洛杉矶分校Larry Hillblom胰岛研究中心博士后

  研究成果

  研究成果：1，发现TET1通过p53-EZH2通路发挥抑制胃癌发生的信号途径；指出胃癌发生发展过程中有持续性的中性粒细胞侵染。

  2，揭示老年痴呆症老年斑形成来源于微动脉瘤破裂和血液泄漏，而并非国际上流行多年的淀粉样蛋白级联假说认为的是来自于死亡神经细胞。

  3，证明Aβ自聚体及异聚体可以产生独特的蓝色自发荧光，指出蓝色自发荧光是老年痴呆症血液、血管及脑组织老年斑淀粉样变化的优良标志。

