title: 特聘教授
email: hbshen@sjtu.edu.cn
bio_raw: '研究方向

  主要从事人工智能、模式识别与生物信息学的教学与研究工作，

  曾获国家杰出青年科学基金、万人计划青年拔尖人才等资助，致远学院工科荣誉计划项目主任、中国人工智能学会生物信息学与人工生命专业委员会副主任，曾担任中国科学信息科学青年编委、

  Genome Biology

  客座编委，带领团队构建的生物信息在线计算平台被广泛使用超过

  1

  千万次，理论计算结果被生物实验大量验证。曾主持项目获得上海市自然科学一等奖、上海市青年科技杰出贡献奖、入围首届世界人工智能大会创新大赛SAIL 奖榜单，获得霍英东教育基金会青年教师奖，

  指导毕业的研究生入选国家级青年人才、

  上海交通大学优秀博士学位论文、

  上海市优秀研究生学位论文等多人。'
