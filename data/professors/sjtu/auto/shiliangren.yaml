title: 高级工程师
email: leonsong@sjtu.edu.cn
bio_raw: '研究方向

  多智能体协同控制、饱和非线性控制、移动机器人、智能环境感知等。论文发表20余篇。

  教育背景

  2018年于上海交通大学自动化系获得博士学位。

  教学工作

  主讲课程：离散数学、工程实践与科技创新Ⅰ、工程实践与科技创新Ⅱ、智能车感知与控制实践。

  科研项目

  主持纵向科研项目：

  1.国家自然科学基金青年基金；

  2.科技部国家重点研发计划子课题等。

  参与纵向科研项目：

  1.国家重点研发计划青年科学家项目；

  2.山东省重点研发计划重大创新工程，车路协同技术的智能交通服务平台建设与产业化应用。

  研究成果

  授权专利2项，软件著作权5项。

  荣誉奖励

  中国高校教师机器人教学创新大赛-二等奖

  指导学生参加：

  第十八届“挑战杯”全国大学生课外学术科技作品竞赛2024年度“揭榜挂帅”专项赛-一等奖

  第十九届“挑战杯”全国大学生课外学术科技作品竞赛2023年度“揭榜挂帅”专项赛-二等奖

  2023中国机器人大赛暨ROBOCUP机器人世界杯中国赛--智能车挑战赛 一等奖（冠军）

  2024中国机器人大赛暨RoboCup机器人世界杯中国赛-航天器设计与空间机器人 一等奖（冠军）

  2024中国机器人大赛暨ROBOCUP机器人世界杯中国赛-智能车挑战赛 一等奖'
