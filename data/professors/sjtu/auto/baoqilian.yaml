title: 副教授
email: qlbao@sjtu.edu.cn
bio_raw: '研究方向

  组合导航,数据融合技术,智能控制。

  工作经历

  2001.1-迄今    上海交通大学仪器科学与工程系,副教授

  2012.7-2013.7   美国康涅狄格大学访问学者

  2010.7-2010.10  美国加州大学圣地亚哥分校访问学者

  2002.8-2002.12  英国曼彻斯特大学理工学院访问学者

  1998.9-2000.12 上海交通大学仪器科学与工程系,讲师

  教育背景

  1994.9-1998.8  上海交通大学自动化系,博士

  1992.9-1994.8  上海交通大学仪器科学与工程系,硕士

  1988.9-1992.8  上海交通大学自动化系,学士

  荣誉奖励

  承担多门本科课程教学,包括数字电子技术、信号与系统和现代控制理论等全英文教学课程,以及自动控制原理,电子技术等;承担多门研究生课程教学,包括神经网络与模糊控制,数据融合技术,线性系统分析与设计,先进控制系统等。作为负责人和主要完成人完成与参加科研项目20余项,指导硕士生20余名,发表论文三十余篇。于2001年,2008年与2015年荣获上海交通大学优秀教师奖。'
