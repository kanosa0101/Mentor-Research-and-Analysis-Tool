bio_raw: '研究方向

  约束控制、非线性系统、受限多自主体系统

  工作经历

  2023.08--至今       上海交通大学  教授、长聘副教授

  2022.01--2023.07  上海交通大学  长聘教轨副教授

  2018.04--2021.12  上海交通大学  助理教授

  2015.06-2018.03  上海交通大学  博士后

  教育背景

  2009.09-2015.05   上海交通大学   控制理论与控制工程   博士

  2007.09-2009.06   江南大学   控制理论与控制工程   硕士

  2003.09-2007.06   江南大学   自动化   学士

  科研项目

  1. 国家自然科学基金优秀青年科学基金项目，饱和约束控制系统分析与设计，在研

  2. 国家自然科学基金面上项目，基于性能的抗饱和控制策略研究及其应用，在研

  3. 国家自然科学基金青年科学基金项目，线性输出反馈下传感器饱和线性系统的镇定性研究，结题

  4. 上海市自然科学基金探索类项目，输入饱和下异质多智能体系统的输出一致性研究，结题

  5. 中国博士后基金特别资助项目，输入饱和下多智能体系统的局部一致性研究，结题

  6. 中国博士后基金面上项目，基于饱和依赖Lyapunov函数的抗积分器溢满补偿器设计，结题

  7. 山东省重点研发计划项目课题，基于车路协同技术的智能交通服务平台建设与产业化应用，在研

  研究成果

  数字信号处理   本科生课程

  离散数学   本科生课程

  工科创II    本科生课程

  荣誉奖励

  [1]  2016年 中国自动化学会优秀博士学位论文奖

  [2]  2013年  “关肇直”奖'
