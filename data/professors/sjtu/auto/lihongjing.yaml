bio_raw: '研究方向

  量子传感；量子精密测量；量子声学传感器

  工作经历

  2017.8-2020.12    上海交通大学     助理研究员

  2020.12-至今        上海交通大学     副研究员

  教学工作

  本科生课程《量子精密测量》

  科研项目

  自适应量子弱测量的参量感知理论与实验研究 国家自然科学基金青年基金， 主持

  科技创新2030-“量子通信与量子计算机”重大项目子课题  参与

  基于量子弱测量的高灵敏度相位测量研究 校级新进教师启动计划 ，主持

  研究成果

  在Nature Communications、Communications Physics、Photonics Research、Physical Review
  Applied、Applied Physics Letters等国际主流期刊共发表30余篇文章，申请国家发明专利30项，已授权10余项，参与出版译著1部。

  荣誉奖励

  2019年度上海交通大学“SMC-晨星优秀青年学者奖励计划”

  2018年度上海交通大学优秀班主任称号'
