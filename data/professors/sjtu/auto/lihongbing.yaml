bio_raw: '研究方向

  智能机器人、人机交互、机器人智能感知

  研究方向简介：

  李红兵课题组致力于将人工智能、智能感知、智能控制等先进技术与机器人技术相结合，实现机器人之间、机器人与人之间以及机器人与复杂环境之间的智能感知、交互与控制。

  课题组在智能人机交互、智能机器人力位控制、高精度位置控制、多自由度实时控制系统、复杂机器人运动学快速计算等机器人关键核心技术方面具有良好的研究基础和长期的技术积累。

