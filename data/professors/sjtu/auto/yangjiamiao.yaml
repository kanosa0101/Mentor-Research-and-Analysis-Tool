bio_raw: '研究方向

  光学检测/成像、生物医学光子学、人工智能、光计算、机器视觉等

  工作经历

  2020.6-至今,上海交通大学,长期聘请副教授、博导

  2017.2-2020.8,美国加州理工学院,博士后,合作导师：Lihong V. Wang院士

  2015.8-2017.1,美国圣路易斯华盛顿大学,博士后,合作导师：Lihong V. Wang院士

  教育背景

  2010.9-2015.6：北京理工大学,仪器科学与技术,博士

  2006.9-2010.6：北京理工大学,测控技术与仪器,学士

  科研项目

  北京理工大学,台式夏克哈特曼波前传感器研制;

  上海脑科学与类脑研究中心,深区脑神经元抗散射光遗传精准激励方法与系统研究;

  上海市科学技术委员会,偏振敏感多光谱皮肤疾病智能检测系统研究;

  华为技术有限公司,基于空间光场调制的高速XX神经网络及其硬件平台研究;

  转化医学国家重大科技基础设施（上海）开放课题,基于人工智能的多光谱皮肤疾病检测系统研制;

  美国食品安全检测仪器公司（SafetySpect Inc.）,Multispectral Fluorescence Food Safety Inspector.

  研究成果

  以第一作者或通信作者在Nature Communications 、Science Advances、Light: Science & Applications
  Optica(IF 9.3)等国际权威SCI学术期刊上发表论文10余篇,研究成果被“美国物理联合会科学之光栏目”、“世界科技研究新闻资讯网”、“科技探索网等专题报道”,博士论文获中国仪器仪表学会全国优秀博士学位论文。授权PCT国际1项,国家发明专利20多项,申请中国国家发明专利20多项。主持承担了转化医学国家重大科技基础设施（上海）项目、美国食品安全检测仪器公司（SafetySpect
  Inc.）项目等多项科研项目。

  荣誉奖励

  国家高层次青年人才

  测量控制与仪器仪表领域全国优秀博士学位论文等'
