bio_raw: '研究方向

  目前的主要研究方向：

  1）射频识别技术及应用（如：智能卡、电子标签等）

  2）无线通讯技术及应用（如：Zigbee）

  3）移动式智能监测系统

  4）故障诊断与容错控制

  工作经历

  1997.06~今, 上海交通大学，自动化系，副教授

  2005.05~2005.10, 英国赫尔大学，高级访问学者

  1995.05~1997.05, 上海交通大学，自动化系，博士后

  教育背景

  1989.09~1995.03, 哈尔滨工业大学，控制工程系，博士（硕博连读）

  1985.09~1989.06, 哈尔滨工业大学，控制工程系，学士

  教学工作

  本科大平台课程：《自动控制原理》、《嵌入式系统原理与实验》

  研究生课程：《鲁棒控制》

  科研项目

  主持国家自然科学基金项目两项，上海市自然科学基金一项

  参与973项目两项，863项目两项

  研究成果

  Selected papers:

  1) Wu Haiyan, Qian Yufeng, Weng Zhengxin, Fitting Compressor Characteristic Curve
  Based On Monod and Logistic Model, 2012 IET International Conference on Information
  Science and Control Engineering (ICISCE 2012), p1946-1949, December 7-9,2012, Shenzhen,
  China

  2) Weng, Zhengxin, Patton, Ron J., Cui, Ping , Robust Fault Detection for Linear
  Parameter-Varying Time-Delay Systems, 7th IFAC Symposium on Fault Detection, Supervision
  and Safety of Technical Processes, June 30 - July 3, 2009, Barcelona, Spain.

  3) Yan, Bingyong; Tian, Zuohua; Shi, Songjiao; Weng, Zhengxin, Fault diagnosis for
  a class of nonlinear systems via ESO, ISA Transactions, 2008, 47(4) :386–394.

  4) Wu Junsheng, Weng Zhengxin, Tian Zuohua, et al.Fault tolerant control for uncertain
  time-delay systems based on sliding mode control.  Kybernetica.2008, 44(5), P617-632

  5) Ping Cui , Zhengxin Weng and Ron Patton, Novel active fault-tolerant control
  scheme and its application to a double inverted pendulum system，Journal of Systems
  Engineering and Electronics. 2008, 19(1): 134-140.

  6) Ping Cui and Zhengxin Weng, Robust Fault Estimator Design for Linear Parameter-Varying
  Systems, Journal of Signal Processing, Vol.12, No.1,January 2008, 89-95

  7) Weng Zhengxin, Patton, R.J. and Cui Ping, Robust fault estimation for linear
  parameter varying time-delay systems. 16th Mediterranean Conference on Control and
  Automation, Congress Centre, Ajaccio, France, June 25-27, 2008, pp292-296

  8) Weng Zhengxin, Patton, R.J. and Cui Ping, Integrated design of robust controller
  and fault estimator for linear parameter varying systems. Proc. 17th World Congress
  of IFAC, Seoul, Korea, July 2008.4535-4539

  9) Z Weng, R J Patton, and P Cui, Active fault-tolerant control of a double inverted
  pendulum. Proc. IMechE Part I: J. Systems and Control Engineering, 2007, 221(6):895-904

  10) Zhengxin Weng, Ron Patton, Ping Cui, Active fault-tolerant control for unstable
  systems, MECHATRONICS’06, Heidelberg, Germany, Proceedings of the IFAC Symposium
  Mechatronics 2006, 12-14th Sept. 2006, pp 79-84

  11) Zhengxin Weng, Ron Patton, Ping Cui, Active fault-tolerant control of a double
  inverted pendulum, SAFEPROCESS’06, Beijing, China, 1591-1596.

  12) Yang Xiao-Jun,Weng Zheng-Xin,Tian Zuo-Hua, On coprime factorization for linear
  system with finite discrete jumps,  Proceedings of the 2005 American Control Conference,
  ACC, 2005, p 4006-4009

  13) Yudong Chen, Zhengxin Weng, and Songjiao Shi. Robust fault diagnosis for nonlinear
  difference-algebraic systems. Int.J.control，2003, Vol.76, No.15, 1560-1569

  14) Yudong Chen, Zhengxin Weng, Songjiao Shi. Robust on-line fault diagnosis for
  nonlinear difference-algebraic systems using least squares estimate. Journal of
  Systems Engineering and Electronics, vol. 13, No.2, 2002, 50-59

  15) weng zhengxin, H-inf loop transfer recovery synthesis of discrete-time systems.Int.
  J. of  Robust and Nonlinear Control , 1998,vol.8,No.8, 687-697'
