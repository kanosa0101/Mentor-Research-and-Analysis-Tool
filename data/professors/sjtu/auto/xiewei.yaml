title: 长聘教轨副教授
email: weixie@sjtu.edu.cn
bio_raw: '研究方向

  [1] 旋翼无人机协同吊运；

  [2] 空海跨域无人系统协同控制；

  [3] 港口起重机、AGV、大型拆锁机械臂

  的智能化；

  注：2027年入学的博士名额还有1个，要求如下：

  1）研究方向为港口大型搬运装备「岸桥、场桥」的智能化；

  2）需要完成算法设计、原理样机及港口实机测试验证；

  工作经历

  2024.03-现在：上海交通大学重庆研究院，特聘研究员；

  2025.01-现在：上海交通大学，长聘教轨副教授；

  2021.09-2024.12：上海交通大学，长聘教轨助理教授；

  教育背景

  2016-2021: 澳门大学，澳门，博士；

  教学工作

  控制理论（本科-春季）；

  混合控制理论（研究生-秋季）；

  科研项目

  国家自然科学基金青年项目（主持）；

  国家自然科学基金面上项目（主持）；

  科技创新2030-重大项目课题（主持）；

  GF科技创新发展联合基金项目（主持）;

  荣誉奖励

  上海市“海外高层次人才计划”入选者；

  上海市“启明星-扬帆专项人才”入选者；

  中国科协“青年人才托举工程”入选者；

  2022年海南省科学技术发明奖-特等奖（排2）；

  2024年海南省科学技术进步奖-特等奖（排2）；

  2025年吴文俊人工智能科技进步奖一等奖（排2）；

  学术任职

  期刊《海洋工程装备与技术》，编委；

  中国自动化学会青年工作委员会委员；'
