bio_raw: '研究方向

  压电微声器件理论与仿真建模、无源微声感知器件设计与制备、高性能射频雷达设计及研制、水声多模态语义通讯及深海无人指挥链研究

  教育背景

  1.山东大学，机电与信息工程学院，电子信息科学与技术专业，本科

  2.上海交通大学，电院，测控技术及仪器专业，硕士

  3.中国电子科技集团第二十八研究所，联合作战指挥系统

  4.上海交通大学，电院，仪器系，博士

  5.上海交通大学，电院，自动化系，博士后

  科研项目

  主持：

  国自然青年基金“声表面波散射及模式转换研究”，主持。

  南方电网“多参量数能同传技术研究与设备试制”，主持。

  中国博士后科学基金第 69 批面上资助”，主持。

  上海市“超级博士后”资助，主持。

  上海市院士咨询中心，“智能传感自主可控安全高效发展战略研究”，主持。

  参加项目情况：

  传感器与微流体器件材料技术，国家重点研发计划，参加。

  新型层状复合结构上 SAW 高温敏感特性研究，国家自然科学基金面上项目，参加。

  配电设备与线路状态感知技术研究与应用， 国家电网科技项目，参加。

  研究成果

  成果应用

  研制的电磁微声技术，解决了冶金行业缺少高可靠、高准确率的包号识别技术难题，已经批量应用于宝钢上海、宝钢湛江、八一钢铁、江苏永联钢铁、陕西龙门钢铁等冶金企业。

  研制的 SAW 无线无源温度传感器，实现了高压电气柜的一体化感知监测，已经批量应用于国家电网、南方电网、华电集团等电力企业。

  专利情况

  发明专利5项：

  SAWRFID标签的一种新型宽温度范围测温方法，CN201710318577，已授权；

  基于多频相位差的SAWRFID标签测距方法；CN201710318056，已授权；

  基于声表面波技术的地下设备电子标识器；CN201910314972，已申请；

  一种可用于多种介质中的RFID标签天线；CN201910110599，已申请；

  环网柜测温系统的阅读器系统，CN201811287430，已申请；

  实用新型4项：

  配网架空线路无线测温传感器天线，CN202020138936，已授权；

  推车式定位装置CN201920471207，已授权；

  一种室外温度测量装置，CN201020574401，已授权；

  一种图书电磁防盗装置，CN201020166682，已授权；

  荣誉奖励

  2021年度上海市“超级博士后”

  获得了 2021 年中国·山东(青岛)博士后创新创业成果大赛“优胜奖”

  指导学生获得第七届中国（国际）传感器创新创业大赛国家二等奖。'
