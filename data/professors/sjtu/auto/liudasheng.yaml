bio_raw: '研究方向

  机器人设计与控制、医学信息检测与处理

  工作经历

  先后主持了教育部留学回国人员基金、上海交通大学青年人才科研能力培育专项、上海市卫健委和企业委托开发的多个项目;参与完成了国家自然科学基金、科技部国家重点研发计划课题、上海市科委科技项目等国家和省部级研究项目10余项。此外，以第一作者及合作者在国内外学术期刊上发表论文共20余篇，以第一发明人和共同发明人申请国家发明专利60余项、已授权国家发明专利38项、软件著作权6项。

  研究成果

