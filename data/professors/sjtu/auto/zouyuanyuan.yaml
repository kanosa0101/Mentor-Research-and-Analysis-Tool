bio_raw: '研究方向

  信息物理系统的分布式控制与优化、工业系统智能决策与优化控制、无人系统智能自主控制、预测控制

  工作经历

  2026/08-至今, 上海交通大学,  特聘教授

  2019/01-2026/08, 上海交通大学,  教授

  2017/04-2018/12, 上海交通大学, 副教授

  2012/09-2017/03, 华东理工大学, 副教授

  2009/09-2012/08, 华东理工大学, 讲师

  教育背景

  2005/04-2009/09，上海交通大学，控制科学与工程，博士

  2007/05-2007/11，加拿大阿尔伯塔大学，公派联合培养

  2002/09-2005/02，鲁东大学，运筹学与控制论，硕士

  1998/09-2002/07，鲁东大学，数学与应用数学，学士

  教学工作

  本科课程《自动控制原理A》

  本科课程《过程控制系统课程设计》

  研究生课程《自适应控制》

  科研项目

  (1)  国家自然科学基金面上项目：面向复杂时序逻辑任务的CPS系统分布式预测控制，2022-，主持

  (2)  国家重点研发计划：面向智能工厂动态生产的实时优化运行技术与系统，2019/07-2022/12-， 子课题负责人

  (3). 国家自然科学基金重点项目: 网络化系统分布式实时优化决策理论应用，2019/01-2023/12 ， 第二

  (4). 国家自然科学基金面上项目：分布式系统优化运行的自重构预测控制设计与性能分析，2018/01-2021/12，主持

  (5). 国家自然科学基金重大项目：炼油生产过程全局优化运行的基础理论与关键技术, 2016/01-2020/12, 项目骨干

  (6). 国家自然科学基金面上项目：时间/事件混合驱动环境下的分布式预测控制设计与性能分析，2014/01-2017/12，主持

  (7). 国家自然科学基金青年项目：约束不连续非线性系统预测控制显式设计与性能分析，2011/01-2013/12， 主持

