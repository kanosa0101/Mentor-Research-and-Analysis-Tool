  工作经历

  2023年-至今，上海交通大学溥渊未来技术学院，副院长

  2020年-至今，上海交通大学自动化系，研究员、曾任副系主任

  2015年-2020年，上海交通大学自动化系，副研究员

  2005年-2015年，上海交通大学自动化系，助理研究员

  教育背景

  2008年-2012年，上海交通大学控制科学与工程，在职博士

  2002年-2005年，上海交通大学自动化系，硕士

  1998年-2002年，上海交通大学自动化系，学士

  教学工作

  本科生课程：《运动控制系统》，2024年获评上海市一流课程

  本科生课程：《机器人综合实践》，2025年获评上海市重点课程

  研究生课程：《智能机器人》

