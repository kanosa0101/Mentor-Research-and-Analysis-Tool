bio_raw: '研究方向

  工业物联网，确定性网络， AI驱动的优化与控制

  招募信息

  ：

  欢迎不惧困难、自驱力强的同学，一起探索未知！

  最新探索方向：AI驱动的EDA设计（芯片及FPGA设计）、AI驱动的智能调度（半导体、制造系统调度）

  博/硕士生

  欢迎有志于工业物联网、AI驱动的优化与控制等学术研究的同学加入！

  本科生

  欢迎学有余力的同学加入实验室进行课题研究、PRP、大创等，

  支持日常科研费用（材料、算力、大模型等），表现优异有日常和成果奖励；

  支持投稿AI及EDA领域顶会顶刊，录用者资助参会；

  只要你有好奇心，欢迎和我联系讨论合作兴趣点，一起探索未知科学世界！

  招收2~5名本科生，参与

  研究，投稿

  AI顶会（AI4CONTROL方向）

