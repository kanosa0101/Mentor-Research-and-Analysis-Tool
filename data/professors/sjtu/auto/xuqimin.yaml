  工作经历

  2023至今  上海交通大学自动化系，副研究员

  2021-2023  上海交通大学自动化系，助理研究员

  2019-2021  上海交通大学电气工程系，博士后，合作导师：严正

  教育背景

  2013-09至2019-06，上海交通大学大学，电子信息与电气工程学院，博士，导师：关新平

  教学工作

  2013-至今，《工业软件技术与应用》

  科研项目

  [1] 国家自然科学基金联合基金项目，面向散货港口的门机智能感知及多机协同控制理论研究及应用，2023-2026，在研，交大方负责人

  [2] 国家重点研发计划，软件定义的跨平台编译下装及多设备仿真调试技术，2022-2025，在研，子课题负责人

  [3] 上海交通大学Explore X基金项目，确定性网络的异构机制分析与融合设计，2022-2024，在研，主持

  [4] 国家自然科学基金青年项目，基于耦合灵敏度的船舶电力CPS动态调度与优化，2022-2024，在研，主持

  [5] 浙江大学工业控制技术国家重点实验室开放课题，2022，结题，主持

  [6] 企业项目，信息物理耦合仿真交互接口软件设计与研发，2022，在研，主持

  [7] 国家自然基金重大研究计划，面向多场景端到端性能可控的信息工业互联网架构，2022-2024，在研，骨干

  [8] 国家重点研发计划，面向智能工厂的现场级工业物联网关键设备研发，2019-2022，结题，技术负责人

