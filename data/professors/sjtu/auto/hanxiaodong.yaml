bio_raw: '研究方向

  主要研究方向：智能感知、智能信息处理、射频综合系统与测试、系统建模和仿真、AI应用于探测与信息处理等。曾先后主持和参与了歼-X、歼-XD、直-X9、直-X等火控雷达系列，运-X、直-X、翼龙-10、翼龙-2等气象雷达系列，直-XG、米-X等战场监视雷达系列等十余项重点型号研制和预研，涉及国防经费超亿元。取得的多项开创性成果填补了国内多个领域空白，已应用于上述主战飞机雷达研制中。获国防科技进步二等奖1项（排名2）、国防技术发明三等奖1项（排名3）、国防科技进步三等奖1项（排名4）、中航机载
  “总经理特别奖”1次、集团个人三等功2次。发表学术论文30余篇，授权和申请专利20余项。

  特注：团队同样招收博士后

  工作经历

  200608～202304   中国航空工业集团公司雷华电子技术研究所，主任、研究员、项目副总师

  202305～至今      上海交通大学自动化与感知学院，研究员、博士生导师、全重实验室副主任

  教育背景

  200009～200406   学士       吴文教授      南京理工大学       电子信息工程

  200409～200606   硕士       是湘全教授    南京理工大学       通信与信息系统

  201309～201906   博士       吴曼青院士    上海交通大学       信息与通信工程

  教学工作

  中国国际大学生创新创业大赛（2024）上海赛区金奖

