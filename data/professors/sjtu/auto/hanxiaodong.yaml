  研究成果

  主持了

  XX

  雷达工程样机的研制与试飞验证，提出了共形数字阵列雷达可工程化的基于空时自适应处理架构的地面

  /

  低空慢动目标探测技术，解决了非均匀杂波环境和处理资源约束条件下地面

  /

  低空慢动目标稳健探测与高精度定位问题。

  主持了

  国内首次完成

  X

  波段机载

  MIMO

  雷达半物理仿真试验系统的搭建，实现了相关关键技术的验证。

  首次提出和建立了机载气象雷达湍流

  /

  风切变探测射频仿真试验系统方案和验证方法，解决了机载气象雷达湍流

  /

  风切变探测性能的试验、验证和评估的难题。

  主持了机载毫米波相控阵测云雷达工程样机的研制，完成了国内首次高空大型无人机台风综合观测试验，提出了机载毫米波相控阵测云雷达内外定标技术、地杂波智能抑制技术等方法，解决了机载毫米波相控阵测云雷达高置信度反射率因子估计等问题，为机载毫米波测云雷达研制奠定了坚实的技术基础。

