bio_raw: '研究方向

  主要从事面向工业互联网的确定性机制的研究，主导研发了TSN网络控制器软件和工业信息物理系统综合测试床，已在中国科学技术科学、IEEE TII等国内外高水平刊物上发表论文13篇，申请发明专利11项（授权6项），登记软件著作权3项，参与起草国际/行业标准4项。主持

  国家自然科学基金青年基金1项，

  参与国家重点研发计划2项等。

  课题组主要研究方向

  1.

  确定性网络

  ：工业自动化、大型运载装备信息互联等

  2.

  工业软件与工业智能

  ：工业控制软件、数字孪生等

  3.

  软件定义卫星

  ：星载信息处理、星间确定性通信等

  招生信息

  目前仍有

  2027级硕士研究生（自动化方向）招生名额

  ，诚挚欢迎对

  软件开发及工程实践

  具有浓厚兴趣的同学加入！

  要求：

  对工业网络、工业软件、智能算法或先进运载装备有强烈研究兴趣

  一定的编程基础（Python/Golang/C等）

  主动探索精神和团队协作能力

  请将您的详细简历（包含成绩单、项目经历）发送至：

  jinglong@sjtu.edu.cn

  工作经历

  2024.07-至今 上海交通大学 助理研究员

  教育背景

  2017.9-2024.06      上海交通大学      控制科学与工程     博士

  2013.9-2017.6         北京科技大学              自动化          学士

  科研项目

  纵向，国家自然科学基金青年基金（C类），30万，主持；

  横向，工控TSN系统软件开发，220万，主持；'
