bio_raw: '研究方向

  新型信息器件和智能信号处理技术

  工作经历

  2014年至2017年在美国卡内基梅隆大学电子与计算机工程系进行博士后研究, 2017年加入上海交通大学仪器系,现任长聘副教授。

  教育背景

  2014年获美国明尼苏达大学双城校区电子工程博士学位

  教学工作

  担任《人工智能原理》、《数字信号处理》、《智能信息处理与实践》、《电磁场》、《磁电测量技术》等本科生和研究生课程主讲

  科研项目

  承担美国国家科学基金、中国自然科学基金重大研究计划、面上、青年项目和上海市科委项目等科研项目20余项。

  研究成果

  本人通过将新型信息器件和人工智能技术结合，主要从事新型信息器件(包括传感器、存储运算器件和通信器件等)和相关信号处理技术的交叉研究。对于信息器件，主要结合器件的物理性质和结构研究下一代传感器、忆阻器和通信器件等；对于信号处理技术，主要结合通信理论和机器学习技术实现器件的智能化并促进其实际应用,
  具体涉及到存储、探测和通信系统中的高级信号处理技术研究。本人共发表SCI论文80余篇，其中一作和通信作者论文60余篇，相关研究工作发表在《IEEE Journal
  on Selected Areas in Communications》，《IEEE Transactions on Industrial Electronics》,
  《IEEE Transactions on Industrial Informatics》，《IEEE Internet of Things Journal》,
  《IEEE Transactions on Geoscience and Remote Sensing》，《IEEE Transactions on Antennas
  and Propagation》，《ACS sensors》,《Applied Physics Letters》等期刊上。本人主持美国国家科学基金、中国自然科学基金重大研究计划、面上、青年项目和上海市科委项目等科研项目20余项。

  荣誉奖励

  第八届中国（国际）传感器创新创业大赛决赛特等奖

  中国仪器仪表学会年会优秀学术成果

  自然科学基金委员会“后摩尔学术年度会议”优秀成果

  学术任职

  中国仪器仪表学会嵌入式仪表及系统技术分会理事

  中国仪器仪表学会传感器分会委员

  中国计量协会电子测量仪器工作委员会专家

  上海市仪器仪表学会副秘书长

  《Instrumentation》、《仪器仪表学报》编委

  《Nano Energy》, 《IEEE Transactions on Communications》,《IEEE Transactions on Industrial
  Electronics》，

  《IEEE Transactions on Geoscience and Remote Sensing》,

  《IEEE Transactions on Antennas and Propagation》

  等SCI期刊审稿人。'
