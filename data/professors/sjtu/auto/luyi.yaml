bio_raw: '研究方向

  人机环复杂系统安全性及人因可靠性：包括航空器、无人器、水利/核电仪控系统等

  系统工程理论及MBSE：基于过程模型的复杂系统工程建模与功能仿真

  民机适航符合性验证：面向“需求-功能链”的管控策略及应用

  智能检测与声学工程：面向“弦琴一体”的乐器共鸣智能检测技术、民族乐器改革

  工作经历

  民用航空处副处长  2024至今 上海市交通委员会（挂职）

  副研究员、博士生导师  2021至今 上海交通大学自动化与感知学院

  助理研究员  2018-2020 上海交通大学电子信息与电气工程学院自动化系

  博士后   2015-2017 中国商用飞机有限责任公司/北京航空航天大学

  国家公派访问学者  2012-2013 美国普渡大学（Purdue University）航空宇航学院

  教育背景

  工学博士   2009–2015   北京航空航天大学—美国普渡大学联合培养项目   专业：载运工具运用工程

  硕博连读   2008–2009   北京航空航天大学交通科学与工程学院  专业：载运工具运用工程 （免试推荐）

  工学学士   2004–2008   北京航空航天大学航空科学与工程学院  专业：飞行器设计与工程

  教学工作

  上海高校市级重点课程《系统设计中的人为因素》（参与承担）

  本科生基础课《数字信号处理（A类）》（参与承担）

  科研项目

  主持， 国家自然科学基金项目，人员培训对无人机维修差错影响的动态模式与培训收益风险预估研究，2019-2021

  2. 主持，国家重点行业企业协作，人因边界及其量化分析方法与系统研究，2019-2023

  3. 主持，ZB预研项目，考虑路径依赖的人机交互故障促进及抑制机理模型研究，2018-2021

  4. 主持，中国博士后基金项目，民机系统适航符合性证据构建过程组织行为模式研究，2016-2018

  5. 主持，企业协作，中国民族弦乐器音板共鸣听觉情绪影响机制及基于机器学习的音质评价方法研究，2023-2026

  6. 主持，企业协作，面向人机工程的乐器配弦品质评估和制造缺陷预测研究，2021-2023

  7. 主持，企业协作，面向用户认知的民族弦乐器音色量化与智能评价系统研究，2025-2027

