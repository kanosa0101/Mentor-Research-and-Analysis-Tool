bio_raw: '研究方向

  主要从事航天器智能控制与调度，地面半物理仿真试验技术研究

  工作经历

  2015.12-至今 上海交通大学自动化与感知学院 高级工程师

  2013.06-2015.11 上海交通大学 航空航天学院  助理研究员

  2011.03-2013.05 上海交通大学  航空航天学院 博士后

  教育背景

  2006.09-2010.12  哈尔滨工业大学  控制科学与工程  博士研究生

  2004.09-2006.07  哈尔滨工业大学  控制科学与工程  硕士研究生

  2000.09-2004.07  哈尔滨工业大学  自动化   学士

  科研项目

  1、2023.05-至今         卫星任务统筹与编队构形设计服务（型号研制）  115.2万        课题负责人

  2、2022.01-2024.01   面向用户的高效规划仿真系统（型号研制）     488.0万        课题负责人

  3、2022.01-2023.03   特装组网卫星仿真技术（基础群重点基金项目）   90.0万     课题负责人

  4、2022.01-2025.06   空间航天器主动漂移控制技术研究（航天基金）  60.0万  课题负责人

  5、2021.10-2023.10   回归轨道优化与快速调整仿真系统（型号研制） 326.0万     课题负责人

  6、2020.06-2024.10   长期策略规划系统研制（型号研制）  86.7万             课题负责人

  7、2020.03-2025.06   国家民用空间基础设施条保项目（民口专项）  1970万         技术负责人

  研究成果

  先后主持参研了我国天绘系列卫星型号装备、国家民用空间基础设施建设十三五科研星、高分专项、天军预研、装发重点基金和航天基金等20多项航天领域科研项目，联合发表学术论文30余篇，撰写专著1部，申请专利20余项。

