bio_raw: '研究方向

  信号与信息处理、信息融合、目标识别、遥感与导航

  研究成果

  高精度高可靠定位导航技术与应用,国家科技进步奖,国家奖,二等奖,排名：第一,2017年

  空间目标监测相控阵雷达信息处理与应用系统,国家科技进步奖,国家奖,二等奖,排名：第一,2011年

  舰船、装甲、飞机等军用目标自动识别综合系统,国家科技进步奖,国家奖,二等奖,排名：第三,1999年

  KD85-466舰船雷达目标自动智能识别系统,国家科技进步奖,国家奖,二等奖,排名：第四,1991年

  通用型对海监视雷达目标识别与综合显控系统,军队科技进步一等奖,省部级,一等奖,排名：第一,2007年

  荣誉奖励

  全国创新争先奖,2017年5月

  第十五届上海市科技精英（提名奖）称号,2017年

  全国模范退役军人,2019年7月26日

  2019年感动上海年度人物,2019年9月

  2020年度“最美退役军人”, 2020年12月

  学术任职

  中国第二代卫星导航系统重大专项测试评估与试验验证专家组专家；

  高分辨率对地观测系统重大专项专家委员会地面系统组专家；

  总装备部上海市“北斗导航与位置服务”共建重点实验室主任；

  上海交通大学学术委员会委员；

  雷达信号处理国防科技重点实验室学术委员会委员；

  上海卫星导航定位产业技术创新战略联盟理事长；

  高速电子系统设计与电磁兼容教育部重点实验室与上海市空间导航与定位技术重点实验室学术委员会委员；

  高分辨率对地观测系统重大专项方案编制专家组专家;教育部科技委信息学部委员；

  《电子学报》、《红外与毫米波学报》、《科技导报》编委会委员;国家智能交通系统技术咨询专家委员会委员；'
