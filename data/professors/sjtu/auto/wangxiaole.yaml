bio_raw: '研究方向

  基础研究方向：声波与物质的作用机理

  应用研究方向：人工波动调控介质材料及器件；运载设备、消费电子器件的减振降噪设计

  工作经历

  2021.06–今 上海交通大学 感知科学与工程学院 助理研究员

  教育背景

  2019.04–2021.06 上海交通大学 电子科学与技术 博士后

  2014.09–2019.03 上海交通大学 仪器科学与技术 博士

  2011.09–2014.06 山东大学     车辆工程       硕士

  2005.09–2009.06 华中农业大学 机械工程      学士

  科研项目

  2021.01–2023.12：主持国家自然科学基金青年项目

  2026.01–2029.12：主持国家自然科学基金面上项目

  研究成果

  技术成果：

  头戴式设备音频系统，用于声学交互与感知增强；

  智能调控电磁/声学器件，检测复杂场中敏感电磁/声学信息；

  基于变换声学的超屏障，解决EVTOL外场噪声抑制难题；

  航空声学超材料应用范式，实现飞机舱内整机级高效降噪

  消费终端器件的声学设计

  专利成果：

  已获得中国发明专利

  授权

  10项，美国

  发明专利

  授权

  1项

  论文成果：

  https://orcid.org/0000-0002-4404-2857

  ‪Xiaole Wang‬ - ‪Google 学术搜索‬

  荣誉奖励

  2020年3月入选上海交通大学“晨星博士后激励计划”

  学术任职

  中国仪器仪表学会会员；

  担任Applied Physics Letters, Journal of Applied Physics, Journal of Physics D: Applied
  Physics,

  Applied Acoustics,

  Mechanical Systems and Signal Processing, International Journal of Mechanical Sciences等期刊审稿人。'
