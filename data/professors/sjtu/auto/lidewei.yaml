bio_raw: '研究方向

  复杂系统优化与控制、能源互联网、智能交通系统、智能机器人、智能制造系统

  工作经历

  01/2019至今        上海交通大学自动化系教授

  04/2011-12/2018  上海交通大学自动化系副研究员

  05/2011-12/2011  香港科技大学化学与分子工程系助理研究员

  04/2009-04/2011  上海交通大学仪器科学工程系博士后

  09/2002-06/2004  四川德阳杰特工程公司工程师

  05/1999-09/2002  四川鼎天电子产业有限公司软件工程师

  06/1998-05/1999  新加坡星域控制工程公司成都分公司销售工程师

  10/1995-06/1998  中国第二重型机械集团公司设计研究院电气工程师

  07/1993-10/1995  汕头海洋集团公司助理工程师

  教育背景

  2009年获得工学博士学位

  09/2004-03/2009  上海交通大学自动化系攻读博士学位（硕博连读）

  09/1989-07/1993  上海交通大学自动控制系攻读学士学位

  教学工作

  硕士课程《预测控制》

  本科课程《自动化仪表》

  科研项目

  煤转化过程全闭环控制系统关键技术与设备研制，国家重点研发计划项目

  车联网环境下复杂混合交通系统优化调控理论与关键技术，国家自然科学基金重点项目

  实时数据驱动的多阶段批次过程协同优化控制设计与应用研究，国家自然科学基金内地-香港联合项目

  混杂大规模系统分布式预测控制综合设计方法研究，国家自然科学基金面上项目

  预测控制嵌入式高效算法及实现策略的研究，国家自然科学基金面上项目

  随机系统输出反馈预测控制理论及算法研究,   国家自然科学基金面上项目

  大型造船多分段全自主焊接双臂机器人的关键技术与装备， 国家863项目

  城市交通路网协同优化控制原型系统研究， 上海市科技创新计划

  复杂制造环境下的人机物协同控制与决策理论方法，广东省重点研发计划项目

  研究成果

  近5年部分论文：

  1. Input-mapping based data-driven model predictive control for unknown linear systems
  with bounded disturbance.  Lingyi Yang, Aoyun Ma, Dewei Li*, Yugeng Xi. Automatica,
  2023, 153: 111056.

  2. Distributed MPC based on Robustly Controllable Sets for PWA Systems. Ma, Aoyun;
  Dewei Li*, Yugeng Xi.  Automatica, 2023, 154: 111078.

  3. A co-design method of online learning SMC law via an input-mapping strategy.
  Yu, Yaru; Li, Dewei*; Zhao, Dongya; Xi, Yugeng  Automatica, 2024.

  4. Distributed Neighbor Selection in Multi-agent Networks.  Haibin Shao, Lulu Pan,
  Mehran Mesbahi, Yugeng Xi, Dewei Li. IEEE Transactions on Automatic Control, 2023,68(11):6711-6726

  5. Data-Driven Optimal Synchronization Control for Leader-Follower Multi-Agent Systems.
  Yuanqiang Zhou, Dewei Li*, Furong Gao.  IEEE Transactions on Systems, Man and Cybernetics:
  Systems, 2023, 53(1): 495-503

  6. An Accelerated Distributed Gradient Method With Local Memory. Xiaoxing Ren, Dewei
  Li*, Yugeng Xi, Haibin Shao   Automatica, 2022, 146: 110260.

  7. Characterizing bipartite consensus on signed matrix-weighted networks via balancing
  set. Chongzhi Wang, Lulu Pan, Haibin Shao*, Dewei Li*, Yugeng Xi.   Automatica,
  2022, 141:110237.（长文）

  8. Cluster consensus on matrix-weighted switching networks. Lulu Pan, Haibin Shao,
  Mehran Mesbahi, Dewei Li, Yugeng Xi. Automatica, 2022,141:110308.

  9. Event-triggered distributed robust model predictive control for a class of nonlinear
  interconnected systems. Yuanqiang Zhou, Dewei Li*, Yugeng Xi, Furong Gao.  Automatica,
  2022,136:110039

  10. Distributed Global Optimization for a Class of Nonconvex Optimization With Coupled
  Constraints. Xiaoxing Ren, Dewei Li*, Yugeng Xi, Haibin Shao.  IEEE Transactions
  on Automatic Control, 2022, 67(8): 4322-4329

  11. Consensus on Matrix-weighted switching Networks. Lulu Pan, Haibin Shao, Mehran
  Mesbahi, Yugeng Xi, Dewei Li.  IEEE Transactions on Automatic Control, 2021, 66(12):
  5990-5996

  12. Distributed Integrated Control of a Mixed Traffic Network With Urban and Freeway
  Networks.  Na Wu, Dewei Li*, Yugeng Xi. IEEE Transactions on Control Systems Technology,
  2022, 30(1): 57-70.

  13. Synthesis of ILC-MPC Controller With Data-Driven Approach for Constrained Batch
  Processes. Dewei Li*, SY He, Yugeng Xi, Tao Liu, Furong Gao, Youqing Wang, Jingyi
  Lu. IEEE Transactions on Industrial Electronics, 2020, 67(4): 3116-3125

  14. Brain-Inspired Experience Reinforcement Model for Bin Packing in Varying Environments.
  Linli Zhang, Dewei Li*, Jia Shuai, Haibin Shao.  IEEE Transactions on Neural Networks
  and Learning Systems, 2022, 33(5): 2168-2180

  荣誉奖励

