  2016年中国自动化学会自然科学一等奖

  2017年中国自然科学二等奖

  2017年上海交通大学科研成果二等奖

  2018年上海交通大学科研成果一等奖

  2021年中国自动化学会技术发明二等奖

  2022年中国发明协会创业奖创新奖一等奖

  2022年上海市科技进步一等奖

  2021年中国科协优秀论文奖

  学术任职

  中国自动化学会预测控制与智能决策专业委员会主任'
