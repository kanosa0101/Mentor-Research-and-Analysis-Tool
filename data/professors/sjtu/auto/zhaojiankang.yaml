title: 研究员
email: zhaojiankang@sjtu.edu.cn
bio_raw: '研究方向

  导航制导与控制,无人机技术,水声通信与导航技术,视觉检测与导航等等

  工作经历

  在国防科技大学自动化控制、航天与材料工程学院,从事导航制导与控制方向研究,工作了近20年。2008年至今在上海交通大学仪器系从事无人系统导航与控制方向研究。

  教育背景

  国防科技大学飞行器设计博士毕业。

  科研项目

  先后主持国家自然科学基金、国家863计划、武器装备预研专项、以及省级科技项目等60余项。近3年来主要主持科技部重点研发项目一项。

  研究成果

  无人机大气检测系统、无人机交通桥梁检测系统等等。

  荣誉奖励

  获部委级科技进步二等奖、部委级三等奖多项。

  学术任职

  国家自然基金委、科技部、上海科委等评审专家,上海惯性技术学会副理事长,中国惯性技术学会理事,《中国惯性技术》、《航天控制》、《Journal of Harbin
  Institute of Techonology（New Series）》、《ISA》编委专家。'
