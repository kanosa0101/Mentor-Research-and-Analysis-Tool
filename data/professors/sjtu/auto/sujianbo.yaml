bio_raw: '研究方向

  智能机器人与多机器人协调、计算机视觉与模式识别。

  机器人表征空间理论和技术、任务可完成性判断和系统模块自重构；

  基于自抗扰理论和技术的机器人运动控制和路径规划、SLAM及模式识别；

  传感智能生成、进化及共享策略、基于传感智能的机器智能面向任务的

  主动形成和

  演绎优化；

  计算智能的极限。

  工作经历

  1995年9月—1997年8月：中国科学院自动化研究所，博士后、副研究员 (自1997年8月)

  1997年9月—现在： 上海交通大学自动化系副教授 (自1997年9月)，教授 (自2000年12月)，博士生导师 (自2001年12月)

  自动化系系主任(2001年7月-2004年10月)

  研究生院副院长（2008年7月-2015年1月）

  香港中文大学高级访问学者（香港Croucher基金资助）(1999年10月—2000年3月)

  德国慕尼黑工业大学访问教授（德国DFG基金、中国教育部联合资助）（2001年12月—2002年2月）

  日本理化学研究所仿生控制研究中心访问科学家 （2004年4月—2005年9月）

  长期从事机器人视觉伺服、模式识别、多传感器信息融合等方面的研究工作。作为负责人先后承担包括国家自然科学基金委员会海外杰出青年基金/重点/专项/面上项目、科技部国家“863”计划、工信部专项项目、以及教育部、上海市教委/科委等在内的科研项目30余项，企业横向项目50余项。

  在包括IEEE Trans. on Robotics, IEEE Trans. on Cybernetics , IEEE Trans. on Automatic
  Control,  IEEE Trans. on Multimedia, Pattern Recognition等国际主流学术期刊和会议上已发表论文320余篇，其中被SCI检索200余篇，EI检索270余篇；申请发明专利50余项，软件著作版权10余项；出版学术专著3部，主编会议论文集1部。

  2023 International Conference on Haptics and Virtual Reality 总主席；2014年第10届智能环境国际会议总主席，2011年IEEE
  Int. Conf. on Robotics and Automation的Local Arrangement Chair，2004 年IEEE Int.Conf.
  on Machine Learning and Cybernetics总主席，2000年 The Third Asian Control Conference程序委员会副主席，2004年The
  Fifth Asian Control Conference的 Best Paper Award Committee委员，以及一系列国际学术会议的程序委员会委员（包括IEEE
  Int. Conf. on Robotics and Automation, ICRA 2004-2006, IEEE Int. Conf. on Intelligent
  Robotics and Systems,IROS 2005, 2007，2008，Int''l Conf. on Computer Vision Theory
  and Applications, IEEE Int. Conf. on System, Man, and Cybernetics, SMC2007－2008，等等）。

  教育背景

  1985年9月—1989年7月：上海交通大学自动控制系，学士

  1989年9月—1992年1月：中国科学院自动化研究所国家模式识别实验室，硕士

  1992年3月—1995年5月：东南大学自动化研究所，博士

  教学工作

  本科生：机器人学、计算机控制技术

  硕士生：动态大系统方法导论

  硕士、博士生：高级机器人学

  科研项目

  带有全景视觉传感的消毒机器人基于特征完备化的路径规划与伺服控制（52041502）：国家自然科学基金专项项目

  人机共融环境下机器人基于完备特征集的意图识别与智能进化（91748120）：国家自然科学基金重大研究计划培育项目

  泛在信息制造环境下的机器人群智视觉交互与优化控制（61533012） ：国家自然科学基金重点项目

  控制理论与方法—网络系统的设计、控制与优化（61221003）：国家自然科学基金创新团队

  面向服务任务的快速机器视觉与智能伺服控制 (60935001)：国家自然科学基金重点项目

  基于分布式传感的网络机器人智能控制（60675041）：国家自然科学基金面上项目

  多机器人协调系统（60428303）：国家自然科学基金海外杰出青年基金项目

  交互式特征集学习理论与系统（60275042）：国家自然科学基金面上项目

  微机器人系统及控制技术（69889501）：国家自然科学基金重点项目

  机器人手眼协调系统无标定的动态跟踪方法与技术（69875010）：国家自然科学基金面上项目

  工信部、科技部、教育部和上海市科委、科委项目若干。

  企业横向项目若干。

  研究成果

  近5年已发表或录用论文110余篇，出版学术专著1部，发明专利授权和公开10余项。

  1.研究了立体/序列图像对特征匹配理论和技术，发展了从局部区域已匹配特征来递推获得更大区域特征匹配关系的一类新的基于活动的匹配策略及相应技术路线；探索了图像上不同区域特征对待识别模式的不同描述信息容量，提出了自适应调整图像分区进行特征提取的理论和技术；考察了不同光源图像特征对特定模式的表述有效性；在此基础上，提出了基于稀疏正则化的、多源多特征视觉识别的理论框架，满足了实用化的要求；进一步形成了与任务无关的无标定视觉伺服的全局复杂非线性关系用局部简单关系的时空组合来逼近的思想，引入扩展状态观测器和干扰观测器等估计和控制手段加以实现。

  2.发展了动态环境下基于接受域上组件加权组合的多传感器集成框架和信息融合体系结构，把多传感器融合转化成多接受域融合，从而解决了多传感器融合领域中长期存在的因为不同传感器的传感数据量级不同而难以获得稳定一致的传感精度的“偏差－方差难题”；引入增量学习策略来获得新的接受域，使得每一个接受域上的传感模型都能满足特定的传感精度，给出了描述不同时间和空间的传感模型接受域的融合权重分配策略，从而解决了多传感器信息融合领域长期存在的容易遗忘旧数据的“消极推理”缺陷。

  3.构造了具有简单智能行为的传感和动作智能体构件性能控制和评估，研究了基于智能体构件思想的即插即用机器人概念与实现技术；原创提出了表征空间概念，考察特定智能体的可完成任务的集合和对特定任务的可完成性、以及把不可完成任务向可完成任务转化的途径及代价；在此基础上，根据给定任务，实时在线动态调度合适的智能体组成，以达到对特定任务的最优完成策略；给出机器智能自我更新机制。

  荣誉奖励

  2001年获上海市教委“曙光学者”荣誉称号并获资助，2004年被授予“优秀曙光学者”称号。

  作为国内合作者，2004年获得国家自然科学基金海外杰出青年基金项目“多智能体系统协调”。

  2006年入选教育部“新世纪优秀人才支持计划”。

  2012年获第14届国际工业博览会和第14届中国高交会优秀产品奖；

  2013年获得第13届挑战杯全国大学生课外科技竞赛特等奖；

  2014年获得IEEE System Man and Cybernetics分会最佳编委奖(Best Associate Editor Award)；

  2014年获得国家级教学成果二等奖；

  2016年获得教育部自然科学二等奖；

  2018年获得《控制理论与应用》优秀编委奖；

  2018年获得国家级教学成果二等奖；

  2021年获得《控制理论与应用》优秀编委奖；

  2022年获上海市新兴科学技术协同创新大赛一等奖；

  2022年获得《控制理论与应用》优秀编委奖；

  2024年获得中国教育发展战略学会人工智能与机器人教育专委会 卓越贡献奖。

  2025年，科研成果转化受中央电视台“东方时空”栏目专题报道。

  学术任职

  International Journal of Systems, Control and Communications 主编（Editor-in-Chief)（2020-）

  IEEE Transactions on Cybernetics（2005-2024）、International Journal of Humanoid Robotics（2008-）、Mathematical
  Foundations of Computing（2022-）、《控制理论与应用》（2012-）等刊物编委；

  中国指挥与控制学会自抗扰控制专委会 副主任委员（2022—）；

  中国教育发展战略学会人工智能与机器人专委会 副理事长（2025—）；

  中国自动化学会理事（2008-2018）、青年工作委员会主任委员（2001-2014）、智能自动化专委会副主任委员（2012-2022）、控制理论专委会委员（2013—）、专家咨询委员会委员（2015—2022）；

  上海市人工智能学会理事（2018—）。

  自然资源部 自然资源监测技术创新基地技术委员会委员 （2024—）'
