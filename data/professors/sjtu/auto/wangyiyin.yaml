bio_raw: '研究方向

  无线网络的信号处理，包括但不局限于宽带无线网络、水声网络

  无线通信信号处理

  无线网络协同定位与跟踪

  机器学习方法应用于无线网络

  工作经历

  2020 至今  上海交通大学 研究员

  2015-2019 上海交通大学 副教授

  2013-2014 上海交通大学 讲   师

  2012-2013 美国佐治亚理工大学 (Gatech) 博士后

  2006-2007 荷兰代尔夫特理工大学 (TU Delft) 研究助理

  教育背景

  2007-2011 荷兰代尔夫特理工大学（TU Delft） 博士

  2002-2005 复旦大学/荷兰代尔夫特理工大学 双硕士

  1998-2002 复旦大学 学士

  教学工作

  2026- 至今 本科生课程《水声通信原理》

  2021- 至今 本科生课程《数字信号处理》

  2019-2023 本科生课程《网络智能优化》

  2018-2020 本科生课程《计算机控制技术》

  2014-2019 本科生课程《网络优化》

  科研项目

  国家自然科学基金面上项目《基于OCDM的水声通信关键技术研究》，主持，在研，2024-2027

  国家自然科学基金面上项目《基于多载波测距的异步水声传感器网络节点机会式定位研究》，主持，结题，2018-2021

  国家自然科学基金重点项目《基于动态多源信息的水下移动目标协同监测》，参与，结题，2017-2021

  国家自然科学基金青年项目《基于射频干涉的无线传感器网络目标节点定位与跟踪》，主持，结题，2014-2016

  上海市经信委产学研项目《海底管线检测信息无线传输系统》，主持，结题，2015-2016

