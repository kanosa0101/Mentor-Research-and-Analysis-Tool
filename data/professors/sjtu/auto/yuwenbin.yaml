bio_raw: '研究方向

  海洋智能信息系统，图像目标识别与测量跟踪，多源信息融合，医工交叉

  工作经历

  2016/08-2018/09，上海交通大学，仪器科学与工程系，博士后，合作导师：崔大祥

  2018/08-2019/12，上海交通大学，自动化系，助理研究员

  2019/12-至今，上海交通大学，自动化系，副研究员

  教育背景

  2010/09-2016/06，上海交通大学，自动化系，博士

  2006/09-2009/06，山东大学，控制理论与工程学院，硕士

  教学工作

  计算机控制技术及应用，48课时

  数字信号处理技术及应用，32课时

  科研项目

  1. 国家自然科学基金面上，面向海洋搜救的弱感知环境下多源信息融合的动态跟踪测量，2024/01-2027/12,50万，主持

  2.上海交通大学“深蓝计划”面上项目，船载光学目标识别与跟踪系统，2020/08-2022/07,50万元，主持

  3. 专用装备研制项目，某型测量系统研制，2020/10-2022/1，1626.92万元，参与

  4. 专用装备研制项目，某型噪声测量系统研制，2018/10-2029/3，168万元，参与

  5.上海交通大学“深蓝计划”重点项目，极地水/沉积物界面长周期智能观测平台，2020/08-2022/07，120万元，参与

  6.上海电气横向项目，水冷壁壁厚检测上位机软件开发，2021/10-2021/12，19.96万元，主持

  7.上海市自然科学基金探索类，体域网实时心电自适应无线传输技术，2019/6-2021/5，20万元，主持

  8.国家自然科学基金青年，体域网心电自适应压缩传输与诊断可靠性研究，2019/01-2021/12，24万元，主持

  9.科技部重点研发计划子课题，机器人操作系统及开发环境研究与应用验证，2017/12-2020/11，37.8万元，主持

  10.国家级科技部重点研发计划，柔性快速精准组装系统， 2019/06-2022/05，40万，子课题负责人

