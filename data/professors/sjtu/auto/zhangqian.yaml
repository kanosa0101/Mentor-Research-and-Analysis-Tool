bio_raw: '研究方向

  疾病的早期预警与监测；纳米药物递送载体的构建及肿瘤诊断与治疗

  工作经历

  2015年毕业于德国Philipps-Universität Marburg并获得理学博士学位，指导老师Wolfgang J. Parak 教授。2016-2017年在电院崔大祥教授课题组从事博士后研究，2018-2022年留校担任助理研究员，2023年晋升为副研究员，博士生导师。

  科研项目

  1. 2023.01-2026.12，国家自然科学基金面上基金，52万元，主持，在研；

  2. 2022.04-2025.3，上海市“科技创新行动 计划”面上项目，20万，主持，在研；

  3. 2020.01-2022.12，国家自然科学基金青年基金，20.5万元，主持，已结题；

  4. 2019.05-2021.4，上海市“科技创新行动 计划”青年科技英才扬帆计划，20万元，主持，已结题；

  5. 2018.01-2020.12  上海交通大学科研启动基金，20万元，主持，已结题。

  研究成果

  近年来主要致力于多种无机纳米材料的可控制备与性能研究，纳米药物递送载体的研发，以实现MRI/NIR介导下的肿瘤多手段治疗。申请人近年来发表SCI论文50余篇，其中以第一/通讯作者发表SCI论文17篇，ESI高被引论文3篇，他引3200余次，H-index
  29，参与编写中英文书籍2本，授权专利3项。

  荣誉奖励

  2019上海市“科技创新行动计划”青年科技英才扬帆计划获得者

  荣获“上海职工劳动和技能竞赛”三等奖（5/5）

  学术任职

  1. 中国抗癌协会纳米肿瘤学专业委员会会员

  2. 国际期刊 J. Funct. Biomater.客座编辑

  3. 担任ACS Nano、Theranostics、Biomaterials等杂志审稿人'
