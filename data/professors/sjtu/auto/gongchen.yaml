bio_raw: '研究方向

  1）弱监督学习、面向开放场景的机器学习与数据挖掘

  2）大模型及智能体的高效训练、推理、进化

  3）可信图联邦学习

  招生期望：

  1）真正热爱科研，有兴趣钻研，勇于接受挑战，有志于在基础研究或工程技术领域做出高水平成果；

  2）数学基础好、编程能力强、英语功底扎实、擅于口头及书面表达

  3）加分项：有前期科研经历（高水平论文发表、学术竞赛获奖、专利/软著申请、实际项目经历等）

  工作经历

  2016.07-2026.07：南京理工大学 计算机科学与工程学院，教授、博导

  2026.07-今：上海交通大学 自动化与感知学院，教授、博导

  教育背景

  2007.09-2010.06：华东理工大学，工学学士

  2010.09-2016.05：上海交通大学，工学博士

  2014.07-2017.06：悉尼科技大学，工学博士

  教学工作

  研究生《数字图像处理》课程，秋季学期

  常年指导博士生、硕士生及优秀的本科科研实习生

  科研项目

  中组部国家级青年人才计划项目

  国家自然科学基金重点项目、面上项目、青年项目、专项项目

  上海市市级科技重大专项项目——“通用人工智能大模型基础研究”专项

  华为、蚂蚁、腾讯等企业合作项目

  研究成果

