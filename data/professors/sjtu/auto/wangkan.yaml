bio_raw: '研究方向

  即时诊断新技术及其配套智能设备的研发

  工作经历

  2016- 至今， 上海交通大学电子信息与电气工程学院 副研究员

  2014-2015，上海交通大学电子信息与电气工程学院 助理研究员

  2011-2014，上海交通大学微纳科学技术研究院 助理研究员

  2008-2011，上海交通大学微纳科学技术研究院 博士后

  教育背景

  2005-2008，第四军医大学，生物医学工程专业 博士

  2002-2005，第四军医大学，生物医学工程专业 硕士

  1997-2001，西安电子科技大学，计算机及其应用专业 学士

  科研项目

  主持国家科技部重点研发计划子课题，国自然面上、青年基金、上海交大医工交叉基金、企事业横向课题等多项重大科研项目。授权发明专利13项，国际专利1项，软件著作权6项。

  研究成果

  围绕国家973项目“应用纳米技术解决胃癌预警与早期诊断中的关键科学问题”,863重点课题和传染病重大专项等课题,主要研究方向包括：

  1）基于纳米技术的体外快速检测新方法及其配套设备的研制；

  2）可穿戴式传感芯片的研制；

  3）人工智能辅助体外诊断的算法研究。

  学术任职

  Sensors期刊学术编辑

  中国微米纳米技术学会高级会员

  中国生物医学工程学会高级成员

  中国抗癌协会纳米肿瘤分会成员

  中国生物材料学会青年委员会成员'
