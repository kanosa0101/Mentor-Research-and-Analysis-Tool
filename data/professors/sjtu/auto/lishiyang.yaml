bio_raw: '研究方向

  声学测量及仪器、压电传感器和超声换能器研究、智能检测技术、功率超声、海洋仪器等

  工作经历

  2025/04-至今,上海交通大学自动化与感知学院

  ,海底科学与划界全国重点实验室，副教授，

  博士生导师/硕士生导师

  2016/01-

  2025/04

  ,上海交通大学电子信息与工程学院仪器科学与工程系,副教授

  2013/08-2016/01,上海交通大学电子信息与工程学院仪器科学与工程系,助理研究员

  2012/08-2013/08,美国宾夕法尼亚州立大学,访问学者

  2009/01-2012/08,上海交通大学电子信息与工程学院仪器科学与工程系,助理研究员

  教育背景

  2008/09  获上海交通大学仪器科学与工程系测试计量技术及仪器专业博士学位

  2005/07  获郑州大学电子工程系电路与系统专业硕士学位

  教学工作

  声学检测  研究生课程

  生物医学信息检测与智能诊疗仪器 本科生课程

  科研项目

  2025年联合创新基金项目，主持

  产学研项目, 高性能数据采集

  ，主持

  2021-2024年深蓝计划重点项目，主持

  产学研项目, 高频声学探测

  ，主持

  产学研项目,高精度同步采集与传输系统，主持

  产学研项目,压电加速度传感器研发,主持;

  产学研项目,气体超声流量计研发,主持;

  中科院上海硅酸盐所合作项目,热释电红外探测器在气体探测中的关键电路设计与开发,主持;

  国家自然科学基金项目面上项目,高效低压驱动的压电单晶面切模式超声电机构造机理及多场耦合设计方法研究,主持;

  哈尔滨工业大学合作项目,超声伺服系统设计及研制,主持;

  教育部留学回国人员启动基金, 第48批,基于单晶面切模式的低压高效旋转超声电机的构造理论和技术,主持;

  产学研项目,大功率超声波发生器研制,已结题;

  上海市计量测试技术研究院合作项目,微振幅低频振动测量开发, 已结题,主持;

  国家重点实验室开放课题基金,低压高效的单晶面切直线超声微电机的设计优化与大功率下的特性研究,已结题, 主持;

  产学研项目,叠置双通道流体旋转接头测试台电气测控系统, 已结题,主持;

  产学研项目：汽车燃油液位传感器抗腐蚀能力研究与提高,已结题,主持;

  国家自然科学基金仪器科学专项,可植入搏动式超声致动血泵关键技术基础研究, 已结题, 参加;

  国家自然科学基金项目面上项目,人工心脏辅助超声致动血泵数学建模与温升控制,已结题,参加;

  上海市浦江人才计划,超声致动压缩性心脏辅助可行性研究,已结题,参加;

  863国家高科技项目,多频驱动多谐振超声电机,已结题,参加;

  国家自然科学基金项目面上项目,超声柔性致动压缩性人工心脏辅助器件基础研究,已结题, 参加。

  研究成果

  作为项目负责人先后主持国家自然基金面上项目、教育部留学回国人员启动基金、深蓝计划重点项目、联合创新基金和国家重点实验室开放基金等项目;主持完成产学研、企业合作项目二十多项;作为主要科研人员先后参与7项国家自然科学基金项目和2项上海市项目,其中包括5项国家自然科学基金项目、1项863国家高科技项目、1项国家自然科学基金重大仪器专项等项目,并取得了多项成果,已发表学术论文75篇,其中第一作者和通讯作者SCI论文24篇,申请和参与发明专利13件。

  近年来,独立指导硕士研究生已发表多篇SCI文章：

  王宇杰,2022-2025,发表1篇SCI文章（SCI期刊）

  郑佳,2019-2021,上海市优秀毕业生，发表2篇SCI文章（SCI因子为4.29和3.89）

  郭荣静,2016-2018,发表2篇SCI文章（SCI因子分别为3.0和2.4）,1篇核心期刊,1项专利。

  李唐安 ,2016-2018,发表1篇EI期刊文章,1篇会议论文,1项专利

  孙轩 ,2016-2018,发表1篇SCI文章（SCI因子为2.6）

  林銮,2017-2019,发表1篇SCI文章（SCI因子为2.4）,1篇EI期刊文章,一项专利

  欢迎测控技术与仪器、电子等电类相关专业同学报考或参与实验室课题工作。

  学术任职

  中国声学学会会员,担任Sensors and Actuators、Ultrasonics 等SCI期刊审稿人。'
