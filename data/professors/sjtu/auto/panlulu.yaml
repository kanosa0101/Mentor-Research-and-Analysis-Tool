  3. H. Shao, L. Pan, M. Mesbahi, Y. Xi, D. Li. Distributed Neighbor Selection in
  Multi-agent Networks.

  IEEE Transactions on Automatic Control

  , 68(11):6711-6726, 2023.

  4. C. Wang, L. Pan, H. Shao, D. Li, Y. Xi. Characterizing bipartite consensus on
  signed matrix-weighted networks via balancing set.

  Automatica

  , 2022, 141, 110237.

  5. L. Pan, H. Shao, M. Mesbahi, D. Li, Y. Xi. Cluster consensus on matrix-weighted
