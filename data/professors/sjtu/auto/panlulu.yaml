bio_raw: '研究方向

  网络系统控制、学习、优化与博弈

  教学工作

  多智能体系统导论 (AU7036)

  科研项目

  1.   国家自然科学基金（面上），符号矩阵权重网络多智能体系统的协同控制理论及其在分布式隐私

  保护算法设计中的应用，2026-2029. （主持）

  2.  国家重点研发计划项目，流程行业动态风险智能管控共性关键技术研究，2024-2027. (子课题负责人)

  3.  2019 年度上海市“超级博士后”资助 （主持）

  4.  国家自然科学基金（青年），矩阵权重网络上多自主体系统的领航-跟随控制研究，2022-2024. （主持）

  5.  国家自然科学基金（面上），混杂大规模系统分布式预测控制综合设计方法研究，2020-2023. （参与）

  6.  上海市自然科学基金，基于类脑学习机理的决策网络及算法研究，2019-2022.（参与）

  研究成果

