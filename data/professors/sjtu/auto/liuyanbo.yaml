bio_raw: '研究方向

  主要参与的项目有2U/3U车载计算平台设计、车载采集监控系统、北斗车载控制系统、车载电子控制系统，教育部产学研华为云智能驾驶开发设计、教育部产学研无人驾驶课程开发、教育部产学研5G车路协同开发等项目。发表EI、SCI、中文核心检索文章50余篇、发明专利5篇、软件著作10篇，著有《智能网联汽车计算平台》《新能源汽车技术研究进展微探》，《电子控制技术》《智能无人系统定位与导航技术》（上下册）等教材。

  工作经历

  2011-2015 中国电子科技集团公司第三十二研究所 产品研发部门

  2017-2020 上海交通大学学生创新中心

  2020-2025 上海交通大学电院教学发展与学生创新中心

  2025-至今  上海交通大学自动化与感知学院

