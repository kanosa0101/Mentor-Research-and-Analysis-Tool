bio_raw: '研究方向

  无机纳米材料可控制备与应用

  工业废固/废液有价元素资源化利用

  科研项目

  主持国家自然科学基金重大研究计划培育项目、自然科学基金面上项目和青年科学基金项目等，参与国家重大研究计划、国家高技术研究发展计划和国家自然科学基金仪器专项等项目研究。

  研究成果

  在NPG Asia Materials、Journal of Materials Chemistry A、Theranostics和Nano Energy等期刊发表论文100余篇。

  1. Xuan Du, Zhanhong Wang,* Bin Zheng, Shanlin Shi, Wei Xu, Shuo Wang, Peng Shi,
  Tao Zhou and Guo Gao*, Synthesis of battery-grade FePO42H2O using high-pressure
  hydrolyzed precipitates of cobalt–iron alloy acid solution, Chemical Communications,
  2024, 60, 13706–13709；

  2. Tao Zhou, Guo Gao*, V2O5-based cathodes for aqueous zinc ion batteries: Mechanisms,
  preparations, modifications, and electrochemistry, Nano Energy,2024, 127, 109691；

  3. Xuan Du, Guiying Xu, Chengyao Zhu, Tao Zhou, Peng Shi , Guo Gao*, Copper/cobalt
  metal-organic framework composites for advanced anode material of lithium-ion battery,
  Journal of Energy Storage, 2024,89, 111863;

  4. Tao Zhou, Guo Gao*, Pre-intercalation strategy in vanadium oxides cathodes for
  aqueous zinc ion batteries: Review and prospects, Journal of Energy Storage, 2024,84,110808;

  5. Tao Zhou, Xuan Du, Guo Gao*, Revealing the role of calcium ion intercalation
  of hydrated vanadium oxides for aqueous zinc-ion batteries, Journal of Energy Chemistry,
  2024,95, 9–19.

  荣誉奖励

  上海交通大学SMC晨星优秀青年教师，上海浦江人才'
