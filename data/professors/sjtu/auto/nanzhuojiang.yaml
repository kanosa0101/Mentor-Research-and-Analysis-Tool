title: 助理研究员
email: nanzhuojiang@sjtu.edu.cn
bio_raw: '研究方向

  主要研究方向为新型光学传感器及精密检测技术、工业互联网传感器及智能评测方法。发表论文30余篇，入选中国仪器仪表学会优秀博士论文激励计划，主持/参与国家自然基金、省部级及企业课题10余项。成果获中国仪器仪表学会技术发明一等奖、中国科协优秀科研仪器案例、中国传感器创新创业大赛一等奖、上海市仪器仪表学会科技进步一等奖等。担任中国仪器仪表学会专家库成员、中国图象图形学学会视觉检测专委会委员、ICSA（大会杰出贡献奖）、UPINLBS等国际会议分会主席、“挑战杯”全国决赛评委、IEEE
  Transactions on Industrial Informatics、Robotics and Autonomous Systems、Measurement等期刊审稿人、《海洋工程装备与技术》编委、《计测技术》青年编委、《PhotoniX》、《激光与红外工程》、《自动化仪表》等期刊客座编辑。

  研究生招生情况：博士生、硕士生。

  欢迎对“多维光学感知、传感信息融合、AI+传感器”方向感兴趣的同学联系，一起做点有意思的研究。

  工作经历

  2024.07-今 上海交通大学 助理研究员

  教育背景

  2018.9-2024.6 上海交通大学 仪器科学与技术 工学博士

  2015.9-2018.6 上海大学 机械电子工程 工学硕士

  2011.9-2015.6 上海大学 测控技术与仪器 工学学士

  教学工作

  本科生教学：《智能感知系统设计与实践》、《工程实践与科技创新II》

  研究生教学：《计量测试工程实践》、《学术报告与研讨》

  科研项目

  基于空间光度学的结构激光三角测量理论模型与精度优化方法（国家自然基金面上项目）

  高能量高重复频率矩形均匀合束激光脉冲喷丸系统-子课题“人机交互与控制子系统”（国家自然科学基金重大仪器专项）

  高精度高稳定激光位移传感器关键技术攻关（上海市教委、上海航天等）

  卫星姿态“超高精度、超高指向”双模态位移测量系统（服务“羲和号”太阳科学探测卫星、“四维高景”等系列卫星）

  一体式航天超大口径旋转结构件控制精度保证技术

  工业互联网智能传感器及装备协同控制（多维信息感知、具身感知、工业多智能体协同规划等）

  （如有兴趣，欢迎交流，此处不一一列举科研项目）

  研究成果

