  optimization method of rough surface adapted small rectangular LD laser source based
  on combination of Powell prism and cylindrical lenses [J].Measurement, 2023: 112859

  Zhuojiang Nan, Wei Tao, Hui Zhao. Automatic optical structure optimization method
  of the laser triangulation ranging system under the Scheimpflug rule[J]. Optics
