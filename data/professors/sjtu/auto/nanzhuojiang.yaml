  Zhuojiang Nan, Wei Tao, Hui Zhao. Development of a Small Size Laser Triangulation
  Displacement Sensor and Temperature Drift Compensation Method[J]. Measurement Science
  and Technology,2021,32(9):095107

  Zhuojiang Nan, Wei Tao, Hui Zhao. Laser pointing error analysis and compensation
  method of low-power laser diode source applied to triangulation ranging system[J].
