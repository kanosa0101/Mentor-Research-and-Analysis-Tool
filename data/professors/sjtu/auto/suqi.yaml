bio_raw: '研究方向

  人机交互和增强智能

  ：

  聚焦人类与智能机器在感知、认知、决策和协作过程中的深度融合，研究人机协同中的信息理解、意图识别、动态适应与互补增强机制。结合人工智能、机器学习与行为建模方法，构建具备理解、学习、适应和协同能力的新一代人机混合智能系统，为复杂环境下的高效决策、协同作业与创新创造提供理论基础和技术支撑。

  复杂网络和复杂系统

  ：面向自然、社会与工程技术领域中的多尺度网络化系统，系统研究复杂网络的结构异质性、动态演化规律与非线性耦合机制，揭示局部交互与宏观涌现之间的内在联系。进一步发展可解释、可预测和可调控的复杂系统分析与控制理论，为大规模网络系统的稳定运行、韧性提升和功能优化提供基础支撑。

  多智能体和群体智能

  ：围绕多智能体交互、协同决策与群体行为涌现，综合运用演化博弈、行为博弈和多智能体决策理论，研究社会、生物与技术系统中个体互动形成群体秩序与集体智能的基本机制。面向复杂任务与动态环境，构建可分析、可设计和可调控的群体协同与博弈优化框架，为智能社会、群体机器人和分布式智能系统的理性设计提供理论依据。

