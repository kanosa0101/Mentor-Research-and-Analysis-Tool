bio_raw: '研究方向

  智能仪器和智能在线装备

  工作经历

  1991-04至今 上海交通大学，仪器科学与工程系

  教育背景

  2005-02至2011-06，上海交通大学，仪器科学与工程系，博士

  1988-09至1991-02，上海交通大学，精密仪器系，硕士

  1984-09至1988-07，上海交通大学，精密仪器系

  科研项目

  企业委托，基于显微结构的纺织智能化研究，2020-07至2028年12月，1050万元，进行中

  科技部，国家重大科学仪器设备开发专项，2014YQ090709，跨尺度微纳米测量仪的开发与应用，2014-10至2018-09，400万元，结题，参与

  企业委托开发项目，压装装备和监控软件系统开发，2014-12至2017-12，350万元，结题，主持

  国家自然科学基金委员会，面上项目，31170968，面向胃肠道疾病诊疗的微型机器人与胃肠道内环境的相容性研究，2012-01至2015-12，60万元，结题，参与

  上海市科学技术委员会，重点项目，09DZ1907400，胃肠道多元医学信息无创诊查专用芯片研发，2009-10至2012-12，490万元，结题，参与

  国家自然科学基金委员会，面上项目，30570485，胃肠道动力和生理参数无创检测技术及胃肠功能数字化研究，2006-01至2008-12，27万元，结题，参与

  科技部，863计划项目，2002AA422110，油、气管道机器人实时探测系统关键技术及其实用化研究，2002-09至2003-08，50万元，结题，主持

  研究成果

  专利：

  一种光学快门式非调制红外测温系统及方法，授权号：ZL 2019 11282713.0

  一种利用透明二维栅格板对工作台进行自校准的方法，授权号：201811222420.9.

  用于预测根管长度的方法及数据采集系统，授权号：201811221734.7.

  基于伺服电动缸大负载高速度精密运动控制的试验机，授权号：201710435856.5.

  一种基于FPGA实现伺服转角简谐运动的系统以及方法，授权号：201710470519.X.

  一种基于FPGA实现伺服转角叠加简谐运动的方法，授权号：ZL 2017 10453795.5

  光路切换装置及集成多个测头的微纳米测量系统，授权号：201510236070.1.

  荣誉奖励

  汽车零部件伺服压装关键技术与控制臂成套工艺装备， 中国汽车工程学会，科学技术进步奖，二等奖， 2019

  特殊环境下先进机器人检测装备及其应用， 教育部，技术发明奖， 一等奖，2011

  多参数检测微系统及其应用， 上海市人民政府， 技术发明奖， 二等奖，2009

