bio_raw: '研究方向

  研究内容包括：

  AI+医学图像分析+临床诊疗应用、医学影像AI智能诊断、AI辅助手术规划及临床决策、AI辅助的临床预后分析、医学可视化与三维重构等。

  目前具体的主要研究内容：

  (1) 智能医学影像分析及其临床应用:

  ---- 基于深度学习及先验知识的三维医学图像中人体器官的自动分割、三维建模与可视化；

  ---- 计算机辅助智能医学影像诊断技术及其临床应用（特定类型病灶、广泛类型病灶的有监督检测、分割）

  ---- 基于正常样本学习的医学影像中各类异常的自动检测 (计算机如何学习医生的影像读片能力？)

  ---- 基于影像组学及/或深度学习的临床问题预后分析: 基于回顾性数据的临床预后问题的白箱、黑箱分析

  (2) AI及大数据分析在临床诊疗流程中的集成应用，包括：

  ---- 小儿先天性心脏病/成人结构性心脏病的个性化精准治疗：疾病分型、术前手术规划、术中辅助、预后分析等

  ---- AI赋能数字化口腔诊疗：AI辅助的拔牙、种植、牙根切除、增生牙龈切除等的手术规划及导板设计及正畸等

  ---- AI辅助的产科智能诊断：FGR、胎盘植入、分娩出血等的智能诊断

  ---- 肺癌、肝癌、头颈癌等肿瘤的个性化精准诊疗：危及器官及肿瘤的AI分割、手术规划、预后分析等

  (3) 基于AI技术的胸腹部器官的外科手术的术前辅助手术规划、术中辅助及其临床应用：+3D 打印，+VR

  (4) 基于智能计算的医学可视化及三维重构技术及其临床应用

  ----体绘制可视化技术中三维图像的分类与传递函数设计问题；

  ----视觉激励的三维图像中隐边界曲面的自适应检测与重构方法研究 (多视觉机制的集成的应用)；

