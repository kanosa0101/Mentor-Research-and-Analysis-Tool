bio_raw: '研究方向

  招收2027级入学硕士及博士：(具身智能方向已招，目前意向大模型方向和工业检测多模态大模型方向）

  主要方向1：工业质检大模型（知识点涉及视觉、大模型和具身智能的融合，具体包括大模型强化学习, 知识库检索增强，router智能体调用，将具身智能算法应用于检测系统等具体方法和任务）

  主要方向2：将神经扩散模型（ode diffusion）应用于路径规划，机械臂控制（需要数学证明+仿真），具身智能的具体实现。

  任务及待遇：独立完成高水平论文及工程项目，优厚的助研补贴，优秀者可推荐实习及交换。

  组内代表论文：

  U2PL, CVPR 2022, 引用700次，硕士生1作。

  PFnet, CVPR 2020, 引用670次，硕士生1作。

  UniAD, NeurIPS 2022, 引用575次，硕士生1作。

  1）大模型时代的工业检测：具身质检员；

  2）大模型时代的工业机器人：具身操作员；

  3）基础科学问题: 神经动力学，神经常微分方程，脑启发的神经网络等

  工作经历

  2020.10~至今   上海交通大学  Shanghai Jiao Tong University

  电子信息与电气工程学院自动化系智能无线网络与协同控制中心，讲师、副教授、教授

  2016.6~2020.9   上海交通大学 Shanghai Jiao Tong University

  机械与动力工程学院，智能制造与信息工程研究所讲师。

  教育背景

  2012.8~2016.5   香港中文大学 the Chinese University of Hong Kong

  机械与自动化系，计算智能实验室，工学博士, 导师：王钧教授（神经网络先驱奖）

  2008.8~2012.7   清华大学 Tsinghua University

  微机电系统工程，工学学士。

  数学与应用数学，理学学士(第二学位）

  2011.7~2011.9   香港中文大学机器人实验室

  初级研究助理Junior research assistant，合作导师：徐扬生院士

