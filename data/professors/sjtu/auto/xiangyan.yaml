bio_raw: '研究方向

  北斗/GNSS卫星高精度、高可信定位方法研究

  工作经历

  2019- 至今， 上海交通大学电子信息与电气工程学院

  2018-2019，美国三星半导体

  2015-2018，加拿大卡尔加里大学

  2011-2014，中国科学院大学

  科研项目

  上海市科委，基于下一代北斗混合星座的可信PNT关键技术，课题三主持，2025-2027

  国家自然科学基金青年项目，面向高精度定位的扰动下斜路径电离层延迟建模和增强机制研究，主持，2024-2026

  国家重点研发计划，广域交通服务可追溯技术，课题二子课题负责人，2023-2025

  智慧地球重点实验室基金，卫星弹性功率监测及可信定位影响分析，主持，2024-2025

  国家自然科学基金基础科学中心开放基金，面向视惯具身导航的变尺度时空同步方法研究，主持，2024-2026

  国家自然科学基金重点项目，通导遥物理层融合理论与方法，参与，2023-2027

  上海市科委，基于北斗多系统实时精密单点定位算法及嵌入式一体机研究，主持，2020-2022

  国家电网，基于北斗系统多模多频高精度增强关键技术研究，主持，2019-2020

  研究成果

  上海市浦江人才，长期从事和面向研究领域包括：北斗/GNSS定位导航的算法研究和应用、复杂电离层效应/遮挡环境下实现快速稳定的精密定位、多模态传感器融合定位、大数据和大模型应用等。

  针对北斗/GNSS卫星定位中复杂环境下信号误差特性多变的问题，从服务端误差时空特性出发，提出了1）面向卫星高精度定位的电离层斜路径格网建模方法；2）基于场景化特性识别的辅助增强定位方法，进而实现了用户端快速模糊度固定的高精度、高可信定位。迄今为止以第一作者在知名学术期刊和会议发表论文近20篇，国内外知名期刊常任审稿人。

  欢迎导航定位、空间科学、应用数学、人工智能方向的本科生、研究生、博士生、博后等联系。Visiting and foreign PhD students are
  very welcome!

  学术任职

  美国导航协会（ION）会员

  中国卫星导航协会 青年委员

  国际GNSS服务电离层 组员

  IEEE 会员'
