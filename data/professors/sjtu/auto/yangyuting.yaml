  研究成果

  杨玉婷，长聘教轨副教授，博士生导师，2015年博士毕业于浙江大学生物医学工程与仪器科学学院，并先后在上海交通大学和美国亚利桑那州立大学开展博士后研究工作，2020年加入上海交通大学电子信息与电气工程学院，主要从事光学成像检测、微纳传感、体外诊断等技术和仪器系统的开发与研究。主持国家自然科学基金重大科研仪器研制项目子课题、“十四五”国家重点研发计划项目子课题、国自然面上、青年项目等多项国家级纵向项目及企业横向项目。课题组近年来在国际高水平期刊发表文章多篇，包括2篇PNAS、ACS
  Nano、Nano Letters、Advanced Science等，获得中国光学工程学会传感技术与成果展“优秀成果”奖、 2023年“Wiley威立中国开放科学高贡献作者”等荣誉；授权美国发明专利3项，申请/授权国内发明专利20余项，其中多项专利已转化，与企业就相关技术展开合作技术开发，并与上海交通大学附属瑞金医院、第六人民医院、仁济医院等多家医院合作开展临床应用研究，积极探索技术成果的转化与应用。多次指导研究生、本科生在国家级、省市级等科创竞赛中获奖，欢迎具有但不限于光学、生物医学、电子信息、自动化等多学科背景的同学加盟课题组！

  目前的研究主要包含：

  表面等离子体成像技术及其生物医学检测应用研究

  体外诊断技术研究

  计算成像技术及小型化医疗仪器开发

