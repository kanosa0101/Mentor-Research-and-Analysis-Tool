bio_raw: '研究方向

  多模态融合感知；仿生多模态机器人

  26级研究生招生：

  2026年9月入学，

  已招满

  27级研究生招生：

  2027年9月入学，开放申请中，研究方向

  Multimodal Awareness

  ，Multimodal Biomimetic Robotic

  欢迎感兴趣的同学咨询！

  28级研究生招生：

  2028年9月入学，开放申请中。

  此外，欢迎本科生同学报名参加实验室项目或实习。

  工作经历

  2019.10 — 至今，上海交通大学电子信息与电气工程学院→自动化与感知学院，历任 助理/副研究员（硕士 & 博士生导师）

  2017.12 — 2020.01，斯坦福大学Department of Engineering—BDML实验室，博士后

  2016.06 — 2017.12，上海交通大学电子信息与电气工程学院—计算机科学与技术流动站，师资博士后

  教育背景

  上海交通大学 机械与动力工程学院

  教学工作

  承担《python程序设计》、《

  时空智能技术前沿探索

  》、《

  学术报告与研讨会

  》、《

  工业测控技术与系统

  》、《

  微纳制造与微电子机械系统

  》教学

  科研项目

  部分主持项目信息如下：

  方向一：多模态融合感知相关（Multimodal Awareness）

  [1]  航空电子高速互联信号XXX，2025-2026，主持

  [2]  基于因果增强大语言模型的具身感知关键技术，2025-2026，主持

  [3] 利用XRM无损扫描评估BGA焊球可靠性评估方法研究，2022-2023，主持

  [4] 融合PSG多通道数据的端到端儿童睡眠呼吸障碍智能诊断方法研究，2021-2023，交大方主持

  [5] 智慧机场特种阀井盖感传控一体化系统开发，2024-2025，主持

  [6] XJK-DL-2项目委外咨询多目标优化（结构、热）项目，2023-2024，主持

  方向二：仿生多模态机器人相关（Multimodal Biomimetic Robotic）

  [1] 基于图文多模态融合推理的生物激励设计方法研究，2024-2027，主持

  [2] 基于加油车测试平台的数字化关键技术研究及应用，2024-2025，主持

  [3] 基于多模态信息融合的仓储物流机器人智能抓取系统，2023-2024，主持

  [4] 面向生物激励设计的动态知识融合与迁移类推方法研究，2019-2022，主持

  [5] 生物领域知识激励的功能知识建模与类推方法研究，2017-2019，主持

  研究成果

  围绕研究方向，先后获批并主持国家自然科学基金青年、面上、JKW基金等国家级课题多项，上海市科委项目、经信委及其它省、市级和企业横向课题12项，已发表SCI等论文50余篇，授权/公开发明专利18项，软件著作权10项，出版学术专著1部，参编2部，此外，参与国家重点研发计划、科技部创新方法专项、国自然基金重点、国家重大仪器专项等重点/重大课题10余项。成果在上海工博会、深圳高交会展出并获“优秀科研成果奖”

  近两年累计承担本科、研究生阶段7门课程教学，授课人数400余人

  指导学生参加机器人ICRA ARC挑战赛并获优胜奖、挑战杯揭榜挂帅一等奖*2项、羽嘉计划优秀结题1项、大创优秀结题2项等

  指导研究生获潘文渊奖学金*2、未来之星奖学金、SCSK奖学金等奖学金以及校优秀毕业生

  荣誉奖励

  2023-2025 聘期考核优秀

  2025年 优秀班主任基金

  2020 上海市浦江人才A类'
