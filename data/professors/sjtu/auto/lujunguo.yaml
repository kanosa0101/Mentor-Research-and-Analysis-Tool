bio_raw: '研究方向

  智能机器人及其系统，无人驾驶（无人车，无人船，无人飞机等）和远程驾驶，人形机器人，视觉测量与图像图形处理，分数阶控制系统，混沌与复杂网络研究

  工作经历

  2013.12--- 至今         上海交通大学自动化系                            教授（博导）

  上海交通大学智能网联电动汽车创新中心  研究骨干

  系统控制与信息处理教育部重点实验室    研究骨干

  2005.08--- 2013.12   上海交通大学自动化系       副教授

  2009.08--- 2010.09    纽约城市大学电子工程系 博士后研究员

  2008.11--- 2009.02    香港城市大学电子工程系 研究员（Research Fellow）

  2004.10--- 2005.03   香港城市大学电子工程系  副研究员（Senior Research Associate）

  2003.10--- 2005.08   上海交通大学自动化系       教师

  2001.10--- 2003.09   上海交通大学自动化系       博士后

  教育背景

  1997.09--- 2001.09    南京理工大学自动化系博士生

  1993.09--- 1997.07     南京理工大学自动化系本科生'
