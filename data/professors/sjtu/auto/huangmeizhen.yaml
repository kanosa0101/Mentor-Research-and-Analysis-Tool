bio_raw: '研究方向

  光谱仪器与光谱分析、光学传感与光学检测、生物医学光子技术等。

  工作经历

  1987年8月至1991年9月在福建省长汀师范学校任讲师

  1994年9月至2003年7月在福州大学电子科学与应用物理系任讲师、副教授

  2001年9月至2003年7月在上海交通大学物理系从事博士后研究

  2003年8月起任上海交通大学副教授、研究员

  教育背景

  1987年本科毕业于

  福建师范大学物理系物理专业

  1994年硕士毕业于福建师范大学物理系光学专业

  2001年博士毕业于浙江大学光电信息工程系光学工程专业获博士学位

  教学工作

  《现代光学测试技术》，研究生课程

  《海洋光学基础》，本科生课程

  科研项目

  “基于GO/NCF富集和机器学习算法的土壤环境多环芳烃快检研究”，国家自然科学基金面上项目(62175150)，主持，2022.01-2025.12

  “基于擦拭型基底SERS的果蔬农药残留快速检测研究”，国家自然科学基金面上项目(61775133)，主持，2018.01-2021.12

  “海洋剖面多参数光学传感器及应用技术研究”，上海交通大学“深蓝计划”重点项目（SL2021ZD103），主持，2021.12-2024.12

  “多光纤光谱仪样机研发”，企业项目，主持，2024.04-2024.12

  “血容量近红外检测方法和血容计研发”，企业项目，主持，2024.03-2025.02

  “深远海北斗海-气耦合实时监测浮标研制及应用示范”，广东省重点领域研发计划(2020B1111020001)，课题负责，2020.06-2025.06

  “便携式拉曼光谱仪研发”，国家重大科学仪器设备开发专项 (2012YQ180132-01)，课题负责，2012.10-2017.04

  “薄膜表面微细结构直接热辊连续成形的介观尺度效应及控形控性新方法”，国家自然科学基金重点项目（51235008），课题负责，2013.01-2017.12

  “光波导中生物样品拉曼光谱增强的研究”，国家自然科学基金面上项目（61178083），主持，2012.01-2015.12

  研究成果

  主持/承担国家重大科学仪器设备开发专项、国家自然科学基金重点/面上项目、省市科技计划项目等30多项科研项目，近年在

  Analytical Chemistry

  ，

  Journal of Hazardous Materials, IEEE Transactions on Instrumentation and Measurement,
  Acs Sensors, Sensors and Actuators B

  ，

  Spectrochimica Acta Part A: Molecular and Biomolecular Spectroscopy

  ，

  Science of the Total Environment, Carbohydrate Polymers

  ，

  Optics Express

  ，

  Journal of Raman Spectroscopy

  ，

  Infrared Physics & Technology, Analytica Chimica Acta，光学学报

  等发表学术论文100多篇，授权发明专利30多项，在光谱探测分析方法与仪器研制、光学传感探测和光电探测器件物理等研究中取得系列成果。

  荣誉奖励

  2017年获上海交通大学“三八红旗手”。

  学术任职

  中国仪器仪表学会分析仪器分会光谱仪器专委会副秘书长

  中国光学学会光电技术专委会委员

  中国海洋学会海底科学分会委员'
