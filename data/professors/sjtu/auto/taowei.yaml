bio_raw: '研究方向

  激光传感技术, 光学精密测量技术。

  工作经历

  2018.12-至今 上海交通大学 研究员

  2006.8-2018.12 上海交通大学 副教授

  2003.4-2006.8 上海交通大学 讲师

  教育背景

  1993.9–1997.7, 哈尔滨工业大学, 机械电子工程, 学士

  1997.9–1999.7, 哈尔滨工业大学, 精密仪器及机械, 硕士

  1999.9–2003.3, 哈尔滨工业大学, 精密仪器及机械, 博士

  科研项目

  "机器人环境建模与定位导航综合平台构建与应用示范”,科技部重点研发计划课题;

  "高能量高重复频率矩形均匀合束激光脉冲喷丸系统”,国家自然科学基金重大科研仪器专项;

  "基于空间光度学的结构激光三角测量理论模型与精度优化方法”,国家自然科学基金面上项目;

  "高稳定激光位移传感器”,上海航天科技攻关项目;

  "激光测厚校准系统”,宝武装备智能科技攻关项目;

  研究成果

  研究工作致力于探索极致测量精度,解决高精度光学测量及传感器产品研发中的瓶颈问题。主持国家重点研发计划、自然科学基金、省部级及企事业单位委托项目50余项,发表高水平论文100余篇,获国家发明专利30余项，研究成果已成功应用于高铁、机场、卫星、智能制造等领域。研发高精度激光位移传感器产品,为智能制造领域的精密测量提供关键元器件。

  荣誉奖励

  中国仪器仪表学会技术发明一等奖。

  上海市产学研合作优秀项目一等奖。

  上海交通大学教学成果奖特等奖。

  学术任职

  中国仪器仪表学会传感器分会理事

  中国仪器仪表学会机械量测试仪器分会理事

  中国仪器仪表学会精密机械分会副秘书长'
