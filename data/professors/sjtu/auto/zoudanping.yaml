bio_raw: "研究方向\n- 课题组隶属于\n感知与导航研究所\n，聚焦\n视觉传感驱动\n的\n空间计算与具身智能\n，研究方向主要包括：\n视觉自主定位、\n\
  3D视觉感知\n轻量化自主协同无人集群\n- 课题组拥有600平米配备亚毫米级高精度动捕系统的无人系统试验场、高端GPU显卡、机械臂、移动底盘、四足机器人等各类实验设备，实验条件优越，长期欢迎科研实习、课题合作研究、竞赛组队，欢迎感兴趣、有激情且动手能力强的同学联系\
  \ (dpzou@sjtu.edu.cn)。\n- 视觉与智能系统课题组主页：“\nhttps://drone.sjtu.edu.cn\n”\n工作经历\n2013月至今\
  \ 上海交通大学，先后担任助理研究员/硕士生导师、副教授/博士生导师、研究员/博士生导师\n2010-2013 新加坡国立大学 博士后研究员\n教育背景\n2010年获复旦大学\
  \ 计算机应用技术博士学位\n2003年获华中科技大学 光信息科学与技术学士学位\n科研项目\n先后主持自然科学基金青年项目、面上等\n国家级科研项目7项\n\
  ，\n上海市科研项目2项\n，参与国家级项目2项。\n上海交通大学SEIEE·云智人工智能应用创新研究中心\n项目负责人。\n“智在飞翔”无人飞行器智能感知技术竞赛\n\
  ：\n2014年在徐氏校友基金支持下发起上海交通大学小型无人机技术挑战赛，2017年推广为全国赛事。竞赛的目的是将人工智能技术赋能无人机，实现复杂环境下的自主穿越。赛事信息见网站http://drone.sjtu.edu.cn\
  \ ,“智在飞翔”微信公众号。\n研究成果\n课题组致力于面向\n资源受限的机器人、XR设备\n等轻量级智能系统的研究，聚焦\n视觉传感驱动的空间计算与具身智能\n\
  ，重点突破\n视觉自主定位、3D视觉感知、轻量化自主协同无人集群\n等关键技术，代表性成果以第一、通信作者发表于\nNature Machine Intelligence\n\
  IEEE Trans. on Patten Analysis and Machine Intelligence\nIEEE Trans. on Robotics\n\
  IEEE RAL\nICCV, CVPR, ICRA, IROS\n等人工智能与机器人权威学术期刊与会议。\n成果归类列表如下：\n-\n视觉自主定位\n面向多机器人群的协同视觉\n\
  SLAM\n系统\n(CoSLAM)\n[1]\n结构化环境下的视觉\nSLAM\n（\nStructSLAM\n）\n[9] 与\n视觉惯性里程计\n(StructVIO)\n\
  [7]\n基于文本标识的语义\nSLAM (TextSLAM)\n[2]\n[12]\n面向移动机器人低成本视觉\n-GNSS-\n惯性\n-\n轮速机融合\n\
  SLAM (Ground-Fusion)\n[13]\n与数据集\n(M2DGR)\n[14]\n轻量化跨视角关键点匹配特征增强器\n(FeatureBooster)\n\
  [17]\n- 3D\n视觉感知与规划\n双目\n+\n稀疏点云的稠密深度估计\n(Stereo-Lidar Fusion)\n[10]\n[11]\n面向恶劣视觉环境的长波红外双目相机稠密深度估计\n\
  (ThermoStereoRT)\n[15]\n基于结构先验的单目深度估计\n(StructDepth)\n[18]\n多实例目标点云配准\n(Multi-instance\
  \ point registration)\n[19]\n全向感知低重叠度多摄像头在线标定\n[16]\n基于单目视觉的主动\n3D\n重建\n(Active\
  \ 3D image modeling)\n[21]\n基于神经网络的局部规划器\n[22]\n与全局规划器\n[23]\n[24]\n-\n轻量化自主协同无人集群\n\
  轻量级端到端视觉自主协同高速避障飞行\n[3]\n基于光流的\nFPV\n单目视觉高速避障\n[4]\n无需建图与轨迹生成的\nMPC\n即时避障\n[5]\n\
  旋翼无人机自主导航仿真器\n[26]\n、面向可微分物理学习的无人机仿真器\n(Visfly)\n[6]\n针对不可微奖励的高效可微分物理训练方法\n(ABPT)\n\
  [25]\n双目视觉\n+\n超声避障系统\n[27]\n基于旋翼无人机动力学速度状态估计\n[28]\n[29]\n- 代码与数据\nhttps://github.com/SJTU-ViSYS\n\
