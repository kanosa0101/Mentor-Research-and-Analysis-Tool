  工作经历

  Research Statement

  During the past 20 years, I have made systematic contributions on the following
  areas:

  1. Bayesian Machine Learning (which is uncertainty aware and data efficient): Probabilistic
  Modeling and Approximate Inference Methods;

  2. Multiview/Multimodal Machine Learning: Theory, Methods and Applications.

  For future research, the following areas will be emphasized, which certainly will
  blend with the above expertise:

  1. Causal Inference, Reinforcement Learning, Commonsense Reasoning, Large Multimodal
  Model;

  2. Application: AI Generated Content, Embodied Intelligence, Robotics.

  Research Keywords:

  Sequential Data Modeling, Causal Reasoning, Multi-modal Learning,

  Multi-view Learning, Reinforcement Learning, Embodied Intelligence.

  个人简介/Biography

  个人简介：

  孙仕亮，上海交通大学教授。担任上海市计算机学会人工智能专委会主任，上海市图像图形学学会机器学习专委会主任。本科毕业于北京航空航天大学，博士毕业于清华大学，曾在University
  College London，Columbia University等海外高校从事访问研究。2011年至2023年在华东师范大学任职教授，2018年至2023年担任华东师范大学人工智能研究所常务副所长。目前担任上海交通大学大数据与人工智能实验室（PRML
  Research Group）负责人。入选国家级青年人才支持计划。主要研究方向为机器学习、人工智能。担任JMLR、IEEE TPAMI、自动化学报等国内外著名期刊编委（Associate
  Editor），国际期刊 Pattern Recognition 副主编（Associate Editor in Chief），国际期刊 Information
  Fusion 领域编辑（Area Editor）。曾任IEEE TNNLS、IEEE TITS、Pattern Recognition等国际期刊编委（Associate
  Editor）六年以上。曾获省部级自然科学奖一等奖、科技进步奖一等奖及中国自动化学会自然科学奖一等奖等重要奖项。迄今发表学术论文200多篇，2020年出版中文教材《模式识别与机器学习》（清华大学出版社），2019年、2023年、2026年共出版多源数据融合领域中英文专著三部。近年来带领团队在加强对人工智能基础算法和技术研究的同时，致力于面向国家和社会的核心需求和技术难题开展攻关。

  Biography:

  Shiliang Sun received the B.E. degree in Automation from Beijing University of Aeronautics
  and Astronautics, Beijing, China, in 2002 and the Ph.D. degree in Pattern Recognition
  and Intelligent Systems from Tsinghua University, Beijing, China, in 2007.

  He is a Professor with the School of Automation and Intelligent Sensing and the
  Head of the Pattern Recognition and Machine Learning Research Group, Shanghai Jiao
  Tong University, Shanghai, China. In 2004, he was entitled Microsoft Fellow. From
  2009 to 2010, he was a Visiting Researcher with the Department of Computer Science,
  Centre for Computational Statistics and Machine Learning, University College London,
  London, U.K. In 2014, he was a Visiting Researcher with the Department of Electrical
  Engineering, Columbia University, New York, NY, USA. From 2011 to 2023, he was a
  Full Professor at East China Normal University where he founded the Pattern Recognition
  and Machine Learning Research Group in 2007. His research results have expounded
  in 200+ publications at peer-reviewed journals and conferences, such as JMLR, IEEE
  TPAMI, IEEE TNNLS, ICML and NeurIPS, and multiple academic monographs and textbooks,
  such as Multiview Machine Learning, and Pattern Recognition and Machine Learning.
  He previously served as Associate Editor of IEEE Transactions on Neural Networks
  and Learning Systems, IEEE Transactions on Intelligent Transportation Systems, and
  Pattern Recognition for more than six years. He is currently serving as Associate
  Editor of IEEE Transactions on Pattern Analysis and Machine Intelligence, and Action
  Editor of Journal of Machine Learning Research.

