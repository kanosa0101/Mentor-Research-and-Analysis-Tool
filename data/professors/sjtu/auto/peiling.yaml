  研究成果

  主要从事融合感知与具身导航相关技术的研究。入选上海市浦江人才计划，省部级领军人才项目，全球前2%顶尖科学家榜单。主持国家科技重大专项项目、国家自然科学基金、上海市重点项目、上海市科技创新行动计划项目等项目共计30余项,已获授权发明专利35项，2018年牵头工信部行业标准“低速无人系统定位导航通用指标与测试方法”。

  在TPAMI、TII、TRO、TIE、TMC、SN、

  JIoT、

  TVT、

  TITS、

  TIM，CVPR、ICCV、AAAI、ICRA、IROS等刊物和会议总计发表学术论文以及著作100余篇,Google Citation为6000+,H-index
  40+。研究成果2010年在全球导航学术界与工业界知名的GPS World杂志作为封面专题（Cover story）进行介绍。指导Aalto大学研究生完成的研究成果在2012年再次被GPS
  World杂志选为封面专题, 指导Tampere University of Technology博士生获得2013年 ION(Institute of Navigation)优秀学生论文奖。Inside
  GNSS 杂志2013年3月封面专题The PNT Boom-Future Trends in Integrated Navigation将本人的研究成果----运动情境感知辅助个人导航列为未来集成导航十大方向。2010年IEEE/ION
  PLANS 优秀论文奖;2016年获得CSNC青年优秀论文奖;2018年获得IEEE UPINLBS Best Industrial Innovation Paper
  Award; 2019年获得UPINLBS 2019 The First Prize for Best Paper Award;2019年获得《导航定位与授时》期刊年度高被引论文奖（第一名）

  ;

  2021年获得  ICAUS 2021 Best Paper Award

  ;

  2025年获得UPINLBS 2025 Outstanding Best Paper Award（TOP1）

  。2006年度获中华人民共和国国土资源部科技一等奖,2016年获上海市科技进步特等奖,2017年获国家科技进步二等奖,2019年获中国电力科学技术进步二等奖，2023年获卫星定位导航技术进步一等奖。

  Prof. Ling Pei (Senior Member, IEEE) received the Ph.D. degree from Southeast University,
  Nanjing, China, in 2007. From 2007 to 2013, he was a Specialist Research Scientist
  with Finnish Geospatial Research Institute, Finland. He is currently a Professor
  with the School of Electronic Information and Electrical Engineering (SEIEE), Shanghai
  Jiao Tong University, where his main research is in the areas of embodied navigation,
  indoor/outdoor seamless positioning, ubiquitous computing, wireless positioning,
  bio-inspired navigation, context-aware applications, sensors fusion, and navigation
  of unmanned systems. Prof. Pei has authored or co-authored over 100 scientific papers
  pubulished in the top level journals and conferences such as IEEE TPAMI、TII、TRO、TIE、TMC、

  SN、

  JIoT、

  TVT、TITS、TIM，CVPR、ICCV、AAAI、ICRA、IROS. He is also an inventor of 35 patents granted
  patents. From 2007 to 2013, he had worked as a specialist research scientist at
  the Finnish Geospatial Research Institute. The excellence research work Dr. Pei
  involved has been recognized to the public via e.g. a cover story in the most popular
  navigation magazine "GPS World" twice (Feb. Issue 2010, and Oct. Issue 2012). Nowadays,
  he has been the advisory committee and technical program committee member of several
  international conferences. Moreover, he is an Associate editor of IEEE Sensors Journal,
  editorial board member of Journal of Global Positioning System, IEEE Journal of
  Indoor and Seamless Positioning and Navigation (J-ISPIN), Journal of Chinese Inertial
  of Technology, and the associate editor of Navigation Positioning and Timing. Prof.
  Pei was a recipient of the Shanghai Pujiang Talent in 2014, National Prize for Progress
  in Science and Technology of China in 2017, and ranked as the World’s Top 2% most-cited
  scientists by Stanford University and Elsevier in 2022, 2025.

