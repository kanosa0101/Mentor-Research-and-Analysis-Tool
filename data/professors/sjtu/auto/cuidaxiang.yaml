bio_raw: '研究方向

  基于纳米效应的胃癌预警与早期诊断系统;智能纳米传感检测技术;智能纳米药物递送系统、纳米细胞治疗技术。

  工作经历

  2001年-2004年,德国Max Planck 研究所博士后,获取德国Project Manager资格证书与生物安全管理资格证书;

  2004年9月回国,竞聘为上海交通大学微纳科学技术研究院教授,组建纳米生物工程研究室并任研究室主任;

  2007年至2008年,日本早稻田大学访问教授与客座教授;

  教育背景

  1990年在第二军医大学获医学学士学位

  1995年在第四军医大学获医学硕士学位

  1998年获生化与分子生物学专业博士学位,毕业后在第四军医大学全军基因诊断技术应用研究所工作

  2000年晋升为副教授

  科研项目

  承担并完成科技部863项目,973项目,纳米科技重点研发计划项目,基金委青年基金、面上基金与杰出青年基金,仪器专项,目前在研的项目：科技部重点研发计划项目,基金委穿行群体项目,重点地区国际合作项目,上海市仪器专项。

  研究成果

  发表SCI论文450多篇,论文被Science, Nature Nanotechnology, Chem. Review 等杂志引用与评论,入选Elsevier高被引学者;在国际学术会议上作邀请报告50多次,获国家科技进步,
  二等奖1项,教育部技术发明一等奖1项,上海市技术发明一等奖1项,中国发明协会一等奖2项,华夏医学科技奖二等奖1项,主编专著2部, 授权发明专利75项,参与开发的部分产品获医疗器械证。

  荣誉奖励

  国家杰出青年基金获得者

  国家高层次人才

  国家百千万人才

  被授予“有突出贡献的中青年专家”,享受国务院津贴

  学术任职

  中国抗癌协会肿瘤纳米分会  主任委员

  中国医药卫生文化协会医工融合分会  会长

  中国生物技术学会分子影像专委会  副主委

  中国生物医学工程学会纳米生物医学工程分会  常委

  中国医师协会精准医学专业委员会  常委

  中国光学学会生物医学光子学专业委员会  常委

  中国生物物理学会纳米生物学分会  常委

  全国标准化专业技术委员会  委员

  Nano Biomedicine and Engineering 杂志  主编'
