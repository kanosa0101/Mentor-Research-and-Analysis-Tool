bio_raw: '研究方向

  预测控制理论与应用，智能车辆与机器人运动控制，智能交通系统优化，多模态医学信息融合

  现常年招收有志于科研深造的

  本科生、硕士研究生、博士研究生（2027）

  ，欢迎有志学子投递简历、咨询报考，携手科研共进！

  工作经历

  2023.03-至今  上海交通大学自动化系，副研究员

  2021.10-2023.02  上海交通大学自动化系，助理研究员

  2019.08-2021.10  上海交通大学自动化系，博士后

  教育背景

  2014/09-2019/07 上海交通大学控制科学与工程专业，获工学博士学位，导师：席裕庚

  2012/09-2014/06 上海交通大学控制科学与工程专业，获工学硕士学位，导师：席裕庚

  2008/09-2012/06 南京理工大学自动化专业，获工学学士学位

  2016/09-2017/09 美国普渡大学，访问学者

  教学工作

  研究生课程《预测控制》

  科研项目

  [1] 上海市面上基金，融合交通规则的城市混合交通路口车路协同优化与控制，主持，在研。

  [2] 国家重点研发计划项目，煤转化过程决策优化控制一体化集成与工程验证，在研，子课题负责人。

  [3] 国家自然科学基金重点项目，车联网环境下复杂混合交通系统优化调控理论与关键技术，在研，主研。

  [4] 国家自然科学基金青年项目，面向路段车速调节的异构交通流随机建模与调控，结题，主持。

  [5] 国家重点研发计划项目，自主式交通复杂系统体系架构研究，结题，子课题负责人。

  [6] 博士后站中特别资助，面向车路协同的城市混合交通路段车流控制器设计与开发，结题，主持。

  [7]横向项目，美的集团，厂区大规模AGVs在线调度与优化方法及系统开发，在研，主持。

  [8] 军工项目，20GFD-ZS01-241，结题，参与。

  [9] 横向项目，上海增达股份有限公司，先进温度控制算法研究与开发，结题，主持。

  [10] 横向项目，上海电气风电集团有限公司，微网能量管理智能算法，结题，项目骨干。

  荣誉奖励

  2020年上海交通大学电子信息与电气工程学院“晨星博士后激励计划”之“晨星博士后”

  2025年第三届onsite自动驾驶算法挑战赛泊车赛道冠军（参与学生：张一帆，余浩然）

  2025年上海市自动化学会自然科学二等奖（排一）

  学术任职

  中国自动化学会预测控制与智能决策专委会委员

  中国自动化学会车辆控制与智能化专委会委员'
