bio_raw: '研究方向

  量子成像，关联成像，单光子探测成像

  研究成果

  主要研究方向为量子关联成像，单光子探测成像技术，

  基于单光子探测关联成像系统，完成了可对100km级合作目标成像的单像素关联成像实验演示，在单光子探测灵敏度下，测量光子数与成像像素数之比小于1。

  基于单光子探测关联成像系统，可以在无法成像的极弱光条件下，实现高准确率的无成像目标识别和分类。

  针对极弱散射光场成像，通过引入深度学习网络，可实现在平均每像素小于1个探测光子的条件下得到目标物体的重建图像。'
