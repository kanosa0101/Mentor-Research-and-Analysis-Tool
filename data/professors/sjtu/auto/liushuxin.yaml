bio_raw: '研究方向

  光场调控、波前重建

  工作经历

  2024.08-至今 上海交通大学 助理研究员

  2020.11-2024.07 上海交通大学 电子科学与技术 博士后

  导师：苏翼凯

  研究方向：基于液晶器件的 AR/VR 显示和 3D 显示技术，光配向液晶器件、可调超表面、变焦透镜

  教育背景

  2014.9—2020.9 上海交通大学 电子科学与技术 博士

  2010.9—2014.6 电子科技大学 光电  学士

  科研项目

  2022.01 至今国家自然基金委员会，青年科学基金项目，62105203，基于快速几何相位液晶透镜的多平面增强现 实显示研究,在研,项目主持 30 万元。主持

  2022.01-至今 国家重点研发计划，可重构光突触阵列研制及多通道调控研究，2021YFB2801903，在研。子课题负责人

  2021-2022 上海市超级博士后 主持

  2022.01-至今 国家重点研发计划，临场真实感近眼三维显示技术与装置，在研, 项目骨干

  2016.09–2018.09 用于 AR/VR 的光场 3D 显示技术项目（交大-华为合作项目）参与

  2014.09–2017.10 新型高分辨率三维显示器件与系统的基础研究（973 项目）参与

