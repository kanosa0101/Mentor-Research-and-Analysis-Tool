title: 长聘研究员
email: yuanxin.wu@sjtu.edu.cn
bio_raw: '研究方向

  惯性基导航、高精度惯性导航、惯性视觉信息融合、穿戴式运动感知等

  工作经历

  先后工作于国防科技大学（2006-2012），加拿大Calgary大学（2009，访问学者），中南大学（2013-2015），上海交通大学（2015-至今）。

  教育背景

  1998年和2005年于国防科技大学获得学士和博士学位

  教学工作

  导航信息融合方法与实践，研究生专业基础课

  科研项目

  主持：

  国家基础重点项目1项

  国家重点研发课题2项

  国家自科基金5项

  教育部联合基金1项等。

  研究成果

  上海市惯性技术学会发明特等奖（“函数迭代惯导解算方法”，2024）

  第二届上海交通大学“十大科技进展”（“基于函数迭代的惯导解算方法”，2022）

  教育部高校自然科学二等奖（“惯性导航系统的全局可观性研究”, 2016）

  荣誉奖励

  中国惯性学会优博论文提名奖导师（2024）

  美国导航学会Bradford W. Parkinson优博论文导师（2023）

  Stanford Univ. Top 2%科学家终身影响力榜单（2019至今）

  Elsevier中国高被引学者（2015-2020）

  国家优青（2014）

  霍英东基金（2012）

  教育部新世纪人才（2010）

  全国百篇优博（2008）等

  学术任职

  德国惯性学会DGON ISA惯性器件及系统会议 常任程序委员（2019-）

  俄罗斯惯性学会ICINS组合导航系统会议 常任程序委员（2021-）

  IEEE AESS Distinguished Lecturer (2020-2024)

  IEEE Trans. AES编委（2016-2024）

  Journal of Navigation编委（2013-2023）

  Satellite Navigation编委（2019-）

  Gyroscopy and Navigation编委（2020-）'
