title: 副教授
email: lucunyue@sjtu.edu.cn
bio_raw: '研究方向

  主要研究方向为压电电机、先进执行器及其应用,学科领域属于新兴的机电、振动和声学等多学科的交叉,在海洋工程、国防、医学、外空间和工业领域有较大需求。

  工作经历

  2013.12-2014.12,弗吉尼亚理工学院暨州立大学,机械工程系,访问学者

  2009/6-至今,上海交通大学,电子信息与电气工程学院,副教授

  2006/10-2009/6,浙江大学,电气工程学院,副教授

  2004/7-2006/10,清华大学,物理系,博士后

  1993/8-1997/8,中国矿业大学,机械系,助教

  教育背景

  2000/9–2004/12,南京航空航天大学,航空宇航学院,博士

  1997/9–2000/4,北京理工大学,机械电子工程系,硕士

  1989/9–1993/7, 中国矿业大学,机械工程系,学士

  科研项目

  在研项目4项：行波推进的水陆两栖航行器,上海交通大学深蓝计划重点项目, 声波消雾设备,横向

  研究成果

  已研制系列压电微电机,提出了新的压电微电机构造理论和方法,所研制的1-10cm尺度的新型微电机能够填补市场空白。'
