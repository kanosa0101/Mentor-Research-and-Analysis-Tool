email: yumei.wen@sjtu.edu.cn
bio_raw: '研究方向

  传感器 ；信息获取与处理; 智能检测仪器

  工作经历

  上海交通大学长聘教授，博士生导师

  荣誉奖励

  先后8次申请获得国家自然科学基金项目资助，作为项目负责人承担了国家重大科学仪器项目、国家高技术863计划重大项目以及国家、省部级纵向项目20余项。在国内外发表论文300余篇，其中SCI检索150余篇，他引1000余次。申报发明专利48项，获得授权38项。获教育部自然科学一、二等奖各1项，重庆市自然科学二等奖和科学进步二等奖各1项。
  已指导16位研究生获得博士学位，80位研究生获得硕士学位。指导的博士生获全国优秀博士学位论文提名；多人次获得市、学校优秀博士、硕士学位论文奖以及中国仪器仪表奖学金等研究生学术奖励。

  学术任职

  中国仪器仪表学会常务理事，中国仪器仪表学会精密机械分会副理事长，中国仪器仪表学会传感器分会副理事长，全国高校传感器技术协会副理事长；《Instrumentation》、《传感技术学报》、《仪表技术与传感器》、《自动化仪表》编委。'
