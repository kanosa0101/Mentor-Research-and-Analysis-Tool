bio_raw: '研究方向

  多智能体系统协同控制

  多机器人强化学习

  网络化控制

  分布式算法

  多智能体系统网络安全

  课题组招收多智能体系统、集群机器人、强化学习等相关研究方向的本科、硕士、博士生，欢迎感兴趣的同学联系！

  工作经历

  2026.03-至今，上海交通大学，自动化与感知学院，长聘教轨副教授

  2023.01-2026.02，湖南大学，人工智能与机器人学院，博士后副研究员（合作导师：王耀南 院士）

  2022.10-2022.12，华为技术有限公司，高级工程师

  教育背景

  2017.09-2022.09，东京工业大学，计算机系人工智能专业，哲学博士

  2013.08-2017.07，清华大学，电气工程及其自动化，学士

  科研项目

  国家自然科学基金青年项目，多跳通信网络下多机器人协同制造鲁棒一致控制方法研究，2025.01-2027.12，主持

  岳麓山工业创新中心重大项目子课题，网络化云边融合的多机器人协同控制技术，2024.01-2025.12，主持

  湖南省科技重大专项，面向智能制造的自主可控工业互联网关键技术研究与应用示范，2022.09-2025.08，参与（项目助理）

  国家自然科学基金重点项目，多具身智能体协作学习研究，2025.01-2028.12，参与

