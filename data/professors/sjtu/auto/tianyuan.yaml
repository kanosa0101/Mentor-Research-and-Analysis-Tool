bio_raw: '研究方向

  上海交通大学 - 助理研究员 2022年09月 - 至今

  主要研究方向：通用人工智能、大模型训练/推理/评测端到端算法、大模型智能体、通用工业决策运筹技术。负责/参与国家重大专项5项，科研经费超500万。研究内容：

  领域大模型研发：领域大模型端到端训练、评测全流程技术研究。创新提出"分布式共治知识蒸馏"技术，构建领域专有数据集生成算法，在领域专有知识检索处理场景实现准确率92%的突破。

  AI for Scientist：新质科研生产力技术研究。创新点产生-研究现状调研-实验自主设计-实验多维验证-学术成果撰写-自主选刊发表，全流程智能体自主科研技术研究。

  智能体系统研发：构建泛工业领域任务智能体平台，集成多智能体协作、动态环境建模、群体博弈对抗等技术，实现完成多智能体全无人自主决策。

  通用工业决策运筹技术研究：涵盖电力系统调度、柔性工厂作业调度、物流仓储调度、卫星运管调度等通用工业决策运筹技术研究。构建集成算法库，涵盖多目标优化算法、线性规划、整数规划、启发式搜索（如模拟退火、禁忌搜索等），结合大模型知识推理能力，自动生成电力调度、仓储选址、库存分配、物流调度等领域决策方案。

  第一作者中科院1区Top期刊等SCI论文16篇（Google Scholar）。授权专利4篇。

  上海伯禹教育科技有限公司 -  副总裁 - 2020年05月 - 2022年08月

  主要工作内容：数字化（人工智能+）人才培养、AI技术咨询等。

  教育背景

  博士 - 上海交通大学 电子信息与电气工程学院 2017年03月 - 2021年09月

  博士联培 - 瑞典皇家理工学院 电气与能源学院 2018年10月 - 2021年09月

  硕士 - 上海交通大学 电子信息与电气工程学院 2014年09月 - 2017年03月

  学士 - 天津大学 电力系统及其自动化 电气与自动化学院 2009年09月 - 2013年07月

  研究成果

  Google Scholar：https://scholar.google.com/citations?user=YiROhYsAAAAJ&hl=en'
