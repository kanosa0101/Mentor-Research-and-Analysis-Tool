bio_raw: '研究方向

  个人简介：

  高安柱

  ，教授，上海交通大学自动化与感知学院院长助理/医疗机器人研究院院长助理、博士生导师，国自然优青入选者、上海市启明星计划入选者、上海东方英才青年项目入选者，主持国家重点研发计划青年科学家项目等多项国家/省市级项目。先后在哈工大（导师：王树国
  教授，付宜利 教授）、中科院沈自所（导师：王志东 研究员、刘浩 研究员）、美国约翰霍普金斯大学（合作导师：Prof. Russell H. Taylor 院士,
  Prof. Mehran Armand, Prof. Iulian Iordachita）、英国伦敦帝国理工学院（合作导师：Prof. Guang-Zhong
  Yang 院士）等开展机器人研究工作。目前，担任IEEE T-RO和IEEE RA-L的Associate Editor。

  长期从事柔性连续体机器人的关键技术研究，关注柔性机器人、连续体机器人、纤微机器人、智能感知与交互、具身智能等方向。相关成果以一作/通讯在Science Robotics、Science
  Advances、Nature Communications、IEEE TRO、Soft Robotics、IEEE/ASME TMECH、IEEE TIE等发表。欢迎来实验室参观交流！本课题组致力于柔性连续体机器人相关的科研工作！欢迎优秀的校内外学生加入课题组！

  招生信息

  ：

