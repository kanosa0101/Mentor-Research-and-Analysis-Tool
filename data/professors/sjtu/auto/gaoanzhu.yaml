  （因邮件较多，无法一一回复，请见谅）

  Anzhu Gao

  is a Professor, the Assistant to the Dean of the School of Automation and Intelligent
  Sensing (SAIS) & Institute of Medical Robotics (IMR), and Director of Center for
  Surgical Robotics, Shanghai Jiao Tong University. He is a recipient of the National
  Natural Science Fund for Excellent Young Scholars (NSFC Excellent Young Scientists
  Fund), the Shanghai Rising-Star Program, and the Shanghai Oriental Talent Youth
  Program. He has led a Young Scientists Project under the National Key R&D Program
  of China, along with multiple national and provincial/municipal research projects.
  He conducted research at Harbin Institute of Technology (advised by Prof. Shuguo
  Wang and Prof. Yili Fu), Shenyang Institute of Automation, Chinese Academy of Sciences (advised
  by Prof. Zhidong Wang and Prof. Hao Liu), Johns Hopkins University (with Prof. Russell
  H. Taylor, Prof. Mehran Armand, and Prof. Iulian Iordachita), and Imperial College
  London (with Prof. Guang-Zhong Yang). He currently serves as an Associate Editor
  for

  IEEE Transactions on Robotics (T-RO)

  and

  IEEE Robotics and Automation Letters (RA-L)

  .

  His research has long focused on key technologies of flexible continuum robots,
  with interests spanning soft robotics, continuum robotics, intelligent sensing,
  human–robot interaction, and embodied intelligence. His work has been published
  as first or corresponding author in leading journals, including

  Science Robotics

  ,

  Science Advances

  ,

  Nature Communications

  ,

  IEEE Transactions on Robotics

  ,

  Soft Robotics

  ,

  IEEE/ASME Transactions on Mechatronics

  , and

  IEEE Transactions on Industrial Electronics, etc

  . Visitors are warmly welcome to the laboratory for academic exchange and collaboration.
  The group is dedicated to research on flexible continuum robotics and sincerely
  welcomes outstanding students, both within and outside the university to join the
  team.

  研究方向：

  本课题组长期致力于柔性机器人与自动化，解决机器人的本体设计、精确驱动、智能传感、精准操控等方向，能够适用于医疗、工业、航空航天等多场景的诊断与操作需求。具体方向包括如下：

  - 智能机器人

  - 柔性连续体机器人

  - 具身智能柔性机器人

  - 腔内介入机器人

  - 柔性灵巧手

  - 机器人力与形状传感

  - 机器人增强现实与操作

  - 机器人人机交互

  Research Directions:

  The research group has long been dedicated to

  flexible/continuum robots and automation

  , focusing on solving key challenges for interventions in robots, including embodied
  robot design, precise actuation, intelligent sensing, and accurate manipulation
  and control. The developed technologies are applicable to diagnostic and operational
  needs across multiple domains, such as medical, industrial, and aerospace scenarios.

  Specific research directions include:

  Intelligent Robotics

  Flexible Continuum Robots

  Embodied Flexible Robots

  Endoluminal Interventional Robots

  Soft Dexterous Hands

  Robot Force and Shape Sensing

  Robotic Augmented Reality and Teleoperation

  Human–Robot Interaction'
