title: 助理研究员
email: liyichensjtu@sjtu.edu.cn
bio_raw: '研究方向

  海洋智能信息系统，水下机器人网络系统，目标识别与测量跟踪，多源信息融合

  课题组科研条件优越，欢迎研究生和本科生申请加入。

  硕博研究生：长期接收有意愿从事海洋相关研究、理论与实践相结合的硕博研究生。

  本科生：长期接收有意愿从事科研、参与学生竞赛、开展毕业设计的本科同学。

  近期指导学生获奖：

  IEEE ICUS会议最佳论文、CCSICC会议最佳学生论文

  中国国际海洋水下机器人大赛--特等奖

  国际海洋工程装备科技创新大赛--特等奖

  全国集群智能技术挑战赛--一等奖

  世界大学生水下机器人大赛--一等奖

  工作经历

  2023/11 至 今，上海交通大学，自动化系，助理研究员

  2022/01-2023/10，上海交通大学，自动化系，博士后

  教育背景

  2016/09-2021/12，上海交通大学，自动化系，博士

  2012/09-2016/07，西北工业大学，探测制导与控制技术，学士

  研究成果

  在IEEE JOE、

  IEEE/CAA JAS、

  IEEE TII、IEEE TCYB等国际期刊/会议发表论文30余篇，其中第一作者/通讯作者论文22篇；申请专利22项，已授权6项。

  荣誉奖励

  [1] 中国科协青年人才托举工程（科协资助）.

  [2] 上海市“超级博士后”激励计划.

  [3] 中国指挥与控制学会“科技进步奖”（技术发明类）一等奖（排名2/15）.

  [4] 上海交通大学“十大科技进展”奖（排名3/3）.

  [5] 上海市自动化学会技术发明一等奖（排名1/5）.

  [6] 中国指挥与控制学会优秀博士学位论文.'
