bio_raw: '研究方向

  1、MEMS技术研究；

  2、生物微流控芯片和柔性电子研究；

  3、肿瘤早期检测技术研究；

  工作经历

  2025.06 至 今：            上海交通大学，自动化与感知学院，助理研究员

  2021.07 至 2025.06：上海交通大学，电子信息与电气工程学院，感知科学与工程学院，助理研究员

  2019.06 至 2021.06：上海交通大学，电子信息与电气工程学院，仪器科学与工程系，博士后，

  合作导师：崔大祥 教授

  2012.11 至 2014.04：新晔电子（深圳）有限公司，成都办事处，现场技术支持（FAE）

  2011.07

  至

  2012.09：重庆前卫仪表有限公司，嵌入式工程师

  教育背景

  2014.09 至 2019.06：上海交通大学， 微纳技术研究院，电子科学与技术专业，博士，导师：陈迪 教授

  2008.09 至 2011.06：重庆大学，光电工程学院，仪器科学与技术专业，硕士，导师：廖海洋 教授

  2004.09 至 2008.06：湖北工业大学，机械工程学院，测控技术与仪器专业，学士，导师：--

  科研项目

  1. 科技部，科技创新2030--“新型无创脑机接口技术”项目，在研，任务负责人

  2. 科技部，国家重点研发计划-纳米功能薄膜的设计、构筑与空间环境应用探索项目，在研，子课题负责人

  3.

  四川省科技厅，基于外泌体高通量检测微流控芯片的胃癌腹腔灌洗液精准检测关键技术研究，在研，交大负责人

  4. 交大医工交叉项目，青年项目，一体式微流控芯片检测携带TRIP13肿瘤外泌体用于检测结直肠癌术后复发转移的研究，结题，参与

  5. 国家自然科学基金委员会, 青年科学基金项目, 基于微流控芯片的iPS细胞外泌体高纯度分离与载药用于胃癌精准诊疗及其机理研究, 结题, 主持

  6. 中国博士后科学基金会, 特别资助（站前）, 用于手势识别的弹性电路系统研究, 结题, 主持

  7.  科技部, 重点研发计划-新一代高通量数字PCR关键技术及应用研究, 结题, 参加

  8. 上海市科委, 15441904800, 用于提取循环肿瘤细胞的单细胞操控仪关键技术研究, 结题,参加

  9. 上海交通大学-密西根大学专项基金, Soft Robotics Movement Sensing and Feedback for Preventing
  Falls in Older Adults, 结题,参加

