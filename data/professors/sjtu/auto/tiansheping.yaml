bio_raw: '研究方向

  动态测试、电路理论

  工作经历

  1996.12-  ：海交通大学自动化与感知学院 副教授

  1991.02-1999.12： 上海交通大学仪器科学与工程系 助教、讲师

  教育背景

  1995.02-1999.09： 上海交通大学仪器科学与工程系 博士

  1988.09-1991.02 ：上海交通大学系统工程研究所 硕士

  1984.09-1988.07： 上海交通大学仪器科学与工程系 学士

  教学工作

  2004-   ：电路理论，本科课程

  2011-2021：嵌入式系统原理与实验，本科课程

  2017-2024：计量学，研究生课程

  荣誉奖励

  校教书育人三等奖（2020）、唐立新教学名师奖（2020）、校烛光奖励计划一等奖（2010），校优秀教师奖5次，国家级、市级、校级等教学成果奖7次。

  1999年国家机械工业局二等奖（第7）、2020年中国医药教育协会二等奖（第7）。'
