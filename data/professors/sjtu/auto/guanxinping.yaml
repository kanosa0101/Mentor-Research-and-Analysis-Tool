  工作经历

  1996.09-1999.10，哈尔滨工业大学航天学院控制理论与控制工程专业，获工学博士学位

  1991.09-1994.03，哈尔滨工业大学应用数学专业，获理学硕士学位

  1982.09-1986.07，哈尔滨师范大学数学系，获理学学士学位

  教育背景

  2018.08至今，上海交通大学电子信息与电气工程学院，院长

  2014.10-2018.07，上海交通大学科学技术发展研究院，常务副院长

  2010.04-2014.10，上海交通大学科学技术发展研究院，副院长

  2007.09至今，上海交通大学自动化系，教授，博导

  2009.04至今，“系统控制与信息处理”教育部重点实验室，主任

  1998.09-2008.04，燕山大学电气工程学院，教授，博导，院长

  教学工作

  《自动控制原理》大平台课程，本科三年级学生

  《无线传感器网络》，本科四年级学生

  《网络系统与控制》，IEEE试点班三年级学生

  科研项目

  1. 首席科学家，多维高分辨率生物组织表征与分析仪器开发与应用，科技部重大科学仪器设备开发专项，2013YQ030651，2013.10-2018.10,4497万元

  2. 负责人，控制理论与方法—网络系统的设计、控制与优化，国家自然科学基金委创新群体，61221003，2013.01-2015.12，600万元

  3. 负责人，地空协同传输理论与方法，973课题，2010CB731803,2010.01-2014.12，442万元

  4. 负责人，基于机理、数据和知识的大型高炉工业系统建模与验证方法，国家自然科学基金重大项目,61290322，2013.01-2017.12，304万元

  5. 负责人，基于认知无线电的工业无线网络理论与优化方法，国家自然科学基金重点项目，60934003，2010.01-2013.12，200万元

  6. 负责人，控制系统的分析与综合，国家杰出青年基金，2006.01-2009.12，160万元

  7. 负责人，基于物联网技术的输变电设备智能监测，博士点基金优先发展领域，20110073130005，2012.01-2014.12

  8. 负责人，面向突发事件的无线异构立体应急网络关键组网技术研究，上海市学科带头人计划，10XD1402100，2010.03-2012.03

  9. 负责人，工业无线网络监控系统关键技术研究与应用，上海市科委重大项目，08511501600，2008.11-2010.09，150万元

  10. 子课题负责人，智能社区管理平台设计与安全机制研究，10dz1500402，2010.07-2012.06

  11. 子课题负责人，工业物联网共性平台基础技术攻关，11511501202，2011.11-2013.11

  12. 负责人，高速铁路无线网络可靠性评估技术的研究，2009X016，2009.08-2010.12

  研究成果

  先后主持973课题、国家自然科学基金重点项目、上海市科委重大项目等30余项，出版专著4部，先后在IEEE Trans. {Automatic Control，Fuzzy
  Systems，Signal Processing，Neural Networks, Industrial Electronics}, IEEE J. Selected
  Area of Communication等国际顶级期刊发表SCI论文130余篇，研究成果受到国际同行广泛引用，SCI他引超过2000次。研究成果获“国家自然科学二等奖”1项（排名第2），“教育部自然科学奖一等奖”1项（排名第1），2008年获“IEEE模糊系统汇刊杰出论文奖”。

