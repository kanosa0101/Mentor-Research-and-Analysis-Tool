bio_raw: '研究方向

  龙承念

  博士，上海交通大学长聘教授，博士生导师，上海交通大学区块链研究中心副主任，上海交通大学智能网联汽车研究中心教授。国际智能交通系统领域顶级期刊《

  IEEE Transactions on Intelligent Transportation Systems

  》编委（区块链方向），

  IEEE

  首本区块链学术期刊《

  IEEE Blockchain Technical Briefs

  》

  创刊编委，

  《

  IET Blockchain

  》

  编委

  , International Conference on Blockchain Technology

  （

  ICBCT

  ）

  2020-2024

  会议主席、执行主席；中国计算机学会（

  CCF

  ）区块链专委会执行委员，

  IEEE PES

  电力系统通信与网络安全技术委员会（中国）电力信息通信区块链技术分委会常务理事，中国自动化学会区块链专业委员会委员，中国自动化学会工业系统信息安全专业委员会委员，中国创造学会智能制造与服务分会常务理事。主要研究方向为智能网联系统，包括区块链、隐私计算、可信数据空间、智能物联网和分布式自主系统，发表国际期刊与会议论文

  100

  余篇，物联网安全专著一部，研究成果

  SCI

  他人引用

  800

  余次，研究成果先后获国家自然科学奖二等奖、

  3

  次教育部自然科学一等奖、

  CAA

  自然科学二等奖、上海市交通工程学会科学技术一等奖。入选教育部新世纪人才，上海市浦江人才等人才支持计划。

  龙承念教授现为

  自动化与感知学院

  上海交通大学分布式智能系统实验室团队负责人，

  团队研究兴趣主要集中在

  智能网联系统

  (Intelligent Connected Systems, ICS)

  ，

  包括

  ：

  1)

  智能物联网

  (AIoT)

  ：分布式机器学习，联邦学习，云

  /

  边缘计算，面向智能设备（无人机、自动驾驶汽车）的轻量化大模型；

  2

  ）

  可信数据空间

  ：包括可信人工智能，隐私计算（多方安全计算、同态加密、

  TEE

  ），区块链技术，多方智能数据共享系统；

  3

  ）

  分布式自主控制决策系统

  ：基础模型驱动的智能体，分布式多智能体协同，智能网联系统安全（智能网联汽车、智能电网、低空智能物联网等）。

