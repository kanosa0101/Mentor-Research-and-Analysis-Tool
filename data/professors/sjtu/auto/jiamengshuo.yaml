bio_raw: '研究方向

  1. 人机协同下复杂工业系统感知、控制与决策

  2. 能源电力垂域大模型后训练及应用

  3. 通专融合大模型驱动新知发现

  4. 数据-机理融合驱动的高比例新能源电力系统建模、分析与优化

  诚邀对科研/竞赛(或我能帮上忙的领域)感兴趣的本科生联系交流。

  诚邀2027年入学的硕博保研同学联系交流。

  博士后岗位长期开放，待遇优厚，欢迎加入。

  本网页信息更新可能存在滞后，欢迎大家关注https://www.shuo.science/

  工作经历

  2025年-至今，上海交通大学自动化系，副教授（国家级青年人才、上海市青年人才、小米青年学者）

  2023年-2025年，苏黎世联邦理工学院，Senior Scientist（Exceptional Promotion based on Merits）

  2021年-2023年，苏黎世联邦理工学院，博士后（作为Single PI获瑞士国家科学基金独立资助）

  教育背景

  2016年-2021年，清华大学，博士（

  清华大学优秀博士毕业生，

  清华大学优秀博士论文，

  北京市优秀毕业生

  ）

  2012年-2016年，华北电力大学，

  创新实验班，

  学士（校长奖学金获得者）

  教学工作

  苏黎世联邦理工学院，Optimization of Energy Systems，研究生课程（客座讲师）

