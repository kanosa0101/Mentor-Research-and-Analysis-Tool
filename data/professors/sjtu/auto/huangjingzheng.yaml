bio_raw: '研究方向

  量子传感、量子导航、量子气体传感

  工作经历

  2014.8-2016.8 上海交通大学 博士后

  2016.8-2019.12  上海交通大学 助理研究员

  2019.12 –至今 上海交通大学 副研究员

  教育背景

  2002.9-2006.7 上海交通大学 信息与通信系统 本科

  2009.9-2014.7 中国科学技术大学 光学与光学工程系 博士研究生

  教学工作

  研究生选修课程（32课时）：ICE8508-《量子信息技术概论》

  科研项目

  “ 不依赖多体量子纠缠的分布式量子传感技术研究”，国家自然科学基金（面上）项目，主持，2025.1-2028.12

  “弱测量光纤传感机理与应用研究”,国家自然科学基金（面上）项目，主持，2021.1-2024.12

  “基于弱测量方法的参量感知新方案研究”，国家自然科学基金（青年）项目，主持，2018.1-2020.12

  研究成果

  副研究员，博导，主要研究方向为光量子传感技术机理及其在导航与电力等方面的应用，主攻相关基础科学问题和与样机研发过程中的核心技术问题。主持国家自然科学基金委项目3项，国防科技项目6项，并以子任务负责人身份参与科创2030“量子通信与量子计算机”重大项目子课题。在Nature
  Communications、Science Advances、Physical Review Letters等高水平国际期刊发表学术论文40余篇，获授权国家发明专利16项，第一译者身份出版译著1部。

