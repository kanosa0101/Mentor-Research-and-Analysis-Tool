bio_raw: '研究方向

  Intelligent Target Sensing (Radar/SAR/MIMO/Fuse weak target detection, explainable/open-set
  target recognition, etc. )

  Stochastic Fractal SP (

  Fractal

  modeling, multi-variate multifractals , generalized fractal Analysis, etc.)

  Fractal Learning (Fractal-domain DL, Fractal graph network, fractal TransFormer,
  etc. )

  工作经历

  2014.12，上海交通大学 感知与导航研究所，副研究员

  2007-2014，南京理工大学 电子工程与光电技术学院，副教授

  2005-2007，中国电科集团/GF重点实验室，博士后

  教育背景

  2002-2005

  ，

  南京理工大学，电子工程专业，博士

  教学工作

  《通信原理》

  《雷达与对抗》

  科研项目

  主持国家部委重点课题、国家自然基金、GF预研基金、上海科委等纵向课题10余项

  主持中国航天、中国电科、中科院空天院等横向项目等近10项

  研究成果

  2023 - 至今，多元分形及多模态分形学习：分形图网络、分形卷积网络、FracFormer等。

  2019 - 2025，

  UWB近程雷达目标识别：UWB成像/序贯目标识别、可解释开集识别等

  2015 - 至今，

  随机分形与雷达探测理论与方法, SAR舰船目标检测与识别

  2010 - 2020，

  随机分形信号处理：理论、算法与应用

  2002 - 至今，

  伪码复合编码体制近程雷达探测理论与方法

  出版专著2部，

  累计在IEEE TPAMI, TIP, IEEE TGRS, IEEE TAES, ISPRS, Chaos Soliton & Frarctal, Nonlinear
  Dynamics, 电子学报, 兵工学报等发表学术论文120余篇

  申请专利及软著14项，授权10项

  荣誉奖励

  指导学生获奖

  ICSIDP 2019，Excellent Paper Award （Yunlong Xi）

  ICSIP  2020，Best Presentation Award (Junye Li)

  ICSIP  2021，Best Presentation Award (Di Chen)

  ICDSP 2024，Best Presentation Award (Ziqin Xiong)

  学术任职

  2021年，IEEE senior member

  2009年，国家自然基金项目通讯评审

  ICSIP, CCISP等多个国际会议TPC和sessionChair

  IEEE汇刊以及国内核心期刊审稿人（IEEE TIP, TSP, TGRS, TMTT, TAP, TAES, TMI, 电子学报，通信学报等）'
