bio_raw: '研究方向

  多源融合定位与导航、群智感知与计算、目标识别与故障检测。

  工作经历

  2024/01-至今                          副研究员                         上海交通大学

  2021/03-2023/12                   助理研究员                      上海交通大学

  2019/12-2021/02                   借调挂职                         科技部战略规划司

  2016/08-2019/10                   思政教师（双肩挑）        上海交通大学

  教学工作

  ISE3310《物联网信息感知》

  GE6012《学术报告与研讨会》

  科研项目

  长三角科技创新共同体联合攻关重点任务项目，基于光飞行时间的高分辨深度传感器及光学多模态缺陷传感模组，2025/01-2027/12，课题负责人。

  国家重点研发项目，动物疫苗新型投递技术装备研发，2024/12-2027/11，课题负责人。

  上海交通大学医工交叉项目，微流控技术筛选耐药基因联合深度学习精准治疗儿童幽门螺杆菌感染的研究，2025/01-2027/12，联合主持人。

  长三角科技创新共同体联合攻关项目，面向高端装备制造的智能化激光焊接关键技术研发及应用验证，2023/12-2026/11，课题负责人。

  国家自然科学青年基金，基于光流和惯性辅助的行人运动参数估计方法研究，2020/01-2022/12，主持人。

  某科工局支持重点实验室项目，月面巡视探测中地形特征智能分类和语义地图构建技术，2022/5-2024/4，主持人。

  某科工局稳定支持基金项目，地外环境巡视探测中环境自主感知与语义地图构建技术，2024/08-2025/06，主持人。

  某科技委项目，水下定位技术研究，2020/12-2022/12，主持人。

  某科技委项目，定位导航技术研究，2019/07-2020/06，课题负责人。

  中国第二代卫星导航系统重大专项项目子课题，面向东盟的教育培训合作，2018/01-2018/06，主持人。

  上海市科委科研计划项目，基于WiFi和北斗的室内外定位关键技术研究，2017/07-2019/06，主持人。

  上海交通大学烟台信息技术研究院产学研基金项目，基于ToF的流水线物品识别测量与机器抓取系统，2020/01-2020/12，主持人。

  中国航天科技集团应用创新计划，复杂场景红外弱小目标智能检测技术，2021-2022，主持人。

  上海航天先进技术联合研究基金，人工智能视觉目标识别与跟踪技术研究，2019/09-2020/09，主持人。

  南方电网产学研项目，变电站主设备异源影像三维重构与外观缺陷诊断方法研究，2023/12-2025/10，课题负责人。

  上海电气产学研项目，高端先进焊接技术联合研发中心，2022/04-2026/12，课题负责人。

  华为产学研项目，多传感器融合的定姿技术，2019/09-2020/07，主持人。

  富士达产学研项目，利用图像识别技术检测使用者特征，2019/04-2019/10，主持人。

  富士通研究开发中心产学研项目，面向车载视频的智能分析，2018/11-2019/03，主持人。

  研究成果

  自入职以来，已发表论文60余篇，授权专利10余项，参与编著著作1本。主持纵向项目10余项，包括国家重点研发项目课题；国家自然科学基金青年项目；某科工局支持重点实验室基金；中国第二代卫星导航重大专项；某科技委创新特区项目；上海市科学技术委员会科研计划项目；上海航天先进技术联合研究基金项目；上海交通大学烟台信息技术研究院产学研基金项目等。主持华为、上海电气、富士通等公司横向项目5项。获得上海市科技进步特等奖1项，中国仪器仪表学会技术发明奖二等奖1项。

  荣誉奖励

  2017年，获得上海市科技进步特等奖1项（排名22）。

  2025年，获得中国仪器仪表学会技术发明奖二等奖1项（排名2）。

  学术任职

  《Electronics》, Special Issue Guest Editor

  《计算机科学与探索》与《计算机工程与应用》，特邀审稿人

  IEEE TIM, TASE, RAL, TVT等期刊审稿人'
