title: 副教授
supervisor: 博导
email: y.ma@sjtu.edu.cn
bio_raw: '研究方向

  测量系统误差溯源与性能优化；

  AI辅助智能制造与智慧城市；

  宽频带电阻抗精密测量与应用。

  工作经历

  中国科学院力学研究所博士后，英国利兹大学+英国癌症研究所Research Fellow 7年，2008年加入上海交通大学。

  教育背景

  天津大学硕士、博士

  教学工作

  承担《检测技术（英语班、双语班）》、

  《微弱信号检测》、

  《高级数字信号处理》、《现代测试仪器设计等课程》等课程；

  科研项目

  主持国家自然基金面上、科技部重点研发项目子课题、教育部、上海市科委、企业委托项目等。

  研究成果

  天然气主干管网购销差矩阵控制；

  亚微牛级微推力测量测控系统；

  面向智能制造的多源异构数据资源精准解析与提取；

  面向智能制造的智能集成平台；

  数字孪生；

  宽频带多频率同步电阻抗层析成像仪；

  可穿戴肺通气与电生理健康监测仪。

  荣誉奖励

  上海市浦江人才入选。

  国家级教学成果二等奖、上海市教学成果一等奖、上海交通大学教学成果特等奖、一等奖等。

  上海市留学生示范性全英语课程。

  学术任职

  《IEEE Transections on Instrumentation and Measurement》副编辑、全国多相流测量学术委员会委员，多本高水平学术期刊审稿人。'
