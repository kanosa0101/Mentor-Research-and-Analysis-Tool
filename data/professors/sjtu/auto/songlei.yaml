bio_raw: '研究方向

  （1）智能指控理论；

  （2）跨域协同技术；

  （3）自主无人系统。

  教育背景

  控制科学与工程，工学博士。

  荣誉奖励

  2025中国指挥与控制学会科学技术进步奖（技术发明类）一等奖；

  2023年上海市自动化学会科技进步一等奖；

  指导学生获得2026年中国指挥与控制学会博士学位论文激励计划；

  指导学生获2025年中国青年科技创新“揭榜挂帅”擂台赛 特等奖；

  指导学生获2024年中国国际大学生创新大赛（上海赛区）金奖（优秀指导教师）。

  学术任职

  （1）中国指挥与控制学会具身智能专委会，副总干事；

  （2）中国自动化学会智能自动化专委会，委员。'
