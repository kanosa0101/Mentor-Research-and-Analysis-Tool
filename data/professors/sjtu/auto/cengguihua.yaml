bio_raw: '研究方向

  量子密码通信技术、量子传感技术、量子成像技术以及智能量子信息技术

  研究成果

  代表性成果主要有：

  在连续变量量子保密通信的安全传输距离和安全码率实验实现方面，均创造了世界纪录；

  率先提出并实验实现了本地本振连续变量量子保密通信方案，对推动连续变量量子保密通信技术产业化具有重要现实意义；

  独创性提出了量子签名方案，国际学术同行学者认为开辟了量子密码研究新方向；

  率先完成了室外100公里（青海湖）的单光子探测成像试验，为推进量子成像技术的应用迈出了重要一步；

  独创性提出了一种新的光学陀螺机制，并研制出了系统样机，科技委专家认为对国防建设具有颠覆性价值。 作为召集人参与了我国多个量子密码通信标准制定和白皮书撰写，承担了国家科技部、军方和上海市等部门的重大项目研究；在量子信息技术研究与产业化方面发挥不可替代作用，受到了学术界和产业界的广泛关注。

  荣誉奖励

  第十八届国际高新技术成果交易会优秀产品奖，获得湖南省自然科学二等奖1项

  学术任职

  陕西省特聘教授（百人计划获得者），德国洪堡学者。“十二五”国防863高技术发展计划某主题专家组成员；全国量子密码专业委员会副主任委员；全国量子光学专业委员会委员。国家教育部首批新世纪优秀人才支撑计划获得者。上海交通大学量子感知与信息处理研究中心主任。多所国内外知名大学兼职教授。'
