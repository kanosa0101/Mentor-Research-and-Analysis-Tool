bio_raw: '研究方向

  通信与信息技术, 数据处理技术

  工作经历

  龚玲，上海交通大学高级工程师，自1997年进入上海交通大学工作。主讲3门本科生和2门研究生课程，年均完成12学分，曾获校教学比赛二等奖和教学成果二等奖各1项;出版本科生教材3部，撰写专著1本，多本译著、编著，发表学术论文十余篇，教学论文4篇。2008、2009、2013年度均获上海交通大学优秀教师三等奖。获上海交通大学2019年度“管理服务奖”提名奖。

  研究成果

  专著、编著、译著

  《操作系统实验教程》，ISBN 978-7-121-10564，2010.03

  《操作系统习题与应用解析》，ISBN 978-7-302-28169，2012.06

  《DB2 UDB v8.1 for Linux，UNIX，Windows》，ISBN 7-111-12501-0，2003.09

  《IBM WebSphere Studio Web应用开发》，ISBN 7-111-13751-5，2004.02

  《IBM WebSphere Studio J2EE应用开发》，ISBN 7-111-14056-7，2004.04

  《数据挖掘原理与技术》，ISBN 7-5053-9738-9，2004.04

  荣誉奖励

  2007/11，上海交通大学“秀我教学风采”比赛二等奖

  2009/09，2008-2009年度上海交通大学优秀教师三等奖

  2010/09，上海交通大学2010年度教学成果奖二等奖（排名3）

  2011/12，“操作系统”英语授课奖励

  2011/09，2010-2011年度上海交通大学优秀教师三等奖

  2014/09，2013-2014年度上海交通大学优秀教师三等奖

  2019，上海交通大学2019年度“管理服务奖”提名奖。'
