bio_raw: '研究方向

  工业互联网与工业具身智能（VTLA）

  先进运载装备（纯电飞机、垂直起降飞行器eVTOL、无人机等）信息互联

  低轨卫星星座网络确定性传输

  感知-传输-控制一体化设计理论与方法

  工作经历

  2024.12至今，上海交通大学巴黎卓越工程师学院，中方院长

  2023.10~2025.03，上海交通大学巴黎卓越工程师学院，党委书记

  2025.06至今，上海交通大学自动化与感知学院，特聘教授

  2021.07~2025.05，上海交通大学自动化系，特聘教授

  2013.12～2021.06，上海交通大学自动化系, 教授

  2008.04～2013.12，上海交通大学自动化系, 副教授

  2013.09～2014.03，加拿大滑铁卢大学电气与计算机工程系，访问教授

  2006.10～2008.03，英国曼彻斯特大学博士后, 副研究员

  2006.02～2006.05，香港城市大学制造工程与工程管理学系, 高级副研究员

  教育背景

  2003.02～2006.03，香港城市大学制造工程与工程管理学系（公派），获博士学位

  2000.09～2002.10，燕山大学控制理论与控制工程专业（免试推荐），获硕士学位

  1996.09～2000.07，燕山大学自动化专业学习，获学士学位

