bio_raw: '研究方向

  分布式系统预测控制，基于数据与机器学习的分析与建模，网络化工业系统的智能优化与决策，机器人智能控制，

  工作经历

  2010-2012年 通用电气中国研发中心（GRC全球研究中心）

  2012-2025年 上海交通大学电子信息与电气工程学院

  2025-至今 上海交通大学自动化与感知学院

  2014.06-2015.06 加拿大Alberta大学 (访学)

  2019.01-2019.12 美国加州大学洛杉矶分校( 访学)

  教育背景

  2006-2010 年 上海交通大学控制理论与工程 博士

  2003-2006 年 上海大学检测与自动化装置 硕士

  1996-2000 年 西安交通大学制冷与低温工程 学士

  教学工作

  AU7006 过程系统控制

  AU7011 过程系统辨识

  科研项目

  主持参与的主要项目：

  国家重点研发计划项目：基于全景感知的海上风电场群协同优化（2023～2026）

  国家重点研发计划项目：深海采矿生物生境影响评估关键技术（2022～2026）

  国家自然科学基金面上项目：基于学习提升网络化分布式预测控制系统性能（2021～2024）

  国家自然科学基金面上项目：CPS结构下分布式预测控制系统的设计与综合（2017～2020）

  参与国家自然科学基金重大研究计划重点项目：面向大规模定制的协同感知与柔性调控理论与关键技术（2024～2028）

  参与国家重点研发项目“人工智能2030”：复杂制造环境下的协同控制与决策理论方法（2019～2022）

  参与国家自然科学基金重点项目：网络化系统分布式实时优化与决策理论及应用（2018～2021）

  参与国家自然科学基金重大项目：炼油过程运行优化关键技术--大规模工程约束优化问题实施求解策略与算法（2015～2020）

  其它多项企业合作项目

  研究成果

  发表文章IEEE tansactions,  ACS,  IFAC 汇刊等控制领域主流期刊、会议论文100余篇，合作中英文专著3部，多项专利、软著

  荣誉奖励

  2010 上海市优秀博士论文

  2018 国家自然科学二等奖

  2017 中国自动化学会自然科学一等奖

  2020 中国石油化工联合会三等奖

  2017 上海交通大学科研成果二等奖

  2018 上海交通大学科研成果一等奖

  2024 中国自动化学会创新团体（成员）

  2017 张钟俊院士优秀论文奖

  学术任职

  国内外多个学术协会会员、专委会委员、多个学术期刊编委'
