bio_raw: '研究方向

  人工智能及其在电力系统中的应用，分布式稳定、控制、优化、博弈。

  围绕上述研究方向，长期招才引智，

  有意者发邮件至 wangzhaojian@sjtu.edu.cn。

  1. 欢迎2026年入学的硕士联系；

  2. 常年招聘博士后，待遇从优，欢迎联系。

  本页面信息可能滞后，最新信息见个人主页：

  https://iwin-zjw.sjtu.edu.cn

  工作经历

