  工作经历

  2008-2013，国防科技大学 数学与系统科学系，讲师

  2014-2021，上海交通大学 电子信息与电气工程学院，副研究员

  2022-2024，上海交通大学 电子信息与电气工程学院，研究员

  2024-至 今，上海交通大学 自动化与感知学院 研究员

  教学工作

  《数字电子技术》

  科研项目

  2025-2028，国家重点研发计划课题

  2025-2028，科技部中欧龙计划VI期项目(Co-PI)

  2023-2026，国家自然科学基金面上项目

  研究成果

  [1] Z. Zhang, L. Zhang, J. Wu and W. Guo, "Optical and Synthetic Aperture Radar
  Image Fusion for Ship Detection and Recognition: Current state, challenges, and
  future prospects," in IEEE Geoscience and Remote Sensing Magazine, vol. 12, no.
  4, pp. 132-168, Dec. 2024,.

  [2] C. Li, W. Guo, Z. Zhang and T. Zhang, "Self-Supervised Classification of SAR
  Images With Optical Image Assistance," in IEEE Transactions on Geoscience and Remote
  Sensing, vol. 61, pp. 1-15, 2023.

  [3] S. Zhao, Z. Zhang, W. Guo and Y. Luo, "An Automatic Ship Detection Method Adapting
  to Different Satellites SAR Images With Feature Alignment and Compensation Loss,"
  in IEEE Transactions on Geoscience and Remote Sensing, vol. 60, pp. 1-17, 2022,.

  [4] Z. Cui, G. -J. Qi, L. Gu, S. You, Z. Zhang and T. Harada, "Multitask AET with
  Orthogonal Tangent Regularity for Dark Object Detection," 2021 IEEE/CVF International
  Conference on Computer Vision (ICCV), Montreal, QC, Canada, pp. 2533-2542, 2021.

  [5] F. Zhang, Z. Zhang, W. Yu and T. -K. Truong, "Joint Range and Velocity Estimation
  With Intrapulse and Intersubcarrier Doppler Effects for OFDM-Based RadCom Systems,"
  in IEEE Transactions on Signal Processing, vol. 68, pp. 662-675, 2020.

  [6] C. Wu, Z. Zhang, X. Liang, L. Chen, W. Yu and T. -K. Truong, "Fast 3-D Imaging
  Algorithm Based on Unitary Transformation and Real-Valued Sparse Representation
  for MIMO Array SAR," in IEEE Transactions on Geoscience and Remote Sensing, vol.
  57, no. 9, pp. 7033-7047, 2020.

  [7] J.

  Zhao, W. Guo, Z. Zhang, and W. You, “A coupled convolutional neural network for
  small and densely clustered ship detection in SAR images,” Sci. China Inf. Sci.
  vol. 62, Art.No. 42301, 2019.

  [8] Z. Zhang, W. Guo, S. Zhu and W. Yu, "Toward Arbitrary-Oriented Ship Detection
  With Rotated Region Proposal and Discrimination Networks," in IEEE Geoscience and
  Remote Sensing Letters, vol. 15, no. 11, pp. 1745-1749, Nov. 2018.

