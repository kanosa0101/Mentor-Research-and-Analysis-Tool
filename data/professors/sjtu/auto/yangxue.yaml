bio_raw: '研究方向

  上海交通大学长聘教轨助理教授，博士生导师，酷哇科技首席科学家，上海市启源青年学者，曾入选第十届中国科协青年人才托举工程、2023年CCF博士学位论文激励计划、2023年上海交通大学优秀博士论文、2022年CCF-CV学术新锐学者奖，并连续多年入选爱思唯尔中国高被引学者名单和斯坦福大学评选的全球前2%顶尖科学家榜单。主要研究方向为智能体、多模态大模型、

  空间智能和

  遥感影像解译。在TPAMI/IJCV/CVPR/NeurIPS等CCF-A类期刊和会议上发表80余篇论文，包含一篇Paper Digest最具影响力AAAI21论文榜首、一篇《Remote
  Sensing》期刊年度最佳论文、CVPR2026最佳论文候选、多篇ESI高被引期刊论文、多篇口头/亮点会议论文，谷歌学术引用超过1.5万次，任ICLR/AAAI/NeurIPS/CVPR领域主席和《Visual
  Intelligence》编委。

  欢迎加入VisionXLab@ReThinkLab，一起做出有影响的成果！

  长期招实习生，如有意愿保研进组需要较早进组科研实习。

  如有意向请投递简历。

  通用/遥感 多模态大模型 （如一体化建模、模型后训练、评测基准）

  ，代表作：Mono-InternVL, RISEBench等

  通用/遥感 基础视觉（如检测、分割）

  ，代表作：R3Det, SCRDet, GWD, H2RBox, MMRotate等

  空间智能（如无人机、具身智能）

  ，代表作：ACE-Brain

  智能体（如自进化），代表作：SkillOpt

  工作经历

