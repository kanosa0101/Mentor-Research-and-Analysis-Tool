bio_raw: '研究方向

  微纳传感器及智能控制算法

  微纳新能源器件（太阳能电池、纳米发电机、光电化学电池）

  MEMS电子器件

  工作经历

  2024.12 - 至今，       上海交通大学自动化与感知学院，副研究员

  2020.12 - 2024.12，上海交通大学电子信息与电气工程学院，副研究员

  教育背景

  吉林大学 博士

  教学工作

  研究生基础课：《电子材料科学与工程》、《纳米科学与技术》

  科研项目

  慧眼行动前沿扫描类项目1项

  国防973专题项目1项

  国防科技重点实验室基金预研项目2项

  国家自然科学基金青年科学基金项目1项

  张江国家实验室项目1项

  企业横向微纳气体传感器研发项目1项

  研究成果

  王艳芳，副研究员，博士研究生导师。微米纳米加工技术全国重点实验室固定研究人员。作为课题负责人主持慧眼行动前沿扫描类项目、国防973专题项目、国防科技重点实验室基金预研项目、国家自然科学基金青年科学基金项目、张江国家实验室项目、企业横向微纳气体传感器研发项目等。作为主要技术骨干参加了国家重点研发项目、上海市军民融合重点项目和航天科工集团相关方向计划项目等研究工作。围绕微纳MEMS功能器件在空天、智能传感和防化等领域的重大需求，研发微纳能源器件、微纳气体传感器及微型化智能检测系统。招生范围包括：电子信息、仪器科学与控制、自动化、微电子、人工智能、材料等相关背景研究生。

  学术任职

  上海市真空学会会员

  2022年半导体与电子技术国际研讨会组委会成员

  担任International Journal of Hydrogen Energy、Ceramics International、Materials Chemistry
  and Physics、Optical Materials、Surface & Interface Analysis等多个国际期刊审稿人'
