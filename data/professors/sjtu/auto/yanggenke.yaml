  获得山西省“科学技术进步奖”二等奖（2002）；\n中国仪器仪表学会“科学技术奖”二等奖（2018）；\n中国机械工业联合会和中国机械工程学会“中国机械工业科学技术奖”二等奖（2020）；\n\
  指导博士生参加“2024中国国际大学生创新大赛”-高教主赛道-研究生创业组获得上海市竞赛第一名全国决赛竞赛金奖等多项国际国内学生竞赛奖；\n作为参与人获得国家级教学成果奖二等奖“我国控制工程领域工程硕士培养机制的研究与创新”\
