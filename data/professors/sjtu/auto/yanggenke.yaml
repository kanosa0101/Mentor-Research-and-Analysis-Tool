bio_raw: "研究方向\n系统建模、优化与调度\n工作经历\n2002 年8月~至今，上海交通大学自动化系担任教授，2003年9月起被聘为博士生导师，2018年8月被聘为上海交通大学终身教授。曾在香港理工大学任Research\
  \ assistant（2001），香港科技大学任Research assistant（2002），和香港城市大学先后兼任Associate research（2004/2005）和Research\
  \ fellow（2006）. 曾在美国弗吉尼亚大学做访问学者（2014），在英国曼彻斯特大学做访问教授（2017）等。历任上海交通大学自动化系副主任（2004.8~2010.10）、上海交通大学电子信息与电气工程学院副院长（2010.11~2012.3）、上海交通大学研究生院副院长（2012.3~2019.4）和上海交通大学创业学院副院长等。2018年12月~至今，任上海交通大学宁波人工智能研究院执行院长兼法人代表。\n\
  2000年11月~2002年7月，上海交通大学自动化系副教授。\n1998年11月~2000年10月，上海交通大学自动化系博士后。\n1987年7月~1998年9月，历任太原重型机械学院助教、讲师和副教授。\n\
  教育背景\n1995/09-1998/09，西安交通大学，系统工程研究所，博士，导师：孙国基\n1984/09-1987/07，西南大学，数学系，硕士，导师：黄绍文\n\
  1980/09-1984/07，山西大学，数学系，学士，导师：梁展东\n教学工作\n主讲自动化系本科生课程“计算机控制技术基础”，2004~2018，该课程曾获评上海市精品课程，曾主编普通高等教育“十一五”国家级规划教材“微型计算机控制技术“国防工业出版社等。\n\
  主讲自动化系研究生课程“运筹与优化”等。\n科研项目\n主持国家自然科学基金“复杂切换流网络的混合系统控制方法研究”（60174009，2002-2004） “机器生命周期指标变化下制造问题的协调控制与优化算法研究”（60574063，2005-2008）\
  \ “供应链的结构与动态的自组织演化分析与控制研究 ”（61074151，2011-1013），上海市自然科学基金”综合电力系统的多尺度建模与可靠控制“（16ZR1416500，2016-2019），上海市教育委员会科研创新项目“城市区域交通网拥堵的预防与排除策略研究”等，参与自然基金重点项目“大型城市分布式供水管网系统的建模、分析与优化调度”（61233004，2012-2017），是自然基金重大项目“大型高炉高性能运行控制方法及实现技术”\
  \ （61290323，2012~2017）子项目的负责人, 参与国家自然科学基金“混合控制系统的稳定性、符号证实方法与设计研究”（60074011，2001-2003）”，\
  \ “混合遗传算法在制造系统中的应用”（70071017，2001-2003），“基于卷积神经网络口腔肿瘤智能诊断的研究及其应用（62276074，2023.1-2026.12），和面向睡眠脑活动识别的\
  \ EEG 多元时序表征方法研究与应用（62403309，2025.01-2027.12）。是科技部重点专项研究计划课题 “面向智能制造的软件自动构造-知识驱动的软件需求建模与行为推理方法研究”（2017YFA0700602，2018.6-2023.5）负责人，\
  \ “流程工业典型场景人工智能算法及决策优化模型研究”（2020YFB1711204，2020~2023.12）子课题的负责人，和科技部 “基于机器学习的JCBC性设计技术”（ZCKY2019206B005，2019-2022）课题负责人，参与工信部智能制造系统和机器人国家科技重大专项\
  \ (2025ZD1602400，2025-2027)，并参与多项工信部课题和科技部重点研发计划(2019YFB1705801，2019YFB1705703，2019YFB1705702)等做顾问工作。主持十一五国家重大建设项目“烟大铁路轮渡渡船船岸交通控制与信号系统”（2005-2007），多年为船舶和钢铁等生产制造软件系统的开发，对这些系统的组织、协同控制、建模仿真以及信息处理方法等有较深入的理解与研究积累，如\"\
  中船重工***船舶电站监控与配电系统仿真平台\"和\"中船重工***磁信息处理控制系统\"等成为配套装备技术，持续多年主持上海语言研究所有关语音识别信息处理系统项目。\n\
