title: 长聘教轨副教授
email: crfang@sjtu.edu.cn
bio_raw: '研究方向

  信息物理系统安全，包括智能电网、工业控制系统等

  智能安全攻防平台设计，搭建虚实结合的网络攻防环境

  云网络异常检测与诊断，基于机器学习与网络遥测技术

  工作经历

  2024.01-至今，上海交通大学，自动化与感知学院，长聘教轨副教授

  2021.01-2023.12，上海交通大学，自动化系，长聘教轨助理教授

  教育背景

  2015. 09-2020.09，浙江大学，控制科学与工程学院，博士（导师：孙优贤院士、陈积明教授、程鹏教授）

  2018. 11-2019.08，新加坡南洋理工大学，访问学生

  2017. 05-2017.08，澳大利亚西悉尼大学，访问学生

  2011. 09-2015.06，浙江大学，控制科学与工程学院，学士

  教学工作

  1. 2021年-至今，《自动控制原理A》，自动化专业大三学生

  科研项目

  1、国家自然科学基金联合基金，2026.01-2029.12，参与（上海交大负责人）

  2、国家科技重大专项，参与，子课题负责人

  3、国家自然科学基金面上项目，2025.01-2028.12，主持

  4、国家自然科学基金青年项目，信息物理系统协同攻击下的脆弱性分析与安全控制，2022.01-2024.12，主持

  5、长三角科技创新共同体联合攻关项目，2022-2025，子课题负责人

  5、上海交通大学“双一流”建设项目人才科研启动经费，2021，主持

  6、阿里巴巴创新研究计划（云网络方向），2021-2023，主持

  研究成果

  Selected Publications：

  信息物理系统安全相关：

  [1] C. Fang, Y. Qi, P. Cheng, W. X. Zheng, "Optimal Periodic Watermarking Schedule
  for Replay Attack Detection in Cyber-Physical Systems". Automatica, 112: 108698,
  2020. (Regular paper)

  [2] C. Fang, Y. Qi, J. Chen, R. Tan, W. X. Zheng, "Stealthy Actuator Signal Attacks
  in Stochastic Control Systems: Performance and Limitation". IEEE Transactions on
  Automatic Control (TAC), 65(9), 3927-3934, 2020.

  [3] J. Chen, X. Gao, R. Deng, Y. He, C. Fang, P. Cheng, "Generating Adversarial
  Examples against Machine Learning based Intrusion Detector in Industrial Control
  Systems". IEEE Transactions on Dependable and Secure Computing (TDSC), DOI: 10.1109/TDSC.2020.3037500,
  2020.

  [4] C. Fang, Y. Qi, P. Cheng, W. X. Zheng, "Cost-Effective Watermark Based Detector
  for Replay Attacks on Cyber-Physical Systems." In ASCC, Gold Coast, Australia, 940-945,
  2017.

  云网络异常检测与诊断相关：

  [5] C. Fang, H. Liu, M. Miao, J. Ye, L. Wang, W. Zhang, D. Kang, B. Lyu, S. Zhu,
  P. Cheng, J. Chen, "Towards Automatic Root Cause Diagnosis of Persistent Packet
  Loss in Cloud Overlay Network". IEEE/ACM Transactions on Networking, accepted, 2021.

  [6] C. Fang, H. Liu, M. Miao, J. Ye, L. Wang, W. Zhang, D. Kang, B. Lyu, P. Cheng,
  J. Chen, "VTrace: Automatic Diagnostic System for Persistent Packet Loss in Cloud-Scale
  Overlay Network". In ACM SIGCOMM, Virtual Event, 31-43, 2020.

  [7] H. Liu, C. Fang, Y. Qi, J. Bai, S. Wang, X. Xiao, D. Kang, B. Lyu, P. Cheng,
  J. Chen, "Towards Real-Time Core Devices Anomaly Detection Through Traffic Data
  in Cloud Network". In IEEE/IFIP Network Operations and Management Symposium (NOMS),
  1-6, 2020.

  [8] Y. Qi, C. Fang, H. Liu, D. Kang, B. Lyu, P. Cheng, J. Chen, "A Survey of Cloud
  Network Fault Diagnostic Systems and Tools". Frontiers of Information Technology
  and Electronic Engineering (FITEE), DOI: 10.1631/FITEE.2000153, 2020.

  荣誉奖励

  - 2026 年上海市教学改革推进项目重点项目（高等教育类）（研究生教育）

  - 2025年上海市东方英才计划（青年）

  - 2024年中国自动化学会科技成就奖（创新团队）

  - 2024

  年中国自动化学会（CAA）自然科学奖一等奖

  - 2023年中国自动化学会（CAA）科技进步奖一等奖

  - 2022年中国科协青年人才托举工程

  - 2021年中国计算机学会（CCF）技术发明一等奖

  学术任职

  2025-至今，IEEE Network， Technical Editor'
