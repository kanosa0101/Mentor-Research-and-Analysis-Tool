bio_raw: '研究方向

  微纳代谢型生物传感器、医学人工智能。

  工作经历

  2022.02-至今        上海交通大学 研究员

  2017.09-2022.01  电子科技大学 研究员

  2016.01-2017.08  朗玛信息股份公司(300288)首席科学家

  2014.05-2015.12  MIT-SUTD 博士后研究员

  教育背景

  2006.09-2010.06  电子科技大学                 信息对抗技术专业   学士学位

  2011.08-2014.05  新加坡南洋理工大学      生物医学工程专业   博士学位

  科研项目

  国家自然科学基金委青年科学基金（B类）

  国家重大工程（新质生产力培育专项）

  国家科技重大专项

  国家重点研发计划

  国家工信部-国家药监局人工智能器械联合揭榜挂帅项目

  研究成果

  长期致力于微纳代谢型生物传感器与医学人工智能研究。

  在Nature Electronics, Nature Communication, Advanced Materials, Advanced Functional
  Materials, Angew Chem, ACS Sensor, AC/SNB/BB, IEEE Trans/Journals系列等期刊和CCF A类ICML人工智能顶会论文发表200余篇，H-index
  60，学术引用1.2万余次，其中ESI高被引/热点论文19篇，连续四年入选斯坦佛大学全球前 2% 顶尖科学家榜单（2025年、2026年入选终身科学影响力榜单），担任Translational
  Medical Engineering编委，出版《智能生物传感：器件与系统》等专著4本；申请国家发明专利130余项，其中70余项授权，实现了技术转化，获批二/三类器械注册证30余张；两次荣获中国光学工程学会科技进步一等奖（排名第1，2023年；2025年）。

  主要学术创新成果如下：

  1. 揭示了传感响应时序调控的增敏降噪机理，极大提升了传感器的信噪比；

  2. 提出了多模态三维活性探针，实现了传感器高抗内源性干扰性能；

  3. 创建了规模化制造过程中的AI质控系统，完成了生物传感器的一致性批量制造与产业化应用；

  4. 构建了全新双流增强网络 DSENet，攻克了动态传感领域里的非平稳时间序列中长期趋势与局部突变难以兼顾的核心技术难题。

  荣誉奖励

  国家高层次青年人才、杰出工程师青年奖获得者

  国家科技重大专项首席科学家

  国家重点研发计划首席科学家

  国家重大工程（新质生产力培育专项技术总负责人）

  国家工信部-国家药监局人工智能器械联合揭榜挂帅项目首席科学家

  连续四年入选斯坦佛大学全球前 2% 科学家榜单（2025年、2026年入选终身科学影响力榜单）

  两次荣获中国光学工程学会科技进步一等奖（排名第1，2023年、2025年）

  学术任职

  中国分析测试协会检验检测POCT分会副主任委员

  中国医疗器械行业协会标委会委员/药监局审评中心外聘专家

  Smart Materials and Device 编委

  Opto-Electronic Discovery（OED，光电发现）期刊编委

  Translational Medical Engineering（TME转化医学工程）编委'
