title: 长聘教轨副教授
email: tonystar@sjtu.edu.cn
bio_raw: '研究方向

  围绕量子互联网展开研究，其中包含

  量子通信网络实验、

  量子集成化芯片研制、数字信号处理算法开发。

  工作经历

  2020-2023，上海交通大学，电子信息与电气工程学院，感知科学与工程学院，助理教授

  2024-至今， 上海交通大学，自动化与感知学院，副教授

  教育背景

  2011-2015，上海交通大学，电子信息与电气工程学院，信息工程，本科

  2015-2020，上海交通大学，电子信息与电气工程学院，信息与通信工程，博士

  教学工作

  本科生课程《信号与系统（B类）》

  本科生课程《实验室实习》

  本科生课程《工程实践与科技创新Ⅰ》

  科研项目

  国家自然科学基金面上项目，2026.01-2029.12

  国家自然科学基金青年项目，2022.01-2024.12

  上海市自然科学基金项目，2025.07-2028.07

  研究成果

  以第一或通信作者在Physical Review Letters、Optica、Research、Photonics Research、Physical Review
  Applied、Optics Letters、New Journal of physics和Physical Review A等国际知名学术期刊发表SCI论文30余篇，学术引用1000余次，授权发明专利10项，参与编写工信部行业标准1项。

  荣誉奖励

  中国电子学会技术发明奖。

  中国国际大学生创新创业大赛上海赛区优秀指导老师。

  上海交通大学青年教师教学竞赛一等奖。

  上海交通大学教师教学设计创新大赛二等奖。

  上海交通大学本科招生工作先进个人。

  指导学生获国家奖学金、校级优秀毕业生等多项荣誉。

  学术任职

  Opt. Lett., Opt. Express, Sci. Reports, Phys. Rev. Applied, Phys. Rev. A, J. Lightwave
  Technol.等期刊审稿人。'
