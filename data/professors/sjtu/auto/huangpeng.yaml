bio_raw: '研究方向

  量子保密通信,量子信息理论,线性光量子计算

  工作经历

  2013-2015,上海交通大学,电子信息与电气工程学院,博士后

  2015-2017,上海交通大学,电子信息与电气工程学院,助理研究员

  2017至今,上海交通大学,电子信息与电气工程学院,副研究员

  教育背景

  2002-2006,南昌大学,通信工程,工学学士

  2006-2009,南昌大学,信号与信息处理,工学硕士

  2007-2009,海交通大学,信号与信息处理,硕士访学

  2009-2013,上海交通大学,通信与信息系统,工学博士

  科研项目

  2021-2026, 连续变量光纤量子通信接入关键技术研究, 科技创新2030国家重大专项，参与

  2019-2026，连续变量量子接入网关键技术研究，上海市重大专项，子课题负责人

  2020-2023，高性能本地本振连续变量量子密钥分发技术研究，国家自然科学面上项目，主持

  2020-2023，空地一体化连续变量量子保密通信示范网络，广东省重点领域研发计划，参与

  2017-2021，基于多参量量子探测的光学关联成像理论与实验研究，国家自然科学基金重点，参与

  2016-2021，高性能测量设备无关量子通信协议的构造和验证，国家重点研发计划项目，参与

  2017-2020，自由空间连续变量量子密钥分发理论与实验研究，国家自然科学面上项目，主持

  研究成果

  1） 长距离传输技术：首创性地提出了基于非高斯操作及基编码长距离高抗噪连续变量量子密钥（CVQKD）理论方案（Phys. Rev. A, 97: 042311,
  2018)，国际上率先突破了百公里高斯调制单模光纤安全传输距离CVQKD （Sci. Rep. 6: 19201, 2016)，并将离散调制CVQKD提升40dB传输衰减（Research,
  8: 0691, 2025)；

  2）高速传输技术：实现了实际光纤条件下基于热态光源的被动态CVQKD安全成码实验（New J. Phys., 23: 113028 (2021)），并在5km标准单模光纤下安全密钥率率先突破Gpbs，达到创世界纪录的1.09Gbps（Photonics
  Res., 12: 1485, 2024），该方案无需高性能相干光源、有源高斯调制器及随机数源，极大简化了CVQKD实现方式，为高速及超高速集成化CVQKD实现提供了解决方案；

  3）自由空间传输技术：全面研究了大气效应对CVQKD的影响(New J. Phys. 20: 083037 (2018))，提出了针对自由空间CVQKD的系列过噪声抑制、参数评估、数据同步及数据采集等系列关键技术(Phys.
  Rev. Applied, 12: 024041, 2019；Opt. Lett., 45: 5921, 2020; Opt. Express, 28: 10743,
  2020; Opt. Express, 31: 7383, 2023)，填补了该方向技术空白，率先实现了CVQKD在实际散射介质(Opt. Lett., 46:
  5858, 2021)及湍流信道下(Opt. Lett., 48: 1184, 2023; npj quantum information, 11:134, 2025)的安全成码，以及创纪录的9.6公里外场自由空间CVQKD安全成码最远记录；

  4）实际应用安全技术：提出激光注入攻击(Opt. Express, 27: 27369, 2019)、衰减器攻击(Phys. Rev. A, 100: 012313,
  2019)、调制器芯片攻击(Phys. Rev. A, 103: 032611, 2021；Opt. Express, 32: 33423, 2024)及双折射攻击（Opt.
  Express, 33: 21736, 2025）等系列攻击方案，并提出了基于机器学习(Phys. Rev. A, 97: 022316, 2018)、异步查找通信(Phys.
  Rev. A, 95: 052302, 2017)等系列高效安全防御方案。

  5）工程样机研制：构建了国际上首套高速CVQKD高速原型系统，其主频达到25MHz，50km标准单模光纤下最终平均成码率52kbps，为当时有报道的国际上最高速率CVQKD实验原型系统，并利用连接上海交大四个校区的实际光网络在国际上首次实现了基于实地网络的CVQKD；

  荣誉奖励

  2016年：湖南省自然科学二等奖（排名第5）

  2016年：上海交通大学晨星计划（C类）

  2016年：上海交通大学教职工考核优秀

  2020年：上海交通大学教职工考核优秀

  2021年：电院优秀共产党员

  2022年：湖南省自然科学二等奖（排名第3）

  学术任职

  合肥国家实验室双聘研究员，上海量子科学研究中心项目研究骨干，SCI权威期刊Symmetry主题编辑，Mathematics及entropy期刊客座编辑;

  国际电联（ITU）量子信息焦点组FG-QIT4N担任WG2组量子密钥分发网络协议共同编辑;

  Phys. Rev. Lett., Optica, Laser & Photonics Review, Quantum Sci. Tech., Opt. Lett.,
  Sci. China, Future Generation Computer Systems, Phys. Rev. Applied,  J. Lightwave
  Technol.等著名SCI期刊审稿人。'
