title: 长聘教轨副教授
email: xduan@sjtu.edu.cn
bio_raw: '研究方向

  多智能体对抗决策：巡逻规划、追逃博弈

  不确定环境下的决策博弈和控制：马氏决策过程、强化学习

  多智能体协同：网络化控制、机器人感知规划

  工作经历

  2025.01-至今，上海交通大学，自动化与感知学院，长聘教轨副教授

  2022.02-2024.12，上海交通大学，自动化系，长聘教轨助理教授

  2021.01-2022.02，德克萨斯大学奥斯汀分校（UT Austin），博士后

  教育背景

  2016.09-2020.12，加州大学圣塔芭芭拉分校（UC Santa Barbara），机械工程系，博士

  2013.09-2016.03，浙江大学，控制科学与工程学院，硕士

  2009.09-2013.06，北京理工大学，自动化学院，学士

  教学工作

  秋季学期，网络优化，大四IEEE班自动化方向

  春季学期，多智能体系统导论，研究生课程

  详见：https://xmduan.github.io/teaching.html

  研究成果

  X. Duan, Y. Savas, R. Yan, Z. Xu, U. Topcu. On the Detection of Markov Decision
  Processes, Automatica, 175: 112196, 2025.

  W. Wang, J. He, X. Duan*. On the Trade-off Between Efficiency and Unpredictability
  in Stochastic Robotic Surveillance. IEEE Control Systems Letters, 8: 2829-2834,
  2024.

  W. Wang, X. Duan*, J. He. Multi-Robot Stochastic Patrolling via Graph Partitioning.
  IEEE Transactions on Control of Network Systems, 12(1): 300-312, 2025.

  R. Yan, X. Duan, R. Zou, X. He, Z. Shi, F. Bullo. Multiplayer Homicidal Chauffeur
  reach-avoid games: A pursuit enclosure function approach. Automatica, 167: 111770,
  2024.

  X. Duan, Z. Xu, R. Yan, U. Topcu. Privacy-Utility Trade-Offs Against Limited Adversaries.
  IEEE Transactions on Automatic Control, 69(1): 519-526, 2024.

  X. Duan, S. Jafarpour, F. Bullo. Graph-Theoretic Stability Conditions for Metzler
  Matrices and Monotone Systems. SIAM Journal on Control and Optimization, 59(5):
  3447-3471, 2021.

  X. Duan, F. Bullo. Markov Chain-Based Stochastic Strategies for Robotic Surveillance.
  Annual Review of Control, Robotics, and Autonomous Systems, 4: 243-264, 2020.

  X. Duan, M. George, R. Patel, F. Bullo. Robotic Surveillance Based on the Meeting
  Time of Random Walks. IEEE Transactions on Robotics, 36(4): 1356-1362, 2020.

  X. Duan, M. George, F. Bullo. Markov Chains with Maximum Return Time Entropy for
  Robotic Surveillance. IEEE Transactions on Automatic Control, 65(1): 72-86, 2020.

  详见：https://xmduan.github.io/publication-topic.html

  荣誉奖励

  2024，第十届国际水下系统与技术会议最佳论文奖

  2024，第43届中国控制会议张贴论文提名奖（通讯作者）

  2023，第7届全国集群智能与协同控制大会最佳学生论文奖（通讯作者）

  2023，国家高层次青年人才（海外）

  2022，上海海外高层次青年人才

  2022，上海市浦江人才'
