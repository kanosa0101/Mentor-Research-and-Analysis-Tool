title: 副教授
email: bighuang@sjtu.edu.cn
bio_raw: '研究方向

  研究方向涵盖声学理论、信号处理、AI在机电控制与物联网的应用。聚焦新型声学器件和材料研究，工程声测量，基于AI的异音检测；边缘AI与云端数据库。

  工作经历

  1997年获得上海交通大学机械系学士学位

  2000年获得上海交通大学机械电子硕士学位并留校任教

  2004年获Rayleigh奖学金资助赴英国南安普敦大学的声与振动研究所（ISVR）攻读工程声学博士学位

  2008年回电院任教至今

  教学工作

  本科课程：离散时间信号处理（数字信号处理），信息与感知（力学和声模块）；

  研究生课程：机械动力学与控制，高级数字信号处理（随机信号模块）。

  科研项目

  飞机舱内异常声AI识别。

  电梯声品质智能监测。

  航空用轻薄型声学超材料研究。

  基于导波的钢轨裂缝在线检测技术。

  基于蓝牙信标的资产无线定位技术。'
