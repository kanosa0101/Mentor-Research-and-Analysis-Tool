  1.  国家自然科学基金(面上项目)，矩阵权重网络多自主体系统的一致性分析与设计，2024-01至2027-12，主持

  2. 上海市自然科学基金，基于类脑学习机理的决策网络及算法研究，2019-06至2022-06， 主持

