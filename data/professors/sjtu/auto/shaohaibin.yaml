bio_raw: '研究方向

  研究方向

  ：具身群体智能、多智能体系统、集群无人系统。

  欢迎来自不同学科专业（

  自动化、计算机、航空航天、船舶与海洋、数学和系统科学等

  ）的同学联系讨论与咨询!

  1.

  博士后

  ：招收集群无人系统和群体智能方向博士后

  2-3

  人。

  2.

  研究生

  ：招收2026、2027年

  博士生

  和

  硕士生（分布式控制理论、分布式多模态认知、人型/四足机器人、机械臂灵巧手、无人机/车/艇等方向）。

  3.

  本科生

  ：欢迎对研究方向感兴趣的同学加入课题组进行科研、竞赛等活动。

  欢迎数理基础扎实或工程能力突出的你申请本科生科研项目、硕士/博士研究生以及博士后研究员。

