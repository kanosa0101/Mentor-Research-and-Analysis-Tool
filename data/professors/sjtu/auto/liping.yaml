bio_raw: '研究方向

  测量仪器和传感器技术、能量采集和自供电技术、电子电路和信息获取技术

  工作经历

  1984年-1986年在华北电力大学电子系任助教；

  1987年-2016年在重庆大学光电工程学院任教，2003年被重庆大学聘为教授、博士生导师；

  2016年至今在上海交通大学电子信息与电气工程学院工作，2016年1月被上海交通大学聘为教授、博士生导师。

  1999年在日本丰田公司从事压电微陀螺研究；

  2004年11月-2005年3月在美国Notre Dame大学从事无线传感网络方面研究；

  2005年4月-2005年12月在美国University of California at Los Angeles(UCLA)从事磁传感器、自供能和智能材料方面研究。

  教育背景

  1980-1984年重庆大学无线电技术专业本科

  1992-1995年重庆大学仪器科学与技术硕士

  2000-2003年重庆大学仪器科学与技术博士

  教学工作

  本科课程，模拟电子技术

  科研项目

  1、国家重点研发计划，

  磁电耦合自供能磁场敏感元件及传感器，

  2022YFB3205700

  2、国家重点研发计划，基于声波新原理激励小型化天线技术，2021YFA716501

  荣誉奖励

  先后九次申请获得国家自然科学基金资助(其中二项重点项目)，一项结题重点项目评审为“A”， 二个面上项目结题评审为“特优”。作为负责人承担国家重点研发计划、国家863计划、国家自然科学基金等国家项目10余项。作为负责人/主研人承担国家级、省部级课题40余项。以第一获奖人获省部级（包括一项教育部）自然科学二等奖2项、省部级科技进步二等奖1项。在国际著名期刊发表学术论文300余篇，
  其中SCI检索论文250余篇，获得授权发明专利64项。 指导博士/硕士研究生100余人。2人分别获2016年和2025年中国仪器仪表学会测量控制与仪器仪表领域全国优秀博士学位论文，2人获得省级优秀博士学位论文，培养的研究生多次获得过中国仪器仪表奖学金一等和二等奖、全国传感器大赛一等和二等奖。

  学术任职

  担任中国仪器仪表学会传感器分会常务理事、《传感器与微系统》杂志编委。多次担任国际学术会议分会主席、大会程序委员会委员。'
