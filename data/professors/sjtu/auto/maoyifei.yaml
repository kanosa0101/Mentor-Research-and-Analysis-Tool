bio_raw: '研究方向

  纳米光子学，光场调控，微纳加工技术，纳米激光器

  工作经历

  2022.1-至今 长聘教轨副教授, 感知科学与工程学院，上海交通大学

  2017.7-2021.12  博士后, 物理学院，北京大学

  教育背景

  2012.9-2017.6    博士，信息科学技术学院，微电子与固体电子学, 北京大学

  2008.9-2012.6   本科，微电子学院，微电子学，西安电子科技大学

  教学工作

  本科生课程：《现代光学基础》

  本科生课程：《工程实践与科技创新IV》

  本科生课程：《实验室实习》

  研究生课程：《学术写作、规范与伦理》

  研究成果

  拓扑光子学

  基于能带折叠的高鲁棒性二次谐波生成。我们在理论上，利用晶格周期加倍下布里渊区折叠，实现在整个布里渊区高Q值模式。可高效率生成的二次谐波，并对铌酸锂的加工误差具有鲁棒性。理论上实现了在低泵浦强度(2
  kW/cm2)下的高二次谐波转化效率(2.26%)。( Physical Review B, 2025, 111, 15, 155302.)

  光场动态调控

  基于损耗诱导的BIC可调纳米激光器。我们在实验上，利用欧姆损耗诱导BIC模式在激射过程的竞争关系，实现激光辐射性能的动态控制。激光方向变化角度>30°，激射波长调制范围294
  nm， 器件尺寸<25 um（比同类器件缩小1-2量级），波束产生和切换一体化完成。(Laser & Photonics Reviews, 2025, e00413.)

  基于相变材料的涡旋光动态生成方法。我们在理论上，利用BIC在动量空间中各向异性的偏振分布，实现了高纯度的OAM。利用相变材料控制入射光与不同BIC相互作用，实现了不同阶数OAM的动态切换。生成OAM纯度高达98%，加工误差下达80%，且对入射光位置不敏感。(Optics
  Communications, 2025, 583, 131799.)

  基于连续域束缚态的波束位移动态调控。我们在理论上，利用BIC的偏振特性所提供的PB相位和交叉极化相位梯度产生的横向和纵向位移，结合电光效应以及相变材料设计了一种光束位移动态可调的光子晶体。(Chinese
  Optics Letters, accepted.)

  基于拓扑荷分裂与合并的波束控制方法。我们利用GST相变材料动态调控超表面动量空间的拓扑电荷演变，理论上实现了一种高性能光束控制器。通过在拓扑电荷的整数态和半整数态之间切换，波束扫描方向可在160°范围内切换。此外，该器件在保持紧凑尺寸（30
  um）的同时，还表现出良好的辐射效率（>80%）。该基于GST相变材料的光束控制方法可应用于光通信、可调谐激光器以及激光雷达等领域。(Laser & Photonics
  Reviews, 2024, 18, 9, 2301233.)

  微纳光电器件

  钠基等离激元纳米激光器。研究团队解决了金属钠薄膜的制备及与微纳加工的兼容性问题，研制出了钠基通讯波段等离激元纳米激光器，室温下器件的光泵激射阈值仅为140千瓦每平方厘米，创造了同类等离激元纳米激光器室温激射的阈值新低。该工作入选2020年度中国半导体十大研究进展、2020年度中国光学十大进展（基础研究类）。(Nature,
  2020, 581,7809, 401-405. )

  三维纳米手性光学天线。研究团队实现了基于单根三维纳米螺旋的偏振光调制器。利用先进微纳加工技术制备得到三维纳米螺旋结构，并在实验上首次测量了单个结构的旋光光谱，实现了对光偏振的调制。该三维手性纳米天线结构还伴随着近场区域内光自旋密度的增强，在生化分子手性性质的超灵敏检测方面有重要应用。(Advanced
  Materials, 2017, 1606482 (1-6).)

  三维动态可调超材料。研究团队实现了一种三维动态可调超材料。利用先进微纳制备工艺和MEMS技术制备得到超材料阵列，每个纳米单元可在电流控制下可进行三维动态形变，调控精度<100>95%。(Nano
  Letters, 2016, 16(11), pp 7025-7029.)'
