bio_raw: '研究方向

  长期从事卫星编队复杂动力学建模、控制及其系统仿真研究；基于AGI的博弈演进技术；卫星集群精密编队设计与控制；卫星系统智能协同规划与仿真，等。

  工作经历

  2005年起就职于上海交通大学

  2016年起担任航空航天学院研究员一职

  2021年任命为感知学院院长

  教育背景

  2000.09 ~ 2004.06，哈尔滨工业大学，博士

  1998.09 ~ 2000.06，哈尔滨工业大学，硕士

  1993.09 ~ 1997.06，哈尔滨工业大学，学士

  科研项目

  2020.01 ~ 2023.12，国家民用空间基础设施建设项目，2020年-2023年，项目负责人，1970万；

  2018.01 ~ 2021.12，我国民用首个卫星编队半实物仿真试验，2018-2021年，项目负责人，700万；

  2018.01 ~ 2020.12，我国民用首个卫星编队长期任务规划研究，2018年-2020年，项目负责人，225万；

  2016.01 ~ 2018.12，我国首套卫星编队设计和长期规划系统，2016年-2018年，项目负责人，370万；

  2016.01 ~ 2017.12，我国首个卫星编队半实物仿真与分析，2016年-2017年，项目负责人，1250万；

  2011.01 ~ 2017.12，高分重大专项集群自主维持控制技术，2011年-2017年，项目负责人，3000万；

  2016.01 ~ 2018.12，我国首个近距离精密编队控制技术研究，2016年-2018年，项目负责人，265万...

  研究成果

  从卫星编队共性技术入手,开展编队构形设计、构形维持动力学与控制、智能规划调度和地面仿真验证等技术研究,支撑我国分布式遥感以及在轨服务相关重大工程基本研究,预先研究和装备型号研制。目前研究成果已成功应用于我国首个在轨精密编队卫星“天绘二号”,首个差分测量编队“L波段差分SAR卫星系统”,以及后续天绘系列等装备预研、型号研制和在轨应用,推动我国卫星编队技术从理论研究走向工程实践,填补该领域多项技术空白。成果通过教育部科技司组织的成果鉴定会,王礼恒、包为民院士等与会专家一致认为“编队构形设计和保持控制技术处于国际领先水平,取得了显著的经济、军事和社会效益,具有广阔的应用前景和重要的推广价值”。

  邵晓巍，张德新，陈筠力，王雅楠. 分布式卫星编队设计与控制M，北京：国防工业出版社，2021.

  Sun R，Wang J，…，Shao X*. Neural-network-based sliding-mode adaptive control for spacecraft
  formation using aerodynamic forcesJ. Journal of Guidance，Control，and Dynamics，2018，41(3):
  757-763.

  Wang J，Wang J，…，Shao X*. Stochastic feedback based Kalman filter for nonlinear continuous-discrete
  systemsJ. IEEE Transactions on Automatic Control，2017，63(9): 3002-3009.

  Wang J，Zhang D，…，Shao X*. New version of continuous–discrete cubature Kalman filtering
  for nonlinear continuous–discrete systemsJ. ISA transactions，2019，91: 174-183.

  Shao X*，Song M，Wang J，et al. Satellite formation keeping using differential lift
  and drag under J2 perturbationJ. Aircraft Engineering and Aerospace Technology，2017，89(1):
  11-19.

  荣誉奖励

  2023年获上海交通大学十大科技进展

  2021年获上海市科技创新行动计划优秀学术带头人

  2008年获上海市青年教师人才基金

  学术任职

  上海航天编委及空间智能控制技术重点实验室委员

  国家“在轨服务重大专项”，专家组成员

  国家“高分辨率对地观测系统重大专项”，专家组成员

  上海市智能控制技术重点实验室学术委员会，委员

  “空间基础设施专项”卫星系统，副总设计师'
