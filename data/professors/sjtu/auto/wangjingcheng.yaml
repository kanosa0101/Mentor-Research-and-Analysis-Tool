title: 长聘教授
email: jcwang@sjtu.edu.cn
bio_raw: '研究方向

  工业智能与大数据分析，数据驱动建模与在线优化，实时系统控制与仿真，过程控制与优化等

  围绕上述方向欢迎博士后和科研助理加盟！

  工作经历

  2017/1 - 至今 上海交通大学，自动化系，长聘教授

  2006/8 - 至今 上海交通大学，自动化系，教授

  2000/11-2002/5 德国洪堡学者

  2000/2 - 2006/8 上海交通大学，自动化系，副教授

  1998/3 - 2000/1 上海交通大学，控制科学与工程博士后流动站，博士后

  教育背景

  1995/3 - 1998/1，浙江大学，工业自动化，博士

  1992/9 - 1995/2，西北工业大学，飞行器控制、制导与仿真，硕士

  1989/7 - 1993/7，西北工业大学，教改班，自动控制，学士

  科研项目

  主持或参与国家重大专项、重点研发计划、973计划、863重点项目、国家自然科学基金重点和面上项目等国家与省部级及企业委托开发项目100余项。

  已合作编书1本（《智能控制》），发表学术论文200 余篇，其中SCI收录100余篇。专利申请或授权50余项。

  研究成果

  工业过程智能优化与控制，中国自动化学会科技成就奖（创新团队），2024年度

  (1) Yanjiu Zhong; Jingcheng Wang; Jiahui Xu; Shunyu Wu; Jun Rao; Kangbo Dang

  ,

  Prediction of Energy Consumption in Horizontal Roughing Process of Hot Rolling Strip
  Based on TDADE Algorithm, IEEE Transactions on Automation Science and Engineering,
  2024, 21(1): 555-568

  (2) Jiahui Xu; Jingcheng Wang; Yanjiu Zhong; Jun Rao; Shunyu Wu

  ,

  Reinforcement Learning Controller Design for Discrete-Time-Constrained Nonlinear
  Systems With Weight Initialization Method, IEEE Transactions on Systems, Man, and
  Cybernetics: Systems, 2024, 54(4): 2368-

  2378

  (3) Shangwei Zhao; Jingcheng Wang; Haotian Xu; Bohui Wang

  ,

  Composite Observer-Based Optimal Attitude-Tracking Control with Reinforcement Learning
  for Hypersonic Vehicles, IEEE Transactions on Cybernetics, 2023, 52(2): 913-926

  (4) Haotian Xu; Jingcheng Wang; Bohui Wang; Hongyuan Wang

  ,

  An Improved Distributed Nonlinear Observer for Leader-Following Consensus Via Differential
  Geometry Approach, IEEE Transactions on Systems, Man, and Cybernetics: Systems,
  2022, 52(10): 6085-6098

  (5)

  Jun Rao, Jingcheng Wang, Jiahui Xu, Yanjiu Zhong, Tracking Control for Nonlinear
  Multi-agent Systems: a First-order DPG Framework with Initial Admissible Control
  Policy Method, Nonlinear Dynamics, 2025, 113: 18177–18194

  etc.

  荣誉奖励

  德国洪堡学者，入选教育部新世纪人才计划和上海市启明星人才计划及跟踪计划，曾获中国自动化学会科技成就奖（创新团队）、中国自动化学会技术发明一等奖、上海市自然科学一等奖、上海市科技进步一等奖、教育部科技进步二等奖等。指导学生曾获中国电子学会/仿真学会优秀博士论文，CAA-ABB智能技术创新大赛全国冠军（唯一最高奖项）等。现为中国自动化学会过程控制专委会常务委员、中国自动化学会大数据专委会委员，中国仪器仪表学会智能工厂专委会理事等。'
