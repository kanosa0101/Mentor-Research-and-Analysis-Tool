title: 长聘教授
supervisor: 博导
email: than@sjtu.edu.cn
bio_raw: '研究方向

  现代检测理论与方法、声学微机电系统及应用

  工作经历

  上海交通大学长聘教授，博士生导师

  教育背景

  1999.4-2002.9 上海交通大学电子信息学院 精密仪器及机械专业，获博士学位

  1996.9-1999.3 山东大学控制理论与控制工程专业，计算机控制系统方向获硕士学位

  科研项目

  国家重点研发计划变革性技术

  国家自然科学基金航天联合基金重点

  研究成果

  研制声表面波无源无线传感系统，在电力、石油、冶金等行业获得批量应用

  构建压电微声器件多物理场耦合模型为微声滤波器龙头企业提供技术支持

  荣誉奖励

  2012年教育部新世纪人才计划

  2021年上海市优秀学术带头人

  学术任职

  中国声学学会微声分会副主任委员、IEEE超声年会程序技术委员会委员、日本Chiba大学访问教授、法国洛林大学(Institut Jean Lamour CNRS)客座教授。'
