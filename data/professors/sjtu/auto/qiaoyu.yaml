bio_raw: '研究方向

  人工智能、图像处理、机器视觉、医学影像处理、数据挖掘

  工作经历

  2010–至今，上海交通大学，自动化与感知学院，副教授

  2005–2008，新加坡科技研究局，生物医学图像研究所，高级研究员

  2002–2004，新加坡半导体技术和仪器公司，软件工程师

  1991–1994，上海机电工程研究所，助理工程师

  教育背景

  1998/10–2002/04，新加坡国立大学，电子和计算机工程系，博士

  1994/09–1997/02，上海交通大学，电信学院自动化系，硕士

  1987/09–1991/07，上海交通大学，电信学院自动化系，学士

  教学工作

  本科生课程教学：人工智能基础、机器学习与知识发现、控制导论、

  研究生课程教学：智能信息处理理论与应用、计算智能、计算机图形学、智能仪器仪表

  科研项目

  国家自然科学基金面上项目，61375048，基于模型分析的骨扫描图像计算机辅助分析系统关键技术研究，2014-2017，80万元，项目负责人

  国家自然科学基金面上项目，82470106，基于胸部CT的支气管管腔识别和肺外周病变定位多维度虚拟影像预测模型研究，2025-2028，50万元（直接），课题负责人

  国家自然科学基金重点项目，81530053，高分辨分子成像在肿瘤代谢重编程机制及精准靶点定位的基础研究，2016-2020，273万元，课题负责人

  国家重点研发计划（智能机器人）项目，2019YFB1311503，诊疗器械定位与多模态图像融合技术研发，2019-2022，200万元，课题负责人

  国家自然科学基金面上项目，61273258，多视频摄像头组网协同下目标检测分析的关键技术研究，2013-2016，81万元，课题负责人

  “交大之星”（STAR）计划重大项目，基于骨髓细胞及R带染色体核型全自动扫描分析的血液系统疾病人工智能辅助诊断系统研发和转化应用，2023-2025，400万元

  ，课题负责人

  企业合作项目，通用多协作机器人工业组装控制平台研发，2024-2025，210万元，

  课题负责人

  企业合作项目，电机类产品智能制造系统关键技术研究，2023-2025，100万元，项目负责人

  研究成果

  授权8项发明专利，5项专利为第一发明人

  教材和专著：

  《人工智能基础》，机械工业出版社， 2020

  《医学影像分析和三维重建及其应用》，上海交通大学出版社， 2015

  在重要国际学术期刊和国际学术会议上发表了80余篇论文，所发表的学术论文的累计谷歌学术引用次数1000余次

