bio_raw: '研究方向

  移动智能、边缘计算，智能网络资源优化

  科研项目

  1. 国家自然科学基金青年基金项目“工业边缘多维异构环境下的协同学习方法”，2024.（主持）

  2. NSF 项目 “Towards Automated and QoE-driven Machine Learning Model Selection for
  Edge Inference”，2020. (参与）

  3. FortiNet 企业项目: “Toward FortiVault, FortiDoc and FortiVid”, 2017. (参与）

  研究成果

  Y. Bai, L. Chen, J. Xu, "NeuE: Automated Neural Network Ensembles for Edge Intelligence."
  IEEE Transactions on Emerging Topics in Computing (TETC), 2022. （accepted）

  Y. Bai, L. Chen, S. Ren, J. Xu, "Automated Customization of On-device Inference
  for Quality-of-Experience Enhancement." IEEE Transactions on Computers (TC), 2022.
  (accepted)

  Y. Bai, L. Chen, J. Li, J. Wu, P. Zhou, Z. Xu, J. Xu, "Multi-core Federated Learning
  for Edge Computing Platforms" IEEE Internet of Things Journal (IoTJ), 2022. (accepted)

  Y. Bai, L. Chen, M. Adbel-Mottaleb, J. Xu, "Automated Ensemble for Deep Learning
  Inference on Edge Computing Platforms." IEEE Internet of Things Journal (IoTJ),
  vol.9, no.6, pp.4202-4213, 2021.

  Y. Bai, L. Chen, L. Song, J. Xu, "Risk-aware Edge Computation Offloading Using Bayesian
  Stackelberg Game." IEEE Transactions on Network and Service Management (TNSM), vol.17,
  no.8, pp.1000-1012, 2020.'
