bio_raw: '研究方向

  生物显微成像、医学图像处理、智能医疗仪器开发、可植入神经假体开发

  工作经历

  1) 2015.01~至今，上海交通大学，电子信息与电气工程学院，副研究员

  2) 2014.01~2014.12，上海交通大学，电子信息与电气工程学院，助理研究员

  3) 2011.01~2013.12，上海交通大学，生物医学工程学院，助理研究员

  4) 2008.06~2010.12，上海交通大学，生命科学技术学院，助理研究员

  5) 2006.03~2008.05，上海交通大学，生命科学技术学院，博士后

  教育背景

  1) 2002.03~2006.02，天津大学生物医学工程专业，获工学博士学位

  2) 1998.07~2002.02，天津大学生物医学工程专业，获工学硕士学位

  3) 1993.09~1998.07，天津大学生物医学工程专业，获工学学士学位

  科研项目

  1) 主持，上海交通大学 STAR 计划，高通量单分子 DNA 测序系统开发，2020.06~2023.5

  2) 技术骨干，上海市2020年度“科技创新行动计划”, 高通量荧光全内反射DNA测序仪研发，2010.10 ~2023.09

  3) 技术骨干，国家重点研发计划“数字诊疗装备研发”专项，基于国产电磁导航系统的早期肺癌精准诊疗技术集成解决方案研究, 2019.01-2021.06

  4) 技术骨干，国家重大科学仪器设备开发专项，多维高分辨率生物组织表征与分析仪器开发与应用，2013.10~2018.09

  5) 技术骨干，国家重大科学仪器设备开发专项，多模态分子影像数据分析与挖掘关键技术研究，2011.10~2016.9

  研究成果

  论文发表:

  1) Cheng H, Wu KJ*, Tian J, Ma K, Gu CC, Guan XP. Colon tissue image segmentation
  with MWSI-NET. Medical & Biological Engineering & Computing, 2022, 60:727–737.

  2) Lu CS, Gu CC*, Wu KJ. Deep Transfer Neural Network Using Hybrid Representations
  of Domain Discrepancy. Neurocomputing, 2020, 409: 60-73.

  3) Gu CJ, Gu CC*, Wu KJ, Guan XP, Zhang LJ. CAD-BASED Viewpoint Estimation of Texture-Less
  Object Using Domain Adaptation. International Journal of Robotics and Automation.
  2019, 34(6).

  4) Chao-Chen Gu, Hao Cheng, Kai-Jie Wu, etc. A High Precision Laser-Based Autofocus
  Method Using Biased Image Plane for Microscopy. Journal of Sensors, vol. 2018

  5) CHAO-CHEN GU, KAI-JIE WU, JIE HU, CHENG HAO, AND XIN-PING GUAN. Region Sampling
  for Robust and Rapid Autofocus in Microscope. MICROSCOPY RESEARCH AND TECHNIQUE,
  78(5):382-390.

  6) BQ Yang, T Zhang, CC Gu, KJ Wu, XP Guan. A novel face recognition method based
  on IWLD and IWBC. Multimedia Tools and Applications, 2016, 75(12):6979-7002.

  发明专利:

  1）用于高速显微扫描的动态对焦装置及对焦跟踪方法，ZL201610545780.7

  2）用于无限远校正显微镜的宽光谱管镜光路结构，ZL201710948690.7

  3）一种线性电动物镜切换装置，ZL201510363669.1

  4）厚样本显微荧光图像重构方法及系统，ZL201910568163.2

  5）多人同步数字化切片阅片与会诊系统及方法，ZL201510005936.8

  6）病理切片信息快速获取装置，ZL201710069634.6

  7）一种全切片图像的无参考清晰度评估方法及系统，ZL201710697583.1

  实用新型:

  1）用于高速显微扫描的动态对焦装置，ZL201620730706.8

  2）用于全自动扫描的光路横置数字显微镜结构，ZL201720885940.2

  3）高精度电动扫描台，ZL201621159778.8

  4）基于托盘的病理切片搬运装置，ZL201720807698.7'
