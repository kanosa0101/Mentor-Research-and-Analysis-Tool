bio_raw: '研究方向

  从事人工智能与新型电力系统交叉前沿方向研究：

  1、算网融合，算力网-通信网-电力网融合，异构算力-大模型调度优化。

  2、算电协同，算力大模型与新型电力系统协同优化。

  3、具身智能，新型电网数据中心及具身智能机器人模拟仿真平台。

  4、多模态感知，新型电力系统多类型异构信号的融合感知。

  5、感传控协同，绿色能源调度精准感知、鲁棒传输与可靠推理。

  6、星空地协同，面向新型电网输变电的星-空-地协同感知与决策。

  2026年9月入学，课题组招生名额，博士1人、硕士名额5-6人。

  2027年9月入学，课题组招生名额，博士3人、硕士名额5-6人。

  联系方式：彭老师，电话 13636358697，邮箱 pengyf@sjtu.edu.cn，微信 iforest2026

  工作经历

  彭云峰，博士生导师、上海交通大学国际智能创新设计研究中心主任。

  指导学生获中国国际大学生创新大赛全国金奖2项（排第一、第三），

  推理计算芯片项目已控股上市公司，数字化管理平台项目获得腾讯投资。

  牵头获上海市教学成果一等奖（排第一）及国家教学成果二等奖。

  从事面向token的算网融合关键技术及平台建设；

  牵头获IEEE Power & Energy Society 杰出个人贡献奖；

  牵头制定国家标准2项；以第一发明人申请/授权发明专利26项；

  在IEEE Trans. Power Electron.、Energy Storage等国际期刊与会议发表论文27篇；

  主持国家自然科学基金、上海市人工智能重大专项及产学研合作等项目，

  牵头科研项目总经费近8000万元。

  成果已规模化应用于全球最大沙戈荒新能源大基地、国家发改委首批绿色低碳技术示范项目。'
