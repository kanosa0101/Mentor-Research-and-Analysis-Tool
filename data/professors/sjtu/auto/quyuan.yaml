bio_raw: '研究方向

  光学检测

  工作经历

  2025年至今，上海交通大学副教授。

  2021年至2024年，上海交通大学助理教授。

  教育背景

  华盛顿大学，博士

  哥伦比亚大学，硕士

  北京理工大学，学士

  教学工作

  《程序设计思想与方法（C++）》《程序设计基础（荣誉）》

  科研项目

  国家自然科学基金青年项目，上海交大EX基金，北京金诺美生物科技有限公司研发委托。

  研究成果

  已毕业学生（去向）：廉恒昱(UNC, CS PhD)，郑轶楠（华为基站），刘博文（本校读博）。

  发表文章：

  Y Qu, H Lian, C Ding, H Liu, L Liu, J Yang, High-frame-rate reconfigurable diffractive
  neural network based on superpixels, Optics Letters 48 (19), 5025-5028 (2023).

  荣誉奖励

  浦江，海外高层次'
