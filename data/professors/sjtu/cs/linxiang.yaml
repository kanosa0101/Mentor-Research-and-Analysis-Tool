bio_raw: "个人简介\n长期从事网络舆情监测预警、互联网情报信息搜索分析与电子政务内容失泄密检查等互联网内容安全方向应用科研工作，重点攻关全球全网多通道全媒体信息主动获取、多模态信息智能融合分析与大带宽高速传输信息内容分析等共性关键技术，持续完善全球全网舆情监测预警重大工程平台；长期从事城域网络安全态势感知与监测预警、重点单位网络攻击面管理等网络安全方向应用科研工作，重点攻关加密流量威胁检测、小样本未知网络威胁建模分析与网络安全大数据融合分析与告警降噪等共性关键技术。\n\
  教授课程\nNIS3356.\n《信息内容安全》\n论文发表\n基于层次化图神经网络的\n云资产安全性分析，《信息安全学报》\nHiSec: Towards Cyber\
  \ \nThreat Correlation and \nDiscovery Based on \nHierarchical Graph \nNeural Networks，2023\
  \ Ieee 22Nd \nInternational \nConference on \nTrust, Security \nand Privacy in \n\
  Computing and \nCommunications, \nTrustcom, \nBigdatase, Cse, \nEuc, Isci 2023\n\
  面向雾计算的个性化轻量级分布式网络入侵检测系统，《网络与信息安全学报》\nProcessing capability \nand QoE driven \noptimized\
  \ computation \noffloading scheme in \nvehicular fog based F\nRAN，WORLD WIDE WEB\n\
  INTERNET AND WEB INFORMATION \nSYSTEMS\nToward adaptive BDCT \nfeature representation\
  \ \nbased image splicing \nmeasurement in smart \ncities，MEASUREMENT\n资助项目\n上海未来科技安全风险态势研判与防控体系研究，上海市科学技术委员会-“科技创新行动计划”软科学研究重点项目\n\
  面向关键基础设施的网络高级持续威胁智能化分析算法研究，上海市科学技术委员会-科技创新行动计划\n网上异常模式挖掘与识\n别关键技术研究及应用，上海市科学技术委员会-重大科技攻关项目\n\
  获奖信息\n大规模云网融合系统内容高效可靠分发与主动防御技术研发及产业化，2023世界互联网大会领先科技奖\n计算机网络信息分析取证关键技术研究及应用，2013年度上海市科学技术进步奖一等奖"
