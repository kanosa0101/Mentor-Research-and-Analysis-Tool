bio_raw: '个人简介

  上海交通大学计算机学院清源研究院长聘教轨副教授，博士生导师，上海人工智能实验室双聘青年研究员。

  北京航空航天大学学士，美国北卡罗莱纳大学夏洛特分校博士学位。曾任京东硅谷研究院计算机视觉研究员、商汤科技北美智慧医疗实验室高级研究员。2021年6月加入上海交通大学清源研究院。研究领域：医学图像、文本分析，多模态决策。在国际顶级期刊及会议中发表论文数十篇，一作论文九篇。Google
  Scholar近五年引用千余次，H-index 23，申报美国专利3项。

  教授课程

  MEM8303: 人工智能

  AI2619: 数字信号与图像处理'
