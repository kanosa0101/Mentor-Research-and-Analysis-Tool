bio_raw: '个人简介

  研究方向：虚拟现实(VR/AR/MR)、计算机图形学、人机交互

  实验室主页：

  http://dalab.se.sjtu.edu.cn

  教育背景

  1995年-1998年 浙江大学计算机系CAD&CG国家重点实验室，博士

  1992年-1995年 浙江大学计算机系CAD&CG国家重点实验室，硕士

  1988年-1992年 国防科技大学计算机系，本科

  工作履历

  2003年-至今，上海交通大学计算机系、软件学院、计算机学院

  2012年-2013年，美国北卡大学教堂山分校计算机系增强现实组，访问教授

  2001年-2003年，新加坡国立大学计算机与工程系混合现实实验室，研究职位

  1998年-2001年，德国Fraunhofer研究所媒体通讯所虚拟现实系，博士后

  教授课程

  VR/AR&游戏设计与开发

  计算机图形学

  计算机动画原理与技术（研究生）

