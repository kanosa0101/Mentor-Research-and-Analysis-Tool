bio_raw: '个人简介

  林云，上海交通大学计算机科学与技术系副教授，系副主任，博士生导师，原新加坡国立大学助理教授（研究岗），入选国家海外高层次青年人才计划与

  华为x-explore人才计划

  ，毕业于复旦大学计算机学院获得博士学位。研究工作包括自动代码编程、可解释AI、网络反诈、智能体安全等。发表CCF-A类国际顶级会议和期刊论文70余篇，获ICSE2018杰出论文奖，多次获中国软件大会

  研究

  原型一二等奖。担任

  FSE 2027（CCF-A类）领域主席、

  ICECCS 2026、PRDC 2023程序委员会联合会议主席、ISACE 2025大会联合主席，ICSE、FSE、USENIX Security等重要国际会议的程序委员会委员。主持国家自然科学基金委海外优青项目及面上项目、主持多项校企合作，自动编程技术落地于豆包代码模型以及Trae
  IDE，GUI测试相关研究合作入选信通院优秀案例等。更详细内容请参见：http://linyun.info

  教授课程

  CS3604: 软件工程和项目管理

  CS7354: 开源软件技术与实践

  CS3322: 数据库原理

  CS3331: 软件工程

  论文发表

  http://linyun.info/publication.html

  学术服务

  http://linyun.info/service.html'
