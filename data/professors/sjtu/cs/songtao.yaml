bio_raw: '个人简介

  上海交通大学计算机学院副研究员，博士生导师，省部共建国家重点实验室培育基地、上海市可扩展计算与系统重点实验室、上海云计算联合实验室成员。他博士和硕士均毕业于上海交通大学计算机类相关专业，2018-2020年期间于上海交通大学从事博士后研究工作，并获得“晨星博士后”激励计划。

  他当前的主要研究方向为：

  分布式机器学习

  、

  多模态大模型

  、

  AI+X

  等领域，近年来，已在一系列计算机领域的顶级会议和期刊发表论文50余篇，包括PPoPP, SoCC, SIGKDD, VLDB, ICML, NeurIPS, CVPR,
  ICCV, ECCV, AAAI, IJCAI, ACM MM, IEEE Network, JMLR, TDSC, TBD, TDS, TCBB等。他当前主持包括国自然面上基金，国家重点研发计划课题，Intel全球大学研究资助计划在内的多个研究项目。

