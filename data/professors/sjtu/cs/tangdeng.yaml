bio_raw: '个人简介

  唐灯，博士，上海交通大学长聘副教授，博士生导师。

  2015

  年先后获得法国巴黎第八大学应用数学专业博士学位和西南交通大学信息安全专业博士学位。主要研究方向为密码算法设计与分析、密码学与隐私保护、代数编码及其应用，在

  ASIACRYPT

  、

  CHES

  、

  FSE

  、

  IEEE TIT/TC/TIFS

  、

  CiC

  、

  SCIS

  、

  DCC

  、

  SIDMA

  、

  FFA

  等国内外重要学术会议和期刊和发表研究论文六十余篇。主持国家重点研发计划课题、国家自然科学基金（青年

  1

  项、面上

  3

  项）等国家级课题

  7

  项、省部级课题

  5

  项。国家重点研发计划项目、国家自然科学基金重点项目等项目骨干。获得中国密码学会

  2019

  年密码算法学术会议最佳论文奖和全国密码算法设计竞赛分组密码算法三等奖。担任国际会议

  BFA 2023

  和

  C2SI 2023

  程序委员会委员，国际知名

  SCI

  期刊《

  Cryptography and Communications

  》编委。

  教育背景

  2012-09

  至

  2015-03

  ，

  University of Paris 8

  ，应用数学，博士

  2009-09

  至

  2015-06

  ，西南交通大学信息科学与技术学院，信息安全，博士

  2008-09

  至

  2009-08

  ，西南交通大学信息科学与技术学院，硕士生

  2004-09

  至

  2008-06

  ，西南交通大学数学学院，学士

  工作履历

  2026-01

  至今，上海交通大学，计算机学院，长聘副教授

  2020-01

  至

  2025-12

  ，上海交通大学，计算机学院，长聘教轨副教授

  2017-12

  至

  2019-12

  ，西南交通大学，数学学院，副教授

  2015-07

  至

  2017-12

  ，西南交通大学，数学学院，讲师

  教授课程

  《基础代数》、《信息安全的数学基础》、《现代密码学》、《信息论与编码》、《线性代数》、《矩阵分析》等

