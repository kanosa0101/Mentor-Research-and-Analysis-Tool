bio_raw: '个人简介

  洪佳楠，上海交通大学计算机学院（网络空间安全学院、密码学院）副研究员、硕导。中国科学技术大学博士，曾任职于华为技术有限公司云核心网NFV研究部、2012数据安全与隐私保护实验室。主持国家自然科学基金青年项目1项，科技部重点研发项目课题1项，OPPO科技有限公司横向课题1项。主要从事网络安全与隐私认证、区块链、物理层安全等方向研究。合著专著2本，发表学术论文30余篇，包括JSAC，TDSC，TIFS，TSC、ICDCS等。曾获ACM
  SIGSAC优秀博士论文奖、中科院院长奖；指导学生获2023年全国信息安全竞赛二等奖。

  教育背景

  中国科学技术大学博士 2012-2018

  中国科学技术大学学士 2008-2012

  论文发表

  [JSAC]

  Kunling Li，Jiazhong Bao，Xin Xie，

  Jianan Hong

  ，Cunqing Hua，Receiver-Agnostic Radio Frequency Fingerprint Identification for Zero-Trust
  Wireless Networks，IEEE Journal on Selected Areas in Communications, 2025，To-appear.  (CCF-A)

  New

  [IJCNN]

  Jiayue Zhou, Shiyao Wang,

  Jianan Hong*

  , Wenjun Zhu and Cunqing Hua. TG-Transformer: A Graph Transformer for Token Transaction
  Risk with Bi-Level Attention, in Proc. of IJCNN, To-appear. 2025.(CCF-A)

  New'
