bio_raw: '个人简介

  I am an research assistant professor at AGI Institute, School of Computer Science,
  Shanghai Jiao Tong University (SJTU). I obtained my B.Eng in Communication Engineering
  in 2006, and Ph.D degree in Computer Application Technology from Northeastern University,
  China in 2014.

  Prior to SJTU, I was an Assistant Professor[2015-2021] of

  Shanghai Advanced Research Institute, Chinese Academy of Sciences

  , where I worked in field of science is High-speed Train Control Strategy, Computational
  Intelligence, Software Engineering, Machine Learning and Multiple Object Tracking.

  My research interest includes machine learning, AI4Science, specifically AI for
  material design.

  工作履历

  2015-2021 Shanghai Advanced Research Institute, Chinese Academy of Sciences

  2021- School of Computer Science, Shanghai Jiao Tong University

