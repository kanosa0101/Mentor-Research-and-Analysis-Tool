bio_raw: '个人简介

  刘卫文博士现任上海交通大学计算机学院副教授，曾任华为诺亚方舟实验室主任工程师。2020年博士毕业于香港中文大学。主要研究方向包括大模型智能体、

  用户偏好建模、

  信息检索等。已在国际顶级会议和期刊发表论文80余篇，研究成果产出专利12项，并荣获DLP-RecSys 最佳论文奖。主导开发的ToolACE系列大模型在大模型工具调用国际权威榜单BFCL中同参数规模排名第一，开源模型下载量全球领先。担任GenRec-WWW,
  GenRec-CIKM, DLP-RecSys研讨会主席，长期担任 ICLR, KDD, SIGIR, IJCAI, AAAI等会议及期刊领域主席或审稿人。'
