bio_raw: '个人简介

  黄维然，上海交通大学计算机学院副教授、博导，国家人工智能学院（上海创智学院）全时导师、博导；兼任浦江国家实验室（上海 AI Lab）科研顾问，目前在国家自然科学基金委员会借调。现为
  CCF 高级会员，YOCSEF 上海通讯委员，入选 2024 年 “微软亚洲研究院铸星计划” 学者（全球 17 人），2024 年 ACM 上海地区新星（共 3
  人）。先后在清华大学获得学士和博士学位，博士期间曾赴哈佛大学访问。研究方向聚焦机器学习理论与算法，迄今累计在 NeurIPS、ICLR、ICML 等国际顶级人工智能会议上发表论文
  30 余篇，其中“噪声标签长尾问题”论文入选 ICCV 2023 (CCF-A) 最佳论文候选名单（17 / 8260），ICLR 2023 (CCF-A) 论文“自监督学习泛化能力”被图灵奖得主
  Yann LeCun 和斯隆奖得主 Thomas Goldstein 等权威专家联合撰写的自监督学习综述作为理论部分开篇介绍的首个工作。曾获得 “华为创新先锋总裁奖”
  一等奖，NeurIPS 2023 挑战赛（基于大模型的医疗图像分类）全球第一名。主持国家自然科学基金青年科学基金、上海市“通用人工智能大模型”基础研究专项，并承担腾讯、字节、阿里、百度、微软等头部企业的横向科研合作。研发的“支付行为预测模型”已在微信支付全面部署和运行，服务着数以亿计的用户。

  教育背景

  2012 – 2018：清华大学交叉信息研究院，计算机科学与技术，博士

  2009 – 2012：清华大学电子工程系，电子信息科学与技术，学士

  2008 – 2009：清华大学数理基科班

  2017/11 – 2018/02：哈佛大学，访问学者

