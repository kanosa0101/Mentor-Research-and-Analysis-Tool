bio_raw: '个人简介

  王韫博，上海交通大学副教授，专注于机器学习领域的

  世界模型

  研究，

  具体涵盖高维时序系统预测、有模型强化学习决策等关键领域，致力于通过机器学习方法解决复杂场景下的预测与决策难题

  。 主持国家自然科学基金原创探索计划项目，入选上海市青年科技扬帆计划，获CCF优秀博士学位论文奖。 谷歌学术引用超过4000次，担任NeurIPS、AAAI等会议领域主席，牵头组织NeurIPS具身世界模型Workshop。主要学术成果包括：

  Iso-Dream、LS-Imagine等有模型强化学习方法，提升具身智能、自动驾驶、开放世界游戏等环境中的智能体决策能力。

  VeoRL、CoWorld等世界模型迁移学习方法，提升具身智能体的Sim2Real与跨任务泛化能力，降低智能体训练成本。

  PredRNN等视频预测与可交互动态场景生成，应用于国家气象预报系统，提升气象预报精度与时效性

  。

  NeuroFluid等可微物理模拟与直觉物理推断技术，

  服务于

  复杂工业领域，支撑

  复杂多物理场

  的机器学习仿真。

  教育背景

  2015-2020：软件工程专业博士，清华大学

  2012-2015：集成电路工程专业硕士，清华大学

  2008-2012：电气工程与自动化专业学士，西安交通大学

  工作履历

  2024-今：上海交通大学，副教授

  2020-2023：上海交通大学，助理教授

  教授课程

  计算机科学导论（

  CS0502

  ）

  人工智能基础理论（

  JCCX0021

  ）

  论文发表

  在IEEE TPAMI、NeurIPS、ICML、ICLR等期刊和会议上发表论文30余篇。代表论文：

  [1] Video-Enhanced Offline Reinforcement Learning: A Model-Based Approach. Minting
  Pan, Yitao Zheng, Jiajian Li,

  Yunbo Wang(通讯作者)

  , Xiaokang Yang.

  ICML 2025.

  [2] Open-World Reinforcement Learning over Long Short-Term Imagination. Jiajian
  Li*, Qi Wang*,

  Yunbo Wang(通讯作者)

  , Xin Jin, Yang Li, Wenjun Zeng, Xiaokang Yang.

  ICLR 2025 Oral.

  [3] Iso-Dream: Isolating and Leveraging Noncontrollable Visual Dynamics in World
  Models

  .

  Minting Pan*, Xiangming Zhu*,

  Yunbo Wang(通讯作者)

  , Xiaokang Yang.

  NeurIPS 2022 Spotlight.

  [4] NeuroFluid: Fluid Dynamics Grounding with Particle-Driven Neural Radiance Fields

  .

  Shanyan Guan, Huayu Deng,

  Yunbo Wang(通讯作者)

  , Xiaokang Yang.

  ICML 2022 Spotlight.

  [5] PredRNN: Recurrent Neural Networks for Predictive Learning Using Spatiotemporal
  LSTMs

  .

  Yunbo Wang

  , Mingsheng Long, Jianmin Wang, Zhifeng Gao, Philip S. Yu.

  NeurIPS 2017.

  资助项目

  国家自然科学基金原创探索计划项目，流体动力学模型的视觉直觉学习，2022-2025，主持

  智能电网国家科技重大专项，极端故障工况下应急处置与协同恢复时序优化决策技术，2025-2029

  获奖信息

  CCF优秀博士学位论文奖

  学术服务

  NeurIPS、AAAI等会议领域主席'
