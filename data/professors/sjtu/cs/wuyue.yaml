  ParisTech)-

  上海交大安全与信任联合研究实验室常务副主任，上海市大数据社会应用研究会理事，上海交通大学区块链研究中心研究员，上海交通大学人工智能治理与法律研究中心研究员。

  主要研究领域为物联网安全、

  5G/6G

  移动通信安全、车联网安全、卫星网络安全和人工智能安全与隐私保护等，主持了一批重要科研项目，包括国家重点研发计划

