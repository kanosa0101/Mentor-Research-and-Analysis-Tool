bio_raw: '个人简介

  宋卓然，上海交通大学计算机学院副教授、博士生导师，主要研究方向为计算机体系结构、AI处理器芯片架构设计、GPU微架构研究。共发表论文50余篇，CCF-A类论文30余篇，曾在体系结构四大顶级会议ISCA、MICRO、ASPLOS、HPCA上发表多篇论文，并作为独立一作/通讯连续两年获EDA旗舰会议DATE最佳论文奖。主持国家自然科学基金青年/面上项目、华为、阿里巴巴、OPPO等企业课题多项。获得

  ACM中国上海分会新星奖、

  上海市计算机学会优秀博士论文（每年2-3人入选）、ACM SIGOPS ChinaSys优秀博士学位论文奖（全国系统领域2-3人入选）等荣誉。曾任第27届ChinaSys
  研讨会程序委员会主席（PC Chair）、第二届CCF中国存储大会论坛主席，并担任DAC、TC、TCAD等国际会议/期刊的程序委员会委员/审稿人。详见个人主页：

  https://songzhuoran.github.io/'
