bio_raw: '个人简介

  陆海宁，上海交通大学计算机学院工程师，主要研究方向为密码软硬件安全性分析与安全实现。代表性成果是设计了一套密码电路的旁路分析软件平台，基于自主创新的分析方法和理论，实现对密码电路中常用国际标准密码算法和国密算法的旁路安全分析；与国外同类产品相比，该平台在采集质量、分析方法、分析速度和软硬件可扩展方面均具优势。因上述成果，获一次国家科学技术进步二等奖，以及两次上海市科学技术奖一等奖。

  教授课程

  《计算机组成与系统结构》本科专业基础课，32学时，2学分

  《密码工程实践》本科专业课，32学时，2学分

  《高等密码工程》研究生专业课，32学时，2学分

  获奖信息

  2017

  年国家科学技术进步奖二等奖"密码芯片系统的攻防关键技术研究及应用"

  2023

  年上海市技术发明奖一等奖"面向密码模块的新型信息泄漏分析和防护技术研究"

  2018

  年上海市科技进步奖一等奖"互联网软件的安全分析与防护"

  2015

  年上海市科技进步奖一等奖"密码芯片安全分析和防护关键技术研究及应用"'
