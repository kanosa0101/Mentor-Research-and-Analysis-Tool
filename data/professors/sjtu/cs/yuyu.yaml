bio_raw: '个人简介

  郁昱，上海交通大学特聘教授、计算机学院副院长，主要研究密码基础理论、后量子密码、隐私保护计算、侧信道攻击与防护等密码学方向，目前已于国际三大密码旗舰年会（CRYPTO、EUROCRYPT、ASIACRYPT）发表20余篇文章，解决了后量子密码领域基于LPN/LWE设计公钥加密、密钥交换协议、不经意传输和低深度伪随机函数等公开问题，突破了混淆电路、通用电路等隐私保护计算协议的性能瓶颈。

  2003年获复旦大学学士学位，2007年获南洋理工大学博士学位，之后在比利时鲁汶大学从事博士后研究，2011年回国后曾分别在华东师范大学和清华大学任教，2014年至今任教于上海交通大学。目前担任亚洲密码年会(ASIACRYPT)和公钥密码年会(PKC)的指导委员会委员，十多次担任CRYPTO、EUROCRYPT、ASIACRYPT程序委员会委员，并多次在ASIACRYPT、澳大利亚密码年会、中国密码学会年会等做会议特邀报告。同时担任了《国家科学评论》“格密码及其数学问题”特刊的编委、中国密码学会常务理事以及学会数学理论专业副主任委员、学术工作委员会和青年工作委员会委员。先后承担了国家杰出青年科学基金、国家自然科学基金重点项目、国家重点研发计划课题等，获得教育部青年长江学者(2016)、科学探索奖(2020)、中国青年科技奖(2022)、全国密码算法设计竞赛两项一等奖和中国人民银行“金融密码杯”创新赛一等奖等奖励，并入选了《麻省理工科技评论》中国隐私计算科技创新人物。

