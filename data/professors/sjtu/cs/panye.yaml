bio_raw: '个人简介

  上海交通大学计算机学院副教授。研究领域为计算机图形学，虚拟现实，AIGC；研究方向为角色动画，数字人。

  2015

  年博士毕业于伦敦大学学院，随后任迪士尼研究院副研究员。在

  IEEE VR

  、

  CVPR

  和

  TVCG

  等国际顶级会议和期刊上，发表学术论文

  50

  余篇，第一及通讯作者的

  CCF A

  类论文31

  篇，授权美国专利

  2

  项，中国专利

  2

  项。受邀担任

  IJHCS

  （

  CCF A

  类）期刊编委，

  IEEE VR/TVCG

  （

  CCF A

  类）程序委员会委员。获迪士尼创新奖（排

  1/2

  ），获

  CCF A

  类会议

  IEEEVR

  最佳论文荣誉提名奖（

  2025,

  一作）、

  CCF

  产学合作基金优秀项目奖（

  2025

  ，排

  1/1

  ）、腾讯犀牛鸟基金优秀项目奖（

  2023,

  排

  1/1

  ），入选上海海外高层次人才引进计划、中国图学学会“青年托举工程”、微软亚洲研究院“铸星计划”等

  教育背景

  2011-2016

  ，

  【

  英国

  】

  伦敦大学学院，博士

  2010-2011，

  【

  英国

  】

  伦敦大学学院，硕士

  2006-2010

  ，  电子科技大学

  /【

  美国

  】

  普渡大学，学士

  工作履历

  2026-

  今，上海交通大学，长聘副教授

  2020-2026

  ，上海交通大学，长聘教轨副教授

  2017-2020

  ，

  【

  美国

  】

  洛杉矶迪士尼研究院，副研究员

  2016-2017

  ，

  【

  英国

  】

  伦敦大学学院，高级博士后研究员'
