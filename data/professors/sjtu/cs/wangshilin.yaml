bio_raw: '个人简介

  主要从事

  多媒体信息分析与处理、多媒体信息内容安全、人工智能安全

  等方面的研究。近年来主持多项国家自然科学基金、上海市自然科学基金等项目，获得国家发明专利若干。在研究领域

  相关

  期刊

  和会议论文集中发表论文

  100

  多篇，论文

  SC

  I

  /Google Scholar

  累计引用

  3700余

  次，个人

  h-Index

  为34

  。曾获上海市科技进步一等奖、CSIG科技进步一等奖。多次指导本科生参加全国大学生信息安全竞赛，获决赛一等奖和最具创新创业价值奖。

  教育背景

  2001

  年毕业于上海交通大学通信工程系，获得学士学位；

  2004

  年于香港城市大学电脑工程与资讯科技系获博士学位。

  工作履历

  2004年入职上海交通大学，现任学院教授，博导。

  教授课程

  研究生课程：《信息论与编码》

  本科生课程：《人工智能导论》、《机器学习》。

