title: 副研究员
email: wanggxx@sjtu.edu.cn
bio_raw: '个人简介

  主要研究方向包括后量子密码，尤其是格密码的安全性分析；函数加密、同态加密等隐私计算相关密码学理论。所设计的格困难问题求解算法6次打破国际公开挑战记录。

  教育背景

  2013年于北京大学数学科学学院获理学博士学位。

  工作履历

  2018年加入上海交通大学。

  教授课程

  本科生课程：

  离散数学 2022-2024秋

  研究生课程：

  可证明安全理论 2024-至今 春

  论文发表

  1. Heuristic Algorithm for Solving Restricted SVP and its Applications.

  Geng Wang

  , Wenwen Xia, Dawu Gu. PQCrypto 2025.

  2. A Refined Hardness Estimation of LWE in Two-step Mode. Wenwen Xia, Leizhang Wang,

  Geng Wang

  , Dawu Gu, Baocang Wang. PKC 2024.

  3. Efficient Cryptanalysis of an Encrypted Database supporting Data Interoperability.
  Gongyu Shi,

  Geng Wang

  , Shi-Feng Sun, Dawu Gu. VLDBJ 2024.

  4. Functional Encryption against Probabilistic Queries: Definition, Construction
  and Applications,

  Geng Wang

  , Shi-Feng Sun, Zhedong Wang and Dawu Gu, PKC 2023.

  5. VOProof: Efficient zkSNARKs from Vector Oracle Compilers. Yuncong Zhang, Alan
  Szepieniec, Ren Zhang, Shi-Feng Sun,

  Geng Wang

  , Dawu Gu, ACM CCS 2022.

  资助项目

  国家自然科学基金青年基金

  高效函数加密设计与应用技术研究

  2023.01-2025.12

  国家密码科学基金面上项目

  面向大数据中心的人工智能模型防护研究

  2025.01- 2027.12

  获奖信息

  带领团队获得第六届“强网杯”密码数学专项赛冠军；第六届、第七届全国高校密码数学挑战赛二等奖；第十六届全国大学生信息安全作品赛二等奖等荣誉。'
