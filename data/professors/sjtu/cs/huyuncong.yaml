bio_raw: '个人简介

  胡云聪，上海交通大学计算机学院助理教授，国家高层次青年人才，上海海外高层次青年人才，小米青年学者，博导。2017年本科毕业于上海交通大学ACM班，2022年获加州大学伯克利分校博士学位，师从Raluca
  Popa教授和Alessandro Chiesa教授。主要研究方向为应用密码学和零知识证明，曾发明零知识证明算法Marlin和开源平台Arkworks，被学术界和工业界广泛采用。主持国家青年科学基金（C类），上海“科技创新行动计划”区块链关键技术攻关专项，华为ExploreX基金。担任USENIX
  Security, Asiacrypt等顶级会议PC Member。

  个人主页

