bio_raw: '个人简介

  魏星达最近的研究聚焦于面向AI的分布式系统基础设施，期望能系统性地提升 AI 训练、推理和智能体等新兴应用的性能与可靠性。

  近期的研究工作主要围绕以下几个方向展开：

  一是

  通过快速自动扩缩容和动态资源管理，构建可扩展的 AI 基础设施

  。代表性工作包括 BlitzScale（OSDI''25）、PhoenixOS（SOSP''25）和 KunServe（EuroSys''26）。

  二是

  设计

  高效的系统机制，更充分地利用计算资源

  。代表性工作包括 LMMetric（OSDI''26）和 SpecActor（arXiv）。

  三是

  面向 AI 工作负载构建高速数据平面

  。代表性工作包括 AITurbo（FAST''26）和 KVCache 缓存研究（ATC''25）。

  上述工作大部分已经或正在被部署于华为、阿里巴巴、字节跳动等大型 AI 服务提供商的真实系统中。

  更多信息请参见：

  https://ipads.se.sjtu.edu.cn/pub/members/xingda_wei

  教授课程

  - 计算机系统工程

  - 计算机系统原理

