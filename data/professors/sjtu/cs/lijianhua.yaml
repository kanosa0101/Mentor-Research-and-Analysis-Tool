title: 特聘教授
email: lijh888@sjtu.edu.cn
bio_raw: '教育背景

  1995 — 1998    上海交通大学电子工程系    通信与信息系统        工学博士

  1988 — 1991    上海交通大学电子工程系    通信与信息系统        工学硕士

  1982 — 1986    上海交通大学电子工程系    电子工程                      本科

  工作履历

  2025 — 至今      上海交通大学计算机学院                 特聘教授

  2019 — 2025    上海交通大学网络安全技术研究院    长聘教授、院长

  2013 — 2019    上海交通大学网络空间安全学院        教授（二级）、院长

  2000 — 2013    上海交通大学信息安全工程学院        教授、常务副院长

  1991 — 2000    上海交通大学电子工程系                   讲师/副教授/系总支副书记

  1986 — 1988    中船总公司精密测试技术研究所        助理工程师

  教授课程

  - 网络空间安全及法律法规

  - 网络空间安全理论与技术基础(NIS7009H)

  - 远程协作系统与安全(NIS8025)

  获奖信息

  （1）科研获奖

  - 2005年获国家科技进步二等奖1项

  - 2003、2004、2013年获上海市科技进步一等奖3项

  - 2004年、2005、2008年获上海市科技进步奖二等奖3项

  - 2008年获教育部科技进步一等奖1项

  - 2011年、2013年获国家密码管理局科技进步三等奖2项

  - 2001年获国防科技三等奖1项

  - 2016年获中国产学研合作创新成果一等奖1项

  - 2023年获中国互联网大会领先科技奖1项

  - 2021-2024连续入选“终身影响力”全球前2%顶尖科学家排行榜

  （2）教学获奖

  -

  1997年获得国家级优秀教学成果二等奖

  - 1998年、2009年获上海市优秀教学成果一等奖2项

  - 主持上海市精品课程“信息安全综合实践”教学课程

  - 2017年获中央网信办、教育部网络安全优秀教师奖

  （3）人才计划/奖励

  - 2002年被评为首届上海市IT十大新锐并获得国务院有突出贡献中青年专家特殊津贴

  - 2003年上海市教卫系统优秀共产党员

  - 2004年入选首批新世纪“国家百千万人才工程”第一层次，并被评为第二届上海青年科技英才

  - 2007年由美国著名信息安全机构(ISC)2评为亚洲最有影响力信息安全专业领导人

  - 2008年入选上海市优秀学科带头人

  - 2009年入选上海市第十一届十大科技精英

  - 1995年入选上海市新长征突击手

  - 1998年获上海市基础科研人员特殊津贴

  - 1999年被评为上海市优秀青年教师

  - 2002年获评上海市徐汇区十大杰出青年

  学术服务

  - 信息内容分析技术国家工程研究中心主任

  - 网络信息安全管理监控与服务教育部工程研究中心主任，

  - 上海市网络安全综合管理技术研究重点实验室名誉主任

  - 中国网络空间安全协会副理事长

  - 教育部信息安全教学指导委员会副主任委员

  - 上海市信息网络安全管理协会理事长

  - 上海市信息化培训协会副理事长

  - 上海市商用密码专委会主任

  - 中国计算机学会、中国密码学会高级会员

  -《网络信息安全》期刊顾问，《信息安全与通信保密》、《信息安全研究》、《信息安全学报》编委，在多次国际会议担任主席（Chairman）和特邀报告，担任多本国际期刊编委和审稿人

  - 云南省网络安全检查专家组组长

  - 中国电信移动系统安全国家工程实验室学术委员会委员

  - 公安部信息安全重点实验室学术委员会委员

  - 2000始曾任国家“十.五”863计划信息安全技术专家组首席专家/管理专家

  - 国家863计划信息安全产业化基地（东部、西部、中部）专家委员会专家

  - 国务院国家电子政务试点示范工程总体专家组专家

  - 中国电子政务标准化总体组专家

  - 国家信息安全标准化专家委员会成员

  - 国家信息安全应用示范工程——S219二期总体组组长

  - 上海市信息化专家委员会专家

  - 上海世博会安保顾问咨询专家

  - 上海市计算机等级保护专家

  - 上海市三网融合专家组专家

  - 2012起担任国家863计划现代交通技术主题专家等'
