bio_raw: '个人简介

  主要从事移动计算、边缘智能、移动端人工智能、分布式机器学习等方向的研究，长期招收博士生、硕士生和本科生！

  教育背景

  2015.9-2020.8 上海交通大学 计算机科学与技术 博士

  2011.9-2015.6 东北大学 物联网工程 本科

  工作履历

  2021-2024 上海交通大学 助理研究员

  2024-至今 上海交通大学 副研究员

  教授课程

  操作系统课程设计 2023 2024 2025

  程序设计思想与方法（C++） 2023 2024 2025

