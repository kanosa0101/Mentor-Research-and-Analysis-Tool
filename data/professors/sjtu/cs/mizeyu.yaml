bio_raw: '个人简介

  糜泽羽博士，上海交通大学副教授/博士生导师。中国计算机学会CCF高级会员，ACM/IEEE会员。主要研究领域为大模型系统和操作系统。相关成果在 OSDI、SOSP、ASPLOS、EuroSys
  等国际顶级会议和期刊，受邀担SOSP、ASLPOS等国际顶级会议PC。发起的开源项目PowerInfer星标为8.3K，曾连续两天蝉联GitHub Trending榜

  榜首

  。发布的世界首个手机侧部署的深度思考模型SmallThinker在HuggingFace趋势总榜排名

  第二

  ，7天下载量

  突破10万

  。

  详情请见个人主页

  ：

  https://ipads.se.sjtu.edu.cn/pub/members/zeyu_mi

  教育背景

  2014年-2020年，博士，上海交通大学软件学院，计算机科学与技术

  2010年-2014年，学士，南京大学软件学院，软件工程

  工作履历

  2023年-至今，副教授/博士生导师，上海交通大学软件学院

  2020年-2023年，助理研究员/硕士生导师，上海交通大学软件学院

  教授课程

  操作系统 2021-2025.

  离散数学 2019-2024.

