bio_raw: '个人简介

  博士，副研究员，硕士生导师。2018年3月于上海交通大学获博士学位。2018年至今在上海交通大学电子信息与电气工程学院网络空间安全学院\网络安全技术研究院、计算机学院等从事教学、科研工作。长期从事网络空间内容安全、人工智能安全、社会计算、图神经网络等领域的科研和教学工作，以及与管理、传播、法学等专业在公共安全治理领域的交叉研究工作。当前主要研究方向为网络空间内容治理，大模型安全，大模型在虚假信检测、推荐系统、恶意软件检测等方面的应用等。作为项目负责人先后承担了国家自然科学基金青年基金，国家重点研发计划项目子课题，上海市扬帆计划等国家/省部级科研项目，成果形成多项应用系统和产品，包括信息智能检测系统，群体行为分析系统等，已在国防、网信、司法等领域应用于多家单位。在国内外学术期刊及会议发表论文40余篇，包括IEEE
  TKDE，IEEE TNNLS，IEEE TSC，IEEE T Cybernetics，Computers & Security，Information Science等国际知名刊物，以及CIKM、DASFAA等著名国际会议，获得国家发明专利授权2余项，参与出版专著教材2本。'
