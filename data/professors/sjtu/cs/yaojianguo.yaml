bio_raw: '个人简介

  姚建国，上海交通大学特聘教授，研究方向主要为系统软件与智能计算。在国际期刊Proceedings of the IEEE、IEEE/ACM Transactions，以及ASPLOS、HPCA、VLDB、ATC、SIGKDD等知名国际会议上发表论文100余篇，申请国家发明专利70余项（授权50余项）。曾入选国家重大人才计划、德国洪堡学者。曾获国家技术发明二等奖、国家级教学成果二等奖各一次，共3次获得省部级特等/一等奖。

  教育背景

  2007.4–2010.10  联合培养博士  麦吉尔大学和西北工业大学

  2004.9-2007.4    硕士           西北工业大学

  2000.9-2004.7    本科           西北工业大学

  工作履历

  2011.2–2012.2   联合博士后    蒙特利尔大学工学院和麦吉尔大学

  2012.3-至今      讲师/副教授/教授/特聘教授           上海交通大学

  教授课程

  软件测试（本科）

  实时系统与调度（研究生）

  论文发表

  Yang Hong, Junlong Yang, Bo Peng, Jianguo Yao: REPA: Reconfigurable PIM for the
  Joint Acceleration of KV Cache Offloading and Processing. ASPLOS (2) 2026: 1622-1639

  Qiqi Gu, Chenpeng Wu, Heng Shi, Jianguo Yao:SPIDER: Unleashing Sparse Tensor Cores
  for Stencil Computation via Strided Swapping. PPoPP 2026: 218-231

  Chenpeng Wu, Qiqi Gu, Heng Shi, Jianguo Yao, Haibing Guan:Samoyeds: Accelerating
  MoE Models with Structured Sparsity Leveraging Sparse Tensor Cores. EuroSys 2025:
  293-310

  Liang Zhu, Jianguo Yao, Haibing Guan: SpaceFusion: Advanced Deep Learning Operator
  Fusion via Space-Mapping Graph. EuroSys 2025: 787-802

  Hao Zhou, Qiukun Han, Heng Shi, Yalin Zhang, Jianguo Yao: Boost Linear Algebra Computation
  Performance via Efficient VNNI Utilization. ASPLOS (3) 2024: 149-163

  Guoqing Bao, Heng Shi, Chengyi Cui, Yalin Zhang, Jianguo Yao: UFront: Toward A Unified
  MLIR Frontend for Deep Learning. ASE 2024: 255-26

  Jianguo Yao, Hao Zhou, Yalin Zhang, Ying Li, Chuang Feng, Shi Chen, Jiaoyan Chen,
  Yongdong Wang, Qiaojuan Hu: High Performance and Power Efficient Accelerator for
  Cloud Inference. HPCA 2023: 1003-1016

  Bo Peng, Yaozu Dong, Jianguo Yao, Fengguang Wu, Haibing Guan: FlexHM: A Practical
  System for Heterogeneous Memory with Flexible and Efficient Performance Optimizations.
  ACM Trans. Archit. Code Optim. 20(1): 13:1-13:26 (2023)

  Bo Peng, Jianguo Yao, Yaozu Dong, Haibing Guan: MDev-NVMe: Mediated Pass-Through
  NVMe Virtualization Solution With Adaptive Polling. IEEE Trans. Computers 71(2):
  251-265 (2022)

  Bo Peng, Ming Yang, Jianguo Yao, Haibing Guan: A Throughput-Oriented NVMe Storage
  Virtualization With Workload-Aware Management. IEEE Trans. Computers 70(12): 2112-2124
  (2021)

  资助项目

  2023.03-2026.02，计算优化与新硬件赋能，国家重点研发计划课题

  2022.10-2025.09，超大规模神经元计算机操作系统，国家重点研发计划子课题

  2018.05-2021.04，面向国产处理器的虚拟机构建、调度和管理技术，国家重点研发计划课题

  2019.11-2021.11，智能制造关键技术-网络与平台，教育部-中国移动基金

  2016.01-2019.12， 面向软件定义数据中心的多资源协同与自主分配方法研究，国家自然科学基金面上项目

  获奖信息

  第十九届“挑战杯”全国大学生课外学术科技作品竞赛

  揭榜挂帅项目擂主（特等奖第一名）指导教师（2025）

  第十九届“挑战杯”全国大学生课外学术科技作品竞赛“人工智能+”专项赛特等奖 指导老师（2025）

  国家技术发明二等奖（2023）

  CCF科技进步一等奖（2023）

  国家教学成果二等奖（2022）

  上海市教学成果特等奖（2022）

  吴文俊人工智能科学技术奖专项奖（芯片项目）一等奖（2022）

  上海市计算机学会青年科技英才奖（2021）

  上海市技术发明一等奖（2019）

  教育部技术发明一等奖（2018）

  上海交通大学晨星青年学者副教授A类（2017）

  德国洪堡学者（2015）

  学术服务

  程序委员会委员：DAC（2022-2023），INFOCOM（2020-2023）等'
