bio_raw: '个人简介

  马利庄，男，理学博士，博士后，博士生导师，上海交通大学特聘教授、华东师范大学特聘教授，上海交通大学人工智能研究院副院长。中国图象图形学会理事、动画与数字娱乐专委会主任，中国人工智能学会理事、“智能创意与数字艺术专委会”副主任，CAD&CG专委会副主任。马利庄博士是国家杰出青年基金（信息学部专家初审和复审名列第一），上海市科技进步特等奖（第一完成人）、一等奖、二等奖，中国青年科技奖，国家教育部科技进步二等奖；国家“百千万人才工程”(国家级)首批人选，浙江省跨世纪学术与技术带头人；国务院特殊津贴获得者。

  教育背景

  1981.9-1985.7       浙江大学应用数学系，大学本科学习；

  1985.7-1988.7       浙江大学CAD&CG国家重点实验室，硕士研究生，导师梁友栋教授；

  1988.7-1991.7       浙江大学CAD&CG国家重点实验室，博士研究生，导师梁友栋教授；

  工作履历

  1991.7-1991.12 浙江大学CAD&CG国家重点实验室固定研究人员，讲师；

  1991.12-1993.12 浙江大学计算机系计算机应用博士后研究人员，博士后；

  1993.12-1995.12 浙江大学CAD&CG国家重点实验室固定研究人员，副研究员；

  1995.12-1998.7 浙江大学CAD&CG国家重点实验室，研究员、博士生导师；

  1998.7-1998.12 德国Fraunhofer IGD国际图形学研究院，访问教授；

  1998.12-1999.9 浙江大学CAD&CG国家重点实验室，研究员、博士生导师；

  1999.9-2000.10 新加坡南洋理工大学先进多媒体中心，客座教授；

  2000.10-2002.2 浙江大学CAD&CG国家重点实验室研究员、博士生导师；

  2001.10-2003.10 浙江财经学院信息学院特聘院长（兼）；

  2005.7--2020.03 上海中医药大学信息科学与技术中心主任(兼)；

  2002.3--上海交通大学计算机系特聘教授、博导，数字媒体与数据重建实验室主任；

  2017.9--华东师范大学特聘教授，博导，多媒体与视觉实验室主任。

