bio_raw: '个人简介

  胡易坤，博士，获得教育部HYB，上海市海外GCC人才，入选上海市浦江人才计划。其先后于华南理工大学和上海交通大学获得工学学士以及工学博士学位；而后前往香港科技大学从事博士后研究；现在上海交通大学网络空间安全学院担任助理研究员，为密码与计算机安全实验室成员。胡博士的研究目标是AI赋能的程序分析技术及其在软件安全中的应用（AI-assisted
  Program Analysis and Software Security），其研究课题主要包括相似代码检测（Code Similarity Analysis）、补丁代码分析（Patch
  Analysis）、恶意软件分析（Malware Analysis）、漏洞挖掘（Bug Detection）等。欢迎对程序分析、软件安全以及AI系统安全有兴趣的老师和同学联系交流，具体请移步其主页：https://yikunh.github.io/.

  教授课程

  编译原理（NIS2336）：25春，24春，23春，22秋

  系统软件安全（NIS3369）：24秋，23秋

  论文发表

  具体请访问：

  Google Scholar

  或

  个人主页

  。

  资助项目

  上海市科学技术委员会，22PJ1405700，二进制相似代码检测及其在补丁代码分析中的应用，2022-2024，主持

  华为，横向项目，主要研究二进制恶意软件分析，2025-2026，主持

  国家自然科学基金委员会，U2336210，后量子密码实践安全性机理及分析方法研究，2024-2027，参与'
