bio_raw: '个人简介

  上海交通大学计算机学院教授，凯原法学院双聘教授，上海交通大学人工智能研究院总工程师、智慧司法研究院副院长，科技部重点研发首席科学家。2007年获得上海市科技进步一等奖，2009年获教育部“新世纪优秀人才”计划。研究兴趣包括：

  大语言模型增强与应用、科学智能(AI for Science)、

  数据治理与共享架构等。

  教育背景

  上海交通大学 博士 2000.3

  中国科技大学 硕士 1995.7

  安徽大学 学士 1992.7

  工作履历

  2025-03 至 今，上海交通大学，计算机学院，教授

  2019-04 至 今, 上海交通大学, 人工智能研究院, 教授

  2009-11 至 2017-11, 上海交通大学, 网络信息中心, 教授

  2002-11 至 2025-02, 上海交通大学, 电子信息与电气工程学院, 教授

  2000-03 至 2002-09, 朗讯科技贝尔实验室, 基础科学研究院(中国), 研究员

  教授课程

  计算机科学导论，3

  学分，本科课程，2025-

  计算社会科学导论，2学分，本科课程，2022-2023

  社会科学中的大数据分析，2 学分，本科课程，2019-2022

  通信原理，4学分，本科课程，2004-2009

  高性能信息网络，2学分，研究生课程，2008-2019

  管理科学中的数据分析，2学分，研究生课程，2020-2024

  论文发表

  https://scholar.google.com/citations?user=H_7_oVcAAAAJ&hl=zh-CN&oi=ao

  代表性论文

  1. Zhang, Y., Han, Y., Chen, S., Yu, R., Zhao, X., Liu, X., Zeng, K., Yu, M., Tian,
  J. ,Zhu, F., Yang, X.,

  Jin, Y

  . & Xu, Y. (2025). Large language models to accelerate organic chemistry synthesis.
  Nature Machine Intelligence.

  2. Fan, C., Chen, J.,

  Jin, Y.

  , & He, H. (2024). Can large language models serve as rational players in game theory?
  a systematic analysis. In Proceedings of the AAAI Conference on Artificial Intelligence
  (AAAI).

  3. Zhang, H., Xiao, L., Chen, W., Wang, Y., &

  Jin, Y.

  (2017). Multi-task label embedding for text classification. Proceedings of the 2018
  Conference on Empirical Methods in Natural Language Processing (EMNLP).

  4. Tian, J., Li, Y., Chen, W., Xiao, L., He, H., &

  Jin, Y.

  (2021).Diagnosing the first-order logical reasoning ability through LogicNLI. Proceedings
  of the 2021 Conference on Empirical Methods in Natural Language Processing (EMNLP).

  5. Li, L., Yan, J., Wang, H., &

  Jin, Y.

  (2020). Anomaly detection of time series with smoothness-inducing sequential variational
  auto-encoder. IEEE transactions on neural networks and learning systems (TNNLS),
  32(3), 1177-1191.

  资助项目

  科技部, 国家重点研发计划, 2022YFC3302900, 法检司协同分布式大数据融合关键技术研究,2022-10 至 2025-09, 1573万元, 在研,
  主持

  基于人工智能的数字建模基础研究，中国星网网络系统研究院有限公司，2025, 362 万，在研，主持

  配电网业扩项目智能化审查与合规性评估方法研究，国网上海市电力公司，2025，48万，在研，主持

  基于电力行业大模型的配网业扩技经资料智能辅助预审方法研究和技术验证，2025，37万，在研，主持

  基于配网业扩开关站专家知识库构建开关站辅助评审方法研究与技术验证，2025，33万，在研，主持

  科技部, 国家重点研发计划, 2018YFC0830400, 全流程管控的精细化执行技术及装备研究, 2018-09 至 2021-10, 2016 万元, 结题,
  主持

  面向政务服务的人工智能开源开放平台，上海市人工智能创新发展专项，2021至 2023，1000万，结题，主持

  中电投电力工程有限公司数字化转型咨询服务，国家电投电力工程有限公司，2022，150万，结题，主持'
