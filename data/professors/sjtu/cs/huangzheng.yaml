  资助项目

  基于联邦学习的化学孪生系统及其标准建设推广，纵向，主持

  智能黑灰产洞察系统，上海交通大学-蚂蚁集团“人工智能与安全”联合研究中心项目，主持

  基于深度学习的视觉检测模型及数据资产大模型研究，广浩捷科技有限公司，主持

  基于区块链的分布式数据可信治理技术，重点研发，子课题负责人

  原产地单证智能识别技术研究与示范应用，上海海关，主持

  三维成像系统联合人工智能神经卷积研究Tecrl诱导的CPVT心肌细胞微观结构，医工交叉重点项目，交大负责人

  基于认知智能的财务系统关键技术研究，唯你科技，主持'
