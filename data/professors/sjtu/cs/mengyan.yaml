bio_raw: '个人简介

  孟岩，研究方向为物联网安全，获得2022年ACM中国优博奖，入选2023年度中国科协青年人才托举工程。

  欢迎对科研感兴趣的同学通过邮件联系我，共同探索信息安全。

  教育背景

  2016.09-2021.12    上海交通大学     计算机科学与技术    博士

  2012.09-2016.06    华中科技大学    电子信息工程    本科

  工作履历

  2026.01-至今            上海交通大学    副研究员

  2022.12-2026.01    上海交通大学    助理研究员

