bio_raw: '个人简介

  唐飞龙，上海交通大学计算机学院，教授，博导，博士。

  入选

  IET Fellow，

  JSPS Research Fellow，

  CCF杰出会员，

  上海浦江人才计划。现任

  上海计算机学会系统结构专委会主任。长期从事天地一体化信息网络、人工智能、大数据、云计算等方面的研究。已发表CCF A/B类论文70篇、CAAI A类论文1篇、JCR一区论文14篇；获得国际会议最佳论文奖7篇。合作编写2本学术专著。

  教育背景

  2002.04 ~ 2005.06，上海交通大学，工学博士

  2004.05 ~ 2005.06，香港大学，访问学者

  1999.09 ~ 2002.03，合肥工业大学，工学硕士

  工作履历

  2012.12 ~  上海交通大学，教授

  2007.12 ~ 2012.11 上海交通大学，副教授

  2011.07 ~ 2011.10 香港大学，访问学者

  2009.06 ~ 2011.06 日本学术振兴会，特别研究员/博士后

  2007.09 ~ 2008.10 日本会津大学，访问学者

  2005.06 ~ 2007.11 上海交通大学，讲师

  教授课程

  程序设计思想与方法

  数据库技术

  计算机网络

