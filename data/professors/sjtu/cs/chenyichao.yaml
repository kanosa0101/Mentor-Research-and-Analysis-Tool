bio_raw: '个人简介

  陈奕超，上海交通大学计算机学院副教授、博士生导师，长期从事移动计算、无线感知、物联网安全与空间智能研究。研究聚焦空间智能在真实世界落地面临的关键挑战，包括可观测性、多用户交互、人与机器人协同安全、以及可信感知。在这些方向中，研究团队提出了可编程环境、超表面辅助感知、主动视觉、毫米波人体状态建模、静默语音交互以及具身系统安全基线等多项原创技术体系，推动智能体实现真正的"物理世界闭环"。其论文发表于
  MobiCom、MobiSys、SenSys 等国际顶级会议与期刊，并获得多项论文奖项、发明奖和教学奖。

  个人主页：

  https://yichao0319.github.io/

  Yi-Chao Chen is an Associate Professor at Shanghai Jiao Tong University (SJTU).
  His research focuses on mobile computing, wireless sensing, IoT security, and spatial
  intelligence. He works on core challenges that block spatial intelligence from real-world
  deployment, including observability, multi-user interaction, human–robot collaboration
  safety, and trustable sensing. His work introduces programmable environments, metasurface-assisted
  sensing, active vision on commodity hardware, mmWave-based human state modeling,
  silent-speech interaction, and trust and safety baselines for embodied systems.
  His publications appear in top venues such as MobiCom, MobiSys, NSDI, SenSys, INFOCOM,
  CCS, and Security, and he has received multiple awards for research, invention,
  and teaching.

  Personal website:

  https://yichao0319.github.io/

