bio_raw: '个人简介

  李 颉教授是上海交通大学计算机学院讲席教授、博士生导师，日本工程院外籍院士，IEEE Fellow, 亚太人工智能协会 (AAIA) Fellow，美国国家人工智能科学院(NAAI)院士、上海交大iBDSLab（智能大数据系统实验室）主任、上海交大区块链研究中心主任，上海市区块链专家委员会委员，上海市Web3可信数据流通与治理重点实验室首席科学家，中国创造学会人工智能专委会主任，IEEE
  大数据技术委员会共同主席，IEEE通信学会大数据委员会创始主席，CCF区块链专委会顾问委员，上海交大苏州人工智能研究院数据科学中心主任。上海纽约大学上海市人工智能与深度学习前沿科学研究基地学术委员会委员。

  主要研究领域是人工智能、大数据、区块链、云计算、信息系统架构与安全。在IEEE TC, TMC, TPAMI, NIPS, ICDE, CVPR, AAAI,
  ICLR, CVPP, ICML等学术期刊和会议上发表论文500余篇，英文学术专著1本，日文学术专著1本。近年获得了2017年IEEE Systems Journal的最佳论文奖（Best
  Paper Award）、2019年度大数据挖掘与分析期刊优秀论文奖、2020年国际移动、感知、网络大会最佳论文奖、中国科技新闻学会（中国科协下属学会）2020年大数据科技传播奖领军人奖、2021年第二届中国AI金雁奖-卓越成就奖、2023年上海市科学技术奖一等奖、2025年福建省科学技术奖二等奖。

  论文发表

  2025年在IEEE TC, TSC, TDSC, NeurIPS, ICDE, IJCAI, AAAI, VLDB等发表30余篇学术论文，其中CCF-A类论文19篇（通讯10篇），CCF-B类论文9篇（通讯6篇），高被引论文2篇。'
