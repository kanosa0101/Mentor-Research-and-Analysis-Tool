bio_raw: '个人简介

  陈晨，上海交通大学计算机学院长聘教轨副教授，博士生导师，上海市海外高层次人才，微软亚研院铸星学者。分别于获清华大学和香港科技大学取得学士和博士学位，以云计算和机器学习系统为主要研究领域，在OSDI,
  ASPLOS, SC, SoCC, INFOCOM, ICDCS等著名会议上发表论文30余篇。曾在华为香港研究中心担任研究员，三次荣获中央研究院创新先锋总裁奖。主持国家自然科学青年及面上基金、上海市浦江人才A类项目、CCF-华为/蚂蚁联合基金等十余项课题项目。

  其它信息请详见个人主页

  https://jhc.sjtu.edu.cn/~chen-chen/

  .'
