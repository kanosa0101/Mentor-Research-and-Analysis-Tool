bio_raw: '个人简介

  冯宇，现任上海交通大学，约翰霍普克罗夫特中心助理教授，博导。2023年于罗切斯特大学获计算机科学博士学位，2023-2024年在罗切斯特大学担任博士后研究员，2024年入选国家级高层次青年人才计划、上海市

  高层次青年人才计划、白玉兰人才计划，

  2025年入选CCF体系结构专委青年发展激励计划、2026年入选小米青年学者。长期从事计算机体系结构，端侧推理加速，端云协同等研究。在ISCA、MICRO、ASPLOS、HPCA、DAC等体系结构领域的顶级会议上发表了论文五十余篇，体系结构四大会议论文30篇。

  体系结构名人堂：ISCA (2026), MICRO (2026).

  所获论文奖项：2022年IEEE VR最佳论文荣誉提名、2024年ICCD最佳论文提名、2025年ASPLOS最佳论文奖、2026年ASPLOS最佳论文提名、2026年ISCA最佳论文提名。

  近期感兴趣的方向：有关3D高斯溅射渲染、具身智能模型与视频大模型的推理加速以及体系架构设计。

  教育背景

  2017年-2023年，罗切斯特大学，博士

  2015年-2017年，卡内基梅隆大学，硕士

  2011年-2015年，天津工业大学，学士

  工作履历

