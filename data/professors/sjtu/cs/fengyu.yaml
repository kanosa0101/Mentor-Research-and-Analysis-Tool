  2025年-至今，上海期智研究院，研究员

  2023年-2024年，

  罗切斯特大学，博士后研究员

  2022年，Meta Reality Labs，博士生研究员

  2020年，Meta Reality Labs，博士生研究员

  2019年，Google AI，博士生研究员

