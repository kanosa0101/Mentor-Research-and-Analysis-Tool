  担任2025年度中国多媒体大会特邀讲者，2024年度和2025年度中国具身智能大会特邀讲者、2024年度和2025年度视觉与学习青年学者研讨会特邀讲者、第九届认知系统与信息处理国际会议青年学者论坛特邀讲者等。在国际顶会CVPR上牵头发起

  RoboTwin

  双臂协同机器人大赛(全球参赛队伍超60 支)，并与地平线机器人共同主办了第十九届挑战杯“人工智能+”专项赛的双臂操作大赛。与地平线地瓜机器人公司等协同，发起创建了具身智能社区

