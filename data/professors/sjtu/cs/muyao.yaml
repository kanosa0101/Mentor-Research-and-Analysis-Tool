bio_raw: '个人简介

  穆尧，上海交通大学长聘教轨助理教授，入选国家级青年人才计划，上海市海外高层次青年人才，2026年度云帆奖明日之星得主，智源青年学者， EAI-100 2025学术新锐。博士毕业于香港大学计算机系，访学于苏黎世联邦理工学院、新加坡国立大学等。穆尧博士长期从事具身智能的基础研究，深耕多模态具身认知、具身世界模型和具身自主进化系统等方向，担任了NeurIPS、ICLR、CORL等国际机器学习顶级会议的领域主席和TMLR等国际期刊的编委，中国计算机学会智能机器人专委会执委，中国图形图像学会三维视觉专委会专委，Valse执行领域主席，在IJRR、RSS、NeurIPS、ICML、CVPR等计算机领域国际顶级期刊和会议发表论文60余篇，谷歌学术引用超4000余次。曾荣获2026年ICRA最优论文奖提名、

  2026年ICRA ViTac 研讨会最优论文奖、

  2025年IROS最优论文奖提名、2024年ECCV协同具身智能研讨会最优论文奖、2024年中国自动化学会自主机器人研讨会奖学金（全国5人）、2021年IEEE
  ICCAS2020大会最优学生论文奖、IEEE IV2021最优学生论文提名奖等多项奖励。实验室主页

  ：

  https://scalelab-sjtu.github.io/

  招生相关：课题组招生一般优先线下实习半年以上表现优异有较好成果的同学，考虑到集群安全管理问题不开放纯线上实习通道，PHD offer 一般需实习半年以上且至少有一个实习期间的工作通过组内审核在arxiv预印

  教育背景

  2021-09 至 2025-04, 香港大学, 博士

  2018-09 至 2021-06, 清华大学, 硕士

  2014-09 至 2018-06, 哈尔滨工业大学, 学士

  工作履历

  2025年加入上海交通大学参加工作

  教授课程

  离散数学（本科生专业基础课程）

  自动驾驶前沿技术CS7355 （研究生专业课程）

  高级神经网络理论与应用CS7352

  （研究生专业课程）

  ScaleLab具身智能读书会

  （第二课堂）

  担任国家卓越工程师学院

  26级卓工班主任（研究生）

