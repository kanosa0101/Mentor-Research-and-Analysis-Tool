bio_raw: '个人简介

  何哲陟，上海交通大学计算机科学与工程系长聘教轨副教授，博士生导师，

  PI,

  上海市领军人才。长期从事智能计算的软硬件设计、类脑计算、

  EDA

  等相关的研究。在相关领域发表接收论文百余篇，包括

  Nature

  子刊等。多次获得领域内顶级学术会议最佳论文奖。研究受到国家自然科学基金，科技部，华为，微软亚洲研究院等资助。计算机体系结构领域顶级期刊IEEE TCAD (CCF-A)
  副编辑。长期为

  30

  多个国际顶级会议和期刊担当技术程序委员会成员或审稿人。

  教授课程

  - CS2305 计算机系统结构（A类）

  - EE0503 领域专用加速器设计

  获奖信息

  - DAC 2025 (CCF-A) 最佳论文提名

  - ICCD 2023

  (CCF-B)

  最佳论文提名

  - DATE 2022

  (CCF-B)

  最佳论文奖

  - ISVLSI 2018 最佳论文奖

  - ISVLSI 2017 最佳论文奖'
