bio_raw: '个人简介

  冷静文，上海交通大学计算机学院特聘教授，副院长，博士生导师，主要研究方向为面向人工智能、区块链等新兴应用的计算系统设计及优化，主持了优青、面上等多项自然科学基金以及龙头企业横向项目。在国际一流的会议和期刊上发表了四十多篇论文和相关国内国际专利，获得过DAC,
  PACT等多个国际会议的最佳论文提名奖，2022年度IEEE体系结构年度最佳论文优胜奖（IEEE Micro Top Picks Hornorable Mention）。曾获得2024年华为奥林帕斯奖和2020年阿里巴巴达摩院青橙奖等公司公益奖项。

  个人主页：

  https://cs.sjtu.edu.cn/~leng-jw/

  教育背景

  Ph.D., The University of Texas at Austin, 2012 - 2016

  M.S., The University of Texas at Austin, 2010 - 2012

  B.S., Shanghai Jiao Tong University, 2006 - 2010

  工作履历

  Microsoft Research Asia, Visiting Researcher, September 2018 - Janunary 2019

  IBM T.J. Watson Research Center, Research Intern, March 2015 - December 2016

  SRI International, Research Intern, Summer 2013

  Samsung Austin Research and Development Center, Summer Intern, Summer 2011'
