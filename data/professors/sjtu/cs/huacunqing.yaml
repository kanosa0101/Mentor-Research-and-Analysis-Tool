bio_raw: '个人简介

  上海交通大学计算机学院（网络空间安全学院）教授、博士生导师，长期从事无线通信与网络空间安全交叉领域研究，在IEEE Journal on Selected Areas
  in Communications、IEEE Transactions on Information Forensics and Security、IEEE Transactions
  on Mobile Computing、IEEE Transactions on Wireless Communications等国际权威期刊及IEEE INFOCOM、ICML、WiSec、ICC、Globecom等旗舰会议发表学术论文150余篇，出版英文专著1部，获授国际PCT及国内发明专利20余项。
  先后主持国家重点研发计划、国家863计划、国家自然科学基金等国家级科研项目和企业合作项目20余项。目前主持国家自然科学基金航运联合基金重点项目“甚高频数据交换系统（VDES）海上广域船舶通信关键技术”（2026—2029），聚焦下一代海事通信系统在广域覆盖与容量增强、高效频谱利用及安全弹性等方面的基础理论与关键技术；同时主持国家自然科学基金面上项目“基于神经塌陷的无源开放世界射频指纹识别技术研究”（2027—2030），围绕AI赋能的6G物理层安全，探索开放动态环境下的射频指纹识别机制。

  研究方向主要涉及

  6G网络、卫星互联网

  等领域，聚焦AI驱动的智能无线网络和内生安全技术等方向，包括但不限于：

  AI驱动的卫星互联网高效组网与传输技术

  ：涵盖低轨星座动态资源调度、星间协作通信与干扰认知管理；

  面向卫星互联网的零信任安全机制

  ：涵盖星地链路持续认证、分布式接入控制、星地协同安全防御机制等；

  星地融合网络架构与协议

  ：涵盖异构网络无缝切换、星地协同传输与服务质量保障；

  智能频谱管控与动态共享

  ：涵盖频谱态势感知、干扰智能规避、多域频谱协同调度、低空无人机频谱监测；

  AI内生的6G物理层安全机制

  ：涵盖基于深度学习的射频指纹识别、物理层密钥生成与无线信道特征认证；

  无线AI安全与对抗性防御

  ：涵盖针对无线AI模型的投毒攻击防御、对抗样本检测及鲁棒学习理论。

