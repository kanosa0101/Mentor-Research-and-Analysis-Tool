  资助项目

  主持完成国家自然科学基金青年项目1项;

  主持上海市数学与交叉学科研究院-应用与交叉学科项目1项

  主持空天地一体化综合业务网全国重点实验室项目 1 项;

  主持应用数学湖北省重点实验室项目1项；

  作为项目骨干参与国家重点研发计划 1项，173重点项目1项，华为公司项目若干项；

  2020

  年上海市“超级博士后”人才计划资助。

  学术服务

  担任多个国际学术期刊/会议的审稿人，包括IEEE TIT、IEEE TCOM、 FFA、及 美密会、亚密会、ISIT等。'
