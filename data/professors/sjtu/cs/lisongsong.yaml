bio_raw: '个人简介

  目前为计算机学院助理研究员、

  硕士生导师

  。研究方向包括

  代数编码及其在密码学中的应用，

  零知识证明，

  以及椭圆曲线相关的公钥密码学。

  教育背景

  2020

  年博士毕业于中国科学技术大学数学科学学院。

  工作履历

  2020

  年

  -2022

  年在上海交通大学网络空间安全学院从事博士后研究工作。

  教授课程

  2022-2023春季学期，本科生课程，《现代密码学2》

  2022-2023春季学期，本科生课程，《信息安全数学基础2》

  2023-2024秋季学期，研究生课程，《基础代数》

  2023-2024春季学期，本科生课程，《现代密码学2》

  2023-2024春季学期，本科生课程，《信息安全数学基础2》

  2024-2025秋季学期，研究生课程，《基础代数》

  2024-2025春季学期，本科生课程，《现代密码学2》

  2024-2025春季学期，本科生课程，《信息安全数学基础2》

