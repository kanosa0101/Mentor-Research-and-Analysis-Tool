bio_raw: '个人简介

  王浩洋，博士，助理教授，博士生导师。2016年7月获得山东大学数学专业学士学位，2021年3月获得新加坡南洋理工大学博士学位，2021年4月加入上海交通大学。主要研究方向为对称密码算法的设计与分析。代表性成果发表在CRYPTO、ASIACRYPT、FSE等国内外重要学术会议和期刊。获得2021年新加坡优秀博士论文奖、ACISP
  2022最佳论文奖，入选

  上海市海外高层次人才计划。

  教育背景

  2016-08至2021-03，新加坡南洋理工大学，密码学，博士

  2012-09至2016-06，山东大学，数学，学士

  工作履历

  2021-04-至今，上海交通大学，计算机学院（网络空间安全学院、密码学院），长聘教轨助理教授

  教授课程

  《程序设计思想与方法（C++）》

  2021（秋）、

  2022（秋）、

  2023（秋）、

  2024（秋）、2025（秋）

