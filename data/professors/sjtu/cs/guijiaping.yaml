bio_raw: '个人简介

  桂佳平

  ，上海交通大学计算机学院长聘教轨助理教授，博士生导师，

  上海市海外高层次人才，入选华为Explore-X人才计划。研究方向为网络与系统安全、人工智能安全和软件工程，

  主持参与国家级项目、科技创新

  2030国家科技重大专项、上海市自然科学基金项目

  、教育部

  -华为产学研协同育人项目

  以及华为、星网横向项目等多个课题

  。在国际主流会议和期刊上发表学术论文40余篇，包括USENIX Security、NDSS、NeurIPS、ACL、CVPR、KDD、INFOCOM、WWW、ICDE、IJCAI、ICSE、TDSC和TIFS等，已申请中美发明专利20余项，

  现担任

  CCF高级会员，CCF系统软件专业委员会执行委员、MPDI旗下《Information》期刊专刊特邀客座编辑、

  2027年度USENIX Security/AAAI、

  2026年度MM/ICML/ACL/CVPR/AAAI/NDSS-PRISM、2025年度WWW/KDD等会议的程序委员会委员、以及IEEE TDSC/TIFS/TSE等期刊的审稿人。

  教育背景

  2013-08 至 2018-06, 南加州大学, 计算机科学, 博士

  2010-09 至 2012-06, 佐治亚理工学院, 电气与计算机工程, 硕士

  2010-09 至 2012-06, 上海交通大学, 电子与通信工程, 硕士

  2006-09 至 2010-06, 上海交通大学, 信息安全, 学士

  工作履历

  2022-10 至 今

  , 上海交通大学, 长聘教轨助理教授

  2021-02 至 2022-09, 美国Stellar Cyber安全公司, 高级研究员

  2018-08 至 2021-01, NEC美国研究院, 研究员

  2013-08 至 2018-06, 美国南加州大学, 助理研究员

  2012-07 至 2013-07, 百度上海研发中心, 研发工程师

  论文发表

  详见个人主页：

  https://guijiaping.github.io/'
