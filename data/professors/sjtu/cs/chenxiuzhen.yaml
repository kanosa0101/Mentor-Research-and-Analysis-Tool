bio_raw: '个人简介

  陈秀真，女，山东聊城人，博士，副教授，硕士生导师，上海交通大学网络安全技术研究院院长助理，

  公安部网络安全等级保护测评师

  ，个人信息保护合规审计人员（高级），国际注册系统安全审计师（

  CISA

  ），

  上海智能网联汽车技术中心有限公司智能网联安全技术研究所副所长。主要研究方向为信息系统安全检测与评估、智能网联信息安全、人工智能理论及应用。

  2001

  年

  9

  月至

  2005

  年

  5

  月在西安交通大学网络安全专业攻读博士学位

  (

  导师：管晓宏院士、郑庆华院士

  ）

  。

  2005

  年

  7

  月加入上海交通大学网络空间安全学院。

  2010.10—2011.12

  、

  2014.08—2015.07

  访问法国巴黎高等电信大学（

  Télécom Paris Tech

  ）网络与计算机科学系。曾担任上海交通大学信息安全服务技术研究实验室质量主管，独立主持或参与国家自然科学基金、国家

  973

  计划、国家重点研发计划、教育部高等学校博士学科点专项基金等

  40

  多项国家、地方级项目，在国内外重要学术期刊《

  Computers & Security

  》、《软件学报》、《信息安全学报》、《网络与信息安全学报》发表

  30

  多篇学术论文，编著信息安全专著

  《等级保护测评理论及应用》

  、《网络信息系统安全管理》、《信息系统安全检测与风险评估》、《

  智能网联汽车信息安全测试与评价技术》。长期提供网络安全等级保护测评、安全咨询、安全测评等社会化服务，涵盖教育、医疗、金融、交通、政府、汽车、商贸等行业领域。授权国家发明专利

  30

  项，软件著作权

  9

  项。荣获

  2006

  、

  2014

  、

  2020

  、

  2023

  年度

  上海交通大学优秀教职工，

  2009

  年度上海交通大学“

  晨星青年学者奖励计划

  ”优秀青年教师。

  教育背景

  2021.09-2025.07

  西安交通大学，网络空间安全专业，博士

  工作履历

  2010.01

  —至今           副教授，

  上海交通大学计算机学院

  2014.08—2015.07    Advanced visiting scholar, Network and Computer Science Department
  (INFRES), Telecom PARIS TECH, France

  2010.10

  —

  2011.12    Visiting scholar, Network and Computer Science Department (INFRES), Telecom
  PARIS TECH, France

  2005.07—2009.12

  讲师，上海交通大学信息安全工程学院

  教授课程

  本科生课程: 信息安全科技创新, 人工智能导论, 网络安全管理技术

  研究生课程: Network Security Technology（英文授课）

  论文发表

  【1】Yi Xie, Xiao Yang, Xiaoyu Yi, Guihua Gu, Xiuzhen Chen (correspondence author),
  Gaolei Li (correspondence author) and Jianhua Li, ActiveTrap: Leveraging AI Agents
  and Federated Graph Learning for Active APT Trapping, MSN2025: The 21th International
  Conference on Mobility, Sensing and Networking, December 3, 2025, Bandung, Indonesia.

  【2】Xiuzhen Chen, Weicheng Qiu, Lixing Chen, Yinghua Ma, Jin Ma, Fast and practical
  intrusion detection system based on federated learning for VANET, Computers & Security,
  v 142, July 2024.

  【3】Yunfan Zhan, Qidan He, Yijun Wang and Xiuzhen Chen(Correspondence author), PMDET:
  Automated Detection Tool of Android Parcel Mismatch, International Conference on
  Software Analysis, Evolution and Reengineering (SANER 2024) .

  【4】Shuting LIU, Yinghua MA, Xiuzhen CHEN(correspondence author), Evolutionary Game
  Model Based on Cumulative Prospect Theory for Information Management Mechanism in
  SIoT, Heliyon, Vol. 9, Issue 6, Published online: May 25, 2023.

  【5】Shuning HOU, Xiuzhen CHEN(correspondence author), Jin Ma, Zhihong Zhou and Haiyang
  YU, An Ontology-Based Dynamic Attack Graph Generation Approach for the Internet
  of Vehicles, Frontiers in Energy Research-Smart Grids, 2022.

  【6】Weicheng Qiu, Yinghua MA, Xiuzhen CHEN(correspondence author), Haiyang YU, Lixing
  CHEN, Hybrid Intrusion Detection System based on Dempster-Shafer Evidence Theory,
  Computers & Security, 2022(117-):117.DOI:10.1016/j.cose.2022.102709, pp:1-14.

  资助项目

  2026.01----2029.12

  国家自然科

  学基金面上项目：天地一体化网络系统隐蔽威胁主动发现与智能监测

  2025.01----2026.03

  国网信通中心科技专项，勒索病毒攻击下新型电力系统数据安全防护技术研究

  2021.01----2024.12

  国家自然基金联合基金，

  基于人工智能与区块链的社交网络虚假谣言检测与传播控制研究

  2022.09----2024.08

  上海市科委“科技创新行动计划”项目：基于联邦学习的异常监测方法和全生命周期的数据安全评估

  2019.02----2022.02

  国家重点研发计划，

  *****

  监测与预警技术

  2007.01----2009.12

  国家自然科学基金：计算机网络系统安全评估优化的研究

  获奖信息

  2023年度获上海交通大学BM先进工作者

  2022数字中国创新大赛·网络安全赛道：车联网安全赛—车联网安全场景挑战赛团队赛，二等奖

  2014

  年度获“上海交通大学校级优秀教师奖”（烛光奖）

  2009

  年

  度

  “

  上海交通大学晨星青年学者奖励计划

  ”

