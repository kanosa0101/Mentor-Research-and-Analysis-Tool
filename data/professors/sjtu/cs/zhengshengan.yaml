bio_raw: '个人简介

  郑圣安，上海交通大学计算机学院长聘教轨副教授，博士生导师。主要研究方向为大模型训推系统，分布式系统、内存与存储系统以及智能系统软件等。在FAST、EuroSys、ICDE、DAC、TPDS、TOS等国际高水平会议和期刊发表学术论文三十余篇，获国家发明专利授权十余项，受邀担任多个国际会议和期刊的程序委员会委员和审稿人，担任OpenCloudOS社区TOC委员。主持国家自然科学基金青年科学基金项目、上海市自然科学基金面上项目、中国博士后科学基金面上项目以及多项企业创新研究计划项目，参与国家重点研发计划、国家自然科学基金重点项目等。相关研究成果获2020年上海市技术发明奖一等奖。

  课题组正招收2027-2028年入学的研究生和博士生，欢迎对大模型训推系统，分布式系统、内存与存储系统以及智能系统软件等方向感兴趣的同学

  与我联系

  。

  欢迎本校对科研感兴趣且学有余力的本科生加入课题组从事科研实践工作。

  详情见个人主页：

  https://venero.github.io/

