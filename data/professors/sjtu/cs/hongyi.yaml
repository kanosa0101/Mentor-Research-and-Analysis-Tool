bio_raw: '个人简介

  博士生导师，长期从事医学影像分析和智慧医疗人工智能交叉研究，

  曾获得医学图像分析顶会

  MICCAI 2014

  青年学者奖、美国

  NSF CISE CRII Award

  、北卡罗来纳大学教堂山分校博士完成奖学金、上海市海外领军青年人才称号、

  2023

  年度上海市计算机学会教学成果奖一等奖（排名第二）、

  2024

  年上海交通大学教学成果奖二等奖（排名第二）等荣誉。

  教育背景

  2003-2007，武汉大学，计算机学院，学士

  2007-2011，中国科学院，计算技术研究所，硕士

  2011-2016，美国北卡罗来纳大学教堂山分校（UNC-Chapel Hill），计算机系，博士

  工作履历

  2016-2020，美国佐治亚大学，计算机系，长聘教轨助理教授

  2021-今，上海交通大学，计算机学院，长聘教轨副教授

  教授课程

  《计算机科学导论》春季学期

  《计算机视觉》春季学期

  论文发表

  论文列表：【

  Google Scholar

  】

  近期代表性论文：

  【TMI''25】

  Qiuhui Chen, Jintao Wang, Gang Wang, and

  Yi Hong.

  HoloDx: Knowledge-and Data-Driven Multimodal Diagnosis of Alzheimer''s Disease.
  IEEE Transactions on Medical Imaging 2025.

  【JBHI''25】

  Qiuhui Chen, Xuancheng Yao, Huping Ye, and

  Yi Hong.

  Enhancing 3D Medical Image Understanding

  with Pretraining Aided by 2D Multimodal Large

  Language Models. JBHI 2025.

  【MM''24】

  Qiuhui Chen and

  Yi Hong.

  SMART: Self-weighted multimodal fusion for diagnostics of neurodegenerative disorders. ACM
  International Conference on Multimedia 2024.

  【

  MICCAI''24

  】Hao Bai and

  Yi Hong.

  NODER: Image Sequence Regression Based on Neural Ordinary Differential Equations.
  MICCAI 2024.

  【

  MedIA''23

  】

  Ankita Joshi and

  Yi Hong.

  R2Net: Efficient and Flexible Diffeomorphic Image Registration Using Lipschitz Continuous
  Residual Networks. Medical Image Analysis 2023.

  学术服务

  MICCAI 领域主席（2019-2021, 2024-2025）

  医学图像计算青年研讨会MICS委员会委员

  医学图像计算青年研讨会MICS Webinar工作组成员'
