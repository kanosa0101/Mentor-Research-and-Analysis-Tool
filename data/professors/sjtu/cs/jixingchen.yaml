title: 长聘教轨副教授
email: xingchenji@sjtu.edu.cn
bio_raw: "个人简介\n纪幸辰，\n上海交通大学约翰•霍普克罗夫特计算机科学中心长聘教轨副教授、“光子传输与通信”全国重点实验室成员、博士生导师。入选\n\
  2021\n年国家级青年人才计划、上海市领军青年人才（海外）、\n2022\n年美国光学协会基金会挑战奖获得者（全球每年仅\n10\n人）、\n2023\n年“上海科技青年\n\
  35\n人引领计划”获奖者、\n2024\n年度上海交通大学“优秀班主任”、2024年第四届“海聚英才”全球创新创业大赛优胜奖、2025年上海交通大学”大中学衔接突出贡献奖“、2025年第一届张江杯-硅光创新创业大赛一等奖，\n\
  2022-2024\n年连续三年入选全球前\n2%\n顶尖科学家年度科学影响力榜单。\n2018\n年获美国康奈尔大学博士学位，\n2018-2021\n年在美国哥伦比亚大学从事博士后研究员工作，\n\
  2021\n年\n12\n月加入上海交通大学，长期从事集成光子芯片和先进微纳制造方面的研究，目前在光学领域著名期刊和会议发表论文\n100\n余篇，包括\nNature\
  \ 2\n篇、\nScience Advances\n、\nLaser & Photonics Reviews\n、\nOptica\n等，\nGoogle\n\
  学术引用超过73\n00\n次，单篇被引用近9\n00\n次，\n5\n篇论文入选\nESI\n高被引论文且\nh-index\n为\n37\n。在\nCLEO\n\
  、\nOFC\n、\nPOEM\n等国内外光学领域顶级会议多次做邀请报告。受邀担任\nNano-Micro Letters（IF=36.3）、\nPhotoniX（IF=19.1）、光子学报青年编委，\n\
  IEEE Photonics Conference\n（\nIPC\n）、\nOECC\n等会议委员会委员和\nNature\n、\nNature Photonics\n\
  、\nNature Communications\n等数十个国际知名期刊的特约审稿人。指导学生获优秀毕业论文、IEEE Student & Young Professional\
  \ Travel Grant (全球每年10人)、IEEE Women in Photonics Travel Grants（全球每年10人）等奖项。\n教育背景\n\
  2014.8-2018.10\n美国康奈尔大学 |  电子与计算机工程 |  哲学博士 |  博士研究生毕业\n2013.8-2014.5\n美国康奈尔大学 |\
  \  电子与计算机工程 |  工学硕士 |  硕士研究生毕业\n2009.9-2013.6\n北京交通大学 |  光信息科学与技术 |  理学学士 |  大学本科毕业\n\
  工作履历\n2021.12-至今\n上海交通大学电子信息与电气工程学院   长聘教轨副教授\n2018.10-2021.12\n美国哥伦比亚大学   博士后\n\
  教授课程\n一粒沙子的旅程-芯片工艺及前沿技术导论（AP1216）\n纳纳米光子技术前沿研究及应用（EST8209）\n工程管理（MEM8310）\n智能芯片\n\
  (BUSS8373)\n论文发表\n近期部分论文：\nIntegrated high-Q Fabry-Pérot cavity at 780 nm with ultrabroad\
  \ operating bandwidth and high fabrication tolerance, Laser & Photonics Reviews,\
  \ e00796 (2025).\nHigh-Efficiency Fiber-Chip Edge Coupler for Near-Ultraviolet Integrated\
  \ Photonics, Adv. Mater. Technol., 2400196 (2024). (Back Cover and Featured in Advanced\
  \ Materials “Rising Stars” Special Collection)\nSpectrally Programmable Optical\
  \ Frequency Comb Generation, ACS Photonics 11 (12), 5195-5204, (2024).\nAdvances\
  \ in resonator-based Kerr frequency combs with high conversion efficiencies, npj\
  \ Nanophotonics 1 (1), 26 (2024).\nAll-optical frequency division on-chip using\
  \ a single laser, Nature 627, 546-552 (2024).\nWidely tunable and narrow-linewidth\
  \ chip-scale lasers from near-ultraviolet to near-infrared wavelengths”, Nature\
  \ Photonics 17 (2), 157-164 (2023).\nAll-dielectric scale invariant waveguide”, Nature\
  \ Communications 14(1) 6675, (2023).\nUltra-Low-Loss Silicon Nitride Photonics Based\
  \ on Deposited Films Compatible with Foundries”, Laser & Photonics Reviews,2200544\
  \ (2023).\n资助项目\n国家自然基金海外优青项目，主持（2022-2024）\n国家自然基金面上项目，主持（2026-2029）\n科技创新2030重大项目，单位第一负责人（2023-2028）\n\
  国家重点研发计划，单位第一负责人（2022-2025）\n国家自然基金专项项目，骨干参与（2024-2026）\n上海市面上项目，主持（2025-2028）\n\
  获奖信息\n2021\n国家优青（海外）\n2022\n美国光学学会基金会挑战奖\n2022\n上海市领军青年人才（海外）\n2023\n上海科技青年\n35\n\
  人引领计划获奖者\n2024\n第四届“海聚英才”创新创业大赛优胜奖\n2025\n张江杯\n-\n第一届硅光创新创业大赛一等奖\n2025\n上海交通大学“大中学衔接突出贡献奖”\n\
  2024\n上海交通大学优秀班主任（本科）\n2022\n华为\nExplore X\n人才计划\n2018-2021 Columbia Nano Initiative\
  \ Fellowship\n学术服务\n2021-\n至今\n全国重点实验室固定研究人员\n2024-\n至今\n国家实验室双聘研究人员\n2025-\n至今\n\
  国际知名期刊《\nPhotoniX\n》青年编委\n2025-\n至今\n国际知名期刊《\nNano-Micro Letters\n》青年编委\n2025-\n\
  至今\n国内光学领域的核心学术期刊《光子学报》青年编委\n2022-2023\n\uFEFF\n国际会议《光电子和通信会议（\nOECC）\n》技术程序委员会委员\n\
  2022-2023\n国际会议《\nIEEE Photonics Conference\n》技术程序委员会委员"
