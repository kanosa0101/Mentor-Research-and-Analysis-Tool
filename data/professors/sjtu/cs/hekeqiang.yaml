title: 长聘教轨副教授
bio_raw: '个人简介

  贺可强，研究方向为计算机网络和系统。研究成果发表于SIGCOMM、NSDI、ToN、EuroSys、SIGMETRICS、ATC、INFOCOM等旗舰学术会议和期刊，并担任NSDI、IWQoS、ICDM、ToN等重要学术会议和期刊的程序委员会委员、分项联合主席和审稿人。谷歌引用次数为1500余次（其中一作最高引用450余次），多项成果获得落地应用。

  教育背景

  2017

  ，威斯康辛大学麦迪逊分校，计算机科学，博士

  2012

  ，清华大学，计算机科学与技术，硕士

  2009

  ，西安电子科技大学，软件工程，学士

  工作履历

  2023-2025，Airbnb，云基础设施部

  2017-2023，谷歌，网络基础设施部

  2015-2016，谷歌，实习

  2014-2015，IBM研究院奥斯汀分院，实习

  2013，贝尔实验室，实习

  教授课程

  计算机网络（英文），本科课程

  操作系统，本科课程

