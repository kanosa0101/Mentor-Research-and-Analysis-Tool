title: 助理研究员
email: houqinsheng@sjtu.edu.cn
bio_raw: '个人简介

  上海交通大学计算机学院（网络空间安全学院、密码学院）助理研究员。山东大学博士。主要研究方向包括系统与软件安全、

  人工智能安全。在IEEE S&P、

  TSE

  、

  ICSE

  、

  CCS

  、

  USENIX Security

  、

  WWW

  、

  TDSC

  、

  ASE

  等国际顶级学术会议和期刊上发表论文

  10

  余篇，并获得

  ACM SIGSOFT

  杰出论文奖。相关研究工作得到国内外知名厂商致谢（如华为、联想、

  VIVO

  、中兴等）及数十个

  CVE/CNVD

  漏洞编号，并多次在知名安全技术竞赛中获奖（

  GeekPwn 2020

  国际安全极客大赛破解成功奖和最高单项奖金、天府杯

  2021

  国际网络安全大赛原创漏洞复现赛破解成功奖、

  DataCon 2023

  大数据安全分析竞赛软件安全赛道季军等

  ）。'
