bio_raw: '个人简介

  陈国兴，现任上海交通大学计算机学院长聘教轨副教授，博士生导师，入选国家级青年人才计划、上海市海外高层次青年人才、上海市“浦江人才”、上海交通大学“小米青年学者”等。

  研究方向为计算机系统与硬件安全，致力于研究基于硬件和操作系统的安全架构（如可信执行环境）的安全性，在微架构侧信道安全、预测执行漏洞分析、远程认证隐私保护等方面取得了一系列原创性成果，包括计算机安全领域四大会议IEEE
  S&P, ACM CCS,

  USENIX Security,

  NDSS。同时担任ACM CCS, USENIX Security, NDSS等学术会议程序委员会委员。

  教育背景

  2013 - 2019

  美国俄亥俄州立大学    博士

  2010 - 2013

  上海交通大学    硕士

  2006 - 2010

  上海交通大学    学士

  工作履历

  2025 - 至 今    上海交通大学

  长聘教轨副教授

  2021 - 2024    上海交通大学

  长聘教轨助理教授

  2019 - 2021    美国Facebook    研究员

  论文发表

  详见个人主页：

  https://donnod.github.io/'
