bio_raw: '个人简介

  叶南阳，现任上海交通大学副教授，博士毕业于剑桥大学，获得国家自然科学基金，上海海外高层次人才，华为探索者等项目。在人工智能和计算机视觉领域顶级期刊和会议，如T-PAMI,
  IJCV, NeurIPS, ICML, ICLR, CVPR, ICCV, AAAI等上发表多篇论文，目前主要研究深度神经网络泛化方法及在大模型、具身智能等应用。泛化能力指的是系统在面对未见过的数据时，能够凭借已有的知识和经验做出有效响应的能力，是人工智能系统走向实用的关键要素之一。最新简介可见个人网站:
  nanyangye.github.io

