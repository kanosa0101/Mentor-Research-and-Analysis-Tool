bio_raw: '个人简介

  牛超越，现为上海交通大学长聘教轨助理教授，目前研究兴趣主要包括移动端生成式大模型、

  大小模型端云协同学习以及在

  智能体、

  推荐系统、

  输入法、

  多模态内容理解等场景的应用，研究成果发表在ACM MobiCom、USENIX OSDI、NeurIPS、

  ACM KDD

  等国际顶尖会议上，并形成多项授权专利。曾获2023年上海市科技进步一等奖（排2）、2023年CCF科技进步一等奖（排2）、2021年CCF优秀博士学位论文奖、

  2025年腾讯微信产学研合作项目优秀奖（Top 5%，项目组长）、2022年阿里巴巴集团优秀学术合作项目（项目组长）

  等荣誉。

  教育背景

  2017-09 至 2021-06，上海交通大学，计算机科学与技术，博士

  2013-09 至 2017-06，上海交通大学，计算机科学与技术（IEEE试点班），学士

  工作履历

  2023-06 至今, 上海交通大学，助理教授

  2021-06 至 2023-05, 上海交通大学，博士后

  教授课程

  本科生课程 EE0503 工程实践与科技创新II（面向移动端设备的深度学习模型与算法开发部署实践）

  研究生课程 CS7316大规模数据处理技术

