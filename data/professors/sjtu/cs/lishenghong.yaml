bio_raw: '个人简介

  李生红，博士，上海交通大学长聘教授／博士生导师，教育部新世纪优秀人才，上海市曙光学者，IEEE高级会员，中国电子学会高级会员，并先后担任上海市信息安全综合管理技术研究重点实验室主任、Associate
  Editor of IEEE IOT Journal等国内/国际学术兼职。主要研究领域包括：网络与信息资源安全管理、人工智能及其在网络空间安全领域的应用。先后承担了国家自然科学基金、国家重点研发计划项目、国家863计划项目、国家973计划项目、国家科技攻关计划项目、国家科技支撑计划项目、国家工信部工业互联网创新发展工程项目等一批国家/省部级科研项目，在国内外学术期刊和会议（包括IEEE
  TIFS、IEEE TKDE、IEEE TDSC、IEEE TNNLS、IEEE Trans. on Cybernetics、IEEE TCSVT、IEEE TNSM、IEEE
  TII、IEEE Trans. on Commu.、IEEE Trans. on SP、IEEE JSAC等顶级国际学术期刊和NDSS、AAAI、ACM SIGKDD、WWW、ICIP、Globecom等顶级国际学术会议）上发表高水平论文150余篇，出版著作4部，获得国家技术发明专利授权30余项。“计算机网络信息分析取证关键技术研究及应用”、“网络媒体监管信息系统”等分别获得上海市科技进步一等奖2项、中国电子学会科技进步二等奖1项、中国产学研合作创新成果一等奖1项。

