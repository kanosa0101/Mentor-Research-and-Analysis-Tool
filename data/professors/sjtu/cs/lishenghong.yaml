  ü

  面向大规模动态网络信息传播最大化的学习自动机研究，国家自然科学基金项目，2020-2023

  ü

  国家信息安全应用示范工程（ S219）二期工程----网络媒体安全综合防御与监管系统，国家“十五”重大科技攻关计划项目子课题，2002-2003

