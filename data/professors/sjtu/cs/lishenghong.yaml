  资助项目

  承担的代表性国家级科研项目：

  ü

  跨社交媒体网络舆情传播与效果评估技术---舆情传播最大化策略生成与效果评估，国家重点研发项目课题，2023-2026

  ü

  混合网络下社会集群行为感知与规律研究---集群行为的社会结构挖掘与演化，国家重点基础研究发展计划（973计划）项目子课题，2010-2014

