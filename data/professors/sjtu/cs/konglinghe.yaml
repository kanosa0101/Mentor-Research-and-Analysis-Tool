bio_raw: '个人简介

  孔令和，上海交通大学计算机学院教授，电信学院副院长，国家级人才计划，国家重点研发计划首席。长期从事物联网、大数据、人工智能领域研究，出版专著4部，发表论文200余篇，获国际会议最佳论文奖10余项。担任国际期刊AI
  for Engineering创刊主编，IEEE TMC、TII、Network编委，中国电子学会理事，中国计算机学会理事。

  教育背景

  2013 上海交通大学 计算机 博士

  2007 法国国立电信研究院 通信 硕士

  2005 西安电子科技大学 自动化 学士

  工作履历

  2021.09-至今 上海交通大学 教授

  2016.09-2021.08 上海交通大学 副教授

  2016.08-2017.02 美国哥伦比亚大学 博士后

  2014.05-2016.04 加拿大麦吉尔大学 博士后

  2013.02-2014.02 新加坡科技与设计大学 博士后

  教授课程

  计算机网络

  人工智能技术及应用

  计算机科学导论

  移动互联网

  工程信息管理

