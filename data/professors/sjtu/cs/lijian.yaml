bio_raw: '个人简介

  李健，现任职于上海交通大学计算机学院研究员、博导，软件定义云平台（SDIC）研究组负责人。依托省部共建国家重点实验室培育基地、上海市可扩展计算与系统重点实验室，研究领域包括AI
  Infra, 新型异构云计算架构，虚拟化技术。

  于2001年于天津大学获得学士学位，2003年于法国Nancy第一大学获得硕士学位，2007年于法国洛林理工学院年博士学位,硕士和博士论文在法国INRIA实验室完成。2007至2008年，在加拿大多伦多大学和麦吉尔大学做博士后和访问学者。2009年至今，在上海交通大学任讲师、副教授、研究员。曾主持自然科学基金重点项目1项，科技部重点研发项目课题1项，面上项目2项，自然基金青年项目1项，主持973子课题1项，863子课题1项，科技部重大科学仪器专项子任务1项，工信部国防科工委民机专项子任务1项，上海科技创新行动项目1项，参与科技部重点研发计划子课题2项，企业合作项目10余项。发表高水平论文50余篇，包括期刊JSAC,
  TC, TPDS, TDSC, TCC, JCST, IEEE Micro等，会议ASPLOS，EuroSys，SigMOD, Infocom, PPoPP,
  ATC, Middleware, HPDC, SoCC, VEE等。

  教育背景

  于2001年于天津大学获得学士学位，2003年于法国Nancy第一大学获得硕士学位，2007年于法国洛林理工学院年博士学位,硕士和博士论文在法国INRIA实验室完成。2007至2008年，在加拿大多伦多大学和麦吉尔大学做博士后和访问学者。2009年至今，在上海交通大学任讲师、副教授、研究员。

  工作履历

  2009年3月-至今    上海交通大学 讲师-副教授-研究员

  2001年-2002年   北京华虹NEC集成电路设计有限公司, IP core 设计部

  教授课程

  本科课程：云操作系统设计与实践

  硕士课程：高级云操作系统、系统安全

  论文发表

  发表代表性高水平论文50余篇，包括期刊JSAC, TC, TPDS, TDSC, TCC, JCST, IEEE Micro等，会议ASPLOS，OSDI，EuroSys，SigMOD,
  Infocom, PPoPP, ATC, Middleware, HPDC, SoCC, VEE等。

  资助项目

  面向分布式异构计算的虚拟化技术与系统软件，自然科学基金重点项目，2023-2027

  下一代智能超算系统关键技术研究项目- 应用支撑能力评估，重点研发计划课题，2025-2027

  华为、阿里、腾讯等企业合作项目。

  学术服务

  ToC, TII, IEEE Access, ToCC, ToN, TPDS，JSAC等国际期刊和ICPADS, Infocom,CSA,等国际会议的审稿人。

  曾任Elsevier CEE期刊副编辑。CCF 高级会员, ACM 终身会员, IEEE Senior Member 会员等。'
