bio_raw: '个人简介

  晏轶超，上海交通大学计算机学院长聘教轨副教授、博士生导师。获中国图象图形学学

  会科技进步二等奖（排1）、自然科学二等奖（排

  2

  ）及优秀博士论文奖，入选上海市领军人才（海外）。申请人长期致力于计算机视觉、数字人、AIGC、具身智能等方向的研究，在本领域发表

  SCI

  一区及

  CCF A

  类论文

  50余

  篇，其中第一作者

  /

  通讯作者论文

  43

  篇。研究成果在

  CVPR 2019

  、

  ECCV 2022

  等顶级国际会议上进行口头报告，并在

  CVPR 2023

  国际竞赛

  Ego4D

  零样本检测中获得全球第一名，获第十八届

  “

  挑战杯

  ”

  智能数字人专项赛特等奖、

  2024

  中国国际大学生创新大赛上海赛区金奖。研究工作受到国内外学术界的广泛关注，谷歌学术引用超过

  3000

  次，被中国、欧美院士及

  ACM/IEEE Fellow

  累计引用

  60

  余次。主持国家自然科学基金面上、青年项目（

  C

  类）、上海市市级科技重大专项课题，承担华为、阿里巴巴等知名企业的产学研合作项目

  ，并获得优秀结题

  。研究成果已在京东、联想等企业产品中落地应用，并受到中央电视台、上海广播电台、新民晚报等主流媒体的报道。

  教育背景

  2013.09-2019.09，上海交通大学，电子系，博士

  2011.09-2013.08，法国里昂中央理工学院，硕士（csc联合培养)

  2009.09-2013.06，上海交通大学，电子信息与电气工程学院，学士

  工作履历

  2019

  年

  6

  月

  -2021

  年

  4

  月，阿联酋起源人工智能研究院，博士后研究员

  2021

  年

  5

  月

  -2024

  年

  12

  月，上海交通大学电子信息与电气工程学院，长聘教轨助理教授

  2025

  年

  1

  月

  -

  今，上海交通大学计算机学院，

  长聘教轨

  副教授'
