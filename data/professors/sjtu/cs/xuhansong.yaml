bio_raw: '个人简介

  副研究员，硕士生导师，

  IEEE

  高级会员，入选上海市浦江人才

  、上海市东方英才（青年）、上海市青年科技启明星

  、获得国家自然科学基金青年项目、中国博士后科学基金会

  “

  特别资助

  ”

  等。获得第二届上海市博士后创新创业大赛揭榜组第一名。

  2020-2024

  年在上海交通大学网络安全技术研究院担任博士后、助理研究员。

  获得美国

  Towson

  大学计算机与信息科学博士学位，入选博士研究基金。在美国国家标准与技术研究院（

  NIST

  ）的信息技术实验室

  担任客座研究员两年。研究成果发表于

  IEEE COMST

  、

  JSAC

  、

  TII

  、

  IoT-J

  、

  TDSC

  、

  INFOCOM

  等国际期刊与会议

  40

  余篇，入选

  IEEE

  最佳论文奖及

  ESI

  高被引论文。研究方向包括物联网、网络安全等领域的理论与技术。

  Research Associate Professor, Master''s Supervisor, and IEEE Senior Member, was
  selected for the Shanghai "Pujiang Talent" Program, the Shanghai "Oriental Talent"
  Youth Program, and the Shanghai "Rising Star" Program. He has received support from
  the National Natural Science Foundation of China Youth Project, the “Special Funding”
  from the China Postdoctoral Science Foundation, and various industry-academia collaboration
  projects. From 2020 to 2022, he conducted postdoctoral research at the Institute
  of Cyber Science and Technology of Shanghai Jiao Tong University. He earned his
  Ph.D. in Computer and Information Sciences from Towson University, USA, and was
  selected for the Doctoral Research Fellowship. He served as a Guest Researcher at
  the U.S. National Institute of Standards and Technology (NIST) for two years. His
  research has been published in international journals and conferences such as IEEE
  COMST, JSAC, TII, IoT-J, TDSC, and INFOCOM, with over 40 papers, and he has received
  the IEEE Best Paper Award and ESI Highly Cited Paper recognition. His research interests
  include the Internet of Things (IoT) and Network Security.'
