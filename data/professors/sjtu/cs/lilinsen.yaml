  （5）上海市科委2016年度“科技创新行动计划”项目课题“基于大数据的慢病管理平台数据安全和隐私保护”（课题编号：16511102605），60万元，课题负责人，2016年7月到2018年6月，已结题。

  （6）上海市科委2016年度“科技创新行动计划”项目课题“基于RFID及二维码的危险化学品信息安全和防爆安全技术研究”（课题编号：16DZ1200702），课题负责人，50万元，2016年7月到2018年6月，已结题。

