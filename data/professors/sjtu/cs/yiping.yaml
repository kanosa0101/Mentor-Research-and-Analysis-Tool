bio_raw: '个人简介

  易平，IEEE高级会员、计算机学会高级会员，长期从事网络安全与人工智能安全领域的研究工作，承担了国家重点研发计划、国家863项目、自然科学基金项目、总装预研基金项目、上海科委重点科技攻关项目多项国家和上海市项目，相关研究成果已经在各类著名国际性学术期刊和会议上发表学术研究论文100余篇，其中包括IEEE
  Transactions on Multimedia、INFOCOM、ICC、GlobeCom多个顶级国际学术期刊和国际学术会议。

