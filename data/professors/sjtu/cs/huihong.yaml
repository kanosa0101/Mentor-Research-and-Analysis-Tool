bio_raw: '个人简介

  回红，博士，2003年毕业于浙江大学，同年在上海交通大学任教至今。2007年曾在美国加州大学计算机视觉实验室做访问学者。主要研究方向为人工智能的数据处理和图像处理与模式识别，身份认证、信息安全，认知行为，生命科学等。参与和主持过自然科学基金项目4项，以及多项国家863项目和省部级项目。发表国内外高水平论文数篇。'
