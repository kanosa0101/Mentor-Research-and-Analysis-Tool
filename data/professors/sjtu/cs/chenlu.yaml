bio_raw: '个人简介

  陈露，上海交通大学计算机学院副教授

  /

  博导，上海创智学院全时导师，

  X-LANCE

  实验室

  成员。研究方向为大语言模型基础技术、智能体系统及其在科学领域的交叉应用，以第一作者或通讯作者（含共同）在

  Cell

  子刊、

  TPAMI

  、

  TACL

  期刊以及

  NeurIPS

  、

  ICML

  、

  ACL

  等人工智能领域重要国际会议发表论文

  60

  余篇。主持国家自然科学基金面上

  /

  青年基金、重大产学研合作项目等。授权专利

  30

  余项，

  10

  项专利成功实现转化，其中

  1

  项转化专利获评第

  23

  届中国专利奖优秀奖。研发了

  DFM

  系列对话大模型（包括

  ChemDFM

  化学材料大模型），相关技术已成功在智能手机、汽车智能座舱、科学研究等领域取得大范围推广应用。长期担任

  ARR

  系列会议领域主席、《自然》（

  Nature）

  正刊及子刊审稿人。'
