bio_raw: '个人简介

  刘锦阳于

  2026

  年

  3

  月加入上海交通大学计算机学院先进计算研究所，担任长聘教轨副教授。他于

  2024

  年在美国加利福尼亚大学河滨分校获得计算机科学博士学位，本科和硕士毕业于北京大学，曾于

  2024

  至

  2026

  年间于美国休斯敦大学计算机系担任助理教授一职，入选了国家级高层次青年人才计划（海外）和上海市海外高层次青年人才计划。刘锦阳长期致力于高性能计算与科学智能（AI
  for Science, AI4S）

  方面的研究，在大规模科学计算和科学数据压缩等研究课题上取得了众多研究成果。他共发表

  CCF-A/B

  类论文近

  30

  篇（包括

  SIGMOD

  、

  VLDB

  、

  SC

  、

  PPoPP

  、

  ICDE

  、

  HPDC

  、

  ICS

  、

  TPDS

  等），所发论文曾获得

  PPoPP

  、

  HPDC

  、

  ICS

  等会议的最佳论文提名，并受邀担任

  PPoPP

  、

  ICS

  、

  Cluster

  、

  ICDCS

  等会议的程序委员会成员及

  TPDS

  、

  THPC

  等期刊的审稿人。更多信息详见个人主页：jliu-1.github.io。

  教育背景

  美国加利福尼亚大学河滨分校 计算机科学 博士

  北京大学 数据科学 硕士

  北京大学 数学与应用数学 学士

