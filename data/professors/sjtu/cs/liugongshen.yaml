bio_raw: '个人简介

  教育部本科教学评估专家、教育部-华为智能基座优秀教师、上海市新耀东方风采人物。中国计算机学会杰出会员，中文信息学会、中国图象图形学学会、电子学会等专委委员。《信息网络安全》、《信息安全研究》期刊编委，机械工业出版社信息安全领域编审委员。

  研究兴趣包括人工智能安全、大模型及其安全、自然语言处理、深度学习框架及其安全、多模态大模型等，研发成果服务于网络空间净化、信息感知和政策决策等国家重大需求。主持的代表项目包括科技术部2023下一代人工智能重大项目课题、上海市人工智能科技创新计划项目、国家自然科学基金联合重点项目等纵向课题以及校企联合实验室等20多项项目。发表学术论文100多篇，获得授权发明专利20多项。曾获2024年中国图象图形学会科学技术进步奖一等奖、2022年北京市科技进步奖二等奖、2017年国家保密局保密科学技术奖三等奖。

  主持建设操作系统（上海市一流课程）和计算机病毒原理及实践（国家级一流课程）课程，面向国产操作系统的恶意代码防范虚拟仿真实验课程（上海市一流课程）、教育部-华为智能基座金课等课程。主编教材5部，参编7部。曾获2024年教育部-华为智能基座优秀教师、2023年国家级教学成果二等奖、2022年上海市教学成果奖特等奖、2012年和2015年上海市高等教育优秀教材一等奖等。

