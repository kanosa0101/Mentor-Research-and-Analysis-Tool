bio_raw: '个人简介

  黄俊钦，博士，上海交通大学计算机学院助理研究员。2024年6月于上海交通大学计算机系获得博士学位，主要研究方向包括区块链、物联网、数据安全及可信计算等领域。在TIFS,
  TDSC, TMC, WWW等高质量国际期刊及会议上发表论文20余篇，其中ESI高被引论文4篇，单篇最高引用量达690余次，Google Scholar引用数达1700余次。授权国家发明专利4项，软件著作权2项。主持蚂蚁集团智能体安全合作项目1项，作为主要人员参与多项国家重点研发计划、国家自然科学基金项目，主导完成支付宝、华为、中国星网、之江等企业合作项目。担任区块链领域期刊BCRA（CCF
  B）青年编委，APNet''26（CCF C）Sponsorship Chair，IEEE Blockchain、IEEE ISPA、IEEE VTC等多个国际会议的TPC
  Member。获评上海市计算机学会自然科学一等奖、日内瓦国际发明展金奖等科技奖励。致力于在区块链、隐私计算技术及其在网络安全领域的应用与实践方面寻求创新性突破。

  欢迎有志于数据安全、智能体安全领域的同学联系交流！

