title: 长聘教轨副教授
email: dequanwang@sjtu.edu.cn
bio_raw: '个人简介

  上海交通大学计算机学院长聘教轨副教授、博士生导师，上海创智学院全时导师，入选国家高层次青年人才计划、上海市海外高层次青年人才计划。本科毕业于复旦大学，博士毕业于加州大学伯克利分校，师从
  Trevor Darrell 教授。主要研究方向为大模型智能体驱动的科学智能，据 Google Scholar 统计，研究工作近五年被引用 15000 余次。

  教育背景

  2012 - 2016：复旦大学，计算机，学士

  2016 - 2022：加州大学伯克利分校，计算机，博士

  工作履历

  2023 - 2025：上海交通大学，长聘教轨助理教授、博士生导师

  2023 - 2024：上海人工智能实验室，青年科学家

  2025 - 至今：上海创智学院，全时导师

  2026 - 至今：上海交通大学，长聘教轨副教授、博士生导师

  教授课程

  高中生课程《走近大模型》

  本科生课程《人工智能算法实践》

  研究生课程《设计与理解深度神经网络》

  论文发表

  https://scholar.google.com/citations?hl=en&user=OZ7PjVoAAAAJ

  获奖信息

  国家高层次青年人才

  上海市海外高层次青年人才

  世界人工智能大会云帆奖·明日之星'
