bio_raw: '个人简介

  周煊赫，现任上海交通大学计算机学院长聘轨助理教授，上海人工智能实验室

  兼职

  助理研究员，第四范式技术顾问。主要研究Self-Improving Agent、世界行为模型（如多模态数据对齐）、Agent记忆体系统，曾获得

  通信学会科学技术一等奖1项、CCF-A类国际顶会论文奖2项

  。

  本人在SIGMOD、VLDB、NIPS、CVPR、ECCV、ACL、TKDE等CCF A类会议和期刊上已发表论文数十篇，包括近五年NIPS、VLDB、ICDE高被引论文，入选卡耐基梅隆大学、康奈尔大学等高校课程。谷歌学术引用量四千余次。曾获
  ACM Jim Gray博士论文提名奖（大陆首位）【1】、VLDB 2023最佳工业论文亚军奖（第一作者）【2】、CCF优博、

  世界人工智能大会云帆奖【3】

  、微软学者、字节跳动奖学金、清华特奖等荣誉。代表性工作OpenMLDB已经落地第四范式先知（AIOS）平台【4】，并在金融、电商、能源等百余个真实场景中实现规模化应用。

