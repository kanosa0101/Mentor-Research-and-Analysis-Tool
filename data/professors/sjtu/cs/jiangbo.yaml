bio_raw: '个人简介

  I am broadly interested in all aspects of the intersection of AI, networks and systems,
  including theoretical modeling and analysis, performance evaluation and optimization,
  algorithm design, and system implementation. My current research interests include
  distributed learning systems, efficient training and inference of LLMs, deep learning
  theory, etc.

  教育背景

  Ph.D. in Computer Science, University of Massachusetts Amherst, 2015.

  M.S. in Applied Mathematics, University of Massachusetts Amherst, 2012.

  M.S. in Electrical and Computer Engineering, University of Massachusetts Amherst,
  2008.

  B.Eng. in Electronic Engineering, Tsinghua University, 2006.

  工作履历

  Shanghai Jiao Tong University

  Tenured Associate Professor, John Hopcroft Center for Computer Science, Jan. 2025
  -- present.

  Tenure-track Associate Professor,

  John Hopcroft Center for Computer Science, Sept. 2018 --  Dec. 2024

  .

  University of Massachusetts Amherst

  Postdoctoral Research Associate, Manning College of Information and Computer Science,
  July 2015 -- July 2018

  教授课程

  CS2601: Linear and Convex Optimization

  MATH3806: Optimization Methods'
