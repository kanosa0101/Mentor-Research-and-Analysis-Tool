bio_raw: '个人简介

  1989.09-1993.07 上海交通大学   电子工程系  通讯工程专业  本科 工学学士

  1993.09-1996.03 上海交通大学

  电子工程系  通讯工程专业

  硕士 工学硕士

  1996.04-2001.12 上海交通大学 电子信息学院电子工程系 教师

  2001.12-2024.12 上海交通大学 电子信息与电气工程学院

  2025.01 至今 上海交通大学计算机学院 网安研究院老师

  教育背景

  交大 93年硕士毕业

  工作履历

  2003 - 2013  年  百丽集团ERP信息化建设,支撑百丽从500个网点 扩张 到 4万个网点,成为国内最大的零售商

  2014年 至今  ，长期从事零售行业 ERP平台建设，平台支撑应用有:

  云ERP

  云POS（支持双云 单个云瘫痪可以继续使用系统）

  移动 POS

  SRM

  SCRM (宝洁  古井  千金 等头部客户)

  电商平台(支持AI 识别配眼镜描述)

  OMS/O2O

  云商城

  教授课程

  1996 - 2017  电子工程系 数据库 + 通信工程

  论文发表

  双排序先进先出算法'
