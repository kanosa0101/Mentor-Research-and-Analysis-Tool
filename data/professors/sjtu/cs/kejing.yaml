bio_raw: '个人简介

  柯晶，博士毕业于澳大利亚新南威尔士大学，目前在上海交通大学计算机系任副教授、博导，任新南威尔士大学联席高级讲师（Adjunct Senior Lecturer）。在GPU芯片行业包括AMD等著名企业有多年的工业界经验。目前主要的研究方向为基于AI的医学图像及GPU异构计算，在IEEE
  Transactions on Medical Imaging, Medical Image Analysis, MICCAI等国际期刊会议发表论文五十余篇，出版著作一部。'
