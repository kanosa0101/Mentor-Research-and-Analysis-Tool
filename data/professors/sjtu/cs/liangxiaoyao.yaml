bio_raw: '个人简介

  上海交通大学计算机学院教授，主要致力于计算机体系结构方面的研究。在国内外会议与期刊累计发表数百篇论文，多次获得最佳论文奖，

  入选体系结构顶会ISCA、MICRO名人堂（Hall of Fame）

  。主要著作包括《昇腾AI处理器架构与编程》、《通用图形处理器设计-GPGPU编程模型与架构原理》等。

  论文发表

  https://dblp.org/pid/88/6436.html'
