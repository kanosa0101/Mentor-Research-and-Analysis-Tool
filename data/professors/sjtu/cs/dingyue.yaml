bio_raw: '个人简介

  现任助理研究员，2018年博士毕业于上海交通大学计算机系，2019年至2022年在上海交通大学软件学院任助理研究员，2023年起在上海交通大学计算机系（计算机学院）任助理研究员。主要研究方向为计算机视觉、具身智能、数据挖掘和推荐系统，目前研究兴趣包括：

  （1）

  高效鲁棒的视觉-语言-动作（VLA）模型

  （2）

  机器人目标（Goal-Oriented）导航

  （3）多模态大模型

  （4）自动驾驶

  （5）多任务学习（图像密集预测）

  （6）高中低层计算机视觉技术（超分、检测、抠图、分割、深度估计、重建等）

  （7）扩散模型

  教授课程

  ISE3302：大数据分析与挖掘，2025-

  CS4303：大数据处理，2023-

  CS4504：工程实践与科技创新Ⅳ-G，2023-

  SE3303：数据挖掘及大数据分析，2023-2025

  SE125：机器学习，2020-2021

