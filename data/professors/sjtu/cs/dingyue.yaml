  资助项目

  （1）科技部国家重点研发计划, 2020YFB1806704, 以数据为中心的ICDT深度融合研究，子课题主持（课题参与），2020-2023

  （2）教育部，赛尔网络下一代互联网技术创新项目，NGII20190904，基于IPv6的高校图书借阅个性化推荐系统，主持，2019-2020

  （3）九识（苏州）智能科技有限公司，自动驾驶中的多模态融合技术与模型压缩方法，主持，2025-2026

  （4）上海航天技术有限公司，基于机器学习的卫星遥感影像样本自动标记技术，主持，2025-2026

