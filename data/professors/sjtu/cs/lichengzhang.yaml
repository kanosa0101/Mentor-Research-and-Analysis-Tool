bio_raw: '个人简介

  李承璋

  ，上海交通大学计算机学院长聘教轨副教授、博士生导师，入选国家级

  海外高层次青年人才，上海市海外高层次青年人才

  。本科毕业于清华大学，博士毕业于弗吉尼亚理工大学，曾在美国NSF人工智能-边缘网络研究所（NSF AI-EDGE Institute）担任研究科学家。主要研究方向为人工智能与边缘网络的交叉，包括人工智能应用在边缘网络的部署，以及基于人工智能的通信网络优化。已在INFOCOM、MobiHoc、ICDCS、ToN、TMC、JSAC、IoTJ等国际会议/期刊上发表论文40余篇，已发表两项美国专利。目前担任国际会议INFOCOM、MobiHoc、ICDCS的程序委员会委员。

  教育背景

  2017-08至2022-12，美国，

  弗吉尼亚理工大学（Virginia Tech），计算机工程，博士，

  导师Tom Hou（IEEE Fellow）

  2013-09至2017-07，清华大学，电子工程系，学士。

  工作履历

  2024-09至2025-12，美国，NSF人工智能-边缘网络研究所（NSF AI-EDGE Institute），研究科学家（Research Scientist），合作导师
  Ness Shroff （IEEE Fellow）

  2023-01至 2024-08，美国，俄亥俄州立大学（Ohio State University），博士后，合作导师 Ness Shroff （IEEE Fellow）

  2022-05至 2022-08，美国，英伟达公司（NVIDIA Corp），5G工程师

  论文发表

  代表性论文：

  1. Chengzhang Li, Peizhong Ju, Atilla Eryilmaz, and Ness B. Shroff, “Two Levels
  Are All You Need: Simplifying Data Compression for Timely Edge Classification,”
  accepted by ACM MobiHoc, 2025.

  2. Chengzhang Li, Peizhong Ju, Atilla Eryilmaz, and Ness B. Shroff, “Efficient Multi-dimensional
  Compression for Network-edge Classification,” in Proc. ACM MobiHoc, pp. 91–100,
  Athens, Greece, Oct. 7–10, 2024.

  3. Chengzhang Li, Shaoran Li, Qingyu Liu, Y. Thomas Hou, Wenjing Lou, and Sastry
  Kompella, “Eywa: A general approach for scheduler design in AoI optimization,” in
  Proc. IEEE INFOCOM, 9 pages, New York, USA, May 17–20, 2023.

  4. Chengzhang Li, Qingyu Liu, Shaoran Li, Yongce Chen, Y. Thomas Hou, and Wenjing
  Lou, “On Scheduling with AoI Violation Tolerance,” in Proc. IEEE INFOCOM, 9 pages,
  virtual conference, May 10–13, 2021.

  5. Chengzhang Li, Shaoran Li, Yongce Chen, Y. Thomas Hou, and Wenjing Lou, “AoI
  Scheduling with Maximum Thresholds,” in Proc. IEEE INFOCOM, pp. 436–445, virtual
  conference, July 6–9, 2020.

  6. Chengzhang Li, Yan Huang, Yongce Chen, Brian Jalaian, Y. Thomas Hou, and Wenjing
  Lou, “Kronos: A 5G Scheduler for AoI Minimization under Dynamic Channel Conditions,”
  in Proc. IEEE ICDCS, pp. 1466–1475, Dallas, TX, July 7–10, 2019.

  7. Chengzhang Li, Shaoran Li, and Y. Thomas Hou, “A General Model for Minimizing
  Age of Information at Network Edge,” in Proc. IEEE INFOCOM, pp. 118–126, Paris,
  France, April 29–May 2, 2019.

  学术服务

  程序委员会委员：

  IEEE INFOCOM 2024-2027

  ACM MobiHoc 2026

  IEEE ICDCS 2026

  审稿人：

  IEEE/ACM ToN, IEEE TIT, IEEE TWC, IEEE TNSE, IEEE ISIT, IEEE Comm. Magazine, AAAI
  AI Magazine, Nature Scientific Reports.'
