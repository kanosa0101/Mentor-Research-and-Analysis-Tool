bio_raw: '个人简介

  李超，上海交通大学教授，博士生导师，研究领域为高性能高能效的芯片架构与算力集群。担任中国计算机学会体系结构专委会副主任，CCF A类国际期刊IEEE Transactions
  on Computer的副主编（AEIC）和领域首席编委。主持国家自然科学基金委优秀青年科学基金、联合基金重点项目、科技创新2030“新一代人工智能”重大项目课题等科研任务。在计算机体系结构领域高水平期刊和会议上发表论文160余篇，获得最佳/焦点论文奖5次，提名奖5次，授权国内外发明专利30余项。入选上海市青年科技启明星、全国高校计算机专业优秀教师奖励计划，并获IEEE
  TCSC可扩展计算早期职业成就奖、CCF分布式计算与系统青年创新先锋、CCF青年科技奖等荣誉。

  详见个人主页：https://www.cs.sjtu.edu.cn/~lichao

  教育背景

  2009.08-2014.08    University of Florida,

  PhD.

  2005.09-2009.06    Zhejiang University,

  BSc.

  工作履历

  2018.03 - 2018.05    微软亚洲研究院，青年访问研究员

  教授课程

  《云计算技术》

  《计算机体系结构》、《先进计算机体系结构》

  《计算机伦理学》、《计算机科学中的伦理问题》'
