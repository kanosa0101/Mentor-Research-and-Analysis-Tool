bio_raw: '个人简介

  张倬胜，上海交通大学长聘教轨助理教授、博士生导师，研究兴趣为多模态大模型、多智能体交互与认知安全。

  入选

  世界人工智能大会云帆奖

  ·

  璀璨明星（全球

  10

  人）、

  全球前

  2%

  顶尖科学家、

  全球

  AI

  华人百强学术新星、

  中国中文信息学会优博、

  ACM SIGAI

  优博、

  上海交通大学学术之星（

  2

  次）

  。

  在

  Nature Communications

  ，

  TPAMI

  ，

  ICLR

  ，

  ICML

  ，

  ACL

  等国际顶级期刊和会议上发表论文

  100

  余篇。

  Google Scholar

  被引

  1

  万余次，在10余项国际权威评测榜单取得过全球第一（SQuAD 2.0 首次单模型超越人类分数）。开源成果获得超过

  5

  万

  GitHub

  星标、开源模型被下载

  300

  万次。

  4

  篇论文被

  Paper Digest

  选为

  ICLR

  、

  AAAI

  年度最具影响力论文列表，

  获得

  2024

  世界人工智能大会青年优秀论文奖、

  2024

  全国大模型智能生成大大会优秀海报奖

  。

  主持国家自然科学基金青年项目、国家重点研发子课题、上海市面上/专项、CCF/CIPS/CAAI基金项目、上海交通大学AI for Science种子计划及知名企业的智能体合作项目（腾讯

  /

  通义

  /华为/字节/OPPO/美团/联想/蚂蚁/智谱/百川）等10余项。研究成果获评

  2024

  年度上海市科技进步奖一等奖。

  曾在亚马逊云科技、微软雷德蒙德研究院、澜舟科技、日本国立情报研究机构（

  NICT

  ）访学。担任中国中文信息学会青年工作委员会委员、中国中文信息学会大模型与生成专业委员会委员、上海市计算机学会自然语言处理专业委员会委员、北京智源人工智能研究院青源会青年科学家。担任中国计算语言学大会

  CCL 2022

  、

  CCL 2025

  、

  CCL 2026

  分委会主席。多次担任领域内重要会议或期刊

  ACL Rolling Review

  （

  ARR

  ）、

  TMLR

  编委，

  NeurIPS

  、

  ACL

  、

  EMNLP

  、

  AAAI

  、

  IJCAI

  等人工智能领域国际顶级会议的（高级）领域主席或高级程序委员。在

  GitHub

  发布《动手学大模型》公益教程，获得

  4.9

  万星标，在昇腾社区发布《大模型开发全流程》，注册学员

  1.2

  万人。指导学生获得上海交通大学优异学士学位论文（前

  1%

  ）、中国青年科技创新揭榜挂帅擂台赛一等奖、全国大学生信息安全竞赛作品赛二等奖。

  个人主页：

  https://bcmi.sjtu.edu.cn/~zhangzs

