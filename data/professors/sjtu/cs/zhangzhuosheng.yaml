  论文发表

  代表性论文

  [1]. Automatic Chain of Thought Prompting in Large Language Models. Zhuosheng Zhang,
  Aston Zhang, Mu Li, Alex Smola. ICLR, 2023. 被引1756次，GitHub获2K星标.

  [2]. Multimodal Chain-of-Thought Reasoning in Language Models. Zhuosheng Zhang,
  Aston Zhang, Mu Li, Hai Zhao, George Karypis, Alex Smola. TMLR, 2024. 被引1036次，GitHub获4K星标.

  [3]. Training High-Level Schedulers with Execution-Feedback Reinforcement Learning
  for Long-Horizon GUI Automation. Zehao Deng, Tianjie Ju, Zheng Wu, Zhuosheng Zhang*,
  Gongshen Liu. CVPR 2026.

  [4]. Flooding Spread of Manipulated Knowledge in LLM-Based Multi-Agent Communities.
  Tianjie Ju, Yiting Wang, Xinbei Ma, Pengzhou Cheng, Haodong Zhao, Yulong Wang, Lifeng
  Liu, Jian Xie, Zhuosheng Zhang*, Gongshen Liu*. SCIS 2025.

  [5]. Risks of AI scientists: prioritizing safeguarding over autonomy. Xiangru Tang,
  Qiao Jin, Kunlun Zhu, Tongxin Yuan, Yichi Zhang, Wangchunshu Zhou, Meng Qu, Yilun
  Zhao, Jian Tang, Zhuosheng Zhang, Arman Cohan, Dov Greenbaum, Zhiyong Lu & Mark
  Gerstein. Nature Communications.

  [6]. You Only Look at Screens: Multimodal Chain-of-Action Agents. Zhuosheng Zhang,
  Aston Zhang. Findings of The 62nd Annual Meeting of the Association for Computational
  Linguistics (ACL), 2024. 被引190次，合作者Aston Zhang来自Meta GenAI团队，Llama 3、Llama 4核心贡献者.

  [7]. Caution for the Environment: LLM Agents are Susceptible to Environmental Distractions.
  Xinbei Ma, Yiting Wang, Yao Yao, Tongxin Yuan, Aston Zhang, Zhuosheng Zhang*, Hai
  Zhao*. The 63rd Annual Meeting of the Association for Computational Linguistics
  (ACL), 2025.

  [8]. Discourse-Aware Language Representation. Zhuosheng Zhang, Siru Ouyang, Hai
  Zhao. IEEE Transactions on Pattern Analysis and Machine Intelligence (TPAMI), 2025.
  CCF-A/中科院1区TOP.

  [9]. Universal Multimodal Representation for Language Understanding. Zhuosheng Zhang,
  Kehai Chen, Rui Wang, Masao Utiyama, Eiichiro Sumita, Zuchao Li, Hai Zhao. IEEE
  Transactions on Pattern Analysis and Machine Intelligence (TPAMI), 2023. CCF-A/中科院1区TOP.

  [10]. SG-Net: Syntax Guided Transformer for Language Representation. Zhuosheng Zhang,
  Yuwei Wu, Junru Zhou, Sufeng Duan, Hai Zhao, Rui Wang. IEEE Transactions on Pattern
  Analysis and Machine Intelligence (TPAMI), 2022. CCF-A/中科院1区TOP

