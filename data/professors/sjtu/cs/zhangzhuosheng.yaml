bio_raw: '个人简介

  张倬胜，上海交通大学长聘教轨助理教授、博士生导师。2023年、2020年于上海交通大学分别取得博士、硕士学位，2016年于武汉大学取得学士学位。

  曾在亚马逊云科技、微软雷德蒙德研究院、

  日本国立情报通信研究机构（NICT）

  、

  北京澜舟科技访问研究

  。

  入选世界人工智能大会云帆奖·璀璨明星（全球10人）、全球AI华人百强学术新星、斯坦福全球前2%顶尖科学家、中国中文信息学会优博、ACM SIGAI优博、上海交通大学学术之星（2次），获得上海市科技进步奖一等奖。

  长期从事大模型基础算法、智能体交互与认知安全研究。论文发表于Nature子刊、TPAMI、ICLR、ICML、NeurIPS、ACL、EMNLP等国际顶级期刊和会议。Google
  Scholar被引1.3万次，6篇论文入选全球高影响力论文或获论文奖。开源成果获得超过6万GitHub星标，模型被下载300万次，在10余项国际权威评测榜单上取得过全球第一（在SQuAD
  2.0上首次以单模型超越人类分数）。代表性成果包括：2021年国内首批预训练语言模型“孟子”、2022年大模型思维链开创性范式（Auto-CoT自动思维链、MM-CoT多模态思维链）、2023年大模型智能体安全开创性工作R-Judge及AI手机智能体早期工作Auto-GUI。

  主持国家自然科学基金青年项目、国家重点研发计划子课题、上海市“通用人工智能大模型”基础研究专项、CCF/CIPS/CAAI基金项目、上海交通大学AI for Science种子计划及知名企业合作项目（腾讯/通义/华为/字节跳动/OPPO/美团/联想/蚂蚁/智谱/百川等）。研究成果应用于智能终端、本地生活服务、平台安全防护等场景。为学生提供头部企业实习和国际团队合作研究的机会。

  【实验室】人工智能与认知安全研究所，学术带头人：蒋兴浩副校长，所长：朱浩瑾教授，副所长：刘功申教授，研究所主页：https://www.cs.sjtu.edu.cn/yjjg/806.html

