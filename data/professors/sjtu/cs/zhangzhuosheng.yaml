  学术服务

  担任中国中文信息学会青年工作委员会委员、中国中文信息学会大模型与生成专业委员会委员、上海市计算机学会自然语言处理专业委员会委员、北京智源人工智能研究院青源会青年科学家。担任中国计算语言学大会（CCL
  2022、CCL 2025、CCL 2026）分委会共同主席，

  长期

  担任ACL Rolling Review（ARR）、TMLR编委，以及NeurIPS、ACL、EMNLP、AAAI、IJCAI等人工智能领域国际顶级会议的（高级）领域主席或高级程序委员。'
