bio_raw: '个人简介

  研究方向：计算机系统结构、并行与网络计算。

  入选首届教育部 “高校计算机专业优秀教师”奖励计划，获全国高校教师教学创新赛新工科组二等奖、上海交大教书育人奖集体一等奖、上海市科技进步奖二等奖等多个奖项。主持多项省部级、校级教学改革和研究项目，发表多篇教学论文。主持国家一流本科课程《计算机组成与系统结构》的建设工作，参与课程《程序设计思想与方法》、《现代操作系统》的建设工作。

  教育背景

  2001-2004

  上海交通大学计算机系 博士

  1993-1996

  上海交通大学计算机系 硕士

  1989-1993 上海交通大学计算机系 本科

  教授课程

  计算机系统结构（强化）

  程序设计思想与方法（C++）

  现代操作系统'
