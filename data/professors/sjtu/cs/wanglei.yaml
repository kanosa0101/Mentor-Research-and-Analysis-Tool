bio_raw: '个人简介

  王磊，上海交通大学计算机学院教授，

  主要从事国家/国际密码基础算法的安全评估，包括美国FIPS 197 (AES)、180-2 (SHA-2)和NIST SP 800（KDF等）、俄罗斯GOST
  R 34.11-2012 (Streebog)、ISO/IEC 9797-1/2/3（CMAC、HMAC等），以及主流密码应用协议的安全评估，包括TLS 1.3（互联网安全传输）、ANSI
  X9.24-1（金融）、APOP（电子邮件）等

  。研究成果多次在Journal of Cryptology、CRYPTO、EUROCRYPT、ASIACRYPT等学术期刊和国际会议上发表。指导学生获得“互联网+”大学生创新创业大赛金奖、中国密码学会优秀博士论文，上海市/交大优秀毕业生等

  教育背景

  2007.04-2011.03 日本国立电气通信大学 情报通信 博士学位

  2002.09-2006.07 上海交通大学计算机科学与工程系 学士学位

  工作履历

  2024.01-至今 上海交通大学 教授

  2015.07-2023.12 上海交通大学 特别研究员/长聘副教授

  2012.07-2015.06 新加坡南洋理工大学 博士后

  2011.04-2012.06  日本学术振兴会外国人研究员

  教授课程

  《WEB3与数字信任》、《区块链及其应用》

  论文发表

  https://dblp.uni-trier.de/pid/w/LeiWang31.html

  资助项目

  国自然基金、重点研发课题、重大专项课题、国家密码基金等'
