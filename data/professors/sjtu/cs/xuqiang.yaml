bio_raw: '个人简介

  许强，上海交通大学计算机学院（网络空间安全学院、密码学院）助理研究员、博士生导师。博士毕业于上海交通大学，曾任南洋理工大学访问学者，香港城市大学博后研究员。主要从事

  数字

  媒体信息安全、AIGC内容安全、人工智能安全方向

  研究。主持国家自然科学基金（青年）、上海市浦江项目、上海市自然科学基金、航天科技创新基金、国家重点实验室开放课题，参与香港创新科技署创新及科技基金、国家重点研发计划、国自然面上等多项项目。近年来共在IEEE-TIFS、TMM、ACM
  MM等国际知名刊物发表论文60余篇，相关成果获省部级科技奖、会议最佳论文奖及美国专利授权。入选上海市白玉兰人才计划（浦江-A类项目、青年项目），担任中国图像图形学会数字媒体取证与安全专委会委员、中国中文信息学会大数据安全与隐私计算专委会

  、

  大模型与生成专委会委员、

  国家自然科学基金评议专家

  、

  SCI期刊Mathematics客座编辑、AAAI等领域知名会议技术委员会成员/领域主席、以及TIFS/TMM/TCSVT/通信学报/网络与信息安全学报等20余种刊物审稿专家学术职务。指导本科生获全国大学生信息安全竞赛、人工智能安全竞赛等奖项。主讲本科生课程《信息论》、《计算机取证技术》、研究生课程《数字取证前沿技术》。长期接收具备良好编程及英语能力、科研潜力突出、专业为网络空间安全、计算机、数学等相关专业学生加入团队从事科研工作！

  论文发表

  长期从事

  数字

  媒体信息安全、AIGC内容安全、人工智能安全方向

  的研究工作

  ，近年来共在

  IEEE-TIFS

  、

  TMM

  、

  TCSVT

  等国际知名刊物发表论文

  60

  余篇，申请/授权专利10余项，近年来部分代表成果列表如下：

  Qiang Xu

  , Hao Wang, Tanfeng Sun, Xinghao Jiang. “

  Frame-wise Detection of Fake Bitrate VVC Videos Based on Hierarchical Feature Mapping
  in Coding Domain

  ,”IEEE Transactions on Circuits and Systems for Video Technology (TCSVT), 2026.（Q1, IF:11.1）

  Qiang Xu

  , Xinghao Jiang, Tanfeng Sun, Alex C. Kot. “

  Motion-Adaptive Detection of HEVC Double Compression With the Same Coding Parameters

  ,” IEEE Transactions on Information Forensics and Security (TIFS), 2022, 17:2015-2029.（Q1,
  IF:8.7）

  Qiang Xu

  , Wenpeng Mu, Jianing Li, Tanfeng Sun, Xinghao Jiang. “

  Advancements in AI-Generated Content Forensics: A Systematic Literature Review

  ,” ACM Computing Surveys, 2025, 58(3): 1-36.

  （Q1, IF:30.4）

  Qiang Xu

  , Xinghao Jiang, Tanfeng Sun, Hao Wang, Laijin Meng, Hong Yan. “

  Detecting Artificial Intelligence-Generated images via deep trace representations
  and interactive feature fusion

  ,” Information Fusion, 2024: 102578.（Q1, IF:17.4）

  Wenpeng Mu, Zheng Li,

  Qiang Xu*

  , Tanfeng Sun, Xinghao Jiang. “

  ExDA: Towards Universal Detection and Plug-and-Play Attribution of AI-Generated
  Ex-Regulatory Images

  ,” ACM Multimedia 2025: 11512-11521.（CCF-A，Corresponding author）

  许强

  ,张潇,孙锬锋,蒋兴浩,许可 ; 一种基于无监督域自适应的跨域AIGC 图像伪造检测方法、设备和存储介质, 2026-03-30, 中国发明专利, CN202610399892.X

  许强

  ,李悦凡,孙锬锋,蒋兴浩；一种轻量的基于多特征融合与渐进式分块优化的AI 生成图像检测方法，2026-03-17, 中国发明专利, CN122116017A

  许强

  ,林瑞洲,许可,孙锬锋,蒋兴浩；一种基于多特征分支融合的AI 视频检测方法、设备和存储介质，2025-11-13, 中国发明专利, CN121280972A

