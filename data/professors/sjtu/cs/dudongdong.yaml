bio_raw: '个人简介

  杜冬冬（Dong Du），上海交通大学副研究员。中国计算机学会CCF会员，ACM会员。研究方向为操作系统与体系结构、模型原生系统、智能体系统、服务器无感知（Serverless）计算、系统安全。在操作系统领域顶会

  OSDI、SOSP以及体系结构四大顶会

  ASPLOS、ISCA、MICRO、HPCA发表/录用多篇学术论文。获SOSP 2025 最佳论文奖、FAST 2026 最奖论文奖和 Distinguished
  Artifact Award。

  教育背景

  2017.09 - 2022.06

  上海交通大学 计算机科学与技术 博士

  2013.09 - 2017.06

  上海交通大学 软件工程 学士

  工作履历

  2022.08 - 2025.12

  上海交通大学

  助理研究员

  2026.1-至今 上海交通大学 副研究员

  教授课程

  《云操作系统设计与实践》（本科生）、《软件基础实践》（本科生）、《计算机系统设计和实现：OpenHarmony》（研究生）

