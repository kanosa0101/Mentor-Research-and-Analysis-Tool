  -

  国家重点研发计划“政府间国际科技创新合作”重点专项，

  中黎机器人智能联合实验室，

  2024.12-2027.11，总经费：200万，本人经费：43万，子课题负责人

  -

  上海市启明星项目扬帆专项，

  面向高清显示的图像视频画质增强技术研究，

