bio_raw: '个人简介

  易冉，上海交通大学计算机学院副教授、博士生导师。入选中国科协“青年人才托举工程”、上海市扬帆计划。从事计算机图形学、生成式人工智能方向的研究，发表TPAMI、IJCV、CVPR、SIGGRAPH等高水平论文100余篇，其中CCF-A类论文80余篇。主持国家自然科学基金青年/面上项目、中国科协青托项目、上海市扬帆专项、国家重点研发计划子课题及腾讯、华为、MiniMax等企业合作项目。获CCF自然科学二等奖（第一完成人），

  北京市科技进步二等奖，中国图像图形学会高等教育教学成果一等奖，

  中国图像图形学会石青云女科学家奖（青英组），瑞士Chorafas青年研究奖，

  吴文俊人工智能优秀博士学位论文，

  CCF-腾讯犀牛鸟基金卓越项目等奖项

  。担任ICLR领域主席、VRIH青年编委、中国图像图形学会智能图形专委会副秘书长、VALSE执行领域主席委员等学术职务

  。

  【实验室】：数字媒体与计算机视觉（DMCV）实验室，主任：马利庄教授，实验室主页：

  https://dmcv.sjtu.edu.cn/people/

  【招生信息】

  ：

  目前

  DMCV实验室

  2027年入学的硕士生正在招生，欢迎联系 ranyi@sjtu.edu.cn

