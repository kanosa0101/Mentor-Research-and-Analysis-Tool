  论文发表

  从事计算机图形学、生成式人工智能方向的研究。

  发表TPAMI、IJCV、CVPR、SIGGRAPH等高水平论文100余篇，其中CCF-A类论文80余篇。

  具体研究兴趣：

  · 视频生成 / 3D生成

  ·

  世界模型

  ·

  具身智能

