bio_raw: '个人简介

  李晨达，上海交通大学

  听觉认知与计算声学实验室

  助理研究员。

  目前的研究兴趣包括语音增强与分离、通用声音分离、多模态信息处理、语音语言大模型等方向。

  个人主页：

  https://chenda.li/

  教育背景

  2024年9月，于上海交通大学计算机系获得博士学位。

  2020年6月

  ，于上海交通大学计算机系获得硕士学位。

  2018年6月，于华中科技大学获得学士学位。

  工作履历

  2024年10月-今 上海交通大学 计算机学院 助理研究员

  2023年11月-2024年4月 卡内基梅隆大学 WAVLab 访问学者

  教授课程

  - CS1501

  程序设计思想与方法（C/C++）

  论文发表

  详见

  谷歌学术主页

  。

  资助项目

  上海交大 Explore X基金

  获奖信息

  2025年 获得华为火花奖

  2025年 入选“微软亚洲研究院铸星计划”

  2025年 计算机学院“优异论文指导教师”

  2025年 腾讯犀牛鸟专项研究计划获得者

  学术服务

  开源项目：

  ESPnet-SE

  赛事组织：

  主办

  URGENT

  系列通用语音增强比赛

  学术审稿：T-ASLP, Speech Communication, ICASSP, Interspeech, AAAI等语音方向主流期刊、会议'
