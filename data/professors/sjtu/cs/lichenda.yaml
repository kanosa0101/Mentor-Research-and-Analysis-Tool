bio_raw: '个人简介

  李晨达（Chenda Li）

  现任上海交通大学计算机科学与工程系助理研究员，硕士生导师，

  听觉认知与计算声学实验室

  （AudioCC Lab）成员。主要研究方向包括语音增强与分离、多模态语音与音频处理、语音语言模型及生成式音频建模，在 IEEE T-ASLP、ICASSP、Interspeech
  等国际期刊与会议发表论文50余篇。担任开源语音增强与分离工具 ESPnet-SE 核心开发者与维护者、URGENT 系列通用语音增强挑战赛核心组织者。入选微软亚洲研究院“铸星计划”，2025年获华为火花奖。

  个人主页：

  https://chenda.li/

  ；

  Google Scholar

  ；

  GitHub

  。

  教育背景

  2020年9月—2024年9月｜上海交通大学

  计算机科学与技术博士；导师：

  钱彦旻

  教授。

  2023年11月—2024年4月｜卡内基梅隆大学

  访问学者，

  WAVLab

  ，语言技术研究所（Language Technologies Institute）；合作导师：Shinji Watanabe 教授。

  2018年9月—2020年6月｜上海交通大学

  计算机科学与技术硕士；导师：钱彦旻教授。

  2014年9月—2018年6月｜华中科技大学

  电子信息工程学士。

  工作履历

  2024年10月—至今｜上海交通大学计算机科学与工程系

  助理研究员，听觉认知与计算声学实验室（AudioCC Lab）。

  2024年1月—至今｜

  URGENT 系列语音增强比赛

  组织

  核心组织者。

  2020年6月—至今｜

  ESPnet-SE

  核心开发者与维护者，参与 ESPnet 语音增强与分离工具链的研发和维护。

  教授课程

  上海交通大学 CS1501《程序设计思想与方法（C/C++）》

