bio_raw: '个人简介

  刘鹏飞，上海交通大学副教授、创智学院导师（标杆项目负责人），入选国家级青年人才计划、上海市领军人才 (海外青年)，交大生成式人工智能研究组（GAIR）负责人,
  获得首届蚂蚁InTech科技奖。曾和卡耐基梅隆大学（全美CS第一）教授联合教授成立AI公司，担任CEO。主要研究方向是：大模型训练、推理和多模态世界模型等。担任交大“国智班”班主任、交大“ACM班”学术导师，曾担任卡内基梅隆大学自然语言处理课程联合讲师。发表学术论文
  100 余篇, 谷歌学术引用2.1万余次 (24篇论文引用超过100次）。曾连续两年获得自然语言处理顶级会议ACL最佳系统展示论文奖和杰出系统展示论文奖。最早提出“提示工程”概念工作之一，单篇引用超过6000余次，受到了来自于OpenAI,
  Google, Meta等机构的引用；提出的“少即是多”(Lima)的大模型对齐思想已经成为包括Google Gemini，Meta LLaMa等业界大模型训练使用标准；开源了世界上首个原生统一架构的多模态生成大模型。发布了世界首个o1复现全栈技术进展报告，受到了来自于DeepMind,
  Meta, Mistral等顶尖AI公司的积极关注和互动。

  研究组包含多名来自于交大、复旦专业第一名读博；还吸引多名CMU学生来大陆读博，组里研究氛围好。多名硕博学生收获到OpenAI, Anthropic的面试邀请，top
  seed offer，Deepseek Offer；多名本科生获得商汤奖学金、斯坦福、CMU、NYU暑研offer等。

