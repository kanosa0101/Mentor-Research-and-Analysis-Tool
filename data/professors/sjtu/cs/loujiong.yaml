bio_raw: '个人简介

  娄炯，上海交通大学电子信息与电气工程学院计算机科学与工程系助理研究员，现为智能大数据系统实验室（iBDS）核心成员

  。他于 2023 年在上海交通大学计算机系获得工学博士学位，师从计算机系统与网络领域著名学者李颉教授与贾维嘉教授

  。其研究范围包括（1）

  边缘智能与生成式人工智能的融合

  ，致力于通过大模型协同与鲁棒学习技术，解决复杂智能任务的调度优化与多模态数据理解难题。（2）多模态检索增强技术应用，在合同审核、视频监控等场景下深度优化大模型性能。（3）安全鲁棒的分布式多智能体调度与审计框架，实现跨组织的智能体高效安全协作。

  娄炯目前已在相关领域发表学术论文 40 余篇，其中

  CCF-A 类

  论文 18 篇

  。代表性成果多次发表于

  NeurIPS 2025、IJCAI 2025、ICDE 2025

  等 AI 顶会及 IEEE TMC、TSC、TDSC 等权威期刊

  。作为项目负责人，他主持国家自然科学基金青年项目“面向复杂边缘智能场景的服务部署与任务调度”，并承担上海市科委“区块链全流程智能监管”研究课题

  。他积极服务于学术共同体，担任 INFOCOM、TDSC、TMC 等多个顶级会议和期刊的审稿人

  ，并曾获 2024 年 IEEE-CCF 服务计算最佳学生论文奖及 MSN 最佳论文奖。

