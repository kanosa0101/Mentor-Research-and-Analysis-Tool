bio_raw: '个人简介

  上海交通大学副研究员、博士生导师。主要研究兴趣为操作系统和语言运行时系统。成果发表在OSDI、ASPLOS、USENIX ATC、EuroSys、IEEE TC等国际高水平会议和期刊，获EuroSys
  2024最佳论文奖、APSys 2018最佳论文runner-up奖、华为火花奖等，部分成果已经被OpenJDK、CPython、ArkTS等主流语言运行时社区接收并合入主线。

  教育背景

  2015.09 - 2020.08，上海交通大学软件学院，博士生

  2011.09 - 2015.06，上海交通大学软件学院，本科生

  工作履历

  2020.11 - 至今，上海交通大学软件学院/计算机学院

  教授课程

  软件学院 编译原理与技术（SE3355）2021-2025年秋季学期

  软件学院 云操作系统设计与实践 (SE3356) 2022-2026年春季学期

  软件学院 系统设计与开发大型课程设计（系统软件）（SE4353）2022-2025年秋季学期

  软件学院 计算机系统设计和实现（研） (EI6708) 2023-2026年春季学期

