bio_raw: '个人简介

  主持和参与科研项目三十余项，获市科技进步一等奖和二等奖各一次，发表论文十余篇。代表性科研有国家十五科技攻关重大项目(219)--网络媒体安全综合监管信息系统建设；国家自然基金项目社交网络群体性热点监测和分析关键技术研究；市科委攻关项目网络隔离与信息交换系统研究；上海市政务外网安全规范制定；国务院新闻办重要新闻网站安全管理规范制定等；以及市金审工程、金质工程、区域网络安全态势感知、雪亮工程等十余项重大电子政务信息工程和智慧公安重点项目的总体规划和设计工作。

  教育背景

  1993，上海交通大学，获动力机械系制冷专业学士学位；

  1998，上海交通大学，获计算机系计算机网络专业硕士学位；

  2017，上海交通大学，获信息安全工程学院通信专业博士学位'
