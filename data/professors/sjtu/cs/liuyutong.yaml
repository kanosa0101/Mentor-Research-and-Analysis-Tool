  （1）

  Yutong Liu

  , Haiming Jin, Wangyinjie Yao, Yunxiang Chen, Yimin Zhao, Linghe Kong*, Rui Li,
  Xiao-Yang Liu. "Distributed On-Orbit Sparse Coding for Efficient Space Situational
  Awareness Image Transmission". IEEE INFOCOM, London, UK, 2025. （CCF-A）

  （2）

  Yutong Liu

  , Landu Jiang, Linghe Kong*, Qiao Xiang, Xue Liu, and Guihai Chen. “Wi-Fruit: See
  through fruits with smart devices.” Proceedings of the ACM on Interactive, Mobile,
  Wearable and Ubiquitous Technologies (IMWUT) 5, no. 4 (2021): 1-29.（CCF-A）

  （3）

  Yutong Liu

  , Linghe Kong*, Fan Wu, Guihai Chen. "GroupCoach: Compressed Sensing Based GroupActivity
  Monitoring and Correction." 2020 IEEE/ACM 28th International Symposium on Quality
  of Service (IWQoS), Hang Zhou, China. (CCF-B, Best Paper Award)

  （4）Mingxin Cai,

  Yutong Liu*

  , Linghe Kong, Guihai Chen, Liang Liu, Meikang Qiu, Shahid Mumtaz. "Resource Critical
  Flow Monitoring in Software-Defined Networks." IEEE/ACM Transactions on Networking
  (TON), 2023, 32(1): 1-15. (CCF-A, Corresponding Author)

  （5）Jingkai Wang, Jue Gong, Lin Zhang, Zheng Chen, Xing Liu, Hong Gu,

  Yutong Liu*

  , Yulun Zhang*, Xiaokang Yang. "OSDFace: One-Step Diffusion Model for Face Restoration"
  CVPR, 2025. (CCF-A, Co-corresponding Author)

  资助项目

  主持：

