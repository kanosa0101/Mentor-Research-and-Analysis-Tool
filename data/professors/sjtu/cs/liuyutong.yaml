bio_raw: '个人简介

  刘雨桐，上海交通大学计算机学院（网络空间安全学院）先进网络研究所孔令和团队助理研究员，主要研究方向为物联网感知与智能计算（IoT+AI），面向“天-地-海”三大智能计算维度，除传统地面物联网感知智能计算以外，同时研究天基物联网感知智能计算与海底感知智能计算。2022年于上海交通大学计算机科学与工程专业获工学博士学位，同年入职上海交通大学工作至今。获ACM
  China SIGCSE优博奖、上海市扬帆计划启明星人才及华为Explore X人才资助。现主持国家自然科学基金青年基金1项，长三角区域联合攻关课题1项，国家重点研发计划子课题2项。参与国家自然科学基金2项，云南省重大专项1项，上海交通大学深蓝计划重点项目1项等项目。在高水平学术会议及期刊上已发表论文31篇（包括IEEE
  INFOCOM, TMC, TON, ACM IMWUT等），获得国际会议最佳论文奖2项（IWQoS/PRICAI），已申请国家发明专利4项，获授权1项，同时以第一作者出版中文教材《工程信息管理》。担任IET
  AIE期刊Managing Editor、MDPI Sensors期刊Special Issue Guest Editor、ACM Sensys/IEEE ICDM/IEEE
  HPCC PC及ACM/IEEE-CS/AAAI CS2023 System Fundamental分委会委员。

  教育背景

  (1) 2017-09 至 2022-06, 上海交通大学, 计算机科学与技术, 博士

  (2) 2013-09 至 2017-06, 中国海洋大学, 计算机科学与技术, 学士

  工作履历

  2022-07 至今, 上海交通大学, 助理研究员

  教授课程

  (1) 2023-03 至今, 春季学期, 计算机系统结构实验

  (2) 2022-07 至今, 春秋学期, 人工智能技术及应用

  论文发表

