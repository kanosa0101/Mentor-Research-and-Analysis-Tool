  30万元, 在研

  （2）长三角区域联合攻关，YDZX20253100004004，基于数字孪生的区域风险分析，2024-10-01 至 2026-09-30，90万元，在研

  （3）重点研发计划，2024YFC3017100，公路与桥梁严重损毁后车辆避险预警及自动处置技术研发与应用示范，2024-12 至 2027-11，60万元，在研

