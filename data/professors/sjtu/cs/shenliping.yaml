bio_raw: '个人简介

  申丽萍 博士，上海交通大学计算机学院副教授，研究方向为智慧教育（AIED）。自2001年起为全国信息技术标准化技术委员会教育技术分技术委员会委员，ISO国际标准专家，获委员会“20周年卓越贡献奖”。曾任SCI期刊Journal
  of Ambient Intelligence and Smart Environments研究领域主要集中在自适应学习技术、情感计算与学习数据分析。主持和负责的课题包括自然科学基金“基于多模态情感识别技术的情感学习模型研究”和“面向多视点课堂视频的教学对象体感-情感协同建模技术”，863项目“基于情境感知的多通道融合交互模型与关键技术”，教育部“教育部教育信息化标准体系构建及“十三五”标准规划研究（子项目）”，上海科技支撑项目“基于Moocs的教育学习服务平台方案设计和运营支撑”，以及横向项目包括“基于大数据分析的资金面预警预测”等。近年来在国内外期刊和会议上发表论文五十余篇，曾获2016年上海CCF普适计算与嵌入式分委员会最佳英文论文奖，该论文被引达400多次，指导学生论文获NLPCC2024最佳学生论文奖。负责起草已发布国家标准4个，参与起草已发布国际标准2个，教育人工智能大模型系列标准的联合召集人，上海市人工智能技术协会教育大模型系列标准T/SAIA
  0013-2023的第一起草人。

  教育背景

  2002~2008，上海交通大学，计算机系，博士

  1997~2000，上海交通大学，电子工程系，硕士

  1989~1992，西安交通大学，教育改革试点班，本科肄业

  工作履历

  2000~至今，上海交通大学，计算机科学与技术系，副教授（2000~2008年为讲师）

  2010~2011， 剑桥大学，计算机实验室，访问学者

  教授课程

  CS3311/CS3338 计算机网络  (本科，英文授课，2002 - )

  CS2501 离散数学 (本科，2015 - )

