  工作履历

  2001.04-2003.10 上海交通大学计算机系，博士后

  2003.10-2013.10 上海交通大学信息安全工程学院，讲师

  2013.10-2025.6  上海交通大学电子信息与电气工程学院，

  网络空间安全学院

  ，

  讲师

  2025.6至今  上海交通大学计算机学院，

  网络空间安全学院

  ，

  讲师

  教授课程

  1、嵌入式系统原理与应用

  2、大型应用软件设计

  3、大型系统软件设计

  4、应用软件安全

  5、云计算安全

  6、终端安全

  论文发表

  1、基于词性和中心点改进的文本聚类方法

  2、便于快速信息融合的主题检测算法

  3、余弦度量和适应度函数改进的聚类方法

  获奖信息

  2000年，江苏省科技进步二等奖'
