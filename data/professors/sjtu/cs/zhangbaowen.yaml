bio_raw: '个人简介

  张保稳，男，上海交通大学计算机学院（网络空间安全方向）副研究员，曾任上海市等保专委会专家组组长。主要研究方向包括新型网络与信息系统安全度量与与评估、信息安全本体、面向安全关键场景的人工智能安全（神经网络鲁棒性度量）等。主持或参与含国家重点研发计划，国家自然科学基金、上海市科委重点科技攻关课题、上海世博会信息系统安全评估、以及华为技术有限公司云安全评估体系研究等在内的纵向、横向项目30余项。在国内外重要学术期刊、会议上已发表和录用学术论文50余篇(其中EI/SCI/ISTP
  收录20余篇)。近年来参与科技部国家重点研发计划两项，负责6G网络系统内生安全机制度量研究和拟态安全度量模型与系统测试评估研究。 在国内外重要学术期刊、会议上已发表和录用学术论文50余篇(其中EI/SCI/ISTP
  收录20余篇)。近年来在网络安全本体和神经网络鲁棒性安全等相关领域发表多篇学术论文，其中在国际期刊Engineering Applications of Artificial
  Intelligence 发表的论文：“A Word Net-based semantic similarity measurement combining edge-counting
  and information content theory”（通讯作者）2018年初被列入ESI高被引论文。申请并获得国家技术发明专利3项，撰写《EJB 设计模式》译著1部（第三作者），参编或审校教材《信息系统安全检测与风险评估》、《等级保护测评理论及应用》和《网络安全协议的形式化分析与验证》共3部。

  教育背景

  计算机软件与理论方向博士，博士后。

  教授课程

  曾任本科生专业课《网络安全协议与分析》和研究生课程《软件工程与JAVA EE技术》，并多年获得学生好评。

  现为《网络及协议安全基础》授课教师，并在2023、2024连续两年课程评价结果A0。

