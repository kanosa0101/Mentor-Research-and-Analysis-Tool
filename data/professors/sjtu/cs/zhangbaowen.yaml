  资助项目

  近年来，主持或参与的代表性科研项目如下：

  1,

  科技部，国家重点研发计划，2020YFB1807500，6G无线网络安全架构关键技术，2020-12至2023-12，课题核心骨干，负责6G网络系统内生安全机制度量研究。

  2,

  科技部，国家重点研发计划，2016YFB0800105， 2016-07至2019-06，上海交通大学课题负责人，负责安全度量模型与系统测试评估研究。

  3, 国家自然科学基金委员会, 联合基金项目, U20B2048, 关键基础设施网络高隐蔽未知攻击的智能检测与防御, 2021-01-01 至 2024-12-31，课题骨干。

  4, 自然科学基金委，地区科学基金项目，61562004，面向网络安全态势感知的安全本体模型构建研究，2015-01至2019-12，课题骨干

  5, 自然科学基金委，自然科学基金项目，61562004，计算机网络系统安全评估优化的研究，2007-01至2009-12，课题骨干

  6, 上海市科委，重点科技攻关课题，11511504302，网络主体信用评价关键技术研究及应用，2011-2013，课题负责人

  7, 上海市科委，重点科技攻关课题，灾难防御评估关键技术研究，2004－2005，课题技术研发负责人

  其他主持的横向课题，包括华为技术有限公司华为云安全评估体系研究、上海世博会业务系统等级保护评估项目、以及众多信息安全等级测评项目等。'
