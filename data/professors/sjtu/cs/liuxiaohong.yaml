  资助项目

  国家自然科学基金委面上项目，多模态可控图像生成与质量评价，2026-2029

  国家自然科学基金委青年项目，面向用户生成内容的视频质量增强与评价，2024-2026

  国家自然科学基金委重点项目，面向人工智能芯片的跨平台多模型融合编译技术研究，2023-2027

  国家自然科学基金委重点项目，语义通信的信息理论与技术，2023-2027

  上海市科学技术委员会，基于深度特征上下文建模的视频时空超分辨率算法研究，2022-2024

  华为公司，可控AIGC生成技术等，2024-2026

  腾讯公司，多模态统一自回归图像建模方法研究等，2024-2026

  美团公司，多模态生成能力评测，2024-2026

  OPPO公司，基于生成式模型的人像虚化渲染端到端方法等，2025-2026

  瑞萨公司，图像一体化增强AI算法，2023-2024

