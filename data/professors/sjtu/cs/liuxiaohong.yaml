  担任NeurIPS/AAAI/IJCAI等多个人工智能、计算机视觉顶会领域主席

  担任IEEE信号处理学会图像、视频与多维信号处理技术委员会委员（IEEE IVMSP TC，世界范围内共37人）

  担任中国图象图形学学会青年工作委员会副秘书长

