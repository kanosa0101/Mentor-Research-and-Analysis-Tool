bio_raw: '个人简介

  刘笑宏，上海交通大学计算机学院副教授、博士生导师、上海创智学院全时导师。现已在顶级国际会议与期刊上发表学术论文

  100

  余篇

  ，其中

  CCF-A

  类或中科院一区论文

  80

  余篇，引用

  8700

  余次

  ，

  h

  指数

  46

  。获中国人工智能学会吴文俊人工智能青年科技奖、华为“难题揭榜”火花奖、美团科研合作卓越创新奖，入选全球前

  2%

  顶尖科学家榜单入选

  、上海市领军人才（海外）、上海市浦江人才。主持国家自然科学基金面上、青年项目，参与重点项目，承担包括华为、腾讯、美团、

  OPPO

  等多家公司的产学研项目。担任多媒体领域知名期刊

  ACM TOMM

  副编辑，多个顶级会议的领域主席，中国图象图形学学会青工委副秘书长、上海市计算机学会计算机视觉专委会副秘书长。

  研究方向为

  计算机视觉

  与多模态大模型

  ，具体包括：

  图像/视频生成与编辑

  （包括世界模型、具身智能）

  图像/视频复原与增强

  图像/视频质量评价

  人工智能赋能医疗健康（AI for Healthcare）

  工作履历

  2025

  年

  9

  月—至今

  上海创智学院任全时导师

  2025

  年

  1

  月—至今                            上海交通大学任副教授、博士生导师

  2022

  年

