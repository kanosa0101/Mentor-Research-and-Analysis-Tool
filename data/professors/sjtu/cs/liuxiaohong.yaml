  入选IEEE多媒体信号处理新星奖终选名单（当年全球3人）

  入选全球前2%顶尖科学家榜单

  获得世界人工智能大会云帆奖“璀璨明星”提名奖

  入选微软亚洲研究院铸星计划（当年全球共17人）

  入选上海市领军人才（海外）

