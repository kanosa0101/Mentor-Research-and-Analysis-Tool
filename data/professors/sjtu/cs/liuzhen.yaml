  \ 博士\n2010-09 至 2013-06    香港城市大学    计算机科学                博士\n工作履历\n2024 至 今             上海交通大学    计算机学院                        长聘副教授\n\
  2016 至 2024        上海交通大学    计算机科学与工程系          特别研究员、副教授、长聘教轨副教授\n2015 至 2016        香港应用科技研究院                                    高级工程师\n\
