bio_raw: '个人简介

  丁家昕，现为上海交通大学John Hopcroft中心长聘副教授，博士生导师。2018年博士毕业于纽约州立大学石溪分校，2012年本科毕业于北京大学；2019年在加州大学戴维斯分校进行博士后研究，2019年12月加入上海交通大学。主要研究领域包括数据关联与知识推理、领域世界模型与约束强化学习。每年招收计算机和通信工程方向博士与硕士，欢迎对相关方向有兴趣的同学联系。

  教育背景

  2012.8～2018.12 纽约州立大学石溪分校  计算机科学与技术  博士研究生

  2008.9～2012.7 北京大学   智能科学与技术   大学本科

  工作履历

  2026至今

  上海交通大学 计算机学院 长聘副教授

  2023

  ～2025

  上海交通大学 计算机学院 长聘教轨副教授

  2020～2022 上海交通大学 计算机学院 助理教授

  2019.1～2019.12 加州大学戴维斯分校 博士后

