bio_raw: '个人简介

  上海交通大学特聘教授，

  博士生导师，

  计算机学院长聘教授。博士毕业于上海交通大学并留校任教，香港中文大学（1994/1997年 ），美国哈佛大学访问学者（1999-2000年， Visiting Research
  Fellow）。2016年评为二级教授。研究方向为分布式系统软件。长期从事“程序设计思想与方法”、“分布式系统”、“算法设计”等课程教学。专业服务包括：上海市教育委员会高等学校计算机等级考试委员会委员，中国计算机学会高级会员，开放式系统、软件工程、服务计算专业委员会会员，IEEE高级会员。创建并负责上海市高校精品课程“程序设计思想与方法”建设，曾获得上海市技术发明一等奖（排名1），全国教学成果一等奖1项，上海市教学成果特等奖2项，主持国家自然科学基金项目和科技部重大研发课题多项，曾担任国家863项目“面向大数据的内存计算系统与技术”首席专家，在国内外重要期刊和杂志上发表论文100余篇，翻译国外著名教材10册，申请国家发明专利30余项，主持起草地方标准1项。

  教育背景

  1980年高中毕业于莆田一中

  1984年本科毕业于浙江大学计算机系，获得学士学位

  1989年在上海交通大学学习并获得硕士学位

  1992年在上海交通大学学习并获得博士学位

  工作履历

  1992-今  在上海交通大学工作，被聘为讲师、副教授（1993.12-1998.11）、教授（1998.12-）、长聘教授、特聘教授

  1984-1986  福建师范大学 助教

  其中

  1999-2000年 美国哈佛大学 访问研究

  1994、1997年 香港中文大学计算学系 访问研究

  教授课程

  担任的课程有“程序设计思想与方法”、“分布式系统”、“算法设计”、“离散数学”等，

  目前担任创建的上海市高校精品课程、学校通识核心课程“程序设计思想与方法”的教学。

  论文发表

  英文论文请参见DBLP：

  https://dblp.uni-trier.de/pers/hd/h/Huang:Linpeng

  资助项目

  在研项目

  - 面向海量样本的分布式文件系统 （所属项目： 面向大模型训练的异构存算系统），科技部重点研发课题负责人

  - 基于可编程SSD的近数据处理系统（企业合作项目）课题负责人

  - 基于存算一体的嵌入式图DB加速项目 （企业合作项目）课题负责人

  近期项目

  -分布式持久内存文件系统  科技部重点研发 课题负责人

  -面向大数据的内存计算关键技术与系统  863计划  项目首席专家

  -面向混合内存的系统软件机理和关键技术研究  自然科学基金 课题负责人

  -基于服务组合的"系统的系统"软件机理与方法  自然基金重点 交大课题负责人

  -面向众核的大数据并行处理框架的研究 863计划子课题  子课题负责人

  获奖信息

  上海市技术发明一等奖（排名1）

  全国教学成果一等奖1项

  上海市教学成果特等奖2项

  上海市教学成果二等奖1项

  学术服务

  上海市教育委员会高等学校计算机等级考试委员会委员

  中国计算机学会高级会员，开放式系统、软件工程、服务计算专业委员会会员

  IEEE高级会员'
