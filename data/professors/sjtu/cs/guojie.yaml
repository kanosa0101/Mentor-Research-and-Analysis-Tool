bio_raw: '个人简介

  2003

  年毕业于上海交通大学，获得图像处理与模式识别专业博士学位，现任计算机学院副研究员。曾于

  2002

  年、

  2004

  年在香港理工大学计算机系访问研究；

  2005

  年～

  2006

  年在新加坡管理大学信息系统学院访问研究。主要研究领域：视频行为分析、多媒体安全、图象处理与模式识别、人工智能等。先后主持或参与了多项国家自然科学基金项目、科技部重大研发项目、国家

  863

  项目、上海市科委项目及香港政府基金项目等，在国内外期刊和国际学术会议上已发表

  SCI/EI

  检索论文六十多篇，拥有多项国家发明专利。'
