bio_raw: '个人简介

  朱浩瑾，男，上海交通大学计算机学院特聘教授、博导，国家级高层次人才，IEEE Fellow，目前担任上海交通大学浦江国际学院党委书记，上海交通大学人工智能与认知安全研究所所长。主要研究方向为物联网系统安全。主持国家自然基金6项（包括重点项目1项），科技部重点研发计划课题2项。发表SCI期刊论文70余篇，EI论文90余篇，包括安全领域顶级会议IEEE
  S&P，USENIX Security，ACM CCS，NDSS等，谷歌学术引用12000余次，SCI他引1600余次。研究成果获得2024年中国广告长城奖学术类唯一金奖，2024年USENIX
  Security杰出论文奖，2023 IEEE INFOCOM最佳报告奖，2023年SIGSOFT ESEC/FSE杰出论文奖，2021年ACM CCS最佳论文提名奖与2018年教育部自然科学一等奖，中国百篇最具影响国际学术论文等学术奖励与荣誉。在物联网恶意终端识别、物联网人机接口安全、可信智能等方面取得了一系列有价值的理论和技术研究成果，深受国内外专家同行以及媒体的认可，并被纳入多所世界知名大学课程教学内容。相关成果在国家信息安全、电网安全、流量安全等领域得到应用，取得了良好社会效益，为国家基础设施安全建设做出巨大贡献。

  教育背景

  2005-2009，[加拿大]滑铁卢大学，博士，导师：Prof. Xuemin Sherman Shen

  2002-2005，上海交通大学，硕士，导师：曹珍富教授

  1998-2002，武汉大学，学士

  工作履历

  2017-至今 上海交通大学教授、长聘教授、特聘教授

  2012-2016 上海交通大学 副教授

  2009-2011 上海交通大学 讲师

  教授课程

  长期担任本科生春季学期《网络安全技术》与研究生春季学期《网络安全基础》课程主讲教师。

