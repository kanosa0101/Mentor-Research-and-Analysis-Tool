bio_raw: '个人简介

  邢朝平目前是上海交通大学讲席教授。

  1990年在中国科学技术大学获得博士学位后留校工作，1993年获德国洪堡奖学金在Essen大学工作，其后在奥地利科学院从事研究工作。1998年加入新加坡国立大学，历任助教、tenured副教授、教授。2007年始任职于新加坡南洋理工大学教授。2019年加盟上海交通大学。长期从事密码、编码、安全多方计算、代数数论等方面的研究。入选国家海外高层次人才计划、上海市海外高层次人才计划、中科院百人计划等。
  获得新加坡国家科学奖、荷兰Leiden大学Kloosterman讲席教授、德国洪堡学者等。曾任国际编码界最高奖Hamming奖评审专家委员会成员、斯坦福大学访问教授。出版专著四本，由剑桥出版社出版的《Coding
  Theory -- A First Course》一书先后被欧美、亚洲等世界多所大学作为教材使用。已在《Journal of the ACM》上发表文章一篇，在美密会、欧密会、亚密会、TCC、PKC上发表密码文章20多篇，在计算机理论会议FOCS、STOC、SODA、ICALP、CCC、RANDOM等发表论文20多篇。在信息论期刊《IEEE
  Transactions on Information Theory》发表编码论文80多

  篇，同时在数学期刊《

  Advances in Mathematics》、《Trans. Of the Amer. Math. Soc.》等数学期刊上发表论文20多篇。主持过中国国家自然科学基金重点项目，中国科技部重点研发项目，新加坡国家自然科学基金重点项目，新加坡国防部基金，新加坡教育部基金等项目。目前任包括CCF-A期刊《IEEE
  Transactions on Information Theory》、《Information and Computation》及CRCA-B期刊《Finite
  Fields and Their Applications》在内的多个SCI期刊编委。

  论文发表

  1. Z. Guo, Chaoping Xing, C. Yuan and Z. Zhang:

  Random Gabidulin codes achieve list decoding capacity in rank metric

  , FOCS 2024

  2. F. Lin, Chaoping Xing and Z. Yao:

  More Efficient Zero-Knowledge Protocols over $\mathbb{Z}_{2^k}$ via Galois Rings

  , CRYPTO 2024

  3. S. Li, Chaoping Xing:

  Fast Fourier transform via automorphism groups of rational function fields.

  SODA 2024:

  4. S. Liu, T. Wu and Chaoping Xing:

  Nonlinear codes exceeding the Gilbert-Varshamov and Tsfasman-Vladut-Zink bounds.

  SODA 2023.

  5. Venkatesan Guruswami, Chaoping Xing:

  6.

  Optimal Rate List Decoding over Bounded Alphabets Using Algebraic-geometric Codes.

  J. ACM 69(2): 10:1-10:48 (2022)

  7. D. Escudero, Chaoping Xing, C. Yuan:

  More Efficient Dishonest Majority Secure Computation over $\mathbb {Z}_{2^k}$ via
  Galois Rings.

  CRYPTO (1) 2022:

  8. R. Cramer and Chaoping Xing,

  Blackbox Secret Sharing Revisited: A Coding-Theoretic Approach with Application
  to Expansionless Near-Threshold Schemes

  , Eurocrypt 2020.

  9.  R Cramer, I. Damgard, D. Escudero, P. Scholl and Chaoping Xing,: SPDZ2k:

  Efficient MPC mod 2^k for Dishonest Majority:

  CRYPTO 2018.

  10.  I. Cascudo, R. Cramer, Chaoping Xing and C. Yuan:

  Amortized Complexity of (Information-Theoretically) Secure MPC Revisited

  , CRYPTO 2018.

  11. R. Cramer, I. Damgard, Chaoping Xing, C. Yuan:

  Amortized complexity of zero-knowledge proofs revisited: achieving linear soundness
  slack

  , Eurocrypt 2017.'
