  in IEEE/ACM Transactions on Networking. (Corresponding Author)

  Peirui Cao, Shizhen Zhao, Dai Zhang, Zhuotao Liu, Mingwei Xu, Min Yee Teh, Yunzhuo
  Liu, Xinbing Wang, Chenghu Zhou,

  "Threshold-based Routing-Topology Co-design for Optical Data Center,"

