bio_raw: '个人简介

  赵世振，长聘副教授，国家级青年人才，博士生导师，

  主要从事光电混合数据中心网络架构的研究，其提出的“低频切换”的光电混合数据中心网络控制方案得到业界的关注与应用。他的研究成果发表在SIGCOMM，NSDI，SIGMETRICS，ICNP，INFOCOM，IEEE/ACM
  TON等国际知名会议与期刊。

  教育背景

  2010年本科毕业于上海交通大学

  2015年博士毕业于美国普渡大学

  工作履历

  2015/8-2019/1 美国谷歌网络组

  2019/2-2024/12 上海交通大学 长聘教轨副教授

  2015/1-至今 上海交通大学 长聘副教授

  教授课程

  计算机网络

  数据结构

  论文发表

  Weihao Jiang, Wenli Xiao, Yuqing Yang, Peirui Cao, Shizhen Zhao,

  "Orderlock: A New Type of Deadlock and its Implications on High Performance Network
  Protocol Design,"

  in SIGCOMM, Coimbra, Portugal, September, 2025. (Corresponding Author)

  Xiwei Wu, Yueyang Feng, Tianyi Huang, Xiaoyang Lu, Shengkai Lin, Lihan Xie, Shizhen
  Zhao, Qinxiang Cao,

  "VEP: A Two-stage Verification Toolchain for Full eBPF Programmability,"

  in NSDI, Philadelphia, PA, USA, April, 2025. (Co-corresponding Author)

  Shengkai Lin, Shizhen Zhao, Peirui Cao, Xinchi Han, Quan Tian, Wenfeng Liu, Qi Wu,
  Donghai Han, Xinbing Wang,

  "ONCache: A Cache-Based Low-Overhead Container Overlay Network,"

  in NSDI, Philadelphia, PA, USA, April, 2025. (Corresponding Author)

  Ximeng Liu, Shizhen Zhao, Yong Cui, Xinbing Wang,

  "FIGRET: Fine-Grained Robustness-Enhanced Traffic Engineering,"

  in SIGCOMM, Sydney, Australia, August, 2024. (Corresponding Author)

  Cong Liang, Xiangli Song, Jing Cheng, Mowei Wang, Yashe Liu, Zhenhua Liu, Shizhen
  Zhao, Yong Cui,

  "NegotiaToR: Towards A Simple Yet Effective On-demand Reconfigurable Datacenter
  Network,"

  in SIGCOMM, Sydney, Australia, August, 2024.

  Shizhen Zhao, Qizhou Zhang, Peirui Cao, Xiao Zhang, Xinbing Wang, Chenghu Zhou,

  "Flattened Clos: Designing High-performance Deadlock-free Expander Data Center Networks
  Using Graph Contraction,"

  in NSDI, Boston, MA, USA, April, 2023.

  Yunzhuo Liu, Bo Jiang, Shizhen Zhao, Tao Lin, Xinbing Wang, Chenghu Zhou,

  "LIBRA: Contention-Aware GPU Thread Allocation for Data Parallel Training in High
  Speed Networks,"

  in INFOCOM, New York, USA, May, 2023.

  Shizhen Zhao, Peirui Cao, Xinbing Wang,

  "Understanding the Performance Guarantee of Physical Topology Design for Optical
  Circuit Switched Data Centers,"

  in SIGMETRICS, Mumbai, India, June, 2022.

  Peirui Cao, Shizhen Zhao, Min Yee Teh, Yunzhuo Liu, Xinbing Wang,

  "TROD: Evolving From Electrical Data Center to Optical Data Center,"

  in ICNP, Virtual Event, November, 2021. (Corresponding Author)

  Shizhen Zhao, Rui Wang, Junlan Zhou, Joon Ong, Jeffery C. Mogul, Amin Vahdat,

  "Minimal Rewiring: Efficient Live Expansion for Clos Data Center Networks,"

  in NSDI, Boston, Massachusetts, USA, February, 2019. (

  Technical Report

  )

  Wenli Xiao, Shizhen Zhao, Xinbing Wang, Chenghu Zhou,

  "Segment EDF: A Scheduling Policy with Tight Deterministic Latency under Multi-hop
