bio_raw: '个人简介

  研究方向为公钥密码学，主要研究和设计具有如下特性的公钥密码算法与协议：

  - 公钥加密、数字签名、功能加密、密钥协商；

  - 可抵抗新型密码分析和攻击技术，包括密钥泄漏攻击、用户渗透攻击、相关密钥攻击、选择打开攻击等；

  - 可证明安全，且安全性可紧致地规约到离散对数、格相关等问题的困难性假设上。

  教育背景

  2012年-2017年：上海交通⼤学，计算机系，博⼠

  2008年-2012年：上海交通⼤学，致远学院，学⼠

  教授课程

  《现代密码学》，本科

  《密码算法》，研究⽣

  论文发表

  在密码学领域的重要会议和期刊上发表多篇学术论⽂，包括：

  - 国际密码学三⼤旗舰会议（CRYPTO、EUROCRYPT、ASIACRYPT）、国际公钥密码学会议（PKC）等会议论⽂；

  - 国际密码学知名期刊《Journal of Cryptology》、《Designs, Codes and Cryptography》等期刊论⽂。'
