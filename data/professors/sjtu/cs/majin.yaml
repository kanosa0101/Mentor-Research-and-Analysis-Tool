bio_raw: '个人简介

  博士，高级工程师，硕士生导师，国际注册信息系统审计师（

  CISA

  ），美国加州大学圣地亚哥分校（

  UCSD

  ）访问学者。

  网络信息安全管理与服务教育部工程研究中心副主任

  ，中国网络空间安全协会人才培养教育工作委员会副秘书长，

  上海市信息安全综合管理技术研究重点实验室副主任

  。

  长期从事大数据与人工智能应用、智能网联汽车信息安全、网络空间安全综合管理新技术等领域的前沿基础研究工作。近年来，作为项目负责人和核心骨干主持及参与国家

  863

  计划信息安全重大项目、国家重点研发计划“网络空间安全”重点专项、国家自然科学基金、中央网信办、国家人力资源和社会保障部、中国信息安全测评中心、上海市人力资源和社会保障局、上海市经信委、华为技术有限公司等

  70

  多项国家

  /

  省部级课题；发表高质量学术论文

  30

  余篇；获得

  9

  项国家技术发明专利授权；编著《网络安全在身边》、《数据警察导论》、《数据分析基础》等专著；曾获

  上海市科技进步一等奖

  1

  项、二等奖

  1

  项，

  上海市优秀教学成果二等奖

  1

  项，

  上海交通大学教书育人奖

  三等奖

  1

  项，

  上海交通大学晨星青年学者奖励计划

  SMC

  优秀青年教师

  ，

  上海交通大学教学成果特等奖

  1

  项、二等奖

  1

  项，上海交通大学电院优秀共产党员。

  教授课程

  1、本科生课程：《人工智能导论》

  2、本科生课程：《数据库原理及安全》'
