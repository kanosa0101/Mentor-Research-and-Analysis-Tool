bio_raw: '个人简介

  卢宏涛，上海交通大学计算机系长聘教授，博士生导师。

  研究方向为人工智能，包括机器学习、深度学习和计算机视觉等。

  在国际知名学术期刊和国际顶级学术会议上发表论文

  100

  余篇，

  Google Scholar

  引用超过

  10600

  余次，

  H-index 54

  。先后主持国家

  863

  、国家自然科学基金、教育部博士点基金、上海市科委和上海市曙光计划等

  10

  多项项目。连续入选

  2014-2018

  年

  Elsevier

  计算机科学中国高被引学者榜单。入选斯坦福大学发布的全球前

  2%

  顶尖科学家榜单。入选

  2005

  年度教育部新世纪优秀人才计划，

  2003

  年获上海市曙光学者称号。

  2010

  年获上海市自然学二等奖，

  2015

  年获河南省科技进步二等奖。

