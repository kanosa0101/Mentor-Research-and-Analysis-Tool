bio_raw: "个人简介\n我主要研究\n密码学与信\n息系统安全，具体方向包括：1. 抗量子密码；2. 密码与人工智能交叉；3. 信息泄漏与智能侧信道分析；4.\
  \ 密码系统安全与检测技术；5. 应用密码学与数据安全。先后创建了密码与计算机安全实验室（LoCCS）、国家级商用密码上海检测机构（首席科学家）、上海浦东\n\
  密码研究院（首席科学家）。担任上海交大计算机学院信息安全与密码学研究所（IISeC）所长、LoCCS\n实验室主任\n。\n20多年来，我带领团队率先开展了密码旁路分析的机理与方法、密码模块的数学物理与人工智能交叉分析、后量子密码困难问题求解、密码软件分析的探索研究，\n\
  在密码困难问题求解、后量子密码算法、侧信道分析和故障攻击、物理不可克隆函数与白盒密码、可信内生安全架构、二进制代码分析、程序理解与混淆\n、简洁非交互零知识证明\n\
  、数据隐私保护、区块链安全交易协议、密码检测工具等方面取得了一系列领先的学术成果\n，显著提升了密码系统分析设计能力和密码模块分析防护水平。\n我从事的研究课题需要多学科的学生，包括数学、密码、计算机、信息安全、微电子、\n\
  通信、信号处理、人工智能等专业的学生，在这里都能发挥作用。欢迎有志于从事后量子密码算法设计与分析、后量子密码迁移技术、基于信息泄漏问题的密码工程分析、人工智能与密码学交叉问题、密码系统安全问题分析与检测技术、密码代码与数据安全等研究的青年老师、博士后、博士生和硕士生，加入我团队或报考我的研究生。\n\
