bio_raw: '个人简介

  Dr. Hongsheng Hu is an Associate Professor in the School of Computer Science at
  Shanghai Jiao Tong University. From 2024 to 2026, he was a Lecturer in the School
  of Information and Physical Sciences at the University of Newcastle, Australia.
  Prior to that, he was a Postdoctoral Research Fellow at CSIRO’s Data61. He received
  his Ph.D. from the University of Auckland, New Zealand, under the supervision of
  Professor Xuyun Zhang, Professor Gillian Dobbie (Fellow of the Royal Society of
  New Zealand), and Professor Zoran Salcic (Fellow of the Royal Society of New Zealand).

  His research focuses on trustworthy machine learning, with particular emphasis on
  privacy and security. His work investigates critical privacy vulnerabilities in
  machine learning systems and develops effective defense and mitigation strategies.
  His research has appeared in leading information security, artificial intelligence,
  and data mining venues, including IEEE S&P, NDSS, USENIX Security, NeurIPS, CVPR,
  ICLR, IJCAI, AAAI, The Web Conference (WWW), ICDM, ACM Computing Surveys, IEEE TDSC,
  and IEEE TIFS.

  He regularly serves on the program committees of major international conferences,
  including ACM CCS, USENIX Security, NDSS AE, SaTML, ICLR, IJCAI, AAAI, and The Web
  Conference. He is an Associate Editor of IEEE Transactions on Information Forensics
  and Security and IEEE Transactions on Dependable and Secure Computing.

  工作履历

  2026-Now, Associate Professor, School of Computer Science, Shanghai Jiao Tong University

  2024-2026, Lecturer, School of Computer and Information Sciences, University of
