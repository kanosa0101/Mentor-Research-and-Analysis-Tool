bio_raw: '个人简介

  陈游旻，上海交通大学计算机学院长聘教轨副教授，博士生导师，主要研究方向包括

  存储系统、

  MLSys、

  操作系统

  等，在系统领域顶级会议（如SOSP、FAST、ASPLOS、EuroSys、USENIX ATC等）及期刊发表论文30余篇，多篇论文入选谷歌学术近5年高被引论文排行榜TOP50，研究成果应用于华为、阿里等头部企业，相关研究成曾获得

  CCF科学技术奖技术发明一等奖

  、

  华为首届奥林帕斯奖及百万悬红

  等。陈游旻博士于2021年获清华大学计算机科学与技术系博士学位，获得了

  CCF优秀博士学位论文奖

  （全国计算机学科10人入选）、

  ACM SIGOPS ChinaSys优秀博士学位论文奖

  （全国系统领域2-3人入选）等；2021-2024年在清华大学从事博士后研究工作，获得了

  中国博士后创新人才支持计划

  （博新计划）等的资助，主持了国自然面上基金、青年基金、

  国家重点研发计划子课题及多项校企合作

  项目。曾任第25届ChinaSys研讨会程序委员会主席（PC Chair），并担任USENIX ATC等国际会议/期刊的程序委员会委员/审稿人。

  详情请见个人主页

  ：

  https://chenyoumin1993.github.io

  教育背景

  2016 - 2021，清华大学，博士

  2019 - 2020，威斯康星大学麦迪逊分校，访问学者

  2012 - 2016，北京航空航天大学，学士

  工作履历

  2024 - 至今，上海交通大学，副教授

  2021 - 2024，清华大学，博士后

