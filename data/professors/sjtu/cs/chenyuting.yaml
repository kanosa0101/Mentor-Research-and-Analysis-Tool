bio_raw: '个人简介

  陈雨亭，上海交通大学计算机学院研究员，博士生导师，主要研究系统软件、 编程语言与编译器等，在 TOSEM、 TSE、 PLDI、 ICSE、 FSE、ISSTA、
  ASE 重要国际会议与期刊上发表或被接收过约 80 篇论文，授权技术发明专利 8项，软件著作权 4 项；主持国家重点研发项目课题1项，自然科学基金面上项目1项；曾参与国家
  973 计划项目 1 项、自然科学基金重点项目 2 项、科技部重点研发项目 1 项。获 2020 年度上海市技术发明奖一等奖、 2018 年度 CCF NASAC-东软青年软件创新奖、
  ACM SIGSOFT ICSE 2023 杰出论文奖、 ISSRE 2021 最佳论文提名等。

  欢迎对如下科研方向感兴趣的同学和我进一步讨论：人工智能、编程语言、编译器和虚拟机。

  教育背景

  1996.9~2003.3 南京大学计算机系 本科/硕士

  2003.4~2007.3 日本法政大学计算机专业 博士

  工作履历

  2007.4~2008.2 美国德州大学达拉斯分校，博士后

  2008.5~2015.5 上海交通大学软件学院，讲师

  2014.9~2015.8 美国加州大学戴维斯分校，访问学者

  2015.5~             上海交通大学计算机系/计算机学院，讲师，副教授（2016.12~2024.12）、研究员（2024.12~）、计算机系副系主任（2022.1~2025.3）

  教授课程

  教授计算机专业本科生课程《问题求解与实践》

