  资助项目

  正主持国家重点研发计划项目课题1项、国家自然科学基金委项目1项，曾主持、参与多个国家自然科学基金委重点项目、科技部项目及横向项目。

  获奖信息

  曾获ACM SigSoft ICSE 2023杰出论文奖及多个会议的最佳论文奖；担任SFPVV 2025的程序委员会主席，担任多个国际会议的程序委员会委员。

  学术服务

  中国计算机学会系统软件专委会常务委员、形式化专委会委员'
