bio_raw: '个人简介

  吴帆博士，现为上海交通大学计算机学院特聘教授、常务副院长，2020年国家自然科学基金杰出青年科学基金获得者。在移动端智能计算、大小模型协同智能、分布式智能系统、大数据管理、智能博弈等领域取得了一系列科研成果，已发表学术论文300余篇，论文发表在TMC、TPDS、TOC、TKDE等国际著名期刊，以及MOBICOM、OSDI、NeurIPS、AAAI、IJCAI、ICDE、VLDB、KDD等重要国际会议，并出版英文专著一部。先后担任IEEE
  Transactions on Mobile Computing等4个国际学术期刊编委，以及Journal of Computer Science and Technology青年编委和中国计算机学会通讯专题编委。曾获国家级教学成果奖二等奖、教育部自然科学奖一等奖2项、上海市科技进步奖一等奖、CCF科技进步奖一等奖、ACM中国新星奖、CCF-IEEE青年科学家奖、仲英青年学者、CCF-腾讯犀牛鸟卓越奖、CCF-Intel青年学者提升计划、上海市浦江人才，以及包括IEEE/ACM
  IWQoS 2020在内的7次国际学术会议论文奖。作为项目负责人承担科技创新2030“新一代人工智能”重大项目、国家自然科学基金、上海市科委项目20余项。

  教育背景

  南京大学，计算机科学与技术系，本科，2004

  纽约州立大学布法罗分校，计算机科学与工程系，博士，2009

  工作履历

  2009.09-2010.08 伊利诺伊大学香槟分校，电子与计算机工程系，博士后

  2010.09-2011.12 上海交通大学，计算机科学与工程系，讲师

  2011.12-2016.12 上海交通大学，计算机科学与工程系，副教授

  2016.12-2021.06 上海交通大学，计算机科学与工程系，教授

  2018.03-2021.10 上海交通大学，计算机科学与工程系，副主任

  2021.11-2025.03 上海交通大学，计算机科学与工程系，系主任

  2021.07-今      上海交通大学，计算机科学与工程系/计算机学院，特聘教授

  2025.04-今      上海交通大学，计算机学院，常务副院长

  教授课程

  CS2311 现代操作系统

  资助项目

  [1] 科技部，科技创新2030-新一代人工智能重大项目，大小模型端云协同进化与系统，2023.3~2026.2，项目负责人。

  [2] 国家自然科学基金，重点项目，面向异构终端的端边协同智能计算关键技术研究，2025.1~2029.12，项目负责人。

  [3] 国家自然科学基金，杰出青年科学基金，无线网络资源感知与调度，2021.1~2025.12，项目负责人。

  [4] 科技部，“物联网与智慧城市关键技术及示范”重点专项，课题：高时效全域移动自主感知技术，课题负责人。

  [5] 国家自然科学基金，面上项目，基于环境物理量的高效密钥提取技术研究，2020.1~2023.12，项目负责人。

  [6] 教育部联合基金，面向移动设备的私密可保护分布式联合学习，2019.1~2020.12，项目负责人。

  [7] 国家自然科学基金，面上项目，室内频谱实时感知与高效利用的基础理论与实用系统研究，2017.1~2020.12，项目负责人。

  [8] 上海市科学技术委员会国际科技合作项目，面向环境监测的群智感知机制设计原理研究与实现，2015.10~2018.9，项目负责人。

  [9] 国家自然科学基金，优秀青年科学基金，移动网络计算，2015.1~2017.12，项目负责人。

  [10] 国家自然科学基金，面上项目，移动互联网络中的博弈与协同激励机制研究，2013.1~2016.12，项目负责人。

  [11] 上海市科学技术委员会项目，浦江人才，移动互联网络中的自主协同激励机制研究，2012.10~2014.9，项目负责人。

  [12] 国家自然科学基金，面上项目，无线自组网络中用户合作激励机制研究，2012.1~2012.12，项目负责人。

