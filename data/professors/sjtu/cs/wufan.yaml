  2023年10月获中国计算机学会CCF科技成果奖科技进步一等奖（第5完成人）

  2023年7月获高等教育（本科）国家级教学成果奖二等奖（第13完成人）

  2023年5月获上海市计算机学会科学技术奖自然科学一等奖（第1完成人）

  2022年4月获上海市计算机学会教学成果奖一等奖（第1完成人）

  2021年10月获CCF-IEEE CS青年科学家奖

  2021年3月获教育部自然科学奖一等奖（第3完成人）

  2020年10月获国家自然科学基金杰出青年科学基金

  2015年2月获教育部自然科学奖一等奖（第3完成人）

