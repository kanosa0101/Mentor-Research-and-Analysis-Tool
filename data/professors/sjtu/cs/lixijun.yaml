bio_raw: '个人简介

  李希君，博士，博士生导师。2024年博士毕业于中国科学技术大学（与华为2012实验室联合培养），同年加入上海交通大学，现主持国家自然科学青年基金、上海市自然科学青年基金等多个纵横向项目。此前在华为技术有限公司诺亚方舟实验室任主任工程师等职务（2018年~2024年），围绕

  数据驱动的学习优化技术

  开展研究工作，已于主流学术会议、期刊上发表相关研究成果30余篇。其中，以第一作者/通讯作者身份在TPAMI, NeurIPS,

  ICLR,

  ICDE, KDD, SIGMOD, DAC等顶级数据挖掘、电子自动化设计会议发表论文10余篇，担任人工智能顶级会议领域主席/程序委员（NeurIPS/

  ICLR等）

  。同时，已公开中国/美国专利20余项。李希君博士在华为履职期间是华为云天筹求解器，盘古大语言模型等公司级重要产品的核心研发人员，多次获得华为公司总裁个人奖、创新先锋等奖励；在校期间指导学生获得第十九届“挑战杯”“人工智能+”专项赛特等奖。

  工作履历

  2026.01 至今             借调，中华人民共和国科学技术部

  2024.10 至今             助理教授，上海交通大学

  2018.04 至2024.09   历任工程师、高级工程师、主任工程师，华为2012实验室

