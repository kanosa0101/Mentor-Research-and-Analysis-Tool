bio_raw: '个人简介

  李力，上海交通大学计算机学院高级工程师。2005年获得日本会津大学硕士学位。曾就职于南京大学信息物理系、日本国立环境研究所、日本会津大学、上海交通大学软件学院。主要研究方向包括并行计算、普适计算、传感器网络等。在著名国际会议和期刊（如IEEE
  TPDS、IPDPS、ICDCS等）上发表四十余篇研究论文；参与数个云计算领域的基础软件研发和管理。'
