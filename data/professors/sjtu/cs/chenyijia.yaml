title: 长聘教授
email: yijia.chen@cs.sjtu.edu.cn
bio_raw: '个人简介

  主要研究兴趣为计算机与数学的交叉领域，包括逻辑、算法与计算复杂性。目前担任《

  Logic Methods in Computer Science

  》和《

  Theory of Computing Systems

  》两本国际期刊编委。

  教育背景

  -

  2001.10 - 2004.9

  ，德国弗莱堡大学，数学博士

  -

  1995.9 - 2000.1

  ，上海交通大学，计算机软件与理论博士

  -

  1991.9 - 1995.7

  ，上海交通大学，计算机应用学士、应用数学双学士

  工作履历

  -

  2021.4 –

  至今，上海交通大学计算机学院长聘教授

  -

  2014.10 – 2021.3

  ，复旦大学计算机科学技术学院教授

  -

  2011.1 - 2014.9

  ，上海交通大学计算机系教授

  -

  2005.10 - 2010.12

  ，上海交通大学计算机系副教授

  -

  2004.10 - 2005.9

  ，德国柏林洪堡大学计算机系研究助理

  -

  2001.10 - 2004.9

  ，德国弗莱堡大学数学系研究助理

  -

  2000.3 - 2001.9

  ，法国南巴黎大学计算机系博士后'
