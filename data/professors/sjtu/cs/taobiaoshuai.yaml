bio_raw: '个人简介

  陶表帅的科研方向在理论计算机科学和经济学的交叉方向，包括算法博弈论、社会选择学、公平分配、社会网络分析等。

  教育背景

  2015-2020   密歇根大学安娜堡分校   计算机科学   博士

  2008-2012   南洋理工大学                     数学                本科

  工作履历

  2024-今         上海交通大学                       副教授

  2021-2024   上海交通大学                        助理教授/讲师

  2012-2015   南洋理工大学数理学院      项目干事

  教授课程

  AI2615: Design and Analysis of Algorithms (算法设计与分析)

  CS3343: Computational Economics (计算经济学)

  CS3330: Combinatorics (组合数学)

  CS1212: Introduction to Theoretical Computer Science

  (理论计算机科学导论)

  论文发表

  详见个人主页：

  https://jhc.sjtu.edu.cn/~bstao/

  资助项目

  2025.01-2028.12 国家自然科学基金委员会，面上项目：社会选择与资源分配中的博弈和计算复杂性（Game theory and computational
  complexity aspects of computational social choice and resource allocation）

  2022.01 – 2024.12 国家自然科学基金委员会，青年科学基金项目：图传播模型下影响力最大化问题的近似算法研究（Approximation Algorithms
  for Influence Maximization in Diffusion Models）

  获奖信息

  上海海外高层次人才引进计划

