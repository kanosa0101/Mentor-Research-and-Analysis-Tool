bio_raw: '个人简介

  赵杰茹，上海交通大学计算机学院副教授，博士生导师。入选上海市青年科技35人引领计划、上海市海外高层次人才计划和浦江A类人才计划。研究方向包括智能计算系统、计算机体系结构、

  编译优化、

  异构计算（GPU、FPGA、NPU）等。面向新兴人工智能模型，从软硬件角度探索其在端侧和云侧等不同场景下的高效部署问题。在HPCA、SC、ISCA、ASPLOS、DAC、ICCAD等领域顶级会议上发表高水平论文50余篇，研究成果多次获得最佳论文奖或最佳论文奖提名，包括ICCAD
  2017最佳论文奖、HPCA 2024杰出系统奖，以及5次最佳论文提名（ICCD 2024、ISCA 2024、DATE 2022、SC 2021、CASES
  2018）。主持国自然面上项目、青年基金、上海浦江、以及华为、阿里、字节等多项企业课题，参与多项国自然重点项目。自2025年起担任IEEE TCAD编委（AE），受邀担任2025年ICCD硬件架构领域主席，连续多年担任DAC、ICCAD、ICCD等程序委员会委员及TCAD等期刊审稿人。

  教育背景

  2015年-2020年，香港科技大学，博士

  2011年-2015年，南京大学，学士

  工作履历

  2024年至今，上海交通大学，副教授

  2021年-2023年，上海交通大学，助理教授

  教授课程

  本科生课程《编译原理》，每年春季学期

  研究生课程《高级计算机系统结构》，每年秋季学期

  论文发表

  详见个人主页：

  https://zjru.github.io/

  我们诚挚欢迎感兴趣的同学加入课题组实习或者读研，欢迎与我联系！

  获奖信息

  Shanghai Science and Technology U35 in 2025

  ICCD Best Paper Nomination in 2024

  ISCA Best Paper Nomination in 2024

  HPCA Distinguished Artifact Award in 2024

  Shanghai Overseas High-level Talent in 2022

  DATE Best Paper Nomination in 2022

  Shanghai Pujiang Talent in 2021

  SC Best Reproducibility Advancement Award Finalist in 2021

  HKUST SENG Academic Award for 2018-2019 (Top Research Post-Graduate (Rpg) Award)

  ESWEEK CASES Best Paper Nomination in 2018

  William J. McCalla ICCAD Best Paper Award in 2017

  Hong Kong Ph.D. Fellowship from 2015 to 2019 (Top 3% among more than 4000 applications)

  Outstanding Graduate of Nanjing University in 2015

  National Scholarship (Top 2%) in 2013

  学术服务

  编委

  TCAD Associate Editor

  学术会议

  ICCD 2025 Track Chair

  ASP-DAC 2022, 2023 SRF Chair

  FPT 2022, 2025 Phd Forum Chair

  ISEDA 2025, 2026 Track Chair

  程序委员会委员

  DAC: 2022, 2023, 2024, 2025

  ICCAD: 2023, 2024, 2025, 2026

  ASP-DAC: 2025

  FPT: 2021, 2022, 2025

  ISEDA: 2025, 2026'
