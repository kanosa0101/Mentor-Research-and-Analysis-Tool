bio_raw: '个人简介

  孙士锋

  ，

  现任

  上海交通大学

  计算机（

  网络空间安全

  ）

  学院长聘教轨副教授、博士生导师，曾任澳大利亚

  Monash大学

  终身教职

  。主要

  研究兴趣包括

  密码学、数据与智能安全、隐私保护技术等，在

  ACM CCS、NDSS、USENIX Security、EUROCRYPT、ASIACRYPT、PKC、IEEE TDSC、DCC等密码与安全领域主流会议或期刊上发表学术论文50余篇，主持/参与NSFC重点项目、面上项目

  、上海市科技创新行动计划攻关

  项目

  等

  省部级以上

  项目

  10余项

  。

  研究成果获中国电子学会自然科学奖二等奖、中国密码学会密码创新奖、党政机要密码科技进步奖等科技奖励。

  担任中国密码学会大数据与人工智能安全专委会委员、

  中国计算机学会计算机安全专委会执行委员、

  中国中文信息学会大数据安全和隐私计算专委会委员

  、

  中国电子学会网络空间安全专委会委员、上海市数据标准化技术委员会委员

  ，以及

  ACM CCS、

  ASIACRYPT、ACISP等国际

  著名

  密码与安全会议程序委员会委员

  等

  。'
