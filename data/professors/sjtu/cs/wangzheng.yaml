bio_raw: '个人简介

  王铮博士，现任上海交通大学长聘教轨副教授、博士生导师。主要研究方向：数据挖掘、内容安全、人工智能安全与大数据技术。已在国内外高水平学术期刊及会议发表论文30余篇，包括IEEE
  TKDE/TNNLS，ACM TKDD等国际知名刊物，以及KDD，AAAI，ICDE, IJCAI等著名国际会议，相关工作被多个国际著名人工智能算法库与平台收录。先后入选上海海外高层次人才(青年)、国家人社部“澳门青年学者”等人才计划。指导学生参加全国开源安全大赛，获全国一等奖及“优秀指导教师”奖。主持国家自然科学基金项目、上海市自然科学基金面上项目与港澳交流基金等项目，并参与多项973、国家重点研发计划。更多详细信息请见个人主页：https://zhengwang100.github.io/.

  教育背景

  博士：清华大学大学

  本科：北京交通大学

  教授课程

  《人工智能基础》、《社交网络数据分析》

  论文发表

  详见

  个人学术主页：

  https://zhengwang100.github.io/.'
