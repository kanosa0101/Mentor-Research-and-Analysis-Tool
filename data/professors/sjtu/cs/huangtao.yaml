bio_raw: '个人简介

  黄涛现为上海交通大学长聘教轨助理教授、博导，主要研究方向包括高效深度学习、多模态大模型、具身智能等，相关研究成果发表至TPAMI、NeurIPS、ICML、ICLR、CVPR、ECCV、AAAI等人工智能、计算机视觉期刊会议中。

  教育背景

  2022.07~2025.02，悉尼大学，计算机科学，博士

  2016.09~2020.06，华中科技大学，计算机科学与技术，学士

  工作履历

  2025.03 至今，John Hopcroft计算机科学中心，长聘教轨助理教授

  2020.07~2022.05，商汤科技，算法研究员

  教授课程

  2026春季学期，CS3317-B，人工智能

  2026秋季学期，CS1601，计算导论

