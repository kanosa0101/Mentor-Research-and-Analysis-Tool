bio_raw: '个人简介

  硕士生导师。主要研究领域包括：信息内容安全、人工智能安全、移动应用和Android安全、网络安全管理。先后承担/参加了国家科技攻关计划、国家自然科学基金、国家863计划重点项目、国家973计划、国家重点研发计划项目等一批国家/省部级科研项目40余项，发表学术论文20余篇，编写高等学校信息安全专业教材、通信与信息专业教材各1部，获得国家发明专利、软件著作权等20余项，获上海市科技进步一等奖1项，获最高人民检察院第二届“科技强检”征文一等奖1项，指导本科生毕业设计获得上海交通大学优异学士学位论文(TOP
  1%)1篇。在国家级媒体发表网络安全科普作品20余部，获上海市全民数字素养与技能提升月优秀项目奖、中国教育技术协会网络安全教育优秀案例奖各1项。'
