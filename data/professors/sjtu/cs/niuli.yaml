bio_raw: '个人简介

  Li Niu is a tenured associate professor appointed at School of Computer Science
  in Shanghai Jiao Tong University. I specialize in computer vision and recently focus
  on image generation/editing.

  教育背景

  I obtained bachelor degree majoring in computer science from University of Science
  and Technology of China (USTC) and Ph.D degree from Nanyang Technological University
  (NTU) in Singapore. Before joining Shanghai Jiao Tong University, I was a postdoctoral
  associate at Rice University in Houston, USA.'
