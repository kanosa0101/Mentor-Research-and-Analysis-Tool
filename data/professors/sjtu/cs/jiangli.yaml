bio_raw: '个人简介

  研究方向为计算机系统结构，芯片设计自动化。在AI专用处理器，编译器，异构加速器设计，与存算一体架构等领域有多项技术突破成果。在相关领域发表会议与期刊论文130余篇，获2次最佳论文奖，1次最佳博士论文奖与多次最佳论文提名。入选国家级青年人才计划(QB)，吴文俊人工智能奖(芯片类)二等奖，华为火花奖，IEEE
  TTTC最佳博士论文奖提名。他在MICRO， DATE， ASP-DAC， ITC-Asia， ATS， CFTC， CTC等国际和国家会议中担任联席主席和TPC成员，Mindspore技术委员会委员，IET
  Computers & Digital Techniques，Integration the VLSI Journal等国际知名集成电路杂志编委，高等教育出版社人工智能实践系列课程与教材编委会委员。承担二十余项国家、省部级与华为、阿里云等横向课题，多项技术落地应用。3D
  IC测试架构方面的工作引用达数百次，已被纳入IEEE P1838标准，获CCF集成电路Early Career Award;与台积电共同研究发表3D存储器容错架构中的资源共享技术，获ACM上海新星奖：神经网络压缩技术在国内首家量产存算一体芯片应用，并落地多个商用场景，获得吴文俊人工智能科学技术二等奖;多项技术在业界通过华为、阿里巴巴等企业等产品线测试，及大规模部署试用。个人主页：

  https://jianglisjtu.github.io/

  教育背景

  博士（Ph.D.） 计算机系统结构，香港中文大学（CUHK），2010年11月 – 2013年10月

  硕士（MPhil） 计算机科学与工程，香港中文大学（CUHK），2008年8月 – 2010年7月

  学士（B.S.） 计算机科学与技术，上海交通大学（SJTU），2003年9月 – 2007年7月

  工作履历

  2021-至今 华为技术有限公司    科学家、高级研究专家（首席） | 异构通信处理器

  2020-至今 上海期智研究院        高性能计算杰出科学家

  2024-至今 上海交通大学           研究员 | 计算机学院

  2017-2024 上海交通大学          副教授 | 计算机科学与工程系

  2014-2017 上海交通大学          讲师 | 计算机科学与工程系

  2012-2013 美国杜克大学          访问学者

