email: mengyuewu@sjtu.edu.cn
bio_raw: '个人简介

  上海交通大学计算机学院（网络空间安全学院）副研究员/副教授, 博导。

  跨媒体语言智能实验室（X-LANCE）

  成员。北京师范大学学士，澳大利亚墨尔本大学博士，上海市浦江人才。研究方向围绕计算精神健康的音频信号及自然语言处理，包括大模型共情、主动对话系统、病理音频分析、医疗大模型安全伦理以及落地应用的心理筛查及咨询系统。主持国自然面上、青年项目。在ACL、EMNLP、AAAI、ACM
  Multimedia、IEEE/ACM T-ASLP等智能语音语言处理及多媒体重要会议和期刊上发表论文70余篇。获2025年自然语言处理顶会ACL (CCF-A)
  杰出论文奖，2023年NCMMSC最佳论文提名奖，2022年IEEE DCASE音频描述和检索双赛道国际冠军，以“面向精神疾病的大模型研究与应用”获得上海市数字医学技术及应用创新大赛二等奖。任ARR
  Rolling Review及Interspeech Area Chair。中文信息学会情感计算专委副秘书长，中国计算机学会语音对话及听觉专委会执行委员。研究成果应用在重大科研项目和工业实践，开发了一系列开源平台和工具，包括“精神疾病症状检测模型”、“医疗大模型伦理安全对齐框架”，为企业和医疗机构提供了共情能力提升以及安全防护的资源支持。联合蚂蚁集团、复旦大学科技伦理研究院、协和医院、瑞金医院等企业和高校医疗机构发布了“医疗健康大模型伦理与安全白皮书”。'
