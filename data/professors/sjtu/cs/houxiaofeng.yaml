bio_raw: '个人简介

  侯小凤，上海交通大学副研究员，博士生导师，从事绿色高效的人工智能计算架构和系统软件的研究，入选中国科协第十届青年人才托举工程、上海市海外高层次人才计划等人才激励计划。详见个人主页：

  https://xfhelen.github.io/

  我的课题组专注于高效能、可持续的AI计算，通过软硬件协同设计，解决大模型时代的算力与能耗挑战。

  课题组长期招收博士生、硕士生和本科实习生。

  目前有如下多个科研课题：

  1. 多模态模型推理加速：

  让文生图/视频模型跑得更快、更省电;

  2. 稀疏混合专家MOE大模型系统优化：

  突破显存墙，高效服务万亿参数的稀疏大模型;

  3. 边缘与端侧推理加速技术：

  在汽车、卫星等边缘场景实现低功耗的本地AI;

  4. 大模型微服务化系统：

  构建灵活、高可用的分布式AI服务系统。

  欢迎感兴趣的同学发邮件与我交流。

  教育背景

  2015 - 2020，上海交通大学，计算机科学与工程系，博士

  2019 - 2020，加州大学河滨分校，电气与计算机工程系，访问学者

  2011 - 2015，大连理工大学，软件学院，学士

  工作履历

  2023 - 至今，上海交通大学，助理研究员

  2021 - 2023，香港科技大学&智能晶片与系统研发中心，博士后研究员

  教授课程

  本科生课程《云计算技术》和《计算机伦理学》，秋季学期

  研究生课程《高级计算机系统结构》，春季学期

