title: 长聘教轨副教授
email: yuting.wang@sjtu.edu.cn
bio_raw: '个人简介

  本人研究方向为形式化方法和程序设计语言，内容涵盖形式化验证和程序语言的理论基础（包括程序语义、形式逻辑等）、形式验证框架设计开发、以及关键性系统软件（如编译器和操作系统）的验证。

  教育背景

  明尼苏达大学双城校区，计算机科学，博士研究生，2011.09 - 2016.12，美国

  康涅狄格大学，计算机科学与工程，硕士研究生，2009.09 – 2011.08，美国

  上海交通大学，电力系统及其自动化，硕士研究生，2006.09 – 2009.02，中国

  上海交通大学，电气工程与自动化，本科生，2002.09 – 2006.06，中国

  工作履历

  上海交通大学约翰*霍普克罗夫特计算机科学中心，长聘教轨副教授，2020.03 - 至今，中国

  耶鲁大学计算机系，博士后研究员，2016.12 – 2019.12，美国 (指导教授：Zhong Shao，原耶鲁大学计算机系主任)

  法国国家信息与自动化研究所INRIA-Saclay，暑期实习研究生，2012年夏、2014年夏，法国

  教授课程

  程序设计原理与方法(CS1604)

  数理逻辑 (AI3606)

  获奖信息

  明尼苏达大学研究生院博士论文奖学金(2015)

  上海交通大学优秀毕业生(2006)

  学术服务

  CCF形式化方法专委执行委员(2020 - 至今)

  会议主席：TyDe(2025)

  学术委员会委员：POPL(2025), PriSC(2025), ML Family Workshop(2025), CAV(2025), APLAS(2024),
  CPP(2023), FORTE(2023), LFMTP(2018)'
