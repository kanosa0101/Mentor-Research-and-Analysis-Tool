bio_raw: '个人简介

  李钟毓，长聘教轨副教授，博士生导师。主要研究方向为智慧医疗、计算神经科学、计算机视觉和深度学习。以第一作者或第一通讯作者在Nature Methods, IEEE
  TMI, IEEE TIP, Medical Image Analysis, MICCAI等期刊和会议上发表论文30余篇。

  课题组招收博士、硕士研究生、本科实习生，欢迎对人工智能与医学、神经科学交叉领域研究(AI for Science)感兴趣的同学加入！

  教育背景

  2015/08--2018/08    北卡罗莱纳大学夏洛特分校, 计算机科学, 博士

  2012/08--2015/06    西安交通大学, 软件工程, 硕士

  2008/08--2012/07    西安交通大学, 自动化, 学士

  工作履历

  2025/05--至今          上海交通大学, 计算机学院, 长聘教轨副教授

  2021/10--2022/10    剑桥分子生物学实验室(MRC LMB), 副研究员(Career Development Fellow)

  2018/10--2025/04    西安交通大学, 软件学院, 讲师, 准聘副教授, 长聘副教授

  论文发表

  [1]

  Zhongyu Li

  , Zengyi Shang, Jingyi Liu, Haotian Zhen, Entao Zhu, Shilin Zhong, Robyn N. Sturgess,
  Yitian Zhou, Xuemeg Hu, Xingyue Zhao, Yi Wu, Peiqi Li, Rui Lin, Jing Ren. D-LMBmap:
  A fully automated deep learning pipeline for whole-brain profiling of neural circuitry
  [J].

  Nature Methods

  , 2023, 20(10): 1593-1604.

  [2]

  Zhongyu Li

  , Chaoqun Li, Xiangde Luo, Yitian Zhou, Jihua Zhu, Cunbao Xu, Meng Yang, Yenan Wu,
  Yifeng Chen*. Towards Source-Free Cross Tissues Histopathological Cell Segmentation
  via Target-Specific Finetuning [J].

  IEEE Transactions on Medical Imaging

  , 2023, 42(9): 2666-2677.

  [3] Xiang Luo,

  Zhongyu Li*

  , Canhua Xu, Bite Zhang, Liangliang Zhang, Jihua Zhu, Peng Huang, Xin Wang, Meng
  Yang, Shi Chang*. Semi-supervised Thyroid Nodule Detection in Ultrasound Videos
  [J],

  IEEE Transactions on Medical Imaging

  , 2024, 43(5): 1792-1803.

  [4] Jihua Zhu, Rui Guo,

  Zhongyu Li*

  , Jing Zhang, Shanmin Pang. Registration of multi-view point sets under the perspective
  of expectation-maximization [J].

  IEEE Transactions on Image Processing

  , 2020, 29: 9176-9189.

  [5]

  Zhongyu Li

  , Xiaofan Zhang, Henning Müller, Shaoting Zhang. Large-scale Retrieval for Medical
  Image Analytics: A Comprehensive Review [J].

  Medical Image Analysis

  , 2018, 43: 66-84.'
