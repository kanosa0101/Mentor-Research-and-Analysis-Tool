bio_raw: '个人简介

  从事云原生、虚拟化、网络仿真相关研究工作。同时对大规模工作负载的分布式系统与网络基础设施的联合优化感兴趣，例如机器学习系统，Hadoop、Spark等。我们正在研究可用于机器学习、大数据及消息中间件的网络基础设施，尤其是高时变网络基础设施，以使将上述应用程序投入特定生产环境变得更加容易。这些工作包括应用的Operator、质量保证工具、系统优化以及网络验证工具。

  参与编著《互联网时代的软件工程》。获得上海市教学成果奖一等奖（排名第三）。指导学生获得多次中国大学生软件创新大赛特等奖，并获得10年最佳导师

  教育背景

  2001.9-2004.3 上海交通大学信息安全学院计算机专业 硕士

  1996.9-2000.7

  上海交通大学计算机系 本科

  工作履历

  2007.11至今 上海交通大学

  教授课程

  《互联网产品开发与运维》

  《工程科技创新II》

  《软件研发实践》

  管理软件工程专业《毕业设计》

  论文发表

  Rui Ren, Chunghsuan Wu, Zhouwang Fu, Tao Song, Yanqiang Liu, Zhengwei Qi, Haibing
  Guan. Efficient shuffle management for DAG computing frameworks based on the FRQ
  model. Journal of Parallel and Distributed Computing. Volume 149, 2021, Pages 163-173,

  Yuchen Cheng, Chunghsuan Wu, Yanqiang Liu, Rui Ren, Hong Xu, Bin Yang, and Zhengwei
  Qi. 2020. OPS: Optimized Shuffle Management System for Apache Spark. In Proceedings
  of the 49th International Conference on Parallel Processing (ICPP ''20).

  Y. Xia, R. Ren, H. Cai, A. V. Vasilakos and Z. Lv. Daphne: A Flexible and Hybrid
  Scheduling Framework in Multi-Tenant Clusters. IEEE Transactions on Network and
  Service Management, vol. 15, no. 1, pp. 330-343, March 2018

  Li Tongyu, Ren Rui, Cai Hongming, et al. Automated Web Page Content Extraction Method
  Based on Document Object Model[J]. Journal of Shanghai Jiaotong University. 2018,52,(10):1363-1369.

  Gao Ce, Ren Rui, Cai Hongming. GAI: A centralized tree-based scheduler for machine
  learning workload in large shared clusters[C]. ICA3PP 2018. 2018.

  余天佐, 蒋建伟, 任锐, 等. 基于工程教育认证标准的持续质量改进——以Z大学全国示范性软件工程专业为例[J]. 清华大学教育研究. 2015,36,(06):104-111.

  获奖信息

  上海市教学成果奖一等奖（排名第三）

