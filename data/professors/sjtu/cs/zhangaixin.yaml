bio_raw: '个人简介

  主持及参与多项国家及省部级科研项目，包括国家科技部重点研发计划《基于国产密码算法的移动互联网密码服务支撑基础设施关键技术》；国家科技部863重大项目《信息安全工程实践综合实验平台研究与集成》、面上项目《数字图像信息防伪鉴定技术研究》；上海市科委重大研究计划《高性能密码算法专用芯片的研制》、《数字证书SoC芯片开发》；上海市自然科学基金《椭圆曲线密码算法的旁路攻击与防御技术研究》等。发表SCI/EI论文30余篇，出版专著2部，登记软件著作权6项，获国家发明专利授权近20项。获上海市教学成果一等奖、上海市科技进步一等奖、上海市科技进步二等奖、中国电子学会科技进步二等奖、中国产学研合作创新成果一等奖各一项。

  教授课程

  1、数据结构

  2、面向对象的程序设计

  3、编译原理

  4、学术写作规范与伦理'
