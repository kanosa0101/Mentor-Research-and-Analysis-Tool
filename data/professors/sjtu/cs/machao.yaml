bio_raw: '个人简介

  马超，上海交通大学人工智能研究院教授，博士生导师。国家优青、上海市浦江人才、中国图象图形学学会优博。上海交通大学与加州大学默塞德分校联合培养博士。澳大利亚机器人视觉研究中心(阿德莱德大学)博士后研究员。主要研究计算机视觉。谷歌学术引用1万8千余次，连续6年入选爱思唯尔中国高被引学者（2020-2025）。任中国图象图形学学会优博俱乐部主席、青年工作委员会副秘书长。担任CVPR、ICCV、ICLR、AAAI、NeurIPS等会议领域主席，担任IEEE
  Trans. on Multimedia (TMM)、Journal of Artificial Intelligence Research (JAIR)。获中国图象图形学学会青年科学家奖、MMM
  2024唯一最佳论文奖、华为技术合作领域2021年度优秀技术成果奖。'
