bio_raw: '个人简介

  许岩岩，上海交通大学人工智能研究院长聘教轨副教授，入选国家海外高层次人才计划青年项目、上海市海外领军人才、上海市浦江人才计划。2015年至2020年于MIT、UC
  Berkeley任职博士后，2017年至2018年任职劳伦斯伯克利国家实验室客座博士后。许岩岩团队重点研究人工智能+复杂科学，并在计算城市科学、AI for Science特别是人工智能化学领域开展研究。针对复杂城市系统优化、有机化学合成、自动化实验等重大问题提出了一系列创新解决方案。城市科学重点以交叉学科视角，研究城市复杂系统中的人类移动行为、人类与建成环境的交互关系，并以数据驱动的方式对城市复杂系统进行建模与优化，特别是城市尺度上的交通拥堵、电力网络、设施规划、大气污染、疫情传播等重大问题。AI化学领域，团队发布了首个具备反应生成与“人在环路”反馈优化能力的化学大语言模型——白玉兰科学大模型BAI-Chem，在多项任务评测中均达到或大幅度超越当前最优方法，并通过湿实验证实了大语言模型在实验指导上的显著优势，有望加速变革性分子合成，该成果也作为大模型加速科学研究的代表性工作入选《Science》2025年十大科学突破。研究成果已发表于Nature
  Energy, Nature Computational Science, Nature Machine Intelligence, Science Advances,
  以及CCF A类会议，被Nature Asia、彭博社等多家国际媒体报道。

  教育背景

  2010.09 - 2015.06, 上海交通大学，模式识别与智能系统，博士

  2007.09 - 2010.06, 山东大学，信号与信息处理，硕士

  2003.09 - 2007.06, 山东大学，电子信息工程，本科

  工作履历

  2020.09 - 至今, 上海交通大学 人工智能研究院 副教授

  2017.10 - 2018.09, LBNL, 客座博士后

  2018.10 - 2020.09, UC Berkeley, 博士后

  2015.09 - 2018.09, MIT, 博士后

  教授课程

  CS2901 《程序设计思想与方法（C语言）》 2025-2026 秋季学期

  AI3624 《AI for Science: 科学智能理论与应用》，人工智能班

