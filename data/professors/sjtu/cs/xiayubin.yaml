bio_raw: '个人简介

  教授，博士生导师，国家级青年人才计划入选者，上海市优秀学术带头人，“挑战杯”全国特等奖优秀指导老师，《麻省理工科技评论》中国“隐私计算科技创新人物”（全国

  10

  人），

  CCF

  杰出会员，ACM杰出会员

  。主要研究领域是计算机操作系统与系统结构，曾获教育部技术发明一等奖、上海市技术发明一等奖、

  SOSP

  “

  最佳论文奖”、

  DSN

  “

  十年时间验证奖”、

  CCF

  “

  NASAC

  青年软件创新奖”、

  国家教学成果二等奖、上海交通大学卓越教学奖等。担任

  VEE

  、

  IDCDS

  （

  Track

  ）国际会议的程序委员会主席，以及SOSP、

  OSDI

  、

  EuroSys、ASPLOS

  等国际会议的程序委员会委员

  。目前担任

  CCF

  系统软件专委常务委员、

  CCF

  教育工委主任助理、上海交通大学

  -OpenHarmony

  技术俱乐部主任。'
