  [5]Kan X, Zhou Z, Yao L, et al. Research on Anomaly Detection in Vehicular CAN Based
  on Bi-LSTM[J]. Journal of Cyber Security and Mobility, 2023.

  [6]Zhou Z, Bin H, Li J, et al. Malicious encrypted traffic features extraction model
  based on unsupervised feature adaptive learning[J]. Journal of Computer Virology
  and Hacking Techniques, 2022.

  [7]于海洋, 陈秀真, 马进, 等. 面向智能汽车的信息安全漏洞评分模型[J]. 网络与信息安全学报, 2022, 8(1): 167-179.

  [8]银鹰, 周志洪, 姚立红. 基于LSTM的CAN入侵检测模型研究[J]. 信息网络安全, 2022, 22(12): 57-66.

  [9]Qian K, Zhang D, Zhang P, et al. Ontology and Reinforcement Learning Based Intelligent
