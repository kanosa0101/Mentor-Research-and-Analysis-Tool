bio_raw: '个人简介

  周志洪，工学博士，拥有国际注册信息系统审计师（

  CISA

  ）、注册信息安全专业人员（

  CISP

  ）、公安部信息安全等级保护高级测评师、北德

  TUV NORD ISO/CAE 21434

  汽车网络安全工程师等专业资质，同时担任上海市机要密码工作专委会委员以及上海市车联网协会专家。长期深耕网络安全测评领域，专注于网络安全检测与评估、密码应用安全检测与评估、网络攻防靶场与车联网安全测评等方向的理论研究与工程实践。现任上海交通大学信息安全服务技术研究实验室（

  CNAS

  认可）技术主管及上海智能网联汽车技术中心有限公司智能网联安全技术研究所技术主任。

  教育背景

  1999.09–2005.05

  ，浙江大学，信息与电子工程学系，直博

  1995.09–1999.06

  ，浙江大学，信息与电子工程学系，本科

  工作履历

  2005.6-

  至今

  上海交通大学，信息安全工程学院（现计算机学院网络空间安全研究所）讲师

  2021.11-

  至今

  上海交通大学信息安全服务技术研究实验室

  高级测评师

  教授课程

  嵌入式及FPGA实验

  NIS2332 3学分

  论文发表

  [1]PAN X, LI J, ZHOU Z, et al. Large language model-enhanced probabilistic modeling
  for effective static analysis alarms[J]. Frontiers of Information Technology & Electronic
  Engineering, 2025, 26(10): 1926-1941.

  [2]Chen Z, Zhou Z, Li J, et al. Directed symbolic execution tool based on clang
  static analyzer: Efficient and accurate verification of static analysis results[C]//International
  Conference on Cyberspace Simulation and Evaluation (CSE 2024). Springer, 2024.

  [3]李高磊, 李建华, 周志洪, 等. 面向新型关键基础设施的密码应用安全性评估技术综述[J]. 网络与信息安全学报, 2023, 9(6): 1-19.

  [4]Ying Y, Zhou Z, Zhang Q. Blockchain-based Collaborative Caching Mechanism for
