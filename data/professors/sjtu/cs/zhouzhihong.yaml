  Intelligence and Computer Applications (ICAICA). Dalian, China: IEEE, 2021: 556-561.

  [10]颜星晨, 张鑫, 周志洪, 等. 基于等保2.0验证测试与att&ck攻击矩阵的融合实践[J]. 网络安全与数据治理, 2025, 44(9): 15-21.

