  教育背景

  I received the B.S. degree in instrument and control engineering from Qingdao University
  of Science and Technology, China, in 1982, the M. S. degree in computer science
  and engineering from Northwestern Polytechnical University, Xi''an, China, in 1989,
  and the Dr. Eng. degree in electrical engineering from Kyoto University, Kyoto,
  Japan, in 1994.

  工作履历

  From 1982 to 1986, I was with the Qingdao University of Science and Technology.

  From April 1994 to March 1999, I was a Frontier Researcher at the Bio-Mimetic Control
  Research Center, the Institute of Physical and Chemical Research (RIKEN), Nagoya,
  Japan.

  From April 1999 to August 2002, I was a Research Scientist at the RIKEN Brain Science
  Institute, Wako, Japan.

  Since August 2002, I have been a full professor at the School of Computer Science,
  Shanghai Jiao Tong University, China.

  Center for Brain-Machine Interface and Neuromodulation, RuiJin Hospital, Shanghai
  Jiao Tong University School of Medicine

  教授课程

  Neural Network Theory and Applications

  Parallel Machine Learning with Application to Large-Scale Data Mining

