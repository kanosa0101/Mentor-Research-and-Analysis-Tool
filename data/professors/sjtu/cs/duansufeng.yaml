bio_raw: '个人简介

  段苏峰，上海交通大学计算机学院（网络空间安全学院、密码学院）助理研究员、硕士生导师。博士毕业于上海交通大学。研究方向包括大语言模型安全、机器翻译、自然语言处理等。

  工作履历

  2023.12 至今， 上海交通大学，助理研究员、硕导'
