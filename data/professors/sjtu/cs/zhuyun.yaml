bio_raw: '个人简介

  担任

  上海交通大学（信息安全服务技术研究实验室）技术主管，网络安全等级保护高级测评师，

  从事网络安全方面工作，主要涉及

  网络攻防，安全评估，等保测评，近几年主要从事网络安全等级保护测评工作，负责整个测评实验室的项目实施管理和技术发展研究。个人拥有CISSP及NSATP-A等多个安全相关认证证书

  教育背景

  2000-09-01 至 2004-06-30

  上海交通大学电子信息与电气工程学院自动化系

  自动化

  本科

  2004-09-01 至 2007-03-30

  上海交通大学信息安全工程学院

  通信与信息系统

  硕士

  工作履历

  2007-04-15 至 今

  上海交通大学

  工程师

  教授课程

  2016年至2022年，负责

  信息安全科技创新课程教授'
