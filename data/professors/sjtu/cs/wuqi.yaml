bio_raw: '个人简介

  吴奇，上海交通大学教授、博导，国家杰出青年基金获得者。研究方向聚焦机器人、类脑计算、具身智能、智能体对抗、博弈与决策等。研制了AI赋能的智慧座舱，建立了类脑平台，实现了机器人辅助控制智能体飞行。主持国防重大专项、基础加强重点、型号任务、杰青、叶企孙重点等项目。任机器人杂志和电子与信息学报编委、IEEE
  Transactions on Neural Networks and Learning Systems、IEEE Transactions on Systems,
  Man, and Cybernetics: Systems等7个Trans编委。获杨嘉墀科技二等奖、吴文俊自然科学二等奖，航空科技进步一等奖。

