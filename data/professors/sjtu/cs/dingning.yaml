bio_raw: '个人简介

  丁宁，现任上海交通大学计算机学院副教授，博导。主要研究领域是密码学（

  零知识协议、承诺方案、程序混淆等

  ）、隐私计算与数据安全、计算学习等，宽泛的兴趣爱好是理论计算机科学，目前研究点集中于基于

  MPC

  的隐私保护机器学习、恶意敌手模型下的高效协议构造、PAC和Agnostic Learning Model下的布尔函数学习。

  教育背景

  1996-2000，Central South University, B.S in CS

  2000-2003, Central South University, M.S in CS

  2004-2009, Shanghai Jiao Tong University, Ph.D in CS

  教授课程

  讲授本科生《近世代数》、研究生《应用代数》等'
