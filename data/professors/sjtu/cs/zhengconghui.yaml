bio_raw: '个人简介

  博士、助理研究员。2022年于上海交通大学博士毕业后，在上海交通大学

  网络安全技术研究院、计算机学院等

  从事教学与科研工作。长期从事网络空间内容安全、社交网络数据挖掘与分析、图神经网络等相关领域的研究，以及与法学、传播学等专业在网络空间治理领域的交叉研究工作。当前主要研究方向为网络空间信息内容安全治理，图神经网络在社交网络用户行为分析的应用等。

  主持国家自然科学基金青年项目，

  并作为核心人员参与

  多项国家重点科技攻关项目，包括国家973计划课题、国家重点研发计划课题等。

  近三年相关成果发表在IEEE TCyb，IEEE TNNLS，IEEE TKDE，IEEE TSC等人工智能与数据挖掘领域知名期刊，已获国家授权发明专利2项，参与出版专著1项。

  工作履历

  2022.08 至今，上海交通大学，助理研究员

  教授课程

  《信息内容安全》，专业必修课'
