email: shengzhong@sjtu.edu.cn
bio_raw: '个人简介

  刘生钟，上海交通大学计算机学院长聘教轨副教授、博导，2022年国家高层次青年人才，曾获得启源青年学者、英特尔中国学术英才等荣誉。研究方向为边缘智能、大模型/智能体推理部署优化、多模态感知计算，已发表学术论文70余篇，研究成果发表在TMC、TC、TPAMI等国际知名期刊，以及RTSS、UbiComp、EuroSys、SenSys、WWW、INFOCOM、ICML、NeurIPS、ACL等国际知名会议。先后7次获得RTSS、UbiComp、ACL、SenSys、RTAS在内的国际会议最佳/杰出论文，发表Communications
  of ACM - Research Highlight和ACM SIGMOBILE GetMobile - Research Highlight论文。先后主持国自然海优、面上项目和山东省自然联合基金重点项目，参与科技部重点研发计划和国自然重点等国家级项目。

  教育背景

  2013.09 - 2017.07，上海交通大学，计算机科学与工程系，本科

  2017.08 - 2021.12，伊利诺伊大学香槟分校，计算机科学系，博士

  工作履历

  2022.01 - 2023.03，伊利诺伊大学香槟分校，协同科学实验室（CSL），博士后

  2023.05 - 至今，上海交通大学，计算机科学与工程系/计算机学院，长聘教轨副教授

  教授课程

  CS2310 现代操作系统（春季）

  CS2303 操作系统课程设计（春季）

  论文发表

  论文发表请见：

  https://liushengzhong1023.github.io/publications/

  获奖信息

  2026 华为火花奖

  2025 启源青年学者

  2025 ACL杰出论文

  2024 英特尔中国学术英才计划荣誉学者

  2022 IEEE RTAS 2022杰出论文

  2021 IEEE RTCSA 2021最佳论文提名

  2020 IEEE RTSS 2020最佳论文

  2020 ACM SenSys 2020最佳论文

  2019 Fusion最佳学生论文（第3名）

  2018 ACM UbiComp/IMWUT杰出论文'
