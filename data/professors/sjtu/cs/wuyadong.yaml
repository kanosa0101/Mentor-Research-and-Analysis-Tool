bio_raw: '个人简介

  现任上海交通大学John Hopcroft计算机科学中心长聘教轨副教授，入选国家级及上海市海外高层次青年人才计划。近期研究聚焦于量子信息与人工智能的交叉领域，其作为通讯作者撰写的相关综述论文发表于Nature
  Reviews Physics，并以第一作者（含共同第一作者）身份在Nature Communications、Physical Review Letters等权威期刊上发表多篇原创性研究成果，相关成果还被Nature
  Computational Science评选为Research Highlights。

  教育背景

  2015-2020 物理博士, 卡尔加里大学, 导师:

  Barry Sanders

  2012-2015 电子科学与技术硕士, 上海交通大学密西根学院

  2008-2012 电子与计算机工程学士, 上海交通大学密西根学院

  工作履历

  2024-至今, 长聘教轨副教授，John中心, 上海交通大学

  2020-2024 博士后, 香港大学, 导师:

  Giulio Chiribella

  教授课程

  程序设计思想与方法（C++）

