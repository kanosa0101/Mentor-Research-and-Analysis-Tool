bio_raw: '个人简介

  庞浦，上海交通大学计算机学院助理研究员。2023年于上海交通大学计算机系获博士学位，2024年起加入上海交通大学。长期从事云计算、操作系统研究，在ASPLOS、SC、VLDB、HPCA、IEEE
  TPDS、ICS、SoCC等系统与体系结构顶级会议期刊上发表论文20余篇，

  获SoCC 2025最佳论文奖提名。

  详细信息请参看个人主页：

  https://pangpu.github.io/

  教育背景

  2017.03

  ～2023.09

  ，

  上海交通大学 计算机科学与工程系，博士

  2015.09～2017.03，

  上海交通大学 计算机科学与工程系，硕士

  2011.09～2015.06，上海交通大学 计算机科学与工程系，学士

  工作履历

  2024.01至今，上海交通大学 计算机学院，助理研究员

  教授课程

  CS3302 Linux内核'
