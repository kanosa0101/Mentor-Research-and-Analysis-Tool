  《自然语言处理》，秋季学期

  《人工智能前沿讲座》，秋季学期

  论文发表

  研究兴趣

  语音及音频信息处理：

  神经语音信号处理，鲁棒语音及声纹识别，高逼真度语音合成，丰富音频分析及听觉认知，多模态语音处理及通用语音大模型

  自然语言处理：

  意图及结构化语言理解，知识问答及阅读理解，统计对话系统，多语种语言处理，语言基础大模型，大模型智能体系统

  多模态交互：

  可控数字人，图形界面理解及交互，科学通用智能体

