bio_raw: '个人简介

  现任上海交通大学计算机学院特聘教授、博导，机器智能研究所所长，思必驰公司联合创始人及首席科学家。语言计算国家人工智能开放创新平台负责人，江苏省语言计算及应用重点实验室主任。国际语音通讯联盟会士（ISCA
  Fellow），美国电子电气工程师协会会士（IEEE Fellow），中国计算机学会杰出会员。国家级高层次人才计划获得者，科技部中青年科技创新领军人才，国家自然科学基金委优青，上海市“东方学者”特聘教授，上海市欧美同学会副会长兼人工智能分会会长。清华大学自动化系本科（1999）、硕士（2002），英国剑桥大学工程系博士（2006）。2012年回国在上海交通大学创立智能语音实验室（SpeechLab），后扩展并更名为

  跨媒体语言智能实验室（X-LANCE）

  。

  研究兴趣主要集中在人工智能领域，尤其是以对话为核心的智能语音及自然语言处理，涵盖了语音信号处理、语音识别及合成、音频分析、语言理解、对话管理、语言基础模型、多模态语音及语言处理等方面。研究目标是构建认知型对话智能体，它可以在复杂的现实环境中运行，处理不确定性，以人性化的方式传递信息并通过与环境交互而不断进化。已在国际一流的会议和期刊上发表了200余篇论文，并获得了包括Computer
  Speech and Language、Speech Communication等顶级期刊的最优论文奖，Interspeech等多个顶级国际会议的优秀论文奖，以及一系列国际研究评测的冠军。作为中国大陆高校首位入选者，曾任
  IEEE 语音语言处理技术委员会（Speech and Language Processing Technical Committee，SLTC）委员，曾任IEEE/ACM
  Transactions on Audio Speech and Language Processing 副主编，现任IEEE 信号处理分会会议事务理事会、会员事务理事会理事。曾任Interspeech、ICMI、SigDial等国际会议的程序委员会主席，全国人机语音通讯会议大会主席，以及ACL、EMNLP等国际会议的研究领域主席。现任中国计算机学会（CCF）第十三届理事会理事，CCF语音对话及听觉专委会主任，中文信息学会（CIPSC）第九届理事会理事，CIPSC语音信息处理专委会副主任；中国人工智能产业联盟（AIIA）学术及知识产权组组长，工信部人工智能关键技术和应用评测重点实验室学术委员会委员，第四届全国计算机科学技术名词审定委员会委员，全国信标委用户界面分委会（TC28/SC35）委员，世界顶尖科学家论坛青年科学家委员会委员。

  相关研究成果不仅在学术界得到了认可，也成功实现了大规模产业化。作为联合创始人创立

  思必驰信息科技有限公司

  ，任首席科学家，进行智能口语对话交互技术的产业化。思必驰公司因在人工智能技术和产业化方面的领先性，2016年作为中国仅有的两家人工智能创业公司之一，入选高盛发布的全球人工智能报告中的“Key
  AI Players”；2017年作为中国仅有的三家人工智能公司之一，入选国际权威IT咨询机构Gartner发布的“Cool Vendors for AI (East
  Asia)”列表。2022年，思必驰被科技部授予“语言计算国家新一代人工智能开放创新平台”，成为国家级的人工智能战略力量。

  教育背景

  1994-1999，清华大学，自动化系，学士

  1999-2002，清华大学，自动化系，硕士

  2002-2006，英国剑桥大学，工程系，博士

