bio_raw: '个人简介

  研究方向为操作系统内核、系统安全、机器学习系统。担任开源鸿蒙具身智能PMC主席，领域操作系统教育部工程研究中心内核实验室主任，CCF系统软件专业委员会执委，CCF开源发展技术委员会执委。研究方向为操作系统内核、系统安全、机器学习系统。研究成果发表在本领域主流学术会议与期刊如SOSP、OSDI、

  EuroSys、

  USENIX ATC、USENIX Security、

  NSDI、

  IEEE TC等。研究成果通过产学研合作应用于

  开源鸿蒙操作系统、

  航天卫星操作系统、OPPO智能终端操作系统、南方电网的电力鸿蒙操作系统等。担任包括EuroSys和ATC在内的多个期刊审稿人及国际会议程序委员会成员。参与编著《智能终端操作系统与OpenHarmony实践》《操作系统：原理与实现》。获

  “示范性软件学院联盟十大关键软件技术成果

  ”

  、

  “终端操作系统十大技术挑战特别贡献奖”、“OpenHarmony领航课题”等。指导学生获上海交通大学优异学士学位论文、

  全国大学生操作系统设计赛一等奖等

  。

