bio_raw: '个人简介

  I am an assistant professor at

  Computer Science and Engineering Department

  in

  Shanghai Jiao Tong University (SJTU)

  . I received the Master and Ph.D. degrees from Shanghai Jiao Tong University under
  the supervision of

  Prof. Quan Chen

  and

  Prof. Minyi Guo

  . For now, I still work closely with

  Prof. Quan Chen

  and

  Assist Prof. Weihao Cui

  .

  My previous research focused on:

  Task scheduling across various architectures

  Resource management in datacenters

  DNN inference system design

  Currently, my research focus on:

  Cloud computing and deep learning systems

  LLM inference and training systems

  Serverless architectures for diverse applications

  Advanced resource management in datacenters

  I am now looking for perspective Undergraduate Students and Master Students (Enrollment
  Date: 2026.09). If you are interested in above areas, we should talk.

