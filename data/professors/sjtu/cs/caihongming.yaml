bio_raw: '个人简介

  西北工业大学本硕博，

  2004

  年于上海交通大学计算机博士后流动站出站后留校。

  2008

  年获德国克虏伯基金会“中国优秀青年学者奖学金”基金，

  2011

  年被上海交通大学遴选为博士生导师，

  2012

  被中国科协授予全国优秀科技工作者荣誉称号。

  2015

  年任上海交通大学软件学院副院长，

  2019

  年任上海交通大学软件学院书记。主要学术兼职包括

  :ACM/IEEE Senior member

  ，中国图学学会常务理事，计算机图学专委会主任；中国计算机学会杰出会员，协同计算专委会执行委员，计算机应用专委会常务委员；中国自动化学会制造技术专业委员会委员等，并担任多个国际期刊编辑。获中国高校科学技术奖科技进步奖，中国高校科学技术奖自然科学奖，上海市科技进步奖等省部科技奖励

  4

  项，近期发表论著

  150

  余篇，

  SCI/EI

  收录超过

  100

  篇，其中

  ESI

  高被引论文

  4

  篇，授权发明专利3

  0

  余项。

  教育背景

  西北工业大学 本科 1992 - 1996

  西北工业大学 硕士 1996 - 1999

  西北工业大学 博士 1999 - 2002

  教授课程

  过程建模及优化

  智能数据平台设计及实现

  资助项目

  国家自然科学基金面上项目，工业物联环境下基于语义场景迁移的服务语用互操作研究，2020.1-2023.12，已结题、主持

  国家工业和信息化部项目，基于边缘计算的固体火箭发动机异地协同制造工厂内集成应用新模式、2018.1-2020.12，已结题、交大方负责人。

  上海市科委项目，区域智慧能源网建设关键技术研究与示范——面向互联网+应用的软件支撑平台、2017/7-2020/06、已结题、主持。

  上海市经济信息化委项目，混合型工业互联网模式下的船舶结构件协同制造与智能生产线集成应用示范、2017.7-2019.6、已结题、交大方负责人。

  国家自然科学基金面上项目，基于本体进化的自演化应用服务系统构造研究、2013/01-2016/12、已结题、主持。

  上海市自然基金，面向自演化软件服务的本体生成及进化研究、2013/07-2016/06、已结题、主持。

  上海市科委项目，随需应变的造船企业信息集成平台、2009/08-2011/07、已结题、主持。

  国家863项目，资源元模型驱动的企业信息集成平台研究、2009/01-2010/12、已结题、主持。

  航空科学基金，基于资源的产品跨企业综合集成平台研究、2007/10-2009/09、已结题、主持。

  国家自然科学基金青年基金，网格环境下面向可视操纵的几何建模服务构造研究、2007/01-2009/12、已结题、主持。

  获奖信息

  2023年福建省科技进步奖（二等）:纯电商用车动力系统产业协同数字化制造关键技术与应用(排名第3)

  2013年上海市科技进步奖（二等）:基于进程模型的服务集成平台(排名第2)

  2012中国科协“全国优秀科技工作者”

  2012上海交通大学“凯原十佳教师”

  2010中国高校科学技术奖科技进步奖（二等）：基于信息资源的web服务平台(排名第2)

  2007年德国阿尔弗来德.克虏伯.冯.博棱和哈尔巴赫基金会基金“中国优秀青年学者奖学金”

  学术服务

  ACM Senior member

  IEEE Senior member

  ISGG Diretor

  中国图学学会常务理事，计算机图学专委会主任

  中国计算机学会杰出会员，计算机应用专委会常务委员，协同计算专委会执行委员

  中国机械学会高级会员，工业大数据与智能系统分会委员

  中国自动化学会，制造技术专业委员会委员'
