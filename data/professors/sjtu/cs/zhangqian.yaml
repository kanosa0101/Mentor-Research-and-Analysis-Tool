bio_raw: '个人简介

  上海交通大学计算机学院副研究员、博士生导师。主要研究方向为物联网、普适计算和无线感知。成果发表在Ubicomp/IMWUT、CHI、TMC、Sensys、Percom等国际高水平会议和期刊，获CHI
  2025 Honorable Mention Awards、SECON 2019最佳论文runner-up奖及华为Explore X人才资助。

  教育背景

  上海交通大学 博士 2020

  上海交通大学 硕士 2015

  西北工业大学 本科 2011

  工作履历

  2025.1至今 上海交通大学 副研究员

  2022.11-2024.12 上海交通大学 助理研究员

  2020.4-2022.10 上海交通大学 博士后

  教授课程

  SE3302智能平台设计及实现（本科）

  SE3303 数据挖掘与大数据分析（本科）

  EI 8702 物联网技术（研究生）

