bio_raw: '个人简介

  高级工程师，工学博士，研究生导师

  ，长期

  致力于在网络信息安全管理监控，信息安全

  保障

  与

  安全服务

  体系标准及技术

  研究，曾主持或参与多项国家自然科学基金、上海市自然基金、国家

  863项目、公安部、国家发改委信息安全专项等国家和省部级科研及工程项目，并主持和参与上海市电子政务外网工程的建设及关键技术研究，

  “

  S219

  ”

  国家科技攻关项目

  “

  网络媒体安全综合防御与监管系统

  ”

  ，网安数据仓库关键技术研究

  ,

  基于物联网的危险化学品信息监控关键技术研究

  ,

  电力信息系统安全运维服务综合管理平台，信息安全综合管理与运维托管服务

  等

  项目，

  以及

  上海市电子政务重大工程

  “金质”、“金审”、“水务及海洋信息化”的规划及建设工作，区域网络安全态势感知、网络失泄密检测系统的工程应用，

  在国内外学术会议及期刊发表论文数十篇

  ，获得国家发明专利多项。

  教育背景

  2003年毕业于上海交通大学图像所，获得模式识别与人工智能专业工学博士学位

  工作履历

  2003年进行上海交通大学信息安全工程学院工作

  教授课程

  教授本科生课程《网络信息安全概论》与《网络空间安全及法律法规》

  论文发表

  （1）

  Scale Wisely, Secure Wholly: P2P Swarm Learning Over Consortium Blockchain in Edge
  Networks

  （2）Binary Rewritten based Control Flow Integrity Protection for Wireless Industrial
  Communication System

  （3）Blockchain-based Collaborative Caching Mechanism for Information Center IoT

  （4）Hierarchical Sentiment Estimation Model for Potential Topics of Individual Tweets

  （5）A Mixed Learning Objective for Neural Machine Translation

  发明

  专利包括

  （1）工控软件控制流完整性保护方法及系统

  （2）面向个人推文的话题情感倾向性预测模型的建模方法及系统

  （3）媒体网站内容监管信息统一存储和交互的方法等。

  获奖信息

  （1）第二届安全科技进步奖

  基于物联网的危险化学品信息监测关键技术研究

  （2）2023世界互联网大会领先科技奖：大规模云网融合系统内容高效可靠分发与主动防御技术研发及产业化 关键技术 完成人

  （3）国家信息安全应用示范工程（S219）二期先进个人

  学术服务

  长期为区域政府、国企、安全职能部门等提供网络安全等级保护测评、安全

  规划

  咨询、安全

  服务及建设

  等社会化

  、

  工程化

  服务。'
