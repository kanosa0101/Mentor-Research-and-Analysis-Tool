bio_raw: '个人简介

  Erci Xu is a tenure-track associate professor @ Shanghai Jiao Tong University who
  mostly focuses on cloud, storage systems, reliability and infrastructure for AI.
  He has published multiple papers at top venues including SOSP, OSDI, FAST, ATC and
  Eurosys. He is the recipient of two USENIX FAST Best Paper Awards FAST''23, FAST''24, Distinguished
  Artifacts Award from FAST''25, ACM SIGOPS China Rising Star Award and 2025 CCF-IST
  Youth Innovation Award. In his spare time, Erci enjoys reading and reviewing books.

  This website is not actively maintained. For the most up-to-date information, please
  refer to Erci’s personal website:

  https://giorgioercixu.github.io/

