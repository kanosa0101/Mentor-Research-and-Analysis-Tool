bio_raw: '个人简介

  本人目前是上海交通大学计算机学院先进计算研究所教授。研究方向包括：并行与分布式计算、云计算、计算机体系结构。致力于云原生计算架构与系统的研究，研究成果已经在阿里云、华为云、联想、字节跳动、蚂蚁集团等落地。本团队目前正在招募博士研究生和硕士研究生。如果你对并行计算、计算机系统、计算机体系结构感兴趣，请和我联系。

  教育背景

  2013.11 -- 2014.09,    访问学者，美国哥伦比亚大学

  2009.09 -- 2014.06,    博士，       上海交通大学计算机科学与工程系

  2007.09 -- 2009.07,    硕士，       上海交通大学计算机科学与工程系

  2003.09 -- 2007.07,    学士，       同济大学计算机科学与技术系

  工作履历

  2021.08 -- 至今,         教授，        上海交通大学计算机科学与工程系/计算机学院

  2016.07 -- 2021.07,    长聘教轨副教授，        上海交通大学计算机科学与工程系

  2014.10 -- 2016.04,    博士后，                密西根大学安娜堡分校计算机系

  2014.07 -- 2016.06,    海外师资博士后，上海交通大学软件学院

  教授课程

  操作系统

