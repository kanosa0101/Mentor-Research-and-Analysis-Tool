bio_raw: '个人简介

  顾小东，上海交通大学计算机学院副教授，主要研究研究方向为大语言模型、智能化软件工程、自然语言处理，为软件代码开发高效的机器学习算法。研究课题包括代码大模型、程序生成与修复、Agent智能问答等。研究成果被发表在ICSE、ICLR、FSE、AAAI、ASE、ICPC等国际重要期刊和会议上。代表性研究成果DeepAPI荣获软件工程CCF-A类会议FSE
  2026的“时间检验论文”奖。主讲计算机学院《机器学习》《计算机数学基础》等人工智能基础课程。主持参与国家自然科学基金、国家重点研发计划、上海市自然科学基金及华为、腾讯等企业课题十余项。获得上海市海外高层次人才计划、华为火花奖等荣誉。

