bio_raw: '个人简介

  上海交通大学副研究员、博导，主要研究方向为操作系统、系统结构与大模型基础软件。在ISCA、ASPLOS、USENIX ATC、EuroSys、USENIX Security、IEEE
  TC、ACM TOCS等计算机领域著名国际会议与期刊上发表论文十多篇。主持国家自然科学基金青年项目，获上海市“市长奖”、中国产学研合作促进会创新成果二等奖等荣誉。

  教育背景

  2011 - 2015 上海交通大学 软件工程 学士

  2015 - 2020 上海交通大学 计算机科学与技术 博士

  教授课程

  CS3601 操作系统  本科生（IEEE/ACM 班）

  EI6711   高级操作系统  研究生

