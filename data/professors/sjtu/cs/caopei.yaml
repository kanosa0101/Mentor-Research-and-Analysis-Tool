bio_raw: '个人简介

  研究聚焦于密码工程、AI安全、侧信道分析与防护等方向，提出一系列针对实际密码系统（如USIM卡、专用密码芯片、低功耗蓝牙）的侧信道分析方法和检测方法。近五年在TCHES、TIFS、DAC、

  ESORICS、

  JCST、TVLSI等密码工程领域的重要会议和期刊发表论文10余篇；主导研发了侧信道分析软件工具SCAnalyzer pro；主导研制了MCU信息泄漏采集设备、多协议采集设备等；主导了国际NIST轻量级密码算法软硬件实现的侧信道测评工作；作为核心成员主持或参与国家自然科学基金青年项目（C类）、国自然面上项目、国网科技项目等重点项目。获上海市技术发明奖一等奖、上海交通大学科研成果奖二等奖等。

  欢迎感兴趣的老师和同学们联系交流！

  教授课程

  本-(2026-2027-1)-NIS3605-01-密码工程实践

