bio_raw: '个人简介

  金海明是上海交通大学计算机学院长聘副教授，约翰·霍普克罗夫特（John Hopcroft）计算机科学中心副主任，博士生导师，入选国家海外高层次青年人才。金海明长期从事物联网、无线感知、射频计算、低功耗通信等方向的研究。

  教育背景

  2012-08至2017-05，美国伊利诺伊大学厄巴纳香槟分校（UIUC），博士，导师：Klara Nahrstedt教授（美国工程院院士）;

  2008-08至2012-07，上海交通大学，学士。

  工作履历

  2025-01至今，上海交通大学，长聘副教授；

  2021-07至2024-12，上海交通大学，长聘教轨副教授；

  2018-09至2021-07，上海交通大学，助理教授；

  2017-06至2018-06，美国伊利诺伊大学厄巴纳香槟分校（UIUC），博士后。

  教授课程

  计算机网络：本科课程，2021−2025春季学期，2021、2023、2024秋季学期；

  无线通信原理与移动网络：本科课程，2019、2020春季学期；

  问题求解与实践：本科课程，2019−2022秋季学期。

  论文发表

  金海明

  在IEEE/ACM TON、IEEE TMC、IEEE JSAC等知名国际期刊和ACM MobiCom, IEEE INFOCOM、ACM SenSys、ACM
  UbiComp、IEEE RTSS、ACM MobiHoc、IEEE ICDCS等知名国际会议上发表和录用学术论文70余篇，其中第一作者/通讯作者论文40余篇。

  资助项目

  金海明目前主持国家自然科学基金面上项目1项，参与国家自然科学基金联合基金重点项目1项（交大负责人），参与科技部重点研发项目1项（子课题负责人）；金海明曾主持国家自然科学基金青年基金项目1项和上海市科委杨帆计划项目1项，曾参与国家自然科学基金面上项目1项（骨干参与）、联合基金重点项目1项（交大负责人）、科技部重点研发项目1项（课题骨干）；金海明也有丰富的承担企业横向项目的经验，曾主持阿里巴巴AIR项目2项和CCF-滴滴盖亚青年学者科研基金项目3项。

  获奖信息

  金海明连续3年（2022-2024年）入选斯坦福大学发布的全球前2%顶尖科学家榜单，获2024年中国指挥与控制学会科学技术奖技术发明类一等奖（排名第5）、CCF
  A类会议INFOCOM 2021最佳论文提名，INFOCOM优秀程序委员奖4次（2020、2022-2024年）、CCF-滴滴盖亚青年学者科研基金杰出项目奖、中日韩A3前瞻项目论坛最佳报告奖。

  学术服务

  学术会议组织委员会成员：

  MobiHoc 2025 宣传主席，RFCom 2025程序

  委员会共同主席，

  WiOpt 2024宣传主席，SECON 2023宣传主席，MobiHoc 2020宣传主席，IoTDI 2018 海报主席，CWSN 2020组织委员会副主席，CIKM-AIT
  2019程序委员会共同主席

  学术会议程序委员：

  MobiHoc 2020−2025, INFOCOM 2020−2026, ICDCS 2019−2025, WiOpt 2018−2024, ITC 34−36,
  Globecom 2019−2025, ICPADS 2021, MSN 2020, ICCC 2019−2025, GBC 2024, AAAI 2023−2024

  学术组织任职：

  IEEE会员，ACM会员，中国计算机学会会员，中国计算机学会物联网专委会执行委 员，ACM中国嵌入式专委委员，中国电子学会物联网青年专技组委员，上海市计算 机学会网络专委委员，上海市计算机学会普适计算与嵌入式专委委员'
