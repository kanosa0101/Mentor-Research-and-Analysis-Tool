bio_raw: '个人简介

  罗欣剑，上海交通大学计算机学院长聘教轨副教授，入选国家级青年人才计划。主要研究方向为分布式机器学习系统的隐私与安全风险分析，侧重通过隐私分析揭示人工智能系统的内部运行机理，促进可信与可靠人工智能系统的构建。相关研究成果发表于计算机安全领域四大国际顶级会议
  IEEE S&P、ACM CCS、USENIX Security、NDSS，以及数据库领域顶级会议 VLDB、ICDE 等。担任 ICDM 2026会议论文集主席，并长期担任KDD、WWW、AAAI、CIKM、DASFAA等国际学术会议程序委员会委员。

  长期招收具有自我驱动力、勤奋踏实并有志于开展高水平科研的学生，欢迎对相关方向感兴趣的同学联系交流。

  教育背景

  2019.08 - 2024.07，新加坡国立大学，计算机科学系，博士

  2016.09 - 2019.03，上海交通大学，计算机科学与工程系，硕士

  2012.09 - 2016.06，大连理工大学，网络工程系，学士

  工作履历

  2026.03 - 至今，上海交通大学，计算机学院，长聘教轨副教授

  2024.08 - 2026.03，穆罕默德·本·扎耶德人工智能大学，计算机科学系，博士后

