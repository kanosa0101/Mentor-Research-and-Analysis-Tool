bio_raw: '个人简介

  重点研发计划项目负责人，国家优秀青年科学基金获得者。主要从事分布式系统与数据库系统研究，成果发表在OSDI、SIGMOD、VLDB、NSDI、PPoPP、PODC等相关领域权威会议上。发表ACM通讯（Commmunications
  of the ACM） 亮点论文和封面文章，并获2023 ACM SIGMOD研究亮点奖、SIGMOD 2022最佳论文优胜奖（Honorable Mention）、CCF青年科技奖（CCF-IEEE
  CS）、ACM ChinaSys新星奖、华为奥林帕斯先锋奖，以及两次华为火花奖。学术兼职包括OpenHarmony技术指导委员会智能数据管理TSG负责人、ACM
  ChinaSys秘书长、CCF学术工作委员会委员、上海市计算机行业协会副会长等。曾受邀担任MLSys 2026、EuroSys 2026/2025、NSDI 2024、SoCC
  2024/2023等国际会议的程序委员会成员，以及第22期秀湖论坛联合主席等。'
