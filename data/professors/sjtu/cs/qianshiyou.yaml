bio_raw: '个人简介

  博士，副研究员，博士生导师，主要研究方向包括云计算、大数据分析、推荐系统及算法。在国际学术期刊和会议上发表论文

  120

  多篇，获得授权发明专利

  30

  多项，软件著作权

  20

  多项。主持国家自然科学基金面上项目

  1

  项，重点研发子课题

  1

  项，中交水运、华为、阿里巴巴、淘宝等校企合作项目

  10

  余项。获得省部级及行业协会科技进步奖

  10

  余项。

  教育背景

  （1） 2010.09 - 2015.06 上海交通大学，计算机科学与技术，博士

  （2） 2004.09 - 2007.07 中国矿业大学，计算机应用技术，硕士

  工作履历

  （1）2019.01 至今, 上海交通大学, 计算机学院, 副研究员

  （2）2016.01 - 2018.12, 上海交通大学, 电子信息与电气工程学院，计算机科学与工程系, 助理研究员

  教授课程

  C++程序设计思想与方法（本科生）

  论文发表

