bio_raw: "个人简介\n刘盛云\n现任\n上海交通大学计算机学院（网络空间安全学院、密码学院）\n长聘教轨副教授，博士生导师；\n毕业于法国巴黎高等电信学院\n\
  （\nTélécom ParisTech，现已加入Institut Polytechnique de \nParis），获计算机与网络专业博士学位，曾任蚂蚁集团区块链平台部高级技术专家；代表性研究成果发表在OSDI,\
  \ SOSP, NSDI, EuroSys, ATC, TPDS和ToS等计算机系统领域旗舰会议和期刊，相关成果已应用于蚂蚁链和长安链的产业场景；主持国家自然科学基金面上项目、上海市科技创新行动等国家和省部级纵向项目；讲授《分布式算法》、《算法（计算）复杂度分析》和《区块链技术及应用》课程。\n\
  研究方向：\n分布式共识、区块链、分布式数据管理。\nWith the goal of, hopefully,\nimposing clear, well-defined\
  \ coherence on the seemingly chaotic behavior of distributed computing systems...\n\
  欢迎对此感兴趣或有所领悟的同学加入实验室!\n论文发表\n代表性会议论文：\n[WWW'26]\nBIND: Enabling Continuous Transaction\
  \ Processing During Account Migration in Sharded Blockchains\n.\nJiahao Qi, Dian\
  \ Ding, Jie Li, Jiannong Cao, Yi-Chao Chen, Guangtao Xue,\nShengyun Liu.\n[ATC'25]\n\
  Chitu: Avoiding Unnecessary Fallback in Byzantine Consensus.\nRongji Huang, Xiangzhe\
  \ Wang, Xiaofeng Yan, Lei Fan, Guangtao Xue,\nShengyun Liu.\n[ICDCS'25] EquiBFT:\
  \ A Framework for Achieving Fairness in BFT Consensus\n.\nSiwei Cai, Lei Fan,\n\
  Shengyun Liu\n, Hong-Sheng Zhou.\n[NSDI'25] Vegeta: Enabling Parallel Smart Contract\
  \ Execution in Leaderless Blockchains\n.\nTianjing Xu, Yongqi Zhong, Yiming Zhang,\
  \ Ruofan Xiong, Jingjing Zhang, Guangtao Xue,\nShengyun Liu.\n[EuroSys'25] Cheetah:\
  \ Metadata aggregation for fast object storage without distributed ordering\n.\n\
  Yiming Zhang, Li Wang,\nShengyun Liu\n, Shun Gai, Haonan Wang, Xin Yao, Meiling\
  \ Wang, Kai Chen, Dongsheng Li, Jiwu Shu.\n[EuroSys'24] Bandle: Asynchronous state\
  \ machine replication made efficient\n.\nBo Wang*,\nShengyun Liu* (equal contribution)\n\
  , He Dong, Xiangzhe Wang, Wenbo Xu, Jingjing Zhang, Ping Zhong, Yiming Zhang.\n\
  [SOSP'23] Flexible advancement in asynchronous bft consensus\n.\nShengyun Liu\n\
  , Wenbo Xu, Chen Shan, Xiaofeng Yan, Tianjing Xu, Bo Wang, Lei Fan, Fuxi Deng, Ying\
  \ Yan, Hui Zhang.\n[Middleware'23] Bridging the gap of timing assumptions in byzantine\
  \ consensus\n.\nZixuan Chen, Lei Fan,\nShengyun Liu (alphabetical order)\n, Marko\
  \ Vukolić, Xiangzhe Wang, Jingjing Zhang.\n[EuroSys'19] Ursa: Hybrid block storage\
  \ for cloud-scale virtual disks.\nHuiba Li, Yiming Zhang, Dongsheng Li, Zhiming\
  \ Zhang,\nShengyun Liu\n, Peng Huang, Zheng Qin, Kai Chen, Yongqiang Xiong.\n[ATC'17,\
  \ short paper] PARIX: Speculative Partial Writes in Erasure-Coded Systems\n.\nHuiba\
  \ Li, Yiming Zhang, Zhiming Zhang,\nShengyun Liu\n, Dongsheng Li, Xiaohui Liu, Yuxing\
  \ Peng.\n[OSDI'16] XFT: Practical fault tolerance beyond crashes.\nShengyun Liu\n\
  , Paolo Viotti, Christian Cachin, Vivien Quéma, Marko Vukolić.\n代表性期刊论文：\n[TDSC'26]\n\
  Customizable Information Dispersal-Based Byzantine Broadcast with Communication\
  \ Optimization Using Bloom Filters\n.\nShuangquan Tan, Yong Chen,\nShengyun Liu\n\
  .\n[TCAD'24] Efficient Block Storage in the Cloud\n.\nYiming Zhang, Zhihao Zhang,\
  \ Yan Chen, Huiba Li, Haonan Wang, Ping Zhong,\nShengyun Liu\n, Dongsheng Li.\n\
  [ToS'23] Hybrid block storage for efficient cloud volume service\n.\nYiming Zhang,\
  \ Huiba Li,\nShengyun Liu\n, Peng Huang.\n[ToS'20] PBS: An efficient erasure-coded\
  \ block storage system based on speculative partial writes\n.\nYiming Zhang, Huiba\
  \ Li,\nShengyun Liu\n, Jiawei Xu, Guangtao Xue.\n[TPDS'17] Leader set selection\
  \ for low-latency geo-replicated state machine\n.\nShengyun Liu\n, Marko Vukolić."
