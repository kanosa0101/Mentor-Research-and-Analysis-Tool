bio_raw: '个人简介

  张媛媛，上海交通大学计算机科学与工程系副教授，博士生导师，中国计算机学会高级会员、Linux基金会机密计算专业会员、RISC-V工作组安全分组成员。研究方向为软件与系统漏洞发现与分析、新型可信计算架构分析与设计等。主持参与国家自然科学基金面上项目、重点项目，主持国家重点研发计划课题，上海市重点项目，以及973、863等多项国家级项目或课题。

  曾任2014-2016年交大安全战队指导教师，在多项国际CTF竞赛中取得突破性排名。教学科研

  过程中强调学生的学术前沿探索能力与安全实战能力并进，鼓励学生将学术型成果真正转化为能发现真实安全问题的流程与技术。近年来共发现0day漏洞30余项。

  近期研究课题：

  自动化代码审计与漏洞发现

  系统软件的模糊测试技术

  机密计算系统安全分析与设计

  教授课程

  教学授课：

  《计算机系统安全》本科专业课，48学时，3学分——《校级“一流课程”》；

  《漏洞分析与挖掘》》本科专业课，32学时，2学分；

  《计算机系统安全分析》研究生专业课，48学时，3学分；

  虚拟仿真教学实验平台GoSecStar，课程实验平台，面向校内用户开放。

  本科生科研实习：

  请关注本校PRP及大创项目，或直接联系实验室（https://gosec.sjtu.edu.cn）。

