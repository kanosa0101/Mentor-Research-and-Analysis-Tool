bio_raw: '个人简介

  涂仕奎，上海交通大学计算机学院长聘副教授、博导，国家级青年人才。北大数学本科、香港中文大学计算机博士，

  UMassMed博后。长期从事机器学习、及其与生化医药交叉研究，发表论文100余篇，含Science、Cell正刊、Nature子刊，以及NeurIPS、ICML等人工智能领域CCF-A类会议。获吴文俊人工智能科学技术奖自然科学奖二等奖(第3完成人)、华为云与计算先锋教师、省部级校级教学成果奖4项等。主持和参与国家基金委、科技部、上海市科委等人工智能领域项目多项。

  教育背景

  2002-2006，北京大学，数学科学学院，本科

  2006-2012，香港中文大学，计算机科学与工程系，博士

  工作履历

  2012-2016, 美国麻省大学[伍斯特校区]（医学院），博士后

  2017-2023，上海交通大学，计算机科学与工程系，长聘教轨副教授

  2023-至今，上海交通大学，计算机学院（计算机科学与工程系），长聘副教授

  教授课程

  CS3308 机器学习（本科生课程）

  CS2601 线性优化与凸优化（本科生课程）

  CS7315 基因组学之大数据学习（研究生课程）

