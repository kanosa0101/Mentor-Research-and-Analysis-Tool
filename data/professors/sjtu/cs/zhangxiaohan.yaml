bio_raw: '个人简介

  博士、助理研究员，入选省部级人才计划。2023年12月毕业于西安电子科技大学网络空间安全学院（导师：李兴华教授），2021年-2022年于南洋理工大学联合培养（导师：刘杨教授）。长期从事可信人工智能系统、漏洞挖掘、可信软件工程技术、可信执行环境等相关领域的研究。作为项目骨干参与多项国家重点研发计划课题及国家自然科学基金。相关成果发表在Usenix
  Security，WWW，TON，TIFS，TDSC，TII，DSN等顶级期刊/会议上，并获得DSN国际会议最佳论文及杰出论文奖，长期担任TIFS，ToN，TITS等顶级期刊的审稿人。授权国内技术发明专利2项，国际PCT专利2项。发现了一系列重要且应用广泛的软件漏洞。作为指导老师获得第十九届“挑战杯”揭榜挂帅擂台赛擂主1项。

  2026年招收网安或计科专硕1名。欢迎有意向进行科研工作的本科生同学联系。

  教育背景

  1. 2013.08-2017.07，西安电子科技大学，本科，信息安全

  2. 2017.08-2023.12，西安电子科技大学，硕博连读，网络空间安全

  3. 2021.12-2022.12，新加坡南洋理工大学，联合培养

  工作履历

  2024.02-今，上海交通大学，助理研究员

  论文发表

  Selected Publications:

  [1] Xiaohan Zhang, Zhiyuan Yu, Xinghua Li, Cen Zhang, Cong Sun, Ning Zhang, Robert
  H. Deng. Understanding the Bad Development Practices of Android Custom Permissions
  in the Wild, IEEE Transactions on Dependable and Secure Computing. 2025. （CCF-A）

  [2] Xiaohan Zhang, Jinwen Wang, Yueqiang Cheng, Qi Li, Kun Sun, Yao Zheng, Ning
  Zhang, Xinghua Li. Interface-Based Side Channel in TEE-Assisted Networked Services,
  IEEE/ACM Transactions on Networking, 2023, 32(1): 612-626.（CCF-A）

  [3] Xiaohan Zhang, Xinghua Li, Yinbin Miao, Yunwei Wang, Siqi Ma, Jian Weng. A Data
  Trading Scheme with Efficient Data Usage Control for Industrial IoT,  IEEE Transactions
  on Industrial Informatics, 2021, 28(7): 4456-4465.

  [4] Xiaohan Zhang, Cen Zhang, Xinghua Li, Zhengjie Du, Bing Mao, Yuekang Li, Yaowen
  Zheng, Yeting Li, Li Pan, Yang Liu, Robert H. Deng, A Survey of Protocol Fuzzing.
  ACM Computing Surveys. 2024.

  [5] Yuran Bian, Xiaohan Zhang, Zhiyuan Yu, Changqing Li, Li Pan. Your Prompts Are
  Not Safe: Output-Free Membership Inference via Prompt Vectors in Vision-Language
  Tuning. The Fortieth AAAI Conference on Artificial Intelligence. （CCF-A）

  [6] Jiadong Lou, Xiaohan Zhang, Yihe Zhang, Jin Li, Xinghua Li, Xu Yuan, Ning Zhang.
  Devils in Your Apps: Vulnerabilities and User Privacy Exposure in Mobile Notification
  Systems, 53rd Annual IEEE/IFIP International Conference on Dependable Systems and
  Networks. （最佳论文奖&杰出论文奖，CCF-B）

  [7] Lai Jiang, Yuekang Li, Xiaohan Zhang, Youtao Ding, Li Pan. SceneJailEval: A
  Scenario-Adaptive Multi-Dimensional Framework for Jailbreak Evaluation. The Fortieth
  AAAI Conference on Artificial Intelligence. （AAAI’26，CCF-A）

  [8] Cen Zhang, Yuekang Li, Hao Zhou, Xiaohan Zhang, Yaowen Zheng, Xian Zhan, Xiaofei
  Xie, Xiapu Luo, Xinghua Li, Yang Liu. Automata-Guided Control-Flow-Sensitive Fuzz
  Driver Generation, 32nd USENIX Security Symposium. （CCF-A）

  [9] Zhengjie Du, Yuekang Li, Yaowen Zheng, Xiaohan Zhang, Cen Zhang, Yi Liu, Sheikh
  Mahbub Habib, Xinghua Li, Linzhang Wang, Yang Liu, Bing Mao. Medusa: Unveil Memory
  Exhaustion DoS Vulnerabilities in Protocol Implementations, The World Wide Web Conference,
  2024. （CCF-A）

  [10] Zhe Chen, Haiyan Zhang, Xinghua Li, Yinbin Miao, Xiaohan Zhang, Man Zhang,
  Siqi Ma, Robert H. Deng. FDFL: Fair and Discrepancy-Aware Incentive Mechanism for
  Federated Learning. IEEE Transactions on Information Forensics and Security. 2024.
  （CCF-A）

  获奖信息

  2023 DSN国际会议杰出论文奖&最佳论文奖，2023

  2025年度中国青年科技创新“揭榜挂帅”擂台赛人工智能领域专项赛，擂主（特等奖第一名），指导教师，2025

  第九届强网论坛杰出论文奖，2025

  学术服务

  1. IEEE/ACM Transactions on Networking (CCF‐A 类期刊)，审稿人，2020.12-至今

  2. IEEE Transactions on Information Forensics & Security (中科院一区, CCF‐A 类期刊)，审稿人，2023.05-至今

  3. IEEE Transactions on Intelligent Transportation Systems (中科院一区, CCF‐B 类期刊)，审稿人，2022.02-至今

  4. IEEE/ACM Transactions on Computational Biology and Bioinformatics (中科院三区)，审稿人，2022.05-至今

  5. Journal of Cloud Computing (中科院三区)，审稿人，2022.10-至今'
