bio_raw: '个人简介

  研究方向：数据科学、数据智能可视分析、知识服务、人文计算、形式化方法和验证等

  教育背景

  2000年04月-2004年04月 上海交通大学计算机科学与工程系，计算机软件与理论，博士

  1997年09月-2000年04月 哈尔滨工程大学，计算机系，计算机应用，硕士

  1993年09月-1997年07月

  哈尔滨工程大学，计算机系，计算机软件，学士

  工作履历

  2025年11月至今 上海交通大学文科处智慧人文社科中心副主任（兼）

  2018年04月至今 上海交通大学图书馆，副馆长

  2004年04月至今  上海交通大学计算机学院，讲师，副教授

  2015年10月-2016年10月 上海市规划与国土资源管理局信息处，副处长(挂职)

  2017年07月-2018年04月 上海交通大学图书馆，副馆长(挂职)

  2008年07月-2009年01月 法国巴黎第七大学(Université Paris Diderot-Paris 7)PPS实验室，访问学者

  教授课程

  数据可视化与可视分析;

  并行理论；

  计算思维(Python);

  离散数学;

  C++ 程序语言

