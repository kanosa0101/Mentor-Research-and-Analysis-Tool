bio_raw: '个人简介

  俞嘉地，博士生导师，

  主要研究兴趣包括物联网、移动感知计算、移动安全等。

  工作履历

  2007

  年

  7

  月毕业与上海交通大学计算机系，并获工学博士学位。随后进入上海交通大学电子工程系博士后流动站。从

  2009

  年

  1

  月至

  2011

  年

  8

  月，在美国

  Stevens Institute of Technology

  从事博士后研究工作。

  2011

  年底回国后加入上海交通大学计算机系工作至今。

  教授课程

  "软件工程“ （本科生）

  ”物联网导论“ （研究生）

  论文发表

  发表学术论文近100余

  篇，并在

  Springer

  出版社出版外文专著三部。发表中国计算机协会（

  CCF

  ）推荐

  A

  类论文

  50余

  篇

  ，

  IEEE Transactions

  论文

  40余

  篇

  ，中科院第一

  /

  二区

  SCI

  期刊论文3

  0 余

  篇

  。发表

  论文于国内外高水平学术期刊与国际会议，例如

  IEEE Communications Surveys and Tutorial (IEEE COMST)

  、

  IEEE/ACM Trans. on Networking (ToN)

  、

  IEEE Trans. on Mobile Computing (TMC)

  、

  IEEE Trans. on Information Forensics and Security(TIFS)

  、计算机学报、

  ACM MobiCom

  、

  ACM UbiComp

  、

  ACM MobiSys

  、

  IEEE InfoCom

  等。

  获得

  ACM MobiCom 2019/2022

  最佳海报奖（

  Best Poster Award

  ），

  IEEE ICPADS 2019

  最佳学生论文奖（

  Best Student Paper Award

  ）

  ,  IEEE BigData 2022

  最佳学生论文奖（

  Best Student Paper Award

  ）

  ,

  以及

  2022

  年上海计算机学会普适计算与嵌入式最佳论文奖。

  论文列表见：https://www.cs.sjtu.edu.cn/~jdyu

  资助项目

  作为项目负责人主持了国家自然基金面上项目、国家自然基金重点国际合作研究项目子课题，及国家重点研发项目子课题。

  详见：https://www.cs.sjtu.edu.cn/~jdyu

  获奖信息

  作为第一完成人获得

  2023

  年

  CCF

  科技创新大赛一等奖，及

  2023

  年中国发明协会发明创新二等奖；作为主要完成人获得两次上海市科技进步二等奖（

  2016

  、

  2018

  ），一次上海自然科学二等奖（

  2020

  ），中国产学研合作创新成果奖（

  2022

  ），以及上海市计算机学会自然科学一等奖（

  2024

  ）。

  详见：https://www.cs.sjtu.edu.cn/~jdyu

  学术服务

  CCF/IEEE

  高级会员;

  中国计算机学会物联网、普适技术专委会执行委员;

  ACM China SigBed

  专委会委员.

  详见：https://www.cs.sjtu.edu.cn/~jdyu'
