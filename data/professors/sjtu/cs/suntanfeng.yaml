bio_raw: '个人简介

  孙锬锋，博士，上海交通大学计算机学院(网络空间安全学院、密码学院)教授/博导。主要从事媒体内容安全智能攻防技术（包含AIGC媒体技生成术与检测技术、媒体安全认知取证技术、多模态大模型安全攻防技术、生成式隐写与分析技术、智能情感认知技术等领域）的理论与关键技术研究。在科研方面，主持了包括国家重点研发计划项目课题、国家自然科学基金等10余项国家/省部级科研任务，参与其他课题20余项。教学育人方面，在授课程4门：本科生课程《数字图象处理》、《信息隐藏技术》；研究生课程《多媒体内容安全》、《数字取证前言技术》；主编《数字媒体取证学原理与应用实践》教材1本（2024年9月第一版）。获奖方面，获上海科技进步奖一等奖1项，中国图象图形学学会科技进步奖一等奖1项，上海交通大学2024年度教学成果奖2项（校级二等奖主持1项，校级一等奖参与1项）；2023年获全国高校混合式教学设计创新大赛（校级三等奖）等。在IEEE
  TIFS、TDSC、TMM、TCSVT、信号处理等国内外学术期刊和会议上发表学术论文180余篇，获国家发明专利授权50余项，软件著作权登记10项。其成果在国家安全、检察院、法院、航空航天、上海领本智能科技公司、上海声通公司等单位得到成功应用，取得了良好的社会和经济效益。目前是IEEE高级会员、中国图象图形学学会高级会员，同时也是十余种国际学术期刊的审稿人。

  教育背景

  2000/04 - 2003/12

  ，吉林大学，通信与信息系统，工学博士。

  1997/09 - 2000/03

  ，吉林工业大学，机械一体化，工学硕士。

  1993/09 - 1997/07

  ，吉林工学院，自动化专业，本科。

  工作履历

  ü

  2022/01-

  至今，上海交通大学，计算机学院（网络空间安全学院、密码学院），教授/博导

  ü

  2013/01-2021/12

  ，上海交通大学，电子信息与电气工程学院，副研究员

  ü

  2020/01-2022/12

  ，上海交通大学，电子信息与电气工程学院网络空间安全学院应用安全教研室，副主任

  ü

  2017/09-2020/07

  ，上海交通大学，电子信息与电气工程学院，本科专业班主任

  ü

  2005/11-2012/12

  ，上海交通大学，电子信息与电气工程学院，讲师

  ü

  2012/07 - 2013/12

  ，美国新泽西理工大学，电机及计算机工程系，访问学者

  ü

  2009/01-

  至今，信息内容分析技术国家工程实验室，青年骨干讲师

  ü

  2003/11-2005/11

  ，上海交通大学，电子信息与电气工程学院，博士后

  教授课程

  他主讲本科生授课2门次/年（数字图像处理（本/混合）、信息隐藏技术（本）、

  研究生授课2门次/年：

  多媒体内容安全（研/混合）、数字取证前沿技术（研）；

  共计160学时/年；

  论文发表

  学术论文196篇，其中SCI期刊68篇，EI期刊23篇，SCI/EI国际会议学术论文67篇，其他核心期刊38篇。

  资助项目

  他主持、参与国家级、省市级项目共28项，其中主持国家自然科学基金4项（在研1项），国家“

  社会治理与智慧社会科技支撑

  ”重点专项项目-课题负责1项，国家“

  公共安全风险防控与技术装备”重点专项

  课题参与3项，参与最高人民检察院检察技术信息研究中心基本科研业务费专项资金课题一级课题（50万参与）、二级课题（10万参与）、三级课题（5万参与）各1项，其他科研项目20余项。他发表学术论文187篇，获授权专利、授通专利、登记软著共计50项。

  获奖信息

  2025年度获上海市科技进步奖一等奖（4//15）；

  2024年度中国图象图形学学会科学技术进步奖一等奖（排名5/10）；

  2024年，获上海交通大学2024年度教学成果奖二等奖1项（排名1/5）及成果奖一等奖1项（参与10/10）；

  2023年10月获全国高校混合式教学设计创新大赛(上海交通大学校赛三等奖)；

  2022年-2023年4月15日，孙锬锋在光明网发布2项科普作品（全民国家安全教育日）；

  2023年获全国高校混合式教学设计创新大赛(上海交通大学校赛，孙锬锋、许可、姚立红)；

  2023年获第二批“校级优秀基础教学组织“称号；

  2020年获得上海交通大学教书育人奖（个人）提名奖1项；

  2017-2021年指导全国大学生信息安全竞赛5次，2017年、2019年获竞赛一等奖、优秀指导教师奖；

  CVPR AI-Safety 2022 AI

  对抗检测赛赛道(2022，唯一银奖)；CVPR2023- 物理世界车辆对抗检测赛题(2023，第6名)；CCF与360联合主办的面向大语言模型的提示注入攻防竞赛(2023，第7名)；CSIG
  FAT 2022人脸对抗检测竞赛（2022，季军）；“盘古石杯”全国电子数据取证大赛创新作品赛(2023，优胜奖)；

  学术服务

  他兼职

  IEEE Senior Member

  ，

  中国图形图像学学会CSIG高级会员

  ，多媒体取证与安全专委会学术组委员，中国计算机学会CCF会员；2023年11月10日-12日，参加“第四届CSIG中国媒体取证与安全大会”。孙锬锋教授受邀作大会分论坛主持人，及本次会议讲习班主席。2023年5月5日，上海交大网安召开了“CSIG
  图象图形中国行-上海交通大学站”系列学术交流活动，邀请复旦张新鹏教授（杰青）、南信工付章杰教授/院长、华师大殷赵霞教授线做学术报告，线上线下参会人数达到171人次。2023年8月7日，上海交通大学网安学院召开“CSIG研究生学术交流研讨会：数字媒体内容攻防博弈新技术交流”，线上线下参会人员达到94人次。2020年荣获学会专委会“最佳学术活动组织团队奖”；2021年11月11-13日担任第二届中国媒体取证与安全大会组织主席；2022年11月18-20日担任第三届中国媒体取证与安全大会程序主席；2020年、2021年、2022年11月12日作为主持人承办CSIG在线学术研讨会3次。2017年至今兼职国际会议组织-亚太信号与信息处理协会（APSIPA）TC
  Member。2018年9月至今，他兼职上海市智慧检务大数据融合创新实验室技术领域专家。他是国际著名学术期刊IEEE TIFS、IEEE TMM、IEEE JSTSP、IEEE
  TCSVT、IEEE SPL等，国际会议CVPR、AAAI、ICASSP、ICME、IWDW等的审稿专家。'
