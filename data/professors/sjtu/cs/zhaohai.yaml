bio_raw: '个人简介

  研究兴趣：探索人工智能基础大模型之上实现通用人工智能的一切可能性

  教育背景

  2000年-2005年：上海交通大学计算机科学与工程系 博士

  1995年-2000年：燕山大学电气工程学院 学士、硕士（提前读研）

  工作履历

  2010年迄今：上海交通大学计算机(系)学院副教授（2010）、教授（2017）、长聘教授（2024）

  2006-2009年，香港城市大学中文、翻译及语言学系Research Fellow（计算语言学）

  教授课程

  自然语言处理（致远学院ACM班课程）

  自然语言理解（计算机专业研究生课程）

  论文发表

  Google Scholar引用目前超过11000次

  https://scholar.google.com/citations?user=H6vHKJoAAAAJ&hl=zh-CN&oi=ao

  2022年起入选爱思唯尔高被引学者

  2023年出版《自然语言理解》（清华大学出版社）

  脑启发大语言模型

  Hai Zhao, Hongqiu Wu, Dongjie Yang, Anni Zou, Jiale Hong. 2025.

  BriLLM: Brain-inspired Large Language Model, arXiv:2503.11299

  资助项目

  2019-2022年，主持自然科学基金重点项目（通用联合）面向特定领域的语义分析

  学术服务

  Section Editor: Transactions of the Association for Computational Linguistics (TACL)

  Action editor： ACL Rolling Review （ARR）'
