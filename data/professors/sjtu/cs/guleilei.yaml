bio_raw: '个人简介

  顾磊磊，上海交通大学计算机学院长聘教轨副教授，博士生导师。研究方向聚焦于仿生视觉传感器，通过生物启发的传感器及处理算法软硬一体的联合设计，构建小算力、低功耗的仿生视觉系统，提高无人机、微/小型机器人以及人本身等资源受限场景下的智能视觉感知能力。以第一/通讯作者在Nature、
  Nature Machine Intelligence、Nature Communications等国际著名期刊上发表论文，两项成果被Nature   News报道。主持国家自然科学基金面上项目、重点研发课题，参研2030脑计划科技部重大专项青年科学家项目。

  教育背景

  2011-2016       博士       香港科技大学     电子与计算机工程

  2008-2011       硕士       复旦大学            物理电子学

  2004-2008       学士       复旦大学            物理电子学

  工作履历

  2021-至今       长聘教轨副教授          上海交通大学

  2016-2020      博士后                       香港科技大学

  教授课程

  《类脑智能》、《仿生感知与人工智能应用》等

  论文发表

  1.

  Gu, L

  ., Poddar, S., Lin, Y., Long, Z., Zhang, D., Zhang, Q., Shu, L., Qiu, X., Kam, M.,
  Javey, A., Fan, Z*, 2020. A Biomimetic Eye with Hemispherical Perovskite Nanowire
  Array Retina,

  Nature

  , 581, 278-282. (Nature News 报道，入选“Nature Hot Topics”、“2020年中国半导体十大研究进展”、“ESI高被引论文”) (类人眼视觉芯片)

  2. Tang, J., Zhu, Y., Jiang G., Xiao, L., Ren, W., Zhou, Y., Gu, Q., Yan, B., Zhang,
  J., Bi, H., Wu, X., Fan, Z.,

  Gu, L.*

  , 2025. Human-centered design and fabrication of a wearable multimodal visual assistance
  system,

  Nat. Mach. Intell.

  , 7, 627-638. （

  Nature News 报道，

  入选“2025年度助残科技创新案例”）(视觉辅助系统集成，)

  3. Ren, W., Zhao, X., Tang，J., Sun, B., Meng Q., Xiao, L., Chen, Q., Shi Y., He,
  Z., Yang, Z., Zhou, Y., Ni, D., Wen, L., Tian, B.*, Wu, X.*, Fan, Z*., Chu, J.,

  Gu, L.*

  . A self-powered spherical compound eye with 8 ns-motion response for source-constrained
  drones.

  Nat. Commun.

  17, 6864 (2026). (类复眼视觉芯片)

  4. Zhu, Y, Xiong, H., Xiao, L., Shi, R., Gu, Q.,

  Gu, L.*

  , SCE-Depth: A Spherical Compound Eye Framework for Wide FOV Depth Estimation,

  CVPR

  (2026), 26964-26973. (复眼结构+算法)

  资助项目

  主持

  1.  基金委面上项目                     球形神经形态仿生人眼的研究

  2. 上海市青年科技启明星项目     大视场共球面仿生复眼

  3.  科技部重点研发课题等项目    多场景、跨模态智能导盲和视障辅助技术的研发和应用

  4.  中国电子科技集团等横向项目

  参与

  科技 2030 脑计划重大项目青年科学家项目   高分辨人工视网膜的开发及其在全盲者视觉重建中的应用

  获奖信息

  1. 年度中国半导体十大研究进展

  2. 第六届中国(上海)国际发明创新展览会金奖

  3. 2025年度助残科技创新案例

  学术服务

  1. 担任2021级AI班2班班主任

  2. 多次参与学校的招生，面试等工作'
