bio_raw: '个人简介

  陈黎兴，博士，上海交通大学长聘教轨副教授、博导，主要研究方向包括算力网络安全、人工智能安全。已在IEEE JSAC、ToN、TC、TMC、TIFS等国际权威期刊及NeurIPS、ICML、AAAI、IJCAI、CVPR、KDD等国际旗舰会议上发表论文90余篇，其中3篇论文为ESI高被引论文（前1%）。连续5年入选“全球前2%科学家”，获评上海市海外高层次人才。指导2024中国国际大学生创新大赛项目获上海市金奖、全国铜奖，及优秀指导教师奖。主持国家自然科学基金委青年基金项目、科技部国家重点研发计划网络空间安全治理专项子课题、公安部第三研究所重点实验室课题等十余项，作为核心人员参与国家自然科学基金重点项目、国家重点研发、上海市科技创新行动计划等。担任NeurIPS、ICLR、AAAI、ICML等国际知名会议的Area
  Chair/TPC成员，以及IEEE JSAC、ToN、TMC、TIFS等十余CCF-A类期刊的审稿人。

  教育背景

  2016.08 - 2020.12, University of Miami, PhD

  工作履历

  2021.07 - 2024.11，上海交通大学，长聘教轨助理教授

  2024.12 - 至今，上海交通大学，长聘教轨副教授

  教授课程

  图与网络 (MATH6010)'
