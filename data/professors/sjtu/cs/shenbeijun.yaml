  ：https://base.sjtu.edu.cn/~bjshen/paper.html\n资助项目\n近期项目：\n· 国家自然科学基金重点项目《大规模高质量软件缺陷库的自动构建与应用》2022-2027\n\
  · 国家重点研发计划课题《面向低代码开发的模板挖掘方法与模板库技术》2023~2026\n· 校企合作项目《基于多模态大模型的虚假材料智能检测》2026\n·\
  \ 校企合作项目《基于大模型的C到Rust自动翻译技术》2024~2025\n·\t校企合作项目《面向BMS的代码大模型技术》2024~2025\n·\t国家自然科学基金重点项目《泛在系统软件的软硬件协同设计方法及其结构模型和运行机理》2021-2025\n\
