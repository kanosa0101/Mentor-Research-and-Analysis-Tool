bio_raw: "个人简介\n中国首位IEEE授证的软件开发专家（CSDP），IEEE国际软件工程知识体系SWEBOK第三版联合主编，国际软件测试认证委员会高级专家组成员，全国软件工程专委委员。研究方向：软件工程、LLM软件技术。在国际著名学术会议及国内一级学报等刊物上发表论文200余篇，主持国家自然科学基金、国际合作及企业联合技术攻关等各类项目40余项，负责建设校企联合实验室2项，并参与国家973、\n\
  国家自然科学基金重点项目\n及国家重点研发计划等重大科研项目。负责了上海市重点课程《软件工程原理与实践》和上海市精品课程《软件工程概论》的建设。被授为霍英东教育基金会高等院校青年教师奖、上海市教育教学成果二等奖、上海市十大IT精锐提名奖、ACM\
  \ SIGSOFT Distinguished Paper。\n教育背景\n中国科学院软件所 博士\n教授课程\n《软件工程原理与实践》，本科课程\n《高级软件开发与管理》，研究生课程\n\
  论文发表\n近期10篇代表论文：\nRethinking Code Complexity Through the Lens of Large Language\
  \ Models\nChen Xie, Yuling Shi, Xiaodong Gu,\nBeijun Shen*\nICML, Seoul, South Korea,\
  \ 6-11 July, 2026\n(CCF-A)\nNeuron-Guided Interpretation of Code LLMs: Where, Why,\
  \ and How?\nZhe Yin, Xiaodong Gu,\nBeijun Shen*\nFSE 2026, Montreal, Canada, 5 -\
  \ 9 July 2026\n(CCF-A)\nBeyond Language Boundaries: Uncovering Programming Language\
  \ Families for Code Language Models\nShangbo Yun, Xiaodong Gu, Jianghong Huang,\
  \ and\nBeijun Shen*\nFSE 2026, Montreal, Canada, 5 - 9 July 2026\n(CCF-A)\nEvoC2Rust:\
  \ A Skeleton-guided Framework for Project-Level C-to-Rust Translation\nChaofan Wang,\
  \ Tingrui Yu,\nBeijun Shen*\n, Jie Wang, Dong Chen, Wenrui Zhang, Yuling Shi, Chen\
  \ Xie, and Xiaodong Gu.\nICSE 2026 SEIP. Rio de Janeiro, Brazil, April 12-18, 2026\n\
  (CCF-A)\nAnti-Adversarial Learning: Desensitizing Prompts for Large Language Models\n\
  Xuan Li, Zhe Yin, Xiaodong Gu, and\nBeijun Shen*\nAAAI 2026. Singapore, Jan 20 -\
  \ 27, 2026\n(CCF-A)\nSynthetic Malware at Scale: Malicious Code Generation with\
  \ Code Transplanting\nGuangzhan Wang, Diwei Chen, Xiaodong Gu*, Yuting Chen,\nBeijun\
  \ Shen\nIEEE Transactions on Software Engineering (TSE), Nov. 2025\n(CCF-A)\nLongCodeZip:\
  \ Compress Long Context for Code Language Models\nYuling Shi, Yichun Qian, Hongyu\
  \ Zhang,\nBeijun Shen\n, Xiaodong Gu*\nASE 2025, November 16-20, Seoul, South Korea\n\
  (CCF-A)\nTransplant Then Regenerate: A New Paradigm for Text Data Augmentation\n\
  Guangzhan Wang, Hongyu Zhang,\nBeijun Shen\n, Xiaodong Gu*\nEMNLP 2025, Suzhou,\
  \ China, November 5–9, 2025\n(CCF-B)\nInfeRE: Step-by-Step Regex Generation via\
  \ Chain of Inference\nShuai Zhang, Xiaodong Gu, Yuting Chen,\nBeijun Shen*\nASE,\
  \ Kirchberg, Luxembourg, Sept. 11-15, 2023\n(CCF-A)\nLejacon: A Lightweight and\
  \ Efficient Approach to Java Confidential Computing on SGX\nX. Miao, Z. Lin, S.\
  \ Wang, L. Yu, S. Li, Z. Wang, P. Nie, Y. Chen*,\nB. Shen\n, H. Jiang\nICSE, Melbourne,\
