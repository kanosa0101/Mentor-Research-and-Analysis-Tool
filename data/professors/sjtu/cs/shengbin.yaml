bio_raw: '个人简介

  盛斌，现任上海交通大学计算机学院计算机应用研究所、人工智能教育部重点实验室教授、博士生导师，主持国家自然科学基金青年科学基金项目（

  A

  类），担任上海市代谢相关疾病智慧防控“一带一路”国际联合实验室副主任，入选国家级高层次青年人才

  。

  专注于虚拟现实、

  计算机图形学与智能医学的交叉领域研究，任中国仿真学会医疗仿真专委会副主任，国际期刊

  Virtual Reality and Intelligent Hardware

  副编辑；曾任

  ISBI2020

  、

  MICCAI2022-2024

  国际眼底影像人工智能读片竞赛主席。近五年以（共同）第一作者

  /

  通讯作者身份，在

  JAMA

  、

  Nature Medicine

  、

  Lancet Digital Health

  、

  IEEE TPAMI

  及

  IJCV

  等期刊发表论文

  69

  篇。先后荣获上海市科技进步奖特等奖、一等奖；两度入选世界人工智能大会

  SAIL

  奖（卓越人工智能引领者奖）；获国际图形学学会（

  Computer Graphics Society

  ）杰出贡献奖；研究成果入选全国医工结合科技创新十大进展、中国

  2024

  年度重要医学进展（中国医学科学院颁发）、眼科学中国十大原创进展等。作为负责人承担国家重大专项项目课题、国家自然科学基金、上海市科委等各类科研项目

  20

  余项。

  教育背景

  华中科技大学

  ，

  计算机科学与技术

  (

  计算机学院）

  ，

  本科，

  2004

  华中科技大学

  ，

  英语

  (

  外语学院），

  本科

  (

  双学位

  )

  ，

  2004

  澳门大学，

  计算机与信息科学系（科技学院）

  ，

  硕士，

  200

  7

  香港中文大学

  ，计算机科学与工程系，

  博士，

  20

  11

  工作履历

  201

  1-2013

  上海交通大学，计算机科学与工程系，讲师

  20

  14

  -20

  20

  上海交通大学，计算机科学与工程系，副教授

  20

  20

  至今

  上海交通大学，计算机科学与工程系

  /

  计算机学院，教授

  教授课程

  计算机图形学

  (CS3962)

  虚拟现实与增强显示技术

  (CS3327)

  计算机视觉（强化）

  (CS3336)

  计算机动画设计与数据可视化

  (CS7306)'
