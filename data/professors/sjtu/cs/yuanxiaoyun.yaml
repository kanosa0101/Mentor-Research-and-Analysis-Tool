bio_raw: '个人简介

  袁肖赟，上海交通大学人工智能研究院长聘教轨副教授。2014年获得中国科学技术大学电子信息科学与技术学士学位，2020年获香港科技大学电子及计算机工程博士学位。2020年11月加入清华大学电子工程系从事博士后研究，期间入选清华大学“水木学者”和第七届中国科协青年人才托举工程（2021）。2024年11月加入上海交通大学。目前已主持中国科协青年人才托举工程项目（2021-2023）、国家自然科学基金面上项目（2023-2026）及中国博士后科学基金面上项目等多项科研项目。

  主要从事计算成像与人工智能的交叉研究，致力于通过协同设计光电硬件系统与智能软件算法，突破传统光学元件与传感器的性能限制，实现高维环境光场信息的高保真重建。构建了非结构阵列传感器成像系统，提出了光-电联合学习计算成像架构，并探索了动态对象跨时空映射融合等方法，为解决阵列光场成像系统规模扩展与成像效率受限的难题提供了创新性方案。近5年，在Nature
  Biomedical Engineering (ESI高被引)、Nature Communications、Light: Science & Applications
  (封面文章)、IEEE TPAMI、CVPR、ICCV等顶级期刊和会议上发表论文10余篇，并授权发明专利18项（含美国专利4项）。

  在产业化方面，与北京拙河科技有限公司合作，基于非结构阵列传感器成像技术，成功研制并量产了亿像素级阵列计算摄像机，广泛应用于智慧城市、海关缉私、应急管理、生态环保等领域，并在2022年冬奥场馆、南京长江生态保护、北京西站等数项目中成功落地，相关成果获2021年度北京市技术发明一等奖（排5）。合作开发的光声脑成像系统在国际上首次实现了成年人脑功能信号的动态光声成像，研究成果获SPIE
  Photonics West 2021最佳论文奖。

  教育背景

  香港科技大学，电子及计算机工程博士，2020

  中国科学技术大学，电子信息科学与技术学士，2014

  工作履历

  上海交通大学计算机学院人工智能研究院，副教授，2024-至今

  清华大学电子工程系，博士后，2020-2022

  教授课程

  计算机科学系统导论 （Introduction to Computer Science），2025秋季学期

  论文发表

  A modular hierarchical array camera. Light: Science & Applications, 2021.（封面文章）

  Massively parallel photoacoustic computed tomography of human brain function. Nature
  Biomedical Engineering, 2022. （ESI高被引）

  Training large-scale optoelectronic neural networks with dual-neuron optical-artificial
  learning. Nature Communications, 2023.（Editors’ Highlights）

  A multichannel optical computing architecture for advanced machine vision. Light:
  Science & Applications, 2022.（Editors’ Highlights）

  High-speed three-dimensional photoacoustic computed tomography for preclinical research
  and clinical translation. Nature Communications, 2021.

  Degradation-Modeled Multipath Diffusion for Tunable Metalens Photography. International
  Conference on Computer Vision (ICCV), 2025.

  GBR: Generative Bundle Refinement for High-fidelity Gaussian Splatting with Enhanced
  Mesh Reconstruction. IEEE Transactions on Circuits and Systems for Video Technology
  (TCSVT), 2025.

  Photonic neuromorphic architecture for tens-of-task lifelong learning. Light: Science
  & Applications, 2023.

  资助项目

  （主持）中国自然科学基金委员会（NSFC），面上项目，十亿像素编码计算智能成像研究，在研（2023-2026），62271283

  （主持）中国科学技术协会，第七届中国科协青年人才托举工程，已结题（2021-2023），2021QNRC001

  （主持）启元实验室青年创新基金前沿探索项目，在研（2023-2025）

  （主持）中国博士后科学基金第71批面上资助，已结题，2022M711874

  获奖信息

  2021年度北京市技术发明奖一等奖，非结构光场智能成像关键技术与装备（5/7）

  第七届中国科学技术协会青年人才托举工程（人工智能学会），2021-2023，No.YESS20210168

  国际光学工程学会（SPIE）会议Photons Plus Ultrasound: Imaging and Sensing 2021，最佳论文奖

  学术服务

  IEEE MMSP 2025，Thematic School Chair

  IEEE ICASSP 2024, Poster session (IVMSP-P17) chair

  IEEE ICASSP 2024 Educational short course: Practical Guide to Computational Imaging:
  From Basics to Brilliance，Course speaker

  ACM MM 2021 GigaVision workshop, Co-organizer

  IEEE ICIP 2021 GigaVision workshop, Co-organizer

  IEEE IROS 2024 Robotic Construction Challenge Co-organizer'
