bio_raw: '个人简介

  潘理，

  博士，长聘教授，专业技术二级

  ，博士生导师。

  2002

  年

  8

  月于上海交通大学获通信与信息系统专业博士学位。

  2002

  年至今在上海交通大学电子信息与电气工程学院电子工程系、网络空间安全学院

  \

  网络安全技术研究院、计算机学院等从事教学、科研工作，历任讲师、副教授、研究员等。

  2008

  年

  1

  月至

  7

  月于美国

  IBM Research T.J. Watson Center

  访问工作，

  2014

  年

  1

  月至

  2015

  年

  1

  月于美国

  Boston University

  访问工作。现任信息内容分析技术国家工程研究中心副主任、网络空间治理研究中心主任，网络信息安全管理与服务教育部工程研究中心常务副主任，中国计算机学会杰出会员，中文信息学会大搜索专委会副主任委员，上海市犯罪学学会副会长等。

  长期从事网络空间安全、大数据挖掘、网络通信等领域的科研和教学工作，以及与管理、传播、法学等专业在网络空间治理领域的交叉研究工作。当前主要研究方向为网络空间内容治理，大数据与人工智能安全，基于大模型的社会计算等。作为首席专家主持国家重点研发计划项目

  2

  项，并先后承担了国家

  973

  计划课题、

  863

  计划项目、国家科技支撑计划课题、国家发改委专项项目、国家自然科学基金、军队装备研发等国家级科研项目

  10

  余项，成果形成多项应用系统和产品，包括网络安全隔离交换系统，群体行为分析系统，司法大数据态势分析系统等，已在电子政务、网信、司法等领域应用于数百家单位。在国内外学术期刊及会议发表论文

  100

  余篇，包括

  IEEE T Cybernetics, IEEE TKDE

  ，

  IEEE TNNLS

  ，

  IEEE TSC

  ，

  Computers & Security

  等国际知名刊物，以及

  KDD

  ，

  ACL

  ，

  CVPR

  等著名国际会议，获得

  IEEE DSC

  国际网络空间数据科学会议最佳论文奖

  2

  项，获得国家发明专利授权

  20

  余项，参编行业标准

  10

  余项，出版《社交网络群体行为分析》》、《操作系统教程》等专著教材

  8

  本。获得世界互联网大会领先科技奖

  1

  项、上海市科技进步二等奖

  1

  项，密码科技进步三等奖（省部级）

  1

  项，以及上海市优秀技术带头人，上海市青年科技启明星，上海市人才发展基金等荣誉称号。

  主讲《网络空间安全理论与技术基础》致远荣誉博士生课程、《计算机科学导论》国家一流本科生课程等，

  3

  次获得上海交通大学优秀教师奖，上海市计算机学会教学成果一等奖

  1

  项，上海交通大学教学成果一等奖

  1

  项，

  2019

  年获上海交通大学

  “

  教书育人奖

  ”

  。已培养硕士、博士毕业生

  100

  余人，十余人次获得各级优秀毕业生称号。担任国内外十多项知名学术刊物和会议的审稿人、专刊编辑、

  TPC

  成员等，作为教育部、科技部、公安部、国家自然基金委，以及上海、浙江、广东、云南等省市的专家参与了各类科技评审工作。

  教育背景

  1996年于西安电子科技大学计算机通信专业（直升），获得学士学位，电子工业部优秀毕业生

  1999年于南京邮电大学计算机应用专业（直升），获得硕士学位，江苏省优秀硕士论文

  2002

  年

  8

  月于上海交通大学通信与信息系统专业，获得博士学位。

