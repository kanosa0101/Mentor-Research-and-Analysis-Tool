bio_raw: '个人简介

  吴小宝博士，上海交通大学计算机学院助理教授、博士生导师。 博士毕业于新加坡南洋理工大学，硕士和本科毕业于清华大学和东南大学。 曾任加州大学圣塔芭芭拉分校访问学者，南洋理工大学博士后研究员。
  主要研究方向包括人工智能、自然语言处理、大语言模型等。 在NeurIPS、ICML、ICLR、ACL、EMNLP等国际顶级会议与期刊上累计发表论文40余篇， 长期担任ACL、EMNLP等国际会议领域主席，一作论文获ACL领域主席奖。

  教育背景

  2021 - 2024 新加坡南洋理工大学 博士

  2018 - 2021 清华大学 硕士

  2014 - 2018 东南大学 本科

  工作履历

  2026 - 至今 上海交通大学 长聘教轨助理教授

  2025 - 2026 新加坡南洋理工大学 博士后研究员

  论文发表

  1. AntiLeakBench: Preventing Data Contamination by Automatically Constructing Benchmarks
  with Updated Real-World Knowledge.

  Xiaobao Wu

  , Liangming Pan, Yuxi Xie, Ruiwen Zhou, Shuai Zhao, Yubo Ma, Mingzhe Du, Rui Mao,
  Anh Tuan Luu, and William Yang Wang. Annual Meeting of the Association for Computational
  Linguistics (ACL), 2025.

  Senior Area Chair Highlights Award

  2. FASTopic: Pretrained Transformer is a Fast, Adaptive, Stable, and Transferable
  Topic Model.

  Xiaobao Wu

  ,

  Thong Nguyen, Delvin Ce Zhang, William Yang Wang, and Anh Tuan Luu. Neural Information
  Processing Systems (NeurIPS), 2024

  3. AKEW: Assessing Knowledge Editing in the Wild.

  Xiaobao Wu

  , Liangming Pan, William Yang Wang, and Anh Tuan Luu. Conference on Empirical Methods
  in Natural Language Processing (EMNLP), 2024

  4. Are LLMs Good Zero-shot Fallacy Classifiers? Fengjun Pan,

  Xiaobao Wu

  , Zongrui Li, and Anh Tuan Luu. Conference on Empirical Methods in Natural Language
