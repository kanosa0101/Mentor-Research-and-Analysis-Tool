bio_raw: '个人简介

  2

  022

  年毕业于上海交通大学，获博士学位。

  2

  024

  年加入上海交通大学网络空间安全学院担任助理研究员，主要研究方向为隐私保护、人工智能安全、数据流通共享安全等。主持/参与十三五

  /

  十四五国家重点研发计划、国家自然科学基金、校企合作项目等项目十余项，近年来在

  IEEE

  TDSC、IEEE

  TIFS

  、

  IJCAI

  、

  Information Sciences

  等期刊

  /

  会议上发表论文二十余篇，申请发明专利二十余项。

  论文发表

  [1] Peng Tang, Xiaoyu Zhu, et al. “FLAD: Byzantine-Robust Federated Learning Based
  on Gradient Feature Anomaly Detection,” in IEEE Transactions on Dependable and Secure
  Computing, 2025. (CCF-A)

  [2] Peng Tang, Xin Li, Yuxing Chen, Weidong Qiu, Haochen Mei, Allison Holmes, Fenghua
  Li, and Shujun Li. “A Comprehensive Study on GDPR-Oriented Analysis of Privacy Policies:
  Taxonomy, Corpus and GDPR Concept Classifiers,” IEEE Transactions on Dependable
  and Secure Computing, 2026.

  (CCF-A)

  [3] Guowei Ling, Peng Tang*, Jinyong Shan, Liyao Xiang, and Weidong Qiu. “Faster
  Than Ever: A New Lightweight Private Set Intersection and Its Variants,” Network
  and Distributed System Security (NDSS) Symposium 2026.

  (CCF-A)

  [4] Guowei Ling, Peng Tang*, Fei Tang, Shifeng Sun, Jinyong Shan, Liyao Xiang, Weidong
  Qiu. “Privacy-Preserving Authorized Set Matching via Dishonest Majority Multiparty
  Computation, ” IEEE Transactions on Dependable and Secure Computing, 2025.

  (CCF-A)

  [5] Ke Hu, Liyao Xiang, Peng Tang*, Weidong Qiu. “FedTopo: Topology-Informed Representation
  Alignment in Federated Learning under Non-IID Conditions,” Proceedings of the AAAI
  Conference on Artificial Intelligence 26 (AAAI 2026). (CCF-A)

  资助项目

  [1]

  上海市科技创新行动计划，场景驱动的联邦学习性能提升技术研究与验证，

  2024.10-2025.09

  ，项目负责人

  [2]

  重点研发计划，面向数据可信确权与交易的安全保障技术，

  2023.12-2026.11

  ，子课题负责人

  学术服务

  IEEE PCDS 2024、2025，TPC'
