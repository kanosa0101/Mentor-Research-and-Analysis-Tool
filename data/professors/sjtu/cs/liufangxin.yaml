bio_raw: '个人简介

  刘方鑫，上海交通大学计算机科学与工程系助理教授、博士生导师，兼任上海期智研究院研究员。

  主要研究方向包括计算机体系结构与设计自动化、大模型加速与AI编译优化等。

  以第一或通讯作者身份在HPCA、ISCA、MICRO、ASPLOS、PPoPP等国际顶级会议和期刊上发表论文60余篇，其中CCF-A类论文40余篇，体系结构四大顶会论文20余篇，

  2026年入选MICRO名人堂

  。

  主持国家自然科学基金青年项目、上海市自然科学基金面上项目，以及华为、阿里巴巴、蚂蚁金服、中兴通讯、小米、OPPO、CCF-蚂蚁科研基金、CAAI-蚂蚁科研基金等十余项企业及学会合作课题。

  曾入选上海交通大学首届“吴文俊人工智能博士项目”，并担任“国智班”项目导师。研究成果入选华为奥林帕斯先锋奖（2026）、

  华为火花奖（2022）、

  中国计算机学会容错计算专委40周年代表性成果等，此外，获ISCA 2026最佳论文提名、ACM MM 2025杰出论文奖（System Theme）、DATE
  2022最佳论文奖及最佳论文提名、上海市计算机学会优秀博士论文奖（每年仅2–3人入选）、ACM上海优秀博士论文奖（每年仅2–3人入选）、上海市优秀毕业生、CCF体系结构优秀博士论文提名等奖项与荣誉。指导学生获CCFSys图计算系统设计大赛特等奖、CCFSys
  2025最佳项目海报奖及第二届集成芯片与芯粒技术开源社区大赛一等奖等荣誉。

  教授课程

  GPU计算及深度学习

  算法设计与分析(CS7310H)

  人工智能系统与优化(CS7359)

  高效人工智能：解锁未来智能计算技术'
