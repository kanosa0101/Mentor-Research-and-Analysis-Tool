bio_raw: '个人简介

  博士，研究方向主要为大数据分析、人工智能安全、车联网安全、工业互联网安全等。作为核心骨干参与多项国家863项目、973项目、国家重点研发计划项目、国家自然科学基金课题，以及多项上海市自然科学基金课题、国家重点实验室开放课题。承担了多项重要信息系统、关键基础设施系统的等级保护、安全测评工作。在国内外重要学术期刊及会议上发表SCI/EI学术论文十余篇，获得多项发明专利的授权，参与国家和行业标准/规范制定3项。'
