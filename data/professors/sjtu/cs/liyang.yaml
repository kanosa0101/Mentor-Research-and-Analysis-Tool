email: yang.li.cs@sjtu.edu.cn
bio_raw: '个人简介

  李阳，上海交通大学约翰·霍普克罗夫特计算机科学中心长聘教轨助理教授。2025年获英国曼彻斯特大学计算机科学博士学位，随后担任华为伦敦所研究科学家。长期从事多智能体强化学习、多机器人系统及博弈论研究，在ICML、NeurIPS、ICLR、CoRL、RAL等人工智能与机器人领域顶级会议及期刊发表学术论文10余篇。近期研究重点为构建大规模具身智能体系统，推动智能体在复杂现实环境中的高效推理、协同决策与群智涌现。

  教育背景

  2022年-2025年，曼彻斯特大学，博士

  2019年-2022年，中国科学院大学，硕士

  2015年-2019年，大连理工大学，学士

  工作履历

  2026年至今，上海交通大学，助理教授

  2025年，华为伦敦研究所，研究科学家'
