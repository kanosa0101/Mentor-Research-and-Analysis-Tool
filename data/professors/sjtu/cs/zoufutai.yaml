bio_raw: '个人简介

  博士，高级工程师，硕士生导师，上海交通大学网络空间安全学院教师。入选为IEEE高级会员，中国计算机学会高级会员，中国互联网协会网络空间安全方向青年专家。2005年毕业于上海交通大学，获计算机系统结构博士学位。主要研究方向为系统与软件安全、网络威胁感知、人工智能安全等。主持了国家重点研发计划“网络空间安全专项”子课题、国家242信息安全计划、公安部重点实验室开放课题以及国家电网科技计划、华为创新研究计划等多项国家、省部级项目，作为主要完成人参与了国家重点研发计划、国家自然科学基金重点项目、973/863计划等多个国家级重要项目。在国内外期刊和国际学术会议上已发表论文100多篇，其中SCI/EI检索论文80多篇，获得国家发明专利授权45项和美国发明专利授权2项，登记软件著作权30项，出版专著2本和教材2本。指导学生在国内外信息安全竞赛中多次取得优异成绩，获得6项全国信息安全竞赛一等奖，1项下一代互联网技术创新大赛网络空间安全特别奖，6项优秀指导教师奖。

  教授课程

  网络安全攻防实战技术（NIS4315），本科生专业课，2学分，秋季学期

  网络安全前沿技术（NIS8015）， 研究生专业课，2学分，秋季学期

