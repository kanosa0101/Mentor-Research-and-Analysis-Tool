bio_raw: '个人简介

  Cliff Liu is an associate professor at Shanghai Jiaotong University. He was a postdoc
  in CMU theory group and obtained his PhD from Princeton. His research is around
  sublinear algorithms, graph algorithms, and data structures. Cliff was a recipient
  of the Gordon Y.S. Wu Fellowship and NSFC Science Fund Program for Distinguished
  Young Scholars.'
