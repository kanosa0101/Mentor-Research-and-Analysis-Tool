bio_raw: '个人简介

  郑伟龙，上海交通大学计算机学院副教授，博士生导师。入选国家级高层次海外青年人才和上海市海外高层次青年人才。麻省理工学院和哈佛大学医学院麻省总医院博士后。长期从事脑认知与智能、情感计算、脑机交互、类脑计算理论与模型和人工智能等研究。主持及参与多项国家级和省部级研究项目，包括国家自然科学基金、国家重点研发项目和上海市科委重点项目等。在国际高水平会议和期刊发表研究论文120余篇，Google学术引用超万余次，单篇被引超两千次，授权国家发明专利多项。荣获IEEE
  Transactions on Autonomous Mental Development最佳论文奖、IEEE Transactions on Affective
  Computing最佳论文奖、ACM Multimedia Top Paper奖、ARC Prize 最佳论文奖、中国人工智能学会优秀博士学位论文奖、吴文俊人工智能自然科学一等奖，入选上海市浦江人才项目、小米青年学者、微软亚洲研究院铸星计划、AI华人青年学者榜单、2023和2024年全球前2%科学家年度影响力榜单。目前担任IEEE
  Transactions on Affective Computing编委、教育部脑认知科学课程群虚拟教研室副主任、中国人工智能学会脑机融合与生物机器智能专委会委员、中国图象图形学学会情感计算与理解专业委员会委员、中国康复医学会脑机接口与康复专业委员会常务委员和中国认知科学学会计算神经工程专委会委员。

  教育背景

  2012.09-2018.09 上海交通大学 计算机科学与技术 工学博士

  2008.09-2012.06 华南理工大学 信息工程 工学学士

  工作履历

  2022.1-至今 上海交通大学计算机科学与工程系 副教授

  2020.10-2021.12 美国麻省理工学院MIT脑与认知科学系 博士后研究员

  2018.10-2020.09 美国哈佛大学医学院和麻省总医院神经病学系 博士后研究员

  2016.06-2016.09 日本理化学研究所脑科学中心 访问学者

  2014.09-2015.03 西班牙巴斯克大学计算机与人工智能系 访问学者

  教授课程

  《神经网络理论与应用》、《人工智能》、《数据科学基础》

