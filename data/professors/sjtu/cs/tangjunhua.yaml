title: 副教授
email: junhuatang@sjtu.edu.cn
bio_raw: '个人简介

  1994

  年本科毕业于上海交通大学通信工程专业，

  1999

  年获该校通信与信息系统博士学位，期间

  1996-1997

  年公派日本大阪大学留学。

  1999

  年至

  2007

  年期间先后在新加坡南洋理工大学担任博士后研究员（Research Fellow)、讲师(Teaching Fellow)和助理教授(Assistant Professor)，以及在朗讯科技新加坡公司任技术顾问(Technical
  Consultant)。

  2005

  年至今任职于上海交通大学，期间

  2011-2012

  年作为访问学者公派赴美国南加州大学访学。研究方向包括新型通信网络及其安全、

  5G

  安全、大数据安全及人工智能技术及应用等。先后主持国家自然科学基金项目两项，参与多项国家级重点项目。获

  2022

  年上海交通大学教书育人奖。

  教育背景

  l

  1994-9

  至 1999-1, 上海交通大学, 通信与信息系统, 博士

  l

  1996-3

  至 1997-2, 日本大阪大学, 工学部, 交换研究生

  l

  1990-9

  至 1994-7, 上海交通大学, 通信工程, 学士

  工作履历

  l

  2005-12

  至 今, 上海交通大学, 电子信息与电气工程学院, 副教授

  l

  2011-08

  至 2012-07, 美国南加州大学, 电子工程系, 访问学者

  l

  2005-04

  至 2005-12, 新加坡南洋理工大学, 电子工程系, 助理教授 ( Assistant Professor)

  l

  2002-01

  至 2005-03, 新加坡南洋理工大学, 电子工程系, 讲师 (Teaching Fellow)

  l

  2000-11

  至 2001-12, 朗讯科技新加坡公司, 亚太技术支持中心, 技术顾问（Technical Consultant）

  l

  1999-4

  至 2000-11, 新加坡南洋理工大学，博士后（Research Fellow）

  教授课程

  l

  信息论基础

  l

  安全开发模型与安全编程

  论文发表

  [1] Jiajin Yang; Junhua Tang; Jianhua Li; Futai Zou; Linsen Li ; Differential Defense
  AgainstDistributed Timing Attack for Privacy-Preserving Information Centric Network,
  2022 IEEEInternational Conference on Communications Workshops (ICC Workshops), Seoul,
  South Korea, 2022-5-16至2022-5-20 (会议论文)

  [2] Xuewei Hou; Lixing Chen; Junhua Tang; Jianhua Li ; Multi-Agent Learning Automata
  for Online Adaptive Control of Large-Scale Traffic Signal Systems, GLOBECOM 2022
  - 2022 IEEE Global Communications Conference, Rio de Janeiro, Brazil, 2022-12-4至2022-12-8
  (会议论文)

  [3] Xuewei Hou; Lixing Chen; Junhua Tang; Jianhua Li; Wu Yang ; Hierarchical Swarm
  Learning

  for Edge-Assisted Collaborative Vehicle Trajectory Prediction, ICC 2023 - IEEE International
  Conference on Communications, Rome, Italy, 2023-5-28至2023-6-1 (会议论文)

  [4] Jiajin Yang; Lixing Chen; Junhua Tang; Jianhua Li; Wu Yang ; Swarm Reinforcement
  Learning for Collaborative Content Caching in Information Centric Networks, ICC
  2023 - IEEE International Conference on Communications, Rome, Italy, 2023-5-28至2023-6-1
  (会议论文)

  [5] Xin Song; Lixin Chen; Junhua Tang; Jianhua Li; Yang Bai; Wu Yang ; Adaptively
  Compressed Swarm Learning for Distributed Traffic Prediction over IoV-Web3.0, 2024
  International Joint Conference on Neural Networks (IJCNN), Yokohama, Japan, 2024-6-30至2024-7-5
  (会议论文)

  资助项目

  l

  国家自然科学基金面上项目，“基于生物特征的自组织信息网络组网技术研究”， 项目负责人， 2011 – 2013

  l

  国家自然科学基金青年基金，“复杂通信网络的自组织特征及其模型研究”，项目负责人， 2008 – 2010

  l

  国家自然科学基金重点项目，“基于内容的新型通信网络主动防御基础理论和方法研究”，合作单位项目负责人，

  2019-2023

  l

  国家自然科学基金委员会, 面上项目, 62471301, 工控网络攻击链建模与主动防御, 2025-01-01 至2028-12-31,  参与

  l

  国家自然科学基金重点项目，“无线自组织网络安全特性基础理论研究”，项目主要参与人员， 2010 – 2013

  l

  国家863项目，“无线自组网实时入侵检测和主动防护机制研究”, 项目骨干， 2007 – 2009

  获奖信息

  l

  2022年上海交通大学教书育人奖三等奖

  l

  上海交通大学 2007-2008“三-八” 红旗手

  l

  2009年上海交通大学晨星青年学者奖励'
