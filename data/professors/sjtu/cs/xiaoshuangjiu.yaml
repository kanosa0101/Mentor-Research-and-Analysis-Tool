bio_raw: '个人简介

  上海交通大学计算机学院空间智能软件研究所DALAB实验室副教授，博士生导师。研究领域包括计算机图形AIGC、动画仿真、数字孪生、自然人机交互、VR/AR技术、数据可视化等。

  教育背景

  2002年毕业于西北工业大学航空宇航制造工程系，获得CAD/CAM/CAPP专业工学博士学位。

  工作履历

  2002-2004年，上海交通大学计算机科学与工程系博士后

  2004-2007年，上海交通大学软件学院，讲师

  2007年至今，上海交通大学软件学院，副教授

  教授课程

  SE3306-计算机图形学

  EI6703-高级计算机图形学

  人机界面与交互

  数字媒体技术基础

  论文发表

  学术服务

  中国图学学会图学发展专委会主任秘书'
