bio_raw: '个人简介

  熊国钧，上海交通大学计算机学院长聘教轨副教授。2024年博士毕业于纽约州立大学石溪分校，随后在哈佛大学计算机系从事博士后研究。其研究聚焦于AI智能网络决策与结构化强化学习，主要研究方向包括不确定环境下的在线序列决策、随机优化与控制，以及面向网络化系统的分布式优化与多智能体强化学习。他致力于将结构化强化学习方法应用于真实复杂系统，特别关注其在公共卫生与社会公益（AI
  for Social Good）等领域的潜在影响。已在相关领域顶级会议与期刊（包括NeurIPS、ICML、ICLR、AAAI、AAMAS、IEEE INFOCOM、ACM
  MobiHoc、IEEE/ACM TON、IEEE TSP等）发表第一作者论文20余篇。曾获得2022年度中国国家优秀海外留学生奖以及2024年度纽约州立大学杰出研究奖。'
