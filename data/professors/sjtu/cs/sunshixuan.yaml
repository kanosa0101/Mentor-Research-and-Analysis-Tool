bio_raw: '个人简介

  孙世轩，上海交通大学计算机学院长聘教轨副教授、博士生导师。2020年于香港科技大学计算机系获博士学位，2020年至2023年在新加坡国立大学计算学院任博士后研究员，2023年起加入上海交通大学。2022年先后入选国家级高层次青年人才计划和上海市青年领军人才计划。长期从事并行计算、大数据系统、图计算和机器学习系统研究，在SIGMOD、VLDB、ASPLOS、SC等系统与体系结构顶级会议发表论文30余篇。

  详细信息请参看个人主页：

  https://shixuansun.github.io/

  教育背景

  2015.09～2020.02，香港科技大学 计算机系，博士

  2011.09～2014.03，同济大学 软件学院，硕士

  2007.09～2011.06，同济大学 软件学院，学士

  工作履历

  2023.06至今，上海交通大学 计算机学院，长聘教轨副教授

  2020.03～2023.05，新加坡国立大学 计算学院，博士后研究员

  2014.07～2015.07，微软，软件研发工程师

  教授课程

  CS1501 程序设计语言与方法（C++）

  CS2310 操作系统'
