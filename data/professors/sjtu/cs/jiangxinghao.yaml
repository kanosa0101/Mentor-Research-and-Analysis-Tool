bio_raw: '个人简介

  蒋兴浩，

  2

  003

  年毕业于浙江大学信息与电子工程学系，获工学博士学位。现为上海交通大学计算机学院（网络空间安全学院）长聘教授、博士研究生导师，信息内容分析技术国家工程实验室学术带头人。曾任上海市信息安全综合管理技术研究重点实验室副主任，曾于

  2011

  年在美国新泽西理工大学（

  New Jersey Institute of Technology

  ）电气与计算机工程系国家公派访问留学一年。

  研究工作聚焦多媒体内容安全、人工智能安全，主要从事人工智能对抗攻防、数字视频篡改检测被动取证、数字视频内容分析与理解、模式识别

  /

  机器学习及其在数字媒体信息安全领域的应用研究。

  主持了国家重点研发计划项目、国家

  863

  计划项目、多项国家自然科学基金项目、上海市科技创新国际合作项目等

  30

  余项国家

  /

  省部级科研任务

  ，推动了

  “数字媒体内容安全”的特色研究方向的发展，相关成果在政府职能部门、互联网企业得到应用，取得良好的社会和经济效益。

  已在国内外学术刊物和会议上发表

  /

  录用学术论文

  200

  余篇，包括

  IEEE TDSC

  、

  TIFS

  、

  TMM

  、

  TCSVT

  等

  CCF A/B

  国际学术期刊和

  ACM MM

  、

  I

  CASSP

  、

  ICME

  等

  CCF A/B

  国际学术会议

  。

  授权国家技术发明专利

  46

  项，国际发明专利（美国）

  1

  项，获得软件著作权登记

  6

  项。荣获上海市科技进步一等奖

  1

  项（第一完成人），中国图象图形学学会科技进步奖一等奖

  1

  项（第一完成人），教育部科技进步一等奖

  1

  项，上海市科技进步二等奖

  2

  项。

  入选国家高层次科技创新领军人才计划、

  获得上海市优秀技术带头人、教育部新世纪优秀人才、上海市青年科技启明星

  A

  类、上海市高校优秀青年教师专项等人才计划支持。参与编写教材著作

  4

  部；曾指导本科生获全国信息安全竞赛一等奖、国家大学生创新实践

  Intel

  专项等。曾荣获上海交通大学第二届“凯原”十佳教师、上海交通大学优秀教师、三育人先进个人等荣誉。

  教授课程

  承担本科生学位课程

  “

  计算机通信网（

  A

  类）

  ”

  和研究生专业课程

  “PKI

  技术及应用

  ”

  等教学工作。

