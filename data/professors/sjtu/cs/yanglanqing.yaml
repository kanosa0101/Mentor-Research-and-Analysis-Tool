bio_raw: '个人简介

  杨岚青，上海交大计算机学院助理研究员，主要研究方向为物联网、人工智能、智慧感知，发表CCF A类论文10余篇，CCFB类论文近10篇，多篇文章发表在USENIX
  SECURITY、NSDI、MOBICOM、UBICOMP、IEEE INFOCOM、TMC等国际知名期刊会议上。曾获2021世界人工智能大会优秀论文提名奖、上海市优秀毕业生。主持国自然基金1项，主持上海市自然科学基金面上项目一项。

  教育背景

  2017-2023， 上海交通大学， 计算机科学与技术专业

  2013-2017， 电子科技大学， 软件工程专业

  工作履历

  2024年至今， 上海交通大学计算机学院助理研究员

  教授课程

  《移动计算与智能感知》 研究生课程

  《计算机网络（D类）》    本科生课程

