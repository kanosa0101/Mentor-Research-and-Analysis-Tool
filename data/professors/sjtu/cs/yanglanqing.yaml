  20万元, 在研, 主持

  [3] 国家自然科学基金委员会，面上项目，82571164，基于多模态特征嵌入与融合的病损图像分析提升口腔潜在恶性疾患诊断效能的可解释性研究，2026-01-01至2029-12-31，49万元，在研，参与

