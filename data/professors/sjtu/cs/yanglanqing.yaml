  资助项目

  [1] 国家自然科学基金委员会，青年科学基金项目（C类）[原青年科学基金项目]，62502303，感知受限场景下面向移动物联终端的电磁感知关键技术研究，2026-01-01至2028-12-31，30万元，在研，主持

