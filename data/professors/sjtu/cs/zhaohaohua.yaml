bio_raw: '个人简介

  长期致力于机器学习与计算机视觉领域的前沿研究，主要研究方向包括机器学习、计算机视觉、类脑计算与深度学习等前沿领域。在多模式神经网络人类动作识别、稀疏编码图像去噪及跨视角步态识别等方向，已在国际期刊和会议上发表多篇学术论文。

  教育背景

  博士：上海交通大学（2021）

  硕士：上海交通大学（2012）

  本科：华南理工大学（2009）

  工作履历

  2022年 至今 上海交通大学计算机系

  教授课程

  工程实践与科技创新II——基于机器学习的图像处理（

