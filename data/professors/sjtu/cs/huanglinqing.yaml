bio_raw: '个人简介

  黄林庆，博士，上海交通大学计算学院（网络空间安全学院、密码学院）助理研究员、博导，中国图象图形学会-数字媒体取证与安全专委会委员。入选 2024 年上海市白玉兰人才计划-浦江项目（紧缺急需类），主持国家自然科学基金-青年项目（C类），上海市自然科学基金-面上项目，横向开发课题，医工交叉研究基金等各类项目若干。聚焦人工智能安全及应用、低质数据挖掘与学习、遥感影像智能解译、对抗性机器学习等方面的研究。近五年，先后在
  CVPR、IEEE TCYB、TNNLS、TCSVT、TSMC-S、TIM、TAI、INFFUS、PR、SCIS、KBS、MIR、EAAI、NEUCOM、IJAR、ICME、ICASSP、PAKDD、ICIP、SMC、IGARSS
  等国内外知名期刊和学术会议上发表论文 40 余篇（其中 IEEE 汇刊论文 13 篇），此外 2 篇文章入选了 ESI 高被引论文，申请国家发明专利 10 余项。相关研究成果得到了欧洲科学院院士、IEEE
  Fellow 等国内外知名学者的持续关注和高度评价。担任期刊: 中国工程院院刊

  《工程

  ·信息与电子工程（英文）》（

  ENGINEERING Information Technology & Electronic Engineering)、Intelligence & Robotics
  与 Digital Twins and Applications 的青年编委、会议: ICASSP 2026、IJCNN 2025/2026/2027 的 Area
  Chair、会议: IEEE SMC 2025 的 Session Chair、IEEE TPAMI/TDSC/TCYB/TFS/TNNLS/TSMC-S/TMM/TCSVT、MIR、《电子学报》、《计算机工程》、AAAI
  2026/2027、IJCAI 2026、ACMMM 2025/2026 等国内外知名期刊与学术会议的审稿人。指导本科生参加全国大学生信息安全竞赛-作品赛，获决赛二等奖
  1 项。

  工作履历

  2024.02 至今，上海交通大学，助理研究员、博导

  教授课程

  工科创 II-可信人工智能技术与应用实践（大二, 春季学期）

