bio_raw: '个人简介

  长期从事公钥密码学、信息安全等领域研究，主持或参与包括国家自然科学基金重大研究计划、国家十五863计划、国家自然科学基金面上等纵向/横向项目30余项，发表论文30余篇。目前主要研究兴趣为后量子密码及其高性能实现与迁移、秘密分享、安全多方计算。

  教育背景

  2000/09 至 2003/01, 上海交通大学, 计算机系统结构, 工学硕士

  1996/09 至 2000/07, 西安电子科技大学, 计算数学及其应用软件, 理学学士

  工作履历

  2003/03 至今 上海交通大学

  教授课程

  数据结构'
