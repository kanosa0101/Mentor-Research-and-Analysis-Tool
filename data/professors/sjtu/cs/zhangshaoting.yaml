bio_raw: '个人简介

  上海交通大学计算机学院清源研究院执行院长，曾任美国北卡罗莱纳大学终身教职、浦江实验室智慧医疗中心主任等职务。其研究成果屡次获得顶级会议的青年科学家奖和最佳论文奖、美国橡树岭大学联合会青年教授奖等。主导研发全球首个医疗多模态基础模型群“浦医”，旨在为“跨领域、跨疾病、跨模态”的AI医疗应用提供开源的能力支持。发表论文200余篇，总引用近3万次，H-Index
  82。入选国家高层次人才、上海市青年科技杰出贡献奖等，担任医学图像分析顶会IPMI’25及计算机视觉顶会CVPR’26程序委员会主席等职位。'
