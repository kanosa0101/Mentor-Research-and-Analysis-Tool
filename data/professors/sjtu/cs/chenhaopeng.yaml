bio_raw: '个人简介

  上海交通大学计算机学院空间智能软件研究所数据服务实验室副教授，博士生导师。从事数据服务、高性能数据库系统、边缘计算、图计算等领域的研究。

  教育背景

  1999年4月和2001年12月分别于西北工业大学计算机科学与工程系获计算机应用专业工学硕士和计算机软件与理论专业工学博士学位。

  工作履历

  2002年3月进入上海交通大学计算机科学与技术博士后流动站工作，2004年3月博士后出站在上海交通大学软件学院和计算机学院任教至今，其间于2009年12月至2010年12月，派赴美国佐治亚理工学院（Georgia
  Institute of Technology）访问一年。

  教授课程

  SE2321-互联网应用开发技术

  SE3353-应用系统体系架构

  论文发表

  Lang X, Sun L, Huang P, et al. Incentivizing Cooperation for Handover Strategies
  in LEO Constellations via Fairness-guided MARL[J]. ACM Transactions on Internet
  Technology, 2025.

  Sun L, Huang P, et al. D-CHO: Task-oriented Satellite Conditional Handover Decision
  in NTN Based on Multi-agent Game[C]// 28th European Conference on Artificial Intelligence
  (ECAI-2025). 2025, Accepted.

  Tao Y, Chen H, Lin Z, et al. MCTM: Multi-Chord Distributed System for Efficient
  Trajectory Data Management in Mobile Edge Computing[C]// The 30th International
  Conference on Database Systems for Advanced Applications (DASFAA). 2025, Accepted.

  Yuan Z, Chen H, Tao Y, et al. LaOvl: Lifecycle-Aware Overlay File System for Efficient
  Container I/O in Cloud Computing[C]//2025 IEEE International Parallel and Distributed
  Processing Symposium (IPDPS). IEEE, 2025: 654-665.

  Sun L, Xu J, Hong F, et al. ESTACE: Efficient And Secure Data Sharing System Under
  Cloud-edge Continuum[C]//2025 IEEE International Symposium on Parallel and Distributed
  Processing with Applications (ISPA). IEEE, 2025. Accepted.

  Zhang H, Liu J, Hong F, et al. Collaborative Management for Spatial Safety for Unmanned
  Intelligent Vehicles in Human-Machine Coexistence Environment[C]//2025 International
  Joint Conference on Neural Networks (IJCNN). IEEE, Rome, Italy, 2025, pp. 1-8, doi:
  10.1109/IJCNN64981.2025.11227361.

  Zhang H, Sun L, Zhang Z, et al. Precomputation-Optimized Lakehouse Architecture
  for Online Analytical Processing Tasks[C]//2025 IEEE 18th International Conference
  on Cloud Computing (CLOUD). IEEE, 2025: 223-232.

  Huang P, Chen L, Xia M, et al. An Attention-Based CNN-LSTM Model to Diagnose Break
  Size in Loss-of-Coolant Accidents[J]. Nuclear Science and Engineering, 2025: 1-18.
  https://doi.org/10.1080/00295639.2025.2480509

  学术服务

  中国计算机学会高级会员，中国计算机学会计算机应用专委会委员。'
