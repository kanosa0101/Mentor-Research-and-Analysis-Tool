bio_raw: '个人简介

  邓志杰，副教授，博士生导师。主要研究方向为生成模型，相关技术应用于美团LongCat等业界大模型。在TPAMI、ICML、CVPR等会议和期刊上发表论文50余篇，包括多篇Spotlight。任ICLR、CVPR、ACL等会议领域主席。获NVAIL
  Pioneering Research Award等。主持多项国家/省部级和CCF产学合作基金。指导硕士、本科生获得上海交通大学“优秀毕业生”荣誉。

  教育背景

  2017.09-2022.06，清华大学，计算机科学与技术专业，工学博士；

  2013.09-2017.06，

  清华大学，计算机科学与技术专业，工学学士。

  工作履历

  2026.01- ，上海交通大学，副教授

  2022.08-2025.12，上海交通大学，助理教授

  教授课程

  2025, [CS3308-02] 机器学习

  2024-2025, [CS7352] 高级神经网络理论与应用

  2024, [CS3507] 工程实践与科技创新 (4-J)

  2023, [AI1601] 人工智能思维与伦理

  2023, [CS7310H] 算法设计与分析

  论文发表

  主要研究方向为生成模型，

  在TPAMI、ICML、CVPR等会议和期刊上发表论文50余篇

  ，

  最新发表情况参考：https://scholar.google.com/citations?hl=en&user=J3dR0sUAAAAJ&view_op=list_works&sortby=pubdate

  资助项目

  主持国自然青基、上海面上、上海市关键技术研发计划“新一代信息技术”项目、CCF 产学合作基金（3 项）、快手/华为/蚂蚁/OPPO产学研基金、上海交通大学Explore
  X基金等项目，参与国自然重大研究计划、山东省重点研发计划

  获奖信息

  2022.06，清华大学计算机系优秀毕业生

  2022.06，清华大学启航奖

  2021.06，华为-清华突出贡献奖

  2020.12, ''84''创新未来奖

  2017.12,

  NVAIL Pioneering Research Award

  学术服务

  领域主席：

  ICLR、CVPR、ACL

  会议审稿人: NeurIPS 2019-; ICML 2021-; ICLR 2022-; CVPR 2021-; ICCV 2021-; AISTATS 2024-;
  ECCV 2022-; AAAI 2021-2022; AutoML 2022

  期刊审稿人: Nature Communications, TPAMI, TIP, TNNLS, Artificial Intelligence, TITS,
  Neural Networks, TMLR'
