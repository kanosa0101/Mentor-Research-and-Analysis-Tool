bio_raw: '个人简介

  张伟楠博士现任上海交通大学计算机学院教授、博士生导师、副院长，上海人工智能实验室物理智能中心主任，科研领域包括强化学习、智能体、物理智能，当前主要研究物理智能基础模型与物理智能体，相关研究成果在CCF-A类国际会议和期刊上发表100余篇学术论文，谷歌学术引用4万余次，爱思唯尔中国高被引学者，获得5个最佳论文奖项，出版教材《动手学强化学习》和《动手学机器学习》等销量约6万册。张伟楠长期担任NeurIPS、ICML、ICLR、KDD等会议领域主席和TPAMI期刊编委，主持国家自然科学基金优秀青年项目和科技部2030新一代人工智能重大项目课题，入选中国科协青年人才托举工程和上海市科委英才扬帆计划，获得吴文俊人工智能优秀青年奖和达摩院青橙奖。

  教育背景

  张伟楠本科毕业于上海交通大学

  ACM

  班，博士毕业于伦敦大学学院计算机系。

  工作履历

  上海交通大学，2016至今

  教授课程

  机器学习，https://wnzhang.net/teaching/sjtu-ml-2024/index.html

  强化学习，https://wnzhang.net/teaching/sjtu-rl-2024/index.html'
