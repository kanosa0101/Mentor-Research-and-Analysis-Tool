bio_raw: '个人简介

  张伟楠博士现任上海交通大学计算机学院教授、博士生导师，科研领域包括强化学习、决策大模型、智能体技术、具身智能，发表

  CCF-A

  类国际会议和期刊

  100

  余篇学术论文，谷歌学术引用

  3

  万余次，

  H

  指数

  81

  ，爱思唯尔中国高被引学者，获得

  5

  个最佳论文奖项，出版教材《动手学强化学习》和《动手学机器学习》等。张伟楠长期担任

  NeurIPS

  、

  ICML

  、

  ICLR

  等会议的领域主席和

  TPAMI

  等期刊的编委，作为负责人承担国自然优青项目和科技部重大项目课题，获得吴文俊优青奖和达摩院青橙奖。

  教育背景

  张伟楠本科毕业于上海交通大学

  ACM

  班，博士毕业于伦敦大学学院计算机系。

  工作履历

  上海交通大学，2016至今

  教授课程

  机器学习，https://wnzhang.net/teaching/sjtu-ml-2024/index.html

  强化学习，https://wnzhang.net/teaching/sjtu-rl-2024/index.html'
