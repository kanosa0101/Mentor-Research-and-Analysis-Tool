title: 特聘教授
bio_raw: "个人简介\n上海交通大学特聘教授、校务委员会委员、领域操作系统教育部工程研究中心主任、人工智能操作系统研究院院长。\n国家杰出青年基金获得者、ACM\
  \ Fellow、IEEE \nFellow、CCF Fellow，主要研究领域为操作系统、分布式系统与系统安全，研究成果通过产学研深度结合被应用到数十亿设备，产生了广泛的学术与产业影响。曾获中国计算机学会科技进步特等奖、陈嘉庚青年科学奖（信息技术科学奖）、中国青年科技奖、教育部技术发明一等奖、全国优秀博士学位论文奖等。目前担任开源鸿蒙项目群技术指导委员会主席、ACM\
  \ SIGOPS首位非北美学者主席、ACM旗舰杂志Communications of the ACM首位中国学者编委与领域共同主席，曾任ACM EuroSys\
  \ 2025程序委员会共同主席、ACM SIGOPS ChinaSys主席、ACM SOSP 2017年大会联席主席、《ACM Transactions on\
  \ Storage》编委等。研究工作还获得了华为卓越贡献个人奖、SOSP、ASPLOS、EuroSys、VEE等最佳论文奖以及DSN“时间检验奖”、《Communications\
  \ of the ACM》研究亮点奖等。按照csrankings.org的统计，其近十年在操作系统领域顶会SOSP/OSDI上发表的论文数居世界第一。主持撰写的《现代操作系统：原理与实现》获得了2020年度“最受读者喜爱的IT图书奖”与2022年上海交通大学优秀本科生教材奖（新版更名为《操作系统：原理与实现》）、以及机工科技--2023年度计算机领域十大好书，被高校、科研机构与企业广泛采用。\n\
  教育背景\n2004.9 - 2009.1 复旦大学 计算机系统结构 博士 （获全国优博）\n2000.9 - 2004.7 复旦大学 计算机科学与技术 本科\n\
  工作履历\n2011.9 - 现在 上海交通大学 教授、长聘教授、特聘教授\n2009.4 - 2011.12  复旦大学  讲师\n教授课程\n操作系统\n\
