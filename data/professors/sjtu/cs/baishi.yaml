bio_raw: '个人简介

  白石，上海交通大学长聘教授，主要研究方向为密码学与计算数论。2012年于澳大利亚国立大学（The Australian National University）获计算机科学博士学位，随后在新西兰奥克兰大学
  （ The University of Auckland）、法国里昂高等师范学院（École normale supérieure de Lyon）从事博士后研究工作。曾任美国佛罗里达大西洋大学（Florida
  Atlantic University）数学系副教授、密码学与信息安全中心联合主任。

  其研究成果发表于国际密码学旗舰会议，并于2015年获得亚洲密码学年会ASIACRYPT最佳论文奖。主持了美国国家科学基金会（NSF）及美国国家标准与技术研究院（NIST）等多个科研项目，并于2021年获美国国家科学基金会NSF
  CAREER Award。作为核心设计成员参与的后量子签名算法Dilithium，获美国国家标准与技术研究院采纳，成为美国后量子密码标准ML-DSA/FIPS-204。在学术服务方面，多次担任国际密码学会议程序委员会委员(Program
  Committee)，并担任2026年国际公钥密码学会议（PKC 2026）程序委员会联合主席 (Program Committee Co-Chairs)。'
