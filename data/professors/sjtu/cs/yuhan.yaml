bio_raw: '个人简介

  于晗博士，硕士生导师。主要研究方向为工业软件，工业大数据，知识图谱，AI4Engineering等。在IEEE TII，IEEE TSMC，IEEE TSC，JIII，计算机学报等国内外顶级期刊和会议发表论文20余篇，授权发明专利7项，软件著作权3项，出版专著《工业软件的计算技术及构造实践》。现担任中国图学学会高级会员，上海市图学学会工业软件专业委员会副主任，中国计算机学会服务计算专委会执行委员。主持和参与多项国家级、省部级科研项目，曾获福建省科技进步二等奖，入选上海市科技青年英才扬帆计划。

  教育背景

  2016.9-2022.3 上海交通大学软件学院 博士

  2012.9-2016.6 上海交通大学软件学院 本科

  工作履历

  2022.4至今 上海交通大学计算机学院 助理研究员

