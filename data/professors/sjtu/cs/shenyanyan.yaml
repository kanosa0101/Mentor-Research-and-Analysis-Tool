bio_raw: '个人简介

  沈艳艳，计算机学院教授，主要从事大数据管理与分析研究。主持国自然青基B类项目、科技部重点研发计划合作项目和课题等多项科研项目。在数据库和人工智能领域会议和期刊上发表论文100余篇，曾获ICDE
  2023 (CCF A类) 最佳论文奖、VLDB 2022

  (CCF A

  类

  )

  最佳研究论文奖等5项重要国际会议论文奖项。现任CCF A类期刊VLDB Journal和IEEE TKDE编委，长期担任SIGMOD、VLDB、ICDE等国际顶级学术会议程序委员会委员，获评VLDB
  2023和2024年度杰出编委。

  https://shenyanyan-sjtu.github.io/

  教育背景

  北京大学获得学士学位，新加坡国立大学获得博士学位。

  教授课程

  计算机系统结构

  数据库原理

  论文发表

  [Google Scholar]

  https://scholar.google.com/citations?hl=en&user=MBuqhZUAAAAJ

  [DBLP]

  https://dblp.org/pid/74/2905.html

  学术服务

  IEEE高级会员

  中国计算机学会数据库专委会执行委员'
