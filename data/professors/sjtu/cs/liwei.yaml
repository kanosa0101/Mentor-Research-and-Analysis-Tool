bio_raw: '个人简介

  李伟

  ，上海交通大学计算机学院

  John Hopcroft 计算机科学中心担任长聘教轨副教授

  ，上海市浦江人才。他

  对物理模拟领域充满热情，其研究目标是将物理学与计算机科学相结合，推动物理模拟的边界。

  主要研究研究方向为计算机图形学、

  物理仿真、和物理智能（为虚拟机器人创建高效的流体仿真平台，进行复杂环境下的智能学习；基于AI的物理仿真加速和优化，AI for physics等)。研究成果被发表在SIGGRAPH
  North America, SIGGRAPH Asia，TOG，TVCG, JCP 等国际重要会议和

  期刊

  上。

  曾获得上海市优秀毕业生，上海科技大学校长奖等

  荣誉且

  多次担任SIGGRAPH North America, SIGGRAPH Asia 会议，ACM Transactions on Graphics 和IEEE
  Transactions on Visualization and Computer Graphics审稿人。

  教育背景

  2015–2021, ShanghaiTech University & University of Chinese Academy of Sciences

  Ph.D in Computer Science, Advisor: Prof. Xiaopei Liu

  2011-2015, Northwestern Polytechnical University

  BS in Computer Science

  工作履历

