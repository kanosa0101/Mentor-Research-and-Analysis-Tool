bio_raw: '个人简介

  Dr. Yiming Zhang''s research is focused on operating, networking, storage, and AI
  systems. As the first/corresponding author, he has published more than 50 highly-influential
  papers in top conferences including SIGCOMM, NSDI, and FAST, and famous Journals
  like TOCS, TOS and TON. He is an associate editor of IEEE Transactions on Computers
  and IEEE Transactions on Services Computing, and a member of 2022 EuroSys Roger
  Needham Award Committee. He has received the Best Paper Award of USENIX FAST''23,
  the National Science and Technology Award (2nd prize), the Natural Science Award
  of Hunan province (1st prize), and the (top 10) Outstanding Dissertation Award.
  As the team leader, he won the CCF Award of Science and Technology (1st prize) in
  2021.

