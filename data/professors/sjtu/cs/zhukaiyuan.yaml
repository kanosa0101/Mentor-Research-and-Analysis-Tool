bio_raw: '个人简介

  长聘教轨副教授，博士生导师，国家级海外青年人才，上海市海外高层次青年人才。主要

  研究方向为计算基因组学、癌症基因组学，聚焦

  基因组数据的高效存储、检索

  与分析，具体研究内容包括但不限于：（1）癌症基因组局部扩增与复杂结构变异（如染色体外DNA）重建；（2）基因组数据压缩与索引；（3）宏基因组、泛基因组与肿瘤微生物组分析；（4）三维基因组与染色质结构解析；（5）隐私保护基因组数据分析。我们致力于以算法创新推动基因组学研究

  ，从海量基因组数据中挖掘生物学新规律，加深对癌症等疾病发生、发展机制的理解，加速肿瘤精准诊疗的实现。欢迎具有计算机科学、数学、统计学、生物信息学等背景的优秀学生与学者加入团队，共同开拓计算基因组学前沿。

  教育背景

  2014.09 - 2021.05  Indiana University Bloomington, Luddy School of Informatics,
  Computing, and Engineering, 计算机科学, 博士

