bio_raw: '个人简介

  张健夫，上海交通大学计算机学院助理教授，研究方向为视觉内容生成与可信赖人工智能模型。本科毕业于上海交通大学ACM班，后于上海交通大学计算机系获博士学位。曾赴日本理化研究所（RIKEN）人工智能项目组担任访问研究员。目前，他已在CVPR、ICCV、ICLR、T-IP等CCF-A类会议及期刊发表论文30余篇，研究成果被引用超2000次，Google
  Scholar h-index 20。

  教育背景

  2015 - 2020 上海交通大学 计算机系 博士

  2011 - 2015 上海交通大学 致远学院（ACM班） 学士

  工作履历

  2023.2 - 至今 上海交通大学 清源研究院 长聘教轨助理教授

  2020.9 - 2024.6 RIKEN AIP 访问学者

  教授课程

  CS3964 图像处理与视觉

  本科致远荣誉计划John Hopcroft班 专业自选课 3学分 2023秋、2025春

  CS7353 设计和理解深度神经网络

  研究生专业前沿课 3学分 2024春、2025春

  CS3969 视觉内容生成

  本科致远荣誉计划ACM班 专业自选课 2学分 2025春

  资助项目

  基于自主学习的图像修复与合成方法研究 国家自然科学基金青年科学基金 2024 – 2026'
