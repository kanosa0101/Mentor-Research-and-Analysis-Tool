bio_raw: '个人简介

  上海交通大学计算机学院研究员、博士生导师，国家级青年人才，教育部网络信息安全管理与服务工程研究中心副主任。主要从事网络安全与数据隐私、区块链、人工智能安全研究，发表Usenix
  Security、ACM CCS、CVPR、ASE、TIFS、TDSC、TMC、TON、TC等高水平论文70余篇，合著学术专著2部，参与国际/行业标准7项（副主席2项）。

  主持国家重点研发课题、国家自然科学基金面上项目、上海科委科技创新行动计划专项、教育部-华为产学研协同育人项目、CCF腾讯犀牛鸟基金等项目。

  获

  CCF技术发明二等奖（

  排1

  ），世界人工智能大会WAIC青年优秀论文提名奖等国际会议论文奖5项、全国大学生信息安全竞赛一等奖优秀指导教师、CCF&ATEC2023全国大学生区块链安全技术与创新应用竞赛一等奖优秀指导教师。日本九州大学博士，澳洲蒙纳什大学区块链中心访问学者，博士毕业后加入上海交通大学至今。

  招收2027、2028年入学的硕、博士生，欢迎对网络安全与数据隐私、区块链、人工智能安全等方向感兴趣的同学加入。也欢迎对科研感兴趣的本科生加入课题组。

