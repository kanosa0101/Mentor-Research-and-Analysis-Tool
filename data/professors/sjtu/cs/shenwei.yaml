bio_raw: '个人简介

  沈为，上海交通大学人工智能研究院教授，博士生导师，国家自然科学基金优青获得者。曾任约翰霍普金斯大学计算机系助理研究教授。研究方向为计算机视觉、深度学习与医学图像处理。在人工智能领域的顶级学术会议和期刊上发表论文80余篇，总学术引用1万多次，出版人工智能教材《动手学计算机视觉》一部。指导博士生论文获得医学图像处理顶级国际会议MICCAI
  2023青年科学家奖。担任人工智能领域顶级国际会议ICML 2025、NeurIPS 2023/2024/2025、ICCV 2025、CVPR 2022/2023/2026领域主席、SCI一区期刊Pattern
  Recognition编委，上海计算机学会计算机视觉专委上海计算机学会计算机视觉专委副主任。

