bio_raw: '个人简介

  龙宇，女，1980年10月生。2008年2月在上海交大计算机系获计算机系统结构博士学位。同期受聘进入上海交通大学计算机系工作，2016年起任副教授、博导。2012年6月至2013年6月受邀访问巴黎高等师范学院（ENS）计算机系。长期从事公钥密码学、区块链、信息安全、可信计算及云计算安全等领域的研究，取得了较好的成绩。目前为止在国内外知名学术期刊及会议上发表文章70余篇，申请专利11项。近年来，其研究重点为及密码学及在区块链安全协议中应用。作为项目负责人或骨干成员主持和参与了一系列国家/省部级重点科研项目，代表性项目包括：

  ① 针对区块链相关的科研及应用方面：上海市科委项目《基于区块链技术的数据全生命周期完整性保护技术研究》项目（2019-2021）、教育部高等学校区块链创新行动计划《基于区块链的新型监管体系关键技术研究》（2020-2022）、中国工程院《中国区块链战略发展研究》（2021）、山东省重点研发计划《大规模分布式区块链安全协同技术》（2022-2024）、上海市科委项目《面向复杂开源联盟链间多层次跨链需求的安全隐私跨链技术研究》（2024-2025）等。

  ② 针对密码算法和协议的设计与证明：“新型功能加密体制中的关键问题研究”（国家自然科学基金，2016）、“网络环境下可证明安全分布式公钥加密体制的研究”（国家自然科学基金，2010）、“面向真实网络环境的分布式公钥加密体制的基础问题研究”（博士点基金，2010）、“云计算环境下数据安全基础问题研究”（国家自然科学基金重点项目、2012）、“密码算法基础理论研究”（国家“973”计划项目，2007-2011）等。

