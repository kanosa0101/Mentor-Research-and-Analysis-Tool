bio_raw: '个人简介

  骆源，上海交通大学计算机学院长聘教授，学院下属计算机系主任，上海交通大学区块链研究中心副主任。科技部区块链重点研发计划首席科学家， 国家网信办网信优秀人才，负责科技部区块链重点研发计划1项，国家自然科学基金7项，上海市科技创新行动计划1项，及其他项目十余项。1999年获得南开大学数学系概率统计专业博士学位，中国科学院系统所和德国杜伊斯堡埃森大学博士后。2003年入职上海交通大学。研究方向为信息论、信息安全和区块链技术，在IEEE
  TIT TIFS TWC JSAC等国际重要刊物发表学术论文150余篇。

