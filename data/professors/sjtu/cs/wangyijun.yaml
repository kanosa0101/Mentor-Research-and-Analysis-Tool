bio_raw: '个人简介

  王轶骏，上海交通大学计算机学院教师，主要研究网络攻防对抗技术，操作系统安全机制等。从教以来一直主讲系统安全、网络攻防、渗透测试等多门课程。撰写出版过的学术书籍有：“Windows系统安全原理与技术”，“计算机病毒与恶意代码——原理、技术及防范”等，获得过上海交通大学青年教师教学竞赛二等奖，电信学院青年教师教学竞赛一等奖，国家级线上一流课程（“计算机病毒与恶意代码”）团队成员，指导学生获得全国大学生信息安全竞赛创新能力实践赛一等奖2次，国内外各类CTF大赛（强网杯、网鼎杯等）一等奖多次，上海市大学生网络安全大赛网络攻防赛特等奖。主要聚焦系统安全、威胁监测和攻防对抗方向，围绕全网资源探测、暗网信息监测、加密流量检测、APT攻防对抗、云场景攻防、恶意代码检测分析等问题展开长期研究，突破了一系列关键技术，设计并研制了一大批可用于实战的系统和工具，为国家安全相关工作提供了长期大量的技术和装备支持。负责或作为技术骨干参与的涉密项目30余项，非涉密项目20余项，其中国家重点研发计划项目6项，获得上海市科技进步奖一等奖和二等奖各1次，获得专利授权7项，软件著作权6项，在国内外学术期刊及会议上发表学术论文100余篇，包括IEEE
  S&P、ACM WWW、AAAI、SIGKDD、IJCAI、ToN等10多篇顶会/顶刊论文。所担任的社会兼职包括：上海世博信息安全应急响应技术支撑专家，上海市国家保密局信息安全保密科学技术专家，上海市国家保密局保密检查技术顾问，上海市“磐石行动”网络安全实战攻防活动专家，上海市等级保护定级评审专家，长三角一体化示范区网络安全实战基地专家，北京网络安全大会技术专家顾问，中国中文信息学会开源情报专业委员会委员等。'
