bio_raw: '个人简介

  上海交通大学并行与分布式系统研究所（IPADS）副研究员，分别于2015年和2021年获得上海交通大学学士和博士学位。主要研究方向为操作系统、文件与存储系统、DNA存储与计算，相关工作发表在FAST、USENIX
  ATC、SOSP等操作系统顶级国际会议。曾获SOSP2023最佳论文奖、2022年华为“火花奖”、英特尔中国学术英才计划2022年度荣誉学者、2020年华为奥林帕斯先锋奖。其研制的高性能持久内存文件系统SoupFS进入OpenEuler操作系统创新版；与华为合作的EROFS成为首个合入Linux内核主线的国人自主研发的文件系统，并已经成为Android系统分区的官方文件系统，运行在亿级智能手机之中。

  更多以及最新信息请见

  https://dong.mk

