bio_raw: '个人简介

  尹强，长聘教轨副教授、博士生导师，CCF 数据库专委执行委员。2016 年于上海交通大学获博士学位，并先后在北京航空航天大学与阿里巴巴达摩院从事数据库系统研究。已在
  SIGMOD、VLDB、ICDE、TODS、VLDBJ 等国际顶级会议和期刊发表论文 20 余篇，研究成果曾获

  VLDB 2025 最佳论文亚军

  和

  EuroSys 2022 Best Artifact Award(荣誉提名)

  。主持国家自然科学基金青年项目（C类）、CCF–蚂蚁联合基金，以及国产开源数据库示范课程建设等科研与教学项目。

  教育背景

  2012.03 -- 2016.06    上海交通大学 计算机软件与理论 博士

  2009.09 -- 2012.03    上海交通大学 计算机软件与理论 硕士

  2005.09 -- 2009.06    厦门大学        计算机科学与技术 学士

  工作履历

  2026.02 至今              上海交通大学        副教授

  2021.08 -- 2026.01    上海交通大学         助理教授

  2018.10 -- 2021.07    阿里巴巴达摩院     技术专家

  2016.10 -- 2018.09    北京航空航天大学 博士后

  教授课程

  CS3321-数据库技术

  (2024秋, 2025秋)

  CS2950-数理逻辑

  (2022秋, 2023秋, 2024春)

  AI3613-数据库原理

  (2021春, 2022春, 2023春)

  论文发表

  论文列表见

  https://basics.sjtu.edu.cn/~qyin/papers

  或

  Google Scholar

  页面。

  获奖信息

  华为火花奖，2025

  VLDB Best Paper Runner-Up, 2025

  EuroSys

  Best Artifact Award (Honorable Mention), 2022'
