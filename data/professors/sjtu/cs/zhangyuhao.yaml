bio_raw: '个人简介

  研究方向：理论计算机中的在线算法设计、近似算法设计。旨在研究具有广泛性的算法设计思想和算法分析框架。

  教育背景

  本科毕业于浙江大学（曾加入张国川老师的研究小组），博士毕业于香港大学（导师为黄志毅老师）。

  工作履历

  2021~至今，上海交通大学

  教授课程

  进行中：

  算法设计与分析：ACM班、IEEE班。

  在线算法：ACM班、John班合上

  理论计算机导论：John班

  曾经：

  算法设计与分析（AI班）

  高级算法选讲（ACM班、John班合上）

  论文发表

  见个人主页

  资助项目

  国自然青年基金、国自然面上基金

  获奖信息

  中国运筹学会青年科技奖（提名奖）

  学术服务

  中国计算机学会理论计算机专委会执行委员

  中国计算机学会计算经济学专委会执行委员

  中国运筹学会数学规划分会青年理事

  上海计算机学会理论计算机专委会秘书长'
