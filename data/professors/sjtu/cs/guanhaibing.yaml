bio_raw: '个人简介

  管海兵，男，汉族，1971年5月生，工学博士，教授。现任上海交通大学党委常委、副校长。担任中国计算机学会高性能计算专业委员会主任、上海市可扩展计算与系统重点实验室主任。

  1999年起在上海交通大学工作，先后担任上海交通大学科技处副处长、电子信息与电气工程学院副院长、网络信息中心书记/主任、信息化推进办公室副主任（兼）等职。2024年8月起任上海交通大学副校长。2024年10月起任上海交通大学党委常委、副校长。

  主要从事并行与分布式计算系统的教学和研究工作。曾获国家杰出青年科学基金、教育部“长江学者奖励计划”特聘教授、国家万人计划科技创新领军人才等国家级人才计划。曾获国家科学技术进步二等奖、国家级教学成果二等奖、国家技术发明二等奖各一次；共4次获得省部级特等/一等奖。现任十四五国家重点研发计划《高性能计算》专家组组长，曾任十三五国家重点研发计划《云计算和大数据》重点专项总体组专家、十二五国家科技重点专项《中国云》总体组专家、科技创新-2030
  《新一代人工智能》指南编制组专家等。'
