bio_raw: '个人简介

  李国强博士，上海交通大学计算机学院副教授，博士生导师，中国计算机学会高级会员。2001年在太原理工大学获得工学学士学位、2005年在上海交通大学获得工学硕士学位、2008年在日本北陆先端科学大学院大学获得工学博士学位。2008年至2009年在日本名古屋大学信息科学研究科担任博士后研究员，2009年至2013年在上海交通大学软件学院担任讲师
  ，2015年至2016年在英国牛津大学计算机科学系任访问学者，2016年至2020年在日本九州大学担任客座副教授。 研究兴趣包括形式化验证、程序语言理论、代码智能。
  主持国家自然科学基金五项、自然科学基金重点子课题两项。已经在国内外知名期刊和国际主流会议发表论文超百篇，包括OOPLSA、FM、 ICML、NeurIPS、ACL、ASE、FSE、ICSE、CSCW等顶级会议以及TSE、TDSC、TSC、TII、TECS、TSMCA等顶级期刊。现担任中国计算机学会形式化方法专委会常务委员，

  上海计算机学会理论计算机科学专委会副主任，

  中国人工智能学会人工智能逻辑专委会、中国中文信息学会语言与知识计算专委会、中国图像图形学会智能边缘计算专委会学术委员。

