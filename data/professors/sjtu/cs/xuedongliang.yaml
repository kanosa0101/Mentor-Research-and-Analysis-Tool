bio_raw: '个人简介

  薛栋梁，上海交通大学计算机学院副研究员，博士生导师。中国计算机学会高级会员，系统软件专委执委，体系结构专委执委，上海市计算机学会存储专委副主任。 主要研究方向为系统软件，存储系统，体系结构，具身智能等。主持国家重点研发计划课题，国家重大科研仪器研制课题，上海市自然科学基金面上项目以及多项企业项目，作为技术负责人，研发了矽璓工业物联操作系统（https://www.gitlink.org.cn/xuos/xiuos），已经应用到了全国数十个城市的几十家企业，取得了较好的经济效益和社会效益。发表CCF-A类论文多篇，获得发明专利30余项，相关成果获得2020年度上海市技术发明一等奖。'
