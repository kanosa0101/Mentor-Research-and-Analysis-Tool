bio_raw: '个人简介

  CCF杰出会员, 微软亚洲研究院访问教师、美国CMU大学访问学者，主要研究方向为虚拟化与云计算、程序分析、软硬协同优化等， 代表性工作有GPU/FPGA虚拟化、新型“多虚一”GiantVM、RISC-V协同设计等。出版译著《UNIX环境高级编程（第2版）》，为2008、2009年度畅销榜TOP50（China-Pub），专著《BlewBluePill：深入理解硬件虚拟机》(（获得IBM出版计划资助）、译著《UNIX高级环境编程（第3版）》（京东计算机与互联网图书2014/2015年度销售榜Top
  100），专著《深入浅出系统虚拟化：原理与实践》（获得2021教育部-华为智能基座突出贡献奖）和 专著《数据中心虚拟化：原理与实践》（华为联合出版）。

  教育背景

  2002-2005    上海交通大学  计算机软件与理论 博士

  工作履历

  2006-至今 上海交通大学电信学院    讲师、副教授、教授

  2011-2012 美国CMU大学   计算机系  访问学者

  2008 微软亚洲研究院  访问教师

  教授课程

  高级数据结构(本科)

  高级云操作系统（研究生）

  系统安全（研究生）

  论文发表

  [1]  Mochi Xue, Kun Tian, Yaozu Dong, Jiacheng Ma, Jiajun Wang, Zhengwei Qi, Bingsheng
  He, Haibing Guan: gScale: Scaling up GPU Virtualization with Dynamic Sharing of
  Graphics Memory Space. USENIX Annual Technical Conference 2016: 579-590

  [2] Mingyuan Xia, Lu Gong, Yuanhao Lyu, Zhengwei Qi, Xue Liu: Effective Real-Time
  Android Application Auditing. IEEE Symposium on Security and Privacy 2015: 899-914

  [3] Jiacheng Ma, Gefei Zuo, Kevin Loughlin, Xiaohe Cheng, Yanqiang Liu, Abel Mulugeta
  Eneyew, Zhengwei Qi, Baris Kasikci: A Hypervisor for Shared-Memory FPGA Platforms. ASPLOS
  2020: 827-844

  [4] Jin Zhang, Zhuocheng Ding, Yubin Chen, Xingguo Jia, Boshi Yu, Zhengwei Qi, Haibing
  Guan: GiantVM: a type-II hypervisor implementing many-to-one virtualization. VEE
  2020: 30-44

  [5] Y. Wang, L. Chen, J. Ji, X. Tian, B. Luo, Z. Wei, Z. Huang, K. Xu, K. Peng,
  K. Guo, N. Luo, G. Wang, S. Dai, Y. Shen, J. Wu, Z. Qi:To PRI or Not To PRI, That''s
  the Question. OSDI 2025

  资助项目

  国家自然科学基金面上项目：虚拟化GPU资源的扩展性和可用性研究

  国家重大专项子课题，移动通信网业务平台（网关）云化关键技术研究

  国家重大研发计划课题：巨型虚拟机及新型设备虚拟化

  国家自然科学基金重点项目：泛在操作系统异构硬件的资源抽象与融合管理

  获奖信息

  国家科技进步二等奖（2014）

  教育部科技进步一等奖（2012）

  教育部技术发明一等奖（2018）

  上海市技术发明一等奖（2019）

  第十二届“挑战杯”全国大学生课外学术科技作品竞赛特等奖（2011，指导教师）

  学术服务

  中国计算机学会系统软件、集成电路设计专委会执行委员

  YOCSEF上海学术委员[2009-2011]、优秀学术秘书[2009-2010]、中国计算机学会YOCSEF上海杰出贡献奖（2019）'
