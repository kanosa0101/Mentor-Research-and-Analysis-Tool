bio_raw: '个人简介

  徐燕虹博士

  2014年6月毕业于厦门大学数学科学学院，获理学学士学位。2019年1月毕业于新加坡南洋理工大学，获博士学位。2019年2月至2021年2月期间，在加拿大卡尔加里大学计算机学院从事博士后研究。2021年8月加入上海交通大学网络空间安全学院，现任职助理研究员。主要研究方向为基于后量子密码学假设的隐私保护协议，相关

  论文发表在亚密会、PKC，CT-RSA, Theoretical Computer Science 等重要学术会议和期刊上。主持国家自然科学基金青年基金项目、国家密码管理局面上项目等。

