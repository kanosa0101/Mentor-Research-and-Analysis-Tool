bio_raw: '个人简介

  许可，2019年博士毕业于上海交通大学，现为上海交通大学计算机学院（网络空间安全学院）副研究员、博士研究生导师。研究工作聚焦数字媒体内容安全，主要从事视频内容安全理解、视频对抗样本攻防等技术的基础理论研究及技术实现。主持了国家自然科学基金面上基金、青年基金、中国博士后基金等科研任务。主持和参与了30余项国家/省部级科研任务，推动了“数字媒体内容取证与安全”的特色研究方向的发展，并取得了系列有价值的理论和技术研究成果。获得上海市“超级博士后”资助、获上海市科技进步奖一等奖（2024）、中国图象图形学学会科技进步奖一等奖（2024）、上海融合发展创新专业赛金奖（2024）、上海交通大学教学成果二等奖（2024）、CVPR挑战赛亚军（2022）等奖励。在国内外学术刊物和会议上发表/录用学术论文50余篇，包括TIFS、TMM、TCSVT等国际学术期刊和ICASSP、ICME、UAI等国际学术会议。获授权发明专利14项，登记软著3项。是中国图象图形学会学会高级会员，数字媒体取证与安全专委会委员，IEEE
  会员，2020年-至今任APSIPA、ICSPS等国际会议的TC Member，2022年担任ICSPS分会主席。参与编写著作《数字媒体取证学原理与应用实践》1部，讲授本科《计算机组成与系统结构》、《计算机通信网络》、研究生《多媒体内容安全》等课程。

  教授课程

  讲授本科《计算机组成与系统结构》、《计算机通信网络》、研究生《多媒体内容安全》等课程，参与编写著作《数字媒体取证学原理与应用实践》。

  论文发表

  已在国内外学术刊物和会议上发表/录用学术论文50余篇，包括TIFS、TMM、TCSVT等国际学术期刊和ICASSP、ICME、UAI等国际学术会议。获授权发明专利14项，登记软著3项。

  长期围绕多媒体内容安全开展研究，主要研究方向如下：

  （1）视频异常事件检测

  （2）步态识别与匿名化

  （3）模型对抗攻击与检测

