  资助项目

  1） 国家自然科学基金面上基金，基于视觉匿名化的步态隐私保护关键技术研究（62372295）

  2） 国家自然科学基金青年基金，基于骨骼图结构化表征的异常行为识别算法研究（62002220）

  3） 中国博士后基金第67 批面上资助，基于图深度网络提取骨骼特征的步态识别技术研究（2020M671124）

  4） 中国博士后基金第13批特别资助（站中），基于多传感器融合的智能行为识别算法研究（2020T130413）

