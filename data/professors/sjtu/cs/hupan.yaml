title: 长聘教轨副教授
email: pan.hu@sjtu.edu.cn
bio_raw: '个人简介

  以服务国家重大战略需求为目标，从事逻辑推理、图数据库、知识增强大模型等方面基础理论和关键应用研究。先后受到国家自然科学基金面上项目（6267**，主持）、国家自然科学基金青年基金C类项目（6220**，主持）、国家科技重大专项项目（2025ZD1600**，参研方主持）、英国工程与自然科学研究理事会项目（EP/S032347**，参研方骨干）、法国外交部埃菲尔奖（72019**，主持）、国家留学基金委学费资助项目（20150623**，主持）等国内国际项目资助。欢迎对本人研究方向感兴趣的博士后、博士生、硕士生、实习生申请人（其中实习生仅限线下，不接受线上实习）在阅读至少一篇本人为第一或通讯作者的论文（https://dblp.org/pid/96/3740-1.html）后邮件取得联系，感兴趣的研究方向与本人没有明显交集的申请人及未阅读本人论文的申请人请不要发送邮件，如发送请恕无法一一回复。

  给我发申请邮件时，为了提升你获得回复的概率，请注意：目前我被评定的专业技术职称是副教授（专技七级），聘用岗位是长聘教轨副教授；我的教育经历主要在中国和英国，与北美不同，在此两地一般只有正教授及以上（中国专技四级及以上，英国Full
  Professor和Chair Professor等）才被称呼为“某教授”；因此，我偏好被称呼为“胡老师”或者“胡博士”，谢谢！

  教育背景

  2015-2019 英国牛津大学 博士

  2012-2015 上海交通大学 硕士

  2011-2013 法国高等矿业大学 工程师

  2008-2012 上海交通大学 学士

  教授课程

  数据结构（工科平台）

  数理逻辑（人工智能试点班，双语）

  程序设计与数据结构（浦江国际学院，全英文）

  获奖信息

  法国政府埃菲尔学者

  上海海外高层次人才

  上海交通大学优秀班主任'
