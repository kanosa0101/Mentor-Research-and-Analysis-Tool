bio_raw: '个人简介

  张宇伦，上海交通大学，任长聘教轨副教授，博士生导师，入选国家海外高层次青年人才，上海市海外高层次青年人才。本科、硕士、博士分别就读于西安电子科技大学、清华大学、美国东北大学。博士毕业后，在苏黎世联邦理工学院做博士后。我的主要研究方向是计算机视觉和机器学习，具体包括图像/视频复原与合成，模型压缩，计算成像，多模态计算，生物医学图像分析，大语言模型等。在计算机视觉，机器学习，多媒体，人工智能等领域的顶级国际期刊和会议上发表学术论文100余篇，包括TPAMI,
  CVPR, ICCV, ECCV, ICLR, NeurIPS, ICML等。论文Google学术引用34000余次，一作论文单篇最高引用7000余次。获得2015年IEEE
  VCIP最佳学生论文奖，2019年IEEE ICCV RLQ Workshop最佳论文奖，全球AI华人新星百强（2021年），连续多年入选斯坦福“全球前2%顶尖科学家”榜单（2021-2025年），入选2024-2025爱思唯尔“中国高被引学者”，

  作为指导老师，与团队获得第十九届“挑战杯”主体赛全国特等奖

  。近年来担任顶级会议CVPR, ICCV, ECCV, ICLR, NeurIPS, ICML, ACM MM, IJCAI, AAAI领域主席。

