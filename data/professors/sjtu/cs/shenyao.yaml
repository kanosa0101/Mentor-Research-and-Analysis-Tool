  资助项目

  近期项目：

  主持，华为云计算技术有限公司，软硬协同NPU异构向量检索加速技术，2024 至 2025

  参与，国家自然科学基金重点，面向异构硬件的云原生运行时系统研究，2023 至 2027

  参与，

  国家重点研发计划，新型数据流异构处理器架构及计算系统，2023 至 2026

  主持，国泰君安，容器云与非容器云混合部署技术方案研究与实践，2023 至 2024

  主持，国泰君安，DPVS云机大规模研究，2023 至 2024

  主持，国泰君安，Pulsar金融行业应用及高可用研究，2023 至 2024

  参与，国家自然科学基金重点，基于区块链的物联网安全技术研究，2020 至 2024

  参与，国家重点研发计划，人机物融合的云计算架构与平台，2018 至 2021

