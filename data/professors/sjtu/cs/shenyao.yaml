bio_raw: '个人简介

  研究兴趣包括：大数据处理；云计算与分布式系统；人工智能与智能体；计算机网络。

  近期的工作可访问：https://y.sjtu.edu.cn

  教育背景

  2004.04 ～ 2007.12 上海交通大学计算机系，博士研究生

  2001.09 ～ 2004.03 上海交通大学计算机系，硕士研究生

  1994.09 ～ 1998.06 西安交通大学计算机系，本科生

  工作履历

  2008.05 ～ 至今 上海交通大学计算机学院（系），助理研究员、高级工程师

  2013.03 ～ 2014.04 美国卡内基梅隆大学电子与计算机工程系（ECE）副研究员

  1998.07 ～ 2001.08 （原）邮电部第一研究所

  教授课程

  程序设计思想与方法

  移动互联网前沿技术

