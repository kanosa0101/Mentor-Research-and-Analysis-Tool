bio_raw: '个人简介

  I have been a faculty member at Shanghai Jiao Tong University (SJTU) since 2021.
  From 2016 to 2020, I worked as a researcher at the National Institute of Information
  and Communications Technology (NICT) in Japan, following an internship there in
  2013. I am deeply grateful to my senseis at NICT—

  Masao Utiyama

  and

  Eiichiro Sumita

  —for their invaluable guidance, support, and inspiration throughout my time in Japan.
  From 2012 to 2016, I pursued a joint Ph.D. between SJTU and the French National
  Centre for Scientific Research (CNRS), under the supervision of

  Hai Zhao

  ,

  Bao-Liang Lu

  , and

  Sabine Ploux

  . Prior to my doctoral studies, I studied and worked at the Xinjiang Branch of the
  Chinese Academy of Sciences from 2009 to 2012. I earned my bachelor''s degree from
  Harbin Institute of Technology in 2009. I was born in Harbin, China, in 1985—the
  city I proudly call home.

  Language Intelligence is a form of cognitive capability—shared by humans and increasingly
  emulated by machines—that enables agents to learn about the external world through
  natural language, construct highly abstract linguistic representations, and thereby
  understand, refine, and creatively transform that world. Our research seeks to explore
  and expand the frontiers of this intelligence across three interconnected domains:

  ★

  Language Modeling: The mechanism and application. I started researching language
  models in 2013, which was a turning point when language models shifted from n-gram
  approaches to neural networks

  [EMNLP-2013]

  .

  •We have observed some interesting phenomena:

  [Overthinking]

  ,

  [Chain-of-Embedding]

  ,

  [Mixed-radix Rotary Position Embedding]

  , etc.

  •We have proposed

  [DeepMath-103K]

  with Tencent,

  [PolyMath]

  with Qwen Team, and

  [F2LLM]

  with Ant Group.

  ★

  Computational Linguistics: An interdisciplinary field of computer science, linguistics,
  cognitive science, psychology, etc.

  • We have provided the first evidence that

  [Neural Theory-of-Mind Networks]

  can spontaneously generalize high-order ToM, akin to human cognition.

  • We have observed that LLM can solve concrete problems through

  [Meta-Reasoning]

  .

  ★

  Machine Translation (MT): I worked on MT for over ten years and will never give
  it up.

  • We argue that the development trend of machine translation is gradually moving
  toward

  [Unsupervised Machine Translation]

  .

  • We are working on

  [Human-like Machine Translation]

  and

  [Multi-agent Machine Translation]

  .

