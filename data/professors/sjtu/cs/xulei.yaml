bio_raw: '个人简介

  2018年获得西北工业大学学士学位，2024年获得上海交通大学博士学位（导师：陈彩莲教授和关新平教授），目前在上海交通大学计算机学院从事教学与科研工作，硕导。主要研究方向包括确定性网络设计、工业具身智能、工业互联网安全等。截止目前在相关领域已发表高水平期刊论文20余篇，包括IEEE
  ToN, TMC，TII等网络领域权威期刊与ICML、AAAI等高水平国际会议。授权中国/美国发明专利10余项，申请中国和国际发明专利5项，登记软件著作权3项，作为起草人参与制定工业互联网领域国际/行业标准4项。曾获得首届智能制造创新大赛全国二等奖、第十届中国国际“互联网+”大学生创新创业大赛上海市金奖、上海市自动化学会自然科学一等奖等科研奖励。在科研项目方面，主持国家自然科学基金青年项目1项，上海市自然科学基金项目1项；同时作为技术骨干重点参与国家级项目2项，包括科技部国家重点研发计划1项和NSFC重大研究计划1项。目前是中国工业物联网技术与应用专委会成员，受邀担任领域内重要期刊审稿人。

  教育背景

  2014.09-2018.06，西北工业大学，自动化，学士

  2018.09-2024.06，上海交通大学，电子信息，博士

  工作履历

  2024.07-至今，上海交通大学，计算机学院，助理研究员

  论文发表

  [1]

  CAD-GPT: Synthesising CAD Construction Sequence With Spatial Reasoning-Enhanced
  Multimodal LLMs.

  Proceedings of the AAAI Conference on Artificial Intelligence

  , vol. 39, no. 8, Apr. 2025, pp. 7880-8, doi:10.1609/aaai.v39i8.32849.

  [2] Scalable Scheduling in Time-Sensitive Networking: An Efficient Stream Conflict
  Detection Method[J]. IEEE Transactions on Industrial Informatics, 2025, 21(5): 4105-4116.

  [3]  OSSR: Online Scalable Scheduling and Routing for Industrial Time-Sensitive
  Networking[J], IEEE Transactions on Network Science and Engineering, 2025,12(3):
  1761-1775.

  [4]  Scalable Scheduling for Industrial Time-Sensitive Networking: A Hyper-Flow
  Graph-Based Scheme[J], IEEE/ACM Transactions on Networking, 2024, 32(6): 4810-4825.

  [5] Efficient Task-Network Scheduling With Task Conflict Metric in Time-Sensitive
  Networking [J], IEEE Transactions on Industrial Informatics, 2024, 20(2): 1528-1538.

  [6] Scalable Scheduling in Industrial Time-Sensitive Networking: A Flow Graphic
  Distributed Scheme[J]. IEEE Transactions on Industrial Informatics, 2024, 21(2):
  1068-1077, 2024.

  [7]  Efficient Flow Scheduling for Industrial Time-Sensitive Networking: A divisibility
  theory-based method[J]. IEEE Transactions on Industrial Informatics, 2022, 18 (12):9312-9323.

  [8] Learning-based Scalable Scheduling Scheme for Time-Triggered Traffic in Time-Sensitive
  Networking [J], IEEE Internet of Things Journal, 2022, 9(15): 13353-13363.

  获奖信息

  [1] 2025年，上海市自动化学会自然科学奖一等奖，现场级工业物联网的感知-传输联合设计与优化

  [2] 2024年，中国国际大学生创新大赛（2024）上海赛区金奖，星桥—现场级工业智联引领者

  [3] 2023年，上海交通大学“盛宣怀杯”第二十四届学生创新创业大赛金奖，智慧总装—新一代民机总装测试数智化平台

  [4] 2021年，首届智能制造创新大赛，集成方案赛道全国二等奖，基于现场级工业物联网的制造过程质量管控解决方案'
