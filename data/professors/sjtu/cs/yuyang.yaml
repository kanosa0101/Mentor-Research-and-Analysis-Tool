bio_raw: '个人简介

  研究方向为操作系统、系统结构与开源鸿蒙系统。在 OSDI、EuroSys、IEEE TC、SCIS、

  Internetware、VEE

  等计算机领域著名国际会议与期刊上发表论文十余篇，主要工作之一被并入全球最大的Java开源项目OpenJDK主线分支。深度参与国产开源鸿蒙操作系统在港口、电力、智慧工地、教育等关基行业的产学研成果落地与基础设施生态建设。

  教育背景

  2011.09 - 2016.06 复旦大学 计算机系统结构 博士

  2007.09 - 2011.06 南京大学 软件工程 学士

  工作履历

  2024.01 - 至今 上海交通大学 助理研究员

  2018.09 - 2023.12 上海隔镜信息科技有限公司 首席架构师

  2016.07 - 2018.08 中国农业银行数据中心 高级专员

  论文发表

  [EuroSys] Xunjie Wang, Jiacheng Shi (co-first author), Zihan Zhao,

  Yang Yu

  , Zhichao Hua, Jinyu Gu. TZ-LLM: Protecting On-Device Large Language Models with
  Arm TrustZone. Proceedings of the 21th European Conference on Computer Systems,
  2026.

  [Internetware] Yitong Chen, Shenglong Zhao,

  Yang Yu *

  , Zhichao Hua. "DeFS: A Decentralized and High-Performance File System for Consortium
  Systems". Proceedings of the 15th Asia-Pacific Symposium on Internetware. 2025.

  [Internetware] Yitong Chen,

  Yang Yu

  , Zhichao Hua. "DPCapsule: A Decentralized Private Computing System With Self-Controlled
  Data". Proceedings of the 15th Asia-Pacific Symposium on Internetware. 2025.

  [OSDI] Yuanpei Wu, Dong Du, Chao Xu, Yubin Xia,

  Yang Yu

  , Ming Fu, Binyu Zang, Haibo Chen. "OS Rendering Service Made Parallel with Out-of-Order
  Execution and In-Order Commit". 19th USENIX Symposium on Operating Systems Design
  and Implementation. 2025.

  [EuroSys] Jiacheng Shi,

  Yang Yu

  , Jinyu Gu, Yubin Xia. “A Hardware-Software Co-Design for Efficient Secure Containers.”
  Proceedings of the Nineteenth European Conference on Computer Systems. 2025.

  [计算机学报] 杜冬冬, 杨璧丞,

  余炀 *

  , 夏虞斌, 丁佐华, 赵永望, 张磊, 臧斌宇, 陈海波. “SegTEE：面向小型端侧设备的可信执行环境系统.” 计算机学报, 2025.

  [APWeb-WAIM] Yilong Wang,

  Yang Yu *

  , and Dong Du. “Application Framework for OpenHarmony Distributed Trusted Execution
  Environment.” Asia-Pacific Web (APWeb) and Web-Age Information Management (WAIM)
  Joint International Conference on Web and Big Data. 2024.

  [IEEE TC] Yubin Xia, Zhichao Hua,

  Yang Yu

  , Jinyu Gu, Haibo Chen, Binyu Zang, Haibing Guan. “Colony: A privileged trusted
  execution environment with extensibility.” IEEE Transactions on Computers. 2022.

  [SCIS] Zhichao Hua,

  Yang Yu

  , Jinyu Gu, Yubin Xia, Haibo Chen and Binyu Zang. “TZ-Container: Protecting Container
  from Untrusted OS with ARM TrustZone.” SCIENCE CHINA Information Sciences. 2021.

  [SCIS]

  Yang Yu

  , Tianyang Lei, Haibo Chen, Binyu Zang. “Characterizing and optimizing Java-based
  HPC applications on Intel many-core architecture.” Science China Information Sciences.
  2017.

  [VEE]

  Yang Yu

  , Tianyang Lei, Weihua Zhang, Haibo Chen, Binyu Zang. “Performance analysis and
  optimization of full garbage collection in memory-hungry environments.” 12th ACM
  SIGPLAN/SIGOPS International Conference on Virtual Execution Environments. 2016.

  [小型微型计算机系统]

  余炀

  , 臧斌宇. “Java 虚拟机在 Intel 众核架构下的动态数据预取研究与优化.” 小型微型计算机系统, 2016.

  [ICPPW]

  Yang Yu,

  Tianyang Lei, Haibo Chen, Binyu Zang. “Open JDK Meets Xeon Phi: A Comprehensive
  Study of Java HPC on Intel Many-Core Architecture.” International Conference on
  Parallel Processing Workshops. 2015.

  [计算机应用与软件] 张涛,

  余炀

  , 李弋. “Linux 服务器安全审计系统的设计与实现.” 计算机应用与软件. 2014.

  获奖信息

  OpenHarmony竞赛训练营一等奖指导老师、最佳指导老师奖 2025

  第二届中国研究生操作系统开源创新大赛二等奖指导老师、优秀指导教师奖 2025

  OpenHarmony

  先锋课题 2024'
