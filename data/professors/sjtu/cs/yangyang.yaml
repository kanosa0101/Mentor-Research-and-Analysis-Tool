bio_raw: '个人简介

  教授，博士生导师，长期从事人工智能与科学领域的交叉研究（AI for Science）。研究聚焦于机器学习、大语言模型等前沿 AI 技术在生物、化学、材料科学及医学等关键科学领域的创新应用，致力于通过
  AI 驱动的科研新范式，加速科学发现与知识创造。欢迎具有计算机科学、数据科学、生命科学、化学等背景的优秀学生与学者加入团队，共同探索人工智能驱动下的科学新前沿。

  教育背景

  本科毕业于上海交通大学，获计算机科学与技术学士学位。随后在上海交通大学计算机系硕博连读，期间入选上海交通大学-美国加州大学联合培养项目，获计算机软件与理论方向博士学位。

  工作履历

  曾赴美国加州大学河滨分校计算机科学与工程系担任访问学者。随后加入上海交通大学任教，在计算机系先后担任讲师与副教授（2017），现任上海交通大学计算机学院教授（2022至今）。

  教授课程

  人工智能 CS3317 (本科生课程) 秋季学期 2021~2023, 春季学期 2025至今

  面向科学领域的智能算法 CS7357 (研究生课程) 秋季学期 2024至今

  机器学习 CS7336 (研究生课程) 春季学期 2015~2024

  机器学习 CS385 (致远荣誉课程) 春季学期 2016~2020

