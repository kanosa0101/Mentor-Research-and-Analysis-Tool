bio_raw: '个人简介

  姚斌

  ，上海交通大学计算机学院教授，国家优青，机器智能研究所副所长。从事数据库、大数据分析系统、数据挖掘、人工智能等领域研究，发表SIGMOD、VLDB、ICDE、HPCA、VLDBJ、TKDE等高水平学术论文90余篇，获专利授权33项，参与编写两项国家现行标准，参与

  编写首批CCF计算机科学前沿丛书《数据管理十讲》。主持/参与8项国家自然科学基金，5项国家973计划、863计划、重点研发计划，获国家技术发明二等奖、上海市技术发明奖一等奖等。

