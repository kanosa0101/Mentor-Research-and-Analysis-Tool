bio_raw: '个人简介

  1983毕业于杭州大学数学系，1988年获中山大学计算机科学系理学博士学位。1995年在华南理工大学电子与信息学院任教授，博士生导师，1997.11-2002.8在日本理化学研究所脑科学综合研究中心任研究员，2002.9回国到上海交通大学电信学院计算机系任教授，博士生导师。

  主要从事仿脑认知计算模型与机理、

  机器学习与统计推理

  、脑信号处理与脑机交互方面的研究，在国际刊物IEEE PAMI、IEEE TNSRE、IEEE TNNLS，IEEE TSP、IEEE SPL、CVPR、NIPS、ICCV、ACMMM 等期刊上发表论文260余篇。CVPR2007单篇论文Google引用超4900次。

  教育背景

  Ø  1979~1983： 杭州大学数学系数学专业，获理学学士

  Ø  1983~1995： 中山大学计算机科学系攻读硕士, 提前攻博

  Ø  1985~1988： 中山大学计算机科学系攻读博士, 获理学博士学位。

  工作履历

  Ø

  2002.9~ 今：上海交通大学电信电力学院计算机系教授，博士生导师

  Ø  1997.11-2002.08：  日本理研 脑科学研究所，研究员

  Ø  1995.11-1997.10：  华南理工大学电子与信息学院 教授，博士生导师

  Ø  1990.11-1995.10：  华南理工大学自动化系任 副教授

  Ø  1988.07-1990.10：  华南理工大学自动化系任 讲师

  教授课程

  统计学习理论与方法：博士生荣誉课程

  计算机信息技术的飞速发展带来了医学、生物学、财经和营销等诸多领域的海量数据。理解这些数据是一种挑战，这导致了统计学领域新工具的发展，并延伸到诸如数据挖掘、机器学习和生物信息学等新领域。统计学习与推理侧重研究机器学习与推理的统计特性，本课程介绍从实际应用数据中自动提取规则、模式或结构的基本理论与方法,
  使学生掌握基于统计模型的建模、参数识别、模型推理方面的能力。在数据挖掘、人工智能、自然语言处理有着广泛的应用。除了学习统计学习与推理的基本理论与方法外，本课程将提供大型数据分析与建模的课程设计训练，初步掌握解决大型实际系统建模与学习问题的能力。

  本课程适合人工智能、计算机、模式识别、生物医学工程等专业领域的博士生、硕士研究生。

  2. 机器学习（强化）: 永强班专业课程

  机器学习是一门多领域交叉学科，涉及概率统计、最优化、算法复杂性、神经科学等多门学科。研究计算机怎样模拟或实现人类的感知、推理、决策、学习行为。重点研究数据驱动的预测系统的学习与推理问题，使得预测系统具有优化的泛化能力和环境适应能力。

  本课程旨在介绍机器学习中的基本问题、基础理论和核心算法，并通过课程设计提升学生的系统建模能力和系统实现能力。本课程主要讲授内容包括：机器学习基础、学习机理与优化算法、线性回归与分类、逻辑斯蒂回归、决策树与随机森林、支持向量机、核方法和正则化学习、神经网络与深度学习、数据降维与聚类、隐变量模型与表征学习、概率图模型、前沿课题。

  本强化课程重点体现在：强调交叉性，特别机器学习与认知神经科学之间的紧密关联；强化学生的系统建模能力与系统实现能力。在课程学习过程中布置相应的模型与算法实现任务，要求学生设计机器学习程序来完成多个人工智能任务。最终通过一个综合的课程设计训练学生综合解决实际问题的能力。

