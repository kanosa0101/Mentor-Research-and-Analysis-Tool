bio_raw: '个人简介

  彭博，博士，助理研究员，博士生导师。

  主要研究领域：系统软件、云计算与虚拟化、内存存储系统。

  长期从事异质内存存储硬件的操作系统设计与虚拟化技术研究、面向CPU/GPU/NPU等异构先进计算系统的异质内存存储架构研究等。

  以第一作者/通讯作者于OSDI、ATC、ASPLOS、IEEE TC，ACM TACO等CCF-A/B类会议或期刊上

  发表论文10余篇，申请国家发明专利10余项，已获授权5项。

  主持包括国家自然基金青年项目、上海市自然基金面上项目等国家级省部级项目

  4项，主持多项与华为、阿里等企业的校企合作项目

  。

