bio_raw: '个人简介

  上海交通大学人工智能研究院，教授，博士生导师。博士毕业于新加坡南洋理工大学电气电子工程学院，研究方向为人工智能、时空智能、多模态医学影像计算分析、疾病诊断和疗效预测，以第一/通信作者在国内外重要刊物和会议Nature
  Machine Intelligence、IEEE Trans TMI、Neuroimage等核心期刊发表70余篇，1篇ESI高被引论文，多次获最佳论文奖。作为负责人主持国家自然科学基金、国家重点研发计划课题、上海市等项目多项。2019年获得吴文俊人工智能科学技术奖自然科学奖，获得“晨星青年学者奖励计划”
  A类奖励计划。担任多个国际期刊的编委、以及中韩人工智能和脑科学前沿研讨会、 ICIT2020大会主席。

  实验室

  招收2026-2027年入学的研究生和博士生，

  欢迎对多模态人工智能、脑科学、多模态医学影像计算分析、三维视觉重建等方向感兴趣的同学加入。

  欢迎对科研感兴趣的本科生加入课题组从事科研实践工作。

