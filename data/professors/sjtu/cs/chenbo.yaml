bio_raw: '个人简介

  陈博，上海交通大学计算机学院长聘教轨副教授、博士生导师。2022年于美国伊利诺伊大学厄巴纳—香槟分校获得计算机科学博士学位，师从Klara Nahrstedt教授，随后在该校计算机系从事博士后研究工作。

  主要研究方向包括网络信息系统、机器学习系统、沉浸式计算、移动与边缘计算、多媒体系统等，重点研究面向智能视觉、扩展现实和三维内容应用的端—边—云协同计算、智能内容传输与系统优化。相关研究致力于解决复杂网络环境下智能应用所面临的带宽、时延、能耗和计算资源受限问题。

