bio_raw: '个人简介

  潘昊，上海交通大学计算机科学学院长聘教轨副教授，博士生导师，MINDS（移动智能网络与系统）实验室副主任。2022至2025年曾任微软亚洲研究院高级研究员。主要研究方向为移动与网络系统，涵盖无线通信（低轨卫星、毫米波/太赫兹）与感知、射频信号理解、可穿戴健康、物理层安全及3D计算机视觉等，并且当前正积极探索具身端侧智能、智能体AI、AI4SCI（电磁计算、医工交叉）等前沿方向。相关研究成果发表在MobiCom、SIGCOMM、MobiSys、SenSys、TMC、ToN等国际顶级会议和期刊，并担任MobiCom
  2025/2026/2027、MobiSys 2025/2026、SenSys 2026/2027等国际会议技术程序委员会委员（TPC），长期为TMC、ToN、TPAMI等顶级期刊担任审稿人。

  欢迎对具身/嵌入式智能、可穿戴AI技术、无线感知与通信、健康医疗、AI4SCI等领域感兴趣的同学加入我们团队。

