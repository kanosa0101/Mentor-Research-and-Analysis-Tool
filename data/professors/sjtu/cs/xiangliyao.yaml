bio_raw: '个人简介

  主要研究方向为数据安全隐私，人工智能安全隐私，智能物联网等，其代表性成果发表在网络安全、机器学习、

  数据挖掘

  领域国际一流会议与期刊，包括

  IEEE S&P

  ，

  NDSS

  ，CCS，

  INFOCOM

  ，

  UbiComp

  ，

  ICLR

  ，

  NeurIPS

  ，

  IEEE TIFS

  ，

  IEEE TDSC

  等，其中担任一作或者通讯作者的会议或期刊

  30

  余篇，包括

  A

  类

  20余

  篇，担任

  AAAI

  、

  KDD

  、

  ICDM

  、

  SDM

  、

  ICDCS

  等会议程序委员会成员。作为项目负责人，主持国家自然科学基金委面上项目、青年项目、上海市扬帆计划项目、

  CCF-

  蚂蚁科研基金项目、华为

  -

  上海交通大学网络空间安全学院创新实验室合作项目等，作为课题负责人、项目骨干参与国家自然科学基金委重点项目、科技创新

  2030

  —“新一代人工智能”重大项目。获得

  2024

  年

  ACM

  中国上海分会新星奖。

  教育背景

  2012年，上海交通大学，信息工程，学士

  2018年，多伦多大学，计算机工程，博士

  工作履历

  2018年-2021年，上海交通大学，John中心，助理教授

  2021年-2024年，上海交通大学，John中心，长聘教轨副教授

  2024年 至今，上海交通大学，John中心，长聘副教授

  教授课程

  工科平台课，数据结构

  人工智能专业课，数据挖掘

  论文发表

  请见个人主页xiangliyao.cn

  资助项目

  国家自然科学基金委员会面上项目，62272306 , 面向隐式表征的端-云协同数据安全技术， 2023.01-2026.12，主持

  华为-上海交通大学网络空间安全学院创新实验室合作项目，基于梯度分布的机器学习差分隐私算法研究技术项目（YBN2019105168-SOW15），主持

  国家自然科学基金委员会重点项目，62032020，新型群智感知网络中数据深度获取与服务化计算，2021.01.01-2025.12.31，第二参与

  CCF-蚂蚁科研基金项目，CCF-AFSGRF20200007，多方数据共享场景下的隐私保护机制研究，2020.11.1-2021.10.31，主持

  国家自然科学基金委青年基金项目，61902245，移动端深度学习系统中的隐私保护研究，2020.01-2022.12，主持

  上海市科委扬帆计划项目，19YF1424500，深度学习应用中的个人数据隐私保护研究，2019.05-2022.04，主持

  学术服务

  TPC for AAAI 2025, ICDM 2024, KDD 2023, ICDM 2023, SDM 2023, ICDCS 2021, etc.'
