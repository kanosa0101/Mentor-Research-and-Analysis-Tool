bio_raw: '个人简介

  毕业于上海交通大学电子信息与电气工程学院，获工学博士学位。分别于2009年及2015年赴美国康涅狄格大学与弗吉尼亚联邦大学访问研究。主要研究方向为区块链与数字货币、

  密码协议设计与安全性分析、

  安全多方计算等。在研究领域发表论文数十篇，主持参与多项国家及上海科研项目，获得上海市科技进步一等奖一项，与华为技术、西门子、中国电信、太平洋保险、联合汽车电子等企业完成多项科技合作项目。

  教育背景

  2000.3-2003.7  上海交通大学电子信息学院，通信与信息系统，获得工学博士学位

  1997.9-2000.3  西北工业大学电子工程系，通信与信息系统，获得工学硕士学位

  1994.9-1997.7  西北工业大学电子工程系， 通信与信息系统，获得工学学士学位

  工作履历

  2005-今 上海交通大学 信息安全工程学院 副教授

  2003-2005 上海交通大学 信息安全工程学院 讲师

  2015.6-2016.6 美国弗吉尼亚联邦大学 计算机系 访问学者

  2009.3-2009.9 美国康涅狄格大学 计算机系 访问学者

  教授课程

  本-CS0501《数据结构》

  本-NIS3607 《区块链技术及应用》

  研-NIS8020《区块链原理及应用》

  本-IS303 《数据挖掘》

  论文发表

  [1] Lei Fan, Jonathan Katz, Zhenghao Lu, Phuc Thai, Hong-Sheng Zhou. Best-Possible
  Unpredictable Proof-of-Stake: An Impossibility and a Practical Design. EuroS&P 2025: 480-503

  [2] Siwei Cai, Lei Fan, Shengyun Liu, Hong-Sheng Zhou. EquiBFT: A Framework for
  Achieving Fairness in BFT Consensus. ICDCS 2025: 341-351

  [3] Chi Feng, Lei Fan. BlockLens: Detecting Malicious Transactions in Ethereum Using
  LLM Techniques. ISC 2025: 581-601

  [4] Rongji Huang, Xiangzhe Wang, Xiaofeng Yan, Lei Fan, Guangtao Xue, Shengyun Liu. Chitu:
  Avoiding Unnecessary Fallback in Byzantine Consensus. USENIX ATC 2025: 923-942

  [5] Zhenghao Lu, Ding Ma, Lei Fan, Xiuzhen Chen, Yongshuai Duan, Jia Zhang.  A Universally
  Composable Key Management System Using Trusted Hardware. TrustCom 2024: 1681-1686

  [6] Zixuan Chen, Lei Fan, Shengyun Liu, Marko Vukolic, Xiangzhe Wang, Jingjing Zhang. Bridging
  the Gap of Timing Assumptions in Byzantine Consensus. Middleware 2023: 178-191

  [7] Shengyun Liu, Wenbo Xu, Chen Shan, Xiaofeng Yan, Tianjing Xu, Bo Wang, Lei Fan, Fuxi
  Deng, Ying Yan, Hui Zhang. Flexible Advancement in Asynchronous BFT Consensus. SOSP 2023: 264-280

  [8] Chen Shan, Lei Fan. Lodestone: An Efficient Byzantine Fault-Tolerant Protocol
  in Consortium Blockchains.  SCN 2021:1-10

  [9] Chenkai Shen, Lei Fan. Pldb: Protecting LSM-based Key-Value Store using Trusted
  Execution Environment. TrustCom 2023: 762-771

  [10] Tuyet Duong, Lei Fan, Jonathan Katz, Phuc Thai, Hong-Sheng Zhou. 2-hop Blockchain:
  Combining Proof-of-Work and Proof-of-Stake Securely. ESORICS (2) 2020: 697-712

  [11] Dilu Zhang, Lei Fan. Cerberus: Privacy-Preserving Computation in Edge Computing. INFOCOM
  Workshops 2020: 43-49

  获奖信息

  上海市科技进步一等奖 《计算机网络信息分析取证关键技术研究及应用》2013

  学术服务

  《上海交通大学学报（英文版）》2025年度“有突出贡献”审稿专家。《Blockchain: Research and Applications》、《ACM Transactions
  on Privacy and Security》等期刊审稿人，TrustCom PC Member。'
