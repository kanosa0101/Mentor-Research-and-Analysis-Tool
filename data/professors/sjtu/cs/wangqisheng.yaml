bio_raw: '个人简介

  王启圣，上海交通大学计算机学院长聘教轨副教授，博士生导师，入选2025年国家级青年人才计划。

  目前已发表学术论文30余篇，包括SICOMP、TIT、IANDC等以及SODA、CCC、COLT、ESA等理论计算机期刊和会议。

  研究领域：量子计算。

  研究方向：量子算法与复杂性。

  教育背景

  2017年-2022年：清华大学　计算机科学与技术系　博士

  2013年-2017年：清华大学　计算机科学与技术系　学士

  工作履历

  2026年-　今　：上海交通大学　计算机学院　长聘教轨副教授

  2024年-2026年：英国　爱丁堡大学　信息学院　高级研究员

  2022年-2024年：日本　名古屋大学　大学院多元数理科学研究科　特任助理教授

  论文发表

  代表性论文：

  [1] Qisheng Wang. Optimal trace distance and fidelity estimations for pure quantum
  states.

  IEEE Transactions on Information Theory

  , 70(12): 8791-8805, 2024.

  [2] Qisheng Wang and Zhicheng Zhang. Quantum lower bounds by sample-to-query lifting.

  SIAM Journal on Computing

  , 54(5): 1294-1334, 2025.

  [3] Qisheng Wang and Zhicheng Zhang. Time-efficient quantum entropy estimator via
  samplizer.

  IEEE Transactions on Information Theory

  , 71(12): 9569-9599, 2025.

  [4] Yupan Liu and Qisheng Wang. On estimating the trace of quantum state powers.
  In

  Proceedings of the 2025 Annual ACM-SIAM Symposium on Discrete Algorithms

  (SODA 2025), pp. 947-993, 2025.

  [5] Minbo Gao, Zhengfeng Ji, Qisheng Wang, Wenjun Yu, and Qi Zhao. Quantum Hamiltonian
  certification. In

  Proceedings of the 2026 Annual ACM-SIAM Symposium on Discrete Algorithms

  (SODA 2026), pp. 1424-1467, 2026.

  论文完整列表参见

  https://wangqs13.github.io/publications/

  或

  https://scholar.google.com/citations?user=t9NllbcAAAAJ

  。

  资助项目

  国家自然科学基金优秀青年科学基金项目（海外）

  获奖信息

  ACM/ICPC 2014 北京区域赛金牌

  NOI 2012 金牌

  学术服务

  学术会议程序委员会委员：

  QCE 2026

  TQC 2026

  QCE 2025

  QCE 2024

  AQIS 2023'
