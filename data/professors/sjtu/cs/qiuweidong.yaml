bio_raw: '个人简介

  长聘教授/博士生导师，中国中文信息学会大数据与隐私计算专委会副主任委员、ACM SIGSAC CHINA技术委员会委员、电子学会高级会员、国家移动信息产业技术创新战略联盟网络特种技术专业委员会专家，入选教育部“新世纪优秀人才计划”、上海市优秀技术带头人，荣获中央网信办全国网络安全优秀教师。

  长期从事密码分析/密码工程、数据要素共享流通安全、大数据隐私保护等方向的研究工作，先后主持了“十四五”国家重点研发计划项目（首席科学家）、

  131专项集成验证项目、

  “十三五”

  国家重点研发计划课题、

  国家科技部

  863专项项目、国家自然科学基金等多项国家项目，在TIFS、TDSC、IJCAI、CSCW、CHI、FSE发表论文150余篇，研究成果荣获上海市科技进步一等奖、上海市计算机学会科技进步一等奖。

  教育背景

  2001.11-2004.01，德国哈根大学，博士后

  1998.02-2001.07，上海交通大学，计算机软件与理论，博士

  1995.09-1998.02，西安电子科技大学，密码学，硕士

  1991.09-1995.07，西安电子科技大学，应用数学，学士

  工作履历

  2004-至今，上海交通大学计算机学院（网络空间安全学院），教授/博导

  教授课程

  本科专业必修课程：现代密码学

  研究生课程：密码协议

  论文发表

  1. Guowei Ling, Peng Tang, Jinyong Shan, Fei Tang, Weidong Qiu,“More Efficient,
  Privacy-Enhanced, and Powerful Privacy-Preserving Feature Retrieval Private Set
  Intersection,” Transactions on Information Forensics and Security (TIFS), 2025.

  2. Guowei Ling, Peng Tang, Fei Tang, Shifeng Sun, Shouling Ji, Weidong Qiu, “Ultra-Fast
  Private Set Intersection from Efficient Oblivious Key-Value Stores,” IEEE Transactions
  on Dependable and Secure Computing (TDSC), 2025.

  3. Peng Tang, Xiaoyu Zhu, Weidong Qiu, Zheng Huang, Zhenyu Mu, Shujun Li, “FLAD:
  Byzantine-Robust Federated Learning Based on Gradient Feature Anomaly Detection,” IEEE
  Transactions on Dependable and Secure Computing (TDSC), 2025.

  4. Yangde Wang, Weidong Qiu, Peng Tang, Hao Tian, Shujun Li, “SE#PCFG: Semantically
  Enhanced PCFG for Password Analysis and Cracking,” IEEE Transactions on Dependable
  and Secure Computing (TDSC), 2025.

  5. Yuqi Niu, Weidong Qiu, Peng Tang, Lifan Wang, Shuo Chen, Shujun Li, Nadin Kökciyan,
  Ben Niu, "Everyone''s Privacy Matters! An Analysis of Privacy Leakage from Real-World
  Facial Images on Twitter and Associated User Behaviors," 28th ACM Conference on
  Computer-Supported Cooperative Work and Social Computing (CSCW), 2025.

  6. Yuqi Niu, Nicole Meng-Schneider, Weidong Qiu, Nadin Kökciyan, “‘I am not the
  primary focus’-Understanding the Perspectives of Bystanders in Photos Shared Online,"
  2025 CHI Conference on Human Factors in Computing Systems (CHI), 2025.

  7. Guowei Ling, Fei Tang, Chaochao Cai, Jinyong Shan, Haiyang Xue, Wulu Li, Peng
  Tang, Xinyi Huang, and Weidong Qiu, “P2FRPSI: Privacy-Preserving Feature Retrieved
  Private Set Intersection,” IEEE Transactions on Information Forensics and Security
  (TIFS), vol. 19, pp. 2201-2216, 2024.

  8. Ke Hu, Peng Tang, Liyao Xiang, and Weidong Qiu, “Feature Norm Regularized Federated
  Learning: Utilizing Data Disparities for Model Performance Gains,” IJCAI 2024.

  9. Jianfei Sun, yangyang bao, Weidong Qiu, Rongxing Lu, Songnian Zhang, Yunguo Guan,
  Xiaochun Cheng, “Privacy-preserving Fine-grained Data Sharing with Dynamic Service
  for the Cloud-edge IoT,” IEEE Transactions on Dependable and Secure Computing (TDSC),
  2024.

  10. Fei Tang, Guowei Ling, Chaochao Cai, Jinyong Shan, Xuanqi Liu, Peng Tang, Weidong
  Qiu. “Solving Small Exponential ECDLP in EC-Based Additively Homomorphic Encryption
  and Applications,” IEEE Transactions on Information Forensics and Security (TIFS),
  vol. 18, pp. 3517-3530, 2023.

  11. Huina Li, Le He, Shiyao Chen, Jian Guo, Weidong Qiu, “Automatic Preimage Attack
  Framework on Ascon Using a Linearize-and-Guess Approach,” IACR Transactions on Symmetric
  Cryptology (FSE), 2023.

  12. Guozhen Liu, Weidong Qiu, and Yi Tu,

  “

  New Techniques for Searching Differential Trails in Keccak,

  ”

  IACR Transactions on Symmetric Cryptology (FSE), 2019.

  资助项目

  1. “十四五”国家重点研发计划项目，“面向数据可信确权与交易的安全保障技术”（编号：2023YFB3106500）, 2023.12-2026.11，主持

  2. 131专项集成验证项目， "网络空间自主对抗关键技术研究及验证平台搭建"，2024.12-2025.12，主持

  3. “十三五”国家重点研发计划课题， “电子凭据体系安全监测与追溯处置关键技术及系统”（编号：2017YFB0802704），2017.07-2020.12，主持

  4. 国家自然基金项目，“基于内部置换差分分析的sha3安全性研究”（编号61972249），2020.1-2023.12，主持

  5. 上海交大-太保人工智能联合实验室，2021-2023，共同创建人

