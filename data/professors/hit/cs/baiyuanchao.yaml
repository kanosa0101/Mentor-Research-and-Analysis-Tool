title: 副研究员
email: yuanchao.bai@hit.edu.cn
bio_raw: 柏园超，副研究员，就职于计算学部人工智能学院，智能接口与人机交互研究中心。 柏园超，现为哈尔滨工业大学计算学部副研究员。 2020 年博士毕业于北京大学信息科学技术学院，数字视频编码技术国家工程实验室，师从高文院士。攻读博士期间曾于
  2017 年 9 月至 2018 年 8 月赴日本国立信息学研究所 Gene Cheung 教授课题组进行访问交流。 2020 年至 2022 年在深圳鹏城实验室从事博士后研究工作，合作导师为刘贤明教授。主要研究方向为视觉信号处理与通信、计算机视觉、生成式人工智能，在
  TPAMI 、 TIP 、 TCSVT 、 TSP 、 CVPR 、 AAAI 、 ACMMM 等计算机视觉和信号处理领域国际顶级期刊和会议发表论文 30 余篇。担任国际期刊
  TPAMI/TIP/TSP/TCSVT/TMM 和国际会议 CVPR/AAAI/ICCV/ECCV 等的审稿人。主持国家自然科学基金青年项目、国家重点研发计划子课题、中国博士后科学基金面上资助、黑龙江省博士后科学基金等项目。获得
  “ 猛犸杯 ” 国际生命科学数据创新大赛 DNA 存储赛道一等奖，国际数据压缩领域顶级会议 IEEE DCC 国际智能编码 CLIC 挑战赛图像赛道一等奖，中国机器人及人工智能大赛机器人应用赛（自动驾驶仿真）专项赛一等奖及优秀指导教师奖等。
  欢迎有学术意愿的本科生加入课题组实习或攻读硕士学位（ 刘贤明 、 江俊君 教授为团队负责人，团队联合培养），期间有优秀成果可推荐攻读 刘贤明 、 江俊君 教授硕博，或推荐北京大学、香港城市大学、香港岭南大学等继续深造。
  教育经历 名称 2013年9月~2020年1月，北京大学，计算机应用技术，理学博士 2009年9月~2013年6月，大连理工大学，软件工程，工学学士 工作经历
  名称 2025年3月至今， 哈尔滨工业大学计算学部，副研究员 2022年4月 ~2025年2月 ，哈尔滨工业大学计算学部，助理教授 2020年4月~2022年2月，深圳鹏城实验室，博士后
  2017年9月~2018年8月，日本国立信息学研究所，访问学生
