title: 长聘教授
email: jiangjunjun@hit.edu.cn
bio_raw: '江俊君，哈尔滨工业大学计算学部长聘教授、博导，人工智能学院副院长，智能接口与人机交互研究中心副主任，入选国家级青年人才计划。 2014 年 12
  月于武汉大学计算机学院获得博士学位， 2016 年至 2018 年在日本国立情報学研究所担任特任研究员。研究方向主要包括图像复原、机器视觉、多模态 智能 感知与融合等。相关研究成果发表
  IEEE汇刊、 CCF A 类论文 百 余篇，含 13篇 IEEE TPAMI，发表论文被谷歌学术引用3.1万次， H 因子为 80 ，入选全球高被引科学家 、全球前0.05%顶尖科学家
  、中国高被引学者等榜单。出版人脸超分辨率和高光谱图象处理专著各 1 部，获得国家发明专利授权 42 项。担任Information Fusion期刊领域编委（2024年获最佳编委奖）、Pattern
  Recognition编委、Fundamental Research和IEEE/CAA JAS期刊青年编委。曾获吴文俊人工智能科学技术奖自然科学奖一等奖（序1）、吴文俊人工智能优秀青年奖和中国计算机学会优秀博士论文奖
  ，参与获得黑龙江省教学成果特等奖和 湖北省科技进步一等 奖。指导博士生获得首批国家自然科学基金青年学生基础研究项目资助，指导学生在国际顶级会议挑战赛11次获得冠亚军。主持国家重点研发计划课题、国家自然科学基金联合重点/面上/青年项目。
  Junjun Jiang is a tenured full professor and doctoral supervisor at the School of
  Computer Science and Technology, Harbin Institute of Technology. He currently serves
  as Vice Dean of the Faculty of Computing and Artificial Intelligence and Deputy
  Director of the Research Center for Intelligent Interface and Human–Computer Interaction.
  He has been selected for a national-level young talent program. He earned his Ph.D.
  in Computer Science from Wuhan University in December 2014. From 2016 to 2018, he
  worked as a specially appointed researcher at the National Institute of Informatics
  (NII) in Japan. His primary research focuses on image processing, computer vision,
  and deep learning, with particular emphasis on large-scale foundation models for
  image processing, multimodal autonomous unmanned systems, and generative artificial
  intelligence. He has published more than 100 papers in IEEE Transactions or CCF
  A-class papers, including 12 papers in IEEE TPAMI. These works have garnered over
  30,000 citations on Google Scholar, with an H-index of 76. He has been consistently
  recognized on lists such as Global Highly Cited Researchers, the global top 0.05%
  of scientists, and China’s Highly Cited Scholars. He serves as Area Editor for Information
  Fusion (where he received the Best Area Editor Award in 2024), Editorial Board Member
  of Pattern Recognition , and Young Editorial Board Member of Fundamental Research
  and IEEE/CAA Journal of Automatica Sinica . Among his major honors are the First
  Prize of the Natural Science Award from the Wu Wenjun Artificial Intelligence Science
  and Technology Award (ranked first), the Wu Wenjun Artificial Intelligence Outstanding
  Youth Award, the China Computer Federation Outstanding Doctoral Dissertation Award,
  and the Special Prize for Teaching Achievement in Heilongjiang Province. Under his
  supervision, doctoral students have secured funding from the first batch of National
  Natural Science Foundation of China Youth Student Basic Research Projects, and his
  students have achieved champion or runner-up positions in international top-tier
  conference challenges 11 times. He has led projects under the National Key R&D Program
  of China and has been the principal investigator of multiple grants from the National
  Natural Science Foundation of China, including Joint Key Projects, General Programs,
  and Youth Science Foundation projects. 招生信息 名称 常年招收博士后研究员、博士研究生、硕士研究生、本科实习生 。有意者请填写
  问卷表 或直接邮件联系！ 招生方向：大模型与图像处理、多模态自主无人系统、生成式人工智能。 优秀博士研究生可申请 院士联合培养 、国家实验室联合培养 和国家AI专项等
  ，也可申请苏州、郑州等异地研究院专项。 常年招收高层次人才 、助理教授 、博士后研究员 等岗位。 薪酬待遇：国家级青年人才年薪100万元 ，助理教授年薪35万
  元 ， 博士后研究员 年薪25万 元 ， 绩效上不封顶 。 Positions Open Year-Round: We are actively recruiting
  postdoctoral researchers, Ph.D. students, master''s students, and undergraduate
  research interns. If you are interested, please fill out the application form or
  contact us directly via email. Research Areas: Large models and image processing
  Multimodal autonomous unmanned systems Generative artificial intelligence Outstanding
  Ph.D. candidates may apply for joint training programs with academicians, national
  laboratories, or national AI initiatives. Special programs are also available through
  research institutes in Suzhou, Zhengzhou, and other locations. Talent Recruitment:
  We welcome applications for high-level talents, assistant professors, and postdoctoral
  researchers throughout the year. Compensation and Benefits: National-level young
