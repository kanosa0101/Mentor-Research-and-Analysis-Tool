  研究方向

  教育背景

  郑鹏，男，1965年5月出生，博士，副教授。

  承担操作系统、Linux原理与应用、视频数据库等课程的教学工作

  工作经验

  国家自然科学基金项目，空间索引技术研究，主要参与者，已结题；湖北省自然科学基金项目，视频数据库中的生物特征索引技术研究，主持，在研。

  教授课程

  视频流中运动对象的轨迹，小型微型计算机系统，2000年第5期。视频数据库中的数据更新，计算机工程与应用，2000年第9期。模糊聚合算子在医疗诊断中的应用，计算机工程与应用，2001年第24期。
  A Fast Shot Transition Detecting Algorithm on MPEG Sequences，Wuhan University Journal
  of Natural Science，2003年第2期。经典同步问题的教学体会，中国教育理论杂志，2003年6月。基于DVB的视频关键帧浏览系统的实现，中国图象图形学报，2003年第12期。直接在MPEG压缩视频中获取颜色特征，计算机工程与应用，2003年第32期。一个获取镜头特征的有效算法，武汉大学学报（理学版），2004年第3期。
  A Method to Recognize Caption Area in MPEG Compressed Video，Wuhan University Journal
  of Natural Science，2005年第2期。

