  研究方向

  蒋晶珏，武汉大学摄影测量与遥感专业博士，主讲《数据结构》和《操作系统原理》课程。目前的研究方向包括激光雷达数据处理、点云数据的三维重建以及计算机视觉与智能视觉监控等。编写了自考辅导教材《数据结构导论自考辅导》。发表国际会议及核心期刊论文十余篇，其中EI检索论文五篇。

  教育背景

  承担本科《数据结构》及《操作系统原理》课程

  工作经验

  完成课题：863目标导向类项目－机载激光雷达数据处理软件平台

