  科研课题

  研究团队

  本课题组招收博士/硕士研究生和优秀本科生，将为学生提供良好的工作学习环境、待遇和悉心的指导，欢迎有意从事物联网、移动感知与智能计算、空间智能认知与位置服务、模式识别、群智感知隐私保护方向研究的同学与我联系。课题组将努力引导学生接触最新的科学研究，发表高水平研究成果，为将来毕业工作或继续深造打造良好的基础。对于优秀学生，本课题组将提供去国外高校学习交流的机会，以及推荐到国内外知名大学攻读博士学位。

