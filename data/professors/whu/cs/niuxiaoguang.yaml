  招生信息：

  2019年度招收硕士3名，招收方向：计算机科学与技术(学硕),软件工程(学硕)。 招收博士1名，招收方向：计算机科学与技术,软件工程。

  研究方向

  大数据挖掘管理与分析,机器学习与智能交互,计算机网络,模式识别,网络安全,无线网络,物联网,智能计算

  教育背景

  牛晓光，武汉大学计算机学院教授，CCF/IEEE/ACM会员，CCF物联网专委会委员，教育部创新团队成员。研究领域包括移动感知与智能计算、物联网、空间智能认知与位置服务、计算机网络、网络安全与隐私保护、模式识别/人工智能在移动计算/位置服务方面的应用。主持国家自然科学基金2项，国家重点研发计划项目子课题2项，湖北省自然科学基金2项，湖北省教改项目1项，教育部重点实验室开放基金1项。作为研究骨干获中国测绘科技进步特等奖1项，北京市科技进步三等奖1项；在国际期刊和会议发表论文30余篇(SCI
  检索21篇)，担任多个国际会议/SCI期刊的审稿人。

  工作经验

  教授课程

  《计算机网络》、《物联网定位技术》、《物联网应用与技术》

