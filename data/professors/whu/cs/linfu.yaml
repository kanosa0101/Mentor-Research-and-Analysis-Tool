  2019年度招收硕士2名，招收方向：计算机科学与技术(学硕),计算机技术(专硕)。 招收博士0名，招收方向：。

  研究方向

  已发表论文20余篇；主持国家级、省部级纵向项目多项，参与过863重大项目。

  研究方向：计算机网络，人工智能，物联网

  目前主要研究领域：无线传感器网络，智慧工厂，人工智能，嵌入式软件技术，智能手机软件技术

  教育背景

  林馥，男，博士，副教授，硕士生导师。2006年6月在武汉大学计算机学院获得计算机应用技术博士学位；2006年8月进入武汉大学计算机学院任教，任讲师；2011年11月被武汉大学聘为副教授，并被遴选为硕士生导师。

