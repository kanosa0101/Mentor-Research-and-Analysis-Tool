  研究方向

  信号处理算法，多媒体通信技术、机器学习方法工作经历

  教育背景

  1983～1987年：武汉大学电子信息工程系，无线电电子学专业，学士学位。

  1987～1990年：武汉大学电子信息工程系，无线电电子学专业，硕士学位。

  工作经验

  1990～1997年：中国科学院武汉物理研究所，助理研究员，信号处理算法研究。

  1997～1999年：原武汉测绘科技大学多媒体网络通信研究所，副研究员，多媒体通信协议研发。

  2000～2007年：武汉精伦电子股份公司，研发中心负责人，主持网络通信终端与信息服务终端研发。

  2007年至今：武汉大学计算机学院、国家多媒体软件工程技术研究中心，副研究员，机器学习方法研究。

  主持完成多项由国家电子信息产业基金、科技部火炬计划和湖北省、武汉市科技计划支持的网络通信终端、信息服务终端与移动商务终端等产业化研发项目。曾获武汉市技术创新先进工作者。目前从事信号处理新算法、机器学习新方法及其在大数据分析中等应用等研究。

