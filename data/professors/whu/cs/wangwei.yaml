bio_raw: '1.

  个人与课题组情况介绍

  王巍，武汉大学计算机学院教授、博士生导师，获国自然青年科学基金

  B

  类项目获得者（原国家优秀青年科学基金），中国科协青年托举人才，欧盟玛丽居里学者，湖北省

  BR

  计划、湖北省

  CT

  学者计划、华中科技大学学术新人奖。

  2010

  年毕业于华中科技大学获本科学位，

  2015

  年毕业于香港科技大学获博士学位，

  2019

  年加州大学圣地亚哥分校访问学者。主要研究方向无源物联网、多模态具身智能感知、

  AI

  医疗健康

  等，发表

  CCF-A

  类论文

  40

  余篇、中科院一区期刊

  30

  余篇。担任

  IEEE Transactions on Mobile Computing (CCF A

  类，中科院一区

  )

  、

  ACM IMWUT (CCF A

  类

  )

  等国际期刊编委，《中国科学：信息科学》（

  CCF A

  类）等客座编委，担任本领域

  8

  个国际会议主席等学术职务。主持国家自然科学基金、国家重点研发计划课题、湖北省重点研发计划等多项科研项目。与华为、腾讯、中兴、

  vivo

  、

  OPPO

  、小米、南方电网、中国电科、中铁等企业长保持长期科研项目合作，并获华为火花奖、多个企业优秀合作奖。

  课题组由香港科技大学首席教授、香港工程科学院院士、教育部CJ讲座教授、

  IEEE Fellow

  张黔教授领衔（

  1990

  级计算机科学系校友、

  131

  周年校庆特邀嘉宾

  https://news.whu.edu.cn/info/1002/471787.htm

  ）。课题组专注于以物联网底层硬件设计

  +AI/LLM

  上层算法为核心的软硬结合方法，赋能具身智能、自动驾驶、医疗健康等行业交叉研究。

  指导本科生多次获得互联网

  +

  全国大学生创新创业大赛、创青春全国青年创新创业大赛、全国大学生嵌入式芯片与系统设计竞赛、湖北省楚天创客、华中科技大学全球校友创新创业大赛等多个国家、省、校级竞赛奖励。指导研究生多次获国家奖学金。硕博就业去向包括武汉大学、郑州大学、武汉理工大学等高校教职，华为、大疆、阿里、字节、小红书、腾讯等行业巨头以及多个企事业单位，本科生赴国外深造院校包括卡耐基梅隆大学、苏黎世联邦理工、香港、新加坡等高校。在读学生与就业详情请见团队主页

  https://metaiot.group/

  实验室介绍：实验室位于武汉大学新建成的雷军科技楼，实验室配备全新的办公、活动及科研设施。团队科研氛围轻松自由，倡导

  “

  自主探索、高效协作

  ”

  的学术文化，日常管理不设打卡制度，尊重学生个性化发展需求，鼓励学生相互合作。支持并推荐研二学生外出实习，尽力为硕士博士推荐工作。支持鼓励学生发表高水平论文并全额资助参加国内外顶级学术会议，团队定期组织团建聚餐活动，鼓励合作共勉。团建与国际参会详情请见团队主页

  https://metaiot.group/

  欢迎对相关研究领域有浓厚兴趣的同学联系攻读博士、硕士研究生！欢迎优秀本科同学加入课题组参与各类科研学习！！

