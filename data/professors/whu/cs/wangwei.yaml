  研究方向

  无源物联网：硬件设计、嵌入式

  /FPGA

  开发、标准协议与传输、智能感知算法等

  具身智能：面向无人机、机器人、自动驾驶汽车的多模态感知、定位导航、渲染、

  VLA/VLM

  等

  AI for health

  ：面向运动康复、呼吸疾病早筛的多模态大模型、智能硬件系统等'
