title: 副教授
bio_raw: '陈金富

  武汉大学计算机学院 软件工程系 副教授

  研究方向

  陈金富，博士，副教授，小米青年学者。主要研究方向：软件性能分析、软件数据挖掘、代码克隆检测、软件漏洞挖掘。2020年获得加拿大康考迪亚大学博士学位，随后加入华为加拿大多伦多研究所工作，2022年加入武汉大学计算机学院工作。发表十余篇软件工程领域的论文，以第一或通讯作者发表软件工程领域权威期刊TSE（CCF
  A）论文2篇、软件工程权威会议ICSE（CCF A）论文1篇、软件工程权威会议ASE（CCF A）论文2篇，其中2020年权威会议ICSE论文获得杰出论文奖(ACM
  SIGSOFT Distinguished Paper Award)。在软件工程国际知名会议SANER、MSR、IBF、PROMISE、IWSC、LTB主会、ASE和ICPE分会Artifact
  Evaluation Track曾担任评审委员会成员，在多个国际知名期刊如TSE、EMSE、ASE、JSS、TR、JSEP等担任过审稿人。

  招收软件工程方向硕士研究生，同时欢迎对科研有兴趣的本科生与我联系 (jinfuchen at whu dot edu dot cn)。

  教育背景

  2016至2020年，康考迪亚大学，博士研究生

  2013至2016年，中国科学院大学，硕士研究生

  2009至2013年，哈尔滨工业大学，本科

  工作经验

