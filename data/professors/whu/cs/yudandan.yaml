  教育背景

  1976年出生，湖南平江县人，博士，副教授，硕士生导师

  1993年9月—1997年7月 武汉测绘科技大学 计算机应用专业 获学士学位

  1999年9月—2002年7月 武汉大学 模式识别与智能系统专业 获硕士学位

  2002年9月—2007年6月 武汉大学 计算机软件与理论专业 获博士学位

  1997年7月— 现在 武汉大学计算机学院 计算机软件研究所、计算机科学系工作

  2007年9月—2008年7月 上海复旦大学青年骨干教师国内访问学者

  2011年5月—2012年5月 美国佐治亚州立大学  国家留学基金委全额资助访问学者

  工作经验

  教授课程

  先后主讲《C语言程序设计》、《人工智能原理》、《软件工程》、《离散数学》、《数据结构》等课程。

  共发表学术论文10篇，其中EI检索4篇，ISTP检索3篇。

  发表论文

  参加编写《数据结构习题与解析》，2006,11,清华大学出版社《数据结构教程》，2007，3，清华大学出版社

  科研课题

  主持横向合作项目一项并参与一项973课题和多项横向课题

