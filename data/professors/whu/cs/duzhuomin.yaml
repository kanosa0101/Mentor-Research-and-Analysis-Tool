  研究方向

  毕业于武汉大学计算机学院，获得工学博士学位，主要研究方向为分布并行计算。先后在国内外期刊和国际会议上发表学术论文10余篇，参与了武汉大学自强科技基金“基于多Agent的分布计算环境模型若干基本问题研究”，软件工程国家重点实验室开放基金资助项目“一种基于Agent的软件服务框架模型”等多项国家、省市以及校科研项目。主持武汉大学青年创新基金项目“基于动态网络环境的协同计算模型研究”。留校以来长期担任计算机学院《软件工程》课程的本科教学工作，并参与了该课程的教学改革项目。

