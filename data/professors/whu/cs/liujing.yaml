  研究方向

  2001年7月毕业于武汉大学计算机科学与技术学院计算机软件专业，获工学学士学位。2004年7月毕业于武汉大学计算机学院计算机系统结构，研究方向为计算机网络与通信，获工学硕士学位专业。2007年7月毕业于软件工程国家重点实验室（武汉大学）计算机软件与理论专业，获工学博士学位。2007年7月至2008年9月到香港理工大学从事博后研究工作。主要从事软件工程与数据挖掘的研究工作。近年来，主持了国家自然科学基金青年基金、教育部博士点新教师基金项目，作为主要研究人员参与了包括973项目、863项目、国家自然科学基金项目等多项科研课题，公开发表学术论文二十余篇。在本项目中负责项目的整体规划、协调和研究工作。

  教育背景

  曾负责硕士形式语言与自动机课程，现负责博士专业英语课程

  工作经验

  近五年主持的项目：国家自然科学基金项目，“基于网络化数据挖掘的软件重用方法研究”（No. 60803025），2009.1-2011.12，项目负责人。教育部博士点基金项目，“基于社区发现技术的软件结构优化方法研究”（No.
  20070486065），2008.1-2010.12，项目负责人。近五年作为主要研究人员参加的项目：国家重点基础研究发展计划“973计划”，“需求工程--对复杂系统的软件工程的基础研究”（
  2007CB310800），2007.7-2011.8。国家自然科学基金项目“基于软件网络的软件度量研究”（60873083），2009.1-2011.12，主要参与者，负责算法研究。国家高技术研究发展计划（863），“复杂信息资源语义互操作性应用集成的机制与方法”，(No.2006CB708302)，2006.12-2009.12。

