  发表论文

  已经发表和录用论文90余篇，其中在IEEE TKDE，IEEE TMC, ACM TKDD, Information Sciences， WWWJ，Pattern
  Recognition，Journal of Network and Computer Applications， IEEE ACCESS, Applied Intelligent，Soft
  Computing, Neurocomputing ，Neural Processing letter，Neural Computing & Applications,
  Wireless Networks, Wireless Communication and Mobile computing, Transport, International
  Journal of Computer Intergraded Manufacturing, Entropy，Chinese Journal of Electronics（电子学报英文版），Journal
  of Internet Technology等国际重要和权威SCI学术期刊发表论文20余篇，在IJCAI, ACMKDD, ICDM等国际重要学术会议上发表论文10余篇，在国内计算机权威和重要专业期刊《计算机学报》、《软件学报》、《电子学报》、《计算机集成制造系统-CIMS》发表和录用论文近20篇。

  科研课题

  主持国家自然基金、国家自然基金中英合作计划、教育部博士点基金、博士后基金、广东省自然科学基金（重点项目）、湖北省自然基金、武汉市重大科技计划、武汉市青年晨光计划、国家重点实验室开放基金等多个国家级和省部级项目，参与国家自然基金（海外）杰出青年基金、国家863计划、国家973重点基础研究项目等多个国家级重大项目。主持和参与多项企业合作及应用型开发项目。
  IEEE Member, CCF Member,多个国际和国内重要学术会议的程序委员会委员，担任ACM Transactions on Knowledge Discovery
  from Data (TKDD), Knowledge and Information Systems (KAIS), Expert Systems with
  Applications (ESWA),IEEE Transactions on Mobile Computing (TMC), IEEE Transactions
  on Intelligent Transportation Systems (TITS), Optic Engineering (OE), Transport,
  Autonomous Agents and Multi-Agent Systems (AAMAS)，Information Sciences，Transport
  Reviews,《计算机学报》、《软件学报》、《电子学报》、《计算机集成制造系统-CMIS》、《系统工程学报》、《西安交通大学学报》等多个会议及期刊的审稿人。

  研究团队

  本课题组招收硕士研究生，博士研究生，欢迎计算机、数学、机械工程、管理科学与工程、自动化与控制、应用物理等相关专业的青年才俊加入课题组学习工作！本课题组秉承树人为本的宗旨，将为每个研究生提供优越的科研环境和良好的成长氛围，努力为各位创造与国际学术权威交流的机会。同时欢迎各兄弟院校和单位的研究生和青年老师前来短期或长期交流，将提供一切必要的科研和生活条件。课题组主页：

  http://simulation.whu.edu.cn

