  研究方向

  胡文斌，男，博士，湖北武汉人，现为武汉大学计算机学院教授,博士生导师。2006年进入武汉大学计算机科学与技术博士后流动站，从事博士后研究，2007年获武汉大学优秀博士后称号。2008年遴选为硕士研究生导师，2011年遴选为博士生导师。目前已经培养出硕士20余人，博士4人。目前担任社会兼职有：
  （1）公安部视频监控领域特聘专家； （2）文化部文物局安全防范特聘专家。

  研究领域为人工智能与智能仿真优化； 社会网络仿真与优化；；大数据分析与数据挖掘；智能计算与智能决策；智能交通系统；计算机集成制造系统(CIMS)。 本课题组招收硕士研究生，博士研究生，欢迎计算机、数学、机械工程、管理科学与工程、自动化与控制、应用物理等相关专业的青年才俊加入课题组学习工作！本课题组秉承树人为本的宗旨，将为每个研究生提供优越的科研环境和良好的成长氛围，努力为各位创造与国际学术权威交流的机会。同时欢迎各兄弟院校和单位的研究生和青年老师前来短期或长期交流，将提供一切必要的科研和生活条件。
  课题组主页：http://simulation.whu.edu.cn

