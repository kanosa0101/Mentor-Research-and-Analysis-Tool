  研究方向

  研究方向

  计算机图形学，数字图像处理，人机交互，虚拟现实，C，C++，Java，专业英语，科技写作

  教育背景

  2006-现在，讲师/副教授，武汉大学

  2012-2013，访问学者，University of Pittsburgh（美国匹兹堡大学）

  2003-2006，助理/副研究员，Hong Kong University of Science and Technology（香港科技大学）

  2000-2004，博士，Nanyang Technological University（新加坡南洋理工大学）

  1997-2000，硕士，华中科技大学

  1993-1997，学士，武汉理工大学

  欢迎研究生报读，欢迎本科生参与。参加课题研发的学生，实验室将给予劳务费补助。对于表现优秀的研究生，可以推荐到与实验室合作的国内外知名大学及院所攻读博士学位或从事科学研究。

  实验室地址：武汉大学计算机学院大楼B606

  电话：027-68775669

  邮件：jianhuizhao@whu.edu.cn

  工作经验

  近年来研究工作包括：空气污染监测、烟火识别、网络地图规划、交互式3D游戏、车辆检测、医学图像处理、道路灾害监测、面部表情识别、卫星图片目标分析、深度学习模式识别、神经网络智能预测等。

  主持完成国家自然科学基金面上项目一项，主持湖北省自然科学基金项目、交通部行业联合科技公关项目子课题、公益性行业气象科研专项子课题、武汉市科技局项目、苏州市科技局项目等课题，先后参与国家973项目子课题二项，参与国家自然科学基金面上项目二项，参与国家重点研发计划等课题。已在国内外学术期刊与会议上发表研究论文70余篇（其中SCI收录30篇），已授权国家发明专利10余项，并任若干国内外期刊及国际会议审稿人。

