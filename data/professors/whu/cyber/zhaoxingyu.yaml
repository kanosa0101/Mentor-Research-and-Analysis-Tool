office_address: 武汉市，东西湖区，国家网络安全人才与创新基地，新珈楼，C511
bio_raw: '赵星宇，武汉大学，国家网络安全学院教授，博士生导师，国家高层次青年人才计划（海外）入选者，华威大学（University of Warwick）荣誉副教授，英国高等教育协会会士（FHEA），国际自主系统保障协会会士（AAIP）。

  于北京航空航天大学获得学士与硕士学位，后赴城市圣乔治伦敦大学深造并获计算机博士学位，师从软件可靠性学科奠基人之一Bev Littlewood教授与英国皇家工程院院士Robin
  Bloomfield教授。博士毕业后，曾先后任职于多所英国罗素集团大学，于2026年全职加入武汉大学，任正教授、博士生导师。

  长期致力于安全关键系统的可靠性与安全性技术研究，核心研究方向包括：可信人工智能、软件可靠性、形式化验证、贝叶斯推理及安全性分析与保障。

  作为主持与合作主持，累计牵头及参与获取研究经费达780万英镑。主导的研究项目获英国EPSRC、欧盟地平线计划、英国学术院等机构资助，并与西门子、华为、英伟达、DENSO、Wayve及NCC集团等企业紧密合作。

  本人及指导学生在AI安全、软件可靠性与隐私增强技术等领域获得多项国内外荣誉。先后获PRICAI 2025最佳论文提名奖、英美隐私增强技术奖挑战赛最佳建模奖、AISafety
  2021最佳论文奖及ISSRE 2019最佳论文提名奖。指导学生亦取得突出成绩，包括华威大学新锐学者论坛最佳论文奖、华威新星奖、西门子AI可靠性评估挑战赛最佳原创方法奖，并入选利物浦大学“成为专家”系列专题报道。

  学术服务方面，担任IEEE-TNNLS副主编、Nature-Communications AI & Computing编委会成员、NeurIPS领域主席、AAAI高级程序委员会委员、英国研究与创新基金会（UKRI）项目评审专家等职务。

  已在顶级会议与期刊上发表70余篇论文，包括：

  人工智能领域：NeurIPS、CVPR、ICCV、ECCV、ICML、AAAI、UAI、AAMAS、Elsevier-INFFUS、Springer-ML

  可靠性与安全性领域：Elsevier-RESS、IEEE-TR、ISSRE、DSN、CCS、SafeComp

  软件工程领域：ACM-TOSEM、ACM-TECS、IEEE-TSE、Elsevier-IST、ASE

  机器人学与自主系统领域：Nature-CE、IEEE-TCCN、IEEE-RA-L、ICRA、IROS、ITSC、IV

  更多详细信息参照个人中文主页（

  https://cn.xzhao.me/

  ）。

  本课题组现面向海内外招收硕士生、博士生及博士后研究员。欢迎本校大2大3及保研同学加入课题组，开展大学生创新创业训练计划及其他各类创新创业项目。我们热忱期待具有人工智能、计算机科学、统计学、系统工程、软件工程或可靠性等领域背景的青年学者加入团队。有意申请者，欢迎来信咨询，并请将个人简历及研究兴趣概述发送至电子邮箱：

  xingyu.zhao@whu.edu.cn

  。'
