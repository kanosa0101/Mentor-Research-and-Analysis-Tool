  课题科研

  研究团队

  科研团队在软件工程智能化、软件代码学习及其自动化技术、基于机器学习的代码分析理论、卫星系统建模与仿真、天基综合信息网任务仿真及效能评价、体系优化等方面，做了大量研究工作并已在各科研院所得到实际应用。现有硕士研究生3人，主要从事软件工程智能化理论、软件代码学习及其自动化技术、基于机器学习的代码分析理论研究，发表高水平科研论文并参加本领域专业竞赛，欢迎有意从事人工智能、机器学习、模式识别方向研究的同学与我联系。

