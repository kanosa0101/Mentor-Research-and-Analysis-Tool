  个人简介

  蔡波，男，博士，现为武汉大学国家网络安全学院副教授，硕士生导师。1996年7月毕业于沈阳航空航天大学，获学士学位，2000年7月毕业于武汉大学计算机应用专业，获硕士学位，2003年毕业于武汉大学计算机应用专业，获博士学位。

  主要研究方向为人工智能，复杂系统仿真及优化。主要从事软件工程智能化理论、软件代码学习及其自动化技术、基于机器学习的代码分析理论、卫星系统建模与仿真、天基综合信息网任务仿真及效能评价、体系优化等研究。主持项目30余项，出版著作2部，发表论文40余篇，发明专利4项。科研团队在软件工程智能化、软件代码学习及其自动化技术、基于机器学习的代码分析理论、卫星系统建模与仿真、天基综合信息网任务仿真及效能评价、体系优化等方面，做了大量研究工作并已在各科研院所得到实际应用。

  主持与参与多项国家级、省部级项目。

  研究方向

  主要研究方向为人工智能，复杂系统仿真及优化。主要从事软件工程智能化理论、软件代码学习及其自动化技术、基于机器学习的代码分析理论、卫星系统建模与仿真、天基综合信息网任务仿真及效能评价、体系优化研究。

  教育背景

  1996年7月毕业于沈阳航空航天大学，获学士学位。

  2000年7月毕业于武汉大学计算机应用专业，获硕士学位.

  2003年毕业于武汉大学计算机应用专业，获博士学位。

  工作经验

  2004-01至2008-12武汉大学计算机学院 讲师

  2008-12至2016-05武汉大学计算机学院 副教授

  2016-06至2017-12武汉大学信息中心 副教授

  2018-06至今 武汉大学网络安全学院 副教授

