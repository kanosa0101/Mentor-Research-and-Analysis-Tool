  2007/07-2008/09: 新加坡南洋理工大学电子电器工程学院, 硕士

  2002/09-2006/06: 四川大学计算机(软件)学院, 学士

  工作经验

  2021/05-至今: 武汉大学国家网络安全学院, 网络空间安全系，教授

  2018/01-2021/04: 武汉大学国家网络安全学院, 大数据分析与人工智能研究所，副教授（兼副所长）

  2013/08-2017/12:武汉大学计算机学院软件工程国家重点实验室,副教授、主任助理

  2013/01-2013/08:新加坡南洋理工大学计算机工程学院,副研究员

  2011/09-2012/01:惠普实验室新加坡分院,研究实习生

