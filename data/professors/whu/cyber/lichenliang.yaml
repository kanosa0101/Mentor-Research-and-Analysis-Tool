  个人简介

  李晨亮，男，博士，武汉大学国家网络安全学院教授、博士生导师。个人主页：http://lichenliang.net/

  2013年毕业于新加坡南洋理工大学计算机工程学院,获博士学位。研究兴趣包括信息检索、数据挖掘(文本挖掘)、自然语言处理、机器学习和社交媒体分析。其主要科研成果已先后发表在国际顶级学术期刊和会议上，包括IEEE
  TKDE、SIGIR、ACL、EMNLP、AAAI、CIKM、TOIS、JASIST等。应邀担任IEEE TKDE、ACM TOIS、ACM TWeb、 ACM
  TIST、JASIST、WWWJ、IPM等国际重要学术期刊审稿人；应邀担任SIGIR、ACL、WWW、CIKM、EMNLP、AAAI、IJCAI等国际学术会议(Senior)
  PC Member；应邀担任CIKM 2017 Demo track co-chair、SMP 2017 Publicity chair、ADMA 2017 Proceedings
  co-chair、CCIR 2018 Publicity & Proceedings chair、CCL 2019 Publicity chair、ASIS&T
  AP 2020 Sponsorship co-chair、ICDM 2021 Panel co-chair；担任信息检索国际权威学术期刊ACM TOIS (CCF-A类)和ACM
  TALLIP的副主编、JASIST(CCF-B类)和IPM(CCF-B类)的编委、数据分析与知识发现 (中文核心期刊, CCF-C类中文期刊)的编委、Data
  and Information Management的副主编；担任中国中文信息学会青年工作委员会副主任、社交媒体专委会委员、信息检索专委会委员、情感计算专委会执行委员；北京智源人工智能研究院青源会会员；中国计算机学会信息系统专委会执行委员、术语专委会委员；中国科技情报学会信息技术专委会委员。曾获得SIGIR2016最佳学生论文提名奖（Best
  Student Paper Award Honorable Mention）、SIGIR2017 Outstanding Reviewer Award、IPM
  2018/2019 Reviewer Award、ACM武汉分会及湖北计算机学会新星奖，2022年“钱伟长中文信息处理科学技术奖-青年创新奖”一等奖；曾入选2019年度武汉黄鹤英才计划；学院数据智能实验室负责人，实验室主页:
  https://www.dancelab.fun/

  研究方向

  信息检索、数据挖掘(文本挖掘)、自然语言处理、机器学习和社交媒体分析

