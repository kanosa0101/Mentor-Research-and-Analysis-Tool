  个人简介

  余发江

  ，男，武汉大学网络安全学院副教授，主要从事系统安全、可信计算等方面的教学和研究工作。2007年7月毕业于武汉大学计算机学院信息安全专业，获博士学位，同年进入武汉大学计算机学院任教。2015年为美国亚利桑那州立大学访问学者。是我国第一款可信计算机“SQY14嵌入密码型计算机”的主要研制人员之一，获“密码科技进步二等奖”、“湖北省科技进步一等奖”，是国家标准GB/T
  29829-2013《信息安全技术可信计算密码支撑平台功能与接口规范》的主要编写者之一。发表多篇与可信计算相关的论文，有多项与可信计算相关的专利授权。

  研究方向

  系统安全，可信计算

  教育背景

  1. 2002/9 - 2007/6，武汉大学，信息安全，研究生

  2. 1998/9 - 2002/6，武汉大学，计算机科学与技术，本科

  工作经验

  1. 2013/1 - 至今，武汉大学，计算机学院/国家网络安全学院，副教授

  2. 2015/12–2016/2，美国亚利桑那州立大学ASU，计算、信息与决策系统工程学院，访问学者

  3. 2007/9–2012/12，武汉大学，计算机学院，讲师

