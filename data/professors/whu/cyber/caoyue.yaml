title: 教授
supervisor: 博导、硕导
bio_raw: '湖

  北省智能网联汽车信息安全与控制国际科技合作基地&湖北省网络信息安全与可信技术引智创新基地主任

  ，

  现

  挂任武汉市东西湖区经济信息化和科技创新局（区数据局）副局长

  ，

  武汉大学青年全球合作大使、国家网络安全学院教授、

  挂任武汉大学信息中心-副主任（2024-2025）

  。

  当选英国皇家特许工程师，

  英国工程技术学会-会士、

  英国高等教育学会-会士、

  英国皇家学会工艺院-会士、

  英国计算机学会-会士

  、IEEE-高级会员。

  先后毕业于武汉工程大学-通信工程专业（本科）、英国萨里大学-移动通信系统专业（硕士），英国萨里大学-电子工程专业（博士，导师：

  Zhili Sun教授

  ）。历任英国萨里大学-5G创新中心博士后研究员

  （导师：

  Ning Wang教授

  ）

  ，英国诺森比亚大学-计算机与信息科学系高级讲师、英国兰卡斯特大学-计算机与通信学院国际讲师、北京航空航天大学-交通科学与工程学院教授。

  主要面向AI赋能下的

  网络安全、

  网络通信、

  决策优化技术研究，涵盖车联网及低空经济等应用场景

  ；

  承担科技部-重点研发计划（网络空间安全治理、政府间国际科技创新合作）

  、工信部-基础电信网络安全科技创新任务“揭榜挂帅”/大数据产业发展试点示范项目、教育部-产学研创新基金、湖北省-重大科技/重大调研基金/重点研发计划/国际科技合作/

  科技人员服务企业项目

  、武汉市-重点研发计划/产业基地科技创新专项/人工智能专项/知识创新专项等项目；

  于权威期刊及会议上发表论文300余篇，主编中英文专著8部，授权发明专利20余项、软件著作权4项，参编行业标准、行业白皮书等10余项。

  国际交流方面：

  入选

  人社部国际青年人才来华交流案例，

  承担国家留学基金委创新型人才国际合作培养项目

  、科技部-高端外国专家引进计划/“一带一路”创新人才交流项目、人社部-国家外国专家个人类项目/中国国际人才交流基金会-国际青年人才来华交流项目、湖北省-高端外国专家项目、日本-JSPS特邀外籍研究员/JST樱花科技计划项目、欧盟-HORIZON玛丽居里学者计划；

  受邀参加金砖国家青年科学家论坛、上合组织青年科学家论坛、中土科技创新论坛

  。

  科技创新方面：

  研究成果获光明网、新华网、人民邮电报等主流媒体专题报道，

  入

  选工信部信息技术应用创新典型应用案例

  ；

  荣获中国商业联合会服务业科技创新一等奖、中国国际大数据产业博览会领先科技成果奖、中国智能交通协会科技进步二等奖、中国发明协会发明创业二等奖、中国创造学会创造成果科学技术二等奖、中国通信企业协会“ICT中国创新奖”等行业科技奖励；

  多篇学术论文获评湖北省科协优秀科技论文、湖北省科技期刊百篇优秀论文、

  IEEE计算机学会最佳论文亚军奖

  、《物联网学报》优秀论文奖等荣誉。

  教学创新方面：

  承担湖北省普通本科高等学校新工科新形态教材建设项目、教育部-协同育人创新项目、全国高等学校计算机教育研究会教改项目等20余项；系统推进网络空间安全学科本研一体化教学改革与课程创新，教学成果

  入选教育部网络安全教育实践案例&教育信息技术应用创新优秀案例

  ；

  获武汉大学高等教育（研究生）教学成果特等奖

  、

  中国教育技术协会-教育信息技术应用创新大赛全国二等奖

  等荣誉；出版中英文本科、研究生课程教材4部，发表教改论文10余篇。

  育人培养方面：

  指导学生获中国网络空间安全协会网络安全学院学生创新资助计划项目5项、

  国家级大学生创新创业训练计划项目4项

  ；获全国青年科普创新实验暨作品大赛、“互联网 +” 大学生创新创业大赛产业命题赛道、“华为杯”中国研究生网络安全创新大赛、“东风梦想车” 中国青年汽车创意设计大赛（华中赛区）等

  奖项

  ；

  培养学生获中国科协青托博士生专项计划（中国电子学会、中国通信学会、中国汽车工程学会）、

  宝钢优秀学生奖学金、

  国家奖学金等荣誉

  ；海外工作期间培养博士生入选国家优秀自费留学生奖学金、泰山学者-青年专家等荣誉。

  公共服务方面：

  积极参与网络安全领域科普与分析研判，受人民日报、中国新闻网、今日头条、新华通讯社等媒体报道/采纳、

  入选中国教育技术协会平安校园优秀案例，

  担任科普中国专家（刘经南院士信息通信科普工作室成员）

  、中国计算机学会公益大使&杰出演讲者，网络空间安全学院兼职教师，

  中国教育发展基金会&大众汽车集团（中国）【青年创想+】公益课程讲师

  ，武汉社区学院金牌讲师。

  人才荣誉方面：

  入选国际自动机工程师学会（SAE）汽车安全优秀个人，

  AutoSec汽车网络安全行业10周年最具影响力人物，

  中国高被引学者 (2021-2025）

  ，全球前2%顶尖科学家“终身影响力”榜单 (2024-2025)&“年度影响力”榜单 (2019-2025)，国家级青年人才，湖北省“科技专员”、湖北省&武汉市“科技副总”，“武汉英才”产业创新人才、“南太湖精英计划”领军型创业团队负责人。

  详细信息参照本人学术主页

  http://yuecao.e.zwz.hk/zh

  ，欢迎本校大2/3及保研同学提前加入课题组，开展大学生创新创业训练计划及其他各类创新

  创业

  项目

  （

  研究介绍PPT

  ）

  。'
