  个人简介

  崔晓晖教授：武汉大学国家网络安全学院教授，博士生导师。食品安全区块链联盟负责人、教育部示范性软件学院联盟副理事长、国家重点研发计划高性能计算专项项目专家委员会委员，教育部软件工程教学指导委员会委员、国家留学基金委项目评审委员会委员、中国计算机协会服务计算专委会常务委员。长期从事大数据云计算、超大规模情报数据流分析、集群智能理论、区块链、高性能计算研究。

  崔晓晖教授主持了国家重点研发计划、国家自然基金、教育部联合重点基金等15项国家级、省重点基金及企业项目；在美国橡树岭国家实验室从事大数据与云计算研究工作，主持参与美国能源部基金等10项国家研发项目。

  崔晓晖教授在高性能计算、人工智能等重要学术期刊和会议上发表学术论文188篇，其中SCI/EI 68篇、已发表论文被引用超过1000余次（单篇最高他引382次）。出版专著1项，获国家专利10项、美国发明专利1项，获美国能源部特殊贡献奖、美国国家实验室杰出事件奖等5项奖励。研究成果被美国NBC新闻、美国时代自由杂志、英国新科学家杂志以及国内各类媒体报道。

