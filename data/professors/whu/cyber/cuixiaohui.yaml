  课题科研

  崔晓晖教授主持了国家重点研发计划、国家自然基金、教育部联合重点基金等15项国家级、省重点基金及企业项目；在美国橡树岭国家实验室从事大数据与云计算研究工作，主持参与美国能源部基金等10项国家研发项目，部分项目信息如下。

  (1) 国家重点研发计划，食品安全大数据关键技术研究，2018-2021, 2664万，在研，主持，第一完成人

  (2) 教育部联合重点基金，2016.12－2018.12，500万，在研，主持，第一完成人。

  (3) 国家自然科学基金面上项目，

  基于社会感知大数据的公共安全事件预警研究，2015.01-2015.12，18万，已结题，主持，第一完成人。

  (4) 湖北省自然科学基金项目，基于云节点感知的GIS网络架构优化研究, 2015.01-2017.12, 10万，在研，主持，第一完成人。

  (5) 深圳市重点基金，健康保健大数据服务重点实验室，2015.12-2017.12,100万，结题，主持，第一完成人。

  (6) 湖北省科技支撑计划项目

  ,基于物联网的商用汽车生产线智能控制与协同技术研究与应用，2015.01-2016.12, 30万，已结题，主持，第一完成人。

  (7) 中央高校基本科研业务费专项资金,面向高分辨卫星的大数据研究，2014.01-2015.12，20万，已结题，主持，第一完成人。

  (8) 互联网+应用平台原型（Prototype）的开发，2015.09.01-2016.09.01，10万，已结题，主持，第一完成人，横向。

  (9) 空间信息大数据技术研发基地

  ，2016.01.04-2026.01.08, 50万，在研，主持，第一完成人。

  (10)食品安全区块链系统研发，2017.12.27-2018.06.27，10万，在研，主持，第一完成人。

  (11)特种营养米饭的烹制机智与智能控制，2018-2019,25万，在研，主持，第一完成人。

