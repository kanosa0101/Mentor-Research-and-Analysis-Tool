  个人简介

  何新磊，武汉大学武汉数学与智能研究院准聘副教授、研究员、博士生导师，主要研究方向包括人工智能安全、数据安全、内容安全、大模型评测等领域。相关工作发表在包括IEEE
  S&P、ACM CCS、USENIX Security、NDSS、TDSC、TIFS等安全领域会议和期刊上。获LAMPS 2024最佳论文奖、NDSS 2025杰出海报奖。担任IEEE
  TDSC编委和多个CCF-A类会议领域主席/程序委员会委员。参与构建了一系列可信人工智能领域的开源库，PyPI下载超百万次，获大模型安全评测系统“蚁鉴”集成，并合并至蚂蚁公司大模型安全一体化解决方案“蚁天鉴”2.0版，为通用大模型及垂域大模型应用安全保驾护航。

  招生信息：招收人工智能安全方向的博士研究生、硕士研究生和博士后，同时欢迎访问学生和访问学者。欢迎具有安全、数学、计算机科学及相关背景者联系交流。

  个人主页：https://xinleihe.github.io/

