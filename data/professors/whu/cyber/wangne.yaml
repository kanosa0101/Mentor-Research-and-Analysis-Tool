  个人简介

  王讷，女，博士，武汉大学国家网络安全学院特聘副研究员，硕士生导师。2023年6月获得武汉大学计算机学院计算机科学与技术专业工学博士学位，导师是周睿婷教授和李宗鹏教授。2023-2025年分别在香港科技大学计算机科学与工程系和香港理工大学电子计算学系从事博士后研究，导师分别为Bo
  Li教授（IEEE Fellow）和Jiannong Cao教授（IEEE Fellow），合作导师为哈尔滨工业大学计算机学院施少怀教授。研究方向包括（但不局限于）分布式机器学习系统、大模型训练/推理加速、云/边缘计算、大模型安全等，目前在IEEE
  INFOCOM、JSAC、TMC、TC、ICDCS、IWQoS等计算机网络/并行分布式计算领域顶级会议和期刊发表相关研究工作近20篇，其中以第一作者/通讯作者发表CCF
  A类论文5篇。 欢迎对大模型系统优化、大模型系统安全、LLM Agent智能调度等交叉领域研究方向感兴趣的优秀本科生和研究生联系并加入我的团队（邮箱：ne.wang@whu.edu.cn）！更多信息可访问英文主页：https://cswangne.github.io/nwang/。

  研究方向

  LLM/MoE系统优化，LLM Agent智能调度与定价

  LLM系统安全

  云计算/边缘计算，优化算法

  教育背景

  2012.06-2016.09 武汉理工大学 计算机科学与技术（本科）

  2016.09-2019.06 武汉理工大学 计算机科学与技术（硕士）

  2019.09-2023.06 武汉大学  计算机科学与技术（博士）

