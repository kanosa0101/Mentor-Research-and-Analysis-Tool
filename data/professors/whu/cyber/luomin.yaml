title: 教授
bio_raw: '武汉大学，国家网络安全学院教授，博士生导师，密码科学与技术系主任，CCF区块链专业委员会委员，Journal of Cloud Computing期刊编委。主要研究方向为应用密码学、区块链、物联网安全。目前在

  S&P、CCS、PKC、CHES、TIFS、TDSC

  等国内外知名

  会议/

  期刊上发表学术论文100余篇。主持国家自然科学基金面上项目、国家重点研发项目课题、湖北省科技重大专项、广东省科技计划项目、山东省科技计划等十余项国家和省部'
