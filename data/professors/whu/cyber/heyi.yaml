  个人简介

  何艺，武汉大学武汉数学与智能研究院研究员。

  2024

  年博士毕业于清华大学，导师为李琦老师。曾担任网易游戏资深工程师，有丰富的大型项目开发管理经验。研究方向为系统安全，包括

  Android

  和

  IoT

  安全、云安全，发表

  Usenix Security, CCS, NDSS, TDSC

  等

  CCF-A

  论文十多篇，担任多个顶会的审稿人。研究成果应用于美团、华为和长虹等公司。详见：

  https://heyi.sh

