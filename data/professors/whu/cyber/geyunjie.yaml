  个人简介

  葛云洁，武汉大学国家网络安全学院特聘副研究员、硕士生导师。研究方向为人工智能安全，相关研究成果发表在ACM CCS、USENIX Security、NDSS、IEEE
  TDSC、TIFS等国际会议和期刊上。主持国家自然科学基金及多项省部级项目，入选国资计划、湖北省博士后尖端人才引进计划。本人为王骞教授课题组成员。实验室具体信息请移步
  http://nisplab.whu.edu.cn/。团队常年招收硕士、博士研究生，欢迎有意从事人工智能安全、数据安全等方向研究的同学联系。也欢迎本科生同学加入到课题组，参与相关研究工作。

