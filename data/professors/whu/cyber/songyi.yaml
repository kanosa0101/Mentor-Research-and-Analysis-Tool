  个人简介

  宋壹，武汉大学国家网络安全学院特聘副研究员、硕士生导师。2024年于武汉大学计算机学院软件工程专业获得工学博士学位，2026年于武汉大学计算机科学与技术流动站完成博士后研究（弘毅博士后）。主持国家自然科学基金及多项省部级科研项目，入选湖北省博士后尖端人才引进计划、武汉市青年科技朝阳计划。连续两年获CCF-A类国际顶级会议杰出论文奖，获ACM（美国计算机学会）-
  Wuhan优博奖、武汉计算机软件工程学会青年才俊奖、中国研究生网络安全创新大赛全国一等奖（指导教师）、CCF开源创新大赛一等奖、武汉大学优秀博士后奖等。主要研究方向为软件安全保障、智能化软件测试调试，以第一作者身份发表CCF-A类顶级论文多篇。任中国计算机学会软件工程专委会执行委员，及国际知名期刊会议TOSEM、SANER、ICPC、STVR、MSR、SAC等的审稿人或程序委员会委员。更多信息请访问个人主页：https://yisongy.github.io/。

