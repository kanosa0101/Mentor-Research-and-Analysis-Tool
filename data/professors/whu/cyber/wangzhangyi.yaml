  个人简介

  王张宜，武汉大学国家网络安全学院，讲师。中国计算机学会会员，中国密码学会会员。

  研究方向

  密码学，数据安全。

  教育背景

  2015/02-2016/02 美国UMASS大学，访问学者。

  2002/09-2006/06武汉大学，计算机学院，博士。

  1999/09-2002/06武汉大学，计算机学院，硕士。

  1995/09-1999/07武汉大学，计算机学院，本科。

  工作经验

  2006/07 –2018/01，武汉大学计算机学院。

  2018/01 –至今，武汉大学国家网络安全学院。

  教授课程

  《密码学》、《程序设计》、《程序设计训练》、《网页设计与制作》等。

  发表论文

