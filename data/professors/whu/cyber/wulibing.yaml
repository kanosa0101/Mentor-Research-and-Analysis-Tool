  CCF

  教育专委秘书长，

  YOCSEF

  武汉

  2012~2013

  年度主席。主要研究方向为物联网、网络安全、机器学习、数据安全等。

  近年来主持国家自然科学基金、国家重点研发计划课题、湖北省创新群体、湖北省科技支撑计划、湖北省重点研发计划等项目的研究工作，曾参加国家863计划引导项目、可信软件重大研究计划等研究工作。在IEEE
  TMC, TIFS, TDSC, JSAC, INFOCOM, CVPR，NeurIPS，ACM MM等CCF A类期刊和会议发表论文。担任CCF A类期刊IEEE
  TIFS Associate Editor（2025-2027），担任IEEE TIFS、TDSC、TMC、TCC、ToN、TKDE、TITS、TSMC等国际期刊审稿人。曾担任国家自然科学基金会议评审和通讯评审专家、科技部创新人才推进计划会评专家、国家重点研发计划“高性能计算”、“宽带通信和新型网络”、“网络空间安全”等重点专项会评专家。获SCI期刊IEEE
  System Journal 2019年度Best Paper Award。获得ICoC2016中国互联网学术会议Best Paper Award。曾入选全球前2%科学家榜单。

  2008年获得湖北省五一劳动奖章，2009年被评为武汉大学十大杰出青年，2010年获得宝钢优秀教师奖

  2014年获得国家教学成果一等奖，2018年获湖北省教学成果一等奖。2014年获湖北省科技进步一等奖。

  2021年获湖北省自然科学二等奖。2023年获第九届湖北省高等学校教学成果二等奖。

  招收物联网、机器学习、AI安全或数据安全方向的博士后、博士生、和硕士生。

  联系方式：wu@whu.edu.cn

