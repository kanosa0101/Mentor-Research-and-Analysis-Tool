  个人简介

  罗子越，武汉大学国家网络安全学院教授，入选国家海外高层次青年人才计划。2022年获香港大学计算机科学博士学位，曾在美国俄亥俄州立大学从事博士后研究并任研究科学家。主要研究方向为分布式机器学习与大模型训练推理系统优化，以及机器学习与大模型安全。在
  IEEE/ACM Transactions on Networking、IEEE Journal on Selected Areas in Communications、IEEE
  INFOCOM、ICML、MLSys 等国际期刊与会议发表多篇学术论文，并在多个国际学术会议担任组织委员会成员及技术程序委员会委员。

  个人主页：https://ziyueluocs.github.io/

