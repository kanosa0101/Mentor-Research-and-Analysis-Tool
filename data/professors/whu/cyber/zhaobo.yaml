  专利成果：

  (1) 一种基于Linux内核主机的可信等级度量方法及系统

  (2) 基于中心性与亲密度分析的网络安全态势感知方法及系统

  (3) 一种用于物联网设备的网络访问控制方法及系统

  (4) 一种基于用户角色调整的动态访问控制方法

  (5) 一种基于加密TF卡的可信启动方法

  (6) 一种基于实时电价的计费方法及相关设备

  (7) 一种物联网大数据环境下的数据异常检测方法及装置

  (8) 传输密钥生成方法、终端及服务器

  (9) 一种内核可信启动方法和装置

