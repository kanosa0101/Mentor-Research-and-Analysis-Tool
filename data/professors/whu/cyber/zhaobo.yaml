  个人简介

  赵波、二级教授、珞珈特聘教授，中国密码学会理事，国家网络安全先进个人，国家网络安全优秀教师荣誉称号获得者。

  主要研究方向为密码学应用、信息系统安全、人工智能安全、可信计算、嵌入式系统及云计算安全、网络安全技术等。主持包括中央网信办专项、国家科技部863、973、国家自然基金项目、湖北省自然基金重点项目、重点新技术研究、重点研发项目等，并和华为、国网等公司进行了长期的产学研合作。在密码学应用、信息安全系统设计与测试方面积累了一定理论和实践经验。发表一百余篇学术论文，获得国家发明授权三十余项。并出版《可信计算》等学术专著。获得湖北省科技进步奖一等奖2项。

  研究方向

  主要研究方向为密码学应用、信息系统安全、可信计算、嵌入式系统及云计算安全、网络安全技术等。

