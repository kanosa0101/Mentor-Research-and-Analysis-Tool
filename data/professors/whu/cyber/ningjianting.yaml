bio_raw: '宁建廷，男，武汉大学国家网络安全学院教授/博导，国家级青年人才、福建省闽江学者奖励计划特聘教授等获得者。长期从事公钥密码学与数据安全、区块链与人工智能安全、隐私保护技术等领域的研究工作。获欧洲计算安全年会ESORICS
  2020最佳论文奖、2021-2022年度中国密码学会优秀青年奖，在ACM CCS、NDSS、ASIACRYPT、ESORICS、ACSAC、IEEE汇刊（IEEE
  TIFS、IEEE TDSC等）等网络与信息安全领域学术会议和期刊发表学术论文100余篇；担任IEEE Transactions on Information
  Forensics and Security等国际SCI期刊编委，《计算机技术与发展》、《信息安全学报》、《Cybersecurity》

  专题/

  青年编委

  、IEEE S&P 2021 Shadow PC、ESORICS 2020-2022 PC等国际会议的程序委员会委员；中国密码学会第三届安全协议专委会委员、中国中文信息学会第二届大数据安全与隐私计算专委会委员等；担任国家、多省重大与人才项目会评专家等。长期招收博士后、博士、硕士，

  欢迎本校大二、大三及保研同学提前加入课题组，开展大学生创新创业训练计划及其他各类科研/竞赛项目。

  联系方式：jtning88@gmail.com，jtning@whu.edu.cn。'
