  课题科研

  [1] 国家重点研发计划项目（“食品安全大数据关键技术研究”）子课题：食品安全大数据的可视化分析技术，2018.12-2021.12，100万，主持，在研；

  [2] 湖北省自然科学基金面上项目：面向云计算的网络虚拟化环境可信增强机制研究，2017.1-2018.12，主持，3万，在研；

  [3] 国家自然科学基金项目:“基于可信链的Mobile Agent安全增强机制研究”，2011.01-2013.12，主持，20万，已结题；

  [4] 教育部博士点新教师基金项目：“移动代理的可信增强机制研究”，2009.1-2010.12，主持，已结题；

  [5] 软件工程国家重点实验室开放基金项目：“基于可信计算的Mobile Agent安全机制研究”，2008.1-2009.12，主持，已结题。

  并参与“863计划”项目、国家自然基金项目、湖北省基金等项目。

