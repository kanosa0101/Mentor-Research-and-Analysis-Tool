  个人简介

  沈志东，男，工学博士，武汉大学，国家网络安全学院，副教授，硕士生导师，中国计算机学会CCF会员，研究领域包括可信计算、分布式系统与网络安全、大数据分析与可视化技术、人工智能与安全分析，主持承担国家重点研发计划子课题、国家自然科学基金、湖北省自然科学等项目，并参与863计划、国家重点研发计划等研究项目。

  研究方向

  主要研究方向：可信计算、系统与网络安全、大数据分析与可视化技术、人工智能与安全分析；

  教育背景

  2003/09 - 2006/12，武汉大学，计算机学院，计算机软件与理论专业，工学博士学位/博士研究生学历，导师:张焕国教授。

  工作经验

  2018/01- 至今， 武汉大学，国家网络安全学院，副教授

  2007/03 –2017/12，武汉大学，国际软件学院，副教授

  2013/07 – 2014/06，加拿大维多利亚大学（University of Victoria），工程学院计算机系，访问学者。

  2010/07 – 2010/12，澳大利亚昆士兰科技大学（Queensland University of Technology），科学与工程系，信息安全研究所，访问学者。

  教授课程

  数据结构、计算机网络、信息安全、网络与分布式计算、信息系统导论、C#程序设计、算法设计与分析、

