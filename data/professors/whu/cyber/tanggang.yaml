  个人简介

  汤刚，武汉大学武汉数学与智能研究院研究员，博士生导师。入选国家海外高层次青年人才计划。2019年获武汉大学学士学位，2024年获悉尼科技大学博士学位。随后在伯明翰大学从事博士后研究，并于2026年1月加入武汉大学。

  主要从事密码学研究，研究兴趣包括后量子密码学与理论计算机科学。相关成果发表于 EUROCRYPT、CRYPTO、ASIACRYPT、ITCS、TQC、Computational
  Complexity 等国际会议和期刊。

  招生信息：招收密码学、后量子密码学及理论计算机科学方向的博士研究生、硕士研究生和博士后，同时欢迎访问学生和访问学者。欢迎具有数学、计算机科学及相关背景者联系交流。欢迎本校大二、大三及已获得保研资格的同学提前加入课题组，参与大学生创新创业训练计划及各类科研竞赛项目。

  个人主页：https://gangtang.github.io/

