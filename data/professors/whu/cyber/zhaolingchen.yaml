bio_raw: '个人简介

  更多>>

  本人研究领域主要为人工智能安全、隐私计算等。成果发表在ACM CCS、USENIX Security、NDSS、CVPR、NeurIPS、IEEE TDSC、TIFS等国际会议和期刊上。详细成果请见Google
  Scholar主页。2025年入选中国电子学会青年人才托举工程项目，2023年获华为青年学者项目资助，2022年入选小米青年学者。本人为王骞教授课题组成员。实验室具体信息请移步
  http://nisplab.whu.edu.cn/。团队常年招收硕士、博士研究生，欢迎有意从事人工智能安全、数据安全等方向研究的同学联系。也欢迎本科生同学加入到课题组，参与相关研究工作。'
