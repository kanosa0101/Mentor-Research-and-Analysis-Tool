  个人简介

  陈洁，男，武汉大学教授、博士生导师。2012年博士毕业于新加坡南洋理工大学，2013年加入华东师范大学任副教授，2015年起任教授（研究员）、博士生导师，2016年应邀任法国ENS
  de Lyon/LIP实验室访问教授，2024年加入武汉大学武汉数智研究院和网络空间安全学院。

  以第一兼/或通讯作者在密码学领域最具盛名的三大会议（CRYPTO、EUROCRYPT、ASIACRYPT）和IACR专题会议上发表论文10多篇（其中三大会第一作者7篇）；在国际密码与安全领域著名期刊Designs,
  Codes and Cryptography、Theoretical Computer Science、The Computer Journal、IEEE Trans等上发表论文30多篇。在身份基加密紧规约、属性基加密安全模型与构造等公开难点问题上取得系列成果，相关工作被“三大会议”引用超150次（单篇最高超40次）。

  曾获中国密码学会创新奖、中国密码学会优秀青年奖、华东师范大学青年科学奖。担任中国密码学会5个专业和工作委员会委员，《密码学报》编委、信息工程大学带教导师等，长年担任国际密码学会IACR会议程序委员等。指导研究生多人次获得上海市与校级优秀毕业生、优秀学位论文，近年来已推荐多名在校和毕业学生至海外高校联合培养、深造或从事博士后工作。

  研究方向

  公钥密码学、抗量子密码、密码工程与应用等

