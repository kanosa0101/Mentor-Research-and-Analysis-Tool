  个人简介

  王骞，武汉大学二级教授，国家网络安全学院执行院长，IEEE Fellow，国家重大人才工程特聘教授，ACM SIGSAC China主席，国家基础加强计划重点基础研究项目“技术首席专家”，国家海外高层次青年引进人才，获国家优秀青年科学基金资助。长期从事网络空间安全领域研究，发表论文200余篇，包括
  S&P、USENIX Sec.、CCS、NDSS、NSDI、MobiCom等国际知名学术会议，被引用逾26000次，相关成果受到美国新闻周刊Newsweek、Yahoo
  news、Hacker News、英国著名科技网站Tom''s Hardware等国外主流媒体报道。成果获浙江省自然科学奖一等奖、中国电子学会自然科学奖一等奖。获IEEE
  TCSC Award for Excellence in Scalable Computing、IEEE ComSoc Asia-Pacific Outstanding
  Young Researcher Award等多项国际学术荣誉，以及ICDCS、ICNP等10个国际知名会议“最佳论文奖”。曾/现任IEEE TDSC、IEEE
  TIFS等国际期刊编委，以及网络安全领域四大会议ACM CCS、USENIX Security、NDSS等国际学术会议程序委员会委员。

  研究方向

  人工智能安全、云计算安全与隐私、无线系统安全、应用密码学。

  教育背景

  分别在武汉大学、中国科学院、伊利诺伊理工大学（Illinois Institute of Technology）获得学士、硕士和博士学位。

  工作经验

  2012年6月-2013年2月 武汉大学计算机学院 副教授

  2013年3月-2018年2月 武汉大学计算机学院 教授（破格）

  2018年3月-至今 武汉大学国家网络安全学院 教授，副院长

  2017年当选“湖北省青联联合会”第十三届委员会常务委员、“归国青年与海外华侨界别工作委员会”副主任委员。2018年当选“湖北省欧美同学会”常务理事。现为电气与电子工程师协会(IEEE)会员，美国计算机协会(ACM)会员。曾担任“湖北省归国青年发展促进会”副会长、“中国计算机学会”武汉YOCSEF副主席（2015-2016）。

  担任国家高技术研究发展计划会评专家、国家自然科学基金委信息科学部重点项目会评专家。

