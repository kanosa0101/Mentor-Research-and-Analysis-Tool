  课题科研

  主持NSFC优秀青年科学基金项目、NSFC面上项目、教育部联合基金青年人才项目，联合承担国家自然科学基金重点项目，参与国家973计划、863计划等研究项目。

  研究团队

  团队主页

  ：

  http://nisplab.whu.edu.cn/

  网络与信息系统安全与隐私实验室（NIS&P Lab）主要分为两个大组：“无线网络与移动系统安全研究组”和“数据隐私与AI安全研究组”。

  无线网络与移动系统安全研究组（简称：System组）：

  本研究组专注于无线网络和移动系统中的国际前沿安全问题研究。我们已经做过的课题包括：基于超声波的智能手机图案密码破解系统、基于物理层的抗干扰通信和密钥建立、基于隐蔽声音信号的实时双模式通信系统、基于唇语与语音融合的多模态生物特征认证系统、基于气爆声的抗欺骗语音识别系统、无人机安全地点认证系统、基于彩色二维码的智能手机近距离安全通信系统、基于多模传感器和深度图像的人体步态识别系统等等。目前，我们现在正在做与智能手机、IoT设备和无人机安全相关的研究和系统开发。

  数据隐私与AI安全研究组

  （简称：Theory组）

  ：本研究组专注于数据隐私与AI安全中的国际前沿安全问题研究。我们已经做过的课题包括：基于分层编码的多用户动态数据聚合验证与恢复、支持隐私保护的第三方数据完整性审计与发布、针对加密特征丰富数据的相似性查询、支持加密数据的多关键字排序查询、针对加密数据的模糊关键字查询、针对图像特征提取的安全外包计算、针对加密数据的岭回归分析方案、针对生物特征识别的安全外包计算、保证差分隐私的众包数据发布、具有抗合谋能力的频谱拍卖、具有隐私保护的跨模态检索技术、基于加密图的最短距离查询、保证差分隐私的分布式数据挖掘、基于区块链的可搜索加密、基于加密数据的安全图像检索、具有隐私保护的自然语言处理技术、具有隐私保护的在线双向频谱拍卖等等。目前，我们现在正在做与机器学习、可搜索加密、区块链、差分隐私相关的研究。

  王骞老师课题组持续招收硕士和博士研究生，要求如下：

  1. 学习态度好，积极进取

  （人品和态度最重要！）

  ，并对学术研究有浓厚兴趣，有意从事网络与信息安全领域的研究；

  2. 具备一定的编程能力和数学基础；

  3. 英语过六级，具有良好的英文阅读与写作能力。

  同时欢迎和鼓励优秀本科生与王骞老师联系，提前在本科期间参与相关项目的研究，为将来毕业工作或继续深造打好基础

  （建议本科生大二期间联系我，保证有充足的时间做科研项目，争取在毕业之前做出成果！）

  。研究生待遇：生活津贴从优，对于勤奋和能力突出的同学，在读研期间由实验室或导师提供津贴赴美国和香港高校交流。 感兴趣的同学，请通过电子邮件和王骞老师联系：qianwang@whu.edu.cn。

