  个人简介

  陈晶

  ，武汉大学国家网络安全学院教授，副院长，国家级青年高层次人才。研究方向为网络安全、分布式系统安全。主持国家重点研发计划项目1项，国家自然科学基金重点项目1项，国家重点研发计划课题1项，国家自然科学基金4项，教育部联合基金1项，湖北省重点研发计划1项，山东省重点研发计划1项，湖北省自然科学基金2项等多个项目。在USS、CCS、INFOCOM、TDSC、TIFS、TMC、TC、TPDS、中国通信、计算机学报、软件学报、电子学报等国内外高档期刊和会议上发表论文160余篇。应邀担任中国高校联盟区块链专委会副主任委员、中国云安全联盟理事、CCF区块链专委会执行委员、湖北省网络安全协会理事；获得首届湖北省网络安全优秀教师奖；获得中国指挥控制学会科技进步一等奖1项，湖北省科技进步奖2项，出版专著5本，获得发明专利23项，计算机软件著作权8项。

  研究方向

  大数据安全、云安全、应用密码学、移动安全、身份认证与管理、区块链

  教育背景

  2003年7月毕业于武汉理工大学，获工学学士学位。

  2008年3月毕业于华中科技大学计算机学院计算机科学专业，获工学博士学位。

  工作经验

  2008-至今 武汉大学

