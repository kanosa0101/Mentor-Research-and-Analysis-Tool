  个人简介

  严飞，男，现为武汉大学国家网络安全学院教授，博士生导师，湖北省网络空间安全研究中心副主任。中国可信云社区（

  ChinaSigTC

  ）主要发起人之一，中国可信计算与信息安全学术会议（

  CTCIS

  ）多届程序委员会副主席。主持和参与了国家自然科学基金、国家重点研发计划、

  973

  、

  863

  、以及华为、浪潮、大唐等企业合作多项，完成我国首款民用

  TPM

  可信计算机安全测评系统，完成一款可信云演示验证系统，主要参与国家安全技术标准制定

  1

  项，主要研究方向：系统安全与可信计算、可信智能对抗与人机接口安全。曾获湖北省科技进步一等奖

  2

  项、二等奖

  1

  项，获教育部网络空间安全产学协同育人优秀案例一等奖

  1

  项、二等奖

  1

  项。

  研究方向

  信息系统安全

  可信计算与硬件增强安全

  可信智能对抗与人机接口安全

  智能系统测评分析与防御

  教育背景

  1992—1998 湖北省武昌实验中学 中学

  1998—2002 武汉大学 计算机学院 计算机科学与技术专业 本科

  2002—2007 武汉大学 计算机学院 信息安全专业 博士研究生

  工作经验

  2022.12——至今，武汉大学，国家网络安全学院，教授

  2017.12——2022.11，武汉大学，国家网络安全学院，副教授

  2013.11——2014.11，美国University of Texas at San Antonio，访问学者

  2010.12——2017.12，武汉大学，计算机学院，副教授

  2008.4——2010.12，武汉大学，计算机学院，讲师

  教授课程

  本科生：《操作系统原理》、《操作系统设计》

  硕士研究生：《分布式系统原理》

  博士研究生：《网络空间安全对抗前沿》

  发表论文

  课题科研

  研究团队

  获奖信息

  2019年，“自主可控的可信计算关键技术及应用“，湖北省科技进步奖一等奖，1项，排名3

  2016年，“网络安全威胁主动感知及研判的方法与技术”，湖北省科技进步奖二等奖，1项，排名3

  2014年，“可信软件的构造方法和技术”，湖北省科技进步奖一等奖，1项，排名8

  2017年，“基于数据熵变可信度量的勒索软件主动防御系统”，第十届全国大学生信息安全竞赛全国一等奖，优秀指导教师

  2016年，“基于SGX的动态口令保护系统”，第九届全国大学生信息安全竞赛全国一等奖，优秀指导教师'
