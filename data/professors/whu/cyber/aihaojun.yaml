  个人简介

  艾浩军，博士生导师，武汉大学国家网络安全学院教授。1994年7月毕业于哈尔滨工程大学电子工程系无线电技术专业，获学士学位，1997年7月毕业于华中科技大学图像所模式识别与智能控制专业，获硕士学位，2003年毕业于武汉大学遥感信息工程国家重点实验室摄影测量与遥感专业，获博士学位。2008年到2009年，日本北海道大学信息科学研究科，博士后研究员。现为武汉大学-ITU（国际电信联盟）联络代表。

  研究方向包括物联网与无线感知，音视频分析与安全，数据安全与系统安全。

  在国际期刊和学术会议上发表20余篇论文，获授权发明专利6项。

  主持与参与多项国家级、省部级项目。包括：

  （1）横向项目：热电池辅助研制系统，2024-2026（主持）；

  （2）横向项目：高通量图像的无线信道可靠传输系统，2020-2024（主持）

  （3）国家自然科学基金项目61971316：面向广域机会信号环境的高可用室内定位关键技术研究，2020.01-2023.12，（主持）

  （4）国家重大研发计划2016YFB0502204：面向大型复杂区域的室内混合智能定位系统，2016.07-2022.12，（主持）

  （5）横向项目：多机器人通信与定位技术，2015-2016（主持）

  研究方向

  移动感知与计算、音视频内容分析、机器学习AI

  教育背景

  1994年7月毕业于哈尔滨工程大学无线电技术专业，获学士学位；

  1997年7月毕业于华中科技大学模式识别与智能控制专业，获硕士学位；

  2003年毕业于武汉大学摄影测量与遥感专业，获博士学位。

  2008年到2009年，日本北海道大学信息科学研究科，博士后研究员。

  工作经验

  2000-2017：武汉大学计算机学院

  2018-至今：武汉大学国家网络安全学院

  教授课程

  本科：数字逻辑与EDA；多媒体技术

  硕士研究生：物联网安全；机器学习

