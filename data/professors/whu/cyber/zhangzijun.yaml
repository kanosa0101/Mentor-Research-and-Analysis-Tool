  个人简介

  张子君，计算机科学博士，毕业于加拿大卡尔加里大学。本科、硕士毕业于华中科技大学。研究方向涉及网络，云计算，和深度学习，研究成果发表于相关领域顶级会议如SIGMETRICS，NeurIPS，ICML。目前研究兴趣集中于机器学习基础算法，涉及神经网络的优化算法，正则化，网络结构，表征学习，强化学习等多个前沿课题。

