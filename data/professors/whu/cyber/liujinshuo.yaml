  个人简介

  刘金硕 教授、博士，美国弗吉尼亚大学访问副教授、荷兰皇家科学院访问学者、韩国建国大学访问学者，毕业于荷兰莱顿大学。研究领域：网络舆情监控、数据挖掘、高性能计算。主持国家自然科学基金共3项，国家重点研发计划课题负责人1项，课题级技术负责人负责了国家重点研发计划项目1项，国家重点研发计划子课题1项。主持省部级项目2项，国网等横向19项。发表SCI和EI等高水平文章49篇,获批国家发明专利25项，获批美国专利1项。2012年获批Nvidia全球教学中心，2013年Nvidia全球研发中心。出版专著1本、译著1本。2016.9建立了武汉大学-阿伯丁大学联合研究院的知识工程与信息安全联合研究中心。2017获得中国地震局防震减灾科技成果奖2等奖，2017国家电网科技进步奖3等奖

  研究方向

  网络舆情监控、数据挖掘、高性能计算

