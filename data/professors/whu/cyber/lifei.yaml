title: 副教授
supervisor: 博导、硕导
bio_raw: '武汉大学国家网络安全学院副教授，博/硕士生导师，中国计算机学会、中国中文信息学会、中国人工智能学会会员，中国中文信息学会情感计算专委会、社会媒体处理专委会、大模型与生成专委会委员。主要从事自然语言处理、大模型安全、社会计算、情感分析、信息抽取等方向的研究。论文方面，在相关方向的期刊和会议上发表论文100余篇。近年来主持和参与国家重点研发计划、国家科技重大专项、中国计算机学会-蚂蚁科研基金等多个项目。教学方面，主讲本科生和研究生的《自然语言处理》、《AI程序设计实训》等课程。

  实验室常年招收硕士研究生、博士研究生，欢迎对以上方向感兴趣的同学通过邮箱lifei_csnlp@whu.edu.cn联系我

  语言和认知计算实验室主页：

  http://lacc.whu.edu.cn

  在研项目

  [1] 大模型在国际金融场景下对于低资源语言的持续学习和架构拓展机制研究，中国计算机学会-蚂蚁科研基金，主持，在研

  [2] 大模型遗忘学习方法研究，主持，在研

  [3] 新一代人工智能国家科技重大专项，多模态大模型内生安全关键技术与示范应用---多模态多语言大模型自进化价值对齐，参与，在研

  [4] 国家重点研发计划，多语言多模态科技情报数据内容识别技术研究，主持，在研

