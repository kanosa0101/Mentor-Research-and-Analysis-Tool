  个人简介

  任延珍，女，博士，教授，博士生导师。研究方向为多媒体内容安全，主要包括AI交互安全，多媒体取证，多媒体伪造检测，多媒体信息隐写及隐写分析、多媒体特征表示学习等。于1993年、1999年和2009年分别获西北工业大学学士、华中科技大学工学硕士和武汉大学通信与信息系统专业工学博士学位。于1999至今在武汉大学任教，2016年1月至2017年1月，获国家教育部留学基金委员会资助，赴美国SUNY进行学术交流访问。主持承担国家自然科学基金项目、中央高校基本科研业务费专项资金项目、省部级专项及企业合作项目多项。发表SCI/EI论文20余篇。以第一发明人获得8项国家技术发明专利授权，3项软件著作权。获湖北省科技进步二等奖1项、武汉市科技进步二等奖1项。担任IEEE
  Transaction on Information Forensics &Security，SCIENCE CHINA Information Sciences等权威学术刊物审稿人，《信息安全学报》多媒体安全专刊特约编辑，中国图象图形学学会数字取证与安全专业委员会委员，CCF语音对话与听觉专业组委员，中国防伪行业协会信息隐藏专业技术委员会委员等。

  研究方向

  多媒体内容安全，包括AI交互安全，多媒体取证，多媒体伪造检测，多媒体信息隐藏及隐写分析，多媒体特征表示学习等

