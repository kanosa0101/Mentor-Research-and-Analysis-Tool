  个人简介

  欧长海，男，苗族，博士，武汉大学国家网络安全学院教授。1989年出生于贵州铜仁，2013年毕业于北京交通大学计算机科学与技术专业，2018年获得中国科学院大学网络空间安全学院(中国科学院信息工程研究所)网络空间安全专业工学博士学位。同年，就职于新加坡南洋理工大学计算机科学与工程学院，任职Research
  Fellow，主攻应用密码学、硬件与嵌入式系统安全、密码侧信道分析与安全防护技术。

  研究方向包括（但不限于）：应用密码学、硬件与嵌入式系统安全、侧信道安全、智能安全等。累计发表论文30余篇，包括IEEE TIFS、TC、TCAD、TITS、TVLSI、IEEE
  Internet of Things Journal、AsiaCCS等国际权威期刊和会议，以及电子学报、密码学报等国内一流期刊。其中，IEEE Transactions
  共10余篇，CCF-A类一作7篇。担任EUROCRYPT、IEEE TIFS、TCAD、TOMM、ACM TECS、TCHES、Information Sciences、IEEE
  Internet of Things Journal、ICICS等知名期刊会议审稿人，第9、10届国际嵌入式系统安全证明研讨会（PROOFS）程序委员会委员。

  欢迎对密码学、网络安全、系统安全、信号处理、人工智能、数理统计、数字电路等感兴趣的同学联系并加入我的团队（邮箱：ouchanghai@whu.edu.cn），度过愉快充实的研究生时光。

  研究方向

  应用密码学、硬件与嵌入式系统安全、侧信道安全、智能安全等

  教育背景

  2013/09-2018/06，中国科学院大学，网络空间安全学院（中国科学院信息工程研究所），博士/工学博士学位，导师：孙德刚

  2009/09-2013/06，北京交通大学，计算机与信息技术学院，本科/工学学士学位

