  个人简介

  冯琦，女，博士，武汉大学国家网络安全学院教授。2021年获得武汉大学国家网络安全学院网络空间安全专业工学博士学位，2022年就职于武汉大学国家网络安全学院。研究方向包括：应用密码学、安全协议、数据安全、安全多方计算等。累计在IEEE
  Transactions on Information Forensics and Security、IEEE Transactions on Industrial
  Informatics、计算机研究与发展等国内外知名期刊上发表学术论文10余篇，一篇论文收录为ESI高被引论文，获Journal of Network and
  Computer Applications期刊的2020年最佳论文奖。

  研究方向

  应用密码学，具体包括：

  (1)安全协议；

  (2)安全多方计算；

  (3)可证明安全性；

  教育背景

  (1)2018-09至2021-12，武汉大学，网络空间安全，博士

  (2)2016-09至2018-06，武汉大学，计算机技术，硕士

  (3)2012-09至2016-06，武汉大学，信息安全，学士

