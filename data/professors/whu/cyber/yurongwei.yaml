  个人简介

  余荣威，1982年生，博士后，副教授，“黄鹤英才”高端人才计划获得者，“湖北省创新创业先锋”获得者，第七届世界军运会保电信息化首席专家，湖北省网络安全与信息化办公室“十四五发展规划”编制组负责人，互联网公共信息安全湖北省工程研究中心副主任，武汉云计算基地首席技术顾问，美国Indiana大学访问学者（合作导师：国际著名网络安全专家Wang
  Xiaofeng教授），武汉大学-美国Indiana大学区块链安全与隐私保护联合研究中心负责人，武汉大学-美国印第安纳大学国际网络攻防联赛队中方牵头人，武汉大学全国大学生信息安全竞赛总教练。荣获湖北省科技进步一等奖1项（第二）、湖北省科技进步二等奖1项（第六）、中国国际高新技术交易会优秀产品奖（第一）、武汉市科技进步一等奖（第二）、全国湾云杯云计算应用大赛优秀指导老师。主持国家自然科学基金、国家重点研发计划项目课题、国家发改委网络安全重大专项子课题等达20多项，其它省部级和华为预研项目5项。在《中国科学》、SCI期刊及国际高水平会议上发表论文20余篇，获国家发明专利授权9项，软件著作权登记3项。已取得两项科技成果鉴定，部分成果实现转让。指导研究生获得“博士研究生科研团队创新研究项目”、“国家大学生创新实验项目”等4项，指导本科生进入“AMD中国高性能总决赛”、参与全国大学生信息安全大赛等。

