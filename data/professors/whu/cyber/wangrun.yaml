bio_raw: '汪润，武汉大学国家网络安全学院教授，博士生导师。2018年在武汉大学获得信息安全专业博士学位，2019-2021年在新加坡南洋理工大学从事博士后研究工作，2021年加入武汉大学国家网络安全学院。入选

  全国博士后创新人才支持计划、

  湖北省高层次青年人才计划、武汉市高层次青年人才计划等。主要研究领域为生成式人工智能安全与隐私，软件与系统安全。主要研究成果先后发表在IEEE S&P、Usenix
  Security、CCS、NeurIPS、ICML、IJCV等国际顶级学术期刊和会议上，主持和承担国防重大专项、国家自然科学基金、国家重点研发计划等'
institutes:
