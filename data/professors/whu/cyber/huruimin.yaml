  研究团队

  行为模式分析组

  本研究组聚焦利用人工智能、计算机视觉、时空数据挖掘等技术，实现对象的行为模式感知、挖掘与预警。具体研究内容包含但不限于：早期疲劳检测、说谎检测、意图识别、基于社会时空轨迹挖掘的情绪感知等；

  社交网络分析组

  本研究组聚焦利用图机器学习、图神经网络等技术，实现复杂网络分析。具体研究内容包含但不限于：隐秘社区挖掘、社区搜索、复杂关系挖掘、基于图数据挖掘的欺诈检测等；

  可信身份计算组

  本研究组聚焦利用身份认证、隐私保护等技术，致力于解决数字环境中的身份伪造、数据泄露等问题，从而提高数字身份管理的安全性。

  对我们课题组感兴趣，并且热爱科学研究，具有自驱学习能力的同学们，我们诚挚地邀请大家加入我们的团队，共同探索前沿科学，追求学术卓越！有兴趣的同学们，请通过电子邮件和胡瑞敏老师联系：hrm1964@163.com

