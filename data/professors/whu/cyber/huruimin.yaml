  个人简介

  胡瑞敏，珞珈杰出学者，中国青年科技奖获得者(2000年)，国务院特殊津贴专家，俄罗斯国家工程院院士，二级教授。2004年任武汉大学国家多媒体软件工程技术研究中心主任，2013年任计算机学院院长，2016年任国家网络空间安全学院执行院长。曾任海康威视公司研究院院长、美亚柏科研究所首席科学家、TCL集团科技顾问。长期从事多媒体信息处理与大数据行为安全分析研究，主持制定IEEE/AVS音频和安防监控联网标准，是国内首款电话线视频电话和IP视频会议系统研制者，在音视频压缩编码、城市视频联网监控和大数据行为安全分析技术方面成就较为突出。主持
  2010年国家重大科技专项、2019年国家重点研发计划项目、2020年国家重点研发计划预研项目和5项国家自然科学基金重点项目研究。获得2002年、2009年湖北省、教育部科技进步二等奖，2016年度湖北省科技进步一等奖，2018年中国国际工业博览会银奖，2022年度湖北省技术发明一等奖。指导学生获CCF会议优秀论文奖、教育部研究生智慧城市大赛特等奖（2015年）、互联网+国赛金奖（2016年）、研究生移动终端大赛一等奖、信息安全大赛一等奖、CCF/CSIG/湖北省等多篇优博论文奖。2016年在美国NIST举办的国际视频大数据分析领域最著名的Trecvid实例竞赛中取得30项全球第一的优异成绩。

  研究方向

  大数据挖掘管理与分析,多媒体信号处理,计算机应用,模式识别,人工智能,数据挖掘与分析,网络安全,音视频处理,云计算与大数据处理等。长期从事多媒体大数据自然社会理解与网络安全行为分析技术研究，重点专注网络空间社会安全感知计算（可信身份计算、隐秘组织发现、复杂关系分析、行为模式挖掘）等大数据自然社会理解的理论与方法研究。

