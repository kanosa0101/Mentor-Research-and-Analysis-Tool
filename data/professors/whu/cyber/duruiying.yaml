  个人简介

  博士，教授，博士生导师，武汉大学国家网络安全学院院长助理。1987年和1994年分别获武汉测绘科技大学计算机技术与应用工学学士和硕士学位；2008年获武汉大学信息安全工学博士学位；2009年美国乔治亚州立大学访问学者。研究方向主要有网络安全、隐私保护。主持和参与国家自然科学基金、省部级课题等多项科研课题，发表论文50余篇，编写和翻译教材10多部，获国家专利3项。获省部级科技进步二等奖1项；国家教学成果一等奖1项、湖北省教学成果一等奖2项。

  应邀担任国家留学基金网评专家

  ，China Communications、通信学报等国内多个核心期刊的审稿人。兼职教育部高等学校信息安全专业教学指导委员会委员和中国密码学会教育专委会委员。

  研究方向

  网络安全、隐私保护

  教育背景

  1987年和1994年分别获武汉测绘科技大学计算机技术与应用工学学士和硕士学位；2008年获武汉大学信息安全工学博士学位；2009年美国乔治亚州立大学访问学者。

  工作经验

  1987年7月毕业留校至今，一直在学校工作。

