  研究团队

  研究团队现有2名教授，1名博后，8名博士研究生，23名硕士研究生。团队微信公众号：珞珈之戍，欢迎访问。

  获奖信息

  1. 2014年“创建信息安全专业培养体系，引领信息安全专业建设“，高等教育国家级教学成果奖一等奖；

  2. 2016年“基础学科（弘毅学堂计算机）拔尖人才培养创新与实践”，湖北省教学成果一等奖；

  3. 2013年“坚持特色办学思想，建设信息安全专业”,湖北省教学成果一等奖；

  4. 2011“以信息安全竞赛为平台，大力推动本科生科研创新实践能力培养“，武汉大学优秀教学成果一等奖安全专业”,武汉大学优秀教学成果一等奖；

  5. 2013年，“本科信息安全专业课程体系研究”获教育部高等学校计算机科学与技术教学指导委员会和《计算机教育》杂志社联合举办的2011-2012全国计算机教育优秀论文评比一等奖

  6. 2012年“信息安全专业指导性专业规范实施方案研究”,武汉大学优秀教学论文一等奖；

  7. 武汉大学2016年度杰出教学贡献校长奖（团队） 排名第二。'
