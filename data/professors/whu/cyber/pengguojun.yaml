  个人简介

  彭国军，1979年11月生，武汉大学国家网络安全学院教授，博士生导师，国家级青年人才，湖北名师，宝钢优秀教师奖获得者。

  现任学院副院长、教育部重点实验室主任，教育部软件安全课程群虚拟教研室带头人，网络空间安全湖北名师工作室主持人。

  兼任全国网络与信息安全防护峰会（XDef安全峰会）联合发起人、执行主席，曾任中国网络空间安全协会理事、中国网络空间安全协会竞评演练工作委员会副主任委员。

  近五年主持前沿创新计划项目、国家重点研发计划课题、国家自然科学基金项目等纵向以及横向合作项目40余项。

  主编出版了《软件安全（微课版）》、《软件安全实践》、《软件安全》、《恶意代码取证》（译著）、《计算机病毒分析与对抗》（第一版、第二版）等著作。

  曾获国家级教学成果奖一等奖（排名4）、湖北省教学成果奖特等奖（排名1）、省部级科技进步二等奖（排名1）、武汉大学杰出教学贡献校长奖等。

  指导学生10余次获全国大学生信息安全类竞赛一等奖、DataCon大数据安全分析竞赛专业赛道冠军、开源安全奖励计划一等奖等，指导学生获得网络安全学院学生创新资助计划项目20项，多次获得优秀指导教师奖。

  研究方向

  网络与信息系统安全，具体包括：

  （1）恶意软件分析与检测；

  （2）软件漏洞分析、检测及防护；

  （3）软件动态可信机制构建等。

  教育背景

  学习经历：

  1997.09-2001.06 武汉大学计算机学院计算机及应用专业 本科

  2001.09-2003.12 武汉大学计算机学院计算机系统结构专业 硕士

  2004.09-2008.12 武汉大学计算机学院信息安全专业 博士

  工作经验

  2018/01 至今 武汉大学国家网络安全学院，教授

  2016/11-2017/12 武汉大学计算机学院，教授

  2010/11-2016/11 武汉大学计算机学院，副教授

  2006/11-2010/10 武汉大学计算机学院，讲师

  2004/04-2006/10 武汉大学计算机学院，助教

  2012年至今 全国网络与信息安全防护峰会（XDef安全峰会，

  http://www.xdef.org.cn

  ）联合发起人，执行主席。

  积极进行网络安全应急服务技术支撑、信息安全领域“政产学研用”交流合作平台的构建、以及科研成果的产业化应用等。

