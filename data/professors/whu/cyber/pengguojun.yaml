  学生科研实践指导：

  担任2009、2010年第一届、第二届武汉大学全国大学生信息安全类竞赛教练组总教练，从2009年开始每年指导学生参加全国大学生信息安全类竞赛活动。

  指导学生曾获得中国网络安全技术对抗竞赛人工智能安全夺旗赛冠军，全国大学生信息安全类竞赛作品赛一等奖5项，二等奖6项等各类获奖20余项。

