  个人简介

  唐明，武汉大学国家网络安全学院教授，长期从事系统安全、处理器安全、密码芯片安全、网络安全等领域的研究工作，在处理器漏洞挖掘、开源处理器设计、系统安全、侧信道分析与防御、硬件IP核保护等方向取得一系列创新性成果。主持“代码抗微架构漏洞分析与修复”、“商用处理器漏洞挖掘与安全性分析”“基于侧信道攻击的分组密码逆向分析方法研究”、“针对侧信道分析的智能密码系统研究”、“诱导式硬件木马检测理论与关键技术研究”等国家自然基金和省部级项目十余项，累计在IEEE
  HPCA、IEEE TIFS、IEEE TCAD、IACR CHES、DATE等国内外知名学术期刊和会议上发表研究论文60余篇，出版学术著作2部，授权国家发明专利10余项，获得电力科技创新一等奖2项、二等奖2项。

  目前实验室主要有以下四个研究方向：

  （1）密码芯片与处理器IP的安全性研究；

  （2）基于深度学习的侧信道分析；

  （3）处理器微架构的侧信道研究；

  （4）基于RISC-V的开源处理器设计。

  实验室主页：

  http://csccl.whu.edu.cn

  DBLP主页：

  https://dblp.org/pid/73/4373-2.html

  研究方向

  （1）密码芯片与处理器IP的安全性研究

  侧重于硬件电路设计（Vivado、FPGA、EDA等）与侧信道分析的结合，主要研究方向：

  - Profiled与Non-profiled能量侧信道攻击；

  - 后量子密码算法的轻量化实现与侧信道分析；

  - 抗侧信道攻击的安全处理器IP设计；

  - 安全硬件设计的形式化验证。

  （2）基于深度学习的侧信道分析

  侧重于侧信道分析与深度学习的结合，主要研究方向：

  - 基于深度学习的侧信道攻击；

  - 抗深度学习侧信道攻击的密码实现防护。

  （3）处理器微架构的侧信道研究

  侧重于系统安全与微架构侧信道攻击（Meltdown、Spectre等）的结合，主要研究方向：

  - 利用软件代码的微架构侧信道攻击；

  - 体系结构级别安全微架构设计；

  - 体系结构级别安全微架构的形式化验证。

  （4）基于RISC-V的开源处理器设计

  侧重于设计RISC-V架构处理器的开源处理器设计，主要研究方向：

  - 轻量高效的RISC-V处理器设计；

  - 安全可信的RISC-V处理器设计。

