  课题科研

  近五年主持代表性科研项目：

  1. 国家重点研发计划课题，2022YFB3103803，泛在信息泄漏的可靠防御理论与系统设计方法研究，2022/12-2025/11，355万元。

  2.   国家自然科学基金面上项目，61972295，诱导式硬件木马检测理论与关键技术研究，2020/01-2023/12，60万元。

  3.   武汉市科技计划项目，2019010701011407，诱导式硬件木马检测系统，2019-2021，50万元。

  主持多项与华为、海思、国家电网等合作的校企合作项目，参与多项国家自然基金重点项目、973项目等。

  研究团队

  目前团队共有教授1名，在读博士研究生8人，在读硕士研究生11人，在读本科生2人。硕士研究生毕业去向多为腾讯、阿里巴巴等企业与科研院所，博士研究生毕业去向多为高校、华为、海思等。

