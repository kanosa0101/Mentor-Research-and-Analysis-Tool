bio_raw: '吴聪，武汉大学教授、博士生导师、国家级青年人才计划入选者、国际指数科学会士。长期围绕智能系统安全、区块链与数字金融安全开展研究，近五年在信息安全领域发表

  CCF A

  类论文60余篇，包括

  ACM CCS、USENIX Security、IEEE

  TIFS、

  TDSC

  等，其中最佳/优秀论文奖7项、

  ESI

  高被引论文5项，成果在国内外多个安全部门验证与落地应用。入选香港大学校长博士后计划，获国际指数科学先驱奖、教育部网络空间安全协同育人一等奖、装备发展部未来挑战赛一等奖等荣誉奖项。担任

  IMWUT/UbiComp

  等6项国际期刊编委/青年编委、

  ICPADS 2025

  等8项国际会议专题/研讨会主席、14项国际会议

  PC

  成员。

  【招生】

  2027年9月入学，博士生2名，硕士生4名；

  研究方向：智能软件与系统安全/大模型与智能体安全/智能设备安全；

  同时，非常欢迎有余力参与科研的本科生加入课题组。

  【

  招聘

  】

  团队招聘研究助理与博士后,有意者请附个人简历联系。

  【论文】

  主页

  ：

  https://cong-wu.com/

  DBLP

  ：

  https://dblp.org/pid/30/10768-3.html'
