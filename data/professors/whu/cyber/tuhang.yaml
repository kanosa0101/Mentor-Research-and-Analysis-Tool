  个人简介

  涂航老师，男，１975年生，湖北浠水人，1999年留校任教。

  研究方向

  密码学应用、嵌入式安全、物联网安全、安全芯片与操作系统

  教育背景

  武汉大学计算机科学与理论专业博士研究生毕业。

  工作经验

  教授课程

  嵌入式系统安全

  发表论文

  课题科研

  格密码的软件与芯片实现

  安全芯片动态度量

  松散存储耦合下的安全COS架构与HSM

  安全编译与代码混淆

  行为级安全仿真环境

  形式化安全验证与安全认证

  新型处理器安全架构

  央行数字货币安全支付协议与密码算法加速研究

  同态加密与标识密码技术的应用

  研究团队

  涂航老师隶属于武汉大学国家网络安全学院密码学研究所密码应用与安全芯片课题组。 该课题组的研究方向包括：密码学、安全芯片、嵌入式可信操作系统、物联网安全协议、区块链和智能合约、面向物联网和云计算领域的安全解决方案等。课题组注重产学研用协同发展，在信息安全特别是密码学应用领域研究二十余年，参与制定了国家密码算法等相关标准，近几年发表近百篇高水平论文并研发了一系列通过权威机构认证的安全芯片及安全软件产品。课题组建立了武汉大学金邦达物联网联合实验室和武汉大学汇顶科技芯片安全联合实验室等。

  获奖信息'
