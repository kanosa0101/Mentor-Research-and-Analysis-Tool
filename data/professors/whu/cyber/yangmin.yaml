  个人简介

  杨敏，博士，副教授，硕士研究生导师。2006年获武汉大学计算机学院信息安全专业博士学位。目前主要研究方向包括网络安全、应用密码学、区块链安全及应用等。主持国家自然基金青年科学基金项目1项、湖北省自然科学基金项目面上项目1项、武汉大学自主科研项目1项，参与国家自然科学基金项目多项。发表二十余篇学术论文，获得国家发明专利2项。自2006年以来，主讲本科生和研究生《操作系统原理》、《信息安全》等课程，曾两次指导学生团队参加
  “花旗杯”软件开发竞赛并获奖。

