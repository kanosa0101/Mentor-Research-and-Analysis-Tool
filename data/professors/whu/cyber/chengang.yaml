  个人简介

  陈刚，男，1970年出生。

  武汉大学国家网络安全学院教授。

  研究方向

  网络安全、Web技术与应用、人工智能

  教育背景

  1988.9-1995.3 浙江大学，获学士学位和硕士学位

  2001-2006 武汉大学，计算机软件与理论，获博士学位

  工作经验

  1995-1998 武汉大学，多媒体软件国家工程技术研究中心，软件四部，部长

  1998-2005 武汉大学，出版社，电子部，副科长

  2005-2017 武汉大学，国际软件学院，软件工程系，研发中心副主任

  2018- 武汉大学，国家网络安全学院，网络安全研究所

  教授课程

  本科生课程：

  信息系统导论、C++程序设计、数据结构与算法、计算机接口与通信、C#程序设计、计算机组织与体系结构、算法设计与分析、面向对象程序设计、UNIX程序设计

  研究生课程：

  软件体系结构、软件过程管理

  发表论文

  Chen Gang, Tan Hui, Chen Xin-meng. Audio Segmentation via the Similarity Measure
  of Audio Feature Vectors. Wuhan University Journal of Natural Sciences, 2005, 10(5):
  833-837

  陈刚, 陈莘萌, 谭辉. 保持听觉一致性的音频缩放方法. 武汉理工大学学报, 2006, 28(4): 105-108

  陈刚, 陈莘萌. 一种考虑类别信息的音频特征提取方法. 计算机研究与发展, 2006, 43(11): 1959-1964

  陈刚, 陈莘萌. 基于独立分量分析的语种识别方法. 计算机工程, 2006, 32(24): 17-19

  Gang Chen, Li Li. An Optimized Algorithm for Lossy Compression of Real-Time Data.
  Proceedings of 2010 IEEE International Conference on Intelligent Computing and Intelligent
  System, 2010, 187-191

  Gang Chen, Bo Han. Improve K-Means Clustering for Audio Data by Exploring a Reasonable
  Sampling Rate. Proceedings of 2010 Seventh International Conference on Fuzzy Systems
  and Knowledge Discovery, 2010, 1639-1642

  《C++高级进阶教程》，武汉大学出版社，2008

  《XML开发技术教程》，武汉大学出版社，2008

  课题科研

  基于多源条件随机场的地球物理参数预测模型研究，国家自然科学基金面上项目，2013-2016

  大数据环境下的测光红移估测模型研究，国家自然科学基金面上项目，2016-2018

  海上地震勘探质量监督平台软件开发，中海油田服务股份有限公司，2015-2016

  一体化MOOC服务工程，湖北省数字出版基金专项，2016-2018

  天门市地名文化专题网站，天门市民政局，2017-2018

