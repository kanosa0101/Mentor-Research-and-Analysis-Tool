  个人简介

  李雨晴，女，博士，武汉大学国家网络安全学院特聘副研究员，硕士生导师。1991年出生于江苏徐州，2019年获得上海交通大学电子信息与电气工程学院信息与通信工程专业工学博士学位（导师是王新兵教授），2019年-2020年在香港科技大学计算机科学与工程系从事博士后研究工作（导师是Bo
  Li教授），2020年-2022年在华为香港研究所理论部任职研究员，2022年5月加入武汉大学国家网络安全学院。研究方向包括（但不局限于）分布式系统、联邦学习、隐私安全、云/边缘计算、网络大数据测量等，研究成果发表于相关领域顶级会议和期刊如IEEE
  TIFS，TMC，ICNP等。 欢迎对分布式系统、联邦学习、云/边缘计算、隐私安全分析等交叉领域研究方向感兴趣的优秀本科生和研究生联系并加入我的团队（邮箱：li.yuqing@whu.edu.cn）！

  研究方向

  研究方向包括（但不局限于）分布式系统、联邦学习、隐私安全、云/边缘计算、网络大数据测量等

