  个人简介

  武汉大学国家网络安全学院教授，博士生导师。上海人工智能学院兼职导师，担任CCF计算机安全专委会常务委员、体系架构专委会执行委员、人工智能专委会委员、容错专委会委员、电子学会信息安全专委会委员，中国可信云社区秘书长等学术。

  毕业于武汉大学计算机学院，获武汉大学信息安全专业博士学位。2017-2018在美国宾夕法尼亚州立大学、2009-2010年美国亚利桑那州立大学工程院信息安全中心研究访问学者。

  研究方向主要包括：系统安全与可信计算、人工智能安全、智能漏洞挖掘、电力物联网安全。主持国家科技部重大专项课题、国家自然基金面上和青年项目，华为、浪潮等多项企业创新项目。出版学术专著6本，授权和申请国家发明专利
  20余 项，国际专利2 项，参编行业标准6项；在CCF A类会议和期刊CCS、NDSS、NIPS、CVPR、DAC、TDSC、TCAD及TCC、计算机学报、软件学报、电子学报等期刊上发表论文80余篇；获得湖北省科技进步一等奖1项、二等奖1项；

  指导全国大学生信息安全竞赛、中国研究生网络安全创新大赛等，获得教育部全国大学生信息安全竞赛作品赛一等奖5 次、二等奖5 次、教育部全国大学生信息安全竞赛优秀指导教师奖4次、教育部全国大学生信息安全竞赛武汉大学总教练且学院获优秀组织奖2
  次；教育部全国研究生移动应用创新大赛二等奖1次，教育部全国高校互联网应用创新大赛二等奖1 次，教育部全国大学生 SDN 应用创新开发比赛二等奖、最具潜力奖1 次，全国互联网
  + 创新创业比赛湖北省互联网 + 创新创业大赛银奖1 次，全国大学生物联网竞赛华中地区一等奖1 次，全国隐私计算大赛三等奖1 次，全国首届 SGX 应用创新大赛二等奖，中国研究生网络安全创新大赛二等奖1次，教育部网络空间安全产学研协同育人一等奖1次、二等奖1次。

  研究方向

  研究方向主要包括：系统安全与可信计算、人工智能安全、智能漏洞挖掘、电力物联网安全。

  教育背景

  2008年获武汉大学计算机学院信息安全专业博士学位

  2009-2010年 美国亚利桑那州立大学(Arizona State University)Ira A. Fulton工程院信息安全中心研究访问学者

  2017-2018美国宾夕法尼亚州立大学研究访问学者

  工作经验

  2019.12 —至今 武汉大学国家网络安全学院，教授，博士生导师

  2018.1 —2019.11 武汉大学国家网络安全学院，副教授，博士生导师

  2009.12 —2017.12 武汉大学计算机学院，副教授

  2004.9 —2009.11 武汉大学计算机学院，讲师

