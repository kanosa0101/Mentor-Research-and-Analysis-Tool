  个人简介

  王后珍，男，1981年生，2010年12月在武汉大学计算机学院获得博士学位后、留校任教。现为武汉大学国家网络安全学院副教授、空天信息安全与可信计算教育部重点实验室的固定研究人员,
  主要从事公钥密码学研究。主持国家自然科学青年基金、国家密码发展基金、湖北省自然科学基金、教育部博士点青年教师基金、中国博士后特别资助和面上资助等项目，发表论文20余篇，取得国家发明专利6项。

