bio_raw: '赵磊，

  博士，武汉大学国家网络安全学院教授、博士生导师。

  长期从事软件及系统安全方向研究，主要包括：

  ●  软件漏洞的检测、诊断、分析与利用（0day挖掘、漏洞扫描、调试与诊断、可利用性评估等）

  ●

  源代码/二进制程序的分析方法（模糊测试、符号执行、动态污点分析等）

  ●

  基于大模型的软件漏洞分析

  （利用AI/GPT等解决程序调试、代码审计、漏洞检测、漏洞诊断等软件安全问题）

  ●

  网络攻击的防御与抑制（安全监控、APT攻击溯源、归因、安全领域知识图谱等）'
