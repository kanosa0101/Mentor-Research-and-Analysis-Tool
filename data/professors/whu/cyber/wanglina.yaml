  个人简介

  王丽娜，武汉大学二级教授，博士生导师，国家重点研发计划首席科学家，全国网络安全优秀教师，武汉大学空天信息安全与可信计算教育部重点实验室主任，国务院政府特殊津贴获得者。主要研究方向是软件与系统安全、人工智能安全。先后主持国家重点研发计划、国家自然科学基金、国家863计划项目等国家级科研项目20余项。成果获湖北省科技进步一等奖、武汉市科技进步一等奖等各类奖项10余项。指导学生在全国大学生信息安全竞赛、挑战杯、研究生网络安全创新大赛等各类赛事上获得多项奖励，获国家教学成果一等奖1项。

