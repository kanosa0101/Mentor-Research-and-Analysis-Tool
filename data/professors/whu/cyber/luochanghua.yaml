  Computer and Communications Security (CCS), Oct 2024.

  [4] Penghui Li, Wei Meng, Mingxue Zhang, Chenlin Wang, Changhua Luo. Holistic Concolic
  Execution for Dynamic Web Applications via Symbolic Interpreter Analysis. In Proceedings
  of The 45th IEEE Symposium on Security and Privacy (Oakland), May 2024.

  [5] Changhua Luo, Wei Meng, Shuai Wang. Strengthening Supply Chain Security with
