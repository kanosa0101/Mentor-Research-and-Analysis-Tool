  个人简介

  王恩澍，毕业于纽约州立大学布法罗分校，获计算机科学与工程博士学位。入选国家海外高层次青年人才计划与湖北省高层次人才计划。主要研究方向：强化学习、车联网安全、自动驾驶安全、人工智能安全。目前已在JSAC、TMC、TITS、ICDCS等国际权威期刊和会议上发表20余篇学术论文；其中，3篇获得最佳论文奖，1篇获得杰出论文奖。欢迎对强化学习、车联网安全、自动驾驶安全及大模型安全等研究领域感兴趣的同学联系我，共同开展相关研究工作。

