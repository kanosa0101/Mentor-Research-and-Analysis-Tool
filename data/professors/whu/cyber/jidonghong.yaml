  个人简介

  先后在武汉大学和牛津大学获计算机和语言学博士学位。主要从事自然语言处理、深度学习、大数据平台（智慧医疗、智慧建筑、智慧教育等）和对话机器人等方面的研究。近年来主持省部级以上项目近20项，在本领域顶级期刊和会议上发表论文40多篇。

  研究方向

  自然语言处理、社会计算、深度学习、大数据平台和对话机器人。实验室既强调前沿研究，也强调应用研究。要求硕士生至少发表1篇CCF或SCI论文。

  教育背景

  武汉大学和清华大学计算机专业，牛津大学语言学专业

  工作经验

  曾在新加坡国立大学和新加坡信息通信研究院担任研究员，以色列路透研究所担任内容主管

  教授课程

  自然语言处理技术（硕士和博士）、社会计算（本科、硕士和博士）

