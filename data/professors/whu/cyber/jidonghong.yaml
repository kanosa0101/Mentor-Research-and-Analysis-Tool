  课题科研

  目前在研项目：

  1）智慧建筑大数据平台，主持，2018年

  摘要：运用物联网和人工智能技术针对建筑行业大数据，包括管理、检测、监测等数据进行深度挖掘，实现建筑行业各类数据的互联互通、风险预警、决策服务等功能。

  2）汉语句法结构和事件结构的联合分析研究，国家自然科学基金面上项目。项目编号：61772378，起止时间是2018年1月至2021年12月。经费60万。主持

  摘要：针对汉语句法结构和事件结构，在现有资源基础上建立标注资源，并基于深度学习实现这两种结构的联合分析。

  3）对话机器人平台建设，主持，220万，2018年

  摘要：针对自媒体空间，基于用户画像和深度学习模型实现知识和情感的双重交互和引导。

  4）动物疫情大数据平台，70万，国家重点研发项目，参与，2018

  摘要：针对动物疫情，实时监测全球动物疫情的爆发和流行情况，基于历史数据实现对未来动物疫情爆发的风险评估。

  5）基于本体演化和事件结构的语义网模型研究，国家哲学与社会科学重大招标项目。项目编号：11&ZD189，起止时间是2012年1月至2019年12月。经费80万+2016年批准滚动80万。联合主持

  摘要：基于基础本体和领域本体，建构面向事件结构的深度理解模型， 并构建特定领域的自动问答系统。

  6）智慧教育大数据平台，200万，2017-2019，主持

  摘要：针对汉语国际教育，实时推送相关媒体和研究进展，基于知识图谱和用户画像实现个性化推荐、评估和建议。

  已结束项目：

  1） 汉语语篇连贯的事件链模型研究，国家自然科学基金面上项目。项目编号：61373108，起止时间是2014年1月至2017年12月。经费78万。主持。

  2） 汉语文本推理的资源建设和统计分析研究，国家自然科学基金面上项目。项目编号：61173062，起止时间是2012年1月至2015年12月。经费58万。主持。

  3） 基于本体演化和事件结构的语义网模型研究，国家哲学与社会科学重大招标项目。项目编号：11&ZD189，起止时间是2012年1月至2015年12月。经费80万+2016年批准滚动80万。联合主持。

  4） 汉语特征结构的资源建设和自动分析研究，国家自然科学基金重大研究计划培育项目。项目编号：90820005，起止时间是2009年1月至2011年12月。经费50万。主持。

  5） 信息检索中的文本重排技术研究，国家自然科学基金面上项目。项目编号：60773011，起止时间是2008年1到2010年12月。经费27万。主持。

  6） 语义搜索关键技术研究，湖北省自然科学基金重点项目，经费20万，主持。

  7） 篇章语义计算的理论和方法，国家自然科学基金重点项目，总额270万，到帐90万，排名第三。

  8） 基于语义分析的舆情分析技术：100万，主持；2015年

  9） 动物疫病大数据分析：39万，主持，2016年；

  10） 全球健康大数据平台：70万，主持，2015年；

  11） 面向特定领域的互联网大数据平台，60万，主持，2016年；

  12） 自然语言处理支撑平台：178万，主持，2016年；

  研究团队

  团队有2位副教授。10位博士生、20位硕士生。

  合作对象包括诺丁汉、伯明翰、布兰迪斯、浦项、KAIST等研究单位。

