  课题科研

  1、

  湖北省国际科技合作项目，工业物联网入侵检测技术研究，在研，主持

  2、

  湖北省技术创新计划项目，基于时空数据驱动的跨路域交通流状态辨识及迁移技术研究与应用，在研，参与

  3、

  湖北省国际科技合作项目，车联网边缘计算的多源数据融合研究，在研，参与

  4、

  国家重点研发计划课题，分布式学习中的数据安全基础理论，在研，参与

  5、

  国家自然科学基金面上项目，分布式机器学习任务动态定价与部署关键技术的研究，结题，参与

  6、

  湖北省自然科学基金面上项目，大型无线传感网中簇优化和数据聚合的研究，主持，结题

