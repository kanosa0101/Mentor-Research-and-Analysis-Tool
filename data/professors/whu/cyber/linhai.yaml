  个人简介

  林海，副教授，分别于

  2005

  年

  9

  月和

  2008

  年

  12

  月获得法国巴黎第六大学（

  Université Pierre et Marie Curie

  ，

  UPMC

  ）计算机网络硕士学位和法国国立高等电信学院（

  Telecom ParisTech

  ）计算机网络博士学位。博士毕业后，在法国电信

  Orange

  实验室从事下一代多媒体网络研究。之后，加入中兴通讯欧洲研究所，负责富通信（

  RCS

  ），

  VoIP

  等项目。

  2012

  年

  6

  月加入武汉大学。目前就职于武汉大学国家网络安全学院，本人一直从事网络和以及网络安全、算法和深度学习、数据融合方面的教学和研究，特别在车联网和边缘计算，时间序列预测、卡尔曼滤波方面进行了较为深入的研究，在相关领域发表了论文四十多篇，专利和软著多项。申请人作近年来负责和主持了湖北省重点研发项目、湖北省国际合作项目、武汉市应用基础研究计划等。并作为骨干成员参加了国家重点研发项目、国家科技部国际合作项目、国家自然科学基金面上项目等。同时，也积极投身于创新、创业中，入选了武汉市第

  9

  批

  “

  光谷人才计划

  ”

  。

  研究方向

  1.

  算法与深度学习

  深度学习研究包括：

  1

  ）强化学习：多步骤的马尔科夫决策模型（

  Toward Multiple-Phase MDP Model for Charging Station Recommendation

  ，

  IEEE TITS

  ），多智能体和大动作空间强化学习（

  SABQ: Transition-Aware Advantage-based Branching Q-Network for Efficient Deep Reinforcement
  Learning in Large Action Spaces

  ，在投）；

  2

  ）迁移学习：迁移学习在智能交通中的应用（车联网中基于迁移强化学习的跨域充电站推荐算法，物联网学报）；

  3

  ）联邦学习：车联网下的联邦学习（

  Koshino: A Semi-Asynchronous Edge-Based Federated Learning Framework for Highly
  Dynamic Vehicular Networks

  ，在投）

  算法研究包括：

  1

  ）时间序列算法：车联网的交通流预测（

  Frequency Enhanced Dynamic Graph Convolutional Networks for Traffic Flow Forecasting

  ，

  IEEE access

  ）；

  2

  ）推荐算法：电动车的充电推荐（

  PDQN: User Preference-Based Charging Station Recommendation

  ，

  IEEE TCE

  ）；

  3

  ）物流仓储中的储位优化算法（针对

  B2C

  电商物流配送中心的储位优化算法，计算机应用与软件；低层人工拣货仓库货位优化问题研究，计算机工程与科学）；

  4

  ）路径规划算法：无人机的路径规划

  2.

  车联网和边缘计算

  包括：

  1

  ）车联网边缘计算：边缘计算的任务调度（

  A survey on computation offloading modeling for edge computing

  ，

  Elsevier JNCA

  ）；

  2

  ）边缘智能（

  Luffynet:

  面向硬件感知的边缘智能，计算机工程）；

  3

  ）车联网中充电站推荐

  3.

  数据融合和网络安全

  包括：

  1

  ）车联网入侵检测（

  RAG-HIDS: A Multi-Relational Graph-Based Hierarchical Intrusion Detection System
  for In-Vehicle Networks

  ，在投）；

  2

  ）车联网信任机制（

  Trust evaluation mechanism for the internet of vehicles based on filtering algorithm,
  Computer Networks

  ）；

  3

  ）数据融合：卡尔曼滤波，粒子滤波，联邦滤波等

