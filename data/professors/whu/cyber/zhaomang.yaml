  个人简介

  赵莽，毕业于德国萨尔大学，先后获数学及计算机专业本科学士学位及自然科学博士学位。曾在CISPA亥姆霍兹信息安全中心工作五年，先后担任助理研究员及博士后研究员。入选国家海外高层次青年人才计划。主要研究方向：应用密码学、密钥交换、大型通信协议的设计与安全性分析。目前已在IEEE
  S&P、Usenix Security等信息安全领域国际顶级会议上发表5篇学术论文，其中1篇获得最佳论文奖。

