bio_raw: '教育背景

  1985年9月-1990年6月 清华大学自动化系工业自动化仪表专业学习，获工学学士学位

  1992年9月-1995年2月 清华大学自动化系检测技术及自动化装置专业学习，获工学硕士学位

  1995年3月-1998年6月 清华大学自动化系检测技术及自动化装置专业学习，获工学博士学位

  工作履历

  1990年8月-1992年8月 清华大学自动化系 助教

  1998年8月-2001年7月 清华大学自动化系 讲师

  1999年1月-2000年1月 Delft University of Technology 博士后

  2001年8月-2010年12月 清华大学自动化系 副教授

  2002年1月-2002年3月 UMIST(曼彻斯特理工大学） 访问学者

  2010年12月-至今 清华大学自动化系 教授

  学术兼职

  IEEE Member 2011，IEEE Senior Member 2015

  Associate Editor, IEEE Transactions on Instrumentation and Measurement 2018年至今

  Scientific committee member, World Congress on Industrial Process Tomography 2016年至今

  Scientific committee member, International Symposium on Measurement Techniques for
  Multiphase Flow 2011年至今

  International board member, IEEE International Conference on Imaging Systems and
  Techniques, 2011年至今

  在北京市自动化学会担任委员 2009年7月至今

  在中国自动化学会仪表及装置专业委员会担任委员 2003年1月至今

  在中国计量测试学会两相流测量专业委员会担任委员 2002年8月至今

  研究领域

  [1] 过程成像技术（Process Tomography)

  过程成像是一种用于工业过程测量、监测和控制的成像技术，其采用类似于医学断层成像的技术，通过特殊设计的敏感器空间阵列，以非接触或非侵入方式获取被测对象的场信息，运用图像重建算法重现被测过程对象装置内部某一横截面上物质的分布情况，实现其被测参数的可视化。过程成像技术有多种形式，目前课题组主要从事电容成像（Electrical
  Capacitance Tomography)方面的研究,内容包括传感器设计、优化、建模；成像系统电子测量硬件设计；图像重建；图像解释等。

  [2] 两相流/多相流检测技术

  两相流（two-phase flow或two-component flow）或多相流（multi-phase flow或multi-component flow）是指由两种或多种相物质（或成分）构成的流动，如石油工业中的油／气、油／水两相流和油／气／水多相流；冶金、电力工业中各种气力物料输送管道中的气／固两相流等。研究两相流流动特性及变化规律并对其相关参数进行测量对于相关的科研和设计工作以及生产过程的安全高效运行均具有十分重要的意义。近年来，两相流检测技术已成为现代工业国家的一个重要科研领域。目前课题组主要从事基于静电、电容、及图像等传感器的气/固、气/液两相流流速、浓度、流量等多种参数的测量。

  [3] 反问题理论及其应用

  反问题（Inverse Problems)广泛存在于众多科学研究及工程领域，通俗解释就是由已知结果反求造成该结果的可能原因的过程。反问题通常具有病态特性,这为其求解造成了相应的困难。目前课题组主要从事反问题正则化理论（regularization)、数值方法及其在断层成像图像重建等方面的应用。

  [4] 多传感器融合理论及应用

  多传感器融合是指通过将来自单一或多个传感器系统的数据和信息进行关联、相关和组合，在一定准则下进行分析、综合、支配和使用，以获得对被测对象更加完备与及时的一致性解释与描述，进而实现相应的估计、决策、及评估。课题组目前相关工作主要涉及图像融合、态势分析等内容。

  研究概况

  [1] 电容成像若干问题研究， 国家自然科学基金项目（61571253）， 2016年1月至2019年12月

  [2] 电容成像新型传感器及测量策略关键技术研究， 国家自然科学基金项目（60972097）， 2010年1月至2012年12月

  [3] 混合交通条件下行人安全状态识别技术，863项目（2009AA11Z206），2009年6月至2011年12月

  [4] 气体超声波流量计研究及开发，国际合作项目，2009年1月至今

  [5] 多模态过程成像关键技术研究，国家自然科学基金重点项目（60532020， 项目负责人：天津大学自动化学院王化祥教授），2006年1月至2009年12月

  [6] 新型超声波流量计研究及开发，国际合作项目，2006年1月至今

  [7] 气固两相流关键测量技术研究， 国家自然科学基金两个基地项目， 2005年1月至2007年12月

  [8] 电学式过程成像系统的优化及其应用 国家自然科学基金 2003年1月至2005年12月

  奖励与荣誉

  2009年 获得教育部颁发的 “基于电学成像技术多相流测量研究”自然科学二等奖（第2完成人，第2完成单位）

