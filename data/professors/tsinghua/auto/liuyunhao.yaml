title: 教授
supervisor: 博导
bio_raw: '教育背景

  1990年-1995年，在清华大学自动化系学习，获得工学学士学位

  1995年-1997年，在北京外国语大学高级翻译学院获得文学硕士学位

  2001年-2004年，在美国密西根州立大学计算机系获得工学硕士和博士学位

  工作履历

  2004年-2011年，在香港科技大学计算机科学与工程系历任助理教授、副教授、博士生导师、系研究生部主任（Postgraduate Director）

  2011年，获聘清华大学长江学者特聘教授

  2013年-2017年，任清华大学软件学院院长

  2018年-2020年，任美国密西根州立大学MSU Foundation Professor和计算机系主任

  2020年8月起，担任清华大学全球创新学院（GIX）院长，自动化系教授、博士生导师

  2025年11月，当选中国科学院院士

  学术兼职

  ACM Transactions on Sensor Network主编

  ACM中国理事会荣誉主席

  研究领域

  物联网与无线传感网，室内定位与网络诊断，RFID，工业互联网与云计算

  奖励与荣誉

  2007年，获得香港最佳创新与研究大奖

  2010年，获得教育部自然科学一等奖

  2011年，获得国家自然科学二等奖、国家杰出青年基金

  2013年，获得ACM Presidential Award

  2014年，获得ACM MobiCom最佳论文奖

  2016年，获得中国计算机学会物联网专委会青年成就奖

  2021年，获得ACM SIGCOMM最佳学生论文奖'
