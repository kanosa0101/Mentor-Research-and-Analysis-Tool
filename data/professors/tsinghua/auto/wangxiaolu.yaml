title: 助理研究员
email: wangxlu@mail.tsinghua.edu.cn
bio_raw: '教育背景

  2009年9月至2015年7月 北京化工大学 控制理论与控制工程 博士

  2005年9月至2009年7月 北京化工大学 信息管理与信息系统 学士

  工作履历

  2021年1月至今 清华大学自动化系 助理研究员

  2015年7月至2018年6月 清华大学自动化系 博士后

  研究领域

  大规模群体紧急疏散理论、方法及智能疏散系统

  奖励与荣誉

  国家科学技术进步奖二等奖（排名9）

  教育部自然科学奖一等奖（排名3）

  中国石油和化学工业联合会科技进步奖三等奖（排名3）

  中国产学研合作促进会产学研合作创新成果二等奖（排名3）

  学术成果

  主要科研项目：

  1. 国家自然科学基金委员会，国家自然科学基金面上项目，基于动物学试验的逃生群体行为演化研究，2018-01至2021-12，项目负责人

  2. 中国博士后科学基金会，博士后科学基金面上一等资助，应急疏导员行为干预的有效性研究，2015-08至2018-07，项目负责人

  3. 国家科技部，国家重点研发计划，典型危险化学品事故全过程灾变机理与储存设施无缝隙化管理技术，2016-07至2020-06，技术骨干

  4. 国家科技部，973计划，危险化学品事故的遥测预警系统理论与方法，2011-08至2015-08，研究骨干'
