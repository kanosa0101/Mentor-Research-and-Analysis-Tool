bio_raw: '学术兼职

  2008年1月-2013年12月 在 IEEE Transactions on Automatic Control 担任编委 (Associate Editor)

  2008年12月-至今 在Automatica担任编委 (Associate Editor)

  2010年1月-至今 在国际自动控制联合会 (International Federation of Automatic Control) 鲁棒控制技术委员会
  (IFAC Technical Committee 2.5 on Robust Control) 担任委员

  研究领域

  网络化系统基本特性分析与结构辨识：

  随着对系统性能要求的提高和通信、计算等领域的技术发展，系统结构日趋复杂、规模日趋庞大。同时，在大数据分析、人工智能等领域，复杂任务驱使了众多大规模人工网络的构造。另外，网络安全、从分子水平理解复杂疾病的形成机理并开发相应的治疗方案等实际问题，也对大规模动态系统特性分析和综合提出了新需求。

  与传统的多输入多输出系统不同，这类系统的分析与综合需要考虑一些新要素，如算法可扩展性、执行机构/传感器的配置、数据信息量、通讯失效和/或延迟、恶意攻击/信息提取等。同时，子系统间直接作用的估计也是一个非常重要的课题。

  本研究结合电力系统、基因调控网络、人工智能等领域的实际问题，探讨大规模网络化动态系统的可控性、可观测性等基本问题，以及因果关系辨识、分布式状态估计等大数据分析、复杂系统解读中的重要课题。

  研究概况

  [1] 半导体硅单晶生长数字孪生与品质管控系统 （国家自然科学基金（重大科研仪器研制项目）），2022年01月至2026年12月

  [2] 含随机连接的网络化系统基本特性分析 （国家自然科学基金（重点项目）），2018年01月至 2022年12月

  [3] 大规模空间连接系统分布式鲁棒状态估计（国家自然科学基金（面上项目）），2015年01月至 2019年12月

  [4] 一类多维空间分布系统的鲁棒控制与建模基础问题研究 国家自然科学基金(国家杰出青年基金) 2006年1月—2010年12月

  [5] 基于动态网络鲁棒主元分析的酵母基因调控规律研究 （与李梢副教授、赵千川教授合作） 清华大学信息科学与技术学院基础研究基金 2006年6月-2008年5月

  [6] 随机传递函数阵样本的产生及其在鲁棒控制系统综合中的应用 国家自然科学基金 2006年1月—2008年12月

  [7] 高温超导（线材）磁悬浮系统动态特性的闭环辨识 教育部高等学校博士学科点专项科研基金 2006年1月-2008年12月

  [8] Bi 系高温超导线材的实用化及其大规模生产技术的开发 科技部 863 计划 与本校物理系应用超导研究中心等单位的联合研究 2003年11月至2006年10月

  [9] 多模态多自由度大型结构电磁轴承控制研究 清华大学基础研究基金 与本校核研院的合作研究 2003年11月至2006年10月

  [10] 基于T-S模型的突变系统鲁棒状态估计算法研究及在高温超导磁悬浮系统中的应用 教育部跨世纪优秀人才培养计划 2003年1月至2005年12月

  [11] 高温超导线材磁悬浮实验系统的鲁棒状态估计与控制 清华大学基础研究基金 2002年11月至2004年10月

  [12] 基于闭环实验数据的模型集辨识与检验 教育部优秀青年教师支持计划 2002年1月至2004年12月

  [13] 鲁棒控制建模中几个关键问题的研究 国家自然科学基金 2002年1月至2002年12月

  [14] 模型集的降阶及概率分布特性 清华大学信息学院基础创新研究基金 2000年1月至2002年12月

  [15] 建模与鲁棒控制系统综合的相关性研究 清华大学骨干人才支持计划 1999年12月至2001年12月

  [16] 高信赖性を有するモデル集合の同定理论にかんする研究 日本国文部省科研补助金 1998年4月至2000年3月

  [17] 鲁棒控制的实验研究 国家博士后科学研究基金 1995年4月至1997年3月

  [18] 鲁棒控制建模问题及其应用软件的开发 国家自然科学基金 1995年1月至1996年12月

  [19] 模型集辨识的几个基础问题 留学回国人员启动基金 1995年1月至1996年12月

  奖励与荣誉

  2021年获第 40 届中国控制会议 “关肇直奖”（获奖题目：网络化动态系统特定连接的全局可辨识性；获奖人：殷恺琳（在读博士生）, 周彤）

  2020中国自动化学会自然科学奖一等奖 (项目名称：大规模网络化系统基本特性分析与分布式鲁棒状态估计 (独立获奖人))

  2018年当选 IEEE Fellow (控制系统协会推荐)

  2019年当选中国自动化学会会士

  2007年获得IEEE Transactions on Signal Processing 编委会颁发的 Appreciated Reviewer

  2004年 获得国际自动控制联合会 (IFAC) 学术期刊 Automatica 编委会 颁发的 杰出评阅人

  2003年 获得教育部颁发的 教育部提名国家科学技术奖自然科学奖 (获奖题目: 模型集辨识及其在控制系统综合中的应用) 一等奖 (第一获奖人)

