bio_raw: '教育背景

  1991年7月 清华大学自动化系，工学硕士

  2004年1月 清华大学自动化系，工学博士

  工作履历

  1991年8月至今 清华大学自动化系

  2013年11月至今  电子商务交易技术国家工程实验室 主任

  学术兼职

  科技部现代服务业总体专家组组长

  国家标准化管理委员会电子商务标准化工作总体组组长

  国家电子商务示范城市创建工作专家咨询委员会专家组组长

  北京市区块链专班专家组成

  国际学术期刊《International Journal of Crowd Science》主编

  历任第二、三届国家信息化专家咨询委员会委员

  研究领域

  1.电子商务理论、技术及应用

  2.区块链基础技术研发与应用

  3.众智科学、数据科学、服务科学及应用

  4.智能制造

  5.云制造

  研究概况

  在理论创新方面，面向电子商务市场共性需求，提出并实践了电子商务基础信息设施概念与框架；面向万物互联的众智网络时代，提出了自然科学与社会科学交叉融合的新兴学科方向——众智科学与工程。2015年，国家主席习近平和新加坡总统陈庆炎在人民大会堂共同见证下，清华大学与南洋理工大学签署了共建“众智科学研究中心”合作谅解备忘录。2015年，建立了众智科学与工程国际联盟，创办了《International
  Journal of Crowd Science》国际学术期刊，并连续召开年度众智科学与工程国际学术会议。

  在技术突破方面，研究开发了电子商务可信交易保障、电子合同、电子发票、跨境电子商务综合服务、电子商务市场运行监测等电子商务基础信息设施系列技术与系统。研制了数十项行业规范，并牵头制定了二十余项国家标准。开展了智能数字本体理论与技术、精准互联理论与技术、智能交易理论与技术、可信保障理论与技术、众智网络操作平台等众智科学技术体系及核心关键技术研究开发，并取得了系列研究成果。

  在实践引领方面，研发的电子商务可信交易保障公共服务平台、电子合同管理与服务平台、电子发票管理与公共服务平台、跨境电子商务综合服务平台等已经成功地进行了试点应用，遍及北京、广州、杭州、贵州等省市。在农业领域，研究开发网络化众智型农业产业运行平台，开展未来网络化智慧农业示范工程建设；在生态环保领域，研究开发网络化众智型生态环保监测与服务平台，从污染物产生的源头和过程出发研发全新的环保监测与服务体系，促进了新型绿色生态产业发展。

  在智库支撑方面，电子商务交易技术国家工程实验室已经成为国家发改委、中央网信办、商务部、国家市场监督管理总局等政府机构的智囊。重点参与了《国务院关于大力发展电子商务加快培育经济新动力的意见》、国家发展和改革委员会等《促进电子商务发展三年行动实施方案（2016-2018年）》、《我国数字经济发展战略》、商务部《电子商务“十三五”发展规划》等政策文件的研究与起草工作。参与创建国家电子商务示范城市、商务部国家电子商务示范基地、国家市场监督管理总局电子商务可信交易保障试点、国家税务总局电子发票试点、海关总署跨境贸易电子商务服务试点、中国人民银行移动电子商务金融科技服务创新试点等电子商务的推进工作。

  主要项目

  1. 国家重点研发计划，众智网络结构演化与鲁棒性2017YFB1400104， 2017.12.25-2020.11。

  2. 国家重点研发计划，多数据源整合、交叉验证和高效利用技术研究2019YFB1404904， 2019.12-2022.11

  3. 北京高校新冠肺炎疫情防控应急科研攻关，新冠肺炎众智网络监测与分析平台研发和应用，2020.1-2020.12。

  4. 安徽省商务厅，安徽省电子商务统计监测体系建设项目，2017.11-2020.12。

  5. 中国航空油料集团公司, 航油库存管理理论与应用实践研究,期限2014.12-2015.9。

  6. 国家科技支撑计划子课题，生产性服务业解决方案共性技术研究2015BAH18F04-01，2015.1-2016.12。

  7. 国家科技支撑计划子课题，供应链基础信息规范管理技术与系统研究开发，2013.1.1-2015.12.31.6。

  奖励与荣誉

  2019年, 电子商务基础信息设施技术及应用，中国物流与采购联合会科技进步奖一等奖

  2011年,“现代港口综合物流信息平台研究与实施”成果获山东省科技进步二等奖；

  2001年,“北京桑普电器CIMS工程”获北京市科技进步二等奖。

  1999年,“毛主席纪念堂瞻仰信息管理系统”获中共中央办公厅科技进步二等奖。

  2016年, 企业运营模拟实验教学系统，清华大学第十四届实验技术成果一等奖。

  2001年, 清华大学应用效益显著奖。

  学术成果

  出版著作6部，在国内外重要刊物及会议发表论文百余篇。

