title: 副研究员
bio_raw: '教育背景

  2010年9月-2016年6月 清华大学，计算机科学与技术系，获工学博士学位

  2006年9月-2010年6月 清华大学，计算机科学与技术系，获工学学术学位

  工作履历

  2025年7月 至今 清华大学自动化系 副研究员

  2022年7月-2025年7月 启元实验室 助理研究员/副研究员

  2022年2月-2022年6月 清华大学计算机科学与技术系 科研助理

  2019年5月-2022年1月 深圳清华大学研究院 博士后/复眼计算视觉智能装备与技术研发中心 副主任

  2017年12月-2019年2月 上海宝尊电子商务有限公司 技术总监

  2016年8月-2017年12月 中国空间技术研究院钱学森空间技术实验室 工程师

  研究领域

  网络传输、视频处理、智能感算

  研究概况

  针对传统视觉传感器的感知技术在大场景多对象视觉应用上的巨大瓶颈和挑战，围绕智能感知与计算成像技术，致力于宽视场高分辨智能感算技术研究，并在多种型号无人机上进行集成验证。发表国内外论文10篇，获得专利4项，作为项目负责人承担国防应用验证项目两项，参与国防重大专项任务一项，并承担及参与多项横向项目

  学术成果

  1、韩宇星，章俊，王光宇，李伟适，李政，周炳。网络传输方法、装置、电子设备及存储介质。ZL202111057676.0

  2、韩宇星，章俊，王光宇，李伟适，李政，周炳。网络拥塞控制方法、装置、电子设备及存储介质。ZL202111651815.2

  3、Xia, J., Tian, J., Xing, J., Cheng, J., Zhang, J., Wen, J., ... & Lou, J. (2020,
  May). Social Data Assisted Multi-Modal Video Analysis For Saliency Detection. In

  ICASSP 2020-2020 IEEE International Conference on Acoustics, Speech and Signal Processing
  (ICASSP)

  (pp. 2278-2282). IEEE.

  4、Zhang, J., Wen, J., & Han, Y. (2017). TCP-ACC: performance and analysis of an
  active congestion control algorithm for heterogeneous networks.

  Frontiers of Computer Science

  ,

  11

  (6), 1061-1074.

  5、Zhang, J., & Wen, J. (2015, June). RETCP: A ratio estimation approach for data
  center incast applications. In

  2015 IEEE International Conference on Communications (ICC)

  (pp. 338-343). IEEE.'
