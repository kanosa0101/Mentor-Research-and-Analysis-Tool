bio_raw: '教育背景

  1998年8月至2002年7月 在清华大学自动化系自动化专业学习，获工学学士学位

  2002年8月至2008年7月 在清华大学自动化系控制科学与工程专业学习，获工学博士学位

  工作履历

  2008年7月至2010年6月 清华大学动力机械及工程热物理博士后流动站 博士后

  2009年2月至2011年7月 加拿大Alberta大学化学与材料工程系 博士后研究员

  2011年8月至2013年11月，清华大学自动化系 讲师

  2013年12月至今，清华大学自动化系，副教授/副研究员

  现任研究生院副院长，曾任自动化系党委副书记、清华大学党委研究生工作部副部长、清华大学研究生招生办公室主任、清华大学学位办公室主任

  学术兼职

  智能化航天测运控教育部重点实验室学术委员会委员

  中国化工学会智能制造专业委员会委员

  中国仪器仪表学会青年工作委员会委员

  美国化学工程师学会（AIChE）高级会员

  《自动化学报》、《控制理论与应用》、《中国化学工程学报》、《Automatica》、《IEEE Transactions on Control Systems
  Technology》、《Journal of Process Control》、《Control Engineering Practice》、《IEEE Transactions
  on Automation Science and Engineering》、《Computers and Chemical Engineering》等期刊审稿人

  《ISA Transactions》专刊客座编辑

  曾任中国控制会议等会议的程序委员会委员

  研究领域

  [1] 大规模复杂系统的拓扑建模、故障诊断与健康管理

  [2] 工业系统智能报警监控

  [3] 系统辨识理论及应用

  [4] 卫星、星座、星群的智能管控

