  on Intelligent Human-Machine Systems and Cybernetics, pp. 318-323, Nanchang, China,
  2012.

  [3] Ranran Hou, Huangang Wang, Yingchao Xiao, Wenli Xu, Incremental PCA based online
  model updating for multivariate process monitoring, Proceedings of the 10th World
  Congress on Intelligent Control and Automation, pp. 3422-3427, Beijing, China, 2012.

  [4] Ma Yao, Huangang Wang, One-class support vector machine for functional data
  novelty detection, Global Congress on Intelligent Systems, pp. 172-175, Wuhan, China,
  2012.

  [5] Lihui Zhao, Huangang Wang, Wenli Xu, OES structural feature based fault detection
