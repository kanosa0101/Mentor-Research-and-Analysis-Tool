bio_raw: '教育背景

  2007年8月至2011年6月，新加坡南洋理工大学电气与电子工程学院，获博士学位

  2003年9月至2007年7月，中山大学数计学院， 获学士学位

  工作履历

  2023年7月-今，清华大学自动化系，长聘教授

  2017年1月-2023年6月，清华大学自动化系，（准聘/长聘）副教授

  2012年7月-2016年12月，清华大学自动化系，讲师、助理教授（博士生导师）

  2011年6月至2012年6月，新加坡南洋理工大学，博士后

  2015年7月－2015年8月，意大利都灵理工大学，访问学者

  2014年9月至2014年10月，澳大利亚墨尔本大学，访问学者

  2013年5月至2013年7月，香港科技大学，访问学者

  学术兼职

  1. Associate editor, Automatica, 2022-

  2. Associate editor, IEEE Transactions on Control of Network Systems, 2021-

  3. Associate editor, IEEE Transactions on Cybernetics, 2020-

  4. Associate editor, Systems & Control Letters, 2018-

  5. Associate editor, IEEE Control Systems Letters (2019-2022)

  6. Program Chair, The 15th IEEE International Conference on Control and Automation
  (ICCA), 2019

  7. Associate editor, Conference Editorial Board, IEEE Control System Society

  8. 国际自动控制联盟《网络化系统》技术委员会成员 (Member of IFAC Technical Committee on Networked Systems);

  9. IEEE 控制系统学会《网络与通信》技术委员会成员(Member of Technical Committee on Networks and Communications,
  IEEE Control System Society);

  10. 中国自动化学会控制理论专业委员会委员

  11. 中国自动化学会信息物理系统控制与决策专业委员会

  12. 中国人工智能学会工业人工智能专业委员会

  教学情况

  1.开设课程

  •研究生课程《最优滤波理论与应用》，春季学期

  •本科生课程《运筹学》，春季学期

  •研究生课程《复杂网络建模与优化》（非线性规划），秋季学期

  研究领域

  1. 网络化控制系统

  2. 分布式优化与学习

  3. 直接数据驱动控制分析与设计

  研究概况

  主持在研项目（课题）

  1.硬件资源受限下的高效智能控制，科技创新2030--“新一代人工智能”重大项目，2023/03-2026/02

  2.无人系统的高效控制理论与应用, 国家自然科学基金委杰青项目，2024/01-2028/12

  3.超大规模群体智能决策及自主评价与推演，科技创新2030--“新一代人工智能”重大项目课题子任务，2020/11-2024/10

  4.面向重载列车虚拟耦合运行的协同控制理论与方法，国家自然科学基金委重点项目，2021-2025

  主持完成项目（课题）

  1.基于双神经网络的智能MPC及在FPGA芯片上的快速实现，清华大学国强研究院，2021/04-2023/04/29

  2.隧道、港口工程救援辅助机器人研制及应用，国家重点研发计划课题，2017/06-2020/12

  3.基于最少反馈信息的网络化控制系统分析与设计，国家自然科学基金委优青项目，2018/01-2020/12

  4.全海深 ARV 系统基础理论问题研究，国家重点研发计划课题子任务，2016/01-2021/06

  5.缆控采样器的水动力学模型及其运动控制，国家自然科学基金委面上项目，2016/01-2019/12

  6.基于能源指标约束和多工序仿真优化的钢铁行业MES开发及应用，科技部863计划课题，2013/01-2015/12

  7.网络化多自主体系统的分布式优化及其在传感器网络中的应用，国家自然科学基金委青年项目， 2014/01-2016/12

