bio_raw: '教育背景

  清华大学自动化系 控制科学与工程，工学博士，2009年

  清华大学自动化系 自动化，工学学士，2004年

  工作履历

  2009年7月至2015年12月 清华大学 讲师

  2016年1月至2017年12月 清华大学 助理教授、博导

  2018年1月至今 清华大学 副教授、博导

  学术兼职

  中国人工智能学会生物信息学与人工生命专业委员会，常务委员

  中国自动化学会智能健康与生物信息专业委员会，秘书长

  Genomics Proteomics Bioinformatics, Editorial Board Members

  BMC Bioinformatics , Associate Editor

  研究领域

  1、生物信息学

  2、机器学习

  3、系统与精准医学

  研究概况

  信息、智能与生命健康领域的交叉研究是当前学术研究前沿，也服务于“面向人民生命健康”的国家战略。课题组主要从事生物信息学与机器学习方向的研究，旨在针对生命遗传密码与复杂系统调控规律解析的关键难题，发展智能生物信息处理的新理论与新方法，推动恶性肿瘤等重大疾病诊疗的精准化与个体化，已在Nature
  Cell Biology、Nature Communications、Science Advances等杂志上发表论文60余篇。主持国家自然科学基金优秀青年科学基金、重点项目，以及国家重点研发计划课题等国家级科研项目。

  课题组主页：http://lifeome.net/'
