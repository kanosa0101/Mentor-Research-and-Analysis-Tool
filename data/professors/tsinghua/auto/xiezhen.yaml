bio_raw: '教育背景

  1994年9月–1998年7月 山东农业大学，园艺系，学士

  1998年9月–2001年7月 山东农业大学，园艺系，硕士

  2002年1月–2006年12月 内华达大学拉斯维加斯分校，生命学院，博士

  工作履历

  2006年10月–2010年6月哈佛大学，FAS系统生物学中心，博士后

  2010年7月–2011年12月 麻省理工学院，生物工程系，博士后

  2012年1月–2019年12月 清华大学，信息科学与技术国家实验室（筹）/国家研究中心，特别研究员

  2020年1月–现在 清华大学，自动化系，副教授

  学术兼职

  Quantitative Biology杂志，主编助理

  中国医药生物技术协会合成生物技术分会主任委员

  中国人工智能学会生物信息学与人工生命专业委员会委员

  中国生物工程学会合成生物学专业委员会委员

