bio_raw: '教育背景

  1998年8月至2002年7月 清华大学自动化系自动化专业学习，获工学学士学位；

  2002年8月至2006年7月 清华大学自动化系控制科学与工程专业学习，获工学博士学位

  工作履历

  2006年8月至2010年11月 清华大学自动化系，讲师

  2010年12月至2015年11月 清华大学自动化系，副教授

  2015年12月至2020年11月 清华大学自动化系，长聘副教授

  2006年8月至2007年2月 哈佛大学，访问学者

  2010年4月至2010年6月 香港科技大学，访问学者

  2013年3月至2013年8月 麻省理工学院，访问学者

  2020年12月至今 清华大学自动化系，长聘教授

  学术兼职

  委员

  2018-2022, 中国自动化学会第十一届控制理论专业委员会委员兼副秘书长

  2016-2020, 中国自动化学会第一届工业控制系统信息安全专业委员会委员

  2018-至今, IEEE CASE Steering Committee委员

  2017, IEEE控制系统协会Board of Governors委员

  2016-至今, IEEE Internet of Things Activity Board委员

  专委会主席

  2015-至今, IFAC智慧城市控制专业委员会主席

  2012-至今, IEEE控制系统协会北京分会主席

  2012-至今, IEEE机器人与自动化协会智能建筑专业委员会副主席

  2012-2015, IEEE控制系统协会离散事件系统专业委员会主席

  副编辑

  2019-2021 IEEE Control Systems Letter

  2015-至今 IEEE Transactions on Automatic Control

  2012-2018 IEEE Control Systems Society Conference Editorial Board

  2012-2017 IEEE Transactions on Automation Science and Engineering

  2012-2016 Discrete Event Dynamic Systems: Theory and Applications

  2013-至今 IEEE ICRA (International Conference on Robotics and Automation) Conference
  Editorial Board

  2011-至今 IEEE CASE (Conference on Automation Science and Engineering) Conference
  Editorial Board

  大会程序委员会主席、副主席

  2019, IEEE国际自动化科学与工程年会(CASE2019)程序委员会副主席

  2017, IEEE国际自动化科学与工程年会(CASE2017)程序委员会主席

  会员

  IEEE Senior Member, ACM Member, INFORMS Member

  研究领域

  主要学术方向为网络化信息物理融合能源系统的优化理论与方法，特别在序优化及事件驱动优化的理论、方法与应用方面做出了贡献。

  研究概况

  2018.12-2020.12, 智能自主配送系统, 美团, 项目负责人

  2017.01-2020.12, 多尺度网络化离散事件动态系统策略优化，国家自然科学基金委面上项目，项目负责人

  2017.07-2020.12, 新型建筑智能化系统平台技术，国家重点研发计划，主要学术骨干

  2016.07-2020.06, 能源互联网的规划、运行与交易基础理论，国家重点研发计划，主要学术骨干

  其他项目信息请访问个人主页

  http://www.cfins.au.tsinghua.edu.cn/personalhg/jiaqingshan

  奖励与荣誉

  2020年教育部自然科学奖二等奖，项目名称：信息物理融合能源系统运行策略优化理论与方法。完成人：贾庆山，徐占伯，吴江，夏俐，管晓宏

  2018年国家自然科学二等奖。项目名称：网络化系统安全优化理论与方法及在能源电力等系统的应用。完成人：管晓宏、赵千川、翟桥柱、贾庆山、徐寅峰

  2017年Journal of Simulation最佳论文奖

  2015年IEEE国际自动化科学与工程年会最佳论文奖

  2014年WCICA供应链领域最佳论文奖

  2012年国家自然科学基金优秀青年基金

  2009年国家自然科学二等奖。项目名称：离散事件动态系统的优化理论与方法。完成人：曹希仁、赵千川、陈曦、贾庆山

