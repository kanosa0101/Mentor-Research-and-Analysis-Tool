bio_raw: '教育背景

  2009年9月-2013年6月, 北京交通大学电气工程学院, 获学士学位

  2013年9月-2016年1月, 北京航空航天大学自动化科学与电气工程学院, 获硕士学位

  2020年2月-2020年8月, 滑铁卢大学, 访学

  2016年9月-2021年6月, 北京航空航天大学自动化科学与电气工程学院, 获博士学位

  工作履历

  2025年2月-至今, 清华大学自动化系, 助理研究员

  2021年7月-2025年1月, 北京航空航天大学机械工程及自动化学院, 博士后

  学术兼职

  中国海洋学会深海技术分会第二届委员会委员

  中国仿真学会人工智能仿真技术专业委员会委员

  IEEE Member, CAAI Member

  研究领域

  1.非线性控制理论与应用

  2.水下机器人的总体设计

  3.无人载具控制系统开发

  研究概况

  1.移动机器人的后向目标跟踪控制研究，国家自然科学基金委青年科学基金项目(C类), 2025年1月-2027年12月，项目负责人

  2.复杂海洋动力环境下的揽控潜水器高精度作业控制，国研中心交叉创新群体项目，2026年1月-2026年12月，项目负责人

  3.浅水障碍水下自主探查多机器人系统，横向，2021年4月-2022年3月，项目骨干

  4.XX-1A地面手持终端，横向，2020年10月-2021年5月，项目骨干

  奖励与荣誉

  1. 2025年第30届人工生命与机器人国际会议（ICAROB）最佳论文奖.R1

  2.2025年中国仿真学会自然科学二等奖.R5

  3.2025年中国发明协会发明成果二等奖.R6

  4.2017年《控制理论与应用》年度优秀论文.R1

  学术成果

  1. Lixia Yan, Baoli Ma, Yingmin Jia. Universal control for both rendezvous and tracking
  of multiple nonholonomic unicycles. IEEE Transactions on Control of Network Systems,
  11(1):439-449, 2024.

  2. Lixia Yan, Baoli Ma, Yingmin Jia, Yuxin Jia. Observer-based trajectory tracking
  control of nonholonomic wheeled mobile robots. IEEE Transactions on Control Systems
  Technology, 32(3):1114-1121,2024.

  3. Lixia Yan, Baoli Ma, Yingmin Jia. Trajectory tracking control of nonholonomic
  wheeled mobile robots using only measurements for position and velocity. Automatica,
  159:111374, 2023.

  4. Lixia Yan, Baoli Ma, Yingmin Jia, Yongling Fu. Adaptive containment control of
  multiple underactuated hovercrafts subjected to switching and directed topologies.
  IEEE Systems Journal, 17(3): 3962-3973, 2023

  5. Lixia Yan, Baoli Ma, Wenjing Xie. Robust practical tracking control of an underactuated
  hovercraft. Asian Journal of Control, 23(5):2201-2213, 2021.

  6. Lixia Yan, Baoli Ma. Adaptive practical leader-following formation control of
  multiple nonholonomic wheeled mobile robots. International Journal of Robust and
  Nonlinear Control, 30(17):7216-7237,2020.'
