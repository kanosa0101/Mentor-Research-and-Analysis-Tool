bio_raw: '教育背景

  2014年09月-2019年07月 清华大学，自动化系，获工学博士学位

  2016年10月-2018年03月 哈佛大学医学院，麻省总医院，访问学生

  2010年09月-2014年07月 清华大学，自动化系，获工学学士学位

  工作履历

  2024年1月-至今 清华大学自动化系，准聘副教授

  2021年7月-2024年1月 清华大学自动化系，助理教授

  2022年4月-至今 清华大学-IDG/麦戈文脑科学研究院，兼聘研究员

  2019年7月-2021年7月 清华大学自动化系，博士后

  学术兼职

  2024-至今，Optics Express，Associate Editor

  2024-至今，IEEE Transactions on Circuits and Systems for Video Technology，Senior Associate
  Editor

  2023-至今，PhotoniX，Associate Editor

  研究领域

  1.计算光学

  2.生物医学成像

  3.科学智能

  4.系统生物学

  研究概况

  致力于智能光学成像、显微仪器、科学智能与系统生物学的交叉研究。面向生命科学与医学对介观活体成像的迫切需求，提出了扫描光场成像，数字自适应光学、双光子合成孔径等理论与方法，突破光毒性、高速三维、背景荧光、光学像差等活体成像壁垒，研制出扫描光场显微镜与介观活体三维显微仪器等，为哺乳动物活体大规模细胞间交互研究提供了支撑，并广泛应用于天文观测及先进制造领域。相关成果以主要作者发表于Nature（2022，2023，2026），
  Cell（2021，2023，2024），Science（2026）等，入选“两院院士评选2024年中国十大科技进展新闻”，2022，2023中国光学十大进展，获科学探索奖，祖冲之奖年度突出成果奖，国际基础科学大会前沿科学奖等。主持国家自然科学基金委青年科学基金项目（A类，B类），科技部颠覆性技术专项，北京市重点项目等。任PhotoniX、IEEE
  TCSVT、Optics Express等期刊编委。

