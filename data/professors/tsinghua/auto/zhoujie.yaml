bio_raw: '教育背景

  1986年9月至1990年6月 南开大学数学试点班学习，获理学士学位

  1990年9月至1992年6月 南开大学数学系概率论与数理统计专业学习，获理学硕士学位

  1992年9月至1995年9月 华中理工大学图象识别研究所模式识别与智能控制专业学习，获工学博士学位

  工作履历

  1995年11月至1997年10月 清华大学自动化系 博士后

  1997年11月至1998年7月 清华大学自动化系 讲师

  1998年8月至2003年11月 清华大学自动化系 副教授

  2003年12月至今 清华大学自动化系 教授

  2004年8月至今 清华大学自动化系 博士生导师

  学术兼职

  2016年12月至今 IAPR Fellow

  2004年11月至今 IEEE Senior Member

  2004年1月至今 国际刊物《Int. Journal of Robotics & Automation》 （SCI）编委

  2006年5月至2014年12月 《自动化学报》编委

  2016年12月至今《模式识别与人工智能》副主编

  2013年12月至今 中国自动化学会教育工作委员会主任委员

  2014年12月至今 中国人工智能学会模式识别专委会副主任委员

  2014年4月至今 模式识别国家重点实验室学术委员会委员

  研究领域

  [1] 模式识别

  指纹识别，掌纹识别，人脸识别，机器学习

  [2] 计算机视觉

  视觉监控，仿生双目视觉，医学图像处理，图像分析与检索

  研究概况

  [1] 模式识别与视觉监控），国家杰出青年科学基金项目，2013年1月至2016年12月

  [2] 生物特征识别中的新方法及其应用 国家自然科学基金重大国际(地区)合作研究项目 2011年1月至2014年12月

  奖励与荣誉

  2012年获国家杰出青年科学基金

  2012年获得宝钢优秀教师奖（清华大学共5人获奖）

  2013年获得IBM Faculty Award

  2013年获得《自动化学报》杰出奉献编委奖

  指导的博士生陈芳林获2013年全国优秀博士论文提名奖

  指导的博士生代季峰获2015年中国自动化学会优秀博士论文提名奖

  指导的博士生胡瀚获2016年中国人工智能学会优秀博士论文

  2011年获中国电子学会电子信息科学技术奖一等奖（排名第1）

  2011年获高等学校科学研究优秀成果（自然科学类）二等奖（排名第1）

