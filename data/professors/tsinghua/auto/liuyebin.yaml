bio_raw: '教育背景

  1998年9月-2002年7月 北京邮电大学自动化学院机械电子工程专业，获学士学位

  2002年9月-2009年7月 清华大学自动化系控制科学与工程, 获博士学位

  工作履历

  2009年7月-2011年5月 清华大学自动化系博士后

  2010年1月-2010年7月 德国马普计算所访问

  2011年5月-2012年11月 清华大学自动化系 讲师

  2012年12月-2015年11月 清华大学自动化系 副研究员

  2015年12月-2022年6月 清华大学自动化系 副教授

  2022年6月至今 清华大学自动化系 教授

  学术兼职

  1.CVPR 2021, ICCV 2021 Area Chair

  2.SIGGRAPH Asia 2019, 2020 Committee Member

  3.ICCP 2017-2020 Area Chair

  4.2015-2016年 IEEE Trans. CSVT Guest Editor

  5.2016-2017年 IEEE Journal of STSP Guest Editor

  6.长期担任IEEE T.PAMI, SIGGRAPH, CVPR, ICCV, ECCV, 3DV, ICCP, IEEE T.IP, IEEE T.CSVT
  审稿人

  7.中国图象图形学会三维视觉专委会副主任

  8.中国人工智能学会人机融合智能专委会副秘书长

  研究领域

  三维视觉、数字人体技术、计算摄像

  研究概况

  长期致力于动态三维重建理论和关键技术创新，率先构建了多视角变光照高精三维重建装置，做出了系列创新(获国家技术发明一等奖)。近年针对二十年来长期制约“复杂场景-精简感知-实时重建”发展的基础表征难题，提出了三维场景多元表征(隐表面、体态模板等)模型与协同优化机理，突破了单一表征难以兼顾精度和鲁棒性的矛盾，设计了行为交互4D时空聚类解耦方法，将固定阵列相机拓展至移动乃至单一视点感知，解决了动态三维重建实时计算难题，成功研制了国际首个单一视点相机实时动态三维重建系统，引领了实时人体三维重建新方向。发表PAMI/SIGGRAPH论文近20篇，CVPR/ICCV/ECCV论文近40篇，其中口头报告论文10篇。成立清华大学（自动化系）—
  海信视像全息交互技术联合研究中心，近三年获得华为、OPPO、字节跳动、快手、阿里、蚂蚁金服、平安、海信、商汤、奥比中光、诺亦腾、影创等知名企业合作基金4000余万。

  奖励与荣誉

  2019年中国电子学会技术发明一等奖（排名1）

  国家自然科学基金委优秀青年基金，2015年

  清华大学学术新人，2013年

  国家技术发明一等奖，排名3，2012年

  国家技术发明二等奖，排名3，2008年

  学术成果

  1. Zerong Zheng, Tao Yu, Qionghai Dai, Yebin Liu. Deep Implicit Templates for 3D
  Shape Representation, IEEE CVPR (Oral) 2021.

  2. Tao Yu, Zerong Zheng, Kaiwen Guo, Pengpeng Liu, Qionghai Dai, Yebin Liu. Function4D:
  Real-time Human Volumetric Capture from Very Sparse Consumer RGBD Sensors, IEEE
  CVPR (Oral) 2021.

  3. Zhe Li, Tao Yu, Zerong Zheng, Kaiwen Guo, Yebin Liu. POSEFusion: Pose-guided
  Selective Fusion for Single-view Human Volumetric Capture, IEEE CVPR (Oral) 2021.

  4. Yuemei Zhou, Gaochang Wu, Ying Fu, Kun Li, Yebin Liu. Cross-MPI: Cross-scale
  Stereo for Image Super-Resolution using Multiplane Images, IEEE CVPR 2021.

  5. Yang Zheng, Ruizhi Shao, Yuxiang Zhang, Zerong Zheng, Tao Yu, Yebin Liu. DeepMultiCap:
  Performance Capture of Multiple Characters Using Sparse Multiview Cameras, IEEE
  ICCV 2021.

  6. Yuxiang Zhang，Zhe Li，Tao Yu, Mengcheng Li, Liang An, Yebin Liu. Light-weight
  Multi-person Total Capture Using Sparse Multi-view Cameras, IEEE ICCV 2021.

  7. Ruizhi Shao, Gaochang Wu, Yuemei Zhou, Ying Fu, Yebin Liu. LocalTrans: A Multiscale
  Local Transformer Network for Cross-Resolution Homography Estimation, IEEE ICCV
  2021.

  8. Hongwen Zhang, Yating Tian, Xinchi Zhou, Wanli Ouyang, Yebin Liu，Limin Wang,
  Zhenan Sun. 3D Human Pose and Shape Regression with Pyramidal Mesh Alignment Feedback
  Loop, IEEE ICCV (Oral) 2021.

  9. Zhiyang Yu, Deyuan Liu, Yu Zhang, Dongqing Zou, Xijun Chen, Yebin Liu，Jimmy Ren，Event-Guided
  Unsupervised Video Frame Interpolation with Complementary Appearance Fusion and
  Subpixel Motion Transformer, IEEE ICCV 2021.

  10. Zerong Zheng, Tao Yu, Yebin Liu, Qionghai Dai. PaMIR: Parametric Model-Conditioned
  Implicit Representation for Image-based Human Reconstruction, IEEE Trans. on Pattern
  Analysis and Machine Intelligence, 10.1109/TPAMI.2021.3050505.

  11. Lizhen Wang, Xiaochen Zhao, Tao Yu, Songtao Wang, Yebin Liu. NormalGAN: Learning
  Detailed 3D Human from a Single RGB-D Image, ECCV 2020.

  12. Zhuo Su, Lan Xu, Zerong Zheng, Tao Yu, Yebin Liu, Lu Fang, Robustfusion: Human
  volumetric capture with data-driven visual cues using a rgbd camera, ECCV 2020.

  13. Tao Yu, Jianhui Zhao, Zerong Zheng, Kaiwen Guo, Qionghai Dai, Hao Li, Gerard
  Pons-Moll, Yebin Liu. DoubleFusion: Real-time Capture of Human Performances with
  Inner Body Shapes from a Single Depth Sensor, IEEE Trans. on Pattern Analysis and
  Machine Intelligence , 42(10), pp.2523-2539, 2020.

  14. Yuxiang Zhang, Liang An, Tao Yu, Xiu Li, Kun Li, Yebin Liu. 4D Association Graph
  for Realtime Multi-person Motion Capture Using Multiple Video Cameras, IEEE CVPR
  (Oral) 2020.

  15. Zhe Li, Tao Yu, Chuanyu Pan, Zerong Zheng, Yebin Liu. Robust 3D Self-portraits
  in Seconds, IEEE CVPR (Oral) 2020.

  16. Zhe Jiang, Yu Zhang, Dongqing Zou, Jimmy Ren, Zhiqiang He, Yebin Liu. Learning
  Event-Based Motion Deblurring, IEEE CVPR 2020.'
