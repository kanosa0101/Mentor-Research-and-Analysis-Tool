title: 长聘教授
email: asean@mail.tsinghua.edu.cn
bio_raw: '教育背景

  1997年9月至2003年12月 四川大学, 博士

  1991年9月至1995年7月 成都中医药大学, 学士

  工作履历

  2013年3月至今 清华大学自动化系 教授

  2006年11月至2013年3月 北京化工大学 教授

  2004年1月至2006年11月 复旦大学 博士后

  1995年8月至1997年8月 重庆制药厂 技术员

  学术兼职

  国家安全生产专家组 信息化组 副组长

  危爆物品扫描探测技术国家工程实验室 副主任

  警务物联网应用技术公安部重点实验室 学术委员会 主任

  研究领域

  电磁波探测技术

  研究概况

  主要研究化学品的磁通门、太赫兹和红外探测技术，及其无人化、智能化载运平台，形成实战化的仪器和系统。

  奖励与荣誉

  【1】973首席科学家；国家杰出青年科学基金获得者；教育部“长江学者”特聘教授

  【2】2018国家科学技术进步奖二等奖（排名1）：危险化学品事故遥测预警与群体疏散应急技术

  【3】2017教育部自然科学奖一等奖（排名1）：大规模群体紧急疏散理论与方法

  【4】2020教育部科技进步奖一等奖（排名1）：遗弃化学弹探测技术与应用

  【5】2019中国石油和化学工业联合会科技进步奖一等奖（排名1）：危险化学品泄漏源定位技术与系统

  学术成果

  主要科研项目：

  （1）国家自然科学基金委员会, 国家重大科研仪器研制项目, 太赫兹痕量探测分析仪, 2020-01至2024-12, 项目负责人

  （2）国家科技部, 国家重点研发计划, 典型危险化学品储存设施安全预警与防护一体化关键技术研究与应用, 2016-06至2020-06, 项目负责人

  （3）国家自然科学基金委员会, 杰出青年科学基金项目, 公共安全与应急管理, 2013-01至2016-12, 项目负责人

  （4）国家科技部, 973计划, 危险化学品事故全过程遥测预警的关键科学问题研究, 2011-08至2015-08, 首席科学家

  （5）某部, 开发合同, 系统研究, 2010-08至2015-08, 项目负责人

  人才培养

  独立讲授《太赫兹技术概论》和《交叉项目训练-光电探测实验》本科生课程；独立讲授《太赫兹探测与成像技术》研究生课程。'
