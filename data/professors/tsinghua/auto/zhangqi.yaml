bio_raw: '教育背景

  2008年9月-2012年6月, 吉林大学生物工程专业, 获学士学位

  2016年9月-2022年6月, 中国科学院大学细胞生物学专业, 获博士学位

  工作履历

  2025年12月-至今, 清华大学自动化系, 助理研究员

  2022年7月-2025年11月, 清华大学自动化系, 博士后

  学术兼职

  2023年11月-至今，清华大学学报（自然科学版），审稿人

  研究领域

  聚焦基因编辑与生物显微成像的跨学科融合研究，致力于开发高精度活体脑网络动态监测系统，并开展基于时空维度的功能组学解析。

  研究概况

  1. 中华人民共和国教育部, 脑网络与类脑智能学科突破先导项目, 意识与通用智能的脑网络基础, 2025-9 至 2030-8, 在研, 研究骨干

  2. 国家自然科学基金, 重点项目, 82441061, 基于偏头痛循证的针刺得气神经-免疫-血管交互机制研究, 2025-11 至 2028-12, 在研,
  研究骨干

  3. 中华人民共和国科学技术部, 国家重点研发计划, 2022YFF1202900, 可调控光感智能生物眼的开发与 设计, 2022-11 至 2025-10,
  结题, 研究骨干

  4.中国博士后科学基金会, 面上资助, 2023M731983, 介观尺度线虫社会行为决策多模态研究, 2023-06 至 2024-07, 结题, 负责人

  奖励及荣誉

  1. 2024年9月，清华大学优秀招生新人

  2.2023年11月，生命联合中心优秀博士后

  学术成果

  [1] Zeng Y, Zhang Q, Xiao Y, Wu S, Kim S, Zhang Y, Wang M, Zhang Y, Li X, Lu Z,
  Wu J, Dai Q. High-fidelity intravital imaging of biological dynamics with latent-space-enhanced
  digital adaptive optics. Nature Biotechnology. 2026 Apr 23.

  [2] Li Y, Zhang Q, Zhang Y, Fan J, Lu Z, Xu X, Li X, Li Z, Wu J, Dai Q. Unsupervised
  transfer learning enables multi-animal tracking without training annotation. Nat
  Methods. 2026 May 4.

  [3] Lu Z, Jin M, Chen S, Wang X, Sun F, Zhang Q, Zhao Z, Wu J, Yang J, Dai Q. Physics-driven
  self-supervised learning for fast high-resolution robust 3D reconstruction of light-field
  microscopy. Nat Methods. 2025 Jul;22(7):1545-1555.

  [4] Jing S; Zhang Q; Li X; SRDTrans: Spatial Redundancy Transformer for High performance
  Self-supervised Fluorescence Image Denoising. Optica Imaging Congress 2025, 2025,
  JVD(1.2)

  [5] Wang Q#, Cao Z#, Du B#, Zhang Q#, Chen L, Wang X, Yuan Z, Wang P, He R, Shan
  J, Zhao Y, Miao L. Membrane contact site-dependent cholesterol transport regulates
  Na+/K+-ATPase polarization and spermiogenesis in Caenorhabditis elegans. Dev Cell.
  2021 Jun 7;56(11):1631-1645.e7.'
