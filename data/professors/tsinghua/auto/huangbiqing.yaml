research_direction_raw: '鲁棒、安全可解释第三代人工智能研究，及其在工业和现代服务业的应用

  1. 基于视觉智能的工业表面缺陷检测核心算法

  2. 基于运动轨迹的车间作业合规性监测算法

  3. 数据驱动的工业装备（风电、核电）健康评估与故障诊断

  4. 云边协同（云计算与边缘计算）的算法和任务优化

  5. 智能制造中的工业互联网与智能控制

  6. 医疗领域的人工智能方法

  7. 数据科学与服务科学

  8. 制造业和服务业知识图谱技术

  在以上方向招收：工学博士、创新领军工程博士、工学硕士、深圳研究生院工程硕士、贵州大数据工程硕士

  注：工程博士重点招收方向：人工智能在智能制造、社会治理、健康医疗等领域的落地应用'
