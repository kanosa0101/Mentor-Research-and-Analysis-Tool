  研究领域

  语音信息处理、个性化语音合成与鉴别

  研究概况

  长期围绕个性化语音模拟等语音建模技术面临的 “鲁棒性不足”问题，展开系统深入的研究。主持国家自然科学基金、科技部重大项目和国际合作项目等10余项，在IEEE TASLP、AI、PR、ICML、AAAI、ACM
  MM和ICASSP等重要国际期刊和会议上发表论文80余篇，已授权发明专利60余项（含美国发明专利9项）。研究成果于2022年获中国人工智能学会吴文俊人工智能技术发明特等奖、2023年获北京市发明专利一等奖、2024年获中国发明协会成果一等奖、2024年获中国电子学会技术发明一等奖。

