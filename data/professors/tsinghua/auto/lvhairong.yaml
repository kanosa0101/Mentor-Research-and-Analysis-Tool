bio_raw: '教育背景

  1998年-2002年 清华大学自动化系 学士

  2002年-2007年 清华大学自动化系 模式识别与智能系统 博士

  工作履历

  2007年-2013年 IBM研究院 研究员

  2013年-2016年 荣科科技 副总裁，医疗健康事业部总经理，研发中心总经理

  2016年-2017年 北京爱医声科技有限公司 董事长

  2017年 至今 清华大学自动化系 副研究员

  学术兼职

  中国计算机学会区块链专业委员会，通讯委员

  中国医师协会智慧医疗专委会，委员

  中国自动化学会智能健康与生物信息专业委员会，委员

  研究领域

  1. 联邦学习

  针对数据隐私保护的需求，研究效率更高、性能更好且数据分布适应能力更强的算法，遵循数据不动模型动的前提，在多参与方或多计算结点之间开展高效率的机器学习。

  2. 知识图谱

  研究复杂知识的表示、提取方法，以及知识图谱的联邦构建方法，实现人在回路的人-人、人-机、机-机知识图谱群智协同构建。

  3. 智慧医疗健康

  参与清华大学数基生命创新群体研究，在数据知识的基础上，建立生命的数学模型；基于多模态人机交互、对话驱动和知识图谱技术，构建诊前、诊中、诊后全病程管理系统。

  4. 深时数字地球国际大科学计划

  深时数字地球（Deep-time Digital Earth，DDE）是中国科学家主导推动的中国第一个国际大科学计划，旨在整合地球演化数据，共享全球地学知识，推动数据-知识双驱动的地球科学研究范式变革；作为主要参与者之一，推动DDE
  Knowledge的研究与应用。参见http://www.ddeworld.org/

  研究概况

  地球科学知识图谱表示模式与群智协同构建，国家自然科学基金0-1原创探索项目，负责人

  基于大数据的建筑能源和机电设备管控及运维一体化，南京市高端团队项目，负责人

  复杂声学环境下声学事件检测与音频场景识别方法研究，国家自然科学基金重点项目，主要参与人

  基于大数据应用的综合健康服务平台研发及应用示范，国家科技支撑计划，主要参与人

  奖励与荣誉

  IBM Research Accomplishment（2012，2013）

  学术成果

  https://scholar.google.com.hk/citations?user=WU1tm2EAAAAJ&hl=zh-CN'
