bio_raw: '教育背景

  2012年9月-2016年6月, 东北大学自动化系, 获学士学位

  2016年9月-2022年1月, 清华大学自动化系, 获博士学位

  工作履历

  2022年2月-2023年12月, 深圳美团科技有限公司, 飞控算法工程师

  2024年1月-2025年12月, 清华大学自动化系, 博士后

  2026年1月-至今, 清华大学自动化系, 助理研究员

  学术兼职

  IEEE Member

  研究领域

  1.可信医疗问诊大模型

  2.外骨骼机器人控制策略

  3.医疗具身机器人系统开发

  研究概况

  1. 基于大型语言模型的骨科慢病管理平台研发，横向，2024.06-2026.06，项目骨干

  2. 加速康复骨科医学数据智能分析算法开发，横向，2025.03-2026.12，项目骨干

  3. 基于眼底影像的冠心病风险预测模型, 横向，2025.07-2027.06，项目骨干

  4. 基于ADMMI的骨科足踝问诊数据库结构数据分析，横向，2025.09-2027.08，项目骨干

  奖励及荣誉

  2019年第12届人机交互国际会议(HSI)最佳论文奖.R2

  学术成果

  1. Tao Xue, Ziwei Wang, Tao Zhang and Meng Zhang. Adaptive Oscillator-Based Robust
  Control for Flexible Hip Assistive Exoskeleton[J]. IEEE Robotics and Automation
  Letters, 2019, 4:3318-3323.

  2. Tao Xue, Ziwei Wang, Tao Zhang, Ou Bai, Meng Zhang and Bin Han. Continuous Finite-Time
  Torque Control for Flexible Assistance Exoskeleton with Delay Variation Input[J].
  Robotica, 2021, 39(2):291-316.

  3. Tao Xue, Ziwei Wang, Tao Zhang, Ou Bai, Meng Zhang and Bin Han. Fixed-Time Constrained
  Acceleration Reconstruction Schemes for Robotic Exoskeleton via Neural Networks[J].
  Frontiers of Information Technology & Electronic Engineering, 2020, 21:705-722.

  4. Tao Xue, Ziwei Wang, Tao Zhang, Ou Bai, Meng Zhang and Bin Han. A New Delayless
  Adaptive Oscillator for Gait Assistance[C]. IEEE International Conference on Intelligent
  Robots and Systems (IEEE IROS), 2020:3459-3464.

  5. Kai Zhu, Tao Xue and Tao Zhang. Confidence-aware Robust Dynamical Distance Constrained
  Reinforcement Learning for Social Robot Navigation[J]. IEEE Transactions on Automation
  Science and Engineering, 2025, 22:16572-16590.

  6. Haolin Fei, Tao Xue, Yiyang He, Lin Sheng, Guanglong Du, Yao Guo and Ziwei Wang.
  Large Language Model-Driven Natural Language Interaction Control Framework for Single-Operator
  Bimanual Teleoperation[J]. Frontiers in Robotics and AI, 2025, 12:1621033.'
