bio_raw: '教育背景

  2016年9月-2020年10月  北京理工大学 光电学院 获工学博士学位

  2013年9月-2016年7月   北京理工大学 物理学院 获理学硕士学位

  2009年9月-2013年7月   山东师范大学 物电学院 获工学学士学位

  工作履历

  2024年1月 - 至今         清华大学 自动化系 助理研究员

  2020年12月-2023年12月     清华大学 自动化系 博士后

  学术兼职

  Fourier of Physics客座编辑，Laser & photonics reviews, Optica (OL\OE \AO)，IOP(JOP\APE)等期刊审稿人

  研究领域

  光场成像，光场调控，智能光子学

  研究概况

  1.国家自然科学基金青年项目：旋转多普勒效应在涡旋激光探测领域的应用基础研究 NO.62201320, 2023.01-2025.12在研 主持

  2.中国博士后科学基金特别资助：光子神经网络在矢量涡旋激光信息处理中的应用研究 NO.2021TQ0180, 2020.01-2023.12 已结题 主持

  3.国家自然科学基金重点项目：矢量涡旋光束生成、传输及畸变矫正技术研究 NO.11834001, 2018.01-2023.12已结题 课题骨干

  4.GF XXX项目：XXX成像关键技术, 2022-2025 在研 课题骨干

  5.科技创新2030-“新一代人工智能”重大项目：片上全光学神经网络计算架构及芯片研究，子课题 NO.2021ZD0109902，2021.12-2025.11
  在研 课题骨干

  奖励及荣誉

  2020     北京市优秀毕业生

  2020     北京理工大学优秀学术成果奖

  2020     北京理工大学优秀毕业生

  2019     中国北方工业奖学金

  2019     中国航天科技奖学金

  学术成果

  1.Yanwang Zhai, Jiamin Wu, Qionghai Dai，“The Rotational Doppler Effect of Twisted
  Photons in Scattered Fields.”Laser & Photonics Review (2023).

  2.Yanwang Zhai, S. Fu, J. Zhang, and C. Gao,“Turbulence aberration correction for
  vector vortex beams using deep neural networks on experimental data.”Optics. Express
  28, 13418-13431 (2020).

  3.Yanwang Zhai, R. Zhang, and C. Gao,“The radial Doppler effect of optical vortex
  beams induced by a surface with radially moving periodic structure,” Journal of
  Optic. 21 054002 (10pp) (2019).

  4.Yanwang Zhai, S. Fu, C. Yin, H. Zhou, and C. Gao, "Detection of angular acceleration
  based on optical rotational Doppler effect," Optics Express 27, 15518-15527 (2019).

  5.Yanwang Zhai, S. Fu, J. Zhang, Y. Lv, H. Zhou, and C. Gao, "Remote detection of
  a rotator based on rotational Doppler effect," (Applied Physics Express 13, 022012
  (2020).

  6.S. Fu, Yanwang Zhai, H. Zhou, J. Zhang, T. Wang, X. Liu, and C. Gao, "Universal
  orbital angular momentum spectrum analyzer for beams," PhotoniX, vol. 1, 2020.

  7.S. Fu, Yanwang Zhai, T. Wang, C. Yin, and C. Gao, ”Tailoring arbitrary hybrid
  Poincaré beams through a single hologram,” Appl. Phys. Lett. 111, 211101 (2017).

  8.S. Fu, Yanwang Zhai, H. Zhou, J. Zhang, T. Wang, C. Yin, and C. Gao, "Demonstration
  of free-space one-to-many multicasting link from OAM encoding," Opt. Lett. 44, 4753-4756
  (2019).

  9.S. Fu, Yanwang Zhai, H. Zhou, J. Zhang, T. Wang, X. Liu, and C. Gao, "Experimental
  demonstration of free-space multi-state orbital angular momentum shift keying,"
  Opt. Express 27, 33111(2019).

  10.R. Zhang, Yanwang Zhai, S. Lin, “Time Circular Birefringence in Time- Dependent
  Magnetoelectric Media,”[J]. Scientific Reports, 5:13673 (2015).

  11.S. Fu, Yanwang Zhai, T. Wang, C. Yin, and C. Gao, "Orbital angular momentum channel
  monitoring of coaxially multiplexed vortices by diffraction pattern analysis," Appl.
  Opt. 57, 1056-1060 (2018)

  12.J. Zhang , Yanwang Zhai, C. Gao 径向偏振矢量光束在大气湍流下的传输分析光学学报40(11) 2020'
