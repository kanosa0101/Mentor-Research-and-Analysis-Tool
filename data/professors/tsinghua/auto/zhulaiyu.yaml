bio_raw: '教育背景

  2013年9月-2020年7月 中南大学，机电工程学院，获工学博士学位

  2009年9月-2013年7月 中南大学，机电工程学院，获工学学士学位

  工作履历

  2024年1月-至今 清华大学自动化系，助理研究员

  2021年9月-2023年12月 清华大学自动化系，博士后

  研究领域

  光机设计、微纳封装、显微仪器

  研究概况

  主要从事光场成像系统设计及理论研究，在机械设计、光学检测、微纳封装、显微仪器等方面有着扎实的能力，为宏观/微观光场成像研究的顺利实施提供了重要的技术储备和硬件基础。

  学术成果

  1.Laiyu Zhu, Liping Min, Xianglin Li, Zhanyu Zhai, Dietmar Drummer, Bingyan Jiang.
  Effects of process conditions on the heat transfer coefficient at the polymer-mold
  interface and tensile strength of thin-wall injection molding parts. Journal of
  Polymer Engineering 2019(5):493-500.

  2.Laiyu Zhu, Wangqing Wu, Li Jiang, Bingyan Jiang. Research on influencing factors
  of the thermal contact resistance in thin-wall injection molding. International
  Polymer Processing 2019, 34(1): 2-8.

  3.Laiyu Zhu, Chunpeng Chu, Bingyan Jiang. Research on warpage of the microfluidic
  chip in injection molding process, Advanced Materials Research 2014, 926-930: 345-348.

  4.Bingyan Jiang, Laiyu Zhu, Liping Min, Xianglin Li, Zhanyu Zhai, Dietmar Drummer.
  Characterization of microchannel replicability of injection molded electrophoresis
  microfluidic chips. Polymers 2019, 11(4): 608

  5.Chunpeng Chu, Bingyan Jiang, Laiyu Zhu, Fengze Jiang. A process analysis for microchannel
  deformation and bonding strength by in-mold bonding of microfluidic chips. Journal
  of Polymer Engineering 2014, 35(3): 267-275.'
