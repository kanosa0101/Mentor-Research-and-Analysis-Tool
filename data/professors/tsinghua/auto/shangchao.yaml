bio_raw: '教育背景

  2011年8月-2016年7月 清华大学自动化系控制科学与工程专业学习，获工学博士学位

  2007年8月-2011年7月 在清华大学自动化系专业学习，获工学学士学位

  工作履历

  2026.01-今 清华大学自动化系 长聘副教授

  2022.06-2025.12 清华大学自动化系 准聘副教授

  2018.10-2022.05 清华大学自动化系 助理教授

  2016.10-2018.10 美国康奈尔大学 & 清华大学 博士后

  学术兼职

  IEEE Member

  中国自动化学会技术过程的故障诊断与安全性专委会 委员

  中国自动化学会过程控制专委会 委员

  担任Expert Systems with Applications、Digital Chemical Engineering以及Control Engineering
  Practice编委

  研究领域

  [1] 工业大模型与工业智能体

  [2] 复杂工业过程建模、控制与优化

  [3] 不确定规划理论方法与应用

  研究概况

  课题组立足我国制造业智能化转型发展趋势，面向以工业过程为代表的复杂工程系统安全、稳定、高效运行等核心问题，将机器学习、运筹学等多学科前沿与控制论思想深度融合，针对复杂工程系统建模控制、监控诊断及优化决策展开了深入研究。近年来在国家级高层次人才计划青年项目（2021年）、基金委面上、青年以及多个企事业委托项目支持下，课题组累计发表高水平SCI论文50余篇，其中包括控制理论顶级期刊IEEE
  Trans. Autom. Control和Automatica论文5篇（长文4篇），一篇论文入选IFAC会刊Control Eng. Pract.“Emerging
  Leaders”（新兴领导者），此外获Fang Chong-Zhi Best Paper Award等多个学术会议优秀论文奖，部分研究成果在炼油、化工等国民经济重点行业得到了工程化推广应用并取得明显成效，并得到了World
  Economic Forum（世界经济论坛）等国际媒体报道。

  奖励及荣誉

  1. 清华大学教学成果奖二等奖，2025（排名1/5）

  2. First Prize of Fang Chong-Zhi Best Paper Award，2025

  3. 清华大学优秀班主任二等奖，2025

  4. 国家“万人计划”青年拔尖人才，2021

  5. Emerging Leaders of Control Engineering Practice, 2021

  6. 清华大学年度教学优秀奖，2021

  7. 张钟俊院士优秀论文奖，2020

  8. Top Reviewer for Control Engineering Practice, 2020

  9. Best Paper Award, International Conference on Industrial Artificial Intelligence,
  2019

  10. Springer Excellent Doctorate Theses Award, 2018

  11. 清华大学教学成果奖一等奖，2016（排名4/5）

  12. 清华大学“紫荆学者”，2016

  13. 清华大学优秀博士论文一等奖，2016

