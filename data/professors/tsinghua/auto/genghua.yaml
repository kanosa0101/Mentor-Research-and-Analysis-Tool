bio_raw: '教育背景

  1999-2003，华中科技大学电子与电气工程学院，学士

  2003-2008，清华大学自动化系，博士

  工作履历

  2008-2010加拿大Ryerson大学博士后

  2010- 清华大学自动化系 讲师、副教授、长聘副教授、长聘教授

  学术兼职

  1. IEEE Trans. on Sustainable Energy，主编

  2. IEEE Fellow

  3. IEC SC8A国际标准建模工作组，Convener/召集人

  4. IET Fellow

  5. 中国电源学会，常务理事

  6. 中国电源学会电能质量专委会，副主任

  7. 中国电源学会新能源电能变换技术专委会，副主任

  8. 中国电源学会青年工作委员会，名誉主任

  研究领域

  1 强化学习、大模型理论方法与应用

  2 可再生能源系统优化控制

  3 新型电力系统稳定控制

  4 海上风电机组运维

  5 月面能源系统

  研究概况

  承担国家级、校企等合作项目30余项，包括：

  1. 国家重点研发计划项目：大型海上风电场智能运维关键技术及应用，项目负责人，2025-2028

  2. 国家自然基金委联合重点项目：新能源场站构网/跟网型变流器动态交互机理与配置方法，项目负责人，2025-2028

  2. 中国工程院重大咨询项目：“双碳”背景下天津市能源结构转型升级路径研究，课题负责人，2023-2024

  3. 国家自然基金委重大集成项目：高比例新能源场景下交直流混联电网的暂态稳定分析理论及控制方法，课题负责人，2022-2025

  4. 国家自然科学基金委优秀青年基金项目：风力发电系统柔性并网控制理论及应用，项目负责人，2018-2020

  5. 国家自然科学基金委联合重点项目：大型风电机组弱联运行基础理论及关键技术研究，项目负责人，2016-2019

  奖励与荣誉

  1. 2024年中国电工技术学会科技进步一等奖

  2. 2024年中达学者

  3. 2023年IEEE PELS Sustainable Energy Systems Technical Achievement Award

  4. 2023年中国电源学会科技进步奖（基础研究类）一等奖

  5. 2023年国家级教学成果二等奖

  6. 2022年第十七届中国青年科技奖

  7. 2022年中国电力科学技术进步一等奖

  8. 2021年清华大学优秀博士学位论文指导教师

  9. 2020年国家科技进步二等奖

  10. 2020年浙江省科技进步一等奖

  11. 2020年中国电力创新奖一等奖

  12. 2019年中国自动化学会科技进步特等奖

