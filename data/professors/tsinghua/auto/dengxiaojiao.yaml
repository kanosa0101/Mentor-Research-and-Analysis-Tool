bio_raw: '教育背景

  2011年9月-2015年7月 中国科学院化学研究所 物理化学专业 获理学博士学位

  2008年9月-2011年7月 东北师范大学 无机化学专业获理学硕士学位

  2004年9月-2008年7月 长春师范大学 化学专业 获理学学士学位

  工作履历

  2019年1月-至今 清华大学自动化系 助理研究员

  2016年1月-2019年1月 清华大学自动化系 博士后

  研究领域

  太赫兹检测技术、光谱分析

  研究概况

  1. 国家自然科学基金面上项目，藏匿爆炸物的太赫兹光谱智能化识别方法，2017/01-2020/12，主持。

  2. 59批博士后基金一等资助,基于太赫兹技术的爆炸物识别方法研究，2016/01-2019/01，主持。

  3. 国家重点研发计划项目，典型危险化学品储存设施安全预警与防护一体化关键技术研究与应用示范，2016/07-2020/06，技术骨干。

  奖励与荣誉

  (1) Xiao-Jiao Deng, Yunpeng Su, Zhijie Li, Jia Li, Xiaoping Zheng*, Hua Geng*, Terahertz
  Spectroscopy and Vibrational Analysis of Sulfur Mustard by Quantum Chemical Calculations,
  Comput. Theor. Chem.,2018, 1142 ,21–27.

  (2) Xiao-Jiao Deng, Xiang-Yu Kong, Xiaoqing Liang, Bin Yang, Hong-Guang Xu*, Xi-Ling
  Xu*, Gang Feng, Wei-Jun Zheng*. Structural and Magnetic Properties of FeGen-/0 (n
  = 3-12) Clusters: Mass-Selected Anion Photoelectron Spectroscopy and Density Functional
  Theory Calculations. J. Chem. Phys., 2017, 147 (23): 234310.

  (3) Xiao-Jiao Deng, Xiang-Yu Kong, Xi-Ling Xu, Hong-Guang Xu,* Wei-Jun Zheng*. Photoelectron
  Spectroscopy and Density Functional Calculations of TiGen- (n = 7-12) Clusters.
  Chin. J. Chem. Phys., 2016, 29, 123.

  (4) Xiao-Jiao Deng, Xiang-Yu Kong, Hong-Guang Xu*, Xi-Ling Xu, Gang Feng, Wei-Jun
  Zheng*. Photoelectron spectroscopy and density functional calculations of VGen-
  (n = 3-12) clusters. J. Phys. Chem. C, 2015, 119(20): 11048-11055.

  (5) Xiao-Jiao Deng, Xiang-Yu Kong, Xi-Ling Xu, Hong-Guang Xu*, Wei-Jun Zheng*. Structural
