  (7) Xiaojiao Deng, Lili Lu, Hongwei Li, Fang Luo*. The adsorption properties of
  Pb(II) and Cd(II) on functionalized graphene prepared by electrolysis method. J.
  Hazard. Mater., 2010, 183(1-3), 923-930.

  (8) Yunpeng Su, Xiaoping Zheng*, Xiaojiao Deng. Terahertz Spectrum Analysis Based
