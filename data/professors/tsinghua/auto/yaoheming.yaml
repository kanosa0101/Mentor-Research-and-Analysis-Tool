bio_raw: '教育背景

  2016年6月-2019年10月，香港大学，获博士学位

  2013年9月-2016年3月，北京航空航天大学，获硕士学位

  2009年9月-2013年7月，北京航空航天大学，获学士学位

  工作履历

  2025年7月-至今，清华大学自动化系，副研究员，国家高层次青年人才

  2023年7月-2025年6月，英国牛津大学/帝国理工学院，欧盟玛丽·居里学者博士后

  2021年7月-2023年6月，香港大学，香港研究资助局博士后

  2020年3月-2021年6月，香港大学，博士后

  2019年10月-2020年2月，香港大学，研究助理

  学术兼职

  中国海洋学会深海技术分会第二届委员会委员

  IEEE Member

  研究领域

  (1)人工智能交叉应用：人工智能跨学科交叉，大数据分析。

  (2)电磁多物理仿真计算：计算电磁学，电磁场相关装备研发。

  (3)计算成像：多物理探测方法，复杂动力学系统正反演。

  (4)生物医药工程：3D生物打印，器官芯片。

  (5)多功能材料与多功能器件研究：先进材料合成方法，先进传感器设计与制造。

  研究概况

  1.面向深海电磁探测的精确电磁建模与接收机优化设计（北京信息科学与技术国家研究中心），2026.1-2026.12，项目负责人。

  2.人工智能增强的石墨烯场效应管传感器系统及其在消化道癌早期诊断中的应用研究（北京信息科学与技术国家研究中心），2026.1-2027.12，项目负责人。

  3.数智化技术在深海生境探索与认知中的应用研究，2025.12-2026.6，项目负责人。

  学术成果

  代表性论文与成果

  1. H. Yao, L. Jiang and M. Ng, Implementing the Fast Full Wave Electromagnetic Forward
  Solver Using the Deep Convolutional Encoder-Decoder Architecture, IEEE Trans. Antennas
  Propag., vol. 71, no. 1, pp. 1152-1157, Jan. 2023.

  2. H. Yao, R. Guo, M. Li, L. Jiang and M. Ng, Enhanced Supervised Descent Learning
  Technique for Electromagnetic Inverse Scattering Problems by the Deep Convolutional
  Neural Networks, IEEE Trans. Antennas Propag., vol. 70, no. 8, pp. 6195-6206, Aug.
  2022. (DOI:10.1109/TAP.2022.3196496).

  3. H. Yao, M. Li, L. Jiang and M. Ng, Antenna Array Diagnosis Using Deep Learning
  Approach, IEEE Trans. Antennas Propag., vol. 72, no. 6, pp. 5396-5401, June 2024.

  4. H. Yao, L. Jiang and M. Ng, Enhanced Deep Learning Approach Based on the Conditional
  Generative Adversarial Networks for Electromagnetic Inverse Scattering Problems,
  IEEE Trans. Antennas Propag., vol. 72, no. 7, pp. 6133-6138, July 2024.

  5. H. Yao, L. Jiang and M. Ng, Deep Learning Electromagnetic Inversion Solver Based
  on a Two-Step Framework for High-Contrast and Heterogeneous Scatterers, IEEE Trans.
  Antennas Propag., vol. 72, no. 6, pp. 5337-5342, June 2024.

  6. H. Yao, L. Jiang and M. Ng, Fast Electromagnetic Inversion Solver Based on Conditional
  Generative Adversarial Network for High-Contrast and Heterogenous Scatterers, IEEE
  Trans. Antennas Propag., vol. 72, no. 4, pp. 3485-3494, April 2024.

  7. H. Yao, L. Jiang and M. Ng, Deep Learning Based Source Reconstruction Method
  Using Deep Conditional Generative Adversarial Networks, IEEE Trans. Microw. Theory
  Techn., vol. 72, no. 5, pp. 2949-2960, May 2024.

  8. R. Guo, H. Yao, M. Li, L. Jiang and M. Ng, Joint Inversion of Audio-Magnetotelluric
  and Seismic Travel Time Data With Deep Learning Constraint, IEEE Trans. Geosci.
  Remote Sens., vol. 59, pp. 7982-7995, Sept. 2021. (as Corresponding Author).

  9. H. Yao, Y. Hsieh, J. Kong and M. Hofmann., Modeling Electrical Conduction in
  Nanostructure Assemblies Through Complex Networks. Nature Materials 19, 745-751,
  2020.'
