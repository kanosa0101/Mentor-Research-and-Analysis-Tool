bio_raw: '教育背景

  2010年9月-2014年7月，北京航空航天大学，信息与计算科学，学士

  2014年9月-2017年3月，北京航空航天大学，控制工程，硕士

  2017年3月-2020年12月，法国南特中央理工学院(École Centrale de Nantes)，自动化，生产信息自动化与机器人(Automatique,
  productique et robotique)，博士

  工作履历

  2021年1月-2023年7月，清华大学自动化系，博士后

  2023年8月-至今，清华大学自动化系，助理研究员

  学术兼职

  1. 中国人工智能学会智能决策专委会专业技术委员

  2. 担任IEEE TAC、Automatica、自动化学报（英文版）、IEEE TCNS、IEEE RAL、IEEE L-CSS、IJRNC等期刊审稿人

  研究领域

  1. 机器人敏捷机动控制

  2. 时滞系统、网络化控制系统

  3. 滑模控制、固定时间控制、预定时间控制

  研究概况

  从事固定时间、预定时间控制理论研究与双轮机器人、空间柔性机器人敏捷机动控制。主持或参与项目如下：

  1. 国家自然科学基金青年基金项目：单轨双轮机器人的主动漂移控制方法研究，项目负责人，2023-2025

  2. QY实验室创新基金项目：XXXXX控制器研究，项目负责人，2023-2025

  3. 某部委重点课题分承研项目：XXXXX建模与解析，项目负责人，2023-2025

  4. JCJQ计划技术领域基金项目：XXXXXX多模态关节驱动器研究，项目主要参与人，2022-2024

  5. 某部委重点项目：XXXX机器人研究，项目主要参与人，2020-2022

  学术成果

  [1] Y. Deng, E. Moulay, V. Léchappé, Z. Chen, B. Liang, and F. Plestan, Robust Nonsingular
  Predefined-Time Terminal Sliding Mode Control for Perturbed Chains of Integrators,
  IEEE Transactions on Automatic Control, Volume: 69, Issue: 12, Dec 2024, Pages:
  8946 - 8953, DOI: 10.1109/TAC.2024.3426554.

  [2] Y. Deng, V. Léchappé, E. Moulay, Z. Chen, B. Liang, F. Plestan, and Q.-L. Han,
  Predictor-Based Control of Time-Delay Systems: A Survey, International Journal of
  Systems Science, Volume: 53, Issue: 12, Apr 2022, Pages: 2496 - 2534, DOI: 10.1080/00207721.2022.2056654.

  [3] Y. Deng, V. Léchappé, C. Zhang, E. Moulay, D. Du, F. Plestan, and Q.-L. Han,
  Designing Discrete Predictor-Based Controllers for Networked Control Systems With
  Time-varying Delays: Application to A Visual Servo Inverted Pendulum System, IEEE/CAA
  Journal of Automatica Sinica, Volume: 9, Issue: 10, Sep 2021, Pages: 1763 - 1777,
  DOI: 10.1109/JAS.2021.1004249.

  [4] Y. Deng, V. Léchappé, E. Moulay, and F. Plestan, Predictor-Based Control of
