  1995年9月-1997年12月 哈尔滨工业大学航天工程与力学系空间飞行器设计专业学习，获工学硕士学位

  1998年3月-2001年3月 哈尔滨工业大学机器人研究所机械电子工程专业学习，获工学博士学位

