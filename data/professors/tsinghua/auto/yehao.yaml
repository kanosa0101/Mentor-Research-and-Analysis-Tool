bio_raw: '教育背景

  1987年9月-1992年7月 清华大学自动化系学习，获学士学位

  1992年9月-1996年7月 清华大学自动化系学习，获工学博士学位

  工作履历

  1996年7月-1998年7月 清华大学自动化系，讲师

  1998年7月-2007年12月 清华大学自动化系，副教授

  2007年12月-至今 清华大学自动化系，教授

  学术兼职

  中国自动化学会技术过程的故障诊断与安全性专业委员会 副主任

  中国自动化学会过程控制专业委员会 委员

  研究领域

  复杂动态系统故障诊断、建模与控制（以流程工业和轨道交通等行业为应用背景，研究基于模型、数据和机器学习的复杂动态系统建模、故障诊断、及优化控制）

  研究概况

  [1]新型高效能城市轨道交通系统建模与综合智能优化，国家高速列车青岛技术创新中心横向项目，参加，2020.3- 2023.3

  [2] 基于工业互联网平台的流程行业生产线数字孪生系统，工信部项目，参加，2019.1-2021.12

  [3] 基于混合增强智能的大型高炉故障诊断与自愈控制基础理论与关键技术， 国家自然科学基金重点项目，参加，2020.1-2024.12

  [4] 高速列车自动驾驶关键技术，北京全路通通信信号研究设计院有限公司横向项目， 2018.7-2020.6，负责人

  [5] 大型高炉非正常工况诊断与安全运行方法及实现技术，国家自然科学基金重大项目课题，负责人，2013.1~2017.12

  [6] 复杂条件下的网络化控制系统故障检测技术，国家自然科学基金面上项目，负责人，2010.1~2012.12

  [7] 基于混沌理论的故障检测方法研究，国家自然科学基金面上项目，负责人，2006.1~2008.12

  [8] 网络环境下的基于鲁棒观测器的故障诊断方法研究，国家自然科学基金面上项目，负责人，2003.1~2005.12

  [9] 基于信息融合的输气管道远程实时泄漏监测技术，国家863计划，负责人，2006.12~2008.12

  [10] 流程工业典型设备的故障诊断与预测维护系统，国家863计划，负责人，2002.9~2004.8

  [11] 基于数据的软测量方法的研究，国家863计划，负责人，1999.3~2000.12

  [12] 复杂系统控制与信息处理中的若干关键问题研究与应用，参加，国家自然科学基金创新群体，2008.1~2013.12

  奖励与荣誉

  [1] 2012年获国家自然科学奖二等奖(第二完成人)

  [2] 1994年获第7届全国过程控制会议首届张钟俊优秀论文奖一等奖（第一获奖人）

  学术成果

