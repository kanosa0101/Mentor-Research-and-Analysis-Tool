research_direction_raw: 1. 虚拟装配及其相关技术研究 包括面向装配的设计（DFA），装配工艺规划与仿真，基于信息物理融合的数字化柔性装配等
  2. 虚拟现实（VR）环境下的产品研发及其相关技术研究 包括基于半实物仿真的汽车虚拟驾驶、起重机虚拟驾驶，基于VR的汽车配置设计，基于GIS和VR的可视化仿真等
  3. 产品研发信息化及其关键技术研究 包括基于PDM/PLM的CAD/CAPP/CAM/CAE集成，基于ASP的网络化异地协同设计与系统集成等 研究概况 [1]
  “基于虚拟现实的汽车设计展示系统研究开发”，国家科技支撑计划项目子课题（编号2012BAH32F03-1），2012.01～2014.12
