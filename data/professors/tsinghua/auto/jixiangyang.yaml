  [2]. Zhigang Li, Xiangyang Ji, “ Pose-guided Auto-Encoder and Feature-Based Refinement
  for 6-DoF Object Pose Regression ”,  International Conference on Robotics and Automation
  (ICRA), 2020.

  [3]. Jianzhun Shao, Yuhang Jiang, Gu Wang, Zhigang Li, Xiangyang Ji, “ PFRL: Pose-Free
  Reinforcement Learning for 6D Pose Estimation”, IEEE Conference on Computer Vision
