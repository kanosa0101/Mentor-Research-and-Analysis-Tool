bio_raw: '教育背景

  1999年、2001年 分别获哈尔滨工业大学工学学士、硕士学位

  2008年 中科院计算技术研究所工学博士学位

  工作履历

  2008年6月至2010年2月 清华大学自动化系 博士后

  2010年3月至2011年11月 清华大学自动化系 讲师

  2012年12月至2014年11月 清华大学自动化系 副教授

  2013年12月至2014年12月 普林斯顿大学 访问学者

  2014年12月至今 清华大学自动化系 教授

  学术兼职

  中国人工智能学会深度学习专委会主任

  中国电子学会青年工作委员会主任

  Journal of Computer Science and Technology青年编委

  IEEE Transactions on Cybernetics编委

  研究领域

  机器学习

  视觉信息获取与处理

  研究概况

  视频编码，国家杰出青年科学基金项目，2014年1月至2017年12月

  编码摄像理论与方法研究，国家自然科学基金重点国际合作研究项目，2017年1月至2021年12月

  大数据驱动的类人智能感知与情感交互关键技术，国家重点研发计划项目，2017年10月至2021年9月

  视觉目标自主学习技术研究与应用验证，北京市科学技术委员会项目，2018年1月至2019年12月

  散射场景编码摄像仪器，国家基金委项目，2019年1月-2023年12月

  奖励与荣誉

  2019年 国家科学技术进步奖二等奖，排名第1

  2018年 中国电子学会科学技术奖（技术发明类）一等奖，排名第1

  2016年 第二批国家“万人计划”领军人才

  2014年 中国青年科技奖

  2014年 中国青年科技创新领军人才

  2013年 国家杰出青年科学基金

  2013年 IEEE Outstanding Contributions IEEE Std 1875TM

  2012年 国家技术发明一等奖，排名第2

  2010年 国家科学技术进步二等奖，排名第2

  2009年 中国计算机学会优秀博士学位论文

  2009年 清华大学优秀博士后

  2009年 中科院优秀博士论文

  学术成果

  发表论文：

  [1]. Yan Di, Henrique Morimitsu, Zhiqiang Lou, Xiangyang Ji “ A Unified Framework
  for Piecewise Semantic Reconstruction in Dynamic Scenes via Exploiting Superpixel
