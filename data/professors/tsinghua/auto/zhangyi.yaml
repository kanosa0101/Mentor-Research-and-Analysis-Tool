bio_raw: '教育背景

  1986年 清华大学自动化系获工学学士学位

  1988年 清华大学自动化系获工学硕士学位

  1995年 英国Strathclyde大学获博士学位

  工作履历

  1989年3月至今 清华大学自动化系

  学术兼职

  教育部交通运输与工程学科教学指导委员会交通工程教学指导分委员会委员

  中国智能交通协会常务理事

  中国人工智能学会常务理事、智能交通专委会主任委员

  中国公路学会自动驾驶工作委员会副主任委员

  研究领域

  [1] 智能交通

  智能交通群体协同决策与智能控制、智能与自动驾驶技术、智能车路协同关键技术与应用、智能交通控制与管理，交通大数据融合与应用、智能交通系统集成技术与应用等。

  [2] 系统工程

  群决策与群控制、智能交通系统工程、智能网联环境下数据可信交互技术、智慧城市研究与实践、公共大数据技术与应用等。

  [3] 智能系统

  智能系统与决策、智能系统复杂性分析、智能系统与技术测试验证、智能性测评理论与方法等。

  研究概况

  [1] 提出了城市区域交通状态分析的概念并研究形成了体系化理论与方法；

  [2] 提出和建立了我国智能车路协同技术体系，并在此基础上提出了智能具体群体协同决策与智能控制理论与方法；

  [3] 提出和构建了基于车路协同的全新的自动驾驶技术体系与平台；

  [4] 提出了一般智能系统与技术测试验证与评估的机制、技术与规范，形成了智能系统与技术智能性测评体系化理论与方法。

  主持或重点承担国家和部委各类项目20余项。主要包括：

  [1] 清华大学自动化系—上海清鹤科技股份有限公司联合研究中心项目“视频多场景融合技术研究与应用”，2020-2023

  [2] 国家十三五重点研发计划重点专项“综合交通运输与智能交通”的项目“车路协同环境下车辆群体智能控制与测试验证”，2019-2021

  [3] 国家重点基础研究发展计划（973计划）项目“大城市综合交通系统的基础理论与实证研究”的课题“综合交通系统信息感知集成与多式协同出行诱导”，2012-2016

  [4] 国家重点基础研究发展计划（973计划）项目“大城市交通拥堵瓶颈的基础科学问题研究”的课题“城市交通信息融合集成与计算实验”，2006-2010

  [5] 国家“863计划”主题项目“交通状态感知与信息交互关键技术”的课题“面向出行者视角的多维交通状态感知”，2012-2014

  [6] 北京市科技计划项目“绿色校园微循环电动车示范”，2015-2017

  [7] 国家自然科学基金创新团队项目“复杂系统控制与信息处理中的若干关键问题研究与应用”，2007-2013

  [8] 国家自然科学基金重点项目“数据驱动的控制理论及其在大型复杂系统中的应用”，2009-2012

  [9] 国家自然科学基金面上项目“城市道路交通系统复杂性分析方法研究”，2008-2010

  [10] 国家自然科学基金面上项目“基于数据挖掘的网络交通状态分析方法研究”，2004-2006

  [11] 科技部“十五”攻关项目：智能交通系统基础信息采集与融合技术研究，2006-2008

  [12] 交通部跨世纪优秀人才支持项目：智能交通系统的信息组织与协作机制研究，2000-2001

  [13] 重大横向项目“兰州市智能交通管理指挥中心系统设计与集成”，2002-2005

  奖励与荣誉

  享受国务院政府特殊津贴，国家“863计划”先进交通技术领域专家。中国人工智能学会会士。

  1999年入选教育部骨干教师资助计划，2001年入选交通部跨世纪优秀人才，2005年入选科技部“全国智能交通系统专家咨询委员会”委员。

  2023年获教育部科技进步二等奖、日内瓦国际发明展银奖和中国智能交通协会科学技术二等奖，2018年获公安部科学技术一等奖，2017年获中国智能交通协会科学技术一等奖，，2016年教育部自然科学二等奖，2012年获中国智能交通协会科学技术二等奖。

  2023年获教育部国家级教学成果一等奖，2014年获教育部国家级教学成果二等奖，2013年获北京市教学成果一等奖；2004年、2008年、2012年和2014年分别获清华大学教学成果一等奖。

  2007 年获“中国石油和化学工业协会优秀教材”一等奖，并入选教育部面向21世纪课程教材；该教材（第三版）2013年入选北京市高等教育精品教材，2015年入选教育部“十二五”普通高等教育本科国家级规划教材。

