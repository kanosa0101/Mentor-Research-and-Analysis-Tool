bio_raw: '教育背景

  2013年9月-2019年7月 清华大学，航天航空学院，获工学博士学位

  2009年9月-2013年7月 北京航空航天大学，机械工程及自动化学院，获工学学士学位

  工作履历

  2022年1月-至今 清华大学自动化系，助理研究员

  2019年9月-2021年11月 清华大学自动化系，博士后

  研究领域

  生物医学工程、计算成像

  研究概况

  主要从事数字自适应光学眼底成像仪器研究以及在神经退行疾病早期诊断中的应用。视网膜是中枢神经系统的外延，细胞级分辨率眼底成像对脑疾病早期诊断具有重要意义。

  学术成果

  1. Yuduo Guo#, Yuhan Hao#, Sen Wan#, Hao Zhang, Laiyu Zhu, Yi Zhang, Jiamin Wu,
  Qionghai Dai*, Lu Fang*. Direct Observation of Atmospheric Turbulence with a Video-rate
  Wide-field Wavefront Sensor. Nature Photonics, 2024, 18(9): 935-943.

  2. Yi Sun#, Sen Wan#, Yuduo Guo#, Jiamin Wu*, Qionghai Dai*. Advanced Large Kernel
  Hybrid Attention Approach for Enhanced Light Field Image Super-Resolution. Optica
  Imaging Congress, 2024. (Oral)

  3. Feng Bao#, Yue Deng#, Sen Wan, Susan Q. Shen, Bo Wang, Qionghai Dai*, Steven
  J. Altschuler*, Lani F. Wu*. Integrative spatial analysis of cell morphologies and
  transcriptional states with MUSE. Nature Biotechnology, 2022, 40(8): 1200-1209.

  4. Sen Wan#, Yimin Hou, Feng Bao, Zhiquan Ren, Yunfeng Dong, Qionghai Dai, Yue Deng*.
  Human-in-the-Loop Low-Shot Learning. IEEE Transactions on Neural Networks and Learning
  Systems, 2021, 32(7): 3287-3292.

  5. Sen Wan#, Changqing Jiang, Jianqi Ding, Luming Li*. Evaluation of local B1 field
  as dosimeter of RF heating for implant in MRI. Electronics Letters, 2019, 55(6):
  302-303'
