bio_raw: '教育背景

  1996年9月-2000年7月 北京邮电大学电信工程学院 学士

  2000年9月-2006年12月 北京邮电大学电信工程学院 博士

  工作履历

  2007.1-2007.10 香港理工大学计算机系 研究助理

  2008.1-2009.10 美国密西根州立大学计算机系 博士后

  2009.12-2012.11 清华大学自动化系 讲师

  2012.12-2018.11 清华大学自动化系 副教授

  2018.12起 清华大学自动化系 副教授（长聘）

  学术兼职

  《Image and Vision Computing》编委

  中国生物特征识别会议（CCBR 2015-2019）程序委员会主席

  国际会议（IJCB 2014, ICB 2015-2016, BTAS 2016）领域主席

  中国人工智能学会模式识别专委会、中国计算机学会计算机视觉专委会委员

  研究领域

  指纹识别、计算机视觉、医学图像分析

  研究概况

  一、在研项目

  [1] 国家自然科学基金优秀青年基金，“生物特征识别”，2017.1-2019.12，负责人

  [2] 国家重点研发计划子课题，“场景视觉感知中的相机网络标定及多目标跟踪关键技术”，2016.7-2020.6，子课题负责人

  二、结题项目

  [1] 国家自然科学基金青年基金，“高分辨率掌纹识别的关键问题研究”，2010.1-2012.12，负责人

  [2] 国家自然科学基金面上项目，“现场掌纹的自动特征提取与匹配”，2014.1-2017.12，负责人

  奖励与荣誉

  一、科研奖励及荣誉

  [1] 2018年获国家技术发明二等奖（排名第2）

  [2] 2016年获国家自然科学基金优秀青年基金

  [3] 2015年获教育部自然科学二等奖（排名第1）

  [4] 2011年获中国电子学会电子信息科学技术奖一等奖（排名第3）

  [5] 2011年获教育部自然科学二等奖（排名第2）

  二、论文奖励

  [1] 2017年获国际生物特征识别联合会议（IJCB）最佳学生论文提名奖（排名第2）

  [2] 2012年获ICIEA最佳论文奖（排名第2）

  [3] 2011年获国际生物特征识别联合会议（IJCB）最佳学生论文奖（排名第2）

  [4] 2010年获SIBGRAPI最佳学生论文奖（排名第3）

