bio_raw: '教育背景

  2016年9月至2020年6月在天津大学电气自动化与信息工程学院信息与通信工程专业学习，获工学博士学位

  2013年9月至2016年6月在天津大学电子信息工程学院信息与通信工程专业学习，获工学硕士学位

  2009年9月至2013年6月在天津大学求是学部通信工程专业学习，获工学学士学位

  学术兼职

  中国计算机学会 (CCF) 多媒体技术专委会执行委员

  中国自动化学会 (CAA) 模式识别与机器智能专委会执行委员

  国际期刊Journal of Visual Communication and Image Representation (JVCI) 特刊首席客座编辑

  工作履历

  2022年11月至2024年1月 北京科技大学计算机与通信工程学院 副教授

  2020年7月至2022年10月 清华大学自动化系 助理研究员

  研究领域

  计算机视觉、模式识别

  研究概况

  国家自然科学基金青年项目，结构化文本引导的三维人体动作生成方法研究，2024.1-2026.12，主持

  博士后创新人才支持计划项目，面向服务机器人的人体动作理解，2021.5-2022.10，主持

  奖励与荣誉

  北京科技大学2022-2023学年本科生“优秀导师”，2023

  学术成果

  论文：

