bio_raw: '工作履历

  1995年——至今，清华大学自动化系任教

  研究领域

  电子电路系统的可靠性设计与故障诊断

  奖励与荣誉

  国家级（万人计划）教学名师；教育部“电子技术基础”虚拟教研室负责人。主持国家级精品课/国家级精品在线开放课/国家级精品资源共享课程“电子技术基础”；国家级一流课程“数字电子技术基础”（线上，线下）负责人。还曾获得国家级教材建设奖，国家级教学成果二等奖；北京市教学成果一等奖；北京市教书育人榜样，宝钢优秀教师奖，霍英东高等院校青年教师奖等。

  首届清华大学新百年教学成就奖的获得者，首批清华大学标杆课负责人等。多次获得清华大学教学成果一等奖，清华大学年度教学优秀奖，清华大学先进工作者，清华大学优秀共产党员等奖励荣誉。'
