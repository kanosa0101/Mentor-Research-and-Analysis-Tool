  研究领域

  智能控制

  生物感知信息机制解析与编解码模型

  基于生物感知机制的新型类脑算法

  心梗的智能辅助诊断

  研究概况

  致力于脑科学与脑机接口、面向深度学习的心梗智能辅助诊断。研究基于植入式脑机接口技术的生物感知机制以及解决大场景下小目标识别问题的新型类脑算法，研究基于非植入式脑机接口技术的多元信息整合与决策的研究，研究大数据与生理模型相结合的心梗智能精准监护与诊断。

