bio_raw: '教育背景

  2011/08-2016/07，清华大学，工学博士

  2007/08-2011/07，清华大学，工学学士

  工作履历

  2025/02至今，清华大学自动化系，副研究员

  2021/02-2025/01，清华大学自动化系，助理研究员

  2018/01-2021/01，清华大学自动化系，博士后

  研究领域

  1. 众智科学：智能涌现的基础理论与方法；

  2. 数字经济与数据要素驱动的智能化应用；

  3. 竞合关系下的智能社会治理新范式。

  研究概况

  采用系统科学、计算社会科学、管理学相融合的跨学科视角，探索人、机器与数据在复杂社会系统中互动的深层规律，揭示智能社会运行的底层逻辑，同时致力于智能社会治理实践的交叉研究。

  本人的研究围绕三个核心方向展开：

  1. 众智科学：智能涌现的基础理论与方法

  聚焦大规模异质群体协作中的智能涌现机理，发展众智科学的新理论与新方法，为理解复杂动态环境下的集体决策与协同演化提供理论基础。

  2. 数字经济与数据要素驱动的智能化应用

  研究数字经济中的数据价值创造机制，探索数据要素如何赋能产业升级与社会运行智能化，推动高效、可信的智能决策技术发展。

  3. 竞合关系下的智能社会治理新范式

  设计多元主体协同机制，通过博弈与合作的动态平衡，探索环保、能源、医疗等关键领域的治理逻辑、模式与技术。

  学术成果

  主要科研项目：

  1. 基于生成式Agent的服务生态系统治理方法与计算实验研究，国自然面上项目，2025.01-2027.12，课题负责

  2. 基于不确定视角的数据要素价值实现机理与路径研究，国社科一般项目，2025.01-2026.12，课题负责

  3. 合作激励机制对自治行为的引导效果研究，国自然青年基金，2024.01-2026.12，项目负责

  4. 数据交易场景下分布式信用体系的机制设计研究，北京市自然青年科学基金，2024.01-2025.12，课题负责

  5. 公众自治能力的演化机理研究，北京市自然青年科学基金，2023.01-2024.12，项目负责

  6. 服务效能度量与计算理论，国家重点研发计划课题，2021.12-2024.11，项目负责

  7.

  基于人工智能的生态环境精准管控技术与系统研究，国家重点研发计划课题，2021.10-2024.09，参与（骨干）'
