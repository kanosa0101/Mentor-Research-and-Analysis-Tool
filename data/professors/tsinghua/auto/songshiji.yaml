bio_raw: '教育背景

  1993年3月至1996年5月 哈尔滨工业大学数学系，获博士学位

  1986年9月至1989年5月 哈尔滨工业大学数学系， 获硕士学位

  1982年9月至1986年7月 哈尔滨师范大学数学系，获学士学位

  工作履历

  2006年12月-至今 清华大学自动化系教授

  2000年11月-2006年11月 清华大学自动化系副研究员

  1998年10月-2000年11月 东南大学控制科学与工程，博士后

  1996年7月-1998年9月 中国海洋大学海洋环境科学与工程， 博士后

  1994年7月-1996年7月 哈尔滨工业大学，副教授

  1990年10月-1994年6月 哈尔滨工业大学，讲师

  1988年1月-1990年9月 哈尔滨工业大学，助教

  学术兼职

  中国指挥与控制学会无人系统专业委员会副主任委员

  中国仪器仪表学会嵌入式仪表及系统技术分委员会常务理事

  中国海洋学会理事、深海技术分委员会副理事长

  中国大洋协会大洋信息系统领域责任专家

  清华大学海洋工程研究院副院长

  IEEE Transactions on Systems, Man, and Cybernetics: Systems，AE

  Artificial Intelligence and Robotics Research，副主编

  曾任《中国科学-信息科学》编委、《自动化学报》编委

  研究领域

  1. 复杂生产制造过程优化调度

  2. 供需链库存管理及协同配送技术

  3. 机器学习、强化学习理论方法与应用

  4. 水下机器人关键技术

  研究概况

  1. 复杂制造环境下的协同控制与决策理论方法，科技部“科技创新2030-新一代人工智能”基础前沿重大项目，2019年12月至2022年12月

  2. 基于多专业协同的高铁运行智能优化调度理论与在线策略调整学习方法，国家自然科学基金钢铁联合基金重点项目，2020年01月至2024年12月

  3. 钢铁生产线的多工序实时智能优化调度理论、方法及应用，国家自然科学基金钢铁联合重点项目，2017年01月至2020年12月

  4. 深海可控式可视采样器关键技术研究与样机研制，国家自然科学基金重大科研仪器研制项目，2015年01月至2019年12月

  5. 国际海域资源调查数据三维可视化技术及其应用示范，自然资源部中国大洋协会项目，2011年06月至2015年09月

  6. 大洋信息系统研究与建设，自然资源部中国大洋协会项目，2007年12月至2010年12月

  7. 大洋综合资源调查船和载人潜水器支持母船立项论证研究，自然资源部中国大洋协会项目，2011年05月至2012年06月

  奖励与荣誉

  1. 分布式协同控制及优化理论方法，2021年中国自动化学会自然科学一等奖

  2. 复杂环境下非线性脉冲系统的稳定性与控制，山东省自然科学二等奖

  3. 不确定非线性系统建模理论与智能学习方法，2018年中国人工智能学会自然科学一等奖

  4. 不连续系统的渐近行为与镇定性研究，2017年教育部高等学校自然类二等奖

  5. 企业信息化系统与工程交叉学科建设，2016年中国自动化学会教学成果一等奖

  6. 复杂动态系统及非线性系统的分析与鲁棒控制，2006年江苏省自然科学一等奖

  7. 2009年英国皇家工程院杰出访问会士奖

  学术成果

  在主要研究领域内，发表国内外重要学术期刊与会议SCI和EI检索学术论文300余篇。

