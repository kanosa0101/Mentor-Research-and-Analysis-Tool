bio_raw: '教育背景

  2013年8月-2019年1月 清华大学自动化系，控制科学与工程，获工学博士学位

  2009年8月-2013年7月 清华大学自动化系，自动化，获工学学士学位

  工作履历

  2021年4月至今 清华大学自动化系，助理教授

  2019年1月-2021年4月 清华大学自动化系，博士后

  学术兼职

  2021年6月至今 Light: Advanced Manufacturing期刊编委

  IEEE TCSVT、IEEE Transactions on Multimedia、Optics Letters、Optics Express等期刊审稿人

  研究领域

  计算成像

  人工智能

  生物医学工程

  研究概况

  国家自然科学基金委面上项目，62071271，基于光场显微镜的活体超分辨计算成像技术，2021/01-2024/12，54万元，在研，主持。

  中国博士后科学基金会，博士后创新人才支持计划，BX20190173，三维超分辨计算光场显微成像，2019/01-2020/12，60万元，已结题，主持。

  国家自然科学基金委基础科学中心，62088102，认知计算，2021/01-2025/12，1600/6000万元，在研，核心骨干。

  科技部科技创新2030—“新一代人工智能”重大项目，2020AAA0105500，脑记忆环路映射的机器智能，2021/01-2023/12，466万元，在研，核心骨干。

  国家自然科学基金委国家重大科研仪器设备研制专项，61327902，多维多尺度高分辨率计算摄像仪器，2014/01-2018/12，8000万元，已结题，核心骨干。

  奖励与荣誉

  清华大学优秀博士后，2021

  清华大学优秀招生教师，2019

  北京市普通高等学校优秀毕业生，2019、2013

  博士研究生国家奖学金，2016

  清华之友-东方电气奖学金，2015

  爱国者优秀学生干部标兵奖学金，2014

  清华大学优秀学生干部标兵，2014

  清华大学招生工作“优秀招生志愿者”，2014

  清华大学博士研究生新生奖学金，2013

  清华大学优秀毕业生，2013

  清华大学优秀共产党员，2013

  清华大学综合优秀奖学金（排名第一），2010-2012

