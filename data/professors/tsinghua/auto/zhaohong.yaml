bio_raw: '教育背景

  1993年9月至1999年7月 清华大学自动化系 获自动化专业工学学士、控制理论及控制工程工学硕士学位

  1999年9月至2004年12月 美国马里兰大学电子及计算机工程系 获电子工程专业哲学博士

  工作履历

  2005年2月至2006年7月 美国马里兰大学电子及计算机工程系 博士后

  2006年8月至2012年6月 加拿大阿尔伯塔大学电子及计算机工程系 助理教授

  2012年7月至2016年2月 加拿大阿尔伯塔大学电子及计算机工程系 副教授

  2016年5月至今 清华大学自动化系 长聘副教授

  学术兼职

  IEEE信号处理协会会议理事会理事，2013-2014

  IEEE信号处理协会技术委员会第7和9区代表，2013-2015

  IEEE信号处理协会多媒体信号处理技术委员会委员 2011-2013

  IEEE信号处理协会信息取证与安全技术委员会委员 2010-2012

  IEEE Transactions on Information Forensics and Security编委 2013.3-2015.9

  IEEE Signal Processing Letters编委 2008.11-2012.10

  IEEE Signal Processing Magazine客座编委 2012.3

  Journal of Visual Communication and Image Representation编委 2009.7-2015.9

  2014年IEEE国际信息取证及安全研讨会大会主席

  2012年IEEE国际多媒体信号处理研讨会技术委员会主席

  2015年IEEE全球信号及信息处理大会财务主席

  2013年IEEE国际多媒体及展览大会财务主席

  2010年及2014年IEEE国际图像处理大会领域主席

  IEEE TSP、TIP、TIFS、TMM、TCSVT、TWC等国际期刊及IEEE ICASSP、ICIP、ICME、ICC、MMSP、WIFS等国际会议审稿人

  研究领域

  媒体社交网络，信息安全与取证，多媒体信号处理，数字信号处理与通信

  研究概况

  互联网交易中的用户行为及增信研究，清华信息科学与技术国家实验室青年创新基金，2017.1-2018.12，负责人

  加拿大阿尔伯塔大学任职期间，主持并参与了七项国家级及省级重大课题

  奖励与荣誉

  IEEE信号处理协会青年作者最佳论文奖，2008

  学术成果

  1. H. V. Zhao, W. S. Lin and K. J. R. Liu, Behavior Dynamics in Media-Sharing Social
  Networks, Cambridge University Press, 2011

  2. K. J. R. Liu, W. Trappe, Z. J. Wang, M. Wu, and H. Zhao, Multimedia Fingerprinting
  Forensics for Traitor Tracing, EURASIP book series of signal processing and communications,
  Hindawi Publishing Corporation, 2005

  3. 范玉顺, 罗海滨, 林慧萍, 赵虹, 《工作流管理技术基础》，清华大学出版社, 2001

