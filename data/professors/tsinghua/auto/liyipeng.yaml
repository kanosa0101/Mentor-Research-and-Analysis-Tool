title: 副研究员
email: liep@tsinghua.edu.cn
bio_raw: '教育背景

  1999年9月至2003年6月 在哈尔滨工业大学电子工程系学习，获工学学士学位

  2003年9月至2005年6月 在哈尔滨工业大学电子工程系学习，获工学硕士学位

  2005年9月至2010年12月 在清华大学电子工程系学习，获工学博士学位

  工作履历

  2011年1月至2015年8月 清华大学自动化系 博士后

  2015年9月至今 清华大学自动化系 助理研究员

  研究领域

  [1] 计算机视觉

  多传感器自主定位，三维重建

  [2] 无人机智能视觉导航

  多传感器融合，自主路径规划

  [3] 网络复杂性研究

  网络数据分析，用户共享行为分析

  研究概况

  [1] P2P 网络用户兴趣偏好与互联网整体性能的关联及对策，自然科学基金面上项目，2013年1月至2016年12月

  奖励与荣誉

  2013年获得国际空中机器人大赛冠军

  学术成果

  1. Li Yipeng, Ren Yong, Yuan Jian, Shan Xiuming. File-sharing preference in a peer-to-peer
  network. IEEE Circuits and Systems Magazine, 2011, 11(1): 43-51.

  2. Yue Deng, Yipeng Li, Yanjun Qian, Xiangyang Ji, and Qionghai Dai. Visual Words
  Assignment Via Information-Theoretic Manifold Embedding. IEEE Transactions on Cybernetics,
  2014, 99: 1-13.

  3. 李一鹏, 任勇, 袁坚, 王钺, 黄小红, 山秀明. 对等网络应用中的网络统计特征分析. 物理学报, 2011, 60(5): 058901.

  4. He Nengqiang, Zhang Xuedan, Li Yipeng, Li Zhu, Ren Yong. Joint Video Adaptation
  and Erasure Code for Video Broadcast in Wireless Networks. Science China: Information
  Sciences, 2012: 1-15.

  5. Cai Luo, Xiu Li, Yipeng Li, and Qionghai Dai. Biomimetic Design for Unmanned
  Aerial Vehicle Safe Landing in Hazardous Terrain. IEEE Transactions on Mechatronics,
  2015, 99: 1-11.

  6. 王景欣, 王钺, 李一鹏, 袁坚, 山秀明, 冯振明, 任勇. 基于资源流行度的对等网络统计特征分析, 物理学报, 2011, 60(11): 118901:1-9.'
