bio_raw: '教育背景

  2004年9月-2010年6月 中国科学院研究生院，信息科学与工程学院，获工学博士学位

  2000年9月-2004年06月 山东大学，计算机科学与技术学院，获工学学士学位

  工作履历

  2010年7月-2012年6月 清华大学自动化系，博士后

  2012年6月-2016年12月 清华大学自动化系， 讲师

  2016年12月-2020.12 清华大学自动化系，准聘副教授

  2021年1月至今 清华大学自动化系，长聘副教授

  学术兼职

  2024—，SPIE/COS Photonics Asia conference on Optoelectronic Imaging and Multimedia
  Technology XI，会议主席

  2025—，IEEE Trans. Image Processing，编委

  2020—，IEEE Trans. Computational Imaging，编委

  2016-2024，the Journal of Optics Society of America A, 编委

  研究领域

  1.计算摄像学

  2.计算机视觉与模式识别

  3.AI for Science

  研究概况

  科技部重点研发计划，“复杂不确定条件下无人集群系统态势感知和认知”，2020.10-2023.09

  北京市自然科学基金重点研究专项，“活细胞弱光智能成像新技术研发及其在细胞应激中的应用”，2020.10-2024.09

  国家自然科学基金重点项目，“面向前端融合的编码摄像理论与方法”，

  2020.01-2024.12

  国家自然科学基金优秀青年科学基金，“计算摄像”，2018.01-2020.12

  国家自然科学基金重点项目，“大规模真三维视频获取与集成成像显示关键理论与技术”, 2017.01-2021.12

  国家自然科学基金国家重大科研仪器设备研制专项，“高速光谱视频计算摄像仪器—单曝光超光谱压缩采集子课题”, 2017.01-2021.12

  国家自然科学基金国家重大科研仪器设备研制专项，“多维多尺度高分辨率计算摄像仪器—多光谱重光照子课题”，2015.01-2019.12

  国家自然科学基金面上项目, “计算摄像学中大深度范围场景抖动模糊研究”，2012.1-2015.12

  奖励及荣誉

  2023年，高速高分辨计算摄像关键技术及应用，中国图象图形学学会技术发明一等奖，排名第1

  2019年，光谱视频计算摄像技术及装置，中国电子学会技术发明一等奖，排名第2

  2016年，新一代立体视觉关键技术及产业化，国家科技进步二等奖，排名第3

  2015年，立体视觉感知、建模关键技术及应用，中国电子学会科学技术一等奖，排名第2

