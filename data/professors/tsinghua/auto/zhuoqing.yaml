bio_raw: '教育背景

  1988年9月-1993年6月 清华大学自动化系自动控制专业学习，获学士学位

  1993年9月-1997年12月 清华大学自动化系模式识别与智能信息处理专业学习，获博士学位

  工作履历

  1997年12月-至今 清华大学自动化系 教师

  研究领域

  [1]模式识别与智能信息处理

  1、人体生物特征识别技术 基于人体各种的生物特征（指纹，掌形，人脸，声音..) 等经过信息处理与特征提取，结合融合识别算法对于人身份进行确认与鉴别。

  2、对于医学图像中的病理分类与识别系统；

  3、测谎技术的研究；

  4、脑机接口技术；

  5、基于网络信息搜集与分类技术。

  [2]嵌入式计算机系统与DSP信息处理系统

  1、应用于工业、医疗、家庭中各种嵌入式计算机系统设计。已有丰富的设计方案应用于各行各业中。

  2、基于DSP信息处理技术。解决工业、军事中，先进控制与密集型科学计算问题。

  [3]工业电力电子技术

  结合嵌入式计算机技术和DSP技术，解决在工业电力电子行业中控制系统。

  学术成果

  开设课程

  人工神经网络, 研究生

  Linux/Unix 系统基础, 本科生

  信号与系统, 本科生'
