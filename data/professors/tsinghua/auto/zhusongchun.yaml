bio_raw: '教育背景

  1986-1991年，中国科学技术大学，计算机专业，学士学位

  1992-1996年，美国哈佛大学，计算机专业，硕士、博士学位

  1996-1997年，美国布朗大学，应用数学专业，博士后

  工作履历

  1997-1998年，美国斯坦福大学，计算机系人工智能实验室，讲师

  1998-2002年，美国俄亥俄州立大学，计算机系与认知科学中心，助理教授

  2002-2006年，美国洛杉矶加州大学，统计系与计算机系，副教授

  2006-2020年，美国洛杉矶加州大学，统计系与计算机系，正教授

  2020年11月至今，清华大学基础科学讲席教授，北京大学讲席教授

  2020年11月至今，北京通用人工智能研究院院长

  2021年2月至今，清华大学通用人工智能研究院（筹）院长

  学术兼职

  2010-2020年，连任两届美国视觉、认知科学、AI领域跨学科合作项目MURI首席科学家(Principal Investigator)

  2012和2019年，两度担任国际计算机视觉与模式识别大会(CVPR)主席

  2013年，中国科学院海外顾问

  2011-2013年，担任国际模式识别协会Aggarwal奖评选委员会主席

  2012年，担任IEEE计算机学会会士(fellow)评选委员会副主席

  研究领域

  计算机视觉，统计建模与计算， 认知与常识推理，语言理解与对话，自主机器人，通用人工智能 等

  研究概况

  1. 视觉的统计建模与计算理论：为马尔的视觉理论建立统一的数理模型

  2. 实现图像与场景的解译(Parsing)计算框架：扩展了模式识别创始人傅京孙先生的句法模式识别理论

  3. 提出人工智能的“暗物质”：研究视觉与认知的物理与社会常识

  4. 探索迈向通用人工智能的新研究路径：“小数据、大任务”范式

  奖励与荣誉

  2019年，ACM TURC大会 最佳论文奖

  2017年，计算建模奖(Computational Modeling Prize)，国际认知科学学会(Cognitive Science Society)

  2013年，赫尔姆霍茨奖(Helmholtz Test-of-Time Award)，第14届国际计算机视觉大会

  2011年，电气和电子工程师学会(IEEE)计算机学会会士fellow

  2008年，第二届J.K.Aggarwal 奖，国际模式识别协会

  2007年，马尔奖荣誉提名，第11届国际计算机视觉大会

  2003年，马尔奖，第九届计算机视觉国际大会

  2001年，Sloan fellow，Sloan基金

  2001年，青年教授奖励基金(Career Award)，美国国家科学基金委员会

  2001年，杰出青年科学家奖(ONR Young Investigator Award)，美国海军研究所

  1999年，马尔奖(Marr Prize)荣誉提名，第7届国际计算机视觉大会

  1995年，哈佛大学工程领域 Ali Jury 奖

  1992年，哈佛大学研究生院奖学金

  学术成果

  在国际顶级期刊和会议上发表论文300余篇。

  编写计算机视觉、统计机器学习与推理、认知科学等领域相关学术著作（专业书籍）共四部：

  1. Adrian Barbu and SongChun Zhu, Monte Carlo Methods, Springer, 2020.

  2. SongChun Zhu and Yingnian Wu, Computer Vision: Statistical Models for Marr''s
  Paradigm, Springer, 2021.

  3. SongChun Zhu, Computer Vision: Stochastic Grammars for Parsing Objects, Scenes,
  and Events, Springer, 2021.

  4. SongChun Zhu and Yixin Zhu, Cognitive Models for Visual Commonsense Reasoning,
  Springer, 2021.

  人才培养

  2005年，创建民办非营利性国际交流平台湖北莲花山研究院。研究院为国内年轻学者和大量学生提供了一个学术氛围浓厚、具有国际科研水准的开放式学术合作与交流平台，为计算机视觉在中国的发展与人才启蒙做出了贡献。

  现常年在清华大学招收博士研究生和博士后'
