bio_raw: '教育背景

  1999年9月至2003年6月 在西安理工大学机械设计制造及其自动化专业学习，获工学学士学位

  2003年9月至2006年4月 在西安理工大学信号与信息处理专业学习，获工学硕士学位

  2007年8月至2011年2月 在新加坡南洋理工大学电气与电子工程专业学习，获工学博士学位

  工作履历

  2003年7月至2007年7月 西安理工大学信息科学系 助教

  2011年3月至2015年11月 美国伊利诺伊大学香槟分校新加坡高等研究院 研究科学家

  2015年11月至2021年7月 清华大学自动化系 准聘副教授

  2021年8月至2024年6月 清华大学自动化系 长聘副教授

  2024年6月至今 清华大学自动化系 长聘教授

  学术兼职

  IEEE Fellow，2023年至今

  IAPR Fellow，2020年至今

  AAIA Fellow，2022年至今

  npj Computer Vision主编，2026年至今

  Pattern Recognition Letters主编，2019年至今

  中国图像图形学会理事，2025年至今

  中国图像图形学会视觉认知与脑机接口专委会副主任委员，2025年至今

  中国仿真学会理事，2024年至今

  中国仿真学会视觉计算与仿真专委会主任委员，2024年至今

  中国自动化学会专家咨询工作委员会副主任委员，2024年至今

  研究领域

  1.机器视觉感知

  2.人工智能安全

  3.具身智能系统

  科研项目

  1. 国家自然科学基金专项重点项目，因果关联与常识引导的视频鉴伪大模型研究，2025.1-2026.12，主持

  2. 北京市科技计划中央引导地方专项，面向世界模型的新型网络结构与计算范式研究，2025.12-2026.12，主持

  3. 国家重点研发计划，3D显示专用驱动技术，2023.12-2026.11，主持

  4. 国家自然科学基金重点项目，数据与知识联合驱动的可通用视觉基础大模型研究，2024.1-2028.12，主持

  5. 北京市自然科学基金联合重点基金，大模型端侧性能提升关键技术，2024.10-2027.9，主持

  6. 北京市科技计划中央引导地方专项，多模态统一与多任务协同的通用视觉大模型技术研发，2023.9-2025.9，主持

  7. 国家杰出青年科学基金，视觉内容分析与识别，2022.1-2026.12，主持

  8. 国家自然科学基金联合重点基金，面向服务机器人的人体动作分析与识别，2019.1-2022.12，主持

  9. 国家自然科学基金优秀青年科学基金，视觉模式分析与识别，2019.1-2021.12，主持

  10. 国家重点研发计划课题，非神经网络结构的深度学习模型与方法，2018.5-2023.4，主持

  11. 国家自然科学基金面上项目，面向视觉目标识别的深度度量学习方法研究，2017.1-2020.12，主持

