bio_raw: '教育背景

  2016 – 2021 年，清华大学，控制科学与工程，博士学位

  2012 – 2016 年，清华大学，自动化，学士学位

  工作履历

  2026 年至今，清华大学自动化系，助理教授

  2025 – 2026 年，清华大学自动化系，助理研究员

  2024 – 2025 年，苏黎世联邦理工学院，高级研究员

  2021 – 2024 年，苏黎世联邦理工学院，博士后

  学术兼职

  1. IEC SC 8A WG 8 国际电工委员会新能源建模工作组，Secretary

  2. 河北清华发展研究院智慧能源控制技术创新中心，执行主任

  研究领域

  1. 智慧能源系统的数据驱动控制、优化与博弈

  2. 电力电子装备及新能源电力系统的稳定与控制

  3. 国际月球科研站能源系统的构建与调控

  研究概况

  1. 国家自然科学基金优秀青年科学基金项目（海外），新能源并网控制，项目负责人，2026-2029

  2. 国家自然科学基金面上项目，异构电力电子化电力系统的分散式稳定性研究，项目负责人，2027-2030

  3. 国家自然科学基金重点项目，极端环境下大容量风电机组智能运行控制技术研究，课题负责人，2027-2031

  4. 北京信息科学与技术国家研究中心青年创新基金，月球基地能源系统的分布式调控理论与技术，项目负责人，2026-2027

  5. 企业委托项目，储能变流器全工况构网关键技术研究开发，项目负责人，2025-2026

  6. 企业委托项目，风光储补一二次系统标准化模型建模方法及新型变流器控制技术研究，主要参与人，2025-2027

  7. 欧盟地平线项目，Advanced Grid Interfaces for innovative STorage Integration (AGISTIN)，任务负责人，2023-2026

  8. 欧盟地平线项目，POwering SYstem flexibiliTY in the Future through Renewable Energy Sources
  (POSYTYF)，任务负责人，2020-2024

  奖励及荣誉

  2025 年国家高层次青年人才

  2023 年中国电源学会科技进步一等奖（第 2 完成人）

  2024 年中国电工技术学会科技进步一等奖（第 7 完成人）

  2023 年中国电源学会优秀博士学位论文提名

  2021 年清华大学优秀博士学位论文

  2021 年北京市优秀毕业生

  2025 年 IEEE PowerTech 2025 Basil Papadias 最佳论文一等奖

  2023 年《高电压技术》优秀期刊论文

  2022 年 IEEE Transactions on Energy Conversion 最佳期刊论文

  2018 年 IEEE PEAC 优秀会议论文

  2017 年中国电源学会学术年会优秀论文

  学术成果

  详见

  https://xiuq-he.github.io/

  代表性论文：

  X. He, M. A. Desai, L. Huang and F. Dörfler, “Cross-Forming Control and Fault Current
  Limiting for Grid-Forming Inverters,” in IEEE Transactions on Power Electronics,
  vol. 40, no. 3, pp. 3980-4007, March 2025, doi: 10.1109/TPEL.2024.3500885.

  X. He, V. Häberle and F. Dörfler, “Complex-Frequency Synchronization of Converter-Based
  Power Systems,” in IEEE Transactions on Control of Network Systems, vol. 12, no.
  1, pp. 787-799, March 2025, doi: 10.1109/TCNS.2024.3420983.

  X. He, L. Huang, I. Subotić, V. Häberle and F. Dörfler, “Quantitative Stability
  Conditions for Grid-Forming Converters With Complex Droop Control,” in IEEE Transactions
  on Power Electronics, vol. 39, no. 9, pp. 10834-10852, Sept. 2024, doi: 10.1109/TPEL.2024.3404251.

  X. He, C. He, S. Pan, H. Geng and F. Liu, “Synchronization Instability of Inverter-Based
  Generation During Asymmetrical Grid Faults,” in IEEE Transactions on Power Systems,
  vol. 37, no. 2, pp. 1018-1031, March 2022, doi: 10.1109/TPWRS.2021.3098393.

  X. He, H. Geng, R. Li and B. C. Pal, “Transient Stability Analysis and Enhancement
  of Renewable Energy Conversion System During LVRT,” in IEEE Transactions on Sustainable
  Energy, vol. 11, no. 3, pp. 1612-1623, July 2020, doi: 10.1109/TSTE.2019.2932613.'
