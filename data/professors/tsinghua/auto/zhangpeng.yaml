bio_raw: '教育背景

  2010年9月-2014年6月, 同济大学自动化系, 获学士学位

  2014年9月-2020年8月, 清华大学自动化系, 获博士学位

  工作履历

  2024年9月-至今，清华大学北京市中医药交叉研究所，副所长

  2025年12月-至今, 清华大学自动化系, 副研究员

  2023年2月-2025年12月, 清华大学自动化系, 助理研究员

  2020年9月-2023年3月, 清华大学自动化系, 博士后

  学术兼职

  1. 中华中医药学会青年委员会 委员

  2. 世界中医药联合会网络药理学专业委员会 常务理事

  3. WJIM、Chinese Medicine等杂志编委/青年编委

  研究领域

  1. 中医药人工智能

  2. 网络药理学

  3. 医学大数据智能分析算法

  4. 胃癌等消化道肿瘤中西医智能防治

  研究概况

  研究方向为中医药人工智能、网络药理学与智能健康，长期从事基于中医药人工智能算法及其在胃癌中西医极早防治的应用研究，并担任清华大学“数字生物学与智能健康”因材施教计划导师。主持国自然青年科学基金（B类，原国家优青）等国家级项目/课题6项。

  [1] 国家自然科学基金委员会，青年科学基金（B类），2027-01至2029-12，主持；

  [2] 教育部，学科突破先导项目，中医药防治多系统共患疾病学科突破先导项目（课题），2025-09至2030-08，主持；

  [3] 国家中医药管理局，国家中医药多学科交叉创新团队项目，基于 AI 的胃炎癌转化中医药防治体系研究（课题），2025-06至2028-08，主持；

  [4] 北京市科学技术委员会/中关村科技园区管理委员会，北京市高层次创新创业人才支持计划科技新星计划，2026-06至2029-06，主持；

  [5] 国家自然科学基金委员会, 青年科学基金（C类）, 2024-01至2026-12,主持；

  [6] 国家中医药管理局，中医药原理解读计划，2023-12至2024-12，主持；

  [7] 人力资源与社会保障部，博士后创新人才计划，2021，主持；

  [8] 科技部国家重点研发计划，青年科学家项目，2023-11至2027-10，研究子课题负责人。

  [9] 清华大学，青年教师科研原创项目，2025-05至2026-05，项目负责人

  奖励及荣誉

  科技奖励：

  [1] 中华中医药学会科学技术奖一等奖（第2完成人, 2025）

  [2] 北京市科学技术奖科技进步一等奖（第8完成人, 2024）

  [3] 日内瓦国际发明展特别嘉许金奖（最高等级，第2完成人, 2024）

  [4] 日内瓦国际发明展金奖（第2完成人, 2024）

  [5] 中医药国际贡献奖一等奖（第4完成人, 2021）

  [6] 中医药十大学术进展（2024）

  [7] 中国生物信息学十大应用（2019）

  个人荣誉

  [1] 国家自然科学基金青年科学基金（B类）获得者

  [2] 北京科技新星

  [3] 清华大学水木学者

  [4] 清华大学紫冬学者

  [5] 国家博士后创新人才计划

  [6] 国家中医药管理局中药网络药理学高水平重点学科后备学术带头人

  北京市优秀毕业生、清华大学“一二九”辅导员奖等

  学术成果

  在网络靶标理论指引下，建立了病证宏观-中观-微观跨层次网络关系推断的系列高精度AI算法，率先发现胃癌极早期这一表征胃炎癌转化临界状态的全新分期及其中西医特征与生物标志物，破解胃癌发生预警难题，被Nature论文评为“显著性（notably）”发现；构建胃癌极早期中西医智能防治体系，在我国胃癌高发区以及全国80余家落地应用，显著提升了胃炎癌转化中西医防治水平。在Nature
  Methods, Cancer Discovery, Nature Communications, Cell Reports、STTT等国际高水平杂志发表论文20余篇，入选Lancet子刊封面论文、F1000杰出论文、ESI热点论文（全球top
  0.1%）。参编教材2部。授权中国发明专利3项（均转化）、日本发明专利1项。

