bio_raw: '教育背景

  1987年9月-1992年7月 清华大学 自动化系学习，获学士学位

  1992年9月-1994年7月 清华大学 核能技术研究院学习，获硕士学位

  2000年3月-2004年12月 清华大学 自动化系学习，获博士学位

  工作履历

  1994年8月-至今 清华大学自动化系 教师

  2002年9月-2003年3月 美国加州大学圣地亚哥分校（UCSD）访问学者

  学术兼职

  2001年11月-至今 在信息产业部家庭网络标准工作组担任专家

  2006年7月-至今 在北京电子学会教育专业委员会担任委员

  研究领域

  [1] 电子技术及应用

  可编程片上系统（PSoC）应用；基于FPGA的电子系统设计；集成电路设计

  [2] 三维声波测井研究

  三维声波测井信号采集与处理系统研究，三维声波测井成像技术研究

  [1] Electronic technology and Application

  Application of Programmable System on Chip (PSoC); electronic system design based
  on FPGA, integrated circuit design.

  [2] Research on 3D acoustic logging

  Research on signal acquisition and processing system and imaging technology of 3D
  acoustic logging.

  奖励与荣誉

  2024年 获得清华大学教材成就奖

  2023年 获得国家教学成果二等奖

  2023年 获得北京市高校优质教案奖

  2023年 获评国家线下一流本科课程

  2023年 获清华大学新百年教学成就奖

  2022年 获得北京市教育教学成果一等奖

  2022年 获得中国自动化学会高等教育教学成果一等奖

  2018至2022年连续获得清华大学年度教学优秀奖

  2021年 获评清华大学第四批标杆课程

  2021年 获得首届全国优秀教材一等奖

  2019年 获得首届北京市高校优质教材奖

  2021年 获得清华大学思政课程示范教师称号

  2019年 获得清华大学优秀SRT指导奖一等奖

  2016年 获得中国自动化学会高等教育教学成果二等奖

  2010年 获得清华大学教学成果一等奖

  2008年 获得清华大学优秀教材特等奖

  2008年 获得清华大学第十届实验技术成果一等奖

  2009年 获得Cypress Innovator Design Challenge First Place （由本人指导的本科生项目‘HandMagic--Wireless
  Input Device’）

  2008年 获得清华大学挑战杯竞赛三等奖（由本人指导的本科生项目‘HandMagic无线迷你输入终端’）

  2007年 获得清华大学挑战杯竞赛一等奖（由本人指导的本科生项目‘无线智能手写笔’）

  2007年 获得Cypress Innovator Design Challenge Third Place（由本人指导的本科生项目‘FreePen Intelligent
  Wireless Handwritten Pen’）

  2007年 获得北京市第五届青年教师教学基本功大赛理工A组二等奖

  2007年 获得清华大学第二届青年教师教学基本功大赛一等奖

