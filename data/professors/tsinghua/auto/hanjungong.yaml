bio_raw: '教育背景

  1995-1999

  西安电子科技大学 学士

  1999-2001

  西安电子科技大学 硕士

  2001-2004   西安电子科技大学 博士

  工作履历

  2003-2004 微软亚洲研究院   研究助理

  2004-2010 荷兰埃因霍温理工大学  研究员

  2010-2012 荷兰皇家科学院数学与计算机研究所  研究员

  2012-2015 荷兰Philips-Civolution   高级研究员

  2015-2017 英国兰卡斯特大学   高级讲师

  2017-2023 英国华威大学  副教授、荣誉教授

  2023-2024 英国谢菲尔德大学  讲席教授

  2024- 清华大学    教授

  学术兼职

  IEEE Transactions on Image Processing 副主编

  IEEE Transactions on Neural Networks and Learning Systems 副主编

  IEEE Transactions on Multimedia  副主编

  IEEE Transactions on Circuits and Systems for Video Technology 副主编

  Pattern Recognition 副主编

  研究领域

  脑启发的人工智能、计算机视觉、模式识别、机器学习

  研究概况

  韩军功及其团队在计算机视觉、机器学习和人工智能等领域作出了多项原创性贡献，已发表超过100篇IEEE/ACM Trans论文和80篇CCF A类会议论文，多次入选斯坦福大学全球前2%顶尖科学家榜单，Google
  Scholar总引用量超过2.9万次，一作单篇最高引超过2.1千次，H指数为81 （截至2025年6月）。现担任4本IEEE Transactions期刊的副主编，并拥有欧盟和美国专利各1项，3项技术已实现商业化，其中1项获得国际工业奖项。

  奖励与荣誉

  2024年 Member of the European Academy of Sciences and Arts

  2022年 Fellow of the International Association of Pattern Recognition (IAPR)

  2022年 Fellow of the Asia-Pacific Artificial Intelligence Association (AAIA)

  2017年 算法专利支撑的产品获美国艾美技术创新奖

  学术成果

  代表作：

  1. C. Chen, J. Han*, K. Debattista. Virtual Category Learning: A Semi-Supervised
  Learning Method for Dense Prediction with Extremely Limited Labels, IEEE transactions
  on pattern analysis and machine intelligence, 2024 August, 46(8).

  2. Y. Liu, D. Zhang, Q. Zhang*, J. Han*. Part-Object Relational Visual Saliency.
  IEEE Transactions on Pattern Analysis and Machine Intelligence, 2022 July, 44(7):
  3688-3704.

  3. T. Zhang, Q. Zhang*, K. Debattista, J. Han*, Cross-Modality Distillation for
  Multi-modal Tracking, IEEE Transactions on Pattern Analysis and Machine Intelligence,
  July, 2025

  4. Y. Liu, C. Li, S. Xu*, J. Han*, Part-Whole Relational Fusion Towards Multi-Modal
  Scene Understanding, International Journal of Computer Vision, 2025

  5. H. Duan, S. Shao, B, Zhai*, T. Shah, J. Han*, R. Ranjan, Parameter Efficient
  Fine-Tuning for Multi-modal Generative Vision Models with Möbius-Inspired Transformation,
  International Journal of Computer Vision, 2025

  6. J. Han, L. Shao, D. Xu, J. Shotton. Enhanced Computer Vision with Microsoft Kinect
  Sensor: A Review. IEEE transactions on cybernetics, 2013 Oct., 43 (5): 1318-1334.'
