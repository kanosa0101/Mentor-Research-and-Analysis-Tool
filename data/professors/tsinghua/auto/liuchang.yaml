bio_raw: '教育背景

  2015年9月-2022年1月 中国科学院大学，信号与信息处理专业，获工学博士学位

  2008年9月-2012年6月 吉林大学，数学与应用数学专业，获理学学士学位

  工作履历

  2025年2月-至今 清华大学自动化系，助理研究员

  2022年3月-2025年1月 清华大学自动化系，博士后

  研究领域

  计算机视觉、

  多模态学习

  、

  AI4Science

  研究概况

  研究主要集中于计算机视觉、多模态学习、AI4Science等领域，在IEEE TPAMI、TNNLS、TIP、TCSVT、PR等期刊，以及CVPR、ICCV、ECCV、AAAI、NeurIPS、ACM
  MM等国际会议发表学术论文七十余篇；已获国家专利授权5项，主持中国博士后科学基金面上项目和国家自然科学基金青年科学基金项目。

  学术成果

  1. C Liu, B Li, M Shi, X Chen, Q Ye, X Ji, Explicit Margin Equilibrium for Few-Shot
  Object Detection, IEEE TNNLS 2024.

  2. M Shi, C Liu, J Jiao, Q Ye, Self-supervised feature-gate coupling for dynamic
  network pruning, PR 2024.

  3. B Fang, W Wu, C Liu, et al, UATVR: Uncertainty-Adaptive Text-Video Retrieval[C],
  IEEE ICCV 2023.

  4. B Li, C Liu, et al. Proposal Distribution Calibration for Few-Shot Object Detection,
  IEEE TNNLS 2023.

  5. Y Zhang, C Liu, et al. Beyond Instance Discrimination: Relation-aware Contrastive
  Self-supervised Learning, IEEE TMM 2023.

  6. B. Fang, W Wu, C Liu, et al. Mamico: Macro-to-micro semantic correspondence for
  self-supervised video representation learning[C], ACM MM 2022.

  7. C Liu, Y Yao, et al. Self-Supervised Motion Perception for Spatiotemporal Representation
  Learning, IEEE TNNLS 2022.

  8. C Liu, Y Tian, et al. Adaptive linear span network for object skeleton detection,
  IEEE TIP 2021.

  9. L Yang, C Liu, et al. Hifacegan: Face renovation via collaborative suppression
  and replenishment[C], ACM MM 2020.

  10. Yuan Y, C Liu, et al. Video Playback Rate Perception for Self-supervised Spatio-Temporal
  Representation Learning[C], IEEE CVPR 2020.

  11. D Luo, C Liu, Y Zhou, et al. Video Cloze Procedure for Self-Supervised Spatio-Temporal
  Learning[C], AAAI 2020.

  12. C Liu, F Wan, W Ke, et al. Orthogonal Decomposition Network for Pixel-Wise Binary
  Classification[C], IEEE CVPR 2019.

  13. C Liu, W Ke, F Qin, et al. Linear Span Network for Object Skeleton Detection[C],
  ECCV 2018.'
