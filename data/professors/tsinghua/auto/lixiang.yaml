  人才培养

  承担课程：

  交叉项目训练-智能机器人（2），春季学期

  交叉项目训练-机器人智能操作，春季学期

  教书育人：

  获得2023年自动化系优秀班主任和2026年自动化系甲级团支部；指导的本科生和研究生中，3人获得清华大学优秀论文（闫筱雨、王施赫丰、辛晨东），4人获得北京市优秀毕业生（于铭瑞、姜永鹏、陈辰、王施赫丰），3人获得国家奖学金（于铭瑞、贾永奕、陈辰），2人获得清华大学蒋南翔奖学金（于铭瑞、陈辰），6人获得清华大学综合奖学金（于铭瑞、严相杰、吕康晨、贾永奕、陈煜、陈辰），1人获得北京市自然科学基金青年学生项目（陈辰），2人获得国家自然科学基金青年学生项目（于铭瑞、陈煜），2人获得中国科协青年人才托举工程博士生专项计划（于铭瑞、陈煜）。'
