bio_raw: '教育背景

  2008年8月至2013年6月 新加坡南洋理工大学电子与电气工程学院，博士

  2006年9月至2008年7月 北京理工大学光电工程系，硕士

  2002年9月至2006年7月 北京理工大学光电工程系，学士

  工作履历

  2025年6月至今 清华大学自动化系，长聘副教授

  2019年6月至2025年6月 清华大学自动化系，准聘副教授

  2016年8月至2019年6月 香港中文大学，研究助理教授

  2015年2月至2016年8月 新加坡国立大学，博士后

  2012年8月至2015年2月 新加坡南洋理工大学，博士后

  学术兼职

  Senior Editor, IEEE Robotics and Automation Letters, since 2026

  Associate Editor, IEEE Transactions on Robotics (TRO), since 2025

  Associate Editor, The International Journal of Robotics Research (IJRR), since 2024

  Associate Editor, IEEE Transactions on Automation Science and Engineering, since
  2023

  IEEE Senior Member, since 2022

  Associate Editor, IEEE Robotics and Automation Magazine, 2019 – 2021

  研究领域

  机器人灵巧操作、医疗机器人、具身智能

  研究概况

  教育部 – 学科突破先导项目：人形机器人，项目联合负责人，2025.9-2030.8

  企业委托项目 - 华为技术有限公司：双臂-双手通用灵巧抓取技术，项目负责人，2025.5-2026.5

  国家自然科学基金 – 国际合作项目：基于共享自治的安全协作超声扫描机器人研究，项目负责人，2025.1-2028.12

  科技创新2030 -“脑科学与类脑研究”重大项目：类脑仿生智能无人系统，课题负责人，2021.12-2026.11

  国家自然科学基金 - 联合基金重点项目：基于意图引导和轨迹定制的上肢绳牵引智能康复机器人研究，项目负责人，2022.1-2025.12

  国家自然科学基金 - 面上项目：面向灵巧微操作的光镊机器人研究，项目负责人，2021.1-2024.12

  Hong Kong RGC GRF (14200319), "Shape Control and Task Planning for Robotic Manipulation
  of Deformable Linear Objects", Jan. 1, 2020 - Dec. 31, 2022, PI (awarded)

  国家自然科学基金 - 青年基金项目：面向外骨骼机器人的动态阻抗控制方法，项目负责人，2019.1-2021.12

  深圳科创委 - 基础研究重点项目：工业机械臂的自治柔性操作技术研究，项目负责人，2018.2-2022.8

  香港创新科技署项目：用于打磨木盒表面涂层的机器人系统开发，项目负责人，2018.3-2019.2

  香港创新科技署项目：室内装修机器人关键技术研究，项目负责人，2018.1-2019.12

  香港创新科技署项目：用于自动化焊接柔性印刷电路板和USB线缆的视觉反馈机器人，项目负责人，2017.11-2019.4

  奖励与荣誉

  2026：Best Associate Editor Award of IEEE Transactions on Automation Science and
  Engineering

  2025：Outstanding Associate Editor of IEEE Robotics and Automation Letters

  2025：1st Place at ICRA RGMC - picking from clutter track

  2024: 自然资源科技进步奖 – 深海智能探测与采样机器人关键技术研发及应用

  2024: 1st Place at ICRA RGMC - in-hand track and Most Elegant Solution

  2024: ICRA Best Medical Robotics Paper Finalist

  2023: T. J. Tarn Best Paper Finalist at ROBIO

  2023: 2nd Place at ICRA Virtual Manipulation Challenge

  2023: Best Paper Award at ICRA DOM Workshop

  2022: 3rd Place in ICRA RoboMaster University Sim2Real Challenge

  2018: T. J. Tarn Best Paper at ROBIO

  2017: IROS Best Application Paper Finalist

  2017: Best Paper in Robotic Control in the 18th International Conference on Advanced
  Robotics

  2013: Highly Commended Paper Award in the third IFToMM International Symposium on
  Robotics and Mechatronics

