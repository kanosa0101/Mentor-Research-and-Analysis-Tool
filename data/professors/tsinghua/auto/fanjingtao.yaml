bio_raw: '教育背景

  2008年8月-2013年6月 长春理工大学光学工程专业学习，获博士学位

  2004年9月-2007年4月 长春理工大学计算机应用专业学习，获硕士学位

  1999年9月-2003年7月 长春理工大学计算机科学技术专业学习，获学士学位

  工作履历

  2022.12-今，清华大学自动化系，研究员

  2018.12-2022.12，清华大学自动化系，副研究员

  2016.11-2018.12，清华大学自动化系，助理研究员

  2014.06-2016.11，清华大学自动化系，博士后

  2013.11-2014.06，“特种电影技术及装备国家地方联合工程研究中心”副主任

  2003.07-2014.06，长春理工大学计算机学院，教师

  学术兼职

  中国仪器仪表学会显微仪器分会理事

  工信部电子科技委基础电子组成员

  中国电影电视技术学会高级会员、标准与测试专业委员会委员

  IEEE Photonics Technology Letters审稿人

  IEEE Journal of Selected Topics in Signal Processing审稿人

  Chinese Optics Letters审稿人

  研究领域

  计算摄像、立体视觉

  研究概况

  科研项目：

  2020.01-2024.12，国家自然科学基金 国家重大科研仪器研制项目，双光子光场计算显微仪器（61927802），负责人

  2017.01-2019.12，国家自然科学基金 面上项目，平板显示器件Mura缺陷的计算摄像检测研究（61671265），负责人

  2015.07-2016.11，中国博士后科学基金第8批特别资助，平板显示器件弱特征缺陷的强分类检测研究（2015T80087），负责人

  2014.10-2016.11，中国博士后基金基金第56批一等资助，双目立体视频视差定量获取关键技术研究（2014M560084），负责人

  2012.01-2015.12，国家科技支撑计划，基于云服务的汽车与高速列车集成平台开发与应用（2012BAF12B22），负责人

