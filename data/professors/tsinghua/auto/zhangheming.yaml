bio_raw: '教育背景

  1995 年 12 月毕业于浙江大学，获工学博士学位

  工作履历

  1996年1月-1997年11月 清华大学自动化系，博士后

  1997年12月-1999年6月 清华大学自动化系，讲师

  1999年7月-2011年11月 清华大学自动化系，副教授

  2011年12月-至今 清华大学自动化系，教授

  研究领域

  [1] 智能制造

  [2] 工业智能与大数据

  [3] 复杂系统建模与虚拟仿真

  研究概况

  主要科研项目：

  [1] 智能车环境下分布式联合仿真技术研究，企业委托项目，负责人，2021-2022

  [2] 制造业多价值链协同数据空间知识服务引擎技术与方法，国家重点研发计划课题任务（2020YFB1707803），负责人，2020-2023

  [3] 复杂产品全系统建模与集成技术，国家重点研发计划课题（2018YFB1701602），负责人，2019-2022

  [4] 晶圆级先进封装关键生产工艺的大数据分析，企业委托项目，负责人，2019-2022

  [5] 电声智能工厂管控技术研究，企业委托项目，负责人，2019-2022

  [6] 基于云端的工业机器人集成控制技术及系统，佛山-清华产学研创新课题，负责人，2019-2020

  [7] 红塔集团智慧工厂的大数据分析方法及关键技术，企业委托项目，负责人，2017-2019

  [8] 宁波卷烟厂智慧制造动态能力平台TOC技术开发，企业委托项目，负责人，2018-2020

  [9] 基于CPS的智能装配生产线云服务技术架构，智能制造国家重点实验室基金项目，负责人，2017-2019

  [10] 面向协同仿真的复杂产品多学科耦合建模与计算方法研究，国家自然科学基金项目，负责人，2014-2017

  [11] 面向HLA仿真软件的复杂产品广义多学科统一建模技术，863课题，负责人，2013-2016

  [12] 大功率激光3D打印L-SS平台集成管控技术研究及系统开发，横向项目，负责人，2014-2015

  [13] 面向云仿真的应用服务性能建模及优化方法研究，北京仿真中心合作课题，负责人，2014-2015

  [14] 飞行动力学实时仿真算法研究，航空基金，负责人，2013-2014

  [15] 火电厂大型煤场无线测温系统与数字化监测管理平台研制，横向项目，负责人，2013-2014

  [16] 多学科CAE异构系统的协同理论与技术方法研究，国家自然科学基金项目，负责人，2011-2013

  [17] 多分辨率仿真概念模型推演技术，北京仿真中心合作课题，负责人，2012

  [18] 并行、协同、高效的概念模型建模技术研究，北京仿真中心合作课题，负责人，2011-2012

  [19] 支持400km/h高速检测列车研制的协同仿真平台建设和应用，863项目，主要参与，2010-2012

  [20] 异构CAE系统的协同研究，国防基础理论项目，负责人，2009-2011

  [21] 云仿真平台资源计收费管理系统的研究与开发，北京仿真中心合作课题，负责人，2010-2011

  [22] 多学科协同仿真的适应性算法与模型分析，国防基础科研项目，负责人，2009-2010

  [23] 多学科模型算法体系研究开发，北京仿真中心合作课题，负责人，2009-2010

  [24] 航天虚拟样机多学科协同建模的关键技术研究，国防基础科研项目，负责人，2007-2009

  [25] 北京中丽制机信息化工程总体设计，横向项目，负责人，2008-2009

  [26] 宏华公司产品数字化开发平台总体设计，横向项目，负责人，2007

  [27] 基于Web 、面向服务的复杂产品多学科协同建模与仿真技术研究，武器装备预研基金项目，负责人，2005-2007

  [28] 复杂产品多学科协同设计与仿真融合的理论方法研究，国家自然科学基金项目，负责人，2007-2009

  [29] 江南机器（集团）信息化规划与计算机辅助工艺信息系统总体设计，横向合作，技术负责人，2005-2006

  [30] 虚拟样机环境下复杂产品多领域协同建模方法研究，国家自然科学基金项目，负责人，2003-2005

  [31] 基于协同设计与并行工程的复杂产品虚拟样机技术研究，863项目，负责人，2002-2004

  [32] 中欧网络化制造企业系统集成技术，科技部合作司项目，负责人，2001-2003

  [33] China Europe Network on the Net，欧盟第五框架计划项目，中方负责人，2001-2003

  [34] 航天科工集团“航天CIMS工程”虚拟样机分系统总体设计，横向合作，负责人，2001

  [35] 面向敏捷制造的产品信息全局建模与分布集成技术研究，国家自然科学基金项目，负责人，1999-2001

  奖励与荣誉

  2017年，基于物联网技术的火电厂燃料全过程管理与智能掺烧系统，浙江省科学技术进步二等奖

  2016年，企业信息化交叉学科建设，CAA高等教育教学成果一等奖

  2006年，复杂产品虚拟样机关键技术、协同仿真平台及其工程应用，教育部科技进步二等奖（第一完成人）

  2006年，复杂产品协同仿真平台及其应用，中国电子学会科技进步二等奖（第一完成人）

  2003年，航天并行工程，国防科学技术二等奖

