title: 长聘教授
email: feifeigao@tsinghua.edu.cn
bio_raw: '教育背景

  学士，西安交通大学电子信息学院，2002

  硕士，加拿大麦克马斯特大学电子与计算机工程系，2004

  博士，新加坡国立大学电子与计算机工程系，2007

  工作履历

  研究员，新加坡科技研究局资讯通信研究院，2008

  助理教授，德国不莱梅国际大学工程与科学学院，2009-2010,

  副教授，清华大学自动化系信息处理研究所，2010-2022

  学术兼职

  中国电子学会信息论分会委员

  中国电子学会通信分会委员

  中国通信学会青年工作委员会委员

  中国通信学会物联网分会委员

  首席客座编委，IEEE Journal of Selected Topics in Signal Processing

  编委，IEEE Transactions on Cognitive Communications and Networking

  编委，IEEE Transactions on Wireless Communications

  编委，IEEE Transactions on Communications

  编委，IEEE Wireless Communications Letters

  编委，IEEE Communications Letters

  编委，IEEE Signal Processing Letters

  编委，China Communications

  会议职务：2019年IEEE通信学会旗舰会议IEEE International Conference on Communications (ICC) 技术委员会共主席；2018年IEEE车载通信学会旗舰会议IEEE
  Vehicular Technology Conference (VTC) Spring 技术委员会共主席；2015年IEEE通信学会旗舰会议IEEE ICC技术委员会共主席；2014年IEEE通信学会旗舰会议IEEE
  Global Communications Conference (GLOBECOM) 技术委员会共主席；2014年IEEE车载通信学会旗舰会议VTC Fall
  技术委员会共主席；2016年International Conference on Computer, Information and Telecommunication
  Systems (CITS) 国际大会程序委员会共主席；2013年International Conference on Reliable and Convergent
  Systems (RACS)国际大会的程序委员会共主席；2013年International Conference on Communications and
  Networking in China (ChinaCom) 国际大会技术委员会共主席，2012年International Conference on Wireless
  Communications and Signal Processing (WCSP) 国际大会技术委员会共主席；2012年International Conference
  on Communications Technology (ICCT) 国际大会宣传共主席；

  研究领域

  智能无线通信与感知、通感一体化、电磁感知论、具身智能等。

  奖励与荣誉

  2023年国家自然科学基金委杰出青年基金获得者

  2019年入选IEEE Fellow

  2014年国家自然科学基金委优秀青年基金获得者

  科技奖：2022年中国通信学会自然科学一等奖，2022年江苏省自然科学一等奖，2021年中国自动化学会自然科学一等奖；

  论文奖：2023年IEEE通信学会旗舰会议ICC大会最佳论文奖； 2020年IEEE通信学会旗舰会议GLOBECOM大会最佳论文奖；2018年SCI期刊China
  Communications最佳论文奖；2018年IEEE通信学会旗舰会议GLOBECOM大会最佳论文奖；2018年国际ICCC大会最佳论文奖；2017年国际WCSP大会最佳论文奖；2016年IEEE通信学会旗舰会议GLOBECOM大会最佳论文奖；2015年国际CHINACOM大会最佳论文奖；2014年国际ICT大会最佳论文奖；

  人物奖：2018中国通信学会青年科技奖； 2013年IEEE通信学会亚太地区杰出青年学者；2012年SCOPUS中国青年科学之星称号；

  学术成果

  已发表IEEE 期刊论文250余篇，谷歌引用2万余次。主页空间有限，论文成果可在IEEE数据库以及谷歌学术查询

  人才培养

  团队已培养清华大学本科生特奖学生一名，国家自然科学基金委首届本科生项目获得者一名，毕业研究生包括：华为天才少年计划（最高计划）获得者两名，腾讯青云计划（最高计划）获得者一名，京东TGT（最高计划）获得者一名，字节跳动筋斗云计划获得者一名，阿里T-star计划获得者一名。

  欢迎熟悉FPGA开发、Ubuntu、ROS系统与FPGA、嵌入式开发联合系统设计的学生申报本组博士、硕士研究生。对信号处理，多模态协同感知，机器人具身智能、世界模型有浓厚兴趣者优先。

  此外，本组长期招收博士后，具有无线通信、人工智能、具身智能背景的博士生，若有意申请博后，欢迎与本人联系。'
