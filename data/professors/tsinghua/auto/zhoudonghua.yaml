bio_raw: '教育背景

  1981-1990， 获上海交通大学学士、硕士、博士学位

  工作履历

  曾任北京理工大学副研究员（1993-1994）

  德国杜伊斯堡大学洪堡学者（1994-1996）

  耶鲁大学访问学者（1991-1992）

  学术兼职

  IFAC 技术过程故障诊断与安全性技术委员会委员

  中国自动化学会副理事长

  技术过程故障诊断与安全性专业委员会主任等

  研究领域

  动态系统故障诊断、容错控制与运行安全性评估理论等。

  研究概况

  已主持国家973课题, 863项目, 国家自然科学基金重大、重点、重大国际合作项目等国家和省部级科研项目20余项。

  奖励与荣誉

  CAA/IET/IEEE Fellow。 曾获第六届中国青年科技奖、全国优秀博士后奖、国家杰出青年科学基金、教育部长江学者特聘教授、国家“万人计划”领军人才、山东省泰山学者优势特色学科人才团队领军人才、全国优秀科技工作者等称号，并曾任国家自然科学基金会优秀创新群体负责人。

  已获国家自然科学二等奖2项、国家科技进步二等奖1项、国家级优秀教学成果二等奖1项。

  学术成果

  出版学术专著7部，发表IEEE 汇刊和 Automatica 论文80余篇。'
