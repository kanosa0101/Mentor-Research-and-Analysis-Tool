title: 副研究员
email: yangjijiang@tsinghua.edu.cn
bio_raw: '教育背景

  清华大学工学学士学位、清华大学工学硕士学位

  爱尔兰国立大学（高尔威）博士学位

  工作履历

  1996年7月-1998年7月 清华大学自动化系，讲师

  1998年7月-2007年12月 清华大学自动化系，副教授

  2007年12月-至今 清华大学自动化系，教授

  学术兼职

  国家卫健委卫生信息标准委员会第八、九届委员

  中国生物工程学会健康工程分会副主任委员

  中国卫生信息及健康医疗大数据学会慢病管理及AI专委会副主任委员

  中国非公医疗机构信息化专委会委员

  清华大学学报（自然，英文版）Intelligent Medical Engineering 专栏（长期）客座编辑

  研究领域

  医疗健康信息化和服务产业化、医疗大数据管理和分析方法和工具、人工智能关键算法及在医疗健康领域应用、数字医疗健康关键技术及服务模式、隐私保护等。

  研究概况

  1997-2000年初作为技术骨干及项目管理核心成员，完成了国家863计划CIMS主题第一个重大攻关项目：网络化制造。2010年后重点围绕医疗健康领域，开展相关技术研究和应用，曾主持或参加国家级863项目、科技支撑计划、973项目等共10多项。

  十二五计划末期，为了推动信息技术（包括物联网技术）在医疗里的广泛应用，提升医疗服务效率和服务质量和水平，协同参与了“主动健康”专项的规划，推动了十三五科技部“主动健康及老龄化应对”专项的成立。

  奖励与荣誉

  获全军医疗科技成果二等奖、中华医学会科技进步三等奖、中国妇幼保健协会科技成果一等奖、北京市档案科技成果一等奖。发表各类论文180多篇，其中SCI/EI索引60多篇。发明专利3项，软著12项，国家标准1项。

  学术成果

  主持或参与的国家或省部级典型项目包括：

  数字医疗健康关键技术研究及应用

  主动医疗服务共性关键技术研究

  眼科影像服务关键技术研究

  口腔服务云平台及大数据应用的关键技术研究

  健康医疗资源聚合与服务集成技术

  融合数据驱动和知识驱动的老年常见病多重用药风险数据挖掘技术和风险识别模型研发

  上市后药品的安全性监测和评价方法研究 （药监局）

  儿童运动视频动作捕捉建模算法技术服务（国家体育总局）

  医疗健康人工智能应用评估指标体系及应用基地建设规范（卫健委）'
