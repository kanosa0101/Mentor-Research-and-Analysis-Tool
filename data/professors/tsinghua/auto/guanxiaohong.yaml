bio_raw: '教育背景

  1999年访问美国哈佛大学工程与应用科学系

  1993年5月获美国康涅狄格大学电机与系统工程系博士学位

  1985年3月获清华大学自动化系工学硕士学位

  1982年7月获清华大学自动化系工学学士学位

  奖励与荣誉

  2017-，中国科学院院士

  2015年IEEE自动化科学与工程国际会议最佳论文奖

  2009-，康涅狄格大学杰出工程师院

  2008年度IEEE通信学会系统集成与建模最佳论文奖

  2008-，IEEE机器人与自动化学会杰出讲座人

  2007-，IEEE Fellow

  2006年度国家科技进步二等奖（第五完成人）

  2005年度国家自然科学二等奖（第一完成人）

  2004年度教育部自然科学一等奖（第一完成人）

  1997年度国家杰出青年基金

  1996年度美国李氏基金杰出成就奖

