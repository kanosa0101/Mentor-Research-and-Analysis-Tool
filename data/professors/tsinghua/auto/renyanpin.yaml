title: 研究员
email: renyp@tsinghua.edu.cn
bio_raw: '教育背景

  1990年9月-1995年7月 清华大学自动化系工业自动化专业学习，获工学学士学位

  1995年9月-1999年10月 清华大学自动化系自动控制理论与控制工程专业学习，获工学博士学位

  工作履历

  1999年10月 - 2006年3月 联想集团 研发工程师/经理

  2006年4月 - 2007年12月 清华大学自动化系 工程师

  2007年12月 - 2018年12月 清华大学自动化系 高级工程师

  2018年12月 - 至今 清华大学自动化系 研究员

  2014年1月 - 2014年5月 美国马里兰大学 访问学者

  学术兼职

  IEEE Senior Member

  北京市高等教育学会电子线路研究分会 理事

  全国大学生智能汽车竞赛组委会秘书处 成员

  研究领域

  [1] 电子技术及应用

  数字电路及模拟电路设计；嵌入式系统设计

  [2] 虚拟仪器及自动测试系统

  虚拟仪器研究和开发；基于LXI的自动测试系统

  [3] 数字家庭（联想工作期间）

  未来数字家庭架构；家庭网络标准

  研究概况

  [1]火工品测试仪 与航天部横向合作项目 负责人 2006年6月-2007年12月

  [2]基于无线网络的实验教学管理信息系统 清华大学985二期“现代化教学支撑平台”子课题 第1完成人 2008年6月-2010年1月

  [3]开放创新的电子技术课程设计教学 教育部产学合作协同育人项目 负责人 2016年1月-2017月12日

  [4]模拟电子线路课程改革与实践 教育部产学合作协同育人项目负责人 2017年1月-2018年12月

  奖励与荣誉

  2018年 全国高等学校青年教师电子技术基础、电子线路课程授课竞赛一等奖

  2016年/2008年 清华大学教学成果奖2项

  2014年/2010年 清华大学实验技术成果奖一等奖2项

  2009年 清华大学优秀班主任一等奖

  学术成果

  编写著作1本, 发表论文29篇, 获得中国发明专利授权24项。

  主要论著：

  [1]任艳频. DC-DC变换电路原理及应用入门. 清华大学出版社, 2015年.

  [2]Qing Zhuo, Yanpin Ren, Yongheng Jiang, Changshui Zhang. Hands-on learning through
  racing: signal processing and engineering education through the China national collegiate
  intelligent model car competition. IEEE Signal Processing Magazine, Jan. 2017, vol.
  34, no. 1, pp. 31-39.

  [3]Yanpin Ren, Nan Lyu. A pulse measurement and data management system based on
  Arduino platform and Android device. 2016 IEEE 13th International Conference on
  Networking, Sensing, and Control, Mexico, Apr. 2016, pp. 1-4.

  [4]任艳频. 电子电路实验教学与

  人才培养

  探究. 实验室研究与探索. 2012, 31(11): 138-140.

  [5]Yanpin Ren. Web-based student performance evaluation system for engineering education.
  International Proceedings of Computer Science and Information Technology. ICNEE
  2011. vol. 11, pp. 133-137.

  [6]任艳频. 示波器输入电容对上限截止频率测量的影响. 2011年全国高等学校电子技术研究会年会. 北华航天工业学院学报. 2011, 21(4): 14-16.

  主要专利：

  [1]任艳频,秦俭,李振刚. 基于现场可编程门阵列的便携式综合电子实验平台. 中国发明专利. 2014108377881

  [2]任艳频,贾朝晖,赵兵,徐波. 一种媒体播放设备及其媒体播放的实现方法. 中国发明专利. 2004100057896

  [3]任艳频,李峰厚,张渊毅,李明等. 一种利用门户网关实现设备间互连的方法. 中国发明专利. 021296553

  [4]任艳频,姜珊,李明,孟闯等. 数字家庭网络系统. 中国发明专利. 021260524

  讲授课程：

  [1]数字电子技术基础. 姚班

  [2]电子技术课程设计. 自动化系

  [3]电子技术实验. 自动化系

  [4]智能车制作-电子技术. MOOC'
