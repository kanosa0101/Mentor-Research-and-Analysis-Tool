bio_raw: '教育背景

  2010年-2015年 清华大学自动化系，获工学博士学位

  2013年-2014年 美国麻省理工学院(MIT)，国家留学基金委联合培养项目

  2006年-2010年 浙江大学控制科学与工程系，获工学学士学位

  工作履历

  2023年-至今 清华大学自动化系，副教授，博士生导师

  2020年-2023年 清华大学自动化系，助理教授，博士生导师

  2016年-2020年 美国麻省理工学院(MIT)，博士后

  学术兼职

  Associate Editor, IEEE Transactions on Industrial Informatics

  Editorial Board Member, AI for Engineering

  TC member, IFAC Technical Committee on Chemical Process Control

  TC member, IEEE IES Technical Committee on Data-Driven Control and Monitoring

  TC member, IEEE CSS Technical Committee on Process Control

  Joule, Science Advances, Nature Communications, Nature Reviews Electrical Engineering,
  Automatica, IEEE TII, IEEE TCST, IEEE CDC, ACC, IFAC World Congress等国际期刊和会议审稿人

  研究领域

  1. 人工智能驱动的新型能源计算理论与应用，是人工智能与新能源领域前沿交叉研究方向。研究融合机器学习、控制理论等技术，以下一代电池技术设计为载体，探索能源智能的建模、诊断、控制和优化新方法。

  2. 大模型理论及应用：研究综合多种数据和知识源的大模型预训练与高效推理新方法及其在计算能源、能源感知具身智能等领域中的综合应用。

  研究概况

  研究方向为人工智能驱动的新型能源计算理论与应用、大模型理论及应用、能源感知具身智能、AI for Science等，在Joule (封面论文)、Nature Energy
  (封面论文)、Nature Communications (3篇)、Automatica、NeurIPS、IEEE汇刊等国际期刊会议发表学术论文。主持国家重点研发计划项目、国家海外高层次人才引进计划青年项目、国家自然科学基金面上项目、北京市自然科学联合基金、清华-丰田国际联合基金等项目。研究工作被Nature
  Publishing Group、Stanford News、Science Daily等报道。获得国际瑞士乔诺法(Chorafas)青年研究奖、国际工业人工智能大会最佳论文奖等奖项。

  奖励及荣誉

  Best Paper Award, 7th International Conference on Industrial Artificial Intelligence,
  2025

  国家高层次青年人才, 2021

  Intelligent Computing Innovators of China, 2021

  Outstanding Reviewer for Journal of Process Control, 2018

  瑞士乔诺法(Chorafas)青年研究奖, 2016

  清华大学优秀博士论文, 2015

  学术成果

