  研究领域

  肿瘤等复杂疾病的生物网络与中西医精准防治

  中医药网络药理学的理论、方法与应用

  Research Interests

  Network Pharmacology and Bioinformatics, with applications in inflammation, cancer
  and traditional medicine

  研究概况

  当前“单基因、单靶标、单药物”还原式医药研究模式既难以适应肿瘤等复杂疾病防治的重大需求，也难以揭示以整体为特色的中医药的生物基础。本课题组主要从事生物信息学与中医药现代化研究，开辟中医药网络药理学新方向，致力于利用大数据、人工智能等方法，从生物网络的角度探索生命的本质规律，以生物网络为靶标建立胃癌等重大疾病的中西医智慧与精准防治新模式，同时数字化、精准化、智能化解决中医药传承与创新难题。

  Research Status

  Traditional Chinese Medicine (TCM) is characterized by its holistic thinking in
  treating a patient as an imbalanced system, and the use of various herbal formulae
  in restoring the balance of human body. The holistic philosophy and patient-tailored
  treatment of TCM shares a lot with the key idea of current systems biology and precision
  medicine. However, it is very challenging to unveil the biological basis of TCM
  by current reductionist "one target, one drug" approach due to the complexity of
  both the chemical compositions of herb formula and the biological systems of patients.
  In the big data era, we devoted to create a novel“network target, multicomponent
  therapeutics”approach to offer bright prospects in understanding TCM from a systems
  perspective, narrow the gap between Eastern and Western medical practices, and help
  achieve the TCM-based precision medicine. The effectiveness of the "network target"
  approach has been demonstrated by follow-up clinical and experimental investigations
  on the prevention of gastric cancer and the R&D of herbal medicine.

