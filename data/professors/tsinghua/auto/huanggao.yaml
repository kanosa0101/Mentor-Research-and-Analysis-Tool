title: 长聘副教授
email: gaohuang@tsinghua.edu.cn
bio_raw: '教育背景

  2009年9月至2015年7月 清华大学自动化系，获博士学位

  2005年9月至2009年7月 北京航空航天大学自动化学院，获学士学位

  工作履历

  2021年12月至今 清华大学自动化系 副教授

  2018年12月至2021年11月 清华大学自动化系 助理教授

  2015年10月至2018年10月 美国康奈尔大学 博士后

  学术兼职

  IEEE Transactions on Pattern Analysis and Machine Intelligence , Associate Editor
  (2020-)

  Pattern Recognition, Associate Editor (2021-)

  NeurIPS (2022, 2023, 2025)、ICML (2023, 2026)、ICCV (2023, 2025)、CVPR(2021, 2023,
  2025, 2026)、ICLR (2022)、UAI (2021), Area Chair

  IJCAI (2021)、AAAI (2018，2020),

  中国自动化学会具身智能专委会副主任委员

  中国仿真学会智能无人系统建模与仿真专委会秘书长

  中国计算机学会计算机视觉专委会委员

  中国自动化学会模式识别与机器智能专委会委员

  中国人工智能学会模式识别专委会委员

  中国图象图形学学会机器视觉专委会委员

  中国图象图形学学会青年工作委员会委员

  研究领域

  深度学习、多模态学习、具身智能、强化学习

  研究概况

  研究方向为人工智能基础模型与算法，包括神经网络架构、高效推理算法、强化学习、多模态感知与生成、具身基座模型与世界模型等，在Nature Machine Intelligence、IEEE
  TPAMI等期刊、会议发表学术论文200余篇，其中CCF A类论文120余篇。谷歌学术总引用10.5万次，代表性工作DenseNet单篇被引6.2万次，入选AI2000
  人工智能领域最具影响力学者，作为第一或通讯作者分别获CVPR 2017最佳论文奖和NeurIPS 2025最佳论文奖亚军。成果获得包括诺奖、图灵奖得主等知名学者的高度评价，被编入MIT、斯坦福等世界顶尖大学教材，并被广泛应用智慧医疗、智能安防、遥感数据分析、工业检测等领域。

  主持国家自然科学基金委优青、“叶企孙”联合重点、中电科联合重点、国家重点研发计划青年科学家项目等多项国家级项目，作为骨干成员参与国家自然科学基金委创新群体项目和国家科技创新2030重大项目。长期开展与华为、字节、阿里、腾讯等企业的校企科研合作。

  指导学生获国家自然科学基金委青年学生基础研究项目、中国科协青年科技人才培育工程博士生专项计划、国家奖学金（10人次）、CCF-CV学术新锐奖、百度奖学金、微软学者、字节跳动奖学金、商汤奖学金、挑战杯全国银奖等奖励与荣誉。

  奖励与荣誉

  2025年 NeurIPS 最佳论文亚军

  2025年 北京市科学技术进步一等奖

  2024年 中国图象图形学学会自然科学一等奖

  2024年 亚洲青年科学家奖

  2022年 教育部自然科学一等奖

  2022年 CVPR最佳论文入围

  2021年 MIT TR35（亚太区）

  2020年 国家优秀青年科学基金获得者

  2020年 达摩院青橙奖

  2018年 世界人工智能大会Super AI Leader（SAIL）先锋奖

  2018年 中国人工智能学会自然科学一等奖

  2017年 CVPR最佳论文奖

  2016年 中国百篇最具影响国际学术论文

  学术成果

  详见  http://www.gaohuang.net'
