  教育背景

  工学学士 (计算机科学与技术), 清华大学, 中国, 1997

  工学硕士 (计算机科学与技术), 清华大学, 中国, 2000

  博士 (计算机科学), 加州大学洛杉矶分校, 美国, 2005

  研究领域

  智能运维（AIOps）

  时间序列智能（Time Series Intelligence）

  研究概况

  裴丹，博士，清华大学计算机系教授、博士生导师。获得电子学会科技进步一等奖。在智能运维领域发表了200余篇学术论文和30多项专利授权，Google学术引用超过1.5万次。CCF
  AIOps算法挑战赛的创办人和CCF OpenAIOps社区发起人。计算机网络领域旗舰期刊IEEE/ACM Transactions on Networking
  编委，并曾担任IEEE计算机网络领域旗舰会议ICNP 2022的技术程序委员会主席。

  奖励与荣誉

  IEEE ISSRE 2025 Best Research Paper Candidate (2025)

  IEEE ISSRE 2025 Best Industry Paper Candidate (2025)

  IEEE ISSRE Best Industry Paper (2024)

  中国电子学会科技进步一等奖（2023）

  IEEE ISSRE Best Research Paper (2023/2018)

  高校计算机专业优秀教师奖励计划 （2021）

  “大川基金助研奖” （2018）

  ACM Senior Member （2011）

  IEEE Senior Member （2011)

  ICDCS Best Paper (2005)

  加州大学洛杉矶分校计算机系最佳博士论文 （2005）

