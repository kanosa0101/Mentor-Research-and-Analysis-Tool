bio_raw: "姓名：崔勇\n职称：教授\n电话：62603059\n邮箱：cuiyong@tsinghua.edu.cn\n主页：\nhttp://www.cuiyong.net\n\
  教育背景\n工学学士 (计算机科学与技术), 清华大学, 中国, 1999\n工学博士 (计算机科学与技术), 清华大学, 中国, 2004\n学术兼职\n1.\
  \ 国际标准化组织IETF IPv6过渡工作组（softwire）: 主席(2011-今)\n2. IEEE Trans. Cloud Computing (TCC):\
  \ 编委(2013-今)\n3. IEEE Network: 编委（2016-今）\n4. IEEE Internet Computing: 编委（2016-今）\n\
  研究领域\n互联网体系结构与网络安全\n大模型的网络优化与应用\n低时延网络及应用（如 VR/AR、视频直播和游戏等）\n研究概况\n崔勇，博士，清华大学计算机系教授、博导，网络技术研究所所长，教育部长江学者特聘教授，曾获首届青年长江学者，获国家优秀青年科学基金和教育部新世纪人才等项目持续支持。获国家科技进步一等奖\
  \ 1 次、国家科技进步二等奖 1 次、国家技术发明二等奖 1 次，多次获得国家信息产业重大技术发明。参与研制成功我国第一台“IPv6 核心路由器”，参与建设了中国下一代互联网示范工程\
  \ CNGI-CERNET2。在 Mobicom、NSDI、ToN 等互联网领域顶级会议和期刊上发表了大量学术论文，担任中国互联网协会学术工作委员会秘书长，CCF\
  \ A 类期刊 TPDS 等 4 个 IEEE 期刊编委、中国通信学会边缘计算委员会副主任委员，成功在京组织国际网络通信领域顶级会议 Sigcomm'19 并担任大会副主席。完成了\
  \ RFC 国际标准 10 余项，并曾长期担任国际标准工作组主席。\n奖励与荣誉\n1. 互联网端到端高效实时传送关键技术及应用获 2024 年度中国通信学会技术发明一等奖\n\
  2. 下一代互联网真实源地址认证体系结构、关键技术以及规模化应用获 2023 年度国家科技进步一等奖\n3. 下一代互联网真实源地址认证体系结构、关键技术以及规模化应用获\
  \ 2020 年度中国电子学会科学技术特等奖\n4. 下一代互联网 4over6 过渡技术及其应用获得 2016 年度国家技术发明奖二等奖\n5. 《基于软线的\
  \ IPv6 过渡技术体系》等 5 项 IETF 国际标准和行业标准获 2012年度中国通信标准化协会科学技术一等奖\n6. 下一代互联网 4over6 过渡技术及其应用获\
  \ 2012 年度中国通信学会科学技术一等奖\n7. IPv6 核心路由器获 2005 年度国家科技进步二等奖\n学术成果\n1. Ximeng Liu, Shizhen\
