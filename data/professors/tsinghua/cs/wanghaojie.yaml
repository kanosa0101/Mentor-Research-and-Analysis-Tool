bio_raw: '姓名：王豪杰

  职称：助理研究员

  邮箱：wanghaojie@tsinghua.edu.cn

  主页：

  https://pacman.cs.tsinghua.edu.cn/~whj

  GitHub 主页：https://github.com/whjthu

  教育背景

  工学学士（工程力学与航空航天工程）,清华大学，中国，2015

  工学博士（计算机科学与技术）,清华大学，中国，2021

  研究领域

  人工智能编译器，高性能计算

  研究概况

  主要在人工智能编译器和高性能计算领域开展研究工作，相关成果发表于OSDI、ATC、PPoPP、SC、PLDI、TC、TPDS等相关领域内顶级国际会议和期刊。2021年博士毕业后于清华大学计算机系高性能所从事博士后研究工作，2023年博士后出站后留任助理研究员。曾获清华大学优秀博士学位论文、北京市优秀毕业生、清华大学“水木学者”、ACM
  SIGHPC China优博奖等荣誉，以及国家自然科学基金青年科学基金、中国博士后科学基金面上资助及特别资助（站中）等项目资助。

  目前在主持开源项目InfiniTensor的开发工作：https://github.com/InfiniTensor/InfiniTensor。'
