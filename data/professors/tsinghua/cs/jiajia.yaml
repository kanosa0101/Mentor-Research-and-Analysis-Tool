bio_raw: '姓名：贾珈

  职称：教授

  邮箱：jjia@tsinghua.edu.cn

  教育经历

  1999.09-2003.07 工学学士，清华大学计算机科学与技术系

  2003.09-2008.07 工学博士，清华大学计算机科学与技术系

  工作经历

  2008.09-2010.06 清华大学计算机科学与技术系 校内博士后

  2010.07-2012.12 清华大学计算机科学与技术系 讲师

  2012.12-2021.12 清华大学计算机科学与技术系 副教授（2018年晋升长聘副教授）

  2021.12-至 今 清华大学计算机科学与技术系 教授

  研究领域

  情感计算，人机语言交互

  研究概况

  贾珈博士是清华大学计算机科学与技术系长聘教授。她的主要研究兴趣是情感计算和人机语音交互。

  她是国家杰出青年科学基金获得者、国家级高端青年人才称号获得者、北京智源人工智能研究院青年科学家、中国计算机学会杰出会员。现任中国中文信息学会理事、中国图象图形学学会情感计算与理解专业委员会副主任、中国计算机学会语音对话与听觉专业委员会副主任、中国中文信息学会语音专业委员会秘书长等。现任ACM
  TOMM Associate Editor，十余次担任ACM Multimedia、IJCAI、ACM Multimedia Asia等国际学术会议程序委员会主席或领域主席。

  作为项目负责人，主持2期国家重点研发计划重大专项项目等二十余项科研项目。曾获中国电子学会科技进步一等奖、中国人工智能学会优秀科技成果奖、两次获得教育部科技进步二等奖等省部级科研奖励；曾获领域顶级国际学术会议NeurIPS、ACM
  Multimedia和IJCAI等评选的多项论文奖励以及中国多媒体大会（ChinaMM）最佳论文奖；曾获2021年度大川研究助成奖(Okawa Foundation
  Research Grant)。

  同时，她与华为、腾讯、博世、西门子等企业保持密切的科研合作，曾获“清华-腾讯联合实验室”2021年度优秀项目奖、“清华-华为联合研究院”2020年度优秀技术合作成果奖等。

  在教育教学方面，相关成果获得高等教育国家级教学成果二等奖、北京市高等教育教学成果奖一等奖、两次获得北京市青年教师教学基本功比赛二等奖，多次获得清华大学教学成果奖，两次获得清华大学青年教师教学比赛一等奖等多项教学奖励，指导学生多次获得清华大学特等奖学金、清华大学优秀学位论文、国家奖学金等奖励。

