  工作履历

  讲师（遗传学），美国哈佛大学医学院（Harvard Medical School），美国, 1997-2000

  教授（生命科学，计算机科学，数学），美国南加州大学（USC），美国，2000-2016

  教授（计算机科学），清华大学，至 今

  研究概况

  陈挺教授现为清华大学计算机科学与技术系教授。同时在北京信息科学与技术国家研究中心任职，疑难重症和罕见病全国重点实验室PI。1988年保送进入清华大学计算机系学习，1993年获学士学位，1997年获美国纽约州立大学石溪分校（Stony
  Brook University）计算机科学博士学位。入职清华大学前是美国南加州大学（University of Southern California）生命科学系和计算机科学系正教授，曾经担任南加州大学计算生物学系主任。

  陈挺教授长期研究大数据高效算法设计和人工智能，并应用于研究人类基因组、转录组和蛋白组的数据分析和功能预测，在疾病诊断、治疗、预防，复杂疾病的遗传学研究、医学信息处理等方面均取得了一系列重要的研究成果。主持及参与美国自然科学基金会（NSF）、美国国家卫生研究院（NIH）、中国自然科学基金（NSFC）等项目十余项。在Cell、Science、Nature
  Biomedical Engineering、Nature Communications、PNAS、npj Digital Medicine、Genome Biology、Nucleic
  Acid Research、PLoS Medicine等国际著名期刊，以及CVPR、ICLR、AAAI、KDD、IJCAI、RECOMB、ISMB、MICCAI等计算机会议发表学术论文180余篇，被引15000次（Google
  Scholar），其中39篇论文被引用超过100次。

  入选世界前2%顶尖科学家榜单，2004年获得美国史隆基金会研究奖（Sloan Fellow）。

