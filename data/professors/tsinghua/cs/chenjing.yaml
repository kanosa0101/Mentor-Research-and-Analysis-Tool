bio_raw: '姓名：陈婧

  职称：教授

  邮箱：jchencs@mail.tsinghua.edu.cn

  教育背景

  工学学士，计算机科学与技术，清华大学，2004

  工学硕士，计算机科学与技术，清华大学，2007

  博士，计算机科学，麻省理工学院，2012

  社会兼职

  ACM Transactions on Economics and Computation (TEAC): Associate Editor, 2021-present

  研究领域

  计算理论，算法博弈论，机制设计，区块链和分布式账本

  研究概况

  我的研究工作的一个重要主题是多实体之间的交互，这一主题贯穿了我的大多数工作，从算法博弈论到分布式账本。与运行单机算法的独立的计算机系统不同，今天的大规模计算机系统和网络经常有很多参与者在分布式的环境中进行交互，电子商务、社交网络、多智能体系统、区块链等等都是如此。这些系统的参与者可能是人也可能是人工智能，可能是个体也可能是大型公司、机构，不同的参与者在同一个系统中的目的也各不相同。我的研究工作旨在设计这样的系统，用严格的理论来刻画参与者的行为，并特别关注其中的计算效率、经济效率、健壮性等等问题，使得系统不仅能高效地运行，而且能够在不理想、不友好的环境中仍然保持安全和健壮。

  奖励与荣誉

  NSF CAREER Award, 2016

