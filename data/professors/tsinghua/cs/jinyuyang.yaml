bio_raw: '姓名：金煜阳

  职称：助理研究员

  邮箱：jinyuyang@tsinghua.edu.cn

  主页：

  https://yuyangjin.github.io/

  教育背景

  工学学士（物联网工程），北京理工大学，中国，2017

  工学博士（计算机科学与技术），清华大学，中国，2022

  工作履历

  2022.07-2025.07 清华大学计算机系，博士后

  2025.08- 清华大学计算机系，助理研究员

  研究领域

  并行计算、性能工具

  研究概况

  主要研究方向包括并行计算、 AI for Science系统优化、大规模并行应用性能分析与优化等。研究成果发表在相关领域顶级学术会议和期刊—SC、PPOPP、ICS、USENIX
  ATC、EuroSys、IEEE TPDS等。研究成果获IEEE TPDS 2022最佳论文奖亚军。担任清华大学学生超算团队教练之一，指导团队三次获得世界冠军。主持国家重点研发计划项目(国际合作)、国家自然科学基金青年科学基金项目(C类)等。

  奖励与荣誉

  ACM SIGHPC 中国新星奖（2025年）

  清华大学优秀博士后入围奖（2025年）

  博士后创新人才支持计划（2023年）

  中国计算机学会体系结构优秀博士学位论文激励计划（2023年）

  清华大学“水木学者”（2022年）

  清华大学优秀博士学位论文（2022年）

  学生指导

  清华大学教学成果奖一等奖：2025年

  ISC国际超算竞赛冠军（指导教师）：2024、2025年

  SC国际超算竞赛冠军（指导教师）：2024年'
