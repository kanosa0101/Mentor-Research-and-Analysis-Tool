  13. Dawei Lu, Tao Xin, Nengkun Yu, Zhengfeng Ji, Jianxin Chen, Guilu Long, Jonathan
  Baugh, Xinhua Peng, Bei Zeng, and Raymond Laflamme. "Tomography is necessary for
  universal entanglement detection with single-copy observables." Physical review
  letters 116, no. 23 (2016): 230501.

  14. Jianxin Chen, and Nathaniel Johnston. "The minimum size of unextendible product
  bases in the bipartite case (and some multipartite cases)." Communications in Mathematical
