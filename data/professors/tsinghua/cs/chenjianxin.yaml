bio_raw: '姓名：陈建鑫

  职称：长聘副教授

  邮件：chenjianxin@tsinghua.edu.cn

  教育背景

  本科，清华大学计算机科学与技术系 2005

  博士，清华大学计算机科学与技术系 2010

  研究领域

  量子体系结构与系统，量子纠错与容错，量子软硬协同设计，量子信息理论

  研究概况

  主要从事量子体系结构与系统，量子纠错与容错等方向的研究。在量子体系结构与系统上 ，与合作者提出重定义量子指令集来释放量子芯片性能的思路，并提出了一系列单比特，两比特的量子指令设计与微架构实现方案，大幅提升量子程序执行的准确率。在量子纠错与容错上，
  与合作者提出时间维度上并行的量子纠错实时解码方案，以可规模化的方式将超导量子芯片上平均每轮处理错误的时间压到了一微秒内，彻底解决了这一困扰量子计算领域十年之久的错误堆积难题。在此基础上，进一步提出了向量处理器加速量子计算并行，可配置量子指令集等技术，进一步解决了规模化量子芯片寻址与控制压力问题，并带领联合项目组完成了包括量子指令与控制指令，量子编译框架,量子纠错中间件和控制电子学在内的完整系统，实现了控制量子芯片的完整链路,
  展示了一个完整的容错量子计算系统的原型实现，并在实际量子芯片上进行了初步测试与验证。在计算机科学和物理学领域的多个顶级期刊和会议上发表了近70篇论文，其中包括Nature
  Computational Science、Physical Review Letters、PRX Quantum、IEEE Transactions on Information
  Theory、Communications in Mathematical Physics、ACM Transactions on Quantum Computing等期刊，以及QIP、ASPLOS、DAC等会议。

  学术成果

  1. Jianxin Chen, Dawei Ding, Weiyuan Gong, Cupjin Huang, and Qi Ye. "One gate scheme
  to rule them all: Introducing a complex yet reduced instruction set for quantum
  computing." In Proceedings of the 29th ACM International Conference on Architectural
  Support for Programming Languages and Operating Systems, Volume 2, pp. 779-796.
  2024.

  2. Fang Zhang, Xing Zhu, Rui Chao, Cupjin Huang, Linghang Kong, Guoyang Chen, Dawei
  Ding, Haishan Feng, Yihuai Gao, Xiaotong Ni, Liwei Qiu, Zhe Wei, Yueming Yang, Yang
  Zhao, Yaoyun Shi, Weifeng Zhang, Peng Zhou, and Jianxin Chen. "A Classical Architecture
  For Digital Quantum Computers." ACM Transactions on Quantum Computing 5, no. 1 (2023):
  1-24.

  3. Xinyu Tan, Fang Zhang, Rui Chao, Yaoyun Shi, and Jianxin Chen. "Scalable surface-code
  decoders with parallelization in time." PRX Quantum 4, no. 4 (2023): 040344.

  4. Jianxin Chen, Dawei Ding, Cupjin Huang, and Linghang Kong. "Linear cross-entropy
  benchmarking with Clifford circuits." Physical Review A 108, no. 5 (2023):052613.

  5. Jianxin Chen, Dawei Ding, Cupjin Huang, and Qi Ye. "Compiling arbitrary single-qubit
  gates via the phase shifts of microwave pulses." Physical Review Research 5, no.
  2 (2023): L022031.

  6. Cupjin Huang, Tenghui Wang, Feng Wu, Dawei Ding, Qi Ye, Linghang Kong, Fang Zhang,
  Xiaotong Ni, Zhijun Song, Yaoyun Shi, Hui-Hai Zhao, Chunqing Deng, and Jianxin Chen.
  "Quantum instruction set design for performance." Physical Review Letters 130, no.
  7 (2023): 070601.

  7. Xiaotong Ni, Hui-Hai Zhao, Lei Wang, Feng Wu, and Jianxin Chen. "Integrating
  quantum processor device and control optimization in a gradient-based framework."
  npj Quantum Information 8, no. 1 (2022): 106.

  8. Jianxin Chen, Dawei Ding, and Cupjin Huang. "Randomized benchmarking beyond groups."
  PRX Quantum 3, no. 3 (2022): 030320.

  9. Feng Bao, Hao Deng, Dawei Ding, Ran Gao, Xun Gao, Cupjin Huang, Xun Jiang, Hsiang-Sheng
  Ku, Zhisheng Li, Xizheng Ma, Xiaotong Ni, Jin Qin, Zhijun Song, Hantao Sun, Chengchun
  Tang, Tenghui Wang, Feng Wu, Tian Xia, Wenlong Yu, Fang Zhang, Gengyan Zhang, Xiaohang
  Zhang, Jingwei Zhou, Xing Zhu, Yaoyun Shi, Jianxin Chen, Hui-Hai Zhao and Chunqing
  Deng. "Fluxonium: An alternative qubit platform for high-fidelity operations." Physical
  review letters 129, no. 1 (2022): 010502.

  10. Cupjin Huang, Fang Zhang, Michael Newman, Xiaotong Ni, Dawei Ding, Junjie Cai,
  Xun Gao, Tenghui Wang, Feng Wu, Gengyan Zhang, Hsiang-Sheng Ku, Zhengxiong Tian,
  Junyin Wu, Haihong Xu, Huanjun Yu, Bo Yuan, Mario Szegedy, Yaoyun Shi, Hui-Hai Zhao,
  Chunqing Deng, and Jianxin Chen. "Efficient parallelization of tensor network contraction
  for simulating quantum computation." Nature Computational Science 1, no. 9 (2021):
  578-587.

  11. Jianxin Chen, Andrew M. Childs, and Shih-Han Hung. "Quantum algorithm for multivariate
