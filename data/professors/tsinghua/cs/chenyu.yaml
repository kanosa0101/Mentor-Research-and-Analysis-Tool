bio_raw: '姓名：陈渝

  职称：长聘副教授

  电话：62789205

  邮箱：yuchen@tsinghua.edu.cn

  个人主页：

  http://soft.cs.tsinghua.edu.cn/~chen/

  教育背景

  工学学士 (计算机科学与技术), 国防科技大学, 中国, 1993

  工学硕士 (计算机科学与技术), 国防科技大学, 中国, 1997

  工学博士 (计算机科学与技术), 国防科技大学, 中国, 2000

  社会兼职

  2023 USENIX 年度技术会议（USENIX ATC 2023）技术程序委员会委员

  第 27 届 ACM 操作系统原理研讨会（SOSP 2019）技术程序委员会委员

  第 13 届 ACM 国际泛在计算联合会议（Ubicomp 2011）本地主席

  第 7 届 IEEE 泛在智能与计算国际会议（UIC 2010）副主席

  研究领域

  操作系统，系统软件，工业系统软件

  研究概况

  本人主要研究方向包括AI4OS、OS4AI、面向新型硬件和新型编程语言的系统级性能优化/安全增强，面向AI机器人的全系统优化等。承担清华大学计算机系的操作系统、高级操作系统等课程的教学工作。先后负责和参与了国家自然科学基金项目、国家级重大重点专项项目、863项目、核高基项目、科技部重点专项等，获得国家科技进步二等奖一次和省部级一等奖三次。发表包括操作系统领域著名会议SOSP、OSDI、ASPLOS、USENIX
  ATC、EuroSYS等高水平学术论文60余篇，出版操作系统等相关教材和配套参考书3本、译著2本，担任国内外有影响力学术会议的主席和程序委员会委员等。

  研究课题

  国家科技重大专项课题：工业机器人技术底座研发及验证（2025-2028）

  国家科技重大专项课题：云边端协同的全栈国产化电力专用物联操作系统关键技术（2024-2028）

  泉城实验室重大项目：组件化内核级虚拟化软件关键技术研究与应用（2025-2027）

  泉城实验室重点项目：安全操作系统内核的理论基础、构造方法和运行机制（2023-2024）

  国家自然科学基金：基于细粒度差异性比较的操作系统语义缺陷分析（2018-2021）

  国家重点研发计划课题：软件与系统漏洞智慧挖掘系统（2017-2020）

  奖励与荣誉

  普适计算软硬件关键技术及应用，国家科学技术进步奖二等奖，国务院，2015

  普适计算关键技术及支撑平台，教育部科学技术进步奖一等奖，2014

  学术成果

  [1] SKernel: An Elastic and Efficient Secure Container System at Scale with a Split-Kernel
  Architecture Xiaohu Chai, Keyang Hu, Jianfeng Tan, Tiwei Bie, Guotao Tan, Tianyu
  Zhou, Anqi Shen,Xinyao Yang, Xin Chen, Xu Wang, Feng Yu, Zhengyu He, Dong Du, Yubin
  Xia,Kang Chen, Yu Chen. EuroSys 2026.

  [2] Fork in the Road:Reflections and Optimizations for Cold Start Latency in Production
  Serverless Systems Xiaohu Chai, Tianyu Zhou, Keyang Hu, Jianfeng Tan, Tiwei Bie,
  Anqi Shen, Dawei Shen, Qi Xing, Shun Song, Tongkai Yang, Le Gao, Feng Yu, Zhengyu
  He, Dong Du, Yubin Xia, Kang Chen, and Yu Chen. OSDI 2025.

  [3] Skyloft: A General High-Efficient Scheduling Framework in User Space Yuekai
  Jia, Kaifu Tian, Yuyang You, Yu Chen, Kang Chen. SOSP 2024.

  [4] Verifying Rust Implementation of Page Tables in a Software Enclave Hypervisor
  Zhenyang Dai, Shuang Liu, Vilhelm Sjöberg, Xupeng Li, Yu Chen, Wenhao Wang, Yuekai
  Jia, Sean Noble Anderson, Laila Elbeheiry, Shubham Sondhi, Yu Zhang, Zhaozhong Ni,
  Shoumeng Yan, Ronghui Gu, Zhengyu He. ASPLOS 2024.

  [5] PatternS: an intelligent hybrid memory scheduler driven by page pattern recognition
  Yanjie ZHEN, Weining Chen, Wei Gao, Ju Ren, Kang Chen, Yu Chen. Journal of Systems
  Architecture 2024.

  [6] A smart hybrid memory scheduling approach using neural models Yanjie ZHEN, Huijun
  Zhang, Yongheng Deng, Weining Chen, Wei Gao, Ju Ren, Yu Chen. SCIENCE CHINA Information
  Sciences 2024.

  [7] Intelligent hybrid memory scheduling based on page pattern recognition Yanjie
  ZHEN, Weining Chen, Wei Gao, Ju Ren, Kang Chen, Yu Chen. DATE 2024.

  完整论文列表'
