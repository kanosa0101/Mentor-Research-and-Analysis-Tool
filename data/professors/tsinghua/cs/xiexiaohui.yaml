bio_raw: '姓名：谢晓晖

  职称：助理研究员

  邮箱：xiexiaohui@tsinghua.edu.cn

  主页：

  https://thuxiexiaohui.github.io/

  教育背景

  学士（计算机科学与技术），清华大学，中国

  博士（计算机科学与技术），清华大学，中国

  工作履历

  博士后（计算机科学与技术），清华大学，中国，2021.7-2023.7

  教师（计算机科学与技术系），清华大学，中国，2023.8-至今

  研究领域

  互联网体系结构，网络安全，人工智能

  研究概况

  谢晓晖博士，清华大学计算机系助理研究员，先后在清华大学计算机系获得学士和博士学位。主要研究方向为人工智能与互联网体系结构，作为主要作者在TheWebConf，SIGIR等一系列顶级会议/期刊上共发表了30余篇高水平论文，相关成果获“2024年中国通信学会科学技术奖一等奖”，“2022年吴文俊人工智能科学技术奖优秀博士学位论文”和“2022年北京市科学技术进步奖一等奖”等荣誉。社会工作方面，担任计算机系党委学生工作组组长，负责本科生培养与管理工作，曾获清华大学教学成果一等奖1次（2021年），二等奖1次（2025年）。

  研究成果（近5年）

  1. Yunze Wei, Kaiwen Chi, Shibo Du, Xiaohui Xie, Ziyu Geng, Yuwei Han, Zhen Li,
  Zhanyou Li, Yong Cui. Large Language Model Driven Automated Network Protocol Testing.
  (ANRW 2025).

  2. Xiaoyu He, Xiaohui Xie, Xin Wang, Lei Zhang, Kun Xie, Lin Chen, Yong Cui. FlowSentry:
  Accelerating NetFlow-based DDoS Detection. (CCS 2025).

  3. Chang Liu, Xiaohui Xie, Xinggong Zhang, Yong Cui. Large Language Models for Networking:
  Workflow, Advances and Challenges. (IEEE Network 2024).

  4. Tongze Wang, Xiaohui Xie, Wenduo Wang, Chuyi Wang, Youjian Zhao, Yong Cui. NetMamba:
  Efficient Network Traffic Classification via Pre-training Unidirectional Mamba.
  (ICNP 2024).

  5. Lingfeng Peng, Xiaohui Xie, Sijiang Huang, Ziyi Wang, Yong Cui. PTU: Pre-trained
  Model for Network Traffic Understanding. (ICNP 2024).

  6. Yishuo Zhang, Lanshan Zhang, Zhizhen Zhang, Ziyi Wang, Wendong Wang, Xiaohui
  Xie. Resolving Spurious Temporal Location Dependency for Video Corpus Moment Retrieval.
  (SMC 2024).

  7. Tongze Wang, Xiaohui Xie, Lei Zhang, Chuyi Wang, Liang Zhang, Yong Cui. ShieldGPT:
  An LLM-based Framework for DDoS Mitigation. The 8th Asia Pacific Workshop on Networking
  (APNET 2024).

  8. Jie Zhang, Xt Zuo, Xiaohui Xie, Wei Wang, Yong Cui. TransPortal: Keeping Applications
  Enjoying Tailored Transport Effortlessly. (IWQoS 2024).

  9. Shuqi Zhu, Xiaohui Xie, Ziyi Ye, Qingyao Ai, Yiqun Liu. Comparing Point-wise
  and Pair-wise Relevance Judgment with Brain Signals. Journal of the Association
  for Information Science and Technology (JASIST 2024).

  10. Zhizhen Zhang, Xiaohui Xie, Yishuo Zhang, Lanshan Zhang, Yong Jiang. HierCas:
  Hierarchical Temporal Graph Attention Networks for Popularity Prediction in Information
  Cascades. (IJCNN 2024).

  11. Ziyi Ye, Xiaohui Xie, Qingyao Ai, Yiqun Liu, Zhihong Wang, Weihang Su, Min Zhang.
