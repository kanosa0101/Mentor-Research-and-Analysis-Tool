  12. Ye Tian, Mengyu Yang, Lanshan Zhang, Zhizhen Zhang, Yang Liu, Xiaohui Xie, Xirong
  Que, Wendong Wang. View while Moving: Efficient Video Recognition in Long-untrimmed
