  14. Zhiyu He, Shaorun Zhang, Peijie Sun, Jiayu Li, Xiaohui Xie, Min Zhang, Yiqun
  Liu. Understanding User Immersion in Online Short Video Interaction. Proceedings
  of the 32nd ACM International Conference on Information and Knowledge Management.
  (CIKM 2023).

  15. Jingtao Zhan, Xiaohui Xie, Jiaxin Mao, Yiqun Liu, Jiafeng Guo, Min Zhang, Shaoping
