bio_raw: '姓名：张敏

  职称：教授

  电子邮件：z-m@tsinghua.edu.cn

  URL:

  http://www.thuir.cn/group/~mzhang

  电话 62798279

  教育背景

  工学学士 (计算机科学与技术), 清华大学, 中国, 1999

  工学博士 (计算机科学与技术), 清华大学, 中国, 2003

  学术兼职

  智能技术与系统重点实验室副主任（科研）

  清华大学教育部-微软网络与媒体技术重点实验室 副主任

  清华大学天工研究院 副主任

  ACM Transaction on Information Systems (TOIS) Edior-in-Chief 主编(2020至今）

  ACM SIGIR Executive Committee Member 执委会成员 (2018-2022)；ACM MM’25 General co-Chair
  （大会主席）, CIKM’24、RecSys’24、CHIIR’24、and EVIA’19、WSDM’17 Programco-Chairs（程序委员会主席）,
  SIGIR’18 Short Paper Chair（短文主席）, IJCAI‘16 DC Chair（博士论坛主席）等。

  中国计算机学会杰出会员；中国中文信息学会理事；中国计算机学会女计算机工作者委员；中国中文信息学会信息检索专委会、社会媒体计算专委会委员；中国人工智能学会机器学习专委会、人工心理与人工情感专委会委员；中国计算机学会中文信息技术专委会委员等。

  研究领域

  信息检索，个性化推荐，用户行为分析，机器学习

  承担课程

  《机器学习概论》（本科生课，春季学期）

  《Web and Information Retrieval》(全英文授课，研究生课，春季学期)

  《信息检索前沿研究》（研究生课，春季学期）

  研究课题

  国家自然科学基金联合重点基金：基于因果与认知推理的用户行为建模关键技术研究 （2022-2025）

  国家重点研发计划“热点案件和民生案件审判智能辅助技术研究”（2018-2021）

  国家自然科学基金：基于任务的跨领域异质可解释的推荐方法研究（2017-2020）

  国家自然科学基金重点基金：用户搜索意图理解、表示与匹配 （2016-2020）

  国家自然科学基金：网络信息检索用户行为可靠性分析关键技术研究（2011-2013）

  国家自然科学基金重点课题: 下一代信息检索 (2008-2011)

  国家自然科学基金: 主题无关的高质量WEB页面预选与检索 (2006-2008)

  以及与快手、腾讯、美团、搜狗、知乎、微软、三星、东芝等多个公司的多项合作研究课题

  奖励与荣誉

  北京市科学技术奖一等奖（2023、2015）

  WSDM’2022 Best Paper Award

  中国专利优秀奖（2022）

  大川人才基金（2022）

  IBM Global Faculty Award (2020)

  中国中文信息学会科学技术一等奖（2020）

  清华大学在线教学优秀教师优秀奖（2020）

  “高校计算机专业优秀教师奖励计划”奖励（2018）

  清华大学青年教师教学优秀奖 (2007)

  学术成果

  请参见个人主页：

  http://www.thuir.cn/group/~mzhang'
