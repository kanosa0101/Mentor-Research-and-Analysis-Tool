bio_raw: '姓名：赵文来

  职称：助理研究员

  邮箱：zhaowenlai@tsinghua.edu.cn

  个人主页：

  wenlai.life

  教育背景：

  2011，清华大学，计算机科学与技术系，学士

  2018，清华大学，计算机科学与技术系，博士

  社会服务：

  国家超级计算无锡中心，人工智能研发中心，主任

  研究领域：

  并行计算，可重构计算，智能计算系统

  研究概况：

  主要研究工作为基于可重构计算平台和国产超级计算机系统的高性能人工智能计算软件生态。包括可重构加速单元设计和优化，面向国产众核高性能处理器的人工智能算法库与并行框架设计和优化，大规模人工智能应用的优化和部署等。

  部分科研成果：

  带领团队研发了基于 “神威·太湖之光” 国产超级计算机的人工智能计算平台，已经为十余家高校、科研院所与商业用户提供人工智能计算服务，支持上千节点规模的并行人工智能任务部署。'
