bio_raw: '姓名：侯磊

  职称：副研究员

  邮箱：houlei@tsinghua.edu.cn

  教育背景

  工学博士（计算机科学与技术），清华大学，中国，2010.09-2016.06

  工学学士（计算机科学与技术），北京邮电大学，中国，2006.09-2010.06

  访问学者：鲁汶大学（比利时，2011），新加坡国立大学（新加坡，2014）

  工作履历

  2025.12至今：清华大学计算机系，副研究员

  2019.07-2025.11：清华大学计算机系，助理研究员

  2016.07-2019.06: 清华大学计算机系，博士后

  研究领域

  知识图谱构建及应用，大语言模型

  研究概况

  本人长期从事知识图谱和大语言模型关键技术研究，担任中国中文信息学会语言与知识计算专委会委员和TKDE、AAAI、ACL、EMNLP等领域重要国际期刊/会议审稿人。围绕知识工程生命周期，系统研究知识表示、获取、融合和推理技术；同时围绕大模型的知识认知问题，研究大模型知识记忆、理解、应用及创造能力的评测与增强，以第一作者或通信作者在领域内国际重要学术会议和期刊上发表论文70余篇。

  荣誉奖励

  ACL 2023最佳演示系统论文奖

  EMNLP 2023 杰出论文奖

  CIKM 2021 最佳资源论文奖提名

  2020年中国中文信息学会钱伟长中文信息处理科学技术奖一等奖

  国际标准IEEE 2807突出贡献奖

