bio_raw: '姓名：刘知远

  职称：教授

  电话：62777701

  邮件：liuzy@tsinghua.edu.cn

  教育背景

  工学学士 (计算机科学), 清华大学, 中国, 2006；

  工学博士 (计算机科学), 清华大学, 中国,2011.

  研究领域

  知识图谱与语义计算， 社会计算与计算社会科学.

  研究概况

  长期从事知识图谱与语义计算、社会计算与计算社会科学方面的研究，面向基础大模型技术开展了较为深入的研究和前沿探索，取得多项创新成果，在自然语言处理、知识图谱和社会计算等方面实现了前沿领域突破，已在ACL、EMNLP、IJCAI、AAAI等人工智能领域的著名国际期刊和会议发表相关论文100余篇，已在
  ACL、EMNLP、AAAI、IJCAI 等人工智能领域的著名国际期刊和会议发表相关论文 100 余篇，Google Scholar 统计引用近4.1万次。

