bio_raw: '姓名：鞠大鹏

  职称：副研究员

  教育背景：

  博士学位，清华大学

  研究领域：

  研究方向为计算机系统结构，高性能计算，分布式存储等。

  奖励与荣誉：

  曾主持承担.国家863重点项目“网格结点的建设与应用研究”，并获得国家科学技术进步奖二等奖（高性能集群计算机与海量存储系统），国家教委科技进步奖二等奖（可扩展并行机群系统），北京市科学技术进步二等奖（清华同方“探索108”集群计算机）。'
