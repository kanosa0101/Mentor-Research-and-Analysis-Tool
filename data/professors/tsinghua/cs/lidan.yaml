bio_raw: "姓名：李丹\n职称：教授\n邮箱：tolidan@tsinghua.edu.cn\n主页：\nhttp://nasp.cs.tsinghua.edu.cn/lidan.html\n\
  教育背景\n本科 (计算机科学与技术), 北京师范大学, 中国, 2003\n博士 (计算机科学与技术), 清华大学, 中国, 2008\n研究领域\n数据中心网络，网络智能，可信任互联网\n\
  学术兼职\n期刊编委：IEEE Transactions on Computers，IEEE Transactions on Wireless Communications，IEEE\
  \ Transactions on Cloud Computing\n指导委员会：APNet\n程序委员会主席：APNet 2025，IEEE LANMAN 2014\n\
  大会主席：APNet 2018，IEEE LANMAN 2015\n程序委员会委员：ACM SIGCOMM, USENIX NSDI，IEEE ICNP\n奖励荣誉\n\
  IEEE Fellow，2025\n国家科技进步一等奖，“下一代互联网源地址验证体系结构SAVA关键技术与规模化应用”，2024\n中国电子学会技术发明一等奖，“基于多维感知的大规模数据中心网络路由控制技术”，2024\n\
  教育部青年科学奖，2019\n中国通信学会技术发明一等奖，“性能可预期的大规模数据中心网络关键技术与应用”，2019\n研究概况\n在数据中心网络方向，主要研究数据中心网络体系结构、路由传输协议、可编程网络。以项目负责人承担国家973项目“软件定义的云数据中心网络基础理论与关键技术”。\n\
  在网络智能方向，主要研究Network for AI和AI for Network，包括优化AI训练的互联拓扑、网络协议、集合通信、并行策略，以及基于AI的网络运维和网络优化方法。以项目负责人承担国家重点研发计划项目“网络资源感知的智能路由控制技术”。\n\
  在可信任互联网方向，主要研究互联网源地址验证和路由安全。在IETF牵头发起成立SAVNET工作组。\n代表性论文\n会议论文\n[1] Fei Gui, Songtao\
  \ Wang, Dan Li, Li Chen, Kaihui Gao, Congcong Min and Yi Wang, \"RedTE: Mitigating\
  \ Subsecond Traffic Bursts with Real-time and Distributed Traffic Engineering\"\
  , ACM SIGCOMM 2024, Sydney, Australia.\n[2] Kaihui Gao, Li Chen, Dan Li, Vincent\
  \ Liu, Xizheng Wang, Ran Zhang and Lu Lu, \"DONS: Fast and Affordable Discrete Event\
  \ Network Simulation with Automatic Parallelization\", ACM SIGCOMM 2023, New York,\
  \ USA.\n[3] Shuai Wang, Kaihui Gao, Kun Qian, Dan Li, Rui Miao, Bo Li, Yu Zhou,\
  \ Ennan Zhai, Chen Sun, Jiaqi Gao, Dai Zhang, Binzhang Fu, Frank Kelly, Dennis Cai,\
  \ Hongqiang Harry Liu and Ming Zhang, \"Predictable vFabric on Informative Data\
  \ Plane\", ACM SIGCOMM 2022, Amsterdam, Netherlands.\n[4] Chuanxiong Guo, Guohan\
  \ Lu, Dan Li, HaitaoWu, Xuan Zhang, Yunfeng Shi, Chen Tian, Yongguang Zhang and\
  \ Songwu Lu, \"BCube: A High Performance, Server-centric Network Architecture for\
