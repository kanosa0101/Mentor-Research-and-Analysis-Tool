bio_raw: '姓名：任炬

  职称：长聘副教授（博士生导师）

  邮件：renju@tsinghua.edu.cn

  个人主页：

  https://juren1987.github.io

  教育背景

  工学学士 (计算机科学与技术), 中南大学, 中国, 2009;

  工学硕士 (计算机科学与技术), 中南大学, 中国, 2012;

  工学博士 (计算机科学与技术), 中南大学, 中国, 2016.

  研究领域

  端智能/边缘智能，端云协同智能，隐私计算，大模型安全

  研究概况

  长期从事端智能与隐私计算等领域研究。在端智能领域，目前主要关注端侧大模型推理infra、端侧记忆系统、端侧强化学习、端侧具身智能四个方向；在大模型安全和隐私计算领域，主要关注大模型密态计算方法与框架、大模型数据安全与隐私泄露两个方向。上述方向上的研究成果已发表于ACM/IEEE
  ToN, JSAC, TMC等国际期刊及NSDI, MobiCom, MobiSys, SenSys, Ubicomp, CCS, NDSS, IEEE INFOCOM等国际会议上发表论文100余篇，并出版教材（专著）4部。主持国家自然科学基金重点、专项重点、优青，国家重点研发计划课题等国家级项目10余项。现担任IEEE/ACM
  Trans. Networking，IEEE Trans. Mobile Computing，IEEE Trans. Vehicular Technology，IEEE
  Trans. Cloud Computing等期刊编委，Chinese Journal of Electronics期刊领域主编。连续多年入选科睿唯安全球高被引科学家。曾荣获2023年度中国电子学会自然科学一等奖，2025年度北京市科技进步一等奖，2025年中国仿真学会自然科学一等奖，项目成果“异构自适应的边缘协同智能计算技术与应用”入选2022-2023年度中国物联网十大科技进展。

  奖励与荣誉

  曾入选教育部高层次人才计划特聘教授（2024年度）、获得国家优秀青年基金（2021年度）、湖南省杰出青年基金（2020年度），入选中国科协第四届青年人才托举工程、湖南省湖湘青年英才计划。主要获奖及荣誉如下：

  中国电子学会自然科学一等奖 (排1，2024)

  中国电子学会青年科学家奖 (首届，2024)

  IEEE UIC 2024国际会议最佳论文奖 (2024)

  IEEE TCSC Middle Career Researcher Award (2024)

  中国物联网十大科技进展 (排1，2023)

  达摩院青橙奖 (2022)

  IEEE ComSoc Asia-Pacific Best Young Researcher Award (2021)

  教育部-华为智能基座突出贡献奖 (2021)

  IEEE TCSC Early Career Researcher Award (2019)

  IEEE HPCC 2019国际会议杰出论文奖 (2019)

  IEEE ICC 2019国际会议最佳论文奖 (2019)

  学术成果

  端智能领域：

  [1] T. Wang, R. Fan, M. Huang, Z. Hao, K. Li, T. Cao, Y. Lu, Y. Zhang and J. Ren.
  “Neuralink: Fast on-Device LLM Inference with Neuron Co-Activation Linking," ASPLOS,
  Rotterdam, The Netherlands, Mar. 30 - Apr. 3, 2025.

  [2] T. Wang, X. Chen, K. Li, T. Cao, J. Ren and Y. Zhang. “Jenga: Enhancing Long-Context
  Fine-tuning of LLMs with Contextual Token Sparsity," USENIX ATC, BOSTON, MA, US,
  July 7-9, 2025.

  [3] Z. Hao, J. Wei, T. Wang, M. Huang, H. Jiang, S. Jiang, T. Cao and J. Ren. “Scaling
  LLM Test-time Compute with Mobile NPU on Smartphones,” EuroSys, Edinburgh, UK, April
  27-30, 2026.

  [4] J. Lu, J. Li, Y. Zhang and J. Ren. “Bridging Storage and Execution: A Semantic
  Virtual Bus for On-Demand Application Streaming,” USENIX NSDI, RENTON, WA, USA,
  May 4-6, 2026.

  [5] Y. Zhao, Y. Fu, Z. Feng, H. Pan, Y. Deng, Y. Zhang and J. Ren. “MANA: Towards
  Efficient Mobile Ad Detection via Multimodal Agentic UI Navigation,” ACM MobiCom,
  Austin, Texas, Oct. 26-30, 2026.

  [6] F. Jia, S. Jiang, T. Cao, W. Cui, T. Xia, X. Cao, Y. Li, Q. Wang, D. Zhang,
  J. Ren, Y. Liu, L. Qiu and M. Yang. “Empowering In-Browser Deep Learning Inference
  on Edge Through Just-In-Time Kernel Optimization,” ACM MobiSys, Tokyo, Japan, June
  3-7, 2024.

  大模型隐私计算与安全领域：

  [7] Q. Li, Y. Zhang, J. Ren, Q. Li and Y. Zhang. “You Can Use But Cannot Recognize:
  Preserving Visual Privacy in Deep Neural Networks,” NDSS, Feb. 26 - Mar. 1, San
  Diego, California, 2024.

  [8] Y. Zhang, Y. Song, M. Li, Q. Li, Q. Li and J. Ren. “PeriNet: Periodic Deep Learning
  Framework for Modality-Agnostic Privacy Preserving,” WWW, Dubai, UAE, Apr. 13-17,
  2026.

  [9] Q. Li, J. Ren, Y. Zhang, C. Song, Y. Liao and Y. Zhang. “Privacy-Preserving
  DNN Training with Prefetched Meta-Keys on Heterogeneous Neural Network Accelerators,”
  DAC, San Francisco, July 9-13, 2023.

  [10] Y. Deng, N. He, X. Li, F. Wu, Y. Zhang and J. Ren. “Cross-Modal Federated Learning
  Among Unimodal Devices,” ACM IMWUT/Ubicomp, vol. 9, no. 3, article no. 78, 2025.'
