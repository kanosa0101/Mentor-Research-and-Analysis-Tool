bio_raw: '姓名：谌卫军

  职称：副教授

  邮箱：cwj@tsinghua.edu.cn

  教育背景

  2002年，在清华大学计算机系获工学博士学位

  1997年，在清华大学计算机系获工学硕士学位

  1995年，在厦门大学计算机系获工学学士学位

  工作履历

  2010.11 – 至今，清华大学计算机系任教

  2002.8 – 2010.10，清华大学软件学院任教

  2008.3 – 2008.9，美国加州大学圣地亚哥分校进修

  研究领域

  主要从事计算机基础教学、在线学习和教育教学技术等方面的研究工作

  奖励与荣誉

  2024年获“清华大学先进工作者”称号

  2024年获清华大学年度教学优秀奖

  2017年获清华大学年度教学优秀奖

  2012年获清华大学教学成果二等奖

  2011年获宝钢教育基金会优秀教师奖

  2010年获霍英东教育基金会第十二届高等院校青年教师奖

  2008年获“清韵烛光”第一届清华大学“我最喜爱的老师”评选活动“十佳教师”称号

  2007年获清华大学青年教师教学优秀奖

  2007年获北京市高校第五届青年教师教学基本功比赛一等奖

  2006年获清华大学第二届青年教师教学基本功比赛一等奖

  所授课程

  本科学科基础课“计算机程序设计基础”

  全校性选修课“Java语言程序设计”

  全校性选修课“操作系统”

  本科专业基础课“Java程序设计与训练”

  编写的教材和参考书

  1. 谌卫军编著，操作系统（第2版），清华大学出版社，2022年9月

  2. 谌卫军、王浩娟编著，Java程序设计，清华大学出版社，2016年7月

  3. 谌卫军、王浩娟编著，操作系统，清华大学出版社，2012年5月

  4. 谌卫军编著，计算机语言与程序设计，清华大学出版社，2007年9月

  5. 陈渝，谌卫军译，操作系统设计与实现（第三版），电子工业出版社，2007年3月

  6. 魏洪兴、谌卫军、康一梅、陈友东编著，嵌入式系统设计师教程，清华大学出版社，2006年8月'
