  教育背景

  2004-2007 香港中文大学 博士

  2001-2004 武汉理工大学 硕士

  1997-2001 武汉理工大学 本科

  所教课程

  00240332 深度学习导论

  00240332 神经与认知计算

  80240743 深度学习

  40240982 深度学习与金融数据分析

  研究领域

  人工神经网络，计算神经科学

  研究概况

  目前我主要专注于两个研究方向。首先是深度学习模型的对抗攻击与防御。我们致力于在数字世界和物理世界中构建对抗样本，以此揭示深度学习模型存在的安全漏洞与潜在风险。同时，我们也在探索如何构建更具鲁棒性的深度学习模型。其次是脑启发的计算模型。我们正在开发新型模型以突破现有深度学习技术的局限（包括上述安全漏洞问题）。为实现这一目标，我们与神经科学家展开合作，通过解析小鼠大脑的神经连接图谱，模拟动物大脑的各种生理功能。已经在国际期刊和国际会议上发表论文100余篇，谷歌引用3万余次。

  所获奖励

  2021 吴文俊人工智能自然科学奖一等奖（排名第3）：鲁棒高效的深度学习理论与方法

  2020年清华大学第九届青年教师教学大赛（工科组）一等奖

  2019 吴文俊人工智能自然科学奖二等奖（排名第1）：脑启发的计算模型理论与方法

  2011 教育部自然科学一等奖（排名第3）：神经动力学优化模型及应用

