bio_raw: '姓名：王鑫

  职称：副研究员

  邮箱：xin_wang@tsinghua.edu.cn

  个人网站：

  http://mn.cs.tsinghua.edu.cn/xinwang/

  教育背景

  学士 (计算机科学与技术), 浙江大学, 中国

  博士 (计算机科学与技术), 浙江大学, 中国

  博士 (计算科学), 西蒙弗雷泽大学, 加拿大

  工作履历

  博士后（计算机科学与技术），清华大学，中国，2017.7-2020.1

  教师（计算机科学与技术系），清华大学，中国，2020.1-至 今

  研究领域

  多媒体智能，媒体大数据分析，机器学习

  研究概况

  王鑫，清华大学计算机系副研究员，国家优秀青年科学基金获得者（2023-2025）。中国计算机学会多媒体专委会副秘书长，清华大学博士后校友会秘书处副秘书长。作为项目/课题负责人承担国家自然科学基金、科技部重点研发计划等项目，获2020年度ACM中国新星奖、2022年度IEEE
  TCMC新星奖、2023年度达摩院青橙奖、2024年度蚂蚁InTech科技奖、2025年度中国图象图形学学会自然科学一等奖（排1）、2023年度国家自然科学二等奖（排4）、2022年度教育部自然科学一等奖（排4）。主要研究方向为多媒体智能、媒体大数据、机器学习等，担任IEEE
  Transactions on Multimedia 和IEEE Transactions on Circuits and Systems for Video
  Technology编委，4次获IEEE ICME、ACM Multimedia Asia等最佳论文奖，在IEEE TPAMI、ICML、NeurIPS、ACM
  Multimedia等相关领域顶级国际期刊/会议上发表论文200余篇。'
