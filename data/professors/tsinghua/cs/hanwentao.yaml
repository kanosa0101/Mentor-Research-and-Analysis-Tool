bio_raw: '姓名：韩文弢

  职称：讲师

  邮箱：hanwentao@tsinghua.edu.cn

  个人主页：

  https://pacman.cs.tsinghua.edu.cn/~hanwentao/

  教育背景

  2004-2008，清华大学，计算机科学与技术专业，工学学士

  2008-2015，清华大学，计算机科学与技术专业，工学博士

  开设课程

  00240074，数据结构，全校非计算机专业任选课

  00240362，计算思维，全校通识课

  20740073/20740102，计算机程序设计基础，全校非计算机专业基础课

  30240522，程序设计训练（Rust语言），计算机专业必修课

  30240593，计算机系统概论，计算机专业必修课

  40240972，专业实践，计算机专业必修课

  研究领域和概况

  计算机系统，特别是大数据处理系统和机器学习系统，在计算机系统相关国际期刊和会议 USENIX ATC、EuroSys、SIGMOD、ACM TOS等发表论文10余篇

  获奖情况

  西贝尔学者（Siebel Scholar），2010年10月

  清华大学林枫辅导员奖，2017年12月

  清华大学宣传工作先进个人，2018年3月

  清华大学优秀招生教师，2020年9月

  第七届中国国际“互联网+”大学生创新创业大赛优秀创新创业导师，2021年10月

  2017-2021年度北京高校优秀德育工作者，2022年1月

  2022年度英特尔中国学术英才计划荣誉学者，2022年9月

  清华大学第十届青年教师教学大赛工科组二等奖，2022年12月

  清华大学教学成果奖，一等奖3项，2021年8月；二等奖1项，2016年7月

  北京市高等教育教学成果奖，一等奖，2022年9月

  高等教育（本科）国家级教学成果奖，二等奖，2023年7月

  社会服务

  中国计算机学会全国青少年信息学奥林匹克竞赛（CCF NOI）科学委员会，委员，2019年2月-2022年2月；副主席，2022年3月至今

  中国科协“英才计划”计算机学科工作委员会，委员，2020年12月至今

  其他

  指导清华大学学生算法协会

  指导清华大学学生超算团队'
