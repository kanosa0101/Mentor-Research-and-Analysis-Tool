bio_raw: '姓名：韩旭

  职称：助理研究员

  邮箱：han-xu@mail.tsinghua.edu.cn

  个人主页：

  https://thucsthanxu13.github.io/

  教育背景

  学士（计算机科学与技术）, 清华大学, 中国, 2017

  博士（计算机科学与技术）, 清华大学, 中国, 2022

  研究领域

  智能计算系统，人工智能，知识计算

  研究概况

  主要在智能计算系统、人工智能、知识计算开展研究工作，在相关领域会议及期刊发表论文数十篇，Google Scholar他引9000余次。创建大模型开源社区OpenBMB，相关开源项目在全球最大开源社区Github累计获得6万余星标。相关成果曾获教育部自然科学一等奖(第三完成人)、世界互联网大会领先科技奖（第三完成人）、英特尔中国学术成就奖（第三完成人）。曾入选中国计算机学会（CCF）优博激励计划、博士后创新人才支持计划、清华大学水木学者计划、清华大学优秀博士后。'
