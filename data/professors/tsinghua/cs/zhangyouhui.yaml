  研究领域

  高性能处理器微体系结构、类脑计算芯片与基础软件

  讲授课程

  汇编语言程序设计：本科生课程；国家级精品课（2009）、首批国家级精品资源共享课（2016）、首批国家级一流本科课程（2020）、校精品课；

  计算机系统概论：本科生课程。

  教学概况

  主讲面向本科生的计算机系统方面核心课程。与系统课组其他授课老师（包括计算机组成原理、操作系统、编译、教学实验等）一起积极参与“面向计算机系统能力培养的课程体系改革”，获得高等教育国家级教学成果奖二等奖（2018年）和北京市高等教育教学成果奖一等奖（2017年）。

  相应的，进行相关课程的教学内容与体系创新，主讲的本科生课程《汇编语言程序设计》获得首批国家级精品资源共享课（2016）称号以及首批国家级一流本科课程（2020）称号。

  注重“教研相长”理念，开展科研育人（本科生作为主力参加处理器设计与流片）、实践育人（积极建设专业实践课程）。指导的博士研究生获得清华大学优秀博士毕业生称号（2020年）以及2020年度“中国计算机学会（CCF）优秀博士学位论文奖”。

  研究概况

  张悠慧，清华大学计算机系研究员、博导，北京市智源学者。

  开展新型处理器微体系结构与类脑计算基础软硬件研究。针对类脑智能计算系统因缺乏完备性理论支撑而导致的层次接口模糊、软硬件紧耦合等问题，提出受神经网络计算特征启发的
  “类脑计算完备性”、以及基于该完备性的软硬件去耦合类脑计算机层次结构与硬件基本原语，证明此类系统能够实现类脑智能计算的计算通用性、硬件完备性和编译可行性。该研究相关成果应用于面向通用人工智能的“天机”类脑芯片研发，解决了其工具链支持异构融合网络这一关键问题；基于该研究成果设计的高效支持此类硬件基本原语的“精简指令集”存算融合类脑芯片与基础软件，性能显著提升。后续提出“通用”类脑计算芯片与系统设计，并以类脑架构优势反哺通用处理器，设计融合类脑架构优势的通用计算和稀疏计算异构融合处理器，于22年和25年两次实验性流片返片成功。

  “类脑计算完备性”论文发表于NATURE（20年10月，是国内计算机系统结构方面首篇NATURE论文），获评2020年世界互联网大会主任特别推荐成果与全球人工智能十大进展（智源研究院）。“天机”芯片论文发表于NATURE（19年8月1日封面文章，是国内AI与芯片方面的首篇NATURE论文），被评为2019年国内十大科学进展、2019年世界互联网大会领先科技成果。成果还获得2024年Intel中国自然科学成就奖卓越研究奖、2022年计算机学会技术发明一等奖与日内瓦发明金奖等。

  以第一作者/通讯作者（包括共同）发表NATURE、ASPLOS、MICRO、PPoPP、DAC、NIPS、IEEE TC/TPDS等重要学术期刊、会议论文几十篇；申请专利20余项。

