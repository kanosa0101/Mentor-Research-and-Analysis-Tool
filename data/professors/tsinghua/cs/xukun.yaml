bio_raw: '姓名：徐昆

  职称：副教授

  邮箱：xukun@tsinghua.edu.cn

  个人主页：

  http://cg.cs.tsinghua.edu.cn/people/~kun/

  教育背景

  工学学士 (计算机科学与技术), 清华大学, 2005

  工学博士 (计算机科学与技术), 清华大学, 2009

  研究方向

  计算机图形学，真实感渲染，可微渲染，光线追踪

  研究概况

  主要从事计算机图形学和真实感渲染等领域的研究。在ACM SIGGRAPH, ACM TOG, IEEE TVCG等重要会议期刊发表论文40余篇。担任Computers
  & Graphics编委，曾担任国际会议Pacific Graphics程序委员会共同主席（2015年）。获国家自然科学奖二等奖一项（排名4），国家科技进步奖二等奖一项（排名4），中国计算机学会优秀博士学位论文奖，入选中国科协“青年人才托举工程”。近年来，主要围绕蒙特卡洛光线追踪的理论、方法、可微计算和系统方面开展持续性研究，研发了高性能光线追踪渲染平台LuisaRender。

  学术成果

  1. Shaokun Zheng, Xin Chen, Zhong Shi, Ling-Qi Yan, and Kun Xu. GPU Coroutines for
  Flexible Splitting and Scheduling of Rendering Tasks. ACM Transactions on Graphics,
  43(6), 281:1 – 281:24, 2024.

  2. Jiankai Xing, Zengyu Li, Fujun Luan, Kun Xu. Differentiable Photon Mapping using
  Generalized Path Gradients. ACM Transactions on Graphics, 43(6), 257:1 – 257:15,
  2024.

  3. Difei Yan, Shaokun Zheng, Ling-Qi Yan, Kun Xu. Filtering-Based Reconstruction
  for Gradient-Domain Rendering. SIGGRAPH Asia, 2024.

  4. Jiankai Xing, Xuejun Hu, Fujun Luan, Ling-Qi Yan, Kun Xu. Extended Path Space
  Manifolds for Physically Based Differentiable Rendering. SIGGRAPH Asia, 2023.

  5. Zheng-Jun Du, Liang-Fu Kang, Jianchao Tan, Yotam Gingold, Kun Xu. Image vectorization
  and editing via linear gradient layer decomposition. ACM Transactions on Graphics,97:1
  – 97:13, 2023.

  6. Shaokun Zheng, Zhiqian Zhou, Xin Chen, Difei Yan, Chuyan Zhang, Yuefeng Geng,
  Yan Gu, Kun Xu. LuisaRender: A High-Performance Rendering Framework with Layered
  and Unified Interfaces on Stream Architectures. ACM Transactions on Graphics 41(6),
  232:1-232:19, 2022.

  7. Jiankai Xing, Fujun Luan, Ling-Qi Yan, Xuejun Hu, Houde Qian, Kun Xu. Differentiable
  Rendering using RGBXY Derivatives and Optimal Transport. ACM Transactions on Graphics
  41(6), 189:1-189:13, 2022.

  8. He Li, Beibei Wang, Changehe Tu, Kun Xu, Nicolas Holzschuch, Ling-Qi Yan. Unbiased
  Caustics Rendering Guided by Representative Specular Path. SA ''22: SIGGRAPH Asia
  2022 Conference Papers, 41:1-41:8, 2022.

  9. Yili Wang, Xin Li, Kun Xu, Dongliang He, Qi Zhang, Fu Li, Errui Ding. Neural
  Color Operators for Sequential Image Retouching. In Proceedings of the European
  Conference on Computer Vision (ECCV), 38-55, 2022.

  10. Dongyu She, Kun Xu. An Image-to-video Model for Real-Time Video Enhancement.
  In Proceedings of the 30th ACM International Conference on Multimedia, 1837 - 1846,
  2022.

  11. Duan Gao, Haoyuan Mu, Kun Xu. Neural Global Illumination: Interactive Indirect
  Illumination Prediction under Dynamic Area Lights. IEEE Transactions on Visualization
  and Computer Graphics (early access, online), 2022.

  12. Shaokun Zheng, Fengshi Zheng, Kun Xu, Ling-Qi Yan. Ensemble Denoising for Monte
  Carlo Renderings. ACM Transactions on Graphics 40(6), 274:1 - 274:17, 2021.

  13. Hanggao Xin, Zhiqian Zhou, Di An, Ling-Qi Yan, Kun Xu, Shi-Min Hu, and Shing-Tung
  Yau. Fast and Accurate Spherical Harmonics Products. ACM Transactions on Graphics
  40(6), 280:1-280:14, 2021.

  14. Zheng-Jun Du, Kai-Xiang Lei, Kun Xu, Jianchao Tan, Yotam Gingold. Video Recoloring
  via Spatial-Temporal Geometric Palettes. ACM Transactions on Graphics, 40(4), 150:1-150:16,2021.

  15. Dongyu She, Yu-Kun Lai, Gaoxiong Yi, Kun Xu. Hierarchical Layout-Aware Graph
  Convolutional Network for Unified Aesthetics Assessment. In Proceedings of IEEE
  CVPR, 2021.

  16. Duan Gao, Guojun Chen, Yue Dong, Pieter Peers, Kun Xu, Xin Tong. Deferred Neural
  Lighting: Free-viewpoint Relighting from Unstructured Photographs. ACM Transactions
  on Graphics, 39(6), 1:1-1:15, 2020.

  17. Hanggao Xin, Shaokun Zheng, Kun Xu, Ling-Qi Yan. Lightweight Bilateral Convolutional
  Neural Networks for Interactive Single-bounce Diffuse Indirect Illumination, IEEE
  Transactions on Visualization and Computer Graphics (early access, online), 2020.'
