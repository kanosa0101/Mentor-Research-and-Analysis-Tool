  研究概况

  自1999年4月从中国科学院计算所获得博士学位以来，先后在北京大学计算机系任讲师，在加拿大西蒙弗雷泽大学（SFU）、美国伊利诺伊大学（UIUC）及明尼苏达大学（UMN）进行访问研究，现为清华大学计算机系长聘教授。主要研究领域为数据挖掘及知识发现。曾担任北京智源研究院智源学者，江苏省大数据安全与智能处理重点实验室首届学术委员会副主任，IEEE
  ICDM’19、WISE’15、BioMedCom''14、WAIM’13、ADMA’11、NDBC’10等会议的程序委员会联合主席、以及IEEE TKDE、ACM
  TKDD、Journal of Alzheimer''s Disease、Journal of Personalized Medicine和《软件学报》等期刊的编委。获得WWW’08的best
  posters award、2009年度和2010年度HP实验室创新研究奖以及教育部2013年度自然科学奖二等奖。入选2007年度教育部“新世纪优秀人才”支持计划、2009年度日本大川研究基金资助计划、2017年度的国际电器与电子工程师协会会士（IEEE
  Fellow）和中国人工智能学会首批会士（CAAI Fellow）。'
