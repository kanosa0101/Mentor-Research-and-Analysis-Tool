bio_raw: '姓名：钱学海

  职称：长聘教授

  邮箱：xuehaiq@tsinghua.edu.cn

  主页：

  https://alchem.cs.tsinghua.edu.cn

  教育背景

  博士（计算机科学），伊利诺伊大学香槟分校，美国，2013

  硕士（计算机科学与技术），中科院计算所，中国，2007

  学士（计算机科学与技术），北京航空航天大学，中国，2004

  工作履历

  2024.7至今 清华大学长聘教授

  2022.8-2024.6 美国普渡大学副教授

  2015.8-2022.8 美国南加州大学助理教授

  2013.9-2015.5 美国加州大学伯克利分校博士后

  社会兼职

  SCIENCE CHINA (Information Sciences) ，编委 （2023年至今）

  IEEE Transactions on Parallel and Distributed System Special Issue on Machine-Learning
  Architecture and Accelerators， 客座主编（2019年）

  研究领域

  计算机体系结构，计算机系统，硬件安全

  研究概况

  钱学海长期从事并行计算机体系结构、软硬件结合的领域定制加速体系结构相关领域的研究。主要围绕针对图计算和机器学习的加速体系结构与系统，基于原子块的缓存一致性协议，以及基于弱存储模型并行调试体系结构支持方面进行了系统深入的研究，取得了一系列有影响力的原创性成果。其研究成果彻底解决了支持所有弱存储模型的确定性重放的开放问题；系统地优化了分布式图计算和机器学习体系结构和系统的数据移动和通信，大幅提升性能；并通过结构化矩阵的方法同时获得对深度学习模型压缩和高效硬件执行。作为第一作者或通讯作者在本领域的高水平学术期刊或会议上发表多篇有重大影响力的学术论文，进入所有四个计算机体系结构顶级会议(ISCA,ASPLOS,MICRO,HPCA)“名人堂”
  （Hall of Fame）。其中2017发表的基于存内计算模型训练体系结构论文已经被引近800次，七篇论文引用超过200次。2019年获得美国首届华人计算机新星奖（英文全称American
  Chinese Scholar In Computing Rising Star Award，当年两人获奖）、2018年获美国自然科学基金职业成就奖（NSF CAREER
  Award），此奖项专注选拔全美有潜力成为研究和教育领域领导者的年轻教授。其任职8年来，获得6项美国自然科学基金项目、2项企业合作项目支持。其博士生先后被南加州大学提名微软博士奖学金、微软Lovelace研究奖学金和Meta博士奖学金。一名博士在2021年获得Meta博士奖学金（机器学习系统研究方向，资助率小于1%）并在2020年获得该奖学金的finalist（在全球超过2000名申请者中小于2.5%）。

  奖励与荣誉

  MICRO Hall of Fame，2021年

  ISCA Hall of Fame，2021年

  HPCA Hall of Fame，2019年

  美国首届华人计算机新星奖， 2019年

  IEEE高级会员，2019年

  ASPLOS Hall of Fame, 2018年

  美国自然科学基金青年成就奖(CAREER Award), 2018年

  伊利诺伊大学计算机系W.J. Poppelbaum Memorial Award, 2013年

  学术成果

  1. Jingji Chen, Xuehai Qian. Khuzdul: Efficient and Scalable Distributed Graph Pattern
  Mining Engine. In Proceedings of 28th International Conference on Architectural
  Support for Programming Languages and Operating Systems (ASPLOS’23)

  2. Jingji Chen, Xuehai Qian. DecoMine: A Compilation-based Graph Pattern Mining
  System with Pattern Decomposition. In Proceedings of 28th International Conference
  on Architectural Support for Programming Languages and Operating Systems (ASPLOS’23)

  3. Gengyu Rao, Jingji Chen, Jason Yik, Xuehai Qian. SparseCore: Stream ISA and Processor
  Specialization for Sparse Computation. In Proceedings of 27th International Conference
  on Architectural Support for Programming Languages and Operating Systems (ASPLOS’22)

  4. Jinglei Cheng, Haoqing Deng, Xuehai Qian. AccQOC: Accelerating Quantum Optimal
  Control Based Pulse Generation. In Proceedings of the 47th International Symposium
  on Computer Architecture (ISCA’20)

  5. Youwei Zhuo, Jingji Chen, Qinyi Luo, Yanzhi Wang, Hailong Yang, Depei Qian, Xuehai
  Qian. SympleGraph: Distributed Graph Processing with Precise Loop-carried Dependency
  Guarantee. In Pro- ceedings of 41st ACM SIGPLAN Conference on Programming Language
  Design and Implementation (PLDI’20)

  6. Qinyi Luo, Jiaao He, Youwei Zhuo, Xuehai Qian. Prague: High-Performance Heterogeneity-
  Aware Asynchronouos Decentralized Training. In Proceedings of 25th International
  Conference on Architectural Support for Programming Languages and Operating Systems
  (ASPLOS’20)

  7. Qinyi Luo, Jinkun Lin, Youwei Zhuo, Xuehai Qian. HOP: Heterogeneity-Aware Decentralized
  Training. In Proceedings of 24th International Conference on Architectural Support
  for Programming Languages and Operating Systems (ASPLOS’19)

  8. Linghao Song, Xuehai Qian, Hai Li and Yiran Chen PipeLayer: A Pipelined ReRAM-Based
  Accelerator for Deep Learning. In Proceedings of The 23rd IEEE International Symposium
  on High- Performance Computer Architecture (HPCA’17)

  9. Xuehai Qian, Benjamin Sahelices and Josep Torrellas. OmniOrder: Directory-Based
  Conflict Serialization of Transactions. In Proceedings of The 41st International
  Symposium on Computer Architecture (ISCA’14)

  10. Xuehai Qian, Benjamin Sahelices, Josep Torrellas and Depei Qian. Volition: Precise
  and Scalable Sequential Consistency Violation Detection. In Proceedings of The 18th
  International Conference on Architectural Support for Programming Languages and
  Operating Systems (ASPLOS’13)'
