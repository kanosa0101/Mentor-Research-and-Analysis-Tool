bio_raw: '姓名：潘捷

  职称：助理研究员

  邮箱：jpan@tsinghua.edu.cn

  教育背景

  工学学士（生物工程），马里兰大学，美国，2010

  工学硕士（生物工程），马里兰大学，美国，2012

  工学博士（计算机科学与技术），清华大学，中国，2021

  研究领域

  向量数据库技术和系统，时空大数据处理

  学术成果

  1. James Pan and Guoliang Li. “Fast and scalable ridesharing search”. In: IEEE Transactions
  on Knowledge and Data Engineering (TKDE) (2024).

  2. James Pan, Jianguo Wang, and Guoliang Li. “Survey of vector database management
  systems”. In: VLDB Journal (2024).

  3. James Pan, Jianguo Wang, and Guoliang Li. “Vector Database Management Techniques
  and Systems”. In: Companion of the 2024 International Conference on Management of
  Data. 2024, pp. 597–604.

  4. James Pan, Guoliang Li, and Yong Wang. “Evaluating ridesharing algorithms using
  the Jargo real-time stochastic simulator (Demo)”. In: Proceedings of the VLDB Endowment
  13.12 (2020), pp. 2905–2908.

  5. James Pan, Guoliang Li, and Juntao Hu. “Ridesharing: Simulator, benchmark, and
  evaluation”. In: Proceedings of the VLDB Endowment 12.11 (2019), pp. 1085–1098.

  6. Arthur Johnson, Samantha Jones, James Pan, and Jafar Vossoughi. “Variation of
  respiratory resistance suggests optimization of airway caliber”. In: IEEE Transactions
  on Biomedical Engineering (TBME) 59.8 (2012), pp. 2355–2361.

  7. Arthur Johnson, Jafar Vossoughi, and James Pan. “Calibration of an airflow perturbation
  device (APD)”. In: AMSE Journal of Medical Devices 6.1 (2012).'
