bio_raw: '姓名：全成斌

  职称：研究员

  电话：72213

  邮件：quancb@tsinghua.edu.cn

  教育背景

  1996，东北师范大学，学士

  2001，中科院沈阳计算所，硕士

  2004，东北大学，博士

  研究领域

  计算机网络体系结构关键技术、交换网络理论、高速计算机网络核心设备、网络安全等，同时研究计算机实验教学体系和教学方法

  研究概况

  长期从事计算机网络体系结构理论研究和实践，重点研究领域是计算机网络体系结构关键技术、交换网络理论、高速计算机网络核心设备、网络安全等，同时研究计算机实验教学体系和教学方法，从事数字逻辑和计算机网络等课程及实验教学。曾负责和参加多项国家高技术研究发展计划（863计划）、国家自然科学基金、中国下一代互联网计划（CNGI）重大项目。

  奖励与荣誉

  曾获国家科技进步二等奖；北京市高等教育教学成果奖二等奖2项；高等教育学会优秀自制实验教学设备一等奖2项；清华大学教学成果一等奖4项。

  部分科研成果

  IPv6核心路由器、100G核心路由器'
