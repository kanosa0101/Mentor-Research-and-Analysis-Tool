  研究概况

  近年来，我主要从事网络空间安全和新一代互联网体系结构方面的科研和教学工作，科研工作方面主要取得如下成果：

  1、可扩展、可重构的高性能路由交换技术研究方面：提出了可扩展开放式路由交换的技术思想，发明了支持路由交换设备高效级连的协处理器和功能构件的运行态组装机制和分配方法，设计了轻量级节点间通信机制，突破了路由交换平台在结构扩展、功能动态重构等方面的核心技术，改变了路由交换软件由国外大型设备厂商垄断的局面。成果获得2016年国家技术发明奖二等奖。技术应用于自主研制的中兴
  ZXR10 T8000 集群路由器，具有 2009 年全球最大的 246 Tbps 交换容量，应用于华为 S12700“敏捷”交换机，是全球首款通过 Miercom
  全可编程能力测试的设备。此外，研制了开放式集成开发环境，为不同网络设备制造商和第三方机构提供了统一开放平台，在全球 200 多家运营商和30余所高校应用，培养学生近5万名。

  2、互联网端到端传送真实可信关键技术研究：针对互联网设计实现不完备带来的信任缺失这一重大安全缺陷，从端系统数据产生真实可信、数据转发真实可信、复杂网络数据行为真实可信三个方面开展攻关，提出了“层间交互、语义一致的协议栈安全漏洞检测与防御方法”，“随机标识、层次验证的分组转发正确性检测机制”和“频域分析、交互图构造的传送连接可信检测技术”，系统解决了互联网端到端传送真实可信这一重大难题。成果获得2022年度中国电子学会科技进步一等奖。首次从协议层间交互语义一致的新角度，提出了针对分层网络模型的交互式安全性分析方法，揭示了经典TCP/IP协议栈存在多个共性缺陷模式，率先发现了4G
  LTE、5G、Wi-Fi、IPv4/IPv6、ICMPv4/ICMPv6、TCP、UDP、DNS等基础协议相关的多个隐蔽高危漏洞，向CVE、CNVD等组织披露协议交互式漏洞累计100余个，获得原创漏洞证明20余份，得到Wi-Fi联盟、Linux社区、FreeBSD社区、OpenWrt社区、高通、谷歌、华硕、华为、中国电信、中国联通、中国移动、阿里巴巴、360、小米、锐捷、新华三、腾达等30余个国际知名组织及厂商的确认和致谢。成果已实现产业化，近三年为华为、新华三、奇安信、比威等企业创造重大经济效益。成果在国家计算机网络与信息安全管理中心、蚂蚁智信（杭州）信息技术有限公司、中钞信用卡产业发展有限公司杭州区块链技术研究院等单位和企业得到应用，取得了重要社会效益。

  3、面向海量交易的分布式协同风险防御技术研究：针对新型网络风险这一危害国家安全和人民权益的社会治理难题，与蚂蚁集团合作，共同构建了国际领先、自主可控的端边云分布式协同风险防御系统，通过设计域内信任度数据共享系统、基于稳定分析的主动式后门攻击防御方法和风险数据生成方法，解决了复杂深度伪造场景下黑产风险高效识别的难题。提出了基于多类别信息的用户相似性确定方法和用户行为异常分析方法，全面精准挖掘交互对话风险。成果获得2022年度浙江省科技进步奖一等奖。

