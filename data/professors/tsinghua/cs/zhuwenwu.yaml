bio_raw: '姓名：朱文武

  职称：教授

  电话：010-62790967

  教育背景

  ：

  1985年 国防科学技术大学 学士学位

  1993年 伊利诺伊理工大学 硕士学位

  1996年 纽约大学 博士学位

  社会兼职：

  国家科学评论（NSR）编委 （2024-现在）

  中国图象图形学报领域主编 （2020-现在）

  电子与信息学报编委（2021-现在）

  IEEE Transactions on Circuits and Systems for Video Technology主编（2024-2025）

  IEEE Transactions on Multimedia指导委员会主席 （2020-2022）

  IEEE Transactions on Multimedia主编（2017-2019）

  研究领域：

  多媒体信息处理、大数据分析等

  研究概况：

  长期从事多媒体信息处理、大数据分析等研究工作，担任大规模智能信息处理团队负责人，国家973计划项目首席科学家，国家基金委重大项目负责人。在多媒体信息处理方面取得多项创新科技成果，三次获国家自然科学二等奖（排1/2023年，排1/2018年，排2/2012年）、6次获省部级与一级学会一等奖。出版7本中英文著作，发表高水平国际论文400余篇，11次获IEEE及ACM等国际最佳论文奖，总引用49000余次，H-Index
  105。

  奖励与荣誉：

  2024年IEEE电路与系统学会Charles A. Desoer技术成就奖

  2023年ACM SIG多媒体杰出技术成就奖

  2023年国家自然科学二等奖（排1）

  2018年国家自然科学二等奖（排1）

  2012年国家自然科学二等奖（排2）

  IEEE Fellow（2010）

  SPIE Fellow （2013）

  AAAS Fellow（2016）

  ACM Fellow（2022）

  欧洲科学院（Academia Europaea）院士 （2018）

  IEEE Transactions on Circuits and Systems for Video Technology最佳论文奖（2001、2019）、ACM
  Multimedia最佳论文奖（2012）等

  代表性论文

  ：

  1. Wenwu Zhu, Chong Luo, Jianfeng Wang, Shipeng Li, “Multimedia Cloud Computing”,
  IEEE Signal Processing Magazine, May 2011. (Highly cited paper)

  2. Wenwu Zhu, Xin Wang, Wen Gao, Multimedia Intelligence: When Multimedia Meets
  Artificial Intelligence, IEEE Trans. Multimedia 22(7): 1823-1835, 2020 (invited
  paper)

  3. Wenwu Zhu, Xin Wang, Peng Cui, Deep learning for learning graph representations,
  Deep learning: concepts and architectures, 169-210, 2020.

  4. Wenwu Zhu, Xin Wang, Hongzhi Li, Multi-Modal Deep Analysis for Multimedia. IEEE
  Trans. Circuits Syst. Video Technol., 30 (10): 3740-3764, 2019.

  5. Wenwu Zhu, Peng Cui, Zhi Wang, Gang Hua, Multimedia Big Data Computing, IEEE
  Multimedia 22(3): 96-c3 (2015) (invited paper)

  6. Daixin Wang, Peng Cui, Wenwu Zhu, Structural Deep Network Embedding. ACM KDD
  2016: 1225-1234. (3700 citations in Google Scholar)

  7. Mingdong Ou, Peng Cui, Jian Pei, Ziwei Zhang, Wenwu Zhu, Asymmetric transitivity
  preserving graph embedding, ACM SIGKDD 2016: 1105-1114. (1700 citations in Google
  Scholar)

  8. Baochun Li, Zhi Wang, Jiangchuan Liu, Wenwu Zhu. “Two Decades of Internet Video
  Streaming: A Retrospective View,” ACM Transactions on Multimedia Computing Communications
  and Applications, Special Issue on the 20th Anniversary of ACM Multimedia, vol.
  9, no. 1s, pp. 33–52, October 2013.

  9. Zhi Wang, Wenwu Zhu, Xiangwen Chen, Lifeng Sun, Jiangchuan Liu, Minghua Chen,
  Peng Cui, Shiqiang Yang. “Propagation-Based Social-Aware Multimedia Content Distribution,”
  ACM Transactions on Multimedia Computing Communications and Applications, vol. 9,
  no. 1s, pp. 53–72, October 2013. (ACM Multimedia 2012 best paper award)

  10. Dapeng Wu, Yiwei Thomas Hou, Wenwu Zhu, Ya-Qin Zhang, Jon M Peha, Streaming
  video over the Internet: approaches and directions, IEEE Transactions on circuits
  and systems for video technology 11 (3), 282-300, 2001. (Most cited paper 2001,
  1200 citations in Google Scholar)'
