bio_raw: '姓名：张松海

  职称：教授

  电话：62797001-808

  邮箱：shz@tsinghua.edu.cn

  教育背景

  工学学士 (计算机科学与技术), 清华大学, 中国, 2001

  工学硕士 (计算机科学与技术), 清华大学, 中国, 2004

  工学博士 (计算机科学与技术), 清华大学, 中国, 2007

  研究领域

  计算机图形学与虚拟现实、图像/视频处理

  讲授课程

  春季学期：数据可视化（研究生专业课，2014年至今）

  秋季学期：媒体计算与艺术表现（研究生专业课，2010年至今）

  秋季学期：虚拟现实技术（本科专业选修课，2019年至今）

  研究概况

  主要研究领域为计算机图形学与虚拟现实、生成式人工智能，具体方向包括三维内容生成、三维场景合成、VR交互等；近五年（2021年以来）在IEEE TPAMI、IEEE
  TVCG、IEEE TIP、ACM SIGGRAPH、CVPR、ICCV、IEEE VR、ACM MM等CCF-A类期刊和会议上发表论文50余篇，获得虚拟现实顶会IEEE
  VR最佳论文提名奖两项；作为负责人承担国家重点研发计划项目1项，国家自然科学基金委重点/国际项目2项；获国家科技进步二等奖1项（2018，排名第三）。现任中国电子学会虚拟现实分会副主任，中国计算机学会科技成果奖励委员会主任助理，中国工业与应用数学学会几何设计与计算专委会秘书长。

