  2022.02至今 清华大学计算机科学与技术系 研究员

  研究方向

  ：计算机视觉、计算机博弈、人机交互学习

  研究概况

  ：我的研究工作主要围绕智能感知与决策方向展开：在智能感知方向，早期研究主要关注无约束条件下的视觉目标检测、配准、跟踪、分割、识别等任务，近年来开始尝试融合多模态信息进行复杂态势信息感知与分析；在智能决策方向，针对复杂系统决策问题存在的难建模、难计算、难解释挑战，通过结合传统博弈理论方法对问题进行表示建模、最新机器学习算法技术对模型进行近似求解，以及人机交互过程对模型进行分析解释，逐渐形成了博弈交互学习的研究路线。相关研究工作在CCF-A类国际会议和刊物上发表论文100余篇、谷歌学术引用超过24000次，其中人像属性关系感知算法获CCF-A类国际会议ACM
  Multimedia 2013最佳论文奖、无锚点单阶段在线多物体跟踪算法获计算机视觉领域重要国内会议PRCV 2020最佳论文奖、大规模不完美信息博弈算法AlphaHoldem获CCF-A类国际会议AAAI
  2022卓越论文奖，手势运动语义迁移合成算法获CCF-A类国际会议ACM Multimedia 2023创新论文奖。研发的智能感知与决策算法十余次在国内外重要技术竞赛中获奖，并多次在重要实际应用场景中得到验证和大规模落地应用。

  讲授课程

  ：

  《计算机视觉》：清华大学，研究生课程，48学时，2024年春季学期至今

  《程序设计基础》：清华大学，本科生课程，48学时，2023年秋季学期至今

  《博弈论》：中国科学院大学，本科生课程，20学时，2024年春季学期

  《计算博弈原理与应用》：中国科学院大学，研究生课程，40学时，2019年秋季学期-2023年秋季学期

  《博弈论》：中国科学院大学，研究生课程，20学时，2017年春季学期~2019年春季学期

