bio_raw: "姓名：王宏宁\n职称：副教授\n邮箱：hw-ai@tsinghua.edu.cn\n主页：https://www.cs.virginia.edu/~hw5x/\n\
  教育背景\n博士（计算机科学），伊利诺伊大学香槟分校，美国，2014\n硕士（计算机科学与技术），清华大学，中国，2009\n学士（计算机科学与技术），清华大学，中国，2007\n\
  工作履历：\n2023.9至今 清华大学计算机系长聘副教授\n2022.12-2023.8 美国弗吉尼亚大学Copenhaver讲席副教授\n2020.8-2022.11\
  \ 美国弗吉尼亚大学长聘副教授\n2014.8-2020.7 美国弗吉尼亚大学准聘助理教授\n社会兼职：\nACM Transactions on Intelligent\
  \ Systems and Technology (TIST), 编委 （2022年至今）\nFrontiers in Big Data，编委 （2021年至今）\n\
  ACM SIGIR Conference on Research and Development in Information Retrieval大会共同主席\
  \ （2024年）\nACM SIGKDD Conference On Knowledge Discovery And Data Mining大会研讨会共同主席（2022年，2023年）\n\
  AAAI Conference on Artificial Intelligence领域主席（2022年至今）\nInternational Joint Conferences\
  \ on Artificial Intelligence领域主席(2023年)\nACM SIGKDD Conference On Knowledge Discovery\
  \ And Data Mining领域主席（2022年至今）\nThe Web Conference领域主席（2020年至今）\n研究领域：\n机器学习，信息检索，数据挖掘\n\
  研究概况：\n团队的研究着眼于创立具有完备理论性质与高效实用性能的强化学习方法以解决个性化决策问题。近年来我们以交互式在线学习方法构建个性化信息检索与推荐的理论分析与证明框架；在此理论基础上针对可解释性及隐私保护等重要问题设计和优化个性化算法；并将其提出的理论与算法在众多实际系统中成功应用。团队的研究开创了多项全新的技术方法，包括基于深度模型的在线排序学习方法和基于隐变量概率模型的用户潜在意图理解与建模方法。这些方法在大规模信息检索与推荐系统、在线教育与医疗、物联网信息集成与服务等重要场景中获得成功应用并创造社会价值。相关工作发表论文140余篇（主要集中于领域内顶级会议，如NeurIPS,\
  \ ICML, ICLR, KDD, SIGIR等），曾获得SIGIR2019最佳论文奖、WWW2021和BuildSys2018最佳论文奖提名。研究课题曾获8项美国自然科学基金项目（包括青年成就奖）、1项美国能源部基金项目和多项企业合作支持(Google,\
  \ Meta等)。研究团队博士毕业生中3人已成为美国知名研究型大学准聘助理教授（宾夕法尼亚州立大学信息学院2人，俄勒冈州立大学电气工程与计算机科学系1人）。博士后1人出站成为印度理工计算机科学系准聘助理教授。\n\
  奖励与荣誉：\nConference on Neural Information Processing Systems最佳审稿人，2022年\nInternational\
  \ Conference on Learning Representations杰出审稿人, 2021年\n谷歌公司全美教师研究奖（信息检索领域），2020年\n\
  微软研究院全美教师科研成就奖，入围前十名，2020年\nACM SIGIR Conference on Research and Development in\
  \ Information Retrieval最佳论文奖, 2019年\n美国自然科学基金青年成就奖(CAREER Award), 2016年\n学术成果：\n\
  1. Fan Yao, Chuanhao Li, Karthik Abinav Sankararaman, Yiming Liao, Yan Zhu, Qifan\
  \ Wang and\nHongning Wang\n, Haifeng Xu. \uFEFFRethinking Incentives in Recommender\
  \ Systems: Are Monotone Rewards Always Beneficial? Thirty-Seventh Conference on\
  \ Neural Information Processing Systems (NeurIPS'2023), 2023.\n2. Zhepei Wei, Chuanhao\
  \ Li, Haifeng Xu and\nHongning Wang\n. Incentivized Communication for Federated\
  \ Bandits. Thirty-Seventh Conference on Neural Information Processing Systems (NeurIPS'2023),\
  \ 2023.\n3. Xiaoying Zhang, Junpu Chen,\nHongning Wang\n, Hong Xie, Hang Li. \uFEFF\
  Uncertainty-Aware Off-Policy Learning. Thirty-Seventh Conference on Neural Information\
  \ Processing Systems (NeurIPS'2023), 2023.\n4. Fan Yao, Chuanhao Li, Denis Nekipelov,\n\
  Hongning Wang\n, Haifeng Xu. \uFEFFHow Bad is Top-K Recommendation under Competing\
  \ Content Creators? The Fortieth International Conference on Machine Learning (ICML'2023),\n\
  Oral presentation\n, 2023.\n5. Lu Lin, Jinghui Chen and\nHongning Wang\n. \uFEFF\
  Spectral Augmentation for Self-Supervised Learning on Graphs. The Tenth International\
  \ Conference on Learning Representations (ICLR'2023),\nSpotlight presentation\n\
  , 2023.\n6. Chuanhao Li and\nHongning Wang\n. \uFEFFCommunication Efficient Federated\
  \ Learning for Generalized Linear Bandits. Thirty-sixth Conference on Neural Information\
  \ Processing Systems (NeurIPS'2022), 2022.\n7. Fan Yao, Chuanhao Li, Denis Nekipelov,\n\
  Hongning Wang\nand Haifeng Xu. \uFEFFLearning from a Learning User for Optimal Recommendations.\
  \ The Thirty-ninth International Conference on Machine Learning (ICML'2022), 2022.\n\
  8. Chuanhao Li and\nHongning Wang\n. \uFEFFAsynchronous Upper Confidence Bound Algorithms\
  \ for Federated Linear Bandits. The 25th International Conference on Artificial\
  \ Intelligence and Statistics (AISTATS'2022), p6529-6553, 2022.\n9. Yiling Jia,\
  \ Huazheng Wang, Stephen Guo and\nHongning Wang\n. PairRank: Online Pairwise Learning\
  \ to Rank by Divide-and-Conquer. The Web Conference 2021 (WWW'2021), p146-157, 2021.\
  \ Nominated for the Best Paper Award\n10. Huazheng Wang, Sonwoo Kim, Eric McCord-Snook,\
  \ Qingyun Wu and\nHongning Wang\n. Variance Reduction in Gradient Exploration for\
  \ Online Learning to Rank. The 42nd International ACM SIGIR Conference on Research\
  \ and Development in Information Retrieval (SIGIR 2019), p835-844, 2019. Best Paper\
  \ Award\n完整论文列表参见：https://www.cs.virginia.edu/~hw5x/publications.html"
