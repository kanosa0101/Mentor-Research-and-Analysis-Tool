bio_raw: '姓名：崔鹏

  职称：副教授

  电话：62790810

  邮箱：cuip@tsinghua.edu.cn

  个人主页：

  http://pengcui.thumedialab.com/

  教育经历

  博士学位（计算机科学与技术专业），清华大学，2005.7 – 2010.1

  学士学位（计算机科学与技术专业），北京科技大学，2001.9 – 2005.7

  研究概况

  国家自然科学基金委杰出青年科学基金获得者，IEEE Fellow，ACM杰出科学家。研究领域为人工智能与大数据分析理论方法和关键技术，首次将因果统计思想与机器学习框架进行融合性研究，自主提出并发展了因果启发的稳定学习理论方法体系，受邀在Nature子刊Nature
  Machine Intelligence上发表特邀前瞻性观点论文，形成重要国际影响。相关成果在我国重要战略领域实现成功落地，并在智慧医疗、工业互联网等场景取得显著应用价值。在数据挖掘及人工智能领域顶级国际会议发表论文200余篇，先后7次获得国际会议或期刊最佳论文奖。担任IEEE
  TKDE、ACM TOMM、ACM TIST、IEEE TBD、KAIS等国际顶级期刊编委。曾获得2023年国家自然科学二等奖（排2）、2018年国家自然科学等奖（排2）、教育部自然科学一等奖（2次，排2）、中国计算机学会-IEEE计算机学会青年科学家奖；当选第九届中国科协全国委员会委员。

  获奖与荣誉

  2026年，IEEE Fellow

  2024年，入选国家自然科学基金委杰出青年科学基金

  2023年，国家自然科学二等奖（排名第二）

  2022年，教育部自然科学一等奖（排名第二）

  2020年，国际计算机协会（ACM）杰出科学家

  2018年，国家高端青年人才计划获得者

  2018年，国家自然科学二等奖（排名第二）

  2018年，中国计算机学会-IEEE计算机学会青年科学家奖

  2018年，IEEE Multimedia最佳专栏论文奖

  2017年，教育部自然科学一等奖（排名第二）

  2016年，中国电子学会自然科学一等奖

  2016年，IEEE ICDM最佳学生论文奖

  2016年，ACM KDD最佳论文候选

  2014年，北京市科技进步一等奖

  2014年，IEEE ICME最佳论文奖

  2014年，ACM KDD最佳论文候选

  2013年，Multimedia Modeling国际会议最佳论文奖

  2012年，ACM Multimedia重大技术挑战特别奖

  社会任职

  2024至今：中国计算机学会副秘书长，青年工作委员会主任

  2022至今：工信部人工智能伦理专家委员会委员

  2021至今：中国科协第十届全国代表大会代表

  2019至今：中国计算机学会理事

  2020-2021：中国计算机学会YOCSEF全国委员会主席

  2016-2021：中国科协第九届全国委员会委员

  2023至今：中国计算机学会大数据专家委员会常委兼副秘书长'
