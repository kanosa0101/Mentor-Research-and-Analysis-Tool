bio_raw: '姓名：章明星

  职称：副教授

  邮箱：zhang_mingxing@mail.tsinghua.edu.cn

  个人主页：

  http://madsys.cs.tsinghua.edu.cn/~zhangmx/

  教育背景

  学士, 北京邮电大学, 中国, 2012

  博士, 清华大学, 中国, 2017

  研究领域

  并行与分布式处理

  研究概况

  主要在计算机系统机构领域开展创新性和实用性相结合的研究工作，提出了系列新思路和新方法，相关成果在包括 OSDI、SOSP、ASPLOS、HPCA、FSE、VLDB、ATC、EuroSys
  等国际顶级会议和期刊上发表论文二十余篇。曾获ACM SIGSOFT 杰出论文奖，IEEE TCSC、ACM SIGOPS等组织颁发的优秀博士毕业论文奖。获得国家自然科学基金青年科学基金及博士后基金一等项目资助。博士毕业后进入清华大学与深信服联合培养的博士后计划，负责创新业务孵化，担任深信服首席算法技术专家，后任职创新研究院院长。2022年加入清华大学计算机系高性能所，任职教研系列助理教授。'
