bio_raw: '姓名：陆游游

  职称：副教授

  邮箱：luyouyou@tsinghua.edu.cn

  主页：

  http://storage.cs.tsinghua.edu.cn/~lu

  教育背景

  理学学士（计算机科学与技术），南京大学，中国，2009

  工学博士（计算机科学与技术），清华大学，中国，2015

  研究领域

  存储系统、人工智能系统

  研究概况

  研究方向为存储系统与人工智能系统。在闪存上，提出了基于裸闪存的“软件直管闪存”思想，后被称为Open-Channel SSD，2016年得到Linux操作系统支持，推动了业界闪存存储系统的变革；在内存上，基于RDMA与NVM提出了分布式持久共享内存的系统设计，在索引结构、缓存一致性、并发控制等方面提出了一系列技术，促进了内存池与分离式内存的产生与发展；研发了高性能文件系统SuperFS，部署于鹏城实验室的“鹏城云脑II”，自2023年起蝉联国际超算IO500排行榜第一名；在人工智能系统上，关注于人工智能系统中的数据存储和访问技术，在向量存储、超节点内存管理与调度等方面提出创新技术，多次获得顶级国际会议论文奖项。

  研究课题

  国家科技重大专项项目（新一代人工智能）：超大带宽域驱动的大模型架构与系统协同优化（2025-2028）

  国家重点研发计划项目（战略性科技创新合作重点专项）：机器学习使能的缓存系统结构与关键技术合作研究（2025-2027）

  国家自然科学基金重点项目：统一大内存并行计算体系结构研究（2024-2028）

  国家重点研发计划项目（青年科学家项目）：高性能并行存储系统的基础理论与方法研究（2022-2024）

  国家自然科学基金优秀青年基金项目：非易失存储系统（2021-2023）

  国家自然科学基金面上项目: 分布式闪存文件系统的高效构建技术研究（2018-2021）

  国家自然科学基金青年项目: 面向闪存特性的文件系统数据组织优化技术（2016-2016）

  奖励与荣誉

  2026年，FAST Distinguished Artifact Award

  2025年，Communications of ACM Research Highlight

  2023年，ACM SIGMOD Research Highlight Award

  2022年，清华大学最受师生关注的十大亮点成果

  2020年，入选国家自然科学基金委优秀青年基金

  2020年，CCF技术发明一等奖（排名第三）

  2020年，华为奥林帕斯奖（排名第二）

  2019年，ACM SIGOPS China新星奖

  2019年，教育部技术发明一等奖（排名第二）

  2017年，清华大学优秀博士后

  2016年，中国计算机学会优秀博士学位论文奖

  2015年，中国科协青年人才托举工程

  2015年，MSST最佳论文提名

  2014年，IEEE NVMSA最佳论文奖

  学术成果

  见：

  https://storage.cs.tsinghua.edu.cn/~lu/pub.html/'
