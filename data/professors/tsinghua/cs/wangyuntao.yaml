bio_raw: '姓名：王运涛

  职称：副研究员

  邮箱：yuntaowang@tsinghua.edu.cn

  教育经历

  2007.09-2011.07 工学学士，北京邮电大学 计算机科学与技术学院

  2011.09-2016.07 工学博士，清华大学 计算机科学与技术系

  工作经历

  2016.09-2019.01 清华大学 计算机科学与技术系 博士后

  2018.01-2021.03 华盛顿大学 计算机学院 访问助理教授/助理研究员

  2019.01-2022.12 清华大学 计算机科学与技术系 助理研究员

  2022.12-至今 清华大学计算机科学与技术系 副研究员

  研究领域

  人机交互、普适计算

  个人简介

  王运涛，清华大学计算机科学与技术系副研究员，研究方向为自然人机交互，提出建模自然动作交互固有人体动力学时空关联特性为贝叶斯先验实现检测与推理方法这一整体解决思路，创新低功耗、高性能的端侧交互行为与意图识别算法，支撑优越交互性能的用户终端产品上交互接口创新。承担国家自然科学基金面上与青年项目，国家重点研发计划课题等国家项目，发表学术论文80余篇，其中第一/通讯作者发表CCF
  A类论文30余篇，9次荣获国际会议奖项，包括CHI荣誉论文奖、UIC最佳论文奖等，获授权发明专利30余项，多项技术成果在华为、蚂蚁等国内头部企业落地应用。荣获中国科协青年人才托举工程、吴文俊人工智能青年科技奖、中国电子学会科学技术奖一等奖等奖励。担任CCF人机交互专委会秘书长，IMWUT期刊副主编，CHI、UIST会议领域副主席。

  部分获奖

  吴文俊人工智能青年科技奖（2024）

  中国计算机学会（CCF）人机交互专委青年科技激励计划（2024）

  北京市普通高校优秀毕业设计（论文）优秀指导教师（2024）

  清华大学青年教师教学比赛一等奖（2024）

  中国国际大学生创新大赛国赛金奖（2024，指导教师）

  国际计算机学会人机交互会议 ACM CHI Honorable Mentioned Award （2023）

  电气电子工程师协会虚拟现实会议IEEE VR Best Paper Nominee (2023)

  中国科协青年人才托举工程（2022）

  中国人工智能学会2021年度优秀科技成果奖（2021）

  中国电子学会科学技术奖一等奖（2019）

  代表性论文

  [1] Jiexin Ding, Bowen Zhao, Yuntao Wang#, Xinyun Liu, Rui Hao, Ishan Chatterjee,
  and Yuanchun Shi. Unknown Word Detection for English as a Second Language (ESL)
  Learners using Gaze and Pre-trained Language Models. In Proceedings of the 2025
  CHI Conference on Human Factors in Computing Systems, pp. 1-16. 2025.

  [2] Mingxuan Liu, Jiankai Tang, Yongli Chen, Haoxiang Li, Jiahao Qi, Siwei Li, Kegang
  Wang, Jie Gan, Yuntao Wang#, and Hong Chen#. "Spiking-PhysFormer: Camera-based remote
  photoplethysmography with parallel spike-driven transformer." Neural Networks 185
  (2025): 107128.

  [3] Zeyu Wang, Yuanchun Shi#, Yuntao Wang#, Yuchen Yao, Kun Yan, Yuhan Wang, Lei
  Ji, Xuhai Xu, and Chun Yu. "G-VOILA: gaze-facilitated information querying in daily
  scenarios." Proceedings of the ACM on Interactive, Mobile, Wearable and Ubiquitous
  Technologies 8, no. 2 (2024): 1-33.

  [4] Xiyuxing Zhang, Yuntao Wang#, Yuxuan Han, Chen Liang, Ishan Chatterjee, Jiankai
  Tang, Xin Yi, Shwetak Patel, and Yuanchun Shi. "The earsavas dataset: Enabling subject-aware
  vocal activity sensing on earables." Proceedings of the ACM on Interactive, Mobile,
  Wearable and Ubiquitous Technologies 8, no. 2 (2024): 1-26.

  [5] Zeyu Wang*, Xiyuxing Zhang*, Ruotong Yu*, Yuntao Wang#, Kenneth Christofferson,
  Jingru Zhang, Alex Mariakakis, and Yuanchun Shi. "DreamCatcher: A Wearer-aware Multi-modal
  Sleep Event Dataset Based on Earables in Non-restrictive Environments." Advances
  in Neural Information Processing Systems 37 (2024): 85155-85178.

  [6] Ziqi Gao*, Yuntao Wang*#, Jianguo Chen, Junliang Xing, Shwetak Patel, Xin Liu,
  and Yuanchun Shi. "MMTSA: Multi-modal temporal segment attention network for efficient
  human activity recognition." Proceedings of the ACM on Interactive, Mobile, Wearable
  and Ubiquitous Technologies 7, no. 3 (2023): 1-26.

  [7] Zisu Li*, Chen Liang*, Yuntao Wang#, Yue Qin, Chun Yu, Yukang Yan, Mingming
  Fan, and Yuanchun Shi. "Enabling voice-accompanying hand-to-face gesture recognition
  with cross-device sensing." In Proceedings of the 2023 CHI Conference on Human Factors
  in Computing Systems, pp. 1-17. 2023.

  [8] Yuntao Wang*, Zirui Cheng*, Xin Yi#, Yan Kong, Xueyang Wang, Xuhai Xu, Yukang
  Yan, Chun Yu, Shwetak Patel, and Yuanchun Shi. "Modeling the trade-off of privacy
  preservation and activity recognition on low-resolution images." In Proceedings
  of the 2023 CHI Conference on Human Factors in Computing Systems, pp. 1-15. 2023.

  [9] Yuntao Wang*, Jiexin Ding*, Ishan Chatterjee, Farshid Salemi Parizi, Yuzhou
  Zhuang, Yukang Yan#, Shwetak Patel, and Yuanchun Shi. "Faceori: Tracking head position
  and orientation using ultrasonic ranging on earphones." In Proceedings of the 2022
  CHI Conference on Human Factors in Computing Systems, pp. 1-12. 2022.

  [10] Yuntao Wang, Ao Yu, Xin Yi#, Yuanwei Zhang, Ishan Chatterjee, Shwetak Patel,
  and Yuanchun Shi. "Facilitating text entry on smartphones with QWERTY keyboard for
  users with Parkinson’s disease." In Proceedings of the 2021 CHI Conference on Human
  Factors in Computing Systems, pp. 1-12. 2021.'
