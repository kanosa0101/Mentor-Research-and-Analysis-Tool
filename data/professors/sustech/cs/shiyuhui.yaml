bio_raw: '史玉回

  讲席教授

  计算机科学与工程系

  E-mail:

  shiyh@sustech.edu.cn

  史玉回教授是国际计算智能领域专家，是头脑风暴优化算法创始人，美国电子电气工程师协会会士（IEEE Fellow）。

  史玉回教授1992年博士毕业于东南大学并留校任教，先后在美国、韩国、澳大利亚等地从事研究工作，在美国期间，曾与粒子群优化算法创始人James Kenney 和Russell
  Eberhart合作发表过多篇奠基性学术论文，是英文专著《群体智能》和《计算智能：从概念到实现》的作者之一。'
