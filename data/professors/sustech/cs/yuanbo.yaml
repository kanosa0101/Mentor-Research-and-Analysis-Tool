bio_raw: 'Brief Bio:

  Bo Yuan is a Tenure-track Assistant Professor at Department of Computer Science
  and Engineering, Southern University of Science and Technology (SUSTech), China.
  He received his B.Sc. and Ph.D. degrees from School of Information Science and Technology,
  University of Science and Technology of China (USTC), China, in 2009/06 and 2014/06
  respectively. During 2012/05 to 2013/04, he was a Visiting Scholar (funded by

  NICaiA

  ) at the Centre of Excellence for Research in Computational Intelligence and Applications
  (

  CERCIA

  ), School of Computer Science, University of Birmingham, UK. During 2014/06 to 2016/05,
  he was a Postdoctoral Fellow at School of Computer Science and Technology, USTC,
  China. During 2016/06 to 2017/02, he was an Associate Researcher at School of Computer
  Science and Technology, USTC, China.During 2017/03 to 2019/12, he was a Research
  Assistant Professor at Department of Computer Science and Engineering, SUSTech,
  China. During 2020/01 to 2021/01, he was a Research Associate Professor at Department
  of Computer Science and Engineering, SUSTech, China.

  In 2014, Bo Yuan received the President Award of Chinese Academy of Sciences (中国科学院院长奖).
  Since 2017, he has been recognized as Overseas High-Caliber Personnel (Peacock Plan
  Level C) in Shenzhen (深圳市海外高层次人才“孔雀计划”).

  His research interests are computational intelligence, reinforcement learning, and
  electronic design automation.

  Bo Yuan was the PC member of IJCAI, AAAI, ECAI, WCCI, etc., and the reviewer of
  ACM CSUR, ACM TODAES, IEEE TAI, IEEE TCAD, IEEE TC, IEEE TCASII, IEEE TCYB, IEEE
  TETCI, IEEE TEVC, IEEE TNNLS, IEEE TVT, IEEE TVLSI, etc. In 2025, he was recognized
  as a distinguished reviewer of ACM Transactions on Design Automation of Electronic
  Systems.

