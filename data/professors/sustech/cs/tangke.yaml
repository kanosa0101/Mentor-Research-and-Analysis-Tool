  加入团队

  若您加入本实验室攻读硕士/博士，开展博士后研究，或担任研究序列岗位，请将简历+1～2个代表性工作发送至本人邮箱。其中，代表性工作可以是论文，也可以是之前做过的项目/研究的简要描述（1～2
  页纸）或技术报告。

  更多详情请见NICAL。

