bio_raw: "刘晟材博士，分别在2014年和2020年于中国科学技术大学计算机学院获得学士和博士学位。曾在新加坡科技研究局担任高级研究科学家，现任南方科技大学计算机科学与工程系助理教授、博导，北京中关村学院兼职博导，并担任\
  \ IEEE TETCI 副编。长期从事学习优化 (Learn to optimize)、大模型（LLM）/ 智能体（Agents）及其在计算代码优化、科学领域的应用研究。已获批主持国自然基金一项、华为合作项目两项，迄今已在NeurIPS、ICML、AAAI等CCF-A类会议以及IEEE\
  \ TPAMI、TEVC等人工智能旗舰期刊上以一作/通讯作者身份发表论文20余篇。刘博士曾多次受邀在国际学术会议上做大会报告，包括达格施图尔城堡研讨会2023、IEEE世界计算智能大会2022、以及第七届演化计算与学习研讨会。\n\
