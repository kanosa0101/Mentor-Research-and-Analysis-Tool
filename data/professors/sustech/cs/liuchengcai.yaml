  招募\n: 本课题组常年招收硕士/博士研究生、访问学生、博士后、研究助理教授，不定时招收北京中关村学院-南方科技大学联合培养博士生。 欢迎数理基础扎实、代码能力强的同学申请。申请时请将本人自述、成绩单、个人简历及相关能力发送至邮箱\
