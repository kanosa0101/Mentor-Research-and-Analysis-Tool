  在学术研究方面，目前在国际顶级杂志和会议上包括IEEE TPAMI/TIP/TITS, AAAI, IJCAI, ICML, CVPR, NeuIPS, ECCV发表100余篇学术论文,
  根据Web of Science检索结果，CCF推荐A类会议(66篇)和IEEE Transactions(28篇)杂志共94篇。，提出的Pyramid再识别算法收录于计算机视觉公开库OpenCV中。同时，是IET
  Image Processing杂志副编辑，是ACM MM, NeurIPS, NeurIPS 2023领域主席，是多个主流杂志包括IEEE TNNLS/TCYB/TMM/TCSVT,
  IS等的审稿人，在多个国际顶级人工智能会议包括AAAI, IJCAI, NeuIPS, ICML, ICLR, UAI担任委员会成员。在系统开发方面，获得了人机交互相关技术的5个授权专利。其研究的人机交互技术曾被多家主流媒体报道过，并实现了向包括华为和创维等企业的技术转化。

