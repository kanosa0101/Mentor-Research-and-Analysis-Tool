bio_raw: 博士，副教授，硕士研究生导师。2009年12月毕业于上海交通大学，获通信与信息系统专业博士学位。先后在深圳特发泰科通信有限公司、深圳中兴通讯移动事业部和上海贝尔担任高级工程师，并从事通信产品开发与系统设计。目前是华南理工大学学报、WirelessPersonalCommunications等杂志审稿人，中国机械工业科学技术奖评审专家。博士期间主要从事宽带无线信道建模与仿真以及下一代无线通信关键技术的研究，先后参加了863项目“未来通用无线环境FuTURE计划新一代蜂窝移动通信链路技术研究”和自然科学基金重点项目“移动宽带视频广播传输系统及关键技术研究”等课题的研究工作。近几年依托湖南大学信息科学与工程学院和湖南省重点实验室—湖南省先进通信技术实验室开展车载环境无线接入通信系统基础理论及射频功率放大器数字预失真关键技术的研究，主持国家自然科学基金项目1项，湖南省教育厅重点科研项目1项，主要参与国家自科基金项目1项。已在学术期刊和国内外学术会议上发表论文20多篇，其中SCI期刊论文2篇，EI收录8篇，联合申请国家发明专利1项。目前指导研究生6名，留学生1名，协作指导博士生2名，已经毕业硕士生8名，协作指导已毕业博士生1名。
