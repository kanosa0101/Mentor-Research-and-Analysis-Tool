bio_raw: 1995年毕业于沈阳工业学院电子工程系;2001年毕业于华东交通大学,获交通信工程及控制专业硕士学位;2004年毕业于上海大学，获通信与信息系统专业博士学位,并进入湖南大学工作。2005年,晋升为副教授;2008年,破格晋升为教授,并被评为湖南大学优秀教师,入选湖南省青年骨干教师培养对象。2010年,入选湖南省新世纪121人才工程。2010年8月至2011年8月,国家公派在英国Surrey大学进行访问学者交流。2011年,被遴选为博士生导师,并入选教育部新世纪优秀人才支持计划。2017年,入选首批
