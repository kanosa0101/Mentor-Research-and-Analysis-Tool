bio_raw: 主要研究方向为高性能智能计算。在CCF推荐A类会议/期刊、IEEE/ACM汇刊发表论文70余篇；授权国家发明专利和登记软件著作权30余项；主持国家重点研发计划课题、KJZB预研重点项目、JWKJW重点项目/重大项目任务、国家自然科学基金、华为、中国商飞、中国航天、清航空天等国家和国防项目10余项。获国家教学成果二等奖（第6）、湖南省技术发明一等奖（第2）、吴文俊人工智能科技进步一等奖（第4）、湖南省计算机学会科学技术一等奖（第1）、中国测绘学会科学技术二等奖（第4）、湖南大学优秀教师等奖励和荣誉多项。2024年图灵大会组委会主席，CCF高级会员，IEEE/ACM/CAAI/CIE会员。
