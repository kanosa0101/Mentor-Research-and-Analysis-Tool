bio_raw: 罗辉章，岳麓学者晨星A岗和湖南省百人计划获得者，国家级青年人才。2012年和2017年于重庆大学分别获得计算机科学与技术学士学位和博士学位，2017年7月至2020年12月于美国新泽西理工学院从事博士后研究工作。现为湖南大学信息科学与工程学院计算机科学系教授，其主要研究方向为高性能计算及计算机体系结构。
