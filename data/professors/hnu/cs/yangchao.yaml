bio_raw: 杨超，现为湖南大学计算机学院副教授、博士生导师，中国计算机学会杰出会员，中国计算机学会协同计算、计算机应用专委执委，中国人工智能学会智能信息网络专委委员，中国仿真学会社会计算与智能仿真专委委员，教育部学位与研究生教育评估专家，湖南省科技咨询与评审专家，曾任CCFYOCSEF2021-2022年度长沙学术委员会主席。本科、硕士均毕业于湖南大学计算机与通信学院，博士毕业于日本东京工业大学，曾获最优博士论文奖和秋山奖，后留校任博士后研究员。长期从事计算机和人工智能相关领域的研究，包括自然语言处理、计算机视觉、跨媒体分析与推理、多智能体系统等。近年来专注于以AI技术如何更好服务于人类需求为导向，围绕情感智能、信息检索与推荐、图像内容理解与生成、对话系统、AIGC方面展开系统研究，研究成果可在智能AI助手、内容创作与生成、老年人/儿童辅助等众多领域应用。主持国家、湖南省自然科学基金和科技计划10余项，在AAAI、MM、ICCV、ECCV、COLING、ICMR、ICME、ICASSP、TMM、TOMM高水平会议和期刊发表研究论文近60篇。主持多项企业委托研发课题，授权中国发明专利12项。
