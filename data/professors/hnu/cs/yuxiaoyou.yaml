bio_raw: 余小游，工学博士，研究员/副教授，博士生导师。湖南大学感通算控一体化技术实验室主任，湖南大学优秀中共党员。IEEE会员，湖南省通信学会理事、湖南省电子学会通信电路与系统专委会理事。《电子学报》、《信号处理》、《IEEE_Journal_on_selected_Areas_in_communications》、《IEEE_Communications_Magazine》、《IEEE_Communications_on_Communications》、《IEEE_Communications_Letters》、《IEEE_Wireless_Communications_Letters》等电子信息领域权威期刊审稿人。在国内外著名学术刊物上已经发表论文50余篇。主持国家级和省部级项目十余项，主持或参与其它项目二十余项。曾获国家级科技进步三等奖、部委级科技进步一等奖、中国宇航学会优秀论文奖等。Email:yuxiaoyou@hnu.edu.cn
institutes: []
research_direction_raw: 人工智能无线电理论；一体化技术（雷达通信/感导通/通导遥/探干侦通一体化，空天地一体化，人机一体化）；无线电干扰与抗干扰技术；智能媒体与认知（多媒体信息处理，区块链/数字孪生/元宇宙，虚拟人/人效增强）等
