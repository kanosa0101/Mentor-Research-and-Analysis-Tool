title: 副教授
bio_raw: 廖骎(qīn)，湖南大学计算机学院副教授、博士生导师，通信工程系副主任，湖南省青年人才，CCF量子计算专委会、信息保密专委会执行委员，湖南省密码协会专家委员。主要从事量子通信、量子密码、智能量子计算、量子机器学习、网络安全等相关领域的研究工作。近年发表SCI学术论文50余篇，出版学术专著1本，授权发明专利11项，主持国家自然科学基金、湖南省重点研发计划、湖南省自然科学基金、国家重点实验室开放课题、企业技术开发项目等多个科研项目，获湖南省自然科学二等奖。担任Information、Frontiers_in_Quantum_Science_and_Technology期刊编委，以及Entropy、Symmetry、Mathematics等期刊的客座编辑，是多个领域内高质量期刊（如NC、Phys.Rev.系列、npj_Quantum_Inf.、Optica、Photonics_Research、QST、QUTE、OE、OL、QINP、TCOM、TIFS、TCCN等）的审稿专家。
