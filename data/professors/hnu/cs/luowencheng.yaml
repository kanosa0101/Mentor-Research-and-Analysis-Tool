bio_raw: 湖南大学“岳麓学者”。本硕毕业于西北工业大学，博士毕业于湖南大学计算机科学与技术专业，曾在香港中文大学（深圳）担任博士后研究员。主要研究面向大规模图数据的管理、挖掘、人工智能等相关课题。主持/参与国家自然科学基金项目多项。目前已在相关领域的高水平学术会议和期刊上累计发表论文二十余篇，其中中国计算机学会认定的A类论文（即CCF-A）15篇，包括SIGMOD、VLDB、ICDE、VLDBJ、TKDE等，授权发明专利4项。曾/现担任SIGKDD，ACMMM，CIKM等顶级/重要国际学术会议程序委员会成员，TKDE、TMC、TKDD、WWWJ、IOTJ、InformationSciences、DMKD等国内外顶级学术期刊评审专家。
