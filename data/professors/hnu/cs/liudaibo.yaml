bio_raw: 刘代波，湖南大学副教授，博士生导师，岳麓学者，CCF高级会员，CCF物联网专委会与普适计算专委会执行委员。2018年6月毕业于电子科技大学计算机科学与工程学院，获工学博士学位。其中2014年7月-2016年4月，在清华大学信息科学与技术国家实验室进行联合博士培养；2016年9月-2017年9月在美国威斯康星麦迪逊大学Madison分校联合培养。2019年3月加入湖南大学。主要研究方向包括物联网安全、无线感知、边缘计算。主持参与多项国家重点基金与课题，包括国自科面上与青年基金、国自科区域创新发展联合项目等；在相关领域发表高质量SCI/EI收录论文70多篇，包括TON,TMC,JSAC等期刊和USENIXSecurity,CCS,NDSS,UbiComp,INFOCOM等会议，其中包括CCFA类期刊会议论文30多篇，IEEE/ACM-Transactions论文30余篇;获2021/2024/2025年湖南省计算机学会科学技术一等奖和二等奖三项。申请发明专利多项，获授权十多项。
