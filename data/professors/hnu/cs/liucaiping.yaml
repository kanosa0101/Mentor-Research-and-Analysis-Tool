bio_raw: 刘彩苹，女，1978年1月生，博士，副教授，博导。2000年7月湖南大学计算机系通信工程专业本科毕业，2005年6月获湖南大学计算机应用技术专业硕士学位，2011年6月获湖南大学计算机科学与技术专业博士学位。现为湖南大学信息科学与工程学院副教授，博士生导师。
