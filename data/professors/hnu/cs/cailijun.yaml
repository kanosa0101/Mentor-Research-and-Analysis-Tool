bio_raw: 蔡立军，男，中共党员，计算机应用技术专业博士，教授，博士生导师。1982年考入华中工学院（现华中科技大学），先后获华中工学院工学学士学位、湖南大学的工程硕士学位、工学博士学位。先后任湖南大学远程与继续教育学院副院长、湖南大学教务处副处长，国家超级计算长沙中心湖南大学建设办公室主任。现任湖南大学现代工程训练中心主任兼教务处副处长，教育部工程训练教学指导委员会委员；中南地区港澳特区金工研究会副理事长；湖南省物联网协会副理事长。
