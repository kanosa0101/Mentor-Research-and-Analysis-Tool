bio_raw: 柳杨，男，硕士。1972年12月出生于广西南宁,1994年获湖南大学环境工程学院授予的学士学位，2006年获湖南大学计算机与通信学院授予的硕士学位。先后在广西建筑综合设计院从事暖通空调设计与AutoCad软件二次开发、湖南大学软件学院等单位从事教学和软件开发等相关工作。
