bio_raw: 林剑新，副教授，岳麓学者，湖湘青年英才。2015年本科毕业于中国科学技术大学，2020年博士毕业于中国科学技术大学。2016-2017年于微软亚洲研究院进行研究实习。曾获中科院院长优秀奖，中国科学技术大学优博提名奖，ACMMM会议Top论文奖。
