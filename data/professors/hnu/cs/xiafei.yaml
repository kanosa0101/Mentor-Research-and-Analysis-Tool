bio_raw: 长期从事人工智能与机器学习、高性能计算、计算机应用技术研究工作。作为项目负责人承担国家自然科学基金2项，国家博士后基金，省级自然科学基金，军委科技委创新特区项目、军内科研等项目20项，作为课题负责人或骨干参与国家重点研发计划项目、国家863/973计划项目、装备预研、重点型号和军内科研项目20余项。累计以第一(通讯)作者发表论文60余篇，其中SCI检索20篇，EI检索30余篇，获得国家发明专利8项。获得军队科技进步二等奖3项，三等奖1项，获得2013年度湖南省优秀博士论文奖。
