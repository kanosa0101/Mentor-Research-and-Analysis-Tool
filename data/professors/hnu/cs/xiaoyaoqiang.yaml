bio_raw: 肖要强，男，长期从事“光无线通信”，“保密通信”、“图像处理”等方面的研究，主要研究兴趣：1、6G毫米波或太赫兹传输的物理层安全性研究；2、图像加密处理及检索相关算法；3、chaos相关理论及其应用研究；4、机器学习相关算法及其应用与AI。主持参与国家级、省级项目多项。在国内外学术期刊上发表论文近30篇，全部为SCI、EI检索。目前为JLT、OE、OC、DSP、OFT等期刊的审稿专家。
