bio_raw: 洪庆辉，湖南大学副教授、博士生导师、通信工程系副主任，获湖南大学青年教师托举计划、CCF杰出演讲者、湖南省自然科学三等奖、电子信息学报优秀编委。担任中国计算机学会容错计算专委委员，集成电路设计专委委员，中国电子学会混沌与非线性电路专委委员，电子与信息学报青年编委。主要从事超低功耗模拟计算电路设计、先进计算架构、存算一体与可重构计算、深度学习、图像处理等研究，主持国家自然科学重点项目课题、国家自然科学基金面上/青年项目、CCF-华为胡杨林基金、湖南省重点研发计划、湖南省“湖湘青年英才”、湖南省自然科学基金等科研项目10项。在TC、TIE、TII、TCAD、TCAS-I、DAC等顶级期刊上以一作或通信作者发表SCI论文60余篇，IEEE论文35篇，其中CCF-A或中科院一区20篇，IF>10论文8篇。欢迎具有通信、电子、控制、计算机背景的同学报考硕士和博士生。
