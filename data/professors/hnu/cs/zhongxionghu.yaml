bio_raw: 钟雄虎，1982年生，博士，教授，博士生导师，湖南大学岳麓学者，入选湖南省“百人计划”，并获湖南省“湖湘高层次人才聚集工程”创新项目支持，湖南省委网络安全和信息化专委会委员，国家重点研发计划“长江黄河重点流域水资源与水环境综合治理”评审专家。本科与硕士毕业于西北工业大学，博士毕业于英国爱丁堡大学。在新加坡南洋理工大学从事研究工作多年，并于2013年和2014年分别应邀和英国Surrey大学和德国波恩大学展开项目合作研究，2017年-2018年间担任美国Xylem水务集团智慧水务首席数据科学家。
