bio_raw: 湖南省智慧司法研究院专家，区块链底层技术及应用湖南省重点实验室技术专家，教育部学位与研究生教育发展中心评审专家，中国计算机学会会员，中国人工智能学会会员。多家期刊，会议审稿人。从事多年教学科研工作，讲授课程包括计算机网络，操作系统，数字图像处理，面向对象设计，程序设计基础等。
