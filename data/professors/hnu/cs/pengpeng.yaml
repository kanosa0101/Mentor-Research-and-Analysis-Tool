bio_raw: 彭鹏于2009年毕业于北京师范大学信息科学与技术学院获得工学学士学位；2016年毕业于北京大学计算机科学技术研究所，获得工学博士学位。彭鹏于2016年8月入职湖南大学信息科学与工程学院软件工程系，任助理教授。2019年底晋升为副教授。目前其主要研究方向为“基于图的分布式知识图谱数据管理”。
