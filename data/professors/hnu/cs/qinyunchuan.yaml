bio_raw: 目前主要研究方向为具身智能操作系统体系架构、安全与可靠性机制等。在NeurIPS/AAAI/TCAD/TCE/T-CYB/TOPC/TEC/TII/TVT等本领域权威期刊和会议发表相关学术论文30余篇，出版技术专著4本，牵头起草了国家行业标准1项，申请发明专利93项，其中已授权31项。曾获广东省科技进步二等奖(排名1)、湖南省科技进步奖一等奖、中国产学研合作创新成果一等奖等奖项。
