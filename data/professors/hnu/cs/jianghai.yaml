bio_raw: 1998年毕业于湖南大学计算机系，2006年获得软件工程硕士学位，国家系统分析师。通过IBM电子商务解决方案设计师（815、817）、IBMDominoLotusR5CLS、MCAD（微软认证应用程序开发专家）等认证，同时具有MicrosoftATC认证、IBM电子商务解决方案设计师的教师资格，数字媒体方面拥有AdobeAcrobat、Illustrator、InDesign、Photoshop、AfterEffects、Premiere6门课程的ACCI（ADOBE中国认证教师资格）。
