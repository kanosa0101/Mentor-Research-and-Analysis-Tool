bio_raw: 博导，副教授，浙江大学博士,法国INRIA研究院博士后,湖湘青年英才.先后在CityUHK做RA/ResearchFellow，USTC做博士后副研究员.IEEE/ACMmember.从事前沿的计算机图形学、图像处理、计算几何学、人工智能研究.主持国家自然科学基金项目、省自然科学基金项目及横向科研项目.
