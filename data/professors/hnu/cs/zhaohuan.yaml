bio_raw: 牵头的教学成果获2022年国家级教学成果二等奖，国家级一流本科专业、国家级一流本科课程、国家精品课程和国家级精品资源共享课负责人，主编出版国家级规划教材8本。带领团队长期致力于学生计算机系统能力培养教育教学改革，所牵头的“鲲鹏计算机系统能力培养课程群虚拟教研室”获评教育部首批虚拟教研室建设试点，并成为全国50个典型虚拟教研室之一。
