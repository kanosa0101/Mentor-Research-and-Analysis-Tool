bio_raw: 博士后，教授，博士生导师。1989年参军入伍来到中国核武器试验基地工作，从事核武器试验的安全保障技术研究与核试验数据处理工作，全程参加了代号为2187的地下核武器试验建井任务，期间获得部委级科研进步奖5项。2000年转业到湖南大学信息科学与工程学院，从事科研与教学工作。主要讲授软件工程、分布式数据库原理、计算机组成原理、计算理论、形式语言与自动机理论、ACM国际大学生程序设计、生物信息学基础等核心课程。近些年来，在国内外有影响的学术刊物上发表五十余篇科研论文，同时还是《新一代信息技术》杂志的编委，主持完成国家自然科学基金面上项目三项，并主持完成国家重点研发计划课题一项。2013年与李肯立教授等合作申报了湖南省自然科学基金二等奖项目《可扩展高性能计算的若干基础理论与方法》；2018年与彭绍亮教授和李肯立教授等进一步合作申报了CCF自然科学二等奖《基于超算的精准医学技术研究》。2019年参与制定了《智能医疗影像辅助诊断系统技术要求和测试评价方法》行业标准，该标准规定了计算机视觉领域的智能医疗影像辅助诊断系统的基本功能结构和要求、影像数据要求和临床测试评价方法等。目前主要从事生物医学大数据的挖掘与分析研究。
