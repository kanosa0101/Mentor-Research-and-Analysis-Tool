bio_raw: 全哲，1981年生，湖南大学教授、博士生导师、岳麓学者。一直从事超级计算机“天河”等系列的系统研制，目前研究方向为高性能计算、机器学习、算法设计等。2016年8月加入湖南大学信息科学与工程学院。目前主持国家自然科学基金项目1项，国家重点研发计划2项。
