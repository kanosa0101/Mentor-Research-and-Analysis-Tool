bio_raw: 卢新国，教授，博士生导师，美国得州大学访问学者，教育部重点实验室方向负责人，湖南省人工智能学会医学专委会副主任委员，CCF生物信息专委会委员，湖南省大数据产业促进会智库专家。现主持/参与国家重点研发计划项目、国家自然科学基金项目，湖南省重大专项、湖南省重点研发计划等国家和省部级项目20余项。发表IEEE汇刊等权威刊物/会议论文40余篇。研究方向包括大语言模型、深度学习、智慧医疗、生物大数据处理、区块链等。
