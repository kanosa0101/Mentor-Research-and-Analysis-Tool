bio_raw: 男，湖南宁乡人，1990年在国防科技大学本科毕业后，先后在空军5713和5712飞机修理厂从事歼七飞机修理，在长沙电业局任IT高级工程师。2004年在湖南大学获得计算机应用博士学位后留校任教，主讲数据库系统与设计，软件集成，高级数据库，编译技术等课程。2005年被评为湖南省青年骨干教师培养对象；2007年在加拿大Victoria大学做博士后一年。2011年被推选为湖南大学“我心目中最敬爱的老师”候选人，2015年在美国Illinios做访问学者半年。曾担任过系主任，院长助理，现为软件工程系教授。是HPCC19，IEEEMAW13、PACRIM11、DMIR10、PRDC05国际会议的程序委员会成员。
