bio_raw: 主要研究方向为激光传输与调控、量子关联成像/单像素成像、空间光通信等。主持军口项目/国家自然科学基金、湖南省自然科学基金、博士后基金、研究所/企业技术开发项目等国家级与部省级项目多项，作为核心成员参与国家级项目8项，发表学术论文40余篇，申请国家发明专利多项。《激光与光电子学进展》青年编委，OL、OE等国际权威期刊审稿专家，曾获IOP旗下期刊优秀评审人奖。
