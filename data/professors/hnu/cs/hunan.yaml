bio_raw: 胡南，博士，助理教授，博士生导师。2018年本科毕业于中山大学，2024年博士毕业于中山大学。目前主要研究领域包括高性能计算与并行计算、大数据处理系统、算子智能优化等，在国际重要学术期刊与会议发表多篇论文，主持国家重点研发计划子课题1项、国家自然科学基金青年科学基金项目（C类）1项，参与国家自然科学基金联合基金、教育部突破计划项目等多项。担任HPCC、CCGrid等国际会议PCMember与审稿人。
