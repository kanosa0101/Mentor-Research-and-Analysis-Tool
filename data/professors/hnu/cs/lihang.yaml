bio_raw: 李珩，工学博士，2018年美国德州大学阿灵顿分校访问学者,湖南大学软件工程系助理教授。讲授本科课程《软件项目管理》及研究生课程《软件设计模式》。研究方向：智慧城市、城市车载网、移动互联网。
