bio_raw: 宋勃升，教授，博士生导师，入选2项省级人才项目（湖湘青年英才、湖南省优青）。研究方向为生物计算、药物研发等，近年来在国际期刊和国际会议上发表相关领域学术论文90多篇，其中以第一/通讯作者发表在IEEE-TCYB、IEEE-TPDS、IEEE-TC等高水平SCI论文60多篇（中科院一区/CCFA类/IEEE汇刊论文30多篇，6篇影响因子大于10，6篇论文入选ESI高被引）。主持国家级项目3项，省部级项目4项，参与国家级项目2项。
