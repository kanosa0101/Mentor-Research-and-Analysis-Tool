title: 教授
bio_raw: 彭绍亮，国家重大人才工程第一层次，2023，2024，2025年全球前2%顶尖科学家（人工智能），英国工程技术学会会士（IETFellow）。主持湖南省“创新群体“和”“杰出青年”基金，湖南大学二级教授/博导，国家超级计算长沙中心副主任，高性能分布式账本与数字金融教育部重点实验室副主任。从事人工智能、大数据、生物信息、、区块链等研究。出版专著8部，发表学术论文300余篇，论文引用12000余次，申请发明专利100余项。获2019年国家科技进步二等奖，2019年湖南省技术发明一等奖（排名1），2024年广西省科技进步二等奖（2），2013年军队科技进步一等奖1项，2021年CCF技术发明二等奖（排名1），2018年CCF自然科学二等奖（排名1），2016年荣立三等功。是中央军委、国家科技部/工信部/教育部会评专家、中国计算机学会理事、CCF计算机应用和生物信息专委副主任和YOCSEF总部AC委员、CCF高性能计算、大数据专委常委、大模型论坛常委，湖南省生物医学工程学会理事长，任2个SCI期刊执行主编，创立全球首个《Metaverse》元宇宙国际期刊，任Editor-in-Chief主编
