bio_raw: 男，博士。主要从事计算机视觉，图像分析，医学影像分析、疾病计算机辅助诊断等研究。承担及参与国家自然科学基金、湖南省自然科学基金、湖南省科技计划多项，承担基于深度学习的计算机视觉领域的目标检测及识别关键算法研究及应用的多项校企合作项目。发表论文多篇。
