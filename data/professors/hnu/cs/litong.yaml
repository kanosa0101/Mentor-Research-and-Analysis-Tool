bio_raw: 从事智能无线网络、空间智能、AgenticAI等领域的研究工作。主持和参与了国家自然科学基金、国家重点研发计划课题、科技创新2030-重大项目等10余项国家/省部级项目。以第一作者/通讯作者在Nature子刊、TMC、TWC、TKDE、WWW、KDD、IJCAI、AAAI等期刊会议发表论文70余篇。6篇文章入选ESI全球前1%高被引论文。入选中国科协青年人才托举工程，获中国仿真学会创新技术二等奖，入选博士后国际交流计划引进项目，入选斯坦福大学和爱思唯尔发布的“全球顶尖前2%学者”。担任AAAI，IJCAI，KDD，WWW等会议程序委员会委员。
