bio_raw: 周四望，博士，教授，博士生导师。本科毕业于复旦大学，分别在湘潭大学和湖南大学获得硕士、博士学位，新加坡南洋理工大学访问学者，湖南省青年骨干教师，获教育部“新世纪优秀人才计划”资助。在国内外重要学术期刊上发表了多篇研究论文，出版了学术专著“无线传感器网络中的小波方法”。目前在湖南大学信息科学与工程学院从事教学和科研工作。
