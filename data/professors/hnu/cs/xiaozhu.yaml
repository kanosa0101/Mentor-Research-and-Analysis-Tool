bio_raw: 肖竹，男，博士，教授，岳麓学者（特聘岗），博士生导师，IEEESeniorMember，CCF高级会员，2022-2025年连续入选“全球Top前2%学者”。主持了国自科联合基金重点项目/面上项目/青年项目、国家重点研发课题、湖南省重点研发计划等20余项国家/省部级项目。近年来以第一作者/通讯作者在IEEETrans或SCI一区期刊发表论文100余篇，包括JSAC、IEEECOMST、IEEECOMMAG、TMC、TWC、TON、TSP、T-Cyber、TITS、TNNLS、ACMCSUR、TIFS、TDSC、TIE、TCCN等国际权威期刊。发表高水平会议论文10余篇，包括INFOCOM、ICDCS、MOBIHOC、GLOBECOM等。Google学术引用9000+，H因子51，获授权发明专利60余项。受邀担任Top期刊IEEETITS的编委（AE）。
