bio_raw: 孙鹏，博士，副教授，博导，中国科协青年人才托举工程项目入选者，湖南省科技创新类湖湘青年英才(“荷尖”人才)，计算机工程系副主任，IEEE/ACM/CCF/CIE/AAIA会员，中国计算机学会物联网专委会执行委员，中国电子学会物联网专家委员会青年委员、网络空间安全专家委员会委员。主要研究领域包括人工智能、群体智能、边缘智能，尤其是其中的隐私保护与安全可信问题。截至目前，他已在国际权威期刊及一流学术会议上发表论文70余篇（CCFA类论文27篇）。其中，以第一/唯一通讯作者身份发表CCFA类论文共13篇，包括IEEE/ACMTON,IEEEJSAC,IEEETMC,IEEETIFS,ACMSIGMOD,IEEEINFOCOM,CVPR,AAAI。他主持国家自然科学基金面上、青年项目，湖南省自然科学基金青年基金，中国博士后科学基金面上资助，深圳市人工智能与机器人研究院横向项目。他曾获得中国自动化学会科技进步奖特等奖、中国商业联合会服务业科技创新奖一等奖、湖南省计算机学会科学技术奖一等奖和BIGCOM2023国际会议最佳学生论文奖。
