bio_raw: 金敏，教授，博士生导师。毕业于中南大学信息工程学院，获学士、硕士和博士学位；国内知名电力与物联网智能化公司6年企业研发工作经历，任高级项目经理、项目管理室主任；作为引进人才进入湖南大学。美国佐治亚理工大学电子与计算机科学系访问学者，教育部学位中心博士论文评审专家，教育部-IBM精品课程负责人，湖南省高校青年骨干教师，湖南省优秀硕士生导师，湖南大学优秀教师，J-BIOMEDINFORM、ArtificialIntelligenceReview、中南大学学报等国际期刊审稿人，湖南盛通信息技术有限公司首席专家。
