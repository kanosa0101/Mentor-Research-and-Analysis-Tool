bio_raw: 2020年入选中组部国家海外高层次人才引进计划，2021年入选科技部高端外国专家引进计划，兼任华为公司嵌入式系统领域首席科学顾问，芯片设计自动化国际顶级学术会议DAC执委（中国唯一），世界计算机学会ACM嵌入式系统领域专业委员会SIGBED秘书长，ACM嵌入式系统领域早期职业成就奖，最佳博士论文奖评奖委员会主席。曾任英国约克大学终身教职，Bosch资深专家顾问。根据csrankings统计，近五年在嵌入式与实时系统及其设计自动化领域国际顶级学术会议论文发表数世界排名第一。博士毕业于德国慕尼黑工大，获最佳博士论文奖。本科毕业于新加坡南洋理工大学。主持国家重点研发计划课题“嵌入式智能软件环境及深度编译框架”。
