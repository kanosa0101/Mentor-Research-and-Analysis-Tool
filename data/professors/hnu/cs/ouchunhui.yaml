bio_raw: 欢迎具有一定数学、物理基础，或通信基础、光学基础的同学与我一起开展研究工作，会根据你的个人兴趣及未来发展方向制定专门的培养方案，并提供相关硬件软件条件，支持学生参与各类学术交流活动。并对每一位研究生提供就业指导与帮助。同时也欢迎对我研究方向兴趣的本科生参与到我的科研工作中来。如有兴趣欢迎随时联系。
