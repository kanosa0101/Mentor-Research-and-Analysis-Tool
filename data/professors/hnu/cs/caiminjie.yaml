bio_raw: 副教授、博士生导师、湖南省优青。另兼任东京大学生产技术研究所(InstituteofIndustrialScience)合作研究员。东京大学博士，西北工业大学本科及硕士毕业。研究方向为计算机视觉及其在人机交互和多媒体等方面的应用。迄今为止在CVPR、ECCV、ICRA等相关领域的国际顶尖会议，以及TPAMI、TIP、TCYB等国际顶尖期刊上发表系列论文，长期担任CVPR、ICCV、ECCV、NeurIPS等国际顶尖学术会议的审稿人。
