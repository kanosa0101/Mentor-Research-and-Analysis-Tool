bio_raw: 日本国东京工业大学工学博士、外国人特别研究员。CCF高级会员，ACM、IEEE会员，中国计算机学会大数据专家委员会（TFBD）专家委员，中国计算机学会协同计算专业委员会（TCCC）委员，中国计算机学会计算机应用专业委员会（TCAPP）委员，中国人工智能学会（CAAI）会员，教育部学位与研究生教育评估专家，北京市自然科学基金评审专家，湖南省科技咨询与评审专家，湖南省工业机器视觉工程技术研究中心专家指导委员，长沙市工业科技特派员，邵阳市人民政府科技经济顾问，株洲市网络安全和信息化专家。
