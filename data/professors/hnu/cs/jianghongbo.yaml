bio_raw: 2008年毕业于美国凯斯西储大学，获计算机科学博士学位，目前是湖南大学计算机学院副院长，超算与人工智能融合计算教育部重点实验室副主任，可信系统与网络湖南省重点实验室主任，高效能计算与应用湖南省国际科技合作基地主任，湖南省计算机学会法人/秘书长。并受邀担任IEEE/ACMTransactions系列期刊ToN,TMC,TOSN,TVT,T-ITS,TNSE的编委(Editor)。
