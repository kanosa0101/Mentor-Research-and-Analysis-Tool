title: 副教授
bio_raw: 黎文伟，男，1975年出生，湖南大学信息科学与工程学院副教授，2006年获博士学位，2012年国家公派赴美国乔治亚州立大学访学一年。主要研究方向为网络测试与优化、网络管理。主持国家自然科学基金项目2项，参与了多个国家自然科学基金、国家863计划等项目研究。获2006年度湖南省科学技术进步奖二等奖。已发表或录用论文近70篇，其中SCI、EI、ISTP检索30余篇次，获得国家发明专利2项，申请发明专利3项，软件著作权登记1项。e-mail:liww@hnu.edu.cn
