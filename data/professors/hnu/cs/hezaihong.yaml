bio_raw: 贺再红：女，副教授，在读博士。工作至今一直从事计算机系统软件的教学与研发，作为核心和骨干研究人员参与了3项国家自然科学基金，主持了3项省部级课题，参与了3项省部级课题，主持了多项校级项目。目前在国内外学术刊物发表论文10余篇，其中EI/SCI/ISTP检索3篇。主要研究方向为计算机输入输出系统（I/O）性能加速与优化策略。2002年5月至今，湖南大学计算机与通信学院从事教学与科研工作。现工作于湖南大学信息科学与工程学院。联系方式：hezaihong@sohu.com
