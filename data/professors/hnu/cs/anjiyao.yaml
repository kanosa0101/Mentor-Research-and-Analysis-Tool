bio_raw: 安吉尧，博士，教授，博士生导师。湖南慈利人，1998年硕士毕业于湘潭大学，2012年博士毕业于湖南大学。1998年就职于湖南创智软件园有限公司，曾担任软件设计师和项目组主管。2000年8月加入湖南大学计算机科学系。2013-2014年加拿大滑铁卢大学访问学者，进行模糊系统及应用方面的研究与交流。
