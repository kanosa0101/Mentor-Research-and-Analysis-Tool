bio_raw: 刘琴，女，1982年6月生，博士，副教授，湖南长沙人，中共党员。2004年获得湖南师范大学计算机科学与技术专业工学学士学位，2007年获得中南大学计算机应用技术专业工学硕士学位，2012年获得中南大学计算机应用技术专业工学博士学位。在2010年-2012年间，以联合培养博士身份在美国天普大学（TempleUniversity）访问学习了两年。2013年10月加入湖南大学。2014年湖南省自然科学奖二等奖（排名第二），2015年获得湖南省优秀博士论文奖励，2018年入选湖南省青年骨干教师，2020年获得湖南省自然科学基金优秀青年项目资助。
