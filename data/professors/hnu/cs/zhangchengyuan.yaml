bio_raw: 章成源，男，博士，副教授。2008年于中山大学获得学士学位；2011和2015年先后获得于新南威尔士大学计算机科学与工程学院硕士学位和博士学位。2015.4-2016.4于新南威尔士大学信息科学与工程学院数据库组担任研究助理。2016年-2020年担任中南大学讲师。2020年，湖南大学人才引进（副教授职称）加入信息科学与工程学院。
