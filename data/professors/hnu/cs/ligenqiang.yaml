bio_raw: 1986年参加工作，进入教学岗位28年，主讲过：大学信息基础、Pascal程序设计、C语言程序设计、数据结构、动态网页设计与制作、数值计算与最优化、FORTRAN程序设计、DELPHI程序设计、C++程序设计等课程。主编教材6本，其中两本十一五国家规划教材。参编教材8本。完成校级教改项目3项，发表专业论文6篇，指导学生毕业设计80人，指导学生SIT设计7人，参与并完成科研课题两项。
