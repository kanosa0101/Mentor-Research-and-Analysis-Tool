bio_raw: 博士，教授，博士生导师，现工作于湖南大学信息科学与工程学院计算机科学系。主要从事并行与分布式系统、操作系统、系统安全等领域的研究工作。主讲《操作系统》、《操作系统设计》等本科生课程。获2017年度湖南大学优秀教师称号。获2017年湖南省技术发明奖一等奖。获2021年计算机体系结构顶级会议ASPLOS的DistinguishedArtifactAward。2013年入选教育部新世纪优秀人才支持计划，2016年被聘为湖南大学岳麓学者。作为课题负责人主持国家重点研发计划、国家重点基础研究发展计划（973计划）、国家自然科学基金、湖南省自然科学基金等国家和省部级项目10余项。以第一作者或通讯作者在IEEE-TC、IEEE-TPDS、ACM-TACO、ASPLOS、SIGMOD、VLDB、ICS、PACT、IPDPS、IWQoS、ICPP、中国科学等计算机领域顶级会议和期刊上发表论文80余篇，申请国家发明专利10余项。
