bio_raw: 博士，副教授，中国计算机学会会员。1996年于湖南师范大学获学士学位，2000年、2004年于中南大学分别获硕士、博士学位。2005年8月至今，在湖南大学计算机学院从事数据挖掘与机器学习方面的教学研究工作。2010年1月至2011年1月，美国WrightStateUniversity计算机科学与工程系访问学者。目前研究兴趣为数据挖掘与机器学习，社交网络，大数据技术等。近年来，主持湖南省自然科学基金2项；参与国家自然科学基金6项，国家科技支撑计划项目2项，博士点基金1项，省部级项目4项；主持或参与企业横向课题10余项。在国内重要学术期刊公开发表学术论文40余篇，其中SCI,EI检索20余篇，参编专著1部。
