bio_raw: 骆嘉伟，湖南大学信息科学与工程教授，博士生导师，岳麓学者特聘教授。CCF大数据专委会委员，CCF生物信息学专委会委员。入选全国高校计算机专业优秀教师，全球前2%顶尖科学家榜单。国家级一流本科专业、国家级一流本科课程、省级优秀教学团队负责人。主持国家重点研发计划课题、国家自然科学重点基金等研究项目十余项，发表高水平论文100余篇，获发明专利8项。相关成果获省技术发明一等奖、省自然科学二等奖。
