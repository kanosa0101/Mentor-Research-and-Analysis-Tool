bio_raw: 电子科技大学&DukeUniversity联合培养工学博士，电子科技大学理学学士。任湖南大学信息科学与工程学院副教授，硕士/博士研究生导师。毫米波国家重点实验室（东南大学）、广西无线宽带通信与信号处理重点实验室、射频集成与微组装技术国家地方合联合工程实验室客座研究员。兼任聊城大学学报青年编委。先后主持国家自然科学基金面上项目、省自然科学基金、国家重点实验室基金、国家地方联合工程实验室基金和军工研究所及企业合作技术开发项目多项。在IEEETAP等国内外一流期刊和会议上发表近三十余篇论文，长期担任IEEEJSAS、IEEETAP、IEEEJBHI等国际期刊审稿人。中国研究生电子设计竞赛全国总决赛一等奖、最佳论文奖和华为专项赛季军指导老师、本科毕业实习优秀指导教师。
institutes: []
research_direction_raw: 5G/6G/物联网通信及微波射频技术、基于AI的微波器件设计、生物/医疗/遥测传感器、人工智能、多物理场分析、无线自组网与网络协议、电机设计与控制、雷达算法。
