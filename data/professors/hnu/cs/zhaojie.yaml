bio_raw: 赵捷，湖南大学计算机学院教授，博士生导师，国家级青年人才计划获得者，智源人工智能研究院智源学者，湖南大学岳麓学者特聘B岗，也曾入选中国人民大学杰出青年学者A岗。近年来先后主持和参与了国家自然科学基金优秀青年科技基金项目、区域创新发展基金重点项目、青年基金项目、国家重点研发计划子课题、国家重大专项子课题等项目。以第一/通讯作者身份发表的研究成果已发表在ASE、ISSTA（软件工程领域）、ISCA、MICRO（体系结构领域）、OSDI（操作系统领域）、PLDI（程序设计语言领域）、PPoPP（高性能计算领域）等CCFA类会议和期刊上。曾获2023年度ACMSIGHPCChina新星奖、2021年度郑州专家“智库贡献奖”二等奖、2020年度MICRO会议最佳论文提名、2013年度军队科技进步二等奖等奖项。赵捷的英文个人主页可通过https://yaozhujia.github.io/访问，赵捷带领的CYCLELab实验室主页可通过https://cyclelaboratory.github.io/访问。
