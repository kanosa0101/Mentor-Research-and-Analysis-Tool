bio_raw: 欧阳柳波，湖南衡阳人，工学博士，副教授，CCF高级会员，AAIA会员。2012年博士毕业于中南大学计算机应用技术专业，爱尔兰国立梅努斯大学(NUI,Maynooth)计算机科学系访问学者，长沙市企业兼职科技副总。主要研究领域为：软件工程、知识工程、自然语言处理等。主讲课程有：软件需求工程、软件工程导论、软件项目管理、文本数据处理、深度学习与AI+思维、高级需求工程、软件需求分析与建模等。
