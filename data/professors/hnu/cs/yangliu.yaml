bio_raw: 杨柳，女，湖南湘阴人，助理教授，博士在读。2001年获湖南大学通信工程学士学位，2004年获湖南大学计算机应用硕士学位。2004年7月留校任教，主讲《程序设计基础》和《C++程序设计》课程。参与多项国家和省部级科研与教改项目，出版专著一部，发表核心刊物多篇。主要研究方向为软件工程、图像处理等。
