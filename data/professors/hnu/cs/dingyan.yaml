bio_raw: 丁岩，博士，副教授，博士生导师，中国科协青年托举人才、湖南省湖湘青年英才、中国电子学会青年托举人才。2021年12月博士毕业于湖南大学，同年在湖南大学计算机科学与技术学科从事博士后研究。2023年12月留校任助理教授，2025年9月晋为副教授。主要研究领域涉及高性能计算、边缘智能、并行与分布式处理、体系结构等。以第一作者或通讯作者身份在领域顶级学术期刊或会议IEEE-TPDS、IEEE-TC、IEEE-TSC、ACM/IEEE-DAC等上发表论文多篇，获2019年ISPA会议杰出论文奖（排名第1/5）、教育部科学研究优秀成果一等奖（排名第6/13）。主持国家自然科学基金面上项目、青年项目，中国博士后科学基金特别资助等省部级及以上项目多项。
