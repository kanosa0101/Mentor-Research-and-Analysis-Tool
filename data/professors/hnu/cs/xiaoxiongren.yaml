bio_raw: 拥有多项国际IT认证证书，感兴趣的研究方向为高效能嵌入式计算、软件工程、计算机网络等。近年来在嵌入式计算、高效能计算等领域以第一和通信作者发表高水平学术论文多篇，获中国发明专利5项，主持和参与多项国家和省部级项目。曾获IEEE-ISPA最佳论文奖、教育部CSC-IBM奖教金、湖南省教学比赛一等奖、湖南省省级教学成果一等奖2项、湖南大学“我心目中最敬爱的老师”、湖南大学教学优秀奖等。指导学生多次在国家级学科竞赛中获得一等奖。
institutes: []
