bio_raw: 许莹（Ying，Xu），副教授，博士生导师，英国诺丁汉大学计算机科学博士，计算机科学系主任、湖南省人工智能与计算媒体研究生培养创新基地负责人、湖南大学数字媒体研究所副所长。
