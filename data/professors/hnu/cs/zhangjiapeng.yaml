bio_raw: 张嘉鹏，博士，副教授，博士生导师。入选湖南省芙蓉计划青年人才，中国电子学会青年人才托举工程。本科毕业于中国科学技术大学，博士毕业于上海交通大学。目前主要研究方向包括算力网络下的数据与算力调度、大语言模型训推性能优化等，在国际顶级学术期刊与会议发表多篇论文，长期担任TON/TMC/TKDE/TIFS等期刊审稿人。担任2024年中国图灵大会组委会副主席，现任CCF分布式计算与系统专委会执行委员、IEEEHPCC与IEEEICA3PPTPCmember，AAAI/CVPR/IPDPSPCmember。
