title: 副教授
bio_raw: 王汉武，男，博士(香港)，副教授，现为湖南大学信息科学与工程学院教师，研究生导师，从事教学与科研工作。已于国际IEEE重要期刊与IEEE会议上面发表了一批较高质量的科研学术论文，已主持留学回国人员科研项目，和国家自然科学基金项目。主要教授课程为《计算机网络》，《移动通信技术》，AWNMC(全英文留学生课程)，《无线网络与移动计算》，已指导了多届本科生毕业生以及多届硕士研究生。研究领域包括高速无线网络，资源管理，MA信道传输，业务调度，性能评估，优化算法等。
