bio_raw: 提出了时空调度和超智融合计算理论和关键技术，提高了超算的海量数据处理能力、异构资源协同能力和智算效率。系统性提出了算力原生的基础理论与技术架构，实现了湖超云曦算异构算力统一调度平台等核心产品，组织研发了国家超算互联网资源共享平台、湖南省算力调度平台等算网工程。
