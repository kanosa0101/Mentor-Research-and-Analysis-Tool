bio_raw: 2019年博士毕业于湖南大学控制科学与工程专业（模式识别与智能系统方向）。于2016-2017年在冰岛大学校长、遥感信息处理领域知名专家JonAltiBenediktsson教授（IEEEFellow）团队联合培养1年。长期从事图像（遥感图像）信息获取与智能处理算法研究，机器人视觉语言导航与定位研究等内容。在相关领域的国际期刊/会议发表论文20余篇，其中IEEETransactions期刊论文11篇，中科院SCI一区论文12篇。主持国家自然科学基金2项，主持湖南省和长沙市自科基金2项，横向项目1项。在国家自然科学基金创新研究群体项目、教育部“111”引智基地、湖南省“视觉感知与人工智能”重点实验室中担任研究骨干。目前担任智能计算系副系主任。
