bio_raw: 杨磊，教授，博士生导师，美国UMassLowell访问学者，CCF高级会员，ACM、IEEE会员,华为大数据认证讲师，兼任湖南大学重庆研究院院长。主要研究领域及兴趣：分布式计算与存储、群智计算、具身智能、人工智能及其应用、大数据处理、计算机网络。
