bio_raw: 博士，副教授，博士生导师。1995年毕业于湖南大学应用数学专业，获理学学士学位，2002年在湖南大学获计算机应用专业工学硕士学位，2006年3月在日本国奈良先端科学技术大学大学信息处理学专业获工学博士学位。2006，2009年分别以日本国COE研究者、JASSO归国外国人研究者、NAIST访问研究者身份对日本国奈良先端科学技术大学院大学进行短期访问，2011年7月至2012年7月为国家公派访问学者(美国加州大学圣巴巴拉分校)。计算机学会容错计算专业委员会委员，湖南省普通高校青年骨干教师培养对象（2011），教育部新世纪优秀人才（2012）。
