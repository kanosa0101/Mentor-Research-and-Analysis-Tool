bio_raw: 1972年生，南县人。工学博士，湖南大学计算机学院教授、博士生导师。1994年武汉纺织工学院（现武汉纺织大学）工业自动化专业本科毕业，2003年华中科技大学计算机系统结构专业博士研究生毕业，毕业后即到湖南大学从事教学科研工作。2006年11月至2007年12月于美国休斯顿大学进行学术访问，从事石油勘探的大规模地震数据并行处理和可视化研究。目前主要围绕计算机视觉、智能网联汽车、物联网技术及应用等开展研究及产学研用合作。
