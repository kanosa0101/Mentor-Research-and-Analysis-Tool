bio_raw: 李仁发，教授（1997年），工学博士。1978年考入天津大学，先后获天津大学工学学士、天津大学工学硕士学位、华中理工大学（现华中科技大学）博士学位。1994年在乔治.华盛顿大学短期研修。在国营742厂（现华晶电子集团）工作2年，任技术员。1987年后，一直在高校从事教学与科研工作，1993年破格晋升为计算机学科副教授，1997年破格晋升为计算机学科教授，享受国务院颁发政府特殊津贴专家，获全国优秀教师称号，省记一等功，国家超级计算长沙分中心湖南省聘专家组成员，湖南省科协第九届委员会委员。2002年起，任湖南大学计算机与通信学院院长。2010年底任教务处长兼信息学院副院长。2012年起兼任嵌入式与网络计算省重点实验室主任。2014年起，任湖南大学信息科学与工程学院院长。
