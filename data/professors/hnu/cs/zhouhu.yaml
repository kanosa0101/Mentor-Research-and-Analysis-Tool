title: 副教授
bio_raw: 毕业于美国纽约理工学院（NYIT）；美国纽约理工学院中国区校友会副会长；中美科技创新促进联合会（俄勒冈州）2005-2007中方执行会长；湖南省财税法学会常务理事；南昌理工学院客座教授；湖南省教育厅ITE中心副主任。研究方向：人工智能、数字媒体、AI信息系统管理。科研与开发工作，校内外（含校外国家事业企业单位）第一主持国家级纵向课题5项，主导企业技术开发研发项目1百余项；教学工作，获湖南大学课堂教学比赛一等奖，湖南省信息化教学竞赛一等奖、第一指导学生课外科技作品获教育部A类大赛一等奖6项，二等奖近二十项。第一主持省级教改课题一项，参与多项。国家级一流课程“计算与人工智能概论”核心成员。发表教改论文多篇。
