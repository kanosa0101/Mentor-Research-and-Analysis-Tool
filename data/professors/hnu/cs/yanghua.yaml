bio_raw: 教授，博士生导师，教育部新世纪优秀人才，湖南省优秀党务工作者，湖南省双带头人标兵，湖南省优秀硕士导师。中国电子学会高级会员，中国光学学会会员，湖南省通信学会理事，湖南省光学学会理事，湖南省物理学会理事，湖南省通信行指委委员。硕士毕业于中南大学信息科学与工程学院，博士毕业于复旦大学信息科学与工程学院，美国罗彻斯特大学访问学者。先后主持或主研包括国家自然科学基金、国家863、国家重大专项和国家重点研发计划在内的国家、省部级科研项目三十余项，与企事业单位合作横向科研项目十余项；若干有创新性的成果获得同行专家的肯定，在ACSphotnics,APL,JLT,PRA,OL,OE等国际重要期刊上发表五十余篇学术论文。指导学生在“互联网+”大学生创新创业大赛中获得国家级银奖、省级一等奖。主讲通信光电子学、信息光电子学等课程，国家级一流课程负责人、湖南省一流课程负责人，在湖南省高校教学比赛中获奖。OE,AO等期刊评审专家，国家自然科学基金通讯评审专家，北京市、湖南省等省市自然科学基金评审专家，教育部学术评审专家。
