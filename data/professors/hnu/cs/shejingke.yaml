bio_raw: 佘兢克，工学博士，副教授，硕士生导师。本科毕业于清华大学工程物理系核工程与技术专业，加拿大纽芬兰纪念大学计算机工程硕士，加拿大西安大略大学电气与计算机工程博士，后入职加拿大坎杜能源公司从事核电安全系统及自动仪控系统的研发工作并成为加拿大职业工程师协会会员。作为湖南省“青年百人计划”引进人才入职湖南大学，同时入选湖南省“湖湘人才聚集工程-创新人才”计划。中国仿真学会第八届理事会理事，中国计算机学会（CCF）嵌入式系统专家委员会委员。当前主要研究方向为智慧水务数字孪生仿真平台、工业智能仪控平台、工况智能预测与故障诊断、智能化的工业互联网边缘计算平台以及事故应急仿真。
institutes: []
research_direction_raw: 智能水务数字孪生仿真平台、工业仪控平台（核电）中的人工智能方法、智能预测与故障诊断、基于人工智能方法的工业互联网边缘计算平台、核电站事故应急仿真与决策方法。
