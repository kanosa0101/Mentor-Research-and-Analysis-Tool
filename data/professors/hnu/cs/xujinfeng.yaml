bio_raw: 徐进锋，博士，助理教授。2020年获山东大学学士学位，2026年获华中科技大学博士学位。目前研究方向包括三维视觉、计算机图形学、点云理解及深度学习，专注于动态开放环境下的三维场景理解。在TPAMI、CVPR、AAAI、TVCG、TMM等CCF-A类会议与期刊发表论文10余篇。参与国家自然科学基金等多个项目，担任CVPR、AAAI、ECCV、TOMM等国际会议期刊的审稿人。
