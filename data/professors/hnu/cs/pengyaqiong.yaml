bio_raw: 彭亚琼，博士，副教授，CCF/IEEE/ACM会员。主要研究领域包含并行与分布式处理、服务计算、具身智能、大模型安全等，主持国家自然科学基金1项，担任IEEE-TPDS、IEEE-TNNLS等有国际影响力刊物的审稿人，已在国际顶级学术期刊与重要学术会议发表论文近20篇。
