bio_raw: 姓名:杜四春，男，生于1975年2月，湖南邵东人，博士，湖南大学信息科学与工程学院副教授、博士研究生导师、先进通信技术湖南省高校重点实验室核心成员。长期从事人工智能、类脑智能、存算一体集成电路、AI芯片设计等方面教学和科研工作，主持承担国家自然科学基金项目2项，部省级项目3项，参与国家及省部级项目8项，在国内外学术期刊上及国际会议上发表论文30余篇，其中SCI检索30篇。联系方式：jt_dsc@hnu.edu.cn
