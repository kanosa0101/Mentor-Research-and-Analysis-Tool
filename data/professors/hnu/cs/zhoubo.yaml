bio_raw: 周波，男，中共党员，计算机专业讲师，1974年生于湖南省宁乡，1992年考入岳阳大学化学工程系，1995.6毕业，1995.7进入岳阳市酿酒总厂从事设备管理。1999.9考入湖南大学计算机学院学习。2002.6研究生毕业，获工学硕士学位。2002.9进入湖南大学软件学院参加教育工作至今。研究兴趣：软件工程、病毒、电子商务、网络技术及应用、计算数学
