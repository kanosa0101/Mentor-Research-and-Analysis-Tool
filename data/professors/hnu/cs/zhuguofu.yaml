bio_raw: 朱国富，湖南大学信息科学与工程学院特聘研究员，国防科技大学兼职教授，中国电子学会高级会员，LEEE会员。长期从事军用雷达技术的研究，主持参与了多项国防研究项目，获得军队科技进步一等奖2项，出版专著3部，发表论文50余篇，获得国家发明专利和软件著作权15项。
