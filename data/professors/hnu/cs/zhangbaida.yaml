bio_raw: 张百达，1984年生，汉族，中共党员，现为湖南大学研究员，博士生导师，长期从事强化学习方面的研究与教学，多次参加银河/天河超级计算机系统的攻关研制工作，取得了一系列重要的技术成果，获军队科技进步三等奖一次，获慈云桂科技奖金一次，荣立三等功一次。主持多项国家级项目的研制，发表论文二十余篇，授权专利五项。
