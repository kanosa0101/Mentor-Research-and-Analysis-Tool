bio_raw: 蔡宇辉，湖南大学计算机学院副教授。研究方向为人工智能、图像处理、网络安全。教育部“101计划”课程建设组专家，全国高等院校计算机基础教育研究会（AFCEC）人工智能通识教育专委会常务委员。两项人工智能通识课程团体标准主要完成人，出版教材8部。主持教育部重点项目，获省级教学成果特等奖、中国高校科学技术奖二等奖、全国高等院校计算机基础教育研究会（AFCEC）优秀教师、亚太人工智能教育优秀教师、教育部产学合作协同育人优秀项目等奖励。
