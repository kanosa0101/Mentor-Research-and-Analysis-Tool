title: 副教授
bio_raw: 蔡宇辉，湖南大学信息科学与工程学院副教授。研究方向为计算机网络、图像处理、人工智能、软件工程，主讲计算与人工智能概论、三维图形程序设计等课程。主持教育部重点项目一项，主持省教改项目一项，主持企业研发项目多项，主持教育部产学合作协同育人项目两项，项目“基于PaddleHlub的非计算机专业深度学习教学资源建设”入选2022年度“教育部产学合作协同育人项目〞优秀项目案例。发表CSCD等核心期刊论文10余篇，申请发明专利20余项。获中国高校科学技术奖二等奖一项。2023年受聘为教育部计算机领域本科教育教学改革试点工作计划（“101计划”）课程建设组专家，完成规划教材《计算机科学导论》建设，翻译出版“国外经典教材系列”教材一部。2023年作为主要成员完成“计算与人工智能概论”课程建设并获批国家级线上线下一流课程。2018年指导学生参加全国大学生程序设计竞赛（国家级）获得金牌，2022年指导学生参加全国大学生智能汽车竞赛荣获全国总决赛二等奖，多次获得湖南大学创新创业优秀指导教师称号。
