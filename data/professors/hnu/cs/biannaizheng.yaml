title: 副教授
bio_raw: 边耐政，硕士，男，1969年3月出生于浙江省嘉兴市。现任湖南大学信息科学与工程学院副教授，湖南大学IT治理研究所所长。1987年9月进入湖南大学化学化工学院分析化学专业学习，1991年毕业后留校，历任政治辅导员、院分团委书记、校职改办副主任兼师资办副主任。2000年赴美留学，就读于美国弗吉尼亚学院及州立大学（VirginiaPolytechnicInstituteandStateUniversity）计算机系，2002年5月取得计算机科学与应用硕士学位。2002年9月回国后至湖南大学软件学院任教至今。
