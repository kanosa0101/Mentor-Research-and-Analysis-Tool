bio_raw: 李智勇，工学博士，教授、博士生导师。2004年湖南大学控制理论与控制工程专业博士毕业，2006年-2007年于德国Dortmund大学计算机科学系从事博士后研究，2015年于美国麻省大学Lowell分校进行学术访问。2014年获评湖南省普通高校“人工智能”方向学科带头人，2020年获评湖南大学“岳麓学者”特聘教授，2025年获评“宝钢优秀教师奖”。
