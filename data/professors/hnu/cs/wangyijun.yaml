bio_raw: 王怡君，博士，助理教授。2014年本科毕业于中国科学技术大学，2019年博士毕业于中国科学技术大学大数据分析与应用安徽省重点实验室。2016-2017年于微软亚洲研究院进行研究实习。2021年12月加入湖南大学信息科学与工程学院。主要研究方向为数据挖掘、自然语言处理、神经机器翻译等，已在国际顶级学术期刊与重要学术会议发表论文10余篇，担任KDD、AAAI、CIKM等会议以及TKDE、TNNLS等期刊的审稿人。
