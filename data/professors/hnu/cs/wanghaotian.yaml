bio_raw: 王昊天，博士，助理教授，湖南省芙蓉计划青年人才（科技创新类）。江西抚州人，本科毕业于南昌大学，博士毕业于湖南大学，读博期间曾赴NanyangTechnologicalUniversity联合培养。入选2024年度博士后创新人才支持计划(国家资助博士后研究人员计划A档)，湖南大学赫曦博士后，副研究员。
