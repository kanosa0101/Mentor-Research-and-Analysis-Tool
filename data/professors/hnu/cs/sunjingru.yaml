bio_raw: 孙晶茹，女，博士，湖南大学信息科学与工程学院通信工程系副教授，博士研究生导师。2004年硕士毕业于东北大学计算机软件与理论专业，并于当年进入湖南大学信息科学与工程学院工作。2014年博士毕业于湖南大学计算机科学与技术专业。2016年3月—2017年3月，英国赫特福德大学访学。主要从事忆阻器存算一体电路设计、图像加密技术，智慧交通等方向的研究工作。近年来发表SCI检索论文20余篇，主持国家自然科学基金面上项目一项，湖南省自然科学基金项目2项，湖南省科技计划项目1项，参与国家自然科学基金项目及其他省部级项目多项。
