bio_raw: 谢国琪，博士、教授、博士生导师，嵌入式与网络计算湖南省重点实验室主任、国家级青年人才、湖南省杰青、ZVM嵌入式虚拟化实时操作系统创始人（ZVM官网：http://esnl.hnu.edu.cn/zvm/）。兼任中国计算机学会（CCF）嵌入式系统专委秘书长，担任JSA、JCSC及MICPRO3本SCI期刊编委，获华为开源贡献精英教师奖。
