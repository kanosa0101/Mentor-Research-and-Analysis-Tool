bio_raw: 陈长建，博士，副教授,博士生导师，湖南省芙蓉计划青年人才。2017年本科毕业于中国科学技术大学，2022年博士毕业于清华大学。主要研究方向为交互式机器学习、可视分析、以数据为中心的人工智能等，已在国际顶级学术期刊与重要学术会议发表论文20余篇，获中国图学学会优秀博士论文激励计划。担任VIS(CCF-A)档案主席，VIS(CCF-A)、PacificVis、ChinaVis的程序委员会委员，《计算机辅助设计与图形学学报》编委、《Visual_Informatics》青年编委。
