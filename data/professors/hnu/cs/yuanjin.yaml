bio_raw: 袁进，博士、副教授、博士生导师。2008年，复旦大学计算机信息与技术系毕业，获硕士学位；2013年，新加坡国立大学计算机学院毕业，获博士学位；2014年9月加入湖南大学信息与工程学院计算机工程系。
