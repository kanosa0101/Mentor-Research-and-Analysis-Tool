bio_raw: 姜文君，湖南大学教授，博导，岳麓学者，CCF高级会员，分布式计算与系统专委会委员，中文信息学会社会媒体处理专委会委员，湖南省普通高等学校青年骨干教师培养对象。主要研究兴趣包括社交网络分析、个性化推荐、智慧教育与学习优化等。
