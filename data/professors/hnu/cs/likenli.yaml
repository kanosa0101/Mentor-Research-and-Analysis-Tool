bio_raw: 李肯立，湖南大学副校长，国家超级计算长沙中心主任，全国创新争先奖获得者，入选国家高层次人才计划，CCF会士，宝钢优秀教师，享受国务院政府特殊津贴。教育部高效能计算学科创新引智基地负责人、高性能计算应用软件技术教育部工程研究中心主任。国家超级计算创新联盟副理事长、新一代人工智能产业技术创新联盟专家委员会委员、高性能计算国家重点研发计划总体专家组成员、IEEE高级会员、CCF长沙主席、湖南省计算机学会副理事长、IEEE-TC/TSUSC/TII副编辑、《计算机研究与发展》编委。主持国家重点研发计划、国家重大科研仪器研制项目、基金委重点项目、JWKJW重点项目等国家和省部级项目40余项。以排名第一获国家科技进步二等奖2项、中国专利金奖1项、省部科技一等奖4项，获国家科技进步一等奖创新团队奖(排名13)。主要研究领域为高性能计算调度与应用，发表CCF推荐A类会议/期刊、IEEE/ACM汇刊论文200余篇。获授权专利和软件著作权共150余项。
