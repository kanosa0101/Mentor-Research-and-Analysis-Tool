bio_raw: 罗娟，岳麓学者特聘教授，博士生导师，副院长。本科毕业于国防科技大学，硕士博士毕业于武汉大学。曾就职于武汉邮科院烽火网络公司，美国加州大学Irvine分校访问学者。入选教育部新世纪优秀人才，获得湖南省杰出青年基金、教育部-华为智能基座优秀教师、湖南省青年骨干教师。入选2021斯坦福大学发布的“全球前2%顶尖科学家”榜单。获得湖南省教学成果一等奖、湖南省技术发明二等奖、机械工业科技进步二等奖等。
