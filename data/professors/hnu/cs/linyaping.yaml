bio_raw: 林亚平：教授，博士生导师。1982年获湖南大学授予的学士学位、1985年获国防科技大学授予的硕士学位、2000年获湖南大学授予的博士学位。2004年-2005年在美国Texas大学Arlington分校访问研究。长期从事计算机科学与技术和软件工程教学与科研工作。主要研究方向包括计算机网络、云安全和机器学习。
