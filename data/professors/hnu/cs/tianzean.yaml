bio_raw: 田泽安，男，博士，博导，副教授。2000年和2009年于湖南大学获工学硕士学位和工学博士学位、2010年3月至2014年3月于澳大利亚新南威尔士大学材料科学与工程学院从事博士后研究。主要研究方向为高性能计算、复杂结构可视分析、材料计算、复杂系统动力学、无序体系结构分析。发表SCI论文200余篇，获授权专利和软件著作权共10余项。主持国家自然科学基金面上/地区项目各1项，国家自然科学基金联合项目子课题1项，省部级自科基金3项；参与国自科面上项目3项；参与国家重点研发计划项目4项。
