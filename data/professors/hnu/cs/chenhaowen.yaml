bio_raw: 陈浩文，计算机应用技术博士，教授（正高级实验师），现代工程训练中心副主任，湖南大学开源鸿蒙高校俱乐部主任，湖大-天阳金融超算联合创新中心副主任，湖南大学熊晓鸽优秀奖教金，湖南大学教学优秀奖，湖南大学先进工作者，湖南大学优秀共产党员，湖南大学实验室管理优秀个人，国际机器人期刊EmbodiedIntelligenceandRobotics编委，中国自动化学会会员，湖南省信息技术标准化技术委员会专家，中国高校创新创业教育研究中心首批专家、中国人工智能学会会员，湖南省人工智能学会理事，中国机器人大赛技术委员会组委，世界机器人大赛优秀指导教师，研究方向包括：人工智能、深度学习、自然语言处理、生物信息学、嵌入式系统等
