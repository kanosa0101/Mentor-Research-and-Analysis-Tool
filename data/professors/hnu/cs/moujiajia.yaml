bio_raw: 湖南大学信息科学与工程学院特聘研究员，省双创人才，省333人才，长期从事信息安全与保密、数据安全、数据防泄漏等研究工作；作为项目负责人承担国家保密局揭榜挂帅项目、国家博士后基金、装备预研项目、重点型号项目、军委科技委创新特区项目、省级自然科学基金等项目20余项；累计发表论文50余篇，获得国家发明专利8项；获得省部级、军队科技进步二等奖2项，三等奖3项。
