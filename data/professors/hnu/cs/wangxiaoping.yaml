bio_raw: 博士，博士生导师。2009年作为访问学者赴香港科技大学计算机系访问1年。2010年-2018年国防科技大学计算机所助理研究员。2018年至今，湖南大学信息科学与工程学院副教授，博士生导师。主要从事人工智能和高性能计算机系统的研究，获军队科技进步一等奖1项。作为项目负责人主持军队预研项目4项，国家自然科学基金面上项目1项，以及重点实验室开放课题1项。入选科技部科技专家库、教育部学位评审专家、军队某部评审专家、湖南省科技奖励评审专家、湖南省高新技术企业和技术先进型服务企业认定评审专家、长沙市科技专家。发表学术论文70余篇，包括IEEE/ACMTON,IEEETPDS,ACMPPoPP等顶级期刊和会议，论文被引用超过600次。目前从事深度学习算法和理论研究，主要研究方向有自然语言处理、计算机视觉等。
