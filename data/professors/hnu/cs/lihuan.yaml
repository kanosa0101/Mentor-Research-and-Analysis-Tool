bio_raw: 河北辛集人，80后，本硕博毕业于国防科技大学电子科学学院，师从孙茂印教授，在国防科大留校任教多年，深受科大“银河精神”和“北斗精神”的教育熏陶，秉承哈军工的优良传统，树立了严谨求实、不畏困难、争先创优的教学科研态度和饮水思源、不忘初心、和谐共进的做人做事原则。专注于计算机图形图像处理和GIS、仿真系统的研制，在军事地理信息系统、军事作战环境仿真、目标多维特性管理与分析等方面开展技术研究和系统研制，具有丰富的项目论证和系统研制经验；亲和力强，善于团结队伍，攻克技术难关；一直保持对新技术的热情，掌握各种编程语言和B/S、C/S软件开发，熟悉容器、微服务、深度学习、AI等新技术；始终怀着一颗报效祖国、服务军工的心，在湖南大学将继续团结力量、服务军工，用更智能化的系统和科技为强国强军贡献力量！后续工作重点将基于湖大和超算中心强大的算力平台和并行计算技术，支撑复杂战场条件下目标和环境电磁特性数据的实时化、交互化仿真计算，形成实时特性数据仿真生成能力。
