bio_raw: '罗定生

  职称：副教授

  研究所：信息科学中心

  研究领域：人工智能、机器学习、语音语言信息处理、智能信息处理、机器人学、仿人机器人等

  办公电话：86-10-62752502

  电子邮件：dsluo@pku.edu.cn

  个人主页：

  http://scholar.pku.edu.cn/dsluo

  罗定生，北京大学副教授，博士，北京大学智能科学系副系主任。

  1997年获西北师范大学计算机科学系学士学位，2000年获兰州大学数学系计算数学专业硕士学位，2003年在北京大学视觉与听觉信息处理国家重点实验室、信息科学中心信号与信息处理专业获博士学位，并于同年就职于北京大学，从事教学科研工作至今。所在单位北京大学信息学院智能科学系、机器感知与智能教育部重点实验室。现负责机器学习与智能仿人机器人课题组。曾于2006年11月至2007年1月，在香港中文大学从事访问研究。

  主要研究领域：

  涉身

  人工智能、机器学习、语音语言信息处理、智能信息处理、机器人学、仿人机器人等。

  近年来，先后承担包括NSFC项目等的国家级、省部级及其他科研项目二十余项；获国家授权发明专利4项，获国家软件著作权1项；在IEEE T CDS、PLOS ONE、IJARS、IEEE
  IROS、Humanoids、IEEE ICDL、ACL、COLING、EMNLP、IEEE ICMLA、ECML等国际期刊会议上发表学术论文80余篇。2002年，获第十二届全国神经计算学术大会“最佳论文奖”（Best
  Paper Award）； 2008年与2016年，两次获北京大学“优秀教学奖”；2013年，获第23届人工智能国际联合大会(IJCAI-2013)“机器人技能国际竞赛(IJCAI-13
  Robot Competition)”一等奖（First Prize Award）；2015年与2016年，两次获IEEE ICIA国际学术会议“最佳论文提名奖”（Best
  Paper Finalist Award）；2016年，获北京大学“教学优秀奖”等；2017年，获湖北省科技进步奖二等奖；2019年，获“2019共融机器人挑战赛”（NSFC工程与材料科学部联合主办）青年创意组“最佳青年风采奖”；2019年，获世界机器人大会(WRC2019)“最佳论文提名奖”（Best
  Paper Finalist Award）等。

  现为IEEE会员、AAAI会员，中国人工智能学会(CAAI)高级会员，IEEE-RAS仿人机器人技术委员会委员(Technical Committee on Humanoid
  Robotics)，IEEE-IES运动控制技术委员会委员(Technical Committee on Motion Control)。担任《中国听力语言康复科学杂志》常务编委，以及多个国际国内学术期刊会议的论文审稿人。多次担任国际学术会议分会主席及程序委员会委员，应邀担任智能科学国际会议(ICIS
  2018)大会秘书长(Secretary General)、Ubiquitous Robots 2020国际会议编委(Associate Editor)、CoRL
  2020国际会议领域主席(Area Chair)，并受推荐将于2021年担任“IEEE发展机器人学国际会议(IEEE ICDL 2021)”大会主席(General
  Chair)。

  承担主要科研项目(Projects Funded)：

  国家自然科学基金重大项目：韵律模型的构建及在言语识别中的应用（11590773），445.6万，主要参加者，2016.01-2020.12.

  国家社科基金重大项目：基于多学科视域的认知研究（12&ZD119），80万，主要参加者，2012.10-2017.10.

  北京市基础教育阶段创新人才培养系列项目：基于IMU人体姿态检测的机器人手臂控制、基于多传感器智能垃圾分类机器人研究、交响乐音乐会智能录制机器人研究，10万，项目负责人，2013.01-2016.12.

  北京大学“医-信”交叉研究种子基金项目：人体步态触地信息分析、生物力学建模及其在机器人类人行为中的应用(2014-MI-10)，10万，项目负责人，2014.06-2015.12.

  国家自然科学基金创新研究群体科学基金项目：高逼真度视听系统的理论与方法（61121002），300万，主要参加者，2012.01-2014.12.

  国家基金重点项目：多人多方对话中的语音分离、内容分析与理解（90920302），280万，合作单位负责人，2010.1-2013.12.

  国家科技重大专项：基于框计算的新一代搜索引擎与浏览器（2011ZX01042-001-001），200万，主要参加者，2010.1-2012.12.

  国家项目课题：双色网络的数学建模与数学、物理学、生物学（2009CB825404），40万，课题负责人，2009.1-2011.12.

  微软亚洲研究院高校研究项目：Research on Acoustic Modeling for ASR，10万，项目负责人，2010.10-2011.10.

  国家自然科学基金项目：语音识别中多层语言知识建模及全局解码算法研究（60605016），25万，项目负责人，2007.1-2009.12.

  国家项目（目标导向）：智能中文搜索引擎技术研究及平台构建（2006AA01Z196），335万，主要参加者，2006.12-2009.12.

  国家项目课题：数学机械化在生物特征识别中的应用（2004CB318005），200万，主要参加者，2005.1-2009.12.

  国家自然科学基金重点项目：基于感知学习和语言认知的智能计算模型（60435010），170万，合作单位第二参加者，2005.01-2008.12.

  北京大学工程研究院项目，网络环境下的计算理论与计算复杂性研究，50万，主要参加者，2005.1-2007.12.

  国家项目：移动互联环境下的身份识别：限定文本的说话人确认技术研究及其在金融领域中的应用（2001AA114181），80万，主要参加者，2001.01-2003.12.

  国家自然科学基金面上项目：基于统计学习的多专家模型的研究及在机器知觉中的应用（60075017），17万，主要参加者，2000.1-2003.12.

  近年发表主要论文(Publications)：

  Huang H.S., Qiu J.W., Liu T.L., Yu Y.Y., Guo Q.W., Luo D.S., Ao Y.F., “Similarity
  of Center of Pressure Progression during Walking and Jogging of Anterior Cruciate
  Ligament Deficient Patients”, PLOS ONE, pp.1-16, DOI:10.1371/journal.pone.0169421,
  January 10, 2017.

  Luo D.S., Hu F., Zhang T., Deng Y.A., Nie M.X. and Wu X.H., “Human-Inspired Internal
  Models for Robot Arm Motions”, 2017 IEEE/RSJ International Conference on Intelligent
  Robots and Systems(IROS), Vancouver, BC, Canada, Sep. 24-28, 2017.

  Zhang T., Hu F., Deng Y.A., Zhai J.H., Wu X.H., Luo D.S., “A Hierarchical Inverse
  Model Based on Proprioception and DNN for Robot Reaching”, 2017 IEEE 43rd Annual
  Conference of the IEEE Industrial Electronics Society (IECON), Oct.29-Nov.1, 2017.

  Wei Y.Y., Liu T.L., Deng Y.A., Wu X.H., Luo D.S., “Learning to Chase a Ball Efficiently
  and Smoothly for a Wheeled Robot”, 2017 IEEE 24th International Conference on Mechatronics
  and Machine Vision in Practice, Nov. 21-23, 2017.

  Tang K.W., Hu F., Liu W.T., Deng Y.A., Wu X.H., Luo D.S., “Corner Detection Based
  Real-Time Workpiece Recognition for Robot Manipulation”, 2017 IEEE 24th International
  Conference on Robotics and Biomimetics, Dec. 5-8, 2017.

  Wu X.F., Liu. T.L., Deng Y.A., Wu X.H., Luo D.S., “Developing Robot Drumming Skill
  with Listening-Playing Loop”, Advances in Swarm Intelligence, ICSI 2017, Part II,
  LNCS 10386, pp. 559-566, DOI: 10.1007/978-3-319-61833-3-59, 2017.'
