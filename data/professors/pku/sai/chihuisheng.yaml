bio_raw: '迟惠生

  教授

  1958年9月入北京大学物理系与无线电电子学系，1964年7月毕业后留校工作，历任教研室主任，无线电电子学系副主任，信息科学中心副主任、主任，视觉与听觉信息处理国家重点实验室副主任、主任，北京大学校长助理、副校长、常务副校长。

  担任多个知名学术刊物编委：如《电子学报》《Chinese Journal of Electronics》《Frontiers of Electrical and
  Electronic Engineering in  China》《智能系统学报》《中国言语听力康复科学杂志》等。

  主要研究领域

  机器感知、听感知机理及其建模、信号与信息处理、语音信号处理等。

  研究经历及主要成就

  1964至1965年，从事噪声中提取微弱信号的研究。

  自1972年起，领导北京大学码分多址卫星通信体制研究组，从事我国331工程中扩频体制的研究，为我国卫星通信的发展作出了贡献。和研究组一起先后于80年代初获得了重大技术改造一等奖，电子部科技成果二等奖。

  1974年起，领导了北京大学数字微波通信中数字基群终端和二次群的研究组，为我国脉码调制数字电话的发展做出了贡献。

  1976年，承担北京市86-89局光缆通信研究任务，领导北京大学的研究组完成了基群与二次群终端。该项目于80年代初获得北京市重大科技成果一等奖，是我国第一个投入使用的光纤通信系统。

  1980年至1982年，受国家派遣赴加拿大Sherbrooke大学通信研究中心从事访问研究，参加了美国NASA与加拿大通信部关于移动卫星通信的可行性研究，从事系统性能的计算机仿真，向加拿大通信部提供了三部最终研究报告。

  1983年至1990年，先后从事智能VSAT终端以及TDM/CDMA  VSAT卫星通信网的研究工作，该项目分别获得国家教委科技成果二等奖（主要参加者）以及电子部的表彰奖励。

  1986年参与视觉与听觉信息处理国家重点实验室的筹建，并于90年获国家计委、中国科学院、国家教委颁发的先进个人奖。

  1987年至1990年承担了科学基金重大项目中一个子项《人工神经网络说话人识别方法研究》。

  1993年至1997年承担了国家攀登项目《人工神经网络理论与应用》中关于听觉模型等子项目的研究，在人工神经网络的理论方法、听觉计算模型以及说话人识别的应用等方面，注意开展跨学科的研究，取得了一些创新的成果，于1999年获得教育部科技进步一等奖
  。

  1994年及1995年先后两次获国际神经网络学会颁发的“神经网络领导奖” （Neural  Network Leadership Award）。先后三次在世界神经网络大会及理事会上作特邀报告，介绍中国在神经网络领域的研究成就。

  1997年参加中国教育和科研计算机网CERNET示范工程工作，是获国家教委科技进步一等奖的集体成员之一。

  1998年至2000年，领导了国家九五攻关项目《国家空间信息基础设施关键技术研究》，于2000年获得教育部科技成果二等奖，并被评为当年中国高等学校十大科技进展之一。

  2002年联合中国聋儿康复研究中心，在国内率先成立一个融教学、科研、康复于一体的言语听觉研究中心，领导听觉认知的生理心理、人工听觉以及听觉康复理论等方面的研究教学工作。

  2005年作为第一署名人，获“国家级教学成果奖”一等奖。

  目前承担国家自然科学基金项目（2

  005年-2008年

  ）

  等课题若干项。

  近年来，先后发表学术论文90余篇，出版专（译）著8部，申请国家发明及实用新型专利9项，培养博士硕士研究生60余名。

