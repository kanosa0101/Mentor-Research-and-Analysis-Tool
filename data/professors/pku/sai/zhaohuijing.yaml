bio_raw: '赵卉菁

  职称：教授

  研究所：信息科学中心

  研究领域：机器感知，智能车，自动驾驶，自主移动机器人

  办公电话：86-10-6275 7458

  电子邮件：zhaohj@cis.pku.edu.cn

  个人主页：

  http://www.poss.pku.edu.cn/

  教育背景

  1996.10—

  1999.09

  ： 东京大学工学系研究科社会基础专业、博士课程、获博士学位

  1994.10—

  1996.09

  ： 东京大学工学系研究科土木工程专业、硕士课程、获硕士学位

  1987.09—

  1991.07

  ： 北京大学计算机科学系软件专业、本科、学术学位

  主要研究领域

  智能车与移动机器人、智能交通、环境感知、驾驶行为理解

  代表性学术论著

  1.

  Biao Gao, Xijun Zhao, Huijing Zhao, An Active and Contrastive Learning Framework
  for Fine-Grained Off-Road Semantic Segmentation, IEEE Trans. on Intelligent Transportation
  Systems (T-ITS), 24(1), 564-579, 2023.

  2.

  Zhezhang Ding, Donghao Xu , Chenfeng Tu, Huijing Zhao , Mathieu Moze, François Aioun,
  and Franck Guillemard, Driver Identification Through Heterogeneity Modeling in Car-Following
  Sequences, IEEE Trans. on Intelligent Transportation Systems (T-ITS), 23(10), 17143-17156,
  2022.

  3.

  Zeyu Zhu, Huijing Zhao, A Survey of Deep RL and IL for Autonomous Driving Policy
  Learning, IEEE Trans. on Intelligent Transportation Systems (T-ITS), 23(9), 14043-14065,
  2022.

  4.

  Biao Gao, Yancheng Pan, Chengkun Li, Sibo Geng, Huijing Zhao, Are We Hungry for
  3D LiDAR Data for Semantic Segmentation? A Survey of Datasets and Methods, IEEE
  Trans. on Intelligent Transportation Systems (T-ITS), 23(7), 6063-6081, 2022.

  5.

  Xiaoliang Ju, Donghao Xu, Huijing Zhao, Scene-Aware Error Modeling of LiDAR/Visual
  Odometry for Fusion-Based Vehicle Localization, IEEE Trans. on Intelligent Transportation
  Systems (T-ITS), 23(7), 6480-6494, 2022.

  主要科研项目

  1. 国家自然科学基金联合基金重点项目（项目负责人），面向移动机器人长期自主机动的环境理解、建模和定位关键技术研究，

  U22A2061

  ，

  2023.1-2026.12.

  2. 国家自然科学基金面上项目（项目负责人），路面车辆行为分析与情境理解，

  61573027

  ，

  2016.1-2019.12.

  3. 国家自然科学基金与法国国家科研署合作研究项目（项目负责人），基于多模态信息融合的智能车感知技术的跨国界研究，

  61161130528, 2012.1-2014.12.

  4. 国家自然科学基金面上项目（项目负责人），面向室外复杂动态场景的三维同时定位定向与地图创建的研究，

  60975061

  ，

  2010.1-2012.12.

  5. 国家自然科学基金重大研究计划重点项目（课题负责人），无人驾驶车辆智能行为综合测试环境设计与测评体系研究，

  90920304

  ，

  2010.1-2012.12.

  6. 法国标致雪铁龙

  PCA-PKU

  开放实验室项目（项目负责人），基于多模态传感器环境感知的驾驶行为建模与理解研究，

  2012.11-2019.12.

  主要获奖成果

  1. First Prize at Valeo Innovation Challenge 2015. (Project title “Visual - based
  On-road Vehicle Detection and Tracking through Online Road Structure Understanding”,
  Team FalconView leaded by Yongkun Fang)

  2.

  The Okawa Fundation Research Grant

  ，

  Semantic Mapping of Dynamic Environment, 2011.3.

  3.

  Most Influential Paper Over The Decade Award

  , by IAPR Conference on Machine Vision and Application, 2009. (Zhao, H., Shibasaki,
  R., Reconstruction Textured Urban 3D Model by Fusing Ground-Based Laser Range Image
  and CCD Image, IAPR Workshop on Machine Vision Application, 1998)

  主要学术任职

  1. Co-chair of IEEE RAS Technical Committee AGV-ITS 2021～至今

  2. Associate Editor of IEEE Trans. on Intelligent Vehicle 2016～至今

  3. Senior Editor of IROS 2023～

  2025

  4. Associate Editor of IROS、

  IV

