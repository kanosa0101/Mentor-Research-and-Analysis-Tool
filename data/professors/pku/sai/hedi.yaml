bio_raw: '贺笛

  职称：助理教授

  所在院系：智能学院

  研究领域：机器学习

  电子邮件：dihe@pku.edu.cn

  个人主页：

  https://dihe-pku.github.io/

  个人简介

  北京大学助理教授、博士生导师。毕业于北京大学，曾担任微软亚洲研究院主管研究员。

  研究方向涉及自然语言处理、图神经网络及利用机器学习技术探索科学领域。其团队设计的图神经网络 Graphormer 在 KDD 2021 分子性质预测挑战赛，及
  NeurIPS 2021 分子动力学模拟挑战赛中击败包括 DeepMind，Facebook AI Research 等对手夺冠。

  在机器学习顶级国际会议 ICML，NeurIPS，ICLR 上发表数十篇论文。长期担任机器学习顶级会议领域主席及审稿人工作。'
