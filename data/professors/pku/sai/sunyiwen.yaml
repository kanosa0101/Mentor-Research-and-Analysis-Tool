bio_raw: '职称：助理研究员

  所在院系：智能学院

  研究领域：智能交通、自动驾驶、智能社会治理等

  电子邮件：sunyiwen@pku.edu.cn

  孙翊文目前于北京大学智能学院担任助理研究员，研究兴趣包括智能交通、自动驾驶、智能社会治理等。他本科毕业于清华大学电子工程系，博士毕业于清华大学自动化系。研究成果在《中国科学：信息科学》《智能系统学报》、IEEE
  T-ITS、Cell Reports Physical Science、TRC、TRE、PR等期刊和会议上发表。担任《智能系统学报》青年编委，IEEE T-ITS、TRC、ACM
  SIGKDD、IEEE ITSC等期刊和会议审稿人。欢迎学术合作与交流；长期招收“通计划”直博生/普博生，合作高校为上交、浙大等，请邮件联系。计划在北大教一门课：智能交通，目前在备课中。'
