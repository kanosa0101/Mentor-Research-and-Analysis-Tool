bio_raw: '查红彬

  职称：教授

  研究所：信息科学中心

  研究领域：智能科学技术、计算机视觉

  办公电话：86-10-6275 5793

  电子邮件：zha@cis.pku.edu.cn

  查红彬，1990 年获日本九州大学博士。同年任日本九州工业大学助教。1991 年任九州大学副教授，现为北京大学信息科学技术学院教授，机器感知与智能教育部重点实验室主任，教育部长江学者奖励计划特聘教授。

  长期从事智能科学技术、计算机视觉的研究。在三维视觉计算、环境几何建模、三维物体识别、三维人脸动画和动态目标跟踪等方面取得了进展。先后提出了基于模型的物体识别、三维建模与形状分析、三维动态目标跟踪等新方法，在将图像处理与分析理论应用到智能机器感知系统方面取得了一系列成果。同时，还在高维数据的表达与特征抽取、物体匹配的距离学习等方面有了一定的突破。另外，还将部分研究成果应用到公安刑侦、医疗与文化遗产的应用中，特别是主持的数字龙门石窟项目得到了国内外同行的高度重视，被中央电视台等多种主流媒体宣传。

  出版学术期刊及国际会议论文300 多篇，其中包括IEEE Trans. PAMI，Int. J. Computer Vision, IEEE Trans. VCG,
  IEEE Trans. RA, IEEE Trans. SMC, Pattern Recognition 等国际期刊以及 ICCV, ECCV, CVPR, CHI,
  ICML, AAAI, ICRA 等国际学术会议论文60余篇。并主持编辑出版Lecture Notes in Computer Science 五部。获99 年度IEEE
  SMC Society Franklin V. Taylor Award，国家技术发明二等奖（2011，排名第二）、教育部技术发明一等奖（2010，排名第二），公安部科技进步二等奖（2011，排名第六），以及国际会议Euromed
  2010 的Best Paper Awards。教育部创新团队“机器感知理论及应用”团队学术带头人（2009）。曾任或现任国家自然科学基金委信息科学部第六届专家咨询委员会委员（2011-）、教育部科技委信息学部委员（2004-）、IEEE
  北京分会的执委并兼任该分会的技术委员会主席（2006-2007）、中国图象图形学会副理事长（2006-2011）。担任国际学术期刊Advanced Robotics
  顾问委员会委员、IPSJ Transactions on Computer Vision and Applications 共同主编，IEEE Trans. SMC
  三维图像处理与建模专辑客座编委、IEICE Trans. Information and Systems 多分辨率解析专辑编委、The Visual Computer
  专辑编委，《计算机辅助设计与图形学学报》副主编（2006-2010），并担任国际学术会议ACCV’10，3DIMPVT’11，CVM’12大会主席，GMP’04
  组织委员会主席， VSMM’06, IEEE ROBIO’06, ACCV’07,ACCV’09，VSMM’10，IEEE ICMA’11 , IEEE MFI’14,
  ACCV’16等程序委员会主席或共同主席，ICCV’11, ACCV’15领域主席,IEEE/RSJ IROS’13的PC Editor。应邀在日本图像识别和理解领域的最大规模学术年会MIRU’06
  做大会特邀报告，在ACM VRCIA’06 做大会Tutorial 报告，在ICCAS-SICE’09, ISRR’09，VRSJ’09，CAA’11，DMDCM’11，HSI’11
  , OSA 2015 Imaging Systems and Applications , ACM IMCOM’16等做大会特邀报告。'
