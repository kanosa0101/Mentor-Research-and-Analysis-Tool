bio_raw: '曾钢

  职称：研究员

  研究所：信息科学中心

  研究领域：计算机视觉和图形学，三维场景建模，基于图像或交互的建模和渲染，自动图像分割

  办公电话：86-10-6275 7069

  电子邮件：gang.zeng@pku.edu.cn

  2001年本科毕业于北京大学数学科学学院，2006年在香港科技大学计算机科学与技术系获博士学位，之后在苏黎世联邦理工学院从事助理研究员工作，2008 年底入选北京大学“青年优秀人才”，长期专注于计算机视觉和图形学研究，特别是基于图像的场景解析和几何建模。在CVPR、ICCV、IJCV、PAMI、SIGGRAPH、TOG等计算机视觉和图形学领域重要国际期刊及会议发表论文50余篇，据Google
  Scholar统计他引2000余次。作为负责人承担了国家重点研发计划项目课题、和多项国家自然科学基金项目。

  曾获得2011年MPR国际研讨会最佳海报奖、2016年ImageNet大规模视觉识别挑战赛（ILSVRC）场景解析（Scene Parsing）比赛的第四名、2017年中国计算机视觉大会（CCCV）最佳论文奖。

  曾担任国际学术期刊Neurocomputing编委，国际学术会议 ACPR 2011、CAD/Graphics 2013、IWRCV 2015领域主席，中国图像图形学学会机器视觉专业委员会秘书长和常务委员、国家能源核电工程建设技术研发(实验)中心数字化核电工程虚拟仿真实验室与协作平台专家组成员、北京大学-微软统计与信息技术实验室助理主任等职务。'
