bio_raw: '邓志鸿

  职称：教授

  研究所：信息科学中心

  研究领域：机器学习与深度学习、自然语言处理、大数据挖掘

  办公电话：86-10-6275 5592

  电子邮件：zhdeng@pku.edu.cn

  个人主页：

  http://www.cis.pku.edu.cn/szdw/zxjs/dzh.htm

  教育背景

  2000年9月至2003年7月，北京大学计算机科学技术系计算机软件与理论，获理学博士学位；

  1997年9－2000年7月，北京大学计算机科学技术系计算机软件与理论，获理学硕士学位；

  1990年9月－1994年7月，浙江大学应用数学系应用数学专业，获理学学士学位。

  研究领域

  目前从事深度学习与自然语言处理、机器学习、大数据分析与挖掘等方面的研究工作。

  代表性学术论著

  1. Liangchen Wei Zhi-Hong Deng. A Variational Autoencoding Approach for Inducing
  Cross-lingual Word Embeddings. In IJCAI 2017, pages: 4165-4171.

  2. Zhi-Hong Deng, Xiaoran Xu. A Novel Probabilistic Clustering Model for Heterogeneous
  Networks. Machine Learning, 104(1):1-24, 2016.

  3. Zhi-Hong Deng, Hongliang Yu, and Yunlun Yang. Identifying Sentiment Words Using
  an Optimization Model with L1 Regularization. AAAI 2016, Pages: 115-121.

  4. He Liu, Hongliang Yu, Zhi-Hong Deng. Multi-Document Summarization Based On Two-Level
  Sparse Representation Model. AAAI 2015, Pages: 196-202.

  5. Hongliang Yu, Zhi-Hong Deng, Yunlun Yang, and Tao Xiong. A Joint Optimization
  Model for Image Summarization Based on Image Content and Tags. In AAAI 2014: 215-221.

  6. Zhi-Hong Deng, Kun-Hu Luo, Hong-Liang Yu. A Study of Supervised Term Weighting
  Scheme for Sentiment Analysis. Expert Systems with Applications, 41(7): 3506–3513,
  2014.

  7. Deng ZhiHong, Wang ZhongHui，and Jiang JiaJian. A New Algorithm for Fast Mining
  Frequent Itemsets Using N-Lists. SCIENCE CHINA Information Sciences, 55 (9): 2008-2030,
  2012.

  8. 邓志鸿, 唐世渭, 张 铭, 杨冬青, 陈 捷. Ontology研究综述。《北京大学学报》（自然科学）, 2002年38卷5期: 730-738.

  主要科研项目

  1. 国家863项目“面向基础教育的类人智能知识理解与推理关键技术”（2015年1月－2017年12月）

  2. 国家自然科学基金面上项目“面向大规模XML文档集的关键词检索系统关键技术研究”（2012年1月－2015年12月）

  3. 国家教育部CALIS项目（三期）“基于学术文献信息网络的科研资源分析、挖掘与服务系统”

  4. 国家自然科学基金重大专项“网格标准基础研究”（2009年1月－2012年6月）

  5. 国家863项目“高性能XML关键词检索系统及其关键技术的研究”（2009年1月－2010年12月）

  主要学术任职

  AAAI 2016-2017, IJCAI 2015, ACM SAC 2009-2013, DEXA 2009-2017, DATA ANALYTICS 2015-2017,
  NLPCC 2014-2015 等国际会议程序委员会委员'
