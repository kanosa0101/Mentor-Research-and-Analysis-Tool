bio_raw: '职称：助理教授

  所在院系：智能学院

  研究领域：语言模型、智能体、常识推理、认知计算

  电子邮件：chizhang.cz@pku.edu.cn

  个人主页：

  wellyzhang.github.io

  张驰，2017年于浙江大学获得计算机科学与技术专业学士学位，2022年在美国加州大学洛杉矶分校（UCLA）获得计算机科学博士学位，师从朱松纯（Song-Chun
  Zhu）教授。2025至2026年于字节跳动Seed大模型团队从事数学与代码推理模型的研发工作，同年加入北京大学智能学院任助理教授。主要研究方向涵盖认知推理、抽象推理、视觉推理、概念学习与神经符号方法，特别是推理过程的结构化表示与优化，以及相关的概率建模、优化方法、大模型推理优化等领域。代表性工作包括：提出基于引导树搜索的奥林匹克几何题求解方法（Nature
  Machine Intelligence, 2026）、作为核心成员参与研发面向自动定理证明的深度推理系统Seed-Prover，以及提出基于极小极大熵学习的人类水平少样本概念归纳框架（Science
  Advances, 2024）。他在Nature Machine Intelligence、Science Advances、NeurIPS、CVPR、ECCV等AI领域顶级期刊和会议上发表了多篇具有影响力的论文，在视觉抽象推理与神经符号推理方面有深厚的积累和坚实的技术基础。'
