bio_raw: '曲天书

  职称：副教授

  研究所：信息科学中心

  研究领域：音频编码，空间听觉，声源定位与增强

  办公电话：86-10-62756824

  电子邮件：qutianshu@pku.edu.cn

  教育背景

  1993年毕业于吉林工业大学自动化系，获学士学位；1999年毕业于吉林工业大学通信与信息系统专业，获硕士学位；2002年毕业于吉林大学通信与信息系统专业，获博士学位。2002年
  —2004年在北京大学做博士后研究工作，2004年至今在北京大学信息科学技术学院智能科学系承担教学科研工作，现任副教授。2011.3至2012.3在密西根州立大学作访问学者一年。

  主要研究领域

  主要致力于音频信号处理领域的研究，包括音频编码，空间听觉，声源定位与增强。

  主要获奖成果

  在国内外著名会议及期刊发表论文30余篇，获得国家发明专利10余项。

  主要学术任职

  担任AVS音频组联合组长及IEEE，ASA，AES会员。'
