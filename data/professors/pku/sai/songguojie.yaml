bio_raw: '宋国杰

  职称：长聘副教授

  /

  研究员

  研究领域：价值观建模与测量、智能体建模与应用、图机器学习

  办公电话：

  86-10-62754785

  课题组承担有国家级纵向课题和头部企业横向合作课题等各类型学科前沿项目，提供丰厚的助研津贴。欢迎申请课题组博士后、博士、硕士以及本科实习，请联系

  gjsong@pku.edu.cn

  个人简介

  担任北京大学智能学院党委副书记、重庆人工智能学院执行院长、人工智能基础和应用标准工信部重点实验室副主任、北京通用人工智能学会秘书长、以及“北大-阿里妈妈人工智能创新联合实验室”“北大-中国铁塔智能社会和空间治理联合实验室”主任。

  研究领域为价值观建模与测量、智能体建模与应用、图机器学习等。代表性成果包括：1）价值观建模与测量：建立了国际上首个可计算、可测量、跨文化的自然人价值体系，研发出基于大模型的智能体价值观测量系统；2）图机器学习：提出系列新型图神经网络模型，与阿里合作构建了国际上首个面向工业级应用场景的图深度学习框架；3）网络信息传播影响力挖掘：揭示了社群中信息传播影响力的局部性规律，提出了基于社群分治的影响最大化挖掘方法，解决了挖掘算法的可扩展性难题。4）智能交通系统：在国际上较早开展基于深度学习理论的网络交通流演变模式表征研究，提出了基于深度信念网络的网络交通流预测方法，解决了大规模路网交通流协同预测的难题。成果应用于阿里电商平台和大型社会模拟器系统中，取得显著经济和社会效益。

  在国际重要期刊和会议发表论文170余篇，获最佳论文提名奖和最佳论文奖3项。承担科研项目30+项，包括国家重点研发计划、国家科技支撑计划、国家高技术研究发展计划、国家自然基金等国家课题，以及与阿里巴巴、华为等知名企业合作课题。

  获省部级和一级学会奖励6项，包括：北京科技进步奖二等奖（2024）、北京市自然科学奖二等奖（2021）、中国计算机学会自然科学奖二等奖（2020）、中国公路学会科学技术奖一等奖2项（2012；2013）和山西省科学技术奖二等奖（2012）。

  获得5项国家级教学奖励，包括：“国家级精品课（2008）”“国家级精品资源共享课（2016）”“国家精品在线开放课程

  （2018）

  ”“国家一流本科课程--线上线下混合式一流课程（2020）”和“国家一流本科课程--线上一流课程（2020）”。

  获得包括“兴证全球基金奖教金-师德优秀奖（2022）”“中国工商银行优秀教师奖（2021）”“嘉里集团郭氏基金树人奖教金（2015）”“北京大学优秀共产党员（2020）”和“北京大学教学优秀奖（2024）”等荣誉称号。担任3个领域重要期刊编委，以及人工智能领域顶级会议的领域主席、资深程序委员或程序委员。'
