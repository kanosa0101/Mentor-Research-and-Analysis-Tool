  教育背景

  2022/8-今，北京大学智能学院，研究员

  2009/7-2022/8，北京大学信息科学技术学院，智能科学系，副教授

  2005/9-2006/9，德国柏林自由大学，数学与计算机科学系，访问学者

  2002/7-2009/7，北京大学信息科学技术学院，智能科学系，讲师

  1999/09-2002/06，北京大学，遥感与地理信息系统研究所，博士

  1996/09-1999/06，北京师范大学，资源环境系，硕士

  1992/09-1996/06，山东师范大学，地理系，学士

  个人简介

  马修军，博士，北京大学智能学院研究员（教授）。任智能交通与车联网研究中心主任，智慧城市研究与规划中心副主任。研究方向包括群体智能、多Agent系统、机器学习、分布式系统、大数据、地理信息系统、网络空间安全。编著《地理信息系统》，《空间数据库》，《多媒体数据库与内容检索》，在国际国内期刊、会议发表论文80余篇，主持或参加了多项国家自然科学基金和科技部项目。在GIS、移动互联网、大数据平台、人工智能、物联网等领域研发多个产业化创新项目，积累了丰富的项目资源和技术团队。社会兼职包括《信息安全研究》副主编、《物联网智慧城市》专家编委、中国电信云计算行业专家、北京市创意文化产业专家。

  主要科研项目

  2022.9~2025.12，北京大学-上海弘玑超级自动化联合实验室平台；

  2019.12~2022.12 ，多模态异质的群智汇聚理论和方法，科技 部重点专项子课题（ 2018AAA0102301）；

  2018.06~2021.12 配用电设备健康状态在线监测、高效运维和智能评价关键技术研究及应用，国家电网科技项目 （SGZJ0000KXJS1800436）；

  2014.1~2016.12，十二五科技支撑计划课题“国家应急演练仿真服务平台及其应用示范”，专题负责人；

  2014.6~2015.12，世界银行中国经济改革实施技术援助项目“海南省橡胶树风灾指数保险研究与试点”， 课题负责人；

  2012.1~2014.12， 十二五科技支撑计划课题，城市居民时空行为分析关键技术与智慧出行服务应用示范；

  2015.6~2016.12，昆仑保险经纪股份有限公司，“中国地震及台风灾害地图数据库建设”，课题负责人；

  2013.1~2016.12，国家自然科学基金项目，“基于海量时空数据的城市居民移动模式研究”；

  2010.10~2011.06，智慧承德总体规划，承德市政府委托项目；

  2011~2013，科技部公益性行业科研专项，典型海岸带地质环境信息服务平台；

  2010.1~2010.12, 基于实时行为感知的城市动态空间规划方法 研究 国际 商业机器（ IBM ）公司共享大学项目；

  2016.01~2017.10, 上海城市体征诊断模型的辅助决策 研究， 上海市房屋土地资源信息中心；

  2007~2009，国家高技术研究发展计划项目，网格环境下基于Agent的空间资源分布式共享与协同计算研究；

  2007~2010，国家高技术研究发展计划重点项目,网格地理信息系统机器重大应用；

  2006~2009，北京市自然科学基金项目，空间信

  息服务组合的分布式执行及其事务机

  制研究；

  2002~2005国家高技术研究发展计划重点项目,面向网络海量空间信息的大型GIS；

  2001~2004，北京市自然科学基金重点项目，北京空间数据基础设施建设的理论及技术基础研究

