bio_raw: '李红燕

  职称：教授

  研究所：信息科学中心

  研究领域：大数据管理与挖掘

  办公电话：86-10-6275 4911

  电子邮件：lihy@cis.pku.edu.cn

  1999获西北工业大学计算机科学与工程系计算机软件与理论专业工学博士学位后，到北京大学信息科学中心进行博士后研究工作，2001年留校任教至今。现为北京大学信息科学技术学院智能科学系教授，博士生导师。长期从事数据管理与数据挖掘方向的研究工作，现任中国计算机学会数据库专委会委员、中国通信学会云计算与SaaS专委会委员。在ACM
  SIGMOD、AAAI、WISE等学术会议和学术期刊发表论文百余篇，出版学术专著、教材和译著各一部，获国家发明专利七项。主持并完成多项国家自然科学基金项目。

  注重理论研究与实际应用的紧密结合，在大数据管理和挖掘方向的相关成果应用于中国移动通信、Singapore National Healthcare Group等重要应用领域。指导学生获得第二届“IBM杯”高校校园创新设计大赛二等奖、第一届中国大数据技术创新与创业大赛二等奖、“中国好创意”全国青年大数据创新大赛一等奖、第18届PhysioNet比赛一等奖。'
