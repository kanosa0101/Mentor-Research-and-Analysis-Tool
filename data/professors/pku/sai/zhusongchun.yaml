bio_raw: '朱松纯

  职称：讲席教授

  所在院系：智能学院

  研究领域：计算机视觉、统计建模与计算、认知科学、机器学习、自主机器人等

  办公电话：

  电子邮件：s.c.zhu@pku.edu.cn

  个人主页：

  www.ai.pku.edu.cn/sczhu

  朱松纯教授是人工智能领域全球著名的学者，主要研究包括通用人工智能基础、计算机视觉、统计建模与计算、认知科学、机器学习、自主机器人等。曾任美国加州大学洛杉矶分校（UCLA）统计学系与计算机系教授，UCLA计算机视觉、认知、学习与自主机器人中心（Center
  for Vision, Cognition, Learning and Autonomy，VCLA）主任。自

  2021年12月起，任北京大学智能学院院长。

  教育和工作经历

  1986-1991年，中国科学技术大学，计算机专业，学士学位；

  1992-1996年，美国哈佛大学，计算机专业，硕士、博士学位。

  1996-1997年，美国布朗大学，应用数学专业，博士后。

  1997-1998年，美国斯坦福大学，计算机系人工智能实验室，讲师。

  1998-2002年，美国俄亥俄州立大学，计算机系与认知科学中心，助理教授。

  2002-2006年，美国洛杉矶加州大学，统计系与计算机系，副教授 (终身教职)。

  2006-2020年， 美国洛杉矶加州大学，统计系与计算机系，正教授。

  2020年至今，北京通用人工智能研究院，院长

  2020年至今，北京大学人工智能研究院，院长

  2021年至今，北京大学智能学院，院长

  学术研究

  朱松纯教授已在国际顶级期刊和会议上发表论文300余篇，其研究成果集中在以下四个时期和领域：

  一、视觉的统计建模与计算理论 —— 为马尔的视觉理论建立统一的数理模型

  二、实现图像与场景的解译（parsing）计算框架 —— 扩展了模式识别创始人傅京孙先生的句法模式识别理论

  三、提出人工智能的“暗物质” —— 研究视觉与认知的物理与社会常识

  四、探索迈向通用人工智能的新的研究路径 ——“小数据、大任务”范式

  有关朱教授的研究成果，请参考其个人学术主页

  奖励和荣誉

  · 2017年，计算建模奖 (Computational Modeling Prize)，国际认知科学学会 (Cognitive Science Society)

  · 2013年，赫尔姆霍茨奖 (Helmholtz Test-of-Time Award)，第14届国际计算机视觉大会颁发

  · 2008年，第二届J.K.Aggarwal 奖，国际模式识别协会(6)

  · 2007年，马尔奖荣誉提名，第11届国际计算机视觉大会

  · 2003年，马尔奖，第九届国际计算机视觉大会(7)

  · 2001年，Sloan fellow， Sloan基金

  · 2001年，青年教授奖励基金 (Career Award)，美国国家科学基金委员会

  · 2001年，杰出青年科学家奖 (ONR Young Investigator Award)，美国海军研究所颁发

  · 1999年，马尔奖 (Marr Prize) 荣誉提名, 第7届国际计算机视觉大会颁发'
