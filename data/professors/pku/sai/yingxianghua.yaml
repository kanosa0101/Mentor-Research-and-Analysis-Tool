bio_raw: '英向华

  职称：教授

  研究所：信息科学中心

  研究领域：计算机视觉、虚拟现实、计算成像学

  办公电话：010-62759076

  电子邮件：xhying@cis.pku.edu.cn

  教育背景

  2004年于中国科学院自动化研究所获模式识别与智能系统专业工学博士学位。

  主要研究领域

  目前主要研究方向为计算机视觉、模式识别、机器学习等。在计算机视觉基本理论和方法上开展了大量长期深入研究工作，特别是在三维重建与摄像机标定、多视点几何、场景特征检测与不变量表示、基于凸优化的高维数据拟合等方面具有较好工作。

  主要获奖项目

  近十余年来在IEEE Trans. on Pattern Analysis and Machine Intelligence和International Journal
  of Computer Vision等顶级国际期刊，以及ICCV、CVPR、ECCV等顶级国际会议上发表第一作者学术论文30余篇。其中以第一作者身份在PAMI上发表论文4篇。申请发明专利7项，其中获授权发明专利4项。

  主要学术任职

  参加过多个国际会议的组织工作：IEEE Conference on Computer Vision and Pattern Recognition (CVPR
  2011、2012、2013、2014、2015、2016) 程序委员会委员。International Conference on Computer Vision
  (ICCV2011、2015) 程序委员会委员。IEEE International Conference on Information and Automation
  (2010、2011、2012、2013、2014、2015) 程序委员会委员。IEEE International Conference on Mechatronics
  and Automation (ICMA 2011、2012、2013、2014、2015) 程序委员会委员。

  《计算机科学与应用》期刊编委。北京人工智能学会理事。'
