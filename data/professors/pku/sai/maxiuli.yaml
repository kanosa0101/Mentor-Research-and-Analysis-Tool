bio_raw: '马秀莉

  职称：讲师

  研究所：信息科学中心

  研究领域：数据挖掘

  办公电话：86-10-62754911

  电子邮件：xlma@pku.edu.cn

  教育背景

  2003 北京大学计算机科学技术系 博士

  主要研究领域

  数据库、数据挖掘、面向大规模实时监测中时空数据的分析和挖掘、面向多维数据的分析和挖掘、基于生物网络的挖掘

  代表性学术论著

  Xiuli Ma, Guangyu Zhou, Jingbo Shang, Jingjing Wang, Jian Peng, Jiawei Han. Detection
  of Complexes in Biological Networks through Diversified Dense Subgraphs Mining.
  Journal of Computational Biology, Vol.24, No.9, pp.923-941, 2017.

  Xiuli Ma, Guangyu Zhou, Jingjing Wang, Jian Peng, Jiawei Han. Complexes Detection
  in Biological Networks via Diversified Dense Subgraphs Mining. Proceedings of the
  20th Annual Conference on Research in Computational Molecular Biology (RECOMB 2016),
  pp.270-272, Santa Monica, CA, USA, April 17-21, 2016.

  C. Zhang, Y. Zheng, X. Ma, J. Han, "Assembler: Efficient Discovery of Spatial Coevolving
  Patterns in Massive Geosensory Data", in Proc. of 2015 ACM SIGKDD Int. Conf. on
  Knowledge Discovery and Data Mining (KDD''15), pp.1415-1424, Sydney, Australia,
  Aug. 2015.

  Xiuli Ma, Hongmei Xiao, Shuiyuan Xie, Qiong Li, Qiong Luo, Chunhua Tian. Continuous,
  Online Monitoring and Analysis in Large Water Distribution Networks. In 27th IEEE
  International Conference on Data Engineering (ICDE 2011), pp.1332-1335, Hannover,
  April 11-16, 2011.

  Xiuli Ma, Haifeng Hu, Shuangfeng Li, Honemei Xiao, Qiong Luo, Dongqing Yang, Shiwei
  Tang. DHC: Distributed, Hierarchical Clustering in Sensor Networks. Journal of Computer
  Science and Technology, 26(4): 643-662, July 2011.

  主要科研项目

  基于概要模式的大规模持续实时监测与分析的理论与方法研究

  国家自然科学基金项目，负责人， 2012.1~2014.12

  蛋白质交互网络中基于密集子图挖掘的蛋白复合体检测的理论与方法研究

  北京大学医学-信息科学联合研究基金项目，负责人， 2016.8~2017.12

  Monitoring, analysis and outbreak detection in large water distribution network
  (大规模供水网络中监测、分析和爆发检测研究)

  IBM 共享大学研究项目(Shared University Research，SUR), 负责人, 2009.9~2010.9

  面向多维数据的自动导航和知识发现的理论与方法研究

  国家自然科学基金项目，技术负责人，2005.1~2007.12

