  IEEE Trans. On Knowledge and Data Engineering

  Journal of Computer Science and Technology

  Journal of Software

  SIGMOD 2016

  KDD 2015

  EDBT 2015

  SDM 2015

  ADMA 2011 – 2014

  ICEBE 2010

  FSKD 2008 - 2010'
