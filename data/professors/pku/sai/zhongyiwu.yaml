bio_raw: '钟亦武

  职称：助理教授

  所在院系：智能学院

  研究领域：视觉-语言学习，多模态大模型，智能体，三维空间推理，具身机器人

  电子邮件：

  yiwu-zhong@outlook.com

  个人主页：

  https://yiwuzhong.notion.site/homepage

  学术主页：

  https://scholar.google.com/citations?user=irrbH_IAAAAJ&hl=en

  北京大学智能学院助理教授、研究员、博士生导师，国家级青年人才项目（海外）获得者，北京大学博雅青年学者。博士毕业于美国威斯康星大学-麦迪逊分校（UW-Madison）计算机科学专业，后于香港中文大学任博士后研究员。研究方向聚焦于视觉-语言表征学习，致力于构建视觉世界与人类语言之间的桥梁，实现多模态的统一理解，为多模态大语言模型、空间理解、高效推理、具身智能体等前沿领域奠定了坚实基础。曾多次在美国和中国顶尖科技企业工作，包括Meta
  AI（硅谷总部），Microsoft Research（微软研究院总部），腾讯AI Lab（西雅图、深圳）。曾获得CVPR 2022最佳论文候选、CVPR 2023博士联盟奖、CVPR
  2025杰出审稿人、Meta优秀实习生等来自于学术界和工业界的荣誉。

  长期招收实习生、硕士研究生（考研）、博士研究生（直博和申请-考核）、以及国际港澳台学生，欢迎感兴趣的同学邮件联系。'
