bio_raw: '许超

  职称：教授

  研究所：信息科学中心

  研究领域：图像与视频编码，图像检索，视频处理，多媒体系统

  办公电话：86-10-6275 7094

  电子邮件：xuchao@cis.pku.edu.cn

  教育背景

  1988年于清华大学获得光学仪器专业学士学位。1991年于中国科技大学获得光学专业硕士学位。1997年于中国科学院电子学所获得图像处理专业博士学位。

  在1991年至1994年期间，于中国科技大学北京研究生院任助教。1997年至今，在北京大学信息科学技术学院信息科学中心任教，2005年起聘为教授至今。

  主要研究领域

  图象、视频处理和理解，及多媒体技术。至今已经发表论文150余篇，其中CCF-A类论文近50篇，ESI高被引论文7篇。

  主要科研项目包括图像分类研究、图像检索研究、图像压缩研究等，讲授课程包括“数字视频处理”“图像理解”“计算机视觉”。

  主要科研项目

  至今指导的博士生毕业7人，其中5人获得信息学院学术十杰奖，其中罗勇博士获得CCF优秀博士论文奖，耿博和徐畅博士获得北京大学优秀博士论文奖，耿博博士毕业后在微软总部工作两年后，回国创业。徐畅博士毕业后即获得悉尼大学的正式教职。

  主要获奖成果

  曾经获得中国科学院科技进步奖二等奖，曾宪梓优秀教学奖，通用电气奖，柯达奖等多个奖项。主持研究的小波图像压缩系统曾被评为国家重点成果， 211工程标志性成果，高速摄像系统和电影院线的数字电影播放系统。近年来在图像理解方面的多视角、多标签学习等成果被评为国家重点成果。

  主要学术任职

  许超教授是中国高科技产业化研究会智能信息处理产业化分会委员，国家自然科学基金、科技部项目评审专家，国家科技奖励评审专家，国际IEEE、ACM、AAAI等学会会员。'
