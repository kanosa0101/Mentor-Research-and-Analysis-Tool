bio_raw: '裴玉茹

  职称：副教授

  研究所：信息科学中心

  研究领域：三维形状分析，医学图像配准，颅面重建

  办公电话：86-10-62756657

  电子邮件：peiyuru@cis.pku.edu.cn

  教育背景

  工学学士 (计算机科学与技术), 中南大学, 中国, 2000;

  工学硕士 (计算机科学与技术), 浙江大学, 中国, 2003;

  工学博士 (计算机科学与技术), 北京大学, 中国, 2006;

  主要研究领域

  三维形状分析，医学图像配准，颅面重建

  代表性学术论著

  1.

  Yuru Pei, Yunai Yi, Gengyu Ma, Tae-Kyun Kim, Yuke Guo, Tianmin Xu, and Hongbin Zha,
  Spatially Consistent Supervoxel Correspondences of Cone-Beam Computed Tomography
  Images, IEEE Transactions on Medical Imaging, 2018.

  2. Yungeng Zhang, Yuru Pei*, Gengyu Ma, Yuke Guo, Tianmin Xu, and Hongbin Zha, Consistent
  Correspondence of Cone-Beam CT Images using Volume Functional Maps, Medical Image
  Computing and Computer Assisted Intervention (MICCAI), 2018.

  3. Yuru Pei, Yunai Yi, Gengyu Ma, Yuke Guo, Gui Chen, Tianmin Xu, Hongbin Zha, Mixed
  Metric Random Forest for Dense Correspondence of Cone-Beam Computed Tomography Images,
  Medical Image Computing and Computer Assisted Intervention (MICCAI), 2017.

  4. Yuru Pei, Gengyu Ma, Gui Chen, Xiaoyun Zhang, Tianmin Xu, Hongbin Zha, Superimposition
  of Cone-Beam Computed Tomography Images by Joint Embedding, IEEE Transactions on
  Biomedical Engineering, 2017.

  5. Yuru Pei, Xingsheng Ai, Hongbin Zha, Tianmin Xu, and Gengyu Ma, 3D Exemplar-Based
  Random Walks for Tooth Segmentation from Cone-Beam Computed Tomography Images, Medical
  Physics, 43.9 (2016): 5040-5050.

  6. Yuru Pei, T.-K. Kim, Hongbin Zha, Unsupervised Random Forest Manifold Alignment
  for Lipreading, Proc. IEEE International Conference on Computer Vision (ICCV), 2013.

  7. Yuru Pei, Fengchun Huang, Fuhao Shi, and Hongbin Zha, Unsupervised Image Matching
  based on Manifold Alignment, IEEE Transactions on Pattern Analysis and Machine Intelligence
  (PAMI), VOL. 34, NO. 8, pp. 1658-1664, 2012.

  8. Yuru Pei, Fuhao Shi, Hua Chen, Jia Wei, Hong Zha, Ruoping Jiang, and Tianmin
  Xu, Personalized Tooth Shape Estimation from Radiograph and Cast, IEEE Transactions
  on Biomedical Engineering, vol. 59, NO. 9, pp. 2400 – 2411, 2012.

  9. Yuru Pei, Hongbin Zha, "Transferring of Speech Movements from Video to 3D Face
  Space," IEEE Transactions on Visualization and Computer Graphics (TVCG), vol. 13,
  no. 1, pp. 58-69, Jan/Feb, 2007.

  讲授课程

  计算方法(00130280)

  高级计算机图形学（04814560）

  应用数值分析（04804016）

  主要科研项目

  自然科学基金面上项目，61876008，面向三维图像配准与属性迁移的无监督聚类森林测度学习方法研究

  自然科学基金面上项目，61272342，属性迁移学习及其在面部几何与行为数据分析中的应用

  自然科学基金青年基金，60803067，基于多模态数据的语音相关面部形变机理研究

  主要获奖成果

  基于CT数据的中国人三维颅面复原系统，公安部科技进步二等奖，2011。

  基于CT数据的中国人三维颅面复原系统的研究，广州市科技进步三等奖，2009。'
