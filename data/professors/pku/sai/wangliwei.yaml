bio_raw: '王立威

  职称：教授

  研究所：信息科学中心

  研究领域：机器学习

  电子邮件：

  wanglw@cis.pku.edu.cn

  个人主页： http://www.liweiwang-pku.com/

  教育背景

  王立威，1999年获清华大学学士学位，2002年获清华大学硕士学位，2005年获北京大学博士学位。现为北京大学信息科学技术学院教授。

  主要研究领域

  长期从事机器学习研究。目前主要致力于机器学习基础理论，隐私算法的设计与分析，以及医疗影像诊断算法与系统的开发。

  主要获奖情况

  王立威教授在NeurIPS, ICML, TPAMI等国际顶级期刊和会议上发表论文150余篇。关于深度学习优化理论工作曾入选ICML19十大最具影响力论文。担任权威期刊TPAMI编委，长期担任NeurIPS,
  ICML, ICLR等机器学习顶级会议领域主席/高级领域主席。入选AI’s 10 to Watch，该奖项每两年颁发一次，在全世界范围授予10位人工智能领域杰出青年学者，王立威教授是首位获得该奖项的亚洲学者。获得首届国家自然科学基金优秀青年基金。带领团队获得首届天池AI医疗大赛冠军。'
