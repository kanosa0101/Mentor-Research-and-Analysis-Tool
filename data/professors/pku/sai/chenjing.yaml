bio_raw: '陈婧

  职称：研究员

  研究所：信息科学中心

  研究领域：听觉信息处理

  办公电话：86-10-62756824

  电子邮件：janechenjing@pku.edu.cn

  课题组网页：

  https://chenjing-pku.github.io/

  教育背景

  陈婧于2009年获北京大学智能科学系信号与信息处理专业博士学位，导师为迟惠生教授和吴玺宏教授。2009年到2012年，她在英国剑桥大学从事博士后研究，合作导师为Brian
  Moore教授。期间，曾任英国皇家学会及英国皇家工程学会联合授予的牛顿国际学者，以及剑桥大学沃弗森学院（Wolfson College）Research Fellow。她于2013年加入北京大学智能科学系，任百人计划研究员。

  主要研究领域

  言语识别的听觉加工机制

  言语可懂度及言语质量的评价方法

  助听器及人工耳蜗的信号处理策略

  代表性学术论著

  1. Chen, J., Huang, Q., Wu, X.H. (2016) “Frequency importance function of the speech
  intelligibility index for Mandarin Chinese”, Speech Communication 83，94-103

  2. Song, T., Qu, T.S., Wu, X.H., Chen, J., (2016) “An artificial neural network
  model for predicting sound direction in different acoustic environments”, Proceedings
  of The 22th International Congress of Acoustics 367：1-10 (corresponding author)

  3. Xing, Y., Fu, Z., Wu, X.H., Chen, J., (2016) “Evaluation of Apple iOS-based Automated
  Audiometry”, Proceedings of The 22th International Congress of Acoustics 114：1-10
  (corresponding author)

  4. He,W.X., Ding, X.Y., Zhang, R.X., Chen, J., Zhang, D.X., Wu, X.H. (2014) "Electrically-evoked
  frequency-following response (EFFR) in the auditory brainstem of guinea pigs", PLOS
  ONE, 2014, 9(9), e106719 (corresponding author)

  5. Chen, J., Baer, T., and Moore, B. C. J. (2013) “Effect of spectral change enhancement
  for the hearing impaired using parameter values with a genetic algorithm,” Journal
  of Acoustic Society of America, 133(5), 2910-2920. (corresponding author)

  6. Chen, J., Moore, B. C. J. (2013) “Effect of individually tailored spectral change
  enhancement on speech intelligibility and quality for hearing-impaired listeners”,
  in Proceedings of ICASSP 2013, Vancouver, Canada, May 2013.

  7. Chen, J., Baer, T., and Moore, B. C. J. (2012) “Effect of enhancement of spectral
  changes on speech intelligibility for the hearing impaired,” Journal of Acoustic
  Society of America, 131(4), 2987-2998. (corresponding author)

  8. Chen, J., Li, H.H., Li, L., Moore, B.C.J., Wu, X-H. (2012), “Informational masking
  of speech produced by speech-like sounds without linguistic content,” Journal of
  Acoustic Society of America, 131(4), 2914-2926.

  9. Chen, J., Baer, T., and Moore, B. C. J. (2010), “Effects of enhancement of spectral
  changes on speech quality and subjective speech intelligibility,” in Proceedings
  of INTERSPEECH 2010, pp. 1640-1643, Tokyo, Japan, October 2010.

  10. Chen, J., Wu, X.H., Li, L., Chi, H.S. (2009), “Simulated phase-locking stimulation:
  an improved speech processing strategy for cochlear implant,” ORL: Journal for Oto-Rhino-Laryngology
  and its Related Specialties, 71, 221-227.

  主要科研项目

  在研主持两项国家自然科学基金面上项目、一项英国皇家工程学院国际交流项目，两项横向研究课题。

  作为项目主持完成的科研项目包括985建设课题、英国皇家学会牛顿国际学者基金、英国防聋研究基金等。

  作为主要参与人完成的科研项目包括卫生部行业基金课题、国家自然科学基金重点项目等。'
