bio_raw: '职称：助理教授

  所在院系：智能学院

  研究领域：计算机图形学、数字人建模与动画、物理仿真与运动控制

  办公电话：

  电子邮件：libin.liu@pku.edu.cn

  个人主页：

  http://libliu.info/

  刘利斌，2009于清华大学获得数理基础科学专业学士学位，2014年在清华大学获得计算机科学与技术专业博士学位，后曾于加拿大不列颠哥伦比亚大学（The University
  of British Columbia）及美国迪士尼研究院（Disney Research）进行博士后研究，以及美国硅谷创业公司DeepMotion Inc.担任首席科学家，2020年全职回国加入北京大学。主要方向是计算机图形学，特别是数字人建模与动画、物理仿真、运动控制以及相关的优化控制、机器学习、增强学习等领域。他曾多次担任图形学领域重要国际会议如SIGGRAPH
  (North America/Asia)、PacificGraphics、SCA等的论文程序委员，以及图形学领域多数主要会议和期刊的审稿人。'
