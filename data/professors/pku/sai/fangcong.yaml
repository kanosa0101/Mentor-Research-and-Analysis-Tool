bio_raw: '职称：助理教授、研究员

  所在院系：智能学院、人工智能研究院

  研究领域：

  深度学习理论、优化算法、因果学习

  电子邮件：fangcong@pku.edu.cn

  个人主页：

  https://congfang-ml.github.io/

  方聪是北京大学助理教授兼研究员，博士生导师，北京大学博雅青年学者，长期从事深度学习理论与优化的研究。方聪于2019年在北京大学获得博士学位（师从林宙辰教授），并先后在普林斯顿大学和宾夕法尼亚大学进行博士后研究。关于深度学习理论成果发表论文30余篇、专著4本，谷歌学术引用2300余次，代表性论文包括国际顶尖期刊Proc.
  National Academy of Sciences (PNAS)、机器学习理论顶级会议 Conf.Learning Theory (COLT)、IEEE
  旗舰刊物 Proc. IEEE(PIEEE)、统计学顶级期刊 Annuals of Statistics(AoS)，与若干机器学习顶级期刊与会议 JMLR、T.PAMI、T.IT、ICML、NeurIPS等。主持国家级项目包括一项面上与一项基金委重大研究计划培育项目。深度因果学习研究荣获得美国统计协会（ASA）学生论文奖，所在团队在神经网络结构设计与优化算法方面的贡献荣获2023年度CAAI吴文俊人工智能自然科学奖一等奖（排名第二）、“祖冲之奖”－人工智能前沿创新奖年度突出成果奖（排名第三）。担任机器学习顶级会议ICML
  2022/2025、NeurIPS 2022-2025领域主席、ACM T. Probabilistic Machine Learning 和北大学报编委。'
