bio_raw: '林通

  职称：副研究员

  研究所：信息科学中心

  研究领域：机器学习/人工智能

  办公电话：86-10-62755097

  电子邮件：lintong@pku.edu.cn

  个人主页：http://www.cis.pku.edu.cn/jzyg/szdw/lt.htm

  教育背景

  2001年获北京大学理学博士学位。

  主要研究领域

  机器学习理论与算法，在监督学习、流形学习、半监督学习、智慧医疗等方面开展了研究。

  代表性学术论著

  发表国际学术论文40余篇，包括PAMI、JMLR、NeurIPS、ICML等国际期刊和国际会议。

  主要科研项目

  先后主持国家自然科学基金项目4项，参与国家项目2项。已获国家发明专利授权6项。'
