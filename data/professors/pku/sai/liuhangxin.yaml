bio_raw: '职称：助理教授

  所在院系：智能学院

  研究领域：机器人、具身智能

  电子邮件：hx.liu@pku.edu.cn

  个人主页：

  https://liuhx111.github.io/

  刘航欣，本科毕业于美国弗吉尼亚理工大学，后于加州大学洛杉矶分校获得机械工程硕士和计算机科学博士学位。曾任北京通用人工智能研究院研究员、机器人实验室主任。主要研究方向为智能机器人感知、认知与学习方法，机器人本体设计与人机交互。在
  Science Robotics和Nature Machine Intelligence发表论文3篇，并在 TPAMI、TRO、IJCV 等期刊发表多篇论文，曾获2019年ACM中国图灵大会最佳论文奖和2023年IROS移动操作方向最佳论文提名。'
