bio_raw: '吴玺宏

  职称：教授

  研究所：信息科学中心

  研究领域：听感知计算模型，心理声学，语音识别，语音合成，人机交互

  办公电话：86-10-6275 9989

  电子邮件：wxh@cis.pku.edu.cn

  教育背景

  吴玺宏，北京大学教授，博士生导师，教育部“新世纪优秀人才”。

  现任北京大学言语听觉研究中心主任、机器感知与智能教育部重点实验室副主任、信息科学中心副主任等。

  1995年于北京大学无线电电子学系获理学博士学位。1995年至1997年在北京大学计算机科学与技术系从事博士后研究，博士后出站后留校工作至今。先后多次前往奥地利、德国、加拿大、韩国、美国、澳大利亚等国及香港地区进行学术访问及讲学。

  主要科研项目

  先后主持国家级、省部级项目30余项，包括国家课题、国家项目、国家自然科学基金重大/重点项目、国家科技攻关项目、教育部“新世纪优秀人才”计划项目、北京市自然科学基金项目、教育部中央财政专项等；作为主要参加者承担国家级、省部级科研项目10余项，包括国家项目、国家自然科学基金重点/面上项目、国家社科基金重大项目、北京大学建设世界一流大学计划项目等，累计承担经费逾千万元。获国家授权发明专利11项。先后在国内外重要期刊会议上发表学术论文200余篇，其中多篇论文发表在本领域国际权威期刊及顶级会议上，如Hearing
  Res.、JASA、Ear & Hearing、IEEE T ASLP、Interspeech、ICASSP等，并多次应邀作国际学术会议特邀报告。

  主要获奖成果

  于2005年获教育部“新世纪优秀人才”计划奖励；2007年获中国船舶工业集团公司“科学技术进步奖”；2009年获日本大川研究助成奖(The Okawa Research
  Grant)；2014年获ISCSLP国际会议最佳论文奖(Best Paper Award)；2016年获IEEE ICIA国际会议最佳论文提名奖(Best Paper
  Finalist Award)。先后10余次获美国国家技术标准局(NIST)及其他国际权威组织举办的国际学术评测第一名。

  主要学术任职

  现为IEEE Senior Member, 中国电子学会高级会员。担任中国听力康复专业委员会副主任，中国康复工程与辅助技术专业委员会副主任，中国声学学会言语听觉音乐分会委员，全国声学标准化技术委员会委员，全国安全防范报警系统标准化技术委员会--人体生物特征识别应用分技术委员会委员，国家药监局医疗器械审评专家等。担任国际期刊《Neural
  Networks》《Neurocomputing》编委、国内期刊《中国言语听力康复科学杂志》常务编委、《电子学报》《自动化学报》《数据采集与处理》编委等。先后多次担任国际、国内学术会议的程序/组织委员会主席等。

