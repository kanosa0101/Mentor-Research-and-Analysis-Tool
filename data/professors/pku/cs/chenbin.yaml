bio_raw: '主要研究方向

  主要从事虚拟现实，虚拟地理环境及相关研究，内容涉及基于影像的三维重建，生成式虚拟环境构建等。

  主持并参与多项国家自然科学基金、国家重点研发计划项目课题，以及中国科协、北京市科委、腾讯公司等企事业单位委托的横向科研项目。

  主要学术任职

  - 国际数字地球学会，中国国家委员会委员，虚拟地理环境专业委员会副主任委员；

  - 中国青少年科技教育工作者协会，人工智能普及专委会委员。

  主要教学课程

  - 本科生课程：《数据结构与算法》、《计算概论》、《人工智能与计算思维》、《离散数学》、《地球与人类文明》；

  - 慕课课程：《离散数学概论》、《人工智能与信息社会》、《地球与人类文明》、《数据结构与算法Python版》、《Python语言基础与应用》

  主要荣誉与获奖

  - 国家级教学成果二等奖（排名第四）；

  - 国家级一流本科课程3门；

  - 北京市高等教育教学成果二等奖；

  - 北京市高等学校教学名师奖；

  - 北京大学教学卓越奖；

  近期发表论文

  - 张晓媛，陈斌. 基于改进GAN的手绘特征草图虚拟地形生成方法[J]. 遥感学报，2024, 28（5）: 1232-1241.

  - 张赖和, 陈斌. 基于全景图像的虚拟野外场景构建方法[J]. 北京大学学报自然科学版, 2023, 59(2): 211-220.

  - 陈天翔, 陈斌. 一种基于全景视频的 6 自由度野外虚拟环境快速构建方法[J]. 图学学报, 2022, 43(5): 901-908.

  - 袁泽, 陈斌. 基于 INLA-SPDE 方法的区域污染物模拟与预测[J]. 图学学报, 2022, 43(1): 125-132.'
