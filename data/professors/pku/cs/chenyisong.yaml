bio_raw: '个人主页：http://www.graphics.pku.edu.cn/members/chenyisong/

  主要研究方向

  计算机视觉、图像处理和模式识别

  科研/教育经历

  1996，博士，南京大学

  研究成果概况

  陈毅松现为北京大学计算机学院副教授，1996年获南京大学工学博士学位，专业为计算机科学技术。主要研究领域为计算机视觉、图像处理和模式识别，在相关领域的主要期刊和会议上发表了50多篇论文，获得专利成果5项。主持或参加了十余项国家级研究课题，包括中国国家自然科学基金（NSFC），国家高科技研究基金（863）、国家重点基础研究发展计划（973）等。承担多个国际期刊和会议的评审工作，担任多个国际会议的委员会成员。指导多名研究生和本科生的科研工作。'
