bio_raw: '个人主页：

  主要研究方向

  计算机理论，研究方向包括程序逻辑、程序语义，计算机系统的描述与验证

  科研/教育经历

  1993.7，博士，北京师范大学

  主要荣誉与获奖

  教育部高等学校科学技术奖励自然科学奖一等奖一项（排名第二）

  北京大学杨-王院士奖

  研究成果概况

  已在包括JPDC、ICALP、CSL、TCS、中国科学等国内外重要学术杂志上发表论文70余篇，教材或译著7部。主持自然科学基金3项，主持或参加国家重点基础研究发展规划（973计划）项目子项目3项,
  主持863计划一项，教育部高等学校科学技术奖励自然科学奖一等奖一项（排名第二）和北京大学杨-王院士奖，获日本大川研究基金研究助成奖。任中国人工智能学会常务理事，中国人工智能学会离散智能专委会主任委员。

  Selected Publications

  [1]

  Yuxin Jing

  , Hanpin Wang,

  Yu Huang

  ,

  Lei Zhang

  ,

  Jiang Xu

  ,

  Yongzhi Cao

  :

  A modeling language to describe massive data storage management in cyber-physical
  systems.

  J. Parallel Distrib. Comput. 103

  : 113-120 (2017)

  [2]

  Jiabao Lin

  , Hanpin Wang: The Complexity of Holant Problems over Boolean Domain with Non-Negative
  Weights.

  ICALP 2017

  : 29:1-29:14, (2017).'
