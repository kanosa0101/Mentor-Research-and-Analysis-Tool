bio_raw: '个人主页：https://cuibinpku.github.io/

  主要研究方向

  AI系统、大模型训练推理、AI应用、数据库系统、大数据管理和分析等

  主要荣誉与获奖

  2008年 微软亚洲研究院的“微软青年教授奖”

  2009年 获得中国计算机学会 “CCF 青年科学家奖”

  2014年 获教育部自然科学二等奖

  2016年 入选教育部长江学者特聘教授

  2023年 入选IEEE Fellow，获电子学会科技进步一等奖

  研究成果概况

  崔斌现为北京大学计算机学院教授、博士生导师，担任数据科学与工程研究所长。在相关领域顶级会议和期刊发表学术论文300多篇。主持和承担多个科研项目，如国家自然科学基金、国家重点研发计划、核高基项目、863计划等。他担任/曾担任中国计算机学会理事、数据库专委会副主任，VLDB理事会理事，DSE期刊主编，IEEE
  TKDE、VLDB Journal、DAPD等国际期刊编委，担任过数十个国际会议的程序委员会委员，包括一流国际会议SIGMOD、VLDB、ICDE、KDD等。崔斌教授课题组持续与工业界展开卓有成效的合作，与腾讯、阿里巴巴、苹果、微软、百度、字节、快手、中兴通讯、百川等多家知名企业开展项目合作和前沿探索，解决实际问题，进行科研成果的转化落地。'
