bio_raw: '个人主页：http://sei.pku.edu.cn/~haod

  主要研究方向

  软件工程，软件测试

  科研/教育经历

  2002-2008，博士，北京大学

  1998-2002，学士，哈尔滨工业大学

  研究成果概况

  研究方向为软件工程，主要研究软件测试。发表论文30余篇，其中发表于CCF A类期刊会议论文近20篇。获得多项国家自然科学基金资助，包括优青项目和国际（与地区）合作交流项目等。2016年获聘长江学者（青年学者）。担任国际会议SPLC
  2018的大会联合主席、AST 2015的程序委员会联合主席，以及ICSE 2018等程序委员委员。'
