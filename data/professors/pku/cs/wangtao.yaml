bio_raw: '个人主页：http://ceca.pku.edu.cn/wangtao

  主要研究方向

  计算机系统结构、智能机器人系统、情感与认知计算、人-机器人交互

  研究成果概况

  王韬，理学博士，北京大学计算机学院研究员（Research Professor），情感与认知智能机器人实验室主任，北大-国地共建具身智能机器人创新中心情感智能应用联合实验室主任，北京人工智能与情感机器人科普基地负责人，一眸科技（北京）有限公司首席科学家，华北电力大学教授（兼），北京市十一学校顺义学校科技副校长（兼），北京大学计算机学院产学研合作办公室主任（兼），九三学社北京大学委员会第一支社主委，九三学社中央科技专门委员会青年小组成员，北京计算机学会秘书长（兼机器人情感计算专业委员会主任），曾任杭州市钱江特聘专家。

  王韬研究员分别于1999年和2006年在北京大学取得学士和博士学位，2006年-2008年在清华大学-Intel联合博士后工作站从事博士后工作，之后在Intel公司任主任研究员，2010.11被北京大学引进，2010.12-2016.8任北京大学高能效计算与应用中心执行副主任，2018.5-2023.8任浙江省北大信息技术高等研究院副院长。曾任绿色计算产业联盟人才培养组组长、中国计算机学会青年计算机科技论坛（YOCSEF）学术委员会委员、中国计算机学会科学技术奖评奖委员会委员等社会职务。任多个学术期刊编委。

  王韬研究员从事计算机系统结构、智能机器人系统、情感与认知计算、人-机器人交互等方向的研究，主持国家、省部级以及横向项目数十项。获教育部自然科学一等奖、北京市高等教育教学成果一等奖等4项省部级奖励。获发明专利授权20余项。发表学术论文80余篇，多篇论文获最佳论文奖。主编的教材《具身智能机器人：原理与实践》入选“十四五”国家重点出版物出版规划。开设“智能机器人系统导论”等课程。

  王韬研究员曾研发国际领先的高性能可编程无线网络平台，被北京大学、清华大学、国防科技大学、美国加州大学洛杉矶分校（UCLA）及美国俄亥俄州立大学 （OSU）等院校使用。所提出的情感与认知模型及算法，具有表情识别、注意分析、生理指标检测、信息理解、性格分析等能力，已被产业头部机构应用，并影响多家科研单位及企业；所研发的情感机器人，能够完成情感交互、琴棋书画、迎宾导览等任务，多次代表北京大学参展。情感与认知模型、算法和机器人系统已被中央广播电视总台（CCTV）等多家媒体报道。

  科研/教育经历

  2020.8-今，研究员，北京大学

  2013.8-2020.7，副教授，北京大学

  2011.3-2013.7，副研究员，北京大学

  2008-2010，主任研究员，Intel公司

  2006-2008，博士后，清华大学-Intel公司

  1999-2006，博士，北京大学

  1995-1999，学士，北京大学

  主要荣誉与获奖

  2009年，获得2008 Intel China Employee of the Year，为Intel中国个人最高奖项（the highest individual
  award in China）

  2017年，指导撰写的学术论文The Tick Programmable Low-Latency SDR System，在移动计算与无线网络领域排名第一的国际顶级学术会议MobiCom’17中，获得了最佳学术社区论文奖（Best
  Community Paper Award，表彰对于本领域的学术社区做出了突出贡献的工作）

  2018年，获教育部2017年度高等学科科学研究优秀成果（科学技术）自然科学一等奖（第五完成人）：移动终端间协作通信理论和优化技术

  2018年，获2017年北京市高等教育教学成果奖一等奖（第五完成人）：“普惠中拔尖”：面向优秀学生的本科计算机人才国际化培养体系

  2018年，获2017年北京市高等教育教学成果奖二等奖（第三完成人）： 信息学科本科生创新科研训练体系的探索与实践

  2018年，指导撰写的学术论文A Real-Time Vision-Based Heart Rate Measurement Framework for Home
  Nursing Assistance，在The 6th International Conference on Ageless Aging （ICAA 2018,
  with ICCSE 2018）中，获得了最佳论文奖（Best Paper Award）

  2018年，指导撰写的学术论文TickSEC: A Novel Reconfigurable Platform for WiFi Physical Layer
  Security，在The 2018 International Conference on Networking and Network Applications（NaNA
  2018）中，获得了最佳论文奖（Best Paper Award）

  2019年，指导撰写的学术论文A Real-time Device-free Head Motion Recognition Framework for Family
  Care Robots，在The 7th International Conference on Ageless Aging （ICAA 2019, with
  ICCSE 2019）中，获得了最佳论文奖（Best Paper Award）

  2019年，获聘“杭州市钱江特聘专家”

  2020年，获2020年中国通信学会科学技术一等奖（第14完成人）：同频同时全双工双向通信技术发明'
