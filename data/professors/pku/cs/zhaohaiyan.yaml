bio_raw: '个人主页：http://sei.pku.edu.cn/~zhhy

  主要研究方向

  软件工程、软件复用、需求工程、模型变换、程序设计语言等

  科研/教育经历

  2003

  ，博士，东京大学

  1988-1991，硕士，北京大学

  1984-1988，学士，北京大学

  主要荣誉与获奖

  国家科学技术进步奖二等奖

  教育部高等学校科学研究优秀成果奖科技进步一等奖

  北京市科学技术奖技术发明二等奖

  北京大学 曾宪梓优秀教学奖

  北京大学 教学成果一等奖

  研究成果概况

  先后主持科技创新2030—“新一代人工智能”重大项目课题、国家高技术研究发展计划（863计划）项目、国家自然科学基金项目、北京市自然科学基金项目、校企合作等多个项目，并作为骨干先后参加了国家“八五”、“九五”重点科技攻关项目、国家973计划、国家自然科学基金重点和重大项目、自然科学基金国际(地区)合作与交流项目、国家自然科学基金创新群体、国家其他部委课题和国际合作课题在内的多项课题研究工作。在国内外学术期刊和学术会议上发表相关论文百余篇，出版学术著作1部，获国家发明专利十余项。

  学术团体ACM、IEEE、CCF的资深会员，积极组织和参加国内外学术交流。长期在国内国际重要学术会议/研讨会任职。

  与国内外合作研究者联合组织了多届模型双向变换方面国际研讨会(2007-2012)、亚太高级软件工程研讨会AWASE(2011-2016)、全国需求工程研讨会(2011-2012)；承担多个国际会议的组织工作，包括RE2016
  Financial & Registration Chair、MODELs17 Publicity Co-Chairs、SEAMS20 Publicity Co-Chairs、IEEE
  World Congress on Services Registration Co-chairs (2019-2020)、Poster Model 2021
  co-chairs、RE 2022 Student Volunteer Co-Chairs等。

  长期担任多个国际会议的程序委员会委员，比如，REFS(2008-2010)，IWECS(2011)，ICMT (2012-2020)，MODELSWARD(2013-2026)，APRES(2014-2016),
  RE Workshop Selection Committee (2015-2017)；ECMFA(2022-2026), STAF(2024, 2026),
  RE(2024, 2025)等。

  担任多个期刊（Transactions on Services Computing，Software and System Modeling，软件学报、中国科学等）的审稿人。'
