bio_raw: '个人主页：

  研究成果概况

  王腾蛟，国家教育部“长江学者”，北京大学博雅特聘教授。北京大学计算机学院教授，北京大学计算社会科学研究中心主任，北京大学（青岛）计算社会科学研究院院长。中国软件行业协会数据与智能委员会主任。

  长期从事人工智能与大数据研究工作。作为负责人3次承担国家重大专项课题，5次承担国家863计划课题。成果发表于国际顶级学术期刊和会议Nature Climate
  Change、ACM SIGMOD、SIGKDD、IJCAI、AAAI、ACL、VLDB、ICDE、TKDE等。获得2017年度“日本大川基金科技助成奖”。

  主持研制的AI系统长期服务于国家重要任务，“与全球已公开的科研团队的预测结果相比，预测准确率排名第1”。

  2026年初，王腾蛟教授课题组发布自主研发的AI智能体“AgentMind”。国家部委与央企成首批用户，给予高度评价。

  王腾蛟提出并实现了“查询密集型大规模分布式数据库环境中的动态数据迁移方法”， Microsoft确认将王腾蛟研究成果应用于微软云数据库产品开发。

  王腾蛟教授是中国“计算社会科学”领域重要的开拓者。2018年起，在北京大学支持下，他负责创建了北京大学计算社会科学研究中心、北京大学（青岛）计算社会科学研究院，致力于AI与社会科学的前沿交叉研究，致力于将团队自主研发的AI系统服务社会与经济发展。北京大学计算社会科学团队获评“北京大学优秀教学团队”和“北京大学教学成果一等奖”。

  王腾蛟教授团队与国家电网、中国移动、中国石油、香港LSCM、Microsoft、IBM和AI头部企业长期合作，研发的系统长期应用于智能电网、移动通信、智能金融、智能医疗等重要应用领域。'
