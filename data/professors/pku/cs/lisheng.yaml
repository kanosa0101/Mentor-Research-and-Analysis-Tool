bio_raw: '个人主页：http://www.graphics.pku.edu.cn/members/lisheng/index.htm

  主要研究方向

  计算机图形学、虚拟/增强现实技术、实时真实感渲染、虚拟仿真技术

  研究成果概况

  主持了十余项自然科学基金、国家重点研发项目课题、国防专项和多项企业横向项目，并作为北大方面负责人或者核心骨干参与了多项国家863、973、自然科学基金重点项目和国家支撑计划项目。在包含ACM
  TOG，CGF等国际国内著名学术刊物和会议上共发表相关学术论文70余篇，申请/授权国际国内发明专利40余项。担任了中国计算机学会虚拟现实与可视化专委会委员，计算机辅助设计与图形学专委会委员，《图学学报》编委。'
