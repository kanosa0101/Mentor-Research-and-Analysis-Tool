bio_raw: '个人主页：

  https://liangmingpan.bio/

  主要研究方向

  自然语言处理、大语言模型、大模型推理、大模型机理可解释性

  个人简介

  潘亮铭，北京大学计算机学院助理教授，计算语言学教育部重点实验室、北京大学计算语言学研究所研究员、博士生导师（“博雅青年学者”）、国家级青年人才计划获得者。2022年博士毕业于新加坡国立大学，之后先后担任美国加州大学圣塔芭芭拉分校博士后研究员、美国亚利桑那大学信息科学学院助理教授。主要研究方向包括自然语言处理、机器学习、大语言模型等，在国际顶级会议和期刊发表论文60余篇，
  包括ACL、EMNLP、NAACL、TACL、COLING、NeurIPS、ICML、AAAI、ACM MM、WWW等。论文曾获ACL 2025 SAC Highlights
  Award 、NeurIPS 2024 Workshop最佳论文奖、IJCNLP-AACL 2023 Area Chair Award。

  科研/教育经历

  2025.09-今，助理教授，北京大学

  2024.08-2025.08，助理教授，亚利桑那大学（美国）

  2022.12-2024.08，博士后，加州大学圣塔芭芭拉分校（美国）

  2018-2022，博士，新加坡国立大学

  2014-2017，硕士，清华大学

  2010-2014，学士，北京航空航天大学

