bio_raw: '个人主页：http://icl.pku.edu.cn/members/chbb/

  主要研究方向

  自然语言处理、句法语义分析

  科研/教育经历

  1999年，博士，北京大学

  主要荣誉与获奖

  国家科技进步二等奖1项(排名第3)

  教育部科技进步一等奖在内的省部级科研奖励3项

  研究成果概况

  主要研究领域为自然语言处理、句法语义分析等。作为负责人先后主持了多项国家自然科学基金项目和国家社科基金项目，并参加了多个国家863课题及973课题。在包括ACL、EMNLP、COLING、IJCAI在内的国内外会议和期刊上发表学术论文70多篇。作为主要作者参与编写出版教材4部。作为主要完成人，先后获得中国国家科技进步二等奖1项(排名第3)以及包括教育部科技进步一等奖在内的省部级科研奖励3项。还担任了《中文信息学报》编委，中文信息学会计算语言学专业委员会委员、人工智能学会自然语言理解专委会委员、计算机学会名词术语工作委员会等社会工作。'
