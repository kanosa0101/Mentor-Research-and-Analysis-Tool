bio_raw: '个人主页：

  https://www.pkuvmc.com/

  个人简介

  张史梁，北京大学长聘副教授，博雅青年学者，博士生导师，国家青年特聘专家，首批北京市杰出青年科学基金获得者。于2012年在中国科学院计算技术研究所获得博士学位，2012
  - 2015先后在美国德克萨斯州大学圣安东尼奥分校、NEC美国硅谷实验室从事研究工作。研究领域为人工智能与媒体计算，专注于行人重识别、物体细粒度识别、海量视觉检索与识别研究。

  担任著名国际期刊Elsevier CVIU、IET Computer Vision编委、ACM TOMM客座编委，著名国际会议CVPR、AAAI、ICPR、VCIP领域主席，连续多年作为联合主席/联合程序主席在IEEE/IAPR国际会议如CVPR、FG、ICPR、ICME上组织细粒度精准识别专题研讨会与讲习班。以第一作者和通讯作者在IJCV、T-PAMI、T-IP、CVPR、ICCV、NIPS、AAAI、ACM
  Multimedia等权威期刊与会议发表论文70余篇，谷歌引用5700余次。近5年以第一发明人申请中国、美国发明专利14项。主持科技部重点研发计划政府间合作专项项目、国家自然科学基金联合基金重点项目、面上项目以及重大研究计划培育项目等。获2021年IEEE
  T-CSVT最佳论文奖提名、2020年北京大学计算机系科研先进个人、2018年中国电子学会科技进步一等奖、2016年教育部科技发明一等奖、2013年中国计算机学会优秀博士学位论文、2013年中科院百篇优秀博士学位论文、2011年IEEE
  MMSP会议论文奖、2010年微软学者奖，以及英伟达先锋研究奖、NEC美国实验室突出技术奖等。

  主要科研项目

  1. 项目负责人，国家自然科学基金，联合基金重点项目 “面向社会公共安全的多维度跨平台视频智能关联与理解”

  2. 项目负责人，科技部国家重点研发计划政府间合作重点专项，“面向智慧城市的地空一体化视频内容分析与挖掘”

  3. 项目负责人，北京市基金委杰出青年科学基金，“车载视频内容分析与检索”

  4. 项目负责人，国家自然科学基金，面上项目，“基于紧凑图像特征与混合索引的海量图像检索技术研究”

  5. 项目负责人，国家自然科学基金，重大研究计划培育项目， “在轨视频特征分析与压缩研究”

  Selected Publications：

  [1]Jianzhong He, Shiliang Zhang*, Ming Yang, Yanhu Shan, and Tiejun Huang. BDCN:
  Bi-Directional Cascade Network for Perceptual Edge Detection, IEEE Trans. on Pattern
  Analysis and Machine Intelligence (T-PAMI), 2020.

  [2]Jianing Li, Shiliang Zhang*, Qi Tian, Meng Wang, and Wen Gao. Pose-Guided Representation
  Learning for Person Re-Identification. IEEE Trans. on Pattern Analysis and Machine
  Intelligence (T-PAMI), 2019.

  [3]Chi Su, Fan Yang, Shiliang Zhang*, Qi Tian, Larry S. Davis, and Wen Gao. Multi-Task
  Learning with Low Rank Attribute Embedding for Multi-Camera Person Re-Identification.
  IEEE Trans. on Pattern Analysis and Machine Intelligence (T-PAMI), vol. 40, no.
  5, pp. 1167-1181, May 2018.

  [4]Shiliang Zhang*, Ming Yang, Xiaoyu Wang, Yuanqing Lin, and Qi Tian. Semantic-Aware
  Co-Indexing for Image Search. IEEE Trans. on Pattern Analysis and Machine Intelligence
  (T-PAMI), vol. 37 no.12, pp. 2573-2587, Dec. 2015.

  [5]Shangzhi Teng, Shiliang Zhang*, Qingming Huang, and Nicu Sebe. Viewpoint and
  Scale Consistency Reinforcement for UAV Vehicle Re-Identification. International
  Journal on Computer Vision (IJCV), vol. 129, pp. 719-735, 2021.

  [6]Jianming Ye, Jingdong Wang, and Shiliang Zhang*. Distillation Guided Residual
  Learning for Binary Convolutional Neural Networks. IEEE Trans. on Neural Networks
  and Learning Systems (T-NNLS), 2021

  [7]Jianing Li, Shiliang Zhang*, and Tiejun Huang. Multi-scale Temporal Cues Learning
  for Video Person Re-Identification, IEEE Trans. on Image Processing (T-IP), vol.
  29, pp. 4461-4473, Feb. 2020.

  [8]Dongkai Wang, Shiliang Zhang*, and Gang Hua. Robust Pose Estimation in Crowded
  Scenes with Direct Pose-Level Inference. Thirty-fifth Conference on Neural Information
  Processing Systems (NeurIPS) 2021.

  [9]Shiyu Xuan and Shiliang Zhang*. Intra-Inter Camera Similarity for Unsupervised
  Person Re-Identification, IEEE Conference on Computer Vision and Pattern Recognition
  (CVPR), 2021.

  [10]Dongkai Wang and Shiliang Zhang*. Unsupervised Person Re-identification via
  Multi-label Classification, IEEE Conference on Computer Vision and Pattern Recognition
  (CVPR), 2020.'
