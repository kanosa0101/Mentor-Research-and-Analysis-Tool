bio_raw: '主要研究方向

  操作系统与中间件，云计算

  主要科研项目：

  1.科技部，国家重点研发计划，2019YFF0302703，面向8K 超高清视频应用的高效编码标准及编解码器，2019-10至2022-6，1474万，主持

  2.国家自然科学基金委员会，面上项目，61872400，面向沉浸式感知的表面光场表示及传输，2019-1至2019-12，16万，结题，主持

  3.国家自然科学基金，面上项目，62072008，面向机器视觉的智能视频编码，2021-1月至2024-12月，57万元，主持

  主要学术任职

  无

  Selected Publications

  （1）Shanshe Wang ; Siwei Ma; Shiqi Wang; Debin Zhao; Wen Gao, Rate-GOP Based Rate
  Control for High Efficiency Video Coding, IEEE Journal of Selected Topics in Signal
  Processing, 2013.12, 7(6): 1101-1111.

  （2）Shanshe Wang; Falei Luo; Siwei Ma; Xiang Zhang; Shiqi Wang; Debin Zhao; Wen Gao,
  Low complexity encoder optimization for HEVC, Journal of Visual Communication and
  Image Representation, 2016.2, 35: 120~131.

  （3）Shanshe Wang; Siwei Ma; Li Zhang; Shiqi Wang; Debin Zhao; Wen Gao, Multi layer
  based rate control algorithm for HEVC, 2013 IEEE International Symposium on Circuits
  and Systems (ISCAS), 2013.5.19-2013.5.23.

  （4）Shanshe Wang; Siwei Ma; Shiqi Wang; Debin Zhao; Wen Gao, Fast multi reference
  frame motion estimation for high efficiency video coding, 2013 20th IEEE International
  Conference on Image Processing (ICIP), 2013.11.12-2013.11.20.

  （5）Shanshe Wang; Siwei Ma; Shiqi Wang; Debin Zhao; Wen Wang,, Quadratic ρ-domain
  based rate control algorithm for HEVC, 2013 38th IEEE International Conference on
  Acoustics, Speech, and Signal Processing, ICASSP 2013, Vancouver, BC, 2013.5.26-2013.5.31.

  （6）Shanshe Wang; Siwei Ma; Xiaolong Jiang; Juanting Fan; Debin Zhao; Wen Gao, A
  fast intra optimization algorithm for HEVC, 2014 IEEE Visual Communications and
  Image Processing Conference, 2014.12.7-2014.12.10.

  （7）Shanshe Wang; Shiqi Wang; Ke Gu; Xiaoqiang Guo; Siwei Ma; Wen Gao, Internal Generative
  Mechanism Inspired Reduced Reference Image Quality Assessment with Entropy of Primitive,
  IEEE Visual Communications and Image Processing, 201 7.12.10-2017.12.13.

  （8）Shanshe Wang, Junru Li, Shiqi Wang, Siwei Ma and Wen Gao, "A Frame Level Rate
  Control Algorithm for Screen Content Coding", 2018 The International Symposium on
  Circuits and Systems

  （9）Lei Zhao, Shiqi Wang, Xinfeng Zhang, Shanshe Wang(*), Siwei Ma, Wen Gao, Enhanced
  Motion-Compensated Video Coding With Deep Virtual Reference Frame Generation. IEEE
  Trans. Image Process. 28(10): 4832-4844 (2019)

  （10）Siwei Ma, Xiang Zhang, Shiqi Wang, Xinfeng Zhang, Chuanmin Jia, Shanshe Wang(*),
  Joint Feature and Texture Coding: Toward Smart Video Representation via Front-End
  Intelligence. IEEE Trans. Circuits Syst. Video Techn. 29(10): 3095-3105 (2019).

  （11）Chuanmin Jia, Shiqi Wang, Xinfeng Zhang, Shanshe Wang(*), Jiaying Liu, Shiliang
  Pu, Siwei Ma, Content-Aware Convolutional Neural Network for In-Loop Filtering in
  High Efficiency Video Coding. IEEE Trans. Image Process. 28(7): 3343-3356 (2019)'
