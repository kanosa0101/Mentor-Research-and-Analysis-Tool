bio_raw: '个人主页：

  陈薇，北京大学计算机学院博导、副研究员，北京大学计算社会科学研究中心副主任，北京大学（青岛）计算社会科学研究院副院长，中国软件行业协会数据与智能分会副秘书长。

  主要从事人工智能、计算社会科学和大数据管理等方向的研究工作。主持国家科技创新2030—“新一代人工智能”重大项目课题，国家自然科学基金、省部级等项目20余项。成果发表于国际顶级学术期刊和会议National
  Science Review、IJCAI、ACL、AAAI、SIGIR、EMNLP、ICDE等。

  研制的AI系统长期持续服务国家重要任务，得到高度评价：“与全球已公开的科研团队的预测结果相比，预测准确率排名第 1”。

  作为北京大学计算社会科学团队骨干成员，长期开展AI与社会科学的前沿交叉研究，研制的AI系统长期服务社会与经济发展。北京大学计算社会科学团队获评“北京大学优秀教学团队”和“北京大学教学成果一等奖”。'
