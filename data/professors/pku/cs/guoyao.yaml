bio_raw: '个人主页：http://sei.pku.edu.cn/~yaoguo

  主要研究方向

  操作系统：新型操作系统的设计、操作系统性能优化、机器人操作系统等；

  移动计算：移动计算系统与应用的分析与优化，包括性能分析与优化、能耗分析与优化、隐私分析与保护等；

  软件安全：操作系统和移动应用等的安全分析与防护，包括可信计算技术、细粒度访问控制、旁路(side-channel)攻击与防护等。

  科研/教育经历

  2003-2007，博士，美国麻省大学

  1997-2000，硕士，北京大学

  1992-1997，学士，北京大学

  主要荣誉与获奖

  l 2017年9月：北京大学教学成果特等奖

  l 2016年9月：A类会议UbiComp 2016优秀论文奖（Honorable Mention Award）

  l 2016年 教育部高等学校科学技术进步一等奖（软件定义的云管理关键技术及系统，排名7/10）

  l 2015年 全国软件与应用学术会议软件原型竞赛二等奖

  l 2011-2012年度北京大学教学优秀奖

  l 2012年 北京大学优秀班主任

  主要科研项目

  l 国家重点研发计划课题，2017YFB1001904，“应用驱动的智能无人集群系统软件开发方法与工具”，2017-2021，负责人。

  l 国家自然科学基金面上项目，“面向移动设备的细粒度访问控制机制”，2018-2022，负责人。

  l 华为横向课题，“移动应用非功能属性开发测试方法”，2015-2019，主持人。

  l 国家自然科学基金青年科学基金项目，61103026，“面向移动计算的自适应能耗优化技术研究”，2011/01-2014/12，主持人。

  l 国家863计划，2011AA01A202，“以支撑电子商务为主的网络操作系统”，2011/5-2013/12，北京大学子课题负责人。

  l 国家863计划，2008AA01Z133，“基于体系结构的低功耗模拟开发环境”，2008/5-2010/12，主持人。

  l 国家863重点课题，2015AA01A203，“云端和终端资源自适应协同与调度平台”， 2015.01-2017.12，课题骨干。

  l 国家自然科学基金重点项目，61033006，“面向服务的软件理论、方法及其应用”，2011/01-2014/12，课题骨干。

  l 国家科技重大专项，2009ZX01039-001-001，“支持新型网络应用模式的网络化操作系统”，2009/01-2011/12，课题骨干。

  l 国家863计划，2007AA010304，“面向嵌入式软件的生产线”，2007/12-2010/12，课题骨干。

  主要学术任职

  l 中国计算机学会系统软件专委会委员

  l 大理大学数学与计算机学院教学指导委员会委员

  l 中国计算机学会高级会员

  l ACM和IEEE会员

  Selected Publications

  [1] Haoyu Wang, Yuanchun Li, Yao Guo, Yuvraj Agarwal, Jason Hong, "Understanding
  the Purpose of Permission Use in Mobile Apps",

  ACM Transactions on Information Systems (TOIS)

  , 2017.

  [2] Yuanchun Li, Fanglin Chen, Toby Jia-jun Li, Yao Guo, Gang Huang, Matthew Fredrikson,
  Yuvraj Agarwal, Jason Hong, "PrivacyStreams: Enabling Transparency in Personal Data
  Processing for Mobile Apps",

  UbiComp 2017

  .

  [3] Yuanchun Li, Baoxiong Jia, Yao Guo, Xiangqun Chen, "Minging User Reviews for
  Mobile App Comparison",

  UbiComp 2017

  .

  [4] Haoyu Wang, Zhe Liu, Yao Guo, Xiangqun Chen, Miao Zhang, Guoai Xu and Jason
  Hong, "An Explorative Study of the Mobile App Ecosystem from App Developers'' Perspective",
  In Proceedings of the 26th International Conference on World Wide Web (

  WWW 2017

  ), Perth, Australia, Apr 2017, pp 163-172.

  [5] Chengke Wang, Yao Guo, Peng Shen and Xiangqun Chen, "E-Spector: Online energy
  inspection for Android applications", 2017 IEEE/ACM International Symposium on Low
  Power Electronics and Design (

  ISLPED

  ), Taipei, Taiwan, 2017.

  [6] Yuanchun Li,

  Yao Guo

  , Xiangqun Chen, "PERUIM: Understanding Mobile Application Privacy With Permission-UI
  Mapping", In Proceedings of the 2016 ACM International Joint Conference on Pervasive
  and Ubiquitous Computing (

  UbiComp ''16

  ), pp.682-693.

  [7] Haoyu Wang, Jason I. Hong, Yao Guo, "Using Text Mining to Infer the Purpose
  of Permission Use in Mobile Apps", The 2015 ACM International Joint Conference on
  Pervasive and Ubiquitous Computing (

  UbiComp 2015

  ), Osaka, Japan.

  [8] Haoyu Wang, Mengxin Liu, Yao Guo, Xiangqun Chen, "Similarity-based Web Browser
  Optimization", in Proceedings of the 23rd International World Wide Web Conference

  (WWW 2014

  ), Seoul, Korea, April 2014, pp 575-584.

  [9] Yao Guo, Pritish Narayanan, Mahmoud Bennaser, Saurabh Chheda, and Csaba Andras
  Moritz, "Energy Efficient Hardware Data Prefetching",

  IEEE Transactions on Very Large Scale Integration Systems

  , Vol 19 No 2, pp. 250-263, Feb 2011.

  [10]Guangdong Bai, Liang Gu, Tao Feng, Yao Guo, Xiangqun Chen, "Context-Aware Usage
  Control for Android", In 6th International ICST Conference on Security and Privacy
  in Communication Networks (

  SecureCOMM 10

  ), p 326-343, Singapore, September 7-9, 2010.'
