bio_raw: '个人主页：

  www.yunhuai.net

  主要研究方向

  智慧城市、移动计算、物联网、群智感知等方向

  主要科研项目

  1. 移动群智感知及应用，国家杰出青年基金，主持

  2. 应用驱动的异质物联网系统互联平台关键技术及应用示范，国家重点研发项目，项目负责人

  3. 复杂室内环境中的无传感器微运动感知理论与关技术，国家自然科学基金面上项目，项目负责人

  4. 物联网与智慧城市安全保障关键技术研究，国家重点研发计划项目，子课题负责人

  主要学术任职

  ACM 中国理事会副主席

  IEEE TNSE 副主编(AE)

