bio_raw: '主要研究方向

  网络数据处理与分析、软件定义网络、网络功能虚拟化、高性能系统

  教育工作经历

  2007年-2011年，北京大学信息科学技术学院计算机科学技术系，本科毕业

  2011年-2015年，香港中文大学计算机科学与工程系，博士毕业

  2015年-2017年，任职于华为未来网络理论实验室

  2017年-2020年，任职于中国科学院计算技术研究所，入选中科院百人计划

  2020年5月-，北京大学

  研究介绍

  在网络与系统领域顶级会议（包括SIGCOMM、INFOCOM、VLDB、USENIX ATC）发表论文多篇，主持国家重点研发计划子课题、国家自然科学基金等项目。'
