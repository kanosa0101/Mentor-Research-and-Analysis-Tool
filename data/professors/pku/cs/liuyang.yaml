bio_raw: '主要研究方向

  计算语言学、中文信息处理、语言知识工程，致力于面向信息处理（以及面向人文领域）的词义理论与计算资源研发工作，目前的兴趣点在汉字、词的形式、意义系统方面（具体见《中文信息学报》等论著，也欢迎确有兴趣且有专长的同学参与课题工作或读研，该跨学科研发工作不限于计算机专业，也欢迎语言学、逻辑、信息管理等具备编程能力的其它专业同学）。

  科研/教育经历

  2003年获博士学位留校任教，现为北京大学信息学院副教授。

  主要荣誉与获奖

  2005年 全国优秀博士学位论文奖

  2007年 教育部科技进步奖一等奖（5/9）

  2010年 中国电子学会电子信息科学技术奖一等奖（5/10）

  2011年 国家科技进步奖二等奖 （4/10）

  研究成果概况

  刘扬，男，2003年获博士学位留校任教，现为北京大学计算机学院副教授。

  个人研究方向为计算语言学、中文信息处理、语言知识工程，致力于面向信息处理（以及面向人文领域）的词义理论与计算资源研发工作，目前的兴趣点在汉字、词的形式、意义系统方面（具体见《中文信息学报》等论著，也欢迎确有兴趣且有专长的同学参与课题工作或读研，该跨学科研发工作不限于计算机专业，也欢迎语言学、逻辑、信息管理等具备编程能力的其它专业同学）。

  主持国家社科基金、国家自然基金、全国优博专项等项目，作为技术骨干参与国家863、973、社科重大等项目。相关研发成果交付应用，在国内外多次转让使用权，曾获“全国优秀博士学位论文奖（2005）”、“教育部科技进步奖一等奖（2007，5/9）”、“中国电子学会电子信息科学技术奖一等奖（2010，5/10）”及“国家科技进步奖二等奖（2011，4/10）”等奖励。'
