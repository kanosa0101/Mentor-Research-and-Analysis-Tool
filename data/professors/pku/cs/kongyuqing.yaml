bio_raw: '个人主页：

  https://cfcs.pku.edu.cn/yuqkong/

  孔雨晴，北京大学前沿计算研究中心长聘副教授，2018年博士毕业于密歇根大学安娜堡分校计算机系，2013年本科毕业于中国科学技术大学数学系。她的研究兴趣在计算经济学领域，包含同伴预测，预测市场，机制设计以及机器学习。她的论文发表于WINE,
  ITCS, EC, SODA, AAAI, NeurIPS, ICLR等会议中。'
