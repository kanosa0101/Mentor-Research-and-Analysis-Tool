bio_raw: '个人主页：http://scholar.pku.edu.cn/ttjiang

  教育工作背景

  2001年获得中国科学技术大学计算机科学学士学位

  2007年获得美国杜克大学计算机科学博士学位

  主要研究工作

  （1）计算机视觉，包括物体跟踪、识别、检测、形状分析、动作识别、视觉注意等；

  （2）图像视频的质量评价。

  主要学术成果

  近几年在主要国际学术期刊和会议上共发表论文30多篇。并且受邀参加计算机视觉主要会议CVPR、ICCV和ECCV以及IEEE Pattern Analysis and
  Machine Intelligence (TPAMI) 、IEEE Transactions on Image Processing(TIP) 、IEEE Transactions
  on Circuits and Systems for Video Technology (TCSVT) 、IEEE Transactions on Multimedia
  (TMM)等期刊的审稿。目前参与了多项国家自然科学基金委员会研究项目和科技部的一项973课题。'
