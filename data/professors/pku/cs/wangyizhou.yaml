bio_raw: '个人主页：

  https://cfcs.pku.edu.cn/wangyizhou/

  教育背景

  1996年于清华大学获得学士学位，2005年从加州大学洛杉矶分校(UCLA)获得计算机科学博士学位，同年被美国Xerox Palo Alto研究中心(Xerox
  PARC)聘为研究员，2007年12月加入北京大学计算机学院数字媒体研究所。

  主要研究领域

  计算机视觉/人工智能、统计建模与计算、认知计算

  主要获奖成果

  在国际重要学术期刊和学术会议发表学术论文200余篇，多篇论文获得最佳论文奖。获2018年中国电子学会科学技术奖科技进步一等奖。

  主要学术任职

  2019年任第一届人工智能医疗器械标准化技术归口单位专家组专家、特邀战略委员会专家。

  2021年任人工智能学会智能传媒专委会副主任委员。

  2023年任跨媒体通用人工智能全国重点实验室学术委员会委员。'
