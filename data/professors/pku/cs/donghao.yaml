bio_raw: '个人主页：

  http://zsdonghao.github.io

  董豪，北京大学计算机学院前沿计算研究中心长聘副教授，科技创新2030国家重大项目负责人（首席科学家），入选国家级高层次青年人才计划，上纬启元首席科学家。研究方向聚焦于具身智能、大模型、强化学习、计算机视觉以及相应的开源系统。核心目标是探索并构建兼具成本效益与通用性的机器人系统。研究工作获得2024年IROS最佳应用论文提名奖、2024年字节跳动优秀导师奖、2025年中国具身智能大会（CEAI）杰出青年研究者论文奖提名，2025年英特尔中国优秀研究奖，以及2025年世界人工智能大会（WAIC）青年优秀论文奖提名等一众国内外奖项。

  担任国际CVPR、NeurIPS及AAAI的领域主席或高级程序委员会委员；同时担任ICRA及Machine Intelligence Research（MIR）的副主编，并曾获MIR杰出副主编奖。'
