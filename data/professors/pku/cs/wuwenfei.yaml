bio_raw: '个人主页：

  http://wenfei-wu.github.io/

  主要研究方向

  1、 计算机网络体系结构

  2、 计算机网络管理

  3、 分布式系统

  4、 机器学习系统

  主要科研项目

  1. 《网络多样化趋势下的网络功能单元敏捷开发技术的研究与实现》，国家自然科学基金青年项目61802225

  2. 《智能媒体融合网络试验与示范》，科技部重点研发计划2018YFB1802202

  主要学术任职

  任以下会议技术委员会成员

  • IEEE International Conference on Network Protocols, 2021

  • ACM Asia-Pacific Workshop on Networking, 2021

  • IFIP/IEEE International Symposium on Integrated Network Management, 2021

  • ACM Special Interest Group on Data Communication, Poster Session, 2020

  • ACM Special Interest Group on Data Communication, Poster Session, 2019

  • ACM/IEEE Symposium on Architectures for Networking and Communications Systems,
  2019

  • ACM/IEEE Symposium on Architectures for Networking and Communications Systems,
  2018

  • IEEE ICNP Workshop on Hot Topics in Internet-of-Things, 2016

  Selected Publications

  [1] Bangwen Deng and Wenfei Wu*. “NFReducer: Redundant Logic Elimination for Network
  Functions with Runtime Configurations”. In: the 2021 IEEE International Conference
  on Computer Communications. INFOCOM ’21. 2021.

  [2] Yongchao He, Wenfei Wu*, Xuemin Wen, Haifeng Li, and Yongqiang Yang. “Scalable
  On-Switch Rate Limiters for the Cloud”. In: the 2021 IEEE International Conference
  on Computer Communications. INFOCOM ’21. 2021.

  [3] Hongyi Huang, Wenfei Wu*, Yongchao He, Bangwen Deng, Ying Zhang, Yongqiang Xiong,
  Guo Chen, Yong Cui, and Peng Cheng. “NFD: A Development Framework for Cross-Platform
  Network Functions”. In: the 2021 IEEE International Conference on Computer Communications.
  INFOCOM ’21. 2021.

  [4] ChonLam Lao, Yanfang Le, Kshiteej Mahajan, Yixi Chen, Wenfei Wu*, Aditya Akella,
  and Michael Swift. “ATP: In-Network Aggregation for Multi-Tenant Learning”. In:
  the 18th USENIX Symposium on Networked Systems Design and Implementation. NSDI ’21.
  2021.

  [5] Ming Sun, Ya Su, Shenglin Zhang, Junliang Tang, Yuanpu Cao, Yuqing Liu, Wenfei
  Wu*, Dan Pei, Yongsu Zhang, and Xiaozhou Liu. “CTF: Anomaly Detection in High-Dimensional
  Time Series with Coarseto- Fine Model Transfer”. In: the 2021 IEEE International
  Conference on Computer Communications. INFOCOM ’21. 2021.

  [6] Bohan Zhao, Xiang Li, Boyu Tian, ZhiyuMei, and Wenfei Wu*. “DHS: Adaptive Memory
  Layout Organization of Sketch Slots for Fast and Accurate Data Stream Processing”.
  In: Proceedings of the 27th ACM SIGKDD International Conference on Knowledge Discovery
  amp; Data Mining. KDD ’21. 2021.

  [7] Wenfei Wu, Keqiang He, and Aditya Akella. “Perfsight: Performance diagnosis
  for software dataplanes”. In: Proceedings of the 2015 ACM Conference on Internet
  Measurement Conference. IMC ’15. 2015.

  [8] Wenfei Wu, Yizheng Chen, Ramakrishnan Durairajan, Dongchan Kim, Ashok Anand,
  and Aditya Akella. “Adaptive data transmission in the cloud”. In: 2013 IEEE/ACM
  21st International Symposium on Quality of Service. IWQoS ’13. 2013.

  [9] Wenfei Wu, Guohui Wang, Aditya Akella, and Anees Shaikh. “Virtual network diagnosis
  as a service”. In: Proceedings of the 4th annual Symposium on Cloud Computing. SoCC
  ’13. 2013.'
