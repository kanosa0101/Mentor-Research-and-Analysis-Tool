bio_raw: '个人主页：

  https://www.tongyangli.com/

  简介

  李彤阳，现任北京大学前沿计算研究中心助理教授，博士生导师，北京大学博雅青年学者，国家自然科学基金面上项目、重大研究计划培育项目负责人。他于2015年在清华大学交叉信息研究院（姚班）和数学科学系分别获得工学士学位和理学士学位，2020年在美国马里兰大学获得博士学位，之后在美国麻省理工学院从事博士后研究工作，于2021年7月加入北京大学前沿计算研究中心并工作至今。他的科研围绕量子计算、人工智能、理论计算机的交叉领域展开，研究成果已在Nature
  Physics、Nature Communications、Journal of the ACM、Physical Review Letters、IEEE Transactions
  on Information Theory、STOC、ICML、NeurIPS、ICLR 等期刊、会议发表论文四十余篇；9次在国际量子信息方向的权威会议 QIP
  上作报告；担任量子科学领域期刊 Quantum的期刊编辑，AQIS 2025会议共同主席，AQIS 2021, TQC 2022, QCTIP 2022, QIP
  2023, ICLR 2024, QCTIP 2024, TQC 2024, NeurIPS 2024, ICLR 2025, NeurIPS 2025, ICLR
  2026, QIP 2026, ICML 2026, TQC 2026会议的程务委员会成员/领域主席，以及相关领域多家顶级期刊和会议的审稿人。

  发表论著

  ■ (by contribution) Yecheng Xue, Rui Yang, Zhiding Liang, and Tongyang Li. DC-MBQC:
  A Distributed Quantum Compilation Framework for Measurement-Based Quantum Computing.
  Accepted by the 32nd IEEE International Symposium on High Performance Computer Architecture
  (HPCA 2026).

  ■ Tongyang Li, Xinzhao Wang, and Yexin Zhang. Near-Optimal Quantum Algorithms for
  Computing (Coarse) Correlated Equilibria of General-Sum Games. Accepted by the 39th
  Annual Conference on Neural Information Processing Systems (NeurIPS 2025).

  ■ (by contribution) Rui Yang, Ziruo Wang, Yuntian Gu, Yitao Liang, and Tongyang
  Li. QCircuitBench: A Large-Scale Dataset for Benchmarking Quantum Algorithm Design.
  Accepted by the 39th Annual Conference on Neural Information Processing Systems
  (NeurIPS 2025).

  ■ (by contribution) Yexin Zhang*, Shuo Zhou*, Xinzhao Wang*, Ziruo Wang, Ziyi Yang,
  Rui Yang, Yecheng Xue, and Tongyang Li. Efficient classical sampling from Gaussian
  boson sampling distributions on unweighted graphs. Nature Communications, Vol. 16,
  No. 1, 9335, 2025.

  ■ (by contribution) Shankar Balasubramanian, Tongyang Li, and Aram Harrow. Exponential
  speedups for quantum walks in random hierarchical graphs. Communications in Mathematical
  Physics, Vol. 406, No. 9, 209, 2025.

  ■ Tongyang Li, Yuexin Su, Ziyi Yang, and Shengyu Zhang. Quantum Approximate Optimization
  Algorithms for Maxmimum Cut on Low-Girth Graphs. Physical Review Research, 7, 033014,
  2025.

  ■ Tongyang Li, Quantum computers quickly find local minima, Nature Physics, 21,
  512–513, 2025. (News & Views)

  ■ (by contribution) Weiyuan Gong*, Chenyi Zhang*, and Tongyang Li, Robustness of
  Quantum Algorithms for Nonconvex Optimization. Accepted by the 13th International
  Conference on Learning Representations (ICLR 2025).

  ■ (by contribution) Zherui Chen*, Yuchen Lu*, Hao Wang, Yizhou Liu, and Tongyang
  Li. Quantum Langevin Dynamics for Optimization.Communications in Mathematical Physics,
  Vol. 406, No. 3, 52, 2025.

  ■ (by contribution) Jiyu Jiang, Zongqi Wan, Tongyang Li, Meiyue Shao, and Jialin
  Zhang. Shadow Tomography of Quantum States with Prediction. Frontiers of Computer
  Science, Vol. 19, No. 7, pp. 1-12, 2025.

  ■ Xinyi Chen, Elad Hazan, Tongyang Li, Zhou Lu, Xinzhao Wang, and Rui Yang, Adaptive
  Online Learning of Quantum States. Quantum, 8:1471, 2024.

  ■ (by contribution) Weiyuan Gong*, Shuo Zhou*, and Tongyang Li. Complexity of Digital
  Quantum Simulation in the Low-Energy Subspace: Applications and a Lower Bound. Quantum,
  8:1409, 2024.'
