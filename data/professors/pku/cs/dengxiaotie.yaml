bio_raw: '个人主页：

  邓小铁，1982年于清华大学获得学士学位，1984年于中国科学院获得硕士学位，1989年于斯坦福大学获得博士学位。1984-1985年，任中国科学院系统科学研究所助理研究员；1991-1999年任加拿大约克大学计算机科学与工程系助理教授、副教授；1997-2012年任香港城市大学计算机科学与工程系副教授、教授、讲席教授，同时，于2010年-2012年兼任英国利物浦大学计算机科学与工程系讲席教授；2012-2017年任上海交通大学计算机科学与工程系讲席教授；2017年12月入职北京大学，任计算机学院前沿计算研究中心讲席教授。

  邓小铁教授的主要科研方向为算法及博弈论、互联网经济、在线算法，及并行计算。2008年，他因在博弈论算法的贡献获选ACM Fellow。邓小铁教授近期的研究兴趣包括算法博弈论研究、均衡和机制设计、互联网广告系统、云计算定价及资源分配、社交网络行为分析及推荐系统，以及交通及物流网络算法。作为项目负责人，他曾承担十几项加拿大、香港、英国，及国家基金委科研项目，并担任多种国际期刊编委。他曾担任多个国际学术会议主席，并发起网络经济学国际三大洲（亚洲欧洲美洲）循环举办的全球性会议互联网及网络经济学术会议The
  Conference on Web and Internet Economics (WINE)。他在算法博弈论方面及网络搜索的研究成果，被国际同行广泛引用，发表论文200余篇，被引用数千次；多次做国际学术会议特邀报告；曾获得IEEE理论计算机学术会议FOCS的最佳论文奖；其成果“关于图与组合优化的若⼲经典问题的研究”获2015年度⾼等学校科学研究优秀成果奖
  （⾃然科学）二等奖（排名第⼆）。应用方面获得多项美国专利及国家专利，曾担任主要互联网公司机制设计顾问。'
