bio_raw: '个人主页：

  https://sites.google.com/site/ckkcdh/home

  程宽于2020年7月入职北京大学CFCS。之前他是德克萨斯奥斯汀大学的博士后。2019年在约翰霍普金斯大学计算机系取得博士学位。 再之前他在清华大学和山东大学取得硕士和学士学位。他的研究兴趣主要包括计算模型与复杂性，伪随机与编码，还包括机器学习与网络。他有多篇论文发表于理论计算机领域的顶级会议FOCS,
  CCC, SODA, ICALP, TCC等等。已有的主要工作专注于针对汉明距离和编辑距离的编码，以及针对电路和小空间计算模型的去随机化。他计划在将来继续深入研究这些领域，并且将研究拓展至其它热门领域，比如机器学习,
  量子计算等等。'
