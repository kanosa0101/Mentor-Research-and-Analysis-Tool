  标准工作

  作为主要完成人，参与如下国家标准与国际标准的制定：

  国家标准（以下为发布标准）：

  1. 《电子商务软件构件分类与代码》，GB/T 38776-2020；

  2. 《信息技术 大数据 数据分类指南》，GB/T 38667-2020；

  3. 《信息技术 大数据 政务数据开放共享 第1部分：总则》，GB/T 38664.1-2020；

  4. 《信息技术 大数据 政务数据开放共享 第2部分：基本要求》，GB/T 38664.2-2020；

  5. 《信息技术 大数据 政务数据开放共享 第3部分：开放程度评价》，GB/T 38664.3-2020；

  6. 《智慧城市 领域知识模型 核心概念模型》，GB/T 36332-2018；

  7. 《软件构件管理 - 管理信息模型》，GB/T 36446-2018；

  8. 《智慧城市技术参考模型》，GB/T 34678-2017；

  9. 《信息技术 大数据 术语》，GB/T 35295-2017；

  10. 《信息技术 大数据 技术参考模型》，GB/T 35295-2017；

  11. 《信息技术 SOA治理》，GB/T 34985-2017；

  国际标准（以下为发布标准）：

  1. ISO/IEC 30145-2:2020, Information technology - Smart City ICT Reference Framework—
  Part 2: Smart City Knowledge Management Framework，信息技术-智慧城市ICT框架-第二部分：智慧城市知识管理框架，2020.11发布，主编；

  2. ISO/IEC 18384-1:2016, Information technology - Reference Architecture for Service
  Oriented Architecture (SOA) - Part 1: Terminology and Concepts for SOA，信息技术-面向服务的体系结构参考架构
  第1部分：SOA术语和概念，已发布；

  3. ISO/IEC 18384-2:2016, Information technology -Reference Architecture for Service
  Oriented Architecture (SOA) - Part 2: Reference Architecture for SOA Solutions，信息技术-面向服务的体系结构参考架构
  第2部分：SOA解决方案的参考体系结构，已发布；

  4. ISO/IEC TR 30102:2012, Information technology -- Distributed Application Platforms
  and Services (DAPS) -- General technical principles of Service Oriented Architecture，信息技术-面向服务的体系结构总体原则，已发布；

  5. ISO/IEC 17788, Information technology - Cloud Computing – Overview and Vocabulary
  ，云计算术语，已发布；

  6. ISO/IEC 17789, Information technology – Cloud Computing – Reference Architecture，云计算参考架构，已发布。'
