title: 助理教授
email: xupeng.miao@pku.edu.cn
bio_raw: '个人主页：https://hsword.github.io/

  主要研究方向

  机器学习系统、数据管理、分布式计算等

  科研/教育经历

  2026至今，助理教授、研究员、博士生导师，北京大学

  2024-2025，Kevin C. and Suzanne L. Kahn New Frontiers助理教授、博士生导师，普渡大学

  2022-2024，博士后研究员，卡内基梅隆大学

  2017-2022，博士，北京大学

  研究成果概况

  长期从事机器学习系统（MLSys）⽅向的研究，致⼒于通过系统设计与优化，提⾼⼈⼯智能模型或算法在硬件设备上的执⾏效率，降低⼈⼯智能的成本与⻔槛；主持或参与了多个明星开源系统的设计与研发，在SIGMOD、VLDB、OSDI、SOSP、ASPLOS、NSDI、NeurIPS、ICML等国际顶级学术会议和期刊上发表论⽂
  50余篇，并在ICML 2024、SIGMOD 2024、ASPLOS 2025⼤会上做Tutorial报告；担任MLSys 2025和KDD 2025的AE
  Co-Chair以及多个相关领域国际会议/期刊评审；曾获2022 ACM中国优秀博⼠论⽂奖（全国奖）、VLDB 2022最佳论⽂奖、ASPLOS 2024 Distinguished
  Artifact Award、ACL 2024杰出论⽂奖、2024世界⼈⼯智能⼤会云帆奖·璀璨明星、IEEE Micro Top Picks 2025荣誉提名奖、2025
  NSF POSE Award、2025 Amazon Research Award、普渡⼤学荣誉命名助理教授职位等多项荣誉奖励。'
