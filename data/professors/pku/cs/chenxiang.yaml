bio_raw: '个人主页： https://if-lab-pku.github.io/

  主要研究方向

  高能效移动边缘计算系统

  高性能分布式与大规模人工智能系统

  新型移动人工智能应用

  主要科研项目

  高能效人工智能计算，研究针对人工智能软硬件的加速算法和计算体系结构优化，并实现电子设计自动化（EDA）的协同创新

  高性能分布式和大规模计算系统，研究和设计面向移动边缘终端的大规模人工智能部署和计算系统优化技术；

  新型移动智能应用，结合人工智能和高性能系统，探索多模态计算，泛用智能交互等新型交互智能应用。

  论文代表作

  [MLSys22][最佳论文奖] J. Mao, X. Chen, K. Nixon, C. Krieger, and Y. Chen. “MoDNN: Local
  Distributed Mobile Computing System for Deep Neural Network,” in Procee

  dings of the International Conference on Design Automation and Test in Europe, pp.
  1396∼1401, 2017.

  [DAC21] Z. Xu, F. Yu, J. Xiong, and X. Chen. “Helios: Heterogeneity-Aware Federated
  Learning with Dynamically Balanced Collaboration,” in Proceedings of the Design
  Automation Conference, pp. 997∼1022, 2021.

  [KDD21] F. Yu, W. Zhang, Z. Qin, Z. Xu, D. Wang, C. Liu, Z. Tian, and X. Chen. “Fed2:
  Feature-Aligned Federated Learning,” in Proceedings of the ACM SigKDD Conference
  on Knowledge Discovery and Data Mining, pp. 2066∼2074, 2021.

  [DATE20][最佳论文提名] F. Yu, C. Liu, D. Wang, Y. Wang, and X. Chen. “AntiDOte: Attention-
  based Dynamic Optimization for Neural Network Runtime Efficiency,” in Proceedings
  of the International Conference on Design Automation and Test in Europe, pp. 951∼956,
  2020.

  [DATE17][最佳论文奖] J. Mao, X. Chen, K. Nixon, C. Krieger, and Y. Chen. “MoDNN: Local
  Distributed Mobile Computing System for Deep Neural Network,” in Proceedings of
  the International Conference on Design Automation and Test in Europe, pp. 1396∼1401,
  2017.'
