  主要科研项目

  近年来主持/参与10余项国家项目，包括国家自然科学基金、863、973、重大仪器、科技支撑等项目。主持研制专业级高清视频编码SoC芯片2款，授权中国发明专利34项。

  主要获奖成果

  1）数字视频编解码国家标准制定及应用，中国电子学会电子信息科学技术一等奖，2010年，排名14

  2）北京大学天创奖教金，2016年

  主要学术任职

  担任数字媒体所副所长、北京大学数字视频编解码技术国家工程实验室系统研究室主任、北京大学（天津滨海）新一代信息技术研究院数字媒体研究中心主任、数字媒体所多媒体SoC芯片课题组长

  担任中国指挥与控制学会富媒体指挥专业委员会委员，北京电子学会广播电视第九、十届委员会委员，国家自然科学基金委项目评阅人，IEEE会员，T-CSVT等国际期刊的审稿人'
