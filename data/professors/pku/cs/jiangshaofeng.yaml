bio_raw: '个人主页：

  https://shaofengjiang.cn

  简介

  姜少峰博士，现任北京大学前沿计算研究中心助理教授，博士生导师，北京大学博雅青年学者，于2021年6月正式加入中心。他于2017年在香港大学取得博士学位，曾在以色列魏茨曼科学研究学院（Weizmann
  Institute of Science）进行为期三年的博士后研究，并曾在芬兰阿尔托大学（Aalto University）任助理教授。他博士在读期间获微软亚洲研究院PhD
  Fellowship提名奖，博士后研究获魏茨曼杰出博士后研究成果奖。他的研究方向为理论计算机科学，近期侧重于大数据算法及其在机器学习中的应用，并已经在包括FOCS，SICOMP，SODA，ICML，NeurIPS等的主流国际期刊和会议上发表论文多篇。姜少峰博士现致力于理论计算机科学、数据科学理论基础等方面的教学和科研，并与国际知名机构积极展开合作，积极推进相关方向的人才培养和科研产出，提升中心的国际影响力。

