bio_raw: '个人主页：

  https://kangchenpku.github.io/

  主要研究方向

  泛在操作系统 / 具身智能操作系统 / 系统软件

  主要科研项目

  1. 2025 年 – 2027 年，国家自然科学基金，面向端侧异构操作系统的微服务架构与关键技术，培育项目。

  2. 2022 年 – 2024 年，国家自然科学基金，数据驱动的泛在存储虚拟化方法和管理机制，重点专项。

  3. 2023 年 – 2025 年，科技部 2030 重大攻关项目，智能算力网统一运营与服务环境。

