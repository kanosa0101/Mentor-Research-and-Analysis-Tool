bio_raw: '个人主页：

  http://idm.pku.edu.cn/info/1017/1047.htm

  主要研究方向

  AI平台与系统、计算机视觉、媒体处理、对象检测、运动对象分割

  科研/教育经历

  2014-05至今，北京大学，计算机学院，数字媒体研究所，副研究员

  2005-06至2014-04，日电(中国)有限公司，NEC中国研究院，高级研究员、研究部长

  1993-09 至 2005-02，哈尔滨工业大学，计算机系，计算机应用专业，本、硕、博

  研究成果概况

  曾炜，博士，2005年毕业于哈尔滨工业大学计算机应用技术专业；博士毕业后加入NEC中国研究院，从事多媒体技术应用系统研究，先后任副研究员、研究员、高级研究员、研究部长。2014年5月，曾炜博士加盟北京大学视频与视觉技术国家工程研究中心，任副研究员。曾炜博士拥有20年相关专业研发背景、9年跨国公司研究经历，长期从事人工智能、智能计算系统、图像处理、计算机视觉、模式识别、多媒体领域的研究工作。曾炜博士先后发表50余篇学术论文，申请超过20多项中外专利，获得10多项国家和省部级科研项目资金资助；担任CVPR2021、CVPR2018、BigMM2020、BigMM2019、BigMM2018、ICPR2020，ICPR2016、ACCV2018等的PC
  Member或审稿人；担任科技部新一代人工智能启智社区技术委员会委员。

  主要科研项目：

  1.科技部科技创新2030-“新一代人工智能”重大项目，“新一代人工智能开源社区软硬件基础支撑平台”，2020/7-2023/6。

  2.科技部重点研发计划，“大规模视频节目的实时检测分析系统与示范应用”，2017/10-2023/03。

  3.广东省重点研发计划，“面向AI超算原型机的核心技术研发”，2019/9-2021/8

  4.广东省重点研发计划，“可敏捷定制的智能视觉处理器及系统应用”，2020/01-2023/01。

  5. 国家自然科学基金重点项目，“近浅海水下捕捞机器人的基础理论与关键技术研究”，2017/1-2021/12

  6. 企业合作项目, “NVAIL联合实验室”，2016/1-2020/12。'
