bio_raw: '个人主页：

  主要研究方向

  形式化方法、隐私性与安全性、人工智能基础

  科研/教育经历

  2007，博士后，清华大学

  2003，博士，北京师范大学

  主要荣誉与获奖

  2014年 教育部自然科学二等奖（排名1/3）

  研究成果概况

  长期从事形式化方法、隐私性与安全性和人工智能基础方面的研究，在不确定性系统的隐私性、安全性、可靠性、公平性和正确性的形式化建模、分析和验证等方面取得了一些具有原创性的研究成果，在AAAI,
  AIJ, IEEE TAC, IEEE TC, IEEE TIFS, IJCAI, Inform. Comput., JAIR, NeurIPS, TCS等国际知名期刊或会议上发表学术论文100余篇，出版专著或教材4部。作为负责人先后主持国家自然科学基金6项，主持科技部国家重点研发计划云计算和大数据重点专项课题1项，主持CCF-华为胡杨林基金开放课题1项，获教育部自然科学二等奖1项。现任教育部网络空间安全专业教指委委员，中国网络空间安全人才教育联盟副理事长，CAAI离散智能计算专委会副主任，IEEE高级会员。

  主要科研项目：

  1. 国家自然科学基金面上项目，62572007，医疗问答大模型中的隐私保护研究，2026/01-2029/12，50万元，主持。

  2. 国家自然科学基金面上项目，62172016，资源分配中的隐私保护研究，2022/01-2025/12，59万元，主持。

  3. 科技部国家重点研发计划（云计算和大数据）重点专项课题，2020YFB1005702，区块链密钥安全及安全增强技术，

  2020/11-2023/10，182万元，主持。

  4. 国家自然科学基金面上项目，61772035，不确定性系统隐私性的建模与分析，2018/01-2021/12，65万元，主持。

  5. 国家自然科学基金面上项目，61370053，移动情境感知系统的实时性与可靠性，2014/01-2017/12，76万元，主持。

  6. 国家自然科学基金面上项目，60973004，噪音环境下移动进程的可靠性与安全性，2010/01-2012/12，30万元，主持。

  Selected Publications:

  1. Y. Liu, C. Wang, Y. Lou, Y. Cao, H. Wang, Attackers are not the same! Unveiling
  the impact of feature distribution on label inference attacks, IEEE Transactions
  on Information Forensics and Security, 20 (2025), 71-86.

  2. Y. Liu, Y. Lou, Y. Liu, Y. Cao, H. Wang, Label leakage in vertical federated
  learning: A survey, IJCAI-24 (2024), 8160-8169.

  3. K. Gao, K. Inoue, Y. Cao, H. Wang, A differentiable first-order rule learner
  for inductive logic programming, Artificial Intelligence, 331 (2024), 104108.

  4. Z. Li, A. Liu, L. Xia, Y. Cao, H. Wang, Differentially private condorcet voting,
  AAAI-23 (2023), 37 (5), 5755-5763.

  5. X. Guo, S. Sikdar, L. Xia, Y. Cao, H. Wang, First-choice maximality meets ex-ante
  and ex-post fairness, IJCAI-23 (2023), 2719-2727.

  6. H. Wang, S. Sikdar, X. Guo, .L Xia, Y. Cao, H. Wang, Multi resource allocation
  with partial preferences, Artificial Intelligence, 314 (2023), 103824.

  7. H. Wang, S. Sikdar, X. Guo, .L Xia, Y. Cao, H. Wang, Multi-type resource allocation
  with partial preferences, AAAI-20 (2020), 34(02), 2260-2267.

  8. J. Yang, Y. Cao, and H. Wang, Differential privacy in probabilistic systems,
  Information and Computation, 254 (2017), 84-104.

  9. W. Chen, Y. Cao, H. Wang, Behavioural equivalences of a probabilistic pi-calculus,
  Science China: Information Sciences, 55 (2012), 2031-2043.

  10. Y. Cao, Reliability of mobile processes with noisy channels, IEEE Transactions
  on Computers, 61 (2012), 1217-1230.'
