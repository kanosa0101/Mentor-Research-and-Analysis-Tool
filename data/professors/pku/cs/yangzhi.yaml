bio_raw: '个人主页：https://yangzhihome.github.io/

  北京大学信计算机学院副研究员，博士生导师。主要研究方向为深度学习模型的分布式并行、计算优化、算法和系统设计。在 OSDI、ATC、SIGMOD、VLDB、KDD、NIPS、WWW、ICLR、ICML、SoCC、ICDCS等高水平国际学术会议上和ACM/IEEE
  Transactions发表论文50多篇，获得国际万维网大会WWW 2022最佳学生论文奖，入选国家高层次青年人才计划。获得过高校科学研究优秀成果奖、湖北省科技进步一等奖、中国电子学会科技进步一等奖、北京大学黄廷方/信和青年杰出学者奖、计算机系科研工作先进个人等。'
