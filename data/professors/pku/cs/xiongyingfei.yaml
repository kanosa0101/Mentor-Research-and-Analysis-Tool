bio_raw: '个人主页：http://sei.pku.edu.cn/~xiongyf04/

  熊英飞于2009年从日本东京大学获得博士学位，2009-2011年在加拿大滑铁卢大学工作，2012年加入北京大学，现任新体制长聘教授、计算机学院软件研究所副所长。熊英飞的研究兴趣是程序设计语言和软件工程，特别是程序分析、合成和修复。他提出了理论和方法降低程序编写和缺陷修复的代价。比如，基于差别的双向变换框架是最广泛使用的双向变换框架之一，ACS将程序修复技术在公共数据集上的正确率从此前不到40%提升到70%以上。他的工作获得MODELS最有影响论文奖，4次获得ACM
  SIGSOFT杰出论文奖。他的工作也被工业界采用，比如新一代Linux内核配置项目、燕云DaaS系统、华为公司等。他是SATE18的程序委员会联合主席，也在ICSE、FSE、ASE、ISSTA等会议担任PC，3次获得ICSE和FSE的杰出审稿人奖。他的研究受自然科学基金优秀青年基金、青年973等项目资助，他也获得NASAC青年软件创新奖、CCF-IEEE
  CS青年科学家奖等奖项。'
