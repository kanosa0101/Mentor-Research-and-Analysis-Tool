bio_raw: '个人主页：https://www.shanghangzhang.com/

  主要研究方向

  开放世界泛化机器学习、类脑视觉感知与学习、AI驱动科学计算

  主要科研项目

  1.自主意识学习，国家自然科学基金委员会专项项目

  2.面向驾驶场景的高真实感数据合成与视觉模型训练平台

  3.面向自动驾驶的开放环境泛化机器学习, CCF-滴滴盖亚青年学者科研基金项目

  4.面向自动驾驶的跨场景泛化3D感知关键技术研究，CCF-百度松果基金项目

