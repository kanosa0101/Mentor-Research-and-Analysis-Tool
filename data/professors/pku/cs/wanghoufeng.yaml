bio_raw: '个人主页：

  主要研究方向

  主要从事自然语言处理、人工智能及相关的研究，内容涉及大规模语言知识获取和语义分析技术、自动问答和人机对话、观点挖掘等。

  研究成果概况

  在包括ACL，EMNLP，COLING，ICML，IJCAI，AAAI，SIGIR，KDD等国际会议和Computational Linguistics，TALIPS等期刊发表学术论文，共发表学术论文60多篇。

  承担过多项10余项国家项目，包括国家863项目“大规模中文语义信息处理技术与系统”（2012.1-2014.12）的首席专家，国家社科基金重大项目“面向网络文本的多视角语义分析方法、语言知识库及平台建设研究”（2013.1-2017.12）的首席专家。

  构建的语言资源库转让给多家企业或研究机构。目前为中文信息学会的常务理事。

  Selected Publications

  1) Xu Sun, Xuancheng Ren, Shuming Ma, Houfeng Wang. meProp: Sparsified Back Propagation
  for Accelerated Deep Learning with Reduced Overfitting，

  ICML

  2017

  2) Yizhong Wang, Sujian Li, Houfeng Wang. A Two-Stage Parsing Method for Text-Level
  Discourse Analysis.

  ACL

  2017(outstanding paper)

  3) Qing Zhang, Houfeng WANG. Noise-Clustered Distant Supervision for Relation Extraction:
  A Nonparametric Bayesian Perspective

  .

  EMNLP

  2017

  4) Dehong Ma, Sujian Li, Xiaodong Zhang, Houfeng Wang. Interactive Attention Networks
  for Aspect-Level Sentiment Classification.

  IJCAI

  2017

  5) Xiaodong Zhang , Sujian Li, Lei Sha1, Houfeng Wang. Attentive Interactive Neural
  Networks for Answer Selection in Community Question Answering.

  AAAI

  2017

  6) Rui Cai,Xiaodong Zhang and Houfeng Wang. Bidirectional Recurrent Convolutional
  Neural Network for Relation Classi?cation.

  ACL

  2016

  7) Chen Shi, Shujie Liu, Shuo Ren, Shi Feng, Mu Li, Ming Zhou, Xu Sun, Houfeng Wang.
  Knowledge-Based Semantic Embedding for Machine Translation.

