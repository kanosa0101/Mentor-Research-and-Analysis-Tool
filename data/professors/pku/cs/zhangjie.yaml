bio_raw: '个人主页：chaselab.wiki

  主要研究方向

  面向AI的存储系统、加速器原生存储系统、存算一体系统、AI使能存储系统。

  科研/教育经历

  博士后：韩国先进科学技术学院（KAIST）

  博士：韩国延世大学

  研究成果概况

  长期从事存储系统和专用处理器的研究和设计，致力于从计算机体系结构层面出发，解决大数据和人工智能时代对于高性能存储系统的需求，突破冯诺依曼体系结构下数据迁移的瓶颈以及内存墙的限制。负责和参与科技部重点研发项目、国家自然科学基金重点项目和面上项目，得到华为、江波龙、阿里云、蚂蚁等公司的资助。自2016年起，在计算机国际会议及期刊上发表了60余篇论文，包括ISCA、OSDI、SOSP、HPCA、MICRO、ASPLOS、FAST、ATC、NSDI、DAC和Eurosys。2025年入选HPCA名人堂（首位90后成员）。在计算机系统结构领域90后学者中，发表顶级会议论文数排名全球第一（CSRankings，2016-2026）。亚洲历史上第三位在所有体系结构和系统顶级会议上发表论文的学者。论文获2019年韩国计算机大会（KCC）最佳演讲论文奖和2019年非易失性内存研讨会（NVMW）优秀论文提名奖。在存储领域的研究成果被列为KAIST50年重大突破之一，并被四十余家新闻媒体报道。

  主要荣誉与获奖

  国家高层次青年人才

  体系结构顶会HPCA名人堂（90后首位成员）

  华为奥林帕斯奖

  英特尔中国学术英才计划荣誉学者

  ACM China SIGCSE新星奖

  主要学术任职

  在多个CCF-A类期刊和会议上担任审稿人，包括：

  · IEEE Transactions on Computer （CCF-A）

  · ACM Transactions on Storage （CCF-A）

  · ACM Transactions on Computer Systems （CCF-A）

  · IEEE Transactions on Computer-Aided Design of Integrated Circuits and Systems
  （CCF-A）

  · IEEE Transactions on Parallel and Distributed Systems （CCF-A）

  · ACM Transactions on Architecture and Code Optimization（CCF-B）

  · IEEE Computer Architecture Letters

  Selected Publications

  Ohm-GPU: Integrating New Optical Network and Heterogeneous Memory into GPU Multi-Processors
  (MICRO) 2021

  Revamping Storage Class Memory With Hardware Automated Memory-Over-Storage Solution
  (ISCA) 2021

  ZnG: Architecting GPU Multi-Processors with New Flash for Scalable Data Analysis
  (ISCA) 2020

  Scalable Parallel Flash Firmware for Many-core Architectures (FAST) 2020

  DRAM-less: Hardware Acceleration of Data Processing with New Memory (HPCA) 2020

  FlashGPU: Placing New Flash Next to GPU Cores (DAC) 2019

  FUSE: Fusing STT-MRAM into GPUs to Alleviate Off-Chip Memory Access Overheads (HPCA)
  2019

  FlashShare: Punching Through Server Storage Stack from Kernel to Firmware for Ultra-Low
  Latency SSDs (OSDI) 2018

  Amber: Enabling Precise Full-System Simulation with Detailed Modeling of All SSD
  Resources (MICRO) 2018

  FlashAbacus: A Self-governing Flash-based Accelerator for Low-power Systems (Eurosys)
  2018

  DUANG: Fast and Lightweight Page Migration in Asymmetric Memory Systems (HPCA) 2016

  NVMMU: A Non-Volatile Memory Management Unit for Heterogeneous GPU-SSD Architectures
  (PACT) 2015'
