bio_raw: '个人主页：http://www.graphics.pku.edu.cn/members/gaimeng

  主要研究方向

  盖孟主要研究大规模自然场景的实时渲染和虚拟仿真技术，作为核心骨干参与了多项国家863、973项目。参与实验室自主研发的虚拟仿真平台ViWo的架构设计、核心渲染算法研究和工程化应用。基于ViWo研发的飞行模拟视景系统，在航空领域已获得良好应用。'
