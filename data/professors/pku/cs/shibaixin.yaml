bio_raw: '实验室主页：

  http://camera.pku.edu.cn

  招生须知：

  https://camera.pku.edu.cn/contact

  施柏鑫，北京大学计算机学院多媒体信息处理全国重点实验室、视频与视觉技术国家工程研究中心研究员、博士生导师（“博雅青年学者”）；北京智源人工智能研究院青年科学家。2013年博士毕业于日本东京大学，曾先后在麻省理工学院媒体实验室、新加坡科技设计大学、南洋理工大学、日本国立产业技术综合研究所从事研究工作。研究方向为计算摄像学与计算机视觉，发表论文170余篇（包括TPAMI论文21篇，计算机视觉三大顶级会议论文69篇，统计截至2023年9月）。论文获评国际计算摄像会议（ICCP）2015年Best
  Paper - Runner Up、入选IJCV专刊Best Papers from ICCV 2015，2021年获得日本大川研究助成奖。主持科技创新2030—“新一代人工智能”重大项目、国家自然科学基金重点、国家级青年人才等多个项目。担任国际顶级期刊TPAMI、IJCV编委，顶级会议CVPR、ICCV领域主席。IEEE、CCF高级会员，APSIPA杰出讲者。

  主要研究方向

  计算摄像学、类脑视觉传感器、计算机视觉、生成式人工智能、具身智能

  科研/教育经历

  日本东京大学博士，麻省理工学院媒体实验室博士后；

  主要荣誉与获奖

  科技部重大专项首席科学家，国家自然科学基金重点项目负责人，北京智源学者，北大-智平方具身智能联合实验室主任，日本大川研究助成奖，中国电子学会青年科学家奖；

  研究成果概况

  发表论文270余篇（包括TPAMI论文37篇，计算机视觉三大顶级会议论文110篇；2026年4月数据），论文获评CVPR24/ICCP15最佳论文亚军、ICCV15/3DV26最佳论文候选；担任国际顶级期刊TPAMI/IJCV编委，顶级会议CVPR等牵头领域主席；APSIPA杰出讲者、CCF杰出会员、IEEE/CSIG高级会员。'
