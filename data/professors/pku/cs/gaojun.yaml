bio_raw: '北京大学计算机学院，教授，博导，1997/2000获山东大学计算机系学士/硕士学位，2003年获北京大学信息学院博士学位。研究方向为AI和数据管理结合、图数据管理和深度分析等，近期承担了国家科技重大专项、国家自然科学基金、深圳基础研究课题等一批国家级和省部级科研项目，以及与阿里、华为、中兴、电信等企业在内的一批产学合作研究项目。在数据管理领域会议和期刊上发表论文60余篇，获阿里巴巴高校合作优秀奖，CCF科技进步杰出奖，开发了ICS-GNN、LOGER、APrompt4EM等模型和方法，发表VLDB、ICDE、AAAI、IJCAI、WWW、KDD等研究论文，2024研究组囊括KDD
  CRAG比赛全部三个赛道第一名，2025年研究组蝉联KDD RAG-MM比赛冠军。相关技术在阿里巴巴公司、华为商用系统中实际应用。

  主要研究方向

  基于AI的结构化数据管理：

  通过大模型、强化学习等方法，探索面向不同领域中的结构化数据生成和管理方法，例如，数据库中查询执行计划、批查询调度计划、图中社区发现、芯片领域中的布局、面向字符串的基数估计等

  面向AI的数据管理：

  探索提升AI模型的数据管理方法，包括数据模式理解、向量检索效率提升、RAG等

  招收博士研究生

  责任心，动手能力强，科研敏感度高，积极主动

  科研课题

  课题组和华为、中兴、字节等企业有长期的合作

