bio_raw: '个人主页：http://www.icl.pku.edu.cn/members/lisujian/default.htm

  主要研究方向

  自然语言处理、自动文摘、篇章分析等领域

  研究成果概况

  主持了多项自然科学基金项目、社会科学基金项目和多项企业项目，并作为核心人员参与了多项国家863、973、自然科学基金重点项目和国家支撑计划。在国内外会议和刊物上共发表相关论文100余篇。担任了国际顶级会议ACL、AAAI、KDD、EMNLP等的程序委员会委员，还担任了ACL、COLING等会议的领域主席。'
