bio_raw: '个人主页：https://zhenjiang888.github.io/

  胡振江，北京大学讲席教授，北京大学计算机学院院长，中关村实验室首席科学家；欧洲科学院院士、日本工程院院士、IEEE会士、ACM杰出科学家，国家级高层次人才。1996年获得日本东京大学博士学位，曾任日本东京大学、日本国立信息学研究所教授，ACM函数程序设计国际会议（ICFP）指导委员会主席，国际信息处理联盟IFIP
  WG 2.1委员，亚洲软件基础学会(AAFS)指导委员会主席，NII湘南国际系列研讨会学术委员会主席，以及《IEEE Transactions on Software
  Engineering》《Science of Computer Programming》《Journal of Functional Programming》《国家科学评论》《中国科学》等杂志的编委。

  胡振江教授长期从事程序设计语言和软件科学与工程的研究，在程序推导与验证、结构化函数式程序设计、程序的自动综合和优化、并行程序设计、双向变换语言的设计和实现以及软件的演化和维护等方面做出了很多开创性工作并取得了突出的研究成果。他曾获全日本最佳博士论文奖、日本软件科学学会基础研究成就奖，并被评为21世纪先驱科学家（日本科学技术振兴机构）。'
