bio_raw: '个人主页：

  https://soar.group/chenren/

  个人简介

  许辰人是北京大学博雅长聘副教授、计算机学院院长助理、网络与高能效计算研究所副所长。2014年从美国罗格斯大学获得博士学位，（曾）任卡耐基梅隆大学博士后，庆应义塾大学客座教授，AT&T香农实验室和微软研究院访问学者。研究领域为具身智能物联网与多模态感知赋能科学与工程智能，先后主持基金委优青/重点项目和国家重点研发计划课题，所研移动物联网高性能感知互联系统研究成果获2025年度CCF技术发明一等奖（排1）、MobiSys’25最佳论文奖、达摩院青橙奖、华为十大发明和日本大川基金研究奖，在华为鸿蒙终端和阿里物流系统得到大规模商用。担任ACM
  IMWUT副主编、UbiComp’26和MobiSys’25大会主席、UbiComp’25和HotMobile’24程序委员会主席、UbiComp指导委员会委员、SIGCOMM/MobiCom/NSDI程序委员会及组委会委员、ACM嵌入式系统专委中国区秘书长和卡耐基梅隆大学北京校友会理事。'
