bio_raw: '个人主页：

  https://ha0tang.github.io/

  主要研究方向

  生成式模型、世界模型、空间智能、大语言模型、多模态大模型、计算机视觉

  科研/教育经历

  唐浩，博士，北京大学计算机学院助理教授/研究员、博士生导师 、博雅青年学者、未名青年学者；北大具身与生成智能实验室负责人、北大图灵班科研导师。先后在美国卡耐基梅隆大学（CMU）和瑞士苏黎世联邦理工学院（ETH
  Zurich）开展博士后研究，于意大利特伦托大学获得博士学位，并在英国牛津大学、新加坡国立大学、美国东北大学及阿联酋IIAI等机构进行学术访问与研究实习。此外，他还积极推动产学研结合，曾在美国、英国、罗马尼亚和中国的多家创业公司担任高级技术顾问。

  主要荣誉与获奖

  入选国家级海外高水平人才计划，获国家优秀留学生奖（归国类），并连续三年（2023–2025年）入选斯坦福大学全球前2%顶尖科学家榜单。

