bio_raw: '个人主页：http://net.pku.edu.cn/~yhf

  主要研究方向

  信息检索和计算金融

  科研/教育经历

  2006-2007，访问学者，美国UIUC

  2002，博士，北京大学

  主要荣誉与获奖

  2004年 北京市科技进步二等奖

  2016年 中国计算机学会科学技术二等奖

  研究成果概况

  北京大学计算机学院副教授。《计算概论》获得国家级精品课程。在科学研究方面，主持国家自然科学基金项目三项和一项863项目，参加两项973项目和一项核高基项目。出版学术专著《搜索引擎-原理、技术与系统》。发表60余篇研究论文，担任多个期刊的审稿人。'
