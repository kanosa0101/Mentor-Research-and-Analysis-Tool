bio_raw: '个人主页：https://yanchunsun.github.io/index.html

  主要研究方向：

  软件工程、服务计算、大数据分析、智慧教育技术等

  科研／教育经历：

  1996－1999，东北大学，博士

  1999－至今，北京大学，教师

  2005－2006，美国耶鲁大学，访问学者

  代表性学术论著：

  现已在Science China、Journal of Systems and Software、ICSE、FSE、ASE、ICWS等国内外知名学术期刊和会议发表论文90余篇，获得2023
  IEEE-CCF服务计算最佳应用论文奖、ICSS 2022 Best Paper Award等。以第一发明人获授权专利11项，编著两部（牵头主编了教育部“101计划”软件工程核心教材《软件工程——经典、现代和前沿》），译著三部，具体请见个人主页。

  部分主要科研项目：

  1、2024.3-2027.2，国家重点研发计划课题：跨域多模态科技资源标识可信服务技术体系研究，北大方负责人。

  2、2020.11-2023.10, 国家重点研发计划课题：联盟链监管理论、方法与关键技术，北大方负责人。

  3、2018.5-2022.6，国家重点研发计划课题：高维大规模机器学习系统，北大滨海研究院方负责人。

  4、2013.1-2016.12，国家自然科学基金联合基金重点项目：云教育平台构建若干关键技术创新研究，北大方负责人。

  5、2015.1-2017.12，国家863计划项目：基于中国云产品的混合云关键技术与系统，主要技术骨干。

  6、2009.1-2013.8，国家973计划项目：基于网络的复杂软件可信度和服务质量及其开发方法和运行机理的基础研究，主要技术骨干。

  7、2007.7-2009.1，国家863计划项目：模型驱动的体系结构建模中的元建模技术研究，课题副组长。

  8、2006.1-2008.12，国家自然科学基金项目：网络分布式环境下软件体系结构动态变化的分类框架和设计模型的研究，课题负责人。

  9、2002.12-2008.10，国家973计划项目：Internet环境下基于Agent的软件中间件理论和方法研究，主要技术骨干。

  主要荣誉及获奖：

  1、2024年中国电子学会技术发明奖一等奖

  2、2024年IEEE TCSVC服务计算杰出女性奖

  3、2024年北京大学教学优秀奖

  4、2023年获得IEEE-CCF服务计算最佳应用论文奖

  5、2022年入选2021年度高校计算机专业优秀教师奖励计划

  6、2022年获得ICSS 2022 Best Paper award.

  7、2021年获得北京大学教学成果一等奖（个人排名第1）

  8、2020年获得首批国家级一流本科课程（“软件工程”课程主持人）

  9、2019年北京大学教学优秀奖

  10、2017年获得北京市高等教育教学成果二等奖（个人排名第1）

  11、2016年获得首批国家级精品资源共享课（“软件工程”课程主持人）

  12、2015年教育部科技进步一等奖：软件定义的云管理关键技术及系统

  13、2012年获得北京大学教学成果一等奖（个人排名第1）

  14、2010年获得国家级精品课（“软件工程”课程主要建设者）

  15、2010年获得IBM奖教金

  16、2009年获得IBM奖教金

  17、2008年获得教育部－IBM精品课（“方案工程”课程主持人）

  研究成果概况：

  主持国家自然科学基金项目两项，合作主持国家863计划项目一项，作为北大方负责人参与国家重点研发计划课题三项，主持企业合作项目一项、医信合作种子基金两项。以骨干身份参加多项国家级项目,
  包括973计划项目两项、863计划项目两项等。获软件著作权2项、授权发明专利11项。现已在JSS、ICSE、FSE、ASE、ICWS等国内外知名学术期刊和会议发表论文90余篇，编著两部，译著三部。

  IEEE SWEBOK Version 3软件设计领域编委、CCF软件工程专委会执行委员、CCF服务计算专委会执行委员、CCF教育专委会执行委员、教育部101计划“软件工程”课程建设组核心成员。ACM会员、IEEE会员、CCF杰出会员。担任IEEE
  SSE 2025和IEEE SSE 2024 程序委员会主席，ICWS、SEKE、COMPSAC、APSEC、SCC、ICSS、ACM TUR-C等国际会议的程序委员会委员，任《ACM
  Transactions on Software Engineering and Methodology》、《Journal of Systems and Software》、《Journal
  of Computer Science and Technology》、《软件学报》、《计算机学报》、《电子学报》等多个期刊的论文评审人，以及国家自然科学基金评议专家等。'
