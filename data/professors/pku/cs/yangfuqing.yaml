bio_raw: '详细简历

  从事系统软件、软件工程、软件工业化生产技术和系统等方面的教学和研究工作。主持研制成功我国第一台百万次集成电路计算机多道运行操作系统和第一个全部用高级语言书写的操作系统；倡导和推动成立北京大学计算机科技系，1983-1999年担任系主任期间，将该系建成国内一流和国际知名的计算机科学技术研究和人才培养基地；在国内率先倡导软件工程研究，创办了国内第一个软件工程学科；开创了软件技术的基础研究领域；主持了历经多个五年计划的国家重点科技攻关项目——青鸟工程和国家863计划若干重点课题的研究；创建了软件工程国家工程研究中心；提出“人才培养与产业建设互动”的理念，创建了以新机制、新模式办学的示范性软件学院。

  多次获得各种荣誉称号和奖励，如：全国科学大会奖、国家科技进步二等奖、电子工业部科技进步特等奖、国家级教学成果奖一等奖等十六项国家及部委级的奖励、全国“三八”红旗手、首都“巾帼十杰”、全国高等学校先进科技工作者、国家“七五”、“八五”、“九五”国家重点科技攻关计划先进个人、“光华科技基金”一等奖、何梁何利科学与技术进步奖、中国计算机学会终身成就奖、北京大学蔡元培奖、国华杰出学者奖等。

  发表论文150余篇，编著10部，培养了百余名硕士、博士和博士后。'
