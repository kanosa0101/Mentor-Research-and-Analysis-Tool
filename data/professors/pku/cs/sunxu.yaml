bio_raw: '个人主页：https://xusun26.github.io/

  主要研究方向

  自然语言处理，深度学习，人工智能

  科研/教育经历

  2012-今，研究员、博士生导师，北京大学

  2010-2012，先后在日本东京大学、美国康奈尔大学、香港理工大学担任研究职位

  2007-2010，博士，东京大学

  2004-2007，硕士，北京大学

  2000-2004，学士，华中科技大学

  主要荣誉与获奖

  EMNLP 2023 Best Long Paper Award, 2023

  FinNLP Workshop at IJCAI 2022 Best Paper Award, 2022

  Young Scientist, Beijing Academy of Artifical Intelligence, 2020 (北京智源青年科学家)

  COLING 2018 Best Paper Award, 2018

  1st Rank Prize, Science and Technology Prize of CIE (Chinese Institute of Electronics),
  2018 (中国电子学会科学技术奖一等奖)

  Architecture Innovation Award, JD Dialogue Challenge, 2018

  CCF NLPCC Distinguished Young Scientist Award, 2018

  Okawa Research Award, Japan, 2017

  Boya Young Fellow, Peking University, 2016 (北京大学博雅青年学者)

  Qiu Shi Outstanding Young Scholar Award (求是杰出青年学者奖), Qiu Shi Foundation, 2015

  研究成果概况

  孙栩，北京大学计算机学院研究员、博士生导师，并担任新体制长聘副教授。2010年于东京大学获得计算机科学博士学位，2007年于北京大学获得计算机科学硕士学位。先后在东京大学、微软公司雷蒙德研究院、康奈尔大学、香港理工大学担任研究职位。研究方向为自然语言处理和机器学习，特别是自然语言生成、面向语言的深度学习。在IEEE
  TPAMI、ACL、ICML、NIPS、ICLR、EMNLP、COLING等国际期刊和会议发表多篇论文，Google Scholar论文被引用20000余次。先后获得香港求是科技基金会“求是杰出青年学者奖”、北京大学博雅青年学者、中国电子学会科学技术奖一等奖、国际计算语言学大会COLING
  2018最佳论文奖、中国计算机学会自然语言处理与中文计算青年新锐奖、北京智源青年科学家、自然语言处理经验方法会议EMNLP 2023最佳论文奖。'
