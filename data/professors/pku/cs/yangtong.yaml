bio_raw: '个人主页：

  https://yangtonghome.github.io/

  主要研究方向

  网络大数据、网络流量测量、Bloom filter、机器学习等

  科研/教育经历

  2021至今，

  研究员、

  长聘副教授、博士生导师，北京大学

  2019至2021，预聘副教授、博士生导师，北京大学

  2018-2019，副研究员，北京大学

  2015-2018，助理研究员，北京大学

  2010-2013，博士，清华大学

  研究成果概况

  网络、数据库、机器学习、大模型、数据挖掘等方向的新型概率数据结构，以可控且小的误差换取时间和空间上的显著降低。发表一作/通信作者CCF A类论文70多篇，其中SIGCOMM,
  SIGKDD, SIGMOD共24篇。发表了北京大学第一单位首篇SIGCOMM、NSDI、ToN。主持国家自然基金区域联合、面上、青年4项，负责国家重点研发计划课题/子课题3项，华为、头条、中兴项目多项。研究成果被国家自然基金委网站报道2次，教育部科技发展中心转发1次，研究成果在华为落地5次、头条1次、Redis数据库1次。指导博士生获得6次校长奖学金，本科生获得5次学院十佳本科毕设，
  3次北京市优秀本科毕业设计。'
