bio_raw: '手机号码：86-17200343089

  个人主页：

  https://mechtaev.com

  主要研究方向

  Sergey Mechtaev（谢辽夏）博士从事软件缺陷修复的研究。其博士论文提出了著名程序修复工具Angelix，成功将符号执行和程序合成深度结合，首次将基于语义的程序缺陷修复提升到实用水平，使得基于语义的程序修复成为缺陷修复的三大主流技术途径之一。该博士论文于2019年获得了软件工程领域博士生的最高奖“ACM
  SIGSOFT杰出博士论文奖”。后续工作不断推进缺陷修复技术的能力和程序修复的工业部署。相关工作也获得了几项ACM SIGSOFT杰出论文奖。

  Mechtaev博士还积极进行研究社区建设，是程序缺陷修复社区的主要建设者之一。他是程序缺陷修复主要的社区网站program-repair.org的创始人和主要维护者。他还发起了社区的主要会议——自动程序修复研讨会（Workshop
  on Automated Program Repair）并担任了几次组织者。

