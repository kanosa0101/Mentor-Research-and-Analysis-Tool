bio_raw: '课题组主页：

  http://dna-storage.cn

  主要研究方向：

  DNA存储与计算、生物信息、DNA测序和智能先进制造等

  研究成果概况：

  张成，北京大学计算机学院，教授，博士生导师。

  以第一或通讯作者身份，在Nature，Nature Communications，Science Advances，JACS，Angew. Chem. Int.
  Ed.，IEEE TNB，中国科学，科学通报等期刊发表论文。作为负责人承担国家省部级科研项目，主持：国家青年科学基金A类项目（原国家杰出青年基金）、国家重点研发计划专项项目、XX信息装备专项、国家重点研发计划“政府间”国际合作专项、教育部联合基金、国家自然科学基金项目和北京市国际重点专项等。先后获教育部自然科学奖一等奖/二等奖；入选中科院创新交叉团队，及中国智能计算科技创新人物。担任中国计算机，自动化，人工智能等多个学会的生物信息专委会委员。

  代表性论文：（*通讯作者）

  1. Cheng Zhang*，Ranfeng Wu, Fajia Sun, Yisheng Lin, Yuan Liang, Jiongjiong Teng,
  Na Liu, Qi Ouyang*, Long Qian*, Hao Yan*. Parallel molecular data storage by printing
  epigenetic bits on DNA. Nature, 634, 824-832, 2024.

  2. Qian Ling，Bozhao Li, Yuhua Feng, Jing Yang*, Shian Wang*, Suping Li*, Cheng Zhang*,
  Conformation-programmed DNA computing, Science advances, 2026.

  3. Yongpeng Zhang, Bozhao Li, Xuan Liu, Xuedong Zheng, Shi Liu, Guangjun Nie, Jing
  Yang*, Yonggang Ke*, Suping Li*, Cheng Zhang*. DNA Computing Function Switching
  by Programming Base Stacking Interactions with Minimal Molecular Architecture Changes.
  Nature Communications, 2025.

  4. Liang Yuan, Qie Yunkai, Jing Yang, Wu Ranfeng, Cui Shuang, Zhao Yuliang, Greg
  J. Anderson, Guangjun Nie, Suping Li*, Cheng Zhang*. Programming conformational
  cooperativity to regulate allosteric protein-oligonucleotide signal transduction.
  Nature Communications, 2023.

  5. Cheng Zhang*, Xueying Ma, Xuedong Zheng, Yonggang Ke, Kuiting Chen, Dongsheng
  Liu, Zuhong Lu, Jing Yang*, Hao Yan*, Programmable Allosteric DNA Regulations for
  Molecular Networks and Nanomachines. Science advances, 2022.

  6. Jing Yang, Yuan Liang, Xiang Li, Yongpeng Zhang, Long Qian*, Yonggang Ke*, Cheng
  Zhang*, Spatially Programmable Enzymatic Nanorobot Arm to Modulate Anisotropic Gold
  Nanoparticle Assembly. Angewandte Chemie International Edition, 2023.

  7. Cheng Zhang*, Zhiyu Wang, Yan Liu, Jing Yang, Xinxin Zhang, Linqiang Pan, Yonggang
  Ke*, Hao Yan*. Nicking Assisted Reactant Recycle to Implement Entropy-Driven DNA
  Circuit. J. Am. Chem. Soc., 2019.

  8. Ranfeng Wu, Yongpeng Zhang, Jiongjiong Teng, Qiang Zhang*, Cheng Zhang*. Molecular
  Circuit-Controlled Nanoparticle Folders for Programmable DNA Information Access.
  ACS nano, 2025.

  9. Zhang Yongpeng, Chen Yiming, Liu Xuan, Ling Qian, Wu Ranfeng, Yang Jing*, Cheng
  Zhang*, Programmable Primer Switching for Regulating Enzymatic DNA Circuits. ACS
  nano, 2024.

  10. Ranfeng Wu, Yiming Chen, Yongpeng Zhang, Rongming Liu, Qiang Zhang*, Cheng Zhang*,
  Catalytic Gold Nanoparticle Assembly Programmed by DNAzyme Circuits. Small, 2024.'
