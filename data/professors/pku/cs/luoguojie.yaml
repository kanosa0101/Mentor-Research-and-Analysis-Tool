bio_raw: '个人主页：http://ceca.pku.edu.cn/guojie

  主要研究方向

  新型体系结构和设计自动化。包括：（1）可重构架构、近数据架构；（2）硬件代码分析与合成、硬件安全验证、软硬件容错；（3）面向深度学习等热点领域的定制加速器设计。

  科研/教育经历

  2005-2011，博士，洛杉矶加州大学

  2001-2005，学士，北京大学

  主要荣誉与获奖

  2017年和2023年 ASP-DAC十年最具影响力论文奖

  2016年 CCF-Intel青年学者提升计划奖

  2013年 ACM/SIGDA杰出博士论文奖

  研究成果概况

  罗国杰现任北京大学计算机学院长聘副教授、高能效计算与应用中心任执行主任。他于2005年获得北京大学计算机科学技术系理学学士学位，并分别于2008年和2011年获得美国洛杉矶加州大学UCLA）计算机科学系硕士和博士学位。他曾获2013年ACM/SIGDA杰出博士论文奖、2016年CCF-Intel青年学者提升计划奖、以及2017年和2023年ASP-DAC十年最具影响力论文奖。他目前的研究兴趣包括新型体系结构和设计自动化。他是ACM
  TODAES编辑委员会成员和CCF集成电路设计专委会常务委员。'
