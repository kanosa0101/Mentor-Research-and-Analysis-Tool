bio_raw: '个人主页：https://wangleye.github.io/

  主要研究方向

  群智感知与计算、时空数据挖掘、隐私保护

  科研/教育经历

  2024-至今

  ，

  长聘副教授（博导），北京大学

  2018-2024，助理教授（博导），北京大学

  2016-2018，博士后，香港科技大学

  2012-2016，博士，法国南巴黎电信学院/巴黎第六大学

  2009-2012，硕士，北京大学

  2005-2009，学士，北京大学

  研究成果概况

  王乐业，北京大学计算机学院长聘副教授、博雅青年学者，中国计算机学会普适计算专委会副秘书长，入选国家级青年人才计划。长期从事群智感知与计算研究（人工智能与普适计算的交叉研究方向），聚焦于群体泛在感知数据的智能化采集、建模、共享、安全防护等主题。发表国际会议、期刊论文100余篇，累计引用6900余次，被引100次以上论文20余篇。

  主要科研项目：

  1. 国家自然科学基金面上项目，61972008，城市计算中的跨城市群智知识迁移，2020/01-2023/12，60万元，主持

  Selected Publications

  2020年至今代表性论文

  期刊

  1. D. Chai, L. Wang, L. Yang, J. Zhang, K. Chen, Q. Yang. “A Survey for Federated
  Learning Evaluations: Goals and Measures”. IEEE Trans. Knowledge and Data Engineering,
  early access (2024).

  2. J. Zhu, L. Wang, X. Han, A. Liu, T. Xie. “Safety and Performance, Why Not Both?
  Bi-Objective Optimized Model Compression against Heterogeneous Attacks toward AI
  Software Deployment”. IEEE Trans. Software Engineering, 50(3): 376-390 (2024).

  3. X. Han, Y. Yang, L. Wang, J. Wu, “Privacy-Preserving Network Embedding against
  Private Link Inference Attacks”. IEEE Trans. Dependable and Secure Computing, 21(2):
  847-859 (2024).

  4. L. Wang, D. Chai, X. Liu, L. Chen, K. Chen. “Exploring the Generalizability of
  Spatio-Temporal Traffic Prediction: Meta-Modeling and an Analytic Framework”. IEEE
  Trans. Knowledge and Data Engineering, 35(4): 3870-3884 (2023).

  5. X. Han, L. Wang, W. Fan, “Is Hidden Safe? Location Protection against Machine-Learning
  Prediction Attacks in Social Networks”. MIS Quarterly, 45(2) (2021).

  6. L. Wang, D. Yang, X. Han, D. Zhang, X. Ma, “Mobile Crowdsourcing Task Allocation
  with Differential-and-Distortion Geo-Obfuscation”. IEEE Trans. Dependable and Secure
  Computing, 18(2): 967-981 (2021).

  7. D. Chai, L. Wang, K. Chen, Q. Yang, “Secure Federated Matrix Factorization”.
  IEEE Intelligent Systems, 36(5): 11-20 (2021).

  8. L. Wang, D. Zhang, D. Yang, B. Y. Lim, X. Han, X. Ma, “Sparse Mobile Crowdsensing
  with Differential and Distortion Location Privacy”. IEEE Trans. Information Forensics
  and Security, 15(1): 2735-2749 (2020).

  会议

  1. J. Zhu, J. Zha, D. Li, L. Wang, “A Unified Membership Inference Method for Visual
  Self-supervised Encoder via Part-aware Capability”. CCS 2024.

  2. L. Chen, J. Fang, T. Liu, S. Cao, L. Wang, “A Unified Model for Spatio-Temporal
  Prediction Queries with Arbitrary Modifiable Areal Units”. ICDE 2024.

  3. L. Chen, J. Fang, Z. Yu, Y. Tong, S. Cao, L. Wang, “A Data-driven Region Generation
  Framework for Spatiotemporal Transportation Service Management”. KDD 2023.

  4. C. Huang, L. Wang, X. Han, “Vertical Federated Knowledge Transfer via Representation
  Distillation for Healthcare Collaboration Networks”. WWW 2023.

  5. R. Ding, F. Rong, X. Han, L. Wang, “Cross-center Early Sepsis Recognition by
  Medical Knowledge Guided Collaborative Learning for Data-scarce Hospitals”. WWW
  2023.

  6. D. Chai, L. Wang, J. Zhang, L. Yang, S. Cai, K. Chen, Q. Yang, “Practical Lossless
  Federated Singular Vector Decomposition Over Billion-Scale Data”. KDD 2022.

  7. J. Zhu, L. Wang, X. Han, “Safety and Performance, Why not Both? Bi-Objective
  Optimized Model Compression toward AI Software Deployment”. ASE 2022.'
