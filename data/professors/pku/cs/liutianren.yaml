bio_raw: '个人主页：

  https://liutianren.com/

  简介

  刘天任博士，现任北京大学前沿计算研究中心助理教授，博士生导师，于2022年2月正式加入中心。他于2014年在清华大学交叉信息研究院（姚班）获学士学位，分别于2016年、2019年在麻省理工学院获硕士、博士学位。之后在华盛顿大学进行博士后研究。刘天任博士的研究领域为密码学。他的现有工作都围绕信息论密码学展开，同时涉及多方安全计算、格密码学、分块密码、复杂性等。他的代表性工作是关于秘密分享的系列成果。秘密分享是信息论密码学中的一个基本问题。他的研究成果推翻了领域内长久以来的猜想，解决了一个超过30年的开放问题，开启了一个研究方向。在密码学领域，已发表会议论文9篇，包括密码学顶级会议（Crypto
  和 Eurocrypt）4篇，理论计算机科学顶级会议（STOC）1篇，另有1篇单作者论文获得密码学一流会议TCC的最佳学生论文奖。未来他希望能进一步拓展到量子计算、后量子密码学、安全机器学习等领域。

