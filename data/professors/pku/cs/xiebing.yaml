bio_raw: '个人主页：

  主要研究方向

  软件工程、计算机理论科学和分布式系统等

  科研/教育经历

  1998，博士，国防科技大学

  主要荣誉与获奖

  2006年 国家科技进步二等奖（排名第3，“基于Internet、以构件库为核心的软件开发平台”）

  2009年 北京市科学技术奖技术发明类二等奖（排名第1，“青鸟软件质量保证支撑工具体系”）

  2012年 教育部高等学校科学技术进步一等奖（排名第1，“可信软件资源生产与共享环境Trustie-TSE”）

  2015年 国家技术发明二等奖（排名第2，“基于网络的软件开发群体化方法及核心技术”）

  研究成果概况

  谢冰，1970年生于湖南省。现任北京大学信息科学技术学院常务副院长，软件研究所所长，教授，国家杰出青年基金获得者，入选教育部新世纪优秀人才计划、北京市科技新星计划，获“中创软件人才奖”。

  作为课题负责人，先后承担了国家863计划、科技支撑计划、国家重点专项、北京市科委重点课题、国家自然科学基金委杰出青年基金等重点项目9项，参与973、863计划、基金重点等课题5项。在软件工程技术研发和国产软件工具研发与产业化方面做出了重要的贡献，主要成果在软件行业、信息服务业、国防军工领域、集成电路设计领域中广泛应用。在FSE、POPL等软件工程与程序语言领域顶级会议、主流会议和期刊上发表论文80余篇。学术兼职包括：中国软件行业协会理事、中国计算机学会高级会员，电子学报英文版编委。'
