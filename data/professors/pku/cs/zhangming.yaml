bio_raw: '个人主页：https://pkudlib.github.io/

  教育/科研经历

  张铭，北京大学计算机学院教授，博士生导师，教育部计算机课程教指委委员；

  ACM China

  常务理事，中国

  ACM

  教育专委会主席，

  ACM/IEEE IT2017

  信息技术课程指南执委，

  ACM/IEEE CC2020

  计算机学科规范领导小组成员，

  2013-2021

  任

  ACM

  全球教育指导委员会唯一的中国理事。自

  1984

  年考入北京大学，分别获得学士、硕士和博士学位。研究方向为招文本挖掘、图机器学习、教育大数据等，目前主持国家自然科学基金面上项目以及头部公司合作项目，进行前沿探索，解决实际问题并且重视科研成果的转化落地。合作发表科研学术论文

  300

  多篇（

  NeurIPS ICLR

  、

  ICML

  、

  KDD

  、

  WWW

  、

  ACL

  、

  AAAI

  、

  IJCAI

  等

  A

  类会议和

  TKDE

  、

  TOIS

  和

  Information Fusion

  等顶级期刊），获得机器学习顶级会议

  ICML 2014

  最佳论文奖

  、网络信息处理顶级会议

  WWW 2016

  最佳论文提名、数据挖掘顶级会议

  ICDM 2022

  最佳论文提名。连续入选

  “

  全球

  2000

  位最具影响力

  AI

  学者

  ”

  ，主要贡献为信息检索与推荐领域。

  发表了

  SIGCSE

  、

  L@S

  等教学研究论文，出版学术专著

  1

  部，获软件著作权

  8

  项，获发明专利

  6

  项。主编多部教材，其中《数据结构与算法》获北京市精品教材奖并得到国家

  “

  十二五

  ”

  规划教材支持。带领北大《数据结构与算法》团队，获评国家级和北京市级精品课程（

  2008

  ）、国家级精品资源共享课程（

  2016

  ）、首批国家级一流本科课程（线上和线上线下混合式，两门一流本科课程，

  2020

  ），都排名第一位。

  2021

  年荣获

  CCF

  杰出教育奖。

  张铭老师谷歌学术主页：

  https://scholar.google.com/citations?user=LbzoQBsAAAAJ

  主持在

  研项目

  1. 2023.11 – 2026.12,  多层次教育知识图谱构建、检索与推理，国家重点研发计划课题（社会治理与智慧社会科技支撑）

  2. 2023.1 – 2026.12，预训练图表示学习辅助的药物发现研究，国家自然科学基金

  3. 2023.10 – 2028.10，北大-安克具身智能联合实验室（任实验室主任），安克创新

  4. 2024.9 – 2025.9，低信噪比时序数据的可扩展流式计算表征学习（三期），正仁量化

  教学情况

  本科生课程 – 数据结构与算法，统计分析与商务智能，科技创新实践

  研究生课程 - 统计分析与商务智能，科技创新与创业

  主要荣誉和获奖

  2002年 北京大学2001-2002学年教学优秀奖

  2008年 “数据结构与算法”获得国家级和北京市级精品课程（排名一）

  2011年 《数据结构与算法》获得北京市优秀教材奖（排名一）

  2013年 北京大学“杨芙清-王阳元院士教师奖”优秀奖

  2014年 机器学习领域顶会ICML最佳论文奖

  2017年“普惠中拔尖”，获北京市高等教育教学成果一等奖（排名三）

  2020年“数据结构与算法”（线上）被评为国家级一流本科课程（排名一）

  2020年“数据结构与算法”（线上线下混合式）国家级一流本科课程（排名一）

