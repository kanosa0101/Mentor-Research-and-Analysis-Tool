bio_raw: '个人主页：http://sei.pku.edu.cn/~huanggang

  主要研究方向

  系统软件与自适应

  科研/教育经历

  2000-2003，博士，北京大学

  1997-2000，硕士，西北工业大学

  1993-1997，学士，西北工业大学

  主要荣誉与获奖

  2007年 国家技术发明二等奖（个人排名第三）

  2012年 国家自然科学二等奖（排名第二）

  2015年 高等学校科技进步一等奖（排名第一）

  多次国际会议最佳/优秀论文等荣誉

  研究成果概况

  黄罡，博士，教授，博导，湖南株洲人，国家杰出青年科学基金、国家优秀青年科学基金、中国青年科技奖、中国计算机学会青年科学家奖、教育部新世纪优秀人才、全国优秀博士学位论文获得者。

  长期从事系统软件领域的教学和科研工作，在中美自然科学基金联合研究、国家自然科学基金、863、核高基、欧盟第七框架等项目支持下，针对自适应软件的可变性、可达性和可用性问题，从复杂性建模与控制的视角，提出一套基础化、系统化、普适化的基于运行时体系结构的自适应软件模型与方法，在自适应软件计算反射原理、运行时模型驱动方法、自适应系统的软件定义方法等方面取得突破，研制的技术与系统在企业计算、云计算和大数据领域得到广泛应用。

  现任电子学会青年科学家俱乐部轮值主席、电子学会青年科学家云计算与大数据专委主任、中国计算机学会专委工委和青工委委员、IEEE商业信息化与系统技术委员会执行委员、ISO/JTC云计算国际标准专家组成员、中国新一代IT产业推进联盟技术委员会主任。曾任ACM/IFIP/USENIX
  Middleware大会指导委员会委员、以及Middleware、COMPSAC、SOSE等国际会议程序委员会主席或大会主席、Java国际标准专家组成员。'
