bio_raw: '个人主页：https://marapapman.github.io

  主要研究方向

  李锭主要研究程序分析和系统安全，其研究重点是利用动态与静态分析，结合机器学习的方法，检测软件中的缺陷和监控其运行时的异常。在动态分析方面，李锭主要研究通过系统日志分析和挖掘实现大规模计算机系统实时监控的方法；在静态分析方面，李锭主要研究符号执行等基础性技术以及其在程序优化等方面的应用。李锭发表论文共计30余篇，谷歌学术引用数超过1500

  工作经历

  2016 – 2020 研究员，美国NEC研究院

  2020 – 至今 助理教授，北京大学

  教育经历

  2011- 2016 博士，南加州大学

  2007 – 2011 学士，北京大学

  奖励

  2018 NEC优秀发明奖

  2017 NEC商业贡献奖

  2014 南加州大学维特比工程学院指导本科生科研奖

  Selected Publications

  You Are What You Do: Hunting Stealthy Malware via Data Provenance Analysis.

  Qi Wang, Wajih Ul Hassan, Ding Li*, Kangkook Jee*, Xiao Yu, Kexuan Zou, Junghwan
  Rhee, Zhengzhang Chen, Wei Cheng, Carl A. Gunter, Haifeng Chen

  NDSS 2020，*通讯作者

  NoDoze: Combatting Threat Alert Fatigue with Automated Provenance Triage

  Wajih Ul Hassan, Shengjian Guo, Ding Li*, Zhichun Li, Zhengzhang Chen, Kangkook
  Jee, Zhichun Li, and Adam Bates

  NDSS 2019. *通讯作者

  NodeMerge: Template Based Efficient Data Reduction For Big-Data Causality Analysis

  Yutao Tang, Ding Li*, Zhichun Li, Mu Zhang*, Kangkook Jee, Xusheng Xiao, Zhenyu
  Wu, Junghwan Rhee, Fengyuan Xu, and Qun Li

  CCS 2018. *通讯作者

  String Analysis for Java and Android Applications

