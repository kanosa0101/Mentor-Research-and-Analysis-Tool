bio_raw: '个人主页：www.pkuml.org

  教育背景

  北京大学教授，博士生导师。2005年于中国科学院计算技术研究所获工学博士学位。曾任中科院计算所助理研究员、美国明尼苏达大学访问教授。

  主要研究方向

  视频大数据分析处理、机器学习与类脑计算。

  主要科研项目及获奖成果

  累计主持国家重点研发计划项目、国家自然基金重点项目、863计划课题、北京市科技计划重大项目等国家与省部级项目20余项，发表学术论文150余篇，获欧洲信号处理学会JIVP期刊2015年度唯一最佳论文奖，拥有美/中国发明专利40项。基于在图像视频分析与处理领域的研究成果，获2010年国家科技进步二等奖（第6）、2017年国家技术发明二等奖（第2）、2015年中国电子学会技术发明一等奖（第1）、2009年教育部科技进步一等奖（第3）以及2016年中国专利优秀奖（第1）。

  主要学术任职

  目前，担任国际期刊IJMDEM的共同主编，任国际期刊IEEE TMM和Access编委，曾任IEEE ICME 2015、IEEE BigMM 2015、IEEE
  ISM 2015和IEEE MIPR 2018程序委员会共同主席，并任ACM MM 2009等十余个国际会议组委会成员，以及IEEE CVPR、ACM KDD、AAAI、ECCV等顶级国际会议程序委员会委员。他是中国工程院“人工智能2.0”规划专家委员会专家、北京市类脑计算专家组专家和全国研究生智慧城市技术与创意大赛专家委员会秘书长。他是IEEE、中国计算机和中国电子学会高级会员，ACM会员。'
