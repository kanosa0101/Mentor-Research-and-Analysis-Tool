bio_raw: '个人主页：https://idm.pku.edu.cn/info/1017/1035.htm

  教育背景

  2005年博士毕业于中国科学院计算技术研究所；

  2005年8月至2007年8月在美国南加州大学进行博士后研究，之后到北大工作至今。

  主要研究领域

  视频处与编码、视频传输等

  代表性学术论著

  1. Jing Cui, Shanshe Wang, Shiqi Wang, Xinfeng Zhang, Siwei Ma, Wen Gao: Hybrid
  Laplace Distribution-Based Low Complexity Rate-Distortion Optimized Quantization.
  IEEE Trans. Image Processing 26(8): 3802-3816 (2017)

  2. Songchao Tan, Siwei Ma, Shanshe Wang, Shiqi Wang, Wen Gao: Inter-View Dependency-Based
  Rate Control for 3D-HEVC. IEEE Trans. Circuits Syst. Video Techn. 27(2): 337-351
  (2017)

  3. Chen Zhao, Siwei Ma, Jian Zhang, Ruiqin Xiong, Wen Gao: Video Compressive Sensing
  Reconstruction via Reweighted Residual Sparsity. IEEE Trans. Circuits Syst. Video
  Techn. 27(6): 1182-1195 (2017)

  4. Siwei Ma, Xinfeng Zhang, Shiqi Wang, Jian Zhang, Huifang Sun, Wen Gao, "Entropy
  of Primitive: From Sparse Representation to Visual Information Evaluation," IEEE
  Trans. Circuits Syst. Video Techn. 27(2): 249-260 (2017)

  5. Xiang Zhang, Weisi Lin, Ruiqin Xiong, Xianming Liu, Siwei Ma, and Wen Gao, “Low-Rank
  Decomposition-Based Restoration of Compressed Images via Adaptive Noise Estimation,”
  IEEE Trans. Image Processing, vol. 25, pp. 4158–4171, 2016.

  6. Zhao Wang, Shiqi Wang, Jian Zhang, Siwei Ma: Adaptive Progressive Motion Vector
  Resolution Selection Based on Rate-Distortion Optimization. IEEE Trans. Image Processing
  26(1): 400-413 (2017)

  7. Siwei Ma, Xinfeng Zhang, Jian Zhang, Chuanmin Jia, Shiqi Wang, and Wen Gao, “Nonlocal
  In-Loop Filter: The Way Toward Next-Generation Video Coding?,” IEEE MultiMedia,
  vol. 23, pp. 16–26, 2016.

  8. Siwei Ma, Tiejun Huang, Cliff Reader, and Wen Gao, “AVS2 —— Making Video Coding
  Smarter,” IEEE Signal Processing Magazine, vol. 32, pp. 172–183, 2015.

  9. Siwei Ma, Shiqi Wang, and Wen Gao, “Low Complexity Adaptive View Synthesis Optimization
  in HEVC Based 3D Video Coding,” IEEE Trans. Multimedia, vol. 16, pp. 266–271, 2014.

  10. Siwei Ma, Shiqi Wang, Qin Yu, Junjun Si, and Wen Gao, “Mode Dependent Coding
  Tools for Video Coding,” J. Sel. Topics Signal Processing, vol. 7, pp. 990–1000,
  2013.

  主要科研项目

  1. 国家自然科学基金重点项目，基于内容分析的高效视频编码理论与方法，2017/01-2021/12，课题负责人

  2. 国家自然科学基金面上项目，基于结构信息特征的监控视频编码，2016/01-2019/12，课题负责人

  3. 中组部拔尖人才，监控视频结构化表达与智能编码，2016/01-2018/12，课题负责人

  4. 863计划重点，真三维视频紧凑表示和高效压缩，2015/01-2017/12，课题负责人

  5. 国家自然科学基金优青项目，视频编码，2014/01-2016/12，课题负责人

  6. 863计划重点，面向立体电视的3D内容生产和服务系统，2013/01-2015/12，课题负责人

  7. 国家科技支撑计划重点项目，基于AVS的3D电视实时编解码系统研制与应用示范，2011/1-2013/06，课题负责人

  主要获奖成果

  1. 数字视频编解码技术国家标准AVS与产业化应用，国家科技进步二等奖，2012年，第五完成人

  2. 高效数字视频编解码技术及其在国际标准与国家标准中的应用，国家技术发明二等奖，2006年，第5完成人

  主要学术任职

  1. IEEE Transactions on Circuits and System for Video Technology (TCSVT) Associate
  Editor

  2. Journal of Visual Communication and Representation(JVCIR) Associate Editor

  3. 中国图象图形学学会第七届理事

  4. AVS视频组联合组长'
