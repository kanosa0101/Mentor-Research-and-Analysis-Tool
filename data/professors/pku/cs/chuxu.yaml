bio_raw: '个人主页： chuxu.net.cn

  初旭博士，现任北京大学前沿计算研究中心助理研究员，于2024年8月正式加入中心。他于2014年、2016年和2021 年分别在中国科学技术大学、纽约州立大学和北京大学获学士、硕士和博士学位，之后在清华大学计算机科学与技术系进行博士后研究。研究兴趣包括面向不同模态数据的预训练模型的泛化与适配的理论、技术与应用系统。截至2024年8月，初旭博士在机器学习和数据挖掘领域国内外顶级会议及期刊发表论文三十余篇。加入中心后，初旭博士进入算法博弈论实验室，该实验室的研究方向为算法博弈论、互联网和区块链经济学、多智能体及强化深度学习理论。科研兴趣聚焦在人和智能体在互联网、物联网和区块链交互环境下多方博弈的理论与方法论建立，包括数据信息的认识论刻画、均衡和动力学分析、计算复杂性和算法设计。'
