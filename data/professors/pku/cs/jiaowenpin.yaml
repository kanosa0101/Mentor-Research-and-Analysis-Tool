bio_raw: '个人主页：www.sei.pku.edu.cn/~jwp

  主要研究方向

  软件工程方法学、自适应软件、多agent系统、软件形式化方法

  科研/教育经历

  2000.8-2002.9，博士后，加拿大维多利亚大学

  1997.9-2000.7，博士，中国科学院软件研究所

  1994.9-1997.7，硕士，华东理工大学

  1987.9-1991.7，学士，华东理工大学

  主要科研项目

  1. 国家“973”计划项目子课题：持续演进的自适应网购软件模型、方法及服务质量保障，2015.1-2019.8

  2. 国家“863”计划项目：基于自主构件的自适应网构软件的自动化集成技术，2009.1-2010.12

  3. 国家自然科学基金：基于自主构件的开放分布式自适应软件系统的开发方法，2011.1-2013.12

  4. 国家自然科学基金：基于自主构件协同的软件自动化集成技术，2008.1-2010.12

  5. 国家自然科学基金：基于组织的Agent开发理论和方法及其在基于构件的软件工程中的运用，2004.1-2006.12

  Selected Publications

  1. Wenpin Jiao, Yanchun Sun. Self-adaptation of multi-agent systems in dynamic environments
  based on experience exchanges, Journal of Systems and Software, Volume 122, December
  2016, Pages 165–179.

  2. Wenpin Jiao, Yanchun Sun. Supporting Adaptation of Decentralized Software based
  on Application Scenarios, Journal of Systems and Software, Volume 86, Issue 7, July
  2013, Pages 1891–1906.

  3. Wenpin Jiao. Using Autonomous Components to Improve Runtime Qualities of Software.
  IET Software, Vol.5, Issue 1, pages 1-20, February 2011.

  4. Wenpin Jiao, Yunchun Sun, Hong Mei, Automated Assembly of Internet-Scale Software
  Systems Involving Autonomous Agents, Journal of Systems and Software, 83(2010) pp.1838-1850.

  5. Wenpin Jiao. Multiagent Cooperation via Reasoning about the Behavior of Others.
  Computational Intelligence. Volume 26 Issue 1, Pages 57 - 83, February 2010.'
