bio_raw: '个人主页：http://www.sei.pku.edu.cn/people/zouyz

  主要研究方向

  软件工程、软件复用、软件数据挖掘

  科研/教育经历

  2004-2010，博士，北京大学

  1999-2002，硕士，吉林大学

  主要荣誉与获奖

  2013年 教育部科技进步一等奖

  研究成果概况

  2002年于吉林大学计算机系获硕士学位，同年7月开始在北京大学信息科学技术学院任教。2004年9月年开始攻读北京大学计算机软件与理论专业博士学位，师从梅宏院士，2010年1月毕业。目前已在国内外期刊、国际会议上发表学术论文30余篇，曾主持国家自然科学基金（青年基金）项目“软件构件自动标签及应用技术研究”和总装备部“二十七基地任务软件构件库建设”等4个项目，参与国家重点研发计划“基于大数据的软件智能开发方法和环境”、863计划“网构化软件生产、构造和复用技术与工具”等6个国家级项目。参与完成的“基于Internet、以构件库为核心的软件开发平台”获得2006年度国家科学技术进步二等奖。其中，软件资源库管理系统JBCLMS是本项目组的主要成果，已在国内多家软件园区和多家大型企业得到应用。'
