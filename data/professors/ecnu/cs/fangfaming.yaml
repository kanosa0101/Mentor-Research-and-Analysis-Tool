bio_raw: '方发明，博士，华东师范大学计算机科学与技术学院视觉与机器智能研究所副所长、教授、博士生导师，上海市“

  晨光学者

  ”

  ,

  上海市“

  启明星

  ”计划获得者。

  2013

  年

  6

  月于华东师范大学计算机系获工学博士学位。博士毕业论文被评为“华东师范大学优秀学位论文”以及“上海市优秀学位论文”。

  2013

  年

  7

  月起，加入华东师范大学计算机系。

  主要研究方向为机器学习、图像处理。围绕遥感

  /

  医学图像恢复、增强、识别、以及三维重建等展开理论和应用研究。工作受到国家自然科学基金重点、面上、

  NSFC-RGC

  、上海市“晨光计划”、上海市自然科学基金等

  8

  项纵向基金支持；并主持多项企事业单位联合项目。相关成果发表在国际顶级杂志

  /

  会议上

  (

  共

  50

  余篇，第一通讯作者

  33

  篇，中科院

  1

  区

  /CCFA 24

  篇，发表期刊会议主要包括：

  IEEE TIP

  、

  TNNLS

  、

  TMM

  、

  TGRS

  、

  TVCG

  、

  TCSVT

  、

  NeurIPS

  、

  CVPR

  、

  ICCV

  、

  ECCV

  等）。担任

  Frontiers in Plant Science

  副主编（

  Associate Editor

  ），担任多个

  A

  类会议（

  CVPR

  、

  ICCV

  等）程序委员会委员，担任

  10

  多个国际顶级期刊（

  IEEE TIP

  、

  TMM

  、

  TVCG

  等）审稿人，获

  2021

  年度

  IEEE TMM

  最佳审稿人奖

  (best reviewer award)

  。培养的博士生

  /

  研究生在多项国际顶级赛事中获奖。毕业生去向包括微软、商汤等知名

  AI

  企业，以及国内外知名高校。

