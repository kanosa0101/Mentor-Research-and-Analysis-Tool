  研究方向

  课题组长期致力于网络与智能计算系统的理论研究与应用实践，研究工作从早期的云-网融合与分布式计算逐步拓展到分布式智能计算与可信人工智能系统，面向行业应用需求，围绕系统支撑、智能计算、安全可信等问题持续开展研究，包括：

  可扩展分布式系统与网络（Scalable Distributed Systems and Networking）

  ：

  研究面向大规模智能计算的分布式系统架构与网络协同机制，包括系统优化、云-边-端协同、SDN/数据中心/内容中心网络、网络-计算协同优化等，目标是构建高效、可扩展的智能计算基础设施，为智能应用提供系统支撑。

  分布式机器学习与边缘智能（Distributed Machine Learning and Edge Intelligence）

  ：研究分布式/去中心化学习算法与系统，包括联邦学习、通信与隐私优化、跨设备协同智能、在线社交网络信息传播建模与影响力最大化等，旨在推动智能计算的分布式与边缘化演进，支撑群体智能与网络行为分析。

  可信与安全人工智能系统（Trustworthy and Secure AI Systems）

  ：研究人工智能系统的鲁棒性、安全性与可信性，包括对抗鲁棒性与防御、隐私泄露与数据重建防护、推荐与生成模型的可信治理、社交平台中的虚假信息检测与传播控制等，目标是构建可解释、可验证、可治理的下一代安全可信AI系统。

  智能物联网与数据分析（Intelligent IoT and Data Analytics）

  ：研究物联网与数据智能在社会计算与行业应用中的融合，包括多源数据融合、群体行为建模、智慧健康、智慧城市治理与数据驱动决策支持等，旨在提升物联网系统在复杂社会环境中的自主感知、分析与决策能力。

  招生信息

  ：

  每年计划招收博士研究生1-2名左右（学术学位博士：计算机应用技术；专业学位博士：智能教育、人工智能）、全日制硕士研究生（学硕：计算机科学与技术；专硕：计算机技术）2-3名、非全日制硕士研究生（专硕：计算机技术）3-4名，欢迎有志于科学研究和技术研发，在上述方向领域兴趣浓、基础好、能力强的优秀学生联系推免或报考！请附上个人基本信息、教育与学习经历、学术研究/科创竞赛/科研实践/项目开发等方面较为详细的介绍材料，以及其它能表明个人成绩或专业技能的材料，发送至：

  xlhuang AT cs.ecnu.edu.cn

  。

  专业背景要求：计算机、数学、信息、通信类及相关专业。课题组研究项目丰富、经费充足，

  能够为学生提供优越的学习科研条件和发展平台。课题组同时欢迎有科研兴趣的优秀本科生到实验室开展科创项目与毕业设计！联系方式同上。

