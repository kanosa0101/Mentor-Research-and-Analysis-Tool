  个人简介

  黄新力，现任华东师范大学计算机科学与技术学院教授、博士生导师，研究兴趣集中在网络与智能计算系统领域，目前的研究工作涉及可扩展分布式系统与网络、分布式机器学习与边缘智能、可信与安全人工智能系统、智能物联网与数据分析等方向。

  2007年4月毕业于上海交通大学计算机科学与工程系，获计算机系统结构专业工学博士学位；2007年7月起至今在华东师范大学计算机科学技术系、计算机科学与技术学院从事教学和科研工作，先后受聘讲师、副教授、教授、博士生导师；2011年受国家留学基金委资助，公派访学美国德克萨斯大学-圣安东尼奥分校（UTSA）计算机科学系。

  以第一/通讯作者在国内外期刊和会议上发表学术论文50余篇，申请/授权技术发明专利10余项，登记软件著作权10余项；任TPDS、TMC、TON、TKDE、TKDD、IPM、中国科学、计算机学报、软件学报等学术期刊审稿人，科技部/教育部/上海市等基金项目、人才计划与科技奖励评审专家。

  主持国家重点研发计划“物联网与智慧城市关键技术及示范”重点专项、国家自然科学基金、教育部博士点基金、上海市“物联网与智慧城市”重大专项、上海市“科技创新行动计划”高新技术领域重大专项、上海市“科技创新行动计划”信息技术领域重点专项、上海市“人工智能创新发展”重点专项及企事业单位委托科研项目课题10余项；参与国家重点研发计划基础前沿类重点专项、国家自然科学基金重大国际（地区）合作研究项目、国家高技术研究发展计划“网格计算”重大专项、上海市基础研究重大项目、上海市科技攻关重大专项、华东师范大学“幸福之花”先导研究基金“智能+”领域重点专项等重要项目课题多项。

  长期参与上海市

  “新型城域物联专网”、

  “新型智慧城市”和“城市数字化转型”规划建设，参与上海市“城市运行数字体征系统”规划设计（1.0版已发布，中国首个，见官网报道），参与上海市“一网统管”数字化转型技术体系和赋能平台建设，参与“上海感知试验场”和“上海大数据试验场”规划建设；作为署名起草人，制定/修订上海市《新型城域物联专网建设导则》、

  《新型城域物联专网综合测评导则》、

  《新型城域物联感知基础设施建设导则》（经上海市人民政府批准，已正式发布实施，见市政府官网）；

  作为署名起草人，制定上海市通信制造业行业协会《移动通信用户感知度测评规范》团体标准T/SHCIA000001-2020、上海市物联网行业协会《非机动车棚物联网数据采集与管理》团体标准T/SIOT025-2021（均已正式颁布实施）；

  致力解决新型城域物联专网/物联感知基础设施“怎么建、怎么测、怎么用”重大难题，荣获“个人杰出贡献奖”（高校唯一奖项），项目研究成果获科技部推荐选送，参加国家“十三五”重大科技成果展（物联网与智慧成绩领域全国仅5项）。2023年5月，“面向城市安全治理的物联网关键技术及应用”项目成果获上海市科学技术奖“技术发明”一等奖。

