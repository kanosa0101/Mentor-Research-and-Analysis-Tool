research_direction_raw: 课题组长期致力于 网络与智能计算系统（Networking and Intelligent Computing Systems）
  的基础理论、关键技术与应用研究，研究工作从云网融合与分布式计算拓展至分布式智能计算、边缘智能与可信人工智能，重点关注系统架构、智能计算、安全可信等关键问题，包括：
  可扩展分布式系统与网络（Scalable Distributed Systems and Networking） ： 研究面向大规模智能计算的分布式系统架构与网络协同机制，包括系统优化、云边端协同、软件定义网络（SDN）、数据中心网络、网络与计算协同优化等，构建高效、可扩展的智能计算基础设施。
  分布式机器学习与边缘智能（Distributed Machine Learning and Edge Intelligence） ：研究分布式与去中心化学习算法及系统，包括联邦学习、通信效率优化、隐私保护及跨设备协同智能等，提升分布式学习与边缘智能系统的计算效率、隐私保护水平和协同能力。
  可信与安全人工智能系统（Trustworthy and Secure AI Systems） ：研究人工智能系统的鲁棒性、安全性与可信性，包括对抗防御、模型隐私与数据重建攻击防护、推荐与生成模型的可信治理、虚假信息检测与传播控制等，构建可解释、可验证、可治理的安全可信AI系统。
  智能物联网与数据分析（Intelligent IoT and Data Analytics） ：研究智能物联网与数据分析在社会计算及行业应用中的融合，包括多源数据融合、群体行为与信息传播建模、影响力最大化、智慧健康、智慧城市治理及数据驱动决策支持等，提升复杂应用场景中的智能感知、分析与决策支持能力
