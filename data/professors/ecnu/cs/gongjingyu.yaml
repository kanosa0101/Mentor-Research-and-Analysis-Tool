bio_raw: '主要研究方向为计算机三维视觉、计算机图形学，围绕三维场景重建、感知、理解以及数字人物建模与驱动等问题开展技术探索。

  研究成果在计算机视觉等领域国际顶会顶刊（CVPR

  、ECCV

  、

  AAAI

  、

  IJCAI、TPAMI、TVCG

  ）发表论文二十余篇，担任CVPR、ICCV、ECCV、TVCG等审稿人。

  个人主页：https://jingyugong.github.io

  团队长期招收硕士生和博士生，也期待对三维视觉和图形学感兴趣的同学参与科研，欢迎感兴趣的同学邮件咨询。

  社会兼职

  审稿人：

  IEEE/CVF Conference on Computer Vision and Pattern Recognition (CVPR) 审稿人

  European Conference on Computer Vision (ECCV) 审稿人

  International Conference on Computer Vision (ICCV)  审稿人

  IEEE Transactions on Visualization and Computer Graphics (TVCG)  审稿人

  研究方向

  计算机三维视觉、图形学

  三维场景重建与理解、人物建模与角色动画

  招生与培养

  团队长期招收硕士生和博士生，研究方向参考：

  https://jingyugong.github.io/

  开授课程'
