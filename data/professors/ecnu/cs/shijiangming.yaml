bio_raw: '施江鸣，博士，华东师范大学计算机科学与技术学院讲师（晨晖学者）。2026年毕业于厦门大学，为上海创智学院首届全时培养毕业生，入选首届中国科协青年人才托举工程博士生专项。主要研究方向为空间智能大模型、鲁棒多模态学习与全天候视觉感知。在
  NeurIPS、ICCV、ECCV、AAAI 等国际顶级会议和期刊以第一作者发表论文10余篇，主导具身多模态感知与导航探索平台的研发。曾获中国自动化学会推荐A类会议
  CCHI 最佳论文奖、厦门大学优秀毕业生等荣誉。长期担任 NeurIPS、ICLR、ICML、CVPR、ICCV、ECCV、AAAI、ACM MM 等国际会议审稿人，以及
  PR、TIP、TIFS、TMM、TCSVT、TNNLS 等国际期刊审稿人。

  社会兼职

  研究方向

  招生与培养

  开授课程'
