bio_raw: '卢兴见，男，1986年1月生，计算机专业博士，中共党员，华东师范大学计算机科学与技术学院，副教授。2009年7月本科毕业于西安电子科技大学，2013年加拿大麦吉尔大学访问博士，2014年12月博士毕业于浙江大学，2015年1月至2019年10月在华东理工大学计算机系工作，长期专注于大数据、智能计算与优化技术方面的研究工作，发表SCI、EI高水平论文30余篇，获得国家发明专利5项，主持国家、省部级、企业等科研项目6项，作为科研骨干参与重点研发计划、核高基重大专项、科技支撑计划等多项国家项目。

