bio_raw: '吴雯博士，

  华东师范大学计算机科学与技术学院院长助理，

  副教授、明园晨晖学者、博士生导师。博士毕业于香港浸会大学计算机科学系，华师大计算机学院在职博士后（合作导师贺樑教授），曾任浸会大学高级研究助理。

  主要研究兴趣聚焦于心理学、教育学、人工智能等学科交叉，包括但不局限于基于元认知的智能启发式提问、大模型安全与价值观对齐、基于性格和情绪的个性化推荐、群体智能决策等。

  主持国家重大专项课题、国家自然科学基金面上项目与青年项目、上海市科委科技创新项目课题、上海市博士后创新基地项目等，并与宝山区教育局、上海市教育科学研究院、上海开放大学、英语流利说、阿利昂斯等企事业单位开展产学研合作。

  至今已经在相关领域顶级、知名国际期刊与会议一作或通讯发表论文逾30篇，包括AAAI, KBS, ASOC, TAFFC, ESWA, UMUAI, INS, IJHCI,
  CHI, IUI, DASFAA, UMAP等，并且以一作身份获得SCI国际期刊UMUAI最佳期刊论文奖（2018）和UMAP国际会议最佳学生论文奖（2015）。以第一发明人身份已授权发明专利12项。担任KBS，IPM，NeuroComputing，IUI，UMAP等国际期刊和会议审稿人。CCF协同计算委员会执委，心理学+人工智能专委会委员，中国社会心理学会廉政心理研究专委会委员，ACM、AAAI等协会会员。

  欢迎更多热爱创新、有交叉学科研究背景的有志之士加入团队，一起开出交叉研究的幸福之花！

  >Please refer to my homepage for details in English

  http://wenwu198810.wixsite.com/carriewu

  社会兼职

  研究方向

  > 聚焦人工智能、心理学、教育学等多学科交叉

  > 涉及深度学习、用户建模、人机交互、数据挖掘、推荐系统、性格心理学、认知与元认知、统计学、群体博弈等知识

  > 具体研究内容包括但不仅限于

  基于元认知的启发式提问、基于多智能体的大模型安全与价值观对齐、基于性格和情绪的个性化推荐、群体智能决策等

