bio_raw: '华东师范大学计算机学院教授，博士生导师

  毕业于宾夕法尼亚州立大学计算机科学与工程系，获得博士学位。曾工作于美国能源部劳伦斯·伯克利国家实验室，雅虎实验室，微软搜索技术中心。研究方向为人工智能、数据挖掘、机器学习、自然语言处理（垂直领域大模型）、智慧教育等。在国际性学术会议和期刊如ICML,NIPS,KDD,ICDM,CIKM,WWW,ACL,COLING,WMNLP,
  TKDE,TNNLS,等发表论文

  90

  余篇，单篇论文的最高引用率超过

  1000

  余次

  (Google Index)

  ，以及多篇引用率超过

  500

  余次的论文。担任多个国际顶级学术会议和期刊如

  KDD

  ，

  WWW

  ，

  CIKM

  ，

  ICDM

  ，

  TKDE

  ，

  KIS

  ，

  TNNLS

  等的程序委员会委员或审稿人。

  国家重点研发计划“大数据知识工程”华师大课题技术负责人（已结题），国家科技部科技创新2030“新一代人工智能”重大项目“

  数字货币风险分析和可信防控技术研究及示范应用”项目负责人（在研）。

  社会兼职

  在KDD，ICDM等多个国际性学术会议担任程序委员会委员，并担任TKDE，KAIS等期刊的guest reviewer

  研究方向

  人工智能

  机器学习

  自然语言处理

  智慧教育

  招生与培养

  招收有志在人工智能领域从事研发的硕士生和博士生，特别是（不限于）以下领域：自然语言处理，特别是大模型相关技术：模型编辑、大模型幻觉、推理、强化学习等；智慧教育；（金融风险防控相关的）因果推断和知识图谱。

  开授课程'
