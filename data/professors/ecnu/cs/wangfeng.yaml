bio_raw: '王峰，博士，副教授。

  2001年复旦大学计算机系获得学士学位

  ，2006年香港科技大学计算机科学与工程系

  获得博士学位。2007-2009年分别在香港城市大学和Institute Eurecom进行博士后研究。2010年加入华东师范大学计算机科学与技术学院。

  社会兼职

  研究方向

  机器视觉；

  多媒体信息处理；

  医学图像分析；

  智能交通；

  模式识别。

  招生与培养

  开授课程

  本科：

  程序设计，

  程序设计原理与C语言；

  研究生：

  多媒体信息检索。'
