bio_raw: '江波，华东师范大学上海智能教育研究院

  教授、博导、

  副院长。华东师范大学国家智能社会治理（教育）特色实验基地负责人。

  2014

  年毕业于浙江大学控制系。

  研究兴趣包括教育大模型、自适应学习技术、中小学人工智能教育等。主持国家自然科学基金项目

  3

  项、省部级项目

  2

  项；作为核心成员参与国家社科基金重大项目、国家社科基金重点项目、自然科学基金项目共计

  8

  项。

  在

  IEEE TLT

  、

  ETRD

  、

  ILE、KDD、AAAI、AIED

  等国内外

  期刊会议发表论文

  50

  余篇。担任

  多部 SCI和

  SSCI

  期刊

  编委会成员

  。担任亚太计算机教育学会（

  APSCE

  ）执行委员。担任

  GCCCE2023

  程序委员会主席、ICCE2025程序委员会主席。获得

  2021

  年度

  APSCE

  Early Career Research Award

  。

  社会兼职

  Asia-Pacific Society on Computers in Education

  （

  APSCE

  ）, EC Member（

  2018-2021,2022-2025

  ）

  IEEE Transactions on Learning Technologies, Associate Editor (2020-2022)

  International Journal of Computing Science and Mathematics, Associate Editor

  （

  2016-2018

  ）

  Research and Practice on Technology Enhanced Learning, Editoral Board Member(2022-2025)

  第27届全球华人计算机教育应用大会（GCCCE 2023）议程委员会主席

  The 33rd International Conference on Computers in Education (ICCE 2025), Program
  Committee Chair

  研究领域

  1. 自适应学习技术

  2. 学习分析

  3. 中小学编程与人工智能教育

  课题组常年招收博士后、博士生（计算机—智能教育方向）、硕士生（计算机、教育技术）。

  欢迎有计算机、自动化、教育技术、课程教学论等学科背景的优秀学子报考。

  联系方式：bjiang@deit.ecnu.edu.cn

  招生与培养

  开授课程

  1.

  本科生课程：

  专业基础课：《数据结构》、《数据库系统原理》、《计算机网络原理》、《中小学编程教育》、《人工智能导论》

  专业选修课：《数据挖掘》、《

  Python

  编程基础》

  2.

  研究生课程：

  专业必修课：《智能教育与个性化学习》、《专业英语》、《现代教育技术特色课程》

  专业选修课：《教育数据挖掘与学习分析》、《教育技术研究前沿》'
