bio_raw: '个人简介

  江波，华东师范大学上海智能教育研究院

  教授、博导、

  副院长。华东师范大学国家智能社会治理（教育）特色实验基地负责人。

  2014

  年毕业于浙江大学控制系。

  研究兴趣包括教育大模型、自适应学习技术、中小学人工智能教育等。主持国家自然科学基金项目

  3

  项、省部级项目

  2

  项；作为核心成员参与国家社科基金重大项目、国家社科基金重点项目、自然科学基金项目共计

  8

  项。

  在

  IEEE TLT

  、

  ETRD

  、

  ILE、KDD、AAAI、AIED

  等国内外

  期刊会议发表论文

  50

  余篇。担任

  多部 SCI和

  SSCI

  期刊

  编委会成员

  。担任亚太计算机教育学会（

  APSCE

  ）执行委员。担任

  GCCCE2023

  程序委员会主席、ICCE2025程序委员会主席。获得

  2021

  年度

  APSCE

  Early Career Research Award

  。'
