bio_raw: '李老师与中国科学技术大学、

  中科院、

  香港城市大学、美

  国加州大学洛杉矶分校等海内外研究机构长期保持着学术交流，并与华为、腾讯、阿里巴巴、OPPO等科技企业有密切的校企合作。李老师的研究方向为业界稀缺，毕业生在收获扎实知识的同时避免了就业的严重内卷。团队学生可获得更多高校间、校企间学习交流和实习机会。学生在读期间已先后获得腾讯、阿里巴巴、华为、OPPO、上海电视台的实习机会，成长迅速，部分学生成果荣

  获上海市优秀毕业生和校优秀毕业生称号。

  社会兼职

  软硬件协同设计与应用教育部工程研究中心成员

  中共安徽省人民政府国有资产监督管理委员会（国资委）专家组成员

  中国计算机学会嵌入式系统专委会执委

  中国计算机学会软件系统专委会委员

  系统软件领域顶会OSDI和ATC评审委员会委员

  Applied Science、

  Springer Nature、

  TSC、TCAD、TC等期刊编辑/审稿人

  国际跆拳道联盟会员，ITF黑带一段

  研究方向

  招生与培养

  开授课程'
