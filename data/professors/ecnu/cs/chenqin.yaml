bio_raw: '陈琴，华东师范大学计算机科学与技术学院教授、博士生导师，现任上海市计算机学会自然语言处理专委会秘书长、中国中文信息学会青年工作委员会委员。主要研究方向为自然语言处理，目前致力于大模型可信生成与安全对齐，以及大模型在教育、心理等垂直领域的技术研究和应用。作为项目主要负责人之一，带领团队研发了教育大模型EduChat和小花狮

  心理辅导机器人

  ，获得2024年度上海开源创新卓越成果奖特等奖，并受到联合国教科文组织、Nature科普专栏和解放日报等多个国内外知名机构/媒体关注。在相关领域国际重要会议和期刊发表论文多篇，主持科技部新一代人工智能国家科技重大专项课题、国家自然科学基金面上和青年项目、上海市科委人工智能科技支撑专项等科研项目多项，获得2023年度上海市技术发明奖一等奖。常年担任本领域国际重要会议如ACL、EMNLP的Area
  Chair以及相关期刊审稿人。

  社会兼职

  - 上海市计算机学会自然语言处理专委会秘书长

  - 中国中文信息学会青年工作委员会委员

  - 常年担任ACL、

  EMNLP、

  AAAI、IJCAI、

  SIGIR等国际知名会议以及相关

  期刊的审稿人

  研究领域

  研究领域：自然语言处理、大模型、多模态融合

  具体方向涉及大模型可信生成（幻觉检测、检索增强、模型编辑）、安全对齐（攻击和防御）、心理健康计算（心理测评与疏导）等

  招生与培养

  毕业学生去向：

  硕士研究生：

  26年：殷江灏（字节跳动，人才计划），叶林浩（同花顺）

  25年：顾轶洋（携程），李雍（科大讯飞），陈可迪（本校读博）

  24年：雷智凯（上海AI lab），郑仁杰（公务员），张白岩（和团队老师联培，携程）

  23年：林家驹（和团队老师联培，pennsylvania state university，读博）

  博士研究生：

  26年：余朗（上海AI lab），但宇豪（华为）

  开授课程

  本科必修 《人工智能》'
