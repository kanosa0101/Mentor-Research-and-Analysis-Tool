bio_raw: '林绍辉，目前是华东师范大学计算机科学与计算学院教授（博导）、紫江青年学者、“闽江学者”讲座教授，上海市杨帆计划获得者。博士毕业于厦门大学，

  新加坡国立大学博士后

  。目前主要研究方向有大模型压缩、高效图像复原与生成、Agent、AI4S。在国际顶级期刊和会议，如

  TPAMI

  、

  TIP

  、

  ICML

  、

  CVPR

  、

  AAAI

  等

  CCF A

  及

  Trans

  上，以第一作者

  /

  通讯身份发表四十余篇论文。单篇一作谷歌最高引用超近千次，谷歌总引用73

  00

  余次。

  主持国自然面上、青年基金、重大项目子课题、上海市扬帆计划人才项目

  、华为校企合作项目

  等横纵向课题

  20

  余

  项。担任国际人工智能顶级会议

  CVPR

  、

  ICML

  、

  ICLR

  等领域主席；

  IEEE

  模型表示、压缩、分发和管理标准工作组（

  NO.IEEE 2941-2021

  ）重要组织成员。获

  IEEE

  标准突出贡献奖、中国人工智能学会优秀博士学位论文提名奖、福建省优秀博士学位论文奖等奖励。

  研究成果

  应用于华为

  Mate

  、

  Pura

  等系列手机闪拍、长焦功能

  。

  个人主页：

  https://

  sites.google.com/site/shaohuilin007'
