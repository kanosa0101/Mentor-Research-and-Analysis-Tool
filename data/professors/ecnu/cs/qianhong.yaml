bio_raw: '社会兼职

  - 中国计算机学会人工智能与模式识别专委会执行委员，中国人工智能学会机器学习专委会通讯委员

  - 中国计算机学会人工智能与模式识别专委会多智能体系统学组执行委员

  -

  中国计算机学会（CCF）会员，中国人工智能学会（CAAI）会员，

  中国图象图形学学会（CSIG）

  会员，ACM会员

  - IEEE CIS Shanghai Chapter常务秘书

  - FCS期刊预备青年编委

  - 担任

  ICML，NeurIPS，ICLR，

  AAAI，IJCAI，

  KDD，ECAI，GECCO，ACML，ICPR，PRICAI，PAKDD，IEEE CEC等国际学术会议高级程序委员会委员（SPC）或程序委员会委员（PC）

  - 担任

  IEEE Transactions on Evolutionary Computation

  ，IEEE Transactions on Pattern Analysis and Machine Intelligence，

  IEEE Transactions on Learning Technologies，Journal of Global Optimization，Swarm
  and Evolutionary Computation，SCIENCE CHINA Information Sciences，Frontiers of Computer
  Science，

  Machine Intelligence Research，

  Fundamental Research，

  《中国科学：信息科学》，《计算机学报》，《软件学报》，《自动化学报》，《计算机研究与发展》等国内外重要学术期刊审稿人

  - 上海市“英才计划”导师组成员

  - 华东师范大学教育学部“佛年教育学创新人才培育计划”（简称“佛年计划”）导师组成员

  研究方向

  My research interests include machine learning, optimization,

  and their application to

  intelligent education

  . Especially, I am interested in

  - derivative-free optimization (e.g., evolutionary optimization, Bayesian optimization)
  for non-convex problems with theoretical guarantees

  - evolutionary machine learning

  - learning and optimization based decision-making for

  intelligent

  education

  - reinforcement learning and multi-armed bandit

  招生与培养

  开授课程

  -

  线性代数，2024年春季、秋季学期，计算机科学与技术专业本科生学科基础必修课程。

  - 线性代数，2023年春季学期，

  计算机科学与技术专业

  本科生学科基础必修课程。

  - 线性代数，2022年春季学期，

  计算机科学与技术专业

  本科生学科基础必修课程。

  - 青年教师助教：2021年春季学期，人工智能，本科生必修课程，任课教师为

  周爱民教授

  。

  考评等级：优秀'
