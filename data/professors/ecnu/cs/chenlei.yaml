  个人简介

  陈蕾博士，副教授，硕士生导师，曾任华东师范大学计算机科学与技术学院副院长兼

  计算机实验教学示范中心主任

  ，

  分管本科教学与人才培养

  。承担的课程主要包括《存储技术基础》、《通信基础》、《数字逻辑》、《web技术》、《高级计算机网络》、《工程伦理》、《无线宽带技术》、《无线网络与移动计算》等。

  研究方向为

  网络与智能系统，

  近年来的研究兴趣主要涉及大数据网络与存储架构、下一代网络融合性部署与接入、未来异构网体系结构、室内无线定位方案等。主持的项目包括“毛泽东智能文献库”（

  国家社科重大项目子课题）、

  “某省级公司招标采购业务大数据分析研究与应用”（横向）、“城市道路异构宽带无线通信网接入策略研究与实现”（横向）、“面向终身学习基于网络的休闲文化教育考核及评定机制研究”（横向子课题）等。近期指导工程硕士开发了内容丰富的网络服务及应用系统，包括基层央行业务数据分析系统、多端访问的培训机构门户、基于WebGIS的水雨情监测与预警系统、信息安全研究所设备管理系统、基于SaaS的区域共享型高校电子商务创业平台等，均已投入使用。

  2019年度指导硕士研究生发表

  CCF

