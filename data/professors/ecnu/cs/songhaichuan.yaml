bio_raw: '宋海川，华东师范大学计算机科学与技术学院教授，博士生导师。

  博士毕业于清华大学，曾任法国信息与自动化研究所博士后研究员、华东师范大学计算机科学与技术学院准聘副教授、教授。

  主要研究领域包括计算机辅助设计、三维打印、三维计算机视觉等。

  参与我国自主产权几何内核

  GME

  的研发，对

  CAD

  几何表示、方程求解、误差控制等底层关键技术进行攻关。

  在参数曲线曲面点投影、求交、离散化、消隐等核心技术取得突破，部分指标超过国际领先

  CAD

  内核

  ACIS

  。

  在沪东中华造船集团有限公司进行了集成应用，从而实现了该部分功能的国产化替代。

  曾主持

  工信部“船舶研发设计软件实船验证平台项目”子课题、

  国家自然科学基金青年基金等，获得“上海市东方英才拔尖人才”、“上海市浦江人才”称号，获得上海市科技进步特等奖、世界互联网大会领先科技奖等。

  在三维产品造型系统、曲线曲面造型及误差控制、三维打印、三维点云处理与理解、视觉异常检测等方面做了大量工作。

  在

  TOG

  、

  SIGGRAPH

  、

  CVPR

  、

  TOM

  、

  AAAI

  、

  IJCAI

  、

  CAD

  、

  ECCV

  等国内外学术期刊和会议上发表了

  40

  余篇论文。

  每年计划招收博士研究生2名，全日制硕士研究生2-3名，非全日制硕士研究生3-4名。

  长期招收本科实习生及科研助理！

  请联系邮箱：hcsong@cs.ecnu.edu.cn

  社会兼职

  担任

  GDC2023

  程序委员会主席。

  研究方向

  主要研究领域包括计算机辅助设计（CAD）、三维打印、三维计算机视觉等。

  招生与培养

  每年计划招收博士研究生2名，全日制硕士研究生2-3名，非全日制硕士研究生3-4名。

  长期招收本科实习生及科研助理！

  请联系邮箱：hcsong@cs.ecnu.edu.cn

  开授课程

  “计算机辅助智能制造”（本科生课程），宋海川，2020年-至今

  “高级

  计算机辅助智能制造

  ”，宋海川，2020年-至今

  “深度学习理论与视觉应用”，马利庄，宋海川，2019年-至今'
