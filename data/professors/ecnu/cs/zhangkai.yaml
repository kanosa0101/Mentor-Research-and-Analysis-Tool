bio_raw: '个人简介

  先后在劳伦斯伯克利国家实验室、西门子研究院，NEC实验室，美国Temple University 工作

  。在人工智能和计算机杂志/会议

  Nature Machine Intelligence, Artificial Intelligence, Nature Communications, TPAMI

  ,

  TNNLS, TKDE, NeurIPS, ICML, ICLR, CVPR, ECCV, KDD, IJCAI, AAAI

  等

  发表论文

  近

  90

  篇

  。

  获

  2016

  年

  ACM SIGKDD

  最佳论文提名奖，

  2016

  年

  NEC Labs

  商业贡献奖

  。

  在脑功能网络领域的工作以封面文章发表在著名脑科学杂志

  Brain -

  美国麦克阿瑟奖得主

  Danielee Bassett

  撰写“灵活的大脑”的评论，认为“该工作是理解动态功能网络的基石”。提出了物理启发的Transformer构架

  (

  自然-机器智能 2024

  )

  ,以及模态对齐扩散模型

  (

  自然-机器智能 2026

  )

  ,成功应用于癌症新抗原筛选与蛋白质结构采样

  。

  课题组围绕

  大语言模型、智能科学发现、AI与生命科学交叉

  等方向开展原创性研究，提供

  前

  沿方向

  ：聚焦重要领域，开展具有长期影响力的原创研究；

  科研条件

  ：充足 GPU 计算资源，支持模型训练和实验研究；

  系统指导

  ：一对一指导，从研究方向

  、算法

  、论文全过程培养；

  发展机会

  ：组内学生进入

  千问、小红书、腾讯、华为、B站

  等企业，多名学生获

  国家奖学金和企业奖学金

  。

  课题组常年招收硕士（包括科研实习），欢迎参加预推免的同学提前联系我。

  2027年课题组预计招收1-2名博士（AI4Science，具身智能，语言/扩散模型）。

  -- 欢迎有探索精神和

  良好专业基础、沟通能力的

  同学联系我 kzhang@cs.ecnu.edu.cn。'
