bio_raw: '高岩，博士，副教授, 现为华东师范大学计算机科学与技术学院教师。2006年12月毕业于上海交通大学，获计算机应用专业博士学位。主要研究方向为计算机图形学、人工智能、计算机视觉。面向国家重大需求，作为骨干成员，负责、参与多项军民融合重大示范项目、国家自然科学基金、863基金、XXXX演示任务以及国家军事标准撰写，承担其核心技术攻关、系统架构设计、关键技术验证等任务负责。在《中国科学》,《The
  Visual Computer》等国内外刊物和会议上发表20余篇论文，软件著作权登记多项。

  社会兼职

  无

  研究方向

  计算机图形学、图象处理

  招生与培养

  开授课程

  计算机图形学

  人机交互（研究生+本科）

  计算机动画

  图形学中的深度学习（非全研究生）'
