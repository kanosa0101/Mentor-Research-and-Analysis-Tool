bio_raw: '担任华东师范大学上海智能教育研究院院长、上海创智学院全时导师，曾任华东师范大学计算机科学与技术学院院长。

  担任上海市

  IV

  类高峰学科“智能教育”负责人，担任上海市重大攻关任务“中国版教育大模型”负责人。主要研究领域包括人工智能、智能教育等。发表

  SCI

  一区

  /CCF A

  类期刊会议学术论文

  80

  余篇，相关成果谷歌学术累计引用

  1

  3

  000

  余次。

  获上海市东方英才领军项目、上海市自然科学奖一等奖等、宝钢优秀教师奖、高校计算机专业优秀教师奖励、上海市高等教育优秀教学成果二等奖、爱思唯尔

  2020-202

  5

  年度中国高被引学者等奖励或称号。

  社会兼职

  IEEE

  高级会员

  Swarm and Evolutionary Computation

  副编

  Complex & Intelligent Systems

  编委

  Chinese Journal of Electronics

  编委

  IEEE Transactions on Evolutionary Computation, IEEE Transactions on Cybernetics,
  IEEE Computational Intelligence Magazine, Pattern Recognition, Information Sciences,

  软件学报, 计算机学报,

  CEC, GECCO, EMO, IJCAI, AAAI, NeurIPS

  等期刊和会议审稿人

  国家自然科学基金通讯评审专家（

  2011

  -

  2025

  ）

  研究方向

  (1) 大语言模型

  (2) 智能体系统

  (3) 演化优化与学习

  (3) 智能教育

  (4) 科学智能

  欢迎对上述方向感兴趣的高中生、本科生同学参与科研实习，实习生背景不限，但要求能动性强、产生价值，团队提供千卡级算力支持、大模型训练及Agent研发全流程技术指导，相关工作请查阅华东师范大学上海智能教育研究院及上海创智学院官微、GitHub主页。

  欢迎报考人工智能方向硕士研究生和

  计算机方向

  博士研究生，欢迎博士后、青年研究员加盟上海智能教育研究院团队，请邮件联系！

