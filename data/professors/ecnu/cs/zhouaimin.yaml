bio_raw: '个人简介

  担任华东师范大学上海智能教育研究院院长、上海创智学院全时导师，曾任华东师范大学计算机科学与技术学院院长。

  担任上海市

  IV

  类高峰学科“智能教育”负责人，担任上海市重大攻关任务“中国版教育大模型”负责人。主要研究领域包括人工智能、智能教育等。发表

  SCI

  一区

  /CCF A

  类期刊会议学术论文

  80

  余篇，相关成果谷歌学术累计引用

  1

