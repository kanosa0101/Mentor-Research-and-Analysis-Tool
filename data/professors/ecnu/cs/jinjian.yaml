bio_raw: '个人简介

  金健，博士，副教授。主要研究兴趣为模式识别、机器学习和人工智能等。2008年获华东师范大学系统分析与集成专业博士学位并留校任教至今，2014-2015年在加拿大英属哥伦比亚大学地球、海洋与大气科学系访问。主持国家自然科学基金1项，上海市科委重点项目1项，作为第2完成人参与国家自然科学基金、教育部研究专项、上海市科委研究专项共5项，作为主要完成人获广西科技进步二等奖1项，在国内外期刊和会议发表论文30余篇。'
