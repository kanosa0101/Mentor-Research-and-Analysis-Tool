bio_raw: '个人简介

  招生信息【2026.9.24更新】

  1.

  2027年秋季入学的统考硕士生

  （1）欲报考本人者，志愿需填写：

  报考专项：卓越工程师学院 - 人工智能（15 校企培养改革专项 （具身慧智））

  关于本项目的一些常见QA：

  【腾讯文档】华东师范大学卓越工程师学院 人工智能（15 校企培养改革专项 （具身慧智））2027级统考答疑

  https://docs.qq.com/doc/DWVVjT0Fmd09BcWVT

  （2）若通过计算机学院报名统考，名额不确定（很可能没名额）。

  欢迎来信咨询统考具体要求。

  由于来信较多，无法做到一一回复，请谅解。联系本人的同学可以同时联系其他老师，使得双方都可以充分双向选择。

  -----------------------------------------------------------------------------------

  谭鑫，博士，博士生导师，华东师范大学计算机科学与技术学院青年研究员（紫江青年学者），院长助理；上海人工智能实验室双聘副研究员。入选第十届中国科协青年人才托举工程、中国图象图形学学会博士学位论文激励计划、上海市东方英才青年人才项目、上海市扬帆计划、晨光计划（A类）。他的主要研究兴趣是

  研究面向具身的数据生成与智能体训练

  。他主持了新一代人工智能国家科技重大专项课题、国家自然科学基金项目3项（面上、青年、国际合作交流）及省部级项目6项、CCF-腾讯犀牛鸟基金（优秀结题）等，他是华东师范大学-智元机器人联合实验室负责人，同时与华为、腾讯等企业有长期稳定的密切合作。他在TPAMI、TIP、CVPR、ICCV、ICLR等国际知名期刊和会议发表论文40余篇。作为完成人曾获上海市科技进步特等奖、世界互联网大会领先科技奖、中国地理信息产业协会科技进步二等奖、上海交通大学十大科技进展、世界人工智能大会TOP30榜单项目和上海市优秀毕业生等荣誉。他担任中国图学学会高级会员、可视化与知识计算专委会委员、青年工作委员会委员；中国计算机学会高级会员、计算机辅助设计与图形学专委会执行委员、中国图象图形学会青年工作委员会委员、数字娱乐与智能生成专委会委员、三维视觉专委会委员、CCF第26届全国计算机辅助设计与图形学学术会议（CAD/CG
  2023）组织主席。他还担任多个知名期刊（Pattern Recognition, The Visual Computer等）的编委（Associate editor)、ICLR等会议的领域主席和国际多个顶级期刊和会议的审稿人等。

  研究兴趣：

  旨在构建面向可信具身智能的场景感知与重建系统，该系统能够结合多模态大模型的能力，支持三维空间重建与空间推理。

  1、可信具身智能：提升具身智能体的可信水平；评价具身智能体的方案与标准；

  2、三维视觉：面向具身智能的几何场重建和语义场重建；如何结合多模态大模型进行交互式三维空间理解；

  3、多模态大模型的训练与推理：研究多模态大模型如何为具身智能赋能；探索三维多模态大模型的能力边界。

  -----------------------------------------------------------------------------------

  更多内容请关注：

  https://tanxincs.github.io/'
