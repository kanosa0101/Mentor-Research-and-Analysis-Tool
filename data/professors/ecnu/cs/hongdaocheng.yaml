bio_raw: '洪道诚，在以海内外人才引进方式加盟华东师大前，曾就职于复旦大学和维多利亚大学；入选国家留学基金委青年骨干教师公派出国计划

  、复旦大学青年骨干教师带薪出国计划

  ；研究兴趣教育大数据、智能教育

  、深度学习分析、多模态智能处理

  等。公开发表国内外学术期刊和会议论文

  39

  篇（ESI/SCI/SSCI/CSSCI/EI等）；主持和参与完成了多个国家自然科学基金和科技部重点研发计划项目；积极参加国际学术活动，任多个国际会议Session
  Chair，多次进行国际会议学术报告；

  任国家自然科学基金委通讯评委、全国研究生教育评估专家、上海市教育评估院评议专家、中国计算机学会Senior Member、数据库专委、信息系统专委、上海市科委项目评审专家

  。（

  常年招收博士、硕士，期待优秀学生加入！

  ）

  社会兼职

  研究方向

  教育大数据、智能教育、深度学习分析、多模态智能处理等。（

  常年招收博士、硕士，欢迎优秀学生加入！

  ）

  招生与培养

  开授课程'
