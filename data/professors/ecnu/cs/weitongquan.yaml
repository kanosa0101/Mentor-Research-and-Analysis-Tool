  研究方向

  边缘智能计算及应用

  新型端-边-云协同智能计算架构、性能建模与优化

  分布式深度学习与联邦学习

  智能物联网（AIoT)资源配置

  面向边缘端的实时视频流分析及图像恢复

  深度神经网络模型及应用

  多模态学习及推理时计算优化

  大模型应用及提示词工程

  LLM Agent架构及优化技术

  云计算与服务计算

  个性化云数据中心资源配置

  云经济学与云服务定价

  容器编排与管理

  毕业生去向：

  硕士

  毕业生就职于华为、阿里、腾讯、字节、拼多多、美团、携程、京东、百度、微软、

  阶跃星辰、

  壁韧、天数智芯、各大银行、上海清算所、中金等公司；

  博士

  毕业生就职于上海大学、暨南大学、南京理工大学等高校。

  招生信息

  ：

  本研究组每年招生硕士研究生2-3名，博士研究生1名。欢迎对以上研究方向感兴趣、有志于从事科研工作的同学将简历、成绩单、参与科研项目的技术报告、竞赛/获奖证书等证明材料发到tqwei@cs.ecnu.edu.cn。

