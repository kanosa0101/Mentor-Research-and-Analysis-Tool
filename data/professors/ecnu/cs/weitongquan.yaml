bio_raw: '现为华东师范大学计算机科学与技术学院教授、博士生导师，主要研究方向为边缘智能计算、智能物联网（AIoT)、云计算与服务计算、视频流分析、分布式深度学习、多模态学习、大语言模型优化及应用、推理时计算、LLM
  Agent等，在这些领域发表论文100余篇，授权发明专利和软著20多项，代表性工作获IEEE TCSC Most Influential Paper Award。主持多项与企事业单位合作横向项目，部分研究成果已落地应用。

