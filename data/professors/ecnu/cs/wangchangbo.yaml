  个人简介

  博士，华东师范大学教授，博士生导师。曾任华东师范大学软件学院副院长、计算机与软件工程学院常务副院长、计算机科学与技术学院党委书记。兼任上海市计算机学会金融科技专委会主任、上海市人工智能与社会发展研究会副会长

  。已主持国家及省部级科研项目10多项，在国内外知名学术会议和期刊上发表论文160余篇，出版专著和教材5部。曾担任国际会议VINCI2019、ChinaVis2018、CAD/CG2023会议主席。曾获上海市青年科技启明星、全国宝钢优秀教师奖、国家教学成果奖二等奖、上海市科技进步奖特等奖、上海市计算机学会科学技术奖二等奖、上海市申银万国奖教金、陆增镛CAD&CG高科技奖等。研究方向为

  数据可视化、

  计算机图形学、金融科技、虚拟现实等。

  社会兼职

  ·上海市计算机学会常务理事、金融科技专委会主任.

  ·中国图象图形学学会可视化与可视分析专委会秘书长.

  ·中国计算机学会计算机辅助设计与图形学专委会常务委员.

  ·中国图学学会计算机图学专委会委员.

  ·上海市人工智能与社会发展研究会副会长.

  ·

  上海市图学学会副理事长、视觉与媒体智能专委会主任.

  ·中国计算机学会理事（2016-2020）、上海分部副主席（2019-2023）

  ·CCF YOCSEF上海学术委员会主席（2014-2015）.

  ·会议主席/组织委员会主席：ChinaVis2018、ChinaVis2019、CVM2018、VINCI2019、CAD/CG2023.

  ·期刊审稿专家:《TVCG》《TVC》《GMOD》《CGF》《C&G》《FCS》《TMM》《中国科学》等.

  研究方向

  研究方向聚焦于数据可视化与智能图形分析，包括：数据可视化、金融科技、计算机图形学、具身智能、视觉媒体等。

