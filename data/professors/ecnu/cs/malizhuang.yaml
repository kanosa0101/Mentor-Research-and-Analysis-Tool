bio_raw: '马利庄

  ，

  是国家杰出青年基金，中国青年科技奖，国家教育部科技进步二等奖，上海市科技进步一等奖、二等奖获得者；国家“百千万人才工程”

  (

  国家级

  )

  首批人选，浙江省跨世纪学术与技术带头人；国务院特殊津贴获得者；多年来对计算机图形图像、数字媒体、计算机视觉、人工智能应用相关领域前沿问题积极探索，取得了一系列创造性成果，

  在视觉无损的大数据智能压缩技术、人脸大数据智能分析与处理方面取得重大社会与经济效益，其中与腾讯公司优图团队的合作，取得

  10

  亿规模级别的经济效益，人脸检测技术在国际

  FDDB

  评测机构上曾获得世界第一（

  2014

  年），人脸识别的身份验证技术在

  LFW

  公开数据集上两次刷新世界纪录（

  2015

  、

  2017

  年）。获得国际先进水平（部分领先）的研究成果，在国内外重要学术刊物上发表论文

  200

  多篇，

  SCI

  与

  EI

  收录

  100

  篇以上（包括

  IEEE TPAMI

  ，

  TIP

  ，

  IJCAI

  等）。负责国家杰出青年基金、国家自然科学基金（

  12

  项，其中重点

  1

  项）、国家

  863

  面上和目标导向各

  1

  项、世博重点项目、上海市科技创新重点项目

  3

  项、霍英东优秀青年教师基金等重要课题。

  98

  年作为德国

  Fraunhofer IGD

  国际图形学研究院的访问教授，参与重大国际合作项目“

  Virtual Prototype

  ”

  及

  99

  年至

  2000

  年作为新加坡南洋理工大学

  CAMTech

  先进多媒体中心客座教授，参与了新加坡

  -

  德国国际合作项目“

  Virtual Factory

  ”。

  2001-2003

  年兼任浙江财经大学信息学院特聘院长。

  社会兼职

  （1）

  上海交通大学特聘教授

  （2）

  CAD/Graphics

  、

  GDC

  、

  CVM

  、

  CIDE

  等系列会议程序委员会委员；

  （3）

  ICEC2007

  、

  DEA2013, CIDE2014, GDC2015

  、

  CAD/Graphics2015

  、

  CIDE2017

  、

  CVM2018

  程序委员会主席

  /

  大会主席；

  （4）

  中国图像图形学会动画与数字娱乐专委会主任

  （5）

  上海电影特效工程技术中心学术委员会副主任，

  （6）

  上海市中西医结合学会系统医学专业委员会副主任

  （7）

  中国人工智能学会理事、智能

  CAD

  与数字艺术

  副主任；

  （8）

  中国图像图形学会理事、上海市图像图形学会理事；

  （9）

  计算机辅助设计与图形学专业委员会，人工心理专业委员会委员；

  （10）

  南京市大数据技术与应用工程中心学术委员会委员，

  （11）

  浙江大学

  CAD&CG

  国家重点实验室学术专委会委员；

  （12）

  计算机辅助设计与图形学专委会常务理事；

  （13）

  计算机辅助设计与图形学学报编委；

  （14）

  浙江大学学报特邀编委；

  （15）

  上海交通大学学报编委；

  （16）

  Journal of Advanced Computer Science & Technology(India) , associate editor

  ；

  （17）

  International Journal of Production Research (IJPR), associate editor

  。

  研究方向

  研究兴趣包括计算机图形图像，可视媒体智能处理，人工智能，虚拟现实技术等。长期与腾讯科技、

  Microsoft

  及日本的

  NTT

  等

  IT

  巨头开展长期合作，进行数字多媒体与人工智能处理方面的研发；此外与美国斯坦福大学、

  UCSB

  、日本早稻田大学、法国巴黎高科等国际名校开展了长期国际合作与交流。

  招生与培养

  开授课程

  深度学习与人工智能'
