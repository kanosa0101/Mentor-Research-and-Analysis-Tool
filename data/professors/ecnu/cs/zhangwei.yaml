bio_raw: '张伟，华东师范大学计算机学院教授、博士生导师，上海创智学院全时导师。研究领域为机器学习（大模型、可解释机器学习、高效机器学习）、数据挖掘（推荐系统、用户行为建模）、智能教育（知识追踪与认知诊断、个性化学习推荐）等。于2016年获得清华大学计算机系博士学位，博士论文获得清华大学优秀博士论文奖。研究成果在CCF A类会议和期刊上发表论文超过50篇，指导学生在国际知名数据挖掘竞赛中多次取得佳绩。主持或参加国家重点研发计划、自然科学基金等多个项目。

