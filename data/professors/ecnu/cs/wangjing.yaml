email: wangjing@cs.ecnu.edu.cn
bio_raw: "华东师范大学晨晖学者（助理教授）。上海交通大学博士和博士后，入选上海市超级博士后激励计划，作为核心成员参与国家重点研发、国家重点研发青年科学家、科技部2030、国自然区域联合重点等多项国家级项目，在SC、ISCA、HPCA、VLDB、IPDPS、ICCD、APPT等会议，以及TC、TPDS、TACO、JPDC、CSUR等期刊上发表论文，拥有多项美国和国内专利授权，研究成果落地阿里、字节、蚂蚁等企业平台。研究内容主要面向新兴应用设计软硬件协同的高效内存系统，具体包括：分离式内存池、图计算、GPU加速、FPGA编译、资源调度等。任职CCF体系结构专委、分布式专委、存储专委执行委员，担任TPDS、TC、TSUSC等审稿人。其他内容详见个人主页，欢迎联系交流。\n\
  社会兼职\n\x9E\n中国计算机学会体系结构专委执行委员（\n2024.7-\n今）\n\x9E\n中国计算机学会分布式系统专委执行委员（\n2024.7-\n\
  今）\n\x9E\n中国计算机学会信息存储技术专委执行委员（\n2024.11-\n今）\n研究方向\n我的主要研究方向为计算机体系结构，面向智能体、大模型、图计算等新兴应用场景，研究异构架构设计、内存存储系统优化、专用加速器编译优化、资源动态调度等，支撑先进计算的底层效能提升。\n\
  Research Interests:\nMy primary research area is\nMemory System for Emerging Application\
  \ (short as\nMemSea\n)\n. I work hard to build wisdom, high-performance, and sustainable\
  \ memory subsystems for next-generation computer architectures on the basis of heterogeneous\
  \ computing, memory, storage, and network devices. Our design can serve a variety\
  \ of big-data applications, including multi-modality AI training, AI content generation\
  \ (AIGC), large language model (LLM), retrieval-augmented generation (RAG), graph\
  \ processing, metaverse, cloud gaming, scientific computing, and others.\nWe have\
  \ made some progress on far memory system design, graph processing acceleration,\
  \  resource scheduling in the cloud, task rearrangement at the edge, etc. Now, we\
  \ are mainly working on the following fields:\nSystem Design for LLM and Agent workload\n\
  Smart Management of flat disaggregated memory\nExploration of out-of-xPU memory\
  \ and Storage architecture\nCompilation optimization of FPGA Architecture\n(If you\
  \ are interested in these research areas, please feel free to\ncontact me now\n\
  ! Looking forward to your communication and joining!)\n招生与培养\n欢迎对Computer Architecture感兴趣的同学报考我的硕士研究生！欢迎本科生联系我（大二以上均可）参与实验室一线科研课题！\n\
  我会尽量培养你的系统科研能力，尽力帮忙推荐优质升学机会或者工作。\n具体要求如下：\n（1）自驱力强：科研需要大量时间投入, 不支持躺赢：投入越多，支持越多。\n\
  （2）头脑清晰：说话做事有逻辑。\n保持自己的思考，不人云亦云，AI云亦云。\n（3）责任心强，道德感强：愿意担责，注重团队协作。解决真问题，做有用的研究，不助纣为虐。\n\
  （4）科研定力：有甘坐冷板凳的勇气，有一定会成功的底气，有能挖掘底层原理的韧力。\n（5）抗压能力：论文不中很正常，实验失败很正常。不内耗，重要的是如何能够化干戈为力量。\n\
  我们可以：\n共同申请并参与各类基金和各类科研项目。（同样不中很正常）\n共同发表论文，按参与度排序。\n参与实验室聚餐和团建活动。\n根据成果和日常表现\n\
  提供科研补助。\n对意向为本校深造的同学，在录取时优先考虑。\n为目标就业的同学提供实习和工作推荐，包括蚂蚁/阿里云/华为/字节/美团/英伟达等国内外优秀企业。\n\
  对于目标出国的同学提供推荐信，已推荐多位本科生去往Harvard、Cornell、EPFL等学校深造。\n开授课程\n操作系统（计算机专业本科），2026年秋季学期，与\n\
  石亮\n老师合作\n系统结构与数据（计算机专业研究生），2026年秋季学期\n操作系统（人工智能专业本科）\n，2027年春季学期"
