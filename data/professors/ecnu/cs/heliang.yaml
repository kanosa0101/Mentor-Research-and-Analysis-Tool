  个人简介

  华东师范大学计算机科学与技术学院副院长、教授、博士生导师，市政协十四届委员，九三学社上海市委员会委员、常委，九三学社华东师范大学委员会主委。主要研究方向为自然语言处理、知识计算和人机混合增强智能。目前担任国家科技创新2030新一代人工智能重大专项总师办主任、专家组成员，中国工程科技发展战略上海研究院人工智能创新发展研究室主任、华东师范大学中国智慧研究院副院长、是上海市高新技术领域人工智能方向“十四五”和中长期科技发展规划编制组组长，主持多项国家科技支撑、上海市科委重大重点科技攻关项目，五次获得上海市科技进步奖，2013年获上海市科技进步一等奖，2015年主持获得上海市科技进步二等奖，在SIGIR、AAAI、TKDE、ACMMM、ICDE等国内外顶级会议和期刊上发表多篇学术论文。2025年度宝钢优秀教师奖。

