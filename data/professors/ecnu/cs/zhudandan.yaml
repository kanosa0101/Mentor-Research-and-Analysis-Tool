bio_raw: '朱丹丹，华东师范大学计算机科学与技术学院副教授，硕士生/博士生导师。2019年获得同济大学软件工程博士学位，2019年7月至2021年10月在上海交通大学从事博士后研究工作。研究方向包括视觉注意力建模和感知信号处理、机器视觉与图像理解、自适应学习、类脑智能、智能教育等。目前以第一作者和通讯作者已在国际著名期刊和顶级学术会议上发表论文60余篇，其中包括IEEE
  TPAMI、TIP、TMM、TCSVT、TETCI、TCDS、TGRS、ACM TOMM、TVCG、CVPR、AAAI、ACM MM等。作为项目负责人已主持4项纵向课题，包括国家自然科学基金面上项目、青年科学基金项目、中央高校专项资金自由探索项目等。已授权专利7项；担任国内外权威期刊和领域国际会议论文审稿人；荣获第二届广州.琶洲算法大赛优选赛—智能交通CV模型赛题冠军、第二届广州.琶洲算法大赛百强队伍、“

  CVPR NTIRE 2024 UGC视频质量评价挑战赛”冠军、“ICCV VQualA 2025 人脸图像质量评价挑战赛”冠军、“ICCV VQualA 2025
  社交视频热度预测挑战赛”冠军、“IEEE ICME 2025 HDR视频质量评价挑战赛冠军”。

  社会兼职

  担任Current Chinese Science、 Neurocomputing 和 Senors 等多个期刊的 Associate Editor。

  著名期刊和会议审稿人，期刊如IEEE TIP、TCSVT、TMM、TETCI、TII、TIF、TNNLS、TCDS等，会议如CVPR、Neurips、AAAI、ICCV、ECCV、ACL、ICME等。

  研究方向

  1.人工智能与大模型及其在垂域中的应用（优秀者可以推荐到字节、腾讯、阿里等大厂实习）

  2.多模态信息融合

  3.类脑智能

  4.自适应学习

  5.视觉质量增强与恢复

  招生与培养

  开授课程

  1.

  COMS0031131051.01，

  数据库系统原理与实践（本科生课程）

  2.

  COMS0031112012.01，

  智能教育（本科生课程）

  3.工程伦理，研究生课程'
