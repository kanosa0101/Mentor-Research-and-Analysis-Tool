  个人简介

  谢源，现任华东师范大学计算机科学与技术学院教授、上海创智学院全时导师、博导，国家优青，闽江学者讲座教授，重庆市杰青。于

  2010

  年和

  2013

  年分别获得厦门大学计算机系和中国科学院自动化所工学硕士和博士学位。

  2014

  年获国家人社部和博管会的资助，授予“香江学者”的称号，赴香港理工大学计算机系从事两年的博士后研究工作。历任中国科学院自动化研究所助理研究员（2013）和副研究员（2016）。

  主要研究方向为计算机视觉和机器学习，当前研究方向涵盖：面向自动驾驶的仿真/决策、大模型持续学习、自我进化智能体等。

  先后主持了国家自然科学基金优秀青年基金、科技部科技创新

  2030

  “新一代人工智能”重大项目课题

  ，

  国家自然科学基金面上项目

  ，青年项目

  ，人力资源与社会保障部“香江学者”

  ，上海市人工智能科技支撑专项

  ，北京市和上海市自然科学基金面上项目各

  1

  项，第一、二届中国人工智能学会

  -

  华为

  MindSpore

  学术基金，并与华为、腾讯、荣耀、奇瑞等知名企业长期合作。在国内外权威期刊和顶级会议上共发表和接收学术论文150

  余篇，其中第一作者

  /

