bio_raw: '谢源，现任华东师范大学计算机科学与技术学院教授、上海创智学院全时导师、博导，国家优青，闽江学者讲座教授，重庆市杰青。于

  2010

  年和

  2013

  年分别获得厦门大学计算机系和中国科学院自动化所工学硕士和博士学位。

  2014

  年获国家人社部和博管会的资助，授予“香江学者”的称号，赴香港理工大学计算机系从事两年的博士后研究工作。历任中国科学院自动化研究所助理研究员（2013）和副研究员（2016）。

  主要研究方向为计算机视觉和机器学习，当前研究方向涵盖：面向自动驾驶的仿真/决策、大模型持续学习、自我进化智能体等。

  先后主持了国家自然科学基金优秀青年基金、科技部科技创新

  2030

  “新一代人工智能”重大项目课题

  ，

  国家自然科学基金面上项目

  ，青年项目

  ，人力资源与社会保障部“香江学者”

  ，上海市人工智能科技支撑专项

  ，北京市和上海市自然科学基金面上项目各

  1

  项，第一、二届中国人工智能学会

  -

  华为

  MindSpore

  学术基金，并与华为、腾讯、荣耀、奇瑞等知名企业长期合作。在国内外权威期刊和顶级会议上共发表和接收学术论文150

  余篇，其中第一作者

  /

  通讯作者

  CCF A

  类或中科院一区论文

  百余

  篇。申请人提出的从向量到张量的正则化理论及方法已逐渐得到国内外众多同行的认可，相关成果

  Google

  引用2万余次

  ，

  提出的图像复原算法获得了

  CVPR2020

  图像视频复原和增强挑战赛（

  IEEE CVPR NTIRE 2020

  ）的图像去雾和去摩尔纹赛道的两项冠军；先后担任图像处理领域顶级期刊IEEE TIP编委（Associated Editor），

  IJCAI2019-2022

  的领域主席

  /Senior PC

  ，

  CIKM2019

  领域主席，AAAI2025领域主席；相关研究成果获得了吴文俊人工智能科学技术奖自然科学二等奖（第二完成人）、上海市科技进步特等奖（第十完成人）、福建省自然科学二等奖（第二完成人）、自动化学会自然科学二等奖（第二完成人）。

  本人在华东师范大学/上海创智学院招收博士研究生，2027年博士名额2-3人，

  硕士名额3-4人

  ，创智招收直博生3-5名，研究方向：基座模型持续学习和持续进化智能体，AI agent for science，自动驾驶/世界模型，具身智能，欢迎有意向的同学联系：

  yxie@cs.ecnu.edu.cn

  社会兼职

  国际人工智能顶级学术会议IJCAI资深程序委员会委员（SPC），数据挖掘权威学术会议CIKM

  资深程序委员会委员（SPC），

  国际期刊

  International Journal of Image and Graphics

  编委。

  中国自动化学会混合智能专委会委员。

  顶级和权威期刊和会议审稿人，期刊如IJCV、IEEE TIP、TNNLS、TGRS、

  TSP

  、

  TCYB

  、

  TII

  、

  TCSVT

  、

  TMM

  等，会议如

  ICCV2015

  、

  ICCV2017

  、

  ICIP2015

  、

  ICONIP2012

  等。

  研究方向

  人工智能；计算机视觉；机器学习

  招生与培养

  开授课程

  深度学习基础与导论（本科课程）

  计算机视觉与深度学习（博士生课程）'
