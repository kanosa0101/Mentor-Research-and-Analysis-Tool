  研究方向

  [1] 复杂场景下的视觉增强

  复杂场景

  下

  的视觉增强是一门致力于突破极端条件限制、提升图像/视频质量与可用性的前沿技术研究方向，主要聚焦于在雾霾、强光逆光、低光照、雨雪干扰、沙尘遮挡、夜间微光等复杂环境下，通过算法设计与模型优化恢复或增强图像的视觉信息，解决传统成像系统因环境干扰导致的对比度下降、细节模糊、色彩失真、能见度降低等问题。该研究在自动驾驶、智能监控、工业检测、无人机巡检、应急救援、军事侦察、医疗影像等对视觉感知可靠性要求极高的领域具有重要应用价值。例如，自动驾驶系统需在雨雾天气中精准识别道路标志与障碍物，安防监控需在夜间低照度下清晰捕捉人脸特征，工业质检需在油污粉尘环境中检测微米级缺陷，而军事装备则需在沙尘、烟雾等战场环境下保持稳定的目标识别能力。

  [2] 通用/快速磁共振重建与增强

  通用/快速磁共振重建与增强是医学影像技术领域中一个兼具基础创新与应用价值的前沿研究方向，致力于解决传统磁共振成像(MRI)中扫描时间长、重建流程专一性强、图像质量受限等关键瓶颈问题。该方向聚焦于通过深度学习、优化算法与信号处理技术的融合创新，构建能够适应多种扫描序列、不同对比度类型、多对比度融合的通用型快速重建框架，同时提升图像的分辨率、信噪比与对比度，为临床诊断提供更优质的影像信息。

  [3] 多模态口腔智慧诊疗

  多模态口腔智慧诊疗是融合人工智能、多模态感知技术与口腔医学的交叉研究方向，旨在通过整合多源异构医疗数据（如高分辨率口腔影像、三维锥形束CT、口内扫描模型、病理切片、语音/文本病历、生物传感器信号等），结合计算机视觉、深度学习与多模态大模型技术，构建覆盖疾病智能诊断、治疗精准规划、疗效动态评估全流程的智慧化诊疗体系。该研究方向直接服务于口腔临床需求，在龋病/牙周病的早期精准筛查、复杂种植/正畸方案的数字化模拟、口腔颌面肿瘤的边界识别与手术规划、术后功能与美学效果预测等关键环节具有重大应用价值，是推动口腔医学向智能化、精准化、个性化发展的重要引擎，同时为智慧医疗在其他专科领域的拓展提供技术范式参考。

  [4] 垂域大模型安全与价值观对齐

  垂域大模型安全与价值观对齐是人工智能安全、伦理治理与特定行业深度交叉的前沿研究方向。随着大模型在医疗、心理、政治等关键垂直领域的落地应用，其在面对复杂业务场景、对抗性攻击及敏感信息处理时，暴露出幻觉频发、价值观偏离及隐私泄露等重大安全隐患。该方向致力于构建面向垂域特性的全生命周期安全防护体系，重点突破基于人类反馈的强化学习等核心技术，实现大模型在专业知识输出、业务逻辑遵循及伦理安全底线上的精准对齐。同时，研究涵盖垂域数据隐私保护、模型鲁棒性与可解释性增强等关键技术，旨在构建可信、可控、合规的垂域大模型基座，为关键行业的智能化转型提供坚实的安全保障与伦理支撑。

  图像复原、增强、检测、分割、预测等均为基础研究方向。

