bio_raw: '个人简介

  李俊诚，副教授，博导，上海市青年科技英才“扬帆计划”获得者，连续多年入选斯坦福大学发布的【全球前2%科学家】榜单，获中国产学研合作创新成果一等奖。博士毕业于华东师范大学，师从张桂戌教授，曾担任香港中文大学博后研究员，合作导师为曾铁勇教授。主持包括国自然青年基金、上海自然面上项目、上海启明星项目（扬帆专项）、上海高校青年教师重点资助项目及多个重点实验室开放课题。长期从事复杂场景下的视觉增强与感知和医学影像智能处理等研究，取得了一系列原创性成果，在国际知名期刊和会议（如：ACM
  Computing Survey、TIP、TNNLS、TMM、TCSVT、TMI、CVPR、ECCV、ICCV、AAAI、IJCAI、MICCAI等）上发表论文90余篇（ESI高被引论文4篇）,
  谷歌学术引用量超6900余次，其中单篇一作最高引用1200余次（两篇引用破千论文）。受邀担任多个期刊青年编委、副编辑、客座编辑，多个会议领域主席、国际挑战赛/研讨会的组织者和高级/程序委员，并担任医学图像计算青年研讨会（MICS）委员，上海市计算机学会人工智能专委会委员、计算机视觉专委会委员，中国图学学会高级会员等。

  保存'
