bio_raw: '李洋，博士，华东师范大学计算机科学与技术学院副教授、博士生导师。主要研究方向为

  计算机视觉、机器学习、计算机图形学与机器人感知

  。围绕视觉感知与智能系统中的关键问题，开展

  具身智能、空间智能、物理智能

  等交叉研究，致力于提升智能体和机器人对复杂真实环境的感知、理解、建模与交互能力。李洋博士毕业于浙江大学计算机学院，曾赴美国加州大学圣地亚哥分校（UC San Diego,
  UCSD）电子与计算机工程学院 Advanced Robotics and Controls Laboratory（ARCLab）进行学术交流访问。现任华东师范大学

  Visual Perception + X（VPX）

  研究组负责人。

  近年来，团队的研究主要集中在以下几个方面：

  （1）

  计算机视觉与机器学习

  ：视觉跟踪、视频分析、场景理解与视觉表征学习；

  （2）

  三维视觉与计算机图形学

  ：三维重建、神经渲染、可控图像/视频/三维内容生成；

  （3）

  机器人感知与操作

  ：机器人视觉感知、多模态理解、非刚体对象操作与感知-决策协同；

  （4）

  前沿交叉智能方向

  ：面向具身智能、空间智能与世界模型的环境建模、预测、生成与智能体学习。

  李洋博士已在 CVPR、ECCV、AAAI、IJCAI、ICRA 等国际高水平会议，以及 IEEE Robotics and Automation Letters（RAL）、IEEE
  Transactions on Multimedia（TMM）等重要期刊发表多篇论文，获得 4 项中国发明专利和 2 项美国专利。Google Scholar
  他引累计超过 4900 次。现担任多个国际学术会议程序委员会委员，曾任 AAAI 2019 与 ICONIP 2020 分会场主席，并担任 IEEE TPAMI、TIP、RAL、TMM、TCSVT
  等国际期刊审稿人。

  在进入高校任教之前，李洋博士曾从事视频游戏引擎开发、移动游戏系统性能分析以及人工智能系统开发等系统平台研发工作，具有学术研究与工业研发相结合的跨界背景。

