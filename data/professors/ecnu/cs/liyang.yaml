  研究方向

  研究方向

  ：计算机视觉，机器学习，

  计算机图形学，

  机器人感知

  近年来，研究主要集中在以下几个方面：

  （1）

  计算机视觉与机器学习

  ：视觉跟踪、视频分析、场景理解与视觉表征学习；

  （2）

  三维视觉与计算机图形学

  ：三维重建、神经渲染、可控图像/视频/三维内容生成；

  （3）

  机器人感知与操作

  ：机器人视觉感知、多模态理解、非刚体对象操作与感知-决策协同；

  （4）

  前沿交叉智能方向

  ：面向具身智能、空间智能与世界模型的环境建模、预测、生成与智能体学习。

  研究组主页：

  https://vpx-ecnu.github.io/

  个人主页

  ：

  http://ihpdep.github.io

  招生与培养

  欢迎对次时代人工智能、计算机视觉、计算机图形学、机器人感知等感兴趣的同学加入我们

  视觉感知与前沿技术组VPX（Visual Perception + X Group）

  。对我们组感兴趣的同学可以关注我们的

  B站

  以及

  Github主页

  。

  目前组内在研方向如下：

  -

  次时代渲染引擎：

  NeRF、3DGS为主，对虚拟人、光照重构、三维重建、三维场景风格化等内容进行研究。需要计算机图形学（CG）、机器学习（ML）相关知识。相关技能：VR/MR、UE5、CUDA、Shader、

  Pytorch

  等相关经验。

  -

  元宇宙内容生成：

  AIGC, 世界模型相关，Diffusion为主，对可控图像、视频、三维网格生成等内容进行研究。需要深度学习（DL），机器学习（ML）相关知识，

  相关技能：

  PhotoShop、ComfyUI、WebUI、Pytorch等经验。

  -

  视频分析

  与多模态大模型应用：

  Tracking、SAM和LVM为主，对直播内容生成、足球解说、电子围栏等内容进行研究。需要计算机视觉（CV）、大语言模型（LLM）相关知识。

  相关技能：SAM、llava、chatGPT、yolo、c++等相关经验。

  -

  具身智能机器人：

  强化学习（RL）、VLA

  为主，对基于大模型的机器人家务劳动、化学实验自动化等内容进行研究。需要机器人、大语言模型（LLM）等相关知识。

  相关技能：硬件搭建、ROS、LVM、PPO、pytorch等相关经验。

  本校本科生

  ：如果想要加入相关研究课题，可以直接发邮件或者到办公室敲门，请提前准备一些你的相关课程/项目经历介绍自己。

  外校研究生

  ：明年有硕士/博士招生计划，有意直博的同学请在邮件中表明；普博申请者请确保你有CV、CG或者ML相关的顶级论文（投稿也可以，请附上reviewer comments）。有意申请的同学请发送

  你的简历

  以及

  对哪个在研方向感兴趣

  至yli@cs.ecnu.edu.cn

