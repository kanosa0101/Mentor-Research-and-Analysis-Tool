bio_raw: '王晓玲，华东师范大学计算机科学与技术学院教授，教育部新世纪人才计划获得者。教育部装备预研创新团队负责人，教育部数据库课程虚拟教研室大模型赋能数据库教学专业组组长，获高校教师教学组织和教学发展体系建设研究项目。目前是

  《信息技术

  人工智能

  知识工程参考架构》国际标准草案

  专家组成员、中国计算机学会高级会员、

  中国计算机学会数据库专委会委员、中国中文信息学会语言与知识计算专委会委员、

  中国航空学会信息融合分会知识融合专业组组长、中国老年学和老年医学学会慢病远程与智能管理分会委员

  。

  研究方向为数据管理技术、知识图谱、推荐技术、数据分析及隐私保护技术。目前，担任《

  Frontier of Computer Science

  》的青年编委。在

  SIGMOD

  、

  SIGIR

  、

  AAAI

  、

  IJCAI

  、

  ICDE

  、

  WWW

  、

  ICWS

  、

  CIKM

  、

  DASFAA

  、

  APWuEB

  等国际重要学术会议上发表篇论文六十余篇，在

  IEEE TKDE

  、

  JWSR

  、

  WWWJ

  、

  JCST

  、《计算机学报》、《软件学报》等国内外学术期刊上发表论文五十余篇。主持科技部、工信部、国家自然科学基金委、人社部等国家级项目）和省部级项目

  20

  余项（包括

  5

  项国家自然科学基金项目、

  2

  项国家重点项目等），

  4

  次荣获省部级科技进步奖，

  9

  次获得会议优秀论文称号，获得发明专利

  17

  项，获得软件著作权

  22

  项，出版英文专著

  2

  本。在教学方面，获教育部产学合作协同育人项目，获国家出版基金资助。

  社会兼职

  IEEE 计算机分会

  会员

  ACM

  会员

  IEEE WOMAN

  会员

  上海市计算机学会数据库专委

  中国计算机学会数据库专委会（

  CCF-TCDB

  ）委员

  中文信息学会语言与知识计算专委会委员

  中国航空学会

  第十届理事会

  信息融合分会委员，知识融合专业组总体组组长

  《

  Frontiers of Computer Science

  》期刊 青年副编委

  上海市农业工程学会第五届监事会监事长

  上海市农业工程学会农业信息与物联网专业委员会副主任

  2024年CCF大模型论坛的第一届专委委员

  研究方向

  分布式图数据处理技术、知识图谱、序列推荐与序列数据分析、可解释性技术

  招生与培养

  开授课程

  本科生课程：

  1、《数据库系统原理》

  2、《数据库系统实践》

  研究生和博士生课程：

  1、《数据管理

  与系统》'
