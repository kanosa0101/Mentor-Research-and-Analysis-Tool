bio_raw: '张倩，博士，副研究员，博士生导师。

  主要从事机器学习和人工智能等研究工作，以及在计算机视觉和AI药物设计等领域的应用研究。

  主持1国家自然基金，3项上海市项目；参与面上、

  973

  项目等多项重大项目。

  主要承担《数字图像处理》、《计算机视觉》、《数字药物》等相关的课程。

  社会兼职

  IEEE Transactions on Geoscience and Remote Sensing, IEEE Journal of selected Topics
  in Applied Earth Observations and Remote Sensing,

  Remote Sensing,

  IEEE Geoscience and Remote Sensing Letters,

  International Journal of Remote Sensing, Photogrammetric Engineering & Remote Sensing

  等期刊审稿人

  研究方向

  人工智能

  计算机视觉

