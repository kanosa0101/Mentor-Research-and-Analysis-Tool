  学术成果

  硕士研究生毕业后获携程，TikTok和联想算法岗，及北美、澳洲（QS & U.S. News 全球前100）高校的全额博士奖学金，绝大多数的硕士研究生毕业时都已发表SCI
  1区/CCF A论文。

  所指导的全部全日制研究生均按期毕业，无一例延毕。

  非全日制同学因时间碎片化，按时毕业难

