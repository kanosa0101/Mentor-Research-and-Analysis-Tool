  1. 上海市徐汇区大数据中心 副主任  2018 - 2019

  2. 华东师范大学 留学归国人员联谊会 副会长  2018 - 至今

  3. ACM Asian and Low-Resource Language Information Processing (TALLIP)

  Associate Editors

  2017

  - 至今

  研究方向

  自然语言处理（NLP），自然语言理解（NLU）、人工智能、机器学习、深度学习、大数据分析与数据挖掘，以及在金融、互联网、医疗健康、海关、电商等多领域的智能系统构建与应用

  招生与培养

