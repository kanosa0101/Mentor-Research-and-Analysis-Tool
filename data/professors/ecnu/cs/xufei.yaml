bio_raw: '徐飞，华东师范大学计算机科学与技术学院教授、博士生导师、本科教学副院长。2007年、2009年和2014年在华中科技大学分别获得学士、硕士和博士学位。主要研究方向为云计算与分布式系统，近年来聚焦于面向AI基础设施的高效能资源管理。主持国家自然科学基金面上项目、青年项目、上海市科委重点项目、腾讯基础平台技术犀牛鸟专项研究计划、华为合作项目等多项课题。在IEEE
  TC、TPDS、TSC、TMC、Infocom、MLSys、Mobicom等国际期刊和会议上发表论文50余篇，获授权国家发明专利10余项，

  相关成果在阿里云PAI平台和腾讯公司容器系统中落地应用。

  曾获湖北省优秀博士学位论文奖、ACM武汉暨湖北省计算机学会优秀博士学位论文奖、CCFSys 2023最佳学生论文奖等学术荣誉。

