  研究方向

  1. Distributed Machine Learning Systems (分布式机器学习系统):

  Efficient job scheduling for LLM training and inference in deep learning clusters

  Communication scheduling optimization for distributed machine learning

  Task scheduling for performance optimization of DAG-style data analytics

  2. Predictable Cloud Computing (云计算性能保证):

  Resource (VMs & serverless functions) provisioning for predictable performance in
  the cloud

  Performance measurements, modeling, and optimization of representative cloud workloads
  (distributed DNN training, big data analytics, NoSQL databases, etc.)

  Live migration of virtual machines and containers

  3. Collaborative Cloud-Edge-Client Computing (云边端协同计算):

  Interference-aware and user-unaware container migrations

  Heterogeneous resource (

  GPU/other accelerators

  ) management in cloud-edge-client systems

  Energy-efficient mobile Web browser

