bio_raw: '计算机科学与技术专业

  博士，华东师范大学计算机科学与技术学院教授级高级工程师。

  中国计算机学会高性能计算专业委员会委员、上海市计算机学会高性能计算专业委员会副主任委员兼秘书长、全国高等学校计算机教育研究会青少年分会副理事长。

  主要研究方向是智能数据分析、高性能计算及医工交叉。主持及参与国家重点研发计划项目、国家自然科学基金项目、国家社科基金项目、上海市第二批元宇宙重大应用场景“揭榜挂帅”重点项目、上海市“科技创新行动计划”医学创新研究专项等多项国家级、省部级科研项目，近五年发表

  SCI

  、

  CCF

  等学术论文数十篇，获得多项发明专利授权和数十项软件著作权。主编“十四五”职业教育国家规划教材、全国高等学校计算机教育研究会“十四五”规划教材等多本出版物。荣获全国高等院校计算机基础教育研究会

  2025

  年度计算机基础教育“优秀教师奖”、

  2021

  年华东师范大学教学成果二等奖和

  2023

  年华东师范大学教学成果特等奖。

  社会兼职

  上海市计算机学会高性能计算专业委员会副主任委员兼秘书长

  中国计算机学会高性能计算专业委员会委员

  全国高等学校计算机教育研究会青少年分会副理事长

  研究方向

  智能数据分析

  高性能计算

  医工交叉

  招生与培养

  开授课程

  研究生选修课

  1. 高性能计算与并行计算 2021-

  2. 高性能计算与高性能计算集群架构 2018-2020

  3. 软件测试及软件质量管理 2014-2017

  本科生必修课

  1. 编程思维与实践

  2. 数据科学与数据智能实践

  3. 数字化创新与综合实践

  本科生通识课

  1. 数字世界的高性能计算'
