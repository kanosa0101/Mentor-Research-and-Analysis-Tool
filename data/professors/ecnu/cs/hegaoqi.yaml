  个人简介

  社会兼职

  [1] ACM SIGGRAPH会员；ACM SIGCHI会员；IEEE会员。

  [2] CCF计算机辅助设计与图形学专业委员会委员,秘书；CCF多媒体专委会委员；中国图象图形学会视觉大数据专委会委员，秘书；中国图象图形学会计算机动画与数字娱乐专委会委员。

  [3] 曾任SCI检索期刊Frontier of Computer Science的青年Associate Editor、上海计算机学会理事和上海计算机学会青工委副主任。

  [4] CCF YOCSEF上海荣誉委员。

  研究方向

  主要研究领域是计算机视觉、计算机图形学和AI4Science，与心理学、物理学开展深度交叉研究。具体包括：

  （1）多模态场景智能理解；

  （2）大数据

  交互可视分析

  和

  混合现实

  ；

  （3）知识驱动的场景仿真与数字孪生；

  （4）可控情感数字人生成；

  （5）面向工业和科学计算的大模型。

  欢迎具有

  扎实的数学基础、较强的编程能力、能够静下心来从事科学研究

  的学生加入我们的团队！特别欢迎对计算机图形学感兴趣的本科生、研究生联系我！

