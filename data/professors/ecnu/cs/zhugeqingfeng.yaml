  教育经历

  欢迎关注大数据智能系统团队实验室

  http://bdislab.tech/

  请注意：国际知名学者 沙行勉教授 诚招大数据智能系统与量子计算方向的研究生！沙老师已在华东师范大学全职工作，在此附上沙老师的信息如下：

  沙行勉老师，1992年美国普林斯顿大学计算机科学博士，长江学者，杰青，华东师范大学终身特聘教授（全职），大数据智能系统与量子计算方向领军人。沙老师与高科技产业界有多年的合作。沙老师主研“系统”方向，包含大模型系统结构、大模型推理加速、大模型与RAG专用知识库系统、大模型调度、量子计算系统的应用与优化、操作系统，多核及分布式系统，人工智能加速系统，嵌入式系统等。其总体目标是高效优化准确率、时间性能，功耗，和可靠性等设计参数。现在工业界急需系统方面的人才。诚挚欢迎有志在系统方向发展的学生进入团队学习和研究。学生会通过团队合作项目对系统领域获得全面的理解和实际的经验，所毕业的学生都受到各单位的高度认可。

  沙老师邮箱：edwinsha@cs.ecnu.edu.cn，

  欢迎联系！

