bio_raw: '诸葛晴凤

  教授，

  博士生导师

  。

  1992

  年本科毕业于复旦大学电子工程系；

  1996

  年获复旦大学硕士学位；

  后于

  2001

  年和

  2003

  年分别获美国德克萨斯大学达拉斯分校

  (University of Texas at Dallas, UTD)

  计算机科学硕士学位

  和

  博士学位，获

  最佳博士论文奖(Best Dissertation Award)。

  曾任

  Unisys

  公司高级信息顾问；

  Evavi

  公司科学家、资深系统架构师

  ，

  在学术界和工业界专业领域都有多年的从业经历，长期和海内外多所知名高校以及专家学者保持密切的国际学术合作与交流

  。

  诸葛教授在大模型多智能体AI系统、大模型+RAG专用知识系统优化、高性能并行与分布式系统、资源分配与调度、存算一体化系统、嵌入式系统、软硬件协同设计、人工智能加速器、

  量子机器学习、量子神经网络、量子线路优化、量子启发算法

  等领域做了大量的研究工作，很多成果处于国际前沿领先水平，在

  国际重要学术会议及国际核心期刊上发表学术论文220

  多篇，其中包括8

  0

  多篇的国际期刊论文(

  如

  IEEE Transactions,

  ACM Transactions或其他SCI期刊

  等)，多次在国际学术会议获得最佳论文奖或最佳论文提名，论文他引次数近32

  00多

  次，其中近五年他引次数超过1700多次，多篇论文被国际知名学者引用，研究成果已申请技术发明专利

  30

  多项，其中，国际专利

  8

  项。诸葛老师的

  研究获得多个国家级、省部级，以及企业界研究项目的支持，是国家科技部

  863

  项目负责人、自然科学基金项目负责人。欢迎有志向、有研究兴趣的学子加入团队。

  ---------------------------------------------------------------------------

  诸葛晴凤教授正在招收

  博士生

  和

  硕士生(学硕和专硕)

  ，欢迎有志向的学生报考，在活泼开放的

  氛围中，在老师的亲自指导之下，

  和国际化团队合作，提升实际动手能力，

  从事前沿的科学探索和研究，和实验室的师兄师姐们共同学习，一起进步。

  请在“

  计算机科学系

  ”报名网页登录你的信息，学科方向：计算机科学。

  诸葛教授邮箱：

  qfzhuge@cs.ecnu.edu.cn

  ，欢迎提前联系。

  ---------------------------------------------------------------------------

  社会兼职

  电气电子工程师协会

  IEEE

  会员

  国际计算机学会

  ACM

  会员

  中国计算机学会

  CCF

  会员

  研究方向

  多智能体AI专家系统、大模型压缩

  、

  量子机器学习、

  量子启发式算法、

  量子计算模拟、

  多量子芯片结构编译优化、

  并行与分布式计算、

  资源分配与调度

  、

  内存计算、

  嵌入式系统，软/硬件协同设计

  等。

  ---------------------------------------------------------------------------

  诸葛晴凤教授正在招收

  博士生

  和

  硕士生(学硕和专硕)

  ，欢迎有志向的学生报考，在活泼开放的

  氛围中，在老师的亲自指导之下，

  和国际化团队合作，提升实际动手能力，

  从事前沿的科学探索和研究，和实验室的师兄师姐们共同学习，一起进步。

  请在“

  计算机科学与技术学院

  ”报名网页登录你的信息，学科方向：计算机科学。

  诸葛教授邮箱：

  qfzhuge@cs.ecnu.edu.cn

  ，欢迎提前联系。

  ---------------------------------------------------------------------------

  诸葛晴凤教授目前担任大数据智能系统团队负责人。

  请注意国际知名学者沙行勉老师在大数据智能系统与量子计算实验室诚征研究生，他的信息如下：

  沙行勉教授、博导、华东师范大学终身特聘教授（全职），国家特聘专家、大数据智能系统与量子计算方向领军人。沙老师在多核并行和分布式系统、操作系统、软硬件协同设计、大数据系统及网络、嵌入式系统、优化算法设计等方面做世界一流的研究。同时，沙老师是多个国家级科研项目的主持人，和产业界有长期深度合作关系。诚挚欢迎保研和考研学生前来申请成为沙行勉老师的学生！

  沙教授邮箱：edwinsha@cs.ecnu.edu.cn，欢迎提前联系！

  招生与培养

  开授课程'
