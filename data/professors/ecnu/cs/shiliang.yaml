  石亮，

  华东师范大学，教授，博士生导师，上海创智学院全时导师，曾任上海市计算机学会存储专委主任。

  研究方向为存储系统和操作系统，面向大模型/人工智能、大数据/云计算、嵌入式系统/物联网以及移动终端等。长期从事各类操作系统、存储系统建设，并在闪存存储

  系统方面做出了大量的系统性的研究工作。研究工作获得了国家自然科学基金、国家

  863

  计划、上海市科委基金以及企业的资助，研究成果在包括

  FAST

  、

  ATC

  、

  MICRO

  、HPCA、

  DAC

  、

  MSST

  、

  TC

  、

  TCAD

