  百

  余篇

  ，ACM TECS, CCF THPC, JSA等

  期刊特刊主编

  ，

  TC

  、

  TPDS

  、

  TCAD

  、

  DAC

  、ESWEEK、

  ASP-DAC

  等国际期刊和会议审稿人和会议

  程序委员会成员

  。凭借其在操作系统和存储系统领域的贡献，曾

  两次入选华为年度技术成果奖

  。本人已有多位研究生毕业就职高校和企业，包括厦门大学、湖南大学、电子科大、华为、三星、腾讯、中国移动等单位。

  主要研究方向：

  存储系统和操作系统，包括

  大模型/人工智能

  、大数据/云计算、嵌入式系统/物联网以及移动终端等

  。

  中国计算机学会CCF任职：

  CCF YOCSEF上海2025-2026主席、CCF上海执行委员、

  CCF

  信息存储专委常务委员、CCF系统软件专委执行委员、CCF体系结构专委执行委员、CCF杰出会员、上海市计算机学会存储专委20-24届主任

  。

  博士生招生（长年有效）

  NEW!

  招收博士生，研究方向为操作系统、存储系统（可以推荐上海创智学院，待遇优厚）。

  硕士生招生（长年有效，考研+保研，每年3-4个名额）

  NEW!

  招收考研并已经获得资格的学生，保研学生，研究方向为操作系统、存储系统，面向大模型/人工智能，云计算/大数据，移动终端、嵌入式系统/物联网等。

  不管你来自哪所学校，只要你对系统，特别是操作系统抱有热情，请直接联系我：lshi@cs.ecnu.edu.cn

  本科

  生

  实习招募（长年有效）NEW！

  拟招募3~4名研究实习生，从事智能计算机系统技术研究。

  对象：

  华师大大三学生。

  要求：

  学有余力，积极主动，对计算机系统，特别是操作系统有较高的兴趣，并且有较强的自我驱动力和责任心，实习时间一年。

  欢迎感兴趣的同学发邮件报名：lshi@cs.ecnu.edu.cn

  招生信息：

  每年有3-4名硕士研究生以及1-2名博士生招生名额，欢迎有志于计算机系统研究的同学申请。

  本课题组的最大特点是国际化、个性化、学术化，提供个性化指导。每个学生均享有以下机会：

  1 参与顶尖课题

  ：

  参与顶尖科研课题，接触最前沿的科学技术。

  系统方向找工作常年排名第一

  ；

  2 参加国际会议：

  参与国际会议，与领域大牛面对面交流，拓展眼界和视野；

  3 无忧研究生活：

  课题组科研项目经费充足，进入课题组后按月发放科研补助；

  4 国际交流机会：

  课题组均有去往美国、香港、台湾、新加坡等地方参与短期学术交流的机会；

  5 继续深造机会：

  课题组不仅仅招收博士生，还会为同学提供海外博士生推荐机会。

  石亮老师有充足的名额，无论你来自哪所学校，都非常欢迎联系申请: lshi@cs.ecnu.edu.cn。

