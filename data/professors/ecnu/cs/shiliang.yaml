  学术成果

  本人目前主要负责两个主要方向的研究工作：

  1 面向大模型和高性能诉求场景的存储系统研究

  ，设计高可靠、高性能、高性价比的存储系统，应对大模型、大数据、云计算等存储需求。在此方面发表论文超过100篇，主持国家自然科学基金多项；

  2 面向移动终端和嵌入式设备的存储系统研究

  ，设计面向移动终端、具身智能等场景，实现用户体验优化、设备寿命、性能改进的软硬件系统。在此方面发表论文超过80篇，主持企业重点合作项目超过10项，两次获得企业年度优秀技术成果奖。

