bio_raw: '招收2027年秋季入学的硕士生、直博生，也欢迎对科研感兴趣的本科生参与日常科研。

  研究方向：数据可视化、计算机图形学、物理仿真、物理AI、城市计算、

  智能交互

  等。

  老师简介

  李晨辉博士

  ，华东师范大学计算机科学与技术学院

  教授

  、

  博士/

  硕士生导师、

  国家人工智能学院

  上海创智学院

  兼职导师。博士毕业于香港理工大学。研究兴趣包括数据可视化、计算机图形学、物理仿真、物理AI、世界模型等。主持国家自然科学基金项目、国家重点研发专项子课题、上海市科技创新项目课题、华为合作

  项目

  、华鑫股份合作项目、CCF网易联合基金等。近年来在IEEE VIS、IEEE TVCG、ACM CHI、ACM MM、IEEE VR、CVPR、NeurIPS、ICML、Pacific
  Graphics、SiggraphAsia Visualization等期刊及会议上发表论文50余篇（CCF A类论文30余篇）；担任ChinaVis2024-2025会议论文主席，IEEE
  VIS、CVPR、ECCV、VINCI、CVM、CADCG等会议的PC，担任CADGraphics2023会议程序委员会秘书，参与组织ChinaVis2018、VINCI2019、CADCG2023、GDC2023会议；担任20余个国际期刊及会议的审稿人，VCIBA国际期刊青年编委；曾2次获得国际学术会议最佳论文奖，1次获得国际学术会议最佳论文提名，CAD/CG2024会议最佳海报论文奖，2020年度上海市科技进步特等奖，2022年度上海市高等教育教学成果二等奖，2023年度华东师范大学能达奖教金，2024年度上海市计算机学会科学技术奖二等奖（科技进步奖）。个人主页：

  http://chenhui.li

  。'
