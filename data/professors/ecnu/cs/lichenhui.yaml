bio_raw: '个人简介

  招收2027年秋季入学的硕士生、直博生，也通过校卓越工程师学院招人工智能方向校企联培硕士生，同时欢迎对科研感兴趣的本科生参与日常科研。

  研究方向：数据可视化、计算机图形学、物理仿真、物理AI、城市计算、

  智能交互

  等。

  老师简介

  李晨辉博士

  ，华东师范大学计算机科学与技术学院

  教授

  、

  博士/

  硕士生导师、

  国家人工智能学院

  上海创智学院

  兼职导师。博士毕业于香港理工大学。研究兴趣包括数据可视化、计算机图形学、物理仿真、物理AI、世界模型等。主持国家自然科学基金项目、国家重点研发专项子课题、上海市科技创新项目课题、华为合作

  项目

  、华鑫股份合作项目、CCF网易联合基金等。近年来在IEEE VIS、IEEE TVCG、ACM CHI、ACM MM、IEEE VR、CVPR、NeurIPS、ICML、Pacific
  Graphics、SiggraphAsia Visualization等期刊及会议上发表论文50余篇（CCF A类论文30余篇）；担任ChinaVis2024-2025会议论文主席，IEEE
  VIS、CVPR、ECCV、VINCI、CVM、CADCG等会议的PC，担任CADGraphics2023会议程序委员会秘书，参与组织ChinaVis2018、VINCI2019、CADCG2023、GDC2023会议；担任20余个国际期刊及会议的审稿人，VCIBA国际期刊青年编委；曾2次获得国际学术会议最佳论文奖，1次获得国际学术会议最佳论文提名，CAD/CG2024会议最佳海报论文奖，2020年度上海市科技进步特等奖，2022年度上海市高等教育教学成果二等奖，2023年度华东师范大学能达奖教金，2024年度上海市计算机学会科学技术奖二等奖（科技进步奖）。个人主页：

  http://chenhui.li

  。

  科研项目

  2026-2029 国家自然科学基金面上项目，多模态模型驱动的地理空间数据主动式可视化方法研究

  2026-2027

  华为技术有限公司校企合作项目

  2026-2027 CCF网易雷火联合基金项目

  2024-2027 上海市自然科学基金面上项目，城市时空数据自适应可视问答关键技术研究

  2024-2025 华为技术有限公司校企合作项目

  2024-2025 国家重点研发专项课题

  2023-2025 上海市长三角科技创新共同体领域项目课题, 河网生态流量智能调度数字孪生可视化研究

  2021-2025 校企合作-智能金融科技科研课题

  2019-2021 国家自然科学青年基金项目，基于核密度估计的大规模空间流数据可视化关键技术研究

  2019-2021 校企合作-智能大数据处理项目

  2019-2019 华东师范大学青年教师科研能力提升项目

  2018-2021 晨晖学者科研启动基金

  2018-2019 商汤科技—教育部产学合作协同育人项目

  2016-2017 香港IGRF PolyU 152142/15E项目-流数据的交互分析研究'
