title: 教授
bio_raw: 李斌，复旦大学计算与智能创新学院教授、博士生导师，上海高校特聘教授（东方学者），曾任澳大利亚联邦科学与工业研究组织（CSIRO）高级研究科学家。长期从事机器学习与视觉认知理论方法研究及其在物理场景理解、抽象视觉推理、多模态大数据分析中的应用。在人工智能权威期刊与顶级会议上发表论文百余篇，担任机器学习三大会领域主席（Area
  Chair）；授权发明专利10余项。目前担任学院人工智能教学团队负责人与交叉融通人才培养专项工作小组负责人。
