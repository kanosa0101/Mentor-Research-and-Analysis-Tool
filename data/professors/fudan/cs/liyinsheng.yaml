title: 副教授
bio_raw: 副教授，博士生导师，IEEE TCBIS主席，电子商务交易技术国家工程实验室联合发起人，数字化设计与制造专委会副主任委员，IEEE Senior
  Member，《SOCA》责任主编、《IJCSE》副主编。先后主持国家重大项目/课题、国际合作、省部及企业项目20余项，主笔或参与现行国家及行业标准6项、专利及软件50余项、论文60余篇，形成的算法模型众智工厂、基于拟态智能体的严肃游戏、反洗钱及供应链金融欺诈识别、虚拟仿真实训、学情/会情/赛情智能分析系统已产品化、部分成为行业龙头，获上海市、中物联等多项科技进步奖，主笔或参与跨境电商/贸易/供应链等领域国家及省市政策咨询、提供了重要政策借鉴。
