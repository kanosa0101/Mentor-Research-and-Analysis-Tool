bio_raw: 复旦大学青年副研究员、硕导，主要研究方向为系统安全、认证安全和AI应用安全等，在网络空间安全国际顶会IEEE S&P、USENIX Security、ACM
  CCS、NDSS发表论文10余篇，获网安顶会NDSS 2025、USENIX Security 2022杰出论文奖，以及CCS 2020最佳论文提名、USENIX
  Security 2025杰出论文提名奖。主持国家重点研发计划子课题、自科基金青年项目、博新计划、腾讯企业合作等多个项目，获上海市技术发明一等奖、国家漏洞库CNVD最具价值漏洞奖、CCF自然科学二等奖、上海市计算机学会自然科学一等奖、华为优秀技术成果奖等，相关研究推动形成人脸识别认证安全国家标准1项、全国信安标委人工智能标准化白皮书1项。指导学生获中国研究生网络安全创新大赛一等奖、工信部CAPPVD移动安全优秀案例、数字中国创新大赛移动互联网安全全国金奖、网安学院创新资助等。
