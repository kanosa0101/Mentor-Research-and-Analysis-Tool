title: 副教授
bio_raw: 复旦大学计算智能与创新学院副教授、博士生导师，主要研究方向为自然语言处理和机器学习。美国麻省理工学院International Faculty Fellow，加州大学洛杉矶分校访问学者。目前在Computational
  Linguistics、ICML、NeurIPS、ICLR、ACL、EMNLP等自然语言处理和人工智能领域的顶级国际会议和期刊发表论文80余篇。主持和参与多项国家自然科学基金、国家重点研发计划。获得过吴文俊人工智能科学技术进步奖、教育部技术发明奖、日内瓦国际发明银奖和入选了“高校计算机专业优秀教师奖励计划”。
