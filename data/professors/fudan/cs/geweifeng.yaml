title: 副教授
bio_raw: 戈维峰，复旦大学计算与智能创新学院副教授。于华中科技大学、清华大学、香港大学分别获学士、硕士与博士学位，并于2020年荣获香港大学李嘉诚奖和杰出研究生奖提名。主要研究领域包括计算机视觉、认知计算和人形机器人通用智能，在视觉感知理解、知识快速学习及多模态认知推理等方面取得了一系列科研成果。迄今为止，已在人工智能顶级会议和期刊上发表学术论文40余篇，涵盖IEEE
  Trans和ACM Trans期刊，如TIP、TOG、TMM、TCSVT，以及国际人工智能顶级会议，如CVPR、ICCV、ECCV、NeurIPS、AAAI、ACMMM和ACL等。主持了国家自然科学基金委青年项、上海市科委新一代信息技术重点专项、复旦大学计算机学院优秀青年培育计划等多个项目，参与了科学技术部重点研发计划课题，并入选了复旦大学战略人才培育计划、上海市浦江人才计划和上海市领军人才计划。现担任中国计算机学会青年精英论坛（YOCSEF）上海学术委员，上海计算机学会多媒体专委会秘书长，中国图象图形学学会视觉大数据专委会以及中国人工智能学会具身智能专业委员会委员。曾担任国际顶级期刊IEEE
  TIP、IEEE TNNLS、IEEE TMM和IEEE TCSVT等审稿人，以及国际学术会议CVPR、ICCV、ECCV、AAAI、NeurIPS、ICML、ICLR等程序委员会委员。
