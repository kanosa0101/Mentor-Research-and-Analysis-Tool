title: 讲师
bio_raw: '张向东，复旦大学计算与智能创新学院高级讲师，计算机基础教研室主任。

  研究方向：人工智能神经网络。

  长期从事计算机基础教学工作，复旦AI大课“Python程序设计”和“C程序设计”课程负责人。

  编写过多套国家级规划教材。主持和参与多项上海市重点课程建设和教改项目。

  全国高等院校计算机基础教育研究会常务理事。

  上海市计算机基础教育协会常务理事，副秘书长。

  上海市信息等级考试命题组成员。'
