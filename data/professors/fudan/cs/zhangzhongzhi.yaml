bio_raw: 章忠志，复旦大学计算与智能创新学院教授、博士生导师。主要研究方向为图学习理论与算法、图数据挖掘、社交网络分析、网络科学。在包括TIT、TKDE、TIFS等在内的IEEE汇刊，以及SODA、SIGMOD、KDD、NeurIPS、WWW、ICDE、IJCAI、AAAI等在内的会议上发表论文200余篇。2020年起连续入选爱思唯尔“中国高被引学者”榜单。曾获Wilkes奖、CCF自然科学二等奖（第一完成人）等荣誉。指导20余名研究生获上海市与复旦大学优秀博士/硕士学位论文奖、优秀毕业生称号。指导近20名本科生赴Princeton、Stanford、Cornell、UPenn等世界名校攻读博士学位。
