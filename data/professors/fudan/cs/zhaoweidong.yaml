bio_raw: 2001年于东南大学获博士学位，后进入复旦大学博士后流动站，，主讲深度学习及其应用等课程，2011年赴纽约大学访学。获上海市教学成果奖、上海市教师教学创新大赛一等奖，主持国家一流课程，入选高校计算机专业优秀教师奖励计划。主持国家自然科学基金、企业合作等课题40余项，发表论文100多篇，出版《商务智能（第6版）》《机器学习（第2版）》等教材专著10余部，获上海市科技进步二等奖。持有CDA三级数据科学家认证，为华为、阿里云等企业认证专家。
