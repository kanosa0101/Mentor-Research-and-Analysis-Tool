bio_raw: 复旦大学计算与智能创新学院教授、博导。主要研究方向为多媒体内容安全、多媒体内容生成、人工智能安全，在知名国际期刊和会议如IEEE TPAMI、IEEE
  TIP、IEEE TIFS、IEEE TDSC、NDSS、NeurIPS、CVPR、ICCV等发表论文 100 余篇。获得了上海市科技进步二等奖、中国科技产业化促进会科技创新二等奖，以及IEEE
  WIFS、IEEE MMSP、世界人工智能大会等多个会议的最佳论文奖或提名奖。主持了国家自然科学基金面上/青年项目、国家重点研发计划子课题、国家自然科学基金重点项目子课题等国家级项目，以及上海市青年科技英才扬帆计划、阿里巴巴创新研究计划、CCF-蚂蚁专项基金等省部级和企业合作项目，研究成果被IEEE
  Spectrum等国际知名科技媒体专题报道。
