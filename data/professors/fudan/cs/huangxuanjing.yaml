title: 特聘教授
bio_raw: 黄萱菁，复旦大学特聘教授，国家级领军人才。主要从事人工智能、自然语言处理和大语言模型研究。兼任中国计算机学会理事/自然语言处理专委会主任、中国中文信息学会理事、国际计算语言学学会执委/亚太分会主席。在国际重要学术刊物和会议发表论文200余篇，被引3万余次，8次入选优秀论文奖。获钱伟长中文信息处理科学技术奖、人工智能全球女性学者、全球前2%顶尖科学家、福布斯中国科技女性、上海市育才奖、复旦大学“钟扬式的好老师”、复旦大学“研究生心目中的好导师”、复旦大学“廖凯原最受欢迎教师奖”等多项荣誉。
