title: 教授
bio_raw: 复旦大学计算与智能创新学院教授，博士生导师，于复旦大学获学士、硕士和博士学位，复旦大学程序设计竞赛队教练。研究兴趣包括大模型、AI算法、大数据和数据科学，作为项目负责人主持国家863课题、国家自然科学基金项目和企业合作项目等数十项。曾获上海市科技进步奖特等奖、任圆通速递专家工作站首席专家。指导学生曾获上海市优秀硕士学位论文、ACM
  SIGMOD China优秀博士论文、ACM SIGSPATIAL China优秀博士论文。曾获上海市育才奖、谷歌奖教金、复旦大学优秀研究生导师等荣誉。任中国大学生程序设计竞赛组委会副主席、教育部“101”计划课程建设组专家。
