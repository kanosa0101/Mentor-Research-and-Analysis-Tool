title: 教授
bio_raw: 赵进，教授，研究方向主要包括网络系统结构、等。在网络领域的重要国际期刊和会议上发表学术论文50余篇。作为项目负责人，研究工作得到了国家自然科学基金、重点研发计划、知名互联网企业的资助。担任网络领域多个知名期刊和会议的编委或TPC、如IEEE
  Transactions on Network and Service Management的编委、IEEE INFOCOM 等会议的程序委员会委员。担任ACM
  MobiCom 2025出版主席，NoF 2022 Demo共同主席，CNSM 2022 Student Travel Grants共同主席。获得过上海市科技进步一等奖、上海市自然科学二等奖等。
