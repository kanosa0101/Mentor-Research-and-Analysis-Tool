bio_raw: 复旦大学计算机博士、学院学科科研办主任。主讲的《程序设计》获评第二批国家一流本科（线上线下混合式一流课程）、上海高等学校一流本科课程（线上线下混合式一流课程）、复旦大学优秀课程思政示范课程；参与全国高等学校计算机教育研究会标准编写。主持教育部首批新文科研究与改革实践项目“融合现代金融工程技术的‘以学为中心’教学方法创新与实践”。主要研究领域为网络与系统安全、移动智能媒体。近5年参与两项国家科技部重点研发计划、一项国家自科基金面上项目、一项上海浦东新区产学研项目，获评“2020年中国产学研合作创新与促进奖”二等奖。在重要国际会议、国内核心期刊上发表论文多篇。
