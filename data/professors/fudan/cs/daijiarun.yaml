bio_raw: 研究方向为智能系统安全攻防，在IEEE S&P、USENIX Security、ACM CCS、NDSS等国际顶级会议上发表多篇高水平研究论文，面向多类型智能系统研制动静态漏洞挖掘、漏洞分析与漏洞治理工具，在热门智能体、智能设备、智能手机、智能驾驶系统等关键目标上累计挖掘千余例零天漏洞，获多项国内外网络安全攻防赛事冠军，相关技术支撑华为、阿里等头部企业的安全平台研制，服务上海市数字政务系统的安全治理工作。
