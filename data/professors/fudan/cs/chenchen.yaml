bio_raw: '陈辰，博士，复旦大学高级工程师。研究领域为深度学习和大数据分析。国家重点研发项目子课题负责人，作为主要骨干参与了包括国家自然科学基金重点、面上项目在内的多个研究项目。

  研究领域包括人工智能和大数据分析等，围绕大模型智能体开展了深入研究，并取得了诸多成果。

  所指导的复旦大学信息安全竞赛队伍六星战队多次在国内、国际竞赛中获奖。'
