bio_raw: 教授、博导，长期从事软件系统研究，曾主持、参与多项国家自然科学基金项目、973项目及重点研发项目。其研究成果发表于百余篇国际学术论文，包括近三年来在领域顶级国际出版物OSDI、SOSP、FSE、ICSE、CSCW等发表的多篇论文。他曾获上海市、中国计算机学会和上海市计算机学会的多项奖项，以及
  2021 年度ACM（国际计算机学会） SIGSOFT杰出论文奖和 2024 年度ACM CSCW多元、平等与共融奖。他的学术成果兼具产业转化价值，已在腾讯、华为、美团等头部企业落地应用，是多项专利的发明人，并因技术长期落地效果获颁美团时间检验奖。他目前任全国信息技术标准化技术委员会用户界面分技术委员会委员，中国计算机学会信息存储专委会委员，上海市计算机学会教育信息化专委会副主任委员。
