title: 教授
bio_raw: 邱锡鹏，复旦大学教授，上海创智学院全时导师，中国人工智能学会会士，获得国家基金委青A、青B项目资助，主要研究方向为大语言模型和智能体，主持研发了MOSS等多个高影响力大模型，连续入选中国高被引学者、全球前2%顶尖科学家榜单。获得钱伟长中文信息处理科学技术奖一等奖，教育部“高校计算机专业优秀教师奖励计划”，CCF-ACM青年科技奖等奖励。著作《神经网络与深度学习》被上百家高校作为教材。
