bio_raw: 危辉，1998年毕业于北航计算机系，先后师从怀进鹏院士和何新贵院士，获工学博士学位。同年9月进入浙江大学计算机系，师从潘云鹤院士进行博士后研究，2000年出站进入复旦大学计算机科学技术系。自1993年起从事非单调推理与形式逻辑研究，1995年后从事类脑计算研究。发表SCI期刊论文近百篇，其中近二年在IJCV、TIP、TRO、TVCG、TGRS、TMM上发表超长文七篇。出版由独立研究形成的专著《人工智能形式概念系统》、《认知相关性与智能模型构造的系统观点》和《类脑计算》。
