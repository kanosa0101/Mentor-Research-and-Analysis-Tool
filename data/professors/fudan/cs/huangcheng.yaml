title: 研究员
bio_raw: 复旦大学计算与智能创新学院，青年研究员、博士生导师，国家级青年人才，博士毕业于加拿大滑铁卢大学电气与计算机工程专业，研究方向为数据隐私和人工智能安全，发表IEEE
  Trans/中科院一区/CCF-A类论文50余篇，出版学术专著1部，5次获最佳会议论文奖，谷歌引用2500余次，H因子29，主持/参与国家自然科学基金青年项目、面上项目等项目；担任IEEE
  TDSC, IoTJ等期刊编委和ICC等国际知名会议的Symposium Co-Chair。
