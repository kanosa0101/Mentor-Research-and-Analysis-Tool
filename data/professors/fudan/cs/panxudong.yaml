bio_raw: 研究方向为大模型安全与治理，过去五年间，围绕大模型安全合规评估、智能体安全攻防、前沿AI风险治理三方面开展系统性前瞻研究，在包括TPAMI、ICML、NeurIPS、IEEE
  S&P和USENIX Security在内的人工智能和网络安全领域国际顶会顶刊发表论文数十篇，率先揭示多种商用大模型重大安全风险，得到OpenAI、Google、Anthropic等企业重视。入选2024年上海市“晨光计划”、2024年世界人工智能大会WAIC云帆奖（海内外AI领域遴选10名）、2023年ACM中国计算机安全分会优博奖、华为“天才少年”（最高档）。主持大模型安全相关的国家重点研发计划课题、国家自然科学基金青年项目、百度合作项目等多项科研项目。
