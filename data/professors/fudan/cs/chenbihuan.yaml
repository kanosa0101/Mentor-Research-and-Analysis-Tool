title: 副教授
bio_raw: 复旦大学计算与智能创新学院副教授。主要研究方向包括软件安全、AI系统工程等。主持两项国家自然科学基金项目和多项企业合作项目，参加科技创新2030-“新一代人工智能”重大项目。研究成果发表在ICSE、FSE、S&P、SEC、TSE、TIFS等国际会议和期刊，获2023年NASAC青年软件创新奖、4次ACM
  SIGSOFT杰出论文奖、2次IEEE TCSE杰出论文奖。研制了开源风险治理平台伏羲，获中国信通院软件供应链安全社区2023年优秀自主研发创新成果案例。担任ICSE、FSE、ASE、ISSTA等国际会议程序委员会委员。
