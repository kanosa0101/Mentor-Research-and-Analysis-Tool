title: 教授
bio_raw: '复旦大学计算与智能创新学院副院长、教授，国家级高层次人才计划入选者。中国计算机学会杰出会员、软件工程专委会副主任、开源发展委员会常务委员，中国汽车工程学会汽车基础软件分会副主任，《Journal
  of Software: Evolution and Process》联合主编，《ACM Transactions on Software Engineering
  and Methodology》、《软件学报》等期刊编委。获“NASAC青年软件创新奖”及“中创软件人才奖”，入选上海市东方英才拔尖项目。研究方向包括软件智能化开发、云原生与AI原生系统、智能汽车与智能制造基础软件等。'
