bio_raw: 复旦大学计算与智能创新学院教授、博士生导师，中国自动化学会普及工作委员会主任。研究方向包括人工智能、图像处理、生物认证、智能交通等。连续五年（2021—2025）入选全球前2%顶尖科学家榜单终身科学影响力排行榜，谷歌学术引用万余次。著有《人工智能的边界》《人工智能极简史》《爱犯错的智能体》《高质量读研》等书。其中《人工智能的边界》入选25年中国好书8月专榜。《人工智能极简史》2024
  年获第十九届文津图书奖提名图书（科普类）；《爱犯错的智能体》2020 年获第六届中国科普作家协会优秀科普图书金奖；《高质量读研》重印近20次，广受读者好评。
