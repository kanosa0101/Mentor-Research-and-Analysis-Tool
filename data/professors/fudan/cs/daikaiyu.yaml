title: 教授
bio_raw: 教授，中国计算机学会杰出会员，复旦大学教师教学发展中心特邀研究员。研究方向为智慧教育。入选全国首届“高校计算机专业优秀教师奖励计划”；负责课程获评国家级一流本科课程，上海市一流本科课程（2门），上海市本科重点课程（3门）等；获得上海市教学成果奖二等奖，首届复旦大学教师教学创新大赛一等奖等。获评复旦大学年度十佳教师和“钟扬式好老师”，“廖凯原最受欢迎教师”，本科毕业生“我心目中的好老师”。
