bio_raw: 曹袖，男，1968年生，复旦大学计算与智能创新学院高级工程师、硕士生导师。先后在复旦大学获理学学士和硕士学位。长期从事计算机网络、分布式系统、电力自动化、智能电网、电力大数据和人工智能、社会计算等方向的科研、应用系统研发和教学工作。主要成果包括：科研及教学获奖19项（含9项省部级奖），负责或参与完成的研究项目及应用系统开发100余项，发表核心或EI及以上刊物和会议论文40余篇，获授权专利20余项，主编参编专著5本。
