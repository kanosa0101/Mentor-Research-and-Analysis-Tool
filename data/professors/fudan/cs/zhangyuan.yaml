bio_raw: 教授、博导，国家级青年人才，主要研究方向为软件安全，研究工作获USENIX Security 2022杰出论文奖、ACM SIGSOFT 2024杰出论文奖、IEEE
  S&P 2025杰出论文奖、ACM CCS 2025杰出论文奖，部分研究成果应用于华为、阿里、OPPO、vivo等公司，获华为优秀技术成果奖、阿里巴巴优秀技术合作项目、OPPO产学研优秀合作伙伴、vivo最佳安全技术合作伙伴奖。带领复旦白泽战队获得国内外顶尖安全攻防赛事20余次冠军，发现大量真实软硬件系统高危漏洞，获2021年国家信息安全漏洞库最具价值漏洞奖。
