bio_raw: 复旦大学计算与智能创新学院教授、博导。研究方向包括编码与密码，隐私计算等。2021-2024年度连续入选全球前2%顶尖科学家榜单。入选上海市东方特聘教授。曾主持国家自然科学基金面上基金，上海市青年科技启明星计划等。曾获上海市科技进步一等奖，党政机要密码科技进步三等奖。担任IEEE
  Transactions on Communications编委。
