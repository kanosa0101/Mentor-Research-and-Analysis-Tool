bio_raw: 肖仰华博士，复旦大学教授、博导，上海市数据科学重点实验室主任。长期从事大数据、认知智能研究。 荣获ICDE2024十年最有影响力论文奖、ACL 2025/2023杰出论文奖。发表
  CCF-A 、B 类等论文 300 余篇。出版学术专著与教材三部。完成五十多项政府及人工智能头部企业研发项目。荣获包括华为、阿里、美团等机构授予的科研奖项二十多项。担任
  Applied Intelligence 等多个国际期刊副主编或编委。
