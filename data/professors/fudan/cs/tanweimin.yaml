title: 教授
bio_raw: 谭伟敏博士，复旦大学计算与智能创新学院教授/博士生导师，上海市智能信息处理重点实验室副主任、复旦大学-江南造船“船舶+AI联合实验室”副主任，入选2024上海市东方英才计划青年项目。研究方向人工智能、AI
  for Science。在Nat. Methods、Nat. Biomed. Eng.、Nat. photonics、Nat. Commun.、Engineering、IEEE
  Trans.汇刊等国际期刊和CCF A类会议发表论文40余篇。研究成果获2024年全国颠覆性技术创新大赛优胜奖、2020年教育部自然科学二等奖，得到了央视新闻、中国科学报头版、东方卫视等官方媒体报道。主持国家自然科学基金面上项目、青年科学基金、国家重点研发计划项目课题、上海自然科学基金滚动支持等。
