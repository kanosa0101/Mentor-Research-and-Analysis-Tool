bio_raw: 研究领域涉及数据科学、大数据、数据挖掘、信息安全等方面的研究。作为主要人员参加过30余项国家自然科学基金项目、国家863计划项目、国家教委项目以及上海市科委项目，先后获得过中国高校科学技术二等奖1项，上海市科学技术奖科技进步二等奖3项，中国智能交通协会科学技术二等奖1项。发表论文12篇，参与编写著作8册。
