bio_raw: '徐跃东，复旦大学人工智能创新与产业研究院教授、博导。上海创智学院兼职导师、深圳河套学院双聘教授。

  研究方向为大模型训练与推理系统、强化学习后训练算法与系统、智能体系统、大模型安全对齐等（与互联网企业合作密切，主要从事人工智能基础设施技术研究）。博士毕业于香港中文大学，曾在法国国家自动化与计算机研究院、德国哥廷根大学等从事博士后和访问研究。获得上海市东方英才拔尖计划奖励

  (2025)

  、日本大川基金会研究助成奖

  (2019)

  、复旦大学比亚迪奖教金

  (2024)

  ，上海唐君远教育基金会

  -

  教师君远奖

  (2023)

  、复旦大学本科生“我心目中的好老师”提名奖

  (2022)

  。代表性论文发表在包括

  IEEE/ACM ToN, IEEE JSAC, USENIX NSDI, USENIX ATC, ACM Mobisys, ACM Mobihoc, ACM
  CoNEXT, IEEE Infocom

  等国际期刊和会议上。担任

  IEEE Trans. Network Science and Engineering

  的

  Associate Editor

  ，担任

  Mobihoc, IJCAI, ICDCS, ICNP

  等著名会议的程序委员会委员。课题组本科生获得

  Yale

  、

  Duke

  、

  UCLA

  等学校的博士生全奖，硕士生多名获得复旦大学

  /

  上海市优秀毕业生和国家奖学金，（合作）指导的博士生获得上海市信息学会优博和

  ACM SIGCOMM China

  优博等。详细情况请访问：

  https://ydxu2025.github.io'
