bio_raw: 智能化软件工程与系统实验室副教授，硕导。2001年获清华大学博士。2001-2002 新加坡国立大学博士后，2003-2004金蝶软件研究员，2006-2012年用友软件兼职ERP应用研究与系统集成总监。主要研究方向为工业数据挖掘、工业应用软件、工业AI应用。先后承担完成国家自然科学基金、国家重点研发计划项目、国家863计划等8项，省部级项目7项，企业项目40余项。发表五十余篇学术论文。
