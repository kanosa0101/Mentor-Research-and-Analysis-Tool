title: 副教授
bio_raw: 刘乐茂，复旦大学副教授；2013年博士毕业于哈尔滨工业大学，随后在纽约城市大学进行博士后研究，2014年就职于日本国立信息通信研究机构(NICT)，2017年至2025年于腾讯先后担任高级研究员和专家研究员。到目前为止，在ACL,
  EMNLP, NAACL, NeurIPS, ICLR, TPAMI等CCF-A/B类会议和刊物上发表论文90多篇，谷歌学术引用5000+次；研究成果曾获得ACL2021杰出论文奖和中国计算语言学大会(2020)最佳展示奖。
