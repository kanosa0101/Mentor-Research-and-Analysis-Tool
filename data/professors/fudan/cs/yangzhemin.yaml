bio_raw: 复旦大学计算与智能创新学院副教授，博导。研究方向包括漏洞挖掘技术、人工智能系统安全、移动安全等。在网络空间安全四大顶级国际会议上发表论文20余篇，多篇论文入选顶会杰出论文或焦点论文。相关工作被315晚会、美国纳斯达克官网等主流媒体专题报道。发现的高危漏洞受到有关部门和企业的高度重视，并被国家互联网应急中心授予“2021年最具价值漏洞奖”。获评2024年度新耀东方风采人物，并作为主要完成人获上海市技术发明奖一等奖。
