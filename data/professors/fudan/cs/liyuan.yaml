title: 副研究员
bio_raw: 李元，青年副研究员、硕士生导师。2011 年本科毕业于复旦大学，2017 年于芝加哥大学计算机系获博士学位。博士毕业后曾在美国加州谷歌云计算部门担任软件工程师。目前的研究方向为计算复杂性理论与编码理论，尤其关注两者交叉领域中的关键问题，如纠错码编码的计算复杂性等。相关研究成果发表于
  IEEE Transactions on Information Theory, FOCS, SIAM Journal on Computing, Information
  and Computation, Designs, Codes and Cryptography, COCOON 等会议与期刊。主持国家自然科学基金青年项目“超低深度超级浓缩器的构造和应用”以及华为胡杨林基金项目“纠错码高效编码电路的构造”。
