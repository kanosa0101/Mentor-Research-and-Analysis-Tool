bio_raw: 复旦大学计算与智能创新学院教授、博导，本科至博士毕业于中国科学技术大学，入选国家高层次人才计划，担任文化和旅游部重点实验室副主任。主要从事多媒体信息安全、人工智能安全与应用等方面的研究，主持国家自然科学基金重点、国家重点研发计划课题等各类项目30余项，在IEEE
  TPAMI, TIFS, TMM, TDSC, TIP, TCSVT, TCYB, TASLP, TCC, TNSE; CVPR, ICCV, AAAI, IJCAI,
  NeurIPS, ACM MM等重要期刊和会议上发表学术论文200余篇，担任IEEE TCYB, IEEE TCSVT, IEEE TASLP, SP, JVCI、中国图象图形学报等多个著名期刊的编委，担任ACM
  MM, IEEE ICME等国内外学术会议的领域主席，编著图书《多媒体安全基础导论》、《多媒体与人工智能安全极简综述》、《计算机教授白话人工智能》、《计算机教授跟孩子聊AI与艺术》、《计算机教授给孩子讲历史》等。研究成果在多家单位获得应用，获得上海市自然科学奖一等奖、上海市科技进步二等奖、文津图书提名奖等奖项。
