bio_raw: 颜波博士，复旦大学计算与智能创新学院教授/博导、教育部长江学者。现任复旦大学计算与智能创新学院学术委员会副主任、计算机科学与技术一级学科负责人和博士后流动站站长、复旦大学-江南造船“船舶+AI联合实验室”主任、上海市图像图形学学会副理事长。主要研究领域包括：计算机视觉、科学智能和智能制造等。至今以通讯作者在Nature
  Methods、Nature Biomedical Engineering、Nature Photonics、IEEE Trans.等国际期刊和CVPR、ICCV、IJCAI等CCF
  A类会议发表论文100 余篇。先后获得国家优秀青年科学基金、国家自然科学基金联合重点基金／面上基金／青年基金、华为基金和中船集团等多项省部级项目和企业合作项目的资助。
