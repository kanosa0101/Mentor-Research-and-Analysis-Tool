title: 助理教授
bio_raw: 傅金兰，复旦大学计算与智能创新学院助理教授A/研究员、博士生导师，入选国家级青年人才计划。曾在新加坡国立大学从事博士后研究工作。主要研究方向包括大语言模型、多模态大模型与智能体。曾获中国中文信息学会优博、自然语言处理顶会ACL
  2021最佳展示论文，以及ACL 2022杰出展示论文的荣誉。谷歌学术引用 1.2 万余次。其提出的 RoboOmni 多模态大模型相关资源在 Hugging
  Face 平台月均下载量达 143k。
