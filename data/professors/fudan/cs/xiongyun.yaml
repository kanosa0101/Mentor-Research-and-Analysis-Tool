bio_raw: 熊贇，复旦大学计算与智能创新学院教授，博导，上海市数据科学重点实验室副主任。曾任中国计算机学会CCF上海青年论坛主席。研究方向数据科学与人工智能。研究工作获国家、省部级及阿里、蚂蚁金服、微信支付、西门子等企业资助。在ICML、Neurips、KDD、TKDE等上发表论文100余篇，授权专利10余项，出版专著4本。获CCF技术发明奖、上海市科技进步奖等奖项。提出一批大数据智能算法，已被应用于证券交易所、医联平台、交通信息中心等上海市大数据建设重要领域。
