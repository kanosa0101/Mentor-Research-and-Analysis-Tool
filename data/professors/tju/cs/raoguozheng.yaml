  博士生导师

  电子邮件：

  rgz@tju.edu.cn

  研究领域：

  知识图谱、大语言模型、自然语言处理、不实信息检测、数据科学、健康信息学

  研究方向：

  1)

  知识图谱、大语言模型

  ：知识图谱是人工智能的基石，课题组主要开展知识图谱构建、知识图谱与大语言模型、知识图谱补全、基于知识图谱的检索增强、行业知识图谱应用等方面的研究。

  主要相关项目：

  国家自然科学基金重大项目课题、国家自然科学基金项目、其他国家级项目、国家电网、国家能源集团、中国船舶集团等单位项目。

  2

  ）自然语言处理：

  主要开展不实信息检测、实体和关系抽取、事件抽取、情感分析、假新闻检测、谣言检测等方面的研究。

  主要相关项目：

  国家自然科学基金重大项目课题、国家自然科学基金项目、其他国家级项目、天津电力、安徽省电网、国家能源集团等单位项目。

  个人主页：

