bio_raw: '博士毕业于新加坡南洋理工大学计算机科学与工程学院，本科和硕士毕业于电子科技大学机械与电气工程学院和航空航天学院。2015年10月至2018年6月在新加坡南洋理工大学计算机科学与工程学院担任项目干事、研究助理、博士后研究员。2018年7月作为引进人才加入四川大学计算机学院/工业互联网研究院，2019年12月被四川省人事厅认定为“四川省海外高层次留学人才”。

  杨彦兵的主要研究方向包括：物联网、可见光通信、可见光传感等领域，截止目前累计发表论文25篇，其中包括计算机学会（CCF）A类推荐顶级期刊和会议论文、中科院1/2区论文,并在ACM
  MobiCom、IEEE INFOCOM等国际顶级会议上作口头报告和现场演示；申请国家专利5项，其中授权专利2项（已转让1项）。现主持国家自然科学基金青年基金1项，参研多项国家级、省部级项目。杨彦兵目前是CCF会员、IEEE会员，担任International
  Journal of Optics客座编委，IEEE JSAC、IEEE TMC、IEEE IOTJ、IEEE TCOM等期刊和会议审稿人。（更多信息，请参考个人主页。）'
