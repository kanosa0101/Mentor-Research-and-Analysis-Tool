bio_raw: 李川，博士，副教授，硕士生导师，中国计算机学会数据库专委会委员，中国通信学会云计算专委会委员，YOCSEF 成都 AC委员，兼学术秘书，四川大学数据库与知识工程研究所副所长，美国伊利偌依大学芝加哥分校访问学者（合作研究者Prof.
  Philip S. Yu）。 近年来主持国家自然科学基金青年基金、“十二五”国家科技支撑计划子课题、教育部博士点基金、华为创新计划项目等项目多项,合作发表论文50余篇,出版译著2部。获四川省科技成果二等奖1
  项。是《IEEE Transactions on Knowledge and Data Engineering》，《ACM Transaction on Knowledge
  Discovery from Data》，《计算机研究与发展》，《软件学报》，《计算机学报》等国内外10余刊物评审专家，DMIN, WAIM，ADMA，NDBC，PAKDD等多个国内外学术会议程序委员会委员等，担任龙兴计划
  2007川大方联系人，ADMA 2008 组织委员会主席，NDBC 2015程序委员会主席等。
