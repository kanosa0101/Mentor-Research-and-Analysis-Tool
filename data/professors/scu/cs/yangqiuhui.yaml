bio_raw: 1996年获四川大学计算机软件与理论专业硕士学位；2008年获四川大学计算机应用专业博士学位。2001年至2004年在四川川大智胜软件股份有限公司兼职，从事多个项目的研发工作。2009年8月至2010年8月于美国马里兰大学计算机系做访问学者，从事软件质量保证和软件测试方面的研究。1996年7月至今在四川大学计算机学院工作，主要从事计算机和软件工程专业教学、科研工作。目前主要的理论研究方向是软件自动化测试的理论和技术、经验软件工程。主要的应用研发包括：软件自动化测试框架和平台、自动化单元测试工具、测试用例和数据生成工具、GUI测试等。目前在研项目：（1）软件工程中的数据挖掘技术；（2）无线网络异常诊断和预测技术；（3）测试用例自动生成技术（4）GUI自动化测试研究。主讲课程包括：数据结构与算法、软件质量保证与测试、编译原理、高级语言程序设计、汇编语言程序设计等。
