bio_raw: 2002年6月电子科技大学毕业, 获工学博士学位。2002年7月- 2004年6月在卫士通企业博士后工作站工作，博士后。2004年7月开始在四川大学计算机(软件)学院从事教学科研工作，承担了多门本科专业基础课程的教学，具有较为丰富的教学工作经验。2013年8月于美国加州大学欧文分校访学。主要研究方向包括：计算机网络、计算机体系结构、软件工程、智能控制、区块链技术等。
