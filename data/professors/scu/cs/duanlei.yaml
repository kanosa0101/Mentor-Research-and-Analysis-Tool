bio_raw: '2008年12月获四川大学计算机应用技术专业博士学位。毕业后留校任教。2007年9月至2008年9月于美国Wright State大学做联合培养博士研究生。2012年10月至2013年10月于加拿大Simon
  Fraser大学做访问学者。

  研究领域为数据挖掘与知识工程，具体研究方向包括分类预测、时间序列、对比挖掘、进化计算、医学信息分析、基因芯片数据处理、知识管理、大数据处理等。作为负责人主持了国家自然科学基金、教育部博士点基金、中国博士后科学基金、软件工程国家重点实验室开放基金、卫生公益性行业'
