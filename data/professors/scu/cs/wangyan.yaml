bio_raw: '王艳，博士，四川大学计算机学院副教授、硕士生导师。2015年6月获得四川大学博士学位。2014年4月至2015年4月在美国北卡莱罗纳大学教堂山分校（UNC）进行联合培养博士学习。2017年5月至2018年5月在澳大利亚伍仑贡大学（UOW）和澳大利亚悉尼大学（USYD）从事博士后工作。2015年7月入职四川大学计算机学院，2018年9月晋升为副教授，同年破格增列为硕士生导师。

  主要研究领域包括机器学习、计算机视觉、医学图像分析、深度学习等。目前已在IEEE TMI、IEEE TBME、IEEE TIP、IEEE TMC、NeuroImage、MICCAI、MP，PMB等国际权威学术期刊及顶级会议发表学术论文40余篇，多次受邀在研究领域主流会议上作特邀报告。申请发明专利多项。长期担任IEEE
  TMI, IEEE TIP和IEEE TNN等期刊的审稿人。目前，作为项目负责人主持包括国家重点研究计划重点专项项目子课题，国家自然科学基金面上项目、国家自然科学基金青年项目，四川省科技支撑计划项目，重点实验室开放课题项目等多个项目，并作为主要研究员参加国家级'
