bio_raw: '蒲亦非：博士（毕业于四川大学）、双博士后（出站于电子科技大学、法国科学院）、四川大学计算机学院（软件学院）教授、博士生导师、四川省科技创新创业领军人才、第十一批四川省学术和技术带头人后备人选、成都市高层次创新创业人才、四川省青年科技创新研究团队骨干成员。国家科技专家库在库专家、教育部学位与研究生教育第四轮学科评估专家、教育部研究生学位论文评议专家、四川省特聘专家、成都市特聘专家。

  近年来，分数阶微积分（fractional calculus）业已成为数学分析的一个重要分支。然而，对世界上绝大多数数学家、物理学家和工程技术学者而言，分数阶微积分都还较为陌生。如何将分数阶微积分应用于现代信号分析与处理之中，目前在国际上是一个研究甚少的新兴学科分支。蒲亦非长期聚焦于将分数阶微积分应用于信号处理、图像处理、电路与系统和人工智能这一新兴学科分支的尝试性探索和系统研究。

  蒲亦非首次提出数字图像处理最基本的6种分数阶微分算子（分数阶微分掩模），获广泛引用并以Yi-Fei PU名字对其命名；首次提出3种自然实现形式的1/2阶分抗（分数阶阻抗），获分数阶电路领域国际著名学者明确指出“蒲亦非作为第一作者所提出的分抗实现方法是一种被最频繁使用的方法”；首次提出分抗的度量单位和物理量纲及其串并联规则，获分数阶电路领域国际著名学者评价称“分数阶电路元件的度量单位和物理量纲一个意义重大的概述由蒲亦非的两篇论文总结”和“穷尽作者的知识，之前仅有极少的研究聚焦分数阶电路的串并联规则，蒲展示了任意阶分形电路各种联接方式的可能性”；首次提出分数阶Hopfield神经网络，并将其应用于“分数阶抗芯片克隆”之中，获“Hopfield神经网络之父”美国科学院士Hopfield先生评价“一个真正新颖的神经网络”；首次将迷失的第四种电路元件忆阻推广到分数阶，用模拟电路形式实现国际上第一个分数阶忆阻（分忆抗），率先提出鉴别分忆抗的指纹特征，构造出新专业英文单词“Fracmemristor（分忆抗）”和“Fracmemristance（分忆抗值）”，引起“忆阻之父”欧洲科学院外籍院士蔡少棠先生的浓厚兴趣与科研合作。

  近5年，蒲亦非发表SCI论文40余篇，其中第一作者在IEEE Transactions on Image Processing, IEEE Transactions
  on Neural Networks and Learning Systems, IEEE Transactions on Circuits and Systems
  I: Regular Papers, International Journal of Neural Systems, IEEE Intelligent Transportation
  Systems Magazine, IEEE Internet of Things Journal, Science China Information Sciences,
  Science in China Series F: Information Sciences等本学科重要期刊发表SCI论文20余篇，SCI他引330次（一作单篇最高SCI他引83次）；第一发明人获授权发明专利14项；出版学术专著5部；参与所授课程《新生研讨课（爱课程（中国大学MOOC））》入选教育部2017年国家精品在线开放课程；作为项目负责人主持国家省部级'
