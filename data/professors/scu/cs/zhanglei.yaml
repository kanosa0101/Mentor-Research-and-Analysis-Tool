title: 教授
email: leizhang@scu.edu.cn
bio_raw: '分别于2002年6月、2005年4月获电子科技大学数学学院理学学士、理学硕士学位；后保送电子科技大学计算机科学与工程学院，于2008年6月获得计算机科学工学博士学位；之后于香港中文大学计算机科学与工程学系从事博士后研究工作；2009年8月作为四川大学引进人才，被聘任为教授。
  　　至2016年1月，发表国际学术论文36篇，SCI收录论文29篇。其中IEEE Transactions系列论文7篇。包括①神经网络领域的顶级刊物IEEE TNNLS，该刊物的影响因子达4.291，在计算机科学-理论与方法类的102个国际期刊中排名第1，同时在计算机科学-硬件与结构类的50个国际期刊中排名第2；②IEEE
  TSM C-B，该刊物的影响因子达6.220，在计算机科学-网络空间类的24个国际期刊中排名第1，同时在自动化与控制系统类的58本国际期刊中排名第2；③中国计算机学会推荐的顶级A类国际学术会议IEEE
  Conference on CVPR。

  现任IEEE成都分会副秘书长，曾任IEEE计算智能学会成都分会秘书长，中国计算机学会（CCF）青年计算机科技论坛(YOCSEF)成都分会论坛副主席，担任Frontiers
  of Computer Science青年副主编，国际学术期刊“International Journal of Engineering and Industries”编委，“2015年视觉与学习研讨会（Vision
  and Learning Seminar (VALSE) 2015）”共同主席（Co-Chair）等。'
