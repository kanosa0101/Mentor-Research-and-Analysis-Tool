bio_raw: '徐文政，博士，副研究员，硕士生导师。 现为四川大学计算机学院副研究员。在中山大学于2008、2010、2015年分别获得理学学士、工学硕士、工学博士学位。在2012年至2014年间访问澳大利亚国立大学，师从Professor
  Weifa Liang。2016年4月-6月担任香港中文大学著名网络数据库专家Professor Jeffrey Xu Yu的高级研究员。2015年博士毕业后作为引进人才进入四川大学计算机学院担任特聘副研究员。

  徐文政副研究员一直从事物联网、无人机网络、社交网络、边缘计算、大数据方面的研究。具体研究包括无人机调度与通信、无线传感器网络的无线充电调度、社交网络影响力最大化问题、结构洞问题等等。目前已经在国际顶级学术期刊和国际会议上发表论文50篇,包括SCI论文30篇，其中
  IEEE Transactions 和 ACM Transactions 系列期刊论文15篇， 例如中国计算机协会（CCF）推荐 A类期刊TMC、ToN、TKDE、TC、TPDS、TIP等；在CCF著名会议INFOCOM、ICDCS、ICPP、SECON、IPDPS登发表近20篇高水平论文。论文被引用
  900余次。现主持国家自然科学1项、四川省科技厅重大专项1项、四川省科技厅重点项目1项。最新发表论文可参考DBLP：https://dblp.uni-trier.de/pers/hd/x/Xu:Wenzheng
  或者google scholar: https://scholar.google.com/citations?user=LMTfnAoAAAAJ&hl=en&oi=ao'
