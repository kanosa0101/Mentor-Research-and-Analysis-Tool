bio_raw: 2011年6月于电子科技大学获得博士学位，2008年9月至2009年9月在美国加州大学圣地亚哥分校（University California,
  San Diego），电子与计算机工程学院，视频处理实验室进行研究与学习，为联合培养博士；2011 年 12 月至今在四川大学计算机学院任教。主 要从事基于图像与视频处理、人工智能、模式识别以及计算机视觉等领域的研究与开发工作，具体研究方向包括视频分析与处理、视频编解码、
  深度学习、人脸识别、医学图像处理等。作为项目负责人或主要研究人员参与国家/国防纵向
