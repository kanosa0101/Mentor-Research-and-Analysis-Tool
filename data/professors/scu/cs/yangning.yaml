bio_raw: 2010年6月毕业于四川大学计算机学院，获工学博士学位。现为四川大学计算机学院副教授，硕士研究生导师。2012年9月至2013年9月，在美国伊利诺伊大学芝加哥分校做访问学者，与Philip
  S. Yu教授合作开展科研。长期从事机器学习和数据挖掘方面的研究工作，研究兴趣集中在异构信息网络分析、社会网络分析、推荐系统、图和网络的表征学习。作为项目负责人主持完成了国家自然科学基金面上项目1项（61173099）、教育部博士点基金项目1项（新教师类20110181120062）、四川省科技支撑计划项目1项（2011GZ0223）、四川省应用基础研究计划项目1项（014JY0220）、中国电子科技集团第十研究所横向项目1项。2010年7月以来，已在中国计算机学会推荐的高水平期刊和国际会议上发表论文20篇，其中SCI/EI检索14篇，CCF
  B级以上论文8篇（包括DMKD、WWWJ、CIKM、ICDM、SDM等）。是知名国际会议WAIM 2012、WAIM 2013、WAIM 2014、APWeb
  2016、HENA 2015、HENA 2016的程序委员，是顶级期刊IEEE Transaction on     Knowledge Engineering
  （TKDE）的审稿人。
