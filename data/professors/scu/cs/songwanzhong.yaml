bio_raw: '博士、副研究员，硕士生导师。1996年毕业于四川大学光电系，获学士学位；1999年毕业于四川大学电子信息学院，获硕士学位，2002年毕业于四川大学电子信息学院，获博士学位。2002年7月至今，在四川大学计算机学院任教。熟悉机器视觉和计算机图形学相关的研究与应用。

  正在开展的研究工作：实时结构光三维视觉、智能化三维视觉、视觉SLAM、口腔正畸智能化。'
