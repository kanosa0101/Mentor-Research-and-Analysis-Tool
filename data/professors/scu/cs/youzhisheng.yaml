bio_raw: 游志胜，四川大学计算机学院教授，博士生导师，四川大学杰出教授。四川大学国防科技研究院副院长，国家空管高级顾问，国家空管自动化系统技术重点实验室学术委员会副主任，视觉合成图形图像技术国防重点学科实验室学术委员会副主任。
  1968年本科毕业，从事电子技术工作；1978-1981年四川大学无线电系硕士生；1981-1983美国密执安州立大学访问学者。 长期从事计算机应用技术、图形图象处理技术、空管技术、视觉合成技术、实时软件工程研究。主持了在航空管制、航空安全、图形图象技术等方面多项国家和军队急需的重大工程装备的研制。先后获国家科技进步一等奖一项，二等奖二项，省部级一等奖四项，均排名第一。1997年被人事部授予“国家有突出贡献的中青年专家”，2002年获“全国五一劳动奖章”，2005年被评为“全国先进工作者”，2006
  年获“何梁何利科技进步奖”。 牵头组建成立了“国家空管自动化系统技术重点实验室”、“视觉合成图形图像技术国防重点学科实验室”和“现代交通管理系统教育部工程研究中心”，承担国家、军队和部省级重大项目二十余项，在国际国内发表论文100余篇，其中SCI、EI检索60余篇。
