bio_raw: '教育与工作经历：2004年获得应用数学理学博士学位。1996年留校任教，2005年至今，先后担任学院副院长、党委副书记，2007年聘任为教授。目前为博士生导师，计算机科学与技术学位分委会副主席，四川省有突出贡献优秀专家，四川省教学名师。2013-2014年作为访问学者在美国凯斯西储大学进行学术交流，此外先后前往爱尔兰、日本、中国香港、中国台湾等多所高校进行交流访问。

  学术科研成果：主持/主研包括国家自然科学基金、国家科技重大专项在内的各类国家级、省部级项目，以及横向委托项目近30项。先后获教育部科技进步奖、四川省科技进步奖各1项、成都市科技进步奖2项。申请/获得发明专利15项、软件著作权16项，发表学术论文百余篇。

  人才培养成果：已培养研究生80余人。获得国家教学成果一等奖1项，省级教学成果特等奖1项、一等奖2项、四川大学教学成果奖6项。主持教育部产学协同育人项目1项、省部级精品课程2门、省级教改项目2项、四川大学教改项目3项。编写并出版教材/专著7部，指导本科生多次获得国家级竞赛奖项。

  学术兼职：IEEE/ACM/CCF/CSIG/CAAI会员，CSIG可视化与可视分析专委会常务委员、CCF生物信息学专委会委员、四川省计算机学会大数据专委会副主任委员。2013-2017/2018-2022教育部高等学校计算机类专业教学指导委员会委员、国家科技进步奖励评审专家、国家火炬计划评审专家、科技部国际科技合作计划评价专家、国务院学位办学位与研究生教育专家、教育部科技发展中心评审专家、教育部同行评议专家。

  2018-2020部分学术成果

  [1] A Review about RNA–protein-binding Sites Prediction Based on Deep Learning,
  IEEE Access, ISSN: 2169-3536, 2020

  [2] A Survey of Visualization Methods for Urban Spatial Hot Spots Analysis, Journal
  of Computer-Aided Design & Computer Graphics, ISSN: 1003-9775, 2020, Vol.32, No.4

  [3] TDIVis: Visual Analysis of Tourism Destination Images, Frontiers of Information
  Technology & Electronic Engineering, ISSN: 2095-9184, 2020, Vol.21, No.4

  [4] TargetingVis: Visual Exploration and Analysis of Targeted Advertising Data,
  Journal of Visualization, ISSN: 1343-8875, 2020

  [5] A Computational Method to Predict Topologically Associating Domain Boundaries
  Combining Histone Marks and Sequence Information, BMC Genomics, ISSN: 1471-2164,
  2019, Vol.20, No.13

  [6] Fast Percentage Closer Soft Shadows, Advanced Engineering Science, ISSN: 20963246,
  2019, Vol.51, No.4

  [7] Method of Predicting User Professionalism Based on Question Granularity in Community
  Question Answering, Advanced Engineering Science, ISSN: 20963246, 2019, Vol.51,
  No.1

  [8] VisQAC: Visual Analytics for Online Q&A Communities, Journal of Beijing Institute
  of Technology, ISSN: 1004-0579, 2019, Vol.28, No.2

  [9] DMNEVis: A Novel Visual Approach to Explore Evolution of Dynamic Multivariate
  Network, Proceedins-SMC, ISSN: 9781538666500, 2018, No.1

  [10] Transportation Modes Behavior Analysis Based on Raw GPS Data, International
  Journal of Embedded Systems, ISSN: 17411076, 2018, Vol.10, No.2

  [11] Research on Folding Diversity in Statistical Learning Methods for RNA Secondary
  Structure Prediction, International Journal of Biological Sciences, ISSN: 1449-2288,
  2018, Vol.14, No.8

  [12] Visual Potential Expert Prediction in Question and Answering Communities, Journal
  of Visual Languages & Computing, ISSN: 1045-926X, 2018, Vol.48

  [13] Efficient Longest Streak Discovery in Multidimensional Sequence Data, Lecture
  Notes in Computer Science, ISSN: 03029743, 2018，Vol.10988, No.2'
