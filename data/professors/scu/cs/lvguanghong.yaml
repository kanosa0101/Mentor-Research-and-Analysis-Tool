bio_raw: 1984年毕业于电子科技大学无线电系，获工学学士学位，主要从事电子电路、图像处理方面的工作。1987年毕业于电子科技大学无线电系通信专业，获工学硕士学位，主要从事计算机局域网、扩频通信方面的科研工作，特别对宽带通信网络中的信道访问控制协议进行了详细的研究。在ICCT和国内的有关学术刊物、会议上发表论文多篇。1992年毕业于电子科技大学无线电系计算机通信专业，获工学博士学位。主要从事计算机通信网络互连、计算机网络性能分析研究，在国际国内学术刊物和会议上发表论文多篇，其博士论文“计算机通信网络互连研究”得到了国内专家、同行们的高度评价，认为是国内关于计算机通信网络互连方面研究最全面、最系统、最具水平的论著。
  1998年-1999年在英国萨黎郡大学（University of Surrey, UK）通信系统研究中心网络研究组作博士后研究工作。从1984年以来，吕光宏教授一直从事计算机通信网络方面的研究工作，具体研究方向：1）无线网络：无线网络切换和移动计算；无线网络编码；无线网络性能分析；2）光网络：光交换技术设计和性能分析；光网格；光突发交换性能分析；3）软定义网络、云计算网络架构、数据中心网络架构和物联网。目前已在国际国内学术期刊和国际会议上发表论文100余篇，其中包括电子学报、通信学报、计算机学报和电子科学学刊；完成了包括国家自然基金项目“B-ISDN中ATM网络的理论与技术研究”在内的11项科研工作。
