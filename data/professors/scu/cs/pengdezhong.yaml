bio_raw: '彭德中教授于1998年、2001年、2006年在电子科技大学分别获得理学学士学位、工学硕士学位和工学博士学位；2007年至2009年在澳大利亚DEAKIN大学任博士后研究员；2009年作为引进人才特聘为四川大学计算机学院教授、博士生导师。现任四川省网络大数据认知分析工程实验室主任、四川省计算机学会大数据专委会副主任委员、四川大学计算机学院院长助理。彭德中教授长期致力于大数据、机器智能与信号处理领域的科学研究。近年来在国际重要学术期刊和会议上发表论文30余篇（第一作者SCI论文20篇），其中在IEEE
  TSP、IEEE TNNLS、IEEE TCAS-II、IEEE TIFS、IEEE TVT、IEEE TMM等IEEE汇刊上发表论文10篇（第一作者7篇），在国际著名出版社Springer合著出版英文学术专著《Blind
  Source Separation: Dependent Component Analysis》。曾获得省部级科技进步一等奖2项、二等奖1项、国家发明专利5项、实用新型专利1项。主持主研国家自然科学基金重点项目、面上项目、青年项目，973子课题，教育部博士点基金，四川省青年科技基金等二十余项国家和省部级科研课题。曾担任十余个SCI期刊的审稿人和多个国际学术会议的程序委员会委员、技术委员会委员及分会主席；以及国家科技奖励评审专家、澳门特别行政区科学技术奖评审专家、国家自然科学基金通信评审专家、博士后基金评审专家、教育部博士点基金评审专家。'
