bio_raw: '个人简介

  Personal profile

  1995本科毕业于成都电子科技大学计算机软件专业，1998毕业于中科院成都分院计算机应用研究所，计算机应用方向。1998-2000：四川大学计算机学院助教，2000-至今：四川大学计算机学院讲师.在职博士生。参加的项目和工作：面向对象软件工程技术研究，某研究所信息平台整合调研和设计，十五空中管制建设项目（川大智胜公司）。2008年，美国马里兰大学作访问学者为期一年，研究方向HCI。'
