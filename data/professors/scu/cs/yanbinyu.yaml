title: 副教授
email: yby@scu.edu.cn
bio_raw: '1993年9月-1997年6月年就读于四川大学物理系，获学士学位。

  1999年9月-2002年6月在四川大学计算机学院攻读研究生，获得工学硕士学位。

  2002年7月至今，在四川大学电子信息学院任教。

  2011年12月在四川大学获工学博士学位。

  2012年7月至8月在美国西密西根大学进行为期一月的访问交流。

  2014年5月至2015年6月在美国怀俄明大学做访问学者.'
