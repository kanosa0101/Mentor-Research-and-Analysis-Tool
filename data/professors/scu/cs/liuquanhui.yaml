bio_raw: 刘权辉，2019.07-至今，四川大学计算机学院（软件学院）特聘副研究员。2013年6月和2019年6月，分别获电子科技大学工学学士学位（计算机科学与技术专业）和博士学位（计算机软件与理论专业）。2016.09-2018.09，获留学基金委资助在美国东北大学留学两年(Alessandro
  Vespignani and Ajelli Marco)。截止目前为止，在PNAS, Physics Reports, PLoS Computational Biology,
  Physical Review E 等国际权威期刊上发表论文30余篇，总的谷歌学术引用次数755次。在项目方面，获得国家自然科学基金委、国家社会科学基金重大项目、四川省科技厅、成都市科技局和四川大学等多个项目资助。
