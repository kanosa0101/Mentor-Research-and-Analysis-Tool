bio_raw: '个人简介

  Personal profile

  1975年生，博士，副教授，硕士生导师。分别于1997，2002，2011在四川大学计算机学院获得学士，硕士，博士学位。于2005-2006年作为访问学者在美国路易斯安娜大学研修。主要研究方向：移动计算、无线传感器网络、Ad
  Hoc网络、容延迟网络。IEEE Member ,国际会议DTMN06，DTMN08，SocialNet’09，AOC10，SocialNet’10程序委员会成员（TPC），国际期刊
  Adhoc & Senor Wireless System，国际会议IPCCC06, UIC-06 审稿人。近年来在国内外学术刊物上发表论文30余篇。'
