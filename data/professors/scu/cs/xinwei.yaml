bio_raw: 'J2EE平台研究、GIS、VC、OSG、Linux、Delphi开发

  SQL Server、Oracle、MySQL的数据库编程和数据库管理

  2000年毕业后，从事智能交通行业工作已经10年，参与了大量的软件研发工作、系统集成工作、项目管理工作，以及作为部门领导管理智能交通，作为客户代表和市场支持一起和销售人员拜访客户，攻关市场，接触过不同的业务客户，拥有丰富的行业经验，积累了不少技术、管理和市场经验，对我国的智能交通发展有一定的认识，对所从事的领域工作的发展和将来也有很深的体会和想法。'
