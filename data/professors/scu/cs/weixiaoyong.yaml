bio_raw: 现为四川大学计算机学院教授、计算机科学系系主任。2009年毕业于香港城市大学电脑科学系，获博士学位，师从多媒体计算专家Chong-Wah NGO教授，其后曾于美国加州伯克利大学从事博士后研究。主要从事多媒体计算及相关方向的研究，为多媒体计算方向国际著名团队VIREO的奠基成员之一。其负责的自动视频语义检索小组自2006年起一直在美国国家标准技术研究院(NIST)的TRECVID年度评测中保持前5的优秀成绩(其中2008年为第2)。其相关著作多次发布在多媒体计算方向的顶级国际会议ACM
  Multimedia及顶级期刊IEEE Transactions On Multimedia, IEEE Transactions on Image Processing,
  IEEE Transactions on Circuits and Systems for Video Technology上。现任中国图像图形学会技术专业委员会委员、中国计算机学会多媒体技术专业委员会委员。主持国家自然科学基金2项，并为4项香港政府研究基金项目的合作研究者。2013年入选教育部新世纪人才计划。
  教学过程中坚持以实践为核心的讲授方式，提高学生动手意识和能力，独特的教学方式曾被包括中央电视台、凤凰卫视、新加坡亚洲新闻台、香港翡翠互动新闻台、华西都市报等在内的100多家海内外媒体广泛报道。2012年被科学网评选为“2012中国科学年度新闻人物”的30个候选人之一，并于2013年获浙江科技馆颁发的“菠萝科学奖”，表彰其在科学传播上的贡献。
