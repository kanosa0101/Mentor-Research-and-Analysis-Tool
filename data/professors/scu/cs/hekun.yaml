bio_raw: 2006年7月开始在四川大学计算机(软件)学院从事教学科研工作， 2010年被评为副教授。 2002年在四川大学电气学院获得工学硕士学位；2006年在四川大学电子学院获得工学博士学位。
  主要承担本科多门课程的理论教学（计算机游戏编程、多媒体技术、离散数学）和硕士研究生的《计算机科学进展》教学，并主编本科教材《计算机游戏编程——基础篇》。 多年来一直从事图像处理分析的研究，具体研究方向包括图像处理数字图像水印、模式识别等。目前已在权威国际国内学术期刊和国际会议上发表论文40余篇，其中EI收录12篇；主持或参加多项纵横
