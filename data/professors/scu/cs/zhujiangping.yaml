bio_raw: 朱江平，博士，副研究员，硕士生导师， 2014 年毕业于中国科学院，2016年四川大学计算机科学与技术流动站博士后，2019年在哈佛大学进行交叉学科访问交流。朱江平博士具有计算机、机械、材料以及光学等多学科交叉研究的经历，主要从事计算机视觉、三维成像以及智能图像处理等方面的理论、方法与应用交叉学科的研究。
  作为项目负责人主持完成中国博士后基金资助项目 2 项，校企合作项目3项，四川大学专职博士后研发基金 1 项。目前主持国家级项目1项、四川省重大仪器开发专项（子课题）1项、四川省高新技术重点研发项目2项、成都市经信局项目1项、校企合作项目1项，指导博士生
  4人(2020年毕业1人)，硕士生 7 人。 在 Optics Express、 Photonics Technology Letters、 Applied Optics、
  Optics and Laser in Engineering， Optical Engineering、 SPIE、光学学报、中国激光、激光与光电子进展等国内外
  SCI/EI/会议期刊上以第一作者或通信作者发表论文50余篇，申请国家发明专利10项。
