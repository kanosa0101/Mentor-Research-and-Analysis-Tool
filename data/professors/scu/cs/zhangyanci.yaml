bio_raw: 张严辞，1993 年本科毕业于四川大学计算机科学系计算机软件专业；1997 年9 月至2003 年7 月在中国科学院软件研究所在吴恩华教授指导下进行基于图像的绘制和建模技术的研究，获得博士学位，博士论文题目《基于图像的实时漫游技术研究》；2004
  年在香港中文大学以研究助理身份在孙汉秋教授指导下从事基于点的建模和绘制等方面的研究工作；2005 年5 月至2008年6 月在瑞士苏黎世大学以博士后身份在Renato
  Pajarola 教授指导下从事基于点的绘制、并行绘制、流体模拟和绘制、实时阴影生成技术等方面的研究工作；2008 年7 月回国后，被四川大学计算机学院聘为副教授。现已在国内外知名杂志和会议上（ACM
  SIGGRAPH Sketches，Computer & Graphics，Journal of Science and Technology，IEEE Symposium
  on Point-Based Graphics,软件学报等）发表论文20余篇。目前主要研究兴趣和方向为实时计算机图形绘制算法、大规模动态场景并行绘制、3D游戏技术，虚拟现实、基于GPU的通用并行计算等等。
