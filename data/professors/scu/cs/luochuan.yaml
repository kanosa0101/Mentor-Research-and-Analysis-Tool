bio_raw: '罗川，副教授，硕士生导师；西南交通大学博士，四川大学博士后，加拿大里贾纳大学联合培养博士，哈佛大学交叉学科短期访问学者；中国人工智能学会粒计算与知识发现专业委员会委员，IEEE/IRSS/CCF/CAAI会员。

  主要从事数据挖掘与知识发现，粒计算与粗糙集，增量学习与并行计算研究工作。在IEEE T KNOWL DATA EN, IEEE T FUZZY SYST, INFORM
  SCIENCES, KNOWL-BASED SYST，INT J APPROX REASON，APPL. INTELL.等国际期刊或会议上发表学术论文40余篇，入选ESI高被引论文7篇；出版学术专著2部（科学出版社）；获得IEEE
  CyberSciTech 2019，FLINS 2016，IJCRS 2015, CRSSC 2013，JRS 2012会议优秀论文奖。

  主持国家自然科学基金面上、青年基金项目；四川大学优秀青年学者科研基金项目；中国博士后科学基金特别资助、面上资助项目；四川省应用基础研究计划、博士后'
