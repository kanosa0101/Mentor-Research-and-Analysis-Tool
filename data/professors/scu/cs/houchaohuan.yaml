bio_raw: '侯朝焕，于1995年当选中国科学院院士，现任中国科学院声学所研究员、博士生导师、中国声学学会名誉理事长，历任中科院信息技术学部副主任、中国声学学会理事长、国家自然科学基金委信息技术科学部主任、中国科学院微电子战略指导委员会主任、国家自然科学基金委系统芯片重大研究计划专家组组长等职。侯朝焕院士曾经被授予全国先进工作者、国家级有突出贡献的中青年专家、中央直属机关优秀党员。

  侯朝焕院士在声学和信息处理领域成果卓越，发表论文200多篇，先后完成12项国家重大项目，其中三项获国家发明奖，一项获国家科技进步二等奖，一项获国防科技进步一等奖，四项获中科院科技进步奖（含中科院特等奖一项）、一项获中科院杰出成就奖。侯朝焕院士60年代在水声工程研究中主持研制“水声信号起伏统计特性测量系统”，推动了水声信号场和混响-噪声场统计特性的研究。70年代提出了“相移多波束基阵信号处理系统”并完成总体设计；80年代主持完成了“智能型水声信号处理系统”研制以及13.2亿次DSP-l
  阵列信号处理机研制。在国内率先开展VLSI信号处理研究，将信号处理和集成电路设计融合发展。1993年完成快速富里叶变换FFT、波束形成DBF和QRD-RLS递推滤波等信号处理专用芯片的研制，达到当时的国际领先水平。1999年作为项目首席科学家主持国家973项目“面向功能可重组结构的DSP&CPU芯片及其软件的基础研究”。2009年，在侯朝焕院士的积极倡导下，国家自然科学基金委启动了单芯片系统集成SOC重大科学计划，侯院士担任专家组组长，开展SOC的关键科学问题研究，促进我国在SOC领域快速发展，并与国际SOC芯片技术同步发展。'
