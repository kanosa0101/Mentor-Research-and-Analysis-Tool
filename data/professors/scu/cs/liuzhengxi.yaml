bio_raw: 从1983年起一直在高校从事计算机应用技术相关的教学、科研工作，2001年起担任硕士生导师，研究领域为计算机应用、数字图象处理与视频分析，具体研究方向包括计算机应用技术、图形图象技术与应用、大场景视频分析与应用、移动微地图技术与应用、嵌入式系统与应用等。
