bio_raw: 兰时勇工学博士。2004年至今于川大计算机学院从事教学科研工作。曾访学CVSSP，University of Surrey，UK。兰时勇博士主要从事模式识别与智能系统、视频图象智能分析处理、机器学习、视觉合成、智能感知、智能交通等相关领域的研究及应用研发。曾主持或参与国家重点研发计划、国家自然科学基金、国家重大仪器设备开发专项、国家科技部863课题、省科技厅重点项目、工信部基金项目等多个纵横向项目；目前已在国际国内学术期刊和国际会议上发表论文30余篇；参编国家标准1项；申报国家发明专利多项。部分成果得以在相关行业中应用并发挥作用。
