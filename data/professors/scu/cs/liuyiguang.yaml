bio_raw: '人才培养

  2001/09－2004/12，四川大学，计算机学院，博士

  1995/09－1998/06，北京大学，力学系，硕士

  1991/09－1995/06，南京理工大学，机械学院，学士

  工作经历

  2013/01－2013/07，密歇根州立大学，计算机科学与工程系，高级研究学者

  2011/10－2011/12，帝国理工大学，地球科学系，皇家工程院资助访问学者

  2008/05－2009/01，新加坡国立大学，数字交互媒体实验室，Research Fellow(A)

  2008/06－至今，四川大学，计算机学院，博士生导师

  2006/06－至今，四川大学，计算机学院，教授

  2005/04－2006/05，四川大学，计算机学院，副教授

  人才培养

  已经培养博硕士研究生40余位、就业于阿里巴巴、华为、高校等。学生多次获得各级资助，如四川省苗子工程；也多次获得各种奖励，如学术会议优秀论文奖、四川大学学术之星（上万名研究生中每年仅选10位）称号等。欢迎报考统招博士，尤其欢迎具物理、数学、自动化或机械等背景且有一定编程能力的博硕士考生。

  学术任职

  1　四川省学术技术带头人

  2　四川省专家评议(审)委员会委员

  3　美国数学评论评论员，评论员号- 088538

  4　四川大学学报(自然版)，编委

  5　IEEE T PAMI、IEEE T NNLS等审稿人'
