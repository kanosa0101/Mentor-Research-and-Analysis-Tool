title: 副教授
email: zhouqunbiao@scu.edu.cn
bio_raw: '1996年6月以来一直四川大学计算机学院图形图像研究所工作，研究领域计算机通信，计算机应用和计算机体系结构，具体研究方向包括计算机无线有线通信、嵌入式实时系统、图像识别、信息挖掘和处理等。

  从事军民航领域的“MDSL多通道数字同步记录仪”等多项科研研究，获得国家科技进步二等奖一项，省部级奖励多项。

  从事智慧城市领域技术研究和产品开发，其研究成果在包括北京在内的多个大中城市得到广泛应用，取得了较大的社会效益。

  在核心期刊及以上刊物发表论文50余篇，其中SCI收录一篇。

  获得发明专利一项。'
