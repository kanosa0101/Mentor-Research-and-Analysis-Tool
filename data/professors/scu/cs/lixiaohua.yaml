bio_raw: 1995年西安交大本科毕业，1998年西安交通大学硕士毕业，2004年北京工业大学毕业，获工学博士学位。 2004年年6月-2007年9月，北京工业大学电控学院信号与信息处理研究室，讲师，2005年9月-
  2006年3月，香港理工大学，RA， 2007年10月至今， 四川大学计算机学院，副教授。李晓华副教授长期从事图像处理、模式识别及智能监控等方面研究工作。作为负责人已主持国家级项目1项，省厅级项目2项。作为主研参加国家自然基金项目3项。目前发表文章近30余篇，其中SCI收录4篇，EI收录9篇。
