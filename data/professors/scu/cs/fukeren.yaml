bio_raw: 傅可人，博士，2016年12月获得上海交通大学（图像处理与模式识别研究所）与瑞典工科高等院校Chalmers University of Technology的双博士学位，主要研究方向为图像视频中的目标检测识别、深度学习、计算机视觉，曾入选2017年“全国博士后创新人才支持计划”，同年被四川大学引进为特聘副研究员（副高）。傅可人博士已经发表IEEE等期刊和国际会议论文39篇，其中SCI检索20篇，包括顶级期刊IEEE
  Transactions on Neural Networks and Learning Systems、IEEE Transactions on Image
  Processing、IEEE Transactions on Cybernetics、IEEE Transactions on Multimedia等, EI检索19篇，包括领域知名国际会议CVPR，BMVC，ACCV等，已获授权发明专利5项。目前是CSIG（中国图象图形学学会）会员，担任IEEE
  Transaction on Neural Networks and Learning Systems，Pattern Recognition，Pattern
  Recognition Letters，Neurocomputing，Computer Vision and Image Understanding，IEEE
  Access等期刊审稿人。
