title: 副教授
email: liuxun@scu.edu.cn
bio_raw: '1991年7月至1997年6月在原电子部电子部第三十研究所从事计算机网络的研制工作，完成了总参通信部国家八.五重点攻关项目“军用数据交换网”的研制工作。

  2000年至2005年读博期间,从事图形图像处理研究工作,主要参加的项目是智能交通中的汽车识别.

  2007年3月到2007年8月在美国马里兰大学（Maryland University）计算机科学系进修，从事基于图像的目标识别方向，主要参加了植物分类识别课题研究。'
