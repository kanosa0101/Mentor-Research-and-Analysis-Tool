title: 副教授
email: lixuwei@scu.edu.cn
bio_raw: '1990年7月至今在四川大学计算机学院从事教学和计算机网络、信息系统和软件开发等方面的研究，1995年晋升为副教授，2000年6月-8月在法国泰雷丝公司访问，2001年聘为硕士研究生导师。

  目前已在国内学术期刊和国际会议上发表论文30余篇，其中SCI，EI收录6篇；参与完成本科教材撰写1本（主编之一）。作为负责人已主持科研合作项目7项，主要为企业委托的信息系统开发和信息系统项目咨询，累计完成合同金额140多万元。作为主研人员参与973项目等国家项目级2项。获得四川省科技进步二等奖1项。研究领域包括：软件工程、机器学习和计算金融。'
