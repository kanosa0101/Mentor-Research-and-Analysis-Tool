bio_raw: '1994年7月毕业于中国科学院数学研究所，获理学博士学位。现为四川大学计算机学院/软件学院院长、教授、博士生导师、机器智能实验室主任，IEEE
  Fellow，IEEE成都分会主席，中国计算机学会理论计算机专委会委员，中国计算机学会模式识别与人工智能专委会委员，中国人工智能学会机器学习专委会委员，国家自然科学基金委会评专家，教育部新世纪优秀人才，四川省有突出贡献的优秀专家，四川省学术和技术带头人，成都市有突出贡献的优秀专家，享受国务院政府特殊津贴。

  现为四川大学机器智能学科方向的第一学术带头人。至2016年1月，已在IEEE Transactions系列、Neural Computation、Physical
  Review E、Neural Networks等机器智能领域的国际一流学术刊物上，公开发表两百余篇学术论文。其中仅在IEEE Trans.系列就发表40篇，并出版英文专著3部。SCI收录论文200余篇，
  SCI引用1400余次。申请国家发明专利15项，其中已获得授权9项。 任国际学术期刊：《IEEE Transactions on Cybernetics》副主编（Associate
  Editor，2014-）：《IEEE Transactions on Neural Networks and Learning Systems》副主编（Associate
  Editor，2009-2012）；《Cognitive Neurodynamics》编委（Editorial Member，2006-）；《International
  Journal of Computational Intelligence Research》编委（2006-2009）；《Journal of Neural
  Computing Systems》编委；《计算机研究与发展》编委（2010-）。'
