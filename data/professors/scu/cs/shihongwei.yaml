bio_raw: 1987年9月-1990年4月，电子科技大学通信与电子系统攻读研究生，毕业并获硕士学位。1990年4月-2008年2月在中国电子科技集团公司CETC第十研究所工作，研究员，历任事业部部长、所副总工程师，一直从事XX识别、数据网络、空管ATM/CNS领域的研究，先后主持了多项国防重点型号工程的研究开发和试验鉴定等工作。时宏伟教授一直主攻智能多维信息处理与基于模式识别的重构理论和应用研究，其研究领域为可视化模式识别、智能大数据及空管ATM领域，具体研究方向包括生物特征识别重构安全应用、人机交互情景认知、安全大数据分析及空管ATM综合信息处理等。目前已在权威国内学术期刊和国际会议上发表论文40余篇；作为负责人已主持国防重点型号工程项目2项，国家级工程项目3项，主持参与国家省部委科研课题多项。先后获得国家科学技术进步二等奖1项，省部级科学技术奖一等奖2项、三等奖1项，中国人民解放军总参谋部科技进步一等奖1项，2004年被国务院授予政府特殊津贴获得者。近年来，先后受聘为国家空管委特聘全国空管专家、科技部“地球观测与导航”专项核心专家、科技部创新人才评审专家、公安部全国SC2/TC100专业标准化技术委员会委员，重庆市与浙江省科委科技专项评审专家，现任四川大学国家空管自动化系统技术重点实验室副主任，EasyChair管理下的多种国际权威会议学术期刊的审稿人。先后多次参加国家空管委战略发展规划制定、科技部科技XX专项、公安部生物特征识别标准化和其他部省级科技项目等编制/评审工作。
