bio_raw: 1984年重庆大学自动化系计算机工程专业学士；1998年四川大学计算机学院计算机软件与理论专业硕士；1984年至1993年在四川师范大学数学系计算机软件教研室任教，从事计算机本科专业教学；1993年至今在四川大学计算机学院（软件学院）任教，从事计算机和软件工程专业教学和科研；2001年至2006年在四川川大智胜软件股份有限公司兼职，从事技术和质量管理、项目管理、人力资源管理等工作。2000年和2001年先后两次到法国巴黎THALES公司参加“实时软件工程”方向研究生课程培训，并回国担任中法联合培养实时软件工程硕士项目的中方教师；2007年至2008年在美国Maryland大学计算机系做访问学者，主要从事软件质量保证和软件测试方面研究。主讲软件工程、系统需求分析、软件测试与维护、软件开发环境与工具、实时系统概念与实现、实时数据库等20余门专业课程。从事软件分析与测试领域的理论和技术研究，包括模型检测技术的应用，基于数据的软件工程和软件自动化测试等；主要的应用研发包括软件形式化验证工具、自动化单元测试工具、测试用例和数据生成工具等。拥有一个嵌入式系统研发与测试实验室，完成12届硕士研究生指导，毕业43人，在读15人。近几年完成项目：分布式自动化测试和模拟器，内存分析技术，ISM自动化测试，LLT用例框架生成与内存分析。目前在研项目：嵌入式系统软件形式化验证技术研究（四川省科技厅应用基础研究计划项目）；无线网络异常检测和预测算法研究（华为）。
