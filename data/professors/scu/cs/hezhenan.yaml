bio_raw: 2008年在北京科技大学自动化系获得学士学位。2014年于美国Oklahoma State University获得电子工程博士学位。目前主要从事智能优化与控制方法研究，在人工智能领域一流期刊和国际会议以第一作者身份发表多篇文章。担任多项人工智能领域国际著名期刊审稿人，并获得《IEEE
  Transactions on Cybernetics》2017年最佳审稿人。主持国家自然科学基金青年一项和国家重点实验室开放基金一项；并作为主要参与人参与国家重大研发计划项目二项。曾在美国休斯顿能源公司Energy
  New Technologies International从事智能控制系统研发工作，主持并完成基于智能优化算法的鲁棒高维多目标优化技术在智能控制系统中的应用。
