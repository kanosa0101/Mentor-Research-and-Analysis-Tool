bio_raw: '个人简介

  Personal profile

  于中华，男，1967年4月出生，黑龙江人。四川大学计算机学院工作，现为计算机科学与技术专业副教授，硕士研究生导师，网络系主任。以第一作者或通讯作者在国内外杂志及国际国内学术会议发表论文近50
  篇，获四川省科技进步二等奖和三等奖各一次，教育部科技进步一等奖一次。

  主要研究方向包括：计算语言学、数据库与知识工程（自然语言理解、生物医学数据挖掘、Web挖掘及智能检索等）。

  实验室地址：四川大学望江校区基础教学楼B-422'
