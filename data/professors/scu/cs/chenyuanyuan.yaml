bio_raw: 陈媛媛，博士，副教授， 四川省人工智能学会理事，IEEE会员。2004年6月于电子科技大学获学士学位；2007年3月于上海交通大学获硕士学位，同年7月在四川大学计算机学院从事教学科研工作；2015年12月于四川大学获博士学位。
  近年来主要研究方向为人工智能、神经网络、智能医疗等。目前已在国内外高水平期刊和会议上发表SCI、EI检索论文20余篇。其中SCI检索论文12篇，2篇论文曾分获2014、2106年度IEEE成都分部最佳论文奖。作为负责人承担多项国家级
