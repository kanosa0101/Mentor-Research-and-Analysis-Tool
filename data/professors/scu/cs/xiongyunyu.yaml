bio_raw: '1.基于车联网的车辆智能化技术研究，2012AA111901-6，经费来源国家高技术研究发展计划（863计划）专项子课题，第二负责人，负责车联网GIS平台研究，为本项目提供了GIS平台和路径规划算法；

  2.智能交通安全监控与流量控制系统重大关键技术研究，2012GZX0090；经费来源,四川省科技厅；2012.1-2013.12；负责大货车长距离跟踪、枪球机联动跟踪和大货车长时间占用超车道检测算法，为本项目提供了基本的长效目标检测跟踪和多摄像机接力联动跟踪算法；

  3.嵌入式智能视频事件检测器的关键技术，2009SCU11035，经费来源四川大学青年基金，2010.1-2011.12，第一负责人，负责关键算法研究和系统实现，为本项目提供了智能事件检测算法；

  4. 2003～2005，在四川大学图像图形研究所，作为空管GIS子课题负责人，参加横向合作项目“大型实时空中交通管制系统”的研究，该项目合同金额近4亿元，并获2005年国家科技进步一等奖,积累了大项目协作研究经验。'
