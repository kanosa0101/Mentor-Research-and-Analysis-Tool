bio_raw: '个人简介

  Personal profile

  教授/博导，重庆铜梁人，四川大学计算机学院物联网实验室负责人，四川省民航机场运行与控制工程技术研究中心(共建方)负责人，民航机场航班运行与控制新技术产学研联合实验室川大方负责人，物联网系主任。

  2009/08-2010/09，美国明尼苏达大学电子和计算机工程系，主要从事低占空比传感网研究,导师Tian He博士。

  2004/09-2008/07，四川大学计算机学院/博，导师李志蜀教授。

  主要研究方向为嵌入式系统与个人大数据、移动计算、传感网等。在国际上较早从事基于组的移动自组网邻居发现研究，相关研究成果发表在CCF的B级重要国际会议ACM SenSys’11、IEEE
  SECON’12、以及国际顶级杂志IEEE Transactions on Mobile Computing (TMC，CCF(中国计算机学会)计算机网络A级顶级国际杂志)上，在包括Electronics
  Letters、IEEE Communication Letters、Int’l Journal of Distributed Sensor Networks
  (IJDSN)、国家一级学报《软件学报》、《计算机研究与发展》等杂志上发表论文50多篇，其中SCI/EI收录30多篇。

  负责了国家自然科学基金项目“低功耗移动自组网的邻居发现机制研究”、省科技支撑项目“面向3G/4G营运服务的电子交易服务支撑平台研究”；参加了自然科学基金民航联合基金重点项目“基于大数据的民航枢纽机场运行态势感知关键技术研究”的指南编写和项目研究工作；参加了省科技厅应用示范项目“面向民航机场领域的航班地面服务智能协同管理核心软件研发及示范应用”开发研究工作;参加了Tian
  He教授的美国国家科学基金会项目“Addressing Research Challenges in Low-Duty-Cycle Wireless Sensor
  Networks”的部分研究工作；主持了多个横向项目。作为共建方川大方负责人参建了“四川省民航机场运行与控制工程技术研究中心”。作为川大方负责人参建了民航机场航班运行与控制新技术产学研联合实验室。。

  获唐立新教学名师一次，获青年骨干教师三次，获教学成果奖三次。担任ACM transactions On Sensor Networks (TOSN)、Pervasive
  and Mobile Computing Journal (PMC)、IJDSN、《软件学报》等期刊审稿，四川省科技厅、四川省地方税务局等评审专家。

  实验室较注重培养学生提出和解决创新问题的能力，定期举行前沿学术问题研讨会，且收效较好，比如：2013级实验室同学人均发表1.2篇SCI论文，部分同学获国家奖学金。实验室要求严格，工程技术训练紧张，建有训练平台，学生就业去向包括阿里巴巴、腾讯、百度、京东、去哪儿等互联网公司，及华为、优秀国企等。实验室学术、学习、研讨氛围浓厚，学生在各方面提升都较大。

  在国内外学术期刊和会议上发表论文50余篇，其中SCI/EI收录30余篇。代表论文如下：

  1.Liangyin Chen, et al. Group-based Neighbor Discovery in Low-duty-cycle Mobile
  Sensor Networks. IEEE TRANSACTIONS ON MOBILE COMPUTING (TMC). ，VOL. 15, NO. 8, AUGUST
  2016，1996-2009. CCF A类顶级国际杂志.

  2.Liangyin Chen, et al. Distributed range-free localisation algorithm for wireless
  sensor networks. ELECTRONICS LETTERS, 2014, 50(12).

  3.Liangyin Chen, et al. Prime-set-based neighbour discovery algorithm for low-duty-cycle
  dynamic WSNs. ELECTRONICS LETTERS, 2015, 51(6).

  4.Liangyin Chen, et al. Group-based discovery in low-duty-cycle mobile sensor networks.
  In: SECON''12.【CCF的B级国际会议】.

  此外，参与出版教材/专著8本，参与专利多项。近期还与游洪跃老师合写了讲义《C语言教程》，该教程采用了全新的组织结构，内容大大简化，号称最容易教、最容易学的C语言教材。主要章节每章都仅有三部分内容：程序示例、相关语法、研究部分。我们主张老师只需要讲授第一部分程序示例即可；学生经过反复揣摩第一部分的程序示例即可达到能够编写一般程序的目的。该讲义不再只注重语法，而是重点关注培养学生的自信和编写一般程序的能力。我们认为：只要学生有自信，能够编写一般程序，其他的难点就一定不是问题。相反，如果学生的自信心被打击，那一定是一个不小的问题。相关ppt、习题答案、教学视频（待制作）等教学资源可到微信公众号“易书桥”上去获取。有需要的老师也欢迎联系作者。

  热情欢迎懂礼貌、开朗、自律、自信、踏实、有团队意识、有责任心、有担当、有创造激情的优秀同学加入。未来的互联网财富创造者们：来吧，加入我们！我们愿助您前行！

  详情可关注物联网实验室主页：http://www.bigdatascu.cn'
