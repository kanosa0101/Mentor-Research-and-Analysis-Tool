bio_raw: '1988-1992在北京科技大学获工学学士学位；1992-1995在四川大学获理学硕士学位；1998-2001在四川大学获理学博士学位。2011-2012在美国伊利诺伊大学芝加哥分校（UIC）EVL实验室做访问学者。

  2001年至今在四川大学计算机学院图像图形研究所工作，从事民航电报系统、空管自动化系统、图形图像处理技术等相关理论与应用的研究；

  参与了军航空管十五管制中心系统等重大项目的设计和开发，完成了包括民航电报系统、空管飞行数据处理系统在内的多个系统的研究开发工作。

  主持国家自然科学基金项目1项，参与自然基金项目、863、973项目多项；发表论文数十篇。

  获国家发明专利授权9项。获国家科技进步一等奖1项，二等奖1项，省部级奖多项。

  长期参与本科生课堂教学，所讲授课程《程序设计基础》为四川省精品资源共享课。

  目前从事数字图像处理与应用技术、实时软件工程及软件测试理论和技术、空管系统数据处理理论等方向的研究。'
