bio_raw: '个人简介

  Personal profile

  1986年毕业于南京大学计算机科学与技术系，获硕士学位，现为四川大学计算机学院教授。曾到法国Thompson公司和巴黎第六大学进修，并到香港城市大学做访问学者，进行合作研究。承担本科生和研究生的数据库系统原理和分布式计算系统的教学工作。长期从事并行计算、分布式处理、网络计算、移动计算方面的研究工作以及数据库系统方面的研发工作，现主要从事云计算和大数据方面的研究工作以及信息系统方面的开发工作。'
