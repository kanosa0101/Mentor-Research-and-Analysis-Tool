bio_raw: '彭玺，教授，博导，国家特聘青年教授；于

  2013

  年

  12

  月毕业于四川大学计算机学院；

  2014

  年至

  2017

  年，就职于新加坡科技局资讯通信研究院（

  Institute for Infocomm, A*STAR

  ）担任研究员和联合项目主管（

  CO-PI

  ）；

  2017

  年被四川大学引进任特聘研究员；

  2018

  年入选四川省特聘教授；

  2019

  年入选

  "

  国家特聘青年教授

  "

  ，同年

  9

  月破格转聘为教授。彭玺的主要研究方向包括表示学习基础理论及其在多媒体计算、视觉计算、自然语言处理、图像处理等领域中的应用。他共计在中国计算机学会

  A

  类推荐期刊

  /

  会议（

  ICML

  ，

  NeurIPS

  ，

  CVPR

  ，

  ICCV

  ，

  AAAI

  ，

  IJCAI

  、

  TPAMI

  、

  IJCV

  、

  TIP

  、

  TIFS

  等）上发表学术论文

  60

  余篇。发表的一作

  /

  通信论文中包含多篇

  ESI

  热点论文（前

  1‰

  ）和高被引论文（前

  1%

  ）；获教育部霍英东青年教师奖（二等，全国

  15

  人）等多个奖励；指导学生获全国互联网

  +

  等奖励多项；是第十届中国科协全国代表大会代表。

  彭玺是

  IEEE Trans on SMC: Systems (IF: 7.351)

  等四个国际

  SCI

  期刊副主编（

  AE

  ）；是

  IEEE Trans Neural Netw Learn Syst (IF: 11.083)

  等四个国际

  SCI

  期刊特邀编委（

  GE

  ）；是

  VALSE

  等多个国内外学术会议程序委员会主席；

  ECCV

  专题报告组织主席；

  AAAI

  ，

  IJCAI

  等多个

  CCF A

  类会议分会主席；

  ICME

  ，

  IJCAI

  、

  VCIP

  及

  PSIVT

  等多个国际学术会议领域主席；

  VALSE

  、

  ACM

  中国图灵大会（

  TURC

  ）注册主席及志愿者主席等；是

  NeurIPS

  ，

  ICML

  ，

  ICLR

  ，

  CVPR

  ，

  ECCV

  ，

  ICCV

  ，

  AAAI

  ，

  IJCAI

  ，

  ACMMM

  ，

  ACL，EMNLP

  等多个重要国际学术会议程序委员会委员；是Nature Communication，

  TPAMI

  ，

  TNNLS

  ，

  TCYB

  ，

  TKDE

  ，

  TIFS

  ，

  TIP

  等百余个国际重要

  SCI

  期刊审稿人；（曾）任是视觉与学习青年学者研讨会（

  VALSE

  ）执行领域主席委员会（

  EACC

  ）主席、常务领域主席委员会委员（

  LAC

  ）；（曾）是中国图象图形学学会（

  CSIG

  ）理事、青工委副秘书长和执委、会员服务与发展委员会秘书长及委员、竞赛工作委员会委员；计算机学会计算机视觉专委会及人工智能专委会委员。

  招生说明请见我的

  个人主页

  。'
