bio_raw: '个人简介

  Personal profile

  1996年7月至今，在四川大学计算机学院及四川川大智胜软件股份有限公司工作。研究方向为数字图像处理与计算机图形学。主持和参与了多个国家纵向项目及横向项目，包括核动力研究院四所图象分析仪、羊毛羊绒自动鉴别系统、四川省石油管理局金相图象分析系统、北京旅行时间系统、车辆视频测速基础算法研究等。目前已在国内学术期刊和国际会议上发表论文20余篇。相关研究成果获发明专利一项。'
