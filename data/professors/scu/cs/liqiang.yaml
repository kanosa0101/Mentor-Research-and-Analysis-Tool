bio_raw: 1999年毕业于日本筑波大学计算机科学系，获工学博士学位。先后在日本富士通研发中心、诺基亚东京分公司和日本ACCESS公司从事软件研发十余年。在日本富士通公司研发中心作为研究员，主要从事并行计算、文本挖掘及CRM系统研发工作；在诺基亚东京分公司从事移动计算和Symbian平台优化及应用软件研发，参与研发了中国第一代诺基亚智能手机NOKIA7650以及诺基亚第一代游戏手机N-Gage；在日本ACCESS作为项目负责人，承担了大型的面向3G手机的应用软件平台开发，同时为富士通、松下、夏普、日本诺基亚等研发或移植了3G手机上的浏览器、SMS、MMS、视频播放器等。承担多项日本文部省和日本学术振兴会（JSPS）的科研课题，获得日本文部省萌芽基金奖和日经产业技术奖。曾在英国帝国理工学院计算机科学系做客座研究员，从事并行计算和优化决策的研究工作；2010年作为引进人才到四川大学计算机学院任教，主要研究方向是物联网、移动云计算、嵌入式程序设计等。以程序委员会委员的身份参加多个国际学术会议，2012年作为程序委员会主席主办AWFS2012国际学术会议。Journal
  of Symbolic Computation、Texts and Monographs in Symbolic Computation等国际权威学术期刊的审稿人，日本筑波大学客座研究员。
