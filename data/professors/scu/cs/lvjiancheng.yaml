bio_raw: 2003年3月毕业于电子科技大学获计算机应用硕士学位。曾在中兴通讯股份有限公司工作两年，参与了多个项目的研发与管理工作。2006年12月毕业于电子科技大学获计算机科学博士学位；2007年3月-2008年6月在新加坡国立大学从事博士后研究；2008年7月作为引进人才加入四川大学，被特聘为教授，2009年5月被评为博士生导师。
  至2012年12月已发表学术论文30篇，SCI收录24篇。其中，在IEEE Transactions系列期刊发表论文6篇；英文专著一部《Subspace Learning
  of Neural Networks》（CRC Press, Taylor & Francis Group，2011）。申请发明专利多项，已授权国家发明专利四项。
  主持/主研教育部回国留学人员启动基金、国家自然科学基金、中港合作国家自然科学基金、教育部博士点基金、四川省科技厅支撑计划、四川省科技厅应用基础、广东省产学研结合项目等多个项目。曾负责多个软件项目的研发工作，有多年的工程项目研发经验。曾担任2006年神经网络国际会议秘书长，2010年MDMKD国际研讨会程序委员会主席，2008年CIS&RAM国际会议分会主席，多个国际会议程序委员会成员。受邀为多个国际期刊审稿。
