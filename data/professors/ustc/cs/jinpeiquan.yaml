  主

  要研究方向

  ：数据库系统及应用、大数据存储与管理、Web信息抽取与检索

  金培权，男，1975年出生，博士，中国科学技术大学计算机科学与技术学院副教授，计算机应用研究室主任，IEEE和ACM会员，中国计算机学会高级会员、数据库专委会委员、大数据专家委员会通讯委员。2003年获中国科学技术大学计算机软件与理论博士学位，2003年9月至2005年8月在中国科学技术大学信息与通信工程博士后流动站从事博士后工作。2009年作为访问学者在德国University
  of Kaiserslautern进行合作研究，2014年－2015年在丹麦Aalborg University从事合作研究。近年来主持了国家自然科学基金项目（3面上、1青年、1重点项目子课题）、国家863项目（2项）、国家重点研发计划等纵向课题以及华为科技基金、华为创新研究计划等多项企业合作项目。近几年在TKDE、VLDBJ、TPDS、WWW、ICDE等国内外期刊和会议上发表论文80余篇，其中SCI/EI收录60多篇。

  获奖情况

  ：

  2018年获中国科学技术大学西区精神优秀教学奖

  2017年获NDBC 2017最佳学生论文奖

  2015年获DASFAA 2015 Best Poster Award

  2014年获NPC 2014 Best Paper Award

  2012年获王宽诚育才奖一等奖

  2012年获NDBC 2012最佳论文提名奖

  2011年获NDBC 2011最佳系统演示奖

  2007年获张宗植青年教师奖

  2006年获中国科学技术大学优秀青年教职工津贴

  2003年度中国科学院院长优秀奖

