bio_raw: '电　话：（0512）87161316

  E-Mail：qubit@ustc.edu.cn

  个人主页：

  http://staff.ustc.edu.cn/~qubit

  主要研究方向

  ：量子人工智能、信息安全、计算机视觉、大数据、普适计算、区块链

  杨威，男，1978年10月生，安徽六安人。2007年毕业于中国科学技术大学信息安全专业，获博士学位。2008—2013年在中国科学技术大学从事博士后工作。2019.9—2020.8在新加坡国立大学访问。现为中国科学技术大学计算机科学与技术学院副教授。近年来总共发表学术论文130多篇，其中SCI收录41篇，EI收录93篇，申请发明专利40多项（其中13项已授权）。作为项目负责人，主持了包括国家自然科学基金面上项目在内的10多个国家级与省部级项目；并作为主要研发人员参与了973、863、国家科技重大专项等多个科研项目。

  2014年，研究课题“基于安全多方计算的隐私保护理论与方法研究”荣获教育部高等学校科学研究优秀成果奖自然科学奖二等奖。2016年，获CCF A类会议ACM UbiComp最佳论文奖，这是中国高校（含港澳台等地高校）作为独立完成单位首次在顶级学术会议UbiComp上获得该奖项，该论文也是中国科学技术大学作为独立完成单位获得的首篇CCF
  A类会议最佳论文。2018年，通讯作者论文被自然语言处理领域旗舰会议ACL 2018录用，之前中国科学技术大学作为第一单位被ACL接收的论文长文总共有5篇， 且均为合作完成（合作单位以微软、讯飞、加拿大约克大学为主），该ACL
  2018论文是中国科大在ACL大会上发表的首篇独立完成的论文长文。

  获奖情况

  ：

  2020，CVPR KITTI-MOTS Challenge竞赛，世界冠军

  2020，量子计算软件创新大赛，银奖【大赛共1个金奖（南大），3个银奖（科大、清华、北大）】

  2019，第八届“中国软件杯”一等奖，优秀指导教师奖

  2018，惠普信息科学青年教师奖

  2017-2018，年度“苏州工业园区优秀教育工作者”

  2016，CCF A类会议ACM UbiComp最佳论文奖 （通信作者）

  2014，教育部自然科学奖二等奖 （第2完成人，申请书执笔人）

  2007，中国科学院院长奖

  2006，首届中国科学技术大学优秀博士学位论文培育基金奖

