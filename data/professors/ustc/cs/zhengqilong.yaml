  ：

  “安徽省防灾减灾智能信息与决策支持系统”获国家科学技术进步二等奖，2001年

  “并行计算课程的创建及其辐射与示范作用”，国家级教学成果二等奖，2009年

  “并行计算课程的创建及其辐射与示范作用”，安徽省教学成果特等奖，2008年

