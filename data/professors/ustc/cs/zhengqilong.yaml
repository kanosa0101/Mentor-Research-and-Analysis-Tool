bio_raw: '电　 话： 0551-63602441

  E- Mail： QLZheng@ustc.edu.cn

  个人主页：

  主要研究方向

  ：1、魂芯DSP C编译器研制 2、深度学习平台与应用研究

  郑启龙，男，副教授，硕士生导师。1991年本科毕业于武汉大学计算机系获理学学士学位；1994年毕业于中国科学技术大学计算机系获工学硕士学位，同年留校任教至今。主持工信部核高基重大专项一级分课题两项，安徽省自然科学基金项目两项，Intel研究基金项目两项。已发表学术论文60余篇；参与编写并行计算丛书之《并行算法实践》（高等教育出版社），著有译著《编译器构造－C语言描述》（机械工业出版社）。2002年9月至2003年3月公派赴美国加州大学圣地亚哥分校（UCSD）进修访问。

