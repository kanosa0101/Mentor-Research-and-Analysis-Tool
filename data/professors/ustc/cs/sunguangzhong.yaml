  主要研究方向

  ：高性能计算与算法优化、大数据处理与应用。

  孙广中，男，教授，博士生导师。中国计算机学会(CCF)杰出会员，CCF高性能计算专委会、普适计算专委会、计算法学分会执行委员。ACM终身专业会员，IEEE高级会员。曾任中国科学技术大学计算机科学与技术学院副院长，现任校党委委员、少年班学院党总支书记兼副院长。

  获奖情况

  ：

  1. IEEE Cluster 2024 Best Paper Award（2024）

  2. 中国科学技术大学海外校友基金会“优秀教学奖”（2024）

  3. IEEE MDM 2023 Test of Time Award（2023）

  4. 教育部-华为“智能基座”优秀教师（2021）

  5. ACM SIGKDD China Test of Time Award（2021）

  6. 国家级课程思政教学名师和团队负责人（2021）

  7. 安徽省教学成果特等奖（排名1） (2019)

  8. 中国科学院青年创新促进会优秀会员 (2016)

  9. 国家级教学成果奖二等奖（排名5） (2009)

  10. 中国科学院院长奖 (2003)

