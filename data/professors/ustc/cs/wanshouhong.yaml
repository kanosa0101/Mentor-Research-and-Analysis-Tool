title: 副教授
bio_raw: '电　话：

  E - Mail：wansh@ustc.edu.cn

  实验室网站：

  http://kdelab.ustc.edu.cn

  主要研究方向

  ：计算机图像处理与理解、遥感图像处理、人工智能与模式识别等。

  万寿红，女，1971年出生，中国科学技术大学计算机科学与技术专业博士，中国科学技术大学计算机科学与技术学院副教授，遥感图像专业委员会委员、中国航空学会信息融合分会委员、中国图象图形学学会高级会员、中国计算机学会高级会员、ACM会员。主要研究方向为计算机图像处理与理解、遥感图像处理、模式识别与人工智能等。近年来主持了多项国家863项目、国家自然科学基金面上项目、国家973子课题、安徽省自然科学基金面上项目等课题，并在国内外期刊和国际会议上发表论文70余篇，其中SCI、EI收录50余篇。

  获奖情况

  ：

  2018年获中国科学技术大学王宽诚育才奖

  2015年获省部级科学技术进步二等奖(排名7)

  2014年获中国科学技术大学惠普信息科学青年教师奖

  2012年获中国科学技术大学第一届青年教师教学基本功竞赛二等奖

  2009年获安徽省科学技术奖科技进步类一等奖（排名2）

  2009年获中国科学技术大学王宽诚育才奖二等奖

