bio_raw: '电　话：(0551)63607858

  E- Mail： Wangxfu@ustc.edu.cn

  个人主页：

  http://staff.ustc.edu.cn/~wangxfu/

  主要研究方向

  ：传感器网络及安全、复杂系统建模、嵌入式系统

  王行甫，男，1964.9出生，88.7 毕业于北京师范大学无线电电子学系；之后就读中国科技大学计算机系研究生；日前担任科大计算机学院软件实验教学中心主任；主讲过计算机网络、计算机图形学、复杂数字系统设计等课程；完成国家级项目十多项、发表论文40多篇、申请专利7项、申请软件著作权1项。

  科研项目

  ：

  国家科技重大专项,中医疫病预测多维动态分析系统建模,09.1－11.12

  国家自然科学基金,分布式无GPS无线传感器网络节点三维定位算法研究08.1－10.12

  国家自然科学基金,无线传感器网络中软件体系结构路由协议和数据管理技术研究07.1－07.12

  中科院知识创新工程方向性课题,自组织网络协议和仿真03.1－05.12

  安徽省自然科学基金,移动自组网中无需信任第三方身份认证和非抵赖性研究05.1－07.12

  安徽省教学研究计划,计算机软件实验教学网络智能管理系统研究与开发07.6-10.5

  国家教育部大学生创新研究计划,面向网络多用户共享的CPU设计仿真实验的研究08.1-09.6

  获奖情况

  ：

  2000年荣获校优秀班主任；

  2003年荣获校招生先进个人；

  2006年荣获张宗植青年教师奖；

  2008年指导本科生参加全国信息安全电子设计大赛荣获三等奖2项；

  荣获FPGA组三等奖1项，

  荣获DSP组三等奖1项；

  2008年荣获中科院教学成果二等奖；

  2010年荣获王宽诚育才奖一等奖.

  十篇代表性论著

  ：

  Research and Realization about Conversion Algorithm of PDF Format into PS Format，ISNNS2010

  Tolerant Majority-Colluding Attacks for Secure Localization in Wireless Sensor Networks，wicom2009，The
  5th Internatio _nal Conference on Wireless Communications, Networking and Mobile
  Computing；WiCOM 2009

  Apply Modified Method of Nonlinear Optimization to Improve Localization accuracy
  in WSN；WiCOM 2009

  Probabilistic Route Mechanism of Considering Communication Time—PROPHETCCT,2008.12，CSSE2008

  A low energy cost wireless sensor network routing algorithm satisfying parallel-query
  delay constraints EI:073110713880、SCI:188V，WChinese Journal of Electronics,2007.6

  A Way to Solve the Threat of Selfish and Malicious Nodes for Ad hoc Networks,ISISE2008,
  2008.12

  Using agent technology to implement non-repudiation without TTP , Chinese Journal
  of Electronics,, 2007.4

  一种基于蒙特卡罗算法的传感网络点覆盖质量评估技术EI:071910594145，电子学报2006.12

  一种支持悬赏的匿名电子举报方案，电子学报2008.2

  基于蒙特卡罗算法的点覆盖问题解决方法，计算机应用研究，2007.12'
