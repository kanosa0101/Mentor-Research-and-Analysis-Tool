bio_raw: '电 话：0551-63602441

  Email：xuyun@ustc.edu.cn

  个人主页：

  http://staff.ustc.edu.cn/~xuyun/

  主要研究方向

  ：大数据挖掘算法及应用，并行编程模型及性能优化等。

  徐云，博士，教授，博导。2002年中国科学技术大学计算机系博士毕业，获计算机软件与理论专业博士学位。1999年起在中国科学技术大学计算机学院、国家高性能计算中心（合肥）从事并行计算与应用相关的研究和教学工作。现为国家高性能计算中心（合肥）副主任和安徽省计算机学会秘书长，IEEE、ACM和中国计算机学会会员、中国计算机学会理论计算机科学专委会委员。近几年主要研究多核并行编程模型及性能优化、大规模程序和生物序列分析算法等。至今已主持国家重点自然科学基金子课题及面上课题、973子课题、863子课题多项，以及华为、中电14所等横向合作项目。在国内外重要学术期刊和会议发表学术论文80余篇。

  获奖情况

  ：

  “并行计算”课程的创建及其辐射与示范作用，国家级教学成果二等奖，排名第2，2009.9；

  “并行计算”相关课程教学团队，国家级教学团队，排名第3，2009.9；

  中国科大王宽诚育才奖一等奖，个人，2009.8。

  十篇代表性论著

  ：

