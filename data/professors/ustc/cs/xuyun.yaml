  Conference on Software Engineering (ICSE''18). May 30 – June 1, 2018, Gothenburg,
  Sweden. pp. 1066-1077.

  Haoyu Cheng, Ming Wu, Yun Xu. FMtree: A fast locating algorithm of FM-indexes for
