bio_raw: 'Email：

  xlanchen@ustc.edu.cn

  主要研究方向

  ：

  操作系统、时间可预测计算

  陈香兰，1977年4月生，中国科学技术大学计算机学院讲师；2017年10月-2018年10月美国芝加哥大学计算机系访问学者，合作者是卢山教授；2007年获得中国科学技术大学计算机软件与理论专业博士学位，导师是龚育昌教授；2000年获得中国科学技术大学计算机科学与技术专业学士学位、经济法（双）学位。在国内外会议期刊上发表论文60多篇，授权专利16项。

  获奖情况

  ：

  2015年中国科学技术大学惠普信息科学青年教师奖

  2014年第三届青年教师教学基本共竞赛三等奖

  2009年校优秀辅导员

  2008年安徽省教育成果二等奖（4/5）

  2008年校教育成果一等奖（4/5）

  代表性论著

  ：

  Guangpu Li, Haopeng Liu, Xianglan Chen, Haryadi S. Gunawi, Shan Lu: DFix: automatically
  fixing timing bugs in distributed systems. PLDI 2019: 994-1009

  Bo Wan, Xi Li, Bo Zhang, Caixu Zhao, Xianglan Chen, Chao Wang, Xuehai Zhou: DCW:
  A Reactive and Predictable Programming Framework for LET-Based Distributed Real-Time
  Systems. ACM Trans. Design Autom. Electr. Syst. 24(3): 37:1-37:35 (2019)

  Yu Zhang, Xianglan Chen, Xin An, Jianliang Lu, Xuejun Li, Xuehai Zhou: Building
  step-by-step practical curriculum system for computer systemic ability training.
  ACM TUR-C 2017: 7:1-7:6

  Beilei Sun, Xi Li, Bo Wan, Chao Wang, Xuehai Zhou, Xianglan Chen: Definitions of
  predictability for Cyber Physical Systems. J. Syst. Archit. 63: 48-60 (2016)

  Haifeng Liu, Xianglan Chen, Yuchang Gong: BabyOS: a fresh start. SIGCSE 2007: 566-570'
