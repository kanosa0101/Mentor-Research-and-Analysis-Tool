bio_raw: 'E-Mail： huding@ustc.edu.cn

  个人主页：

  https://hu-ding.github.io/

  主要研究方向

  ：

  计算几何、优化算法，以及在人工智能、芯片设计、AI for Science等领域的应用

  丁虎，2018年获国家创新人才青年项目资助。2009年本科毕业于中山大学数学系，2015年博士毕业于美国纽约州立大学布法罗分校计算机科学与工程系，并获全系最佳博士论文。曾任美国密歇根州立大学计算机科学与工程系（tenure-track）助理教授，博士生导师。2018年6月到中科大计算机学院工作，任教授，博士生导师。主要研究方向包括计算几何、优化算法，以及在人工智能、芯片设计、AI
  for Science等领域的应用。以独立第一或独立通讯作者在计算机算法理论、人工智能等领域发表CCF推荐的A/B类论文近60篇，包括人工智能三大顶会ICML/ICLR/NeurIPS
  20篇（4篇入选spotlight），理论算法领域知名会议或期刊SODA/SoCG/JCSS/Algorithmica等10余篇。解决或改进了“分布鲁棒优化”、“高维空间聚类”、“数据压缩”、“计算最优传输（Wasserstein
  Barycenter、Gromov-Wasserstein）”等理论算法与深度学习领域公认的基础性难题。曾受邀到近20所国内外知名高校（加州伯克利、圣母大学、石溪大学、清华大学等）做学术报告。

  曾获美国自然科学基金CRII award, 伯克利Simons Fellowship等。多次受邀担任国际知名会议、期刊的审稿人、程序委员会成员、领域主席等。作为计算机算法方向的专家，曾受邀参加美国科学基金的项目评审工作。主持多项国家级科研项目，包括国家科技部重点研发计划青年科学家项目、国家自然基金重点（课题）、面上等。作为课题骨干参与科技部GJ专项。2021年获年中国人工智能学会-华为Mindspore奖励基金会资助，2022年获中国科大海外校友基金会“青年教师事业奖”。2026年获中国科大“学术领军人才培养计划”支持。详见

  个人主页

  。

  主要讲授课程

  ：

  大数据算法、计算机数学

  获奖情况

  ：

  2017年获美国科学基金CRII Award（被视为Pre-CAREER Award用于资助全美处于职业生涯前两年的杰出tenure-track助理教授，近几年全美每年在计算机算法理论
  Algorithmic Foundations (AF)方向的获得者只有4位）。

  2015-2016年获加州伯克利大学和清华大学联合颁发的西蒙斯奖学金（Simons-Berkeley Research Fellowship），用于资助世界范围的杰出青年计算机学者（每学期全球的入选者一般不超过16位）。

  2015年获纽约州立大学布法罗分校计算机科学与工程系最佳博士毕业论文。

  代表性论著

  ：

  近5年5篇代表性第一作者文章：

  Hu Ding, Jinhui Xu:FPTAS for Minimizing the Earth Mover''s Distance Under Rigid
  Transformations and Related Problems. Algorithmica 78(3): 741-770 (2017) （算法方向知名期刊）

  Hu Ding, Jing Gao, Jinhui Xu:Finding Global Optimum for Truth Discovery: Entropy
  Based Geometric Variance. Symposium on Computational Geometry 2016: 34:1-34:16 （计算几何方向顶级会议）

  Hu Ding, Yu Liu, Lingxiao Huang, Jian Li:K-Means Clustering with Distributed Dimensions.
  ICML 2016: 1339-1348 （人工智能方向顶级会议）

  Hu Ding, Jinhui Xu:Random Gradient Descent Tree: A Combinatorial Approach for SVM
  with Outliers. AAAI 2015: 2561-2567（人工智能方向顶级会议）

  Hu Ding, Jinhui Xu:A Unified Framework for Clustering Constrained Data without Locality
  Property. SODA 2015: 1471-1490（算法方向顶级会议）'
