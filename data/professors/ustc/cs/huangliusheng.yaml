  主要研究方向

  ：

  网络（无线传感网、物联网、车联网），信息安全(信息隐藏、安全多方计算、量子信息安全)等，大数据与云计算（大数据分析挖掘、大数据隐私保护、云安全）。

  黄刘生，男，1957年4月生，教授、博士生导师，享受国务院政府特殊津贴。曾任中国科大国家高性能计算中心（合肥）副主任，计算机科学技术系系主任，信息科学技术学院副院长。现任中国科大苏州研究院常务副院长，教育部信息安全类专业教学指导委员会委员，中国计算机学会计算机教育专业委员会常委、传感器网络专业委员会委员（发起人之一）、电子政务和办公室自动化专委会委员，《计算机研究与发展》编委、《小型微型计算机系统》编委、《中国科学技术大学学报》编委，中国科大校学术委员会委员、校学位委员会委员等。担任过10多个国际学术会议的程序委员会委员、组织委员会委员、主席。

  近年来作为负责人或主要成员承担过国家973、863重点、国家自然科学基金、中科院、国家部委等20多个项目的研究，曾获国家科技进步二等奖、国家教学成果二等奖、中科院等省部级科技进步一、二、三等奖等多项奖励。先后出版著作6部；在ACM
  Computing Surveys、IEEE Trans. on Wireless Communications、IEEE Trans. on Service
  Computing、IEEE Trans. on Vehicular Technology、Journal of Parallel and Distributed
  Computing、Theoretical Computer Science、Optics Communications、Quantum Information
  Processing、Int’l J. of Modern Physics、Science China等国内外著名杂志和Mobicom、Infocom、Sensys、ICNP等重要国际会议上发表论文200多篇，其中SCI、EI收录180多篇，并有多篇论文获得过国内外重要学术会议的最佳论文奖。

  近年负责的国家级项目：

  智能电网大数据环境下数据安全关键技术及机理研究(2013-2015),国家电网基础前瞻性项目,200万；

  面向车联网的数据中心关键技术研究及产业化（2013.01-2014.12），国家发改委物联网专项，1220万（已通过评审）；

  物联网系统优化机理研究（2011.01-2013.08），国家973一级子课题，148万；

  基于Web的无线泛在业务环境体系架构、关键技术研究与演示验证（2012.01-2014.12） ，国家科技重大专项，363万；

  泛在网络下多终端协同的网络控制平台及关键技术，国家科技重大专项（2011.01-2013.12），522万；

  信息汇聚传感器网络综合测试与验证评估环境（2011.01-2012.12），国家科技重大专项， 375万；

  基于协作通信的能量有效无线网络多信息流路由问题研究（2012.1-2015.12），国家自然科学基金，58万

  无线传感网络应用示范系统（2006-2010），国家973一级子课题，260万

  可信的安全多方计算环境构建方法及其关键技术研究（2009－2011），国家自然科学基金，50万

  安全多方量子计算基础协议的研究与应用（2008-2010），国家自然科学基金，29万；

  无线传感网络节点定位及目标跟踪（2007－2009），中科院知识创新工程重要方向项目， 50万；

  基于IPv6无线传感器网络的环境监测系统（2005－2006），国家发改委下一代互联网（CNGI）示范项目，1100万；

  基于CNGI和WSN的矿山井下定位与应急联动系统（2006－2008），国家发改委下一代互联网（CNGI）示范项目，1870万；

  具有高可靠信息收集能力的WSN体系结构研究，863项目，（2006－2008），50万；

  安全多方计算技术中的若干关键问题及其应用研究（2007－2009），国家教育部博士点基金，6万；

  无线协作网络的多资源联合分配问题研究（2010-2012），国家教育部博士点基金，6万。

  获奖情况

  ：

  “安徽省防灾减灾智能信息与决策支持系统”2001年获国家科技进步二等奖（排名第2）；

  “并行算法类教学基地建设”2001年获国家教学成果二等奖（排名第5）；

  “宝钢优秀教师奖”，2004年。

