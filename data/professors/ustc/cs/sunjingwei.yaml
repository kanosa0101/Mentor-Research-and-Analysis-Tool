  主要研究方向

  ：

  高性能计算，

  性能评测与建模，高效深度学习推理

  孙经纬，副教授。2020年于中国科学技术大学获得博士学位。2018年3月至9月于瑞士苏黎世联邦理工学院访问学习，2021年12月至2022年3月于微软亚洲研究院访问交流。主要研究方向为高性能计算、并行程序性能建模与预测、高效深度学习推理等。以第一/通讯作者在TPDS、TACO、TC、DAC、NeurIPS、AAAI、ICS等期刊或会议发表论文二十余篇；申请专利6项。获
  IEEE Cluster 2024 最佳论文奖、Bench 2021最佳学生论文奖、ACM SIGHPC China 2025 新星奖。主持国家自然基金青年项目（C类）以及华为、字节跳动、中科曙光、蔚来汽车等企业科研项目7项，作为技术骨干参与中科院先导专项等科研项目4项。

