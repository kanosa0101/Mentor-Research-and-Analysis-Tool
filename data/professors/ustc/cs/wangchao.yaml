bio_raw: 'E - Mail：cswang@ustc.edu.cn

  个人主页：

  http://staff.ustc.edu.cn/~cswang

  https://faculty.ustc.edu.cn/cswang/

  主要研究方向

  ：智能计算机体系结构、深度学习处理器、FPGA应用加速。

  王超，教授，博士生导师，软件学院副院长，国家级青年人才，英国工程技术学会会士，英国计算机学会会士，

  IEEE

  高级会员，

  ACM

  高级会员，

  CCF

  杰出会员，

  CCF

  体系结构专委会常务委员，中国科学院青年创新促进会优秀会员。在中国科学技术大学计算机学院获得学士、博士学位，并曾于美国加州大学圣塔芭芭拉分校担任访问学者。主持参加国家自然科学基金、国家重点研发计划课题、中科院先导项目课题等多项国家和省部级科研项目。在

  TPDS

  、

  TC

  、

  TCAD

  、

  MICRO

  、

  DAC

  、

  RTSS

  、

  FPGA

  等高水平学术期刊和会议上发表论文

  100

  余篇，参与研制了基于国产智能芯片的智能计算系统，相关成果在多家单位得以应用。担任

  ACM TODAES

  、

  IEEE TVLSI

  、

  ACM TCBB

  等国际期刊的编委。

  获奖情况

  ：

  2024

  年

  -

  高校计算机专业优秀教师奖励计划

  2023

  年

  -

  国家级青年人才

  2022

  年

  -DeepTech

  中国智能计算科技创新人物

  2021

  年

  -

  中国科学院青年创新促进会优秀会员

  2016

  年

  -ACM

  中国新星提名奖

