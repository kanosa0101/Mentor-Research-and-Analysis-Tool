bio_raw: 'Email：

  xxieww@ustc.edu.cn

  xxieww@gmail.com

  主要研究方向

  ：

  量子算法设计与分析、量子计算系统设计与优化、人工智能赋能量子计算

  解围，副研究员，硕士研究生导师。在南京大学、清华大学和悉尼科大分别获得学士、硕士和博士学位。2020年7月加入中国科学技术大学计算机科学与技术学院。研究领域为量子计算和量子信息及其与人工智能的交叉。在Trans
  on CAD、Trans on ACO、NeurIPS、IJCAI、CGO、ICCAD、PRR、QIC、PRA等知名期刊和会议上发表二十余篇论文。主持国家自然科学基金委青年项目和企业横向项目，并参加多项重大科研项目。

  招生信息

  ：

  欢迎对量子计算和量子信息有浓厚兴趣且在计算机或数学或物理学科有一定基础的同学与我联系。无需具备量子力学基础，但需具备线性代数基础。

  代表性论著

  ：

  1. Mingzheng Zhu, Hao Fu, Haishan Song, Jun Wu, Chi Zhang, Wei Xie*, and Xiang-Yang
  Li*. Ecmas+: Eﬀicient circuit mapping and scheduling for surface code encoded circuit
  on quantum cloud platform. ACM Transactions on Architecture and Code Optimization
  2025. (CCF推荐A类期刊)

  2. Fangzheng Chen, Hao Fu, Mingzheng Zhu, Chi Zhang, Wei Xie*, and Xiang-Yang Li.
  A framework for dynamic quantum circuit execution: Balancing effectiveness and eﬀiciency.
  IEEE Transactions on Computer-Aided Design of Integrated Circuits and Systems 2025.
  (CCF推荐A类期刊)

  3. Yingqi Yu, Honglin Chen, Jun Wu, Wei Xie*, and Xiang-Yang Li*. Purest quantum
  state identification. Advances in Neural Information Processing Systems 2025. (CCF推荐A类会议)

  4. Hao Fu, Mingzheng Zhu, Fangzheng Chen, Chi Zhang, Jun Wu, Wei Xie*, Xiang-Yang
  Li*. Effective and eﬀicient parallel qubit mapper. IEEE Transactions on Computer-Aided
  Design of Integrated Circuits and Systems 2025. (CCF推荐A类期刊)

  5. Honglin Chen, Jicun Li, Wei Xie*, and Xiang-Yang Li*. Quantum estimation of Chernoff
  bound and Hoeffding bound. Physical Review Research 2025. (中科院2区期刊)

  【更新于2026年3月】'
