bio_raw: '电  话：(0551)

  E- mail： kxing@ustc.edu.cn

  个人主页：

  http://staff.ustc.edu.cn/~kxing

  主要研究方向

  ：理论研究方面涉及物联网/互联网、大数据与云计算、金融/医学数据挖掘、群智感知计算等领域；系统研究方面涉及无人机、无人车、IC设计、操作系统等领域。

  邢凯，男，1981年7月生，博士，副教授。2003年于中国科学技术大学计算机科学与技术系获学士学位后，进入乔治华盛顿大学计算机科学系学习，先后获硕士、博士学位。曾于国际货币基金组织供职，从事全球金融资本监控及数据挖掘的相关研究工作。曾担任IEEE
  Journal on Selected Areas in Communications (IEEE JSAC)、IEEE Transactions on Wireless
  Communications (TWC)、EURASIP、IEEE MASS等一系列国际期刊和会议的审稿人。

  近年来合作出版著作两部，主要成果陆续发表于ACM Mobicom、ACM Mobihoc、IEEE INFOCOM、IEEE ICDCS、IEEE Transactions
  on Mobile Computing、IEEE Transactions on Wireless Communications、IEEE Transactions
  on Knowledge and Data Engineering、Wireless Networks、JPDC、 WCMC等一系列计算机领域国际顶级学术会议和著名期刊。在国际主要学术刊物和学术会议上发表论文80余篇，其中有70多篇被SCI和EI收录，单篇他引次数最高达200次以上。

  研究方向

  ：

  理论研究方面涉及物联网/互联网、大数据与云计算、金融/医学数据挖掘、群智感知计算等领域，主要有：

  1. 计算机网络相关，如未来网络理论、信息动力学、社交网络、物联网、互联网等

  2. 信息处理与挖掘相关，如大数据，数据挖掘，群智感知计算，压缩感知等

  3. 信息安全相关，如网络安全，数据安全、隐私保护、金融监控等

  系统研究方面涉及无人机、无人车、IC设计、操作系统等，主要有：

  1. IC设计：信号采集，高速同步并行处理

  2. 操作系统：实时OS，Adroid，iOS，Linux

  3. 硬件开发：ARM，FPGA，DSP

  学生培养

  ：

  1..毕业去向：

  已毕业本科生均已出国深造；已毕业研究生5人，其中3人国内工作、2人出国深造

  国外：CMU、哈佛、UT Austin、UCLA、香港科技大学、UMASS、UC Davis等国际名校

  国内：微软、腾讯、国家电网、银行、绿盟等业内旗舰企业

  2. 所获奖励：

  郭沫若奖学金（本科生最高级别奖学金，4年一评），2人

  国家奖学金（研究生最高级别奖学金），3人

  其他奖学金若干

  获奖情况

  ：

  2013年Intel全球青年学者奖励（共22人），与来自普林斯顿、UC Berkeley、MIT、CMU等国际知名高校的教授一同入选，获 1 万 5 千美元个人科研奖励；

  2012年CWSN最佳论文奖

  2007年国家优秀自费留学生，获 5 千美元个人科研奖励

  2006年国际会议 WASA''06 最佳论文奖

