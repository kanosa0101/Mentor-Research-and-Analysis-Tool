bio_raw: '电　话：(0551)63603412

  E-Mail：ykli@ustc.edu.cn

  个人主页：

  http://staff.ustc.edu.cn/~ykli

  主要研究方向

  ：存储系统（key-value系统、文件系统、大规模内存系统），并行与分布式系统，云计算，Serverless，智能计算系统的存储与I/O支持等。

  李永坤，男，教授，IEEE、ACM、CCF会员，信息存储专委委员。本科毕业于中国科学技术大学，博士毕业于香港中文大学，师从John C.S. Lui教授。主要致力于面向大规模数据密集型计算的存储系统研究，共发表论文70余篇，包括FAST、ATC、ICDE、SIGMETRICS、TOS、TC、TPDS等。主持国家自然科学基金青年与面上项目、安徽省自然科学基金项目、PingCAP、华为、阿里等提供的多项企业合作项目，以单位负责人参与科技部重点研发计划课题、重点研发青年科学家项目。入选中科院青促会并获评优秀会员，获评唐仲英基金会仲英青年学者、翟光龙学者等。

  获奖情况

  ：

  2023 中科院青促会优秀会员

  2023 国家级青年人才

  2022 翟光龙学者

  2020 ACM中国合肥分会学术新星奖

  2019 仲英青年学者

  2019 中科院青促会会员

  2016 王宽诚育才奖

  2015 CCF-腾讯犀牛鸟基金优秀奖

