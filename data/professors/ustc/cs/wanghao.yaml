bio_raw: 'Email:

  wanghao3@ustc.edu.cn

  英文主页：

  http://staff.ustc.edu.cn/~wanghao3/

  中文主页：

  https://faculty.ustc.edu.cn/wanghao3/zh_CN/index/991588/list/index.htm

  实验室主页：

  https://bigdata.ustc.edu.cn/

  ,

  http://cogskl.iflytek.com/

  ,

  主要研究方向：

  数据科学、人工智能、大语言模型、推荐系统及

  AI4Science

  等

  王皓，博士，副教授。2021年获得中国科学技术大学计算机应用专业博士学位，于2020年1月至2021年1月受国家留学基金委CSC资助赴美国伊利诺伊大学香槟分校（UIUC）访问学习，主要研究方向数据科学、人工智能、大语言模型、推荐系统及AI4Science等。在TKDE、TOIS、ICML、KDD、NeurlPS等高水平期刊和会议上发表论文50余篇，其中以第一作者或通讯作者发表期刊会议论文30余篇，申请专利10余项，谷歌学术引用3000余次。相关学术成果在华为、腾讯、美团等公司开展落地应用，其中包括华为盘古大模型、腾讯工业广告等，相关开源项目获2K+
  Stars。获中国电子学会自然科学一等奖、KDD2024唯一最佳学生论文奖、安徽省青年科技人才托举计划、第九届中国智能技术与大数据会议优秀论文、中国科大墨子杰出青年特资津贴、腾讯精英人才计划导师，美团最佳合作奖等荣誉。主持国家自然科学基金面上项目、重点项目课题、青年基金项目、安徽省科技创新攻坚计划重点项目课题及技术总师、CCF-腾讯犀牛鸟基金及阿里巴巴创新研究计划(AIR)等相关项目。担任Entropy(SCI
  Q2期刊)Special Issues Guest Editor、KDD、NeurIPS、ICML、WWW、SIGIR、AAAI等国际程序委员会委员及TPAMI、TKDE、TOIS等高水平期刊审稿人等。

  欢迎相关专业优秀、自驱力强的本科生/硕士生加入课题组，同时也欢迎低年级本科生提前加入大创/实习等，一起探索学术前沿问题。

  主持项目：

  1.

  大模型协同的跨域用户序列行为建模方法及应用，国家自然科学基金-面上项目，2025-2027，主持

  2.

  数据产权登记合规性验证与风险管控技术，国家自然科学基金-重点项目，2025-2027，课题负责人

  3.

  面向网络数据的多语义属性结构表征学习及应用研究，国家自然科学基金-青年科学基金项目，2023-2025，主持

  4.

  基于科技文献与实验数据的科学知识推演大模型，省创新攻坚计划，2024-2027，课题负责人

  5.

  跨域复杂用户序列推荐，CCF-腾讯犀牛鸟项目基金，2023-2024，主持

  6.

  基于预训练知识点的企业搜索相关性模型研究，阿里创新研究AIR计划，2023-2024，主持

  获奖

  情况：

  1.

  2025年, 王宽诚育才奖，校教育基金会奖

  2.

  2024年, 自然科学一等奖, 中国电子学会

  3.

  2024年, 省青年科技人才托举计划, 安徽省科学技术协会

  4.

  2024年，CCF-A类会议KDD2024唯一最佳学生论文奖，KDD国际学术委员会

  5.

  2024年，腾讯精英人才计划入选学生导师

  6.

  2023年，CCF-腾讯犀牛鸟基金入选学者

  7.

  2023年，第九届中国智能技术与大数据会议优秀论文，中国人工智能学会

  8.

  2022年，中国科学技术大学墨子杰出青年特资津贴

  9.

  2019年，国家公派联合培养博士研究生-CSC

