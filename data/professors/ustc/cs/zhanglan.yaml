bio_raw: 'E-Mail：zhanglan@ustc.edu.cn

  主要研究方向

  ：

  跨域智能计算，模型推理优化，AI隐私安全，数据共享交易

  张兰，教授，博士生导师，优青。2007年毕业于清华大学软件学院，获学士学位。2014年毕业于清华大学计算机科学与技术系，获博士学位。2014年-2016年于清华大学软件学院做博士后。2016年到中国科学技术大学计算机科学与技术学院担任特任研究员，2019年任特任教授，2022年任教授。围绕跨域智能计算，AI隐私安全和数据共享交易进行研究，其成果共发表国际知名会议和期刊论文140余篇，其中CCF荐A类会议/期刊论文70余篇。研究成果共申请相关中国发明专利70余项，其中已授权40余项，申请美国发明专利3项。2015获得
  中国计算机学会（CCF）优秀博士学位论文奖（每年全国共10人）和国际计算机学会（ACM）中国优秀博士论文奖（每年全国共2人）。2018年获得首届阿里巴巴达摩院青橙奖。2018年获得全国高校云计算应用创新大赛1530支参赛队伍中的唯一全国特等奖。2023年获全国大数据与计算智能挑战赛一等奖（第一名）。在科研项目方面，主持了两项国家重点研发计划课题，两项国家自然科学基金重点项目，一项国家自然科学基金优秀青年科学基金项目，一项国家自然科学基金面上项目。此外还主持了中国科大学术领军人才培养计划项目，中国科大创新团队培育基金项目等,并与阿里巴巴，腾讯,招商银行等企业进行科研技术项目合作。在学术服务方面，任ACM
  China 合肥分会联合主席，目前/曾经担任多个国际知名会议的程序委员会联合主席、出版主席、程序委员会委员等。

  获奖情况：

  1. 2024 CCF科技创业大赛AI+底层能力赛道 三等奖

  2. 2024 第二届“华彩杯”算力创新应用大赛2024全国总决赛二等奖（6800+参赛队伍）

  3. 2024 第二届“华彩杯”算力创新应用大赛全国总决赛华彩之星（十佳辩手，10/6800）

  4. 2023 2023年第五届全球校园人工智能算法精英大赛 一等奖

  5. 20232023全国大数据与计算智能挑战赛（数据集隐私求交技术赛题揭榜挑战）一等奖，1/135

  6. 2022 Distinguished Member of the 2022 INFOCOM Technical Program Committee

  7. 2021 Distinguished Member of the 2021 INFOCOM Technical Program Committee

  8. 2020 IWQOS Video Presentation Award

  9. 2019 MSN国际会议唯一最佳论文奖。

  10. 2018阿里巴巴青橙奖。（全国共9名）

  11. 2018全国高校云计算应用创新大赛唯一全国特等奖（1/1530）。

  12. 2017江苏省高层次创新创业人才引进计划（“双创计划”）双创博士。

  13. 2015中国计算机学会（CCF）优秀博士学位论文奖（每年全国共10名）。

  14. 2015国际计算机学会（ACM）中国优秀博士论文奖（每年全国共2名）。

  15. 2007微软创新杯软件设计大赛中国赛区第三名。

