bio_raw: 'E-Mail： wufeng02@ustc.edu.cn

  个人主页：

  http://staff.ustc.edu.cn/~wufeng02/

  主要研究方向

  ： 智能机器人（Intelligent Robots）、多智能体系统（Multi-Agent Systems）、自主决策推理（Autonomous Reasoning
  and Decision Making）、强化学习（Reinforcement Learning）

  吴锋，男，副教授，硕士生导师。2006年获中国科学技术大学计算机科学与技术学士学位，2011年获中国科学技术大学计算机应用技术博士学位。2008年至2010年于美国马塞诸塞大学阿莫斯特分校（University
  of Massachusetts Amherst）计算机系访学。2011年至2014年于英国南安普顿大学（University of Southampton）电子与计算机工程学院任博士后研究员。主持国家科技重大专项子课题、国家自然科学基金、安徽省自然科学基金等多项国家和省部级科研项目，入选中国科学院青年创新促进会。在人工智能和机器人领域，针对不确定环境下智能体的自主决策问题，开展了系统的理论和应用基础研究。基于“分布马尔科夫决策+在线启发式搜索”的技术路线，形成了多机器人自主协作与对抗的技术体系，成功应用于具有“人工智能测试标杆”之称的机器人足球领域，自2005年以来连续11年保持世界前二，在自主适应性等方面国际领先。相关成果在AIJ、JAIR、JAAMAS、IJCAI、AAAI、NIPS、AAMAS、ICAPS等人工智能重要国际期刊和会议上发表论文40余篇，担任多个知名国际会议的程序委员会委员及知名国际期刊的审稿人。

  获奖情况

  ：

  2015年获国际会议AAMAS 2015最佳应用论文奖

  2015年获RoboCup标准测试挑战赛冠军

  2012年获中国科学院优秀博士论文奖

  2011年获中国科学院院长特别奖

  2011年获安徽省品学兼优毕业生

  2010年获教育部博士研究生学术新人奖

  2007年获RoboCup微软挑战赛冠军

  2006年获RoboCup仿真2D组冠军

  2005年获RoboCup仿真2D组亚军

