  (IJCAI), Pages 407-413, Yokohama, Japan, July, 2020.

  Feng Wu, Shlomo Zilberstein, Xiaoping Chen. Privacy-Preserving Policy Iteration
  for Decentralized POMDPs. In Proceedings of the 32nd AAAI Conference on Artificial
  Intelligence (AAAI-18), Page 4759-4766, 2018.

  Feng Wu, Shlomo Zilberstein, Xiaoping Chen. Multi-Agent Planning with Baseline Regret
  Minimization. In Proceedings of the 26th International Joint Conference on Artificial
  Intelligence (IJCAI-17), Page 444-450, 2017.

  Feng Wu, Sarvapali D. Ramchurn, Xiaoping Chen. Coordinating Human-UAV Teams in Disaster
