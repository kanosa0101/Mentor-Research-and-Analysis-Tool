  主要研究方向

  ：工业智能，智能物联网，量子计算，行业大模型，数据可信空间，安全与隐私，计算经济学

  李向阳（英文用名Xiang-Yang Li），中国科学技术大学计算机科学与技术学院教授、博士生导师、新创讲席教授。现任中国科大信息与智能学部执行部长，计算机科学与技术学院执行院长，软件学院执行院长，安徽省工业互联网智能软件与理论实验室主任，中国科大-蔚来联合实验室主任，中国科大-阿里联合实验室主任，中国科大-华为鲲鹏昇腾中心主任。学术服务方面，现任ACM中国理事会指导委员会主席，ACM
  SigMobile China联合主席，CCF常务理事，中国密码学会物联网密码专委会副主任，安徽省大数据产业协会会长；曾任ACM中国理事会共同主席、ACM Publication
  Board成员。

  由于在智能物联网和移动计算的设计、优化、系统实现方面的贡献，获ACM Fellow、IEEE Fellow和ACM杰出科学家（ACM Distinguished
  Scientist）称号。获批国家特聘专家，国家自然科学基金杰出青年基金获得者，国家重点研发计划物联网安全项目首席科学家，享受国务院政府特殊津贴专家。带领下一代移动计算与数据创新团队（LINKE）入选第一批全国高校黄大年式教师团队（中国科大首批团队）。获教育部自然科学一等奖（2025）、安徽省科技进步一等奖（2025）、CCF自然科学一等奖（2024）、安徽省创新争先奖（2024）、汽车工程学会科技进步一等奖（2023）。

  1995年获得清华大学计算机科学和工商管理双学士学位，1999年获得美国伊利诺伊大学厄巴纳-香槟分校硕士学位，2001年获得该校博士学位。曾任美国伊利诺伊理工大学计算机科学系助理教授、副教授、教授，清华大学EMC讲席教授，微软亚洲研究院访问教授，2012年5月至2015年12月曾任无锡清华信息科学与技术国家实验室物联网技术中心副主任。

  李向阳教授长期从事工业智能，智能物联网，量子计算，行业大模型，数据可信空间，安全与隐私，计算经济学方向的研究。首次将射频识别室内定位精度提高到毫米级。作为首席科学家承担了国家重点研发计划、杰出青年基金、海外杰出青年基金、国家自然科学基金重点项目及多项企业重点研究项目等共20余项。自2000年以来已在高水平国际期刊及会议累计发表学术论文500余篇（其中CCF
  A类期刊/会议论文约200篇），包括移动计算/无线网络领域顶级会议ACM MobiCom论文16篇。谷歌学术论文引用总数超过3万3千次，H-Index 92。共10余次获得国际会议最佳论文奖，包括领域顶级会议ACM
  SenSys 2023 Test of Time Award（大陆学者首次）、领域旗舰会议ACM MobiCom 2014唯一最佳论文（大陆学者首次）、IEEE
  GlobeCom 2015最佳论文等。获批国内外发明专利授权67项。撰写了无线网络领域专著《Wireless Ad Hoc and Sensor Networks:
  Theory and Applications》（2008年出版）。曾担任《IEEE/ACM Transactions on Networking》《IEEE
  Transactions on Mobile Computing》《IEEE Transactions on Parallel and Distributed
  Systems》等期刊编委，以及算法百科全书《Encyclopedia of Algorithms》无线网络学科方向编辑。曾担任多个知名国际学术会议程序委员会主席或大会主席（如ACM
  MobiHoc、IEEE MASS等），多年来担任本领域重要学术会议程序委员会成员（如ACM MobiCom、IEEE INFOCOM等），并担任美国NSF、中国NSFC、香港RGC及科技部重点研发计划等重大项目评委。独立/合作指导博士50余名，大部分在美国和中国高校担任教职。相关研究成果应用于蔚来、华为、华米等知名企业，积极服务地方经济与产业发展。

