  主要研究方向

  ：

  高性能计算芯片和系统结构，并行程序设计环境与工具，高性能计算，科学人工智能，量超融合计算

  安虹，博士，讲席教授，博导，省教学名师。1993年7月至今在中国科学技术大学计算机科学与技术（系）学院任教。现任讲席教授、时珍书院院长、高性能计算系统与软件前沿交叉研究院执行院长、中国科大计算机学院先进计算机系统结构实验室主任、院学术委员会和教学委员会委员、计算机系统结构专业学位点负责人、本科生计算机体系结构类课程组组长。曾为中科院计算所、美国能源部劳伦斯伯克利国家实验室等单位客座研究人员或访问科学家。（曾）任ACM
  SIGHPC China 副主任、国际HPC-AI咨询委员会委员、CCF体系结构专委常务委员和高性能计算专委常务委员、教育部高等学校计算机专业类教学指导委员会计算机系统专家委员会委员、CCF出版工作委员会执行委员、《计算机研究与发展》、《中国图象图形学报》等期刊编委、30余个国际国内学术会议程序委员会主席或委员。曾任合肥蜀山区人大常委，现任安徽省政府参事、九三安徽省科技委委员。作为负责人承担了国家973课题、国家863、国家自然科学基金、国家科技重大专项、国家重点研发计划等项目，以及省部级和横向课题40余项，在国内外计算机系统结构和高性能计算著名ISCA、HPCA、ASPLOS、DATA、PPoPP、SC、TPDS、IPDPS、IJPP、ICS、ICPP、HPCC、IJPC、FGCS、Information
  Sciences等上，以及Nutrue、Science Bulletin、Nature Comm科学期刊上发表学术论文200余篇，获得技术发明专利授权和软件登记20余项，出版教材1部，译著1部。

  主要访问/双聘工作经历

  ：

  · 1992-1993年为浙江大学CAD&CG国家重点实验室客座研究人员，从事图形图像并行算法和体系结构方面的研究工作。

  ·

  1995-1996年为中国科学院计算技术研究所国家智能计算机研究开发中心客座研究人员，从事并行计算机体系结构和并行程序设计环境方面的研究工作。

  ·

  2001-2004年为中国科学院计算技术研究所计算机系统结构专业博士后，从事高性能微处理器体系结构方面的研究工作。

  · 2008-2010年受英特尔公司资助参与由美国加州大学伯克利分校牵头，斯坦福、MIT等大学和英特尔、微软、IBM等大公司参加的RAMP国际合作项目，从事片上多处理器体系结构的研究工作。

  · 2015年为美国能源部劳伦斯伯克利国家实验室联合基因组研究所访问科学家，从事基因分析并行算法、软件和系统方面的研究工作。

  · 2023年12月至今双聘为崂山实验室研究员，入选“鳌山人才计划”卓越科学家。现任崂山实验室先进计算研究中心主任、崂山实验室-中国科大透明海洋先进计算联合实验室主任。

  招生信息

  ：

  要求学生对高性能计算机系统结构、科学人工智能软件设计有浓厚的兴趣和做出一流工作的愿望；诚实守信、性格开朗、勤奋自律；良好的沟通交流能力和团队协作精神；计算机系统结构相关基础知识扎实，编程能力、英语交流能力较强。

  科研工作

  ：

  长期从事高性能计算芯片、系统和应用相关研究工作。作为最早的核心人员，参与筹备和建设了我国第一家高性能计算中心——国家高性能计算中心（合肥）。在并行计算机体系结构、数据流并行编程与运行时系统、高性能计算和科学人工智能的研究方面做出了系统性、创新性的成果。

  （1）在微处理器芯片方面，作为骨干研究人员参加了龙芯1号和龙芯2号的体系结构设计和性能分析工作；提出了多核微处理器芯片体系结构SPoTM/LogSPoTM设计思想及其关键技术，通过硬件支持实现串行程序自动推测并行化和隐式同步执行；提出了众核微处理芯片体系结构DISC/PAS-TPA设计思想及其关键技术，以及基于FPGA实现的大规模片上并行结构硬件模拟与性能评估技术。获得首届中国科学院杰出科技成就奖。

  （2）在并行编程环境与工具方面，主持过神威、曙光、华为和龙芯等国产高性能计算芯片和系统上的并行程序设计环境和工具的开发工作，相关研究成果已应用于神威、曙光、华为和龙芯设计的国产高性能芯片和系统，支持多核众核平台的上的并行应用软件开发;
  在国产超算系统上首次实现了基于数据流计算模型的大规模深度学习编程环境和运行时系统swFLOW，支持HPC+AI+BigData融合计算。获得国家科技进步二等奖和中国科学院科技进步二等奖。

  （3）在高性能计算方面，在国产E级超算系统上提出了一系列的计算、访存、通信和I/O优化关键技术以突破E级超算系统上的关键技术瓶颈，产生多项填补世界空白的重大超算应用成果，四次获得超算领域最高奖戈登·贝尔奖提名，两次获得“中国超算年度最佳应用”奖，获得中国科大杰出研究校长奖。

  （4）在高性能数据分析方面，开发了医学视觉大模型及其应用软件iMED，在心脏超声认知计算、肿瘤影像组学分析、数字病理分析等应用领域取得了一系列临床应用成果。 “医学影像阅片机器人”入选
  CCTV-1《机智过人》重点拍摄节目；“心脏超声量化分析”拍成安徽省广电局建国70周年献礼专题片-《我们的奋斗——最好的我们》，并被CCTV-3经济半小时栏目专题报道。在AI算法、软件和系统相关赛事中获得20余个奖项。

  教学工作

  ：

  长期工作在计算机系统结构和高性能计算学科交叉教育、教学、教练一线，在计算机教育教学改革、拔尖人才培养等方面做出了多项创新性和示范性教育成果，培养了一批计算机系统结构和高性能计算领域的拔尖杰出人才。

