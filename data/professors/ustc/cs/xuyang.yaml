bio_raw: '电子邮箱：xuyangcs@ustc.edu.cn

  个人主页：https://y-xu.github.io/

  课题组主页：https://int-ustc.github.io/

  主要研究方向

  ：

  物联网、边缘智能、联邦学习、联邦大模型、

  AI

  智能体

  许杨，男，安徽寿县人。现为中国科大计算机科学与技术学院副教授，硕士生导师。

  2014

  年于武汉理工大学计算机科学与技术学院获学士学位，

  2019

  年于中国科学技术大学计算机科学与技术学院获博士学位。

  2019

  年荣获中国科大墨子杰出青年特资津贴一等资助，并入选中国科学院特别研究助理资助项目。主要从事物联网、边缘智能计算、

  AI

  智能体等方面的研究。近年来，在网络、普适计算、人工智能、数据智能等领域发表高水平论文

  50

  余篇，其中一作

  /

  通讯论文

  30

  余篇（包括

  MobiCom

  、

  UbiComp

  、

  ACL

  、

  ICDE

  、

  INFOCOM

  、

  TMC

  等

  CCF A

  类论文

  35

  篇），

  2

  篇论文入选

  ESI

  高被引论文。其中，

  2016

  年发表在普适计算领域旗舰会议

  ACM UbiComp

  上的论文获最佳论文奖。作为项目负责人主持国自然面上项目、国自然青年项目、江苏省自然青年项目、华为技术咨询项目、北京控制工程研究所横向项目、中国科大青年创新基金等项目各

  1

  项；作为技术负责人

  /

  项目骨干参与国自然重点项目

  1

  项、国家重点研发计划课题

  1

  项，以及华为合作项目

  1

  项。

  获奖情况

  ：

  1.2024年，指导的研究生获国家自然科学基金博士生项目（学院仅2名），并入选中国科协青年人才托举工程博士生专项计划

  2.

  2019

  年，中国科大“墨子杰出青年特资津贴”（一等）

  3.

  2016年，普适计算

  领域旗舰会议ACM UbiComp最佳论文奖

