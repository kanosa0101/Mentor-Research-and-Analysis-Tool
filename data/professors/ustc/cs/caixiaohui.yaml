bio_raw: '电  　话：(0551)63600524

  E - Mail：caixiaohui@ustc.edu.cn

  实验室主页：

  http://pplab.ustc.edu.cn

  主要研究方向

  ：智能织物、嵌入式系统、新型传感器、模式识别，及以上技术在具身智能、人体工学和智慧医疗等方向的应用。

  蔡晓辉，女，中科大计算机科学与技术学院教授，博导，中科大近代物理系应用物理学专业2002届学士，电子科学与应用专业2007届博士（硕博连读）。2007-2018年间在德国进行基于智能织物的普适计算方向的科研，历任帕绍大学博士后、德国人工智能研究中心高级研究员和德国布伦瑞克工业大学青年教授，2018年回国。已在智能织物方向发表论文50余篇，主要发表在普适计算、可穿戴计算方向的UbiComp、PerCom、ISWC等会议和IEEE
  Sensors Journal上，参与编著Springer出版社Smart Textiles - Fundamentals, Design and Interaction。归国后主攻以智能织物为代表的精密普适计算，已完成压阻阵列型智能织物从织物传感器、嵌入式硬件到人工智能算法的全面国产化，近期研究重点为该种智能织物的底层性能提高，以及其在具身智能、人体工学和人类行为识别方向的应用。

  招生信息

  ：

  要求学生对智能硬件和信号处理有浓厚的兴趣和做出一流工作的愿望，诚实守信、性格开朗、勤奋自律；有良好的沟通交流能力和团队协作精神；特别欢迎有扎实物理或电子学功底、或本科为纺织／机械方向的跨专业学生。

  实验室介绍视频：

  https://www.bilibili.com/video/BV1Nb4y1V7oq/

  中科大图书馆和党委宣传部，一鉴漫读•科视界 | 蔡晓辉：感知新路，敢向新生：

  https://shorturl.at/JLKPD

  致将要加入实验室的你:

  http://pplab.ustc.edu.cn/2018/0822/c15533a310022/page.htm

  教学工作

  ：

  现讲授中科大本科《模拟与数字电路》和《科学与社会：智能纺织品》课程。

  代表项目

  ：

  1. 宁波慈星股份有限公司，横向项目，人形机器人用触觉智能衣及应用展示，2026.02-2028.12，主持;

  2. 国家自然科学基金委员会，面上项目，62072420，基于智能织物的卧床患者三维受力场长程监测方法研究，2021.01-2024.12，主持;

  3. 中科大“新医学”联合基金，重点方向，2150110020，基于智能织物的心肺功能长程监测平台，2021.01至2023.12，主持。

  获奖情况

  ：

  2017 欧盟官方合作电视台Euronews: Innovations Personality of the Year提名

  代表性论著

  ：

  底层架构：

  1.

  Jingyuan Cheng, Oliver Amft, and Paul Lukowicz. Active Capacitive Sensing: Exploring
  a New Wearable Sensing Modality for Activity Recognition. International conference
  on Pervasive Computing, 2010.

  （意义：个人层面上第一次打通智能织物从硬件到算法的全流程）

  2.

  Jingyuan Cheng, Bo Zhou, Paul Lukowicz, Fernando Seoane, Matija Varga, Andreas Mehmann,
  Peter Chabrecek et al. : Textile Building Blocks: Toward Simple, Modularized, and
  Standardized Smart Textile. In Smart Textiles, pp. 303-331, Springer, 2017.

  【书籍章节】（意义：欧盟项目

  SimpleSkin

  中研发的电阻型、电容型、体电阻型智能织物的织物、系统及应用大汇总）

  3.

  Zhen Liang, Dongquan Zhang, Guanghua Xu, Fangting Xie, Hui Cai, Hao Guo, Jingyuan
  Cheng, Smart Garment: A Long-Term Feasible, Whole-Body Textile Pressure-Sensing
  System, IEEE Sensors Journal, 2023.

  （意义：建立全新系统。压力分布织物从环境的平面设计到真正全身覆盖的三维智能衣）

  4.

  Guorui Lu, Kangyu Chen, Qi Wang, Xiaohui Cai: Dual-modality Electromechanical Physiology
  Source Mapping, IEEE Sensors Journal, 2024.

  （意义：引入全新模态。双模态体表心电测量平台，一个面向多模态智能织物的未来但步子迈得有点过大的例子，警醒实验室负责人必须一直立足现实、脚踏实地。）

  5.

  Chenhui Zhang, Zhen Liang, Fangting Xie, Xiaohui Cai: A scalable textile strain
  sensor matrix: design, implementation and application exploration, IEEE Sensors
  Journal, 2025

  （意义：引入全新模态。纯织物拉力阵列设计和应用探索，开辟继压力分布后的第二模态。）

  6.

  Jingyuan Cheng, Fangting Xie, Zhen Liang: Electronic Modeling for Resistive Textile
  Matrices, IEEE Sensors Journal, 2022.

  （意义：找出设计关键点。通过建模探索出压阻阵列型智能织物模拟层的关键因素和下一步改进方向。）

  7.

  Fangting Xie, Zhen Liang, Dongquan Zhang, Mingjie Zhao, Quan Wan, Changhai Ma, Jiayue
  Yuan, Siqi Lei, Xiaohui Cai: Where to Improve? A Systematic Evaluation of Sampling
  Parameters for Pressure Sensor Matrix, Proceedings of the ACM on Interactive, Mobile,
  Wearable and Ubiquitous Technologies, 2025.

  （意义：找出设计关键点。系统性讨论并指出压阻阵列型智能织物数字层的下一步改进方向。）

  应用层：

  8.

  Ziyu Wu, Fangting Xie, Yiran Fang, Zhen Liang, Quan Wan, Yufan Xiong, Xiaohui Cai:
  Seeing through the Tactile: 3D Human Shape Estimation from Temporal In-Bed Pressure
  Images, Proceedings of the ACM on Interactive, Mobile, Wearable and Ubiquitous Technologies,
  2024.

  （意义：从数据到信息。以真实原型机、真实数据和映射算法证实了二维压力

  -

  三维人体体型体态之间存在对应关系。）

  9.

  Dongquan Zhang, Zhen Liang, Yuchen Wu, Fangting Xie, Guanghua Xu, Ziyu Wu, Xiaohui
  Cai: Learn to Infer Human Poses Using a Full-Body Pressure-Sensing Garment, IEEE
  Sensors Journal, 2024.

  （意义：从数据到信息。以真实原型机、真实数据和映射算法证实了三维体表压力

  -

  三维人体姿态之间存在对应关系。）

  10.

  Mengting Niu, Yufan Xiong, Ziyu Wu, Ying Qiu, Fangting Xie, Boyan Liu, Qijun Ying,
  Xiaohui Cai: SleevePose: Elastic Resistive Pressure Sensing Sleeve for Continuous
  Hand Pose Estimation, Proceedings of the ACM on Interactive, Mobile, Wearable and
  Ubiquitous Technologies, 2026.

  （意义：从数据到信息。以真实原型机、真实数据和映射算法证实了胳膊肌肉运动

  -

  胳膊体表压力分布

  -

  手部运动细节之间存在对应关系。）

  【更新于2026年3月】'
