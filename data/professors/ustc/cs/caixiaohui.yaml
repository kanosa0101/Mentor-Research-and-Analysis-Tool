bio_raw: '电  　话：(0551)63600524

  E - Mail：caixiaohui@ustc.edu.cn

  实验室主页：

  http://pplab.ustc.edu.cn

  主要研究方向

  ：智能织物、新型传感器、嵌入式系统、模式识别，及以上技术在具身智能、人体工学和智慧医疗等方向的应用。

  蔡晓辉，女，中科大计算机科学与技术学院教授，博导，中科大近代物理系应用物理学专业2002届学士，电子科学与应用专业2007届博士（硕博连读）。2007-2018年间在德国进行基于智能织物的普适计算方向的科研，历任帕绍大学博士后、德国人工智能研究中心高级研究员和德国布伦瑞克工业大学青年教授，2018年回国。已在智能织物方向发表论文50余篇，主要发表在普适计算、可穿戴计算方向的IMWUT、PerCom、ISWC等会议和IEEE
  Sensors Journal上，参与编著Springer出版社Smart Textiles - Fundamentals, Design and Interaction。2018归国后创立精密普适实验室，主攻智能织物（即如何把一块布变成传感器，以被长期穿戴或环境中使用的方式，获取与人相关的信息），进行跨越纺织、电子学、计算机等多专业的交叉性、系统性研究，已完成压阻阵列型智能织物从织物传感器、嵌入式硬件到人工智能算法的全面国产化。近期研究重点为该种智能织物的底层性能提高，以及其在具身智能、人体工学和医疗健康方向的应用。

  招生信息

  ：

  要求学生对智能硬件和信号处理有浓厚的兴趣和做出一流工作的愿望，诚实守信、性格开朗、勤奋自律；有良好的沟通交流能力和团队协作精神；特别欢迎有扎实物理或电子学功底、或本科为纺织／机械方向的跨专业学生。（为方便协调转专业问题，外校非计算机专业学生，请在大三上或更早时间节点联系。本校学生不限专业，本科阶段欢迎随时联系，以实验室学生、大研大创等多种形式尽早接触科研。）

  实验室介绍视频：

  https://www.bilibili.com/video/BV1Nb4y1V7oq/

  中科大图书馆和党委宣传部，一鉴漫读•科视界 | 蔡晓辉：感知新路，敢向新生：

  https://shorturl.at/JLKPD

  教学工作

  ：

  现讲授中科大本科《模拟与数字电路》和《科学与社会：智能纺织品》课程。

  代表项目

  ：

  1. 国家自然科学基金委员会，面上项目，62072420，基于智能织物的卧床患者三维受力场长程监测方法研究，2021.01-2024.12，主持;

  2. 中科大“新医学”联合基金，重点方向，2150110020，基于智能织物的心肺功能长程监测平台，2021.01至2023.12，主持。

  3. 及若干触觉智能衣相关横向项目

  代表性论著

  ：

  【纺织主导】

  1.Zhen Liang, Mengting Niu, Fangting Xie, Dongquan Zhang, Liyun Dai, Xiaohui Cai,
  A Single-ply and Knit-only Textile Sensing Matrix for Mapping Body Surface Pressure,
  IEEE Sensors Journal, 2024.

  2.Chenhui Zhang, Zhen Liang, Fangting Xie, Xiaohui Cai: A Scalable Textile Strain
  Sensor Matrix: Design, Implementation and Application Exploration, IEEE Sensors
  Journal, 2025.

  3.Mengting Niu, Yufan Xiong, Ziyu Wu, Ying Qiu, Fangting Xie, Boyan Liu, Qijun Ying,
  Xiaohui Cai: SleevePose: Elastic Resistive Pressure Sensing Sleeve for Continuous
  Hand Pose Estimation, Proceedings of the ACM on Interactive, Mobile, Wearable and
  Ubiquitous Technologies (IMWUT), 2026.

  【电子学主导】

  4.Guorui Lu, Kangyu Chen, Qi Wang, Xiaohui Cai: Dual-modality Electromechanical
  Physiology Source Mapping, IEEE Sensors Journal, 2024.

  5.Fangting Xie, Zhen Liang, Dongquan Zhang, Mingjie Zhao, Quan Wan, Changhai Ma,
  Jiayue Yuan, Siqi Lei, Xiaohui Cai: Where to Improve? A Systematic Evaluation of
  Sampling Parameters for Pressure Sensor Matrix, Proceedings of the ACM on Interactive,
  Mobile, Wearable and Ubiquitous Technologies (IMWUT), 2025.

  【计算机主导】

  6.Ziyu Wu, Fangting Xie, Yiran Fang, Zhen Liang, Quan Wan, Yufan Xiong, Xiaohui
  Cai: Seeing through the Tactile: 3D Human Shape Estimation from Temporal In-Bed
  Pressure Images, Proceedings of the ACM on Interactive, Mobile, Wearable and Ubiquitous
  Technologies (IMWUT), 2024.

  7.Dongquan Zhang, Zhen Liang, Yuchen Wu, Fangting Xie, Guanghua Xu, Ziyu Wu, Xiaohui
  Cai: Learn to Infer Human Poses Using a Full-Body Pressure-Sensing Garment, IEEE
  Sensors Journal, 2024.

  8.Ziyu Wu, Yufan Xiong, Mengting Niu, Fangting Xie, Quan Wan, Qijun Ying, Boyan
  Liu, Xiaohui Cai：Pi-hmr: Towards Robust in-bed Temporal Human Shape Reconstruction
  with Contact Pressure Sensing, Proceedings of the ACM on Interactive, Mobile, Wearable
  and Ubiquitous Technologies (IMWUT), 2025.

  9.Quan Wan, Ziyu Wu, Fangting Xie, Mengting Niu, Xiaohui Cai: In-bed Pressure Image-Supported
  Diffusion for 3D Human Mesh Recovery, IEEE International Conference on Pervasive
  Computing and Communications (PerCom), 2025.

  10.Jiayue Yuan, Fangting Xie, Guangwen Ouyang, Changhai Ma, Ziyu Wu, Heyu Ding,
  Quan Wan, Yi Ke, Yuchen Wu, Xiaohui Cai，PressTrack-HMR: Pressure-Based Top-Down
  Multi-Person Global Human Mesh Recovery，Proceedings of the AAAI Conference on Artificial
  Intelligence，2026.

