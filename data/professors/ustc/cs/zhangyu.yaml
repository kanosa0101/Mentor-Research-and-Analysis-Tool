  主要研究方向

  ：新兴编程系统与优化、智能无人系统与优化、软件与大数据分析、无人系统基础软件等

  张昱，女，教授，博士生导师，中国计算机学会 (CCF) 杰出会员、CCF系统软件专委常务委员、教育专委常务委员；ACM会员、ACM 中国操作系统分会副主席、计算机科学教育分会常务理事；全国高等学校计算机教育研究会常务理事；教育部高等学校计算机类教学指导委员会(2018-2022)计算机系统专家委员会委员。华夏计算机科技英才班负责人。

  2005年1月获中国科学技术大学计算机软件与理论博士学位。2010年10月—2011年10月在美国耶鲁大学计算机系进行访问研究。主持或参与科技部科技创新2030重大项目、国家自然科学基金、工信部项目、安徽省重点研发计划项目等纵向项目，主持完成华为、龙芯、阿里巴巴、蚂蚁金服、微软、Intel等企业创新合作项目。在学术期刊和国际会议上发表论文130余篇，获得国家发明专利授权14项、软件著作权6项，牵头制定安徽省地方标准1部，参与制定国家标准和ISO国际标准。出版编译原理和程序设计语言原理相关教材和配套参考书9本、合作翻译著作2本。

  获奖情况

  ：

  1. 2023年获教育部-华为“智能基座”优秀教师

  2. 2023国家级一流线下课程“编译原理和技术”负责人

  3. 2021年获宝钢优秀教师奖

  4. 2021年获中国软件开源创新大赛开源项目创新一等奖、任务挑战二等奖、开源实践教学二等奖

  5. 2021年获全国软件工程教学案例一等奖

  6. 2020年获2019年度全国高校计算机专业优秀教师奖励计划

  7. 2020年获首届全国高校教师教学创新大赛校赛一等奖

  8. 2020年获全国高校绿色计算大赛实践教学组和开源创新组两项特等奖

  9. 2020年获ACM中国-国际并行计算挑战赛(IPCC)二等奖、优秀指导教师

  10.2019年获全国软件工程教学案例比赛二等奖、全国高校绿色计算大赛(实践教学组)二等奖

  11.2018年获第一届中国科大-唐立新教学名师奖

  12.2018年获中国科大新创校友基金会“院长教学奖”

  13.2018年获安徽省教学成果二等奖（主持）

  14.2018年获NASAC命题型竞赛“违反编码规范原型工具”第2名

  15.2017年获中国科大优秀党务工作者、所在支部获校优秀基层党组织

  16.2016年获第一届西区精神优秀教学奖

  17.2016年指导本科生张震开展科学研究获ACM SIGPLAN学生研究竞赛本科生组第2名

  18.2010年、2008年获安徽省教学成果三等奖（主持）

  19.2008年获王宽诚育才奖一等奖

  20.2006年获中国科大优秀青年教职工津贴

