bio_raw: '电  话：（0551）6360-7954

  E- Mail：zjx@ustc.edu.cn

  主要研究方向

  ：计算机系统结构、嵌入式系统设计等。

  张俊霞，男，1965年11月生，硕士，高级工程师。1987年本科毕业于西安交通大学自动控制专业，1987年~1994年在安徽电子计算机厂先后从事微机技术培训和医疗电子仪器开发工作，1997年研究生毕业于中国科学技术大学生物医学工程专业，随后留校计算机系任教至今。作为技术骨干参与若干项目，负责硬件系统的设计工作。主讲本科生课程有：模拟与数字电路、计算机组成原理、微机原理与接口技术等。

  获奖情况

  ：

  2018年，中国科学技术大学兴业证券教育奖；

  2012年，中国科学技术大学王宽城育才二等奖；

  2010年，中国科学技术大学教学成果一等奖。

  主要论著

  ：

  Wang Luen, Zhang Junxia, Zhang Zhong, Sun Guangzhong, Chen Guoliang. KD Monitoring
  System: Design, Implementation, and Evaluation. 2011 3rd International Conference
  on Computer Research and Development (ICCRD), 2011, 2(3): 120-124.

  张俊霞, 李春生, 张焕杰. KD-50-I-E: 一台增强型高性能计算机. 中国科学技术大学学报, 2009, 39(8):894-896.

  张俊霞, 吴俊敏, 黄刘生. 适于无线传感器网络节点的语音模块设计. 电子技术，2009, 36(12): 36-38.

  张俊霞, 张焕杰, 李会民. 基于龙芯2F的国产万亿次高性能计算机KD-50-I的研制. 中国科学技术大学学报, 2008, 38(1): 105-108.

  张俊霞, 汪炀, 李善亮. 基于无线传感器网络的定位系统设计. 计算机工程与应用, 2008, 44(17):67-70.'
