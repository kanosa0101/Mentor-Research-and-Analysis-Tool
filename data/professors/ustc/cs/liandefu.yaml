bio_raw: 'E-Mail：liandefu@ustc.edu.cn

  个人主页：

  http://staff.ustc.edu.cn/~liandefu

  主要研究方向

  ：大模型检索增强、大模型智能体、科学智能

  连德富，中国科学技术大学计算机学院副院长、教授、博士生导师。他的主要研究方向包括大模型检索增强、大模型智能体、科学智能等，研发了搜推广训推一体化系统Nexus、
  通用表征系列模型、GPU原生向量检索系统Rotlex、工具调用模型ToolACE等，在KDD、ICML、TPAMI、TKDE等CCF-A类会议和期刊发表论文100余篇。他主持了国自然优青、区域联合重点、中科院先导A以及企业合作项目等二十余项，曾获得省部级自然科学一等奖4项以及国际会议最佳论文奖3项。

  获奖情况

  ：

  2023 CCF科技成果奖自然科学一等奖（排名第二）

  2023 KDD Cup Next Product Recommendation/Generation 两个赛道分获季军和亚军（全球高校冠军）

  2023 RecSys Challenge 第三名

  2022 NeurIPS Traffic4Cast 比赛双赛道冠军

  2022 中科大招生先进个人

  2022 NeurIPS Top Reviewers

  2022 WISE Best Paper Award

  2021 杨元庆教育基金

  2021 中科大招生先进个人

  2021 安徽省教学成果奖一等奖（排名第7）

  2020 中科大优秀班主任

  2019 计算机学院“新创学者”

  2018 计算机学院“新创学者”

  2018 教育部高等学校科学研究优秀成果奖自然科学一等奖（排名第4）

  2018 四川省教学成果奖二等奖（排名第5）

  2016 APWeb best student paper runner up

