bio_raw: '邮箱：snh@ict.ac.cn; snh@ncic.ac.cn

  主要研究方向

  ：

  并行处理体系结构；分布式操作系统；性能评价及文件系统

  孙凝晖，博士，研究员，中国工程院院士。高性能计算机专家，研究领域包括计算机体系结构、高性能计算机等。任中国科学院计算技术研究所学术所长、计算机体系结构国家重点实验室主任，曾任国家智能计算机研究开发中心主任、中国计算机学会副理事长。担任《计算机学报》主编。先后获国家科技进步一等奖1项、二等奖4项，中科院杰出科技成就奖，获“中国青年科技奖”和“中国十大杰出青年”荣誉称号。'
