bio_raw: '电　话：(0551)63606975

  E-Mail：chenkm@ustc.edu.cn

  主要研究方向

  ：软件逆向工程、数据智能、区块链。

  陈凯明、男、1964年12月生、副教授。分别于1986年、1991年、2004年获合肥工业大学微机所学士、硕士和博士学位。获省部级科技进步二等奖2项，主持和参加国家、省部级和横向项目10多项，译著一部，发表论文20余篇。

  获奖情况

  ：

  基于知识的逆编译系统DECLER, 1998年安徽省科学技术进步二等奖(排名2)

  大中型泵站(群)综合自动化系统，2002年安徽省科学技术进步二等奖(排名8)

  代表性论著

  ：

  陈凯明,刘宗田,逆编译中按特征恢复数据类型研究，计算机研究与发展, 2001.7,Vol38,p209-213

  陈凯明,刘宗田,逆编译系统中开关结构的识别与恢复,小型微型计算机系统，2000.12,Vol21(12),p1279-1281(EI：01035573352)

  陈凯明,刘宗田，任传胜,逆编译中面向用户的中间语言设计，小型微型计算机系统，2002.10,Vol23(10),pp1173-1176 (EI：02497255978)

  陈凯明,刘宗田,逆编译研究现状及其进展, 计算机科学,2001.5，Vol 28(5), p113-115

  陈凯明,刘宗田,非纯变量下标的数组类型恢复,计算机工程与设计,2001.10, Vol22(5),p86-89

  陈凯明,刘宗田等, A Specification Method of the Program Transformation for

  Recovering Data Type from Executable Code(英文)，国际(亚太)第一届微机应用学术会议论文集, Hefei, China
  2000.5, p295-298

  陈凯明,刘宗田等,符号执行过程的DFA和CFA，计算机工程, 2002.11, Vol28(11),pp95-96

  陈凯明，刘宗田等，用户库恢复，小型微型计算机系统，待发表。'
