bio_raw: '电　话： 0551-63603823

  E-Mail： qiliuql@ustc.edu.cn

  个人主页：

  http://staff.ustc.edu.cn/~qiliuql/

  主要研究方向

  ： 数据挖掘与知识发现、机器学习方法及其应用

  刘淇，男，教授，博士生导师，中国计算机学会(CCF)大数据专家委员会委员、中国人工智能学会(CAAI)机器学习专委会委员、中科院青年创新促进会优秀会员、IEEE/ACM会员。2013年获得中国科学技术大学计算机应用技术专业博士学位。主要研究数据挖掘与知识发现、机器学习方法及其应用，着重于针对用户行为数据（如消费数据、社交数据、教育数据）的分析建模和智能应用（如个性化推荐）研究。相关成果获得数据挖掘领域顶级国际会议KDD
  2018最佳学生论文奖（Research Track）、IEEE ICDM 2011最佳研究论文奖、SDM 2015 最佳论文候选奖等。还曾获中科院院长特别奖和优秀博士学位论文奖、教育部自然科学一等奖（2018年，排名第2），入选了国家基金委优秀青年科学基金项目、中国科协“青年人才托举工程”&&CCF青年人才托举计划（2017年）、微软亚洲研究院青年学者“铸星计划”、CCF-Intel青年学者提升计划等。担任Frontiers
  of Computer Science青年AE，是ICDE 2019 Workshop on RecSys with Big Data、ICDM 2015 MobileDM
  & HuMoComp Workshop 的共同主席，是IEEE TKDE、ACM TKDD等10余个学术期刊的审稿人，30余次担任IJCAI、KDD、AAAI、WWW、CIKM、ICDM、WSDM、SDM等重要国际学术会议的程序委员会委员或分会主席。主持了国家重点研发计划项目课题、国家自然科学基金面上项目等多项国家、省部级以及与微软、科大讯飞、腾讯、百度等企业的合作研究项目。

