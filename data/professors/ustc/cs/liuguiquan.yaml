bio_raw: '电　话：(0551)63607481

  E-Mail：gqliu@ustc.edu.cn

  主要研究方向

  ：机器学习，智能信息处理与挖掘，互联网信息抽取及深度搜索与挖掘。

  刘贵全 ，男，1970年5月生，中国科技大学计算机系副教授。1999年获博士学位。中国人工智能学会人工智能基础专业委员会委员、机器学习专业委员会委员。作为项目主要成员，参与过包括国家自然科学基金、863、973计划等多个项目。作为项目负责人，承担了10余项科研项目，其中包括1项国家自然科学基金项目、2项863计划项目。

  主要讲授课程

  ：

  硕士生课程：自然语言理解

  本科生课程：人工智能基础、图论、代数结构等

  十篇代表性论著

  ：

  Xin Wu, Guiquan Liu. XML twig pattern matching using version tree. Data & Knowledge
  Engineering, 2008(3): 580-599.

  Lingyun Wen, Guiquan Liu, Yinghai Zhao: HS-Model: a hierarchical statistical sub-tree-generating
  model for genetic programming. GEC Summit 2009: 1005-1008.

  周进华，刘贵全. 基于衰减词共现图的多文档摘要研究. 小型微型计算机系统 2009 Vol.30 No.1.

  汪中，刘贵全，陈恩红. 一种优化初始中心点的K-means算法. 模式识别与人工智能，2009 Vol.22 No.2.

  Zhong Wang, Gui-Quan Liu, Ji-Ci Guo. An Improved K-means Algorithm Based on Mul-tiple
  Feature Points. The First International Workshop on Intelligent Systems and Applications,
  May 2009(ISA2009): 279-283.

  汪中，刘贵全，陈恩红. 基于模糊K-harmonic means的谱聚类算法. 智能系统学报，2009 Vol.4 No.2

  万国府，刘贵全，刘朋熙. 卫星网络中基于UDP的可靠数据传输协议. 信息安全与通信保密, 2007(06).

  管鹏玲，刘贵全. 基于词汇链分析的英文自动文摘. 计算机系统应用，2007(09).

  林杨，刘贵全，杨立身. 基于改进SVM方法的入侵检测. 计算机工程，2007 Vol.33 No.14.

  杨涛，刘贵全. 数据网格中基于MAS的复制管理研究. 计算机仿真，2007 Vol.24 No.2.'
