bio_raw: 'E-Mail：kitewind@ustc.edu.cn

  主要研究方向

  ：物联网、下一代通信网络、资源调度与优化。

  周颢，男，副教授，1976年1月生，湖北襄阳人，博士。1997、2002年于中国科学技术大学计算机系分别获得学士、博士学位。2011~2016期间累计三年在日本国立情报学研究所进行交流访问，现任计算机学院副教授。主要从事物联网、下一代通信网络、资源调度与优化等方面的研究。主持国家自然科学基金面上项目、国家863项目等多项国家科研项目。近五年来在IEEE
  TON、IEEE INFOCOM等国内外高水平学术期刊和会议上发表论文四十余篇。

  十篇代表性论著

  ：

  Hao Zhou, Yusheng Ji, Xiaoyan Wang, and Shigeki Yamada，eICIC Configuration Algorithm
  with Service Scalability in Heterogeneous Cellular Networks. IEEE/ACM Transactions
  on Networking (TON), 2017, 25(1): 520-535.

  XiaoyanWang, YushengJi,HaoZhou, and Jie Li,Auction Based Frameworks for Secure Communications
  in Static and Dynamic Cognitive Radio Network. IEEE Transactions on Vehicular Technology,
  2017, 66(3): 2658-2673.

  XiaoyanWang, YushengJi,HaoZhou, and Jie Li, A Non-monetary QoS-aware Auction Framework
  towards Secure Communications for Cognitive Radio Networks. IEEE Transactions on
  Vehicular Technology, 65(7), 5611-5623, 2016.

  Hao Zhou, Yusheng Ji, Xiaoyan Wang, and Baohua Zhao，ADMM based algorithm for eICIC
  configuration inheterogeneous cellular networks，2015 IEEE Conference on Computer
  Communications (INFOCOM). IEEE, 2015: 343-351.

  Hao Zhou, Yusheng Ji, Xiaoyan Wang, andBaohua Zhao, Joint Resource Allocation and
  User Association for SVC Multicast over Heterogeneous Cellular Networks,　IEEE Transactions
  on Wireless Communications, 2015, 14(7): 3673-3684.

  Hao Zhou, Yusheng Ji, and Baohua Zhao, Tabu-search-based metaheuristic resource
  allocation algorithm for SVC multicast over wireless relay networks, IEEE Transactions
  on Vehicular Technology, 64(1), 236-247, Jan. 2015.

  Xiaoyan Wang, Yusheng Ji, Hao Zhou, and Jie Li, DASI: A Truthful Double Auction
  Mechanism for Secure Information Transfer in Cognitive Radio Networks, in Proceedings
  of IEEE SECON 2015.

  Hao Zhou, Yusheng Ji, Xiaoyan Wang, and Shigeki Yamada, Joint spectrum sharing and
  ABS adaptation for network virtualization in heterogeneous cellular networks, in
  Proceedings of IEEE GLOBECOM 2015.

  Hao Zhou, Yusheng Ji, Xiaoyan Wang, and Baohua Zhao, Joint user scheduling, user
  association, and resource partition in heterogeneous cellular networks, IEEE MASS
  2014 ( IEEE International Conference on Mobile Ad hoc and Sensor Systems), pp 46-54,
  Oct. 27-30, 2014.

  Hao Zhou, Yusheng Ji, and Baohua Zhao, Joint mode selection, MCS assignment, resource
  allocation and power control for D2D communication underlaying cellular networks,
  in proceedings of IEEE WCNC 2014 (IEEE Wireless Communication and Networking Conference),
  pp 1690-1695, Istanbul, Apr. 6-9, 2014.'
