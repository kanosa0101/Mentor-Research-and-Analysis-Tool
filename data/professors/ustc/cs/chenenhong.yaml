bio_raw: '电　话：(0551)63601558

  E-Mail：cheneh@ustc.edu.cn

  实验室主页：

  http://bigdata.ustc.edu.cn/

  个 人 主页：

  http://staff.ustc.edu.cn/~cheneh

  主要研究方向

  ：机器学习、数据挖掘、社会网络、个性化推荐系统。

  陈恩红： 博士、讲席教授、博士生导师。校学术委员会、学位委员会委员，信息与智能学部副部长，认知智能全国重点实验室副主任，大数据分析与应用安徽省重点实验室主任。主要研究方向是数据挖掘、机器学习、个性化推荐、智能教育等。国家杰出青年基金获得者、科技部重点领域创新团队“大数据分析及应用”负责人、科技部重点研发计划项目首席科学家。IEEE
  Fellow、中国计算机学会（CCF）、中国人工智能学会（CAAI）会士，CCF大数据专家委员会副主任、CAAI机器学习专委和智能服务专委会副主任，安徽省计算机学会理事长，教育部应用伦理教指委副主任委员、计算机类教指委委员。主持了科技部重点研发计划项目、国家基金委重大仪器研制项目、国家杰出青年基金项目、基金委区域联合重点项目，以及相关部委重大基础类研究项目等。发表CCF
  A类及IEEE/ACM Trans论文200余篇，曾获KDD、ICDM最佳论文奖等，及CIKM最佳论文入围奖(Runner-up)。获授权发明专利50余件。以第一完成人获教育部自然科学一等奖、CCF自然科学一等奖、吴文俊人工智能科技进步一等奖。担任TKDE、软件学报等重要期刊编委、计算机研究与发展的人工智能领域编委（Leading
  Editor）等。

  主要讲授课程

  ：

  硕士生课程：机器学习与知识发现、高级人工智能

  本科生课程：人工智能基础、数理逻辑等

