bio_raw: '电　话： (0551)63607043

  E - Mail：bhua@ustc.edu.cn

  个人主页：

  http://staff.ustc.edu.cn/~bhua/

  主要研究方向

  ：

  高性能网络系统，算法与系统性能优化

  华蓓，女，1966年9月生，中国科学技术大学教授，博士生导师。分别于1990年、1993年、2005年获中国科学技术大学学士学位、北京大学硕士学位、中国科学技术大学博士学位。主要从事计算机网络、高性能网络系统、算法与系统性能优化等方面的教学和研究工作。先后主持了国家自然科学基金项目、国家863计划项目、科技部重大项目课题等纵向课题，以及华为、Intel等公司的横向课题，发表论文100多篇，获得授权专利5项。

  获奖情况

  :

  2015年度中国科学院优秀导师奖

  2013年度杨亚教学奖

  2009年度花旗集团奖教金

  2008年度安徽省优秀硕士学位论文奖（导师）

  2002年度中国科学技术大学张宗植青年教师奖

