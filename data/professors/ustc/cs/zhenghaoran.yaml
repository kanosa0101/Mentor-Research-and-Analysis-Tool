bio_raw: '电  话：(0551)63600432

  E -Mail：hrzheng@ustc.edu.cn

  主要研究方向

  ：海量数据挖掘技术、小样本学习技术、计算机建模与仿真、智能计算及应用、生物信息学

  郑浩然，男，1967年生，博士，副教授。1989年于西安交通大学自动控制专业获学士学位；1992年于西安交通大学获模式识别与智能控制专业获硕士学位；2000年于中国科学技术大学获信号与信息处理专业获博士学位，2000年7月至2002年7月在中国科学技术大学计算机科学技术系人工智能中心做博士后研究，出站后留校工作。

  近三届毕业研究生就业去向（首次签约单位）：

  2013届硕士：钱立伟 – 百度（北京）；陈孝续 – 百度（上海）；操勇 – 讯飞（合肥）。

  2012届硕士：秦瑞斌 – 百度（北京）；卫 超 -- 百度（北京）。

  2011届硕士：夏德国 – 百度（北京）；李贵生 – 兰亭集势（北京）。

  获奖情况

  ：

  2004年获王宽诚育才奖（二等奖）；

  2008年度安徽省优秀硕士学位论文奖（导师）；

  2010年获惠普信息科学青年教师奖 。

