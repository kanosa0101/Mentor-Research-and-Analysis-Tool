  主要研究方向

  ：

  机器学习网络系统、大模型训推网络优化、云计算、在网计算、网络算法设计

  个人简介

  ：

  赵功名，男，出生于1993年，安徽宣城人，副教授，博士生导师。中科院青促会会员，CCF高级会员，CCF互联网/分布式计算与系统/网络与数据通信专委会执行委员。2015年本科毕业于山东大学，2020年博士毕业于中国科大，毕业后留校任教。曾于2019年至2020年在纽约州立大学布法罗分校访学。致力于智算网络、云计算、在网计算等方向研究。近年来共发表高水平论文80余篇，其中一作/通讯论文60余篇（包括SIGCOMM、NSDI、INFOCOM、WWW、ToN、TPDS、TC等CCF
  A类论文30余篇，ICNP、ICDCS、IWQoS、SECON、TCOM、ComNet等CCF B类论文20余篇），授权国家发明专利13项。作为负责人主持国家自然科学基金面上项目、青年项目、省优青项目、华为合作项目、华为智库项目、阿里云合作项目、移动合作项目、CCF-腾讯犀牛鸟基金、神州信息合作项目等。作为技术负责人累计承担9项华为合作项目、2项字节合作项目等。曾获中国科学院优博、中国电子学会优博、安徽省自然科学一等奖、华为火花奖（3次）、ACM
  SIGCOMM CHINA新星奖等荣誉。

  招生信息：

  我们由衷欢迎相关专业的优秀本科生报考我们团队研究生，同时也欢迎低年级本科生提前加入我们实验室，一起探索智算网络领域的热点问题。

