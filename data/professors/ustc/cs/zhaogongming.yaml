  8.

  面向云AI训练的资源调度技术合作项目，华为合作项目，2023-2025，已结题，主持；

  9.

  实时业务驱动的自适应资源预测与调度优化研究，CCF-腾讯犀牛鸟基金，2024-2025，已结题，主持；

  10.

  突发流场景下软件定义数据中心动态资源优化研究，国家自然科学基金青年项目，2022-2024，已结题，主持；

