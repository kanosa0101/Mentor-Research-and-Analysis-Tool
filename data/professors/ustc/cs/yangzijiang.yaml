bio_raw: 'E-Mail： zijiang@ustc.edu.cn

  个人主页： https://yangzijiangjames.github.io/

  主要研究方向

  ： 智能软件，具身智能仿真与安全，可信大模型

  杨子江，现任计算机学院教授。本科毕业于中国科学技术大学，获得莱斯大学硕士及宾夕法尼亚大学博士学位。曾任美国西密歇根大学教授及密歇根大学访问教授。学术兼职包括IEEE国际电动与自动驾驶技术委员会共同主席、IEEE自动驾驶国际标准工作组副主席、2020-2024年IEEE国际自动驾驶软件会议共同主席、2019年IEEE国际软件测试及验证大会共同主席、中国电动汽车百人会理事等。发表论文一百余篇及二十余项中、美专利。出版专著《自动驾驶系统开发》。

  获奖情况

  ：

  ACM SIGSOFT杰出论文奖

  ACM TODAES最佳期刊论文奖

  谷歌计算机科学Engagement奖。

  十篇代表性论著

  ：

  1. Pan, Weifeng; Kessentini, Marouane; Ming, Hua; Yang, Zijiang. EASE: An effort-aware
  extension of unsupervised key class identification approaches. ACM Transactions
  on Software Engineering and Methodology (TOSEM), 2024. Volume 33, Issue 4, Article
  No.: 84, Pages 1 - 43. April 2024.

  2. Hao, Kunkun and Cui, Wen and Luo, Yonggang and Xie, Lecheng and Bai, Yuqiao and
  Yang, Jucheng and Yan, Songyang and Pan, Yuxi and Yang, Zijiang，Adversarial Safety-Critical
  Scenario Generation using Naturalistic Human Driving Priors，IEEE Transactions on
  Intelligent Vehicles, November 2023.

  3. Y Zhou, Y Sun, Y Tang, Y Chen, J Sun, CM Poskitt, Y Liu, Z Yang, Specification-based
  Autonomous Driving System Testing, IEEE Transactions on Software Engineering PP(99):1-19,
  June 2023.

  4. Weifeng Pan, Hua Ming, Dae-Kyoo Kim, and Zijiang Yang，Pride: Prioritizing Documentation
  Effort Based on a PageRank-Like Algorithm and Simple Filtering Rules，IEEE Transactions
  on Software Engineering (TSE), March 2023, pp. 1118-1151, vol. 49.

  5. Zhaoyun Jiang, Jiaqi Guo, Shizhao Sun, Huayu Deng, Zhongkai Wu, Vuksan Mijovic,
  Zijiang James Yang, Jian-Guang Lou, Dongmei Zhang, LayoutFormer++: Conditional Graphic
  Layout Generation via Constraint，Serialization and Decoding Space Restriction，Proceedings
  of the IEEE/CVF Conference on Computer Vision and Pattern Recognition (CVPR2023).

  6. Jiawei Lin, Jiaqi Guo, Shizhao Sun, Zijiang James Yang, Jian-Guang Lou, Dongmei
  Zhang， LayoutPrompter: Awaken the Design Ability of Large Language Models， Proceedings
  of the 37th Conference on Neural Information Processing Systems (NeurIPS 2023).

  7. X Zhang, W Zhao, Y Sun, J Sun, Y Shen, X Dong, Z Yang， Testing automated driving
  systems by breaking many laws efficiently， Proceedings of the 32nd ACM SIGSOFT International
  Symposium on Software Testing and Analysis(ISSTA)，July 2023.

  8. Weifeng Pan, Xin Du, Hua Ming, Dae-Kyoo Kim, Zijiang Yang. Identifying Key Classes
  for Initial Software Comprehension: Can We Do It Better? Proceedings of the 45th
  IEEE/ACM International Conference on Software Engineering (ICSE), 2023.

  9. M. Fan, W. Wei, W. Jin, Z. Yang, T. Liu. Explanation-Guided Fairness Testing
  through Genetic Algorithm. IEEE International Conference on Software Engineering
  (ICSE), 2022.

  10. Yang Sun, Christopher Poskitt, Jun Sun, Yuqi Chen, Zijiang Yang. LawBreaker:
  An Approach for Specifying Traffic Laws and Fuzzing Autonomous Vehicles. 37th IEEE/ACM
  International Conference on Automated Software Engineering (ASE), 2022.

  【更新于2024年9月】'
