bio_raw: 'Email: zhou0612@ustc.edu.cn

  主要研究方向

  ：机器学习、时间序列分析

  周熙人，副教授，2019年于中国科学技术大学计算机学院获博士学位，从事机器学习、时间序列分析等方向研究工作，近年来在Nature Communications、TPAMI、ICML、AAAI等国际高水平期刊或会议上发表论文30余篇，研究成果入选ESI高被引论文;
  主持国家自然科学基金面上项目、青年基金项目、国家科技重大专项项目任务等多项国家、省部级项目或课题；作为项目骨干参与国家重点研发计划、科技创新2030—“新一代人工智能”重大项目等；目前担任计算智能领域权威IEEE
  Transactions期刊TETCI副主编。

  代表性论著

  ：

  1.

  Xiren Zhou, Shikang Liu, Xinyu Yan, Yizhan Fan, Xiangyu Wang, Yu Kang, Jian Cheng,

  Huanhuan Chen. “Reservoir-enhanced segment anything model for subsurface diagnosis”.

  Nature Communications

  , 2025.

  2.

  Xiren Zhou, Chuyang Wei, Ao Chen, Shikang Liu, Xiangyu Wang, Huanhuan Chen. “Fault
  Diagnosis of Irregular Sequences by Adjoint Learning in Continuous-Time Model Space”.

  Proceedings of the AAAI Conference on Artificial Intelligence (AAAI)

  , 2026.

  3.

  Xiren Zhou, Ziyu Tang, Shikang Liu, Ao Chen, Xiangyu Wang, Huanhuan Chen. “Fault
  Diagnosis in REDNet Model Space”.

  Proceedings of the Thirty-Fourth International Joint Conference on Artificial Intelligence
  (IJCAI-25)

  , 2025.

  4.

  Shikang Liu, Chuyang Wei, Xiren Zhou*, Huanhuan Chen*. “Spectral-Aware Reservoir
  Computing for Fast and Accurate Time Series Classification”.

  Forty-second International Conference on Machine Learning (ICML-25)

  , 2025.

  5.

  Ao Chen, Xiren Zhou*, Huanhuan Chen*.

  “

  Efficient anomaly detection of irregular sequences in ct-echo model space

  ”

  .

  Proceedings of the AAAI Conference on Artificial Intelligence (AAAI)

  , 2025

  6.

  Shikang Liu, Xiren Zhou*, Huanhuan Chen*. “

  Multiscale temporal dynamic learning for time series classification

  ”,

  IEEE Transactions on Knowledge and Data Engineering (TKDE)

  , 2025

  7.

  Xiren Zhou, Shikang Liu, Xinyu Yan, Xiangyu Wang, Huanhuan Chen. “Underground Diagnosis
  in 3D GPR Data by Learning in CuCoRes Model Space”.

  Proceedings of the Thirty-Fourth International Joint Conference on Artificial Intelligence
  (IJCAI-25)

  , 2025.

  8.

  Xiren Zhou, Shikang Liu, Ao Chen, Huanhuan Chen. “Learning in CubeRes Model Space
  for Anomaly Detection in 3D GPR Data”.

  Proceedings of The 33rd International Joint Conference on Artificial Intelligence
  (IJCAI-24)

  , 2024.

  9.

  Ao Chen, Xiren Zhou*, Yizhan Fan, Huanhuan Chen*. “Underground Diagnosis Based on
  GPR and Learning in the Model Space”.

  IEEE Transactions on Pattern Analysis and Machine Intelligence (TPAMI)

  , 2024

  10.

  Xiren Zhou, Shikang Liu, Ao Chen, Qiuju Chen, Fang Xiong, Yumin Wang, Huanhuan Chen.
  “Underground Anomaly Detection in GPR Data by Learning in the C3 Model Space”.

  IEEE Transactions on Geoscience and Remote Sensing (TGR

  S), 2023.

