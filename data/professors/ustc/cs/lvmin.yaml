bio_raw: '电　话：(0551)63603412

  E-Mail：lvmin05@ustc.edu.cn

  个人主页：

  http://staff.ustc.edu.cn/~lvmin05

  主要研究方向

  ： 容错存储系统、图计算、数据隐私

  吕敏，女，中国科学技术大学计算机科学与技术学院副教授。1999年毕业于安徽大学数学系，获学士学位；2002年获得安徽大学应用数学硕士学位；2005年获得中国科学技术大学数学博士学位。同年进入中国科学技术大学计算机系做博士后；2007年留校工作。2015年在普渡大学计算机系进行访问交流。在VLDB、SIGMOD、INFOCOM、TPDS、VLDB
  Journal、ACM Trans.等国际重要会议和期刊上发表多篇论文，参与编写英文学术专著一部(Morgan & Claypool 出版社)。

  获奖情况

  ：

  2018获王宽诚育才奖

  代表性论著

  ：

  Liangliang Xu, Min Lv, Zhipeng Li, Cheng Li and Yinlong Xu. PDL: A Data Layout towards
  Fast Failure Recovery for Erasure-coded Distributed Storage Systems. IEEE International
  Conference on Computer Communications (IEEE INFOCOM), 2020: 736-745.

  Liangliang Xu, Min Lv, Zhipeng Li, Yongkun Li and Yinlong Xu, Deterministic Data
  Distribution for Efficient Recovery in Erasure-Coded Distributed Storage Systems,
  IEEE Transactions on Parallel and Distributed Systems (TPDS), 2020, 31(10):  2248-2262.

  Zhipeng Li, Min Lv, Yinlong Xu, Yongkun Li, Liangliang Xu. D3: Deterministic Data
  Distribution for Efficient Data Reconstruction in Erasure-Coded Distributed Storage
  Systems. IPDPS 2019.5: 545-556.

  Chen Yang, Min Lv, Yongkun Li, Qianqian Zhao, Yinlong Xu, SSRW: A Scalable Algorithm
  for Estimating Graphlet Statistics Based on Random Walk. DASFAA (1) 2018: 272-288.

  Caiyin Liu, Min Lv, Yubiao Pan, Hao Chen, Yongkun Li, Cheng Li and Yinlong Xu, 
  LCR: Load-aware Cache Replacement Algorithm for Flash-based SSDs. NAS 2018.

  Dong Su，Jianneng Cao，Ninghui Li，Min Lv，PrivPfC: Differentially Private Data Publication
  for Classification. The VLDB Journal 27(2), 2018: 201–223.

  Min Lv, Dong Su, Ninghui Li. Understanding the Sparse Vector Technique for Differential
  Privacy. PVLDB 10(6), 2017: 637-648.

  Dong Su, Jianneng Cao, Ninghui Li, Elisa Bertino, Min Lv, Hongxia Jin, Differentially
  Private K-Means Clustering and a Hybrid Approach to Private Optimization. ACM Trans.
  Priv. Secur. 20(4), 2017: 16:1-16:33.

  Wei-Yen Day, Ninghui Li, Min Lv, Publishing Graph Degree Distribution with Node
  Differential Privacy. SIGMOD  2016: 123-138.

  Ninghui Li, Min Lv, Wei-Yen Day, Dong Su, Differential Privacy: From Theory to Practice,
  Morgan & Claypool Publishers, 2016.'
