bio_raw: '电　话： 0512-87161312

  E - Mail： xiaomj@ustc.edu.cn

  个人主页：

  http://staff.ustc.edu.cn/~xiaomj

  主要研究方向

  ： 移动智能计算（群智感知、联邦学习、边缘计算、社交网络、智能交通）、区块链技术及应用、大数据管理与隐私保护等

  肖明军，男，教授、博士生导师。分别于1999年和2004年获得中国科学技术大学计算机科学技术专业本科双学士和博士学位，2004年至2006年为中国科学技术大学信息学院博士后，随后留校任教，2011年至2012年在美国天普大学访问研究，目前为中国科学技术大学计算机科学与技术学院和苏州研究院教授。近年来，主持了国家自然科学基金、省自然科学基金、以及国家973二级子课题等9个国家和省部级科研项目，同时还参与了国家科技重大专项、重点研发计划、973、863等10余个国家级项目的研究工作。在包括TC、TMC、TPDS、TON、TKDE、INFOCOM等在内的高水平学术期刊和国际会议上发表论文90余篇，其中CCF
  A类论文19篇、B类论文18篇，谷歌学术引用1600多次，授权专利2项，出版专著1部，荣获安徽省自然科学二等奖（排名第1）、教育部自然科学二等奖（排名第7）、中国科学技术大学校友基金会青年教师事业奖、CWSN
  2009和CWSN2012优秀论文奖等多项奖励，并指导学生获得中科院院长特别奖。多次担任了包括INFOCOM、ICDCS、DASFAA、ICCCN、ICC、WISE等重要国际会议的TPC、Track
  Chair或Workshop Co-Chair，以及TC、TMC、TPDS、TON、TKDE、TSC、TVT等国际顶级期刊的审稿人。

  获奖情况

  ：

  2020年获安徽省科学技术奖自然科学二等奖（排名第1）；

  2015年获教育部自然科学二等奖（排名第7）;

  2015年获中国科学技术大学海外校友基金会青年教师事业奖。

  十篇代表性论著

  ：

  Mingjun Xiao, Guoju Gao, Jie Wu, Sheng Zhang, Liusheng Huang. Privacy-Preserving
  User Recruitment Protocol for Mobile Crowdsensing, IEEE/ACM Transactions on Networking,
  2020, 28(2): 519-532.(CCF A类国际期刊)

  Guoju Gao, Mingjun Xiao*, Jie Wu, Liusheng Huang, Chang Hu. Truthful Incentive Mechanism
  for Nondeterministic Crowdsensing with Vehicles. IEEE Transactions on Mobile Computing,
  17(12): 2982-2997, Dec., 2018.(CCF A类国际期刊)

  Guoju Gao, Mingjun Xiao*, Jie Wu, Kai Han, Liusheng Huang, and Zhenhua Zhao. Opportunistic
  Mobile Data Offloading with Deadline Constraints. IEEE Transactions on Parallel
  and Distributed Systems, 28(12): 3584-3599, Dec., 2017.(CCF A类国际期刊)

  Mingjun Xiao, Jie Wu, Liusheng Huang, Ruhong Cheng, and Yunsheng Wang. Online Task
  Assignment for Crowdsensing in Predictable Mobile Social Networks. IEEE Transactions
  on Mobile Computing, 16(8): 2306-2320, Aug., 2017.(CCF A类国际期刊)

  Mingjun Xiao, Jie Wu, Sheng Zhang, and Yapeng Yu. Secret-Sharing-Based Secure User
  Recruitment Protocol for Mobile Crowdsensing. IEEE INFOCOM, May 1-4, Atlanta, USA,
  2017.(CCF A类国际会议)

  Mingjun Xiao, Jie Wu, Liusheng Huang, Yunsheng Wang, and Cong Liu. Multi-Task Assignment
  for CrowdSensing in Mobile Social Networks. IEEE INFOCOM, April 26-May 1, HongKong,
  China, 2015.(CCF A类国际会议)

  Mingjun Xiao, Jie Wu, and Liusheng Huang. Home-based Zero-Knowledge Multi-copy Routing
  in Mobile Social Networks. IEEE Transactions on Parallel and Distributed Systems,
  26(5): 1238-1250, 2015.(CCF A类国际期刊)

  Mingjun Xiao, Jie Wu, and Liusheng Huang. Community-Aware Opportunistic Routing
  in Mobile Social Networks. IEEE Transactions on Computers, 63(7): 1682-1695, 2014.(CCF
  A类国际期刊)

  Mingjun Xiao, Jie Wu, Cong Liu, and Liusheng Huang. TOUR: Time-sensitive Opportunistic
