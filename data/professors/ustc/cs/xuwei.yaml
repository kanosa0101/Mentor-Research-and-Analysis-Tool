  徐伟，男，1984年4月生，博士，高级实验师。2012年博士毕业于中国科学技术大学计算机软件与理论专业。2012年~2019年在中国电子科技集团公司第三十八研究所先后担任工程师(2012~2015)和高级工程师(2015~2019)。2020年回校任职至今。工作于计算机学院实验教学中心，主要负责本学科软件类课程实验教学工作。'
