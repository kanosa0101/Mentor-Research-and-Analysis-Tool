bio_raw: 'E-Mail：yxiong@ustc.edu.cn

  主要研究方向

  ：

  计算机网络与信息安全、移动计算与移动网络、分布式处理等。

  熊焰，男，留美博士后、教授、博士生导师，国际计算机学会ACM中国区合肥分会（即安徽地区）主席、国家自然科学基金委计算机学科评审组会评专家、国家科技部科技进步奖计算机与自动化学科组会评专家、电子学报常务编委、中国通信学会通信软件专家委员会委员、安徽省云计算产业促进会会长、安徽省网络安全与信息化专家组成员。1983年、1986年分别获得科大学士、硕士学位，1990年成为是科大计算机系博士，1992-1994年任科大计算机系副主任，1995-1997年赴美UMKC大学计算机科学与通信学院做博士后研究，现任计算机网络与信息安全研究室主任。曾获得省部级科技进步奖二等奖2项、三等奖1项，安徽省青年科技奖1项。至今已在国内外核心期刊和学术会议上发表论文100多篇。先后主持的项目有国家自然科学基金项目、国家自然科学基金重点项目、国家863重大专项、国家863重大项目、国家863项目、国家
  973专题、中科院重大专项等40多项国家和省部级项目。

  获奖情况

  ：

  省部级科技进步奖二等奖2项、三等奖1项；

  安徽省青年科技奖1项。

  代表性论著

  ：

  Wansen Wang, Wenchao Huang, Zhaoyi Meng, Yan Xiong, Cheng Su. Advancing the Automation
  Capability of Verifying Security Protocols[J]. IEEE Transactions on Dependable and
  Secure Computing, 2024.

  Wansen Wang, Wenchao Huang, Zhaoyi Meng, Yan Xiong, Fuyou Miao, Xianjin Fang, Caichang
  Tu, Renjie Ji. Automated inference on financial security of Ethereum smart contracts[C].
  32nd USENIX Security Symposium (USENIX Security 23). 2023: 3367-3383.

  Yu Ning, Zuo Ye, Gennian Ge, Fuyou Miao, Yan Xiong, Xiande Zhang. New Results on
  Self-Dual Generalized Reed-Solomon Codes[J]. IEEE Transactions on Information Theory,
  2021, 67(11): 7240-7252.

  Zhaoyi Meng, Yan Xiong, Wenchao Huang, Fuyou Miao, Jianmeng Huang. AppAngio: Revealing
  Contextual Information of Android App Behaviors by API-Level Audit Logs[J]. IEEE
  Transactions on Information Forensics and Security, 2020, 16: 1912-1927.

  Yan Xiong, Cheng Su, Wenchao Huang, Fuyou Miao, Wansen Wang, Hengyi Ouyang. SmartVerif:
  Push the Limit of Automation Capability of Verifying Security Protocols by Dynamic
  Strategies[C]. 29th USENIX Security Symposium (USENIX Security 20). 2020: 253-270.

  Yiqing Hu, Yan Xiong, Wenchao Huang, Xiang-Yang Li, Panlong Yang, Yanan Zhang, XuFei
  Mao. Lightitude: Indoor positioning using uneven light intensity distribution[J].
  Proceedings of the ACM on Interactive, Mobile, Wearable and Ubiquitous Technologies,
  2018, 2(2): 1-25.

  Wenchao Huang, Xiang-Yang Li, Yan Xiong, Panlong Yang, Yiqing Hu, XuFei Mao, Fuyou
  Miao, Baohua Zhao, Jumin Zhao. Stride-in-the-loop relative positioning between users
  and dummy acoustic speakers[J]. IEEE Journal on Selected Areas in Communications,
  2017, 35(5): 1104-1117.

  Wenchao Huang, Xiang-Yang Li, Yan Xiong, Panlong Yang, Yiqing Hu, XuFei Mao, Fuyou
  Miao, Baohua Zhao, Ju-Min Zhao. WalkieLokie: Sensing relative positions of surrounding
  presenters by acoustic signals[C]. Proceedings of the 2016 ACM International Joint
  Conference on Pervasive and Ubiquitous Computing. 2016: 439-450.

  Wenchao Huang, Yan Xiong, Xiang-Yang Li, Hao Lin, XuFei Mao, Panlong Yang, Yunhao
  Liu, Xingfu Wang. Swadloon: Direction Finding and Indoor Localization Using Acoustic
  Signal by Shaking Smartphones[J]. IEEE Transactions on Mobile Computing, 2015, 14(10):
  2145-2157.

  Wenchao Huang, Yan Xiong, Xiang-Yang Li, Hao Lin, XuFei Mao, Panlong Yang, Yunhao
  Liu. Shake and walk: Acoustic direction finding and fine-grained indoor localization
  using smartphones[C]. IEEE INFOCOM 2014-IEEE Conference on Computer Communications.
  IEEE, 2014: 370-378.

  Wenchao Huang, Yan Xiong, Xingfu Wang, Fuyou Miao, Chengyi Wu, Xudong Gong, Qiwei
  Lu. Fine-grained refinement on tpm-based protocol applications[J]. IEEE transactions
  on information forensics and security, 2013, 8(6): 1013-1026.

  包象琳,熊焰,黄文超,陈凯杰,汪万森,孟昭逸,徐晓峰,方贤进.基于

  SmartVerif

  的比特币底层协议算力盗取漏洞发现[J].电子学报,2021,49(12):2390-2398.

  （更新于2024年3月）'
