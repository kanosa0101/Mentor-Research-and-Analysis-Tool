bio_raw: 'E-mai：yuboyan@ustc.edu.cn

  研究方向

  ：物联网、移动计算、无源网络、智能感知

  闫宇博，男，副研究员，硕士生导师。2018年10月加入中国科学技术大学计算机科学与技术学院。主要研究方向包括低功耗大规模智能物联网、智能感知、无源网络、移动计算等。在相关领域取得一系列原创性成果，相关科研成果主要发表在网络领域国际知名会议和期刊，包括ACM
  MobiCom, IEEE INFOCOM, ACM MobiSys，ACM SenSys, IEEE/ACM Transactions on Mobile Computing,
  ACM Transactions on Sensor Networks, IEEE Transactions on Wireless Communications等。主持国家自然科学基金面上项目、重点项目课题，科技部重点研发计划子课题和其他省市级及企业合作课题十余项。

  科研项目

  ：

  • 国家自然科学基金面上项目，62072424，低功耗大规模物联网效能优化研究，2021.1-2024.12，项目负责人。

  • 国家自然科学基金区域创新发展联合基金，U20A20181，信息物理网络数据感知与安全体系，2021.1-2024.12，课题负责人。

  • 科技创新2030“新一代人工智能”重大项目，2018AAA0100500， 元模型驱动的开放环境自适应感知，2019.10-2022.12，子课题负责人。

  • 安徽省自然科学基金项目，1908085QF296，基于跨层协作的无线网络协同技术研究，2019.7-2021.6,项目负责人。

