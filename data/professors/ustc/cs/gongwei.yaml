bio_raw: 'E-Mail：weigong@ustc.edu.cn

  个人主页：

  https://ubiot.ustc.edu.cn/weigong/

  主要研究方向

  ：无源物联网、智能感知、绿色计算等

  龚伟，中国科学技术大学教授，国家特聘青年专家。长期从事物联网架构、技术与系统研究。围绕世界前沿泛在无源网络方向，提出了高可用无源架构，建立了高吞吐无源传输模型，构建了鲁棒高效的无源网络。已发表论文200余篇，主要工作发表在ACM
  MobiCom, IEEE/ACM ToN等国际顶级会议和期刊，曾获得国际知名会议最佳论文十余次，包括IEEE GlobeCom、HPCC、DCOSS等。主持国家自然基金重点项目等国家级专项。担任CoNEXT、MobiSys、PerCom、HotMobile等国际著名会议程序委员及IEEE
  TMC、IEEE Network、Tsinghua Science and Technology等国际知名期刊编委。

  主持或参加科研项目

  国家自然科学基金面上项目，面向商用的高效无源蓝牙通信网络关键技术研究，2025/01-2028/12，在研，主持。

  国家自然科学基金重点项目，面向智慧物流的高效能物联网感知理论与关键技术，2020/01-2024/12，结题，主持。

  国家自然科学基金面上项目，高吞吐量移动无源网络传输协议及关键技术，2020/01-2023/12，结题，主持。

  主要专利

  方楠，龚伟，提升辅助医疗决策系统安全性的方法、设备及介质，2024.11.26,中国，ZL202411343598.4

  龚伟，徐海洋，基于稀疏专家混合与低秩适应的知识蒸馏优化方法，2024.12.24，中国，ZL202411200938.8

  龚伟，徐海洋，基于稀疏专家混合与低秩适应的知识蒸馏优化方法，2024.12.24，中国，ZL202411200938.8

  黄展翔，龚伟，周浩泉，王雪松，一种面向智慧医疗的高效蓝牙反向散射通信系统及方法，2024.08.13，中国，ZL202410694546.5

  丰芸芸，王公仆，龚伟，支持寻呼的LTE反向散射节能通信方法及系统，2024.08.02, 中国，ZL202311331940.4

