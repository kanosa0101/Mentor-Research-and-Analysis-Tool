title: 教授
bio_raw: 'E - Mail： yanyongz@ustc.edu.cn

  个人主页：

  http://staff.ustc.edu.cn/~yanyongz

  教授，博士生导师，IEEE Fellow (2018年)

  主要研究方向

  ：面向智能无人系统的智能感知；端边云协同的信息物理融合系统（CPS）；无人系统实时中间件和操作系统；车路云原生系统设计。

  1997年获得中国科学技术大学计算机科学与技术本科，2002年获得美国宾州州立大学（Penn State University）计算机科学与工程博士。从2002年起在美国罗格斯-新泽西州立大学电子与计算机工程系任教，2008年获得终身制，晋升为副教授，2015年晋升为正教授。从2018年7月全职回到中科大计算机科学与技术学院任教。从2020年起担任ACM中国副主席。

  已在相关国际期刊及会议发表文章200余篇，包括多个CCF A类期刊及会议。根据谷歌学术网(Google Scholar) 统计， 22年6月， H-Index指数为50,
  文章总引用次数超过1,2000次，单篇引用超过1500次。现（曾）任多个期刊的编委，包括IEEE TCC (cloud computing), IEEE TDSC,
  IEEE/ACM ToN, IEEE TMC, IEEE TSC, Elsevier Smart Health等。担任了数十次IEEE和ACM国际学术会议组织委员会的不同职位，并被长期邀请担任多个重要国际学术会议的程序委员会委员。担任IPSN
  2022 TPC co-chair.

  获得ACM Mobicom 2021 Best Paper Runner-Up

  。

  项目情况

  ：

  科技部科技创新２０３０“新一代人工智能”重大项目，“元模型驱动的自适应感知”，项目负责人

  中国科学院战略性先导科技专项(C类)，项目四负责人

  合肥综合性国家科学中心人工智能研究院“无人小巴”项目，项目负责人

  近期工作

  ：

  H Zhu, J Deng, Y Zhang, J Ji, Q Mao, H Li, Yanyong Zhang.　VPFNet: Improving 3D Object
  Detection with Virtual Point based LiDAR and Stereo Data Fusion. IEEE Trans on Multimedia. 
  Accepted for publication (June 2022).

  Y Li, J Deng, Y Zhang, J Ji, Yanyong Zhang. EZFusion: A Close Look at the Integration
  of LiDAR, Millimeter-wave Radar, and Camera for Accurate 3D Object Detection and
  Tracking. IEEE RA-L. Accepted for publication (June 2022).

  X Chu, J Deng, Y Li, Z Yuan, Y Zhang, J Ji, Y Zhang. Neighbor-vote: Improving monocular
  3d object detection through neighbor distance voting. Proceedings of ACM Multimedia,
  2021.

  J Deng, S Shi, P Li, W Zhou, Y Zhang, H Li. Voxel r-cnn: Towards high performance
  voxel-based 3d object detection. Proceedings of AAAI, 2021.

  W Zhang, Z He, L Liu, Z Jia, Y Liu, M Gruteser, D Raychaudhuri, Y Zhang. Elf: accelerate
  high-resolution mobile deep vision with content-aware parallel offloading. Proceedings
  of ACM Mobicom, 2021.

  X Fan, L Shangguan, S Rupavatharam, Y Zhang, J Xiong, Y Ma, R. Howard. HeadFi: bringing
  intelligence to all headphones. Proceedings of ACM Mobicom, 2021.'
