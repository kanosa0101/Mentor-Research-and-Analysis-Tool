bio_raw: '电　话：(0551)63600906

  E-Mail：glchen@ustc.edu.cn

  主要研究方向

  ：并行算法，计算机体系结构，计算机网络和神经计算等。

  陈国良，中国科学院院士，教授，博士生导师，全国首届高等学校教学名师，中国计算机学会高性能计算专业委员会原主任，国际高性能计算（亚洲）常务理事。主要研究领域为并行算法和高性能计算及其应用等。曾获国家科技进步二等奖、国家级教学成果二等奖、中科院科技进步二等奖等共12项。

  陈国良院士是我国非数值并行算法研究的学科带头人，他围绕着并行算法的教学与研究，逐渐形成了“算法理论－算法设计－算法实现－算法应用”一套完整的并行算法学科体系，提出了“结构－算法－编程”一体化的并行计算研究方法。他率先创建的我国第一个国家高性能计算中心是我国并行算法研究、环境科学与工程计算软件等的科研与教学基地，在学术界和教育界有一定的影响和地位。'
