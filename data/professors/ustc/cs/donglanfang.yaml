  个人主页：

  http://staff.ustc.edu.cn/~lfdong/

  主要研究方向

  ：图像和视频智能分析,知识图谱和对话系统,数值模拟及三维重建

  董兰芳,女，中国科学技术大学副教授。1991年毕业于兰州大学计算机科学系,获学士学位,1994年毕业于中国科学技术大学计算机科学与技术系，获硕士学位。多年来承担了中国科学院重大项目子课题、国家重点研发计划课题、国家自然科学基金等多个项目，主持了和华为公司、中国电科、中国石化等企业在人脸分析和表情合成、高清视频人脸和人体检测、太赫兹人体安检图像智能分析、岩石切片图像智能分析、基于双能X光的煤矸分拣、辅助驾驶等领域二十多个项目的合作研究，在国内核心期刊或国际会议上发表学术论文90多篇，主编和参编教材2本，承担《计算机图形学》、《计算机图形图像》、《高级计算机图形学》、《图像处理》、《高级图形图像处理》、《面向对象的分析与设计》等课程的教学，已经公开的发明专利10余项，其中获授权9项。作为中科大机器人团队成员参与了情感交互机器人“佳佳”和医疗辅助诊疗机器人“医佳”的研究。

