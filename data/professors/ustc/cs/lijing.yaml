  主要研究方向

  ：

  组合软件技术、大型网络系统和分布式算法

  李京，1966年4月生。1987年毕业于中国科技大学计算机系，1990年和1993年分别在该校获计算机软件硕士和博士学位。1993年6月至1996年4月在中国科技大学任教，任职副教授，并行分布中心主任。后于1996年和1997年在香港城市大学和新加坡国立大学做访问研究。1998年7月回国，任中国科学院软件研究所研究员，博士生导师，对象技术中心主任。2001年受软件所委派兼任北京中科国际软件有限公司总裁。2005年任中国人保寿险有限公司信息技术部副总经理主持工作。2008年作为引进人才调入中国科技大学国家高性能计算中心（合肥）。现任网络信息中心主任。

  主要从事组合软件技术、大型网络系统和分布式算法的研究开发以及相关技术的推广应用工作。九十年代初即开展了组合式软件开发方法学的研究，提出了软件是在过程控制下的对象（构件）的复合的思想，并先后成功地开发了支持该方法学的组合软件开发平台和网络环境下的软件支撑平台，这些平台已成功应用于国家重点项目和企业大型应用工程。近年来主要在大规模网络、移动计算和普适计算等领域进行算法和系统架构的研究。曾先后主持过国家自然科学基金、国家863重点项目、国家“九五”“十五”科技攻关项目、国家973项目子项目、中国科学院院长基金特别支持项目等十余项，申请了两项专利（一项批准，一项在审）。获国家科技进步二等奖、中国科学院科技进步一等奖、中石化科技进步一等奖、中国人民银行科技进步奖等多项奖励，在国内外高水平的学术刊物和会议上发表论文80余篇。

  获奖情况

  ：

  获国家科技进步二等奖、中国科学院科技进步一等奖、中石化科技进步一等奖、中国人民银行科技进步奖等多项奖励。

