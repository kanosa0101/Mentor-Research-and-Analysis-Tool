bio_raw: 'E- mail：zhuang@ustc.edu.cn

  个人主页：

  http://staff.ustc.edu.cn/~zhuang

  主要研究方向

  ：计算机图形学、计算机辅助(几何)设计、GPU计算、计算机视觉、科学可视化。

  黄章进，男，1980年4月生，湖北天门人，博士，副教授。于1999年和2005年在中国科学技术大学数学系获得学士和博士学位。2005年7月至2008年6月，在北京大学信息学院人机交互与多媒体实验室从事博士后研究工作。2008年7月起，到中国科技大学计算机系工作。目前主持国家自然科学基金项目一项，参加国家863项目两项。

  获奖情

  况

  ：

  2007.6 ACM实体与物理造型国际会议(ACM SPM 2007)最佳论文奖

  2007.10 第十届国际计算机辅助设计与图形学会议(CAD/Graphics 2007)最佳论文奖

  代表性论著

  ：

  黄章进. 单变量均匀静态细分格式的连续性分析和构造. 软件学报,17(3), 559-567, 2006.

  Zhangjin Huang, Jiansong Deng, Yuyu Feng, and Falai Chen. New Proof of Dimension
  Formula of Spline Spaces over T-meshes via Smoothing Cofactors. Journal of Computational
  Mathematics, 24(4), 501-514, 2006.

  申立勇, 黄章进. 一类多参数的曲线细分格式. 计算机辅助设计与图形学学报, 19(4), 468-472, 2007.

  Zhangjin Huang, Guoping Wang. Distance between a Catmull-Clark Subdivision Surface
  and Its Limit Mesh. In Proceedings of the 2007 ACM Solid and Physical Modeling Symposium
  (ACM SPM 2007), 233-240, 2007. (ACM SPM 2007最佳论文)

  Wenbing Ge, Zhangjin Huang, Guoping Wang. Interpolating Solids Orientations with
  a C2-continuous B-spline Quaternion Curve. In Proceedings of the 2nd International
  Conference of E-Learning and Games, LNCS 4469, 606-615, 2007.

  Zhangjin Huang, Guoping Wang. Improved Error Estimate for Extraordinary Catmull-Clark
  Subdivision Surface Patches. The Visual Computer, 23(12), 1005-1014, 2007. (IEEE
  CAD/Graphics 2007最佳论文)

  Zhangjin Huang, Guoping Wang. Bounding the Distance between a Loop Subdivision Surface
  and Its Limit Mesh. In Proceedings of Geometric Modeling and Processing 2008 (GMP
  2008), LNCS 4975, 33-46, 2008

  Zhangjin Huang, Jiansong Deng, Guoping Wang. A Bound on the Approximation of a Catmull-Clark
  Subdivision Surface by Its Limit Mesh. Computer Aided Geometric Design, 25(7), 457-469,
  2008.'
