bio_raw: '电　话：(0551)63606724

  E-Mail：xpchen@ustc.edu.cn

  实验室主页：

  http://ai.ustc.edu.cn/

  个人主页：

  http://www.wrighteagle.org/en/people/xpchen.php

  主要研究方向

  ：智能体形式化建模和多机器人系统关键技术

  陈小平，现任计算机学院教授，机器人技术标准创新基地主任。兼任全球人工智能理事会执行委员，中国RoboCup委员会主席，国际RoboCup联合会理事。曾任2015世界人工智能联合大会机器人领域主席、2015和2008RoboCup机器人世界杯及学术大会主席。中国科学技术大学“杰出研究”校长奖、IEEE
  ROBIO’2016最佳大会论文等国际论文奖、世界人工智能联合大会最佳自主机器人奖和通用机器人技能奖、机器人世界杯12项世界冠军等团体奖获得者。提出基于“融差性”原理和“开放知识”的机器人智能技术路线，并在“可佳”和“佳佳”智能机器人系统中进行了持续性研究和工程实现。

  获奖情况

  ：

  先后获得世界人工智能联合大会最佳自主机器人奖、通用机器人技能奖和助老机器人比赛第一名，机器人世界杯12项世界冠军/第一名等团体奖。

  十篇代表性论著

  ：

  Wu P C, Lin N, Chen X P, et. al. A New Grasping Mode Based on a Sucked-type Under-actuated
  Hand. Chinese Journal of Mechanical Engineering, 31(1): 94, 2018.

  Yusong Jin, Yufei Wang, Xiaotong Chen, Zhanchi Wang, Xiaoping Chen, Model-Less Feedback
  Control for Soft Manipulators. The 2017 IEEE/RSJ International Conference on Intelligent
  Robots and Systems (IROS 2017), September 24–28, Vancouver, 2017.

  Hao Jiang, Xinhua Liu, Xiaotong Chen, Zhanchi Wang, Yusong Jin, Xiaoping Chen, Design
  and Simulation Analysis of a Soft Manipulator based on Honeycomb Pneumatic Networks,
  The 2016 International Conference on Robot and Biomimetics, December 3-7, 2016.

  Hao Sun, Ning-Yang Wang, Hao Jiang and XiaoPing Chen, Flexible Honeycomb PneuNets
  Robot, I. J. Robotics and Automation, 31(6), 475-483, October 31, 2016.

  Kai Chen, Fangkai Yang, Xiaoping Chen, Planning with Task-Oriented Knowledge Acquisition
  for a Service Robot, Proceedings of IJCAI 2016, 812-818, 2016.

  Aijun Bai, Feng Wu, Xiaoping Chen, Online Planning for Large Markov Decision Processes
  with Hierarchical Decomposition, ACM Transactions on Intelligent Systems and Technology
  (TIST) Vol. 6, No 4, July 2015.

  Jianmin Ji and Xiaopign Chen, A weighted causal theory for acquiring and utilizing
  open knowledge, International Journal of Approximate Reasoning, 2014 (to appear)

  Xiao-Ping Chen, Jian-Min Jin, Zhi-Qiang Sui, Jiong-Kun Xie, Handling Open Knowledge
  for Service Robots, In: Proceedings of the Twenty-third International Joint Conference
  on Artificial Intelligence (IJCAI-13), Beijing, China, August 3-9, 2013.

  Xiaoping Chen, Jiongkun Xie, Jianmin Ji, and Zhiqiang Sui, Toward Open Knowledge
  Enabling for Human-Robot Interaction, Journal of Human-Robot Interaction, Vol. 1,
