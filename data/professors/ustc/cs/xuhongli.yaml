bio_raw: '电　话：0512-87161305

  E-Mail：xuhongli@ustc.edu.cn

  课题组主页：

  https://int-ustc.github.io/

  主要研究方向

  ：云计算/软件定义网络，智能网络/边缘计算，物联网/计算机网络

  徐宏力，男，1980年8月生，教授，国家基金委优秀青年科学基金获得者,现任计算机科学与技术学院党委书记。2002年毕业于中国科学技术大学计算机科学技术系，获硕博连读资格；2007年6月获得计算机软件与理论专业的博士学位，毕业留校任教。近年来，作为负责人主持了国家自然科学基金（4项）、博士后特别资助、博士后基金（一等）、中科院院长基金及省科学基金等项目。而作为核心技术骨干参与了973（2项）、863（1项）、国家科技重大专项（3项）、国家发改委CNGI（2项）、国家自然基金重点等十多个项目。

  近年来，已在主流的国际期刊和会议上发表SCI/EI论文120多篇，包括IEEE/ACM Trans.论文18篇，CCF A类论文22篇，B类论文17篇。2018年，4篇论文共16次入选IEEE/ACM
  Trans. on Networking的受欢迎论文，其中1月份有3篇论文入选，当月入选论文最多。担任国际顶级期刊IEEE JSAC的“网络虚拟化”系列专刊的副编辑。

  获奖情况

  ：

  2016年，网络领域著名会议ICNP最佳论文奖提名

  2016年，江苏省科技进步二等奖

  2011年，全国传感网大会CWSN优秀论文奖

  2007年，中科院院长奖

