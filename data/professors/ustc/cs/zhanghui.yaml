bio_raw: 'Email：

  fzhh@ustc.edu.cn

  主要研究方向

  ：

  无线网络与通信，智能计算

  张辉，

  1977

  年生，副教授，

  2001

  年和

  2007

  年于中国科学技术大学分别获得学士和硕士学位。

  2018

  年

  6

  月至

  2019

  年

  6

  月于韩国

  KAIST

  访问学习。目前主要从事车联网数据通信和智慧城市数据融合等方面的研究工作，在

  IEEE Transactions on Mobile Computing (TMC)

  、

  IEEE Wireless Communications Letters (WCL)

  和

  IEEE Communications Letters (CL)

  等国际期刊发表多篇论文。

  获奖情况

  ：

  1.2017

  年获得安徽省科学技术奖二等奖

  (

  自然科学

  )

  2.2019

  年中国科学技术大学惠普信息科学青年教师奖

  3.2022

  年获龙湖奖教金

  代表性论著

  ：

  1.Zhang, Hui ;Zhang, Xinming ;Sung, Dan Keun. A Fast, Reliable, Opportunistic Broadcast
  Scheme with Mitigation of Internal Interference in VANETs, IEEE Transactions on
  Mobile Computing, 2023.

  2.Zhang, Hui ;Zhang, Xinming ;Sung, Dan Keun. An Efficient Cooperative Transmission
  Based Opportunistic Broadcast Scheme in VANETs, IEEE Transactions on Mobile Computing,
  22(3), 1327-1342, 2023.

  3.Zhang, Hui; Chong, Song; Zhang, Xinming; Lin, Nan. A Deep Reinforcement Learning
  Based D2D Relay Selection and Power Level Allocation in mmWave Vehicular Networks,
  IEEE Wireless Communications Letters, 9(3), 416-491, 2020.

  4.Zhang, Xinming ; Yan, Long ; Zhang, Hui ; Sung, Dan Keun, A Concurrent Transmission
  Based Broadcast Scheme for Urban VANETs, IEEE Transactions on Mobile Computing,
  18(1), 1-12, 2019.

  5.Yan, Fan ; Zhang, Xinming ; Tao, Lei ; Zhang, Hui, Network Coding-based Flooding
  with a Mobile Sink in Low-Duty-Cycle Wireless Sensor Networks, IEEE Transactions
  on Mobile Computing, 18(8), 1857-1869, 2019.

  6.Zhang, Hui; Zhang, Xinming, An Adaptive Control Structure Based Fast Broadcast
  Protocol for Vehicular Ad Hoc Networks, IEEE Communications Letters, 21(8), 1835-1838,
  2017.

  7.Zhang, Hui ;Zhang, Xinming ;Sung, Dan Keun, Lightweight Self-adapting Linear Prediction
  Algorithms For Wireless Sensor Networks, IEEE Sensors Journal, 15(5), 3050-3058,
  2015.'
