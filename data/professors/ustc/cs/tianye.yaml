bio_raw: '电　话：(0551)63602445

  E-Mail：yetian@ustc.edu.cn

  个人主页：

  http://staff.ustc.edu.cn/~yetian

  主要研究方向

  ：未来网技术、互联网大数据、软件定义网络、网络内容分发。

  田野，男，副教授，硕士生导师，IEEE、ACM会员、CCF高级会员。2001年获中国科学技术大学电子信息工程学士学位，2004年获中国科学技术大学计算机软件与理论硕士学位，2007年获香港中文大学计算机科学博士学位。2008年至今任中国科学技术大学副教授。主持国家科技重大专项、国家自然科学基金、中科院战略科技先导专项等多项国家和省部级科研项目，入选中国科学院青年创新促进会。在IEEE
  TPDS、TIFS、TSC、TCSVT、INFOCOM等高水平学术期刊和会议上发表论文80余篇，撰写英文学术专著一部（Springer出版），获The Computer
  Journal（CCF B类）2015年度唯一最佳论文奖。获得发明专利授权10余项，参与制定国际电信联盟（ITU-T）标准1项。2013年至今担任SCI期刊“Frontiers
  of Computer Science”青年编委，担任领域多个知名期刊审稿人。

  获奖情况

  ：

  2016获The Computer Journal唯一最佳论文奖

  2016获安徽省第八届自然科学优秀学术论文二等奖

  2013获安徽省第七届自然科学优秀学术论文二等奖

  2013获中国科学技术大学海外校友基金会青年教师事业奖

  十篇代表性论著

  ：

  Xiaodong Wang, Ye Tian, Rongheng Lan, Wen Yang, Xinming Zhang, ''Beyond the watching:
  Understanding viewer interactions in crowdsourced live video broadcasting services'',
  IEEE Trans. on Circuits & Systems for Video Technology, accepted.

  Xiaodong Wang, Ye Tian, Min Zhao, Mingzheng Li, Lei Mei, Xinming Zhang, ''PNPL:
  Simplifying programming for protocol-oblivious SDN networks'', Computer Networks,
  147, pp. 64-80, 2018.

  Shan Zou, Qiang Wang, Junqiang Ge, Ye Tian, ''Peer-assisted video streaming with
  RTMFP Flash Player: A measurement study on PPTV'', IEEE Trans. on Circuits & Systems
  for Video Technology, 28(1), pp. 158-170, 2018.

  Junqiang Ge, Ye Tian, Lei Liu, Rongheng Lan, and Xinming Zhang, ''Understanding
  e-commerce systems under massive flash crowd: Measurement, analysis, and implications'',
