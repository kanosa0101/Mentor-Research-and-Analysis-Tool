  Aifang Xu, Xiaodong Tan, Ye Tian, ''Design and evaluation of a utility-based caching
  mechanism for information-centric networks'', in Proc. of IEEE ICC''15, London,
  UK, Jun. 2015.

  Aifang Xu, Xiaonan Feng, Ye Tian, ''Revealing, characterizing, and detecting crowdsourcing
  spammers: A case study in community Q&A'', in Proc. of IEEE INFOCOM''15, Hong Kong,
