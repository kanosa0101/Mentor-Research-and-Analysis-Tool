  Shan Zou, Qiang Wang, Junqiang Ge, Ye Tian, ''Peer-assisted video streaming with
  RTMFP Flash Player: A measurement study on PPTV'', in Proc. of IEEE ISCAS''17, Baltimore,
  MD, USA, May 2017.

  Haoran Guo, Xiaodong Wang, Kun Chang, Ye Tian, ''Exploiting path diversity for thwarting
  pollution attacks in named data networking'', IEEE Trans. on Information Forensics
  & Security, 11(9), pp. 2077-2090, 2016.

