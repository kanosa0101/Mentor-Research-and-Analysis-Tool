bio_raw: '电　话： 0551-63602824

  E - Mail： sfwang@ustc.edu.cn

  个人主页：

  http://staff.ustc.edu.cn/~sfwang/

  研究组主页：

  https://ustc-ac.github.io

  主要研究方向

  ：模式识别、情感计算、计算机视觉、多媒体技术

  王上飞，教授，博导，IEEE和CCF高级会员，CCF人工智能与模式识别专委、多媒体技术专委和计算机视觉专委委员，CAAI人工心理与人工情感专委委员。2002年获中国科学技术大学信号与信息处理专业博士学位。2004年和2011年分别赴日本九州大学和美国伦斯勒理工学院交流访问。作为负责人，承担了国家自然科学基金委、国家科技部、教育部留学基金委、安徽省科技厅等支持的项目近二十项。在国内外重要学术期刊TPAMI、TIP、TKDE、TMM、TAC、TCYB和国际学术会议CVPR、ICCV、ACMMM、AAAI等发表学术论文百余篇。发表的论文成为IEEE
  Trans. 热点论文百余次。2019年起，担任IEEE TAC和ACM TOMM副主编。指导的研究生获得GOOGLE女性科学家奖、GOOGLE奖学金、中科院院长奖、国家奖学金和优秀毕业生等多个奖项。

