  主要研究方向

  ：嵌入式实时系统、低功耗系统、智能计算机系统

  李曦，博士，

  1963

  年

  8

  月生于北京，教授级高工，博导。本科毕业于成都气象学院，研究生毕业于中国科技大学计算机系，获计算机系统结构博士学位。长期主讲本科生“计算机组成原理”和研究生“嵌入式系统设计方法”等课程。在国内外核心学术期刊和高水平学术会议上发表

  SCI/EI

  检索论文

  60

  余篇，译著一部，参编一部。

  2022

  年编著《实时嵌入式系统设计方法》，由教育部软件工程教指委推荐出版，为国内第一部面向该领域的研究生教材。先后负责或参与国家自然基金、重点研究计划等纵横向科研项目

  30

  余项，承担省部级教学研究课题多项。其研究小组在国内最早开展系统级低功耗优化理论和技术、

  ASIP

  体系结构设计与验证、操作系统模型、可重构计算、智能计算机系统结构等研究，持有相关技术专利多项，并与工业界建立了长期持久的合作关系。当前重点关注高性能时间可预测体系结构设计问题。

