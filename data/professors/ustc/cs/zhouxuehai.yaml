bio_raw: '电　话：(0551)63606864, 63492149

  E - Mail：xhzhou@ustc.edu.cn

  个人主页：

  http://staff.ustc.edu.cn/~xhzhou

  主要研究方向

  ：异构多核体系结构、可重构系统、面向特定应用的硬件加速系统、嵌入式系统设计。

  周学海，教授，博士生导师。1966年5月出生，分别于1987、1990、1997获中国科学技术大学学士、硕士和博士学位。曾任教育部计算机基础课程教指委秘书长，中国科学技术大学软件学院执行院长。目前为计算机学会高级会员，中国计算机学会分布式计算与系统专委会委员。

  多年来主持和参与国家自然科学基金、国家863科技计划、国家科技重大专项等纵横向课题30余项。在国内外重要学术期刊TC、TPDS、TCAD等ACM/IEEE Transactions和MICRO、ASPLOS、SPAA、DATE、FPGA等国际会议上发表论文100余篇，获发明专利10余项。

  获奖情况

  ：

  2014年获国家教学成果二等奖

  2012年获安徽省教学成果特等奖

  2010年获安徽省教学成果一等奖

  2008年获安徽省教学成果二等奖

  2005年获安徽省教学成果一等奖

  2003年获宝钢优秀教师奖

