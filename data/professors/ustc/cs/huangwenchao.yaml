title: 副教授
bio_raw: 'E - Mail：huangwc@ustc.edu.cn

  个人主页：

  https://faculty.ustc.edu.cn/huangwenchao/

  主要研究方向

  ：信息安全、人工智能、移动计算、网络与系统安全自动化验证技术、Android系统安全等

  黄文超，1982年6月生，副教授。2006、2011年于中国科学技术大学计算机科学与技术系分别获得学士、博士学位。现任中国科学技术大学计算机科学与技术学院副教授。主要从事网络安全、形式化安全验证、深度强化学习、移动计算、Android系统安全及可信计算等方面的研究。主持多项国家自然科学基金面上项目、国家自然科学基金青年基金、安徽省自然科学基金等国家及省部级项目，作为技术负责人参与国家自然科学重点基金、国家自然科学基金国际重点合作项目、国家863重点项目等重点项目，并参与国家重点研发项目等。在IEEE
  Transactions on Mobile Computing, IEEE Transactions on Information Forensics and
  Security, IEEE Journal on Selected Areas in Communications, MobiCom, INFOCOM, Ubicomp等多个国际知名期刊和会议上发表论文。曾担任MSN2016会议Web
  Chair和Local Arrangement Co-Chair，并承担多个国际知名期刊和会议的审稿人，包括IEEE Transactions on Mobile
  Computing, IEEE Transactions on Communications, MOBICOM, INFOCOM等。

  获奖情况

