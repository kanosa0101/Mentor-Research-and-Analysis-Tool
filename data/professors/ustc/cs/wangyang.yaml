  主要研究方向

  ：

  - 基础理论研究：数据挖掘、开放机器学习、AI for Science、物联网与城市计算等

  - 前沿应用探索：人工智能与物质科学交叉应用、人工智能与半导体材料交叉应用等

  汪炀，教授，博士生导师。现任中国科学技术大学软件学院副院长，中国计算机学会传感器网络专业委员会执行委员，中国计算机学会智能交通分会执行委员，安徽省杰出青年科学基金获得者。2002年本科毕业于中国科学技术大学计算机系，2007年于中国科学技术大学获计算机应用专业博士学位。主要研究方向为人工智能基础理论与交叉应用研究，包括数据挖掘、开放机器学习、AI
  for Science、物联网与城市计算等。

  作为课题/系统负责人先后承担了中国科学院稳定支持基础研究领域青年团队计划项目、中国科学院“智能科学家系统”专项、国家重大科研仪器研制项目（部门推荐）

  ，并作为项目负责人主持了国家自然科学基金面上项目（连续3项）和安徽省杰青项目在内的纵向课题40余项。近年来，聚焦人工智能基础理论研究并致力于发展面向物质科学的人工智能方法，

  在人工智能及交叉科学领域顶级国际学术会议及期刊上以第一/通信作者身份发表CCF-B类、相当水平及以上高水平论文120余篇（其中CCF-A类及相当水平顶级论文70余篇，包括JACS、IEEE
  TPAMI、ICML、ICLR、NeurIPS、SIGKDD等），多次入选人工智能顶会Oral和Spotlight Paper。

  获2017年度IBM全球杰出学者奖（IBM Faculty Award）、2020年CSC中国优秀教师奖等，并多次获得省、学会及学校的优博或优博提名导师奖。

  获奖情况

