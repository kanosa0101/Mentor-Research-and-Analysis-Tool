bio_raw: 'Email:

  leigong0203@ustc.edu.cn

  主要研究方向

  ：

  智能计算系统、智能处理器架构、FPGA硬件加速

  宫磊，博士，副教授，硕士研究生导师，CCF体系结构专委会委员、CCF分布式计算与系统专委会委员。2019年于中国科学技术大学获得计算机系统结构专业博士学位。主要从事智能计算系统与处理器架构方面的研究工作，近十年在该方向上发表学术论文100余篇，包括以第一作者和通讯作者发表的CCF
  A类论文19篇（包括DAC 4篇，TCAD 7篇，TC 6篇，TPDS 2篇）、B类论文9篇（包括FPGA 2篇，DATE 3篇，ICCD 2篇，ICPP 1篇，TRETS
  1篇），谷歌学术被引1500余次，以第一发明人获发明专利授权6项，曾获CCF B类会议CODES+ISSS 2018最佳论文提名（第一作者）、国际会议PAAP
  2021最佳论文（通讯作者）、ACM China 2020年度合肥分会优秀博士论文等论文奖项。目前担任TCAD、TODAES、TRETS、TCAS-I等领域内知名Trans.在内的多个期刊审稿人。作为负责人承担了国家自然科学基金青年项目、安徽省自然科学基金面上项目、江苏省自然科学基金面上项目、江苏省自然科学基金青年项目等纵向课题。

  获奖情况

  ：

  1. 2025年-安徽省教学成果一等奖

  2. 2025年-江苏省自然科学三等奖

  3. 2023年-苏州市计算机学会科学技术奖

  4. 2021年-苏州市人工智能学会自然科学奖

  5. 2021年-中国科学技术大学墨子杰出青年

  6. 2021年-PAAP 2021最佳论文奖

  7. 2020年-ACM China合肥分会优秀博士论文奖

  8. 2020年-苏州市计算机学会科学技术奖

  9. 2018年-CODES+ISSS 2018最佳论文提名奖

