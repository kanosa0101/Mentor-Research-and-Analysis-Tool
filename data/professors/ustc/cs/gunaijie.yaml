  主要研究方向

  ：并行算法和并行处理、并行体系结构、并行和分布式计算中的通信问题研究、IP层多播技术的研究

  顾乃杰，男，教授，1961年8月出生于江苏省南通市，计算机软件与理论研究室主任。1983年于中国科学技术大学数学系计算数学专业本科毕业，获理学学士学位；1989年于中国科学技术大学计算机系计算机软件专业研究生毕业，获工学硕士学位。

  参加过多项国家863、国家教委博士点基金项目的研究，主持过多项华为合作研究项目和华为基金项目的研究。目前，主持一项安徽省自然科学基金项目，参加安徽省重大项目、863项目各一项目。

  研究方向：

  并行算法和并行处理：研究并行和分布式计算中算法的设计，算法的性能分析，包括并行算法的可扩展性分析；

  并行体系结构：研究多级互联网结构的设计和性能分析，该领域的研究成果在并行计算机的设计，以及交换机和网络路由产品的研制中具有很重要的意义；

  并行和分布式计算中的通信问题研究：研究在并行和分布式环境中处理器间各种通信操作的有效实现，路由算法的设计，以及在常见的各种并行计算环境下的通信策略等。

  IP层多播技术的研究：包括多播路由算法，多播中的同步问题，安全多播等问题的研究。

  获奖情况

  ：

  2000年安徽省教学成果一等奖、中国科学技术大学教学成果一等奖（排名第3）

  神经信息处理系统 1996年获安徽省科技进步二等奖（排名第4）

