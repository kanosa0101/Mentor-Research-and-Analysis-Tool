bio_raw: '基本情况

  姓名：

  李雄飞

  性别：

  男

  职称：

  教授

  是否博导：

  是

  最高学历：

  研究生

  最高学位：

  博士

  电话：

  155 8426 7610

  Email：

  备注：

  计算机楼B104

  详细情况

  所在学科专业：

  计算机软件与理论

  所研究方向：

  数据挖掘技术、计算机视觉、机器学习理论。

  讲授课程：

  本科生：数据库系统原理

  研究生：数据挖掘

  教育经历：

  1981年，就读于南京大学计算机系，获理学学士学位

  1985年，就读于中国科学院研究生院，系统软件专业，获工学硕士学位

  1988年，参加工作

  1997年，就读于吉林大学(在职攻读)，通信与信息系统专业，获工学博士学位

  工作经历：

  1988年起，助教

  1991年起，讲师

  1996年起，副教授

  1997年起，硕士生导师

  2001年起，教授

  2003年起，博士生导师

  科研项目：

  累计负责和参与科技攻关项目、863项目、国家科技支撑计划项目、自然科学基金项目、973预研项目、国家社科基金项目等10项，省部级科研项目十余项。获省级科技进步二、三等奖各一次。

  学术论文：

  围绕大数据技术、计算机视觉、软件工具等领域发表学术论文近200篇。其中，指导的硕士研究生、博士研究生以第一作者在《中国科学》、《计算机学报》、《软件学报》、《自动化学报》、《Expert
  Systems With Applications》、《Signal Processing》、《Multimedia Tools and Applications》、《Journal
  of Electronic Imaging》、《IET Image Processing》、《Neurocomputing》等国内外高水平学术刊物上发表学术论文80余篇。

  着作教材：

  李雄飞,李军,《数据挖掘与知识发现》,高等教育出版社, 2003年11月

  李雄飞,董元方,李军,《数据挖掘与知识发现》(第2版),高等教育出版社, 2010年7月

  李雄飞,杜钦生,吴昊,《数据仓库与数据挖掘》,机械工业出版社, 2013年10月

  李雄飞,董元方,李军,《数据挖掘与知识发现》(第3版),高等教育出版社, 2020年2月

  治学格言：

  http://database.jlu.edu.cn'
