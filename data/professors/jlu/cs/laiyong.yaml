  学术认可

  担任中国人工智能学会人工智能基础专委会委员、中国计算机学会形式化方法专委会执行委员

  获中国商业联合会全国商业科技进步一等奖

  1

  项，两次获国际模型

  计数

  竞赛无权组亚军

  多次

  受邀在国内外知名高校、研究所做学术报告

  培养特色

  团队坚持一对一悉心指导，组内氛围融洽和睦；

  支持学生求学与实习兼顾

  ，工作强度适中、张弛有度。

  学习之余，会组织丰富的团建活动（部分照片见：

  https://github.com/laigroup/GroupPhotos

  ）。

  团队成果丰硕，多人斩获奖学金、获评优秀硕士学位论文；

  毕业生去向优质

  ，包括字节跳动、腾讯、华为、京东、拼多多、

  vivo

  、平安等知名企业，亦有入职国家机关、国有银行，或赴海内外高校攻读博士学位，发展前景广阔。

  欢迎基础扎实、热衷科研的同学加入研究组！'
