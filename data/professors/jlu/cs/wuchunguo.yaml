  [2] 群智能优化算法基础及应用研究. 2017年, 吉林省自然科学一等奖（9/10）.

  [3] 基于计算智能的系统控制与优化方法及应用研究, 2010 年全国商业科技进步一等奖, 2010-1-18-R02

  [4] 若干仿生计算技术及应用研究, 2008年全国商业科技进步一等奖, 证书编号: 2008-1-13-R03

  [5] 智能计算建模及应用研究, 2007年吉林省科技进步一等奖, 证书编号: 2007J10006

