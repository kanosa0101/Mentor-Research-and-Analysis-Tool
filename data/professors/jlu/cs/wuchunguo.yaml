bio_raw: '基本情况

  姓名：

  吴春国

  性别：

  男

  职务：

  副主任（符号计算与知识工程教育部重点实验室）

  职称：

  教授

  最高学历：

  研究生

  最高学位：

  博士

  电话：

  Email：

  详细情况

  所在学科专业：

  计算机应用技术

  所研究方向：

  机器学习，进化计算，科学智能 (AI4SCIENCE)

  招生目标：

  敏于思考，勤于专研，勇于探索

  讲授课程：

  机器学习，进化计算，数学建模，计算智能

  科研经历：

  主要从事演化计算、机器学习等相关方向的研究，在 IEEE Transactions on Evolutionary Computation, Applied Soft
  Computing, Information Sciences, Swarm and Evolutionary Computation, Physical Review
  E, Journal of Sound and Vibration 等学术刊物和国际会议发表论文70余篇，单篇最高他引930余篇次（https://scholar.google.com.sg/citations?user=l1eFuw0AAAAJ&sortby=pubdate），出版《群智能优化算法理论与应用》等专著2部。获得教育部自然科学二等奖“智能计算若干方法研究”和吉林省自然科学二等奖“群智能优化算法基础及应用研究”等省部级奖励6项，获得授权发明专利2项，软件著作权8项。2003
  年至2015年分别到新加坡高性能计算研究所、意大利特伦托大学、西班牙穆尔西亚大学和美国佐治亚大学机器学习领域的合作研究。

  教学经历：

  2006年在吉林大学计算机科学与技术学院开设机器学习课程，并一直担任主讲教师，负责组织建设机器学习课程大纲与教学规划。经过近20年的课程讲授，与团队一起形成了较为系统的机器学习课程授课方案
  以数学原理主线贯穿大部分机器学习算法，致力于使学生能够融汇贯通深刻理解机器学习方法发展历史脉络的内在原因和驱动力。

  学术贡献：

  提出了用于求解广义旅行商问题的广义染色体遗传算法，该方法适用于一大类现实世界普遍存在的组相关优化问题；利用演化计算范式对个体适应度具有容错性的特征，提出了支持模式适应度估计的遗传算法；为了平衡演化算法探索和开发两方面的搜索能力，分别提出了全局预测的非均匀变异粒子群算法（Information
  Sciences 418–419, 186–217.）和维度学习的异构种群粒子群算法（Swarm and Evolutionary Computation 45,
  33–51），这两项工作为演化算法构建了更强的自适应依据，使其更加高效地收敛于全局最优解。 近年来，为了解决人工设计深度学习模型架构难度日益增高的问题，在自动机器学习(AutoML)领域，以神经网络演化为清晰的技术主线，与国内外合作者完成了多项相关工作。其中典型工作包括：2023年，提出了具有概率分布自学习机制和信度分配机制的神经网络架构搜索方法（Applied
  Soft Computing, 2023, doi.org/10.1016/j.asoc.2023.110671），该方法使得算法在进行架构搜索的过程中能够根据模型的复杂度自适应地调整采样各类演化算子的概率分布，在有效控制最终模型复杂度的同时，增强了生成最优架构的概率。同年，合作团队提出了基于笛卡尔遗传规划的资源受限条件下文本分类神经网络的架构搜索方法（IEEE
  Trans. Evol. Computat., 2023, doi.org/10.1109/TEVC.2023.3346969），该方法通过引入个体的年龄机制，在显著降低适应度评估次数的同时，获得了与人工设计网络架构性能相近且稳定收敛的文本分类器。2022年，提出了意外流行粒子群优化算法（Swarm
  Evol. Comput. 76, 101222. https://doi.org/10.1016/j.swevo.2022.101222），该方法将社会学领域的群体决策行为建模为以群体为特征的演化算法，通过构建个体交互的自适应知识传播拓扑结构实现了类似群体决策过程中意外流行度的计算，进而为少数次优个体中优良片段的传播提供了有效的途径。

  学术论文：

  请参见：http://www.researcherid.com/rid/A-6901-2008

  著作教材：

