  [2] 梁艳春，张琛，杜伟，吴春国，曹忠波，生物信息学中的数据挖掘方法及应用，科学出版社，ISBN: 978-7-03-032658-4，2011年11月.

  [3] 吴春国, 高尚, 杨博, 时小虎 译, 优化理论与实用算法, 机械工业出版社, 北京, 2022. ISBN: 9787111708629.

