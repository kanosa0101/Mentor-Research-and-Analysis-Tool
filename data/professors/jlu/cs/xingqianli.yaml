  个人简介

  邢千里，吉林大学计算机科学与技术学院准聘副教授，博士生导师。吉林大学计算机科学与技术学院本科毕业后保送本院攻读硕士，

  2018

  年获得澳大利亚麦考瑞大学优秀博士生全额奖学金。

  2022

  年入选

  国家人社部博士后国（境）外交流计划联合引进项目

  ，进入吉林大学工作。主要研究方向为

  科学智能（

  AI for Science

  ）、

  LLM

  、多智能体

  、神经符号系等。在

  IEEE TMC

  、

  IEEE TITS

  、

  IEEE TNNLS

  、

  ICML

  、

  ICDM

  、

  ICWS

  等国际高水平期刊或会议发表论文多篇，主持国家自然科学基金青年基金

  1

  项，参与多项国家自然科学基金面上项目和重点项目。

