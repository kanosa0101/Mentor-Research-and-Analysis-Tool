  科研简介

  近五年，围绕人工智能与数据挖掘方向发表论文60余篇，包括中国计算机学会A/B类期刊和会议，IEEE trans，中科院1区等40余篇，2篇ESI高被引论文，被引2000余次。详细论文参考https://dblp.uni-trier.de/pid/209/6359.html
   主持和参与国家重大项目10余项，累计可支配经费200余万元。研究成果

  以第一完成人获得吉林省科学技术奖自然科学二等

  奖、中国商业联合会科技进步一等奖。

  DCSF算法提出者，该算法获得全球十余位IEEE Fellow人工智能领域顶级专家高度认可，被引170余次，2022年发表在 CCF A 类期刊 IEEE Transactions
  on Information Theory 的论文，将团队设计的算法作为经典算法进行综述和比较，团队设计的DCSF算法已成为信息论特征选择领域的流行基准。

  研究方向关键词

  （1）

  特征工程（

  选择

  ）

  ：主要针对高维复杂数据在不同应用场景下的降维和建模，常应用于医学数据、材料化学、机械时序数据等

  （2）

  大模型：

  低质多模态数据的表征建模、

  异质模态的动态对齐

  （3）（

  偏）多标记学习、多模态学习

  ：弱监督学习是应对当前数据不准确、多义性以及数据缺失挑战的典型机器学习范式

  （4）

  因果学习

  ：利用因果机制解释数据变量间的相关性

  （5）

  强化学习、迁移学习

  等其它机器学习范式。

  学术兼职

  NeurIPS

  、ICML、AAAI、IJCAI、ICDM，TKDE、TNNLS、IEEE TCYB等PC和审稿人；CCF 高级会员，大模型与生成专业委员会委员，粒计算与知识发现专业委员会委员；SCI
  3区期刊 electronics客座主编、SCI 4区Intelligent Automation & Soft Computing客座主编，多个国际会议程序委员、执行委员；

  教育部博士、硕士论文盲审专家、政府与企业合作项目评审专家、省（市）科技项目评审专家。

  代表性荣誉

  （1）

  国家级人才：博士后创新人才支持计划（全国400人）（2）入选全球前2%顶尖科学家榜单（斯坦福大学与爱思唯尔期刊评）

  （3）吉林省青年科技人才、吉林省人社厅省域拔尖人才（4）ACM 协会新星奖（吉林省3人）、ACM 协会优秀博士论文奖（吉林省2人）（5）长春市“优青”（6）吉林大学励新人才计划

  人才培养

  指导本科、硕士、博士发表CCF A类、中科院1区论文10余篇，指导学生保研至清华、北大、中科院、南京大学等国内名校，获本科科研训练优秀指导教师、优秀本科论文指导教师、优秀本科班主任等，欢迎对科研感兴趣的本科生提前进组学习！硕士名额亦有少量空缺，欢迎咨询报考！'
