  研究方向

  人机交互，人工智能，虚拟现实与增强现实，车载信息安全

  涉及行业及领域

  国家电网、石油石化、智能汽车、无人机

  招生信息：

  实验室常年招收博士和硕士研究生，参加实际项目可获科研补助，招生尚有名额，欢迎积极向上、热爱科研或希望在项目中锻炼自己的同学投递个人简历。

  招生专业：

  博士研究生：

  计算机科学与技术学院：计算机应用技术（学术型）

