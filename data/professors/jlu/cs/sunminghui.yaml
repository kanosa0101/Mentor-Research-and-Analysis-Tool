  ·计算机科学与技术学院：计算机应用技术（学术型和专业型）

  ·软件学院：软件工程（学术型和专业型）

  硕士、博士招生要求：

  在以下方面有所特长，具有编程基础，较强动手能力，较好英语听说读写能力，较好数学基础。

