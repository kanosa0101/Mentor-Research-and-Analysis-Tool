  个人简介

  李长春现任吉林大学计算机科学与技术学院准聘副教授（研究员），博士研究生导师。博士毕业于吉林大学，主要研究方向是机器学习、弱监督学习、半监督学习、虚假信息治理等领域。近五年共计发表学术论文近20篇，

  包括以第一/通讯作者在ICML、ICLR、ACL、WWW、AAAI、IJCAI等中国计算机学会推荐A类会议发表论文多篇；相关工作得到了国内外学者的认可和关注，他引400余次，h-index
  11。

