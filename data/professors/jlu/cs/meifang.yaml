  个人简介

  ：

  梅芳，博士，副教授，研究生导师，本硕博均毕业于吉林大学计算机科学与技术学院。

  2015

  年受国家留学基金委资助赴美国肯特州立大学做访问学者，

  2018

  年访问日本千叶工业大学。吉林省高层次

  D

  类人才

  (

  省域拔尖人才

  )

  。近

  5

  年累计发表

  CCF A

  类会议及中科院

  1

  区等高水平学术论文

  30

  余篇。主持和参加国家自然科学基金面上项目、国家自然科学基金青年科学基金项目、吉林省科技发展计划重点研发项目和吉林省自然科学基金项目等多个国家级和省部级科研项目，主持企业横向课题若干项，累计可支配经费

  300

  余万元。获得授权发明专利

  5

  项。近几年作为主要完成人获得吉林省自然科学奖二等奖

  1

  项（

  2/5

  ）、中国商业联合会科技进步奖一等奖

  1

  项（

  4/5

  ）、中国商业联合会科技进步奖二等奖

  1

  项（

  2/5

  ），累计获得各类省部级及市级奖项近

  10

  项。教学方面，主要讲授本科课程《计算机网络》、《车联网技术与应用》、《企业建模与工作流技术》以及

  IBM DB2

  和

  WebSphere

  认证，研究生课程《数据通信》、《移动自组织网络》，主持吉林大学本科及研究生教学改革课题、研究生全英文课程项目若干项，国家级规划教材《计算机网络》主编，发表教学改革论文若干篇，获得吉林大学首届教材建设奖、吉林大学实践教学团队奖等。

  研究方向：

  移动通信与网络及智能信息处理，主要从事移动边缘计算、异步

  /

  异构联邦学习、多模态信息融合、生成式

  AI

  、元学习、深度强化学习、多目标群智优化算法，以及智能交通及车联网低时延通信、无人机协作通信与感知、

  6G

  网络资源管理与优化等方面的研究工作。

  招生信息：

  每年计算机科学与技术学院和软件学院都有硕士名额，学硕

  /

  专硕不限

  。博士招生资格具备，但名额不确定。

  提供实验环境（如电脑、算力、工位），每周召开组会研一研二轮流讲，可结合兴趣商定论文方向（例如，偏通信或偏

  AI

  ），有科研项目支撑研究内容。不要求固定时间坐班打卡，自由学习时间。研二下学期可申请去公司实习，前提是基本完成毕业论文主要工作，能保证毕业。

  团队气氛活泼融洽，欢迎感兴趣的同学加入。希望你性格开朗，踏实认真，有一定的编程经验和良好的学习能力，能够快速融入科研小组的学习氛围和工作进度。

