  个人简介

  罗仁强，吉林大学计算机科学与技术学院助理教授，博士生导师。近三年共计发表高水平学术论文

  10

  余篇，其中以第一责任作者在TPAMI、

  IJCAI

  、

  KDD

  、

  AAAI

  、

  WWW

  等

  CCF-A

  类期刊/会议上发表高水平学术论文

  20余

  篇。

  每年招收博士研究生

  1

  名，硕士研究生

  2

  名。所在研究组（

  Trustworthy Epsilon Lab

  ）成立于

  2026

  年，目前团队成员

  30

  余人，涵盖本科生、硕士生和博士生，以及多位海外博士后、助理教授。科研氛围浓厚，方向众多，每年有充足的博士和硕士招生名额，欢迎对研究组有兴趣的同学加入，并对每位同学量身定制研究课题，定期开展一对一讨论。欢迎对科研充满热情且具有内在驱动力的同学投递简历。

