  TOP

  期刊

  8

  篇，出版《水声通信网络研究》专著

  1

  部。

  担任中国通信学会水下通信委员会委员、中国计算机学会分布式计算与系统专委会执行委员、中国计算机学会物联网专委会执行委员、第十七届国际水声网络与系统旗舰会议

  ACM WUWNet

  ’

  2023 Publicity Chair(

  宣传主席及大会主持人

