bio_raw: '基本情况

  姓名：宋姗姗

  性别：女

  职称：副教授

  是否博导：是

  最高学历：研究生

  最高学位：博士

  Email: songss@jlu.edu.cn

  宋姗姗，吉林大学人才引进副教授，博士生导师，研究水声网络性能评估与仿真、水声网络协议设计、水下协同信息获取。主持多项国家级项目及国家级重点项目子课题，包括国家自然基金面上基金、国家自然基金青年基金、国家重点研发子课题等。以第一完成人获得中国商业联合会全国商业科技进步二等奖，

  2024

  “海洋强国青年科学家提名”，全国博士后创新创业大赛优胜奖。入选吉林省省域拔尖人才、全国创新创业优秀博士后、吉林大学优秀青年培育计划、吉林大学励新优秀青年教师培育计划。以第一作者或通信作者身份发表论文

  30

  余篇，包括

