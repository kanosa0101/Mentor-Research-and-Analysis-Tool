  教育经历：

  1991年、1994年在哈尔滨工业大学精密仪器系分别获得学士、硕士学位。1994年4月至今任教于吉林大学计算机科学与技术学院。期间于2008年在吉林大学计算机科学与技术学院获得博士学位。2009年到2011年在浙江工业大学软件学院从事博士后研究工作。

  工作经历：

  1994年4月至今任教于吉林大学计算机科学与技术学院。

  科研项目：

  [1]“十一五”国家密码发展基金，基于有限域上遍历矩阵的公钥密码体制研究， 2006-2010，第二负责人；

  学术论文：

  [1] 赵永哲，赵博，裴士辉，“有限域上遍历矩阵的特性研究”，数学学报，Vol. 55 No. 3，2012.5，p457-468

  [2] 裴士辉，赵永哲, 赵宏伟. 基于遍历矩阵的公钥加密方案，电子学报，2010,  38(8):1908-1913.

  [3] 赵永哲，赵博，裴士辉，姜占华. HFEM公钥密码方案的设计与实现，通信学报，2010, 32(6): 24-31.

  [4] 裴士辉，赵宏伟. 基于Vandermonde 矩阵的分布式密钥分发中心方案，吉林大学学报(工学版)，2007, 37(9):1154-1157.(EI检索)

  [5] Pei Shi-Hui, Zhao Yong-Zhe，Zhao Hong-Wei.  Construct Public Key Encryption Scheme
  Using Ergodic Matrices over GF(2)，In Theory and Applications of Models of Computation
  4th International Conference, TAMC 2007, vol. 4484 of  LNCS, Berlin Heidelberg:
  Springer-Verlag, 2007, pp181-188 . (EI检索)

  [6] Pei Shi-Hui, Ma Yu-Min. The expert system for auto programming in coordinate
  measuring machines. Applied Mechanics and Materials, v120, p254-257, 2012. (EI检索)

  社会兼职：

  中国密码学会会员

  治学格言：

  业精于勤'
