  详细情况

  基本信息：

  李洪亮，博士、副教授、博士生导师，担任中国计算机学会分布式计算与系统专业委员会执行委员、容错计算专委会执行委员。于2012年在吉林大学计算机学院获得博士学位、曾于2011年在加拿大多伦多大学做访问学者、于2011年在加拿大Platform
  Computing Inc.任软件工程师，于2016-2017年在美国天普大学吴杰教授课题组做博士后访问学者。曾获吉林省科技进步一等奖 1 项，中国商业联合会科技进步一等奖
  1 项，所负责的“云计算技术”系列课程获批国家级一流本科课程虚拟仿真课程和吉林省一流本科课程国家，获 ACM 中国新星奖和 IBM 优秀教师奖教金等个人奖项。

  主要面向云计算、数据中心和高性能计环境，研究系统资源调度和各类并行作业容错方法等，近年来主要开展大规模深度学习作业的分布式深度学习集群环境中的资源调度和容错优化研究。主持国家自然基金项目等国家级科研项目2项，省级科研项目1项，国际合作项目1项；参与国家级/省级科研项目5项等，相关成果发表论文40余篇(包括ATC、INFOCOM和CLUSTER等顶级会议和TPDS、TACO、JPDC、JCST和FGCS等顶级期刊)，获得国家发明专利8项。

  教学方面主要负责云计算技术和分布式存储等系列课程的建设工作，其中“云计算技术综合虚拟仿真实验”课程获批国家级一流本科课程虚拟仿真课程和吉林省一流本科课程。

  所研究方向：

  并行/分布式深度学习,调度算法，容错，云计算

  招生信息：

  所在学科专业：计算机系统结构

  招收博士/硕士研究生、本科实习生，欢迎同学们联系研讨。

