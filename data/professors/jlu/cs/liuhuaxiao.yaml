  招生信息

  1、每年招收博士研究生1名（本科直博、硕博连读、申请考核均可）

  2、每年招收硕士研究生4-7名（计算机学院和软件学院的学硕、专硕均可招收），欢迎保研和考研的同学与我联系（QQ、邮箱）

  3、按需招收大三同学进组参与科研活动。理解科研过程，参与迭代式实验，从真实数据集的实验结果中分析问题、总结问题，发表论文时按贡献添加作者。

  目前与

  慕尼黑工业大学

  、

  香港科技大学（广州校区）、斯坦福大学、华为智能驾驶、上汽、煤工研究院、中科方德、字节跳动公司

  存在密切合作关系，目前组内有多位同学被派出访学、项目合作。'
