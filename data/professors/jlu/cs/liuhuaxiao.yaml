  个人简介

  2005-2013年在吉林大学计算机学院分获学士、博士学位，师从金英教授。2013年博士毕业后留校任教，2017年晋升为副教授，同年当选中国计算机学会软件工程专业委员会执行委员，2018年起获得博士研究生招生资格，

  现为

  CCF公益工作委员会委员，NOI-Pre项目入门组算法主讲教师，2024年度CCF杰出演讲者。

  主讲课程包括

  《编译原理与实现》

  、

  《程序分析技术》

  。负责和主持项目包括

  国家自然科学基金面上项目、

  国家重点研发计划子课题、字节跳动公司校企合作项目、方德国产操作系统项目、中国航空航天研究所算法开发项目

  、煤工研究总院矿井感知层数据对象模型项目、

  吉林省自然科学基金面上项目、吉林省青年科研基金项目、吉林大学优秀青年教师重点培养计划、吉林大学优青培育资助计划、吉林大学青年师生交叉培育项目

  等。

  在科研方面，以数据驱动为核心，面向软件社区及现实世界中切实存

  在的问题，利用包括文本分析、数据挖掘、代码分析、深度学习等技术探索解决方案。所涉及的研究领域主要包括：

  软件工程

  、

  人机交互

  、

  数据挖掘

  、

  专家系统

  。此外在

  移动信息无障碍

  领域开展了前沿探索，意图帮助视障群体可以平等、便捷、无障碍的与

  移动应用进行交互。2017年至今以第一责任作者发表SCI检索论文40余篇，其中包CCF推荐A类期刊IEEE Transactions on Software Engineering（TSE）、ACM
  Transactions on Software Engineering and Methodology（TOSEM）、IEEE Transactions on
  Computers（TC）

  6

  篇，实现了吉林大学在软件工程领域顶级期刊发表上的突破。在CCF推荐B类/中科院1区期刊Information and Software Technology、Information
  Sciences、Journal of Systems and Software、Journal of Software: Evolution and Process、Software:
  Practice and Experience、IET Software、Science of Computer Programming、Journal of
  Computer Science& Technology、ACM Transactions on Design Automation of Electronic
  Systems等发表论文

  22

  篇。合作参与CCF-A类期刊会议ICSE26、TSE、TOSEM论文

  4

  篇。

