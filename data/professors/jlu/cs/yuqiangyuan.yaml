  详细情况

  所在学科专业：

  计算机软件与理论

  所研究方向：

  车载自组网，时空推理

  讲授课程：

  数据结构（）

  教育经历：

  1991-1995，吉林大学计算机软件专业，本科；

  1995-1998，吉林大学计算机应用技术专业，硕士研究生；

  1998-2003，吉林大学计算机软件与理论专业，博士研究生；

  2007-2008，荷兰Twente大学计算机系，博士后。

  工作经历：

  1998-2000，吉林大学计算机科学系，助教；

  2000-2004，吉林大学计算机科学与技术学院，讲师；

  2004年至今，吉林大学计算机科学与技术学院，副教授。

  科研项目：

  主持的主要项目：

  2008年，国家自然科学基金青年基金项目，基于时空推理的车辆自组织网络移动性预测和地理路由的研究(60703022)；

  2009-2011年，教育部中央高校基本科研业务费专项资金，车辆自组网中告警信息分发机制的研究(200903182)；

  参加的主要项目：

  2012-2016年，国家自然科学基金重点项目，复杂时空知识的智能处理基础理论及应用研究(61133011)；

  2008-2010年，国家自然科学基金项目，复杂时空推理及应用研究(60773099)；

  2004-2008年，国家自然科学基金重大项目子课题，非规范知识的数学基础(60496321)；

