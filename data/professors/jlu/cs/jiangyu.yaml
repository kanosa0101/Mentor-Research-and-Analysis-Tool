bio_raw: '基本情况

  姓名：姜宇

  性别：男

  职称：教授，博士生导师

  最高学历：研究生

  最高学位：博士

  Email：jiangyu2011@jlu.edu.cn

  详细情况

  所在学科专业：

  计算机应用技术

  研究方向：

  智能感知与认知计算、人机混合智能决策

  招生信息：

  实验室常年招收博士和硕士研究生，欢迎积极向上、热爱并希望在科研项目中锻炼自己的同学投递个人简历。

  博士研究生：

  计算机科学与技术学院：计算机应用技术（学术型）

  硕士研究生：

  • 计算机科学与技术学院：计算机应用技术（学术型和专业型）

  • 软件学院：软件工程（学术型和专业型）

  硕士、博士招生要求：

  具有较强动手能力，良好编程和数学基础。

  讲授课程：

  《边缘计算》课程负责人

  《智能终端与边缘计算》课程负责人

  科研项目：

  先后主持或参与国家自然科学基金等各类科研项目10余项，近年来代表性科研项目如下：

  • 国家自然科学基金面上项目, 62072211, 基于主动推理的水下自主航行器视觉认知计算关键技术研究, 2021-01至2024-12, 项目负责人

  • 国家自然科学基金重点项目, 51939003, 可底栖式水下自主航行器关键技术研究, 2020-01至2024-12, 课题负责人

  • 国家自然科学基金成果转化项目, 轨道交通数字孪生智能运维关键技术研究, 2021-09至2024-02, 课题负责人

  • 国家自然科学基金青年基金项目, 51409117, 面向海上交通的物联网和气象大数据处理关键技术研究, 2015-01至2017-12, 项目负责人

  • 国家自然科学基金专项项目, J2324013, 可视化数据服务提升科学基金管理效能机制研究, 2024-01至2025-12, 课题负责人

  学术论文：

  在国内外高水平学术期刊或重要学术会议上发表论文60余篇，近年来发表的代表性期刊/会议论文如下：

  • Nighttime Traffic Object Detection via Adaptively Integrating Event and Frame
  Domains.

  Fundamental Research

  , 2025, 5(4):1633-1644.

  • Hierarchical Set-to-set Representation for 3D Cross-modal Retrieval.

  IEEE Transactions on Neural Networks and Learning Systems

  , 2025, 36(1):1302-1314.

  • A Real-World Animation Super-Resolution Benchmark With Color Degradation and Multi-Scale
  Multi-Frequency Alignment.

  IEEE Transactions on Image Processing

  , 2025, 34:5598-5613.

  • EvCSLR: Event-guided Continuous Sign Language Recognition and Benchmark.

  IEEE Transactions on Multimedia

  , 2025, 27:1349-1361.

  • Event-based Low-illumination Image Enhancement.

  IEEE Transactions on Multimedia

  , 2024, 26:1920-1931.

  • Sample-efficient planning-control framework for autonomous underwater vehicle
  docking using lightweight Cross Q-Learning.

  Engineering Applications of Artificial Intelligence

  , 2025, 161(C):112293.

  • Adaptive Meta-reinforcement Learning for AUVs 3D Guidance and Control Under Unknown
  Ocean Currents.

  Ocean Engineering

  , 2024, 309(2):118498.

  • A Feature-Enhanced and Adaptive Routing Framework for Fish School Detection on
  AUVs for Degraded Underwater Imaging Environments.

  IEEE Internet of Things Journal

  , 2024. 11(10):18335-18350.

  • Efficient Vision Transformer With Token-Selective and Merging Strategies for Autonomous
  Underwater Vehicles.

  IEEE Internet of Things Journal

  , 2024. 11(19):32129-32142.

  • Hyper-BTS: Brain tumor segmentation based on hypergraph guidance.

  Pattern Recognition

  , 2026. 169:111926.

  专利：

  授权发明专利30余项，近年来代表性授权发明专利如下：

  • 一种水下光学图像轻量化目标识别方法、设备和介质, 中国, ZL2023101885209.

  • 一种水下高速移动目标的视觉插帧方法及其系统, 中国, ZL2023100764917.

  • 一种多水下自主航行器目标搜索方法及其系统, 中国, ZL202310064245X.

  • 一种基于融合事件和RGB数据的水下暗光场景重建方法, 中国, ZL2023100247817.

  • 一种基于三维人体蒙皮的潜水员动作识别方法, 中国, ZL2023100158512.

  • 一种基于数据协同的水下高速视频插帧方法及其系统, 中国, ZL2023100764936.

  • 一种水下三维跨模态联合检索方法、存储介质和电子设备, 中国, ZL2023100248665.

  • 一种水下深度图超分辨率方法, 中国, ZL2023100277668.

  • 一种水下自主航行器状态检测方法与系统, 中国, ZL2023100508304.

  • 海洋空间观测数据的异常检测方法、系统、设备与介质, 中国, ZL2023100231236.

  • 一种基于深度时空残差网络的海洋温跃层预测方法, 中国, ZL2020100002360.

  获奖情况：

  • 2022年，面向复杂海洋环境的水下机器人智能感知方法，吉林省自然科学奖二等奖，第一完成人.

  • 2025年，车辆交通系统动态场景VR/AR/数字孪生关键技术及应用，江西省科学技术进步奖二等奖，第四完成人.

  社会兼职：

  现任中国仿真学会机器人系统仿真专委会委员，中国指挥与控制学会高级会员。Complex Engineering Systems期刊副主编，浙大学报（英文版）、Science
  Progress等期刊客座编辑。'
