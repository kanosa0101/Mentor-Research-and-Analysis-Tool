bio_raw: '孙庚

  ，博士，教授

  /

  博士生导师

  教研室：移动通信与网络系统

  办公地址：王湘浩楼

  B224

  邮箱

  : sungeng@jlu.edu.cn

  （推荐方式）

  微信

  : sungeng207

  招生/招聘信息：

  (1)

  每年招收博士研究生

  1

  名（本科直博、硕博连读、申请考核均可）

  (2)

  每年招收硕士研究生

  6

  名（计算机学院和软件学院的学硕、专硕均可）

  (3)

  常年招收博士后（吉林大学

  “

  鼎新学者

  ”

  博士后或项目资助博士后均可）

  备注：

  ■

  请先仔细了解研究方向，如果感兴趣，请发邮件并附简历（建议保研同学拟录取到吉林大学后再联系）

  ■

  如遇合适同学即招，不海不拖，先到先得

  ■

  结合学生兴趣和志向制定个性化培养方案，因材施教

  ■

  完成符合毕业要求的工作后，鼓励实习

  ■

  团队氛围轻松，欢迎向组内在读同学咨询，期待领军学生加入

  主讲课程

  ■

  计算机网络（软件学院本科生）

  ■

  数据通信（研究生）

  个人简介

  孙庚，博士，

  教授

  ，

  博士生导师

  ，吉林大学教师教学发展中心主任助理

  ；

  2016

  年至

  2017

  年受国家留学基金委资助赴美国佐治亚理工学院公派留学，

  2018

  年

  6

  月获吉林大学博士学位，同年入选国家

  “

  博士后创新人才支持计划

  ”

  ；

  2020

  年聘任副教授

  /

  博士生导师，

  2024

  年破格聘任教授

  。

  获得吉林省优秀青年基金，入选吉林省青年科技人才托举工程、吉林省省域拔尖人才、吉林省高校优秀青年科研创新人才、小米青年学者和亚太人工智能学会优秀青年学者

  ，担任吉林大学学科交叉青年创新团队主

  PI

  ；

  入选

  2023

  、

  2024

  和

  2025

  年度全球前

  2%

  顶尖科学家

  。

  发表高水平学术论文

  80

  余篇，其中中国计算机学会推荐

  A

  类

  期刊和会议论文

  40

  余篇，

  获得多个学术会议的最佳论文奖；主持国家自然科学基金面上项目

  和青年科学基金项目、博士后创新人才支持计划等多个国家级和省部级科研项目，作为项目骨干参与国家重点研发计划项目课题

  ；获得授权发明专利

  27

  项；研究成果获得吉林省自然科学奖二等奖

  、中国商业联合会科学技术奖一等奖

  和二等奖

  。

  研究方向

  ■

  无人机通信与低空无线网络

  ■

  卫星通信与空天地一体化网络

  ■

  低空移动边缘计算

  ■

  深度强化学习、演化学习

  ■

  生成式人工智能与通信大模型

  学生培养

  ■

  指导的博士/硕士研究生获得吉林省优秀博士学位论文、吉林大学优秀博士学位论文、吉林大学“十佳研究生”（研究生最高荣誉）、吉林大学（力旺）精英研究生、研究生国家奖学金（

  6

  人次）、宝钢优秀学生奖、王湘浩奖学金（

  2

  人）、博士研究生“求实”奖学金、研究生优秀奖学金（

  14

  人次）、吉林大学优秀研究生（

  20

  人次）、学术业绩奖学金（

  7

  人次）、优秀毕业研究生（

  7

  人次）和研究生社会奖学金（

  16

  人次）等多项奖励和荣誉称号。

  ■

  指导的本科生在全国大学生嵌入式芯片与系统设计竞赛、全国大学生计算机系统能力大赛

  CPU

  设计赛（龙芯杯）和“挑战杯”全国大学生课外学术科技作品竞赛等竞赛中获得多项奖励。

  ■

  组内学生毕业去向包括继续攻读博士学位、互联网企业（淘宝、腾讯、滴滴、小红书等）、国有企业（中国移动、鞍钢研究院等）、公务员和事业单位（北京市公安局等）等。'
