  工作经历：

  黄岚，女，吉林大学计算机科学与技术学院教授，博士生导师。吉林省高校教学名师，获宝钢优秀教师奖，吉林省有突出贡献中青年专家，吉林省青年科技奖获得者，吉林省人才十八条入选者，吉林省高层次（C类）人才，吉林大学唐敖庆学者英才教授。教育部仿真技术重点实验室主任，吉林省大数据智能计算重点实验室主任，吉林省大数据智能认知国际合作重点实验室主任，吉林省中青年领军人物与创新团队负责人，吉林省高校创新团队负责人，长春市突出贡献中青年专家，长春市优秀共产党员。中国工程教育认证专家，中国计算机学会（CCF）理事、杰出会员、计算机应用专业委员会主任、教育专业委员会常委，中国高校计算机实践教育联合会（CPEC）理事（东北区负责人），全国高校大数据教育联盟理事，吉林省高等学校计算机类专业教学指导委员会副主任，吉林省计算机学会理事；意大利Trento大学高级访问学者。吉林大学软件工程（吉林省高水平）学科带头人。

  研究方向为大数据智能计算技术与应用，在相关领域取得了一系列科研成果，为推动相关行业的技术进步作出贡献。近年来，主持、参与并完成国家863项目、国家自然科学基金项目、国家创新基金项目、吉林省重点科技项目等多个国家、省部级的教学和科研项目，获得吉林省科技进步一等奖2项、二等奖1项，中国商业科技进步一等奖5项，中国电子学会科技进步二等奖1项，国家教学成果二等奖1项，吉林省教学成果二等奖2项；在智能优化算法、商务智能应用、社会网络挖掘、生物信息学等领域，发表学术论文一百余篇，其中SCI/EI/ISTP收录论文百余篇；取得软件著作权23项，主编出版教材4部，研发的一批软件成果，为合作企业和应用企业创造了良好的经济效益。培养博士生13人，硕士生107人。

