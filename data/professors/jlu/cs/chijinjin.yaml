  招生简介

  我们诚邀对科研充满热情、志在深造的优秀本科生、研究生加入课题组！

  ✅ 招生要求：

  对科学研究抱有持续兴趣；

  拥有清晰的逻辑思维能力与健康的身体素质；

  具备扎实的数学基础与良好的英文读写能力；

  为人乐观、沟通顺畅，具有责任心与团队协作精神。

  🧪 课题组特色：

  因材施教，提供

  全面而细致的学术指导

  ；

  鼓励探索，倡导

  高效友好、合作共赢的科研氛围

  ；

  与

  南洋理工大学

  等国内外知名高校保持长期科研合作，提供海外交流机会。

