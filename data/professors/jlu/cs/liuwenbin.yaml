bio_raw: 'Ø

  简介

  刘文彬，博士，唐敖庆青年学者，吉林大学副教授、博士生导师。

  本硕博阶段分别毕业于吉林大学

  物理学院、软件学院和计算机学院

  ，博士期间赴

  法国巴黎理工

  开展联合培养。兼职中国电信云计算研究院研究员，先后入选吉林大学

  培英工程

  、优青培育计划、

  吉林省域拔尖人才

  等人才项目；获吉林省优秀博士学位论文、计算机网络领域顶会

  IEEE INFOCOM 2020 Student Conference Award（首届，全国仅5人）、分布式计算领域顶会IEEE ICDCS 2018 Travel
  Grant Award（全球仅15人）、中国物联网大会优秀论文奖等

  奖励

  。

  Ø

  方向

  1.

  时空数据智能

  ：聚焦

  随

  时

  间和

  空

  间

  动态变化

  的

  数据规律挖掘与应用

  ；同时尝试

  开展跨学科交叉研究，与物理学院深度合作推进AI for Science（AI4S）相关探索。

  2.

  群体具身智能

  ：核心研究多智能体间的合作与博弈关系，探索大规模任务的组织协调机制；同时与电子

  、仿生等学科

  协同攻关，拓展群体具身感知方向的研究边界。

  Ø

  成果

  累计发表高水平期刊/国际会议论文50余篇，其中

  CCF A类20余篇

  。在

  网络领域持续产出

  顶会顶刊成果，包括IEEE INFOCOM（6篇）、IEEE TMC（8篇）、IEEE TNET（4篇）等；在

  人工智能、信息安全及跨学科领域

  的研究成果亦逐步涌现。

  Ø

  项目

  ü

  以科研探索类纵向项目为核心，主持

  国家自然科学基金面上项目

  、青年项目，

  吉林省重点研发计划

  ，中国博士后特别资助等项目；作为课题执行负责人或主要参与人，承担

  科技部重点研发计划、2030新一代人工智能重大项目

  等国家级重大重点项目。

  ü

  少量

  产业

  应用

  探索，与

  中国一汽

  “

  智慧工厂

  ”

  、中国电网

  “

  智能电网

  ”、中国石油“大小模型协同”

  等方向

  开展技术

  应用

  与合作

  。

  Ø

  培养

  个性化方向

  ：尊重学生兴趣，协助制定个性化研究方向，遵循“基础积累-参与

  项目

  -主导

  课题

  ”的阶梯式培养路径，具备充足的科研积累和支撑。

  多元化指导

  ：每周按两个研究方向分设组会（学生按需选择）；每周预留1天一对一讨论时间（按需安排，每月至少1次）；每年支持学生参加国内外学术会议，拓宽学术视野。

  丰富团建

  ：每周组织体育活动，每月开展各类团建活动

  （争取！）

  。

  实习支持

  ：完成符合毕业要求的完整科研工作后，鼓励

  /推荐

  实习

  ；

  同阿里、百度、腾讯、中国电信、一汽、北大、清华、计算所合作（有硕/博实习和联培）。

  培养

  理念

  ：

  本人

  性格温和，

  秉持平等沟通，善于换位思考

  ；

  期望学生有收获有进步有目标；希望学生

  积极主动

  ，

  鼓励

  探索

  ，全力支持发展

  。

  Ø

  去向

  ú

  近三年

  ，协助指导

  博士毕业生（5人）：1人入职深圳大学（孔雀计划），2人入选吉林大学“鼎新学者”，1人入职湖南社科院，1人公务员选调。

  ú

  （协助）指导

  硕士毕业生：＞1/3入职字节跳动、阿里巴巴、百度、腾讯、华为、比亚迪等头部企业；约1/3赴东京大学、吉林大学、北京理工大学等国内外院校升学深造；少量进入银行系统或考取公务员。

  ú

  指导

  本科毕业生：以深造为主，均赴不列颠哥伦比亚大学（University of British Columbia）、南京大学、浙江大学等国内外顶尖院校继续攻读学位。

  Ø

  招生

  招收计算机相关专业博士、硕士研究生，欢迎对时空数据智能、群体具身智能、大数据、人工智能、组合优化、隐私与安全、博弈论等领域感兴趣的同学报考。

  要求

  具备较好的数学和英语基础，熟练掌握Python/Java/Matlab等至少一种编程技术；鼓励跨学科背景学生报考（需具备较强数理基础和一定编程能力）。

  联系方式

  微信：

  13214498200

  （同电话）

  邮箱：

  liuwenbin@jlu.edu.cn；366649143@qq.com'
