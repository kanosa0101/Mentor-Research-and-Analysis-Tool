bio_raw: '个人简介：

  王恩，

  教育部重大人才工程青年学者

  ，吉林大学计算机学院

  教授

  ，

  博士生导师

  ，

  软件学院副院长

  。

  主要从事群智计算、数据挖掘、具身智能等领域的研究。近 5 年以第一责任作者发表CCF A 类论文 30 余篇，ESI高被引论文6篇，H-index:32，由 Springer
  出版学术专著2部。入选强国青年科学家提名奖，全国青马工程科技专班，吉林省拔尖创新人才，吉林省突出贡献专家等。主持国家自然科学基金重大研究计划重点项目1项，面上项目2项，青年项目1项，吉林省杰青1项。参与承担人工智能2030重大项目、国家重点研发计划和吉林省重大科技专项的课题各1项，以第一完成人获中国商业联合会科技创新一等奖。

  招生简介：

  招收计算机相关专业的

  博士和硕士

  研究生：欢迎对下面相关领域(群体智能计算,具身智能,人工智能与大数据等)研究感兴趣, 具有较好数学和英语基础，尤其是有随机过程、博弈论、算法设计与分析、图论、深度学习、强化学习等知识储备,
  并较为熟练掌握工程开发技术的同学报考我的博士或硕士研究生。如果你不确定你的背景是否适合或者有其他的问题,可以随时通过邮件联系我（

  wangen@jlu.edu.cn

  ，

  wangen0310@126.com

  ）。

