  详细情况

  学科专业

  计算机应用技术

  研究方向

  机器学习、生物信息学、知识工程

  讲授课程

  计算智能

  计算方法

  Python程序设计

  主要工作

  面向生物学、医学等领域的复杂数据，提出一系列复杂关系抽取与识别方法，构建了包含60万个实体，840余万条边的生物医药知识图谱，开发的生物医学知识推荐系统已为60余个国家和地区服务3000余次。

  科研成果

  在Nature Methods, Nature Communications (2020, 2023), IEEE TKDE, Bioinformatics,
  KDD, Cell Stem Cell (2025, 2026)等中科院一区期刊、CCF A类期刊/会议发表论文70篇(近5年一作和通讯作者30篇)，ESI 高被引论文4篇。1篇获Nat.
  Commun.亮点论文，Altmetric 709, 位列56万篇同期论文前1.8‰；5篇CNS子刊论文分别获Nature Asia、央视《新闻联播》、学习强国、新华社等权威媒体报道；相关成果被欧洲科学院院士剑桥大学计算机科学与技术系Pietro
  Liò教授，美国伊利诺依大学香槟分校Philip S Yu教授等20余位IEEE Fellow和国际知名学者引用4200 次（Google Scholar），WOS
  引用2231，单篇他引>530次。授权国家发明专利4项。

  项目获奖

  作为课题负责人承担国家重点研发计划BT&IT专项，作为负责人承担国家自然科学基金项目3项。获得了中国教育部自然科学二等奖，吉林省科技进步二等奖和中国商业联合会科学技术一等奖各1项。'
