  围绕跨模态智能可视计算技术中多项关键科学问题展开研究工作，突出理论创新、技术突破、示范应用的研究路径，在跨模态三维图形建模与系统集成、视频影像智能分析与辅助决策、重大场景理解与数据安全等方面取得系列研究成果。

  科研项目：

  主要从事跨模态三维图形建模与系统集成、视频影像智能分析与辅助诊断、重大场景理解与数据安全等方向的研究工作。目前，以负责人主持国家自然科学基金项目一项。近年来

  ,

  以负责人完成国家级、省部级项目三项。

  【

  1

  】国家自然基金项目

  :

  “医学图像序列网络可视化关键问题研究”。

  【

  2

  】国土资源部“深部探测技术与实验研究专项”第九项，即“深部探测关键仪器装备研制与实验”

  --

  移动平台地球物理数据处理与集成

  ,

  子项负责人。

  【

  3

  】吉林省科技发展计划项目

  -

  重点研发，融合多源医疗信息构建个性化智慧“画像”。

  深部探测专项、国家自然基金项目等是多学科联合、多团队合作项目。深部探测专项研究团队由教师、研究生、技术人员等组成，研究工作为计算机、地学、数学、工程技术等多学科联合、多团队合作、面向重点应用领域方面拓新了思路，积累了大型项目研发与管理经验。

