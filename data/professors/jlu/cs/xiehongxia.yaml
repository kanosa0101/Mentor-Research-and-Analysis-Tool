  🔥

  招生名额：

  2026

  年

  入学

  的

  硕士研究生

  3

  名，

  博士研究生

  1

  名（少数民族骨干计划，省属高校教师培养计划，对口支援部省合建计划不受名额限制）。硕士生在达到毕业要求后支持实习与外校访问，博士生支持申请国外联培项目，欢迎对于计算机视觉研究有兴趣并愿意投入精力学习的同学联系。

  🔥

  吉大本科生：支持优秀学生申请本科生科研训练计划，每月发放补助，全力支持学生升学。

  🔥

  远程实习：招收校外远程实习生担任科研助理，要求有计算机视觉相关研究经验，欢迎跨学科（心理学、医学等）同学加入，每月发放津贴，提供计算资源。（

  2026

  年

  3

  月：招收有机械臂或服务机器人开发经验、医学影像算法两个方向研究助理）

  🔥

  诚邀合作：可作为吉林大学鼎新博士后合作导师，待遇丰厚，欢迎联系。

  🏠

  团队简介：视觉情感计算小组（

  Affective Vision Computing Lab, AVC Lab

  ）成立于

  2024

  年，目前团队成员

  30

  余人，涵盖本科生、硕士生和博士生。团队很年轻，但是有活力，氛围轻松友好，注重互帮互助与经验传承。教育理念是因材施教，为每位同学量身定制研究课题，并定期开展一对一讨论。同时，针对初学者，我们提供完善的培训体系，帮助大家快速入门。小组与多所国内外高校和研究机构保持紧密合作，例如微软亚洲研究院、韩国延世大学、台湾大学、台湾阳明交通大学等，为成员提供更多交流学习的机会。

