bio_raw: '姓名：王莹

  职称：副教授

  院系：计算机科学与技术学院

  办公地点：

  吉林大学前卫南区计算机楼

  B132

  联系方式：

  (+86)13756184893

  wangying_jlu@163.com

  wangying_jlu@jlu.edu.cn

  个人简介：

  王莹，女，工学博士，

  2012

  年于吉林大学计算机科学与技术学院获工学博士学位并留校任教至今，汽车仿真与控制国家重点实验室博士后，现为吉林大学计算机科学与技术学院计算机副教授。近年来一直围绕汽车智能化和模拟仿真测试方向开展相关研究。发表相关学术论文

  40

  余篇，主持及参与包括国家自然科学基金联合基金、国家自然科学基金面上项目、国家自然科学基金青年基金、吉林省科技计划重点科技攻关项目等在内的国家级、省部级科研项目及企业合作课题

  1

  6

  项

  ，授权发明专利

  3

  项，参编教材

  2

  本。获商业联合会科技进步一等奖、二等奖各一项。同时，积极探索研究成果的产业化应用落地，其带领团队与合作单位共同研发的自动驾驶环境感知系统已成功

  实现

  量产，作为主要参加人研发的汽车自动驾驶仿真测试、验证与评价的一体化平台，是

  包括

  世界智能驾驶仿真挑战赛、

  i-VISTA

  世界虚拟仿真挑战赛

  等在内的

  指定仿真平台

  ，目前

  已在国内外企业和科研院所广泛应用。

