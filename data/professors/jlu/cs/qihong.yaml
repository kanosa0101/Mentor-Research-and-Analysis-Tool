  详细情况

  所在学科专业：

  计算机应用技术

  研究方向：

  深度学习、机器视觉、自动设计、智能感知与决策

  讲授课程：

  《计算机硬件系统设计原理》（“基础学科拔尖学生培养试验计划”开设）课程负责人

  《微机系统与接口实验》课程负责人

  教育经历：

  1988.09-1992.06 吉林大学 计算机及应用专业 本科

  1992.09-1995.06 吉林大学 计算机组织与系统结构专业 硕士

  1999.09-2005.06 吉林大学 计算机应用技术专业 博士

  工作经历：

  2022.10-至今 吉林大学计算机科学与技术学院 教授

  2013.04-2014.03 英国埃塞克斯大学 访问学者

  2005.01-2022.09吉林大学计算机科学与技术学院 副教授

  1997.11-2004.12 吉林大学计算机科学与技术学院 讲师

  1995.07-1997.10 吉林大学计算机科学系 助教

  科研项目：

  先后主持或参与国家自然科学基金等各类科研项目20余项。

  近年来主持或参与的科研项目如下：

  • 2021.1-2024.12：智能汽车整车可迭代性主动推理自动设计理论，国家自然科学基金（区域创新发展联合基金），U20A20285，78万元，课题负责人

  • 2021.10-2023.12：面向智能制造工业互联网的故障诊断及健康评估技术研究，横向课题，150万元，项目负责人

  • 2020.12-2021.12：楼宇安保监控软件步态识别算法研发，横向项目，8万元，项目负责人

  • 2018.01-2020.12：基于深度学习的视频大数据内容识别与检索云服务平台，吉林省科技发展计划重点科技研发项目20180201044GX，100万元，主要参加人

  • 2014.01-2017.12：大规模复杂网络的多元结构发现方法及应用研究，国家自然科学基金面上项目，61373053，76万，主要参加人

