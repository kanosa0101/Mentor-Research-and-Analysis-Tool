  基本信息

  丰小月，教授。2008年于吉林大学计算机学院获博士学位，曾赴意大利特伦托大学、美国密苏里大学访问交流。

  主要研究领域

  ：

  聚焦于机器学习算法在生物信息学中的应用，并结合知识图谱与推荐系统技术开展交叉研究

  。

  【

  博士研究生招生信息

  】

  计算机科学与技术学院：计算机应用技术（学术型）

  【

  硕士研究生招生信息

  】

  ·计算机科学与技术学院：计算机应用技术（学术型和专业型）

  ·软件学院：软件工程（学术型和专业型）

  科研成果

  近年来，承担国家自然科学基金面上项目1项，国家重点研发计划BT&IT专项、科技创新2030-“新一代人工智能”重大项目子课题各１项，主持完成国家自然科学基金青年项目1项，腾讯校企合作项目１项。在IEEE
  TKDE，JMIR，BIB，AAAI，IJCAI，WWW，SIGIR，EMNLP，CIKM等CCF A/B类期刊和会议发表论文50余篇。

