bio_raw: '白天 教授、博士生导师

  邮箱：baitian@jlu.edu.cn

  电话：13578794952

  办公地址：王湘浩楼B528

  教研室：计算智能

  基本信息

  白天，教授、博士生导师。现任吉林大学计算机学院计算智能教研室主任，吉林大学计算机学院学术委员会委员。

  吉林省电子商务关键支撑技术工程实验室主任。

  吉林大学

  -

  佐治亚大学系统生物学联合研究中心副主任。

  中国计算机学会（CCF）计算机应用专委会常务委员、副秘书长，

  吉林省青联常务委员、科学技术界别主任，

  吉林省健康管理学会智慧医疗与信息化专委会副主任，

  CCF青年科技论坛（YOCSEF）长春分论坛主席，CCF生物信息专委会执委、CCF计算机教育专委会执委、CCF数字医学分会执委。吉林大学学报（理学版）编委。

  入选吉林省省域拔尖人才（吉林省委组织部）、吉林省中青年科技创新卓越人才团队负责人（吉林省科技厅）、吉林省高校优秀青年科研创新人才（吉林省教育厅）、吉林省企业“科创专员”（吉林省科技厅）、吉林大学“励新优秀青年教师培养计划”

  。

  目前研究方向：多模态大模型、自然语言理解、图像分析计算、智慧医疗。

  【工作和学习经历】

  2021年至今 吉林大学 计算机学院 教授

  2020年至今 吉林大学 计算机学院 计算智能教研室 主任

  2019年至今 吉林大学 计算机学院 博士生导师

  2016年-2021年 吉林大学 计算机学院 副教授

  2012年-2016年 吉林大学 计算机学院 讲师

  2009年-2012年 美国罗格斯大学-吉林大学计算机学院 联培博士

  2006年-2009年 吉林大学 计算机科学与技术学院 硕士

  2002年-2006年 吉林大学 软件学院 本科

  【招生信息】

  白天教授所在认知计算科研团队现有教授2人，副教授3人，在站博士后2人，博士生5人，硕士生24人。研究组常年招收计算机学院和软件学院各专业的博士（学博及专博）、硕士（学硕及专硕）。研究生在学校奖助学金基础上可获额外科研奖励和津贴。组内博士生派往国外交流联培、硕士生全额资助参加国内学术会议和讲习班。白天教授与博士联培导师、美国科学院院士Kulikowski教授等国内外知名学者保持深入合作。历届博士毕业生均进入高校科研院所任教、硕士毕业生均进入国内知名企业工作或出国深造。欢迎新同学加入我们！（咨询和简历投递邮箱：

  baitian@jlu.edu.cn

  ）

  科研成果

  【近五年主持项目】

  1.国家自然科学基金面上项目，面向肿瘤早期诊断的多模态数据语义关联挖掘研究，2026-2029

  2.国家自然科学基金联合基金子课题，多模态骨关节影像智能计算方法研究， 2022-2025

  3.国家自然科学基金青年基金项目，混合型生物医学知识网络构建及隐性知识发现方法研究，2018-2020

  4.吉林省中青年科技创新卓越人才（团队）项目，多模态认知计算技术研究及生物医药应用，2024-2025

  5.吉林省自然科学基金重点项目，文献型病例相似度计算与检索方法研究， 2021-2023

  6.吉林省国际合作重点项目，基于深度学习的图文信息抽取技术及医疗应用研究，2020-2022

  7.企业技术开发A类项目，智慧城市系列平台研发，2021-2026

  【近期获奖和学术荣誉】

