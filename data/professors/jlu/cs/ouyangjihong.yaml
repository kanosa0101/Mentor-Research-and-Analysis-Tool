  博士

  详细情况

  所在学科专业：

  计算机软件与理论

  所研究方向：

  人工智能

  讲授课程：

  计算机算法设计与分析（）

  数据结构（）

  人工智能原理（）

  智能信息处理技术（）

  教育经历：

  1981 ---- 1985 吉林大学计算机科学系，本科

  1985 ---- 1988 吉林大学计算机科学系，硕士，刘叙华教授

  1998 ---- 2005 吉林大学计算机科学系，博士，刘大有教授

  工作经历：

  1988 ---- 1990 吉林大学计算机科学系，助教

  1990 ---- 1998 吉林大学计算机科学系，讲师

  1998 ---- 2004 吉林大学计算机科学系，副教授

  2004 ---- 今   吉林大学计算机科学与技术学院，教授

  2005 ---- 今   吉林大学计算机科学与技术学院，博士导师

  科研项目：

  负责或骨干参加国家级与省部级项目近30项，其中作为项目负责人承担国家863项目、国家自然科学基金项目、教育部重点项目、省科技厅项目、省农业厅项目各1项，省环保厅项目2项；作为骨干参加国家级重大项目3项，重点项目1项，国家自然科学基金项目8项。作为第二执行人，参加欧盟合作项目1项。

  学术论文：

  在国内外刊物和重要国际学术会议上共发表论文100余篇。

  获奖情况：

  获省科技进步一等奖2项、二等奖1项。国家级教学成果二等奖1项，省教学成果一等奖1项，国家精品课程1项。所在科研团队于2007年荣获了省教育系统先进集体，所在教学团队于2007年荣获了省高等学校优秀教学团队，并于2008年荣获了国家级教学团队的光荣称号。

  社会兼职：

  中国计算机学会人工智能与模式识别专委会委员，吉林大学学报信息科学版编委。

  长春市政协委员、吉林省审计厅特邀审计员。

  吉林省民盟常委，长春市民盟副主委、吉林大学民盟主委'
