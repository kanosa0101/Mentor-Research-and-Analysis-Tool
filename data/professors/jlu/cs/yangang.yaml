bio_raw: '个人简介：

  燕刚，吉林大学计算机科学与技术学院教授、博士生导师，入选

  2024

  年国家级高层次青年人才计划。

  2023

  年博士毕业于美国纽约州立大学宾汉姆顿分校，主要从事高性能网络与边缘计算、分布式系统与安全、大模型优化与隐私保护等方向的研究。近五年来，以第一作者在

  NeurIPS

  、

  USENIX ATC

  、

  ACM CoNEXT

  、

  ACM MM

  、

  ACM KDD

  、

  AAAI

  、

  RAID

  等国际顶级学术会议上发表论文十余篇。

  2024

  年荣获纽约州立大学

  “

  电子与计算机工程研究卓越奖

  ”

  。

  招生讯息：

  课题组拟招收

  2026

  年和

  2027

  年入学的博士研究生和硕士研究生，学术型博士每年

  3

  名、硕士每年

  3-5

  名（合计博士

  6

  名、硕士

  6-10

  名）。欢迎对以下研究方向感兴趣的同学报考或申请加入课题组：

  （

  1

  ）高性能网络与边缘计算

  （

  2

  ）网络与系统安全（对抗攻击防御、可信计算）

  （

  3

  ）机器学习（联邦学习、推荐系统等）

  申请的同学应满足下列条件：

  （

  1

  ）具备良好的英语基础；

  （

  2

  ）具有一定的科研能力，并具备扎实的相关基础知识；

  （3

  ）

  对科研充满热情，具备独立思考能力和良好的团队合作精神。

  本课题组注重因材施教，提供系统的学术指导，致力于营造高效、开放、公平的科研环境，并配备完善的实验与计算资源。若对研究方向或申请条件有疑问，欢迎联系：

  gyan8@jlu.edu.cn

  /

  gangyan58@gmail.com

  工作经历：

  2025.01—

  至今：

  吉林大学计算机学院，教授，博士生导师

  2024.01—2024.12

  ：加州大学默赛德分校，博士后研究员

  2023.06—2023.08

  ：

  AT&T Shannon

  实验室，技术研究员

  教育经历：

  2020.01—2023.12

  ：纽约州立大学，电子与计算机工程，博士

  2016.09—2019.09

  ：南开大学，统计学，硕士

  2012.09—2016.06

  ：南开大学，统计学，学士

  代表性论文：

  [1] Gang Yan, Sikai Yang, Wan Du. “FedRACE: A Hierarchical and Statistical Framework
  for Robust Federated Learning”. In Proc. of NeurIPS, 2025.

  [2] Gang Yan, Jian Li, Wan Du. “FedSTEP: Asynchronous and Staleness-Aware Personalization
  for Efficient Federated Learning”. In Proc. of ACM CIKM, 2025.

  [3] Gang Yan, Wan Du. “FedDiAL: Adaptive Federated Learning with Hierarchical Discriminative
  Network for Large Pre-trained Models”. In Proc. of ACM KDD, 2025.

  [4] Gang Yan, Hao Wang, Xu Yuan and Jian Li. “Enhancing Model Poisoning Attacks
  to Byzantine-Robust Federated Learning via Critical Learning Periods”. In Proc.
  of RAID, 2024.

  [5] Gang Yan, Hao Wang, Xu Yuan and Jian Li. “FedRoLA: Robust Federated Learning
  Against Model Poisoning via Layer-based Aggregation”. In Proc. of ACM KDD, 2024.

  [6] Gang Yan, Hao Wang, Xu Yuan and Jian Li. “CriticalFL: A Critical Learning Periods
  Augmented Client Selection Framework for Efficient Federated Learning”. In Proc.
  of ACM KDD, 2023.

  [7] Gang Yan, Hao Wang, Xu Yuan and Jian Li. “DeFL: Defending Against Model Poisoning
