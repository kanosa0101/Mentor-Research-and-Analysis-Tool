  [8] Gang Yan and Jian Li. “Towards Latency Awareness for Content Delivery Network
  Caching”. In Proc. of USENIX ATC, 2022.

  [9] Gang Yan, Hao Wang and Jian Li. “Seizing Critical Learning Periods in Federated
  Learning”. In Proc. of AAAI, 2022.

  [10] Gang Yan, Jian Li and Don Towsley. “Learning from Optimal Caching for Content
  Delivery”. In Proc. of ACM CoNEXT, 2021.

  [11] Gang Yan and Jian Li. “RL-Bélády: A Unified Learning Framework for Content
  Caching”. In Proc. of ACM MM, 2020.

  [12] Guojun Xiong*, Gang Yan*(

  共一

  ), Shiqiang Wang and Jian Li. “Straggler-Resilient Decentralized Learning via Adaptive
  Asynchronous Updates”. In Proc. of ACM MobiHoc, 2024.

  [13] Wudi Chen, Zhiyuan Zha, Shigang Wang, Bihan Wen, Xin Yuan, Jiantao Zhou, Zipei
  Fan, Gang Yan, Ce Zhu. “KaRF: Weakly-Supervised Kolmogorov-Arnold Networks-based
  Radiance Fields for Local Color Editing”. In Proc. of NeurIPS, 2025.

