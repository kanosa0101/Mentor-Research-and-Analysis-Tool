  2011.02–2012.02：美国弗吉尼亚理工大学，访问学者

  研究方向

  底层视觉增强：低光提亮、恶劣天气、去噪、修复、融合

  医学影像智能分析：分割、计算机辅助诊断

  度量学习与表征学习：对比学习、无监督/半监督学习、域泛化

  红外小目标检测与跟踪：遥感与安防应用

  科研方向（部分）

  吉林省科技厅：面向血管类疾病诊疗应用的智能化超声影像分析关键技术研究，

  主持

  国家自然科学基金：高鲁棒性的快速局部特征描述算法研究，

  主持

