  招生信息

  欢迎对计算机视觉与深度学习感兴趣的同学报考本人的硕士、博士及博士后研究岗位。实验室长期从事图像与智能信息处理方向的研究，主要研究内容包括：

  底层图像增强（如低光图像增强、去炫光等）；

  红外小目标检测与跟踪；

  医学图像分割与智能诊断；

  推荐系统与用户画像建模；

  时间序列分析与时空数据挖掘。

  同时，欢迎对以上方向感兴趣的本科生加入实验室实习，共同参与科研项目与论文工作。'
