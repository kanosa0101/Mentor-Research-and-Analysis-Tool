  教育与工作经历

  1997.09–2001.06：吉林工业大学，计算机科学与技术，工学学士

  2001.09–2004.06：吉林大学，计算机软件与理论，工学硕士

  2005.09–2009.12：吉林大学，计算机应用技术，工学博士

