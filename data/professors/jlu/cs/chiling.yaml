  详细情况

  所在学科专业：

  计算机系统结构、人工智能。

  所研究方向：

  密码学、人工智能、机器学习、强化学习、自然语言处理、大模型。

  个人简介

  正常版：

  迟令，博士，副教授。中国计算机学会会员。

  长期从事密码学和人工智能领域的研究，在机器学习、自然语言处理方面提出了多项创新研究成果。在中科院一区发表高水平论文

  4

  篇。授权国家发明专利

  2

  项，主持吉林省发改委项目校内子项

  1

  项，横向项目

  1

  项。

  日常版：

  迟令，奔四路上一员。

  依然走在人工智能的路上，会被领域内的新研究、新热点吸引；愿意钻研、愿意实践；喜爱头脑风暴，喜爱集思广益；一起探索，一起进步。

  软的有啥：在自然语言处理领域遨游已久、理解人工智能领域多领域研究方法。

  硬的有啥：

  8G

  工作站、

  24G

  工作站、可申请华为昇腾云服务器、可申请

  H100

  服务器。

  干过有啥：编写过麻将

  AI

  、

  MOBA

  类游戏

  AI

  ；微调过

  GPTNEO

  、

  CHATGLM

  。比较了解大模型时间路上的各种坑坑洼洼，以上都是基于

  Python

  的。

  想要干啥：自己的大模型、自己的神经网络模型。

  招生信息

  每年招收多名学硕及专硕，名额充足，欢迎感兴趣的同学报考。

  长期招收本科实习生，欢迎感兴趣的同学与我联系。

