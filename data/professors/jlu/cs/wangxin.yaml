  基本信息

  王欣，女，博士，吉林大学教授，博士生导师。

  2006.12-2009.12,

  在吉林大学机械科学与工程学院进行博士后研究。

  2011.04-2012.05

  ，在美国加州大学戴维斯分校进行访问学者研究。研究领域包括

  计算机图形学、虚拟现实、医学影像处理、模式识别、科学计算可视化、信息融合

  等。

  所在学科专业：

  计算机应用技术—计算机图形学与数字媒体

  讲授课程：

  《计算机图形学》

  《游戏编程》 课程负责人

  《图像处理技术》 课程负责人

  《多媒体开发技术（双语）》 课程负责人

  《计算机游戏设计》

