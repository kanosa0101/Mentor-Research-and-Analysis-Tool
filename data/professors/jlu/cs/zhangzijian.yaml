  研究方向：人工智能、时间序列分析、推荐系统、大语言模型

  个人简介

  吉林大学计算机科学与技术学院助理教授、副研究员、博士生导师。博士毕业于吉林大学，并获香港城市大学联合培养博士学位。香港中文大学荣誉访问学者（合作导师

  ACM/IEEE Fellow Irwin King

  教授）。近三年已发表

  CCF A/B

  类高水平论文

  30

  余篇，谷歌学术总被引千余次（

  h-index 16

  ）。其中，以第一

  /

  通讯作者身份在

  NeurIPS

  、

  AAAI

  、

  SIGIR

  、

  WWW

  等

  CCF A/B

  类会议发表论文

  14

  篇。长期担任领域顶级会议

  ICLR

  、

  NeurIPS

  、

  WWW

  、

  KDD

  等执委会成员和旗舰期刊

  AIJ

  、

  TKDE

  、

  TOIS

  等的审稿人。担任

  CCF

  智慧交通分会和

  ACM SIGSPATIAL

  中国分会执行委员，

  CAAI

  知识工程与分布智能专业委员会青年委员。

  【研究方向】

  AI for Urban Application

  ：时空数据挖掘、时间序列分析、城市区域特征分析等；

  Recommender Systems

  ：

  LLM

  驱动的推荐系统、生成式推荐、多领域多目标推荐等；

  LLM Agent

  ：智能体记忆、智能体推荐

  /

  搜索、垂域智能体应用。

  【团队建设】

  实验室目前拥有博士、硕士及本科生

  20

  余人，科研氛围浓厚，梯队结构合理。导师手把手指导，每周一对一学术讨论。导师指导经验丰富，组内论文产出稳定且质量高。多名本科生和硕士生在导师指导下发表顶级会议论文，并成功赴国际顶尖学府深造。实验室与阿里，字节，快手，百度等头部科技企业建立长期科研合作关系，可推荐优秀学生前往知名大厂及顶尖实验室实习。

  【招生信息】

  每年招收多名博士、硕士研究生；常年欢迎本科生作为科研助理加入（不限科研经历）。

  招生要求：

  1.

  成绩优异（均分≥

  80

  分）；

  2.

  具备扎实的数理基础与编程能力；

  3.

  英语水平优异（

  CET-6

  ），具备无障碍阅读英文文献及流畅的学术写作能力；

  4.

  勤奋，认真，有发表高水平论文的科研目标；

  5.

  对于科研助理：能保证至少半年的连续科研时间。

