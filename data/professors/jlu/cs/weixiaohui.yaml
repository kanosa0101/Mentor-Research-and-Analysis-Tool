  个人简介：

  魏晓辉，

  国家教育部“重大人才工程”特聘教授、“国家高层次人才特殊支持计划”教学名师、国家百千万人才工程入选者 、国务院政府特殊津贴获得者

  。教育部新世纪人才、英国工程技术学会会士（

  IET Fellow

  ）、教育部计算机类教学指导委员会委员、中国计算机学会常务理事、吉林省计算机学会理事长、吉林大学唐敖庆特聘教授，现担任吉林大学大数据和网络管理中心主任。

  科研上主要从事分布式系统调度、高性能计算与先进计算等领域的研究，研究工作涵盖基础理论、关键技术和软件原型，获吉林省科技进步一等奖

