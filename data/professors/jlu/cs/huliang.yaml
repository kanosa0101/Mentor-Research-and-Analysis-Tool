  科研项目

  1. 国家重点研发计划全球变化及应对专项，地球系统模式公共软件平台研发-第四课题集成耦合系统研制与公共软件平台应用示范（2017YFA0604500），2017-2021。

  2. 吉林省省校共建计划专项，远程诊疗专项（SXGJSF2017-4），2017-2021。

  3. 吉林省重点科技研发项目，面向云存储和大数据环境的加密访问控制系统（201802011 03GX），2018-2020。

  4. 吉林省人才开发资金集中资助人才项目重点项目，跨领域多源异构大数据集成与分析平台，2018-2020。

  5. 科技部国家科技支撑计划，2014BAH02F03，分布式部署的多媒体信息存储云研究与应用设计，2014-2016。

  6. 国家自然科学基金面上项目，61073009，网格环境下基于数据交换区的作业分配与再调度，2011/01-2013/12。

  7. 国家公益性行业科研专项子课题，SinoProbe09-01-03，移动平台综合地球物理数据处理与集成系统，2011/06-2012/12。

  8. 国家“863”计划项目子课题，2011AA010101，CPS 系统体系结构、平台集成实验床，2011/01-2013/12。

  9. 吉林省重大科技攻关计划项目，2011ZDGG007，物联网关键技术及应用，2011/01-2013/12。

  10. 欧盟第七框架计划合作项目，FP7-PEOPLE-2011-IRSES（295222）“MONICA” Mobile Cloud Computing: Networks
  Services and Architecture ，2011/01-2013/12。

  11. 国家自然科学基金面上项目，60873235、多步入侵警报的综合关联系统，2009/01-2011/12。

  12. 国家“973”计划项目子课题，2009CB320706、面向特定应用的典型业务仿真技术与网构试验床，2009/01-2010/12。

  13. 教育部新世纪优秀人才支持计划，NCET-06-0300，网格关键技术研究，2007/01-2010/12。

