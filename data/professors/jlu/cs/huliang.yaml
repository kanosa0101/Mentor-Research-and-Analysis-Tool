  基本信息

  胡亮，教授，博士生导师，入选百千万人才计划，长白山学者、唐敖庆学者卓越教授A岗。现任吉林大学考试中心主任、教育部网络技术与应用软件工程中心主任。1999年于吉林大学计算机学院获博士学位，曾赴澳大利亚Deakin大学访问交流。

  研究方向

  胡亮教授目前主要从事计算机网络，网络与信息安全，分布式计算领域的研究，包括但不限于物联网和人工智能交叉子领域。

  招生信息

  胡亮教授常年招收计算机领域和软件工程领域学术型和专业型博士、硕士研究生，科研团队现有教授、副教授7人，在站博士后2名，在读博士生和硕士生30余名。在读研究生在学校奖学金基础上可获额外科研津贴，欢迎具有浓厚的研究兴趣和热情的同学报考我的博士或硕士研究生。如果你不确定你的背景是否适合或者有其他的问题，请不要犹豫，可以随时联系我（

  hul@jlu.edu.cn

  ）。

