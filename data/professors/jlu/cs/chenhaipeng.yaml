bio_raw: '基本信息

  陈海鹏，男，计算机科学与技术学院教授、博士生导师。

  所在专业：计算机应用技术。

  联系邮箱：chenhp@jlu.edu.cn

  科研团队

  教授2名、副教授1名。

  博士研究生8名、硕士研究生21名。

  实验室硬件设施完善、学习环境良好、学术气氛浓厚，已形成稳定的传帮带学习模式，每周以讨论班和小组会的形式进行学术交流与讨论。

  研究方向

  机器学习与视觉推理，包括：医学图像分析与处理、图像取证、多媒体信息处理、人体运动理解等。

  近十年的科研成果

  1、发表学术论文40余篇，其中CCF-A类论文15篇。

  2、主持科研项目15项，其中国家重点研发计划项目子课题2项、国家自然科学基金项目5项、吉林省科技发展计划项目6项、横向课题2项。

  3、获批国家发明专利9件。

  4、获得吉林省科技进步二等奖1次、中国商业联合会科技进步一等奖1次。

  近十年的教学情况

  1、主讲本科生课程2门（必修课1门，选修课1门）。

  2、获吉林大学“课堂教学质量奖”1次。

  3、发表教学改革论文2篇。

  4、主持教学改革项目4项（省级2项，校级2项）。

  治学格言 : 知行合一，天道酬勤。'
