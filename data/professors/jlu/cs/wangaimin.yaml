  获奖情况：

  自2004年以来，获科学技术奖等5项，获授权发明专利4项。

  1. 主要的科学技术奖及荣誉称号等：

  1) 吉林省建设厅优秀软件设计（一等奖）, 2004年，第1完成人;

  2) 中国通信学会科学技术奖（三等奖), 2008年，第4完成人;

  3) 中国商业联合会科学技术奖（一等奖), 2008年，第4完成人;

  4) 中国商业联合会科学技术奖（二等奖), 2009年，第5完成人;

  5) 指导硕士论文“无线传感器网络中覆盖优化方法的研究”, 作者：高英男，获得吉林大学2017年度优秀硕士论文，吉林省2018年度优秀硕士论文;

  6) 杭州市优秀博士后，2005年.

  2. 授权专利：

  1) 一种基于协作波束成形的车联网安全通信方法，专利号：ZL201910653286.6，孙庚、赵晓晖、郑婷婷、刘雪洁、刘衍珩、梁爽、李树静、王爱民、房至一、周旭;

  2) 一种基于分布式无线传感器网络的智能视频监控系统，授权号：ZL201410109070.0，孙庚、王爱民、张婧、刘衍珩、刘永强、索龙翔、李英涛、周旭;

  3) 一种无线传感器网络波束成型传输阵列节点选择方法，授权号：ZL201410109068.3，刘衍珩、孙庚、张婧、王爱民、刘永强、索龙翔、李英涛、周旭;

  4) 面向服务的无线传感器网络能量管理中间件及工作方法，授权号：ZL201310352878.7，刘衍珩、孙庚、孙大洋、张雷、张婧、王爱民;

