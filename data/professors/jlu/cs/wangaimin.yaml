  博士

  Email：

  wangam@jlu.edu.cn

  详细情况

  所在学科专业：

  软件工程

  所研究方向：

  复杂系统故障诊断；基于深度学习的领域特征模型；无线通信与智能计算；多目标优化

  讲授课程：

  面向对象程序设计（本科）；

  工程伦理（硕士）；

  教育经历：

  1

  988.09-1992.06 吉林工业大学 计算机软件专业 本科；

  1995.09-1998.03 吉林工业大学 计算机应用专业 硕士；

  1998.09-2004.06 吉林大学 通信与信息系统专业 博士；

  2004.10-2004.11 工业和信息化部 高级项目经理培训

  工作经历：

  1992.07-现在  吉林大学计算机科学与技术学院                   教师；

  2004.08-2006.11 浙江大学信电系&东方通信股份有限公司    企业博士后；

  2017.06-2017.12 纽约城市大学计算机学院                         访问学者

  科研项目：

  自2002年以来，作为负责人主持科研项目16个。

  1.一汽集团机械工业第九设计院委托项目：设计行业协同设计系统，2002.3-2004.2，执行负责人；

  2.浙江省港航局委托项目：浙江省水上交通指挥系统，2004.9-2004.12，博士后期间，负责人；

  3.浙江省公安厅委托项目：高速公路超速违法抓拍系统，2004.12-2005.12，博士后期间，负责人；

  4.长春海关委托项目：长春海关内网门户系统，2007.10-2008.2，负责人；

  5.吉林省公安厅委托项目：吉林省公安厅指挥中心指挥调度系统，2008.6-2009.5，负责人；

  6. 华为公司委托项目：基于策略的SLAM系统技术研究，2007.1-2007.12，执行负责人；

  7. 华为公司委托项目：TS(Transport Stream)指标原型系统，2008.7-2009.7，执行负责人；

  8.吉大正元公司委托项目：基于角色的授权与访问控制规范原型系统，2008.10-2009.2，负责人；

  9.启明信息技术股份有限公司委托项目：吉林省政府应急指挥调度系统，2009.4-2009.9，负责人；

  10.吉大正元公司委托项目：信息安全关键标准验证平台研究，2009.4-2009.12，负责人；

  11.吉大正元公司委托项目：多证书支持技术研究与系统研制，2010.12-2011.5，负责人；

  12.启明信息技术股份有限公司委托项目：延吉数字城市指挥调度系统，2011.9-2012.3，负责人；

  13.深圳TCL公司委托项目：基于终端特性的视频搜索和质量检测，2012.9-2013.6，负责人；

  14.国家自然科学基金面上项目：面向服务的无线传感器网络生存期优化体系研究(61073164)，2011.1-2013.12，执行负责人；

  15.国家自然科学基金面上项目：网络攻击行为混杂建模及检测技术研究(60973136)，2010.1-2012.12，主要参加人；

  16.吉林省发改委产业创新专项：基于网络大数据的领域应用性能监控管理平台（2017C028-3），2017.3-2018.12，负责人；

  17.创新原型产品开发：支持全数据库对象的可切换的同步ETL平台，2017.12-2020.6，负责人；

  18.企业联合研发项目：基于深度学习的无人机巡线平台，2021.8-2022.12,90万元，负责人。

