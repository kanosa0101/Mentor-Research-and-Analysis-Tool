  治学格言：

  主要研究方向为人工智能领域的多模态大模型、深度学习、机器视觉、大数据分析、推荐系统、智能优化等。同阿里、华为、一汽、光机所、XXX所、长光卫星、中科方德等企业和研究所开展产学研合作，研究多模态大模型等人工智能技术在多领域应用。与澳洲麦考瑞大学、昆士兰大学、新加坡南洋理工大学、美国波士顿大学、华盛顿大学等国际知名大学有科研合作。

  团队现有在读博士5人、硕士30余人，团队分工明确建制完整。王老师指导博士硕士研究生20余年，有着丰富经验。培训和管理机制健全完善，无论基础怎样，只要肯努力就可以。导师直接安排硕士生论文小方向和选题，严格把关，保证论文质量。2023-2026年硕士平均发表1-2篇中科院1区以上SCI论文。

  王老师有着20多年指导学生经验，有一套科学、合理、完善的管理流程，组内硕士生能兼顾科研项目和个人就业。组内硕士在合理规划下，能兼顾发表高水平论文和大厂实习或者准备考公。

  近年毕业生工作去向包括：百度（22-26年各1人）、阿里（23年2人24-26年各1人）、腾讯（23年1人）、字节（22年1人，24年2人，25年1人）、华为（26年2人25年4人）、美团（23-24年3人）、滴滴（23-26年各1人）、去哪儿（22-23年共2人）等互联网大厂，公安部（23年1人）、广东海关（25年1人）、吉林省统计局（24年1人）、黑龙江省检察院（22年1人）、四川省政府（24年1人）等国家机关，国开行总行（15年1人）、中国银行总行（19年2人）、工商银行各地省行（共3人）、比亚迪（共2人）、一汽大众（共2人）、一汽奥迪（共2人）、一汽红旗（共4人）、中日联谊医院（22年1人，吉大事业编）、长光卫星（20年1人）、国家电网（24年2人）、各种XXX所（22-26年9人）、苏州医工所（共1人）、吉大地探学院（鼎新学者）、吉林农业大学（现任副院长）、吉林化工学院（现任副院长）、湘南学院（现任校长助理）。大厂和其他单位的师兄师姐每年都会提供大量内推实习机会。'
