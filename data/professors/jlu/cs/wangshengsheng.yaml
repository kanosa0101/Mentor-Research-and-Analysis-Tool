  详细情况

  所在学科专业：

  计算机软件与理论

  所研究方向：

  主要研究方向为多模态大模型、机器视觉、具身智能、遥感影像分析、智能推荐系统、智能优化、图像加密等。

  国际合作:

  团队与澳洲麦考瑞大学、昆士兰大学、新加坡南洋理工大学、美国波士顿大学、华盛顿大学等名校有密切联系与合作。

