  组内现有博士生6名，硕士生28名。实验室注重因材施教，提供全面、细致的学术指导，并致力于营造高效、友好的科研环境。

  常年招收吉林大学计算机学院、软件学院的各类博士研究生、硕士研究生和本科直博生。

  常年接收本科生进实验室参与科研项目，指导本科生各类竞赛。

