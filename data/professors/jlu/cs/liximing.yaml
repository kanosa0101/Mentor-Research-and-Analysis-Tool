bio_raw: '基本信息

  姓名：李熙铭

  职称：教授（吉林大学唐敖庆青年学者）

  院系：计算机科学与技术学院

  办公地点：

  计算机楼B527

  联系方式：

  liximing86@gmail.com

  ximingli@jlu.edu.cn

  主要研究领域为人工智能、机器学习（弱监督学习）、自然语言处理。承担国自然面上项目、青年项目、企业技术开发项目、博士后面上项目、吉林省博士后择优资助项目

  、吉林大学有组织科研专项和培英工程计划

  等；

  作为骨干成员参与科技部新一代人工智能2030重大项目，国自然区域联合重点基金、省部级重点研发项目等科研项目10余项。

  招收

  博士、

  硕士研究生：

  欢迎有意报送和报考的硕士/博士研究生同学与我联系。具体要求如下：

  1. 对科研抱有热情。

  2. 有清晰的逻辑思维和健康的体魄。

  3. 有扎实的数学基础和熟练的英文读写能力。

  4. 乐观积极，坚忍不拔，有亲和力，表达能力强。

  5. 至少精通一门编程语言。

