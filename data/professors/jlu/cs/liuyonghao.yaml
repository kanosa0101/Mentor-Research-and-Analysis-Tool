title: 副教授
bio_raw: '基本信息

  刘永皓，吉林大学计算机科学与技术学院准聘副教授，博士生导师。主要研究方向为图表征学习、生物信息学与大语言模型，围绕图神经网络、空间多组学建模及相关智能计算方法开展研究。

  近年来，在人工智能与生物信息学领域取得了一系列研究成果，以第一作者或通讯作者身份在

  Nature Methods

  、

  ACM TKDD

  ，以及

  NeurIPS

  、

  KDD

  、

  WWW

  、

  SIGIR

  、

  AAAI

  、

  IJCAI

  、

  EMNLP

  等国际顶级期刊和会议发表学术论文十余篇。同时，受邀担任

  NeurIPS

  、

  ICML

  、

  KDD

  、

  WWW

  、

  SIGIR

  、

  ACL

  、

  AAAI

  等国际顶级学术会议审稿人。

  课题组长期致力于人工智能前沿技术与生命科学交叉研究，注重学生科研创新能力与独立研究能力的培养，为学生提供高水平科研训练、国际学术交流以及产业合作机会。课题组与国内外知名高校及头部科技企业保持良好的合作关系，鼓励并支持学生参与国际顶级期刊与会议投稿与交流。

  每年计划招收博士研究生

  1

  名、硕士研究生

  3

  名，欢迎具备以下特点的优秀同学加入：

  (1)

  对科学研究充满热情，具有探索未知问题的兴趣；

  (2)

  具备良好的执行力、编程能力和独立思考能力；

  (3)

  具有较好的英文文献阅读与学术写作能力；

  课题组鼓励并支持博士研究生高质量成果导向培养，为优秀博士生创造提前毕业条件；支持硕士研究生赴知名企业实习交流，并为硕博研究生提供具有竞争力的科研补助。

  本人在攻读博士期间已与多名硕博士研究生开展深度合作，指导学生在人工智能与生物信息学领域国际顶级会议和期刊发表多篇高水平论文，积累了丰富的人才培养经验。

  欢迎对图表征学习、大语言模型、生物信息学及交叉学科研究感兴趣的同学联系交流，共同开展具有国际影响力的前沿研究。

