  个人简介

  周千寓，2024

  年获上海交通大学工学博士学位，师从中国工程院院士候选人马利庄教授。研究方向为计算机视觉、计算机图形图像。发表

  IEEE TPAMI

  、

  IEE TIP

  、

  CVPR

  、

  ICCV

  、

  NeurIPS

  等高水平论文

  40

  余篇，谷歌学术引用量总计超

  1700

  次。已授权国家发明专利

  7

  件，曾获世界互联网大会领先科技奖、世界人工智能大会青年优秀论文奖入围、

  CAD/Graphics 2023

  最佳论文奖、

  ICASSP 2023

  前

  3%

  优秀论文表彰奖、上海交通大学致远荣誉博士（博士生最高荣誉）、吉林大学十佳大学生（本科生最高荣誉）等荣誉。

  长期每年招收博士研究生

  1

  名、硕士研究生

  3

  名、本科生科研助理若干。

  对学生因材施教，曾指导或协助指导多名本科生、硕士生、博士生科研，具有丰富的指导经验。欢迎对于计算机视觉研究有浓厚兴趣、目标发表顶会顶刊的同学邮件联系。希望你：

  1

  ）有强烈的自驱力（

  Self-Motivation

  ），真正喜欢人工智能与科研工作；

  2

  ）具有较强的自学能力、编程能力和英语水平。如果你对本课题组感兴趣，请通过邮件联系我并随信附上你的简历、成绩单和其它证明材料（有任何疑问欢迎邮件预约面谈）

