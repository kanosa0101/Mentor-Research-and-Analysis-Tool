bio_raw: '基本情况：

  姓名：谭婧炜佳

  性别：女

  职称：教授

  最高学历：研究生

  最高学位：博士

  Email：jtan@jlu.edu.cn

  所在学科专业：计算机系统结构

  个人简介：

  谭婧炜佳，博士，教授，博士生导师，吉林大学唐敖庆青年学者。现为IEEE高级会员，CCF高级会员，CCF体系结构专业委员会执行委员，CCF容错计算专业委员会执行委员，CCF分布式计算与系统专业委员会执行委员。国际SCI期刊JCSC副编辑。2016年博士毕业于美国休斯顿大学，2017年吉林大学海外引进博士A类人才，2019年吉林省青年人才托举工程入选者（全省12人），2020年首批吉林省人才“18条”政策-D类（省级领军人才）入选者，2023年吉林大学工科集群青年人才专项支持计划入选者，2024年被聘为吉林大学唐敖庆青年学者。2018年获得EDA领域顶级会议DATE最佳论文奖提名。2024年获得中科院一区期刊FGCS春季编辑推荐论文奖。2023年国家级虚拟仿真实验教学一流课程《云计算技术综合虚拟仿真实验》课程团队成员。

  发表CCF推荐A、B类期刊和会议及中科院一区等高水平论文40余篇，包括顶级期刊和会议IEEE TC, IEEE TPDS, IEEE TCAD, ACM TACO,
  SC, MICRO, ACM TODAES, ACM TECS, JSA, PACT, ICCD, IPDPS, DATE等。授权国家发明专利9项，主持国家自然科学基金2项（面上、青年），吉林省科技发展计划项目4项等10余项科研项目，总经费400余万元。多次担任IEEE
  TC, IEEE TPDS, IEEE TCAD, IEEE TSC, IEEE TMC, ACM TACO, JSA等著名国际期刊审稿人。

  研究方向：

  计算机体系结构、高性能计算、人工智能及大模型系统、GPU、处理器芯片架构、计算机系统可靠性与安全性、具身智能系统。

  目前主要关注如下问题：

  如何实现高可靠、高效率的AI及LLM训练和推理

  如何充分利用GPU系统资源实现并行、高效的智能算法

  如何确保智能处理器系统在复杂环境下可靠及安全运行

  如何开发面向机器人/无人机的智能处理系统

  招生信息：

  名额充足，每年招收博士研究生1名（本科直博、硕博连读、申请考核均可），每年招收多名学硕及专硕（计算机、软件学院均可）。

  教师亲自指导每位学生，课题组提供丰富的薪酬及科研奖励，实验设备及经费充足，氛围融洽。

  如果希望从事研究工作，课题组深耕计算机系统领域，在可靠性方面取得突出成果，实验条件包括丰富的AI计算系统开发及测试平台，包括系统及EDA仿真软件工具链，各类服务器级高端显卡、GPU开发板，高精度红外相机、电磁脉冲发生器、频谱分析仪、各类电磁探针、数据采集卡等测试工具。学生将在科研能力、系统思维方面得到良好锻炼，并具备从硬件到软件的全栈式系统研发能力。

  如果希望从事开发工作，课题组目前承担机器人、无人机方面的课题项目，拥有相关设备及实验条件。学生将获得在环境感知、具身智能、多模态模型、多智能体协同等方面的实用开发经验，鼓励实习。

  欢迎各位同学加入课题组。

  指导的已毕业硕士研究生，全部获得包括研究生国家奖学金、吉林银行王湘浩奖学金、优秀毕业论文、优秀奖学金、研究生学业奖学金、优秀毕业研究生等在内的各项奖励及荣誉。硕士期间均发表包括TC（CCF-A期刊）、TCAD（CCF-A期刊）、TODAES（CCF-B期刊）、ICCD（CCF-B会议）、FGCS（中科院一区期刊）等在内的高水平论文和发明专利授权，期间进入腾讯、快手、OPPO、龙芯等企业实习，毕业后进入华为、百度、海光、理想汽车、比亚迪、一汽、吉林电网、哈电集团等国内著名企业、研究机构从事AI云计算、GPU处理器芯片设计、汽车智能芯片设计、智能驾驶、智慧电网等方向工作。

  协助指导的已毕业博士研究生博士期间发表SC（CCF-A会议）、TCAD（CCF-A期刊）、FGCS（中科院一区期刊）、DATE（CCF-B会议）等高水平论文，毕业后入选吉林大学鼎新学者，目前是吉林大学准聘副教授。

  指导的本科生发表TPDS（CCF-A期刊），收到多所美国及香港一流大学的全奖博士offer，目前在美国弗吉尼亚大学、美国爱荷华大学等著名高校攻读博士学位。

  教育经历：

  2014-2016，美国休斯顿大学，电气与计算机工程系，博士

  2011-2014，美国堪萨斯大学，电气工程与计算机科学系，硕士

  2007-2011，吉林大学，计算机科学与技术学院，本科

  工作经历：

  2024.09至今，吉林大学，教授

  2017-2024，吉林大学，副教授

  2016-2017，美国Qualcomm（高通公司），高级工程师

  2015、2016，美国Pacific Northwest National Laboratory（太平洋西北国家实验室），博士实习生

  主持科研项目：

  1. 国家自然科学基金，面上项目，2024-2027，在研。

  2. 吉林省科技厅，2023-2025，在研。

  3. 吉林省科技厅，重点研发项目，2022-2025，在研。

  4. 吉林省科技厅，2019-2021，已结题。

  5. 国家自然科学基金，青年科学基金，2019-2021，已结题。

  6. 吉林省教育厅，2019-2020，已结题。

  7. 吉林省科技厅，2018-2020，已结题。

