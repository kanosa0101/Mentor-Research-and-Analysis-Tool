  详细情况

  所在学科专业

  招生专业：

  * 计算机科学与技术学院，学术博士（计算机应用）

  * 计算机科学与技术学院，学术硕士（计算机应用）、专业硕士（电子信息）

  * 软件工程学院，学术硕士（软件工程）、专业硕士（电子信息）

  加入HILab方式，加QQ：3118179595，备注学院/专业/年级/姓名，发送简历和成绩单，约时间聊一下职业发展计划和擅长技能。欢迎本科生科研及读博读硕，全校各专业各年级均可，主要决定于个人是否感兴趣及有决心学习新知识技能。

  HILab不定期活动：

  * 健康大数据新生培训项目及征集人手参与项目

  * 学术研究基本技能讲座

  * 出国保研经验交流会

  近期新闻（HILab论文发表情况见下表）

  * 恭喜HILab多位本科生取得国际和国内等顶尖高等学府2024年继续深造！也预祝其他HILabers拿到心仪高校和公司的offers！

  * 恭喜HILab多位同学的成果发表在2023-2024年度Information Sciences、Expert Systems With Applications、Information
  Processing & Management、Briefings in Bioinformatics、Bioinformatics等高水平期刊上，并拿到满意的高校和公司的offers！

  所研究方向

  大数据，人工智能，多模态融合，特征表征，特征选择，生物信息学，健康大数据挖掘，深度学习，并行计算等

  讲授课程

  健康大数据挖掘，机器学习与 Python 编程等

  教育经历

  * 1996-2000: 中国科学技术大学，少年班学院，计算机软件

  * 2000-2005: 中国科学技术大学，计算机学院，计算机软件

  工作经历

  教授，博士生导师，中国科学院百人计划，IEEE（美国电气和电子工程师协会）高级会员。团队主要从事健康大数据挖掘核心算法的研究。

  于2005年7月获得中国科学技术大学计算机软件与理论专业博士学位，师从中科院院士陈国良院士。于2005年9月在美国乔治亚大学生物信息研究所所长徐鹰教授的实验室担任生物信息学博士后，从事比较基因组学方面的研究，并分别于2008年12月和2009年1月晋升为生物能源计算生物学研究组组长和健康信息学助理研究科学家。2011年被中国科学院深圳先进技术研究院聘用为健康信息学研究员。2015年被吉林大学聘用为健康大数据教授、博导。

  已发表SCI索引学术论文93篇，根据SCI数据库统计，总引用次数1771次，他引次数1366次。学术成果多次在包括Nature Protocols（影响因子9.673，1篇）、Nucleic
  Acids Research（影响因子9.112， 3篇）、Bioinformatics（影响因子4.981，3篇）、BMC Genomics（影响因子3.986，
  2篇）和Genetics（影响因子5.963，1篇）等高水平SCI索引学术期刊上发表。相关成果连续荣获国际疾病预测竞赛2012年度第三名（共55个学术团队参加）和2013年度第四名（共28个学术团队参加）、2014年度第二届中国大数据技术创新大赛（中国计算机学会大数据专家委员会）的成功参与奖、2015年度“中国好创意”全国青年大数据创新大赛（国家互联网信息办公室网络数据与技术局、中国计算机学会）的二等奖、和2020年度阿里云天池大赛“AI开发者创新应用赛”创新奖。应邀担任Computers
  in Biology and Medicine (SCI索引，影响因子7.700，中科院一区)的副主编、和Interdisciplinary Sciences:
  Computational Life Sciences (SCI索引，影响因子4.800，中科院二区) 副主编，并多次应邀评审国际和国内项目标书、国际学术期刊和会议的投稿论文。

  目前已毕业的学生找到的工作机会包括阿里巴巴、百度和南方信投等大数据挖掘领域的大数据分析师等职位，也有多位HILabers选择国内外顶级高校继续深造。欢迎有志于从事大数据领域研究和开发的同学申请和报考本实验室的计算机学院计算机应用专业学术博士、计算机学院的学硕（计算机应用专业）/专硕（电子信息专业）研究生、以及软件工程学院的学硕（软件工程专业）/专硕（电子信息专业）研究生。

