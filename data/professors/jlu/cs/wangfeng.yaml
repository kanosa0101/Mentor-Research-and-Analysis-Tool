  科研项目

  1.面向物联网数据的异质信息网络建模研究，国家自然科学基金青年基金，负责人。

  2.基于异质信息网络数据表示的社交物联网协同推荐方法研究，吉林省优秀青年人才基金项目，负责人。

  3.基于社交关系的物联网中实体知识表示与关联性分析研究，中国博士后科学基金会，负责人。

  4.面向物联网触发执行应用模式的安全检测研究，吉林省自然科学基金面上项目，负责人。

