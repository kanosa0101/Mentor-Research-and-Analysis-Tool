  研究方向

  多媒体技术、机器学习与智能系统

  研究领域

  1、医学图像分析与处理：医学图像分割；智慧医疗诊断

  2、多模态机器感知与理解：目标检测；交通场景语义解析；跨模态因果推理

  3、人脸识别与行为分析：人脸检测与识别；动作识别

  讲授课程

  1、微机系统

  2、计算机视觉

  3、计算机科学导论

  4、机器视觉（研究生）

