bio_raw: '个人简介

  Personal Profile

  范晓娅，大连理工大学软件学院讲师。2011年本科毕业于大连理工大学电信学院，保送至北京航空航天大学攻读硕士学位，2014年硕士毕业后获国家留学基金委资助前往布鲁塞尔自由大学(Université
  Libre de Bruxelles)工学院BEAMS组(Bio- Electro- And Mechanical Systems)攻读博士学位，于2018年12月获得工程与技术科学博士学位。主要从事人工智能与脑科学的交叉研究以及大脑信号处理与挖掘。基于SPM发布脑电信号处理软件工具包一个，主持国家自然科学基金青年项目1项，大连理工大学中央高校基本科研业务费交叉探索专题1项，在领域知名SCI检索期刊及MICCAI、BIBM、Briefings
  in Bioinformatics、ICME及ICASSP等领域顶会发表论文二十余篇，授权国家发明专利3项。大连理工大学星海骨干，Scientific Reports编委。

  师生关系：

  亦师亦友、合作共赢、轻松愉快

  社恐社牛和谐共处

  能提供给你：

  1.

  充分的尊重和自由发挥空间；

  2.

  及时的指导和建议（科研

  and

  生活）；

  3.

  严谨的科学作风和科学精神（严肃脸）；

  4.

  广泛的国内外合作交流途径；

  期待带你走进有趣的医学

  /

  生物

  AI

  前沿世界。

  希望你：

  1.

  能学能玩、幽默开朗、积极乐观、从容淡定；

  2.

  诚实守信、认真负责、踏实肯干、勤学好问；

  3.

  保持好奇、勇于探索；

  4.

  一些些数学、一些些

  coding

  和英语（现学也成）。

  研究方向一：AI for brain

  研究方向二：AI for biology'
