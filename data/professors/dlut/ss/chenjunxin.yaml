bio_raw: '陈俊鑫，安徽省淮北市人。大连理工大学软件学院，教授，博士生导师；国家级青年人才，首届“小米青年学者”，

  澳门大学”濠江学者“

  。兼任辽宁省心血管病影像医学重点实验室（北部战区总医院）教授，韩国仁川国立大学（Incheon National University）教授。现任大连理工大学-日本立命馆大学健康医疗智能计算联合研究中心主任。

  主要研究方向

  ：聚焦人工智能的交叉应用，有AI Agent （面向健康应用）、AI+可穿戴设备、AI+工程等

  。在业内领先的SCI杂志和国际会议上发表论文200+篇，其中第一作者/通信作者100+篇；Google Scholar引用6000+，H指数42。是

  Expert Systems 的Editor-in-Chief（主编），

  IEEE Journal of Biomedical and Health Informatics ，

  IEEE Transactions on Emerging Topics in Computational Intelligence

  等多个

  国际期刊

  的编委、副主编或客座主编（编辑），是NeurIPS（CCF-A）的Area Editor。

  基于智能手机的健康监测应用，可微信扫描二维码试用。

  论文详见：https://orcid.org/0000-0003-4745-8361

  项目和奖励有：

  主持国家自

  然科学基金面上项目，国家自然科学基金青年项目等10余项国家/省部级项目；

  与产业界合作密切

  ，推动成果落地使用：主持“小米青年学者”人才项目，与京东健康合作开发智能手机健康监测项目并落地实用；

  获得

  辽宁省科技进步二等奖

  ，辽宁省自然科学学术成果奖2项，辽宁省优秀博士论文。

  指导的学生屡获

  ：挑战杯全国特等奖，国创赛省赛金奖、银奖（2次），辽宁省优秀毕业研究生、国家奖学金（多次），一等学业奖学金等荣誉称号。

  期待优秀学子的加入

  ：希望热爱科研、工作踏实、勤

  奋肯干的优秀学子加入。1）您喜欢理论、或者热爱算法、或者擅长硬件，我们都欢迎；2）毕业后想参加工作、毕业后想继续深造，无论哪一类，我们都欢迎；3）您想多发论文、或者想多做专利，我们都欢迎；4）本科、硕士、博士都有宽阔舞台；5）但是必须踏实肯干哦！！！

  期待博士、硕士、本科学生加入，与你们再创更大

  成绩。（Email: chenjunxin@dlut.edu.cn; 欢迎来信

  ）'
