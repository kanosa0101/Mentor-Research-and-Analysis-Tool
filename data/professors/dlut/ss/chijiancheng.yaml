bio_raw: '池建成，博士，

  大连理工大学软件学院、国际信息与软件学院助理教授，硕士生导师，大连市高层次人才。国际电气电子工程师协会（

  IEEE

  ）、国际计算机学会（

  ACM

  ），中国计算机学会（

  CCF

  ）会员。

  2017年获得大连理工大学工学学士学位，2020年和2025年分别获得天津大学工学硕士和博士学位。2023年6月在日本北陆先端科学技术大学院大学（Japan Advanced
  Institute of Science and Technology）担任访问学者

  。

  研究兴趣包括工业物联网、工业大模型、边缘计算与边缘智能，研究

  成果在

  IEEE Communications Surveys&Tutorials（IF=50.6，Citation1100+）、IEEE Transactions on
  Mobile Computing（CCF-A）、

  ACM Ubicomp

  （CCF-A）

  、Journal of

  Computer and System Sciences

  （CCF-B）

  、ACM Transactions on Sensor Networks

  （CCF-B）

  、Journal of Network and Computer Applications、IEEE Transactions on Network Science
  and Engineering、IEEE Network、软件学报、IWQoS

  （CCF-B）

  等顶级期刊/会议上发表，部分被列为ESI&SCI高被引论文（前1%）。出版Springer Nature专著1部，授权国家发明专利7项，国际专利 (美国、荷兰)
  3项，Google Scholar引用量1400余次

  。主持国家自然科学基金青年项目（C类）1项、

  国家外国专家个人类项目（S类）1项、

  辽宁省科技计划青年项目1项，参与国家自然科学基金杰出青年项目、国家重点研发计划、天津市杰出青年项目等国家级、省部级项目若干项。担任 Scientific Reports
  期刊编委，IEEE Transactions on Mobile Computing、IEEE/ACM Transactions on Networking、IEEE
  Transactions on Robotics、

  IEEE Transactions on Parallel and Distributed Systems、

  IEEE Transactions on Industrial Informatics、IEEE Transactions on Network Science
  and Engineering等多个国际顶级期刊审稿人，担任SmartIoT、CNETCNED、MSN等国际/国内学术会议主席和程序委员会委员，

  获ACM全国优秀博士论文奖

  （大连分会）、

  CSCWD

  最佳论文奖

  （

  CCF-C类会议

  ）

  ，CCF CNETCNED学术会议优秀论文奖，

  多次获得

  国家公派留学奖学金、天津大学联想奖学金、天津大学智算杰出青年奖学金等

  各类奖学金和荣誉

  。

  部分代表性科研成果：

  [Ubicomp 2026, CCF A]

