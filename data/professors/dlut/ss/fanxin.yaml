bio_raw: '个人简介

  Personal Profile

  分别于1998年和2005年于西安交通大学通信与信息工程专业获工学学士和博士学位。2005年7月至2009年10月在大连海事大学信息工程学院任讲师，在此期间从2006年5月至2009年6月分别在美国俄克拉荷马州立大学和德州大学西南医学研究中心进行博士后研究，2009年11月起在大连理工大学软件学院任教，现任大连理工大学-立命馆大学（中日）国际与信息软件学院院长、辽宁省泛在网络与服务软件重点实验室副主任。入选2011年度教育部“新世纪优秀人才支持计划”，辽宁省“百千万人才工程”千人层次，获得省部级科技进步奖1项、作为通讯作者获得国际多媒体旗舰会议ICME2015最佳学生论文、两篇论文入选ICME2017最佳论文候选、重要国际会议ICIP2013最佳论文候选、ICIP2015
  top10%论文、全国多媒体技术大会2013最佳论文奖。'
