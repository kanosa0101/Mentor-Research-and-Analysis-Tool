bio_raw: '个人简介

  Personal Profile

  郭成，工学博士，教授，博士生导师，台湾清华大学博士后研究员。主要研究方向为大语言模型技术

  、

  数据安全

  、联邦学习，

  及人工智能安全。作为项目负责人承担国家自然科学基金面上项目、国家自然科学基金青年项目、辽宁省教育厅项目、奇虎

  360

  隐私计算项目

  10

  余项。已在

  IEEE TDSC, IEEE TIFS,

  IEEE TSC, IEEE TCC, IEEE TII, IEEE IoT Journal

  等顶级期刊发表高质量学术论文

  80

  余篇。现为

  IEEE

  会员、中国计算机学会会员、中国密码学学会会员，山东省云计算与智能应用协同创新中心副主任。

