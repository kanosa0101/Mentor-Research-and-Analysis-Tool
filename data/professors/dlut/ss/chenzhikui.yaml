bio_raw: '个人简介

  Personal Profile

  2007年11月至今，大连理工大学教授，博士生导师。大数据研究所所长。

  2001年7月至2007年10月，德国斯图加特大学高性能计算中心研究员。

  1999年11月至2001年6月，法国IRISA（法国国家信息研究所）博士后研究。

  1998年10月-1999年，香港浸会大学计算系博士后研究。'
