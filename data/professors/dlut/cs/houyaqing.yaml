bio_raw: '个人简介

  Personal Profile

  个人简介

  候

  亚庆，教授/博导、国家高层次青年人才

  ，获批中央某部委创新领军人才、辽宁省优青/青拔

  、中国科协青托

  ，曾借调于国家自然科学基金委高技术研究发展中心，

  主要研究方向为人工智能，包括计算与群体智能、大模型

  智能体

  、机器学习与深度学习理论、大数据挖掘与优化等。本科毕业于哈尔滨工业大学，博士毕业于新加坡南洋理工大学，导师Prof. Ong Yew-Soon（IEEE Fellow、新加坡科研院人工智能首席科学家）。

  主持国家自然科学基金

  面上/

  青年

  项目

  、

  GF智能科技重大专项

  等10余项。近五年

  以第一或通讯作者

  在中科院一区/IEEE Trans/CCF-A

  发表论文

  40余篇。目前担任

  IEEE Transactions on Emerging Topics in Computational Intelligence副主编、

  IEEE Transactions on Cognitive and Developmental Systems副主编、中国图学学报编委

  ，辽宁省图学学会理事，中国人工智能学会青工委委员，中国仿真学会智能仿真优化与调度专委会委员等

  。

  担任或受邀为多个国际期刊会议审稿人，包括：IEEE TEVC, IEEE TNNLS, IEEE TCYB, IEEE TSMC, IEEE TETCI, 中国科学,
  计算机学报、自动化学报、Memetic Computing等。

  主讲本科生专业必修课程《人工智能》、《数据库系统概论》、《计算理论导引》，研究生专业选修《智能计算》等。主持

  国家级本科教学工程项目（2022、2024）、大连理工大学本科生教改（2023）、

  大连理工大学

  研究生教改（2023），教育部产学协作协同育人项目（2021）

  ，

  出版

  Springer

  国际出版社教学科研专著《Optinformatics in Evolutionary Learning and Optimization》

  ，获

  高等教育（研究生）国家级教学成果二等奖1项（2023），辽宁省研究生教学成果特等奖1项（2022），辽宁省本科教学成果一等奖2项（2020、2022）

  ，校优秀班主任（2021）等，指导国家级、省部级大学生创新创业训练项目、大连理工大学优秀本科生与研究生毕业论文多项、 2024 年睿抗机器人开发者大赛全国总决赛一等奖等。

  NEW Book

  ！《Optinformatics in Evolutionary Learning and Optimization》 Springer Nature.

  Multifactorial Evolution: Towards Evolutionary Multitasking, Benchmark Problems,
  Publications and Source Codes Downloads.

