  招生信息：

  课题组常年招收计算机科学

  、数学、机械、控制等专业博士研究生、硕士研究生以及对相关方向科研感兴趣的本科生科研助手，发放科研补助。主要研究方向包括计算与群体智能、大模型智能体、机器学习与深度学习理论、大数据挖掘与优化等。希望申请的同学需具备一定相关专业背景知识和英文读写能力，且具备较强

