bio_raw: '个人简介

  Personal Profile

  陈炳才，教授，博士生导师、硕士生导师。

  欢迎有志于钻研和挑战人工智能、大数据关键技术、物联网等方向前沿课题的同学加入我们的研究组。

  本研究组主要从事人工智能、计算机视觉、智能系统与机器人、大数据挖掘技术、智能物联网及其安全等方向前沿课题的理论与工程研究，承担国家自然科学基金、国家重点研发计划等诸多'
