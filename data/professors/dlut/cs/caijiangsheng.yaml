title: 讲师
bio_raw: '个人简介

  Personal Profile

  蔡江胜简介：中国游戏设计教育创始人，

  绿色游戏概念创始人，大连理工大学计算机科学与技术学院教师，大连理工大学游戏编程协会指导教师。

  2001

  年

  3

  月

  5

  日，在大连理工大学面向全校各年级各专业本科生开设公共选修课《电脑游戏设计》。这是中国各级学校首次开设论述电脑游戏的课程。开课之初，在世界上首次提出了绿色游戏概念。所做创新工作已被《人民日报》、新华社、《中国教育报》、《大连日报》、《大连理工大学报》、大连电视

  1

  台、新浪网等众多中国主流媒体广泛报导。绿色游戏概念已被中国政府和社会各界广泛使用，确立了游戏行业的核心价值观。

  开课以来，倡导

  “游戏是最先进的娱乐，编程是最先进的生产，游戏编程是最先进的教育”，精心讲授《电脑游戏设计》、《网站技术》两门课，已有全校各专业学生

  1

  万

  8

  千人 选修过这两门课（每门人数各半）。'
