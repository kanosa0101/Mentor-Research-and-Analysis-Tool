bio_raw: '个人简介

  Personal Profile

  博士 教授 博士研究生导师、硕士研究生导师，计算机技术实验室主任。

  近年来一直从事嵌入式人工智能系统、多智能体协同、智联网与信息安全等领域的科研工作，2013-2014在New York University做访问学者。主讲《计算机组成原理》（本科）、《嵌入式系统设计》（本科）、《智能嵌入式系统》（硕士研究生）等三门计算机专业课。现担任《IEEE
  Trans. VT》、《IEEE Trans. ITS》、《计算机学报》、《电子学报》、《通信学报》等期刊审稿人。国内外重要学术刊物和国际会议发表第一作者和通讯作者论文60
  余篇。

