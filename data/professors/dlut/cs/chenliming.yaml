bio_raw: '个人简介

  Personal Profile

  讲席教授、博士生导师、国家级领军人才、智能信息物理系统实验室创始人。

  IET会士、IEEE智能世界ETTC技术委员会委员、IEEE智能世界和普适智能计算会议指导委员会委员，受邀担任英国、欧盟、丹麦、智利、加拿大、塞浦路斯、荷兰等国家研究基金项目评审专家。

  主要研究方向：

  空间智能、世界模型、数据孪生；

  多模态数据分析、大模型、图像分析；

  智能体强化学习、自适应演化、多智能体协同；

  智能信息物理系统、数字医疗、智能家居。

  招生信息：

  课题组2027年招收4名博士、4名硕士。

  计算机科学、数学、电子、控制及相关方向的本科生、硕士生欢迎申报。'
institutes:
