bio_raw: '个人简介

  Personal Profile

  讲席教授、博士生导师、国家级领军人才、智能信息物理系统实验室创始人。

  IET

  会士、

  IEEE

  智能世界

  ETTC

  技术委员会委员、

  IEEE

  智能世界和普适智能计算会议指导委员会

  委员，

  受邀担任英国、欧盟、丹麦、智利、加拿大、塞浦路斯、荷兰等国家研究基金项目评审专家。

  招聘广告

  :

  智能信息物理系统研究团队现招聘

  硕士、博士、博士后

  、

  副教授

  及

  教授

  岗位，围绕感知

  -认知-决策主题在数据科学和人工智能领域开展创新性理论和应用研究。团队拥有优越科研环境，充足科研资金支持，以英国科研模式管理，鼓励自由选题，提供与国外著名大学合作交流机会。在大连理工人才政策支持基础上（请见具体政策http://perdep.dlut.edu.cn/），团队成员科研资金需求将得到大力支持。尤其是博士后，三年博后期间可获得达15万科研支持。

  从事数据科学

  和人工智能

  的基础理论

  、方法、先进技术及其应用研究。具体研究方向包括情景计算、计算行为分析、认知数据分析，符号人工智能、语义

  (

  本体或图谱

  )

  知识表征、结合计算智能和符号智能的混合人机智能、决策支持，以及多模态（如语音和手语）人机交互技术和个性化。主要应用领域是基于物联网及移动计算的多源、多形态、动态时空大数据分析的智能信息物理系统，包括数字医疗

  /

  医养、智能交通、网络安全、智慧城市、无人飞行载具、在线社会计算等。特别聚焦以情景计算、活动识别为特色、以用户为中心、以个性化应用为导向，通过数据和知识混合驱动的智能建模与分析推理，开展

  “

  感知

  -

  认知

  -

  智能

  ”

  （数据

  -

  理解

  -

  推理与决策）的系统性研究。

  自

  1996

  年起先后在英国利兹大学

  (Leeds University)

  做访问学者（教育部中英友好奖学金（

  Sino-British Friendship Scholarships Schemes SBFSS

  ）资助），英国德蒙福特大学攻读博士（英国政府海外研究生基金（

  Overseas Research Students (ORS) Awards Scheme

  ）资助），英国南安普敦大学

  (University of Southampton)

  从事博士后研究，

  担任英国德蒙福特大学计算机科学及信息学院教授，情景、智能和交互研究实验室主任，

  阿尔斯特大学计算学院教授、

  认知分析研究实验室主任及计算学院科研副院长。

  作为首席科学家主持了欧盟地平线玛丽居里行动创新培训网络

  “

  ACROSSING: Advanced Technologies and Platform for Smarter Assisted Living”

  项目

  （成功率

  6.3%

  ，

  388

  万欧元，涉及

  12

  个欧洲国家，

  26个合作伙伴），作为

  主要负责人主持欧洲环境辅助生活联合计划（

  AAL JP

  ）

  “MobileSage

  ：

  Situated Adaptive Guidance for the Mobile Elderly

  ”

  和

  “PIA:

  Personal IADL Assistant

  ”

  项目，政府、企业和院校联合创新项目

  “

  英国电信爱尔兰创新中心（

  BT-Ireland Innovation Centre)

  ”

  和

  “

  普华永道（

  P

  wC）先进研究工程中心（

  Advanced Research and Engineering Centre)”

  ，

  英国皇家工程院牛顿基金与中国

  NSFC资助的

  “

  Privacy Computing and Protection Research for IoT-enabled Smart Healthcare Systems

  ”

  等

  20

  多个项目，资助金额超过

  3000

  万英镑。

  与欧洲许多国家如德国、荷兰、奥地利、西班牙、希腊、挪威等国际一流研究机构和企业界建立并开展了广泛密切的合作。

  在

  IEEE TKDE、SMC、THMS、IoT、Big Data, ACM TKDD、TOIT, Elsevier FGCS、PMC、information Science等本领域主流期刊和会议发表学术论文300余篇，专著2部，编辑书籍、论文集25部，Google
  Scholar引用7700多次，h-index 42。在IEEE UIC2023、IEEE SWC2019、IEEE HealthCom2017、IEEE IUCC2012等国际会议获“最佳论文奖”7次。先后担任IEEE
  DigitalTwin2023、IEEE WoWMoM2022、IEEE SmartWorld2019、IEEE UIC2017、IEEE HealthCom2017,
  ACM UbiComp2011等国际学术会议大会、技术程序委员会及研讨会主席，担任IEEE THMS、COMPUTER、IoT、Elsevier PMC, Springer
  AIHC、PUC等国际著名期刊及特刊编委，书籍和会议论文集编委，受邀在法国

  里昂大学

  、荷兰代尔夫特理工大学

  , 北京大学、日本东芝公司等著名高校、

  研究所、公司及

  IEEE IAS GlobConET 2023、 IEEE GlobConPT 2022 、IEEE

  ICCCA2021、IEEE CyberSciTech2019、IEEE CPSCom2017等

  国际学术会议上做主题演讲、特邀报告及研讨会报告。'
