research_direction_raw: 研究方向、Research Focus、社会兼职、Social Affiliations、研究主题和方向、（但不限于）如下：、·、研究多模态（文本、音视频、行为及生理信号）信息融合的时序数据的智能分析、包括计算行为分析、情境认知与推演方法、复杂场景态势预测等、·、研究数据驱动和知识驱动相结合的表征模型架构和训练优化方法、实现融合计算智能模型算法（数据挖掘和深度学习）和领域知识、经验和启发的混合增强智能、决策支持策略、·、针对具体问题
