title: 教授
supervisor: 博导、硕导
bio_raw: '福州大学计算机系学士，大连理工大学计算力学硕士，大连理工大学计算机应用技术博士。1988年12月硕士毕业后留校工作，曾在日本国立德岛大学任高级访问学者，主持开发过“孙悟空中日机器翻译系统”等系列商用软件，现为大连理工大学计算机学院教授、博导，科技部科技创新2030-“新一代人工智能”重大专项首席科学家。长期专注自然语言处理与机器翻译研究，包括词法分析、命名实体自动识别、自动摘要、神经机器翻译、社交媒体文本处理等。目前主持项目：

  -国家重点研发计划“

  以中文为核心的多语言自动翻译研究

  ”

  (批准号:2020AAA0108000)

  (2020.11-2023.10)

  -国家自然科学基金 “

  面向大规模汉语新闻语料的实体抽取与自动摘要研究

  ”(批准号:U1936109)

  (2020.01-2022.12)'
