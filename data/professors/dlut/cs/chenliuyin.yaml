bio_raw: '个人简介

  Personal Profile

  陈浏荫，大连理工计算机学院助理教授。2019年本科毕业于中国科学技术大学，2023年博士毕业于香港城市大学，师从张子钧教授（香港城市大学数据科学学院副院长）。2023年12月至2025年11月于香港数据科学研究院进行博士后研究。

  主要研究方向是多模态人工智能、医工交叉和AI4S。相关研究成果以一作身份已发表在Patterns（Cell子刊）, IEEE Transactions on Artificial
  Intelligence, Briefings in Bioinformatics, IEEE Journal of Biomedical and Health
  Informatics等多个国际领域内顶尖刊物上,并接受Cell Press关于“视觉辅助肺腺癌类型及高危肿瘤区域辨认”专访。受邀为

  Briefings in Bioinformatics

  , Journal of Intelligent Manufacturing等国际著名期刊的审稿人。

  欢迎对于大数据和人工智能算法应用感兴趣的本科生同学或者有意向报考硕士研究生的同学与我联系：

  liuyichen4-c@my.cityu.edu.hk

  或liuyichen@dlut.edu.cn。

  Selected Publications:

  [1]

  L. Chen,

  S. Fu, and Z. Zhang,

  “

  CMTT-JTracker: a fully test-time adaptive framework serving automated cell lineage
  construction,

  ”

  Briefings in Bioinformatics, 2024, 25(6). (IF=7.7.)

  [2]

  L. Chen

  , H. Qi, D. Lu, J. Zhai, K. Cai, L. Wang, G. Liang and Z. Zhang,

  “

  Machine vision-assisted identification of the lung adenocarcinoma category and high-risk
  tumor area based on CT images,

  ”

  Patterns, 2022, 3(4). (IF=7.4, Cell

  子刊

  )

  [3]

  L. Chen

  , L. Wang, G. Liang and Z. Zhang,

  “

  FedACT: Federated Agnostic Learning on Limited Decentralized CT Images with Knowledge
  Transferring Process,

  ”

  IEEE Journal of Biomedical and Health Informatics, 2025. (IF=6.8)

  [4]

  L. Chen

  , D. Lu, J. Zhai, K. Cai, L. Wang, and Z. Zhang*,

  “

  Vision Intelligence Assisted Lung Function Estimation Based on Transformer Encoder

  –

  Decoder Network With Invertible Modeling

  ，”

  IEEE Transactions on Artificial Intelligence. 2024. (CiteScore=7.7)

  [5]

  L. Chen

  , D. Lu, J. Zhai, K. Cai, L. Wang, and Z. Zhang,

  “

  The self-distillation trained multi-task dense-attention network for diagnosing
  lung cancers based on CT scans,

  ”

  Medical Physics, 2024, 51(3): 1738-1753. (IF=4.5.)'
