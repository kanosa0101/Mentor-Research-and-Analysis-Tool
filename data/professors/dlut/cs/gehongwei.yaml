bio_raw: '个人简介

  Personal Profile

  多年来在人工智能、机器学习、深度学习、群体智能等理论与技术，及相关技术在智慧城市、机器智能与机器视觉、智慧医疗、无人群体系统等领域进行了长期系统的研究，主持或参与了多项科研工作。近年来，承担与参与国家863计划项目、国家科技支撑计划项目、国家自然科学基金等项目共30余项。获教育部自然科学二等奖1项。获国家级教学成果二等奖1项，辽宁省普通高等教育教学成果特等奖1项，一等奖1项。在IEEE
  transactions on Cybernetics, IEEE Transactions on Evolutionary Computation，IEEE
  Transactions on Image Processing, IEEE Transactions on Multimedia, IEEE Transactions
  on Systems Man Cybernetics-Systems, IEEE Transactions on Intelligent Transportation
  Systems, IEEE Computational Intelligence Magazine, IEEE Transactions on Circuits
  and Systems for Video Technology, Information Sciences, CVPR, ICCV等国内外顶级期刊和会议发表论文100余篇,
  授权国内发明专利50余项。'
