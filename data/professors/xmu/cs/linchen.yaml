bio_raw: '研究方向为AI4Science。近五年以通讯作者在Nature Machine Intelligence、Nature Communications和人工智能旗舰期刊会议发表论文70余篇。主持国家自然科学基金重点项目、福建省杰青项目。以通讯作者获得NeurIPS
  2024最佳论文奖亚军，ICIC 2024最佳论文奖。获得IEEE青年科学家，河南省科技进步一等奖，自动化学会自然科学奖、福建省自然科学奖等。算法在支付宝、手机淘宝，蚂蚁在线诊疗、OceanBase数据库系统，OpenGauss数据库系统、福建电网数据系统实际部署，产生直接经济效益数十亿元。

  【~~~~~~~~~~~~~~~~~~~~~报考必看~~~~~~~~~~~~~~~~~~~~~】

  我相信有资格保研/能考研厦大成功的同学都非常优秀！

  我更知道我对每个研究生都是倾注心血培养的。近年来，我课题组的每个硕士研究生毕业时都手握2篇或以上子刊/顶会论文，无论他们是什么本科背景。

  我在十多年和同学合作的经验中发现，只有个人态度和投入时间是决定研究生学术成果的唯二因素。研一开学前是否进行了有效科研启蒙是关键变量。

  我至今没有办法预判和防止同学海投放鸽子，对双方时间和精力都是很大的浪费。

  综上原因，2026年我招生不进行面试。

  请有意报考的同学，务必首先访问我课题组主页

  https://xmudm.github.io/

  了解详细信息。

  在确认（1）对我的研究方向感兴趣，（2）个人/家长/男女朋友/老师等接受厦门这个城市和厦门大学这个学校，（3）愿意直接开始线上学习，之后再邮件联系我。

  我如果回信，代表我保证有空余名额。我不会维持候选人池，不会进行考核，会直接让博士生同学指导你开始科研。

  我如果没有回信，代表已经没有名额，或者名额被暂时占用（考虑到无论怎么做，应该都避免不了有人中途退出）。如果你过一段时间对我课题组还感兴趣，可以再联系我。'
