bio_raw: '卢杨，博士，现为厦门大学信息学院计算机科学与技术系长聘副教授，博士生导师，人工智能研究院双聘导师，

  福建省优秀青年基金获得者，小米青年学者，福建省高层次人才B类，IEEE高级会员。

  2012年和2014年分别获得澳门大学软件工程专业本科和硕士学位。2019年获得香港浸会大学计算机科学专业博士学位，师从张晓明教授和唐远炎教授。

  目前已发表高水平论文60余篇，其中30余篇发表在人工智能和计算机视觉CCF-A类刊物如CVPR、NeurIPS、ICCV、AAAI、IJCAI、MM等。主持国家自然科学基金重点项目课题、面上项目、青年项目及中英合作交流项目、福建省优秀青年基金、福建省新型智库重大课题、福建省自然科学基金面上项目、之江实验室开放课题等多个项目。任中国图象图形学学会厦门会员活动中心秘书长、中国图象图形学学会机器视觉专委会委员、福建省新时代国家安全研究中心研究员、国际知名期刊IEEE
  Transactions on Emerging Topics in Computational Intelligence责任编委（Associate Editor）。获ACM厦门分会新星奖、智能优化领域重要会议DOCS
  2024最佳论文奖。

  目前主要研究方向为面向开放世界的可信人工智能算法，包含长尾学习、联邦学习、噪声标签学习、持续学习等机器学习前沿领域，以及在视觉工业质检场景中的应用。

  招收硕士生和对科研感兴趣的本科生，欢迎对深度学习、计算机视觉以及相关领域有兴趣的同学联系我。

  - 有意加入课题组的本科生，请查看

  本科招生简章

  ；有意加入课题组的硕士生，请查看

  硕士招生简章

  。

  - 27级硕士生名额已满。28级信息学院、人工智能研究院硕士（面向夏令营、预推免）仍有少量名额，请尽早与我联系（夏令营每年2-5月联系较为合适）。

  - 未在邮件中注明“已了解招生简章并愿意接受考核”的均不予回复。

  - 长期招收博士后。

  更多信息请查看

  个人主页

  。'
