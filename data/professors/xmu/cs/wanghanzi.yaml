  【个人简介】

  王菡子，福建省“闽江学者”特聘教授（厦门大学），福建省引进高层次创新人才，博士生导师；厦门大学

  模式分析与机器智能研究中心

  主任，福建省

  “智慧城市感知与计算”重点实验室

  副主任

  ;

  2004

  年获澳大利亚

  MONASH

  大学博士学位，并荣获

  Douglas Lampard

  最佳博士论文奖

  。

  2004

  至

  2006

  年在澳大利亚

  MONASH

  大学电子计算机系统工程系工作，任该系研究员（

  Research Fellow

  ）；

  2006

  至

  2008

  年在美国

  JOHNS HOPKINS

  大学计算机科学系工作，先后任该系博士后研究员（

  Postdoctoral Fellow

  ）和助理研究科学家（

  Assistant Research Scientist

  ）；

  2008

  至

  2010

  年在澳大利亚

  Adelaide

  大学计算机学院工作，任职高级研究员（

  Senior Research Fellow

  ）；

  2010

  至

  2012

  年在澳大利亚

  Adelaide

  大学计算机学院任兼职教授（

  Adjunct Professor

  ）。

  2010-2013

  年分别入选（获得）福建省“闽江学者”特聘教授、厦门市杰出青年科技人才创新计划项目、厦门市重点引进人才和福建省引进高层次创新人才；

  2014

  年获得厦门大学厦航奖教金（科研类），

  2018

  年获得厦门大学萨本栋讲座教授奖教金。主要研究方向：计算机视觉和模式识别，图像和视频处理，视频跟踪，视觉大数据分析与深度学习，鲁棒统计学和模型拟合，目标检测，目标与人脸识别，行人识别，视觉内容理解，运动估计与分割，三维重构等。在国内外重要学术期刊和国际学术会议上已发表论文

  100

  余篇，其中，多篇发表在国际顶级期刊

