bio_raw: '苏强，信息学院副教授、博导，入选福建省百人计划、厦门大学南强青年拔尖人才计划。博士毕业于香港城市大学，历任香港中文大学副研究员，美国波士顿大学与阿联酋

  MBZUAI

  访问研究员。

  主要研究方向包括智算网络、机器学习系统等。近五年在本领域著名国际期刊和会议发表论文十余篇，包括

  ACM SIGCOMM、ACM ASPLOS、USENIX NSDI、USENIX ATC、IEEE ToN

  等顶尖国际学术会议和期刊。主持国家科技部重大专项子课题与多项产学合作项目，曾参与多项香港研究资助局（

  RGC

  ）项目。担任

  IEEE ToN

  、

  IEEE TMC

  等顶级期刊的评审专家。

  常年招收

  硕士生、博士生和对科研感兴趣的本科生

  ，欢迎对

  计算机网络

  和

  机器学习系统

  有兴趣的同学联系我，来信请附上简历。希望你拥有

  1

  ）自驱力，对做有价值的事情有热情，能保证时间投入；

  2

  ）良好的沟通能力和对事物的好奇心，例如善于提出问题；

  3

  ）良好的计算机网络与操作系统基础，较强的数学或编程能力，例如至少熟练掌握一门编程语言（

  python

  、

  C++

  、

  C

  等）；

  4

  ）由于课题组长期与海内外顶尖学术机构保持密切学术合作，良好的英语沟通与协作能力是加分项。

  工作经历：

  副教授，信息学院，2025年12月至今

  助理教授，信息学院，2025年5月-2025年12月

