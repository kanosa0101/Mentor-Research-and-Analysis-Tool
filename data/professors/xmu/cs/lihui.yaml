bio_raw: '关于我最新的信息及发表的论文可查看我的主页：

  https://lihui.info/zh

  。

  李辉，现任厦门大学

  信息学院

  计算机科学与技术系副教授，同时为

  媒体分析与计算实验室（MAC实验室）

  成员。我于

  香港大学

  获得计算机科学博士学位。我的研究兴趣为认知与决策，领域主要涉及大语言模型、信息检索、数据挖掘和推荐系统。我近期的主要研究课题包括：

  （1）大语言模型（智能体、RAG增强的代码智能）

  （2）推荐系统（大语言模型技术增强的推荐系统、生成式推荐系统）

  （3）信息检索（生成式信息检索、代码检索）

  主持人工智能国家重大专项子课题、国自然面上/青年基金、CCF-腾讯犀牛鸟基金、CCF-蚂蚁绿色计算专项科研基金、腾讯微信犀牛鸟专项研究计划等多项'
