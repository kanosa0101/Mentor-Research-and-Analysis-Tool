bio_raw: 男,从事理论计算机科学、形式化方法、软件正确性验证等研究，尤其关注人工智能模型/神经网络的正确性验证与修复。在 CAV、ASE、TSE、NeurIPS、ICSE、TQC、TAC、IJCAI、TKDE、SCP、ISSTA
  等多个顶级期刊/会议发表多篇论文，担任 IJCAI、SEKE、TAMC、TASE 等国际会议的 PC。国防科技大学优秀骨干教师，为本科生、研究生讲授《计算理论》、《抽象代数》、《离散数学》、《数理逻辑》、《程序设计》等课程，出版教材3部。wwliu@nudt.edu.cn
