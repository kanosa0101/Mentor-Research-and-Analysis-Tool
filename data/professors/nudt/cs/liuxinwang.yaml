bio_raw: 男,国家自然科学基金杰出青年基金（2023年）、优秀青年基金（2019年）获得者。主要研究兴趣包括机器学习、数据挖掘等。以第一或通讯作者发表CCF-A类期刊/会议论文200余篇，包括IEEE
  TPAMI论文23篇，含3篇独立作者。ESI高被引论文12篇。谷歌学术引用2万余次，入选2022年-2024年度全球2%顶尖科学家榜单。担任IEEE TNNLS、IEEE
  TCYB、Information Fusion等期刊AE及ICML、NeurIPS等顶会的资深程序委员/领域主席。部分研究成果获吴文俊人工智能自然科学一等奖（2024年，排1）、北京市科技进步一等奖（2024年）、两次获得湖南省自然科学一等奖（2014年和2021年）、中国图像图形学会自然科学二等奖（2024年）等。xinwangliu@nudt.edu.cn
