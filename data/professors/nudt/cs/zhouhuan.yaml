bio_raw: 男,计算机学会高级会员，CCF互联网专委会和区块链专委会执行委员，CCF OpenAIOps智能运维社区联合发起人之一，主要研究方向为网络技术与分布式系统，包括云/边缘计算、下一代网络、智能运维等。目前担任国际知名期刊《Journal
  of Cloud Computing》的副主编以及多个国际会议的程序委员会委员。在INFOCOM、FGCS、ICSOC、ICPP等网络及分布式系统旗舰会议和期刊上发表论文20余篇。huanzhou@nudt.edu.cn
