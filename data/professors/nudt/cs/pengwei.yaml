bio_raw: 男,长期从事网络技术与网络安全相关技术研究，研究兴趣包括网络算法与网络协议设计、人工智能技术在网络管控与网络安全中的应用等，曾获全国百优博士论文提名。参与完成国内首台核心路由器的研制，获国家科技进步二等奖1项，军队科技进步二等奖5项，在国际期刊与会议上发表论文100多篇，先后指导毕业研究生60多名，获评湖南省优秀硕论文2篇。15802670901
