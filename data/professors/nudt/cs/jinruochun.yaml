bio_raw: 男,爱丁堡大学信息学博士（数据库理论与系统方向），研究方向为大数据管理、大模型数据应用、数据质量。近年来通过融合逻辑推断和概率学习开展数据管理研究，发表CCF推荐A类论文20余篇，其中SIGMOD、VLDB等数据库顶级会议期刊论文15篇，主持国家自然科学基金青年基金项目等。担任CCF数据库专委会执行委员，2025年入选
  “中国计算机学会青年人才托举工程”（同年全国前5，中国科协第十届青年人才托举工程支持）。主讲本科专业必修课《数据科学与大数据基础》，课堂教学质量获评校级优秀。学术主页：https://ruochunjin.github.io/jinrc@nudt.edu.cn
