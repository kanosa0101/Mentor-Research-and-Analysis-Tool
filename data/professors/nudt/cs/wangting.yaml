bio_raw: 男,入选教育部新世纪优秀人才支持计划和高校计算机专业优秀教师奖励计划。主要研究领域为人工智能、自然语言处理等。主持多项​国家重点研发计划、国家自然能科学基金课题。​获得国家级教学成果二等奖、部委级科技进步二等奖各1项。在IPM、AAAI等国内外期刊会议发表论文100余篇。​
