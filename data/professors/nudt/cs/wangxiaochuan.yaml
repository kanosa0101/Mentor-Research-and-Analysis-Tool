bio_raw: 男,主要从事新一代云原生计算技术、大数据智能计算技术、泛在操作系统技术等基础软件领域的研究工作。主持和参与国家级课题10余项，研发云边端协同操作系统、柔性抗毁云原生服务框架、容器安全软件，获省部级科技进步一等奖2项、二等奖4项。wangxiaochuan@kylinos.cn
