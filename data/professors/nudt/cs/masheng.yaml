bio_raw: 男,国家青年人才计划、湖南省领军人才计划、湖南省杰出青年基金获得者。主要从事计算机体系结构、人工智能加速器、高性能微处理器设计研究工作。获军队科技进步一等奖1项、教育部自然科学二等奖1项（第一完成人）和湖南省自然科学二等奖2项，获CCF优秀博士论文奖、全军优秀博士论文奖。在ISCA、TC等A类期刊或会议发表论文二十余篇，指导或协助指导的多名研究生获省部级优秀学位论文奖励。masheng@nudt.edu.cn
