bio_raw: 男,中国计算机学会互联网专委会副主任、杰出会员，长期从事智能网络、空天网络、网络安全大数据分析、无人系统、算网融合等方面研究，主持国家自然科学基金重点/面上、国家重点研发等课题十余项。获省部级科技进步一等奖1项、二等奖2项，出版专著2部，授权发明专利20余项。受邀担任多个CCF推荐国内外学术会议程序委员会主席、委员等，指导学生在ACM/IEEE
  Trans等国内外知名期刊和会议上发表论文100余篇、多次获学科竞赛一等奖等。bkzhao@139.com
