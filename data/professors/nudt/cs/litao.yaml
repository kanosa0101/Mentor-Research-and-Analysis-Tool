bio_raw: 男,系所副主任，长期从事高性能网络芯片与系统、智算网络以及及基于智能的网络安全技术研究，国防科工局某领域专业组成员，入选省部级人才计划2项，国家人工智能重大科技专项首席，主持国家及军队重大项目10余项。在TCAD、TC、计算机学报等国内外高水平会议刊物发表学术论文30余篇，牵头出版专著1部、授权专利20余项、获国家科技进步二等奖1项、军队及省部级科技进步一等奖4项、通信学会技术发明一等奖1项。taoli_network@163.com
