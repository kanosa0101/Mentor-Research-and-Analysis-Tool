bio_raw: 男,长期致力于高性能微处理器和超大规模集成电路设计领域的研究工作，主要研究方向包括机器学习/大语言模型辅助的集成电路物理设计、集成电路设计自动化（EDA）技术、片上网络设计等前沿领域。主持/参与国家级科研项目10余项。作为核心骨干参与研制了10余款飞腾系列高性能微处理器，已在关键领域得到广泛应用。获省部级科技进步一等奖1项、自然科学二等奖1项，军队科技进步二等奖2项。授权国家发明专利10余项，发表高水平学术论文20余篇，其中2篇论文进入ESI前10%层次。指导学生在集成电路相关竞赛中屡获佳绩（国一2项，国二1项，国三1项）。CCF高级会员、CCF计算机工程与工艺专委执行委员。fengchaochao@nudt.edu.cn  13517475147
