bio_raw: 男,主要从事智能SOC芯片研制和集成电路抗辐照技术研究。作为负责人主持重大专项等项目10余项，作为副总设计师、主任设计师参与重大专项等项目10余项，获国家科技进步二等奖1项（排名2）、军队科技进步一等奖2项（排名3、5）、湖南省技术发明一等奖1项（排名2）、2024年度国防科技大学重大科技进展（排名1）、2024年度国防科技大学奋进一流突出贡献个人，发表SCI论文60余篇，获授权专利50余项，培养研究生20余名。liangbin110@126.com
