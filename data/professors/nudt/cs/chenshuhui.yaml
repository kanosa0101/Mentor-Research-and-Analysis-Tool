bio_raw: 男,系主任，博士生导师。长期从事网络安全检测、移动网安全分析、网络空间测绘、网络安全应用加速方向研究。获国家科技进步二等奖1项，省部级科技奖励一等奖3项，二等奖2项。指导培养博士硕研究生60余名，主持国家重点研发计划、国家自然科学基金等科研项目十余项，在国际国内顶级期刊会议上发表论文100余篇，相关成果获得广泛推广应用。shchen@nudt.edu.cn
