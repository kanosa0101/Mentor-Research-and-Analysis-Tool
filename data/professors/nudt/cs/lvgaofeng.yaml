bio_raw: 男,主要从事新型网络体系架构与可编程路由交换、空间智算网络和网络空间安全等关键技术，以及网络处理器和硅基光交换芯片等研究，主持国家自然科学基金和重点研发等科研项目6项，多次承担重点工程，获国家科技进步二等奖1项、省部级科技进步二等奖3项，发表学术论文20多篇，指导研究生16名。13875985323
