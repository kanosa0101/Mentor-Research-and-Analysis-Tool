bio_raw: 男,从事智能计算和高性能微处理器的研究。曾为加拿大多伦多大学访问学者。承担国家级等项目20余项，曾获国家科技进步二等奖1项，部委级奖6项。在SCI一区TOP
  IEEE TRGS等期刊上发表论文70余篇，获授权专利30余项。培养博士生20余人、硕生60余人，指导5名硕获全军与湖南省优秀学位论文、国家示范性软件学院成立十周年“十佳研究生”，2名博士获国家奖学金。pyx@nudt.edu.cn
