bio_raw: 男,长期从事高性能计算、智能计算与大数据、信息安全等方向教学科研工作，牵头研制了新一代天河超级计算机、麒麟操作系统、飞腾微处理器、玉衡网络设备等。入选国家级人才计划、湖南省人才计划、教育部新世纪优秀人才支持计划；获得中国青年科技奖、中国科协“求是”奖，享受国务院政府特殊津贴。获国家科技进步特等奖1项、一等奖1项，国家科技进步创新团队奖1项，全国创新争先奖牌1项，国家级教学成果二等奖1项；获军队/省部级科技进步一等奖6项，省教学成果特等奖1项。
