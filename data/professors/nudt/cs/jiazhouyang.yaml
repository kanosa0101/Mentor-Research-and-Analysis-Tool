bio_raw: 男,从事系统软件和软件可靠性领域研究，主持国自科等项目4项，作为核心技术骨干参与多项国家和军队重大项目。在ICSE、FSE、ASE等CCF推荐A类高水平会议期刊发表论文20余篇，获ICSE'23/25等杰出论文奖5次，申请和授权专利10余项。获军事科技进步一等奖1项、湖南省计算机学会科技进步二等奖1项。入选中国科协青年人才托举工程、全军优秀博士论文奖、CCF优秀博士激励计划提名、湖南省湖湘青年英才、学校高层次创新人才。jiazhouyang@nudt.edu.cn
