bio_raw: 男,中国工程院院士，长期从事高性能计算机系统软件与通用操作系统的科研工作。参加了银河2到银河5四代巨型机的研制，主持了天河一号、天河二号、麒麟操作系统的研制。获国家科技进步特等奖1项、一等奖3项；部委级科技进步一等奖8项。获光华奖、中国青年科技奖、“求是”奖、中国计算机学会王选奖、“万人计划”领军人才，获全国创新争先奖。shanshanli@nudt.edu.cn
