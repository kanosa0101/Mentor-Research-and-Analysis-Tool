bio_raw: 男,获军队育才银奖，学校信息安全专业课程首席教授，省一流本科课程负责人，全国大学生信息安全竞赛优秀指导教师。主要从事信息安全、人工智能安全与安全人工智能研究，主持国家自然科学基金重大项目等科研项目7项。获省部级科技进步二等奖1项，三等奖2项、国家级教学成果一等奖2项，省部级奖4项。发表论文90余篇，出版教材2部，获技术发明专利授权和软件著作权10余项，培养研究生40余名，获校级、省级优秀硕学位论文。担任AAAI、IJCAI等的分会主席和PC。wtzhao@nudt.edu.cn
