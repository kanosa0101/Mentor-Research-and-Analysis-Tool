bio_raw: 女,从事高性能计算机系统结构、高性能互连网络、高性能评测与优化等方向的研究，获省技术发明特等奖1项、军队科技进步一等奖2项；发表学术论文50余篇，授权发明专利50余项（含国际专利4项），计算机软件著作权和集成电路布图设计10余项，主持多项国家和军队级项目，《计算机工程与科学》青年编委，Journal
