bio_raw: 男,长期从事计算机体系结构、确定性以太网等方面研究，作为技术负责人主持时间敏感网络开源项目OpenTSN、时间敏感网络芯片以及相关设备的研发。先后主持国家自然科学基金、国防基础科研项目、科技委基础加强重点研究项目等多项，发表论文40余篇，含CCF
  A类顶级会议/期刊10余篇，获批国家发明专利十余项。指导研究生多次获得计算机类学科竞赛奖项。w.quan@nudt.edu.cn
