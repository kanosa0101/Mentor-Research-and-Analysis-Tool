bio_raw: 男,国家级青年人才、计算机学会杰出会员；研究方向为：嵌入式系统安全、软件供应链安全、智能漏洞挖掘；主持国家重点研发计划课题3项、国家/省自然科学基金2项、军队预研等项目；在ACM
  CCS、NDSS、USENIX Security、ICSE、TIFS、ToN、软件学报等A类刊物发表学术论文10余篇，牵头出版专著1部、申请专利20余项；指导学生获国家级竞赛一等奖等奖项。科研成果入选国防科技大学十大科技进展，获得湖南省科技进步奖等省部级奖励7项。yubo0615@nudt.edu.cn
