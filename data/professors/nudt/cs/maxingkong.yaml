bio_raw: 男,主要从事面向网络认知安全的大数据分析、自然语言处理、知识图谱、多媒体信息制作、大语言模型等学科前沿方向研究与工程实践,某部大数据与人工智能论证专家，获国家教学成果二等奖1项，军队科技进步一等奖1项，军队教学成果一等奖1项，国防科技大学“优秀新星教师”，主持国家自然科学基金，部委级重大专项、技术领域基金、自主创新研究等7项，培养和协助培养博士、硕研究生30余人，在国际国内顶级期刊会议上发表论文50余篇，授权发明专利10余项，撰写专著2部。maxingkong@nudt.edu.cn;15874159908
