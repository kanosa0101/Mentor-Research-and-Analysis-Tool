bio_raw: 男,中国工程院院士，西藏大学教授、博士生导师，长期从事语言智能、自然语言处理、藏文信息系统与藏文信息标准化等研究，是我国藏文信息处理领域的重要学术带头人。先后主持多项国家级重大科研项目，在藏文编码标准、藏汉机器翻译、藏文文献数字化和国产操作系统藏文支撑等方面取得系列成果；发表论文100余篇，获授权专利30余项。相关成果获得国家科技进步奖二等奖、中国标准创新贡献奖一等奖、何梁何利基金科学与技术创新奖、西藏自治区科学技术杰出贡献奖等重要奖励。同时，他长期扎根西藏高等教育一线，积极推动西藏大学计算机学科建设和本硕博士人才培养体系完善，培养了一批藏文信息技术领域专业人才。niqiongda@163.com
