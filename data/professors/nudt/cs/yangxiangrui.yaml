bio_raw: 男,CCF高级会员，入选省部级青年人才计划。研究方向有高性能可编程网络、在网计算与网络系统安全等，主持科技委某专项、装备预研等科研项目7项，多项成果在部队与地方单位得到应用并取得重要效益；在SIGCOM、NSDI、ToN等会议刊物发表论文20余篇；授权专利10余项，出版专著2部，获省部级教学成果二等奖1项，军队精品课程1项。指导本科、研究生获国家级A类学科竞赛特等、一等奖5项。yangxiangrui11@nudt.edu.cn
