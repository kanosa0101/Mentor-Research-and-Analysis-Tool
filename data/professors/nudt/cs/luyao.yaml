bio_raw: 男,长期从事群智软件工程、软件演化和群体化学习领域研究工作和软件工程、程序设计的教学教改和人才培养工作，在ICSE、TSE、ICSME、JSEP等高水平会议和期刊上发表论文30余篇，主持起草发布了木兰开放作品许可协议，作为平台技术负责人研发的群体化学习平台知士荟在10余所高校得到推广和应用，参与主讲的《软件工程》课程获军队精品课程。luyao08@nudt.edu.cn
