bio_raw: 女,主要从事计算机系统结构和人工智能加速技术研究，主持或参与国家科技重大专项、军队重大专项、基础加强等项目近30项，作为主任设计师完成多项相关智能计算机系统研制。获省部级一等奖、二等奖、三等奖各1项，湖南省教学成果特等奖1项，全国优秀教材奖1项。曾为国家级精品课《计算机原理》和《计算机体系结构》主讲教师，荣获三等功、研究生教学优秀奖、优秀硕论文指导教师奖等。培养研究生30余人，出版教材2部，发表科研论文110余篇，专利软著20余项。jingfeijiang@nudt.edu.cn
