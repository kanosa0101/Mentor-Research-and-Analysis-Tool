bio_raw: 女,军队学科拔尖引进人才，主要从事高性能存储系统研究，重点面向智算应用(大模型、智能体)和超算应用（HPC）设计内存与外存存储系统并优化，曾兼任华为有限公司存储领域专家顾问，主持国家级重点项目课题、国家自然科学基金等项目10余项，发表学术论文100余篇（CCF-A类论文35篇），获得重庆市科技进步一等奖，重庆市学术带头人后备人选等荣誉。15523846098
