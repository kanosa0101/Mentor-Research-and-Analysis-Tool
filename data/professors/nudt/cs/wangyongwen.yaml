bio_raw: 男,主要研究方向为高性能微处理器体系结构及其实现技术、敏捷芯片设计方法。天河工程副总设计师，国家级科技创新领军人才。承担飞腾系列CPU芯片研制，主持国家和省部级科研项目10余项。获首届全国创新争先奖牌、国家科技进步特等奖1项、国家科技进步一等奖1项、省部级科技进步一等奖4项。出版专著1部，授权发明专利100余项，发表论文120余篇，培养研究生40余名。yongwen@nudt.edu.cn
