bio_raw: 女,中国计算机学会计算机工程与工艺常务委员、CCF高级会员，长期从事高性能网络芯片与系统、智能装备平台网络、算网融合等方面研究，主持和参与国家自然科学基金重点、国家重点研发等课题十余项。获国防科技进步一等奖1项、湖南省高等教育教学成果一等奖1项，中国通信学会技术发明一等奖1项，中国发明协会一等奖1项，出版专著2部，授权发明专利30余项，发表学术论文30余篇。践行强军目标标兵，军队优秀专业技术三类人才.yanghui@nudt.edu.cn
