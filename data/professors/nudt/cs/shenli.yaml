bio_raw: 男,主要研究方向包括高性能处理器和加速器体系结构、存内计算、高性能计算等。中国计算机学会杰出会员、体系结构专委会执行委员、湖南省计算机学会常务理事，“计算机体系结构”湖南省优秀研究生导师团队核心成员。主持和参加国家科研项目10余项，在HPCA、Micro、DAC、TC、TPDS、TCAD、TACO等CCF
  A、B类期刊会议上发表论文40余篇。获得获国家教学成果二等奖2项、省部级教学成果一等奖3项、省部级科技进步二等奖2项、教育部自然科学二等奖、湖南省自然科学二等奖2项。lishen@nudt.edu.cn
