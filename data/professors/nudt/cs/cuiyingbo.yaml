bio_raw: 男,公派哈佛大学留学，入选湖南省青年人才计划，学校青年创新奖获得者，学校人才培养对象。长期从事高性能计算、人工智能、生物信息等研究工作。主持国家自然科学基金、国防科工局、省校级人才项目等多个课题，发表Nature子刊、中科院一区、中国计算机学会A类等高水平论文40余篇，其中多篇为国防科大首篇，担任Nature
  Communications、Nucleic Acids Research、IEEE TPDS等顶级期刊审稿人以及IEEE BIBM等CCF推荐国际会议程序委员会委员，获发明专利授权10余项。独立或协助指导硕博士研究生20余人（1人直博士，1人提前攻博士，1人申请审核转博士），多人获国家奖学金、优秀毕业生、校优秀学员、优秀学生干部等荣誉。15116312064
