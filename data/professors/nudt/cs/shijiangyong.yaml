bio_raw: 男,CCF高级会员，计算机安全专委会、教育专委会、网络与系统安全专委会执行委员，主要研究方向为云计算等新型计算系统安全、人工智能安全、网络安全靶场与仿真，主持和参与国家自然科学基金、军内科研项目等8项，发表论文30余篇，获批专利8项，获军事科技进步奖1项。长期从事网络安全教学工作，担任教育部虚拟教研室建设项目专家组秘书，主持国家级教育研究课题2项，获军队精品课程1门，湖南省一流课程2门，CCF首届教学成果案例和湖南省教学成果二等奖等教学奖励5项，CCEC、CPEC教学案例一等奖等10余项，国防科技大学优秀教师。shijiangyong@nudt.edu.cn
