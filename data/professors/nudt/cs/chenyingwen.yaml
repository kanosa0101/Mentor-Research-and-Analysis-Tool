bio_raw: 男,军队院校育才奖银奖获得者，网络技术课程团队首席教授，全国高校绿色计算创新大赛优秀指导教师，全国大学生信息安全竞赛优秀指导教师，获省级教学成果一等奖1项、二等奖2项。从事高性能网络、分布式智能计算等相关领域的研究，主持或参研各类项目10余项。在CVPR、TSC等会议及期刊发表论文80余篇、ESI高被引论文1篇、国际会议最佳论文2篇。ywch@nudt.edu.cn
