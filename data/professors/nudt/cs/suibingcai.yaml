bio_raw: 男,主要从事通用处理器设计、高性能算法专用加速设计、AI智能加速、大数据等方面的研究。中央处理器核心主任设计师，中国计算机学会高级会员，项目管理协会（PMI)认证项目管理专业人士（PMP），参与研制10余款飞腾系列微处理器，主持和参与10余项国家及军队项目，获国家科技进步一等奖1项，省部级二等奖1项。在国内外期刊和会议上发表学术论文20余篇，其中CCF
  A类论文多篇，授权专利60余项。培养学生多次获集成电路创新创业大赛赛区一等奖和全国特等奖。bingcaisui@nudt.edu.cn
