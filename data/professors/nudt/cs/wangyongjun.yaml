bio_raw: 男,网络空间安全学科专业带头人，主要从事基于智能的网络与计算系统安全、网络信息系统漏洞智能分析、认知域智能分析等方向研究。主持国家自然科学基金等国家级科研项目20余项，获国家科技进步二等奖1项，省部级科技进步一、二等奖10项，国家教学成果二等奖2项，省部级教学成果一、二等奖5项。授权发明专利14项、软件著作权4项。发表高水平论文100余篇，指导硕博士研究生60余名，毕业50余名。获国务院政府特殊津贴、军队育才奖，国家级一流课程、军队精品课程主讲教师，国防科技大学优秀教师。wangyongjun@nudt.edu.cn
