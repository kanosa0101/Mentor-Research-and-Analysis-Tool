bio_raw: 男,中国计算机学会理论计算机专委会秘书长。长期从事网络安全、大数据分析、人工智能等方向的教学与科研工作，在国际顶级期刊和会议上发表论文120多篇，被引用6000多次，14篇成为ESI高被引论文。获国际会议“最佳论文奖”5次，授权国家发明专利13项。获得“湖南省自然科学一等奖”（第1完成人）、省科技进步二等奖、省自然科学二等奖、国家级教学成果二等奖、军队教学成果一等奖、湖南省教学成果一等奖和军队科技进步奖等教学科研奖项。被评为“国防科大优秀教师”，入选湖南省人才计划。zpcai@nudt.edu.cn
