bio_raw: 男,国家级领军人才，国家优青、教育部青年长江学者、军队学科拔尖人才，湖南省科技创新领军人才，获邓稼先青年科技奖，湖南省自然科学一、二等奖，在Nat.
  Mater. PRL、Nat. Commun.和Light等发表SCI论文110余篇，任MRE,Physica Scripta，高压物理学报学术期刊编委，中国物理学会“四刊”青年编委，全国高压物理专业委员会委员，全国光学青年论坛副主席，锕系物理与化学学会理事。从事人工智能驱动的极端条件物质结构和半导体物理研究，发展激光与半导体相互作用实验和理论研究方法。jydai@nudt.edu.cn
