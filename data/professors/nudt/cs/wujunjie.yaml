bio_raw: 男,长期从事量子计算研究，量子计算方向学术带头人。主持研制成功银河鲲腾QW2020、银河鲲腾VQS16量子计算系统和银河鲲腾H1量超融合计算系统，在Science
  Advances、Physical Review Letters、National Science Review等发表论文。获湖南省自然科学一等奖、湖南省量子科技一等奖，入选湖南省科技创新领军人才，享受国务院政府特殊津贴。指导的多名学生获得全军优博士、湖南省优博士、CCF量子计算专委优博士、全军优硕等。junjiewu@nudt.edu.cn
