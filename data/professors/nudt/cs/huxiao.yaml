bio_raw: 男,长期从事DSP处理器和加速器体系结构、调测试与应用技术研究，多域综合提升处理器可靠性、可测性和可调性。主持/参与国家级科研项目10余项。研制20余款飞腾系列处理器，广泛批量应用。获国家科技进步二等奖1项，省部级科技进步一等奖5项。发表学术论文50余篇，出版专著3部，培养研究生20余名。目前研究方向：AI辅助嵌入式系统自动设计，基于AI的微处理器自动调测试及可靠性。xiaohu@nudt.edu.cn  hu.xo@163.com
