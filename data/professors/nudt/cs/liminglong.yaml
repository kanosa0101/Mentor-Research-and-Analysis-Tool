bio_raw: 男,主要从事强化学习、多智能体、具身智能等研究，近年来在AAAI、IJCAI、KDD、ICSE、ICRA、IROS、AAMAS等人工智能和机器人领域的顶会顶刊发表论文2０余篇，专利７项。作为项目负责人主持国自科青年基金项目1项、校科研１项。获国防科技大学第九届青年创新奖一等奖。主讲本科生课程《计算机程序设计》、《无人系统》。liminglong10@nudt.edu.cn
