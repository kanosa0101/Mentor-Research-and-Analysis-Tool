bio_raw: 男,从事高性能计算机系统体系结构研究，主要研究方向为超算系统智能运维、并行存储、监控管理等。担任天河工程副总设计师，获军队科技进步一等奖2项、二等奖1项，省科技进步二等奖2项，授权专利及软著30余项，在TPDS、SC等国内外高水平学术期刊会议上发表学术论文60余篇。主持国家重点研发计划、国家自然科学基金、预先研究、综合研究等国家和军队级科研项目/课题5项，参与国家和军队重点项目20余项。13875853342
