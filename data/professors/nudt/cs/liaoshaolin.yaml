bio_raw: 男,已发表人工智能、电磁学、光学等论文逾百篇。曾先后在中国和美国多个机构培养博士研究生，包括美国纽约城市大学（2008-2010）、美国能源部阿贡实验室（2010-2019）、芝加哥伊利诺伊理工大学（2019-2021）、中国广州中山大学（2021-至今）。先后入选多个国家级、省部级、校级人才计划和团队项目带头人，包括中组部引进海外高层次人才、广东省引进海外领军人才、中山大学百人计划领军人才和广东省引进海外创新创业团队带头人。担任多个国际知名期刊副主编、客座主编，包括IEEE传感器精选期刊、IET微波天线和传输、Comuters等特刊客座主编。担任多个学术大会主席，包括：2022深圳首届电子与集成电路技术国际学术会议（EICT
  2022）、2024广州首届智能通信、感知与电磁大会、2024深圳电子通讯与人工智能大会。liaoshalin@mail.sysu.edu.cn
