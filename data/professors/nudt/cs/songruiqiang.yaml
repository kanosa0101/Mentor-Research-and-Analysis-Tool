bio_raw: 男,集成电路设计领域专家，主要从事先进集成电路物理设计与集成，宇航用集成电路辐照效应评估与加固相关研究。主持参研12项国家和军队科研项目，承担“十亿次”至“千亿次”多款芯片研制。获军队科技进步一等奖1项、湖南省优秀博士学位论文奖1项，授权专利10余项，集成电路布图10余项，发表论文20余篇，专著1部。入选学校“卓越青年人才”。songrq07@nudt.edu.cn
