bio_raw: 男,获全国优秀博士学位论文提名奖、河北省优秀博士学位论文奖，中国博士后科学基金特别资助获得者，中国计算机学会（CCF）高级会员，主要从事数据质量控制与数据治理、智能数据分析与应用方面的研究。先后主持国家科技重大专项“核高基”项目1项，省部级重点项目12项，获省部级奖励4项、获2023年中国发明协会发明创业奖创新奖1项、中国电子学会2023年科技进步二等奖1项，授权发明专利20余项，注册软件著作权5项，出版专著3部、译著4部，发表学术论文100余篇，独立或协助指导硕博士研究生20余名。caojj@nudt.edu.cn
