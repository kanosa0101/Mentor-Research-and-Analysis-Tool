bio_raw: 男,从事强化学习、深度学习、高性能计算等方向。主持和参与国家自然科学基金、“核高基”、国防创新特区等项目10余项。在计算机视觉、强化学习、深度学习系统及应用等方面具有丰富的研究和实践经验。在IJCAI、ACM
  MM、JSA等会议期刊上发表50余篇论文，授权专利10余项。rongchunli@nudt.edu.cn
