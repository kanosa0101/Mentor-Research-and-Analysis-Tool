bio_raw: 男,主要研究方向包括人工智能与机器学习、大模型推理优化、智能体操作系统等。近年来共发表高水平学术论文20余篇，其中一作10篇，论文学术总引用1400余次。
  担任包括ICML, AAAI，NeurIPs 等多个国际顶级期刊或会议的高级审稿人。主持或参与了国家重点研发计划、自然科学基金等10余项国家和军队重大项目，省级学会科技进步三等奖1项，荣立三等功一次，申请专利10余项。协助指导博士硕研究生10余人。zhangy@nudt.edu.cn
