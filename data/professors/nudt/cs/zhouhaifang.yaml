bio_raw: 女,国防科技大学教学质量名师，最受欢迎教师，军队育才银奖获得者。主要学术研究方向为智能大数据处理和软件缺陷检测，具体包括高性能图形图像处理、自然语言处理、缺陷修复、智能化软件开发等。作为负责人或主要完成者先后参与银河工程、863计划、国家自然科学基金、创新群体等十余项科研项目的研制，获部委级科技进步二等奖4项、教学成果奖3项。获国家和军队级教学竞赛特等奖和一等奖6项，发表学术论文70余篇，出版学术专著3部、教材3部。长期从事计算机相关专业的本科生和研究生教育工作，获国际ISW和FDW教师资质认证，独立和协助指导硕30余名、博士10余名。haifang_zhou@nudt.edu.cn
