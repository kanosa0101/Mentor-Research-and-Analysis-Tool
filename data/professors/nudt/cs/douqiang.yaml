bio_raw: 男,我国高性能微处理器方向学术带头人之一，长期致力于解决我国集成电路严重依赖进口的“卡脖子”国家重大需求，20多年来突破多项关键技术，为我国自主CPU技术发展做出系统性贡献。作为项目负责人或主要参与人承担发改委、工信部等重大项目10余项，获授权专利63项，发表论文79篇；获国家科技进步特等奖1项、一等奖2项；省部级科技进步特等奖1项、一等奖6项；获“国家卓越工程师”称号、全国创新争先奖章、何梁何利基金科学与技术创新奖；享受国务院特殊津贴；获全国五一劳动奖章、中国科协“杰出求是青年奖”；是中国电子学会常务理事、计算机学会理事。领衔的团队获“科技部重点领域创新团队”、“国资委中央企业优秀科技创新团队”、“全国五一劳动奖状”、“中国青年五四奖章集体”。mark@phytium.com.cn
