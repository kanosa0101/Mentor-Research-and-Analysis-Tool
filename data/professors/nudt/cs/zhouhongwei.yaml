bio_raw: 男,参研飞腾系列多核高性能微处理器20余年，担任片上系统（SoC）负责人、主任设计师。负责研发的多核处理器片上网络用于3代飞腾高性能微处理器，核心专利获得湖南省专利奖一等奖（排名1）。先后获得国家科技进步特等奖1项、一等奖1项，省部级一等奖2项。主要研究方向：基于芯粒（chiplet）的“积木式”微处理器体系结构；CPU与GPU异构芯片Cache一致性；面向2.5D和3D封装的高级处理器存储结构。发表论文50余篇，获专利授权20余项；协助培养博士生1名，培养硕生8名。zhou.hongwei@139.com
