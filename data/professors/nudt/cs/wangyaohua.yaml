bio_raw: 男,长期从事微处理器体系结构相关的科研和教学工作，获IEEE CAL最佳论文并受邀在顶级会议HPCA上作报告，是国内少数在体系结构三大顶级会议ISCA，MICRO，HPCA上都有研究成果发表的青年学者，所指导学生发表包括Security，CVPR，HPCA，TPDS，TACO在内的多篇CCF-A类会议和期刊论文。获省部级科技进步一等奖2项，自然科学二等奖1项，主持湖南省杰出青年基金，湖南省青年人才计划等项目，共发表论文40余篇，获专利授权20余项。nudtyh@foxmail.com  yhwang@nudt.edu.cn
