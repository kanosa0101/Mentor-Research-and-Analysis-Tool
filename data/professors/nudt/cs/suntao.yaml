bio_raw: 男,从事机器学习训练算法研究，学术论文共计被引用1000余次，引用单位包括MIT、Stanford、普林斯顿大学和清华大学等一流研究机构，在国内外同行中形成了一定的学术影响力，以第一作者身份发表CCF-A类论文15篇、IEEE
  Transactions和CCF-B类论文8篇，研究工作受国家自然科学基金、中国科协青年人才托举工程、湖南省杰出青年科学基金资助。曾获得2020年CCF优秀博士学位论文提名奖、2021年湖南省优秀博士学位论文奖、校拔尖人才计划、青年创新奖等。nudtsuntao@163.com
