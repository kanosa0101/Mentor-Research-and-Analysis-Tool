bio_raw: 男,从事自然语言处理、知识计算等方向研究。曾获国家级一流本科课程、国家级教学成果二等奖1项。军队科技进步奖2项，主持和参与国家重点研发计划、自然科学基金等国家军队项目10余项，在AAAI、IJCAI、WWW、SIGIR等会议期刊发表论文40余篇，是WWW、SIGIR、EMNLP等国际会议的PC
  member和多个期刊的特约审稿人，中国计算机学会、中文信息学会多个专委委员。tangjintao@nudt.edu.cn
