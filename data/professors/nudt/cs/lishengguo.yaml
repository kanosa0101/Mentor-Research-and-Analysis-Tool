bio_raw: 男,从事高性能计算和智能计算，研制了代数多重网格YHAMG、底层稀疏迭代和稀疏算子等共性算法库，可用于加速国产工业CAE应用、智能框架的推理等，主持国家自然基金、重点研发、基础加强等项目多项，获军队优秀博士论文，获天津市科技进步特等奖和湖南省自然科学二等奖各1项，在SC、PPoPP、DAC、VLDB、TPDS、TACO、Parco、ICS、ICPP、IPDPS等CCF-A和B类会议/期刊、SIAM等数学期刊发表学术论文30余篇，指导硕生3名，协助指导博士生6名。
