bio_raw: 男,2014年于英国曼彻斯特大学获博士学位，主要从事高性能计算应用研究，聚焦HPC和AI双驱动的生物医药应用方向。2021年牵头负责完成“基于新一代天河超级计算机的新冠药物大规模计算筛选”工作，获2021年国际戈登贝尔新冠特别奖提名，系我国首次；主持国家重点研发计划课题等国家和军队级课题5项。在Nature
  Communications、Nature Protocol、Neuleic Acides Research、Briefings in Bioinformatics等国际知名期刊上发表三十余篇论文；译著2部（执笔100万字以上）。获评军队和湖南省级人才。chengkun_wu@nudt.edu.cn
