bio_raw: 男,长期从事智能基础软件领域研究，主要工作围绕基础软件的设计研发、可靠性增强展开。主持/参与国家重点研发计划、国自科基金等多个项目。发表CCF推荐A/B类论文50余篇，申请专利20余项，学校“高地星光”青年科学家创新俱乐部委员，获CCF优博士、湖南省优青、国防科技大学优秀毕业生。获ACM/IEEE杰出论文奖5次，担任IEEE
  TSE编委，CCS/ICSE/FSE/ASE/ISSTA等国际会议的程序委员会委员。wangshangwen13@nudt.edu.cn
