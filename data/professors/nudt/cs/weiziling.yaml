bio_raw: 男,主要研究方向为网络流量分析、移动网安全、智能安全等，主持和参与国家自然科学基金、国家重点研发计划等项目10余项，担任多个会议论坛主席，在计算机网络和网络安全相关重要期刊和会议发表论文50余篇，其中以第一作者或通信作者在USENIX
  Security、IEEE TDSC、计算机学报等国内外顶级期刊和会议发表论文30余篇，获国际会议最佳论文奖1项，授权专利10余项，获湖南省自然科学二等奖1项、湖南省计算机学会科学技术一等奖1项等，入选国家博士后国际交流计划引进项目、湖南省“芙蓉计划”青年人才、湖南省优博士后、长沙ACM新星奖、国防科技大学青年创新奖等，指导学生获国家级学科竞赛一等奖多项等。weiziling@nudt.edu.cn
