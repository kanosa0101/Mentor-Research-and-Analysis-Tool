bio_raw: 男,首届国家创新争先奖牌和政府特殊津贴获得者，成功研制了十余款高端通用多核CPU和低功耗数字信号处理器。获国家科技进步特等奖、一等奖和二等奖各1项，获军队科技进步一等奖3项，授权发明专利20项，发表论文数十篇，培养博士和硕研究生20余名，带领学生获得近十项电子竞赛国家奖（国一3项，国二4项）。主要从事高性能微处理器、AI加速EDA、3D多芯粒集成设计等研究。zyzhao@nudt.edu.cn
