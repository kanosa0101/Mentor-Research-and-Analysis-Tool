bio_raw: 男,天河2号超级计算机副总设计师。主要从事大规模科学与工程计算、海洋信息工程研究。主持或参与完成以天河超级计算机系统和某全球中期数值天气预报系统为代表的30余项国家和军队重大科研任务和工程型号项目。获国家科技进步特等奖1项，军队科技进步一等奖、二等奖共5项，湖南省科技进步特等奖1项，发表学术论文40余篇。zhu_xiaoqian@sina.com
