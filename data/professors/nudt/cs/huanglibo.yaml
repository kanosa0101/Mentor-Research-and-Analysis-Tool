bio_raw: 男,主要从事处理器芯片、AI加速、大数据系统等方面研究，主持国家与军队课题10余项，获全国优博士提名，入选中国科协青托、湖南省杰出青年基金获得者等，获省部级科技进步一等奖1项，二等奖4项。发表高水平论文100余篇，申请国际与国内发明专利50余项。获湖南省优秀研究生导师团队，指导研究生发表多篇领域顶级论文，入选湖南省优秀硕学位论文指导教师。libohuang@nudt.edu.cn
