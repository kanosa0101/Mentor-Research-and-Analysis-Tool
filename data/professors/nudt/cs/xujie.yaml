bio_raw: 男,从事可信计算及大规模网络软件系统领域研究，现为IEEE SRDS等国际年会的顾问委员及IEEETConBIS的执行理事。主持20多项英国国家级基金及国际研发项目。获得“BCS/AT&TBrendan
  Murphy Prize”和EPSRC的战略性研究平台奖。发表学术论文300余篇，培养博士10余名，硕20余名。Lds1201@163.com
