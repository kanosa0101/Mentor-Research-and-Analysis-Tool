bio_raw: 男,研究方向为智能安全、密态计算与网络安全，在IEEE S&P、TIFS、TSC、TDSC、TKDE、ICCV、ICDE等领域内高水平期刊和会议发表学术论文60余篇，两次入选ESI前1%高被引论文，主持国家自然科学基金、国家重点研发计划项目子课题、国家科技创新2030重大专项子课题、自主创新科学基金重点项目等8项，作为研究骨干参与国家和军队重点项目多项。获得湖南省自然科学二等奖1项，授权专利8项、软件著作权5项，荣立三等功2次。担任TIFS、TDSC、TKDE等顶级期刊审稿人，协助指导博士6人、硕6人。luoyuchuan09@nudt.edu.cn,19892889603
