bio_raw: 女,长期从事操作系统安全、云计算安全、智能计算安全、机密计算等方向研究。中国计算机学会杰出会员、系统软件专委会委员，主持或参与国家级科研项目20余项，获省部级科技进步一等奖3项、二等奖1项。发表高水平学术论文40余篇，以第一/通讯作者发表CCF
  推荐A/B类论文10余篇，申请专利20余项，担任安全顶刊《TDSC》、《计算机学报》等审稿人。指导博士、硕生近二十名，多次获得国家级比赛一等奖、省级研究生创新项目等。yanding@nudt.edu.cn
