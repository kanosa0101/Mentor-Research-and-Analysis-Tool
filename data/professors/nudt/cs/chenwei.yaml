bio_raw: 女,入选军队级、省级人才工程，主要研究方向为计算机系统结构、高性能微处理器设计、人工智能与医疗图像处理等，曾获军队科技进步奖一等奖1项，国家级教学竞赛一等奖2项、二等奖1项，军队级教学竞赛一等奖1项，编撰教材2部。主持国家自科基金、教育部博士点基金、装备预研项目、教育部及湖南省教改课题等多项科研和教学项目。指导多名研究生获校级、省级优秀硕学位论文。近5年，在IJCV、ACM
  Multimedia等重要期刊和会议上发表论文30余篇，申请专利10余项。chenwei@nudt.edu.cn  jizhuchenwei@hotmail.com
