bio_raw: 男,计算机学会高级会员，主要研究漏洞挖掘技术。在PPoPP、JPDC、TSE、USENIX Security、NDSS、IEEE TIFS等CCF
  A类会议和期刊上发表是十余篇学术论文；担任了IEEE Transactions on Computers（TC）、Elsevier Computer & Security、《计算机学报》等期刊的审稿人。以课题负责人的身份主持了国家自然科学基金、军队预研项目、国防973项目（专题）、国家重点研发计划（子课题）等十多项国家和军队级科研项目。长期研究并行漏洞挖掘技术和固件安全性分析技术，带领团队开发了PTFuzzer、UltraFuzz等漏洞挖掘工具，累计挖掘各类软件的0-day漏洞100多个，并被CVE、CNNVD等漏洞库收录。研究成果获湖南省科技进步二等奖和军事科技进步二等奖。13755023003
