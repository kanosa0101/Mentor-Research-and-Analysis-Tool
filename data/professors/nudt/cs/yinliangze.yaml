bio_raw: 男,从事智能化软件工程、软件安全性分析等方向研究，包括模型分析与验证、并行程序分析、嵌入式程序分析、操作系统分析验证、软件漏洞分析利用等。在TOC、TSE、ICSE、ASE、CJ等国际重要期刊会议上发表论文20余篇，协助培养硕研究生10余人，主持和作为骨干参与各类科研项目10余项。yinliangze@nudt.edu.cn
