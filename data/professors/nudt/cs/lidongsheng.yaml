bio_raw: 男,国家杰出青年科学基金获得者、国家优秀青年科学基金获得者，全国优秀博士学位论文等。主持数十项国家级课题，入选教育部新世纪优秀人才计划，获中国青年科技奖、中创软件人才奖。研究方向包括并行与分布式计算、高性能数据中心、分布式机器学习等。发表论文100余篇。获国家科技进步二等奖1项、省部级一等奖2项。lds1201@163.com
