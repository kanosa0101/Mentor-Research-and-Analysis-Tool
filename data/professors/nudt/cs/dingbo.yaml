bio_raw: 男,研究方向为复杂软件系统的构造与演化、人工智能辅助的软件工程等,主持“科技创新2030-新一代人工智能”、国家自然科学基金、科技创新特区等多项重大科研项目/课题。获省部级科技进步一等奖4项、二等奖2项，在包括软件工程、人工智能多个领域顶会在内的期刊和会议发表高水平论文130余篇，出版专著1本，国家专利授权30余项，获评CCF-NASAC青年软件创新奖，湖南省科技创新领军人才。dingbo@aliyun.com
