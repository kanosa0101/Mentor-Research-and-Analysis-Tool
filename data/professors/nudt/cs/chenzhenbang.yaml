bio_raw: 男,入选国家级人才计划，主要从事高可信软件、智能软件工程等方向的研究，获国家科技进步奖二等奖1项，省部级一等奖1项、二等奖2项，获NASAC青年软件创新奖，先后入选学校青年拔尖和领军人才培养对象。在OOPSLA、FM、ICSE、FSE、ISSTA、ASE等软件领域权威会议或刊物发表论文80余篇，获ACM
  SIGSOFT杰出论文奖3次，担任ICSE、FSE、ASE、ISSTA等顶级国际会议的程序委员会委员。指导硕30余名，博士20余名。主持国家或省部级科研项目10余项。zbchen@nudt.edu.cn;13574866832
