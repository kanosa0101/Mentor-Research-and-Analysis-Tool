bio_raw: 女,长期从事高性能互连网络及聚合通信优化的研究。荣立个人三等功1次，获教育部自然科学二等奖1项，中国电子学会自然科学二等奖1项。主持和参与了多项国家、军队级科研项目。在ISCA、TPDS、ICS、JPDC
  等高性能计算领域知名会议与期刊发表论文多篇。中国研究生导师发展共同体优秀导师团队成员，协助指导硕研究生毕业7人。入选湖湘青年英才。leifei@nudt.edu.cn
