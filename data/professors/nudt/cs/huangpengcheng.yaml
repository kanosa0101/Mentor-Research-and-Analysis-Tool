bio_raw: 男,全军优秀博士论文获得者，学校青年创新奖获得者，入选学校青年人才计划，湖南省青年人才计划。主要从事微处理器芯片、AI驱动的电子设计自动化、集成电路物理设计、高性能/低功耗设计、多芯粒IC设计等方面研究等方面研究，主持国家与军队课题6项，作为核心骨干参与‘核高基’等重大项目10余项，参与研制了FT-2000+等高端芯片10款。发表高水平学术论文50余篇，其中IEEE
  Transactions、IEEE letter顶刊论文10余篇，申请发明专利20余项，独立或协助指导研究生10余人。huang.pc20@nudt.edu.cn
