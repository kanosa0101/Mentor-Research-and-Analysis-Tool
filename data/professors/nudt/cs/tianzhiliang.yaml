bio_raw: 男,中国科协青年托举工程获得者，某国家级人才引进项目获得者（全军2名/年）。致力于人工智能、大模型、自然语言处理、多模态、舆情安全相关研究。近五年，发表CCF-A类/中科院一区一作/通讯论文20余篇，以第一发明人获专利授权20余项。获百度最高奖、微软学者提名、百度奖学金全球40强。任ACL/EMNLP/NAACL/NLPCC领域主席。主持国自科等多项国家级项目，主持某重点项目课题，任某重点工程副总师。指导学生获湖南省本科生自科基金、多项最佳演示论文奖，多项国际评测冠军、多项校级优秀本科毕设。tianzhiliang@nudt.edu.cn
