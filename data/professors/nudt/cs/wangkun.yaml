bio_raw: 男,长期从事量子计算和量子信息方向理论研究。南京大学计算机学士、博士，悉尼科技大学联合培养博士生，前百度资深研究员。青年科技英才引进人才,国家科技重大专项课题负责人、国自然青年科学基金项目（C类）负责人。在
  TIT、PRL、PRX Quantum、npj QI 等国际顶级期刊发表论文 30 余篇，申请国内外量子计算技术专利 50 余项，领导研发开源噪声处理工具集QEP。nju.wangkun@gmail.com
