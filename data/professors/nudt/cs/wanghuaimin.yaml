bio_raw: 男,中国科学院院士，软件工程学科带头人，从事分布式软件系统、群体智能、群体化软件开发方法等方向的研究工作，在分布计算理论、模型和技术方面取到系统性创造性成果，获国家科技进步特等奖1次、二等奖2次、技术发明二等奖1次。发表论文200余篇，获授权专利40余项。whm_w@163.com
