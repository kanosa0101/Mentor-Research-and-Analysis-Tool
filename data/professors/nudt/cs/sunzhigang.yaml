bio_raw: 男,长期从事高性能网络交换和实时网络技术研究。主要研究兴趣包括时间敏感网络（TSN）及其在航空航天、汽车和工业控制等领域中的应用技术，是开源项目OpenTSN的发起者和主要推动者。获新世纪优秀人才支持计划资助；获国家科技进步特等奖1次，国家科技进步二等奖2次，部委级科技进步一等奖1次，二等奖5次。13875903721
