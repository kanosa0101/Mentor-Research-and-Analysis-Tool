bio_raw: 男,长期从事处理器芯片设计工作，主持核高基、国自科基金等10余项项目。担任天河/银河工程项目主任设计师，负责核心加速芯片的研制。担任飞腾DSP工程副总设计师。获教育部科技进步一等奖1项（1）、国家科技进步二等奖1项（9）、军队科技进步一等奖2项（9、13）、国防科技大学领军人才、国防科技大学四有先进个人、天河工程突出贡献个人等。发表论文40余篇，授权专利40余项。liusheng83@nudt.edu.cn
