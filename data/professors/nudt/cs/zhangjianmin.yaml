bio_raw: '男,银河/天河项目主任设计师，主要研究方向为Ai加速芯片设计与验证。主持2项国家自然科学基金项目，主持1项国家重点研发计划课题，主持1项国家实验室重大攻关项目、主持1项国家重点实验室基金项目，参与近20项国家重大项目的研制任务。研究成果获军队科技进步一等奖2项，省部级一等奖1项；授权国家发明专利30余项。在国内外高水平期刊或国际会议发表学术论文80余篇。13786126649

