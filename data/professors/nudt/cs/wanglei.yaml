bio_raw: 女,长期从事微处理器体系结构、类脑计算和智能芯片相关的研究。作为骨干参与多代飞腾处理器的研制，带领团队研发多代类脑处理器、配套工具链和类脑算法，可应用于视觉、听觉、导航、运动控制等领域，为下一代人工智能技术奠定基础。带领团队发表类脑计算相关论文约200篇,目前方向类脑芯片架构、类脑芯片编译、类脑算法与应用、LLM4chip等。紧密合作培养单位包括军事科学院、启元实验室、清华大学、上海交大等。leiwang@nudt.edu.cn
