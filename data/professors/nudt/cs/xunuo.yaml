bio_raw: 男,CCF高级会员，CCF集成电路设计、信息存储技术、计算机工程与工艺专委执行委员，Brain-X青年编委。研究方向为微纳电子器件与系统集成，存算一体电路、系统与设计自动化。近五年，主持国自科、省自科、国家实验室开放课题等国家级、省部级项目7项；核心参与国家重点研发计划、国自科重点等项目5项；在Nature
  Communications、AELM、AISY等发表论文近40篇，一作/通讯20余篇，获授权发明专利9项，集成电路布图8项；指导省级研究生科研创新项目1项和省级大创3项，指导集创赛全国总决赛一等奖2项，多次获评优秀指导教师。xunuo@nudt.edu.cn
