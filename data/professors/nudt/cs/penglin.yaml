bio_raw: 男,长期从事高性能计算相关科研工作，任银河/天河副主任设计师，任某重点工程副总设计师，研究方向为软硬件协同优化、编译优化与并行程序调试性能分析。近5年，主持国家重点研发计划课题1项，科工局某工程子课题1项。先后获得省部级/军队科技进步一等奖3项、二等奖3项。协助指导博士2名，发表高水平论文多篇，授权专利20余项。penglin@nudt.edu.cn
