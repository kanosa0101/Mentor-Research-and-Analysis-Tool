bio_raw: 男,军队学位与研究生教育中心副主任、副研究员，是面向军事教育领域的智能文本处理系统及军事教育大数据智能分析应用的主要技术负责人之一，主要研究方向为海量文本分析（包括文本挖掘与语义理解技术，以及面向军事教育领域的智能文本处理系统设计与实现）和AI
  for science（人工智能驱动的科学研究方法，面向军事教育大数据的智能分析与应用技术），主持或参与国家军队重点项目研发10余项，成果在多个单位广泛应用，获军队科技进步二等奖1项、湖南省教学成果二等奖1项，荣立三等功1次。申请专利3项，发表论文10余篇，协助指导博士生2人，协助指导硕生5人。liushenling@gfkd.mtn
