bio_raw: 女,长期从事高性能计算网络与通信协议、大规模并行与分布式处理的系统研制与前沿学术探索。目前依托“天河”超算平台，面向HPC+BigData+AI融合背景，开展基于Chiplet的异构计算SoC设计、大规模深度学习训练软硬件协同加速；面向多元计算、通信库的大模型训练混合并行策略优化、计算-通信协同优化；HPC-AI混合负载INC（In-Network
  Computing）加速及基于前沿网络、计算平台特性的通信库定制优化等方面的研究。获军队科技进步一等奖1项，授权专利20余项，以第一作者在DAC，DATE（最佳论文提名），IPDPS17，TPDS等CCF推荐体系结构方向旗舰会议及期刊发表高水平学术论文20余篇，近期指导学生在SC23、IPDPS24、CLUSTER24等体系结构旗舰会议发表论文数篇。13907498457
