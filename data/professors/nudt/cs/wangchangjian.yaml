bio_raw: 男,主要研究领域包括云计算、大数据和人工智能技术，长期从事智能对话系统、情报大数据分析、医疗大数据以及医学图像处理方面的研究工作，在研军队级、省级以上课题近10项，主持5项。在CVPR、IJCAI、ACM
  Multimedia、TCBB、Placenta、Frontiers in Medicine等计算机和医学领域重要会议和期刊上发表论文40余篇，申请专利10余项。获湖南省教学成果特等奖1项，军队教学成果二等奖1项，军队科技进步奖3项，军事理论成果奖1项。wangcj@nudt.edu.cn
