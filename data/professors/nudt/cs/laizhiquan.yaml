bio_raw: 男,国家重点研发计划青年科学家项目负责人，湖南省人才计划。主要研究方向为并行智能计算、分布式图计算、高性能计算，主持国家自然科学基金、国家重点研发计划等项目6项，参与国家和军队重点科研项目10余项，在中国科学、TPDS、TC、ICPP、CLUSTER、ICDCS等会议和期刊发表论文40余篇，获省部级一等奖1项。zqlai@nudt.edu.cn
