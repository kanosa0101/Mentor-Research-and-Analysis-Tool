bio_raw: 男,国防科技大学优秀骨干教师，从事软件可靠性、嵌入式软件、EDA 软件、智能软件技术等方向的研究和教学工作，主持国家自然科学基金、装备预先研究、科技委基础加强计划等项目，获军队科技进步奖二等奖2项、省校级教学成果奖3项，在IEEE
  TNS、ACM TACO、ACL等期刊和会议上发表学术论文60余篇，授权国家发明专利9项、软件著作权7项，协助指导博士生、硕生共20余人。jjxu@nudt.edu.cn
