bio_raw: 男,湖南省杰青，军队优秀专业技术人才岗位津贴，“信息物理”湖南省高校重点实验室负责人，国防科技大学高层次拔尖人才、获校“青年创新奖”，中国材料研究学会和湖南省光学学会理事，中国电子显微学会扫描探针显微镜专业委员会委员，美国宾州州立大学和新加坡国立大学访问学者。主要从事新型半导体材料与物理、低维物理与纳米器件、量子调控与光电探测等方面研究，主持国家自然科学基金重点项目课题、面上项目、自主创新科学基金重点项目等科研项目20余项。在Nature
  Communications, Advanced Materials, ACS Nano, Nano Letters等国际一流期刊发表SCI论文70余篇，被引用4300余次，H因子为29。出版专著/教材4部，申请/授权专利10余项，担任多家学术期刊青年编委。立三等功1次。15973174110  wangguang@nudt.edu.cn
