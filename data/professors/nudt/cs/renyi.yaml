bio_raw: 女,长期从事系统软件及智能化方法、云边环境资源管理及优化、边缘AI推理加速、代码特征分析方向研究。中国计算机学会杰出会员、分布式计算与系统委员会执委。国家自然科学基金项目评议人、计算机学报等CCF
  A/B类期刊等审稿人。主持及参与国家级科研项目20余项。获国家科技进步一等奖1项，省部级一、二等奖各2项。获专利授权20余项。发表包含CCF推荐A/B类在内的论文60余篇。省部级精品课程负责人，获省级教学成果奖。指导研究生20余名。国家级大学生创新训练计划项目指导教师，指导本科生毕设数十名。指导学生多次在国家级A类学科竞赛中获奖。多次获教学优秀奖及被评为教育训练先进个人。曾获校优秀导师奖。renyi@nudt.edu.cn
