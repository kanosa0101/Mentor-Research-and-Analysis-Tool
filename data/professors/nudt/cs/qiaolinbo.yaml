bio_raw: 男,从事并行与分布式计算、大规模智能模型应用等方向研究，主持国家自然科学基金、国家重点研发计划子课题等项目 10余项，参与重大科研项目多项，项目经费丰富；在 TACO、TPDS、AAAI、IJCAI、ACL等会议和期刊上发表论文 30 余篇，论文被引2000余次，受邀担任ACL领域主席及多个期刊编委；协助指导博士、硕10余名，全国研究生教育评估监测专家库专家、研究生操作系统开源创新大赛优秀指导教师；入选湖湘青年英才、国防科技大学卓越青年人才，获军队、省部级科学技术进步一等奖2项。qiao.linbo@nudt.edu.cn
