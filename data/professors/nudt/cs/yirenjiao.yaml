bio_raw: 女,入选中国科协青年人才托举工程，湖南省青年人才计划，国防科技大学人才计划。2019年毕业于Simon Fraser University（加拿大）。研究领域为三维视觉、计算机图形学，研究方向为几何、材质、光照建模。发表CCF
  A类及SCI 1区论文近30篇，成果获得湖南省自然科学一等奖、ACM中国新星奖（长沙分会）。主持/参与国家级和省部级科研项目8项。担任TPAMI、TIP、SIGGRAPH、CVPR、ICCV、NeurIPS、ICLR、ECCV等期刊会议程序委员、审稿人等。个人主页:https://renjiaoyi.github.io/yirenjiao@nudt.edu.cn
