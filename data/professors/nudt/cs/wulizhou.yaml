bio_raw: 男,荷兰代尔夫特理工大学获得优等博士学位，比利时微电子研究中心IMEC访问学者，参与天河/银河高性能互连芯片研制工作。主要研究方向为内存语义互连系统结构、非易失存储技术与系统、自旋电子敏捷设计。先后在DAC、DATE、ITC、TC、TCAD等EDA和体系结构方向国际会议和期刊上发表论文20余篇，发明专利16项。曾获国防科技大学青年创新二等奖（2021），IEEE
  E.J. McCluskey最佳博士论文奖（2021），欧洲电子设计自动化和测试会议DATE最佳论文奖（2020）。lizhou.wu@nudt.edu.cn
