bio_raw: 男,长期从事高性能计算、并行编程语言和编译器、深度学习系统、软硬件协同设计等方向研究工作，入选湖南省芙蓉计划领军人才和军队青年人才计划。主持国家重点研发计划课题、国家自然科学项目、国防自主科研项目等多项；在SC、PPoPP、DAC、PACT、IPDPS、TC、TPDS、SCIS、TACO等发表学术论文90余篇，总引用2600余次，获省级科技进步特等奖1项、中国计算机学会自然科学二等奖1项、省级研究生精品示范课程；获湖南省优秀硕学位论文、ICPE14最佳会议论文、SC23最佳学生会议论文提名；指导学生获全国编译比赛二等奖、军队优秀硕学位论文；中国计算机学会杰出会员；任FGCS、CCF
  THPC、国防科大学报等期刊（青年）编委，任SC、ICS、ICPP、TPDS等会议和期刊审稿人。18374882637 j.fang@nudt.edu.cn
