bio_raw: 男,主要从事互联网数据分析与挖掘技术、大数据与人工智能技术的研究。中国计算机学会大数据专委会委员。主持过国家重点研发计划、国家自然科学基金项目等国家级项目十多项，获国家科技进步二等奖4项、省部级一等奖3项、二等奖2项。指导博士及硕50多人。发表论文200多篇，软著12项、专利十多项。binzhou@nudt.edu.cn
