bio_raw: 男,从事多模态数据处理、AI4Science等相关研究,国防科技大学拔尖人才，军级高层次人才带教导师，中国计算机学会分布式计算与系统专委会执行委员，主持和作为核心成员参与型号研制、技术基础、166工程等项目40余项，总经费7000余万元，发表SCI/EI学术论文30余篇，获授权专利/软著40余项；享受军队优秀专业技术人才三类岗位津贴，获国防科技大学青年创新奖、红山开源杰出应用奖等奖励。18525182551
