bio_raw: 女,英国帝国理工大学博士、博士后，入选湖南省人才计划，国防科技大学人才计划。在IEEE TIP,TMI，TGRS等期刊会议上发表论文30余篇，申请国家发明专利3项；主持国家自然科学基金青年项目1项，国防科技大学自主科研基金1项。参与撰写谭铁牛院士主编英文书籍一部；担任IEEE
  TIP/TMI/ TGRS/TNNLS/Information Fusion等多个顶级期刊审稿人。获IEEE Region 10青年科学家奖，IEEE TMI优秀审稿人奖，国家优秀（非公派）留学生奖等。trliu@nudt.edu.cn
