bio_raw: 男,芙蓉学者，获全国百优博士论文奖，入选高校计算机专业优秀教师。主要研究方向人工智能、模式识别、机器学习。湖南省自然科学一等奖2项。发表论文100余篇，其中CCFA类论文70余篇。湖南省自然科学一等优秀论文2篇。出版专著1部、译著1部、教材1部。承担国家自然科学基金、国家重点研发计划等项目十余项。多个国际刊物（会议）审稿人或PC。指导省级军队级优秀学位论文8篇。获校优秀研究生导师奖4次。获湖南省首届优秀研究生导师团队奖。​
