bio_raw: 男,长期从事云计算、智能计算软件方向研究。作为负责人承担国家重点研发计划课题、国家自然科学基金、装备预研等科研项目多项，作为核心骨干研制的云平台软件应用到多个重大项目和信息系统。先后获省部级科技进步二等奖4项、三等奖2项，在国内外学术会议和期刊上发表论文20余篇，授权专利10余项。baoli@nudt.edu.cn
