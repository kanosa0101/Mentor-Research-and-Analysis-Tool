bio_raw: 男,主要从事人工智能芯片及算法、高速互连网络方面的研究，作为主任设计师，负责多款芯片研制。主持和参与10余项国家及军队项目，获省部级科技进步一等奖2项，在国内外高水平期刊和会议上发表学术论文30余篇，授权国际及国家发明专利20余项，培养硕生20余名。指导学生在集成电路创新创业大赛中获优异成绩，授权专利若干。cjs7908@163.com
