bio_raw: 男,从事无人智能、计算机视觉研究。主持国家自然科学基金青年、面上以及省部级科研项目4项。在CCF A类期刊或会议上发表高水平学术论文40余篇，包括TPAMI，IJCV，TIP，NeurIPS,
  ICML等。指导学生多次在国际国内人工智能算法赛事中获奖，担任IJCAI、AAAI等人工智能会议的高级程序委员会委员，担任国际期刊Mathematics客座编辑，以及Neural
  Network、Visual Computer等编委。long.lan@nudt.edu.cn
