bio_raw: 男,主要从事软件分析验证、软件自动修复、可信人工智能等领域研究。获北京市科技进步一等奖1项、军队科技进步二等奖1项。在POPL、FSE、ASE等期刊会议上发表论文70余篇，获ACM
  SIGSOFT杰出论文奖等。担任SETTA等国际会议的程序委员会联合主席。授权国家发明专利10余项，出版教材4部。主持国家自然科学基金等科研项目8项。lqchen@nudt.edu.cn
