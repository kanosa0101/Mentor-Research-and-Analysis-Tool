bio_raw: 男,长期从事模拟集成电路设计、数模混合集成电路设计，抗辐射集成电路设计。作为负责人主持国家HGJ等课题2项，国家自然科学基金课题2项，作为骨干参与国家HGJ等课题7项，获国家科技进步二等奖1项、湖南省技术发明一等奖1项。获授权专利20余项，发表SCI论文20余篇，其中6篇IEEE顶级期刊论文，有2篇进入ESI前10%层次。培养3人获集成电路创新创业大赛赛区一等奖和全国特等奖。cjj192000@163.com，chenjianjun09@nudt.edu.cn
