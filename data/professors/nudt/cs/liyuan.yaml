bio_raw: 男,"长期从事高性能计算相关科研工作，在芯片设计验证及软硬件协同优化方面具有丰富经验。博士期间曾赴多伦多大学联合培养，研究方向为计算机体系结构，高性能可重构计算，面向人工智能算法的硬件并行仿真与加速。以第一作者或指导学生在TVLSI,ICCD(最佳论文提名),FPT(最佳论文提名)等高水平期刊会议发表论文20余篇。主持或参与多项国家和军队级项目，获国家发明专利20余项，获军队科技进步一等奖1项。13873176313
