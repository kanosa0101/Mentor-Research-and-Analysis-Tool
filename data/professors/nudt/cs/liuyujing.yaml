bio_raw: 女,长期从事网络路由系统安全研究，主持和参与了国家自然科学基金、国家重点研发计划项目课题、科技委基础加强计划项目课题等十余项科研项目。获军队科技进步二等奖1项（3），湖南省科技进步二等奖1项（4），军队科技进步三等奖2项（1，5），科研成果获评国防科技大学重大科技进展。参与撰写的14项国家和国防发明专利获得授权。以第一作者/通信作者发表了8篇学术论文，出版学术专著2部。全军优秀硕学位论文获得者，荣立集体三等功1次。liuyujing@nudt.edu.cn
