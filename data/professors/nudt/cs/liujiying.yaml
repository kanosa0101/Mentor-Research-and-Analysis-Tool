bio_raw: '男,从事人工智能加速的复杂系统建模与计算等方面的研究，军委科技委某领域重点方向专家。承担军委科技委某专项重点项目课题、国家自然科学基金、国家重点研发计划子课题等多项科研项目，获军队科技进步一等奖1项、二等奖4项，国家教学成果二等奖1项，发表SCI论文30余篇，指导学生获湖南省优秀学位论文、发表高水平SCI期刊封面论文、获军事建模竞赛一等奖等。jiying.liu@nudt.edu.cn

