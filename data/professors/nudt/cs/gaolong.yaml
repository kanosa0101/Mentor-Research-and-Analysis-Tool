bio_raw: 男,长期从事嵌入式实时操作系统定制工作，基于GPU基础软件栈开展图形显示及智能计算机优化的研究工作，开展基于GPU体系结构抗辐照编译容错研究。主持多项国家重大专项、军队预研专项课题，研究成果在军队重要领域得到应用。获军队科技进步一等奖2项、二等奖2项、中国电科集团科技进步特等奖1项。已发表论文20余篇，第一作者10篇。longgao@nudt.edu.cn
