bio_raw: 女,教育部高等学校大学计算机课程教指委委员，湖南省芙蓉学者特聘教授，入选全国高校计算机专业优秀教师奖励计划。CCF理事、CCF杰出会员、CCF高专委常委。参与国际计算课程体系规范ACM/IEEE
  CC2020。长期从事超算系统软件开发、高能效计算、异构计算相关研究，曾获省部级科技进步一等奖1项、二等奖2项，发表论文100余篇，包括CACM, TC, TPDS,
  TACO, SC, ICPP等。以第一完成人获省级校级教学成果奖励6项，包括2025年湖南省教学成果特等奖1项(排1)、2019年湖南省教学成果一等奖1项(排1)、2025年湖南省教育科学研究优秀成果一等奖1项(排1)。主持3门省级精品课、1门湖南省课程思政示范课，获校级优秀教师奖、校级优秀教学奖。juanchen@nudt.edu.cn
