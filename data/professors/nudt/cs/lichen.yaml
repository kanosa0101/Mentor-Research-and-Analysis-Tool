bio_raw: 男,高性能微处理器领域专家，主要从事微处理器设计、计算机体系结构相关研究，银河飞腾处理器存储与互连系统负责人，主要研究方向是SoC设计与验证、面向图计算的访存优化等。主持和完成国自科、173重点项目子课题等6个国家和军队科研项目。以第一作者授权专利和软件著作权6项，以第一或通信作者发表高水平学术论文二十余篇，相关工作获军事科技进步一等奖1项，湖南省自然科学二等奖1项。入选国家级人才项目、湖南省芙蓉计划科技创新人才。lichen@nudt.edu.cn
