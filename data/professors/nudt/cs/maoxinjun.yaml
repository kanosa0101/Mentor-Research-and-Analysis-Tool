bio_raw: 男,全国高校计算机专业优秀教师，教育部新世纪优秀人才和湖南省新世纪121人才，软件工程学科学术带头人，主持国家重点研发计划、NSFC、预先研究课题等20多项，在TSE、ICSE、ASEJ、ESE、ICSME、JSEP、SANER、ICPC、JCST、中国科学等期刊和会议上发表学术论文200多篇，出版学术著作和教材6部，获国家教学成果二等奖1项，省自然科学一等奖1项，培养博士和硕生60余名。xjmao@nudt.edu.cn
