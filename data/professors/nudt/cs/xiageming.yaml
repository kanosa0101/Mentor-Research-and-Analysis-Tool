bio_raw: 男,长年从事计算机科学与技术学科、电子信息专业领域和网络空间安全学科教学科研。目前主要研究方向为边缘计算与具身智能、云边端融合网络与物联网，智能交互设计，网络与信息安全等。作为项目负责人主持完成国家自然科学基金面上项目、科技委课题、国家级国防科研基础研究项目等10余项，作为项目负责人主持完成省部级教育教学研究课题5项，作为主要完成人完成国家重点研发计划、科技委国防科技创新特区项目等20余项，发表CCF推荐国际期刊和国际学术会议高水平论文60余篇，获省部级科技进步二等奖1项，三等奖5项，曾公派国外大学访问学者1年，多次赴国外大学进行学术访问。victor.xgm@nudt.edu.cn
