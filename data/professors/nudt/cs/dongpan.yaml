bio_raw: 男,从事系统软件、国产平台软件特性设计、AI计算系统优化、云计算安全方向研究，主持及参与国家级科研项目20余项,参与天河计算机、飞腾处理器、麒麟操作系统等多项国家重大工程和装备的研制工作。获军队科技进步一等奖3项，二等奖1项，国家教育部科技进步一等奖一项。发表SCI/EI检索论文30余篇，含CCF
  A/B类论文10余篇，申请发明专利50余项。人才培养兼顾理论和实践，面向国产基础软件/云计算/自主可控/智能计算等领域。pandong@nudt.edu.cn
