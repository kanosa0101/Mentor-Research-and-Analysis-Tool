bio_raw: 男,国家优秀青年科学基金获得者，长期从事公钥密码、抗量子密码、隐私计算、网络安全等方面的研究，先后解决多个密码学领域国际公开问题，在国际密码学三大顶级会议、IEEE
  TIFS/TDSC /TSC等CCF/CACR A类期刊/会议等发表学术论文50余篇，专利10余项，担任CCF/CACR A类国际会议ASIACRYPT、ACM
  CCS等多个国际会议PC以及CCF A类国际期刊IEEE TDSC等国际期刊编委等。获评全国大学生信息安全竞赛优秀指导教师、ACM SIGSAC中国新星奖、湖南省教学成果一等奖、国防科技大学青年创新奖等荣誉，指导学生获得中国密码学会优秀博士论文、全国大学生信息安全竞赛一等奖和多个国际学术会议最佳学生论文奖。个人学术主页：www.rongmaochen.netchromao@nudt.edu.cn
