bio_raw: 男,湖湘青年人才、湖南省优秀博士后创新人才、斯坦福爱斯维尔全球前1%科学家（2025）、中国计算机学会互联网专委会执行委员，研究方向为超算系统智能运维、人工智能安全，发表学术论文100余篇（一作/通信40余篇；CCF
  A类论文20余篇、B类论文20余篇，3篇获国际会议最佳论文）。主持国家自然科学基金、省自然科学基金、省科技创新项目等5项，作为骨干参与国家和军队重点项目多项。获省科技进步二等奖2项、省学会科学技术奖一等奖1项、省优秀博士学位论文、国防科技大学青年创新奖、ACM长沙新星奖、ACM
  SigWeb新星奖，荣立个人三等功1次。担任TIFS、ToN、MM等10余个顶级期刊/会议审稿人。指导硕3人，协助指导研究生9人，1人获省优论文、2人获校优论文。15507486035  zhoutongqing@nudt.edu.cn
