bio_raw: 男,从事高性能计算编程和编译系统研究，担任编译系统主任设计师，主持和参与国家、军队重点项目多项，围绕天河高性能计算机系统研制配套编程和编译环境，支撑异构应用开发，助力天河系统多次取得世界第一，获军队科技进步一等奖、湖南省科技进步一等奖各1项，入选国防科技大学高层次创新人才培养计划卓越青年人才培养对象，录用和发表论文30余篇，授权专利20余项。13517403741
