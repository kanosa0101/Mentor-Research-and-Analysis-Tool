bio_raw: 男,入选湖南省海外引进人才计划，国防科技大学人才计划，2019年博士毕业于英国帝国理工学院（QS世界排名第2）。长期从事深度学习、计算机视觉，以及人工智能领域研究，主持或参与国家、省部级等科研项目10项。在
  IEEE T-PAMI, T-IP, T-NNLS, T-SP,以及 AAAI，NeurIPS, ACM MM 等国际高水平期刊与会议上发表论文70余篇。个人主页：jjhuangcs.github.io。jjhuang@nudt.edu.cn
