bio_raw: 男,从事群体智能、群智软件开发方法、开源生态大数据分析挖掘等方向的研究，发表论文40余篇，承担科技创新2030-新一代人工智能、国家重点研发计划等国家项目多项，Trustie、GitLink、红山等开源平台技术负责人，支撑了我国多个开源社区的建设。获中国电子学会科技进步一等奖一项、湖南省教学成果二等奖1项。taowang2005@nudt.edu.cn
