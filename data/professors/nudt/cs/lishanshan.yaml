bio_raw: 女,教育部青年长江学者，湖南省科技创新领军人才。主要研究方向包括高可信软件、智能化软件工程、软件供应链安全等。主持十余项国家和军队科研项目。获国家科技进步二等奖，军事科技进步一、二等奖，湖南省技术发明一等奖，CCF技术发明二等奖和自然科学二等奖，入选中创软件人才奖和CCF
  NASAC青年软件创新奖。在ICSE、FSE、ASE、ISSTA、VLDB等顶刊顶会发表论文100余篇，包括CCF A类60篇，获软工顶会ICSE在内的论文奖励11次，担任ASE、FSE、ISSTA、ICSE等软件工程A类会议的程序委员会委员，授权专利31项，出版专著2部。指导学生多次获CCF优博士和全军优博士。shanshanli@nudt.edu.cn
