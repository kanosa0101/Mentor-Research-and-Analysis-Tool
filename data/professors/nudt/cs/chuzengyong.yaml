bio_raw: 男,主要从事宽禁带半导体材料与器件、柔性传感材料与器件多学科交叉研究工作，主持国家自然科学基金5项、军队/省部级重点项目多项，出版专著/译著2部，获省部级二等奖2项。入选湖南省杰青，兼任中国分析测试协会毒物分析委员会委员、复合材料学报等期刊编委。指导学生在Nature
  Commun等期刊发表创新成果，指导军队/省部级优秀学位论文多篇次。chuzy@nudt.edu.cn
