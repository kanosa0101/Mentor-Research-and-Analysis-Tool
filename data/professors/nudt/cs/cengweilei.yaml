bio_raw: 男,研究量子纠错和容错量子计算理论，擅长在量子信息、凝聚态物理、人工智能的交叉领域探究问题。青年科技英才引进人才,在PRL、PRA、NJP等杂志上发表数篇文章，主持国家青年科学基金等项目。上海交通大学物理学学士，加州大学河滨分校物理学博士，杜克大学量子中心博士后。曾就职于加拿大光量子公司Xanadu、美国贝尔实验室、鹏城实验室、之江实验室等单位。weilei.zeng@foxmail.com
