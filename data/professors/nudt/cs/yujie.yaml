bio_raw: 男,国家重点研发项目首席科学家，学校操作系统团队负责人，主要研究方向为操作系统、人工智能，研究领域包括多模态大模型、大模型安全、大模型+操作系统、开源操作系统等，承担国家和军队课题10余项，入选军队某人才计划、湖南科技XX人才，获中国杰出开源人物、中国开源先锋人物等称号，合作研究单位包括瑞士ETH大学、新加坡NUS大学等。获国家科技进步一等奖1项，省部级科技进步特等奖2项、一等奖3项，申请专利20余项，在TKDE、AAAI、COLING等CCF推荐会议及期刊发表高水平论文50余篇，已培养博士、硕30余人。yj@nudt.edu.cn
