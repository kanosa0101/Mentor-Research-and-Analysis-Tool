bio_raw: 女,主要从事人工智能和系统软件的交叉研究、以及人工智能安全研究。获省部级科技进步一等奖1项、指控学会科技进步二等奖1项，现主持国家和军队项目6项，入选中国科协特殊领域青年人才托举工程、军队某人才计划、学校某人才计划，获全军优秀博士学位论文、学校青年创新奖一等奖等。发表CCF推荐A类或B类论文20余篇，获最佳论文奖1次，担任多个顶级期刊和国际会议审稿人，申请专利10余项，培养博士、硕研究生10余人。jiansonglei@nudt.edu.cn
