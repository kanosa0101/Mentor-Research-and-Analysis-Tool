bio_raw: 男,长期从事系统软件和人工智能等领域研究，主持和参与国家自然科学基金、国家重点研发、核高基、装备预研等课题20余项。入选学校高层次人才计划，获军队/省部级科技进步一等奖2项、教学成果二等奖1项，在CCF推荐的会议及期刊发表论文50余篇，担任多个期刊和国际会议审稿人，授权国家发明专利40余项，培养博士、硕10余人。lixiaoling@nudt.edu.cn
