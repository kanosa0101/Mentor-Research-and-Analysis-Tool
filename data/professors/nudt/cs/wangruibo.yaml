bio_raw: 男,天河高性能计算团队软件方向学术带头人之一，现任银河、天河工程副总设计师，并行与分布计算全国重点实验室副主任。主要从事操作系统、文件系统等高性能计算系统软件研制和应用优化。入选湖南省人才计划，获全国创新争先奖牌、中创软件人才奖、军队/省部级科技进步一等奖3项、二等奖1项，主持国家重点研发、装备综合研究项目等国家/军队级项目10余项。在SC、ICS、TPDS、CLUSTER等高性能计算领域知名会议期刊发表论文20余篇，授权专利20余项。多次受邀在德国ISC、俄罗斯RSC、韩国KSC等国际超算学术会议上做主题报告。ruibo@nudt.edu.cn
