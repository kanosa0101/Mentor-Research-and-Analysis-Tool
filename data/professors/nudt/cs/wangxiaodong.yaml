bio_raw: 男,主要从事基于深度学习的自然语言处理、知识挖掘与知识推理、知识图谱构建等方面关键技术的研究。曾获省部级科技进步一等奖1项、二等奖2项。发表论文50余篇，其中2篇为会议最佳论文，30余篇论文被SCI检索。培养博士20余名，硕50余名。主持参与国家级科研项目5项。xdwang@nudt.edu.cn
