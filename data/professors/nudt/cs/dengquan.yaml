bio_raw: 男,长期从事集成电路微处理器设计相关的科研工作，研究方向为微处理器体系结构、存算一体。近5年，主持173基础加强和国自科青年等项目5项。所研成果被应用于多代飞腾系列通用微处理器，应用于新一代国产超级计算机。获省部级二等奖两项，国防科大青年创新奖一等奖，入选学校青年人才计划，湖南省青年人才计划。授权国家发明专利20余项，发表TCAD、DAC、DATE等论文30余篇，2024年获得芯片大会最佳论文提名奖。CCF计算机工程工艺专委和CCF集成电路专委执行委员。dengquan12@nudt.edu.cn
