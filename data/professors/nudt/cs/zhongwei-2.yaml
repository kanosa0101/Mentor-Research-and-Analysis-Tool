bio_raw: 女,钟玮，国防科技大学前沿交叉学科学院教授。全国优秀博士论文提名奖，谢义炳青年气象科技奖和全国优秀青年气象科技工作者获得者，获全国大气科学类教学竞赛一等奖。主要从事环境领域大数据特征挖掘、轻量化大模型构建、军事高影响天气形成机理、智能预报模型、量子同化等方向的研究和教学工作，主持国家和军队重点研究项目8项；参与国家基础研究项目、国家自然科学基金和军队级课题10余项，获得军队科技进步一等奖、省级教学成果二等奖各1项；发表核心以上论文40余篇，SCI收录论文30篇。18951025208
