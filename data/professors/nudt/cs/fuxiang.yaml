bio_raw: 男,长期从事量子编程编译及体系结构研究，为量子计算控制软硬件提出了具有国际影响力的系统解决方案。代表作包括第一个量子控制微体系结构QuMA、可执行的量子计算指令集eQASM和全面的量子-经典异构编程框架Quingo，曾获体系结构顶级会议MICRO-50最佳论文。xiangfu@nudt.edu.cn
