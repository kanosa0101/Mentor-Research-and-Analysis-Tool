bio_raw: 男,从事量子计算、超导量子芯片、拓扑量子器件物理等研究方向。瑞典隆德大学凝聚态物理博士，玻尔研究所博士后，以第一作者在Science、PRL、Nano
  Letters等顶级期刊发表多篇产生重大国际影响力的论文，学术引用超6200次，入选爱思韦尔中国高被引学者，湖南省自然科学基金杰出青年项目获得者。科研教学理念重视定向引导和自由探索结合。mtdeng@nudt.edu.cn
