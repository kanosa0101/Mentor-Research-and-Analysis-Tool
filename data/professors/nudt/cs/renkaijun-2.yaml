bio_raw: 男,院长，军队学科拔尖人才，湖南省科技创新领军人才，享受国务院政府特殊津贴，中国气象学会气象人工智能委员会副主任委员，国家首批建设高水平大学项目出国留学人员，获全军优秀博士学位论文和中国计算机学会十佳优秀博士学位论文提名。长期从事大气海洋环境数值模拟与高性能计算、大数据、人工智能交叉领域研究工作，主持多项国家军队重大重点项目，获军队科技进步一等奖1项、湖南省科技进步一等奖1项，其他省部级科技进步二等奖3项，出版中文专著2部，合作出版外文著作3部，发表包括IEEE
  TSC、IEEE TCC、IEEE JSTAR等高水平国际期刊和会议论文160余篇， SCI收录60余篇，申请和授权专利20余项，指导培养研究生30余名，赴美国、英国、加拿大、澳大利亚等十多个国家进行了学术访问交流。renkaijun@nudt.edu.cn
institutes:
