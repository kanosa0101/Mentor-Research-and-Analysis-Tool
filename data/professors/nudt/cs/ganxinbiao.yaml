bio_raw: 男,入选军队高层次人才，天图系统（TianheGraph）的设计者和完成人，主要负责天河超级计算机系统高性能图计算优化、分布式图学习、图应用，大规模流场可视化工作，设计实现的天河图计算评测优化benchmar连续10次蝉联Graph500排行榜世界第一。在PPoPP、SC、TPDS、TACO、TOS、TKDE、VLDB、WW、
  MM、ICS、ICPP、CVPR、IJCAI等高水平期刊会议发表论文50余篇， 其中，近3年以第一作者/通信作者发表CF推荐A类会议期刊文30+篇，授权专利26项。主持参与国家和军队重点项目10余项。获湖南省科学进步一等奖、军队科技进步二等奖、CCF计算机应用技术奖等。计算机学报、计算机研究与发展、FCS、TC、TPDS、ICDE、WWW等会议和期刊审稿人。指导和协助指导博士、硕10余名。xinbiaogang@163.com
