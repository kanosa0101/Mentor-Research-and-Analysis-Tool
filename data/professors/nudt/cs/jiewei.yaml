bio_raw: 男,系副主任，主要从事“智能安全”（大模型红队测评、智能体攻防对抗等）研究。入选中央网信办创新人才计划，获国防科技卓青基金资助，担任军委某装备体系专业组专家，被公安部授予某网安行动先进个人称号，四次荣立三等功。近五年，在ACL、S&P、NDSS、WWW、TIFS等高水平会刊发表论文20余篇；作为中国学者，首获国际认知科学学会（CogSci）专项研究奖，被《麻省理工科技评论》报道；作为主要完成人，获省部级特等奖1项，一等奖3项，二等奖2项；专利发明获授权20余项；申请CVE/CNVD漏洞编号50余项；指导学生获全国大学生人工智能安全竞赛一等奖（作品赛）、中国研究生网络安全创新大赛一等奖（夺旗赛）。13755011926；xiewei@nudt.edu.cn
