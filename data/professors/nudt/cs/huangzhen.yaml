bio_raw: 男,入选国家级青年人才计划，湖南省优秀博士毕业论文奖获得者。从事人工智能、大数据与智能计算系统等方向研究。在NMI、TKDE、TIFS、ICML、NeurIPS、ACL等国际知名期刊会议发表学术论文120余篇，主持国家和军队重点项目及课题10余项，曾获省教学成果特等奖1项，省部级科技奖励一等奖2项等。huangzhen@nudt.edu.cn
