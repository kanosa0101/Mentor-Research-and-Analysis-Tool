bio_raw: 男,从事计算机系统结构、先进光电路设计研究，入选军队级省部级人才计划、全国创新争先团队骨干成员、获军队省部级一等奖3项、二等奖3项，霍英东教师奖，CCF优博士提名。近五年发表论文70余篇，出版专著3部，授权发明专利50余项。两个国家重点研发计划项目首席，主持国家级项目10余项。13786143813
