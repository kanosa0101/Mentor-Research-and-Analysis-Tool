bio_raw: 男,从事智能化软件工程、软件安全性分析、无人平台软件设计验证等方向研究。教育部新世纪优秀人才、东软-NASAC青年软件创新奖、霍英东基金会高校青年教师奖、育才银奖，获部委级科技进步二等奖2项、三等奖2项，发表论文60余篇，培养博士和硕30余名。主持国家科研项目10余项。wdong@nudt.edu.cn
