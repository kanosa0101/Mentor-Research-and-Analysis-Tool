bio_raw: 男,军队级人才计划，从事网络与信息安全研究，中国指挥与控制学会首批会士、网络空间安全专委会主任委员，获首届全国创新争先奖、首届国家网络安全优秀人才奖，所带团队被评为首届国家卓越工程师团队，主持重点项目二十余项，获国家科技进步特等奖、一等奖、二等奖各1项，部委级科技进步一等奖7项，发表学术论文70余篇。yangling61s@126.com
