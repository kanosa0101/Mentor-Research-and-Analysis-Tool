bio_raw: 男,梁科，计算机学院硕导。研究方向为图机器学习、结构化知识表征与推理等。主持国家自然科学基金、军科委技术领域基金、湖南省优青等项目。以第一/通讯作者，在TPAMI、ICML等TOP期刊、CCF-A类会议发表论文30余篇，总引用3800余次，单篇最高引514次，含ESI高被引5篇、热点1篇。任Information
  Fusion（IF:17.4）、Pattern Recognition（IF:9.1）等期刊编委, 以及ICML、CVPR等CCF-A类会议领域主席。部分成果获中国计算机学会自然科学一等奖、湖南省计算机学会科学技术奖一等奖、中国人工智能学会博士学位论文激励计划等，并获得良好应用。liangke22@nudt.edu.cn
