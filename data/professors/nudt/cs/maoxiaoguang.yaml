bio_raw: 男,软件工程学科带头人，主要从事可信软件、软件缺陷修复等方向研究。曾获国务院政府特殊津贴、国家级一流本科课程2门、国家级教学成果二等奖3项、省部级教学成果一等奖3项、省部级科技进步一等奖3项、二等奖3项。在TOSEM、TSE、POPL、ICSE、FSE、ISSTA、TCAD、中国科学、软件学报等发表论文百余篇，出版教材和译著10部。毕业博士生18名，硕生45名。xgmao@nudt.edu.cn
