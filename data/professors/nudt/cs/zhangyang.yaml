bio_raw: 男,长期从事软件工程理论和方法学研究，主持/参与国家自然科学基金、重点研发计划、军队重点科研项目等10余项，在TSE、ICSE、FSE、ASE、ISSTA等软件工程领域高水平期刊会议上发表论文60余篇，申请/授权发明专利20余项，作为核心骨干参与Trustie、GitLink、红山开源等平台建设，入选CCF青年人才发展计划、湖南省湖湘青年英才，获评北京市科技进步一等奖、中国电子学会科技进步一等奖、ACM中国新星提名奖、ACM长沙新星奖、国防科技大学青年创新奖、IEEE
  TCSE杰出论文奖、湖南省优博士等。yangzhang15@nudt.edu.cn
