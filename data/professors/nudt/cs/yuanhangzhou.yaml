bio_raw: 男,高性能微处理器领域专家，主要从事微处理器高性能IP（存储、时钟、电源方向）设计，是某高性能处理器IP 项目主任设计师。主持/参与国家自然科学基金、科技委重点课题等国家级/军队省部级等项目（主持6
  项/参与12 项），主管经费超千万元；获军事科技进步一等奖、湖南省博士后创新创业大赛银奖（排名第1）；2025年入选科技创新类“湖湘青年英才”。学术方面，近年来发表高质量论文20
  余篇，以一作/通信作者在抗辐射时钟与电源领域发表中科院一区/CCF A 类/T1 顶刊6 篇、RADECS/NSREC 等抗辐射领域旗舰会议8 篇。其中，2021
  年NSREC 上的报告，为学校在该会议的首篇大会报告，标志团队研究跻身国际前列。niesaitong@163.com
