bio_raw: 男,长期从事群体智能协同理论和方法研究，主持国家自然科学基金、多项某重点课题、某理论重点课题等7项，主持经费近千万，单项项目经费375万元。入选学校青年人才培养计划。发表高水平学术论文近30篇，包括以第一或通讯作者发表CCF
  A类会议/期刊（如ubicomp、icde、tmc、aaai）等高水平学术论文10余篇，长期担任TMC/TON/AAAI/ICRA/CIKM等领域顶级期刊会议审稿人/PC。申请/授权发明专利多项。参与制定团体标准1项。研究成果分别获某国家级和军队级战法研究一等奖，获多份军委机关和一线任务单位表扬函或感谢信。panyan@nudt.edu.cn
