bio_raw: 女,从事量子计算、量子纠错、量子计算机体系结构等方向研究。荷兰代尔夫特理工大学博士（QS世界大学排名第47）、英国伦敦大学学院博士后（QS世界大学排名第9）。在ISCA、IEEE
  TCAD等国际顶级会议和期刊发表多篇具有国际影响力论文，主持国家自然科学基金项目，担任ISCA/MICRO/HPCA等体系结构顶会会议委员和NC、PRL、PRX、npj
  Quantum Information等期刊审稿人。青年科技英才、湖南省芙蓉计划高层次引进人才。l.lao@quanta.org.cn
