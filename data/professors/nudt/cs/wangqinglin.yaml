bio_raw: 男,主要从事高性能计算、智能计算、军事仿真、大模型构建与应用、分布式三维重建等方向研究，主持与参与重大科研项目10余项，荣获个人三等功1次、军队科技进步一等奖1项、“中国超算年度最佳应用提名”2项，在NeurIPS、ASE、TMM、Performance
  Evaluation、ICS、IPDPS、PACT、Cluster、Euro-Par、ICPP、Briefings in Bioinformatics、计算机研究与发展等高水平期刊与会议上发表论文100余篇，授权专利30余项，指导和协助指导博士、硕20余名。wangqinglin@nudt.edu.cn
