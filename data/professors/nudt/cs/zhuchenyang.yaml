bio_raw: 男,入选国家自然科学基金优青项目，中国科协青年人才托举工程，湖南省湖湘青年英才。研究方向为计算机图形学、三维视觉和机器人应用。发表CCF A类论文40余篇,其中TOG文章6篇，CVPR/AAAI
  Oral 2篇 ,ESI高被引论文2篇。担任图形学SCI期刊《The Visual computer》、国内核心期刊《图学学报》编委，以及CVPR、PG等顶级会议的程序委员。主持国家自然科学基金面上项目等多个国家级项目。获得湖南省自然科学一等奖1项、CCF自然科学一等奖1项、国防科技大学青年创新奖，担任中国工业与应用数学学会几何设计与计算专委会副秘书长。个人主页：www.zhuchenyang.net。zhuchenyang07@nudt.edu.cn
