bio_raw: 男,瑞典皇家理工学院博士。主要研究方向为机器学习、智能计算、遥感图像处理、大模型智能体应用。主持参与国家重点项目10余项。获省部级科技进步一等奖1项，三等奖1项。在ICCV、CVPR、IJCAI等会议期刊发表高水平论文60余篇。主讲研究生课程《深度学习方法与实践》，获省教学一等奖1项，校一等奖2项，三等奖1项。指导省优秀硕论文2篇。niuxin@nudt.edu.cn
