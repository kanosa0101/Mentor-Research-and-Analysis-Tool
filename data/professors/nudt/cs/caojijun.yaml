bio_raw: 男,从事高性能互连网络、复杂编码集成电路、网络智能化（AI4Networks）和智算网络（Network4AI）技术方面研究。曾经担任银河/天河项目副主任设计师。获得军队科技进步一等奖1项、湖南省科技进步1项。在国内外学术期刊及会议发表论文60余篇，授权国家发明专利30余项。主持和参与国家及军队重大科研项目10余项。获得IEEE
  APSCC最佳论文奖，HPCChina优秀论文提名奖。13574833705 caojijun@nudt.edu.cn
