bio_raw: 男,入选国家级人才计划，CCF Fellow，CCF信息存储专委会主任，从事高性能计算、计算机系统结构和新型存储方向研究。获得国家与省部级特等、一二等科技奖等多项奖励。主持过国自科基金重点等项目10余项，发表论文150余篇，发表专利30余项，出版专著1部。Nongxiao@nudt.edu.cn
