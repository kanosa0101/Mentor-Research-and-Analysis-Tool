bio_raw: 女,长期从事高性能通用微处理器、高性能计算机体系结构、AI芯片的研究。主持省部科研项目2项，获省部级科技进步一等奖2项、二等奖1项，三等奖2项。发表学术文章60余篇，出版教材三部，授权专利20多项，培养硕30名。目前承担国家级科研项目多项，主要研究方向是基于芯粒（chiplet）的“积木式”众核微处理器体系结构、基于芯粒（chiplet）的众核处理器敏捷验证技术、AI芯片。li_luo@nudt.edu.cn
