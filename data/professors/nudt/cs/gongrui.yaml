bio_raw: 男,长期从事高性能微处理器体系结构、芯片设计、类脑计算、硬件安全相关的研究工作。中国计算机学会高级会员。作为课题负责人主持了科技部科技创新2030课题、国家自然科学基金等多个国家级项目，作为项目经理主导了多款飞腾嵌入式高性能微处理器芯片的设计实现工作，相关成果得到广泛应用。获国家科技进步特一奖1项，省部级科技进步一等奖2项、二等奖2项；出版专著1部，发表论文30余篇，授权专利20余项。rgong@nudt.edu.cn
