bio_raw: 女,入选国家级人才计划，在光量子芯片、量子计算领域取得一系列成果，研制出世界上首个铌酸锂光量子芯片，研制出若干光量子芯片器件。发表物理顶级期刊PRL、自然子刊等论文近70篇，拥有中国和国际发明专利共10余项。获中国光学十大进展、饶毓泰基础光学奖等。获教育部自然科学一等奖（排名第一）、陈嘉庚科学奖。主持基金委重大科学仪器研制项目、主持科技部重点研发计划项目。pingxu520@nju.edu.cn
