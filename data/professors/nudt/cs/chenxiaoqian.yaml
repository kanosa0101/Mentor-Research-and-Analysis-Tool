bio_raw: 男,军事科学院研究员，主要研究方向为空间飞行器总体优化与系统控制。主持研制“天拓”等系列微小卫星，出版专著9部，发表论文185篇，授权专利60余项。获国家科技进步二等奖1项（1）、国家技术发明二等奖1项（2）、省部级一等奖5项（1,1,1,1,2）、二等奖2项（1,4）。获国家杰出青年科学基金资助，入选国家级人才计划、军队级人才计划等，享受国务院政府特殊津贴，获全国创新争先奖章、钱学森杰出贡献奖、何梁何利青年创新奖、中国科协“求是”杰出青年实用工程奖、中国青年科技奖、发明创业奖人物奖等。chenxiaoqian@nudt.edu.cn
