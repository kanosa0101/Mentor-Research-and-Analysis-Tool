bio_raw: 男,从事可信安全网络、密码设计、智能安全研究，获省部级科技进步一等奖2项，二等奖2项，系统提出无证书标识信任体系及自信任安全网络体系,设计了国内首个达到普密要求的标识密码算法标准，提交4项国家军用协议标准并产业化应用，率先研究属性基、保形保序、神经网络密码等数据及大模型安全技术。发表论文100多篇，论文总被引超过1700次，h-index因子21。获评全国大学生信息安全竞赛优秀指导教师，指导学生获得全国大学生信息安全竞赛一等奖。xf_wang@nudt.edu.cn
