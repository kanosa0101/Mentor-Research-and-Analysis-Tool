bio_raw: 男,“天河”超算互连系统主任设计师，长期从事国产高性能计算机系统结构、高性能自主互连网络和大规模集成电路芯片设计与验证等方面技术研究，近5年以第一作者或通信作者在国内外高水平学术期刊和会议发表学术论文10余篇，获国家发明专利授权10余项，主持国家和军队重点科研项目多项，获省部级技术发明特等奖1项，科技进步一等奖2项。13787229663
