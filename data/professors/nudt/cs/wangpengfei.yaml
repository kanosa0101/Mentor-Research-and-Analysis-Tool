bio_raw: 男,CCF高级会员，从事系统安全、软件测试和网络空间安全关键技术研究，主持科研项目6项，包括国家自然科学基金青年项目1项、面上项目1项，军队级项目2项，校级科研项目2项，并作为骨干成员参与“十四五”专项工程建设、“973”、国家重点研发等科研项目多项。发表学术论文40余篇，其中以第一及通信作者在USENIX
  Security、NDSS、CCS、TSE、TIFS、TOSEM、TCAD等CCF A类会议和期刊上发表论文10篇。获湖南省优秀博士学位论文、国防科技大学“青年创新奖”，入选军队级、省级、校级青年科技人才工程，研究成果获湖南省科技进步二等奖和军事科技进步二等奖。15526429185
