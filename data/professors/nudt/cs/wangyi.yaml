bio_raw: 男,从事公钥加密、可证明安全领域的研究工作。在美密会(CRYPTO)、欧密会(EUROCRYPT)、亚密会(ASIACRYPT)、PKC、ESORICS、IEEE
  TDSC等国内外知名会议和期刊上发表论文20余篇（国际三大密码会议论文6篇）。入选第九届中国科协青年人才托举工程，获得2024年军事科学技术进步奖二等奖、2022年中国密码学会优秀博士学位论文、2024年湖南省优秀博士学位论文、2023-2024年度中国密码学会优秀青年奖等荣誉。wangyi14@nudt.edu.cn
