bio_raw: 男,加拿大阿尔伯塔大学博士，主要从事智能数据融合分析、可解释机器学习、大模型感知决策等研究工作，主持国自科青年、面上项目等国家和省部级项目8项，作为核心骨干成员参与10余项，获得湖南省青A（原杰青）、优青、湖南省优秀博士后等人才项目资助。研究成果以第一/通讯作者已发表CCF-A类/中科院一区TOP期刊论文以及CCF-A会议论文30余篇，授权国家发明专利10余项。获得中国指挥与控制学会青年科技奖，中国人工智能学会吴文俊人工智能科技进步一等奖1项，中国指挥与控制学会科技进步一等奖2项，中国图形图象学学会自然科学二等奖1项，省部级科技进步三等奖1项。xingchenhu@nudt.edu.cn
