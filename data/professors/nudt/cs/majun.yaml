bio_raw: 男,教育部基础软件工程研究中心副主任，是麒麟操作系统和麒麟开源操作系统的主要技术负责人之一，主要研究方向为操作系统和信息安全，包括系统架构设计、系统智能化、系统和数据安全、开源软件治理、软件供应链安全等，主持国家和军队课题近10项，参与重大工程和装备研制任务10余项，获国家科技进步一等奖1项，省部级科技进步特等奖1项目、一等奖2项、二等奖3项，其他获奖3项，入选军队高层次人才培养计划和国防科大拔尖人才培养计划，荣立三等功1次。申请专利20余项，发表论文30余篇。协助指导博士5人，指导和协助指导硕10余人。13787071465
