bio_raw: 女,主要研究方向包括图深度学习、大模型推理优化等。近年来共发表高水平学术论文30余篇，论文学术总引用超4000次，单篇引用过百次论文9篇。出版学术译著《图深度学习》，销量过万。
  担任包括TKDE, AAAI，IJCAI，KDD 等多个权威期刊和领域顶级会议的高级审稿人，ACM SIGKDD 2021 的联席注册主席，CCF理论专委执行委员。主持国自科基金等项目6项，入选湖南省青年人才计划、学校某人才计划。担任本科生《人工智能》课程主讲教员，天河班特聘辅导员，协助指导博士硕研究生10余人。yiq@nudt.edu.cn
