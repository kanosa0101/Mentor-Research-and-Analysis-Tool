bio_raw: 男,国家有突出贡献的中青年专家，教育部“新世纪优秀人才”，政府特殊津贴。主要从事高性能微处理器、微纳电子器件与电路、辐射效应与抗辐射加固技术研究。参与研制20余款飞腾系列微处理器，主持研制的高性能DSP处理器批量应用。获国家科技进步二等奖3项，省部级奖8项。发表论文80余篇，获专利授权60余项。培养博士10余名，硕50余名。guoyang@nudt.edu.cn
