bio_raw: 女,主要从事低维半导体输运调控和红外探测、逻辑运算、人工突触等先进功能器件研究，主持国家自然科学基金、科技委创新特区等科研项目4项，参与国家军队级项目10余项，以第一作者或通讯作者发表Advanced
  Functional Materials、Advanced Optical Materials、Nano Research等高水平论文31篇（含中科院一区论文17篇），代表性成果进入ESI高被引论文，在国际国内会议作邀请报告10余次，担任Adv
  Mater、ACS Nano等高水平期刊审稿人，授权发明专利3项，出版教材2部。18073122603 dengchuyun@nudt.edu.cn
