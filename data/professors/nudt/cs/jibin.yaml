bio_raw: 男,主要从事智能操作系统研究。主持军队科研项目3项、西藏重大科技专项子课题1项，参与国家重点研发计划项目1项、军队科研项目4项。作为技术负责人，推动我国首个全开源智能操作系统openKylin
  AIPC版本的研发，该系统于2024年在CCF系统软件技术论坛首发，获得三位院士及领域专家高度评价。入选军队海创青年人才、军队学术新秀人才，获湖南省CCF科技进步二等奖1项(2025-12）。近5年，累计发表学术论文40余篇，以第一作者/通讯作者发表CCF-A/B类高水平论文10余篇。申请发明专利10余项，软件著作权5项。协助指导博士生5人、硕生10余人。jibin@nudt.edu.cn
