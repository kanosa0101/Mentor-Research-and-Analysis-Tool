bio_raw: 男,长期从事面向网络空间安全方面的大数据和人工智能技术研究，中国网络空间安全协会理事，中国中文信息学会大搜索专业委员会副副委员兼秘书长，承担国家级等课题20余项。获国家科技进步二等奖3项，省部级一等奖6项，二等奖3项。发表学术论文200余篇，包括TKDE、TIFS、ACL、AAAI和IJCAI等顶会在内SCI检索120余篇，申请专利60余项，已毕业博士、硕研究生40余名。liaiping@nudt.edu.cn
