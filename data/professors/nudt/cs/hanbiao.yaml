bio_raw: 男,长期从事计算机网络和网络空间安全研究，博士毕业于筑波大学计算科学系，2013年至今在国防科技大学计算机学院工作，在多路径传输、网络侧信道安全、无人群智计算等领域取得一系列原创性研究成果，主持国家、省部级科研项目10余项，近年来在Nature子刊、IEEE
  TMC、AAAI、《软件学报》、《计算机学报》等国内外权威刊物和会议发表论文近百篇，授权发明专利20余件，担任多个国际学术期刊编委及国际会议主席，担任Nature系列期刊独立审稿人，培养博士硕研究生30余人。入选芙蓉计划科技创新领军人才、国防科技大学高层次人才培养对象，获中国高校计算机大赛“优秀指导教师奖”。nudtbill@163.com；18273148168
