bio_raw: 男,从事高性能数值模拟、智能科学计算（AI4S）等超算+智能交叉学科方向的科研与教学工作，获中国工业合作协会优秀仿真技术解决方案、开放原子基金大赛一等奖、湖南省教学成果特等奖。
  主讲课程获评湖南省一流课程与湖南省思政示范课程，主要研究成果在JCP,IPDPS,ICPP等国际权威期刊和会议上发表论文20余篇。guoxiaowei@nudt.edu.cn
