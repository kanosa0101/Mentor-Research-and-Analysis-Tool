bio_raw: 女,荷兰代尔夫特理工大学博士，西班牙巴塞罗那超算中心访问学者，主要从事面向CPU、GPU超智融合平台的并行算法、性能优化和高性能数值计算等方向研究工作，获省部级科技进步一等奖，主讲湖南省研究生精品示范课程，主持国家自然科学基金项目1项，参与国家重点研发计划等多项科研与教学项目，先后在TPDS、PARCO、ICS、ICPP、JCST等CCF
  A、B类国际会议和期刊上发表学术论文30余篇，授权国家发明专利10余项，参与出版专著1部，曾获得IPDPS 2014最佳博士生，HPCChina 2019最佳论文，协助指导博士研究生2人、硕研究生3人。13574185428
