bio_raw: 男,长期从事软件与系统安全研究，包括漏洞挖掘、漏洞分析、漏洞可利用性判定，在CCS、NDSS、ISSTA等高水学术会议上发表论文20余篇。指导学生获得信息安全作品赛一等奖、各类国家级网络攻防夺旗赛一等奖/冠军十余次。入选中国科协青年人才托举工程、湖南省优青、中央网信办青年人才，获军队科技进步一等奖、省科技进步一等奖等军队/省部级科技奖励7项，研究成果多次获党和国家领导人批示。jzy@nudt.edu.cn
