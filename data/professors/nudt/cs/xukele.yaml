bio_raw: 男,2016年毕业于法国巴黎六大，入选湖南省青年人才计划，Kaggle Grandmaster。长期从事智能模型开发与迭代研究。主持新一代人工智能2030重点项目课题、国防科技创新特区等相关项目十余项，获省部级一等奖1项，担任重大工程项目副总设计师。在包括ACM
  KDD Cup 等国际人工智能和数据挖掘竞赛中获奖40余项。在相关智能领域的公认的会议和期刊发表论文100余篇，相关论文被引用2000余次，担任多个国际期刊副主编。现任中国自动化学会混合智能专委会委员、中国计算机学会语音对话与听觉专委会执行委员，欧盟/英国科研基金评审专家，担任AAAI等10余个国际顶级会议程序委员，担任20余个国际期刊审稿人，获CCF
  BDCI优秀指导老师奖。xukelele@nudt.edu.cn
