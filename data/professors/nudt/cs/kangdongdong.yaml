bio_raw: '男,原子与分子物理方向骨干，主要从事极端条件下物质结构和动力学性质、激光与物质相互作用、超宽禁带半导体电子结构理论模拟研究，军队优秀博士学位论文作者，主持和参与国家自然科学基金、国家重点研发计划、国家科技重大专项、国防科技创新特区等项目12项。在Nature
  Communications、Physical Review Letters、Matter and Radiation at Extremes等高水平期刊发表SCI论文60余篇，引用600余次，4篇论文进入ESI前10%层次。13873178854

  ddkang@nudt.edu.cn'
