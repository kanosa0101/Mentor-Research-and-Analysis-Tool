bio_raw: 男,中国科学院院士。长期从事高性能计算机体系结构、系统软件和人工智能的研究。曾获国家科技进步一等奖3项，国家技术发明二等奖1项，获何梁何利科学与技术成就奖、陈嘉庚科学奖。指导多名博士研究生获得全军优秀博士学位论文、湖南省优秀博士学位论文，指导多名硕研究生获得全军优秀硕学位论文、湖南省优秀硕学位论文。xjyang@nudt.edu.cn
