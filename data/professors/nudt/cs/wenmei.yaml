bio_raw: 女,长期从事加速器微处理器体系结构研究，主要应用领域包括AI训练/前向、网络报文处理等，部分研究成果成功应用于大型工程项目。获省部级科技进步一等奖2项，湖南省自然科学二等奖1项，全国百优博士论文题名奖等。主持和参加国家级项目多项，类别包括国家自然科学基金重点、面上、青年基金项目，及国家科技部重点项目等，在IEEE
  micro、TPDS等期刊和DATE、DAC等会议发表学术论文80余篇。培养博士10余名，硕20余名，指导学生获得院优秀毕业生、光华奖学金、多项国家级大创项目支持等。授权专利若干。meiwen@nudt.edu.cn
