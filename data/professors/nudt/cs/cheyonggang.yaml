bio_raw: 男,主要从事高性能并行算法、异构/跨平台并行编程、人工智能等方向研究，主持国家自然科学基金、863、国家重点研发计划等项目/课题15项，负责在国产超算上开发多套并行应用软件，获部委级科技进步一等奖等奖励，发表论文100余篇（其中CCF推荐会议及期刊30余篇），获发明专利8项，指导博士和硕生30余名，指导学生获得全国并用挑战赛银奖等奖励。ygche@nudt.edu.cn
