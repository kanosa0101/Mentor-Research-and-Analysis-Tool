bio_raw: 男,系统软件方向学术带头人，长期从事操作系统和云计算等领域的研究工作。从事下一代操作系统架构、云计算和边缘计算等关键技术的研究。主持或参与国家级科研项目6项。先后获国家科技进步一等奖1项、军队/省部级科技进步一等奖4项、二等奖4项。获国务院特殊津贴，求是杰出青年奖、入选国家级人才计划、湖南121人才和中创人才奖。荣立二等功、三等功各1次。授权发明专利30余项，发表论文60余篇。ystan@nudt.edu.cn
