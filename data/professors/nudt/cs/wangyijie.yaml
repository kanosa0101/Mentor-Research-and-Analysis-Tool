bio_raw: 女,主要从事人工智能、大数据、云计算等前沿研究。国家重点研发计划重点专项总体专家组专家，湖南省第十四届人大代表，全国优秀博士学位论文获得者，国家教育部青年教师奖获得者，入选湖南省新世纪121人才工程，湖南省杰出青年基金获得者，湖南省优秀研究生导师，长沙市三八红旗手。荣立二等功。中国计算机学会杰出会员，信息存储专委副主任。主持国家重点研发计划、科技创新2030、国家自然科学基金、国家863计划等国家级项目20余项。获国家科技进步二等奖1项、省部级科技进步奖一等奖1项二等奖2项。在IEEE
  Trans.等发表论文200余篇，出版专著3部，获发明专利20余项。培养博士硕100余名。wwyyjj1971@vip.sina.com
