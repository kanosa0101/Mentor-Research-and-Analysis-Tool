bio_raw: 男,从事声子工程领域的基础和应用研究，包括纳米导热、芯片热管理、热能转换和利用、机器学习等。爱思唯尔中国高被引学者，日本学术振兴会（JSPS）访问学者计划（当年全球申请者约1/3获取），中国物理学会青年工作小组委员，中国物理学会“四刊”青年编委，ES
  Materials & Manufacturing 副主编。2017年主持湖北省自然基金杰青项目。2015年获得“楚天学者”特聘教授。2013年获得上海“浦江人才”计划。2012美国物理联合会杂志AIP
  Advances中国作者热点人物。2009教育部“国家优秀自费留学生奖学金”。主持国家重点研发计划、国家自然科学基金、华为公司等研究项目。共发表通讯/第一作者文章81篇，其中8篇ESI高被引论文，他引逾3000次，H指数40。nuo@nudt.edu.cn
