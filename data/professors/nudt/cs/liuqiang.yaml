bio_raw: 男,国防科技大学优秀教师，学校青年创新奖获得者，从事网络安全、机器学习、人工智能安全等方向。获湖南省自然科学一等奖1项，国防科技大学青年创新奖获得者。主持国家重点研发计划子课题、国家自然科学基金等项目7项。在IEEE
  TKDE、IEEE TWC、IEEE Network、PR、The Computer Journal、计算机研究与发展、信息安全学报、ACM MM、AAAI等顶级期刊和会议发表论文90余篇（含ESI高被引论文1篇）。担任教育部计算机课程思政虚拟教研室学术委员会委员。qiangliu06@nudt.edu.cn
