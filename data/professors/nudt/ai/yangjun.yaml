bio_raw: 男,仪器科学与技术学科带头人,国家有突出贡献中青年专家，国家万人计划和军队科技创新领军人才。从事智能无人领域的精确测量、精确感知和精确打击的教学科研工作，相关成果已批量应用。兼任国务院学科评议组成员、教育部教学指导委员会委员等。获国家技术发明二等奖、军队科技进步一等奖等10余项科技奖励。指导的博士中有3人次获优秀博士论文。jyang@nudt.edu.cn
