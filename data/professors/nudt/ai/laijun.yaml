bio_raw: 男,1.本方向一方面注重研究单无人系统的位置感知，也研究无人集群的协同定位导航。本人重点研究单无人系统基于跨视角图像匹配的地理定位方法，以及基于距离测量的无人集群协同定位与导航。
  2.近五年，以第一作者或通讯作者/第二作者在国内外重要刊物上发表论文共5篇。其中以第一作者发表的论文，被SCI、SSCI或A&HCI、国家一级学会正式发布推荐的国际学术会议和期刊、本学科国内代表性期刊等检索收录5篇。laijun25@nudt.edu.cn
