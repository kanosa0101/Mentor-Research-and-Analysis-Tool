bio_raw: 男,仪器科学与技术学科教授，博士毕业于英国伯明翰大学国家量子传感与计量中心，长期从事量子精密测量研究。入选国家级“青年人才”、中国科协“青年人才托举工程”、高层次创新人才工程青年科技英才，担任《EPJ
  Quantum Technology》等3本国际期刊编委；荣获国家一级学会科技进步一等奖1项，出版学术专著/教材4部，以第一/通讯作者在Sci.Adv.、Nano
  Lett.、IEEE Trans等国际高水平期刊发表论文20余篇，授权国际专利3项。lxz334@nudt.edu.cn
