bio_raw: 男,副研究员，硕导，英国UCL大学访问学者。长期从事光学超精密加工技术研究，负责国防重大专项、国家自然科学基金、中科院先导专项、xxx重大工程专项等项目10余项，面向光刻物镜、空间相机、惯约装置、激光装置等国家重大任务开展核心技术攻关，创新提出时空共融调控的光学加工新理论，先后发表SCI论文40余篇，授权专利20余项，代表性成果在nature子刊Light系列期刊Light：Advanced
  Manufacturing（LAM）上发表。获军队科技进步一等奖1项，湖南省技术发明一等奖1项，中国仪器仪表学会技术发明一等奖1项，北京市技术发明一等奖1项。songci@nudt.edu.cn
