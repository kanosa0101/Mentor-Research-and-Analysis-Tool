bio_raw: 男,仪器科学与技术学科研究员，某重点项目总师，博士生导师，军队高层次人才，国防科技大学领军人才，部委专业组专家。主要从事时空组网测量领域研究工作，在北斗星间链路、无人系统区域/协同定位导航、分布式动态时频同步等方面取得一大批高水平研究成果。作为主要完成人获国家技术发明二等奖、军队科技进步一等奖、中国指控学会科技进步一等奖等6项科技奖励，参与及指导学生发表NSR,
  IEEE Tran., GPS Solut.等顶刊发表论文30余篇，出版专著1部。nudtgxy@nudt.edu.cn
