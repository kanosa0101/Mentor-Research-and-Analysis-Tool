bio_raw: 男,博士，副研究员，研究室主任。主要从事装备智能保障领域关键技术和应用研究，采用信息技术、智能技术赋能装备设计与运维保障过程，提升装备的可用性。主持和参与国家自然科学基金、部委级预研等项目20余项，发表学术论文30余篇，授权发明专利10余项，参编出版论著4部，获军科委综合保障领域科技十大进展1项，获中国船舶重工集团科技进步二等奖和国防科技进步二等奖各一项。luoxu2009@163.com
