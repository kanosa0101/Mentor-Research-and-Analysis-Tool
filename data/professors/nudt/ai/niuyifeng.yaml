bio_raw: 男,教授、博导，校领军人才，省优秀导师团队成员，军科委某专家组专家，中国自动化学会UAS自主控制专委会副主任，《无人系统技术》副主编等。主要从事智能无人系统、多机协同感知与决策、人机协同监督控制、单机自主规划与避障等研究。主持国家/军队重点项目20余项，获军省级科技奖一等奖、三等奖各1项；国家级教学成果二等奖、省级一等奖、军队级三等奖各1项。出版专/译著10余部，获全国教材建设奖二等奖1项，发表论文100余篇，授权专利30余项，国军标1项。niuyifeng@nudt.edu.cn
