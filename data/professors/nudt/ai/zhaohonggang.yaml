bio_raw: 男,博士，研究员，全国优秀博士学位论文提名，校优秀研究生导师。主要从事声子晶体、声学超材料基础理论及振动与噪声控制应用基础研究。主持和参与国家自然科学家基金等项目20余项。发表学术论文50余篇，出版专著1部。研究成果先后获军队、国防科技进步一等奖以及湖南省自然科学技术进步一等奖各1项。zhhg9603@sina.com
