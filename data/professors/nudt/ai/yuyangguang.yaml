bio_raw: 男,副教授，硕导，中国指控学会分委员会委员，《智能安全》期刊青年编委。近主持国科青年基金项目等国家军队项目3项，参与国自然重点项目1项、国防领域重大项目10余项，经费总额6000余万元。组织中国机器人大赛无人机赛事等多项重大赛事，多次指导学员获国家级赛事冠军。在IEEE
  TSMC《中国科学：信息科学》等国际顶级期刊上发表高水平论文20余篇。荣获中国指控学会科技进步奖一等奖1项，获国家“博新计划”、校高水平人才培养计划支持。yuyangguang11@nudt.edu.cn
