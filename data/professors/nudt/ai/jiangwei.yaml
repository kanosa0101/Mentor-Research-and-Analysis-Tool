bio_raw: 女,仪器科学与技术学科博士，副教授，米兰理工大学联合培养博士，长期从事无人系统智能侦测与对抗领域教学科研工作，主要围绕分布式协同侦察、多源数据智能融合的态势感知与对抗等开展研究。主持和参加装备技术基础、国际影响力种子基金、国防173基金等国家和军队级项目20余项，在国内外顶级期刊、会议发表高水平论文20余篇，出版专著2部，授权专利5项。weijiang@nudt.edu.cn
