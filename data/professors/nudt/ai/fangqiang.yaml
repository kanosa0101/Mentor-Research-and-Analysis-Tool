bio_raw: 男,教研室主任，副教授，国家级竞赛优秀指导教师，获学校教学成果一等奖。针对无人机/卫星等平台，开展基于大模型的智能感知与决策算法与应用研究，主要包括开放词汇目标检测、伪装目标检测、小目标检测、逆强化学习决策等。承担10余项国家和军队级科研项目，申请/授权发明专利20余项，以第一/通讯作者在IEEE
  TNNLS、TCSVT、TGRS、CVPR、ICRA、IROS等国际顶级期刊会议发表论文20余篇。qiangfang@nudt.edu.cn
