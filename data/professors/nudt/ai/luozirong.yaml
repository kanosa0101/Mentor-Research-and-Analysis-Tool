bio_raw: 男,教授、博导。针对装备无人化、智能化的发展趋势，通过机械、生物、材料、控制等学科的交叉开发高性能仿生机器人与无人平台，研究领域包括微纳仿生机器人、仿生灵巧手、水陆两栖仿生机器人等，研究内容包括：仿生机器人设计与制造、仿生运动与驱动技术、新概念能源与动力等。主持国家自然科学基金等项目20余项，获省部级教学科研成果一等奖1项、二等奖2项，国际发明博览会金奖4项，获国家发明授权专利50多项，发表SCI论文40余篇。louzirong@nudt.edu.cn
