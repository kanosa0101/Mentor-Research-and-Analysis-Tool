bio_raw: 男,博士，长期从事超精密加工技术研究，面向现代装备精密化、智能化发展需求，开展超精密加工装备、超精密抛光方法、面向空间观测、探测制导、光刻、强光等重大光学系统核心元件的超精密加工装备和创新技术等研究。主持和参与项目30余项，发表论文50余篇，授权专利20余项，获军队/省级科技进步一等奖各1项。tiny_hh@139.com
