bio_raw: 男,副研究员，硕导，美国马萨诸塞大学联合培养博士，西北工业大学控制科学与工程专业博士，长期从事网络通信与信息安全技术方向，现任中国人工智能计量委员会委员、电子学会人工智能专委会委员，主持重点项目10余项，发表SCI论文30余篇，获发明专利30余项，专著/译著4本。yindong@nudt.edu.cn
