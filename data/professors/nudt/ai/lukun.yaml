bio_raw: 男,主要从事微机电系统方面研究，主持国家自然科学基金、装备预研项目、173重点课题等6项，获军事科技进步一等奖（7），国防科技大学重大科技进展奖（5）。以第一发明人授权发明专利6项（含国际专利1项），支撑完成成果转化，以第一作者发表高质量学术论文8篇，1篇论文获评精品科技期刊顶尖学术论文。lukun@nudt.edu.cn
