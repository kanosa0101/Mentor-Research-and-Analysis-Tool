bio_raw: 男,副教授，脑科学与人工智能领域青年骨干。入选军事科技领域青年人才托举工程，获评全军优秀博士学位论文奖，享受军队专业技术人才三类岗位津贴。主持国自科青年基金等项目，国自科创新群体核心成员、骨干参与科技创新-2030重大项目等，发表SCI论文30篇，以第一/共一作者在人工智能领域顶刊IEEE
  TPAMI(中科院1区TOP，ESI前1%高被引)、Advanced Science、IEEE TMI等期刊发表论文8篇，其中ESI前1%高被引论文2篇，成果应用于普适性兵员选拔，有效预防非战斗减员。sujianpo10@nudt.edu.cn
