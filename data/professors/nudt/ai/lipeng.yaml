bio_raw: 男,从事智能机器人控制、无人系统控制等方面理论与应用研究。承担国家自然科学基金、装备预研、型号工程等项目，在IEEE汇刊、中国科学、IEEE CDC等发表论文40余篇，ESI高被引论文2篇。出版教材1部，译著1部。军队优秀专业技术人才三类岗位津贴获得者。lipeng_2010@163.com
