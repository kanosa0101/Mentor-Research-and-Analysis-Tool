bio_raw: 男,长期从事声学、力学超结构基础理论及结构声振控制、水下目标声隐身等应用基础研究。主持和参与国家自然科学家基金、型号科研等项目20余项。发表学术论文20余篇，出版专著1部。在声学/力学超构隐身材料、无人航行器散射声场控制等方面取得重要突破，获军队科技进步一等奖1项。haibinyangsn@sina.com
