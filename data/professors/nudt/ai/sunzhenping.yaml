bio_raw: 男,控制科学与工程专业博士，研究员，硕士生导师1998年以来长期致力于地面无人系统暨车辆无人驾驶技术的研究工作，是我国第一辆高速无人驾驶汽车和第一台无人巡逻车的主要研制人员，主持和参与二十余项国家和军队科研项目，先后获部委级科技进步奖三项，发表论文40余篇。sunzhenping@nudt.edu.cn
