bio_raw: 男,博士，副教授，长期从事特种作业机器人技术研究工作，主持英国皇家学会牛顿国际学者项目、国自科面上项目、青年项目等10余项。在领域内知名期刊/会议发表论文80余篇，其中，中科院一区TOP期刊30余篇，其中一作/通信作者40余篇；授权发明专利30余项，软件著作5项；出版专著2部。获评学校引进高层次青年英才，获中国自动化学会优秀硕士学位论文导师奖，指导学生在国家级机器人比赛获奖20余项。chenyanjie@nudt.edu.cn
