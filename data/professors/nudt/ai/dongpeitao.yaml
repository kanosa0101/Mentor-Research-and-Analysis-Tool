bio_raw: 男,军队优秀硕士论文导师、国家自然科学基金同行评议专家、军队优秀专业技术人才三类岗位津贴获得者、美国佐治亚大学国家公派访问学者。主要围绕微纳制造、高灵敏生化感知、仿生电子鼻等前沿交叉方向开展研究。主持基础加强计划重点项目课题、装发预研、国家自然科学基金面上等项目10余项。发表SCI论文50余篇（含ESI高被引论文2篇）。ptdong@nudt.edu.cn
