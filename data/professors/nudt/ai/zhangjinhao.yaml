bio_raw: 男,博士，副教授。入选国家“博新计划”与军队“青年科学英才”，主持国家自然科学基金面上和青基、军队技术领域基础、军队高层次科技创新人才工程等项目。从事智能结构设计方法研究，应用于潜航器、飞行器等高端装备。以第一/通讯作者在Nature
  Communications、Science Advances发表SCI论文20余篇，获省自然科学一等奖1项。jinhaomail@nudt.edu.cn
