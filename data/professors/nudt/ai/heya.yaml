bio_raw: 女,博士，副研究员。入选中国科协第十届青年人才托举工程，面向装备服役安全和维修保障需求，开展复杂机械系统声振一致性评价技术研究，主持国家自然科学基金、装备预研实验室基金等项目。累计发表SCI论文20多篇，申请发明专利近10项，任JDMD等期刊青年编委，中国振动工程学会分会青年委员。heya1301@163.com
