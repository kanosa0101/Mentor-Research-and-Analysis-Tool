bio_raw: 男,教授，博导。主要从事智能控制理论以及机器人技术领域的研究工作，方向为机器人智能控制、多机器人协同控制、学习控制、多智能体追逃博弈控制。承担国家自然科学基金、国防型号工程、装备预研等项目20余项，在IEEE
  TNNLS、IEEE TCYB、IEEE TSMCA、IEEE TAES等权威期刊发表SCI/EI论文100余篇，ESI高被引论文1篇，授权专利5项，荣立个人三等功1次。mjj_nudt@nudt.edu.cn
