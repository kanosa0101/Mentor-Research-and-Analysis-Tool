bio_raw: 男,从事仿生导航智能导航与感知技术研究，入选军队高层次人才工程青年科技英才、湖南省芙蓉青年人才、国防科技大学学科拔尖人才等，澳大利亚机器视觉中心联培博士，主持国家自然科学基金等8项，出版专著教材4部，发表高水平论文35篇，专利30项，获军科委、空军创新奖3项。围绕无人作战平台开展仿生智能导航、新型视觉导航与感知和惯性基组合导航等方面的研究与应用。军队首届精品课与湖南省线上线下一流课程主讲人。fanchen@nudt.edu.cn
