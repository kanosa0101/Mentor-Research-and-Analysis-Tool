bio_raw: 男,副研究员，硕士生导师，中科协青年托举人才，主要从事微机电惯性器件先进制造、精密测控电路及微纳谐振器基础理论方面的研究，主持173领域基金、学校科研计划等科研项目3项，在Nature
  Comm等期刊发表论文40余篇，获军事科技进步一等奖，国防科技大学青年创新一等奖、国家领军期刊优秀青年科学家。sunjiangkun15@nudt.edu.cn
