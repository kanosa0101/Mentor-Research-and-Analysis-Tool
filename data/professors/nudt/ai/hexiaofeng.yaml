bio_raw: 男,博士，德国基尔大学、英国卡迪夫大学访问学者。出版学术专著4部，出版教材4部。获军队科技进步二等奖2项，主持国家自然科学基金面上项目等10项。围绕空地无人平台，开展北斗/惯性组合导航、仿生导航和微小型GNC系统技术等方面的研究与应用。hexiaofeng@nudt.edu.cn
