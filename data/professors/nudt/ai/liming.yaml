bio_raw: 男,主要从事视觉感知机理及其计算模型方面的研究工作，具体包括视觉感知机理、计算机视觉模型、大脑视觉认知能力评估与增强等。主持多项国家级、军队级科研项目，在Science子刊、IEEE汇刊、
  《中国科学》等权威杂志上发表论文40余篇，获教育部自然科学奖、湖南省科技创新奖，获全国自动化学会教学成果奖、湖南省教学成果奖等多项奖励，入选学校高层次“领军人才”培养计划。湖南省首届优秀研究生指导团队“认知科学导师团队”成员。liming78@nudt.edu.cn
