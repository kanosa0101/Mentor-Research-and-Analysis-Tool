bio_raw: 男,主要从事导航技术、组合导航、重力测量的研究。中国测绘学会海洋测绘专业委员会委员。承担国家自然科学基金、国家重点研发计划等项目多项。授权专利16项、登记软件著作权6项，发表论文40余篇，出版专著4部，获湖南省科技进步二等奖1项（排名1），自然资源科学技术奖科技进步一等奖1项shaokuncai@nudt.edu.cn
