bio_raw: 男,副研究员，硕士生导师，长期从事电磁悬浮与推进控制技术领域教学和科研工作，目前正在从事磁浮飞轮、磁悬挂天平、磁浮列车等复杂装备系统设计与智能控制、智能检测等关键技术研究工作，主持国家自然科学基金、国家重点研发计划、军民融合等课题10余项，作为主任设计师先后参与长沙磁浮快线、北京S1线等重大工程攻关任务。获省部级科技进步一等奖2项，二等奖1项，发表论文60余篇，获国家专利20余项。francis@nudt.edu.cn
