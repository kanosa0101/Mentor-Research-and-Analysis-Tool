bio_raw: 男,博士，副研究员。长期从事智能光学精密工程研究，负责国家重点研发计划引力波专项课题、国防预研、国家自然科学基金等13项国家/军队课题，国内首创研制频域可控离子束技术，实现宏观尺度上的逐层原子剥离，应用于激光聚变、同步辐射等国家重大工程。实现多自由度超构表面制备，创新超表面+阵列多波导增强/虚拟现实（AR/VR）智能光学模组，研制智能时代的关键人机交互入口。获军队科技进步一等奖1项。发表论文20余篇，发明专利12项，美国发明专利1项。tianyecomeon@sina.cn
