bio_raw: 男,副研究员，美国北卡罗来纳大学教堂山分校访问学者，基于智能无人作战实验训练中心等重点平台从事大小模型协同辅助决策和基于推理的多源信息融合等关键技术研究。入选军事科技领域青年托举人才、国防科技大学青年英才，获军优硕和省优博。主持国家和军队级项目5项，发表TPAMI、ICML、NeurIPS等CCF
  A类、中科院1区Top等论文47篇，ESI前1%高被引论文3篇，获湖南省计算机学会科学技术一等奖。shzhou@nudt.edu.cn
