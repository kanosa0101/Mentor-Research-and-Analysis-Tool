bio_raw: 男,德国慕尼黑工业大学访问学者，中国惯性技术学会理事，某重大基础研究项目技术首席、某创新项目副总师，获教育部自然科学二等奖、军队科技进步二等奖。主要围绕无人平台、单兵装备和无人集群的导航需求，开展惯性组合导航、多模态视觉导航、多源信息智能融合导航和协同导航技术研究。发表论文30余篇，专利30余项、出版教材专著5部。afeipan@126.com
