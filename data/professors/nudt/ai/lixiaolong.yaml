bio_raw: 男,主要从事磁浮列车悬浮控制的理论和工程化研究。2014年开始主持长沙磁浮快线悬浮系统研发工作，该线为我国第一条中低速磁浮商业运营线。主持研究时速600公里高速磁浮关键技术攻关。曾获军队育才奖银奖，荣立三等功一次。13787786254@163.com
