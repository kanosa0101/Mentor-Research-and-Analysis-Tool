bio_raw: 男,副教授，硕士生导师，控制科学与工程博士学位，学院青年骨干教师，中国自动化学会高级会员、CAA混合智能专业委员会委员。主要围绕智能规划与决策中的关键科学问题开展大模型、多智能体自主协作和时空机器学习等方向的教学科研工作，承担或参与国家自然科学基金、技术领域基金等国家和省部级重点科研项目10余项，发表IEEE汇刊等高水平学术论文30余篇，出版专著/教材4部，授权发明专利9项，软著1项。欢迎对本人相关研究方向感兴趣的同学报考。xiangfengtao@nudt.edu.cn
