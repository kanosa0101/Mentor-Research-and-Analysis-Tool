bio_raw: 男,教授，博导，英国曼彻斯特大学访问学者，校优秀研究生导师。获国家专利授权20余项，发表学术论文100余篇。主持国家重点研发计划、国家自然科学基金等课题多项。主要研究智能传感技术、目标探测技术和装备测试计量技术。chendixiang@163.com
