bio_raw: '男,青年托举人才，学校拔尖人才。意大利米兰理工大学博士学位。主要针对复杂环境中智能无人系统的自主决策与优化控制等关键科学问题，开展安全强化学习、学习型预测控制、以及机器人自学习优化规划和控制方法等研究。发表学术论文40余篇，申请/授权国家发明专利10余项。以第一/通信作者在Automatica、IEEE
  T-CST、IEEE T-SMC: Systems、 IEEE T-IV等国际顶级期刊和会议发表论文10余篇。zhangxinglong18@nudt.edu.cn'
