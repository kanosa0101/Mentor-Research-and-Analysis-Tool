bio_raw: 男,副教授，荷兰格罗宁根大学联合培养博士，长期从事机器人技术相关研究工作，主持国自科青年基金、科技委1XX工程等项目，作为技术骨干参与国家/军队级项目10余项。在领域内知名期刊/会议发表高水平论文20余篇，授权发明专利10余项，软件著作1项，出版专著2部。国家级精品课程主讲教师，获评学校第三批高层次创新人才培养对象-青年英才，湖南省优秀博士和硕士学位论文，2022年度中国机器人大赛优秀指导教师一等奖。weidai_nudt@foxmail.com
