bio_raw: 男,仪器科学与技术学科研究员，博士生导师。从事面向多域无人系统的智能天基测量、通信、网络与测试技术，主要开展天基智能网联、星间协同组网与测量、网络化时空基准确定与维持、装备智能化测试验证等领域的教学科研工作。取得了导航星间链路、卫星导航模拟测试、天基智能网联系统、新一代扩频测控与广播分发等一系列科研成果，出版专著6部，获国家技术发明二等奖、军队科技进步一等奖等7项科技奖励。kdcjy@sina.com
