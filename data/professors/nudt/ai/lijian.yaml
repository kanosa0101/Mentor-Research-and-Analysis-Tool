bio_raw: 男,教授、博导，国防科技大学青年拔尖人才、军队首批青年科技英才，全国高校计算机专业优秀教师。主持国家自然科学基金、科技委项目多项。提出多尺度视觉注意理论、持续学习理论以及动态引导网络，受国际广泛关注，算法在国际KITTI数据库位居榜首，相关论文发表于TPAMI、IJCV、TIP、CVPR、ECCV等，被广泛正面评价、使用。技术成果实现我国首次大型火箭无人化转运、神16返回舱应急搜救等任务。获省优秀博士论文、湖南省自然科学一等奖、军队科技进步一等奖。lijian@nudt.edu.cn
