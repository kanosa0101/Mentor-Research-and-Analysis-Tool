bio_raw: 男,澳大利亚机器人视觉中心联合培养博士，学院青年骨干教师，主要从事视觉/惯性组合导航、仿生智能导航和协同导航等方面的研究，主持国家自然科学基金项目等4项，参与在研国家/军队级项目10余项，授权专利10项，发表高水平论文20余篇，出版专著1部，获军队教学成果奖1项maojun12@nudt.edu.cn
