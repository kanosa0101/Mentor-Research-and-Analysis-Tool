bio_raw: 女,仪器科学与技术学科副教授，博士毕业于清华大学，从事测量理论与方法、系统测试与评估等领域的教学科研工作，相关成果在卫星导航仿真测试系统中得到应用。获军队科技进步一等奖1项、全国行业学（协）会科技一等奖2项、中国航科集团国防科技进步三等奖1项，出版专著1部、教材2部。humei@nudt.edu.cn
