bio_raw: 男,副教授，硕导，加拿大麦吉尔大学博士，国际交流引进计划博士后，湖南省优秀青年基金、湖南省优秀博士后人才，国防科技大学拔尖人才培养对象。主要从事类生命体机器人肌肉驱动、生物3D打印、仿生结构设计与制造方向研究，主持国家自然科学基金、军科委基础加强基金、自主科研基石基金等项目8项，发表SCI/EI论文30余篇，1篇进入ESI前1%，获授权专利30余项。jiangtao@nudt.edu.cn
