bio_raw: 男,副研究员，主要从事作战仿真、任务规划、态势智能认知和智能体建模、智能无人作战试验训练等研究,发表学术论文30余篇，指导学员参加全国计算机仿真大奖赛获优秀指导老师称号。主持和参与国家科技部重点研发、国防型号、国防创新特区等项目20余项。获国家标准创新贡献奖三等奖1项、省部级科技进步二等奖3项和三等奖1项，享受军队优秀人才三类岗位津贴，荣立三等功1次；发明专利13项，软件著作权20项，国家军用标准7项。fj_gjx@nudt.edu.cn
