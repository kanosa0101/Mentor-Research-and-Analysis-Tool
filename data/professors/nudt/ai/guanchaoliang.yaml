bio_raw: 男,博士，副研究员，湖南先进技术研究院超精密智造协同创新中心主任，超精密装备方向学术带头人。主要从事机械/光学交叉的超精密加工装备与工艺研究，包括静压基础部件、超精密车削/磨削机床、通量可调离子束修形新工具、超高精度光学加工工艺等。chlguan@nudt.edu.cn
