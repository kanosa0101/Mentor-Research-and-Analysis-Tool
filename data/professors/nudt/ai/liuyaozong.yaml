bio_raw: 男,研究员，博导，中国振动工程学会磁悬浮技术与振动控制专委。长期从事机电系统动力学及其控制方面的研究，主要包括磁悬浮控制、磁浮列车动力学、磁浮隔振、振动主动控制、工业机器人协同控制等。曾获全国百优博士论文提名，省科技进步一等奖1项。承担自然基金等国家和军队级课题十余项，出版专著2部，授权发明专利20余项，发表论文100余篇。13508474282@163.com
