bio_raw: 女,副研究员，主要研究方向为并行与分布仿真、复杂系统建模与仿真。指导国家级大学生创新项目2项，2018年指导学生获第八届全国计算机仿真大奖赛1项。参与国家级和军队级重大工程负责仿真平台设计和开发工作任主任设计师，主持和参与国家、湖南省和军队科研项目多项。长期从事军事建模与仿真、智能无人试验训练的研究和教学工作，获军队科技进步三等奖3项，中国仿真学会自然科学奖二等奖1项。yangmei@nudt.edu.cn
