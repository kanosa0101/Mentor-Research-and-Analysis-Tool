bio_raw: 男,副研究员，航空宇航科学与技术专业博士。以高超声速飞行器、跨域变构飞行器等新型飞行器为主要研究对象，开展飞行器智能轨迹规划、在线自主决策、智能博弈对抗等基础理论、关键技术研究。承担国家重大科技专项、国家自然科学基金等科研项目20余项，获军队科技进步一等奖2项，出版专著教材5部，发表论文20余篇，授权发明专利10余项。xieyu@nudt.edu.cn
