bio_raw: 男,博导，仪器科学与技术学科建设负责人，全国黄大年式教师团队骨干、军队传感器领域专家、湖南省杰青国家CSC“未来科学家”计划和军队高层次科技人才工程入选者。主要从事高灵敏磁传感芯片、高性能磁场/电场传感器、柔性复合传感器、地磁矢量测量、生物磁测量以及水下目标预警探测等研究。承担国家、军队级科研项目20余项，在APL、AFM、MINE等权威期刊发表论文70余篇，授权专利40余项，获国家、军省级教学科研成果奖励9项。garfield_nudt@163.com
