bio_raw: 男,国防科技大学高层次创新拔尖人才，从事惯性组合导航、协同导航等相关研究，主持国家自然科学基金、军科委基础加强等项目，获中国自动化学会自然科学奖一等奖，出版高水平专著1部，以第一发明人获授权发明专利6项，获湖南省优硕论文和中国惯性技术学会优博论文奖。国家一流课执行负责人，国防科技大学优秀新星和最受欢迎教师。wangmaosong12@nudt.edu.cn
