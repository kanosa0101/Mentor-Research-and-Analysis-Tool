bio_raw: 男,副研究员，硕导，中国机械工程学会可靠性工程分会青年委员。长期从事结构强度与可靠性、多尺度失效机理、寿命预测等研究。曾获军事科学技术进步奖二等奖、中国发明创业成果奖二等奖，荣立三等功1次。在国际高水平期刊和会议上发表SCI/EI论文30余篇，参与出版专著3部、译著1部，授权国家发明专利8项，编制国家军用标准1项。主持国家自然科学基金、预研课题、军科委基础加强实验室基金等项目7项。fanzhengwei@nudt.edu.cn
