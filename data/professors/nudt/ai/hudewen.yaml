bio_raw: 男,中国科学院院士，长江学者特聘教授，国家杰出青年基金获得者，学院学科方向带头人。主要从事认知科学与信息处理、人工智能等方面的研究。具体包括视觉计算、脑机接口等研究方向。主持各类国家级、军队级重点项目等。带领团队获国家自然科学奖2项，省部级5项。湖南省科技创新团队“无人作战系统技术”团队带头人。dwhu@nudt.edu.cn
