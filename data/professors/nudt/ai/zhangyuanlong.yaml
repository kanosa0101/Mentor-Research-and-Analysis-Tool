bio_raw: 男,副教授,主要从事高超声速飞行器任务规划、弹道规划、再入制导等方面的研究工作，参与和主持国家重大专项、国家自然科学基金、火箭军装备预研、军内科研、湖南省教学改革项目等17项教学科研项目，获2019年的军队科技进步一等奖1项（8），2021年全军首届任务规划创客大赛二等奖（3）和优秀奖（1），以第一作者（含通信）发表高水平SCI/EI论文16篇，第一发明人申请专利7项（其中授权6项，1项在审），分别以第一作者和第3作者各出版专著1部。zhangyl_0728@163.com
