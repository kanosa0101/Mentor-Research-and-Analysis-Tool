bio_raw: 男,入选国防卓越青年基金、万人计划领军人才、军队高层次科技拔尖等重大人才工程。针对装备信息化、智能化发展需求，开展光学复杂表面超精密加工方法，先进光学制造的理论和装备，空天探测制导、精确打击光学系统的设计与制造创新研究等。pengxiaoqiang@nudt.edu.cn
