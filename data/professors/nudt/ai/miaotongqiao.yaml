bio_raw: 男,军事青托、湖南省优青，获军事科学技术进步一等奖1项、湖南省优秀博士学位论文。2022年博士毕业于国防科技大学控制科学与工程专业， 后一直从事微惯性导航、智能导航相关科研教学工作，在《Nature
  Communications》、《Microsystem&Nanoengineering》等国际著名期刊发表学术论文20余篇，申请国家发明专利6项。先后主持或参与国家自然科学基金青年基金、基础加强计划、国家重点研发计划、武器装备预先研究项目等10余项。miaotongqiao12@nudt.edu.cn
