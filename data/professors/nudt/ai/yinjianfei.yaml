bio_raw: 男,教授/博导，入选军队青年科技英才，科协青年托举工程。从事装备振动与噪声控制、声学超材料及冲击防护结构设计理论及应用研究。承担20余项国家和军队科研项目，发表SCI论文40余篇，出版专著3部，获湖南省自然科学一等奖、军队科技进步一等奖。nmhsyjf@nudt.edu.cn;
