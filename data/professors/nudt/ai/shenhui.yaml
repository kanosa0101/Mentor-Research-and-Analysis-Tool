bio_raw: 男,主要从事认知科学与人工智能技术的学科交叉领域应用基础研究，包括脑成像信号分析，智能脑机交互，脑启发感知智能技术等研究方向。目前承担多项国家、军队及国防基础科研计划重点项目。成果曾获国家自然科学二等奖。入选军队高层次科技创新人才工程。shenhui@nudt.edu.cn
