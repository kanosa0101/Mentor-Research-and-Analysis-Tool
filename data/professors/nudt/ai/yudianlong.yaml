bio_raw: 男,主任、研究员、博导、湖南省科技创新领军人才、加拿大麦吉尔大学访问学者。主要从事声学超材料基础理论及减振降噪应用探索、装备智能保障与无人装备保障等研究。主持自然科学基金等科研项目10余项，发表多篇高水平学术论文，获湖南省自然科学一等奖2项，军队科技进步一等奖1项。dianlongyu@vip.sina.com
