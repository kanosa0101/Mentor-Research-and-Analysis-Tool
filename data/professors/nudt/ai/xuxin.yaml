bio_raw: 男,国家杰出青年科学基金获得者，国家自然科学基金创新研究群体负责人，获国家自然科学二等奖、湖南省自然科学一等奖等奖励，发表SCI论文160余篇，主要针对复杂环境中智能驾驶车辆和无人系统的自主感知、决策与优化控制需求，开展强化学习、视觉认知与人机智能融合、以及无人车辆的自学习优化决策和控制方法等研究。xuxin_mail@263.net
