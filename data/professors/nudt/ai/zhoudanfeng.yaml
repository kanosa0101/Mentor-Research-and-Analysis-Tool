bio_raw: 男,从事超高速悬浮推进和磁悬浮智能控制、超导电动悬浮、车-轨动力学及振动控制等研究。主持我国第一条超高速超导电动悬浮试验线悬浮导向系统设计，突破700km/h稳定悬浮；作为核心骨干负责北京S1线等三条磁浮线车辆悬浮系统设计及调试，攻克悬浮稳定性、车轨耦合共振等难题。主持或参与国家、军队级课题十余项，发表论文60余篇，授权专利二十余项，参编国家标准2部，出版专著1部，获省部级一等奖2项、学会奖1项，立三等功一次。zhoudanfeng@nudt.edu.cn
