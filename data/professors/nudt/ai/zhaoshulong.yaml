bio_raw: 男,副研究员，博导，全军优博，青年骨干教师，中国机器人大赛组委会委员。主要从事无人机集群协同控制、抗扰学习控制、合围跟踪控制等相关研究。主持或参与装备预研、国家自然科学基金项目多项，多次参与重大演习演训活动。共发表TAC、TSMC等高水平期刊SCI
