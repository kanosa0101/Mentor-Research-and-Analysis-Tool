bio_raw: 男,博士，副教授，硕士研究生导师，智能装备精密工程研究室主任，南湖之光实验室高能激光技术部副部长。具有光学工程与机械工程的交叉学科背景，主要从事复杂曲面光学系统、强激光元件智能制造与评估、超宽禁带半导体制造与器件等方面的研究，主持省部级以上科研项目10余项，主编教材1部，发表论文20余篇，发明专利10余项，获军事科学技术进步一等奖1项。yulinlang521@163.com
