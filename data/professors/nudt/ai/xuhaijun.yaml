bio_raw: 男,教授、博导，英国哈德斯菲尔德大学访问学者，国家线下一流课程完成人，国家级规划教材主编。主要研究智能无人系统平台与动力技术，包括智能无人平台构型创新设计与跨域新原理、分布式驱动与灵巧运动控制、两栖减阻增速、新型动力系统与高效传动方法等。主持国家/军队/省部级项目7项、参与10余项，获湖南省技术发明二等奖1项，出版专著1部，发表SCI/EI论文40余篇、获授权专利30余项，指导学科竞赛获国际金奖、全国金奖多项。xuhaijun_1999@163.com
