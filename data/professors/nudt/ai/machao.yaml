bio_raw: 男,仪器科学与技术学科副研究员，硕士生导师，从事无人系统对抗、天基智能理论等方面教学科研工作，作为第一作者发表高水平论文12篇，授权国家/国防专利17项，获仪器仪表学会全国优秀博士学位论文，行业学（协）会科技进步一等奖1项，入选第九届中国科协青年人才托举工程，国防科技大学高层次创新人才青年英才培养对象machao14@nudt.edu.cn
