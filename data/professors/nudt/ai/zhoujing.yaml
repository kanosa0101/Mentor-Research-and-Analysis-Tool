bio_raw: 男,仪器科学与技术学科博士，副研究员，长期围绕网络电磁空间领域开展智能侦测与对抗技术研究，目前主要研究超高速光网络信号检测、无人系统（集群）网电信号侦察及智能体网电脆弱性挖掘等技术研究。主持国家自然科学基金、国防173基金、国家重点研发计划、武器装备研制等项目30余项，授权专利10余项，获得国家科技进步二等奖和军队科技进步二等奖各1项，发表论文20余篇，军队优秀专业技术人才三类岗位津贴获得者。zhou.jing@nudt.edu.cn
