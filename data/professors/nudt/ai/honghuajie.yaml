bio_raw: 男,机械工程学科带头人，天隼实验室主任助理，173首席、无人系统技术专家。发表论文70余篇，获国家教学成果二等奖1项、军队和湖南省教学和科技一等奖4项。以未来无人作战中微小型探测载荷为对象，开展柔性驱动与控制、液态和超表面视觉、声增强设计与控制、计算成像与信息处理等技术研究。opalqq@163.com
