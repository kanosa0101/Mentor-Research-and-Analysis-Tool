bio_raw: 男,博士，副教授。香港理工大学博士毕业，美国宾夕法尼亚州立大学访问学者，国防科技大学引进“青年科技英才”，入选上海市领军人才（海外）计划。致力于结构振动与波动研究，应用于结构振动控制与健康监测。主持参与国家自然科学基金等科研项目10余项，以第一/通讯作者发表SCI期刊论文24篇，论文入选智能材料与结构领域权威期刊SMS的年度亮点论文。担任SCI期刊IJDC青年编委。shanshengbo25@nudt.edu.cn
