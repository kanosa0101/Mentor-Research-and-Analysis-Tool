bio_raw: 男,湖南省芙蓉青年学者、国防科技大学优秀教师，从事无人机决策控制、集群智能协同、深度强化学习等方向研究，主持国自科、装备预研等科研项目10余项，发表TSMC，TCNS等高水平论文50余篇，ESI前1%高被引1篇，指导学科竞赛获国家级一/二等奖10余项，获省教学成果一等奖1项、军队级精品课程1门、学会科技进步一等奖1项，立集体三等功2次。zhliu@nudt.edu.cn
