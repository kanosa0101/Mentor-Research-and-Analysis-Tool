bio_raw: 男,教授、博导，“控制科学与工程”学科学术带头人，国务院学科评议组成员，装发某专业组组长。长期从事任务规划和无人系统等工作，是我国无人系统自主控制技术的主要推动者之一，牵头获军队科技进步奖一等奖2项、省优秀研究生导师团队，出版学术专著5部，发表论文200余篇。lcshen@nudt.edu.cn
