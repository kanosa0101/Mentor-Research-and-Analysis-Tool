bio_raw: 男,教授，博导，获军队科技进步一、二、三等奖8项，多次获教学奖和优秀导师奖，获多项发明专利。面向无人作战场景，研究基于无人机、车、艇、机器人平台的侦察载荷，实现精密测量和计量校准，通过光电、无线、雷达、声纳等传感器对目标和环境进行检测、识别、跟踪、评估，探索多平台跨域协同测量理论方法，完成无人侦察任务。兼顾智慧城市、无人物流、无人驾驶、民用无人机、车、艇及机器人领域的智能目标识别和环境感知研究。susj-5@163.com
