bio_raw: 男,博士，讲师，长期从事机器人智能感知方向研究，入选第四批国防科技大学青年英才，承担军科委自主创新基金、国防科大自主创新专项子课题等项目。发表TRO、TITS、RAL、ICRA、IROS等机器人顶刊顶会论文20余篇，其中第一作者/通讯作者10余篇。获湖南省优秀硕士学位论文。获机器人世界杯救援机器人比赛世界冠军2
  项（第一完成人，为国内团队首次）、全国冠军 3 项（第一完成人），参加“智卫杯”无人系统挑战赛获无人排爆决赛冠军，机器人顶级国际会议IROS2025最佳演示奖。shichenghao17@nudt.edu.cn
