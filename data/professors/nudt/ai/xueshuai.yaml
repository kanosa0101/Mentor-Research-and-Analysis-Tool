bio_raw: 男,研究室副主任，副研究员、硕导，新加坡南洋理工大学访问学者，入选中国科协托举人才、湖湘英才、学校卓越青年人才，获全军优博、学会优博、学校青年创新奖。围绕高端芯片、光刻制造对原子级精度制造需求，采用人工智能、前沿制造理念等开展技术和理论、国际合作和产业研究。主持项目10余项，发表顶刊等论文50余篇，参编专著3部，专利30余项。获军队科技进步一等奖1项，任机械工程学报等期刊青年编委。培养研究生获华为制造部、新凯莱等Offer、1名研究生在研一阶段获研究生国家奖学金、2名研究生受邀赴德国作学术报告。shuaixue1990@163.com
