bio_raw: 男,主要从事人工智能、智能决策、作战任务规划等教学科研工作，兼任军委科技委“XX2工程”“XX6工程”下设某办公室主任、国防科大科技委“认知XX”领域专家。先后参与科研项目30多项，主持重点项目10余项，研制的系统成果长期支撑部队作战指挥辅助决策等。主编出版《作战任务规划》《群体智能理论与方法》等教材/专著4本，发表论文40多篇，专利/软著30多项，获军队科技进步一等奖、二等奖各1项，校院教学成果奖2项，获全军任务规划/联合XX创客大赛一二等奖4项。liuhongfu@nudt.edu.cn
  liu_ho@163.com
