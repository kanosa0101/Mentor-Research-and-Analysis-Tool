bio_raw: 男,仪器科学与技术学科教授，博士生导师。主要从事原子惯性传感器、量子时空基准和纳米测量技术等教学科研工作。共指导毕业博/硕士30余名，其中多名获全军或湖南省优秀博士/硕士学位论文。研究成果获军队科技进步二等奖、全国发明展览会金奖、学校重大科技进展；获中国人民解放军院校育才奖“银奖”、学校优秀导师奖等。yanshuhua996@nudt.edu.cn
