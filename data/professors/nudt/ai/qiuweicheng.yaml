bio_raw: 男,副教授，硕导，国防科技大学与中科院技物所联培博士。主要从事智能传感与探测、二维材料新型传感技术、微纳传感器设计与研发等研究。主持或承担国家重点研发计划、国防科技创新特区、国家自然基金等项目20余项、发表论文50篇、授权专利20项、出版校庆七十周年系列学术专著一部。2008qiuweicheng@sina.com
