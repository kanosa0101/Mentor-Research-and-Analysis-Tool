bio_raw: 男,国防科大十二五引进青年骨干教师，湖南省芙蓉计划青年创新人才，负责国家自然科学基金等国家/军队级课题10余项。针对智能装备精密工程方向发展需求，开展惯性核心器件超精密修调理论、装备系统性能分析与优化等研究，应用于遥控遥感、探测制导等领域；第一/通讯发表SCI论文30余篇，获学校青年创新一等奖、军队科技进步一等奖、中信所F5000论文奖等。ljf20090702122@163.com
