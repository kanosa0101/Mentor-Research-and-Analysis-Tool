bio_raw: 女,副研究员，中国科协青年托举人才、湖南省优青。累计发表包括Nature子刊在内论文近40篇；其中第一、通讯作者15篇，主持国家自然科学基金等项目7项，年均经费约300万，获国际工程大会最佳论文奖等奖项4项。目前致力于利用机器学习进行结构功能材料优化设计、性能预测和反向设计等。现招收硕士研究生，力学、数学、计算机类专业均可报考。zhonghongjia08@nudt.edu.cn
