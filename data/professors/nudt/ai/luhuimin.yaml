bio_raw: 男,博士，教授，入选湖南省高层次人才计划特聘教授。从事智能机器人技术领域教学科研工作，方向为具身智能、人形机器人、无人智能作战。主持“智行者”人形机器人专项工程，出版专著/教材5部，在IEEE
  TRO、ICRA、IROS等顶级期刊会议发表高水平论文60余篇，主持研制“智行者”人形机器人获顶会IROS最佳演示奖，获省科技进步一等奖、学会级科技进步一等奖、军队教学成果一等奖、省教学成果一等奖各1项。lhmnew@nudt.edu.cn
