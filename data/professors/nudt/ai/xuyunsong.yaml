bio_raw: 男,副教授，湖南省优青。从事“自动控制+机器学习”方法与应用研究。曾任长征五号运载火箭测量通信与测控系统总体设计师；主持国家自然科学基金面上、国家重点研发计划等项目多项；第一/通信作者发表自动控制顶刊Automatica、IEEE-TAC及IEEE-TIE、IEEE-TITS、IEEE-TCST、IEEE-TNNLS、IEEE-TSMC、IEEE-TASE、IJRNC等中国自动化学会A+/A类期刊10余篇，第一作者出版英文专著1部；第一发明人授权发明专利5项；参编教材1部，湖南省研究生精品课程负责人。xuyunsong20@nudt.edu.cn
