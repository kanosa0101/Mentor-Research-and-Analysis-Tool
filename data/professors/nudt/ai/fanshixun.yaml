bio_raw: 男,面向智能制造、航空航天、仿生机器人中的智能机电系统，开展新型精密驱动传动、智能化精密运动检测、精密工程与计算机控制、人工智能应用、仿生机器人驱动传动与控制等研究工作。主持和参与国家、军队重点基础研究项目20余项，获省部级科技进步一等奖2项，发表高水平论文60余篇，专利20余项，参编教材3部。国家自然科学基金委机械工程学科发展规划论证组专家，青年科技英才。shixunfan@nudt.edu.cn
