bio_raw: 男,仪器科学与技术学科副教授，主要从事卫星扩频测控、天基智能与星间协同组网、精密测量与时频传递等领域的教学科学工作。主持多项国家自然科学基金、国防科技创新特区项目、装备预研项目等。获军队科技进步三等奖1项，第一作者发表SCI/EI检索论文10余篇，获国家授权发明专利10余项。qu27@163.com
