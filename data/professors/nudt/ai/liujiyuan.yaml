bio_raw: 男,男，1994年12月生，副研究员、硕导，从事多模态机器学习算法与应用研究。获评中国指控学会青年托举人才、湖南省芙蓉计划青年人才，国防科技大学高层次创新人才，承担多项科研项目，发表CCF
  A类和中科院一区学术论文50余篇，引用三千余次，授权发明专利10余项。获湖南省自然科学二等奖（3）、CCF自然科学一等奖（6）、军队优秀博士论文奖，入选前2%顶尖科学家榜单，担任CCF理论计算机科学专委执行委员、CAAI智能融合专委委员、中科院一区TOP期刊《Pattern
  Recognition》编委、二十余个一流期刊会议AC、SPC、PC、审稿人等。相关研究成果已应用在北部战区、南部战区、中国电科等单位，取得了良好的军事和经济效益。liujiyuan13@nudt.edu.cn
