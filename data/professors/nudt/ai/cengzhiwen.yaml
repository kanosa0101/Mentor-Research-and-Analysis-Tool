bio_raw: 男,控制科学与工程专业博士，硕士生导师，长期从事机器人技术、协同控制和深度增强学习等领域研究，发表高水平论文30余篇，申请专利10余项，出版教材1本，任职中国自动化学会竞赛工作委员会委员，主持国家重点研发计划课题、国家重点基金课题、国防科技创新特区项目-前沿创新计划（163）课题、科技委基础加强项目等项目6项，参与多项国家和军队科研项目10余项。z7z7w7@126.com
