bio_raw: 男,教授/博导，美国阿克伦大学访问学者，电子学会可靠性分会副主任委员、仪器仪表学会结构健康监测与预警分会理事、振动工程学会随机振动专业委员会委员。主持完成国家自然科学基金等20余项课题，获军队科技进步二等奖和国防科学技术科技进步二等奖各1项，授权发明专利9项，在机械工程领域TOP期刊发表多篇高水平论文，以第1作者出版Springer专著和十三五国家重点出版物专著各1部。培养的学生获湖南省优秀硕士学位论文。jiangyu@nudt.edu.cn
