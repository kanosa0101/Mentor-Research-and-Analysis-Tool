bio_raw: 男,国家优青和创新研究群体骨干、教育部U40项目负责人、军队高层次科技创新人才、湖南省科技创新领军人才，获国家自然科学二等奖、吴文俊人工智能自然科学一等奖、中国自动化学会青年科技奖和全国脑机接口十大杰出青年科学家奖。主要从事脑认知与脑机智能研究，主持国家科技创新2030、国家自然科学基金联合重点项目等，发表PNAS,
  Brain, Nature Communications, IEEE TPAMI等国际权威期刊论文100余篇，出版专著1部。zengphd@nudt.edu.cn
