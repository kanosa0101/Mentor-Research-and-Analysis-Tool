bio_raw: 男,博士，副研究员，硕士研究生导师，主要从事高精度光学元件轮廓测量与表征、金属材料反射镜及系统制造等工。近五年发表SCI论文28篇，EI论文5篇，机械工程领域T1级期刊中文论文2篇，其中以第一或通讯作者发表SCI论文20篇，获校优秀博士论文/青年创新奖，获湖南省荷尖人才项目支持，获军事科学技术进步一等奖1项。指导学员获中国国际创新大赛等国家级竞赛3项，优秀创新创业指导老师。laitao_nudt@163.com
