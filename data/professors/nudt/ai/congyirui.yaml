bio_raw: 男,副研究员，硕导，澳洲国立大学博士，湖南省优青、校拔尖人才。长期从事无人机集群控制、导航与通信一体化研究，发表控制顶刊IEEE TAC长文、Automatica长文、通信顶刊IEEE
  TWC等论文40余篇（培养方式和质量与世界名校接轨，指导学生发表TAC长文、短文各1篇，学生均为一作）。主持参与多项国家项目，获指控学会科技进步一等奖1项、军队精品课程1门、湖南省优秀导师团队1次。congyirui11@nudt.edu.cn
