bio_raw: 男,    从事装备状态感知与健康管理研究，主持国家自然科学基金面上项目、青年基金项目、装备预研项目课题等项目/课题十余项，提出了装备机电系统多层级损伤建模、状态感知与故障诊断方法，相关成果应用于多型装备的健康状态监测与诊断。近五年，发表学术论文60余篇，被引1300余次，H指数18，以第一作者/通讯作者身份在AEI(IF=9.9)、MSSP(IF=8.9)、MMT等领域顶刊发表论文20余篇，授权发明专利4项，受理8项。担任中国仪器仪表学会设备结构健康监测与预警分会专题委员会副秘书长、湖南省仪器仪表学会常务理事，担任AI+、Battery
  Energy等8个期刊的青年编委。入选中国科协青年人才托举工程、国防科技大学高层次人才培养计划。turbineyy@163.com
