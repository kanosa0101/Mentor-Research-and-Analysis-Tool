bio_raw: 男,仪器科学与技术学科副研究员，清华大学博士，从事智能传感与探测方向的教学科研工作，包括新原理新材料新结构的新型传感技术、感存算一体化神经拟态传感技术等。主持或参与国家重点研发计划青年项目、国家自然基金、科技2030、十四五等项目20余项、发表论文45篇、授权专利20项、校青年创新奖一等奖、校卓青培养对象、获湖南省“三尖”人才。lips13@163.com
