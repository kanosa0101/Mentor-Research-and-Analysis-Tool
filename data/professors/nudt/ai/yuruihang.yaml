bio_raw: 男,中国惯性技术学会测试专业委员会委员，长期从事智能导航、重力测量方向的研究与应用，承担国家自然科学基金、装备预研、省自然科学基金等项目9项，授权专利13项，发表论文30余篇，出版专著4部，获湖南省科技进步二等奖1项、湖南省教学成果特等奖1项、二等奖1项、军队教学成果一等奖1项、三等奖1项。yuruihang@nudt.edu.cn
