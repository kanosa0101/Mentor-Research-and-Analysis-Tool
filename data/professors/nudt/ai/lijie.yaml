bio_raw: 男,从事控制科学与工程、磁悬浮智能控制、超导超高速电磁悬浮推进、磁浮交通等方面的研究。主持多项国家自然基金、基础加强重点项目、国家科技支撑计划等项目。173技术首席，北京磁浮S1线总师，获省部级一等奖2项（1、1），协会一等奖1项（1），主笔磁浮领域首部国家标准，专利50余项，出版专著1部，论文200余篇。jieli@nudt.edu.cn
