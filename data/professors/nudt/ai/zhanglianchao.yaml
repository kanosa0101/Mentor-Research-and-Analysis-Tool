bio_raw: 男,机械工程专业博士，副教授，硕士生导师。主要从事智能制造、武器装备中的智能机电系统、智能化机电精密测控领域的研究工作，主持和参与二十余项国家和军队科研项目，获军事科技进步一等奖1项，湖南省技术发明一等奖1项、国家教学成果二等奖1项。发表论文20余篇，授权发明专利6项，出版教材1部。lchzhang@nudt.edu.cn
