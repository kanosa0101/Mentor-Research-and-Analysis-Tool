bio_raw: 男,教授，国内惯性技术领域知名专家，国家“万人计划”领军人才，获国家科技进步二等奖1项、军队和部委级科技进步一、二、三等奖各1项。围绕远程精确打击武器系统和智能灵巧弹药，开展自主导航理论与方法、组合导航技术、重力测量技术、惯性测量技术和微小型GNC系统技术等方面的研究与应用。meipingwu@263.net
