bio_raw: 男,教授、博导，教育部机械基础教指委委员，装发专业组专家，湖南省“芙蓉学者”特聘教授。研究方向为智能无人系统平台与动力技术。以实现无人系统更高智能水平、更强环境适应性为目标，重点研究无人平台的构型创新设计、高适应行走、智能驱动与控制、高性能推进新机理、高效能源与动力、平台集成与优化、水陆两栖无人平台技术。获部委级科技成果奖多项，获国家发明授权专利40多项，发表科研论文100余篇。xuxiaojunmail@sina.com
