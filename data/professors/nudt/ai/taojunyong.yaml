bio_raw: 男,航天装备试验鉴定、陆军军事理论、装发军事计量、军科委国防科技应用推进（空军）专家组专家，全国试标委分委会主任委员，美国马里兰大学、瑞典皇家理工学院访问学者。从事智能集群韧性建模与评估，无人智能作战试验训练评估，装备可靠性试验与评估，装备故障智能诊断等领域研究。主持国家自然科学基金、重点研发、军内科研重点项目50余项。发表论文80余篇、专著8部、英文专著1部、发明专利23项，获军队科技进步二等奖1项、国防科学技术进步奖二等奖1项，国家一级学会科技进步一等奖1项、全军创客大赛一等奖1项，教学成果奖2项、军队院校育才奖银奖。培养的学生获国家一级学会、国防科技大学优秀博士学位论文，以及军事建模大赛特等奖。taojunyong@nudt.edu.cn
