bio_raw: 男,长期从事导航、制导与控制方面的研究工作，湖南省自动化学会秘书长，中国惯性技术学会仿生传感与导航专委会副主任委员，全国黄大年式教师团队骨干，中国自动化学会自动化与人工智能创新团队成员，首批国防科技大学高层次创新人才卓越青年人才培养对象。承担自然科学基金项目、装备预先研究项目、基础加强项目课题等10余项，在TPAMI、TRO、IJCV等国内外学术期刊发表论文40余篇，出版教材、专著4部，授权发明专利8项。国家一流课程主讲教师，湖南省研究生精品课程负责人。军/省/学会级教学成果特等奖1项、一等奖2项、二等奖1项。lilianzhang@nudt.edu.cn
