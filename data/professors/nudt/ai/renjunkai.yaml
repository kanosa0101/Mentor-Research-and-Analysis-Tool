bio_raw: 男,博士，副研究员，研究室副主任，长期从事机器人与强化学习相关研究工作，主持科技委重大专项子课题、学校自主创新科学基金等项目3项，作为技术骨干参与国家/军队级项目10余项。在领域内知名期刊/会议发表论文30余篇，获机器人领域权威期刊JFR封面论文，机器人领域顶会IROS2025最佳展示奖、期刊精选论文、国际会议最佳论文等荣誉；授权发明专利10余项；合作出版专著1部。国家级精品课程主讲教师，入选学校青年创新人才孵化中心培养对象，获国际级、国家级机器人大赛冠军10余项。jkren@nudt.edu.cn
