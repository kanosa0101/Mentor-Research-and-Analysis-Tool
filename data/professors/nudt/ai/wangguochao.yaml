bio_raw: 男,仪器科学与技术学科副研究员，硕士生导师，湖南省优秀博士/硕士论文获得者，主要从事量子精密测量、光子芯片光源、片上传感与计量等领域教学科研工作；主持国家自然科学基金、军队和省部级等项目9项，担任《计测技术》、《Nanomanuf.
  Metrol》期刊青年编委，近5年以第一或通讯作者在Sci.Adv.等高水平期刊上发表论文20余篇，其中高被引论文2篇、热点论文1篇，授权国际专利2项、国内专利10余项，出版专著/教材2部，研究成果获评国防科技大学重大科技进展。wgc.19850414@163.com
