bio_raw: 男,荷兰代尔夫特理工大学智能机器人博士，中国人工智能学会具身智能专委会委员、中国自动化学会混合智能专委会委员，从事群体具身智能、多智能体强化学习、大模型决策规划、符号神经计算、空间智能等研究，主持在研国家自然科学基金面上项目、重点项目课题，发表学术论文80余篇，引用超1500次，其中1篇ESI
  1%高被引。获评湖南省教学成果一等奖，军队精品课，湖南省人工智能学会一等奖等。wangchang07@nudt.edu.cn
