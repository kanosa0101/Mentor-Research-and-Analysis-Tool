bio_raw: 男,副研究员，博导，装备状态感知与敏捷保障全国重点实验室副主任，英国南安普顿大学博士毕业，中国机械工程学会可靠性工程分会副总干事。主要从事装备寿命智能预测、结构健康监测、自感知自适应智能复合材料结构、磁致伸缩先进传感材料与器件等领域研究工作，技术成果在多型装备上推广应用。主持国家自然科学基金、千万级重点项目等项目近20项，以发表SCI检索论文60余篇，授权发明专利10余项，获军队科技进步二等奖1项，出版学术专著1部。sfzhang@nudt.edu.cn
