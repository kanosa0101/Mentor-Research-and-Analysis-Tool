bio_raw: 男,博士，副研究员，硕导。长期从事智能光学精密工程方向研究，面向空间探测、强光光学、智能显示等系统，开展光学元件的高性能高效率制造原理、工艺和装备研究，应用于引力波探测、激光聚变等国家重大工程。负责国家重点研发计划课题、国防预研等10余项课题，发表论文30余篇，授权专利10余项，获军队科技进步奖、湖南省技术发明奖，机械工程学会奖等。tieguipeng@163.com
