bio_raw: 男,副教授，硕导，湖湘青年英才，芬兰阿尔托大学访问学者，获省部级科技进步一等奖1项。主要从事机器人仿生电子皮肤与触觉具身智能、石墨烯类二维材料纳机电精密传感、超高压低维纳米材料原子级改性制造、石墨烯、碳纳米管等纳米材料柔性电子器件方向研究，主持国家自然科学基金、机器人重大专项子课题等项目8项，发表SCI/EI论文30余篇，授权专利15项。相关研究聚焦具身机器人产业前沿与非硅基新材料智能传感技术前沿，紧扣国家十五五发展需求。liuying@nudt.edu.cn/605836855@qq.com
