bio_raw: 男,中国仪器仪表学会力触觉感知与交互专业委员会副主任,国家某委先进测试技术专业组专家，国家某重点工程四性与综保专家组专家。主要从事智能传感器与具身触觉、感知增强型机器人作业、智能状态感知与健康管理等方面研究。主持国自科基金、军队重点项目等20余项，军队一等奖2项、专利23项、论文180余篇。研究成果国内领先、实用性强，毕业生深受科研院所和航天、中航、中船、电科等用人单位欢迎。gjliu342@qq.com
