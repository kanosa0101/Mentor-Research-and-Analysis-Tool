bio_raw: 男,教授，博导，湖南省科技创新领军人才，军队青年科技英才，国家重点研发计划青年科学家项目负责人，中国自动化学会高级会员，中国机器人大赛暨RoboCup中国赛秘书长，湖南省自动化学会理事，德国汉堡大学博士，英国林肯大学访问学者。在IEEE
  Trans汇刊、JFR、IROS和ICRA等高水平期刊和旗舰会议发表论文50余篇。获国家教学成果二等奖1项、军队教学成果一等奖和湖南省教学成果一等奖各2项。junhao.xiao@nudt.edu.cn
