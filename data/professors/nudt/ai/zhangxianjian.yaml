bio_raw: 男,博士，博士后，副研究员，学校拔尖人才，长期从事智能化作战理论、攻防博弈、任务规划与辅助决策研究。主持国家自然科学基金、军委科技委军事理论重大项目、战略先导重大项目、装备预研项目等科研项目20余项，发表学术论文30余篇，出版著作教材7部，授权国防专利4项、软著12项，获得军队各类奖项6项。ruszxj@163.com
