bio_raw: 男,副研究员，湖南省优青。从事无人驾驶规划技术、空地无人协同研究。现担任图象图形学会智能感知系统专委会委员，《无人系统技术》青年编委，连续三年担任机器人顶会IROS副主编（AE）。发表高水平论文40余篇，授权专利/软著10余项，主持国自科青年基金、湖南省优青项目等，被评为全国大学生智能车竞赛优秀指导教师。lijunxiang@nudt.edu.cn
