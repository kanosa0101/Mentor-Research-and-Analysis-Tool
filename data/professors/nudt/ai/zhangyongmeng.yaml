bio_raw: 男,主要从事高性能谐振陀螺的设计、精密测控电路、误差处理技术研究，主持1XX工程课题、基础加强重点项目课题、国家自然科学基金等科研项目10余项，发表SCI/EI检索论文30余篇。获军事科学技术进步一等奖1项，中国发明协会发明创业奖创新奖一等奖1项，国防科技大学青年创新奖一等奖1项，入选国防科技大学高层次人才培养计划拔尖人才培养对象，湖南省三尖人才。zhangym@nudt.edu.cn
