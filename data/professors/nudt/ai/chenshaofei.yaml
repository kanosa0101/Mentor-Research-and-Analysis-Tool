bio_raw: 男,英国南安普顿大学联培博士，中国指控学会优博，入选学校拔尖人才培养计划。主要从事智能体学习、决策与博弈等方向研究，探索基于大模型、具身智能等前沿技术提升智能体/机器人的自主能力与智能水平，主持国自科面上基金、科技委重点课题等科研项目10余项，参与研制任务规划系统，在IEEE
  TYB/IEEE RAL/SCIS/KBS/IJCAI/IROS/计算机学报/航空学报等期刊会议发表论文30余篇，出版教材/专著4部，获ACAIT2022最佳论文，协助指导博士生入选中国科协青年托举计划。chenshaofei01@nudt.edu.cn
