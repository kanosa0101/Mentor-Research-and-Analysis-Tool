bio_raw: 男,教授、博导，国家级科技领军人才、青年人才、湖南省杰青。长期从事无人集群、群体智能、协同决策与控制、飞行控制等研究。主持国家级项目10余项，发表T-AC、T-Ro顶刊论文100余篇，专译著5部，牵头获学会级科技进步奖2项，军队级精品课程一门。注重理论和实践结合，指导学生获省军级优秀论文7人次，国家级竞赛一等奖10余次。xkwang@nudt.edu.cn
