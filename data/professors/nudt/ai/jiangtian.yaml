bio_raw: 男,江天，研究员，博士生导师。入选教育部“长江学者”特聘教授、国防科技卓越青年，湖南省卓越研究群体带头人，享受国务院特殊津贴。从事智能微波光子领域研究工作。以一作或通讯作者在Nat.
  Nanotech.、Phys. Rev. Lett.、 Nature Commun.等学术期刊发表论文70余篇，包括5篇ES1前1%和1篇ESI前1‰高被引论文；获国家科技进步二等奖1项、军队科技进步一、二等奖各1项(均排名第2)，出版中文专著1部。tjiang@nudt.edu.cn
