bio_raw: 男,副教授，硕导，中国指控学会集群智能与协同控制专委会委员，主要从事无人机智能协同感知、决策与控制，有人机/无人机智能交互控制等研究，主持国家/军队级科研项目7项，出版译著2部，发表论文30余篇，申请专利10余项，获军队科技进步奖一等奖、学校教学成果一等奖。lzwu@nudt.edu.cn
