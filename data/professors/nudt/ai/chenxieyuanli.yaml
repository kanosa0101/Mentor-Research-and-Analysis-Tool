bio_raw: 男,副教授，机器人领域著名国际期刊TRO、RAL、国际顶会ICRA、IROS编委，长期从事机器人智能感知、定位、导航和自主学习方向研究，发表包括TRO，TPAMI，RAL，CVPR，ICCV，ICRA，IROS等期刊会议论文100余篇，谷歌学术被引6000余次，入选斯坦福爱思唯尔全球前2%科学家、中国科协青年人才托举工程、香江学者计划、国防科技大学拔尖人才，获德国优秀博士学位、国际机器人科学与系统会议先锋称号、两篇国际会议最佳论文提名，主持国家及军队级项目课题5项，获国际级机器人大赛冠军7项，国家级机器人比赛冠军10余项。xieyuanli.chen@nudt.edu.cn
