bio_raw: 男,湖南省首届优秀研究生导师，享受国务院政府特贴，中国微纳技术学会会士。研究方向为微纳传感与智能微系统、高性能微惯性器件。在新型微惯性器件设计与制造、定位导航授时微系统、周期性纳米结构制备与生化传感方面形成特色优势。发表高水平论文100余篇、授权国家发明专利100余项，成果获军队/省部级一等奖3项、二等奖2项，指导研究生8人次获得军队、湖南省和学校优秀博士、硕士学位论文。xzwu@nudt.edu.cn
