bio_raw: 男,仪器科学与技术学科博士，助理研究员，长期从事基于跨域无人平台的智能侦测与对抗领域研究工作，目前主要研究光电图像多模态融合探测、低慢小目标智能识别与跟踪、多无人平台协同感知对抗等理论与技术。主持校自主创新科学基金、国防173基金、装备综合等项目多项，授权国家发明专利10余项，发表论文30余篇，主编出版教材专著3部，指导学员获A类竞赛国家/省级一等奖等各类奖项10余项。sunxiaoyong14@nudt.edu.cn
