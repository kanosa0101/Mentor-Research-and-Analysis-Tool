bio_raw: 男,博士，副研究员，中国机械工程学会可靠性分会常务委员，主要从事机器学习与装备寿命预测技术，可靠性加速试验技术，可靠性增长、验证试验方法与设备研究。主持/承担国家和部委级科研项目20余项，出版专著2部，发表SCI/EI论文50余篇，授权国家发明专利10余项，获军队科技进步二等奖1项、机械工业科技进步二等奖1项。wangyashun@nudt.edu.cn
