bio_raw: 男,仪器科学与技术学科副研究员，从事面向多域无人系统的智能天基测量、通信、网络与测试技术，主要开展天基智能理论与技术、星间协同组网与测量、网络化时空基准确定与维持、装备智能化测试验证等领域的教学科研工作。在星间链路、天基智能等方面取得一大批高水平研究成果，获中国专利金奖1项、优秀奖1项，湖南省科技进步一等奖1项，以第一/通讯作者在国际高水平期刊发表论文40余篇，获授权国家发明专利70余项。lixianbin23@nudt.edu.cn
