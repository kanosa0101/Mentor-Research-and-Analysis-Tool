bio_raw: 男,副教授，硕导，中国自动化学会无人飞行器自主控制专委会、中国指控学会集群智能与协同控制专委会委员，从事群体智能与无人集群、多智能体协同决策控制等技术研究，主持装备预先研究共用技术、新一代人工智能国家科技重大专项（课题）等项目10余项，发表TSMC、TASE等高水平论文30余篇，出版专著3部，获军队、学会等科技进步一等奖2项、军队级精品课程1项。lijie09@nudt.edu.cn
