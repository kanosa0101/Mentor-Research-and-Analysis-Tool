bio_raw: 男,研究室主任，计算机科学与技术专业博士，全军共用信息系统保障专家、装备保障战略能力评估专家，获军队科技进步二等奖1项，国防科技进步二等奖1项，军队优秀专业技术人才三类岗位津贴，荣立三等功1次。研究领域包括大模型与智能体、大数据分析、装备运维信息系统等。承担国家自科基金、装备预研等课题30余项，发表SCI/EI检索论文40余篇。nudtll@sina.com
