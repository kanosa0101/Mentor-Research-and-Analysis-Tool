bio_raw: 男,仪器科学与技术学科博士，副研究员，长期从事无人系统智能侦测与对抗领域研究工作，目前主要研究无人系统相关的多源数据融合与智能感知、大模型具身感知与理解，国产AI边端推理等理论与技术。主持国自科、国防173重点课题、国防173基金、装备预研等国家和军队级项目多项，授权专利10余项，发表高水平论文20余篇，入选学会青年科技人才培育计划，军队优秀专业技术人才三类岗位津贴获得者。sunbei08@nudt.edu.cn
