bio_raw: 男,仪器科学与技术学科博士，副研究员，主要围绕基于无人平台的多源异构传感器开展智能侦测与对抗领域研究工作，目前主要研究光电图像和无线电协同侦测、目标智能识别与定位、大模型智能化态势感知对抗等理论与技术。主持国家自然科学基金、国防173基金、装备综合、装备技术基础等项目多项，国家发明专利10余项，发表论文30余篇，指导学员获得A类竞赛国家/省级一等奖等各类奖项10余项。yujy@nudt.edu.cn
