bio_raw: 男,博士，副研究员，主持国家自然科学基金2项、湖南省优青等项目。从事基于复杂多状态网络的可靠性与韧性评估理论方法研究，并应用于无人智能集群可靠性与韧性评估，入选国防科技大学卓越青年人才培养计划。近五年，以第1/通信作者发表论文20余篇（其中1区TOP12篇，最高影响因子10.6），出版中文专著1部（2），授权专利3项（1）。baiguanghan@nudt.edu.cn
