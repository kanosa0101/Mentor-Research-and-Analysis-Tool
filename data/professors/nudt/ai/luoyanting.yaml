bio_raw: 男,博士，副教授，硕士研究生导师，研究室副主任，湖南省仪器仪表学会理事。主要从事无人装备能源保障、无线电能传输、高功率密度磁能捕获机构设计等研究，为解决无人装备的“续航焦虑”问题提供技术支撑。主持和参与国家自然科学基金、国防科技创新特区项目等研究20余项，发表学术论文20余篇，获国家发明专利授权10余项，获军科委综合保障领域科技十大进展奖1项。luoyanting@nudt.edu.cn
