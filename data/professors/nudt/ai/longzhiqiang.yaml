bio_raw: 男,研究员，博导，控制科学与工程学科带头人之一，全军优秀教师，湖南省优秀研究生导师，军队某专业组专家，科技部863专家，获国务院政府特殊津贴。长期从事磁浮运载工程、电磁能装备控制、智能装备安全控制研究，主持国家自科重点基金等20余项目，担任北京磁浮工程核心装备总体组长、长沙和凤凰磁浮等重点工程顾问，获省部级一等奖4项，出版专著6部。主建湖南省和军队精品课程一门，控制系列课程首席教授，指导省校优秀学位论文10篇。zhqlong@nudt.edu.cn
