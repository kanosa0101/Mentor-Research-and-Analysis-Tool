bio_raw: 男,研究员，博导，军科委首批主题组专家，图象图形学会视觉感知智能系统专委会委员，人工智能学会智能机器人专委会委员。长期从事无人平台环境感知与机器学习方面的研究工作，感兴趣研究领域包括无人系统的智能驾驶、多模态学习、具身智能等。主持研制包括无人车/无人艇在内十多款无人系统，并以副总师身份承担了两款军用无人车型号项目的研制，获军队科技进步一等奖1项，授权国家发明专利15项，发表SCI/EI论文90余篇。wt.cs@163.com
