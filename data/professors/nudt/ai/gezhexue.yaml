bio_raw: 男,博士，副研究员，主要研究方向为装备虚实融合保障训练与智能保障机器人，聚焦高精度空间感知、智能数字人、生物力学智能计算、柔性力触觉反馈、模仿学习与VLA模型训练等前沿技术，研发穿戴式虚实融合训练系统，为高端装备全寿期提供新型数字化和智能化技术支撑。主持国家自然科学基金、科技委基础加强基金、部委级预研等高水平项目20余项，发表学术论文50余篇，授权发明专利20项，出版教材和论著2部，荣立三等功1次，研究成果先后获军科委综合保障领域科技十大进展、军队科技进步一等奖、国防科技进步二等奖。gzx@nudt.edu.cn
