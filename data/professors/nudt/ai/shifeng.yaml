bio_raw: 男,博士，研究员。长期从事智能光学精密工程研究，负责国家重大专项、863、国防预研等20项国家级课题，研制新型阵列式磁流变、频域可控离子束等智能制造装备，突破超高精度、高损伤阈值等超精密元件制造技术，应用于激光聚变、同步辐射等国家重大工程。创新超表面+阵列多波导增强/虚拟现实（AR/VR）智能光学模组，研制智能时代的关键人机交互入口。获国家科技发明二等奖1项，军队科技进步一等奖1项，北京市技术发明一等奖1项，仪器仪表学会技术发明一等奖2项。发表论文100余篇，获授权发明专利40余项，美国发明专利1项，国家软件著作权9项，出版专著4部。shifeng@nudt.edu.cn
