bio_raw: 男,国防卓青，军队青年科技英才、湖南省青年芙蓉学者。主要从事深度学习、精确制导与控制、智能成像导引头和集群弹药研究，聚焦人工智能对精确制导与控制的赋能研究，承担国家自然科学基金面上、型号工程、装备预研、基础加强重点、国防卓青等类型项目15项，在IEEE
  Trans汇刊、ICCV、AAAI、ICML|ICLR等高水平期刊和顶级会议发明论文50余篇，出版专著/教材/译著4部，授权发明专利19项，研制的装备形成战斗力，获湖南省技术发明一等奖1项。zybnudt@nudt.edu.cn
