bio_raw: 男,副研究员，国防科技大学-普林斯顿大学联合培养博士。入选中国科协青年人才托举工程、中国图学学会青年托举计划、湖湘青年英才、国防科技大学高层次创新人才等人才工程。发表学术论文40余篇，包括IEEE
  T-PAMI、ACM TOG、SIGGRAPH、CVPR、ICCV、ECCV (Oral)等顶级期刊会议论文20余篇。主持湖南省优秀青年基金、国家自然科学基金青年项目、国防科技大学基石基金等项目8项，参与国家自然科学基金重点项目、国家重点研发计划等重要项目10余项，担任某重要科研任务主任设计师。获ACM长沙分会新星奖、国防科技大学青年创新奖一等奖等。具体课题方向包括：1）机器人视觉感知；2）机器人抓取与操控；3）场景理解与三维重建。可提供顶级期刊会议论文发表平台以及国内外学术交流机会。shiyifei12@nudt.edu.cn
