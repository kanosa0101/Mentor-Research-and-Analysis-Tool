bio_raw: 男,工学博士，副研究员。面向现代装备智能感知、智能保障等发展需求，开展智能状态感知、健康管理、试验鉴定等关键技术及其应用研究，成果应用于新型战机、无人装备等，提升新研装备感知能力。主持国家自科基金、型号试验、技术基础等科研项目10余项，型号综合保障试验鉴定技术专家组专家，发表高水平论文50余篇，出版专著、教材各1部，授权发明专利20余项，获军队科技进步一等奖1项等。zhangyong@nudt.edu.cn
