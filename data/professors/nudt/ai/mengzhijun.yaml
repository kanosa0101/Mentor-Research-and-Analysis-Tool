bio_raw: 男,仪器科学与技术学科副研究员，从事空间仪器时空精密测量研究。主持或技术负责北斗、空间站等国家重大工程项目10余项，入选军队高层次科技创新人才工程青年科技英才，湖南省首个卓越研究群体，国防科大卓越青年人才，先后荣获国家技术发明二等奖1项，军队科技进步一等奖1项，国际发明展览会金奖1项，国家一级学会科技进步一等奖2项，在仪器学科顶刊、国际顶会等发表高水平论文20余篇，授权国家发明专利18项，主编教材1部。mzj727@126.com
