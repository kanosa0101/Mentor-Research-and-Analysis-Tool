bio_raw: 男,副研究员，硕导，以色列理工学院联合培养博士，入选中国科协青年人才托举工程、学校青年英才，获中国指控学会优秀博士论文、科技进步一等奖，学校青年创新奖一等奖。从事无人机集群协同研究，在IEEE
  TAC、Automatica等发表论文30余篇，出版一作专著1部，指导学生获国家和国际地区级竞赛奖励多项，获中国机器人大赛优秀指导教师一等奖。担任中国指控学会集群智能与协同控制专委会、无人系统专委会委员，《Biomimetic
  Intelligence and Robotics》(SCI源刊)、《国防科技大学学报》(EI源刊)等期刊的青年编委。chenhao09@nudt.edu.cn
