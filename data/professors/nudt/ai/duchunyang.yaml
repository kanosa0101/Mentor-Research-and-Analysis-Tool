bio_raw: 男,副研究员、硕导，入选中国科协托举人才、学校青年英才，获上银优秀机械博士论文铜奖。面向光刻制造、先进光源、功能器件等对原子级精度需求开展基础理论、制造工艺与制造装备研究。主持项目10余项，在PNAS、IJMS等期刊发表SCI论文30余篇，申请专利10余项，参编专著2部。获军队科技进步奖一等奖1项，任机械工程学报等期刊青年编委，与清华、北航、大连理工、香港理工、南洋理工等国内国际知名高校长期保持合作关系。指导学生获校级、省级竞赛多项，获优秀创新创业指导老师荣誉。duchunyang11@nudt.edu.cn
