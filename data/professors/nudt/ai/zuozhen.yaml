bio_raw: 男,博士，副研究员，研究室主任，英国女王大学访问学者，重点围绕无人机、车、艇环境侦测与对抗以及网电空间智能侦测与对抗等领域开展理论研究与武器装备研制。主持和参加国家、军队级重大科研项目30余项，在国内外顶级期刊、会议发表高水平论文40余篇，授权专利、软件著作权等20余项，出版专著、教材5部，指导学员获优秀毕业生、A类竞赛奖励多项，获军队科技进步奖3项，荣立个人三等功1次，享受军队优秀专业技术人才岗位津贴。z.zuo@nudt.edu.cn
