bio_raw: 男,主要从事无人系统协同控制（人机协同、空地协同）、作战任务规划等方面研究。研究工作紧贴军事需求，科研及工程经验丰富，多次参与保障重大演习演练活动；主持及参与重大/重点科研项目20余项，获国家级教材二等奖1项、军队科技进步一等奖1项，发表学术论文50余篇，任《战术导弹技术》编委、指挥控制学会智能指挥与控制系统工程专委会常务委员。acnwang@aliyun.com
