bio_raw: 男,中国电工技术学会电磁发射专业委员会委员，省部级优秀学位论文导师。从事检测技术与自动化装置专业研究近30年，开展主要包括磁浮交通、深空探测及无人机等领域的复杂电磁环境传感与智能检测、集群发射与回收技术等方向。获省部级一等奖2项、协会一等奖1项。编制国家标准1项、行业标准3项、企业标准6项，参与团体标准2项。作为第一发明人授权专利50余件，发表论文130余篇。wujun2008@nudt.edu.cn
