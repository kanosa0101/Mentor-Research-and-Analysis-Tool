bio_raw: 男,副教授，硕导，学校“学术创新之星”。主要从事水下目标探测，水下极低频电磁场分析、地磁矢量测量、地磁导航等研究。主持和承担国家自然科学基金、基础加强计划、创新特区等项目10余项，以第一/通讯作者在IEEE
  Sens J、Measurement、MST等高水平期刊发表论文30余篇，授权专利10余项。liuzhongyan@nudt.edu.cn
