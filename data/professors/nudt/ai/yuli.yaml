bio_raw: 男,副研究员，硕导，近年来在IEEE TIE、IEEE LCSS、IEEE CDC等领域顶刊顶会发表论文30余篇，授权专利10余项。主持国家自然科学基金青年基金、国防科技大学金点子等项目6项，获中国自动化学会科学技术进步二等奖1项、陕西省高等学校优秀成果一等奖1项，陕西省军民融合英才支持项目高水平创新团队成员，享受军队优秀专业技术人才三类岗位津贴1次。yuli15a@nudt.edu.cn
