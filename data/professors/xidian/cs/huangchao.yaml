bio_raw: "个人简介\n/\nPersonal Profile\n黄超，教授、博导，国家级青年人才。长期致力于形式化验证（Formal Methods）、机器学习（尤其是强化学习）以及信息物理系统/机器人（CPS\
  \ & Robotics）的交叉前沿研究。其核心科研目标是为安全攸关（Safety-critical）系统中的人工智能算法提供自底向上严密的数学保障与可证明的安全性。近年在\
  \ ICML, DAC, ICCAD, ACM TECS 等人工智能与系统领域顶级会议及期刊上发表多篇具有广泛影响力的学术论文。\n教育经历\n[1] 2007.09-2011.06\n\
