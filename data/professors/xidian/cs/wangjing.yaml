bio_raw: '个人简介

  Personal Profile

  王静，博士，西安电子科技大学计算机科学与技术学院副教授

  。于2003年在

  西安电子科技大学

  获得计算机科学与技术学士学位，分别于2008年和2011年在西安电子科技大学获得计算机应用硕士和博士学位。

  多年来从事文本数据挖掘、机器学习，智能处理与分析的相关研究

  工作，

  对自然语言理解、社交网络数据分析、数据挖掘算法及应用有较深厚的研究积累。

  主持了国家自然科学青年基金项目、

  国家自然科学基金面上项目和

  部队军工项目等，参与了国家自然科学基金面上、

  陕西省重大科技专项和国家科技部支撑计划项目

  ，通过完成这些项目在该领域国际期刊

  IEEE TPDS、IEEE TCSVT、IEEE TMM、PR

  和国际会议IEEE/WIC/ACM Web Intelligence Conference等以第一作者和通信作者发表的研究成果。同时本人作为第一申请人授权的发明专利7项包括ZL202210721927.9；

  ZL201210000228.1

  和

  ZL201210247491.0等。'
