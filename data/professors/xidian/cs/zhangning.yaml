bio_raw: "个人简介\n/\nPersonal Profile\n主要从事智能体（AI Agent）及边缘AI、数据智能及数据空间\n、系统软件及\n工业软件等方面的研究，近年来主持了2025KGJ子领域二期“基于人工智能的节流型面设计优化和验证”、2025年JKW国防预研课题“智能应用敏捷构造技术与原型系统研究”，2021年国家重点研发计划“集团企业价值链数字生态理论研究”子课题、2024年数据空间技术与系统全国重点实验室开放基金“基于数联网的工业制造数据智能服务”，作为主要研究人员参与了2021年装发预研项目“支持多编码和多传输协议的分布式标识解析技术”、2024年国家自然科学基金“面向开源深度学习软件的自适应可信性保障机制”，以及国家863计划等多项国家级和省部级项目，研究成果在国内外学术会议和期刊发表多篇学术论文，并授权了多项发明专利。\n\
