  个人简介

  Personal Profile

  刘向增 2011年毕业于西北工业大学应用数学系获得理学博士学位，2012年-2018年于航天某研究所从事智能系统算法设计工作，2015年-2017年于航天某研究所从事博士后研究工作，2016年-2017年前往Carnegie
  Mellon University的Robotics Institute进行访学研究。目前，主要从事计算机视觉与图像处理方面的教学与科研工作，研究方向包括多源图像配准与融合、无人飞行器视觉导航、行人目标识别与跨境追踪等领域。在国内外期刊及会议发表论文60余篇，其中SCI检索40篇，申请专利30余项。主持或参与国家重点研发计划2项，自然科学基金4项，国家有关部门等纵向项目20余项，企业横向项目10余项。

