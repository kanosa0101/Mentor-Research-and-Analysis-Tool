bio_raw: '一、教育经历

  1985

  年，

  陕西师范大学，数学专业理学学士学位

  1988

  年，

  西安电子科技大学，计算机软件专业工学硕士学位

  1995

  年，

  西安电子科技大学，通信与电子系统专业

  工学博士学位

  二、工作经历

  1996年，西安电子科技大学计算机系副教授

  1998年，

  西安电子科技大学计算机学院

  教授

  1999年，

  计算机系统结构专业和密码学专业博士生导师

  1999年—2001年，新加坡南洋理工大学Research Fellow

  2002—2004年，西安电子科技大学计算机学院副院长

  2004—2014年，西安电子科技大学计算机学院院长

  2009—2012年，西安电子科技大学教育部长江学者特聘教授

  2011—2016年，“网络与信息安全关键技术”教育部创新团队负责人

  2012年—至今，陕西省网络与系统安全重点实验室主任

  2017年—至今，“”网络与信息安全关键技术“”三秦学者创新团队负责人

  2018年—至今，网络空间安全学部主任

  其它，先后入选陕西省“三五人才工程”人选、陕西省优秀留学回国人员、中国电子学会优秀科技工作者，享受国务院政府特殊津贴。

  三、主要社会兼职

  1、科技部第三届、第四届信息领域专家咨询组成员

  2、教育部第一届、第二届学科建设与专业设置专家委员会委员

  3、教育部高等学校计算机科学与技术教学指导委员会委员、教育部高等学校信息安全类专业教学指导委员会委员

  4、中国科学院信息工程研究所战略咨询委员会成员

  5、“

  中国电子”科学技术委员会委员

  6、国务院学位委员会“网络空间安全”学科评议组成员

  7、中共陕西省委网络安全与信息化领导小组专家咨询委员会副主任兼网络安全专业委员会主任

  8、信息与通信工程”学科大百科全书“信息与信号理论”分支主编

  9、信息安全国家重点实验室/综合业务网理论与关键技术国家重点实验室学术委员会委员

  10、“中国科学：信息科学”/“电子学报”/“计算机学报”/“密码学报”编委、“通信学报”编委会副主任／副主编

  11、中国电子学会会士、中国计算机学会理事／会士、中国密码学会理事、中国网络空间安全协会常务理事、陕西省计算机学会副理事长等。'
