bio_raw: '沈玉龙

  ，

  男，博士。西安电子科技大学“华山学者”领军教授，博士/硕士研究生导师，

  国家级人才，

  陕西省网络与系统安全重点实验室主任，教育部创新团队的骨干成员，综合业务网国家重点实验室信息安全中心固定研究人员。

  长期从事下一代网络安全、云计算与数据安全等研究。近年来主持和承担了国家重点研发计划、国家自然科学基金重点项目、863、973等20余项，以主要完成人获国家技术发明二等奖2项，省部级一等奖7项。

  研发的“秦盾”云加密数据库系统获中国科协创新创业大赛金奖（16/1800+）和最佳商业投资价值奖（2/1800+），获2018 CCTV中国十大创业榜样（高校首次）。发表SCI/EI论文100余篇，Google
  scholar他引2000余次，出版专著7部；授权发明专利70余项，PCT专利5项，已转让专利13项；登记软著40多项；制定中国通信/电子行业标准5项。

  研究生招生工作咨询：

  联系人：焦老师

  联系电话：

  18192722878

  联系邮箱：

  cyjiao@xidian.edu.cn

  研究生招生基本要求：

  1.热爱科研工作，思维敏捷；

  2.身心健康，为人端正；

  3.具有较强的上进心和团队协作能力；

  4.具有较强的计算机与网络安全基础、数理基础等

  I am always looking for self-motivated international students for research (M.S.,
  Ph.D., or postdoc). Please send your CV and transcript to

  chengke@xidian.edu.cn

  if you are interested. Information on Xidian M.S. and Ph.D. admission and scholarships
  can be found

  here

  .

  详细信息可前往旧版主页浏览

  http://web.xidian.edu.cn/ylshen/'
