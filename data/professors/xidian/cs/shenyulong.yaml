  研究生招生基本要求：

  1.热爱科研工作，思维敏捷；

  2.身心健康，为人端正；

  3.具有较强的上进心和团队协作能力；

  4.具有较强的计算机与网络安全基础、数理基础等

  I am always looking for self-motivated international students for research (M.S.,
