  Personal Profile

  宋建锋，男，生于1978年6月，西安电子科技大学计算机科学与技术学院，中国计算机学会会员，2001年硕士毕业于西安电子科技大学计算机应用专业，2014年博士毕业于西安电子科技大学通信与信息系统专业。主要从事计算机视觉，视觉目标检测、识别与跟踪，机载嵌入式软件等方面的工作。主持国家重点研发计划专题1项，完成西安市科技攻关项目2项，高校基本业务费项目3项，企业合作项目15项；参与完成国家自然科学基金2项、国防863项目1项、陕西省自然科学基金1项。获得陕西省自然科学一等奖1项，西安市科学技术三等奖1项

  ，授权发明专利15项

  ，在JSTARS、TIM等国内外知名期刊发表论文20余篇。招收具备计算机视觉基础、Java web工程开发经验、嵌入式软件开发的研究生。

