bio_raw: '个人简介

  Personal Profile

  于强，副教授、硕士生导师。

  项目：

  主持并参与多项国家级纵向项目、多项面向应用的企业横向项目。

  方向：

  知识图谱构建与智能应用、AI大模型应用、医学影像分析

  、大数据算法

  。

  成果：

  在IEEE/ACM TCBB、IEEE TNB、BMC Bioinformatics、BIBM、《计算机学报》、《软件学报》等国内外权威刊物和会议发表学术论文20多篇，并申请了多项发明专利。

  招生信息：

  基本要求：

  服从导师安排、敢于迎接挑战和困难、做事积极主动有担当

  、

  具备坚忍不拔的毅力

  优先考虑的条件：

  具有专业相关的竞赛获奖、具有研究方向相关的项目经验、实践动手能力强、CET-6通过

  名额情况

  ：

  杭州研究院招生名额充足，欢迎报考

  报考之前，请通过邮箱（q.yu@vip.163.com）与我联系确认 。'
