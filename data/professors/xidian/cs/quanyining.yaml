  个人信息

  权义宁

  ，陕西扶风人，教授，密码学博士，硕士研究生导师。

  西安市大数据与视觉智能关键技术重点实验室副主任，西电-360系统安全与大数据联合实验室副主任，中国计算机学会(CCF)高级会员，中国图象图形学会会员，中国密码学会会员，ACM会员。

  1993年7月本科毕业于西安电子科技大学计算机及应用专业，2010年3月在西安电子科技大学密码学专业获得密码学博士学位，2012年12月-2013年12月受国家留学基金委资助在美国密歇根州韦恩州立大学做访问学者。

  主要研究方向

  是网络安全与网络计算、大数据分析与可视化、机器学习。目前主要从事大数据技术、可视分析与可视化、协议并行加速与虚拟化、社交网络大数据分析、云计算安全和信任模型等方面的研究。

  主持、参与在研和完成国家重点研发计划、国家自然科学基金、省自然科学基金等课题10余项；2017年荣获西安电子科技大学“优秀教师”称号。近年来，在KBS、Information
  Science、NeuroComputing、Applied Soft Computing、MTAP、通信学报、西安电子科技大学学报等国内学术期刊和国际会议上发表SCI/EI收录论文30余篇。先后获省部级奖2项。

  主要讲授的课程

  ：计算机通信与网络（本科）、数据可视化（本科）、物联网技术（本科）、计算机网络工程与实验（研究生）等。

