  个人简介

  Personal Profile

  方敏，女，博士，西安电子科技大学计算机学院教授，博士生导师。于西安电子科技大学获计算机应用学士学位、软件技术硕士学位、计算机应用技术博士学位。1986年6月在西安电子科技大学计算学院从事教学和科研工作至今。赴荷兰University
  of Amsterdam 做访问学者研究，从事Intelligent Autonomous Systems研究工作。

  主持多项国家自然科学基金项目、国家有关部门创新特区项目、航空科学基金项目等。

  主持多项陕西省科技计划项目、陕西省自然科学基金、西安市科技计划项目、西安市高校院所人才服务企业工程项目、国家有关部门重点实验室基金项目，以及多项应用开发项目研究。

  作为主要研究人参研国家有关部门预研项目以及预研基金项目多项。

  获部级科学技术进步三等奖二项，陕西省科学技术一等奖一项。

  在国内外著名期刊上发表论文八十余篇。授权国家技术发明专利十余项、软件著作权多项，出版专著8部。

