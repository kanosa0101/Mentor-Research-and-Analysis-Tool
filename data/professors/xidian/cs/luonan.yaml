  个人简介

  Personal Profile

  罗楠

  ，计算机科学与技术学院副教授，硕士生导师，CCF高级会员。2017年于西安电子科技大学获得博士学位，2015年11月至2016年6月在加拿大卡尔加里大学访学，2017年7月至今，在

  西安电子科技大学计算机科学与技术学院任教。近年持续致力于多传感器融合SLAM与三维场景重建、机器人视觉语言导航等相关领域的研究，提出了面向大规模场景的SLAM与点云重建框架、基于多传感器融合的场景重建与理解方法、多模态智能人机交互方法等，为智慧城市、VR/AR、自动驾驶、智能机器人等诸多应用的数据获取及自然交互控制提供可行方案。承担国家自然科学基金项目、博士后基金、国家重点研发计划子课题、陕西省重点研发计划项目，参与某重大型号项目、装备预研、慧眼行动等多项科研任务，解决装备数据高效融合处理与安全输出问题，积累了丰富的理论和实践经验。在IEEE
  TCSVT、TIM、ACM MM、ISPRS、TDSC、PRLetter等国外高水平期刊/会议发表学术论文30余篇，申请或授权发明专利20余项，获得陕西省科技进步一等奖、中国电子学会科技进步二等奖各1项。

  主要研究方向：SLAM及三维场景重建、机器人视觉语言导航等。

  欢迎对图形学、计算机视觉相关方向感兴趣且实践能力强的同学联系，偏重编程语言C++、Python。

