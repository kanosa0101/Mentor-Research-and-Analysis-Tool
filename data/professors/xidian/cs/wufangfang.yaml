bio_raw: '个人简介

  Personal Profile

  毋芳芳

  ，西安电子科技大学计算机科学与技术学院华山准聘副教授，硕士生导师。2008年6月于西安电子科技大学获学士学位。2011年3月于西安电子科技大学获硕士学位。2021年12月于西安电子科技大学获博士学位。现任教于西安电子科技大学计算机科学与技术学院。

  本人面向国家人工智能方向的需求，长期从事图象处理的理论和应用研究工作。主要研究方向包括图像视频处理，深度学习、计算机视觉等方面领域。近年来，在包括International
  Journal of Computer Vision、IEEE Trans. on Image Processing、CVPR、ACM MM、AAAI等人工智能领域的顶级期刊和会议上发表论文20多篇。主持国家自然科学基金青年基金1项，参与多项国家重点重大以及产学研项目。

