bio_raw: '个人简介

  Personal Profile

  个人介绍：

  方厚章，男，

  工学博士，

  副教授，博士生导师，硕士生导师。IEEE 会员，

  中国计算机学会会员。

  2014年毕业于

  华中科技大学人工智能与自动化学院

  多谱信息智能处理技术全国重点实验室

  （原

  图像识别与人工智能研究所

  ），获工学博士学位，博士生导师为

  张天序

  教授和

  颜露新

  教授。2014-2017年在西安电子科技大学雷达信号处理国家级重点实验室从事科研

  与教学

  工作。2018年至今在西安电子科技大学计算机科学与技术学院从事

  科研与教学

  工作。

  现从事智能视觉感知与理解、大模型、系统软件开发、嵌入式实时部署等方面的研究工作

  。

  科学研究：

  作为项目负责人先后主持了国家自然科学基金、国家级纵向项目（ZF/JKW）、横向项目（型号/装备研制配套等）、

  陕西省自然科学基金、国家级重点实验室开放基金

  等国家与省部级项目，涉及智能图像处理与分析、目标检测与识别、机器视觉等方面，并参与国家自然科学基金、企业合作研发项目和国家有关部门基础预研等多项纵向和横向项目。开展的项目与头部研究所和企业合作研究与开发，

  注重与实际应用场景结合，重点解决实际场景的难点问题

  。

  在国内外学术期刊及国际学术会议发表相关研究论文50余篇，并担任多个国际学术期刊和学术会议的审稿人。申请发明专利18项，授权10项。

  研究生招生

  ：具体招生要求和资助信息请点击主页“科学研究”->“

  研究领域

  ”（

  点击

  ）。

  本科生实习：接收本校实习生，特别欢迎已经具有深度学习相关基础知识并且熟练掌握python语言的学生。

  硕士生招生：拟招收软件工程学硕和电子信息专硕的学生1-5名，欢迎本科专业为计算机科学与技术、软件工程、人工智能等相关专业的优秀本科生申请保研和考研。

  博士生招生：招收学术博士生、工程博士生、少数民族骨干计划博士生。

  有意报考的同学请尽早发送个人简历和辅助支撑材料等到我的邮箱 houzhangfang(at)xidian.edu.cn（请将（at）换成@），不要通过网易超大附件发送简历。

  学生重要获奖和荣誉：

  (1) 指导的研究生夏铭江和王啸林同时获得2021年教育部研究生国家奖学金。

  (2) 指导的研究生丁兰获得2022年教育部研究生国家奖学金（

  公示网站

  ）。

  (3) 指导的研究生夏铭江获得西安电子科技大学2022届校优秀硕士学位论文（计科院本届软件工程专业毕业生唯一获得者）。

  (4) 指导的研究生廖梓凯获得2023年教育部研究生国家奖学金（

  公示网站

  ）。廖梓凯获得2022年全国大学生英语竞赛（NECCS）特等奖。

  (5) 指导研究生王啸林、吴辰星、李雪婷、陈秋环(推免本科生)获得2023年“火花燎原”技术挑战赛目标识别赛三等奖（JWKJW，省部级）。

  (6) 指导研究生廖梓凯获得西安电子科技大学2024届校优秀硕士学位论文（计科院本届软件工程专业毕业生唯一获得者）。

  (7) 指导研究生廖梓凯获得2024年中国图象图形学学会全国优秀硕士学位论文激励计划初评通过（

  公示网站

  ）。

  (8) 指导的研究生吴辰星获得2024年教育部研究生国家奖学金（

  公示网站

  ）。

  (9)指导2025级研究生郭书恺在2025年8月第六届中国图象图形学学会（CSIG）图像图形技术挑战赛—红外视频卫星空中动目标检测比赛获得二等奖。

  客座编辑：

  目前担任《Remote Sensing》期刊专刊

  “Lightweight AI Remote Sensing: Sensors, Algorithms, Computing”

  客座编辑，专刊主要围绕轻量化人工智能遥感中的传感器、算法优化与计算技术等方向开展征稿。诚邀相关领域的老师和同学积极投稿交流。专刊主页：

  https://www.mdpi.com/journal/remotesensing/special_issues/SJL7O996O2

