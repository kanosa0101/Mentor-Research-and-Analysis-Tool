bio_raw: '个人简介

  Personal Profile

  卢子祥，男，博士，西安电子科技大学计算机科学与技术学院讲师，硕士生导师。陕西省计算机学会培训与竞赛工作委员会副主任，陕西省计算机学会媒体计算专委会委员。主要研究领域为计算机视觉、智能教育、计算机合成全息。主持参与国家自然科学基金、陕西省自然科学基金、教育部产学研、中央高校基本科研业务费等项目20余项，主持参与省部级、校级教学改革项目12项。获陕西省科技进步一等奖、陕西省教学成果奖特等奖、陕西省哲学社科优秀成果奖三等奖、西安电子科技大学教学成果奖一等奖，西安电子科技大学本科教学优质质量奖二等奖、西安电子科技大学青年教师讲课比赛三等奖，在国内外知名期刊发表论文30余篇。'
