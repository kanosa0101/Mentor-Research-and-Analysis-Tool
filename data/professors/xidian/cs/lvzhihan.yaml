bio_raw: '个人简介

  Personal Profile

  学术背景与研究领导力

  本人为全球高被引科学家、

  ACM

  杰出讲者、英国计算机学会会士、欧盟玛丽·居里学者、联合国特邀专家、省级人才。曾逾百次受邀为包括布鲁克海文国家实验室、美国联邦航空局在内的国际顶尖机构及

  IEEE ITSC

  等重要会议作特邀或大会主题报告。同时，长期担任美国、加拿大等十余个国家的科研基金与国际奖项评审专家，并参与澳大利亚、意大利等多所海外高校的职称与学位评审工作。回国前，任职于瑞典乌普萨拉大学（

  QS 2027

  全球排名

  87

  位），获终身教职副教授职位。此前曾在英国伦敦大学学院（

  UCL

  ）与西班牙巴塞罗那大学等世界知名学府从事博士后研究。

  学

  术成就与影响力

  累计十次获得国际会议与期刊的最佳论文奖，其中包括《

  Science

  》合作期刊《

  Research

  》颁发的最佳论文奖。亦荣获瑞典计算机科学领袖奖（全瑞典排名第二）、瑞典

  Uminova

  学术商业挑战赛“最佳创意奖”、

  IEEE TNSM

  杰出编委奖和

  CCF A

  类会议

  IEEE VR 2023

  服务认可奖等荣誉。担任多个

  IEEE

  汇刊（

  Transactions

  ）期刊的副主编，并长期在多个

  CCF A

  类会议中担任领域主席等职务。常年入选斯坦福大学发布的“全球前

  2%

  顶尖科学家”终身科学影响力榜单等国际权威学术排名。作为负责人主持国家级及省部级项目十余项，作为核心成员参与包括欧盟

  ERC

  高等资助（

  ERC Advanced Grant

  ）、欧盟第七框架计划项目在内的多项重大'
