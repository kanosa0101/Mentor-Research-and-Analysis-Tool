bio_raw: '杜军朝，

  工学博士，西安电子科技大学计算机科学与技术学院教授、博士生导师，中国计算机学会高级会员，ACM和IEEE会员，ACM西安分会副秘书长，

  陕西教育厅青年创新团队带头人

  。

  美国Wayne State University、New Jersey Institute of Technology、University of California-Santa
  Cruz、Rice大学访问学者。

  IEEE  WiMAN，IEEE  WWASN，IEEE/IFIP  EUC, IEEE/IFIP  TSP等国际学术会议的程序委员成员。

  IEEE  JSAC，IEEE  Transaction  Vehicular  Technology，IEEE Sensor Journal等学术期刊评审。

  国家自然科学基金通讯评委，教育部留学回科研启动基金评委等。'
