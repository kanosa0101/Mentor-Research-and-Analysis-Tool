bio_raw: '个人简介

  Personal Profile

  西安电子科技大学计算机科学与技术学院副教授，博士生导师，

  陕西省级人才、

  秦创原引用高层次创新创业人才、小米青年人才、陕西省计算机学会优秀青年专家，入选斯坦福大学2023年、2024年《

  全球前2%顶尖科学家榜单

  》。本科和研究生分别于2011年和2014年毕业于西安电子科技大学软件工程专业和计算机系统结构专业，博士2017年毕业于日本公立函馆未来大学系统信息科学专业，曾于2017年至2021年在日本国立奈良先端科学技术大学院大学任教，2022年至2025年在航天五院502所轩宇信息技术有限公司做博后（导师：杨孟飞院士）。

  研究方向主要为

  基于人工智能等技术研究卫星互联网安全

  ，包括通信与导航卫星信号攻防等。已在IEEE TIFS、IEEE TMC、IEEE TWC、IEEE TCOM、ION GNSS+等主流的期刊和会议上发表论文60篇，累计Google
  Scholar引用2200余次，

  单篇最高引用1000余次

  （第一作者），撰写英文专著1部（无线通信安全领域首部全面涵盖保密、认证、隐蔽通信的著作）、中文专著1部，立项ITU标准1项、国家标准1项、团体标准2项。

  主持军科委重点项目子课题、国家重点研发计划子课题、

  国家自然科学基金委青年科学基金、陕西省青年科学基金B类项目、

  陕西省人才项目（青年）等项目10余项。获新疆生产建设兵团自然科学二等奖、青岛市科学技术进步一等奖、陕西省计算机学会自然科学一等奖、

  陕西省高校科学技术研究优秀成果一等奖、多项国际会议和期刊最佳论文奖等

  。担任IEEE/ACM ToN, IEEE TIFS, IEEE JSAC, IEEE TDSC, IEEE TWC等期刊的审稿人。

  团队研发全球首款支持OSNMA的伽利略导航信号生成工具，可支撑伽利略抗信号欺骗能力测试。

  工具开源地址：

  https://github.com/Haiyang-Wong/Galileo-OSNMA-Generator

  谷歌学术主页：

  https://scholar.google.com/citations?user=izVMhnQAAAAJ&hl=en

  欢迎对卫星互联网安全、无线物理层认证感兴趣的同学联系报考！

  实验室氛围和谐，不打卡，研究经费、劳务费充足。

  毕业生去向：国外读博深造、国内大厂就业（京东、美团等）

  2026暑期招生推免差不多要开始了！！！'
