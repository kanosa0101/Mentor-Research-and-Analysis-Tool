bio_raw: '个人简介

  Personal Profile

  崔笛

  ，西安电子科技大学计算机科学与技术学院副教授，硕士生导师，工学博士。2015年6月于西安交通大学获软件工程专业学士学位。2021年9月于西安交通大学获计算机科学与技术专业博士学位（导师：

  郑庆华

  教授，

  指导教师

  ：刘烃教授

  ）。同年进入西安电子科技大学工作，现为计算机科学与技术学院智能软件与系统新技术团队教师（负责人：

  李青山

  教授

  ）。近年来，在ICSE、ASE、ISSTA、TSE、SCIS等国内外软件工程顶级期刊与会议上，发表论文20余篇。主持国家自然科学基金一项，企业合作项目多项，参与国家自然科学基金重点研发计划、联合基金重点项目、面上项目等国家及省部级项目十余项，相关成果申请或授权国家发明专利十余项。

  常年招收

  计算机科学与技术

  、

  电子信息

  等方向硕士生、以及学有余力的本科实习生，欢迎联系。

  研究方向

  代码大模型，软件数据挖掘'
