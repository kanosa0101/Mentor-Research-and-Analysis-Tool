bio_raw: '新版个人主页：

  西电教师个人主页系统 张南 中文主页 (xidian.edu.cn)

  先后在2006、2012年，于西安电子科技大学计算机学院获得工学学士、工学博士学位。主要从事芯片设计EDA软件，以及软件的可靠性、安全性和智能推理理论与方法等领域的研究工作。以第一/通讯作者在国际/国内期刊Theoretical
  Computer Science，IEEE Transactions on Reliability, IEEE Transactions on Intelligent
  Transportation Systems, Journal of Combinatorial Optimization, Mobile Networks and
  Applications, 中国科学-信息科学，软件学报等发表论文30余篇。担任中国计算机学会高级会员、CCF形式化方法专委会委员、IEEE会员、中国人工智能学会会员等职务。

  科研团队

  计算理论与技术研究所（Institute of Computing Theory and Technology, ICTT）

  西安市软件可信认证关键技术重点实验室

  陕西省重点科技创新团队'
