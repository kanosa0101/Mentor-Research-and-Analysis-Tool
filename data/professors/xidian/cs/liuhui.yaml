bio_raw: '邀你加入“

  Mobisys云智

  ”团队：做

  新一代端云协同智能系统

  的“

  系统架构师

  ”与“

  系统大管家

  ”！

  刘 惠，教授、博士生&硕士生导师

  1. 教育经历

  ：在西安电子科技大学计算机学院分别取得本科、硕士、博士学位。

  2. 工作经历

  ：西安电子科技大学计算机科学与技术学院 & 软件学院。

  3.

  访

  学经历

  ：

  在美国韦恩州立大学、香港理工大学、美国新泽西理工学院、美国加州大学圣克鲁兹分校访问学习

  。

  4. 学术任职

  ：

  CCF分布式计算与系统专委会执委和秘书处成员、CCF嵌入式系统专委会执委；西安市信息系统运维行业协会“数字服务与智能化”专家。

  5

  .

  研究方向

  ：

  云计算和大数据、端边云协同计算、大模型与

  AI Agent

  应用。

  旨在为分布式智能系统

  :  (1)

  铸造高韧性、高敏捷、高效能的

  “

  分布式系统骨骼

  ”

  底层基石

  ; (2)

  大模型和

  AI Agent

  应用，打造分布式场景下的

  “

  智能参谋

  ”

  。

  相应的，实验室分为两个研究大组：

  System

  组和

  AI

  组，详细信息请看主页

  “

  科研方向

  ”

  介绍。

  6.

  科

  研项目

  ：

  主持了国家自然科学基金面上和青年基金项目、国防预研项目、国家重点研发计划子课题、陕西省工业领域创新链项目、国家重点实验室开放基金、企业合作项目数十项

  。

  7. 成果简介

  ：在ACM TODAES、IEEE TMC等国际学术期刊以及ACM Ubicomp、ACM Mobisys、ACM ICPP、ECRTS、DASFAA等国际学术会议发表论文70余篇，出版物联网专著
  1 部、参与制定云计算与大数据行业标准1项、国防专利和发明专利授权30余项。

  所在团队获得CCF A类学术会议“Distinguish Paper Award”等学术奖项以及教育部科技发明奖等科技奖项，被陕西省政府授予“陕西省科技创新团队”、“陕西高校青年创新团队”。

  8. 业界交流

  ：与工业界建立了广泛的合作关系，紧密跟踪计算机软硬件发展的新技术和热点，个人参加IT公司新技术培训和考试，已取得IBM、Intel、BEA、SUN、百度、AWS等IT公司颁发的专业技术认证证书15余项。

  研制的大型企业应用系统在我国银行/电力/互联网/交通等行业和单位全国部署投产运行至今。具有

  丰富的自主可控系统软件及算法、应用软件研发经验，注重解决实际场景问题。'
