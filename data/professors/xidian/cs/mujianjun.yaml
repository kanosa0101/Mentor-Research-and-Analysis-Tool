bio_raw: '♦

  慕建君，男，工学博士，  西安电子科技大学教授， 博士研究生导师。

  ♦ 西安电子科技大学计算机学院计算机科学系党支部书记,计算机科学系副主任。

  ♦ 2002年12月获该校通信工程学院通信与信息系统专业博士学位，主要从事网络与

  存储

  系统差错控制编译码算法、网络编码及其应用、网络信息安全的研究。

  ♦ 中国计算机学会多值逻辑与模糊逻辑专委会

  委员

  。

  ♦ IEICE会员，中国计算机学会高级会员，

  中国电子学会高级会员

  。

  ♦

  主持在研国家自然科学基金面上项目3项、陕西省自然科学基金项目1项、综合业务网国家重点实验室开放基金项目1项、重庆市/信息产业部移动通信技术重点实验室开放课题基金项目2项、

  西南交通大学信息编码与传输四川省重点实验室

  开放课题基金项目1项

  。

  ♦

  2011年获西安电子科技大学“师德先进个人”

  。

  ♦

  近年来在《IEEE Transactions on Communications》、《IEICE Trans.Commun. 》、《Progress in Natural
  Science》、《IEEE Communications Letters》、《ELECTRONICS LETTERS》、《Chinese Journal of
  Electronics》、《电子学报》和《计算机学报》等国内外核心期刊和国际会议共发表论文50余篇，其中被SCI检索40篇次，EI检索45篇次

  。

  ♦  国家自然科学基金评审专家。

  ♦  任IEEE Communication letters、China Communication、计算机学报，电子学报、电子与信息学报等杂志特邀审稿人。

  慕建君,1965年3月生于陕西省榆林市。1997年3月获西安电子科技大学应用数学专业硕士学位。2002年12月获该校通信工程学院通信与信息系统专业博士学位。1997年留校任教，1998年评为讲师，2003年评为副教授，2008年评为教授，2009年遴选为计算机系统结构学科博士生导师。现为计算机软件与理论学科博士研究生导师和硕士研究生导师，同时，兼任软件工程学科博士研究生导师。'
