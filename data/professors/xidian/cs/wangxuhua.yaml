  个人简介

  Personal Profile

  王徐华，男，汉族，博士，2007年于空军工程大学雷达工程专业获学士学位；2009年于空军工程大学获计算机应用专业硕士学位；2013年博士毕业于空军工程大学电子科学与技术专业。从2018年开始至今，于西安电子科技大学任教。主持过，参与多项863和973项目，及陕西省科技进步二等奖各一项。

  目前的研究方向为战场测量及仿真评估技术 、无人机集群作战及无人机反制技术，相关在研项目三项，具有很强的价值。期待有志同学加入团队，一起攻克关键技术，服务国防事业。

