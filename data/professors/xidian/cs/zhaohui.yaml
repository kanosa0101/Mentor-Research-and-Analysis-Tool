bio_raw: '个人简介

  Personal Profile

  赵辉，计算机科学与技术学院副教授，博导，硕导。先后获西安电子科技大学计算机科学与技术学士、硕士学位，曾任职于华为技术有限公司，后获西安交通大学计算机科学与技术博士学位，获西安交通大学优秀博士学位论文。

  目前在陕西省智能人机交互与可穿戴技术重点实验室、嵌入式计算技术研究所/外部设备研究所开展研究工作，主要研究方向：面向云边计算/算力网络的资源管理与任务调度等，主持国家自然科学基金、陕西省重点研发计划、横向课题等多项，参与国家自然科学面上项目、预研项目、陕西省重点研发计划等多项。

  获陕西省科技进步一等奖，发表IEEE TPDS、IEEE TCSVT、IEEE TMM等CCF推荐期刊/会议学术论文50余篇等，获国家发明专利、软件著作权30余项。

  详细见：https://web.xidian.edu.cn/hzhao/'
