bio_raw: '个人简介

  Personal Profile

  鱼滨，博士，教授，博士生导师，现在西安电子科技大学计算机科学与技术学院任教。

  1986

  在中山大学获得计算机软件学士学位，

  1989

  年在西北大学获得计算机软件与理论硕士学位，

  2003

  年在西北大学获得计算机软件与理论博士学位，

  2004

  年至

  2005

  年在意大利莱切（

  LECCE

  ）大学进修。主要研究领域：信息安全、人工智能、医学图像处理。

  参加和主持国家自然科学基金重点项目、国家自然科学基金面上项目、国家“

  863

  ”项目、教育部重大项目、陕西省教育厅专项基金项目等，发表学术论文

  30

  余篇。

  获陕西省政府科学技术奖三等奖，

  陕西省教育厅科技进步一等奖，

  陕西省高等学校科技进步二等奖。'
