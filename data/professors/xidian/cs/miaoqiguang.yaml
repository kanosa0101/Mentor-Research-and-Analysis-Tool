  实验室新闻-动态-进展

  [2019.3.27] 应计算机科学与技术学院副院长、CCF西电学生分会督导主任苗启广教授邀请，西南科技大学计算机学院副院长吴亚东教授来我院进行交流访问，并为研究生作了题为“可视化让视觉分析触手可及”的学术报告。

  （New）

  [2018.12.09] CCF西电学生分会成立大会在我校顺利举行，苗启广教授受聘担任分会督导主任。

  （New）

  [2018.11.30] 应苗启广教授邀请，日本静冈大学副教授Damon M. Chandler来我校访问并作了题为

  “ On

  the perception and misperception of Quality Assessment Research”的学术报告。

  （New）

  [2018.10.14] 由西安电子科技大学承办的第六届CCF大数据学术会议在陕西宾馆圆满结束！

  （New）

  [2018.09.21] 苗启广教授代表西安电子科技大学计算机科学与技术学院成功申办2019年CCF嵌入式系统学术年会。

  （New）

  [2018.09.08]祝贺博士生刘如意于2018年9月8日顺利通过博士学位论文答辩！

  （New）

  [2018.09.08] 应苗启广教授邀请，IEEE TEVC主编、香港城市大学Kay Chen TAN教授来实验室交流访问，并做了题为

  “Differential

  Evolution-based Methods for Numerical Optimization”的主题报告。

  （New）

  [2018.05.31] 祝贺张越等8名硕士研究生于2018年6月3日顺利通过硕士学位论文答辩!

  （New）

  [2018.05.19] 苗启广教授作为local chair承办的IEEE FG 2018于5月16日-19日在西安顺利召开。

  （New）

  [2018.05.04]

  苗启广教授带领的“

  计算机视觉与网络智能团队

  ”在计算机学院会议室举行“三好三有”研究生导学团队挂牌仪式。校党委副书记杨银堂、研工部部长秦荣、研究生院奖助办科长霍学浩、计算机学院副院长王卫东等有关领导及团队师生40余人出席。

  （New）

  [2018.04.17] 应苗启广教授邀请，悉尼大学副教授欧阳万里博士来我校访问，并做了题为“结构化深度模型及其在基于视觉的定位和识别中的应用”的报告。

  （New）

  [2017.12.10] 由西电计算机学院和研究生院主办的“智见未来：大数据关键技术”学术研讨会在西电图书馆西裙楼三楼报告厅举行。苗启广教授主持了本次会议。

