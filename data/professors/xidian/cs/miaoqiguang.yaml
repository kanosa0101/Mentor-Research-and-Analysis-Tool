bio_raw: '苗启广

  ，博士，教授，博士生导师，西安电子科技大学计算机科学与技术学院副院长，学院教授委员会主任；西安市大数据与视觉智能重点实验室主任；中国计算机学会（CCF）理事、CCF
  YOCSEF主席(2017-2018)，ACM西安常务理事，陕西省计算机学会理事、陕西省大数据与云计算产业联盟理事、中国大数据产业应用协同创新联盟理事、中国大数据应用西北联盟常务理事;
  CCF计算机视觉专委会常务委员，CCF 大数据专委会委员，CCF人工智能与模式识别专委会委员，CCF 青年工作委员会委员， CCF 分部与会员工作委员会执委，CCF
  专家资源工作小组执委；教育部工程专业认证协会计算机分委会工程专业认证专家;海上指挥控制专委会委员, 航空学会信息融合专委会委员，IEEE Senior Member。2013年12月-2014年7月受国家留学基金委资助在美国做高级研究学者；2005年12月获西安电子科技大学计算机应用技术博士学位，主要从事计算机视觉、机器学习、大数据分析方面的研究。主持在研和完成国家重大科技专项课题、国家重点研发计划课题、国家自然科学基金、省自然科学基金、863、教育部高校基本科研业务费重点项目项目30余项；
  2008 /2011/2014年分别获西安电子科技大学“十佳师德标兵”称号；近年来，在IEEE TNNLS/TIP/TGRS/TEC/TIST; AAAI、IJCAI;
  Plos One、JVCIR、Knowledge Based System、NeuroComputing、IET Image Processing、International
  Journal of Information Security、软件学报、计算机学报、电子学报、光学学报等国内外重要学术期刊、国际会议上发表SCI/EI收录论文100余篇。担任FG2018、NPC
  2016国际会议组织委员会主席、、ICYCSEE 2018、IEEE Advanced Information Management, Communicates,
  Electronic and Automation Control Conference (IEMCE)（2015-2018）国际会议程序委员会主席；CCF 2018年大数据学术会议、2016年全国高性能计算学术年会、2015年CCF
  首届中国计算机视觉大会程序委员会主席、2011年CCF 首届青年精英大会、NPC 2016国际会议组织委员会主席； CCCV 2015/HPC China 2016程序委员会主席，ICCV、CVPR、ECCV、IJCAI、AAAI、CIS
  2012/2013/2014/2015/2016、CCFAI 2013、CNCC2008、CCDM2014、IEEE WACV 2015、ICYCSEE 2015、NCIIP
  2013/2015、CSA2015  PC Member； International Journal of Bio-Inspried Computing等国际期刊的Associate
  Editor； Neurocomputing、Journal of Memetic Computing、 Multimedia Tools and Application、Journal
  of Industrial Mathematics等期刊的Guest Editor；计算机科学、软件工程、中国计算机学会通讯（CCCF）、物联网技术等国内外期刊编委；
  担任国家奖评审专家、国家重点研发计划、国防基础科研评审专家等。先后获省部级奖2项。'
