  个人简介

  Personal Profile

  西安电子科技大学计算机科学与技术学院副教授，博士生/硕士生导师，现任陕西省网络与系统安全重点实验室副主任、陕西省物联网实验研究中心副主任、计算机网络与物联网研究所本硕博师第一联合党支部书记，是网络与信息安全教育部创新团队（领域唯一）骨干、信息安全国家级教学团队核心成员、中国指挥与控制学会智能物联网专委会委员、陕西省计算机学会网络空间安全专委会委员，担任TIFS、TDSC、TVT、J-NaNA、西安电子科技大学学报、智能安全等期刊编委/审稿人，被聘为教育系统网络安全保障专业人员(ECSP)项目培训专家、中国教育发展战略学会评审专家、全国研究生教育评估检测专家、

  庆阳市数字经济发展咨询专家

  等。

  主要研究方向是智能无人系统内生安全、云网端协同安全等，承担网络空间安全相关的**科技创新特区项目、**科技基础加强计划项目、

  国家重点研发计划项目、

  国家自然基金重点项目、省重点研发项目和华为、海康威视等企业委托开发项目近20项，发表相关学术论文20余篇，申请/授权PCT专利4项、中国技术发明专利30多项，编著教材/专著5部。曾获得中国航空学会科学技术一等奖、青岛市科学技术进步一等奖、陕西高等学校科学技术研究优秀成果一等奖、

  陕西省研究生教育成果特等奖、

  陕西省科技工作者创新创业大赛银奖、

  中国航空工业集团有限公司科学技术一等奖、'
