  个人简介

  Personal Profile

  祝幸辉，博士，西安电子科技大学准聘副教授，主要研究方向为物联网及安全，主持或参与国家重点研发、GF基础加强计划、国家自然科学基金、陕西省重点产业创新链、企业横向项目等20余项，近3年科研经费到账500余万元。在国际知名期刊、会议发表论文18余篇，申请国家技术发明专利43项，授权18项，出版专著一部、教材一部，曾获陕西省科技工作者创新创业大赛金奖、中国发明专利优秀奖、青岛市科技进步二等奖等荣誉奖励。

