bio_raw: '副教授，硕士生导师，一直从事大规模软件系统的缺陷检测和可信验证的基础理论与应用研究，

  现为

  智能软件构造与质量保障国防重点学科研究中心（省部级平台）副主任、

  西安市软件可信认证关键技术重点实验室副主任，

  陕西省三秦英才特殊支持计划“创全国一流”团队和陕西省安全攸关智能软件重点科技创新团队

  骨干成员（负责人：田聪教授），担任

  计算机科学与技术学院软件工程基础理论方向学科秘书、计算理论与技术研究所本硕博师第二联合党支部书记、中国计算机学会高级会员、

  中国计算机学会形式化方法专委会副秘书长、

  西电-海思EDA技术委员会委员。

  研究领域：

  基于大语言模型的程序缺陷检测（Vulnerability Detection Based on LLM）

  科研成果：

  在ISSTA 2026（CCF A类会议，Tool Demonstrations），ASE 2026

  （CCF A类会议，

  Tools and Datasets）， ACL 2026

  （CCF A类会议，Syetem Demo），

  F

  SE

  2026（CCF A类会议，Research+IVR），

  ICSE

  2026（CCF A类会议，NIER），

  Information Fusion 2025

  （中科院1区期刊）

  , Expert Systems with Applications

  2025

  （中科院1区期刊），

  ASE

  2024（CCF A类会议）、

  ESEC/FSE 2023（CCF A类会议）、ISSTA 2023（CCF A类会议）、TPDS 2023（CCF A类期刊）、ASE 2022（CCF A类会议）、TITS
  2022（中科院1区期刊）、《软件学报》（CCF A类期刊）等国内外学术期刊和会议发表与项目相关的论文50篇，已授权/申请发明专利8项。

  详细内容请访问

  Google Scholar主页

  承担项目：

  [1] 作为项目负责人，

  主持国家自然科学基金面上项目/青年项目

  ，陕西省自然科学基础研究计划1项，西安市科技计划项目1项，西咸新区秦创原春种投资基金1项（100万），西安市“三项改革”科技成果转化项目，航天五院横向研究课题，校级教改实践类（创业人才培养改革实践）重点项目，校级卓越工程师校企课程建设项目

  ，

  人工智能赋能研究生教育“揭榜挂帅”项目

  ，

  基本科研业务费科技成果转化基金。

  [2] 作为核心项目成员，参与西安电子科技大学田聪教授主持的国家自然科学基金重大项目“嵌入式软件合成过程及产品的质量保障”中大规模程序的运行时验证（第三参与人）、段振华教授主持的国家自然科学基金重大研究计划“C/Verilog程序的MSVL验证理论与方法”中模型检测器的设计与实现、以及中国航天科技集团第五研究院合作项目“航天嵌入式软件可信集成环境SpaceDep
  研究”中基于LLVM平台的内存泄漏检测等软件可靠性与安全性保障工作，并在探月工程三期“嫦娥五号”月地高速再入返回飞行试验器控制软件等多款航天软件的开发中得到了成功应用。带领科研团队设计研发的“信芯-国产高可信数字芯片设计验证平台”，已与北京微电子技术研究所（航天九院772所）等合作，开展成果应用转化。

  所获荣誉：

  [1] 创新创业比赛：以项目负责人身份，获得

  2022年陕西省科技工作者创新创业大赛一等奖，2023年创客中国广东赛区第一名、全国总决赛第三名（创客组），2025年

  陕西省

  第一届卓越工程师大赛决赛优胜奖（前10/500）

  。

  [2] 指导学生比赛：以第一/第二指导教师身份，指导研究生/本科生研究团队一起获得

  2021年中国国际“互联网+”大学生创新创业大赛国赛金奖（项目名称：信芯-国产高可信数字芯片设计验证平台），

  2022年度国家级大学生创新创业计划项目结题验收结果优秀，2022年“挑战杯”大学生创业计划竞赛省赛金奖，

  2023年中国国际“互联网+”大学生创新创业大赛国赛三等奖、省赛金奖+银奖，2023年“挑战杯”大学生课外学术科技作品竞赛国赛三等奖、省赛特等奖，2023年“挑战杯”中国大学生创业计划竞赛国赛三等奖。

  [3] 教学与党建：2020-2021年度、2022-2023年度优秀本科生导学团队，2023年度计算机科学与技术学院优秀党支部书记，2024年西安电子科技大学优秀党支部，

  2025年度计算机科学与技术学院优秀党支部书记。

  [4] 个人荣誉：获得2021年第七届中国国际“互联网+”大学生创新创业大赛优秀创新创业导师和“陕西赛区先进个人”称号，获得2022年第十一届“挑战杯”陕西省大学生创业计划竞赛优秀指导教师、2023年十四届“挑战杯”陕西省大学生课外学术科技作品竞赛优秀指导教师和2023年第九届中国国际“互联网+”大学生创新创业大赛陕西赛区优秀创新创业导师称号，被评为2021年度和2022年度西安电子科技大学优秀创新创业导师。

