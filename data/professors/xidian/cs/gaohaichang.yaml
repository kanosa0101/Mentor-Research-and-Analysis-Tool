bio_raw: '教授，博士生导师，网信创新人才，陕西省杰出青年基金获得者，西安市智能系统安全重点实验室主任；CCF杰出会员，IEEE会员，CCF网络与系统安全专委会执委，CIE中国电子学会网络空间安全专委会委员，CAAI中国人工智能学会智能信息网络专委会委员，中国兵工学会专委副主任委员。

  现从事网络信息安全和人工智能安全相关的研究工作，相关研究成果被CCS、Usenix Security、NDSS、AAAI、ICML、ACSAC等国际顶级会议和IEEE
  Transactions on Dependable and Secure Computing

  、

  IEEE Transactions on Information Forensics & Security、

  IEEE Transactions on Industrial Informatics、

  IEEE Transactions on Image Processing和ACM Computing Surveys等国际顶级期刊收录发表。

  任

  AisaCCS

  、

  PICOM

  、DSDS等会议TPC，任IEEE Transactions on Information Forensics & Security、IEEE Transactions
  on Reliability、Pattern Recognition, International Journal of Information Security、Security
  and Communication Networks等英文国际期刊审稿人，西安电子科技大学学报以及若干国际会议审稿人。

  先后在英国The University of Nottingham、美国University of Rhode Island和Ohio State University大学、澳大利亚Swinburne
  University of Technology做长期和短期访问研究。

  “身份认证与访问安全关键技术研究”获

  陕西省计算机学会自然科学一等奖

  ；

  “网络安全认证关键技术研究”获

  陕西高等学校科学技术一等奖

  ；

  《身份认证技术》获陕西计算教育学会优秀教材一等奖'
