  个人简介

  Personal Profile

  现任西安电子科技大学计算机科学与技术学位委员会委员，陕西省图形图像学会理事，中国仪器仪表学会空间仪器分会理事。

  主要从事图像/视频处理、编码及传输、芯片设计及高性能计算等领域的研究工作。主持并完成了国家自然科学基金重大研究计划、面上项目、国际合作与交流项目、火星探测中光谱图像压缩项目，作为骨干成员参加国家重大专项、探月工程和载人航天等多项科研项目。

  先后获国防科学技术二等奖1项（2010）、国防科学技术三等奖1项（2014）陕西省科技进步二等奖1项（2008），2008年、2009年EMC优秀教师称号、2013年西安电子科技大学师德先进个人，2014年教育部-IBM高校合作优秀合作教师奖、2015年西安电子科技大学师德标兵。

