bio_raw: '个人简介

  Personal Profile

  现任西安电子科技大学计算机科学与技术学位委员会委员，陕西省图形图像学会理事，中国仪器仪表学会空间仪器分会理事。

  主要从事图像/视频处理、编码及传输、芯片设计及高性能计算等领域的研究工作。主持并完成了国家自然科学基金重大研究计划、面上项目、国际合作与交流项目、火星探测中光谱图像压缩项目，作为骨干成员参加国家重大专项、探月工程和载人航天等多项'
institutes:
- 计算机科学与技术学院
research_direction_raw: 研究方向、Research Focus、社会兼职、Social Affiliations、1. 高速图像视频编码算法及实现研究、2.
  基于FPGA/嵌入式片上系统的应用研究、3. 高性能微处理器体系结构研究、西安电子科技大学计算机科学与技术学位委员会委员、陕西省图形图像学会理事、中国仪器仪表学会空间仪器分会理事、国际会议SPIE
  Optics+Photonics 2011卫星数据压缩、通信与处理分程序委员会委员、《计算机学报》、《光学学报》、《通信学报》、IEEE Transactions
  on Very Large Scale Integration Systems、《西安电子科技大学学报》（自然科学版）、《吉林大学学报》审稿人
