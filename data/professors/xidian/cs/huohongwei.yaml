  个人简介

  Personal Profile

  西安电子科技大学计算机科学与技术学院教授、博士生导师。先后于西北大学获数学学士学位，西安电子科技大学分别获计算机软件与理论及信号与信息处理硕士和博士学位。受到Jeffrey
  S. Vitter教授邀请，曾在堪萨斯大学工作一年。IEEE高级会员，ACM会员，中国计算机学会高级会员。研究方向包括： 压缩数据结构，压缩索引与检索，算法理论与算法工程，并行算法，外存算法。在IEEE
  TKDE，Information and Computation

  ,

  Bioinformatics, IEEE/ACM TCBB和IEEE ICDE等国内外重要刊物和会议发表学术论文100余篇。

  研究成果

  与

  Jeffrey S. Vitter教授合作，引入了k-阶图熵的概念。首次

  建立了标签属性有向多重图的熵空间自索引表示模型CGraphIndex。无需存储原始输入，因为自索引本身编码了数据。CGraphIndex在图属性上达到了高阶熵压缩；在图结构上达到了一阶图熵。

  CGraphIndex

  已在GitHub上开源，且被

  AI Devin

  在

  DeepWiki

  上解析：

  https://deepwiki.com/Hongweihuo-Lab/CGraphIndex

  CGraphIndex主要特征包括：

  常量时间操作：支持在常量时间内在图结构和图属性上的基本和导航操作。

  高效的属性提取：能够快速检索顶点和边上的属性。'
