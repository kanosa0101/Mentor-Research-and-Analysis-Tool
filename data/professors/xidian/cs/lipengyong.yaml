bio_raw: '个人简介

  Personal Profile

  李朋勇，

  副教授，

  计算机科学与技术学院，研究生导师，毕业于清华大学生物医学工程系。

  主要研究方向为基于人工智能的药物研发，近年来基于图神经网络、自监督学习、强化学习等深度学习算法，围绕药物性质预测、药物靶点相互作用、药物设计生成等任务展开研究工作。

  在

  Nature Conmputatinal Science

  、

  IJCAI、Nature MachineIntelligence、Bioinformatics

  等相关领域主流期刊和学术会议发表论文十余篇。作为合作单位负责人主持国家自然科学

  联合基金重点项目

  ，主持国家自然科学

  面上项目

  ,国自然青年项目。指导学生获工信部举办的全国人工智能创新应用大赛一等奖，

  国家级大学生创新创业计划等

  。

  中国人工智能学会智慧医疗专业委员会委员。

  CCF Bio-3New

  执委会委员。

  担任

  Nature Conmputatinal Science、

  Nature Conmunication

  等

  期刊审稿人。

  实验室开发的软件工具平台：

  www.molmatrix.com

