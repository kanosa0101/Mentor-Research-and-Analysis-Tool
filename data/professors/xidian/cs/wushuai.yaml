  Personal Profile

  吴帅，西安电子科技大学华山准聘副教授，硕士生导师，工学博士，于2021年在哈尔滨工业大学（深圳）获得博士学位。2022年入职西安电子科技大学计算机科学与技术学院，并加入大数据与视觉智能研究所，

  主要研究方向为视觉目标检测、医学影像分析处理、生物信息学、模式识别等

  。目前，在IEEE TNNLS TMM, TSMCS, TCSVT, Pattern Recognition，Bioinfomatics，IJCAI，BIBM等高水平期刊会议上共发表论文20余篇。主持国自然项目与陕西省秦创原创新创业人才项目，承担与中铁建合作的铁路智能钻探管理系统项目。

  硕士研究生招生：

