  Personal Profile

  博士，硕士生导师，讲师，2015年于西安电子科技大学电子信息工程专业获得学士学位，2020年于

  西安电子科技大学

  信息

  与通信工程专业获得博士学位。博士期间主要从事机器学习、计算机图像与视频处理、底层视觉信息处理方面的研究。

  目前主要从事多模态表示学习与信息合成、工业智能信息感知与处理方面的研究。

  相关成果发表在IEEE TNNLS、CCF A类会议IJCAI、CVPR等国际期刊及会议上，授权发明专利3项，

  参与国家面上项目2项。

  招生信息

  欢迎对计算机视觉、图像处理、深度学习等研究方向感兴趣的优秀本科生加入。

