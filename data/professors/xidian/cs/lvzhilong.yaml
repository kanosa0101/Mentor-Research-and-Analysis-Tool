bio_raw: '吕智龙

  ，

  工学博士，

  华山准聘副教授。

  2015年6月毕业于西安交通大学计算机科学与技术专业，获工学学士学位。

  2023年9月毕业于中国科学院计算技术研究所计算机系统结构专业，获工学博士学位

  （导师：张法教授）。

  主要研究方向为

  计算生物信息学，计算病理学及多模态肿瘤数据分析，

  在Big Data Mining and Analytics、

  IEEE JBHI、

  IEEE/ACM TCBB、MICCAI、BIBM

  等国际期刊与会议发表文章10余篇。'
