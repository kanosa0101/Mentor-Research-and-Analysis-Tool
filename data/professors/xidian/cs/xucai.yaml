bio_raw: '徐偲，副教授，博士生导师。主要研究方向为可信多模态深度学习。发表CCF A类/中科院一区论文40余篇，其中一作/通讯20余篇。主持国基金面上、青年基金项目、陕西省自然科学基础研究计划前沿探索项目等，作为核心骨干成员参与国基金重点项目2项、陕西省关键核心技术攻关项目（序2）、重点产业创新链项目（序2）。

  代表性荣誉奖励：

  人工智能领域顶级会议、CCF A类会议AAAI-24的“最佳论文奖”（序1）；

  陕西省自然科学奖一等奖（序3）；

  “中国科协青年人才托举工程”；

  “陕西省优秀博士学位论文”；

  西安电子科技大学研究生“校长奖”。

  招生信息：

  硕士招生专业为计算机科学与技术（学术型硕士研究生）和电子信息（专业型硕士研究生），

  27年名额已满

  。

  非常欢迎本科生加入团队一起学习，

  团队情况点击此处获取

  （cxu@xidian.edu.cn）。

  学术成果介绍：

  2024年7月31日受邀在VALSE Webinar进行题为“面向低质多模态数据的深度学习”的学术报告

  ，

  从多模态深度学习的基本概念、研究领域和范畴出发，结合本人的研究工作，介绍面向低质多模态数据的深度学习领域研究的主要问题和研究进展，讨论该领域的挑战和对未来工作的展望

  。

  视频点击此处获取

  ，

  PPT点击此处获取

  。'
