bio_raw: '个人简介

  Personal Profile

  西安电子科技大学

  三级教授

  ，博导，

  区块链技术应用与评测教育部工程研究中心副主任

  、智能系统安全西安市重点实验室副主任、陕西省青年科学基金A类（

  原陕西省杰青

  ）项目获得者、

  西安市中青年科技创新领军人才项目获得者

  、陕西省计算机学会“计算机领域优秀青年专家”获得者，西安市十佳程序员获得者;  IEEE/ACM会员，中国计算机学会CCF区块链专委会/服务计算专委会执行委员，中国计算机学会区块链专委会教育培训组副组长，中国人工智能学会CAAI智能信息网络专委会执行委员，陕西省科技项目评审专家组成员。

  分别于2003年、2006年和2011年在西安电子科技大学获得计算科学与技术专业学士学位、计算机应用硕士学位和计算机系统结构博士学位; 2016.03-2017.03赴美国俄克拉荷马州立大学访学。

  主要从事

  下一代网络安全、区块链+大模型/智能体

  等领域的研究工作，先后主持/参加了二十余项国家级、省部级项目，结合研究工作在ACM CCS, IEEE INFOCOM, IEEE JSAC, IEEE TMC/TIFS/TDSC

  /TSC

  /TC

  /TWC/TII/TVT/TCC,  软件学报, 通信学报等国内外顶级学术期刊会议上录用发表了一百余篇论文，申请/授权专利四十余项，授权软件著作权十二项，出版学术专著三本，立项国际标准二项、行业标准四项，荣获教育部科技进步一等奖、省技术发明二等奖（

  第一获奖人

  ）等六项奖励。

  研发

  “玄知”密码大模型

  （2026年2月发布V3版，受到各大媒体转载）

  中

  区块链智能体

  （

  主导研发）、

  密码分析智能体

  （参与研发）

  ，欢迎试用：https://chat.cryptollm.net/

  任ICC、GlobeCom、VTC等通信领域、车联网领域权威会议TPC，任IEEE Transactions on Information Forensics
  & Security、IEEE Transactions on Wireless Communications、IEEE Transactions on Service
  Computing等英文国际期刊审稿人，通信学报、西安电子科技大学学报以及若干国际会议审稿人。

  论文列表：

  部分论文见

  https://dblp.org/pid/49/7488.html'
