  个人简介

  管子玉，1982年生，博士，西安电子科技大学教授、博士生导师，曾获国家级青年人才项目。主持基金委重点项目、面上项目等国家级项目。在数据挖掘、信息检索、数据管理等领域的顶级国际会议和期刊发表论文150余篇，包括TKDE、TPAMI、TNNLS、TIP、VLDB、SIGMOD、SIGIR、ICDE、WWW、AAAI、IJCAI、SIGKDD、CVPR等。担任TKDE、Neurocomputing和International
  Journal of Machine Learning and Cybernetics编委，担任多个高水平国际会议程序委员会委员/资深委员，如SIGKDD、IJCAI、AAAI、NeurIPS、SIGIR、CIKM等，担任领域内知名国际会议环太平洋多媒体会议PCM
  2016组织主席。获2025年度中国自动化学会自然科学奖一等奖、2024年度陕西省自然科学奖一等奖、2024年度AAAI最佳论文奖、2020年度浙江省自然科学奖一等奖等科研奖励。

  教育经历

  2000/08~2004/06，浙江大学，计算机科学与技术学院（计算机科学与技术专业），工学学士

  2004/08~2010/06

  ，浙江大学，计算机科学与技术学院（计算机科学与技术专业），工学博士（保送）

  研究经历

  2010~2012，美国加州大学圣芭芭拉分校，博士后研究

  2012~2013

  ，西北大学，研究员

  2014~2017，西北大学，教授、博士生导师

  2017~今

  ，西安电子科技大学，教授

  主要研究方向

  1.机器学习

  2.数据挖掘

  3.多媒体计算

