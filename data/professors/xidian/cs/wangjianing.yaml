bio_raw: '王佳宁，博士，现为西安电子科技大学计算机科学与技术学院副教授，硕士生导师，

  IEEE

  会员、

  CCF

  会员、

  CSIG

  会员。分别于

  2005

  年，

  2008

  年在兰州大学获得电子信息科学与技术学士、电路与系统专业硕士学位，于

  2016

  年获得西安电子科技大学电路与系统专业博士学位，曾就职于航天科技集团公司第四研究院与陕西教育学院，西安电子科技大学

  "

  智能感知与图像理解教育部重点实验室

  "

  成员，陕西省重点科技创新团队

  "

  深度学习与类脑智能创新团队

  "

  成员，西安市先进数据库技术重点实验室成员。

  西安电子科技大学校级优秀毕业设计指导教师，美国大学生数学建模竞赛

  M

  奖（一等奖）指导教师，全国高光谱卫星遥感影像智能处理与行业应用大赛三等奖指导教师，陕师院首批高层次人才，陕师院优秀实习指导教师，西安电子科技大学优秀导学团队指导教师。主要从事本科及研究生《人工智能》

  ,

  《模式识别》等课程的教学以及人工智能与图像处理领域的教学与科研工作，曾主持与参与各类纵向及横向研究课题十余项。现为

  IEEE Transactions on NNLS

  、

  IEEE Transactions on GRS

  、

  IEEE Transactions on IM

  、

  IEEE J-STARS

  、

  IEEE GRSL

  、

  Electronic Letters

  、

  Remote Sensing Letters

  等多个国际期刊审稿人，目前在国内外学术

  TOP

  期刊、会议和核心期刊上发表论文二十余篇，申请专利10余项，授权3项。现主要研究方向为图像处理算法及其系统设计、遥感及高光谱遥感的异常检测与分类系统设计、视频内容理解与分析、

  AI

  与轻量化深度学习嵌入式算法以及人工智能与模式识别算法应用研究。'
