  个人简介

  刘英帆，河南新郑人。分别于2011年和2014年在西安电子科技大学获得学士和硕士学位，于2019年在香港中文大学系统工程与工程管理系获得博士学位。2019年入职西安电子科技大学计算机科学与技术学院。于2023年8月-2024年1月在香港中文大学访问。是CCF会员、CCF数据库专委会执行委员。

  本人主要研究方向为向量数据库及其优化、高性能计算。在数据库和数据挖掘顶会SIGMOD、VLDB、ICDE、KDD、WWW和顶刊TODS等发表论文20多篇。

