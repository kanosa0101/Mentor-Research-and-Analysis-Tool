bio_raw: "个人简介\n/\nPersonal Profile\n个人简介：\n卢景月，讲师，2021年9月于西安电子科技大学获工学博士学位，深入参与“十三五”预研等课题，在IEEE\
  \ TGRS等核心期刊发表SCI论文6篇，EI论文3篇，研究方向为雷达成像技术、雷达系统软件等。\n隶属李青山教授团队，团队常年招收软件工程、电子信息等方向博士生、硕士生、以及学有余力的、本科实习生，欢迎加入。\n\
  学术论文：\n[1] Jingyue Lu;Lei Zhang;Yan Huang;Yunhe Cao, High-Resolution Forward-Looking\
  \ Multichannel SAR Imagery With Array Deviation Angle Calibration, IEEE Transactions\
  \ on Geoscience and Remote Sensing,IF 8.2,中科院一区.\n[2] Jingyue Lu;Lei Zhang;Yinghui\
  \ Quan;Zhichao Meng;Yunhe Cao, Parametric Azimuth-Variant Motion Compensation for\
  \ Forward-Looking Multichannel SAR Imagery, IEEE Transactions on Geoscience and\
  \ Remote Sensing,IF 8.2,中科院一区.\n[3] Jingyue Lu;Lei Zhang;Shaopeng Wei;Yachao Li,\
  \ Resolution Enhancement for Forwarding Looking Multi-Channel SAR Imagery With Exploiting\
  \ Space–Time Sparsity, IEEE Transactions on Geoscience and Remote Sensing,IF 8.2,中科院一区.\n\
  [4] Jingyue Lu;Xuhua Wang;Yan Ma;Lei Zhang;Yunhe Cao, 2-D Spatial Variation Bistatic\
  \ Forward-Looking SAR Imagery, IEEE Geoscience and Remote Sensing Letters, 中科院二区.\n\
  [5] Jingyue Lu;Lei Zhang;Pengfei Xie;Zhichao Meng;Yunhe Cao, High-Resolution Imaging\
  \ of Multi-Channel Forward-Looking Synthetic Aperture Radar Under Curve Trajectory,\
  \ IEEE ACCESS.\n[6] Jingyue Lu;Xuhua Wang;Yunhe Cao;Lei Zhang, Sparsity-Based Joint\
  \ Array Calibration and Ambiguity Resolving for Forward-Looking Multi-Channel SAR\
  \ Imagery, 一类贡献度.\n[7] 王宁; 贺鹏超; 卢景月*; 刘曦, 基于DOA估计的前视多通道SAR成像方法,系统工程与电子技术.\n[8] 卢景月;\
  \ 张磊; 孟智超; 盛佳恋, 曲线轨迹下前视多通道SAR解模糊成像算法,航空学报.\n[9] 卢景月; 张磊; 王冠勇, 前视多通道合成孔径雷达解模糊成像方法,电子与信息学报.\n\
  专利：\n[1] 卢景月，多通道SAR欺骗干扰鉴别与自适应抑制方法\n[2] 卢景月，一种阵列前视SAR成像方法\n教育经历\n[1] 2016.09-2021.09\n\
  西安电子科技大学 \n | 信号与信息处理\n  | 博士学位\n | 博士研究生毕业\n[2] 2012.09-2016.06\n中国海洋大学 \n | 信息与通信工程\n\
  \  | 学士学位\n | 大学本科毕业\n工作经历\n[1] 2021.10-2023.07\n西安电子科技大学\n                    \
  \     | 计算机科学与技术学院\n                        \n                        \n       \
