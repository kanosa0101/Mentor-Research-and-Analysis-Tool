bio_raw: '2005年于哈尔滨工业大学计算机科学与技术学院获得本科学位，并分别于2007年和2012年在新加坡南洋理工大学获得硕士和博士学位，主要研究方向包括数据挖据，保护隐私的数据查询和检索等。入选西安电子科技大学华山学者菁英人才计划，在社交网络的知识发现和挖掘、安全的数据查询等领域取得了较有影响的研究成果，相关成果发表在数据管理、数据挖掘领域顶级会议

  SIGMOD, SIGKDD, VLDB, ICDE, INFOCOM, EDBT, CIKM

  和期刊

  VLDB J, TKDE, TDSC, TIST, DMKD, JASIST

  上，曾获得2015年度

  ACM

  SIGMOD

  最佳论文奖

  提名。

  我的Google Scholar Profile'
