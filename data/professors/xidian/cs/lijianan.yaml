  邮件

  联系交流)

  研究生招生：

  目前隶属李青山教授团队，团队常年招收软件工程、电子信息等方向博士生、硕士生、以及学有余力的本科实习生。热诚欢迎有志于相关研究方向的优秀学生加入我们团队。

  本科实习生：

  诚挚欢迎对人工智能怀有浓厚兴趣，并有志于在该领域深耕钻研、探索前沿的本科生加入。

  招生要求：

  态度积极，扎实肯干，具备冲劲与内在驱动力。我作为一名青年教师，需要志同道合的同学并肩前行、共同成长。期待能在你求学和成长的路上提供支持，成为你向上攀登的一段阶梯。

  研究最新动态-进展：

  3/2/2026，论文Knowledge-empowered Course Recommendation with Cross-graph and Forgetting-aware
  Cross-attention被Applied Soft Computing接收；

  27/1/2026，论文SeeKRec: Towards Semantic-empowered Knowledge-aware Recommendation被DASFAA
