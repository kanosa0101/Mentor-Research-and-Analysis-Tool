bio_raw: '个人简介

  Personal Profile

  个人简介：

  李佳楠，西安电子科技大学计算机科学与技术学院副教授，工学博士。2013年6月于郑州大学获学士学位。2016年6月于西安电子科技大学获硕士学位。2021年6月于西安电子科技大学获博士学位

  （导师：石光明教授）

  。现任教于西安电子科技大学，计算机科学与技术学院软件工程系。

  科学研究：

  本人面向国家人工智能方向的需求，长期从事多模态信息智能处理的理论和应用研究工作。主要研究方向包括图像及视频理解，行为识别，智能推荐等方面的工作。近年来，在多个国际知名学术期刊及会议 NeurIPS, ACMMM, IEEE-TCSVT,
  PR等发表多篇高水平学术论文。先后参与科技部重点研发计划、国家自然科学基金、陕西省重点研发计划等多项'
