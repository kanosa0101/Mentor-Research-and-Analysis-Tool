  个人简介

  个人简介

  王琨（男），西安电子科技大学计算机学院副教授。先后在1996、2001、2006年于西安电子科技大学计算机学院获得工学学士、工学硕士、工学博士学位。任陕西省信息安全标准化技术委员会（SX/TC
  61003）委员。在国际国内专业期刊和会议发票论文30余篇，其中EI检索20余篇，SCI检索3篇，合作编写教材3部，被授予国家专利10余份。

  研究方向

  近年主要研究方向为传感器网络，大数据分析，网络与信息系统安全。

