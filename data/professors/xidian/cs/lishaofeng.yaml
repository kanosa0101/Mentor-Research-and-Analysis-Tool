bio_raw: '个人简介

  Personal Profile

  李少峰，博士，讲师，华山准聘副教授，硕士研究生导师。主要研究方向为系统软件、存储系统、形式化验证、智能算法的行业落地。师从杨孟飞院士，参与了多项国家重大工程项目，2022年6月获得博士学位后留校工作。在相关领域主流期刊和学术会议发表论文10余篇，主持多项'
