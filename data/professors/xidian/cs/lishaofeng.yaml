  个人简介

  Personal Profile

  李少峰，博士，讲师，华山准聘副教授，硕士研究生导师。主要研究方向为系统软件、存储系统、形式化验证、智能算法的行业落地。师从杨孟飞院士，参与了多项国家重大工程项目，2022年6月获得博士学位后留校工作。在相关领域主流期刊和学术会议发表论文10余篇，主持多项科研项目，团队经费充足，可以支持学生展开科学研究。

  目前担任学校创新创业学院下的科技创新俱乐部“嵌入视界俱乐部”的负责人，网址：

  嵌入视界俱乐部-西安电子科技大学创新创业学院

  ，欢迎对嵌入式设备、智能设备等相关领域感兴趣的学生，要有创新精神，有新奇想法，有较强的动手实践能力。并且愿意接触嵌入式技术的开发的同学加入。

  同时也欢迎想要提前开展科研学习的本科同学与我联系，提前进入本人的实验团队进行学习。

