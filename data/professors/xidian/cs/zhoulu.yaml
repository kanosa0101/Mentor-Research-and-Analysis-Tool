bio_raw: '个人简介

  Personal Profile

  周路，西安电子科技大学副教授（华山学者菁英副教授），博士生导师，省级青年人才。本科毕业于四川大学，2022年博士毕业于上海交通大学（导师：朱浩瑾教授）。博士期间曾赴加拿大滑铁卢大学和日本室兰工业大学交流学习，师从Xuemin
  (Sherman) Shen教授和Mianxiong Dong教授。

  研究方向为物联网安全与隐私保护（包括合规分析/异常检测/隐私保护），在该领域发表论文30余篇，其中CCF-A类会议/期刊13篇，包括USENIX Security、ACM
  CCS、ACM ASE、IEEE INFOCOM、WWW、ACM UIST、IEEE TDSC、IEEE TIFS、IEEE TON等。申请/授权发明专利10余项。获得“EAI
  SecureComm 2022 Best Paper Award”、“IEEE INFOCOM 2023 Best Poster Award”等奖励。指导学生获第四届中国研究生网络安全创新大赛二等奖。

  负责国家自然科学基金青年项目、科技部重点研发计划（子课题）、陕西省“校招共用”引才用才专项等项目。

  招生信息

  欢迎对网络安全与隐私保护方向感兴趣的研究生/本科生加入

