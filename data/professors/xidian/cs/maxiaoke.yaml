title: 教授
supervisor: 博导、硕导
bio_raw: '马小科，国家级青年人才、省部级人才入选者，华山学者特聘教授，博士生导师、硕士生导师，九三学社社员，分别于2005年、2008年和2012年获得信息与计算科学理学学士、计算机软件与理论工学硕士、计算机应用技术工学博士学位。2015年全职回国工作，2016年破格副教授，2017年被遴选为硕士生导师，2018年被遴选为博士生导师，2019年破格教授。

  2019年7月 -- 至今               西安电子科技大学，  教   授（年限破格）

  2016年7月 -- 2019年6月     西安电子科技大学，  副教授（年限破格）

  2015年6月 -- 2016年6月     西安电子科技大学，  讲  师

  2012年4月 -- 2015年5月     爱荷华大学(美国)，   博士后

  2008年8月 -- 2012年3月     西安电子科技大学，  博   士

  从事数据挖掘、机器学习、医学影像处理、生物信息学等领域的研究工作。在国际期刊 Science Immunology (Science大子刊)、Cell Stem
  Cell（Cell 大子刊）、PNAS、Genome Biology、Genome Medicine、Nature Communications、IEEE TPAMI、IEEE
  TKDE等发表SCI论文100多篇，CNS子刊4篇，中科院一区/CCF A类期刊论文50余篇，IEEE/ ACM 会刊35篇，ESI高被引论文8篇，单篇最高影响因子23.96。Google
  Scholar统计引用4000余次，其中SCI引用2000多次，被美国科学院院士、图灵奖获得者引用与积极评价，被Physics Reports(影响因子：23.8)、Nature
  Review Genetics(影响因子:42.2) 长篇引用。申请国家专利30件，授权19件，登记软件著作权16件。担任IEEE PAMI、TKDE 等10多个国际期刊的审稿人、CCF生物信息学专委会委员、CCF医学数据挖掘专委会委员、人工智能学会青年工作委员会委员、陕西省计算机教育学会理事、《CBM》等多个国际期刊编委等职务。

  主持国家科技重大专项课题、国家自然科学基金重点项目(联合主持)、国家自然科学基金面上项目、青年基金、陕西省杰出青年基金、陕西省重点研发、省市自然科学基金等项目20余项，参与国家自然科学基金重大、重点项目3项，获吴文俊人工智能自然科学二等奖一项、中国电子学会自然科学二等奖一项、陕西高等学校科学技术研究优秀成果奖一等奖两项、陕西省优秀博士毕业论文奖等奖项，入选首届华山学者菁英人才计划、全球前2%顶级科学家榜单。在教学方面，获得陕西省教学成果特等奖一项、校本科教学优质奖多项。

  #2026年度实验室剩余1名博士生名额，5名统招硕士名额（本部指标），欢迎报考！'
