bio_raw: '计算机拔尖班负责人。

  计算机科学系党支部书记，系主任。

  中国计算机学会CCF杰出会员，中国人工智能学会会员。

  西安电子科技大学计算机学院工学学士、工学硕士、工学博士。

  美国University of Texas at Dallas公派访问学者。

  主持国家自然科学基金面上项目2项，陕西省重点研发计划项目3项，西安市科技计划项目1项，北京控制工程研究所(502所)项目2项，华为鲲鹏众智计划项目3项，中央高校基本科研业务费资助项目3项，软件工程国家重点实验室开放基金1项，教育部教学项目4项。在国内、国际刊物与学术会议上发表SCI/EI检索学术论文40余篇。'
