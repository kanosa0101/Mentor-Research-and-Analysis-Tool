bio_raw: '西安电子科技大学计算机科学与技术学院副教授、硕士生导师。先后于西安电子科技大学机电工程专业、计算机软件与理论、计算机应用技术获学士、硕士和博士学位。曾在同济大学电子与信息工程学院计算机科学与技术博士后流动站学习和研究两年，在美国德州大学休斯敦健康科学研究中心访问研究一年。中国计算机学会会员，生物信息学专业委员会委员。

  ICIBM2018

  和

  ICIBM20

  20

  会议程序委员会委员

  (PC Member)

  。

  在科研方面，主持国家自然科学基金青年项目、博士后基金项目、陕西省自然科学基金项目和企业软件研发项目，参与国家自然科学基金重点项目、面上项目和多项工业软件研发项目。在

  Bioinformatics

  、

  Scientific Reports

  、

  IEEE-ACM Transactions on Computational Biology and Bioinformatics

  （

  TCBB

  ）、

  BMC Bioinformatics

  、

  BMC Medical Genomics

  等知名国际期刊发表十多篇

  SCI

  论文。

