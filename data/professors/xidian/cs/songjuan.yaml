  研究方向

  智能图像/视频压缩、基于深度学习的图像处理技术（deep learning）

  图神经网络（Graph neural network）、

  工作单位

  西安电子科技大学嵌入式技术与视觉处理研究中心（

  XDU-ETVP

  ），成立于2015年10月。研究中心依托于原西电软件学院大数据技术和嵌入式系统实验室基础成立，重点关注嵌入式技术与机器视觉、环境感知与场景理解、即时定位与地图构建、深度学习、手势/手语识别、医学图像处理等热点研究方向。

  2016年11月，本研究中心团队获西安电子科技大学首届“三好三有”研究生导学团队荣誉称号，是全校范围内“师德师风好”、“师生关系好”、“培养模式好”、“有先进文化”、“有出色管理”、“有突出业绩”的6个团队之一。

  个人简介

  宋娟

  ，博士，女，

  现任西安电子科技大学计算机科学与技术学院 副教授、硕导

  。

  2012年3月毕业于西安电子科技大学，取得通信与信息系统博士学位。目前任职于西安电子科技大学计算机科学与技术学院，智能软件与系统新技术研究所，从事图像处理与深度学习相关的研究工作。

