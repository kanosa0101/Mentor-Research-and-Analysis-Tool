bio_raw: '李广鑫，男，西安电子科技大学计算机学院副教授、硕士生导师，智能媒体与数据工程研究所副所长。

  最高学历为计算机应用技术博士 ，现为CCF会员、Yocsef西安AC委员，陕西省、西安市政府信息化建设咨询专家。

  当前研究方向包括（

  1

  ）网络与多媒体：重点研究网络、图像及多媒体数据处理及管理中的关键技术与应用系统；（

  2

  ）三维图形技术与虚拟

  现实：重点研究复杂三维图形数据处理技术、三维建模及渲染的关键技术与应用系统。

  2005

  年博士毕业留校任教，

  2016

  年

  -2018

  年以公派访问学者身份到俄克拉荷马州立大学访问。

  先后主持了近30

  项课题，

  其中包括国家重大专项、

  国家重点研发计划、

  重大专项子课题及国家相关部门'
