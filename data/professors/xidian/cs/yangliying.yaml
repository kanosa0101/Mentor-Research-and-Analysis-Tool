bio_raw: '个人简介

  Personal Profile

  杨利英，

  西安电子科技大学计算机科学与技术学院，教授，博士生导师，硕士生导师。

  2005年

  在西安交通大学电子与信息工程学院获得博士学位。2012年至2013年在美国德州大学MD Anderson癌症中心访学一年。2005年开始，在西安电子科技大学从事教学和科研工作至今。

  主要从事机器学习与模式识别、脑机接口集成电路与智能系统、生物信息学等领域的研究工作。在IEEE TCBB、Microelectronics Journal、BMC
  Bioinformatics、IEEE  BIBM等国际期刊和会议上发表多篇学术论文。主持和参与国家自然科学基金面上项目、

  科技部重点研发计划课题项目、

  国家自然科学基金重大仪器项目

  、

  陕西省自然科学基金面上项目等多个项目。'
