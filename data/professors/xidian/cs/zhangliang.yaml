  实验室简介

  西安电子科技大学嵌入式技术与视觉处理研究中心

  Embedded Technology and Visual

  Processing

  Research Center

  ​​​

  , Xidian Univ.

  西安电子科技大学嵌入式技术与视觉处理研究中心（XDU-ETVP），成立于2015年10月。研究中心依托于原西电软件学院大数据技术和嵌入式系统实验室基础成立，重点关注深度学习技术、人机自然交互技术、机器人复杂场景中环境感知与场景理解、深度网络可解释性等热点研究方向。

  研究中心目前教授副教授6人、兼职教授5人，具有博士硕士研究生60余人，同国内外知名研究机构帝国理工大学、慕尼黑工业大学、UCLA、清华大学、北京大学、国防科技大学、浙江大学等形成了深入的合作关系。团队已经毕业研究生200余名，主要在各大互联网企业及国家重点研究机构，多名同学赴国内外知名研究机构进行博士深造。

  2016年12月，

  实验室获得

  西安电子科技大学首届“三好三有”导学团队荣誉称号

  （全校仅6支)；

  2026.07.11,恭喜实验室论文“

  Knowledge-guided Disentanglement with Atomic Actions for Action Recognition

  ”和“

  Look Clearly Before Answering: Mitigating Hallucinations in Large Vision-Language
  Models via Saliency-Driven Perceptual Realignment

  ”被ACMMM 2026接收，祝贺吴天赐和陈鹏旭博士。

  2026.06.18,恭喜实验室论文“Bridging Vision and Language Concepts through Optimal Transport
  Semantic Flow

  ”被ECCV 2026接收，祝贺张晨洋博士（Spotlight论文，祝贺）。

  2026.06.08,恭喜实验室两篇CVPR论文“

  SkeletonContext: Skeleton-side Context Prompt Learning for Zero-Shot Skeleton-based
  Action Recognition

  ”和“

  Breaking Smooth-Motion Assumptions: A UAV Benchmark for Multi-Object Tracking in
