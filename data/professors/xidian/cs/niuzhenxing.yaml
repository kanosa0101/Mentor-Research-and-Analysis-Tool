  Personal Profile

  牛振兴，西安电子科技大学，教授，博导，西安电子科技大学华山学者特聘教授。

  于2012年获得智能系统与模式识别博士学位（导师高新波教授）；2011~2012年在微软亚洲研究院华刚博士组做Research Intern；2013~2014年在美国德克萨斯大学田奇教授课题组做访问学者；2017-2021年在阿里巴巴达摩院工作，任机器智能实验视觉团队技术负责人（高级算法专家）。

  长期从事计算机视觉与机器学习研究，任计算机视觉国际顶级会议CVPR、ICCV领域主席（Area Chair）。在重要期刊TPAMI、TIP和顶级会议CVPR、ICCV、ECCV、AAAI发表50余篇论文。

  个人主页： https://sites.google.com/site/zhenxingniu007/

