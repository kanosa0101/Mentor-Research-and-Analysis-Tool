  个人简介

  王倩茹，博士，华山菁英副教授，分别于2016年7月、2018年6月和2022年12月获得西北工业大学学士、硕士和博士学位，于2019年11月至2021年4月在亚利桑那州立大学交流访学。主要

  研究方向为城市计算、时空数据挖掘，云边端数据融合。相关研究成果发表在UbiComp、

  CSCW、ICDE

  、

  IoT-J、

  TKDD

  、

  ECML/PKDD、ICASSP

  等高水平期刊和会议上。获得“香江学者”、CCF普适计算专委会优秀博士学位论文激励计划，主持国家自然科学基金青年项目。

  ==NEWS==

  ~~ One paper on LLM

  exploration and generalization has been accepted to IEEE ICASSP 2026 (

  CCF B

  )

  ~~ One paper on UAV collaboration

  has been accepted to IEEE TMC (

  CCF A

  )

  ~~ One paper on Federated Learning

  has been accepted to ACM MobiCom Workshop 2025 (

