bio_raw: '个人简介

  Personal Profile

  西安电子科技大学计算机科学与技术学院副教授、硕士生导师。

  2008

  年在西安电子科技大学获密码学博士学位。

  2017

  年12月至

  2019

  年3月作为国家公派访问学者赴英国埃克塞特大学从事访问研究。现任计算机工程系系主任，是

  CCF

  会员、

  IEEE Member

  。近期的主要研究方向包括高性能分布式计算、空间大数据管理、信息安全与隐私保护和嵌入式系统设计。主持或参与过重大专项子项目、国家自然科学基金项目、重点实验室开放课题项目。现主持重大专项课题一项，横向项目多项。曾获西安市科技进步二等奖、军内科研二等奖、测绘科技进步奖、校科技成果奖、校级优秀教师等奖项，多次被毕业生评为“我最感谢的大学老师”。多项研究成果已经产品化，作为主要完成人研发的大幅面地图扫描仪在全国

  20

  多个地区得到了应用

  。'
