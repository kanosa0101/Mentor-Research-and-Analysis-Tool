  个人简介

  Personal Profile

  2006年3月进入西安电子科技大学计算机学院工作。

  2009年3月获得计算机应用技术博士学位，长期研究方向为数据挖掘与分布式计算，以及基于此衍生的相关领域。

  近5年内累计主持科技部国家科技支撑计划课题1项，校内基本科研业务费课题1项、企业合作课题1项，并作为核心研究人员参与2项国家自然科学基金项目、1项国家科技支撑计划课题、1项陕西省13115项目。其中“分布式数据挖掘优化”国家自然科学基金项目获得陕西高等学校科学技术奖二等奖，所在科研团队获得本研究方向国家发明专利申请1项和软件著作权8项。在本研究方向国内外刊物及国际会议累计发表SCI及EI检索的学术论文20余篇。

  承担计算机学院 “程序设计基础” 公共基础课（CS1121905）、“软件工程”专业课（CS3121912）、“网络故障诊断”专业课（CS4221076）课程主讲教学，并担任软件工程课程组组长。

