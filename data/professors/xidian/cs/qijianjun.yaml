bio_raw: '个人简介

  Personal Profile

  对研究生的基本要求：做为研究生，首先要具备做人的基本素养；其次不能浮躁，要能静下心学习，专心科研工作。

  1993年西北大学计算机系本科毕业，获学士学位；1996年西北大学计算机系研究生毕业，获硕士学位；2005年西安交通大学电子与信息工程学院计算机系研究生毕业，获博士学位。1996年硕士毕业后在IT企业工作多年；2005年博士毕业后在西安电子科技大学计算机科学与技术学院工作至今，期间

  曾在加拿大里贾那大学进行访问研究。主要研究方向为概念格与三支决策的理论及应用、智能数据分析与算法。结合形式概念分析与三支决策理论，提出了三支概念分析理论，系统分析了三支概念格与经典概念格之间的关系。

  近年来发表学术论文20余篇，其中ESI高被引论文2篇；出版专著2部。'
