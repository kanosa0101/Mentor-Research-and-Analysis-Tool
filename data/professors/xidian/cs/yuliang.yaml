bio_raw: '个人简介

  Personal Profile

  鱼亮，女，博导、博士，西安电子科技大学计算机科学与技术学院 教授，陕西省杰青。任西安市计算生物信息学重点实验室副主任、生物信息学与人工生命专业委员会常务委员、CCF生物信息学专业组委员会委员、陕西省生物信息学学会秘书长。多年来一直从事计算生物信息学、数据挖掘方面的研究工作。入选2025年“全球前2%顶尖科学家榜单”。目前在“计算生物信息学研究所”从事的工作具体包括：利用图论、机器学习、数据挖掘等理论和方法进行生物数据的分析，如发现新的生物功能模块、预测新的药物靶标，以及利用计算的方法预测老药新的功能、设计新药物分子等，为疾病提供新的治疗手段。2019年获陕西省自然科学技术奖1项（第二完成人）。2013年获陕西省优秀博士学位论文奖。于2017年9月至2018年9在哈佛医学院
  Dana Farber 癌症中心的Marc Vidal教授实验室进行为期一年的访问交流和合作研究。主持国家自然科学基金面上项目四项、青年基金项目一项，陕西省杰出青年基金项目；作为主要成员参与两项国家自然科学基金重点项目、一项国家自然基金重大研究计划项目，一项科技部重点研发计划。以唯一第一作者或者通讯作者发表在生物信息学重要国际期刊《Science
  Advances》、《Advanced Science》、《BMC Biology》、《Research》、《Plos Computational Biology》、《Bioinformatics》、《Briefings
  in bioinformatics》等60余篇论文被SCI 检索，8篇入选ESI高被引，多篇论文被《中国科学》、《计算机学报》等国内核心期刊收录。'
