  个人简介

  Personal Profile

  李瑞，博士，教授，博士生导师，西安电子科技大学计算机科学与技术学院（国家示范性软件学院）副院长，特色化示范性软件学院人才培养负责人，智能软件与系统新技术研究所副所长，西安市智能软件工程重点实验室副主任。中组部、团中央第20批援青博士服务团团长（挂职青海师范大学计算机学院副院长），

  青海省

  “

  昆仑英才

  ·

  高端创新创业人才

  ”

  计划领军人才，

  青海省专家人才联合会理事、副秘书长，CCF分布式计算与系统专委会委员。

  主要从事智能感知、物联网与智能化系统等方向的研究。主持包括国家重点研发计划课题、国家自然科学基金项目、青海省重点研发与转化计划项目、陕西省秦创原“科学家+工程师”队伍建设项目等科研项目20余项。担任国际会议程序委员会主席或委员20余次，在国内外主流学术期刊和会议上发表论文60余篇，公开/授权国家发明专利50余项。牵头制定团体/地方标准2项，参与制定国家标准2项。2019年获陕西高等学校科学技术奖一等奖。2021年获陕西省科技进步奖二等奖和陕西高等学校科学技术奖特等奖。

  教育经历'
