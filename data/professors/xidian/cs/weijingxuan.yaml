  个人简介

  Personal Profile

  西安电子科技大学计算机学院副教授。分别于2006年和2009年在西安电子科技大学获得应用数学硕士和博士学位。于2010年5月至2010年7月在澳大利亚南昆士兰大学做助理研究员，2010年10月至2011年10月在新西兰惠灵顿维多利亚大学做访问学者。研究方向：人工智能算法，智能计算，大数据处理等优化问题。曾获得陕西省科学技术二等奖（排名第二）和陕西省高等学校自然科学进步一等奖

  （排名第二）

  。主持国家自然科学基金1项，获得发明专利3项，发表学术论文30余篇，其中SCI检索十余篇篇。

