  刘成基

  ，男，西安电子科技大学计算机科学与技术学院华山准聘副教授，硕士生导师，工学博士。分别于2015年和2022年在西安电子科技大学获得学士和博士学位。2022年留校参加工作，现为计算机科学与技术学院软件工程系教师。近五年以第一作者在Optics
  Express等国际期刊发表SCI论文10余篇，主要研究方向为量子信息、AI机器学习与大模型技术、基于RISC-V+AI的扩展指令集及软件栈架构等。近年来与北京开源芯片研究院、

  中科院计算所、中科院软件所、

  阿里达摩院、恒远智能科技等研究单位和企业合作开展了相关研究工作，先后参与国家自然科学基金和陕西省重点研发计划等多项科研项目。

