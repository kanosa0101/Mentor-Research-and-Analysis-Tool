  个人简介

  Personal Profile

  主要从事计算机外部设备与嵌入式系统方面的科研与教学工作，主讲数字电路、模拟电路、嵌入式系统、单片机、微机原理等课程；参加和主持了九·五、十·五、十一·五期间计算机输入输出设备方面的预研项目，主持了某型设备的研制工作；获得科技进步二等奖、三等奖、测绘科技进步二等奖、西安市科技进步奖等多项科研奖励、多次获评西安电子科技大学优秀教师、师德先进个人等荣誉称号，多个项目获省级、校级教学成果奖；指导学生参加课外科技竞赛获得多个国家级奖项；发表研究论文10余篇。

