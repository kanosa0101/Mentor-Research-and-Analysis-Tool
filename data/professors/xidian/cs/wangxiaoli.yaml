title: 副教授
supervisor: 博导、硕导
bio_raw: '王晓丽，生于

  1987

  年，山东潍坊人。现为西安电子科技大学副教授、

  博士生导师

  、硕士生导师，任大数据基础理论与智能分析学科创新引智基地副主任，兼任计算机科学与技术学院中外合作办学项目联合管理委员会委员。担任国际期刊

  IEEE Transactions on Emerging Topics in Computational Intelligence

  (TETCI, 中科院II区)和国际期刊

  Expert Systems

  (SCI)

  的副主编

  。担任国际会议

  International Conference on Computational Intelligence and Security

  组委会主席（

  Organizing Committee Chair

  ）和分论坛主席（W

  orkshop Chair

  ），该会议已成功举办20余届，在人工智能与安全领域具有广泛影响力。获陕西省高校科协青年人才（2019）、昇腾众智星光奖（2022）和昇思杰出贡献导师奖（2024）。

  2014

  年本硕博毕业于西安电子科技大学。

  2016

  年和

  2025

  年作为国家公派访问学者赴新加坡国立大学和南洋理工大学从事研究工作。主讲《人工智能》和《算法分析与设计》两门核心课程十余年，斩获本科优质教学奖。截止2026年，累计培养研究生

  44

  人。研究方向聚焦人工智能、大数据分析与处理、云计算、边缘计算及大规模资源与任务调度等。代表性成果在《

  IEEE Transactions on Parallel and Distributed Systems

  》、《

  IEEE Transactions on Vehicular Technology

  》、《

  IEEE Transactions on Mobile Computing

  》、《

  Neurocomputing

  》、《

  Pattern Recognition

  》等国内外学术期刊以及国际会议上发表学术论文 60余篇。授权发明专利 8 项。作为项目负责人承担多项国家自然科学基金、陕西省重点研发计划，以及与华为、中电集团、铁科院、交大一附院等横向科研合作项目。'
