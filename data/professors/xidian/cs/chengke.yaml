  30

  余篇；授权国家发明专利

  10余

  项。

  ·

  主持了

  国家自然科学基金青年项目、

  陕西省自然科学基金青年项目等，核心参与了国家重点研发计划（战略性国际科技创新合作重点专项、网络空间安全治理专项）、国家自然科学基金

  重点国际

