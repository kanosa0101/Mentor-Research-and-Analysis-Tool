bio_raw: '个人简介

  Personal Profile

  程珂

  ，西安电子科技大学副教授，博士/硕士生导师，入选中国科协青年人才托举工程，担任开源密码社区openHiTLS首届技术委员会委员、中国中文信息学会大数据安全与隐私计算专委会委员、ACM
  CCS程序委员会委员等。隶属于西安电子科技大学

  马建峰教授

  、

  沈玉龙教授

  领导的陕西省网络与系统安全重点实验室、

  “

  网络与信息安全

  ”

  教育部创新团队。

  ·

  研究方向包括隐私保护大语言模型、密态数据安全计算等，

  在

  ACM CCS、

  I

  EEE INF

  OCOM

  、

  ESORICS

  、

  IEEE TIFS

  、

  IEEE TDSC

  、

  IEEE TC、

