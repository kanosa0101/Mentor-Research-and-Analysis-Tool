  个人简介

  杨力

  ，男，西安电子科技大学教授，博士生导师。计算机网络与信息安全国家级实验教学示范中心主任，西安市移动边缘计算及安全重点实验室副主任；科技委专项工程中心重点项目组专家，陕西省网络信息安全通报机制专家组成员，甘肃省网络空间安全专家指导委员会成员，中国计算机学会分布式计算与系统专委会委员。

  分别于2005年和2010年获硕士、博士学位，2013年-2014年美国弗吉尼亚理工大学访问博士后。主要研究方向包括移动互联网安全、云计算安全、移动终端安全、可信计算技术、智能系统安全等。作为“网络与信息安全关键技术”教育部“长江学者”创新团队骨干成员，主持和参与了国家自然科学基金项目、国家863计划项目、科技部重大专项、科技委基础加强计划重点基础研究项目、“十三五”计划项目、科技委科技创新特区项目（首批资助）等。

  在国内外重要学术期刊上发表SCI/EI检索论文50余篇；获得授权技术发明专利15项；获软件著作权8项；获教育部科学技术奖一等奖1项，陕西省科学技术奖一等奖1项，海南省科学技术进步奖一等奖1项，中国电子学会科学技术奖一等奖1项，获陕西省科学技术奖二等奖1项、中国通信标准化协会科学技术奖二等奖1项；获得陕西省教学成果一等奖2项。

  主要研究方向

  1.移动互联网安全--认证方法与技术 (Authentication for Mobile Internet)

  2.云计算安全--数据安全存储与删除（Security Storage and Deletion in Cloud Computing）

  3.移动终端安全--运行环境安全验证（Security Validation Environment for Mobile Device）

  4.可信计算--远程证明技术(Remote Attestation in Trusted Computing)

  5.网络攻防--攻击分析与智能安全

  (

  Attack Analysis and AI Security

  )

