bio_raw: '个人简介

  Personal Profile

  朱光明，男，博士，2015年3月毕业于浙江大学生物医学工程及仪器科学学院，取得仪器科学与技术学科工学博士学位。

  2015年4月入职西安电子科技大学软件学院，从事师资博士后研究工作。2017年4月师资博士后出站并留校工作，2018年7月晋升为副教授。

  目前任职于西安电子科技大学计算机科学与技术学院嵌入式技术与视觉处理研究中心，从事嵌入式系统与机器视觉、手势/手语识别等方面的教学和研究工作。

  教育经历：

  2009.09 ～ 2015.03   浙江大学，仪器科学与技术，博士学位

  Ph.D. in Instrument Science and Technology,

  Zhejiang University

  2005.09 ～ 2009.06   浙江大学，电子信息技术及仪器，学士学位

  Bachelor''s Degree in Electronic Information Technology and Instruments,

  Zhejiang University

  工作经历：

  2018.07 ～                 西安电子科技大学，计算机科学与技术学院，副教授

  Associate Professor in

  School of Computer Science and Technology,

  Xidian University

  2017.04 ～ 2018.07   西安电子科技大学，软件学院，讲师

  Lecturer in

  School of Software,

  Xidian University

  2015.04 ～ 2017.04   西安电子科技大学，软件学院，博士后

  P

  ostdoctor in

  School of Software,

  Xidian University

  学术团体任职：

  IEEE 会员、中国计算机学会（CCF）会员

  Signal Processing : Image Communication，审稿人，SCI，III区期刊

  ICCV2017 审稿人，A 类国际会议，计算机视觉领域顶会，优秀审稿人（

  Outstanding Reviewer

