  个人简介

  Personal Profile

  博士生导师、陕西省杰出青年科学基金获得者，工程研究院特约研究员，计算机工程系副主任，外部设备研究所副所长，校欧美同学会-留学人员联谊会理事，英国利兹大学访问学者。中国通信学会高级会员、中国计算机学会高级会员，首批“CCF嵌入式系统青年科技人才激励计划”入选者。

  主要研究方向为嵌入式智能计算、智能人机交互，主持包括国家自然科学基金、慧眼项目、陕西省重点研发重点产业链（群）项目等二十余项，在TPDS、TCAD、TIM、IoTJ、JSA、Esweek等著名期刊会议上发表研究论文50余篇。成果应用于航天领域，研制了新型星载微云计算系统，打破了传统“一星一平台”定制化研发模式，实现星上“功能机”向“智能机”跃变，较好的支撑了星网二代、国网星座等国家重大战略工程。先后获国防科技进步、中国电子学会科技进步等奖励6项。

