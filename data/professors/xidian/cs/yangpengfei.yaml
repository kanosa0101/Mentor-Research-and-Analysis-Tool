  https://baijiahao.baidu.com/s?id=1743419995320938390&wfr=spider&for=pc

  第八届“互联网+”大赛省银项目指导教师：

  关于对第八届中国国际“互联网+”大学生创新创业大赛陕西赛区省级复赛拟获银奖和铜奖项目名单进行公示的公告

