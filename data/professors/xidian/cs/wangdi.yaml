  个人简介

  王笛，教授、博士生导师。主要研究方向为多模态认知计算、计算机视觉、具身智能。以第一或通信作者在顶级期刊会议如TPAMI、TIP、TIFS、CVPR、ICCV、SIGIR等发表论文80余篇，主持包括国家自然科学基金面上项目、新一代人工智能国家科技重大专项子课题、陕西省杰出青年科学基金、中国博士后科学基金特别资助等项目，以及多项军工重大、重点项目子课题。获得陕西省科学技术进步奖一等奖、高等学校科学研究优秀成果奖技术发明二等奖、陕西高等学校科学技术研究优秀成果奖特等奖、陕西省自然科学优秀学术论文奖二等奖、中国图象图形学学会优秀博士学位论文奖等。

  个人详情请参考个人主页：

  https://web.xidian.edu.cn/wangdi/index.html

  目前关注的研究方向：

  （1）

  面向四足移动操作的具身决策与运动协同

  ：聚焦四足机器人在非平坦地形下移动基座与操作臂的协同控制问题，研究内容包括：全地形步态规划与动态姿态控制、VLA驱动的机械臂操作理解与执行、基座-手臂联合规划与自适应协调。

  （2）

  空地异构协同任务规划与决策

  ：聚焦无人机与四足机器人在异构感知视野下的协同感知与决策问题，研究内容包括：多模态感知融合、跨域资源调度、动态环境下的任务理解与行为决策、面向操作场景的具身问答。

  （3）

  遥感智能解译

  ：聚焦遥感图像中复杂场景下的多层级视觉解译问题，研究内容包括：多源遥感数据融合与地物分类、SAR/红外-可见光异构目标检测、遥感视觉语言跨模态理解与定位、及面向遥感场景的对抗攻防与模型鲁棒性评估。

  招生说明：

  2027年度本部计科学硕、本部计科专硕、杭研院计算机技术有招生指标，欢迎保研和考研同学联系。长期招收西电本校本科实习生，欢迎联系。

  实习说明：

  学生满足毕业基本要求后，可以在第二学年6-8月开展为期3个月的实习，导师予以积极支持。往年实习情况（以24级为例），算法岗：小米、蚂蚁、 淘天；开发岗：美团、滴滴、字节跳动、蚂蚁。

  就业去向：

  头部企业：字节跳动、拼多多、快手、小红书、高德、美团、华为、百度；

  科研院所：中电科54所、39所；

  央企国企：招商银行、农业银行、中国联通等；

  读博深造：伦敦大学、西安交通大学、中山大学、西安电子科技大学等。

