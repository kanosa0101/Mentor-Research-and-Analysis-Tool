bio_raw: 刘锦辉，副教授，硕士生导师，西安电子科技大学嵌入式计算技术研究所副所长，中国计算机学会（CCF）会员，CCF嵌入式系统专委会委员，CCF抗恶劣环境计算机专委会委员，美国匹兹堡大学（University
  of Pittsburgh）访问学者。主要研究方向为嵌入式系统结构，外设专用SoC处理器系统设计与应用技术，系统抗辐射加固仿真技术以及新型存算一体架构等，在国内外期刊发表论文十余篇，授权发明专利六项。主持国家自然科学基金、航空基金重点项目、陕西省重点研发计划项目、重点实验室基金等项目。
