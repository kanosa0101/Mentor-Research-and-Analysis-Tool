  Personal Profile

  宋胜利，博士、

  教授、博士生导师。

  中国计算机学会（CCF）杰出会员、软件工程专委会执行委员，中国指挥控制学会（CICC）高级会员、智能认知专委会委员，先后曾任软件工程系主任、计算机科学与技术学院副院长等职务。2006年在西安交通大学计算机科学与技术专业获得硕士学位，2011年在西安电子科技大学计算机科学与技术专业获得博士学位。在知识驱动的认知计算、自然语言处理、大语言模型及应用等领域开展研究工作。先后承担国家级科技创新项目和陕西省重大科技专项等省部级科研项目三十余项，与中电28所、中航631所、中航618所、航天210所等科研院所开展了三十余项多联合研发项目，在AAAI、IJCAI、ECCV

  等国际会议

  Information Fusion、Knowledge-Based Systems、Expert System with Applications、Pattern
  Recognition等期刊发表了40余篇学术论文，授权国家发明专利20项，登记软件著作权4项。承担了软件工程学科专业多门核心课程的教学任务，包括系统分析与设计、面向对象程序设计等本科生课程和语义计算研究生课程。获得陕西省教学成果奖二等奖，西安电子科技大学教学成果奖一等奖、西安电子科技大学优质教学质量一等奖和教育部-IBM高校合作项目优秀奖、中国电子科技集团奖教金一等奖等多项奖励。

  研究生招生：1.

