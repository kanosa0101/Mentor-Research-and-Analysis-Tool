bio_raw: '个人简介

  Personal Profile

  宋胜利，博士、

  教授、博士生导师。

  中国计算机学会（CCF）杰出会员、软件工程专委会执行委员，中国指挥控制学会（CICC）高级会员、智能认知专委会委员，先后曾任软件工程系主任、计算机科学与技术学院副院长等职务。2006年在西安交通大学计算机科学与技术专业获得硕士学位，2011年在西安电子科技大学计算机科学与技术专业获得博士学位。在知识驱动的认知计算、自然语言处理、大语言模型及应用等领域开展研究工作。先后承担国家级科技创新项目和陕西省重大科技专项等省部级'
