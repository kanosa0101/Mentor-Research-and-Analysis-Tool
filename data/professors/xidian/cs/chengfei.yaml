  个人简介

  Personal Profile

  博士，讲师，2017年于西安电子科技大学计算机科学与技术专业获得博士学位，2020年12月至2022年12月赴德国慕尼黑工业大学开展高效神经网络计算研究工作。主要研究关注人工智能系统（MLSys）和神经网络加速等领域。主持国家级纵向课题1项，在AAAI、TCAD、ASP-DAC、PRCV等顶级会议或者权威期刊发表论文10余篇，申请专利2项，担任ICCV、AAAI、TODES、VLSI等会议或期刊的审稿人。

  招生说明

  欢迎具备主动学习意识、较强的责任心，对科研有浓厚兴趣的同学加入，具体招生要求如下：

  1. 具备积极主动的学习态度，接受科研探索中的不确定性与挫折；

  2. 具有较好的数学、编程、英文阅读与写作基础，对计算机系统、人工智能等相关方向有兴趣者优先。

  报考同学请按照如下方式发送邮件：

  1. 邮件主题：姓名-学校，邮件内附上个人简历、成绩单和成果证明等材料；

  2. 邮件发至chengfei@xidian.edu.cn。

  近期代表性论文

  1. SAMCL: Empowering SAM to Continually Learn from Dynamic Domains with Extreme
  Storage Efficiency. AAAI, 2026，通讯作者

  2. Jump-teaching: Combating Sample Selection Bias via Temporal Disagreement. AAAI,
  2026， 通讯作者

  3. Evolving Cache Schedules for Fast Diffusion Policy Inference. PRCV, 2026，通讯作者

  4. LightCL: Compact Continual Learning with Low Memory Footprint For Edge Device.
  ASP-DAC, 2025，通讯作者

  5. QANS: Toward quantized neural network adversarial noise suppression. TCAD, 2023，通讯作者

