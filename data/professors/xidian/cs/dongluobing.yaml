bio_raw: '个人简介

  Personal Profile

  董洛兵，男，博士生导师,

  1981

  年

  10

  月出生，

  2006

  年

  3

  月取得西安电子科技大学计算机软件与理论硕士学位并留校工作。

  2013

  年

  6

  月获得西安电子科技大学军事通信学博士学位。

  2017年8月至2017年9月，美国罗德岛大学访问。2017年11月至2018年11月，美国堵丁柱教授团队（德克萨斯大学达拉斯分校）访问。

  先后带领团队完成多项省部级重大课题。

  到目前为止，已发表

  SCI/EI

  检索论文

  10余

  篇。

  已授权发明专利

  8

  部。撰写教材专著

  1

  部。当前的主要研究方向为：动态网络下智能边缘计算迁移可靠性研究、海量数据集关联子集抽取方法研究等。

  代表作：

  （1）A Proactive Reliable Mechanism-Based Vehicular Fog Computing Network, IEEE Internet
  of Things Journal, 2020.（中科院一区）

  （2）Computation Offloading for Mobile-Edge Computing with Multi-user, ICDCS 2019.
  （CCF B）

  （3）Dependence-Aware Edge Intelligent Function Offloading for 6G-Based IoV, IEEE
  Transactions on Intelligent Transportation Systems, 2022. （中科院一区）

  （4）Reliability-Aware Offloading and Allocation in Multilevel Edge Computing System,
  IEEE Transactions on Reliability, 2021. （ ESI 高被引）

  （5）Speech corpora subset selection based on time-continuous utterances features,
  Journal of Combinatorial Optimization, 2019. （ ESI 高被引）

  （6）A semantic relatedness preserved subset extraction method for language corpora
  based on pseudo-Boolean optimization, Theoretical Computer Science, 2020.'
