  个人简介

  Personal Profile

  西电计科院副教授，航天小螺丝钉一枚。

  - 2016：电子科技大学，软件工程（本科）；

  - 2018：日本早稻田大学，计算机科学与技术（分布式操作系统），导师：小柳惠一；

  - 2022：航天五院502所，控制科学与工程博士（航天嵌入式系统），导师：杨孟飞。

  研究方向：

  嵌入式软件、芯片设计、操作系统、计算机理论。

  科研经历：

  - 参与我国第四代空间操作系统

  SpaceOS

  研发，负责架构设计与验证，已应用于嫦娥、天宫等重大航天工程；

  - 主持1项国家级纵向课题，9项产学研横向合作课题，参与3项国家级科研项目；

  - 研发工具平台已在航天型号产品中落地部署；

  - 成果发表于ASE、ACM MM、Information Fusion、软件学报等会议/期刊；

  - 毕业后加入田聪教授领衔的计算理论与技术研究所（ICTT），坚持“理论+工程”并重，聚焦航天软件可信保障。

  常年招收喜欢

  嵌入式软件、硬件方向

  并向往星辰大海的硕士与博士研究生，以及有余力的优秀本科生（参与实践有劳务费哟）。招生渠道有两个，分别是西安电子科技大学（西安）与航天五院502所（北京），欢迎联系！

  西电实验室剩余一个本部EDA工程硕士的名额，502所实验室剩余2个学术硕士名额。（2026.08.26）

  2026年保研工作正在开启，西电实验室有3个名额，502所实验室有3个名额。（2026.07.24）

  2025年保研工作已结束，所有名额已满。

