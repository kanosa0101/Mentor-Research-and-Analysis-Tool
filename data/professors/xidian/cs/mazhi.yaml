bio_raw: '个人简介

  Personal Profile

  西电计科院副教授，航天小螺丝钉一枚。

  - 2016：电子科技大学，软件工程（本科）；

  - 2018：日本早稻田大学，计算机科学与技术（分布式操作系统），导师：小柳惠一；

  - 2022：航天五院502所，控制科学与工程博士（航天嵌入式系统），导师：杨孟飞。

  研究方向：

  嵌入式软件、芯片设计、操作系统、计算机理论。

  科研经历：

  - 参与我国第四代空间操作系统

  SpaceOS

  研发，负责架构设计与验证，已应用于嫦娥、天宫等重大航天工程；

  - 主持1项国家级纵向课题，9项产学研横向合作课题，参与3项国家级'
