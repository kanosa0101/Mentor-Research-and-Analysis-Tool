bio_raw: '魏航，博士，

  华山菁英副教授

  。在中国科学技术大学计算机科学与技术学院获得硕士学位，在哈尔滨工业大学（深圳）计算机科学与技术学院获得博士学位。博士毕业后入职西安电子科技大学计算机科学与技术学院，并加入计算生物信息学研究所。主要研究领域为生物信息学、智能计算及其在生命健康数据的应用分析，

  从生物分子层面挖掘机体致病模式，推进疾病的病理和诊疗研究

  。

  在领域著名期刊/国际会议上发表论文30余篇，

  获得

  2022

  年

  ACM SIGBIO China

  分会优秀博士论文奖

  。

  主持国家自然科学青年基金、

  陕西省青年科学基金、

  中央高校基本科研业务费专项基金等。

  招生信息

  2026年还有

  1个专硕名额（计算机技术01方向）

  ，欢迎踏实、勤奋的同学报考

  ，全程用心带教，共同进步，有意向请邮箱联系。

  欢迎

  对

  人工智能及交叉学科

  感兴趣

  的本科同学进入课题组学习

  ，

  参与'
