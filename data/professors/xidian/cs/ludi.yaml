  个人简介

  就职于西安电子科技大学计算机科学与技术学院、博士、教授、博士生导师。

  社会兼职

  陕西省科技厅科技项目评审专家；

  陕西省密码专家委员会专家委员；

  西安市科技专家

  广东省高层次人才评审专家；

  西安市科协科技智库专家;

  CCF高级会员，IEEE Member

  主要研究方向

  可信计算、机密计算技术：主要研究嵌入式环境和通用平台下的可信计算技术及应用。包括：基于ARM TrustZone、ARM CCA、Intel SGX、Intel
  TDX、AMD SEV等可信执行环境技术的系统、程序、数据安全防护技术研究与应用；基于可信平台模块（TPM）的系统安全防护技术研究及应用；IoT、CPS环境下基于可信计算的协同安全防护关键技术研究等。

  数据库安全技术：主要研究面向数据库系统的安全防护技术，包括数据机密性、完整性、真实性保护方法；基于可信计算技术的数据库敏感操作安全防护方法；高效的密钥管理方法等。

  云计算、虚拟化技术及其安全问题。包括：云计算资源分配与调度以及该过程中的安全问题、虚拟化过程中的安全问题，云计算管理中的安全问题等。

  研究动态

  ● 恭喜团队成员：

  李熙源、张博、刘玉佳、张清文

  获得2025年“首届CIE全国RISC-V高水平创新及应用大赛”全国

  总决赛奖

  【2025-12-16】。

  ● 恭喜团队成员：

  吕超越、杨祥坤、孙梦娜

  获得2024年“松山湖杯”首届中国研究生开源操作系统大赛

  一等奖

  【2024-10-24】。

  本科实习生招募

  长期招募对嵌入式系统安全感兴趣并有一定嵌入式开发基础的本科生来本课题组实习。

  研究内容包括：

  基于可信计算技术的嵌入式环境系统完整性保护方法、数据安全关键技术

  要求：

  最好具有计算机安全先修知识和一定的嵌入式开发经验，对操作系统底层研究和编程有兴趣的同学。

