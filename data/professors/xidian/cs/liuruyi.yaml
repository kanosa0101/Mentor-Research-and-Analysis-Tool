  个人简介

  刘如意

  ，女，博士，副教授，

  博士生导师，硕士生导师

  ，电子信息现场勘验应用技术公安部重点实验室专家（西北五省第一个公安部重点实验室）。获

  ACM西安优博提名奖、ACM西安新星奖、陕西省计算机学会优秀青年专家、陕西省创新创业优秀博士后

  。

  CCF高级会员

  ，CSIG机器视觉专委会委员，陕西省计算机学会媒体计算专业委员会委员，《微电子学与计算机》期刊青年编辑委员会委员，2018年10月-2020年10月在西安电子科技大学电子科学与技术博士后流动站从事研究工作，主要从事计算机视觉、智慧教育等方面的研究。主持和参与

  国家自然科学基金（面上、青年）、科技创新2030

  、国家重点研发计划重点专项等科研项目10余项，近年来，在国际期刊和会议发表论文50余篇，获

  ICDIS 2022最佳学生论文奖和PRCV 2023最佳论文奖

  。担任CCF第六届大数据学术会议的出版副主席、第十七届全国嵌入式系统大会的财务主席、ChinaVis 2020网站主席、全国信息检索学术会议CCIR2020暑期学校主席。获

  第六届全国青年人工智能创新创业大会创新组一等奖、第十七届中国大学生服务外包创新创业大赛二等奖

  、

  第十四届中国大学生服务外包创新创业大赛一等奖

  、

  第十一届中国大学生服务外包创新创业大赛二等奖、

  中国大学生计算机设计大赛西北地区二等奖、

  2025年“数据要素×”大赛陕西分赛科技创新赛道一等奖、2024年“数据要素×”大赛陕西分赛科技创新赛道一等奖、第四届陕西省博士后创新创业大赛银奖

  ，获

  陕西省科技进步一等奖

  、

  陕西高等学校科学技术奖一等奖、

  陕西省计算机学会自然科学一等奖

  和西安市科学技术三等奖，获

  陕西省教学成果特等奖

  ，校级教学成果奖2项，

  校级优秀本科生导学团队

  。

  教育经历：

  2018年9月，西安电子科技大学  计算机科学与技术学院    计算机应用技术专业  工学博士   导师：苗启广教授；

  2012年7月，陕西师范大学   计算机科学学院   软件工程   学士；

  工作经历：

  2024.06.12 ~2026.06.12  西安电子科技大学, 经济与管理学院，副院长（挂职）；

  2023.07.01 ~至今    西安电子科技大学, 计算机科学与技术学院, 副教授；

  2020.11.01 ~2023.06.30  西安电子科技大学, 计算机科学与技术学院, 华山准聘副教授；

  2018.10.12～2020.10.12  西安电子科技大学  师资博士后，合作导师：公茂果教授；

  人才培养：

  1）祝贺

  刘义、吴俊红

  获得 2024 年

  研究生国家奖学金；

  2）祝贺

  卢文艺'
