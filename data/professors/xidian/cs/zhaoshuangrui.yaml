bio_raw: '个人简介

  Personal Profile

  赵双睿，西安电子科技大学计算机科学与技术学院副教授，博士生导师。依托陕西省网络与系统安全重点实验室，马建峰教授、沈玉龙教授领导的网络安全领域唯一的网络与信息安全教育部创新团队，

  专注

  智能无人网络安全、卫星互联网安全，主持领域内国家自然科学青年科学基金项目、陕西省重点研发计划，国家重点研发计划子课题等。相关成果发表论文 30 余篇，其中包括
  IEEE TIFS、IEEE TMC、IEEE TWC、IEEE INFOCOM 等 CCF A 类/中科院 I 区期刊会议 15篇，获 IEEE FCN 最佳论文奖，网络空间安全科学学报优秀论文奖；依托西电异地研究院，提出智能无人系统安全关键技术及应用，获青岛市科学技术进步一等奖(4/14)；指导学生获全国大学生软件创新大赛西北区一等奖、国际大学生创新大赛省银奖；申请专利
  40项，授权 12 项；以第二(2/25)、第三(3/25)完成人主导制定了《无人机集群物理层安全认证应用指南》《无人机集群区块链技术应用指南》网络安全领域两项团体标准；担任
  Electronics 客座编辑，IEEE NaNA、IEEE HPSR、IEEE Satnet 会议组委会委员、ACM PLAS 会议Publication
  Chair 等。相关成果已应用于多家公司、智慧园区的工业互联网，支撑非标设备智能工控数据的实时处理和园区业务子系统的整合处理。'
