bio_raw: '个人简介

  Personal Profile

  工学博士

  ，副教授

  ，硕士生导师，入选2022年陕西省科协青年人才托举计划，中国人工智能学会会员。近年来，主要从事智能模型测试、多源信息融合的研究，主持国家级项目1项，省部级项目3项，校级项目3项，并作为核心成员参与多项国家级、省级、横向合作项目，取得了一系列创新成果，以第一作者发表国际期刊论文9篇（中科院一区4篇，中科院二区2篇）、国际会议论文2篇，授权专利2项，完成2款应用软件，获陕西省自然科学二等奖1项。

  招生信息：

  欢迎对目标跟踪、深度学习、智能感知等研究方向感兴趣的同学加入。

  软件工程（学术学位：083500）、计算机技术（专业学位：085404）'
