  个人简介

  张涛，陕西西安人，副教授，博士，博士生导师

  2015年6月博士毕业于西安电子科技大学计算机系统结构专业；

  2015年7月起在西安电子科技大学计算机学院工作。

  主要研究方向

  1. 数据安全

  2. 隐私保护

  3. 联邦学习、大语言模型

  新闻通知

  长期招募对数据安全、大模型安全感兴趣的本科生来本课题组实习。

  2027年计划招收保研学生1名，从事大模型Agent安全相关研究工作。

  2026.04 硕士生 张超论文被ACL 2026（CCF A）接收。

  2026.03 硕士生 郭阳阳、杨林的2篇论文被KSEM 2026接收。

  2025.10 硕士生 王祥的论文被人工智能会议AAAI 2026（CCF A）接收。

