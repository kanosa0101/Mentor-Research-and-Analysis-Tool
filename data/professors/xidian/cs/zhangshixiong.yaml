  Shixiong Zhang is an Associate Professor in the School of Computer Science and Technology
  at Xidian University, starting in December 2020. He

  spent

  three years (2017-2020) obtaining his Ph.D. in Computer Science under the mentorship
  of

  Dr. Ka-Chun Wong

  from the

  City University of Hong Kong

  . He was previously a research trainee in the Lab of

  Prof. Jiang Qian

  at the

  Johns Hopkins University

  School of Medicine

  . His broad research interests include bioinformatics, computational biology, machine
  learning, and computational intelligence.

  E-mail: zhangsx AT xidian.edu.cn

