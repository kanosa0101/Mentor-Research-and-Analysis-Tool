  感谢各位同学厚爱！本部和杭研26推免名额已满，青岛研究院还有名额

  期待合作2027年博士研究生的同学联系，谢谢！

  本科实习生常年合作，有意向可随时联系

  王璐，副教授，博士生导师，校华山人才系列“菁英副教授”。

  2013年7月于西安电子科技大学获计算机科学与技术专业工学学位。同年9月，被保送为西安电子科技大学硕博连读生。2018年12月于西安电子科技大学获软件工程专业博士学位（导师：李青山教授），为该校设立软件工程专业以来第一批获得学位的博士生，2021年获陕西省优秀博士学位论文（校软件工程学科首篇，同年校1/10，院1/1）、校优秀博士学位论文。

  2019年起留校工作，现为计算机科学与技术学院软件工程系教师，智能软件与系统新技术研究所本硕博师联合第一党支部书记。2021年1月入选校“

  华山学者菁英人才计划

  ”

  ，受聘为

  菁英副教授，同年7月晋升副高职称。'
