bio_raw: '个人简介

  Personal Profile

  感谢各位同学厚爱！本部和杭研26推免名额已满，青岛研究院还有名额

  期待合作2027年博士研究生的同学联系，谢谢！

  本科实习生常年合作，有意向可随时联系

  王璐，副教授，博士生导师，校华山人才系列“菁英副教授”。

  2013年7月于西安电子科技大学获计算机科学与技术专业工学学位。同年9月，被保送为西安电子科技大学硕博连读生。2018年12月于西安电子科技大学获软件工程专业博士学位（导师：李青山教授），为该校设立软件工程专业以来第一批获得学位的博士生，2021年获陕西省优秀博士学位论文（校软件工程学科首篇，同年校1/10，院1/1）、校优秀博士学位论文。

  2019年起留校工作，现为计算机科学与技术学院软件工程系教师，智能软件与系统新技术研究所本硕博师联合第一党支部书记。2021年1月入选校“

  华山学者菁英人才计划

  ”

  ，受聘为

  菁英副教授，同年7月晋升副高职称。

  2022年入选陕西省科协“青年人才托举计划”（全省高校内1/100）。

  目前

  任中国计算机学会（CCF）软件工程专业委员会副秘书长、系统软件专委会执行委员、CCF首批传播大使、西安电子科技大学OpenHarmony高校技术俱乐部主任（欢迎加入俱乐部，提供更多对外扩展机会）、西安市智能软件工程重点实验室副主任

  ，担任软件学报（CCF A类）、Journal of Software: Evolution and Process（CCF B类）等软件工程领域期刊审稿人、ICSS等会议程序委员。

  所带领的ApeX Agent Lab（取在智能体时代到达顶峰之意）项目组，现有

  ：博士生5人，本部研究生20人，杭州研究院研究生6人，青岛研究院研究生2人，本科生31人（大一至大四）。

  主要招收：

  1.

  本部

  软件工程学科学术型

  博士研究生

  （每年1名左右）、计算机科学与技术学科及软件工程学科

  硕士研究生

  （每年3名左右）、电子信息领域

  硕士研究生

  （

  每年

  2名左右）

  、卓越工程师学院电子信息领域软件工程与人工智能方向研究生（每年5名左右）

  2.

  青岛研究院

  电子信息领域

  硕士研究生

  （

  每年

  2名左右）

  3.

  杭州研究院

  电子信息领域

  硕士研究生

  （每年4名左右）

  4.也特别欢迎

  本科生

  同学加入我们合作科研、参加竞赛或完成毕设！大一进组打基础，大二合作搞竞赛，大三一作发论文，大四毕设直接有，推免继续做科研，毕业准备早开展~（提供科研实习证明和推荐信）

  不过任何时间能一起进组合作都不晚，

  提供新人线上培训大礼包

  ，包括基础知识、科研技巧，并有高年级同学指导，

  一个月保证入门

  ，期待早日一起奋斗！

  目前致力于两个大领域，四个子方向研究工作：

  AI for SE（人工智能赋能下的软件工程）：

  1.

  微服务架构与云原生软件的智能运维

  ：云计算、面向大模型的NPU集群、昇腾与鲲鹏架构、OpenHarmony操作系统、OpenEuler操作系统

  ，开展软件故障分析与智能运维研究，实际企业合作项目支持

  （陕西移动、华为2012实验室合作，可直接办理实习证赴华为西研所现场参与工作，接受华为侧专家直接指导）

  2.

  AI Agent、大语言模型等AI融合软件测试：基于大模型的自动化测试技术、针对DNN和大模型软件的Fuzzing模糊测试技术等，

  实际企业合作项目支持

  （空军工程大学、中电28所合作）

  SE for AI（针对具有深度学习或大语言模型组件的AI融合软件，工程化问题研究）：

  3.边缘智能、端侧AI场景下的大语言模型轻量化与分布式推理：主要开展模型轻量化与推理加速研究，从模型层到硬件芯片层均有涉及

  （华为昇腾，此芯科技国产NPU，中航631所机载方向合作，与此芯科技在杭州研究院建有联合创新中心）

  4.

  深度学习系统、大语言模型安全可信：针对深度学习的对抗攻击、大模型和AI Agent系统评测、大模型运行时故障分析等

  （北京大学合作、华为云合作）

  近年来，在ICSE（CCF A类）、FSE（CCF A类）、ICSME（CCF B类）、SANER（CCF B类）、COMPSAC（CCF C类）、SEKE（CCF
  C类）、《软件学报》等软件工程、自主计算等领域的国内外权威期刊与顶级会议上，以第一/通讯作者身份发表论文40余篇。现主持国家自然科学基金面上项目一项、青年基金项目一项、国家部委项目子课题合作项目一项，陕西省自然科学基金项目一项、华为2012实验室合作项目一项、航天某研究院合作项目一项，中航工业某研究所合作项目一项，企业开放基金一项，国家点亮计划等合作校企项目三项，并作为核心负责人参加国家自然科学基金重点项目一项，重点研发计划项目一项。先后参与国家863计划重大项目、国家部委项目、国家自然科学基金面上项目等多项'
