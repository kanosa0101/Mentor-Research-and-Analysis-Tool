bio_raw: '个人简介

  Personal Profile

  基本信息：

  · 高熙越，博士，硕士生导师，副教授。

  教育及工作经历：

  · 2024年10月 ‑ 至今：Boston University、CAS、Visiting Scholar

  · 2021年01月 ‑ 至今：西安电子科技大学、计算机科学与技术学院、副教授、硕士生导师

  · 2014年09月 ‑ 2020年12月：武汉大学、计算机学院、通信与信息系统、硕博连读/博士

  · 2010年09月 ‑ 2014年06月：山东大学、电气工程学院、电气工程及其自动化、本科

  研究方向：

  ·

  数据库

  ：数据库模糊测试（Fuzzing）、数据库自治优化（Autonomy Optimization）、安全数据库（Security Database）。面向国产数据库在稳定性验证与自治优化方面的实际需求，融合模糊测试与人工智能等关键技术，研究数据库事务的模糊测试方法、自适应优化器机制，以及运行过程中的敏感数据保护策略，为提升国产数据库系统的可靠性、自主可控性和工程化部署能力提供支撑。

  ·

  数据挖掘

  ：图挖掘（Graph Mining）、人工智能（AI）。

  面向结构化与非结构化数据的复杂分析需求，融合图挖掘、深度学习等关键技术，研究异构图中的模式识别方法、结构感知的表示学习机制，以及与数据库系统协同的数据挖掘框架，进一步探索结构化知识在具身智能场景中的建模与推理策略，为智能数据管理与图数据驱动的应用提供技术支撑。

  学术研究方面，曾在VLDB、ACM MM、AAAI、ESWA、IPM、ICDM等国内外主流期刊和会议上发表论文20余篇，申请国家发明专利10余项。应邀担任AAAI、ICDM、TCSVT、CCS等期刊会议审稿人；在项目攻关方面，曾参与国家重点研发计划-社会安全信息服务和大数据应用关键技术研究的大数据平台研发工作，主持国自然青年基金及陕西省青年基金各1项，参与联合基金项目、面上项目3项。目前深度参与西电-浪潮数据库创新实验室的开源赋能项目和安全数据库技术研究项目中；在课程教学方面，本科课程包括普通班-数据库内核导论、拔尖班-多模数据库，是第二批国家级一流课程《多媒体数据处理》课程团队成员，也是首批虚拟教研室《国产数据库课程群虚拟教研室》的联系人。

  研究生招生：

  · 欢迎所有认真勤奋“有余力”的本科生提前进入实验室，参与科研、项目或比赛；

  · 欢迎所有正在寻找研究生导师的学生积极联系沟通。但由于邮件数量较多，可能无法一一回复，敬请谅解。'
