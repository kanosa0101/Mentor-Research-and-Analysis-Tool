  个人简介

  刘立芳，博士，教授，1995年和1998年在中国人民解放军装备学院分获学士和工学硕士学位，2006年西安电子科技大学获工学博士学位，同年9月进入智能感知与图像理解教育部重点实验室从事博士后科研工作，从事智能信息处理在生物信息学中的应用研究，2010年博士后出站；主持完成国家自然科学青年基金项目1项（No.60705004，项目期限：2008.01-2010.12），中央高校基本科研业务费项目1项（项目编号：721004494，项目期限：2010.11-2012.11），陕西省自然科学基金项目等多项科研项目。

  目前主要从事计算机网络与信息系统设计、智能计算与算法设计等科研和教学工作，2012年1月被国家留学基金委批准作为公派留学访问人员赴美国亚利桑那州立大学（Arizona
  State University, Tempe, AZ）的进化医学与信息学中心（Center for Evolutionary Medicine & Informatics)进行为期1年的访问交流（留学时间：2012年9月-2013年9月），与Sudhir
  Kumar教授(

  http://kumar.biodesign.asu.edu

  ) 开展生物信息数据处理相关的研究与合作．近年来，在Computers and Mathematics with Applications、Journal of
  Information Science and Engineering、Journal of Information and Computational Science、计算机学报、电子学报等期刊发表了40余篇文章，其中9篇论文被SCI索引、30余篇被EI索引。

  主要研究方向

  计算智能与网络优化；

  智能信息处理与模式识别；

  数据处理与故障诊断。

