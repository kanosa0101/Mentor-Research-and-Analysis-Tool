  个人简介

  Personal Profile

  孙赛赛，讲师，华山准聘副教授。2016年6月于河北工业大学获学士学位。2021年6月于南开大学获博士学位，期间

  经留学基金委资助，以国家公派联合培养博士生的身份赴多伦多大学交流学习16个月

  。2021年7月入职西安电子科技大学，计算机科学与技术学院。主要研究方向包括RNA结构和功能预测、RNA和小分子互作用预测、深度学习在生物信息学领域的应用等。近年来，在多个国际学术期刊上发表论文数篇，主持陕西省青年科学基金和国家自然科学青年基金，参与国家自然科学青年基金、面上基金、中央高校基本科研业务费专项基金等。每年招收1名硕士研究生，欢迎有意向的同学邮件咨询！

