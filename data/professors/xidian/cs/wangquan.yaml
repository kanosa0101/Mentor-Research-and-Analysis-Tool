  个人简介

  西安电子科技大学教授、副校长，教育部区块链技术应用与评测工程研究中心主任、陕西省人机交互与可穿戴计算重点实验室主任。兼任教育部教育信息化与教学方法创新指导委员会副秘书长；中国计算机学会杰出会员、嵌入式系统名誉主任；中国电子教育学会副理事长、高等教育分会会长；中国高等教育学会常务理事、创新创业分会副理事长，智能教育研究分会副理事长。

  主要研究方向为嵌入式系统与安全、人机交互与可穿戴计算、计算机输入输出系统等。在

  IEEE TPAMI、TKDE、TNNLS、TPDS、TIP、JSA、IJCAI等计算机旗舰期刊/会议上

  发表了一百多篇论文，

  授权国家发明专利20余项，

  先后获得省部级及以上教学科研成果奖励十余项。

  主要研究方向

  计算机输入输出技术与设备，嵌入式系统及安全，可穿戴设备，分布式实时仿真技术等。

