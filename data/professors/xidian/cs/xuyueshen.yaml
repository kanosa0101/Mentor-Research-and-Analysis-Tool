  ----------------------------------------------------------------------------------------------

  本人现在正在推进的研究问题：

  1．面向中台与后台的系统资源管理、系统服务运维及系统部署优化，包括面向微服务系统系统的资源调度/资源预测/中心部署/边缘部署/云边协同/缓存管理/工作流调度，面向微服务系统的故障检测/

  可观测性

  ，函数服务的资源调度等；

  2.  面向软件服务工程的移动与边缘计算，包括

  面向Restful API的服务发现、服务组合与语义标注、

  移动应用APK中的API分析、移动计算环境中的服务发现、选择与组合等；

  3. 云边端网络中的大模型协同推理与资源调度。

  ----------------------------------------------------------------------------------------------

  徐悦甡，计算机科学与技术学院，副教授，博士生导师/硕士生导师（软件工程学术博士、学术硕士与电子信息专业硕士），软件工程卓越班班主任，软件工程卓越2.0计划课程负责人，软件工程学科智能化软件工程方向秘书

  ，

  所在团队：智能软件与系统新技术研究所、西安市智能软件工程重点实验室（主任/所长：李青山教授，副主任/副所长：李瑞教授）

  本人一直从事

  软件系统运维、软件系统优化、云-网-边环境中的资源管理

  等方面的研究，在TSC(CCF-A)、FGCS(中科IITop)、IEEE TCSS(中科II)、IEEE IoT-J(中科I)、IEEE TITS(中科I)、IEEE
  TII(中科I)、IEEE TCCN(中科II), IEEE TETCI(中科II), IEEE TGCN, IEEE TVT (中科II)，IEEE TNSE(中科II)、Information
  Sciences(中科I)、Neurocomputing等国际期刊，在WWW(CCF-A)、ICSOC(CCF-B)、IEEE ICWS（CCF-B）、SIGKDD等国际会议上以第一或合作作者发表论文七十余篇。H-index:26,
  论文总被引用次数超过2800次，引用数高于50次以上的论文超过15篇。

  担任IEEE Transactions on Services Computing、Knowledge-based Systems、Journal of Network
  and Computing Application、Neurocomputing、《计算机学报》、《计算机应用》等期刊或会议的审稿人，担任ICDCS 2017/2018、ICWS、SCC、COLing、ICWS、SCC等国际会议的PC。中国计算机学会/CCF高级会员，CCF系统软件专委会委员、软件工程专委会委员，服务计算专委会委员与秘书处秘书。获2021
  CCF服务计算专委会服务贡献奖。

