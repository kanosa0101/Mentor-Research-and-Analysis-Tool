bio_raw: '个人简介

  Personal Profile

  李青洋，女，西安电子科技大学计算机科学与技术学院华山准聘副教授，硕士生导师。CCF普适计算专委会执行委员，2022年12月获西北工业大学计算机科学与技术工学博士学位，2019-2021年获国家留学基金委资助于澳大利亚新南威尔士大学进行联合培养。研究方向包括人机物融合感知计算、智能物联网、多智能体强化学习等。以第一作者身份在ACM
  UbiComp、IEEE TMC

  、

  IEEE IOT Journal、ACM TKDD、IEEE ICASSP等国际期刊与会议发表文章

  10余篇

  ，

  授权/申请

  发明专利8项。主持国家自然科学基金青年项目一项，陕西省青年基金一项。

  News

  2025.10 我们的论文“Human-Machine Hybrid Federated Learning: Concept and Applications”被IEEE
  IOT Journal （

  SCI二区期刊

  ）接收。

  2025.8 我们的论文“

  Efficient Hierarchical Quantization for

  Heterogeneous Devices in

  Cloud–Edge–Device Architecture”

  被IEEE IOT Journal （

  SCI二区期刊

  ）接收。

  2025.6 恭喜李泽轩（

  本人协助指导的硕士生

  ），我们的论文“Hierarchical Human-UAV Cooperative Task Allocation for Spatiotemporal Crowdsensing
  in Disaster Response”被ACM UbiComp 2026（

  CCF A类会议

  ）接收为研究长文。

  2025.3 我们的论文“FedHMIR: Unified Framework for Federated Human-Machine Synergy in Personalization-Generalization
  Balancing Identity Recognition”被IEEE TMC（

  CCF A类期刊

  ）接收。

  招生信息

  本人2026年还

  有1个专硕名额（计算机技术01方向），欢

  迎勤奋、踏实的同学一起探索成长，有意向请联系liqingyang@xidian.edu.cn'
