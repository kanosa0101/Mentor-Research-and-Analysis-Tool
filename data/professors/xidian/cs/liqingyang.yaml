  个人简介

  Personal Profile

  李青洋，女，西安电子科技大学计算机科学与技术学院华山准聘副教授，硕士生导师。CCF普适计算专委会执行委员，2022年12月获西北工业大学计算机科学与技术工学博士学位，2019-2021年获国家留学基金委资助于澳大利亚新南威尔士大学进行联合培养。研究方向包括人机物融合感知计算、智能物联网、多智能体强化学习等。以第一作者身份在ACM
  UbiComp、IEEE TMC

  、

  IEEE IOT Journal、ACM TKDD、IEEE ICASSP等国际期刊与会议发表文章

  10余篇

  ，

  授权/申请

  发明专利8项。主持国家自然科学基金青年项目一项，陕西省青年基金一项。

