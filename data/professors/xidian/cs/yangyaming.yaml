  个人简介

  杨亚明，博士，副教授，硕士研究生导师。主要研究方向是图数据的表示学习与知识挖掘技术，获得陕西省自然科学一等奖，陕西省优秀博士学位论文。主持国家自然科学基金面上项目/青年项目、陕西省重点研发计划项目等。在IEEE
  TKDE、NeurIPS、ICML、ACM SIGKDD、ACM WWW、IEEE ICDE、AAAI等CCF A类期刊/会议发表学术论文，其中两篇一作IEEE
  TKDE论文入选ESI高被引论文，多项研究成果应用于阿里巴巴旗下的淘宝广告搜索平台并提升了平台效益。长期担任IEEE TPAMI、IEEE TKDE、NeurIPS、ICML、AAAI、ACM
  SIGKDD、ACM SIGIR、ACM WWW、ACM MM等CCF A类期刊/会议的审稿人。

  科研项目

  [1] 国家自然科学基金面上项目，2027，主持

  [2] 国家自然科学基金青年项目，2024，主持

  [3] 陕西省重点研发计划项目，2025，主持

  课程教学

  [1] 本科生课程《线性代数》，通识教育基础课，48学时/学年

  [2] 本科生课程《班级指导》，计科2303012班班主任，16学时/学期

  荣誉奖励

  [1] 陕西省自然科学一等奖（4/6），2024

  [2] 陕西省优秀博士学位论文，2025

