  个人简介

  基本简介

  副教授，计算机学院，西安电子科技大学，2011年6月获得西安电子科技大学计算机应用技术专业博士学位，博士论文题目《Simulation of Genomic Variants
  and Identification of Genomic Patterns》。2009.10-2010.10，美国弗吉尼亚理工大学CBIL实验室博士联合培养。

  研究兴趣

  将

  计算机技术

  应用于分析

  生物分子数据

  ，以揭示生物分子数据的内涵。具体来说：

  1.综合（/设计）机器学习算法、概率论方法、统计检验方法等检测或识别DNA基因组中变异位点或片段，以发现具有生物功能的模式；

  2.本课题组侧重于分析单核甘酸多态性、拷贝数变异、甲基化等数据；

  代表性发表：

  在国际重要刊物《BMC Genomics》,《Journal of computational biology》, 《PLoS ONE》等发表了相关论文。

