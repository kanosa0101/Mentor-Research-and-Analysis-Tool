bio_raw: 西安电子科技大学计算机学院副教授，硕士生导师；中国计算机学会会员。2008年6月毕业于西安电子科技大学计算机应用技术专业，获工学博士学位。主要从事计算机外部设备、计算机图形图像理解、人机交互、嵌入式系统及相关技术的研究工作。2015-2016在英国布里斯托大学进行为期一年的学术访问。
