  个人简介

  柴慧敏，女，博士，西安电子科技大学计算机学院副教授，硕士生导师。1998年于南开大学计算机与科学系获得学士学位，2003年于西安电子科技大学计算机学院获得工学硕士学位，2009于西安电子科技大学计算机学院获得工学博士学位。

  态势估计为信息融合系统中的高层融合部分，主要研究态势估计模型与评估方法；研究计算机协同系统中的协同方法与实现技术。结合研究工作，先后参与或主持了高校基本科研业务费项目等，并发表了相关论文若干篇。

  主要研究方向

  1. 信息融合与态势评估模型、方法研究

  2. 软件协同方法与实现技术研究

