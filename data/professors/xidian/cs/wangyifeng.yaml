bio_raw: 西安电子科技大学计算机学院副教授，硕士生导师。2009年3月获西安电子科技大学计算机应用技术博士学位，从事计算机图形图像处理、计算机色彩管理、计算机人机交互等技术研究。参与项目2项,国家自然科学基金项目1项；近年来，在国内外重要学术期刊、国际会议上发表论文20余篇。
