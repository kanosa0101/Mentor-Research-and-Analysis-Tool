  个人简介

  焦晓鹏,男,1984年1月生,于2004年获得西安电子科技大学计算机科学与技术学士学位,2009年获得西安电子科技大学计算机系统结构博士学位.2010年起留校工作.
  2010.6至2012年2月在新加坡国立大学做博士后研究，并于2011.6-2011.7在美国俄克拉荷马大学访问。

  2010-2013  西安电子科技大学，计算机学院，讲师

  2013-2020 西安电子科技大学，计算机科学与技术学院，副教授

  2020-至今 西安电子科技大学，计算机科学与技术学院，教授

  近年来在IEEE Trans. on Communications、IEEE Trans. on Vehicular Technology、IEEE Communications
  Letters等国际知名期刊和IEEE ISIT等国际会议上发表论文40余篇。担任IEEE Trans. on Communications、IEEE signal
  processing letters、IEEE Communication letters、Phiscal communication、IEEE ISIT等国际期刊和会议的审稿人。

  主持国家自然科学基金面上项目2项，青年基金项目1项，企业合作项目1项，基本科研业务费项目2项，参与国家自然科学基金面上项目2项。担任

  国家自然科学基金项目评审专家。

  主要研究方向

  主要从事纠错编码技术及其应用、纠错码与机器学习交叉方向的研究,目前感兴趣的研究方向如下:

  研究方向一、纠同步(插入/删除)错误码

  基本问题：信息传输和存储中出现插入和删除错误，如何进行纠正？

  与替换错误相比，同步错误(包括插入insertion和删除deletion)在接收端会出现传输比特的错位现象，更难以进行纠正。目前，纠正此类错误码的精确性能极限在哪里并不清楚，如何构造高效的纠插入/删除错误码也是一个重要的研究问题。

  应用背景：DNA存储，高密度Racetrack存储、文件同步

  研究课题：纠同步错误码的构造(包括基于概率的、基于代数的、和基于同步字符串(synchronization string)的构造方法等)、纠同步错误码的高效译码、DNA存储中的编码问题等

  研究方向二、现代编码技术(LDPC码、polar码等)

  基本问题：信息传输和存储中出现替换错误，如何进行纠正？

  与同步错误相比，替换错误仅在接收端相对应的位置出错，不会出现位置不对应的情形。纠正此类错误的码存在一个极限(称为香农限)，现代编码技术是能够逼近或达到香农极限且可以进行高效编译码的纠错码技术。

  应用背景：无线通信(5G、WiFi、WiMax)，深空通信

  ，光纤通信、SSD闪存存储

  研究课题：二元LDPC码的译码、polar码的译码、非二元LDPC码的译码、译码算法的高效实现(CPU多核、GPU等)。

  研究方向三、纠错码与机器学习交叉研究

  码的构造和译码可以借助机器学习方法来完成。相反，机器学习的可靠性问题也可以通过纠错码来加强。因此，纠错码与机器学习交叉问题值得研究。

  研究课题：使用机器学习方法进行码的构造、基于深度学习方法的译码算法、基于纠错码的可靠神经网络设计、神经网络的安全与隐私问题等。

