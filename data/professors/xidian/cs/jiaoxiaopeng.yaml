bio_raw: '焦晓鹏,男,1984年1月生,于2004年获得西安电子科技大学计算机科学与技术学士学位,2009年获得西安电子科技大学计算机系统结构博士学位.2010年起留校工作.
  2010.6至2012年2月在新加坡国立大学做博士后研究，并于2011.6-2011.7在美国俄克拉荷马大学访问。

  2010-2013  西安电子科技大学，计算机学院，讲师

  2013-2020 西安电子科技大学，计算机科学与技术学院，副教授

  2020-至今 西安电子科技大学，计算机科学与技术学院，教授

  近年来在IEEE Trans. on Communications、IEEE Trans. on Vehicular Technology、IEEE Communications
  Letters等国际知名期刊和IEEE ISIT等国际会议上发表论文40余篇。担任IEEE Trans. on Communications、IEEE signal
  processing letters、IEEE Communication letters、Phiscal communication、IEEE ISIT等国际期刊和会议的审稿人。

  主持国家自然科学基金面上项目2项，青年基金项目1项，企业合作项目1项，基本科研业务费项目2项，参与国家自然科学基金面上项目2项。担任

  国家自然科学基金项目评审专家。'
