bio_raw: '个人简介

  Personal Profile

  王鸣哲，副教授，硕士生导师。

  计算机科学与技术学院 智能媒体与数据工程研究所，团队网址：

  https://imde.xidian.edu.cn/

  教育及工作经历：

  ● 2026.08-至今，西安电子科技大学 计算机科学与技术学院，副教授

  ● 2022.12-2026.08，西安电子科技大学 计算机科学与技术学院，华山准聘副教授

  ● 2021.12-2022.12，悉尼科技大学 (University of Technology Sydney) UTS Tech Lab，博士后研究员，助教。合作导师：

  Prof. Jian Zhang

  ,

  Dr. Qiang Wu

  ●

  2017.08-2022.01，新南威尔士大学 (University of New South Wales), 计算机科学与工程专业 博士研究生。指导教师：

  Prof. Changming Sun

  ,

  Prof. Arcot Sowmya

  ●

  2014.09-2017.07，中国科学院国家空间科学中心，计算机应用技术专业 硕士研究生。

  指导教师

  ：

  薛长斌 研究员

  项目经历：

  2022年12月回国参加工作以来，入选国家海外引才计划专项(教育部第一批)、西安市科协青年人才托举计划、小米青年学者等多项人才项目。主持国家自然科学基金青年项目、中国博士后科学基金面上项目、陕西省博士后科研资助项目、中央高校基本科研基金等纵向项目，并以项目骨干身份参与国家重大科技专项。深度参与团队横向项目。曾参与我国多项国家航空航天项目及相关科研任务如实践十号、高分五号等。博士后期间于悉尼科技大学以技术负责人身份参与3项横向项目，累计经费约1000万人民币，所设计的基于移动设备的图像处理算法与设备平台已交付多家公司进行市场化运营。

  研究方向：

  主要从事图像分析与特征配准、图像实时目标检测与跟踪、无监督/弱监督图像异常/缺陷检测、双目立体视觉深度感知等方向的研究工作，并在相关国内外主流期刊和会议如International
  Journal of Computer Vision、AAAI、Pattern Recognition等发表学术论文10余篇，其中CCF-A类/中科院一区9篇。一篇文章被中科院一区TOP期刊EES（影响因子30.8）选为封面文章。目前也跟随团队进行数据管理相关科研任务的研究。承担International
  Journal of Computer Vision、IEEE TMM、Pattern Recognition Letters、IEEE ICME、IEEE IROS等期刊会议审稿工作。

  获得奖励：

  曾两次获得西安电子科技大学计算机科学与技术学院优秀青年人才奖，新南威尔士大学 (UNSW) 全额学费奖学金 (4年共计约16.8万澳元)、CSIRO研究奖学金
  (3.5年共计3.5万澳元)、UNSW高等级学业奖学金 (7000澳元)、国家建设高水平大学公派研究生项目奖学金、国家奖学金、中国科学院国家空间科学中心优秀毕业论文等多项荣誉。'
