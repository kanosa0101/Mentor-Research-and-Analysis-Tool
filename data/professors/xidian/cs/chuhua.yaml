  个人简介

  褚华，工学博士、教授、硕士生导师

  ，长期从事计算机软件领域的教学和科研工作，现任西安电子科技大学计算机科学与技术学院软件工程系主任、国家一流本科专业软件工程专业负责人、教育部“101”计划软件工程课程主要负责人、陕西省计算机教育学会理事、智慧金融软件工程新技术联合实验室副主任，担任Knowledge-based
  System（SCI 1区Top期刊）、ECML/PKDD 2023 & 2024 & 2025 & 2026（数据挖掘领域CCF B会议，兼会议程序委员会成员）、CIKM
  2024（数据挖掘领域CCF B会议）等国内外高水平会议/期刊审稿人。主要研究方向为智能推荐与决策、教育大数据、面向对象技术、智能软件工程等，近年来在NeurIPS（CCF
  A类）、RecSys（CCF B类）、WSDM（CCF B类）、DASFAA（CCF B类）、ICASSP（CCF B类）、Machine Learning（CCF
  B类）、Neural Ｎetworks（SCI 1区）、Expert Systems With Applications（SCI 1区）、软件学报（CCF A类中文）等数据挖掘、人工智能、软件工程等国内外顶级会议与全文期刊上累计发表学术论文30余篇、申请/授权/转化国家发明专利20余项。

  课题组目前

  成员分布

  ：博士生1名、研三硕士生4名、研二硕士生6名、研一硕士生6名、大四推免生2名、本科实习生24名。

  主要招收

  软件工程学科博士研究生、学术型硕士研究生、电子信息领域硕士研究生

  ，同时欢迎

  本科同学

  参与项目组的科研、竞赛及毕设项目（可提供科研实习证明与推荐信）。

  近年来主持国家自然科学基金青年基金、国家863重大研发计划等多项纵向项目；主持与中航618研究所、中航631研究所、中科院西安光机所、西安近现代化学研究所、中国银行陕西省分行、总参55所、西京医院、上海复深蓝等多个校企/科研院所合作项目；作为主要完成人参与多项国防科研、国家自然科学基金面上项目。项目研究成果在医疗、教育、保险和金融等多个领域投入实际应用。

  目前致力于

  信息推荐与智能计算

  开展研究工作，以人工智能技术在

  智慧教育

  、

  智慧保险

  、

  智慧医疗

  等跨领域的应用研究，受多项校企/科研院所合作项目支持。

  主要研究方向

  1. 智能推荐与决策：

  1）针对数据稀疏性/冷启动场景的多元数据融合研究

  ：融合并对齐多元数据，如知识图谱、多行为数据（浏览、收藏、评论等）、社交网络等，实现对数据稀疏性/冷启动场景的用户画像补全与精准推荐；

  2）世界语言模型引导的生成式推荐研究

  ：深入挖掘大语言模型（LLM）先验知识，探索AI Agent人类行为模拟与自主规划机制，实现语义理解与增强的自适应生成式推荐；

  3）面向垂直领域应用的场景特性建模与推荐研究

  ：引入丰富领域知识进行垂直领域推荐场景的任务理解，建模垂直领域推荐场景独有特性，定制化生成面向复杂场景的个性化推荐结果。

  2. AI赋能智慧教育（AI for Education）：

  1）大模型增强的知识图谱自动化构建与补全研究

  ：利用大语言模型自动构建具备语义关联与先修后继逻辑的领域知识图谱，以实现知识管理的系统化表达与知识体系的智能补全；

  2）多维度课堂行为深度智能解析与薄弱知识定位研究

  ：精准识别学生在课堂上的复杂物理行为，利用多模态融合技术实现学情信息的多视图对齐与分析，以精准诊断学生知识状态；

  3）基于认知诊断的个性化学习路径推荐研究

  ：深入挖掘学生的历史学习行为，动态感知其知识状态与学习偏好，建模复杂的异构知识关联，以提供判别式/生成式的个性化学习资源推荐与学习路径规划；

  4）基于智能体驱动的个性化设问式辅导研究

  ：结合领域知识图谱与检索增强生成技术，模拟教师辅导逻辑，为学生提供个性化的“以思促学”设问式学习辅导，以实现“授人以鱼不如授人以渔”的个性化学习支持。

  3. 面向对象、软件工程、逆向工程

