bio_raw: '个人简介

  Personal Profile

  何吉，计算机科学与技术学院副教授，硕士生导师。主要研究方向为无人系统安全、具身智能、AI4Sec，致力于探索将大语言模型等前沿人工智能技术应用于网络信息与无线安全领域，重点研究基于LLM的安全智能体，以实现感知、决策与响应一体化的动态自主防御。主持了国家自然科学基金委青年科学基金项目、博士后面上项目、广东省基础与应用基础研究青年基金项目等，作为核心骨干参与了GF创新特区重点、国家重点研发计划、自然科学基金委重大研究计划等重大'
