  个人简介

  Personal Profile

  张剑贤，副教授，硕士研究生导师，

  中国计算机学会（

  CCF

  ）嵌入式系统专委会执行委员、体系结构和高性能计算专委委员

  。主持及参与国家自然科学基金、国防预先研究、省部级科研项目及横向项目10余项，发表学术论文20多篇，获得发明专利多项，

  获2021年度中国电子学会技术发明二等奖

  。参与编写“十二五”普通高等教育本科国家级规划教材2本，获得陕西省高等教育优秀教材一等奖。曾多次获实验教学案例设计竞赛全国一/二等奖。

  研究方向

  ：嵌入式系统及

  片上系统（SoC）、物联网技术及无线感知、高性能异构计算及处理器体系结构设计、图像处理算法并行加速优化。'
