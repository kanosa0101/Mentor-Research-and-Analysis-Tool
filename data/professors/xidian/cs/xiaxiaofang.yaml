  个人简介

  夏小芳，博士，现任职于西安电子科技大学计算机科学与技术学院，教授，博导。

  担任先进数据库陕西省高校工程研究中心、西安市先进数据库技术重点实验室副主任。

  2019年1月于中科院沈阳自动化研究所获得控制理论与控制工程专业博士学位。2016年8月至2018年2月获国家留学基金委资助，在美国阿拉巴马大学计算机系联合培养。

  主要研究领域为物联网、数据库、数据安全、云边协同等。主持承担（过）国家自然科学基金项目（面上、青年）、中国博士后科学基金（站前特别资助、面上项目）；作为技术负责人，深度参与科技部重大专项、工信部重大专项、多项重大横向项目等。在相关领域顶级期刊和会议上，已发表论文50余篇，涵盖Proceedings
  of the IEEE、IEEE TDSC、IEEE TIFS、SIGMOD、NeurIPS、《计算机学报》等。其中，以第一作者发表CCF A类/中科院一区top期刊等论文20余篇。申请国家发明专利20余项，其中10余项已获得授权。

  入选中国科协青年人才托举工程、陕西省青年科技新星项目，获

  ACM

  西安新星奖

  、

  陕西省计算机学会自然科学二等奖（排名1）、

  陕西高等学校科学技术研究优秀成果一等奖、陕西省电子学会技术发明一等奖，获批第二批“国家级一流本科生课程”（排名3）等。

  招生信息

  博/硕士招生方向：

  计算机科学与技术

  （学术型）、

  计算机技术

  （专业型）

  欢迎满足下列条件的同学推免/报考：

  （1）具有较强的编程能力；

  （2）具有较好的数理基础；

  （3）具有较高的英语水平。

  希望你勤奋好学、踏实肯干、责任心强，具有较高的学术理想和追求！

  感兴趣的同学请发简历、大学成绩单及竞赛信息（若有）到邮箱。

  此外，团队接受优秀的西电本科生参与科研训练，有意者请邮件联系。

  团队长期和国内外知名高校、研究所合作开展科学研究，学术资源丰富，能为学生的成长成才提供强有力的支持和帮助。

