bio_raw: '个人简介

  Personal Profile

  Personal Profile

  谢琨，西安电子科技大学华山特聘教授，计算机科学与技术学院网络工程系主任，陕西省特支计划教学领军人才。

  于西安电子科技大学获计算机软件专业学士学位、计算机系统结构硕士学位和博士学位。曾于2017年6月至2017年9月受学校资助赴加拿大进行交流，

  2017年12月至2018年12月作为国家公派访问学者赴英国布鲁内尔大学从事访问研究。

  主要研究方向为计算机视觉、图像安全、生物信息处理，主持和参与国家自然科学基金、预研等项目20余项，在CVPR、IEEE Trans.等国内外重要学术期刊、国际会议上发表论文

  40余篇，授权专利10余项。主持和参与陕西省高等教育科学研究重点项目7项。获国家级教学成果奖二等奖1项，省级教学成果奖特等奖2项、一等奖、二等奖各1项；获首届全国高校教师教学创新大赛二等奖，陕西省本科高校课堂教学创新大赛一等奖；第三届全国“互联网+”大学生创新创业大赛优秀创新创业导师奖；主持国家级一流课程、陕西省思政示范课。

  获西电“首届教书育人典范”“最美教师”“教学名师”“师德标兵”“三八红旗手”等称号。'
