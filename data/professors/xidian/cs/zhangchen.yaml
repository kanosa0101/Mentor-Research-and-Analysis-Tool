bio_raw: '个人简介

  Personal Profile

  张琛，博士，副教授，博士生导师。主要研究方向是人工智能与大数据分析、软件安全和形式化方法。主持陕西省重点产业创新链项目“基于弱监督学习的影像数据智能化评估技术研究与应用”1项（2022-2024），国家重点研发计划项目子课题“秦巴山食用菌生产加工全产业链质量安全保障技术集成与示范”1项（2019-2022），国家自然科学基金青年基金项目“一种软件功能性安全验证理论和方法”1项（2016-2018），陕西省重点研发计划项目“综合模块化航电系统建模关键技术研究”1项（2019-2020），西安电子科技大学基本科研业务费项目3项；同时参与多项国家自然科学基金项目和省部级横向项目；在相关领域发表高水平学术论文50余篇，担任Pattern
  Recognition等学术期刊的审稿人。'
