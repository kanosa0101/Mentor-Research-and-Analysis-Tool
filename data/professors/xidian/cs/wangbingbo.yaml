  个人简介

  Personal Profile

  王炳波

  ，男，副教授，西安电子科技大学计算机学院、计算生物信息学研究所，计算机应用学科背景，计算机学会计算生物信息学专委会委员。

  个人主页

  ：

  https://web.xidian.edu.cn/wbb/

  从事生物网络分析方面的研究工作，对图论及组合优化理论、网络数据挖掘算法、图表示学习方法有较深厚的研究积累；在计算生物信息领域的工作主要聚焦在复杂生物网络数据分析的理论和方法，擅长以图论和机器学习为基础的算法研究；国家留学基金委全额资助在

  美国复杂网络研究中心(CCNR)

  、

  哈佛医学院网络医学研究中心(CDNM)

  合作开展为期一年的研究工作；负责了国家自然科学面上项目、青年基金项目、陕西省自然科学基金项目、博士后基金项目，参与了国家自然科学基金面上、重点和重大研究计划培育项目；在本领域国际期刊《Nature
  Communications》、《Briefings in Bioinformatics》、《BMC Bioinformatics》、《Scientific Report》、《Europhysics
  Letters》、《J. Stat. Mech.》、《Physica A》、《Neurocomputing》、《IEEE/ACM TCBB》、《Frontiers
  in Genetics》、《中国科学》、《PLoS One》等发表了研究成果，奠定了在该领域深入开展研究工作的良好基础；荣获

  陕西省自然科学一等奖

  （第三）、中国电子学会科学技术二等奖（第三）、西安电子科技大学优秀科研成果奖、西安电子科技大学优秀博士学位论文奖；

  专注于在生物网络中挖掘复杂疾病的图模式

  。

  科研获奖及专利'
