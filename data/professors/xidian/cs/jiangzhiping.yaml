  蒋志平，博士，西安电子科技大学计算机科学与技术学院副教授。

  本人主要从事基于Wi-Fi的集成通信与感知（Integrated Sensing And Communication, ISAC）相关研究，研发了领域内知名的研究软件

  PicoScenes

  (

  https://ps.zpj.io

  )。该软件目前得到国内外近150所知名高校、研究机构及公司的应用，对Wi-Fi ISAC相关研究领域的发展做出了关键贡献。

  基于PicoScenes平台以及团队长期在射频通信、ISAC等方向的深入研究，本人得到以下标志性项目支持：

  2018-2019年，荣幸得到中国博士后基金会“

  博新计划

  ”支持；

  2018-2020年，荣幸得到自然基金委”

  青基

  “项目支持，研发基于Wi-Fi的超带宽相关技术及系统；

  2019-2020年，荣幸得到

  中电科第十五研究所

  项目支持， 与我校电院实力团队，研发先进通信技术及其应用；

  2020-2023年，荣幸得到科技部”

  国家重点研发计划

  “项目，研发面向公共文化服务装备的5G相关技术及系统；

  2022年，得到'
