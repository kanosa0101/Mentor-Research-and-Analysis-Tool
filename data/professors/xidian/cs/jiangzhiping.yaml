bio_raw: '个人简介

  Personal Profile

  蒋志平，博士，西安电子科技大学计算机科学与技术学院副教授。

  本人主要从事基于Wi-Fi的集成通信与感知（Integrated Sensing And Communication, ISAC）相关研究，研发了领域内知名的研究软件

  PicoScenes

  (

  https://ps.zpj.io

  )。该软件目前得到国内外近150所知名高校、研究机构及公司的应用，对Wi-Fi ISAC相关研究领域的发展做出了关键贡献。

  基于PicoScenes平台以及团队长期在射频通信、ISAC等方向的深入研究，本人得到以下标志性项目支持：

  2018-2019年，荣幸得到中国博士后基金会“

  博新计划

  ”支持；

  2018-2020年，荣幸得到自然基金委”

  青基

  “项目支持，研发基于Wi-Fi的超带宽相关技术及系统；

  2019-2020年，荣幸得到

  中电科第十五研究所

  项目支持， 与我校电院实力团队，研发先进通信技术及其应用；

  2020-2023年，荣幸得到科技部”

  国家重点研发计划

  “项目，研发面向公共文化服务装备的5G相关技术及系统；

  2022年，得到

  ACM SIGMOBILE Student Community Grant

  资助。

  该资助在全球范围资助4项，本人所带领的学生团队荣获中国唯一支持

  。

  2023-2024年，荣幸得到

  荣耀公司

  项目支持，研发某Wi-Fi相关先进技术及其应用；

  2023-2025年，荣幸得到

  华为2012无线技术实验室

  项目支持，研发某Wi-Fi相关先进技术及其应用；

  2023-2025年，荣幸得到

  中船第七一九研究所

  项目支持， 与我校电院实力团队，研发先进通信技术及其应用；

  教学方面，长年承担《计算机组成与结构I》和《计算机组成与结构II》课程（俗称“西奠祭祖之春祭/秋祭”）教学任务，

  教学好评如潮，

  请上“对策府库”查阅。

  研究生招生

  本课题组2026年，目前，还可招收**软工方向学硕1

  名

  **，男女生不限，欢迎同学们保送和报考！

  未来拟研究方向是Wi-Fi感知、定位、定制/隐蔽通信系统、基于软件无线电的OFDM基带信号处理/雷达技术等；

  希望进入本课题组的同学应具有棒棒的系统实际能力；

  具备高水平C/C++/MATLAB能力者予以优先考虑

  ；具备无线通信、信号系统背景者予以优先考虑；具备FPGA/ZynQ开发能力者予以优先考虑；

  最近我们在

  ALL in AI4SE

  ！正在推进

  Al+医疗

  、

  Al+无线感知

  等前沿交叉研究，欢迎对AI应用有热情的同学加入；

  课题组

  Token全额报销

  ，

  算力管够

  ，放心跑模型~

  欢迎本科生入组科研

  如果你学有余力，如果你想提升实践能力，如果想读研读博，如果你想搞真正落地的研究，来来来，欢迎加盟～：）

  如果你加入我们组，你会得到什么？

  非常非常融洽和开心的实验室氛围

  一个有趣的老板

  实践能力，沟通能力，工作能力的全面提升

  非常稀有的博士指标

  大厂的各类内推机会

  老板懂“古人总结的高分辨率时空大模型”，可为你提供高分辨率未来人生发展预测与建议

  AI相关项目经验，与大厂招聘方向高度一致

  毕业全部都高薪，过往学生最低年薪35+

  Token全报销，AI算力自由，搞AI搞到爽~

  吐槽

  这个老师主页系统太复杂了，别的页面不用点了，全是空的。'
