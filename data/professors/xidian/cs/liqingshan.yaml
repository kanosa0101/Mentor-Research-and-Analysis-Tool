bio_raw: '李青山，1973年12月，博士，教授，硕士生导师，博士生导师。

  基本介绍

  现任计算机科学与技术学院（国家示范性软件学院）党委书记、软件工程一级学科负责人、智能软件与系统新技术研究所所长、省级人才团队负责人、西安市智能软件工程重点实验室主任。

  曾任学校发展规划处副处长/一流建设工作办公室副主任（主持工作）、研究生院副院长、软件学院副院长。

  教育部省级重点学科“软件工程”学术带头人，享受省部级人才津贴。

  全国工程专业学位研究生教育指导委员会软件工程领域协作组成员。

  中国计算机学会（CCF）杰出会员。

  中国计算机学会软件工程专委会常务委员。

  中国计算机学会大数据专委会执行委员。

  中国计算机学会青年工作委员会执行委员。

  中国计算机学会系统软件专委会执行委员。

  中国计算机学会开源发展委员会执行委员。

  国家留学基金委公派至美国留学访问学者。

  陕西省计算机学会软件工程专委会副主任。

  2019年2月至5月在国家教育行政学院第56期中青年干部培训班学习。

  曾获中电集团奖教金、校级先进工作者、校级优秀教师、校级研究生奖教金、校级第四届“十佳青年教师”。

  学术研究'
