  个人简介

  李青山，1973年12月，博士，教授，硕士生导师，博士生导师。

  基本介绍

  现任计算机科学与技术学院（国家示范性软件学院）党委书记、软件工程一级学科负责人、智能软件与系统新技术研究所所长、省级人才团队负责人、西安市智能软件工程重点实验室主任。

  曾任学校发展规划处副处长/一流建设工作办公室副主任（主持工作）、研究生院副院长、软件学院副院长。

  教育部省级重点学科“软件工程”学术带头人，享受省部级人才津贴。

  全国工程专业学位研究生教育指导委员会软件工程领域协作组成员。

  中国计算机学会（CCF）杰出会员。

  中国计算机学会软件工程专委会常务委员。

  中国计算机学会大数据专委会执行委员。

  中国计算机学会青年工作委员会执行委员。

  中国计算机学会系统软件专委会执行委员。

  中国计算机学会开源发展委员会执行委员。

  国家留学基金委公派至美国留学访问学者。

  陕西省计算机学会软件工程专委会副主任。

  2019年2月至5月在国家教育行政学院第56期中青年干部培训班学习。

  曾获中电集团奖教金、校级先进工作者、校级优秀教师、校级研究生奖教金、校级第四届“十佳青年教师”。

  学术研究

  科研项目：自2010年任职教授至今，李青山教授主要从事国产开源软件、软件体系结构、自适应软件演化、智能软件工程、大数据智能化分析技术等方向的研究工作。主持国家科技部重大研发计划课题、国家863重大项目课题、国家自然科学基金重点项目课题、面上项目、中国科学院战略性先导技术专项等国家和省部级项目五十余项。

  学术成果：作为第一作者或通讯作者在ICSE、ESEC/FSE等CCF A类会议和软件工程顶级会议，在ICSME、SANER、WCRE、CSMR等软件自适应与软件演化顶级会议，在《中国科学》、《软件学报》、《计算机学报》等国家一级学报、《Integrated
  Computer-Aided Engineering》（SCI 1区）、《Artificial Intelligence Review》(SCI 2区)等国际期刊上发表SCI/EI检索论文100余篇。第一完成人授权/公开国家发明专利30余项，获省部级及以上科研/教学奖励3项。并参与编写《Multi-Agent
  Systems - Modeling, Control, Programming, Simulations and Applications》、《多智能体系统及应用》专著。

  行政工作

  目前任职：

  计算机科学与技术学院（国家示范性软件学院）党委书记

  主要工作：全面负责计算机科学与技术学院党委工作。

  西电软件工程一级学科负责人

  主要工作：全面负责学校软件工程学科建设。

  智能软件与系统新技术研究所所长

  主要工作：全面负责该所的建设与科研工作。

  省级创新团队负责人

  主要工作：全面负责该团队的科技与科研创新建设工作。

  西安市智能软件工程重点实验室主任

  主要工作：全面负责该实验室建设与科研工作。

  曾任职务：

  发展规划处副处长/一流建设工作办公室副主任

  主要工作：负责学校双一流建设、学校办学定位发展战略研究、学校中长期发展战略规划和事业发展规划制定与落实、学校学科建设规划制定与落实、重点学科建设项目组织实施与管理等一系列学校的发展规划工作。

  研究生院副院长

  主要工作：分管研究生培养和专业学位管理工作。

  软件学院副院长

  主要工作：主管软件工程专业学位研究生教育工作。

  学科工作

  软件工程一级学科学术带头人

  主要工作：2011年，李青山教授作为核心人员一直负责软件工程一级学科申报工作，获批后，从2012到目前，作为教育部省级重点学科“软件工程”学术带头人，负责判断软件工程学科的发展方向，及时提出和选定相应的教学、科学研究的新任务、新课题，并且组织、指导科研团队和科学研究人员开展工作获得重要成果。

  李青山教授介绍“软件工程”专业【'
