bio_raw: '个人简介

  Personal Profile

  蔺一帅，女，博士，西安电子科技大学计算机科学与技术学院副教授，博士生导师。2009年取得西安交通大学软件工程学士学位；2010年至2013年期间，在法国Université
  de Technologie de Belfort-Monbéliard取得信息科学硕士、博士学位（等级为very honorable）；2013年至2014年期间，任法国Université
  de Haute-Alsace研究助理；2014年回国，开始任职于西安电子科技大学，从事教学科研工作。教学方面，主要承担《软件体系结构》等软件工程专业本科生、研究生的课程教学工作，主持教育部教学研究项目一项、校级教学改革项目多项，创新设计了“任务导向、案例驱动、以面引点、体验探究、立体思政”的面向工程能力培养的《软件体系结构》特色教学方式，荣获软件工程实践教学案例竞赛全国一等奖、西安电子科技大学课程创新大赛一等奖、本科教学创新奖、思政育人竞赛二等奖等多项荣誉。同时，主讲的《软件体系结构》本科生课程被认定为“陕西省一流（线下）课程”、校级思政示范课程、优质示范课观摩班课程，且作为国内首个软件架构相关慕课面向高校在校生和社会学习者开放，开课两学期以来的选课人数近1.7万人。科研方面，其在“面向多智能体的软件工程”、“集群场景下多机器人的调度规划”等领域展开研究，主持并参与了国家青年科学基金、国家重点研发计划、陕西省重点研发计划、广东省基础与应用基础研究基金等国家级、省市级多项'
