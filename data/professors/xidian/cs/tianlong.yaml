bio_raw: '个人简介

  Personal Profile

  田隆，西安电子科技大学副教授，硕士生导师，工学博士。分别于2015年和2021年在西安电子科技大学获得学士和博士学位，

  2021年留校参加工作。

  师从雷达信号处理专家刘宏伟教授，同时受到西安电子科技大学机器学习、统计信号处理领域专家陈渤教授和美国德克萨斯大学奥斯汀分校统计机器学习专家周明远教授的良好指导。从事

  稀疏样本表示学习方法研究

  ，主要包括

  小样本图像分类、小样本目标检测、小样本图像/视频异常检测

  等；从事

  智能信号处理方法研究

  ，主要包括

  时频分析、目标三维姿态估计、雷达目标识别

  等

  。相关研究成果发表于NeurIPS，CVPR，

  ICML，ICCV，ICLR以及TNNLS等人工智能、机器学习国际会议和期刊；TGRS，TAES，ICASSP以及IGARSS等信号处理国际期刊和会议上。主持国家级纵向项目4项，省部级项目3项。

  研究生招生：2027级有一名

  保研名额！

  欢迎基础扎实、有热情、有想象力且做事认真的同学们的加入！有意报考的同学请尽早发送个人简历和支撑材料至我的邮箱tianlong@xidian.edu.cn，不要通过网易超大附件发送简历！（PS：动手能力强、有科研经历且数学和外语成绩突出的同学将被优先考虑。一般流程是先线上聊，然后会分配任务做短期考察，通过后方可确定保研名额。）

  学生资助与奖励：

  参与项目的硕士研究生每月科研补助：500-1000/月；

  参与项目并做出重要贡献的硕士研究生每月科研补助：2000-3000/月；

  对发表论文有突出贡献的同学提供额外奖励：中科院1区/CCF A类论文，奖励2000-4000；中科院2区/CCF B类论文，奖励1000-2000；支持发表国际会议论文的同学出国开会与同行交流学习，报销会议注册费、往返路费、酒店住宿费并提供一天200的补助；

  对于家庭困难、品学兼优的同学，确定保研后导师会额外提供每月1500的生活费，确保学生在研究生期间能够生活无忧、安心学习本领、钻研学术。

  学生就业情况：

  指导的2026届毕业生（1人）：北京陌陌；

  指导的2025届毕业生（6人）：1人继续攻读博士，1人上海华为，1人西安汇丰银行，1人北京微博，1人北京小米，1人北京陌陌；

  指导的2024届毕业生（1人）：西安浙商银行

  ；

  学生重要获奖情况：

  指导的研究生冯婧怡获得2023年教育部研究生国家奖学金；

  指导的研究生赵弘毅和吴雨杰同时获得2024年教育部研究生国家奖学金

  ；

  指导的研究生张炯戈获得2025年教育部研究生国家奖学金

  ；

  顺便一提，科研之余想找网球搭子的同学也欢迎与我联系！（PS：本人大概3.5～4.0水平，毕竟是坚持了10年的爱好）

