  个人简介

  Personal Profile

  闫杰熹，博士，长聘副教授，华山准聘副教授，硕士研究生导师。主要研究方向为机器学习、计算机视觉和多模态认知与推理以及AI for Science。

  2024年陕西省高校优秀青年支持计划、2024年陕西省优秀博士学位论文奖

  获得者。在相关领域主流期刊和学术会议发表论文10余篇，其中主持国家自然科学基金青年基金项目等科研项目，作为核心骨干成员参与国家重点研发计划2项、国家自然科学基金重点项目1项、陕西省重点产业创新链项目3项等。

  受邀担任

  ICML2025、NeurIPS2024领域主席（Area Chair）

  ，常年担任NeurIPS（CCF A 类会议）、ICML（CCF A 类会议）、ICLR、KDD（CCF A 类会议）、CVPR（CCF A 类会议）、ICCV（CCF
  A 类会议）、ECCV（CCF B类会议）、AAAI（CCF A 类会议）、IJCAI（CCF A 类会议）等高水平会议的PC Member，担任IEEE TNNLS、PR等高水平期刊的审稿人。

  欢迎想要提前开展科研学习的本科同学与我联系，提前进入实验室学习。目前指导7名本科生开展科研和竞赛学习（2023级拔尖班学生2名，2023级卓越班学生1名，2024级卓越班学生4名）。

