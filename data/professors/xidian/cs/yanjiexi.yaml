bio_raw: '个人简介

  Personal Profile

  闫杰熹，博士，长聘副教授，华山准聘副教授，硕士研究生导师。主要研究方向为机器学习、计算机视觉和多模态认知与推理以及AI for Science。

  2024年陕西省高校优秀青年支持计划、2024年陕西省优秀博士学位论文奖

  获得者。在相关领域主流期刊和学术会议发表论文10余篇，其中主持国家自然科学基金青年基金项目等'
