bio_raw: '个人简介

  Personal Profile

  李飞

  ，西安电子科技大学计算机科学与技术学院华山准聘副教授，工学博士。2016年6月于西北工业大学获软件工程专业学士学位。2022年6月于西北工业大学获软件工程博士学位（导师：郑江滨教授）。同年进入西安电子科技大学工作，现为计算机科学与技术学院软件工程系教师。

  长期从事计算机视觉、机器学习、深度学习等领域研究。

  近年来，在多个国际学术期刊和顶级会议上发表论文数篇。

  主持国家青年自然科学基金一项，航空科学基金一项，同时

  参与

  国家自然基金面上项目、国家863项目、陕西省重点研发项目等。

  主要研究方向

  视觉感知与理解:

  低质量图像复原增强

  复杂及退化场景感知与理解

  AIGC

  图像质量评估

  三维世界建模:

  3DGS场景重建

  场景编辑理解

  具身智能:

  视觉-语言-行动（VLA）大模型

  无人设备（如机械臂、无人机）自主规划与协同控制

  招募本科实习生（以发表高水平论文为目标）

  对CV、3D重建 (NeRF/3DGS)、具身智能 (VLA) 有兴趣的本科生，共同参与科研论文课题，有意者请邮箱联系。'
