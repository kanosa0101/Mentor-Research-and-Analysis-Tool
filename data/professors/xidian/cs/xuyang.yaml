bio_raw: '徐扬，陕西西安人，分别于2006年、2014年取得西安电子科技大学通信工程专业学士、通信与信息系统专业博士学位。2015年留校任教至今，现任副教授。研究兴趣物理层安全，网络经济学，网络性能分析、路由协议设计、区块链技术等。参加工作以来，累计发表论文30余篇，主持陕西省重点研发项目、国家自然科学基金(青年)、科技部重点研发项目子课题、陕西省电子信息产业“十三五”发展规划编制项目等。作为主要成员参与科技部重点研发项目、国家自然科学基金重点项目、陕西省科技统筹创新工程计划项目等。

  欢迎同学们报考和咨询'
