bio_raw: '个人简介

  Personal Profile

  武越，教授、博士生导师，西安电子科技大学协同智能系统教育部重点实验室副主任。

  IEEE/CCF/CAAI

  高级会员，陕西省青年科技新星。主要研究方向为三维视觉、计算智能等方面的研究。以第一

  /

  通讯作者在高水平期刊和会议（

  TNNLS

  、

  TEVC

  、

  TVCG

  、

  TCSVT

  、

  TMM

  、

  CIM

  、

  INFFUS

  、

  CVPR

  、

  ICML

  、

  AAAI

  、

  ACM MM

  、中国科学等）上发表

  60

  余篇论文，被引用

  4000

  余次，

  2022

  年起连续多年入选全球前

  2%

  顶尖科学家榜单，

  10

  篇论文入选

  ESI

  高被引

  /

  热点论文，获

  AAAI 2024

  杰出论文奖（

  5/6

  ）、

  ACAIT 2022

  最佳论文奖（

  1/6

  ），出版英文专著

  4

  部，申请和授权专利

  50

  余项。主持国家自然科学基金（重点子课题、面上、青年）、科技委重点项目子课题、中国博士后基金特别资助、上海航天科技创新基金、中国人工智能学会

  -

  华为

  MindSpore

  学术奖励基金、华为中兴研究基金等项目。相关研究成果获陕西省科学技术奖自然科学二等奖（

  1/6

  ）、吴文俊人工智能优秀青年奖、华为火花奖、

  ACM

  中国新星奖、全国青年人工智能创新创业大会创新组一等奖（

  1/6

  ）、陕西省电子学会自然科学一等奖（

  2/6

  ）和二等奖（

  1/5

  ）、中国人工智能学会优秀学会工作者、陕西省科技工作者创新创业大赛金奖（

  2/6

  ）等。

  担任

  CAAI

  青年工作委员会秘书长（

  2020-2025

  ）、

  CCF

  西安秘书长（

  2020-2022

  ）、

  CCF YOCSEF

  西安主席（

  2021-2022

  ），

  IEEE Transactions on Evolutionary Computation

  、

  Expert Systems With Applications

  和

  IEEE Transactions on Emerging Topics in Computational Intelligence

  等期刊副编辑，

  Frontiers of Computer Science

  和

  CAAI Transactions on Intelligence Technology

  等期刊青年编委，

  BIC-TA 2016

  和

  ECOLE 2017

  的注册主席、

  CCF

  第六届大数据学术会议的出版副主席、

  IEEE CCIS2021

  组织委员会主席、首届

  CCF

  黄河论坛程序委员会副主席等。

