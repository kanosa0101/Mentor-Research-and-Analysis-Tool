bio_raw: '贾广，男，博士，教授，博士生导师，西电“华山学者”。

  1997年本科毕业于兰州大学物理学专业，2006于俄亥俄州立大学获得生物物理/医学影像博士学位。

  2017/02-至今：

  西安电子科技大学计算机科学与技术学院 教授、博士生导师、华山学者，

  美国

  路易斯安那州立大学物理与天文系兼职副教授

  2013/07-2017/02：美国路易斯安娜州立大学 物理

  与天文

  系医学物理专业  副教授

  2011/10-2013/07：美国俄亥俄州立大学  医学院放射科 助理教授、医学物理师、博士生导师

  2008/12-2011/06：美国俄亥俄州立大学 医学院放射科 讲师'
