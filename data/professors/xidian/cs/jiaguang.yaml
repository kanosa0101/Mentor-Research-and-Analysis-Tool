  个人简介

  贾广，男，博士，教授，博士生导师，西电“华山学者”。

  1997年本科毕业于兰州大学物理学专业，2006于俄亥俄州立大学获得生物物理/医学影像博士学位。

  2017/02-至今：

  西安电子科技大学计算机科学与技术学院 教授、博士生导师、华山学者，

  美国

  路易斯安那州立大学物理与天文系兼职副教授

