bio_raw: '鲍亮，男，工学博士。华山学者特聘教授，博士生导师。

  在西安电子科技大学获得本科、硕士和博士学位，现任职于西安电子科技大学科学与技术学院。美国加州大学戴维斯分校计算机系访问学者，IEEE、ACM、中国计算机学会会员。主要研究方向为大数据分析（big
  data analytics）和AI工程（artificial intelligence engineering）。近年来主持和参与国家级、省部级项目20余项，主持企业联合'
