  个人简介

  Personal Profile

  教授，博士生导师。1988――1992年，武汉大学攻读学士学位，专业：计算机应用； 1998――2004年，西安交通大学攻读硕士、博士学位，研究方向为高速网络及多媒体技术。同时兼职于西安交大捷普网络科技有限公司，从事网络设备及安全产品的研发工作；
  2006年――今，于西安电子科技大学计算机科学与技术学院从事教学科研工作。主要研究方向为嵌入式系统与信息安全、人工智能及应用。近年来，主持或参与国家重点研发计划、各类自然科学基金；在国内外期刊、国际会议发表科研论文70余篇，其中SCI检索40余篇；获得授权发明专利10多项，多项实现了成果转化。所承担的自主可控打印核心模块、安全增强复印机、电子系统抗辐射加固建模与仿真等项目均属于我国重点支持领域，研究成果为关键技术的自主可控，以及某些领域的卡脖子问题探索了可行技术途径。在访问控制及区块链方面取得了突破性成果，首次讨论了访问控制模型的匿名性、控制粒度等问题，给出了形式化定义，并提出了相关的量化评价方法，研究成果在信息安全顶刊TDSC以及CCF推荐期刊C&S等公开发表。

