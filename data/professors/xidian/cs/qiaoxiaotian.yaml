  个人简介

  Personal Profile

  乔晓田，副教授、博士生导师。2013年和2016年在浙江大学分别获得学士学位和硕士学位，2020年在香港城市大学计算机科学专业获得博士学位，曾在美国Adobe
  Research、香港城市大学、中科院自动化所（北京）等机构从事研究工作，

  担任IJCAI资深程序委员和BMVC领域主席。

  主持承担了国家自然科学基金、广东省基础与应用研究基金、陕西省重点研发计划（联合中煤科工）、中国计算机学会产学合作基金（联合阿里巴巴）、中兴通讯产学研合作基金（联合上海申启纪元）、以及行业领军企业（中石油、国家电网等）项目多项，相关论文发表于TPAMI、IJCV、TVCG、SIGGRAPH、ACM
  MM、NeurIPS、CVPR、ICCV、AAAI等CCF-A类期刊/会议，并长期承担顶级学术会议的程序委员，获华山学者人才基金引才专项奖励。

  招生简介：

  主要研究领域为多媒体数据智能分析和可视化，涉及复杂场景感知与理解（Perceptive AI）、创意内容设计与生成（Generative AI）、多模态大模型优化（Efficient
  AI）等内容，旨在推动人工智能与各行业各领域的深度融合。

