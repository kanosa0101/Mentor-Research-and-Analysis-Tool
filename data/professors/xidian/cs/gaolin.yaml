  个人简介

  高琳，女，博士，二级教授，博士生导师，西安电子科技大学“华山学者”领军教授。计算机学会理事，计算机学会生物信息学专业委员会主任，

  人工智能学会理事，

  人工智能学会生物信息学与人工生命专业委员会副主任, 运筹学会计算生物信息学分会副理事长。陕西省学位委员会学科评议组第三届成员, 西安电子科技大学第八界学术委员会委员。国家科学技术奖评审专家，国家自然基金委员会信息学部评审组专家，科技部重大专项评审组专家。《

  西安电子科技大学学报》第十三届编辑委员会编委。2010年受邀参加基金委

  “

  生物信息学重大基础科学问题及关键技术

  ”

  第51期双清论坛做报告，2022

  年受邀参加基金委“免疫力数字解码”第319

  期双清论坛做报告。

  西安交通大学计算数学专业理学学士，西北大学计算数学专业理学硕士，西安电子科技大学雷达信号处理国家重点实验室电路与系统专业工学博士。2004-2005年受CSC资助赴加拿大University
  of Guelph 做访问学者；2015年5月访问University of Michign大学，2016年3-4月作为高级研究学者，受CSC“博士生导师短期出国交流项目”资助，访问University
  of Pennsylvania，在此期间，访问了哈佛医学院。

  研究成果获陕西省自然科学技术一等奖（2019，2025），陕西省自然科学技术二等奖，电子学会自然科学二等奖等，单细胞环状伪轨迹推断算法入选

  “2019

  年中国生物信息学十大算法与工具

  ”

