bio_raw: '个人简介

  Personal Profile

  张晨曦，西安电子科技大学计算机科学与技术学院，副教授，工学博士，校华山人才系列“菁英副教授”。

  于复旦大学获工学博士学位，

  曾在华为公司从事云计算软件开发工作，曾在微软亚洲研究院进行学术实习。

  主要研究方向包括

  智能化运维、

  云原生、微服务、软件测试等。近年来在ICSE、FSE、ASE、ISSRE等软件工程国际旗舰会议发表论文10余篇。担任TOSEM、EMSE、JSS、软件学报等期刊审稿人，ISSTA、ICSE、ISSRE、SANER、ICPE等国际会议程序委员会委员。主持和参与绿盟科技、

  中科院软件所、陕西省科技计划

  、阿里巴巴

  、华为

  、微软亚洲研究院、字节跳动、腾讯等多项'
