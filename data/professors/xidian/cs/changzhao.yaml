bio_raw: '个人简介

  Personal Profile

  常曌，西安电子科技大学副教授，硕士生导师。美国犹他大学计算机博士，曾在美国微软研究院、阿里巴巴达摩院做研究实习生。主要研究方向为数据库系统与数据安全，在ACM
  SIGMOD、VLDB、IEEE ICDE、IEEE TKDE、IEEE TDSC、IEEE TIFS等

  主流学术

  会议和期刊上发表论文10余篇。

  主持了

  国家自然科学基金青年项目

  ，核心参与了国家重点研发计划、国家自然科学基金重点国际

  (

  地区

  )

  合作与交流项目等。

  常年招收

  计算机科学与技术、电子信息

  等方向硕士生与学有余力的本科实习生，参与数据安全、加密数据库等方向'
