  个人简介

  Personal Profile

  陆旭，男，工学博士，主要从基于形式化方法的程序验证以及智能规划等方面的研究和应用工作。于2017年在西安电子科技大学获得计算机应用技术专业博士（导师：段振华教授

  ）学位。博士毕业后留校任教，现为西安电子科技大学副教授，硕士生导师

  ，校2018级本科生导师，陕西省重点科技创新团队（安全攸关智能软件创新团队）、校计算理论与技术研究所骨干成员。

  主持国家自然科学基金面上项目1项（在研），青年科学基金1项（结题），中国博士后科学基金

  特

  别资助项目1项（在研），面上项目1项（结题），

  中央高校基本科研业务费资助项目新教师创新基金1项（在研），作为核心或重要人员先后参与国家自然科学基金应急管理项目1项（结题），面上项目1项（结题），青年科学基金项目1项（结题）。以第一作者发表高水平论文多篇，主要发表在CCF
  A类期刊TKDE，中科院一区期刊TIFS、ESWA、Information Sciences，CCF A类会议AAAI、IJCAI、ASE，CCF B类、理论计算机科学著名国际期刊TCS以及国内著名期刊软件学报。CCF形式化方法专委会执行委员，获得西安电子科技大学优秀博士学位论文奖，应邀担任AAAI会议、软件学报审稿人。

  实验室硕士、博士名额充足，请有意向的同学随时联系'
