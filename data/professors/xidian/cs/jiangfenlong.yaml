  个人简介

  Personal Profile

  蒋汾龙，华山准聘副教授，协同智能系统教育部重点实验室（COIS）骨干成员，分别于2017年和2022年获西安电子科技大学工学学士和博士学位，2023年起留校任教，主要从事空天遥感信息智能解译、深度学习理论与优化方法、无人集群智能博弈与测试评估等方向的研究。近年来，在IEEE
  TGRS、IEEE TIP、IEEE TNNLS、CVPR等国际高水平期刊和会议发表论文30余篇，相关成果被引用1000余次，申请及授权国家发明专利4项；主持国家自然科学基金、某科技委重点项目课题、陕西省自然科学基金等多项国家级、省部级科研项目，并作为核心骨干参与多项国家重大工程与国家自然科学基金重点项目，部分成果已成功在中航工业、中国电科等重点科研院所及华为、阿里巴巴等龙头科技企业转化应用；受邀担任IEEE
  TGRS、IEEE TNNLS、PR、AAAI、ACM MM等国际期刊和会议审稿人。

  成果清单请参考谷歌学术：https://scholar.google.com/citations?user=OsF11PIAAAAJ&hl=zh-CN

  招生信息：

  招生专业为：081200计算机科学与技术、085404 计算机技术

  2027级计划招收推免生1位，欢迎各位推免 / 统考生积极联系 fljiang@xidian.edu.cn

  招生要求：

  1. 兴趣与本人研究方向匹配，有一定深度学习理论与计算机视觉应用基础

  2. 具备良好的主动交流意识与团队协作精神

  3. 具备明确的目标导向意识与内在驱动力

  4. 能够高效使用先进AI工具、搜索引擎、开源资源等解决实际问题

  5. 具备以下能力：

  Python语言编程与算法设计能力

  学术论文写作与技术文档整理能力

  方案表达的图文设计与呈现能力（Visio、Origin、Matplotlib等）

  课程信息：

