bio_raw: '个人简介

  Personal Profile

  蒋汾龙，华山准聘副教授，协同智能系统教育部重点实验室（COIS）骨干成员，分别于2017年和2022年获西安电子科技大学工学学士和博士学位，2023年起留校任教，主要从事空天遥感信息智能解译、深度学习理论与优化方法、无人集群智能博弈与测试评估等方向的研究。近年来，在IEEE
  TGRS、IEEE TIP、IEEE TNNLS、CVPR等国际高水平期刊和会议发表论文30余篇，相关成果被引用1000余次，申请及授权国家发明专利4项；主持国家自然科学基金、某科技委重点项目课题、陕西省自然科学基金等多项国家级、省部级'
