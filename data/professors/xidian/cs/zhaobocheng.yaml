  Personal Profile

  赵博程

  博士、准聘副教授、研究生导师、中国图像图形学会(CSIG)人机交互专委委员。2011年、2014年在西北工业大学获得学士、硕士学位。2020年在中国科学院自动化研究所获得博士学位目前主要从事人机交互、文字风格模仿学习、无人机智能化、集群智能优化等方面的研究。先后参与多项中科院先导项目、科技部重点研发计划、科技委重大项目、国家重点研发计划重点专项、陕西省自然科学基础研究计划一般项目、中国博士后基金面上资助等科研项目10余项。近年来在Pattern
  Recognition、AAAI、ICASSP、ICPR、IEEETMM等知名国际期刊/会议发表多篇论文。

