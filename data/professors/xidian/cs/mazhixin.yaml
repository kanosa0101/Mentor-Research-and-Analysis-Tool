  基本信息

  马志欣　博士，副教授

  硕士生导师

  学科：计算机科学与技术

  单位：计算机科学与技术学院

  联系方式

  通信地址：西安电子科技大学160信箱

  电子邮箱：mzx@xidian.edu.cn

  办公地点：南校区网安大楼1211室 / 广州研究院求真楼A715

  个人简介

  2022年9月至今在西安电子科技大学广州研究院未来计算中心双跨任教

  2016年至2017年在美国UCSD访学交流15个月

  2006年7月至今在西安电子科技大学计算机科学与技术学院任教

  2006年在西安电子科技大学获计算机应用技术专业工学博士学位

  1999年在西安电子科技大学或计算机系统结构专业工学硕士学位

  1993年在西安电子科技大学或计算机科学与技术专业工学学士学位

  IEEE Member, ACM Member.

  主要研究方向

  主要研究方向：计算机系统结构，嵌入式系统与智能控制，智慧农业与物联网，网络与多媒体技术。

  应用研究优势在软、硬件结合系统设计领域。

  目前主要负责广研院未来计算中心智能媒体与数据工程实验室及自主可控计算系统联合实验室的科研工作。承担的纵向科研有主持省市技术攻关项目等，横向科研涉及信创计算硬件、软件系统设计，智慧农业，工业及消费智能控制设备等领域。

