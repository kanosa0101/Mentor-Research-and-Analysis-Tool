bio_raw: '个人简介

  Personal Profile

  杨延华

  ，博士，副教授，博士生导师。主要研究方向为

  机器学习、计算机视觉和

  多模态智能信息推理。主持国家自然科学基金青年项目1项，面上项目2项，教育部联合基金项目1项以及陕西省重点产业创新链重点项目1项，

  作为核心骨干成员参与

  科技部项目-重点研发计划、国家自然科学基金重点项目和装发基础加强项目等。作为核心团队成员入选2022年陕西省科技创新团队。

  在相关领域主流期刊和学术会议发表论文

  20余篇，包括IEEE

  T-PAMI、

  T-IP、T-MM及Pattern Recognition等国际期刊和ICCV、AAAI、SIGIR、IJCAI等CCF A类国际顶级会议。担任多个国际期刊和国际会议的审稿人，如IEEE
  T-CYB、NEUROCOMPUTING、CVPR、AAAI、IJCAI等。'
