bio_raw: '个人简介

  Personal Profile

  胡宇轩

  ，“华山学者”领军（培育）教授，博士生导师

  主持国家级青年人才项目、教育部中央高校青年教师

  科研创新能力支持项目

  研究方向：生物医学数据挖掘、细胞通讯与组织架构、单细胞与空间组学

  2027年拟招收多名博士生、硕士生、本科生研究助理

  主要从事

  “细胞交互智能解析与数字器官构建”等计算机与生命医学交叉研究

  ，为癌症靶向/免疫（联合）疗法研发提供算法工具。研究成果以

  第一

  或通讯（含共同）作者

  发表于

  Nature/Science

  子刊

  《Nature Methods》

  (2024)

  、

  《Science Advances

  》

  (2021)

  、

  《Nature Communications》

  (2019)

  ，

  以及领域著名期刊《Advanced Science》(2024)

  。

  指导博士生/硕士生发表Nature子刊《Nature Commmunications》(2026)、《PLoS Computational Biology》(2026)

  。

  获2025年度陕西省自然科学奖一等奖（序2，已公示）

  、

  ACM SIGBIO China分会新星奖（每年各领域仅2人获奖）、校级优秀教师荣誉称号等。

  任Frontiers of Computer Science (CCF-B)青年编委，Nature/Science子刊等审稿人。

  代表性科研成果：

  （1）

  CytoCommunity算法：

  入选《Nature Methods》主页4篇精选（Featured）文章之一；是首个对单细胞空间图谱可以同时做无监督和弱监督学习的计算工具，能够在可变空间尺度上发现条件特异性的细胞邻域及其协作模式，为解析肿瘤-免疫互作机制提供分析工具；是

  西电首次

  以第一单位在“方法学”顶级期刊《Nature Methods》发表论文。

  （2）

  HRCHY-CytoCommunity算法：

  实现组织空间结构的精细层级划分，定义组织区室（Tissue Compartment）和细胞邻域（Cellular Neighborhood）层级结构，为解析“细胞社会”提供算法工具。

  （3）

  CytoTalk算法：

  被国际同行评价为“细胞通讯分析”代表性方法之一，入选国际顶级综述期刊《Nature Review Genetics》单细胞数据分析专家推荐方法；是

  西电首次

  以第一单位在Science子刊《Science Advances》发表论文。

  （4）

  Driver2Comm

  算法

  ：

  首次提出Intrinsic-Extrinsic (IE) pathway概念，将癌症驱动基因与肿瘤微环境细胞间通讯事件关联起来，为理解肿瘤如何作为一个复杂生态系统提供新视角，并为“靶向-免疫”联合疗法提供了潜在线索。

  （5）

  OptiCon算法：

  实现癌症联合疗法靶标的从头识别，已在美国费城儿童医院预临床研究中获得成果转化应用。

  获ACM SIGBIO China分会新星奖（每年各领域仅2人获奖）、校级优秀教师荣誉称号等。

  完整论文

  列表详见

  https://scholar.google.com/citations?user=SWlJrycAAAAJ&hl=zh-CN

  ，算法实现及软件见GitHub主页

  https://github.com/huBioinfo

