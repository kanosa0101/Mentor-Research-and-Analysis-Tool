  胡宇轩

  ，“华山学者”领军（培育）教授，博士生导师

  主持国家级青年人才项目、教育部中央高校青年教师

  科研创新能力支持项目

  研究方向：生物医学数据挖掘、细胞通讯与组织架构、单细胞与空间组学

  2027年拟招收多名博士生、硕士生、本科生研究助理

  主要从事

  “细胞交互智能解析与数字器官构建”等计算机与生命医学交叉研究

  ，为癌症靶向/免疫（联合）疗法研发提供算法工具。研究成果以

  第一

  或通讯（含共同）作者'
