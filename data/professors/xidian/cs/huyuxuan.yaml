research_direction_raw: 研究方向、Research Focus、社会兼职、Social Affiliations、（1）细胞通讯建模（Cell-Cell
  Communication Modeling）：针对细胞通讯这一基础科学问题、基于单细胞多组学数据、利用图挖掘与机器学习等技术、定义并识别细胞通讯模式、如构建细胞通讯信号转导网络等。、（2）组织架构解析（Tissue
  Architecture Discovery）：不同细胞在组织或器官中依据某种“未知的规则”交流协作、构成组织细胞邻域（tissue cellular neighborhood）、进而实现整个组织或器官的功能。因此、组织细胞邻域的准确识别是深入认识生命系统的重要基础科学问题。我们基于空间多组学数据、利用深度学习等前沿人工智能技术、数字解码组织的空间构成规则。、（3）肿瘤免疫的量化分析（Quantitative
  Analysis of Tumor Immunity）：利用上述细胞通讯建模和组织架构解析等计算工具、量化肿瘤患者免疫力、识别肿瘤诊断与预后的标志物、以及联合免疫疗法的潜在靶点。、2026.06
