bio_raw: '沈沛意：男，1969年10月出生。籍贯：浙江绍兴。获得双博士学位（英国巴斯大学，中国西安电子科技大学），和双博士后经历（英国巴斯大学，新加坡国立大学）。在SCIENCE
  IN CHINA, IEEE PAMI 和 IEEE TVCG 等杂志和会议发表论文30余篇。完成和主持国家863项目、国家重大科技项目、自然科学基金项目、中法合作项目、陕西省13115重大科技项目、无锡530归国人员创业（A类）等多项相关课题。曾任世界500强企业安捷伦科技（原惠普）（Agilent
  Technologies）高级工程师/副教授（美国，英国，新加坡和马来西亚）、英国撒里大学（Univ. of Surrey）信号处理研究中心（CVSSP）研究员（RESEARCH
  FELLOW）。现为西安电子科技大学教授、IEEE 会员（MEMBER）、中国计算机学会（陕西省计算机学会）。

  人物专访：

  http://news.xidian.edu.cn/view-22507.html

  相关链接：

  http://bbs.xidian.edu.cn/viewthread.php?tid=50784'
