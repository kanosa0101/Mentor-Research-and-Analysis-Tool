  招生信息：

  招生专业为计算机科学与技术（博士生，学术型硕士研究生）和电子信息（专业型硕士研究生）

  每年招收人数1~2人，欢迎校内外保研、优研以及统考学生报考或咨询。

  热爱科研，具有独立思考能力，数学功底好、编程能力强优先。

  同时欢迎对计算机视觉有兴趣的本科生进组实习交流！'
