  个人简介

  博士、副教授，博士生导师。2019 年于西安电子科技大学获工学博士学位，2020年1月起在西安电子科技大学计算机科学与技术学院任教。现担任西安市大数据与视觉智能关键技术重点实验室副主任、

  CCF高级会员、CCF YOCSEF西安AC委员。主要研究方向为计算机视觉、深度学习、图像增强和人体行为/手势识别。近年来在 International Journal
  of Computer Vision（CCF A类，中科院一区）、IEEE Trans. on Cybernetics（CCF B类、中科院一区）、Trans.
  on Multimedia （CCF B类、中科院一区）、Trans. on Circuits and Systems for Video Technology（CCF
  B类、中科院一区）、 ICCV （CCF A类会议）、AAAI（CCF A类会议）等国际顶级期刊/会议上发表论文40余篇，其中一作/通讯30篇。主持和参与国家级及省部级项目10余项。受邀担任Pattern
  Recognition、IEEE T-MM、T-CSVT、T-ITS、Neurocomputing、CVPR、ICCV、AAAI、ECCV、ICME等国际顶级期刊和会议审稿人。入选

  2025年度陕西高校优秀青年人才支持计划，获

  2022/2020 ACM China新星/优博奖、2021年度中国电子学会优秀博士论文（全国26人）、2022年度陕西省计算机学会科技进步二等奖（排名第2）、2021年

  陕西省

  计算机学会“计算机领域优秀青年专家”、2020年（首届）陕西省

  计算机学会优秀博士论文（全省10人)等荣誉称号；获得

  2016、2017连续两届Chalearn国际大规模独立手势识别竞赛冠军及第十届中国大学生服务外包创新创业大赛创业实践类一等奖。指导学生获得MiGA-IJCAI微手势及微表情识别竞赛亚军、季军各一项，ICPR
  2024 Multi-modal Action Recognition冠军、A

  AAI 2024 Multi-modal Learning for Audio-driven Talking Head Generation冠军、第九届中国国际“互联网+”大学生创新创业大赛陕西赛区省级银奖、

  中国大学生服务外包创新创业大赛全国一等奖等多项奖励。

  研究方向：

  手语识别与生成

  人体行为/手势识别

  恶劣天气下图像增强

  跨模态面部/手语动画生成

  图像风格迁移'
