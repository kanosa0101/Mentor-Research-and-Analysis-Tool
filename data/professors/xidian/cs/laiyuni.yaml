bio_raw: '个人简介

  /

  Personal Profile

  赖裕妮，

  西安电子科技大学华山学者

  特聘教授

  ，博士生、硕士生导师，国家级青年人才项目（海外）获得者。2025年获得香港理工大学博士学位，师从Kai Zhou教授。2025-2026年，在香港理工大学从事博士后工作，合作导师为Bin
  Xiao教授（IEEE Fellow）及

  Kai Zhou教授。2026年加入西安电子科技大学。

  长期从事

  人工智能安全

  及

  可证明防御模型

  的研究，聚焦于AI大模型及图深度学习模型安全性问题，主要研究内容为AI大模型及图深度学习模型的

  安全脆弱性评估、攻击对抗经验防御，和可证明鲁棒防御模型

  。在相关领域发表CCF-A类及JCR/中科院一区论文10余篇，其中以第一作者身份发表包括IEEE S&P、ACM CCS、ICML、IEEE TIFS等安全及AI领域顶级会议及期刊9篇。长期担任AAAI、
  ICML、 AAMAS、 ICDM等多个顶级学术会议及IEEE TIFS、TKDD、 CIKM等期刊的审稿人 。

  我的研究兴趣主要围绕

  AI安全

  ，包括但不限于：

  图（Graph）基础模型的攻击及安全防御；

  AI 多模态大模型的攻击及安全防御；

  AI 智能体的攻击及安全防御；

  具身智能的攻击及安全防御；'
