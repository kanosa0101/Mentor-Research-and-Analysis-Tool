bio_raw: '个人简介

  Personal Profile

  个人简介

  李卓华，西安电子科技大学广州研究院华山特聘教授，博士生、硕士生导师。2017年于

  中国科学技术大学

  计算机科学与技术系获工学学士学位，2022年于

  香港中文大学

  计算机科学与工程系获哲学博士学位，师从

  John C.S. Lui

  教授（ACM Fellow，IEEE Fellow）。博士毕业后留校于

  先进网络与系统研究实验室（ANSRLab）

  从事博士后研究。曾赴

  微软亚洲研究院

  （合作导师：

  谢幸

  博士）与

  百度USA X-Lab

  （合作导师：

  韦韬

  博士）参与短期研究工作。2025年加入西安电子科技大学，现为

  计算理论与技术研究所（广州）

  成员，团队负责人为

  田聪

  教授。

  我的研究兴趣位于

  理论与系统的交叉领域

  ，致力于将严谨的理论方法应用于实际系统问题。当前主要方向包括但不限于：

  多臂赌博机算法（Multi-Armed Bandits）

  ：设计高效、稳健且具有理论保证的在线学习算法，广泛应用于计算机网络优化、推荐系统等领域。

  量子网络与量子计算

  ：探索量子计算对经典算法的加速潜力，研究量子网络协议与系统架构，推动新一代网络基础设施发展。

  系统安全与软件工程

  ：基于程序分析、测试、形式化验证和人工智能方法，研究实际软件系统中的漏洞检测与缓解机制，提升系统的安全性与可靠性。

  本人与海内外众多课题组保持良好往来，具体'
