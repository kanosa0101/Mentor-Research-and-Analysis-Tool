bio_raw: '赵鹏，计算机科学与技术学院教授，博士生导师。中国指挥与控制学会信息融合专委会常务委员，陕西省计算机学会软件工程专委会秘书长。西安交通大学计算机科学与技术专业学士、博士学位，新加坡南洋理工大学Research
  Fellow。目前主要从事边缘大模型/具身智能模型、模型轻量化及在线自适应、分布式智能计算等方面的研究工作。主持参与包括自然科学基金项目，国家重点研发计划，博士后基金一等资助项目等在内的多项研究课题。在相关领域先后发表国际一流会议、期刊论文70余篇，包括IEEE
  TMM, TCSVT,

  TIFS,

  TNNLS, TSC, TVT, ICCV, AAAI, INFOCOM, IJCAI等；授权发明专利十余项；获陕西高等学校科学技术一等奖，陕西高等学校科学技术研究优秀成果一等奖；指导学生获中国国际大学生创新大赛国家级金奖，“挑战杯”中国大学生创业计划竞赛国家级金奖等。'
