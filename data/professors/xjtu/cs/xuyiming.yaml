bio_raw: '西安交通大学青年优秀人才支持计划获得者，隶属于郑庆华院士团队，陕西省大数据知识工程重点实验室。弗吉尼亚大学（UVA）访问学者。主要从事图数据挖掘、自监督学习、异常检测、大语言模型等方面的研究工作，已在Science
  Advances、ICML、ICDE、AAAI、MM、DMKD、NN、ECAI及Engineering等

  国际顶级会议及期刊上发表CCF-A/B论文十余篇

  ，其中第一作者/学生第一作者10篇，授权发明专利五项。

  曾担任

  ICML、ICLR、

  NeurIPS

  、TKDE、KDD、AAAI、

  ACL

  等国际顶级会议及期刊审稿人。主持青年科学基金项目（C类），

  参与基金委

  原创探索计划项目、新一代人工智能国家科技重大专项、 国自然重大专项、国自然面上、 陕西省重点研发计划、杭州市人工智能重大科技创新项目计划等

  多项研究课题。

  研究兴趣

  大型语言模型：智能体自进化、LLM/智能体记忆、多智能体协作

  安全机器学习：异常检测、OOD 泛化

  可信机器学习：鲁棒性、因果推理、可解释性

  AI/ML+X：偷逃骗税检测

  欢迎感兴趣的研究生、本科生、远程实习生及同行专家学者交流合作。'
