bio_raw: '王子衡

  ，博士，西安交通大学电信学部计算机学院助理教授，隶属于董小社教授团队。

  学术研究：

  主要从事高性能计算、计算机体系结构等方面的研究工作；在TC、TPDS、TACO、PC、FGCS等国际期刊、会议中发表学术论文10余篇；担任TC、TPDS、CLUSTER、TCBB等期刊和会议的审稿人。

  研究方向：

  并行程序性能优化：包括CPU多核加速、GPU加速

  基于模型的大规模程序性能建模与自动调优：包含MPI建模与调优、I/O建模与调优

  高性能密码学：密码性能加速、密码部署方案研究

  高性能图形学：包括四叉树、KD树、R树等多种树形结构性能加速

  MLsys: 机器学习系统的性能加速

  人工智能应用：

  并行程序的MPI通信性能建模与参数自动调优

  并行程序的IO性能建模与参数自动调优

  招生名额：计算机学院：专业型硕士研究生

  本科并行计算指导

  ：

  欢迎大一、大二学生参加并行计算比赛，包括曙光先导杯、MCC、PAC、ASC，本人会进行直接指导，有意者请发邮件联系。

  教学与学生培养：

  研究基础是高性能计算技术，高性能计算本身上手难度不大，在C语言基础上，只需要掌握MPI、CUDA等的API函数即可。'
