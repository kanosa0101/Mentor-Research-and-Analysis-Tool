bio_raw: '郑庆华，浙江嵊州人，博士，教授，博士生导师。中国工程院院士，中国计算机学会会士，中国人工智能学会会士。教育部科技委学部委员，教育部计算与智能教学指导委员会主任（原大学计算机教学指导委员会），国家杰出青年科学基金获得者，国家自然科学基金创新群体负责人。

  长期从事知识工程研究，是该领域学术带头人，是大数据知识工程新领域开拓者之一。在

  IEEE TPAMI

  、

  TKDE

  、

  IJCAI

  等发表论文

  190

  余篇，出版《知识森林：理论、方法与应用》《大数据知识工程》等专著以及《知识工程的现代方法》人工智能

  101

  计划教材，主持国家

  863

  计划、国家科技支撑计划、核高基重大专项、国家自然科学基金重点、国家科技创新

  2030-

  “新一代人工智能”重大专项等

  40

  余项'
