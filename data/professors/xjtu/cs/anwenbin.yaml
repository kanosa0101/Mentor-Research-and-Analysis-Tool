bio_raw: '隶属于陕西省大数据知识工程重点实验室

  郑庆华院士团队

  ，入选西安交通大学青年优秀人才支持计划，新加坡南洋理工大学（NTU）访问学者。近年来在NeurIPS、CVPR、ACL、AAAI等国际顶级会议及期刊上发表CCF-A/B论文十余篇，授权发明专利五项，担任ICML、ICLR、CVPR、ACL、TNNLS等国际顶级会议及期刊审稿人，参与

  多项国家级项目，

  研究方向包括

  多模态大模型、

  弱监督学习、自然语言处理以及智慧教育。'
