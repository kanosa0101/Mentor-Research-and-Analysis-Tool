bio_raw: 罗敏楠，西安交通大学教授/博导，计算机科学与技术学院党总支书记。主要从事人工智能、社交网络多模态大数据分析与挖掘研究，发表IEEE TPAMI、NeurIPS、ACL、CVPR、ICLR等期刊和会议论文100余篇，获得2022年度陕西省自然科学一等奖、2022年度国家教学成果二等奖、2020年度中国自动化学会科学技术进步奖特等奖、2021年度王宽诚青年学者奖等，入选2018年度首届高校计算机专业优秀教师奖励计划、2023年度百度学术发布的全球首份AI华人女性青年学者榜。
