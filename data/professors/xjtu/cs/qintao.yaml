bio_raw: 西安交通大学计算机系教授，博士生导师，中国网络空间安全协会西安交通大学单位代表，美国马萨诸塞州立大学阿姆斯特分校、伍斯特理工学院访问学者，入选2026年度陕西省青年A类项目支持计划。主要研究方向包括社交网络用户行为分析与引导、网络舆情监管、高速网络流量测量与监控、网络安全大数据分析、移动互联网安全等。在IEEE
  TIFS、KBS、JNCA、ICC等重要学术期刊和会议上发表论文多篇，担任IEEE System Journal、JNCA 等多个知名期刊的审稿人，IEEE ACCESS、Information等多个期刊专刊的客座编辑。研究成果获得2008年度IEEE系统通信与集成唯一最佳论文奖，2010年度“信源通”优秀博士论文及西安交通大学优秀博士毕业生，2013年度陕西省科技进步一等奖，2023年陕西省教育厅高等学校优秀科研成果一等奖，2024年中国电子学会科技进步一等奖，2024年度西安交通大学学报优秀论文奖。
institutes:
- 计算机科学与技术学院
research_direction_raw: 关注与大数据驱动、的、网络安全研究、主要包括以下几点：、高速网络流量测量与监控、主要关注于加密网络流量识别、网络攻击行为检测、社交网络用户行为分析与引导、主要关注于社交网用户行为规律挖掘、影响信息加工、网络安全大数据分析、主要关注于开源情报分析、关注数据融合分析效能方法的提升、移动互联网安全、主要关注于移动互联网应用识别、应用安全分析
