bio_raw: '简介：

  隶属于陕西省大数据知识工程重点实验室郑庆华院士团队，入选西安交通大学青年优秀人才支持计划，美国卡耐基梅隆大学（CMU）访问学者。在IEEE TPAMI、IEEE
  TIP、ICLR、NeurIPS、AAAI等国际权威期刊和会议上发表论文30余篇，其中 2 篇入选 ESI 高被引/热点论文（第一作者），申请和授权专利多项。获陕西省优秀博士学位论文奖、西安自动化学会青年人才托举计划、徐宗本应用数学论文奖一等奖、西安交通大学优秀博士学位论文奖、ICCV
  2023 无人机视觉竞赛全球季军等荣誉。主持国家自然科学基金青年基金项目、科技创新 2030-“新一代人工智能”重大项目子课题、新一代人工智能国家科技重大专项子课题、博士后科学基金面上项目、人民网传播内容认知国家重点实验室开放课题、咪咕视讯校企合作项目等。

  研究方向：

  多模态理解与生成、高性能智能计算

  招生信息：

  招收机器学习、深度学习、计算机视觉方向的硕士研究生，欢迎计算机、软件、人工智能及相关专业的同学申报！'
