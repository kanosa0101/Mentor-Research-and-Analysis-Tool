title: 副教授
bio_raw: '张瑞华   副教授

  emai:ruihua_zhang@sdu.edu.cn;

  1）1987年—1991年，山东大学，电子工程系，本科/理学学士

  2）1991年—1994年，山东大学，电子工程系，研究生/理学硕士，曲铭海教授

  3）2003年—2007年，山东大学，信息工程与技术学院，研究生/工学博士，袁东风教授

  4）1994年—至今，山东大学，计算机科学与技术学院，教师

  招生意向

  学术型硕士研究生：每年招收2人；

  专业型硕士研究生：每年招收4人；

  研究方向

  主要研究领域为：无线传感器网络、物联网、可信计算、嵌入式系统、FPGA/CPLD应用开发等。

  讲授课程

  [1] 计算机组织与结构；

  [2] 嵌入式系统原理与接口技术；

  [3] 数字逻辑；

  [4] 计算机体系结构；

  [5] 嵌入式系统课程设计；

  [6] 计算机组织与结构课程设计；

  承担项目

  参与或主持的科研项目：

  [1] 无线多媒体传感器网络可信问题的研究，山东大学自主创新基金，项目编号：2012ZD011；

  [2] 海洋大气气溶胶激光雷达产品标准化设计，国家海洋局海洋公益性行业科研专项，项目编号：201205036-04；

  [3] 嵌入式可信网络关键技术研究，国家自然科学基金，项目编号：61070022；

  [4] 面向物联网的嵌入式可信网络关键技术研究，山东省自然科学基金，项目编号：2010FM015；

  [5] 应用于开放平台TD业务的游戏开发环境测试，863软件重大专项子课题，项目编号：09ZX03001；

  [6] 无线智能终端多媒体技术平台研发，863软件重大专项子课题，项目编号：09ZX01039；

  [7] 基于后向恢复的异构分布式系统容错技术的研究与实现，山东省自然科学基金，项目编号：Z2008G03；

  [8] 嵌入式分布系统可信性研究，国家自然科学基金，项目编号：90718032；

  [9] 具有自主知识产权的嵌入式系统研究及开发，山东省科技厅攻关计划，项目编号：2005GG1101001；

  [10] 税控燃油加油机控制器专用集成电路（ASIC）实现，山东省科技厅攻关计划，项目编号：2004GG2201109；

