bio_raw: '冯好娣 教授

  山东大学计算机科学与技术学院

  山东省青岛市即墨区滨海公路72号

  邮编：266237

  fenghaodi@sdu.edu.cn

  1990.9 - 2000.6 山东大学运筹学专业：本科、硕士、博士；

  2000.7-2003.10 香港城市大学计算机专业：博士；

  2014.9-2015.9 美国佐治亚大学(theUniversity of Georgia): 访问学者

  2003.12-2009.11 山东大学副教授

  2009.12-山东大学教授

  荣获：山东大学青年教师讲课比赛二等奖；山东省自然科学三等奖（3）；高校计算机专业优秀教师奖励计划；

  招生意向

  2人/年

  研究方向

  生物信息学；计算理论与智能算法。目前侧重基于DNA/RNA测序的数据分析。

  讲授课程

  本科生课程：算法设计与分析、计算理论

  研究生课程：高级算法设计

  承担项目

  国家自然科学基金2项 主持

  山东省自然科学基金1项 主持

  山东省优秀中青年科学家奖励基金1项 主持

  山东省其它科技专项1项 主持

  山东大学自主创新基金1项 主持

