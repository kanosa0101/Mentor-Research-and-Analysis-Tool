bio_raw: '姜海涛   教授

  htjiang@sdu.edu.cn

  2001-2011 山东大学计算机科学与技术学院 本科 硕士 博士。

  2009-2011 美国蒙大拿州立大学 联合培养博士

  2012.01-2014.08 山东大学计算机科学与技术学院 讲师

  2014.09-2020.12 山东大学计算机科学与技术学院 副教授

  2021.1至今 山东大学计算机科学与技术学院 教授

  招生意向

  2

  研究方向

  算法/计算生物学。主要研究计算生物方面的基因组序列的重组、分析、比较相关问题；研究求解它们有多难，如何更快地求解它们，如何更好地求解它们，最终给出明确的量化算法性能的指标
  (包括近似算法的近似性能比、参数算法及精确算法的时间复杂度等)。

  讲授课程

  《算法设计与分析》、《运筹学》

  承担项目

  1.基因组比较中三个组合问题的算法研究,NSFC青年基金。

  2.基因组断点距离比较算法与复杂性，山东省自然科学青年基金。

  3.基因组重组比较算法研究,中国博士后科学基金特别资助。

  发表论文

  1.Haitao Jiang, Daming Zhu: A 14/11-approximation algorithm for sorting by short
  block-moves. SCIENCE CHINA Information Sciences 54(2): 279-292 (2011)

  2.Haitao Jiang, Binhai Zhu, Daming Zhu: Algorithms for sorting unsigned linear genomes
  by the DCJ operations. Bioinformatics 27(3): 311-316 (2011)

  3.Haitao Jiang, Daming Zhu, Binhai Zhu: A (1+ε)-approximation algorithm for sorting
  by short block-moves. Theor. Comput. Sci. 439: 1-8 (2012)

  4.Haitao Jiang, Chunfang Zheng, David Sankoff, Binhai Zhu: Scaffold Filling under
  the Breakpoint and Related Distances. IEEE/ACM Trans. Comput. Biology Bioinform.
  9(4): 1220-1229 (2012)

  5.Haitao Jiang, Binhai Zhu, Daming Zhu, Hong Zhu: Minimum common string partition
  revisited. J. Comb. Optim. 23(4): 519-527 (2012)

  6.Haitao Jiang, Zhong Li, Guohui Lin, Lusheng Wang, Binhai Zhu: Exact and approximation
  algorithms for the complementary maximal strip recovery problem. J. Comb. Optim.
  23(4): 493-506 (2012)

  7.Bonnie Kirkpatrick, Yakir Reshef, Hilary Finucane, Haitao Jiang, Binhai Zhu, Richard
  M. Karp: Comparing Pedigree Graphs. Journal of Computational Biology 19(9): 998-1014
  (2012)

  8.Nan Liu, Haitao Jiang, Daming Zhu and Binhai Zhu, An improved approximation algorithm
  for scaffold filling to maximize the common adjacencies. IEEE/ACM Transactions on
  Computational Biology and Bioinformatics, 10(4):905-913, July/August, 2013. (Conf
  version presented at COCOON''2013.)

  9.Haitao Jiang, Haodi Feng, Daming Zhu: An 5/4-Approximation Algorithm for Sorting
  Permutations by Short Block Moves. ISAAC 2014: 491-503

  10.Haitao Jiang, Binhai Zhu: A linear kernel for the complementary maximal strip
  recovery problem. J. Comput. Syst. Sci. 80(7): 1350-1358 (2014)

  11.Haitao Jiang, Jingjing Ma, Junfeng Luan, Daming Zhu: Approximation and Nonapproximability
  for the One-Sided Scaffold Filling Problem. COCOON 2015: 251-263

  12.Haitao Jiang, Lusheng Wang, Binhai Zhu, Daming Zhu: A factor-(1.408 + ε) approximation
  for sorting unsigned genomes by reciprocal translocations. Theor. Comput. Sci. 607:
  166-180 (2015)

  13.Haitao Jiang, Guohui Lin, Weitian Tong, Daming Zhu, Binhai Zhu: Isomorphism and
  similarity for 2-generation pedigrees. BMC Bioinformatics 16(S-5): S7 (2015)

  14.Nan Liu, Daming Zhu, Haitao Jiang, Binhai Zhu: A 1.5-Approximation Algorithm
  for Two-Sided Scaffold Filling. Algorithmica 74(1): 91-116 (2016)

  本人研究生从事的工作领域'
