title: 教授
bio_raw: '彭朝晖  教授、博士生导师

  pzh@sdu.edu.cn

  1999年本科毕业于山东大学计算机科学系，2003年硕士毕业于山东大学计算机科学与技术学院，2007年于中国人民

  大学信息学院获工学博士学位。2007年7月至今于山东大学计算机科学与技术学院任教，2007年10月至2009年12月在职从事博士后研究工作，2013年9月至2014年9月于伊利诺伊大学芝加哥分校从事公派学术访问。

  现任山东大学计算机科学与技术学院副院长、山东大学（青岛）公共（创新）实验教学中心主任、大数据管理与分析实验室主任、山东大学-电科金仓数据技术联合实验室主任、山东大学-浪潮科技数据要素治理研究中心主任，兼任CCF数据库专委执委、CCF大数据专委执委、山东省人工智能学会高等教育专委会主任、青岛市计算机学会副理事长。

  招生意向

  每年招收博士和硕士研究生（包括学术型和专业型）

  5

  名左右。

  研究方向

  长期从事数据库系统、数据挖掘、大数据分析领域研究工作，

  近年来在面向互联网大数据平台的智能分析与推荐、制造

  业时序

  大数据分析方法与系统

  、数据库管理系统查询优化

  等方向开展工作，

  并做出特色。在国内外知名学术期刊和会议发表论文

  5

  0余篇，申请发明专利

  20

  余项，获省部级科技进步奖

  5

  次。

  讲授课程

  主持专业核心课

  “数据库系统”入选首批国

  家级线下一流课程。荣获山东大学第八届青年教学能手、青年教师课堂教学比赛一等奖、“我最喜爱的老师”等荣誉称号，以第一完成人荣获山东省教学成果奖一等奖，荣获高校计算机专业优秀教师、宝钢优秀教师、青岛市教书育人先进个人、青岛高校教学名师、山东大学优秀教师等荣誉称号。

  主持课程：

  1.

  数据库系统、专业基础课、本科生

  2.

  大数据管理与分析、专业课、本科生

  3

  .

  大规模数据管理、专业课、研究生

  承担项目

  主持和参与国家科技支撑计划重点项目、国家自然科学基金项目、山东省重大科技创新工程项目、教育部产学协同育人项目、山东省教学改革重点项目等

  2

  0

  余项。

