  本人研究生从事的工作领域

  毕业研究生深受业界青睐，在华为、百度、腾讯、阿里等企业从事数据库和大数据研发工作，或在移动通信、电信、电网、金融等行业从事大数据分析工作，或承担政府和军队的信息化岗位工作。'
