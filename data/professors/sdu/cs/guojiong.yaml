bio_raw: '郭炅

  教授

  邮箱：

  jguo@sdu.edu.cn

  地址：

  山东省青岛市即墨区海滨路

  72号，计算机科学与技术学院N3-

  314

  教育工作经历：

  在电子科技大学、德国图宾根大学、德国耶拿大学分获计算机科学学士、硕士、博士学位。

  2009-2014年德国萨尔州大学教授、MMCI研究组组长，2010-2018年德国印度马普计算中心研究组长。

  研究方向：

  算法、计算复杂性、参数算法、计算社会选择学

  招生意向：

  每年

  1-2名博士生、1-2名硕士生

  授课：

  本科：离散数学、算法、运筹学；研究生：算法、优化理论和方法

  承担项目：

  德国科学基金委：核心化算法

  德国科学基金委：参数算法的平均情况分析

  国家自然科学基金：核心化算法在生物计算的应用

  国家自然科学基金：选举问题的参数算法

  国家自然科学基金：参数近似算法

  德国科学基金委

  /国家自然科学基金：多模态下的匹配问题

