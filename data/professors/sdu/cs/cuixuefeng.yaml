  科研兴趣

  我对发现和解决与日常生活息息相关的计算问题有着浓厚的兴趣。这包括设计和应用深度学习和并行算法来攻克生物信息难题。我近期的主要研究工作包括以下生物信息问题：

  l

  基于冷冻电镜的分子结构检测

  l

  基于多肽疫苗的新抗原设计

  l

  基于宏基因组大数据的抗生素抗性基因挖掘

  教学课程

  l

  生物信息学

  l

  并行算法设计与实践

