bio_raw: '于东晓

  教授、博士生导师。

  邮箱：dxyu@sdu.edu.cn。

  学习与工作经历：

  2002.9~2006.6 山东大学信息与计算科学专业本科生，获理学学士学位

  2006.9~2009.7 山东大学运筹学与控制论专业硕博连读研究生

  2009.9~2014.11 香港大学计算机科学专业博士研究生，获哲学博士学位

  2014.6~2016.1 香港大学博士后

  2016.2~2018.4 华中科技大学计算机科学与技术学院，副教授

  2018.5~至今 山东大学计算机科学与技术学院，教授

  2021.7~至今 山东大学计算机科学与技术学院，副院长

  2021.8~至今 山东省数链融合技术创新中心，执行主任

  研究领域介绍：

  研究领域包括边缘智能、物联网、数据挖掘。主要聚焦于面向未来计算机网络与计算机系统的智能计算技术，形成了以分布式计算、物联网与边缘计算、分布式学习、区块链、图数据挖掘等为主要研究方向的科研体系。

  教学与科研成果情况：

  近年来发表学术论文100余篇，获得国际会议最佳论文奖4项（IEEE IPCCC 2020、PDCAT 2020、CsoNet 2019、IIKI 2019）、最佳论文提名奖2项（WASA
  2019、IEEE MASS 2021）。获山东省自然科学二等奖1项。担任JCSS和IEEE TWC编委、ComCom领域编辑，曾担任CCF C类会议WASA
  2020程序委员会主席和IEEE WCNC 2020程序委员会领域主席，并且是多个国际顶级会议INFOCOM （2017~2020）、ICDCS （2019,
  2022）、KDD 2022、WSDM 2022、CIKM 2022、Globecom（2020~2022）等的程序委员会委员。

  教学方面，获山东省级教学成果奖一等奖1项，主持教育部产学合作协同育人项目1项，参与山东省研究生教改项目1项、山东省一流本科课程建设1项，获“山东大学青年教学能手”称号，参与编写英文教材2部。

  承担科研项目情况：

  主持重点研发计划课题、自然科学基金等国家和省部级项目10余项。'
