bio_raw: '成秀珍   教授

  IEEE Fellow

  招生意向

  博士研究生4-6名，硕士研究生8-10名

  研究方向

  Privacy-Aware Computing; Wireless and Mobile Security; Fog Computing; Mobile Health
  and Safety; Cognitive Radio Networking; Algorithm Design and Analysis.

  讲授课程

  承担项目

  发表论文

  (1) Jia, Yizhen; Xiao, Yinhao; Yu, Jiguo; Cheng, Xiuzhen; Liang, Zhenkai; Wan, Zhiguo,
  A Novel Graph-Based Mechanism for Identifying Traffic Vulnerabilities in Smart Home
  IoT, IEEE INFOCOM 2018.

  (2) Wang, Shengling; Huang, Jianhui; Li, Luyun; Ma, Liran; Cheng, Xiuzhen, Quantum
  Game Analysis of Privacy-Leakage for Application Ecosystems, ACM Mobihoc 2017.

  (3) Li, Hong; He, Yunhua; Sun, Limin; Cheng, Xiuzhen; Yu, Jiguo, Side-Channel Information
  Leakage of Encrypted Video Stream in Video Surveillance Systems, IEEE INFOCOM, 2016.

  (4) Le, Yuan; Ma, Liran; Cheng, Wei; Cheng, Xiuzhen; Chen, Biao, A Time Fairness-Based
  MAC Algorithm for Throughput Maximization in 802.11 Networks, IEEE TRANSACTIONS
  ON COMPUTERS, 2015, 64(1): 19-31

  (5) Liang, Qilian; Cheng, Xiuzhen; Huang, Scott C. H.; Chen, Dechang, Opportunistic
  Sensing in Wireless Sensor Networks: Theory and Application, IEEE TRANSACTIONS ON
  COMPUTERS, 2014, 63(8): 2002-2010

  (6) Li, Wei; Cheng, Xiuzhen; Jing, Tao; Cui, Yong; Xing, Kai; Wang, Wendong, Spectrum
  Assignment and Sharing for Delay Minimization in Multi-Hop Multi-Flow CRNs, IEEE
  Journal on Selected Areas in Communications (JSAC), 2013, 31(11): 2483-2493

  (7) Hu, Chunqiang; Zhang, Nan; Li, Hongjuan; Cheng, Xiuzhen; Liao, Xiaofeng, Body
  Area Network Security: A Fuzzy Attribute-Based Signcryption Scheme, IEEE Journal
  on Selected Areas in Communications (JSAC), 2013, 31(9): 37-46

  (8) Wang, Shengling; Liu, Min; Cheng, Xiuzhen; Li, Zhongcheng; Huang, Jianhui; Chen,
  Biao, Opportunistic Routing in Intermittently Connected Mobile P2P Networks, IEEE
  Journal on Selected Areas in Communication, 2013, 31(9): 369-378

  (9) Hu, Chunqiang; Cheng, Xiuzhen; Zhang, Fan; Wu, Dengyuan; Liao, Xiaofeng; Chen,
  Dechang, OPFKA: Secure and Efficient Ordered-Physiological-Feature-based Key Agreement
  for Wireless Body Area Networks, IEEE INFOCOM 2013.

  (10) Cheng, Wei; Zhang, Nan; Cheng, Xiuzhen; Song, Min; Chen, Dechang, Time-Bounded
  Essential Localization for Wireless Sensor Networks, IEEE-ACM TRANSACTIONS ON NETWORKING,
  2013.4, 21(2): 400-412

  本人研究生从事的工作领域'
