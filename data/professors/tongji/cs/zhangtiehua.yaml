bio_raw: '张铁华，博士，分别在吉林大学，

  The University of Melbourne，Swinburne University of Technology

  获得计算机科学学士，硕士和博士学位。其在工业界及学术界有着丰富的产学研经验，曾任澳大利亚

  Our Community Group

  系统研发高级工程师，日本KDDI研究院访问科学家，澳大利亚

  Macquarie University

  博士后研究员，蚂蚁集团国际风险质量算法架构/负责人。荣获上海市领军（海外）人才、上海市科技青年

  35

  人引领计划、上海市浦东明珠菁英人才等荣誉。

  主要研究领域包括包括大小模型协同、图学习及关系挖掘、边缘智能模型应用及服务等。已在国际重要期刊及会议发表六十余篇研究论文，包括

  ACM TOSEM、IEEE IoT-J、IEEE TMC、IEEE TAI、NeurIPS、ICDE、ACM MM、ICSOC

  等，同时拥有美国/新加坡/日本/中国十余项国际/国内专利。在多个国内外学术组织任职，担任

  CCF

  数字金融分会执行委员、

  CCF

  分布式专委会委员、

  IEEE METAVERS

  工业及应用主席、

  SCI

  期刊

  Mathmatics

  客座编委、

  SCI

  期刊

  Sensors

  客座编委等，并长期担任

  TPAMI、TNNLS、TII、WWW、ICML

  等领域重要期刊及会议审稿人及

  TPC

  。先后主持与参与了包括国家自然科学基金青年项目，上海自然科学基金项目，蚂蚁科研探索基金项目，澳大利亚

  ARC Discovery/Linkage

  等在内的十余个国际国内项目。研究曾获

  Swinburne Outstanding Thesis Award, Research Excellence Award (HDR), IEEE Percom
  WiP Best Paper Finalist

  等奖项，研究成果及应用实践受到解放日报、上观新闻、上海科技、浦江科技评论、知乎专栏等有影响力的媒体关注与报道。

  本课题组长期和

  NTU/UniMelb/HKUST/RMIT/Swin

  等国际知名大学保持良好的国际合作，与阿里/蚂蚁/字节等国内大厂也有长期合作关系。欢迎成绩优异、英语水平优秀、意愿发表高水平学术论文、自驱能力强的低年级本科同学（一年级、二年级、三年级）共同开展研究工作，欢迎符合条件的校内外同学联系推免研究生。'
