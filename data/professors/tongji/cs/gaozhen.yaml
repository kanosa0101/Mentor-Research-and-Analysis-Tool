bio_raw: '高珍

  GAO ZHEN 博士、副教授

  电子邮件：gaozhen@tongji.edu.cn

  主讲课程：

  编译原理

  统计分析与建模

  主机系统管理

  研究方向：

  >>

  自动驾驶技术

  基于AI的驾驶环境感知技术

  自动驾驶测试场景库构建技术

  基于多传感器数据融合的驾驶场景重构技术

  >>

  智能交通系统

  驾驶安全边界研究、

  驾驶风格评估

  实时事故风险预测模型、

  危险场景预测模型

  基于视频的交通流参数提取技术等

  欢迎对本人研究方向有浓厚兴趣且具有钻研精神的同学报考研究生，也欢迎学有余力的本科生加入团队，从事人工智能算法在自动驾驶及智能交通领域的应用研究。

  工作经历

  同济大学软件学院，博士，副教授，硕士生导师

  近年主持及参与的科研项目

  2019-2020,多无人平台异构数据感知识别、理解与协同决策控制,同济大学2019年重点领域学科交叉重大项目

  2019-2020,道路交通安全统计分析与建模国际对比研究,政府间国际科技创新合作重点专项,课题编号SQ2017YFGH002253

  2019-2022,事故多发道路自动驾驶适驾性评估与改善研究,国家自然科学基金,课题编号51878498

  2018-2020,面向自动驾驶开放道路测试的交通安全管理关键技术研究及应用,上海市科学技术委员会项目,课题编号18DZ1200200

  2015-2017,上海市道路交通安全分析预警决策支持与事故主动管控技术研究, 上海科委项目, 课题编号15DZ1204800

  2017, 交通数据科学开放课题学科交叉类项目, 基于深度学习的城市快速路事故风险预警系统, “交通运输工程”高峰学科开放基金支持

  2017, QREP智能监控系统, 项目编号kh0210020170958

  2016, 高可用性商务分析(HCBA)原型开发, 项目编号20161859

  2015, 高可用性商务分析(HCBA)支撑技术研究, 项目编号20152768

  2015, 大型主机数据脱敏项目, 项目编号20151297

  专利

  一种基于二值化时域图的交通流参数获取方法（201910677409.X）

  一种异质性交通事故致因分析方法及设备（201910682345.2）

  近三年主持的教改项目

  2019-2020，研究生教改项目，人工智能与自动驾驶交叉融合育人模式探索

  2019-2020，本科生教改项目，大型主机系统管理虚拟仿真实验平台建设

  2018-2019，研究生教改项目，学科交叉推动研究生人才培养模式创新

  2017-2018，本科生教改项目，校企合作共建《主机系统管理》课程

  2017-2018，本科生教改项目，《大型主机系统管理》新版教材建设

  教学成果奖

  产学协同创新软件工程卓越工程师人才培养模式的探索与实践，2012年同济大学教学成果奖二等奖，排名第4，同教〔2013〕181号

  校企合作大型主机国际化创新人才培养模式实践探索，2012年同济大学教学成果奖二等奖，排名第2，同教〔2013〕181号

  教育部-IBM精品课程

  [1] 主持，2011年～2012年，“教育部－IBM专业综合改革项目” 2011年建设课程《大型企业级数据库管理与优化》立项，成功通过评审验收。教高司函〔2011〕213
  号。

  [2] 主持，2010年～2011年，主持课程《大型主机系统管理的案例分析与实践》获2010“教育部-IBM精品课程” 建设立项，已经通过评审验收。

  [3] 主持，2007年～2008年，主持课程《大型主机系统管理技能》获2007“教育部-IBM精品课程”建设立项，已经通过评审验收。

  出版教材

  [1] 2011年，主编，《大型主机系统管理》，同济大学十二五规划教材，清华大学出版社，教育部-IBM精品课程系列教材，2011.12出版，ISBN 978-7-302-25545-1，字数：460千字

  [2] 2012年，主编，《大型主机系统管理REXX编程详解》，同济大学十二五规划教材，清华大学出版社，教育部-IBM精品课程系列教材，2012.5出版，ISBN
  978-7-302-28005-7，字数：324千字

  [3] 2007～2008年，第一译者，主持IBM红皮书《Introduction to the New Mainframe: z/OS Basics》的翻译工作，翻译稿已在IBM全球AI网站共享
  (http://www.redbooks.ibm.com/redbooks/pdfs/sg246366-00-cn.pdf )

