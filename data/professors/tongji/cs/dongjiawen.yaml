title: 兼职教授
bio_raw: '董嘉文

  董嘉文 博士

  浙江大学竺可桢学院混合班毕业，自动化学士，硕士，美国凯斯西储大学工学博士。服务于美国GE实业、GE资本、对冲基金，回国后也曾服务国内央企。对科技创新与研发，国内外产业和资本市场结合，金融服务有近二十多年经验；拥有十几篇欧美专利。多家公司的董事和顾问。'
