bio_raw: '马旭

  马旭

  博士

  ，同济大学兼职教授。马旭博士是北京理工大学教授，现任北理工光电学院光电成像与信息工程研究所所长，教育部新世纪优秀人才，获得清华大学电子系学士学位，美国特拉华大学电子工程博士学位，并曾于美国加州大学伯克利分校从事博士后研究工作。马旭教授一直从事计算成像、压缩感知和深度学习方面的研究工作，取得了一系列优秀的科研成果，已出版国际首部

  “计算光刻”英文专著

  《

  Computational Lithography》，发表本领域高水平国际期刊及会议论文近50篇，获得发明专利授权20余项和软件版权3项，并获得过多项国内外科研奖励，成果得到了国内外同

  行专家的好评，在本领域具有较大的国际影响力。作为项目负责人和科研骨干主持或参与国家自然基金、国家科技重大专项、北京市自然基金、国际合作项目等

  20余项。现为中国微米纳米技术学会微纳执行器与微系统分会理事，电气电子工程师学会（IEEE）高级会员，美国光学学会（OSA）高级会员，国际光学工程学会（SPIE）高级会员，北京理工大学教学基本功比赛“一等奖”获得者。马旭教授目前主讲《非线性信号处理与应用》、《高等光学》、《交叉学科中的光学技术与仪器》等课程。'
