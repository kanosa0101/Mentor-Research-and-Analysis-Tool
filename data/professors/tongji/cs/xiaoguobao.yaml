bio_raw: '姓　　名

  肖国宝

  职　　称

  教授

  学　　科

  计算机科学与技术学科

  专　　业

  计算机科学与技术

  研究方向

  机器学习、模式识别、计算机视觉

  导师类型

  博／硕导

  电子邮件

  gbx@tongji.edu.cn

  通讯地址

  上海市曹安公路4800号济事楼

  肖国宝，博士毕业于厦门大学计算机科学与技术，2016-2018 厦门大学 航空航天学院 博士后，IEEE 高级会员，TIP/TMM/TCSVT等国际期刊审稿人，CVPR/ICCV/ECCV/AAAI等国际会议审稿人。

  课程

  Python程序设计、机器学习与模式识别、人工智能导论

  在研项目

  1. 国家自然科学基金面上项目“基于深度拓扑学习的高精准图像特征匹配方法研究”，时间：2025.01-2028.12，主持

  2. 国家自然科学基金面上项目“基于多视图空间一致性的鲁棒模型拟合理论研究及应用”，时间：2021.01-2024.12，主持

  3. 国家自然科学基金青年项目“新型确定性模型拟合方法研究及其应用”，时间：2018.01-2020.12，主持

  4. 中国博士后第62批基金面上项目一等资助“基于超图的模型拟合方法研究及其在运动分割中的应用”，时间：2017.08-2018.07，主持

  学术成果及荣誉

  主要专注于计算机视觉、机器学习和大模型应用等方面的基础与应用研究，第一/通讯作者在TPAMI, IJCV, TIP, ICCV,ECCV, AAAI等国际高水平学术期刊/会议上发表学术论文50余篇，其中SCI一区和CCF
  A类期刊/会议30余篇。拥有国家发明专利11项，科研成果成功转化9项，出版《科学出版社》专著一部。

  曾获得中国图象图形学学会“优秀博士学位论文”（全国10人）、福建省“优秀博士学位论文”、福建五四青年奖章、福州市青年科技奖等。

