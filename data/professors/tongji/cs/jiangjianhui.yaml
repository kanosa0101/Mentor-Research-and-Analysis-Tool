  个人简况

  江建慧，男，汉族，1964年11月生，浙江淳安人。1981年进入原上海铁道学院学习，1985年获工学学士学位，1988年获工学硕士学位，后留校任教。1994年7月任副教授，1995年~1999年为

  原上海铁道大学

  在职博士研究生，1999年获工学博士学位，2000年12月任教授。2000年4月起于同济大学工作，2000年9月~2002年7月为复旦大学计算机科学与技术博士后流动站博士后。2000年9月聘为硕士生导师，2003年11月聘为博士生导师。2004年~2007年任同济大学电子与信息工程学院计算机科学与技术系副主任，2007年~2011年任同济大学电子与信息工程学院计算机科学与技术系主任，2011年9月起任同济大学软件学院副院长。

  兼任中国计算机学会（CCF）容错计算专业委员会副主任

  、中国计量测试学会集成电路测试专业委员会副主任、

  上海市高等教育学会高校计算机专业委员会主任

  ，以及《同济大学学报（自然科学版）》、《智能物联技术》编辑委员会委员等

  。担任过多个国际学术会议和CCF全国性学术会议的会议主席和程序委员会主席、副主席和委员，《电路与系统学报》、

  《信息网络安全》

  等刊物的编辑委员会委员

  ，《中国科学：信息科学》测试技术专刊特约编辑

  。

  长期从事容错计算、测试与诊断、性能评测

  与设计优化

  等方向的理论研究和技术开发，以及

  在信息传输和软件、交通运输、电力、制造等行业的

  工程应用工作。负责和参与完成了国家重点基础研究计划（973）项目1项，国家高技术研究计划（863）项目1项，国家自然科学基金项目（含重点、面上、重大研究计划、青年）7项，上海市科委重点科技攻关计划项目3项，上海市科委基地建设项目1项，铁道部科技发展计划项目3项，上海市教委重点学科项目1项，

  其他省部级项目5项，

  以及

  华为技术有限公司、中广核工程有限公司等国内大型知名

  企业合作项目14项。现参与国家自然科学基金面上项目2项，负责华为技术有限公司、阿里云计算有限公司等企业合作项目多项。

  多项成果用于企业的产品生产线、技术服务平台和工程项目。获国家发明专利9项，软件著作权9项。

  出版教材《计算机容错技术》（中国铁道出版社，1995）和《安全关键计算机系统》（中国铁道出版社，2003）。

  在Journal of Computer Science and Technology, IEEE Transactions on Reliability, IEEE
  Transactions on Computer-Aided Design of Integrated Circuits and Systems,

  IEEE Transactions on Systems, Man and Cybernetics: Systems,

  Journal of Electronic Testing: Theory and Applications,

  《计算机学报》、

  《中国科学：信息科学》

  、

  《电子学报》、《计算机研究与发展》、

  《计算机辅助设计与图形学学报》

  、ITC、DATE、ATS、PRDC等

  国内外学术刊物和学术会议上发表论文200余篇

  ，SCI/SCIE/EI收录100余篇。

  近年来主讲

  “容错与安全计算”、“安全体系结构与管理”、“可信系统”、

  “软件可靠性工程”等本科生和研究生课程。

  主持省部级教改项目多项，发表教改论文多篇。

  培养获得学位的工学博士生18人、工学硕士生52人、工程硕士生30人

  ，

  其中，毕业非在职研究生的

  首次就业单位包括高校（如浙江工业大学、湖州师范学院、上海应用技术学院、上海第二工业大学）、科研院所（如上海计算机软件技术开发中心）、政府机构（如中国人民银行

  、

  上海市质量技术监督局）、企业（如华为、腾讯、百度、网易、奇虎360、盛大网络、上汽集团、大唐电信、支付宝、中国银联、中国工商银行、中国建设银行、招商银行、中国平安、上海证券交易所、中国金融期货交易所、Morgan
  Stanley、Intel、IBM、EMC、Cisco、Yahoo、Motorola、Alcatel、NXP、Nvidia、Synopsys、Advantest、SAP、Autodesk）等

  。

  获华为无线网络产品线“2015年价值合作成果奖”，2014年上海市科技进步一等奖，2013年上海市教学成果一等奖，2006年复旦大学优秀博士后，1997年上海市高校优秀教材二等奖，1997年宝钢教育基金优秀教师奖等奖项或荣誉称号。

