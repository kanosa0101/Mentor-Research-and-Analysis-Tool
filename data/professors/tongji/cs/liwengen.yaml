name: 李文根
aliases: []
school: tongji
dept: cs
status: enriched
title: 副教授
bio_raw: '博士毕业于同济大学计算机应用技术专业，同时参加同济大学与香港理工大学的双学位联合培养项目，获香港理工大学哲学博士学位。

  现为同济大学副教授，主要研究领域包括多模态数据融合分析、面向城市计算和海洋计算的时空数据查询处理与分析。

  已发表研究论文40余篇，包括领域顶级/重要期刊IEEE Transactions on Intelligent Transportation Systems、IEEE
  Transactions Services Computing、IEEE Transactions Knowledge Data Engineering、IEEE
  Transactions on Big Data和会议ICDE、CIKM。先后主持和参与了多个国家和省部级科研项目。2020年入选上海浦江人才计划。目前是中国计算机学会(CCF)数据库专委会通讯委员、上海市计算机视觉专委会副秘书长、IEEE会员、ACM会员。此外，还担任AAAI、PAKDD、MDM、IEEE
  DSS等国际会议程序委员会成员，以及ACM Computing Surveys、IEEE Transactions on Intelligent Transportation
  Systems、IEEE Internet of Things Journal、ACM Transactions on Cyber-Physical Systems、IEEE/ACM
  Transactions on Networking等期刊审稿人。'
