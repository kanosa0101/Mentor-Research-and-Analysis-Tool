bio_raw: '唐剑锋

  TANG JIAN FENG  讲师

  主讲课程：

  离散数学

  大型数据库系统管理

  专业方向综合项目

  面向对象程序设计(C++)

  数据结构

  研究方向：

  机器学习

  工作经历

  2003.1-今  同济大学软件学院

  讲师，

  同济大学电子与信息工程学院工学博士

  部分教改项目

  [1] 2017年，同济大学教学改革研究与建设项目：离散数学教学改革及课程建设研究，主持

  [2] 2011年，同济大学双语教学团队建设项目：主机数据库应用开发技术

  ，主要参与人

  [3] 2011年，教育部-IBM专业综合改革项目(原教育部-IBM精品课程)：大型主机应用上的开放系统和中间件

  ，主持

  [4] 2010年，同济大学第六期实验教学改革项目：大型主机数据库基础与应用开发实验

  ，主持

  [5] 2006年，教育部-IBM精品课程：大型主机数据库基础与应用开发

  ，主持

