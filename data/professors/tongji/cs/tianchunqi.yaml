  无线宽带网络、下一代互联网技术、云计算

  导师类型

  硕导

  电子邮件

  联系电话

  通讯地址

  上海市曹安公路4800号电信大楼

  田春岐，男，博士，副教授，硕士生导师。研究方向为宽带无线网络、下一代互联网技术、云计算等。中国计算机学会（CCF）会员，国家自然科学基金委同行评审专家。担任多个国际会议TPC
  Member。曾获同济大学“优秀青年教师”、“青年优秀人才计划”、“青年科研骨干教师”、“教学奖励金二等奖”等奖。

  作为项目负责人及主要参与者，已完成包括国家自然科学基金、国家高技术研究计划（“863计划”）项目、教育部博士点基金、中央高校基本科研业务项目、国土资源部海地所协作课题等项目10余项。在包括《Computer
  Networks》、 《Future Generation Computer System》、《Concurrency and Computation: Practice
  and Experience》、《Peer-to-Peer Networking and Applications》、《计算机学报》、《软件学报》、《通信学报》《电子与信息学报》等国内外期刊上发表学术论文30
  余篇，被SCI/EI 收录超20 篇，总引用次数超过100次。'
