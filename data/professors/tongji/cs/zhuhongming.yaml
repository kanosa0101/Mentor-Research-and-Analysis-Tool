  10.

  政务数据的语义化分析技术、意图识别模型和智能审批全数据链的RPA流程配置技术研究，上海市科委，2022，主持

  11.

  多源异构大型航空枢纽数据融合和相似度计算方法的研究，上海市科委，2022，主持

