  导师简介

  朱宏明博士现为同济大学计算机科学与技术学院副教授。研究方向主要包括：对源异构数据融合、多Agent复杂系统、时空数据分析处理、目标识别分割和变化检测等领域，研究内容应用于地理空间基础模型、空间计算平台、城市更新监测、疾病药敏分析等领域。

  拟招收对以上研究内容感兴趣的本科生、硕士和博士研究生，提供机会参与企业以及国际高校的合作研究交流，有意向同学请发送邮件至zhu_hongming@tongji.edu.cn。

