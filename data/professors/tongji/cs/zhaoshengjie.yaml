bio_raw: '赵生捷

  邮箱

  ：

  shengjiezhao@tongji.edu.cn

  研究方向：

  → 人工智能

  →

  计算机视觉

  →

  智能网联与计算

  赵生捷教授是国际欧亚科学院院士、国家级海外高层次人才

  、同济大学计算机科学与技术学院教授。赵生捷教授持有中国科学技术大学本科学位、中国航天科工集团第二研究院电子与计算机工程硕士学位、美国著名的工科大学德克萨斯A&M大学电子与计算机工程博士学位，是美国贝尔实

  验室技术学院院士、中国发明协会会士、科学中国人2014年度人物奖获得者。目前担任智慧城市感知与规划重大工程软件技术教育部工程研究中心主任，兼任国家千人计划专家联谊会信息科学与技术专业委员会副主任（主持工作）、中国发明协会常务理事、国务院发展研究中心国际技术经济研究所顾问委员会委员、中智科学技术评价研究中心院士专家委员会委员等。赵生捷教授是人工智能和物联网领域资深专家，

  长期从事人工智能、计算机视觉、智能驱动的城市感知、建模与规划决策技术体系研究工作和重大工程软件研发工作

  ，是

  国家“十二五”重大专项新一代宽带无线移动通信网项目首席科学家

  ，

  国家“十三五”重点研发计划物联网与智慧城市关键技术与应用专项项目、国家“十四五”重点研发计划城镇可持续发展关键技术与装备”专项项目等国家级项目首席科学家，主持了国家自然科学基金重点项目“面向海洋鱼类识别的视觉数据智能分析理论与关键技术”

  ，领导团队获授权专利70余项，

  在

  CVPR

  、

  TIP

  、

  IJCV

  、

  TMM

  等

  CCF A

  类

  /IEEE Trans

  上发表论文

  200

  多篇、

  8

  篇

  ESI

  高被引论文

  ，引用达10000+次。获得贝尔实验室技术

  学院中国区第一届、第二届Technical Symposium最佳论文奖，

  以第一完成人获

  2020

  年上海科技进步奖一等奖和

  2022

  年度教育部技术发明一等奖

  。

  团队拥有丰富的GPU计算资源、无人机和机器人设备。欢迎计算机、软件和电子信息相关专业的同学报考。'
