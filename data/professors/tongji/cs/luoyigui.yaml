bio_raw: '罗怡桂

  博士、副教授、硕导、中国计算学会嵌入式系统分会会员

  Luoyigui@tongji.edu.cn

  主讲课程：

  嵌入式系统设计

  L

  INUX程序设计

  软件综合项目训练

  研究方向：

  智能驾驶

  嵌入式系统

  软硬件协同设计

  教育背景与工作经历：

  2005年博士研究生毕业于华东师大计算机科学与技术系，获系统分析与集成专业、理学博士学位，期间与德国DARMSTADT大学SORIN A.HUSS教授实验室合作研究嵌入式系统软硬件协同设计技术。

  2005年至今 同济大学软件学院，副教授。

  2008年11月到2009年2月曾访学丹麦奥尔堡大学CISS。

  2019年到2020年，同济大学智能汽车研究所。

  教学工作：

  2008年教育部INTEL产学研项目 LINUX驱动开发课程。

  2011-2013年连续三年组织2011年上海赛区GOOGLE移动应用挑战比赛，参与全国决赛评比，多名学生获得一、二等奖。

  2011-2013年，负责GOOGLE俱乐部的指导。

  2013年获GOOGLE奖教金。

  2013年获GOOGLE移动项目优秀组织奖。

  2020年至今华为合作课程智能系统应用课程合作项目。

  著有“十一”五国家规划教材《LINUX高级程序设计》（高等教育出版社）与《嵌入式LINUX实践教程》（清华大学出版社）。

  获同济大学教学成果特等奖、上海市教学成果一等奖各一项。

  发表教学论文《基于问题解决的嵌入式系统实验教学实践》（实验室研究与探索，2012.10）。

  科研工作：

  近年来积极开展新能源汽车、智能出行等前沿领域与交叉学科领域的研究工作。作为项目负责人主持了上海汽车工业科技发展基金会、上汽集团、友道智途等10多项关键技术研发。其中，IECU中间件已落地应用于洋山深水港智能重卡。2022年年度，洋山深水港智能重卡完成10万标箱的运载任务，央视等主流媒体均有多次报道。发表论文20余篇，获国家授权发明专利4项，获上海科技进步三等奖一项。

  近年主要项目：

  上汽及X车企：IECU基础软件（中间件）自主研发（2018至今）

  X车企：电子后视镜（2022）

  上海市科委：“最后一公里”项目功能安全部分（2018）

  上汽：自主泊车 IECU（2017-2018）

  上海市科委：无人清扫车 IECU（2018）

  上汽基金：可重置ADAS域控制器探索（2017-2022.2）

  上汽：智能算法移植 (2018)

  上汽：PX2相机驱动（2019）

  上汽： ADAS双目相机 (2017)

  上汽： 基于视觉的电动尾门 (2018-2019)

  航天809所：基于FPGA的数字图像压缩机，2006年

  国家自然科学基金，差错容忍计算器件基础理论与方法，2015.1'
