bio_raw: '姓　　名

  程久军

  职　　称

  教授

  学　　科

  计算机科学与技术学科

  专　　业

  计算机应用技术

  研究方向

  机器人（机械臂，轮足，人形）；无人驾驶与智能网联（视频/图像、网络、安全）

  导师类型

  博导/硕导

  电子邮件

  chengjj@tongji.edu.cn

  通讯地址

  上海市嘉定区曹安公路4800号电信学院大楼

  教授，博士生导师，中国人工智能学会智能交通专业委员会委员。

  2025

  全球前

  2%

  顶尖科学家。主持和参与国家

  973

  、国家重点研发、国家科技支撑以及国家自然基金等项目

  20

  余项，获得省部级奖项

