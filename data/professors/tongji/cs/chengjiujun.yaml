  在“同济大学国家高性能计算中心同济分中心”和“嵌入式系统与服务计算教育部重点实验室”工作期间，创建并负责“同济大学―诺基亚移动创新俱乐部”，培养并指导研究生和本科生达

  300

  多人。指导的学生获得国际“

  Business Concept Challenge

  ”奖项

  1

  项；创青春杯（挑战杯）全国大学生创业大赛铜奖

