  60

  余项。

  2023

  年获“广东省科技进步二等奖”，

  2019

  年获“上海市科技进步二等奖”，

  2016

  年获“上海市科技进步二等奖”，

  2015

  年获“教育部科技进步二等奖”，

  2015

  年获“山东高等学校优秀科研成果三等奖”，

  2020 / 2012

  年获“隧道奖教金”，

  2011

  年获“同济大学奖教金”，

  2010

  年获同济大学大学生电子信息科技创新基地“

  2010

  年度优秀科技工作者”，

  2009

  年获“同济大学优秀青年教师”和“上海高校选拔培养优秀青年教师科研专项基金”，

  2008

  年获“花旗集团奖励金”，

  2007

  年获“同济大学青年优秀人才培养行动计划”。

  作为项目负责人，主持了国家自然基金面上项目（“基于视觉解析的开放式无人驾驶车群内生性自协机理研究”），国家自然基金面上项目（“面向开放式无人驾驶车群的正则性自协机理研究”），国家自然基金面上项目（“面向车联网大规模网络动态演化过程的通达性机理研究”），上海市自然基金面上项目（“基于耗散结构特征的车联网网络动态演化模型研究”），上海市科委“重点攻关”项目（“上海公安监控视频传输、检索与管理体系研究”），教育部新教师基金项目（“

  B3G/4G

  网络环境下移动

  P2P

  网络资源搜索与调度机制”），微软亚洲研究院项目（“基于云计算的多媒体共享服务系统”），中央高校基本科研业务费重点领域学科交叉重大项目（“人工智能产业发展的法律及知识产权问题研究”），中央高校基本科研业务费专项资金项目（“社区生活圈互动服务平台关键技术研究”），北京邮电大学网络与交换技术国家重点实验室开放课题（“复杂环境下无人驾驶车群动态演化方法”、“移动

  P2P

  网络环境下信息服务的智能协同理论和方法研究”），以及企业界机器人各类场景应用，等等。作为项目第

  2

  完成人，分别参加了国家重点基础研究计划

  973

  项目课题（“自

  -

  协网络体系结构设计方法”），国家科技支撑计划项目（“社区物联网创新技术与服务平台与应用示范”），等等。

