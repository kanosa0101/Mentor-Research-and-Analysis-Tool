  项；国家信息安全各类比赛一二三等奖

  30

  余项；诺基亚中国大学移动创新大赛奖项

  9

  项。指导的学生获得国家大学生创新计划项目

  11

  项；上海市大学生创新计划项目

  15

  项；同济大学创新计划项目

  60

  余项。

  通过广泛的国内外学术交流与合作，与北京邮电大学网络与交换技术国家重点实验室、日本富山大学人工智能实验室、葡萄牙新里斯本大学数据科学实验室、瑞典斯德哥尔摩大学网络通信实验室、芬兰阿尔托大学数据通信实验室等建立了良好的合作关系。'
