bio_raw: '姓　　名 程鹏

  研究方向 时空数据管理、向量数据管理、空间智能等

  导师类型 博/硕导

  电子邮件 cspcheng@tongji.edu.cn

  办公地址  济事楼332室

  程鹏，现任同济大学计算机科学与技术学院研究员，硕博导师。本科及研究生毕业于西安交通大学，博士毕业于香港科技大学。主要研究方向包括时空数据管理、向量数据管理、空间智能等。

  近年来在数据库领域的顶级会议和期刊

  SIGMOD

  、

  VLDB

  、

  ICDE

  、

  TKDE

  发表

  40

  余篇论文。其中关于空间众包隐私保护的学术论文，获得了

  ACM CIKM 2021

  数据挖掘国际顶级学术会议的最佳论文提名（

  Best Paper Nominations

  ）。参与研发的通用空间众包演示论文

  gMission

  ，获得了

  VLDB 2014

  国际会议的杰出演示奖（

  Excellent Demonstration Award

  ）。

  担任数据库数据挖掘领域相关重要国际会议

  VLDB

  、

  ICDE

  、

  KDD

  、

  DASFAA

  的程序委员，

  ICDE 2025

  领域主席（

  Area Chair

  ），数据库数据挖掘领域相关重要期刊

  TKDE

  、

  WWWJ

  、

  VLDBJ

  审稿人。主持国家自然科学基金青年基金，上海市浦江人才计划项目，蚂蚁集团校企合作项目。参与科技部科技创新

  2030-

  “新一代人工智能”重大项目一项、阿里巴巴集团校企合作项目两项。

  指导的研究生获得国家奖学金、上海市优秀毕业生、上海市优秀硕士学位论文奖等。毕业生去向：阿里巴巴，字节跳动，小红书，蚂蚁金服等公司。

  近年来，主要围绕向量数据管理和空间智能方向开展研究工作，具体包括：

  l

  向量数据管理：分布式向量检索、多模态向量数据检索、稀疏向量检索等；

  l

  空间智能：空间理解记忆、空间任务推理、空间任务规划等

  此外，对空间众包、区块链、隐私保护也有部分延续研究。

  课题组招收硕士、博士、博士后，欢迎邮件交流沟通！也欢迎感兴趣的本科生联系，提前感受科研氛围，熟悉科研流程！希望你对科学研究具有饱满的热情，善于思考，积极动手，具备良好的编程能力和英文文献阅读能力，且有志发表高水平学术论文。

  更多信息请访问我的个人主页：

  https://cspcheng.github.io'
