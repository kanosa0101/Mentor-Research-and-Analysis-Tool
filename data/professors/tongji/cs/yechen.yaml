title: 教授
bio_raw: '叶晨，工学博士，同济大学计算机科学与技术学院实验中心负责人，教授级高工，博士生导师。主要研究方向为人工智能、机器视觉、数字人文、数据挖掘及其在工业智能领域的应用。2014年，参与组建同济大学“途灵TiEV”智能无人系统研究团队，研发“途灵”与“途灵plus”无人车。已主持或参与完成多项国家自然科学基金项目，科技部重点研发项目，国际合作项目和上海市科委基础重大项目。承担多项企业课题，授权发明专利二十余项，曾获教育部科技进步一等奖。近年来，在高水平学术会议和期刊中发表论文近50篇（AAAI、NeurIPS、ACL、CHI、UIST、ICRA、IROS、RAL等），曾获ACM
  CHI最佳论文提名奖。

  在教学科研工作中，注重培养学生的创新意识和实践能力。曾指导国家级/上海市大创项目30余项。曾获上海市创新创业教育“领雁”教师，“挑战杯”上海市优秀指导教师等。曾指导本科生获得“挑战杯”全国大学生课外学术科技作品竞赛一等奖，“互联网+”上海市金奖。指导各类学科竞赛获得国家一等奖以上三十余项。

  招募兼具技术理想与社会责任，矢志用科技创新推动社会进步的同行青年！'
