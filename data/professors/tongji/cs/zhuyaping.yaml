  朱亚萍，同济大学计算机科学与技术学院预聘副教授，博士/硕士生导师。博士毕业于东南大学移动通信全国重点实验室，美国佐治亚理工学院联合培养博士。2020年入选上海市“科技创新行动计划”扬帆人才，在国际知名期刊和旗舰会议上发表学术论文40余篇，申请国家发明专利20余项。主持国家自然科学基金面上项目、青年项目以及上海市科委项目等。

  欢迎通信电子、计算机、软件工程等专业背景的同学报名博/硕士研究生。根据个人兴趣及发展规划，可以参与相关课题研究。'
