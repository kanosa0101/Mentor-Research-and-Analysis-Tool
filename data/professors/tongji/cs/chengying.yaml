  个人简介：

  程颖，现为同济大学计算机科学与技术学院助理教授，2023年于复旦大学获得博士学位，同年加入复旦大学计算机科学技术学院从事博士后研究工作，2025年9月加入同济大学计算机科学与技术学院。研究方向为空间智能和多媒体分析，至今已在NeurIPS、AAAI、ACM
  Multimedia、IEEE Transactions on Multimedia等多媒体领域顶级期刊/会议上发表20余篇论文，其中以第一作者/通讯作者身份发表论文10余篇。主持国家自然科学基金青年项目，国家资助博士后研究人员计划和上海市“超级博士后”激励计划。此外，作为项目骨干参与国家重点研发计划项目、国家自然科学基金面上项目等项目十余项。目前担任NeurIPS、ICML、ICCV等多个国际期刊/会议审稿人。

  欢迎对空间智能和多媒体分析方向感兴趣的同学来信垂询！

