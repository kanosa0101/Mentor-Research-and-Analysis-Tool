bio_raw: '姓　　名

  陈宇飞

  职　　称

  副教授

  学　　科

  计算机科学与技术

  专　　业

  计算机应用

  研究方向

  医学影像分析、机器学习、深度学习

  导师类型

  博导/硕导

  电子邮件

  yufeichen@tongji.edu.cn

  联系方式

  通讯地址：同济大学嘉定校区智信楼437室

  邮政编码：201804

  电子邮件：

  yufeichen@tongji.edu.cn

  通讯地址

  同济大学嘉定校区智信楼437室

  陈宇飞，博士，副教授。2004年毕业于华东师范大学计算机科学与技术专业，获学士学位；2010年毕业于同济大学计算机应用专业，获工学博士学位；2008至2009年在德国达姆施塔特工业大学、德国弗劳恩霍夫图像数据处理研究所任访问研究员（Guest
  Researcher）；2010至2012年进入同济大学控制科学与工程博士后流动站工作，后留校任教。

  主要研究领域为机器学习、深度学习，聚焦复杂临床数据下的可信辅助决策研究，构建可信辅助决策方法。课题组在TMI、TCSVT、NeurIPS、CVPR、ICLR、AAAI、ACMMM、MICCAI等领域内知名学术期刊及会议累计发表论文100余篇，授权发明专利19项，骨干参与制定团体标准3项。近年来，主持国家重点研发计划课题，国家自然科学基金面上项目、重大计划培育项目、青年项目，JCJQ重点项目子课题，上海市教委重点项目等20余项。

  主持上海市一流本科课程、上海市重点课程（

  AI+

  课程）、骨干参与国家

  101

  计划

  AI

  课程等。主讲课程荣获第五届全国高校教师教学创新大赛二等奖、上海市特等奖，全国高校程序设计类实训案例特等奖等，并入选首届中国计算机学会全国教学成果案例集（全国

  11

  项）。主编教育部“

  101

  计划”人工智能领域核心教材《模式识别与数据挖掘》。

  近

  5

  年指导学生竞赛累计获国际

  /

  国家级

  /

  省部级奖

  18

  项，包括第十九届“挑战杯”全国三等奖及上海市特等奖、全球校园人工智能算法精英大赛全国一等奖、

  CCF-BDCI

  大数据与计算智能大赛全国一等奖、国际数字医学会

  ISICDM

  挑战赛一等奖等。指导学生先后入选中国科协青年科技人才培育工程、上海市计算机学会优秀学位论文，多人获国家奖学金、上海市优秀毕业生、小米特等奖学金以及比亚迪奖励金等，获

  2024

  年度同济大学

  “

  我心目中的好导师

  ”

  （十人之一）。

  任全国仿生学标委会委员、医学影像国际会议

  MICCAI-CLIP

  主席、医学影像国际会议可解释医学人工智能

  (MICCAI-SIG-xMedIA)

  教育主席、医学图像计算青年研讨会

  MICS Webinar

  副主席、中国计算机学会（

  CCF

  ）计算机应用专委会执行委员等。

  更多信息请参见教师主页：

  https://yufei-chen-tj.github.io/'
