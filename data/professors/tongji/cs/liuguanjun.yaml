bio_raw: '姓　　名

  刘关俊

  职　　称

  教授

  学　　科

  计算机科学与技术学科

  专　　业

  计算机软件与理论

  研究方向

  Petri网与并发理论、时序逻辑与模型检测、强化学习与无人机协同、机器学习与网络交易欺诈检测、人机物系统、实时嵌入式系统、工作流系统

  导师类型

  博导／硕导

  电子邮件

  liuguanjun@tongji.edu.cn

  联系电话

  通讯地址

  上海市曹安公路4800号同济大学电信学院235室

  刘关俊，教授，博士生导师。

  2011

  年获得同济大学计算机软件与理论专业博士学位，先后于新加坡科技设计大学、德国柏林洪堡大学（德国洪堡基金资助）从事博士后研究工作，

  2013

  年进入同济大学计算机科学系（目前为计算机科学与技术学院）工作至今。是中国计算机学会高级会员（形式化方法专委会常委、软件工程专委会执委、理论计算机科学专委执委）、中国自动化学会会员（网络计算专委会委员）、中国人工智能学会会员、上海市人工智能学会会员（可信智能系统专委会副主任委员）、上海市计算机学会会员（理论计算机专委会委员）、上海市信息学会理事、

  IEEE Senior Member

  ，是

  IEEE Transactions on Computational Social Systems

  副主编（

  Assciate Editor

  ）、

  Artificial Intelligence and Autonomous Systems

  编委（

  Editorial Board Member

  ）。挂职井冈山大学校长助理，是江西省“可信智能无人机群技术”产业技术工程化中心主任。

  已出版学术专著

  5

  本（科学出版社

  2

  本、同济大学出版社

  1

  本、

  Springer

  出版社

  2

  本），编著教材

  1

  本（科学出版社），发表学术论文

  160

  余篇，包括

  SCIENCE CHINA - Information Sciences

  、

  IEEE/CAA Journal of Automatica Sinica

  、

  ACM T-CPS

  、

  ACM T-ECS

  、

  ACM T-AAS

  、

  IEEE T-NNLS

  、

  IEEE T-SC

  、

  IEEE T-II

  、

  IEEE T-ASE

  、

  IEEE T-ITS

  、

  IEEE T-CSS

  、

  IEEE T-SMC-S

  、

  IEEE T-IV

  、

  IEEE T-CE

  、计算机学报、软件学报、航空学报等国内外期刊论文

  100

  余篇、以及

  International Conference on Machine Learning (ICML)

  、

  International Joint Conference on Artificial Intelligence (IJCAI)

  、

  International Conference on Theory and Applications of Petri Nets and Concurrency
  (ICTAPN)

  等国际会议论文

  60

  余篇。主持国家自然科学基金

  5

  项（重大研究项目之培育项目、重点项目之子课题、面上项目、青年基金项目）、上海市曙光人才项目、上海市“科技创新行动计划”项目－人工智能科技支撑专项、中央高校交叉项目基金（重大）、航天五院科研基金、华为胡杨林基金等。

  获得国家科技进步二等奖（

  2016

  ）、中国电子学会自然科学一等奖（

  2016

  ）、自动化学会自然科学一等奖（

  2019

  ）、吴文俊人工智能技术发明一等奖（

  2019

  ）、上海市技术发明一等奖（

  2019

  ）、上海市科技进步一等奖（

  2015

  ）、教育部国务院学位委员会首届博士研究生学术新人奖（

  2010

  ）、上海市优秀博士学位论文奖（

  2014

  ）、上海市计算机学会协同计算与信息服务专委会优秀论文奖（

  2017

  ）、

  13th IEEE ICNSC

  最佳学生论文提名奖（

  2016

  ）、

  2021 ICCPSI

  最佳学生论文奖。指导的研究生多次获国家奖学金。

  根据美国斯坦福大学与爱思唯尔

  (Elsevier)

  联合发布的《

  2025

  全球前

  2%

  顶尖科学家榜单》

  (World

  ’

  s Top 2% Scientists 2025)

  ，刘关俊教授同时入选“职业生涯科学影响力排行榜“和

  ‌

  ”单年度科学影响力排行榜“。

