  刘钦源，同济大学计算机科学与技术学院长聘教授、博导。入选国家优青、上海晨光学者。2012年本科毕业于华中科技大学，2017年博士毕业于清华大学，获清华大学优秀博士学位论文一等奖、中国自动化学会优秀博士学位论文奖、清华大学优秀毕业生等荣誉。2014-2016年间多次赴香港科技大学电子及计算机工程学系从事研究工作，2016-2017年赴布鲁奈尔大学计算机科学系任国际研究员，2021-2022年于工业和信息化部产业发展促进中心任国家重点研发计划项目主管。

  研究方向包括多传感器数据融合、时间序列预测、异常检测和故障诊断、图像处理和机器学习等。主持/参与国家自然科学基金、国家重点研发计划、科技创新2030“新一代人工智能”重大项目等10余项国家及省部级项目。出版Spinger专著1部，发表论文50余篇，IEEE汇刊及一区论文30余篇，5篇论文入选ESI高被引论文。曾获北京市自然科学二等奖、北京市麒麟科学技术奖、吴文俊人工智能科学技术优秀青年奖、ACM上海新星奖、世界人工智能大会青年优秀论文提名奖等荣誉。担任Control
  Eng Pract、Int J Syst Sci等5个国际期刊客座编辑/副编辑/编委，10余个国际会议副编辑/程序委员会委员/邀请组主席，20余个国内外期刊及会议的审稿人。担任中国人工智能学会青工委、中国自动化学会故障诊断专委会、中国指挥与控制学会智能控制与系统专委会、中国电子学会区块链分会等多个二级学会委员；国家自然科学基金、国家重点研发计划、上海市科技奖评审专家。'
