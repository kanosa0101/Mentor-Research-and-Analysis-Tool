title: 助理教授
bio_raw: '王忠

  ，同济大学计算机科学与技术学院助理教授、硕士生导师

  。曾于

  2016

  年和

  2019

  年在同济大学分别获得学士和硕士学位，之后曾在中国中车公司工作，

  2020

  年

  3

  月至同济大学软件学院攻读博士学位，

  2023

  年

  11

  月毕业并于同年

  12

  月加入上海交通大学自动化与感知学院开展博士后研究工作，

  2025

  年

  12

  月博士后出站后入职同济大学计算机科学与技术学院。主持国家自然科学基金青年基金项目（

  C

  类）、中国博士后基金会博士后面上项目，获选上海市超级博士后和

  中国博士后基金会国家博士后资助计划

  。其博士论文入选上海市计算机学会

  2024

  年度优秀博士学位论文提名奖。

  主要研究方向为

  3D视觉

  ，围绕

  具身智能、空间智能

  等前沿领域开展研究，致力于推动智能

  机器人

  系统的技术创新与场景落地。目前已在国际顶级期刊

  和会议

  发表学术论文20余篇。

  欢迎有意愿发表高水平学术论文、自驱力强的同学共同开展研究工作，同时欢迎符合条件的校内外优秀学子联系推免硕士研究生。

  个人主页：

  https://cszhong

  wang.git

  hub.io/

  联系方式：

  cszhongwang

  @tong

  ji.edu.cn'
