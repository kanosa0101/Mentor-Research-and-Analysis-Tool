bio_raw: '宋井宽，同济大学计算机科学与技术学院教授，国家“青年特聘专家”，国家杰出青年科学基金获得者。主要研究方向为多模态、具身智能。在多媒体、计算机视觉、人工智能等领域的重要会议和期刊发表论文180余篇，谷歌学术引用17000余次。担任国际SCI期刊IEEE
  TMM、ACM TOMM等编委，担任多个期刊的评审和多个国际顶级会议(MM''18-''24, IJCAI''18-''24)的领域主席。主持自然科学基金委重点、科技部重点研发课题等多项国家级项目。

  联系邮箱：

  jingkuan.song@gmail.com

  个人主页：

  https://jingkuansong.github.io/index.html'
