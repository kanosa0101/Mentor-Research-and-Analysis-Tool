bio_raw: '姓　　名

  龚晓亮

  职　　称

  高级工程师

  学　　科

  计算机

  专　　业

  计算机科学与技术

  研究方向

  脑认知与智能计算、情感计算

  导师类型

  硕士生导师

  电子邮件

  gxllshsh@tongji.edu.cn

  教育背景

  博士毕业于华东师范大学

  工作履历

  2012-08 至 今, 同济大学

  教学情况

  《高级语言程序设计》、《软件工程》（英）、《大脑如何做决策？》、《脑科学导论》

  学术成果及荣誉

  从事脑科学研究相关的大型仪器设备管理、脑与认知智能计算教学、科研和创新人才培养工作。曾负责建设上海高校一流本科课程：任务态-功能磁共振影像虚拟仿真实验，上海市重点课程《高级语言程序设计(国豪工科精英班)》。主持校级教改项目
  4 项（其中1项优秀结题）、发表教改论文3 篇。参与主持国家自然科学基金项目、上海自然基金项目、国家重大专项子课题等科研项目5 项，发表国际期刊及会议论文 30
  余篇，授权中国发明专利 3 项。获第八届全国计算机类课程实验教学案例二等奖、全国程序设计类实训案例特等奖 、同济大学教学成果一等奖（厚基立体，全栈复合，双向赋能的大数据专业人才培养模式）、同济大学教学成果二等奖（以工程能力、创新思维、科研素养为导向-构建全过程育人的大信息科学实验教学平台）。

  Zhilin Zhang, Jie Wang, Zhanghao Qin, Ruiqi Zhu and Xiaoliang Gong .

  Efficient Bilinear Attention-based Fusion for Medical Visual Question Answering，2025
  International Joint Conference on Neural Networks (IJCNN).

  奚子淇 ,  龚晓亮 ,  彭哲瀚 . 用于图像识别的轻量化神经网络综述, 计算机应用与软件.

  Zhengmiao Huang, Xiaoliang Gong ,A Novel Music Recommendation System Based On Individual
  Emotion, 2024 the 7th Artificial Intelligence and Cloud Computing Conference (AICCC).

  Mohan Zhao, Gianmarco Fortunelli, Zhenghao He, Xiaoliang Gong, Anthony Cohn. Phase-Amplitude
  Coupling of EEG Applied in Music-Induced Emotional Recognition Tasks, The 2024 20th
  International Conference on Natural Computation, Fuzzy Systems and Knowledge Discovery
  (ICNC-FSKD 2024).

  Mohan Zhao,Lu Pang,Yan Lu,Zhenghao He,Xiaoliang Gong, and

  Anthony George Cohn. Conditional Domain Adaptation Based on Initial Distribution
  Discrepancy for EEG Emotion Recognition，MICCAI Workshop on Clinical Image-based
  Procedures: Towards Holistic Patient Models

  for Personalised Healthcare (MICCAI-CLIP), Singapore, 2022-9-18至2022-9-18

  陆言, 龚晓亮, 谢非, 钱晖, 庞路, 吴统琦,基于复杂网络的秀丽隐杆线虫神经系统性质研究进展,《中国医学物理学杂志》。

  欢迎有志于情感计算、计算神经科学的优秀硕士研究生加入我们的团队，共同探索和创新！

  .'
