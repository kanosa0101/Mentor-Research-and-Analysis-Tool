bio_raw: '姓       名

  曾鹏鹏

  职       称

  研究员

  学       科

  计算机科学与技术

  研究方向

  多模态理解、计算机视觉、具身智能

  导师类型

  博/硕导

  电子邮件

  is.pengpengzeng@gmail.com

  曾鹏鹏，同济大学研究员，博士生导师。主要研究方向是多模态理解、计算机视觉、具身智能等。累计在CVPR、NeurIPS、

  ACL、

  ACM MM、AAAI等CCF A类会议，TPAMI、TIP、TNNLS、TMM、TCSVT等中科院JCR一区期刊上发表高水平论文30余篇，ESI高被引1篇。申请/授权发明专利10余件。主持国家自然科学基金及省部级项目3项，主研国家级重大重点项目4项，省部级项目3项。获首届“兴智杯”全国人工智能创新应用大赛专题赛一等奖、2024年ICME多模态视频理解与分析（行人重识别和属性识别赛道）冠军等科技竞赛奖项。担任IEEE

  TPAMI、TIP、TCYB、TMM、TNNLS、TCSVT等业内多个国际知名期刊以及CVPR、ICCV、NeurIPS、ACM MM、AAAI等多个国际知名会议的审稿人。

  课题组招收希望有志于从事科研事业的本科生、

  硕士、博士

  、博士后来信垂询！希望您具备如下特点：1）强烈的科研兴趣与自主探索精神；2）热爱生活，踏实肯干，勤动手脑；3）扎实的数理基础与编程能力，以及良好的

  英文文献阅读能力

  ；4）良好的团队协作与沟通能力。'
