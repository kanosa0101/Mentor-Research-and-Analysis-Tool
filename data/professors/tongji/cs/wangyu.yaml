  个人主页：

  https://pkylin.github.io/

  个人简介

  汪昱，同济大学计算机科学与技术学院副教授，

  博士生导师，

  入选上海科技青年35人引领计划（上海35U35）、上海市启明星计划

  （

  扬帆专项

  ）

  人才计划，长期专注于多模态视觉感知、理解与决策等领域，在

  多模态大模型

  、开放视觉感知、多模态视频理解与分析等前沿方向从事研究。近五年，在NeurIPS、ICML、CVPR、ICLR、AAAI、IEEE TMM

  、

  IEEE T

  CSVT

  等CCF A类/中科院一区国际顶级刊物上发表论文30余篇，申请/授权国家技术发明专利

  20

  余项。获2025年上海市科技进步二等奖，获人工智能国际顶级挑战赛8项冠军

  （包括

  CVPR 202

  6和

  CVPR 202

  5 六项

  、ACL 2026

  一项和

  ICDAR 202

  3一项）、2项亚军（CVPR 2026 两项）

  。长期担任包括CVPR、ICCV、ICLR、ICML、NeurIPS

  、

  ACM MM、ECCV、IEEE TMM、IEEE TCSVT

  、计算机学报、TMLR

  等国际顶级

  刊物

  的审稿人，

  也是

  CVPR 2025杰出审稿人。主持新一代人工智能国家科技重大专项子课题、国家自然科学基金青年基金、

  上海市“科技创新行动计划”启明星

  计划扬

  帆专项、上海市关键技术研发计划“新一代信息技术”项

  目。

  欢迎对人工智能相关技术感兴趣的同学联系和报考！

