bio_raw: '姓　　名

  张红云

  职　　称

  长聘副教授

  学　　科

  计算机科学与技术学科

  专　　业

  计算机应用技术

  研究方向

  认知与智能信息处理

  导师类型

  博导/硕导

  电子邮件

  zhanghongyun@tongji.edu.cn

  联系电话

  通讯地址

  上海市曹安公路4800号电信大楼

  张红云，女，工学博士。现任同济大学电子与信息工程学院计算机系副教授，博士生导师，加拿大阿尔伯塔大学访问学者（2012-2013）。目前担任中国人工智能学会粒计算与知识发现专业委员会副秘书长及常务委员，教育部学位论文评审专家。

  研究方向包括：人工智能、机器学习、大数据分析、文本与图像理解、粒度计算等，主要涉及图像分类、图像重构、目标检测、多粒度建模和不确定性分析等领域。已在《IEEE
  Transactions on Cybernetics》、《Pattern recognition》、《Information Sciences》、《Expert
  Systems With Applications》、《计算机研究与发展》、《电子学报》等国内外重要学术刊物与国际会议上发表论文72篇，其中37篇被SCI收录。主持国家自然科学基金3项，上海市自然基金1项、获中国人工智能学会吴文俊人工智能自然科学二等奖（2018）、主讲《人工智能原理》、《模式识别》、《数据仓库与数据挖掘》等专业核心课程，建设国家级线下精品课程1门，上海市精品课程1门。

  目前担任国际SCI期刊《IEEE Transactions on Cybernetics》、《Information Sciences》、《International
  Journal Of Approximate Reasoning》、《Expert Systems With Applications》、《计算机学报》的审稿人。

  实验室：智能信息系统实验室（电信大楼476室）

  欢迎有志攻读硕士、博士、博士后的同学和同仁与我联系。'
