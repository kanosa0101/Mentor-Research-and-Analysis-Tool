  个人简介：

  范桂云，籍贯山东省日照市，现任同济大学计算机科学与技术学院助理教授。

  2021

  年于上海交通大学获得博士学位，同年加入上海交通大学从事博士后研究工作。

  2025

  年

  9

  月加入同济大学计算机科学与技术学院。研究方向为智能算网、具身智能和非视距感知，至今已在

  MobiCom

  、

  INFOCOM

  、

  KDD

  、

  AAAI

  、

  IEEE TMC

  等国际顶级期刊

  /

  会议上发表学术论文

  20

  余篇，其中以第一作者

  /

  通信作者身份发表论文

  18

  余篇。主持国家自然科学基金青年项目，国家资助博士后研究计划，博士后面上项目和杨浦区创新实践基地项目等。此外，作为项目骨干参与国家重点研发计划，国家自然科学基金重点、面上等项目十余项。目前担任

  IEEE INFOCOM ICCN

  程序委员，

  IEEE TMC

  、

  IEEE IOT-J

  、《信息网络安全》、

  IEE ICC

  等多个国际期刊

  /

  会议审稿人。

  欢迎对具身智能和算网方向有兴趣且有上进心的本科生与我联系！

