bio_raw: '夏波涌

  XIA BO YONG 博士、讲师

  xiaby@tongji.edu.cn

  主讲课程：

  计算机网络

  信号与系统

  项目管理

  研究方向：

  图像理解

  智能信号处理

  网络通信

  教学工作

  主讲课程：

  1)计算机网络 2)信号与系统 3)项目管理

  部分科研项目简介

  小目标红外图像检测和跟踪算法研究，2008.1，上海航天809所

  智能型立体装卸码头关键技术研究（子课题：自动化码头实时调度系统）,2008．8，上海市科委

  无锡市信息化（2009—2013）发展规划研究，2009.7，无锡市信息化办公室

  部分论文简介

  《自动化码头集装箱运输设备调度仿真》，制造业自动化，2009-02-25

  《基于形态滤波和均值漂移红外小目标检测方法》，计算机仿真，2009-02-15

  《基于纹理梯度的文档图像的倾斜校正方法》，计算机仿真，2009-03-15

  《信息化与工业化融合内涵初探》，制造业自动化，2009-05-25

  《基于联结的分布式网络多媒体内同步技术的研究》，中国图象图形学报，1998-08-25'
