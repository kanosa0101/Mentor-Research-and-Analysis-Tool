bio_raw: '姓　　名

  杨恺

  职　　称

  长聘教授

  学　　科

  计算机科学与技术学科

  专　　业

  计算机科学与技术

  研究方向

  AI+网络，多层优化，无线通信和物联网

  导师类型

  硕导/博导

  电子邮件

  kaiyang@tongji.edu.cn

  联系电话

  通讯地址

  上海市曹安公路4800号智信馆

  杨恺现任同济大学长聘教授，上海自主智能无人系统科学中心博导，上海计算机学会网络专委会副主任，国家级人才。杨恺博士分别在东南大学, 新加坡国立大学, 哥伦比亚大学获得学士,
  硕士,和博士学位。曾经在哥伦比亚大学，贝尔实验室, NEC 美国研究所，美国华为研究院等多个高校和研究院从事教学和研究工作。曾任哥伦比亚大学客座教授。

  研究领域为运筹学与信息科学的交叉领域，近期聚焦在AI+网络和人工智能中的多层优化问题。在ICML, NeurIPS, ICLR，SIGIR， INFOCOM和IEEE
  TDSC, IEEE JSAC, IEEE Transactions on Wireless Communications, IEEE Transactions
  on  Information Theory，IEEE Transactions on Signal Processing 等人工智能顶会和网络期刊上以通讯作者或者第一作者发表论文80余篇。并拥有30余项专利。杨恺博士主持开发的网络大数据系统已经被多个顶级运营商使用。杨博士获哥伦比亚大学
  Elihau Jury Award, 贝尔实验室技术贡献奖，贝尔实验室最佳研究团队奖, 美国华为技术突破一等奖和未来之星, 2023 IJCAI 时间序列研讨会最佳论文提名奖等多个奖项。杨恺担任多个国际期刊的编辑和客座编辑，并曾经担任多个世界知名学术会议的技术分会主席。承担包括国家自然科学基金面上项目、教育部-中移动联合基金等项目与课题。

  欢迎有志于科研的同学报考本课题组的博士，硕士，应聘研究员，研究助理，博士后，或参与本科毕业设计。

  实验室主页：https://kaiyangcn.github.io/'
