  研究方向：

  信息安全与密码学

  包括

  应用密码学

  、区块链与数字货币

  、

  网络安全、

  数据安全与

  隐私计算

  、软件安全

  欢迎计算机、软件工程、数学、通信电子等专业背景的同学报考硕士/博士研究生。根据同学的发展规划和个人兴趣，可以参加国家自然科学基金等国家级课题研究，与国内外著名IT企业的校企合作项目，

  以及

  与海外的高等院校的联合研究等，获得科研能力、实际项目经验及国际交流访学的经验等方面的提升。如有兴趣，请邮件联系（

  sseyangshi AT 126

  DOT

  com

  ）。

