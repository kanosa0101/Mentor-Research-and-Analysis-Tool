  导师简介

  张荣庆博士，同济大学计算机科学与技术学院副教授、博士生导师，兼任同济计算机学院教工第二支部书记、上海市同济医院（三甲）双聘科研教授，毕业于北京大学获理学学士和工学博士学位，入选上海市海外高层次人才、广州市科技创新领军人才。主要研究方向为车联网

  /

