  张荣庆教授课题组长期招募本科生、科研助理等加入网络与机器智能实验室从事网联智能、低空具身智能等方向的研究工作。我们期望您具备的条件：

  1

  ）学有余力，能够保证科研时间的投入；

  2

  ）态度积极认真，自驱力强，拖延症弱；

  3

  ）具备良好的英语阅读写作能力以及数学基础。我们能提供的待遇：

  1

  ）课题组将积极指导本科生

  /

  科研助理同学进行科研实习并以发表高水平论文为目标；

  2

  ）科研助理按照学校要求提供相应的酬金待遇；

  3

  ）对于表现优秀的同学，可优先获得本组的硕士

  /

  博士研究生名额（推免研究生需具备推免资格），或推荐至香港科技大学、北京大学等国内外顶尖高校进行读博深造。欢迎感兴趣的同学来信咨询课题组科研岗位，来信请将个人简历发送至

  rongqing.labs@gmail.com

