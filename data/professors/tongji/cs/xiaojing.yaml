bio_raw: '肖京

  肖京

  博士

  ，同济大学兼职教授。肖京博士是卡耐基梅隆大学博士，现任平安集团首席科学家，技术研究院院长。肖京博士长期从事人工智能与大数据分析挖掘相关领域研究，多次当选重要国际学术会议委员会及中美国家基金评审专家委员会，先后在爱普生美国研究院及美国微软公司担任高级研发管理职务。目前在平安集团负责创新技术及产品研发应用，包括智能化大数据分析等技术在金融、医疗、智慧城市等领域的研发和应用。'
