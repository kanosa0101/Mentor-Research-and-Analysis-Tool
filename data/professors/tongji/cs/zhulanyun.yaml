bio_raw: '姓　　名

  祝澜耘

  职　　称

  博导/硕导

  个人主页

  https://lanyunzhu.site

  电子邮件

  zhulanyun@tongji.edu.cn

  通讯地址

  上海市嘉定区曹安公路4800号济事楼314

  祝澜耘，同济大学计算机科学与技术学院长聘副教授（青百A岗）、博士生导师，国家级青年人才（海外）。长期从事世界模型、具身智能与多模态基础模型研究。近五年来，在TPAMI、ICML、NeurIPS、CVPR、ICCV等国际顶级期刊与会议发表论文40余篇，担任CCF推荐期刊Pattern
  Recognition与The Visual Computer编委，并担任CVPR、ICCV、ECCV、ICML、NeurIPS、ICLR、TPAMI、TIP、TMM等顶级会议与期刊审稿人。

  现任国家具身智能中试基地技术委员会委员。在具身智能、空间智能与多模态基础模型等方向的多项研究成果，已在腾讯、华为、中国电信、阿里巴巴、商汤科技等知名企业实现技术转化，服务相关核心业务。主持研发行业领先初创公司的多项核心技术产品，参与千卡集群世界模型研发，相关工作获得产业界与投资界高度认可。

  课题组与团队氛围良好，科研资源充足（计算资源、具身智能机械臂等）。研究方向为学术前沿与产业热点，学术发展前景与就业前景都很好。老师长期参与一线科研工作与实际工程项目开发工作，可为学生提供直接、有效的指导。课题组与美国、英国、中国香港、新加坡等地多所高校保持密切合作，并与英伟达、腾讯、阿里巴巴、字节跳动、快手、华为以及具身智能、世界模型领域的多家明星创业公司联系紧密，可推荐优秀学生去国内外知名企业或学校实习/工作和出国交流/深造。

  正在招收2027年入学的研究生，欢迎有志于开展高价值科研工作的硕士研究生（保研、考研）、博士研究生（直博、普博）加入，也欢迎对科研感兴趣的本科生同学加入课题组发表一作论文。有意者请将个人简历发送至：zhulanyun@tongji.edu.cn'
