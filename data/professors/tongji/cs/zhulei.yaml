  余篇，主编英文学术专著

  2

  部，获

  ESI

  高被引

  /

  热点论文

  9

  篇，

  Google Scholar

  引用超

  1.4

  万次，

  H

  因子

  64

  。曾获

  CCF A

  类会议最佳论文提名奖

  2

  次，

  1

  篇论文入选

  “

  中国百篇最具影响国际学术论文

  ”

  。现任

  ACM TOMM

  、

  IEEE TBD

  编委，

  CCF A

  类会议领域主席（

  AC

  ），兼任中国图象图形学学会（

  CSIG

  ）青年工作委员会副秘书长。承担国家自然科学基金青年

  /

  面上

  /

  重点

  /

  国家重点研发计划

  /

  上海市经信委百团百项

  /

  上海市科委中央引导地方科技发展资金项目等

  10

  余项科研项目。荣获省自然科学二等奖、吴文俊人工智能自然科学二等奖、

  ACM

  中国

  SIGMM

  新星奖等，入选斯坦福大学全球前

  2%

  终身科学影响力榜单（学院

  1/9

  ）等。带领团队研发无界世界模型，

  CVPR 2026 WorldArena

  挑战赛中，取得开源模型全球第

  1

  、总榜第

  2

  的成绩。

  曾指导研究生在

  CCF A

  类会议、

  ACM/IEEE

  汇刊及中科院

  SCI

  一区期刊发表高水平论文

  40

  余篇，

  2

  篇获

  CCF A

  类会议最佳论文提名奖。所指导学生获省部级及以上荣誉

  20

  余人次，包括中国自动化学会优秀硕士论文、中国电子学会硕士论文激励计划、省优秀博士论文、省优秀硕士论文、省研究生优秀成果一等奖、省高等学校优秀学生等。

  课题组长期招收博士、硕士、博士后和科研助理。我们主要做面向空间智能的世界模型，是未来人工智能突破的重要方向，既有学术前沿问题，也有真实产业需求，研究内容不空、不虚，就业和发展前景都很好；团队科研资源充足，算力支持到位，补贴待遇有保障，科研培养有方法，帮助大家尽快进入科研状态；组内氛围简单纯粹，大家专注把科研做好，不搞复杂人际关系；隶属院长团队，依托高水平平台和国家

  /

  上海市重大项目，不仅能发表高水平论文，也能参与真实系统落地，真正提升科研能力和工程实践能力。

  欢迎计算机、软件、自动化、数学、统计等相关背景、致力于做有价值科研的同学加入。我们期待您：

  ①

  热爱学术研究、有内驱力；

  ②

  踏实进取、勤于动手与思考；

  ③

  具备良好的编程能力及扎实的英语、数学基础。有意者请将简历发送至

  leizhu0608@gmail.com

  ，亦欢迎来同济大学嘉定校区济事楼本人办公室当面交流。'
