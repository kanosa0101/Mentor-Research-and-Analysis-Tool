bio_raw: '朱磊，同济大学研究员、博士生导师，教育部青年长江学者，小米青年学者，计算机科学与技术学院院务助理，同济大学工程智能研究院大模型与算法中心负责人。主要研究方向为高效能多模态大模型与空间智能。

  已在

  Proceedings of the IEEE

  、

  IEEE TPAMI

  、

  CVPR

  、

  NeurIPS

  等中国计算机学会（

  CCF

  ）推荐

  A

  类期刊和会议发表学术论文

