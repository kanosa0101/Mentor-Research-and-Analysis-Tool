bio_raw: '姓　　名

  孙杳如

  职　　称

  教授

  学　　科

  计算机科学与技术学科

  专　　业

  计算机科学与技术

  研究方向

  人工智能（机器学习、计算机视觉、自主无人系统、自然语言处理、人机交互）

  导师类型

  博导/硕导

  电子邮件

  yaoru@tongji.edu.cn

  联系电话

  通讯地址

  上海市嘉定区曹安公路4800号智信馆456

  同济大学计算机科学与技术系教授、博士生导师。曾在爱丁堡大学人工智能系获人工智能博士学位、伯明翰大学行为的脑科学中心等高校研究院从事科研工作。

  主要研究领域包括人工智能、计算机视觉、自然语言处理、自主机器人等。主持过

  国家自然科学基金委、科技部、上海市科委等国家级和省部级多个人工智能领域科研项目，研究成果包括发表于Artificial Intelligence、IEEE Transactions等国际高水平期刊及会议上的学术论文以及国际和国内发明专利等，担任过多个国际SCI期刊编委和客座编委、国际学术会议主席和程序委员会主席等。

  实验室：人工智能实验室（智信馆478）

  欢迎有志攻读硕士、博士、博士后、访问学者等的同学和同仁与我联系。'
