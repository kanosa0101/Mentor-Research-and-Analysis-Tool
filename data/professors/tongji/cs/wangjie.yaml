bio_raw: '王 洁

  副教授，博导/硕导

  Jie Wang

  Ph.D., Associate Professor

  Email: wangjie_tongji''AT''tongji.edu.cn

  Office: 济事楼507

  研究方向 Research Interests

  边缘智能 Edge Intelligence

  联邦学习 Federated Learning

  网络系统 (物联网, 信息物理系统, 社交网络等) 的建模与性能评估 Modeling and Performance Evaluation of Networked
  Systems

  教育背景 Background

  Aug. 2014 - Oct. 2019 Ph.D. in Computer Engineering, North Carolina State University
  (Advisor: Dr. Wenye Wang)

  Sep. 2010 - Mar. 2013 M.S. in Signal and Information Processing, Tongji University

  Sep. 2006 - Jun. 2010 B.S. in Communication Engineering, Tongji University

  科研项目 Projects

  Apr. 2023 – Mar. 2026 上海市自然科学基金科技创新行动计划《复合级联故障下的物联网系统韧性研究》，主持

  Jan. 2022 – Dec. 2024 国家自然科学基金青年项目《边缘计算网络中的数据可用性研究》（已结题），主持

  2022上海市领军人才（海外）青年人才计划

