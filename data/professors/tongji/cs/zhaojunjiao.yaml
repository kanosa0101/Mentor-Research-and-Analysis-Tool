  上海市曹安公路4800号电信大楼232室

  赵君峤博士现为同济大学计算机科学与技术学院副教授。于2011年获得武汉大学摄影测量与遥感专业博士学位。期间曾得到中德合作项目“三维城市信息解译”资助先后前往德国慕尼黑工业大学和汉诺威大学进行学术访问。2012年至2014年前往荷兰代尔夫特理工大学从事博士后研究。主要研究兴趣为智能无人系统、SLAM、强化学习等。为同济大学“TiEV途灵”智能无人系统研究团队负责人，研发“TiEV途灵”与“TiEV途灵plus”无人车，参与多届基金委举办的“中国智能车未来挑战赛”。目前主持完成国家自然科学基金面上项目一项，国家自然科学基金青年项目一项，参与多个国家重点研发计划项目。

  近五年在高水平会议和期刊中发表论文近50余篇。

  欢迎有学术梦想，对无人系统、神经网络SLAM以及强化学习具有兴趣的同学与我联系！

