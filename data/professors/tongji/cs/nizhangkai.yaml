title: 副教授
bio_raw: '倪张凯，博士，同济大学计算机科学与技术学院副教授、博士生导师、院务助理，入选上海市领军人才（海外）青年人才、上海市浦江人才计划。

  2021

  年

  10

  月毕业于香港城市大学计算机科学系并获博士学位，并于

  2021

  年

  10

  月至

  12

  月在该校任博士后研究员。

  2017

  年

  7

  月至

  2018

  年

  7

  月在新加坡南洋理工大学电气与电子工程学院任助理研究员。

  主要从事计算机视觉、人工智能、空间智能与医疗影像分析等方向研究，重点关注视觉感知与生成、三维场景理解与重建、智能医学影像分析等前沿问题。以第一作者或通讯作者在

  IEEE TPAMI

  、

  TIP

  、

  IJCV

  、

  CVPR

  、

  ICML

  、

  NeurIPS

  等国际权威期刊与会议发表学术论文

  50

  余篇，申请及获授权国内外发明专利

  20

  余项，

  Google Scholar

  引用

  2000

  余次。主持国家级、省部级及企业合作科研项目

  9

  项，包括国家自然科学基金面上项目、青年项目和国家重点研发计划子课题等；参与国家自然科学基金面上项目、科技创新

  2030—

  重大项目课题、中国工程科技发展战略上海研究院咨询研究项目等国家及省部级科研项目

  6

  项。曾获

  ACM

  中国上海分会新星奖、日内瓦国际发明展银奖、中国电子学会优秀硕士学位论文奖等荣誉。教学育人方面，获同济大学优秀毕业设计指导教师、优秀本科生导师、新生院优秀班主任等荣誉，指导学生多次获上海市优秀毕业生、小米特等奖学金等荣誉。学术服务方面，现担任

  CCF

  多媒体技术专业委员会执行委员、

  CSIG

  三维成像与显示专业委员会委员、

  VALSE

  执行领域主席委员会执行委员、上海市图像图形学学会元宇宙专业委员会副主任、上海市计算机学会计算机视觉专业委员会副秘书长等职务。

  欢迎本科生、硕士生、博士生及有意开展科研合作的同学联系交流。希望加入课题组的同学重视科研诚信与团队合作，对科研保持浓厚的兴趣和好奇心，愿意主动思考、动手实践并持续学习。课题组鼓励学生结合自身兴趣探索研究方向，在充分交流、相互尊重的基础上，围绕有意义的问题开展深入、持续的研究。

  联系方式：

  zkni@tongji.edu.cn

  个人主页：

  https://eezkni.github.io/'
