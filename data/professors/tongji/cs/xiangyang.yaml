  向阳 同济大学教授，博士生导师，1999年12月毕业于哈尔滨工业大学获博士学位。兼任上海市信息学会副会长、上海市建设与交通技术委员会委员、大数据流通与交易技术国家工程实验室专家委员会专家、中国电子商务创新推进联盟专家委员会委员、中国软件行业协会系统工程分会理事，多届国家及上海市科技奖励会议评审专家。

  长期从事大数据领域有关问题研究，具体研究方向包括：大数据智能信息处理、数据挖掘、数据仓库、智能决策支持系统、语义计算、智能问答系统、知识图谱、搜索引擎、信息系统等。近年来已主持完成和主持在研973课题1项（网络大数据计算的基础理论及其应用研究之课题四网络大数据内容建模与语义理解方法研究）、国家自然科学基金项目4项、国家863项目1项、国家科技支撑计划项目1项、上海市科委经信委项目6项、获教育部科学技术进步二等奖2项（其中1项排名第1）、获上海市科技进步二等奖1项（排名第1），获山东省科技进步三等奖1项、获山东省教委科技进步二等奖1项。发表学术论文100余篇，申请获批发明专利10项，获软件著作权5项。出版专著3本，出版国家十一五规划教材1本。

  主要教学工作有：为博士生开设“数据仓库与数据挖掘技术”、“智能决策支持系统”等；为本科生开设“数据库原理”、“数据仓库与数据挖掘技术”“信息系统分析与设计”、“电子商务概论”等。'
