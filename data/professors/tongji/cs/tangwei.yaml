bio_raw: '基本信息

  电子邮箱:

  weitang@tongji.edu.cn

  个人主页:

  https://tthinking.github.io/

  办公室: 济事楼408R

  唐伟，2024年博士毕业于武汉大学计算机学院人工智能专业，同年加入同济大学计算机科学与技术学院，任助理教授。

  近年来，以第一作者身份在

  IEEE TIP

  、

  IEEE TMM

  、

  IEEE TCSVT

  、

  PR

  、

  IPM

  、

  IEEE TCI

  等CCF-A类期刊/ CAAI-A类期刊/ IEEE Trans汇刊/中科院一区TOP期刊发表论文十余篇，总被引2000余次。其中

  ESI热点论文2篇

  ，

  ESI高被引论文7篇

  ，

  IEEE Signal Processing Society年度下载全球前25篇论文2篇

  ，

  期刊年度最佳论文1篇

  。

  获得国家发明专利授权3项。受邀担任Information等SCI期刊客座编辑、ICCPR 2025 Session Chair、IEEE PRMVAI 2026
  Workshop Chair、ICCBD 2026 Track Chair。长期受邀担任ACM Computing Surveys、IJCV、Information
  Fusion、IEEE TIP、IEEE TNNLS、IEEE TMM、IEEE TCSVT、PR、EAAI、IEEE JBHI、IEEE TIM、IEEE TCI、AAAI、IJCAI等40余个国际著名期刊/会议审稿人。获批主持同济大学“医学+X”交叉研究项目培育项目。详见个人主页：https://tthinking.github.io/
  。

  欢迎计算机、自动化、电子信息和数学等相关专业的同学联系。

  研究方向：

  AI+X

  ⟡

  AI for Perception: 多源信息融合感知、计算机视觉

  ⟡

  AI for Medicine: 智慧医疗、辅助诊断、医学影像分析

  ⟡

  AI for Science: 药物-药物相互作用、药物生成

