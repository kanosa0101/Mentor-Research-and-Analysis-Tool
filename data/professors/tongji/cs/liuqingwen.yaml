  联系电话

  通讯地址

  上海市曹安公路4800号电信大楼

  研究方向：

  AI大模型（AIGC、Agent）、端侧AI、具身智能、自主无人集群系统、智能物联网

  简介：

  刘庆文，教授、国家级海外优青。担任同济大学计算机科学与技术学院/自主智能无人系统科学中心博士生导师。美国明尼苏达大学硕士/博士，中国科学技术大学学士。论文他引近5000次；一篇一作论文他引1200余次。获多项国际专利，并被Cisco思科公司成功收购。主持或参与国家自然科学基金项目，国家重点研发计划子课题，上海市人工智能重大专项、学科交叉联合攻关项目等。入选爱思唯尔（Elsevier）中国高被引学者；获得“华为难题揭榜火花奖”。发表通讯/一作中科院一区期刊/CCF-A类会议论文50余篇。获得中国发明专利授权20余项。担任IEEE
  Transactions on Artificial Intelligence Associate Editor, IEEE Transactions on Wireless
  Communications Editor。

  欢迎自驱力强、认真负责、积极主动的访问学者，研究员，博士后，保送或报考研究生，及本科生，联系我们参与学术研究或工程实践方向的课题。

  实验室主页：

  https://lmqclare.github.io/Winglab/'
