  卫志华，同济大学教授，同济大学模式识别与智能系统专业博士，法国里昂二大信息学博士。现任同济大学计算机科学与技术系教授，博士生导师，计算机科学与技术系副主任，同济大学计算机与信息技术国家级实验教学示范中心主任，担任上海市计算机学会学术工作委员会副主任，中国文化产业协会文化元宇宙专委会副秘书长，中国人工智能学会粒计算与知识发现专业委员会委员，中国人工智能学会自然语言理解专业委员会委员，国际期刊Array副主编等职。研究方向包括：机器学习、图像内容分析、自然语言处理等，在CVPR、IJCAI、WWW等国际会议和Trans.
  Cybernetics等国际期刊发表论文80余篇，出版教材2部；近年来主持国家重点研发计划项目课题、国家自然科学基金项目等国家级项目6项，主持上海市和企业合作项目20余项，组织完成了公安部重大专项1项，先后获得国家级教学成果二等奖、上海市教学成果特等奖、上海市科技进步二等奖、吴文俊人工智能自然科学二等奖等奖项。主持建设了“中文信息处理”国家级一流线下课。'
