bio_raw: '姓　　名

  张奇

  职　　称

  长聘副教授

  学　　科

  计算机科学与技术学科

  专　　业

  计算机科学与技术

  研究方向

  人工智能、数据科学、脑认知分析

  导师类型

  博导/硕导

  电子邮件

  zhangqi_cs@tongji.edu.cn

  通讯地址

  上海市曹安公路4800号智信馆468室

  张奇，同济大学计算机科学与技术学院长聘副教授，先后获得北京理工大学计算机科学与技术工学博士学位和悉尼科技大学分析学哲学博士学位。入选国家级人才（海外）、上海白玉兰海外高层次青年人才、上海市浦江人才计划，主持国家自然科学基金青年科学基金项目1项，参与科技部重点研发、国自然基金项目多项。主要研究方向为多模态信息处理，具体包括脑视觉编解码、时间序列分析、多模态模型压缩等，在人工智能和数据科学领域的顶级国际期刊和会议上发表论文60余篇，包括TKDE、TOIS、TNNLS、NeurIPS、ICML、ICLR、AAAI、IJCAI、WWW、ACM
  MM、KDD等。

  近年来担任AAAI、IJCAI、ICLR、NeurIPS、ICML、ACM MM、CVPR等会议程序委员或领域主席，并在多个国际期刊担任客座编辑和审稿人包括TPAMI、TKDE、TSMC、TOIS、Machine
  Learning、TIST等，并在The Web Conference、KDD等多个高水平会议上进行受邀讲座和专题讲座（Tutorial），担任CSIG青工委副秘书长、上海计算机学会计算机视觉专委副秘书长、YOCSEF上海学术AC委员。

  热烈欢迎具备科研热忱、践行求实精神、敢于突破边界的同学加入到实验室。'
