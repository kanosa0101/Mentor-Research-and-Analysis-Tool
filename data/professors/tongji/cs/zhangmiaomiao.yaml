bio_raw: '张苗苗

  ZHANG MIAO MIAO    博导、研究员

  电子邮件: miaomiao@tongji.edu.cn

  主讲课程：

  算法分析和设计

  实时系统

  软件工程形式化方法

  研究方向：

  智能系统的模型学习和验证

  强化学习

  人机物联网系统的软件定义

  可信人工智能

  欢迎对模型算法、机器和模型学习以及智能系统验证等方面感兴趣的同学报考本实验室！

  部分科研项目简介

