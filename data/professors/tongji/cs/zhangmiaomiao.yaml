  2021-2025

  ，子课题负责人

  国家自然科学基金项目“时间系统的模型学习”

  2020/1-2023/12

  ，第一负责人

  国家自然科学基金项目“扩展的线性时段不变式的模型检验”

  2015/1-2018/12

  ，第一负责人

  国家自然科学基金项目“基于构件的异构嵌入式系统的模型驱动设计”

