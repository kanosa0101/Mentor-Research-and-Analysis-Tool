  上海市曹安公路4800号电信大楼

  丁志军，博士，教授，博士生导师，同济大学电子与信息工程学院副院长，同济大学计算机科学与技术国家一流本科专业建设点负责人，主持上海市一流课程，获国家教学成果二等奖、上海市教学成果特等奖等。兼任中国自动化学会网络计算专委会主任、中国计算机学会服务计算专委会委员、上海市计算机学会副理事长、上海市人工智能学会理事，IEEE高级会员（Senior
  Member），国际SCI期刊Computing and Informatics、计算机科学等期刊编委，面向新工科专业建设计算机系列教材编委等。

  主要研究领域为云计算及服务、智能化软件工程、大数据智能等。具体研究方向包括Pass云平台、流程智能管理、服务个性化推荐、ERP工业软件、大规模跨地域算力网络、软件演化、模型检测、大数据智能及在金融科技、智慧城市、边缘智能等领域的应用。

  先后主持承担国家重点研发计划课题、国家自然科学基金项目和省部级纵向项目。作为主要成员参与国家自然科学基金项目（面上、重大专项等）、973项目、863项目等多项课题。出版学术专著1部，在IEEE
  TPDS、IEEE TSC、IEEE TSE、IEEE TOC、IEEE TASE、ACM Computing Surveys、ACM TAAS、ACM TECS、中国科学、计算机学报、软件学报等国内外期刊和WWW、ICWS、ICSOC、IPDPS、ICPP等学术会议上发表论文100余篇，获国际会议最佳论文奖和最佳学生论文奖，获全国优秀博士学位论文提名奖、上海市优秀博士学位论文奖。获1项国家技术发明二等奖和2项国家科技进步二等奖，6项省部级科研一等奖励，60余项（中国、美国）授权发明专利等。入选高校计算机专业优秀教师奖励计划、教育部新世纪优秀人才计划、上海市曙光学者计划、上海市青年科技启明星计划与跟踪计划等。

  指导的研究生获首届全国人工智能应用场景创新挑战赛总决赛特等奖、国家奖学金、上海市优秀毕业生、上海市优秀硕士学位论文奖等。

  欢迎有志攻读硕士、博士、博士后的同学或参与课题创新实践的本科生联系。'
