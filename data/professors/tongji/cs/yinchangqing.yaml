  部分科研项目简介

  2009年 参与研发、设计世博会的城市文明馆

  2008年参与“中意友好年新媒体作品展”、国家级项目“国家图书馆虚拟现实”项目

  国家重点攻关（S219）项目 “计算机网络化病毒的防治及追踪技术研究” 职责：系统设计和部分实现

  国家863计划课题 “核心路由器公平排队技术研究”，职责：算法研究、系统设计和部分系统实现

  上海市电力公司二次系统安全软课题研究，职责：需求分析，设计，认证和签名实现

  华为基金 无线数据包队列算法研究，职责：建模与模拟仿真

  上海市档案馆利用管理系统，职责：设计与部分实现，数据库触发器设计和存储过程优化

  上海市期货交易所网上交易平台，职责：需求分析，设计和网络通信实现

  获奖经历

  2009年获得 国家发明专利一项

  参与的个人数字伙伴软件被评为99年度江苏省科研三等奖'
