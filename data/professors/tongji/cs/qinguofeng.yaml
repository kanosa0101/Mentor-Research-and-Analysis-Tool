  1.个人基本情况

  秦国锋，男，自2007年起在同济大学电子与信息工程学院计算机科学与技术系任副研究员。独有发明专利8项，解决超大交流电微小电阻测量世界难题，取得显著经济社会效益，近年来，在IEEE
  transactions、Neural Computing and Applications 等期刊发表论文50余篇，SCI检索近10篇，EI检索40篇，出版著作2部，发表教育教学核心期刊论文多篇，形成特色鲜明的计算机系统理论与实验贯通的教学模式和方法，重点研究图像识别、医学造影成像分析及嵌入式传感器测控。承担和参与多项国家级、省部级、校企合作项目，研发的产品已创造社会经济效益3000余万元。长期担任International
  Conference on Cooperative Design, Visualization and Engineering组织委员会委员，及2007年大会总秘书长，是IEEE、Springer及国内外等期刊与会议论文审稿专家。

  2.当前主要研究方向

  （1）高性能集群计算理论研究，及资源调度服务支撑技术研究；

  （2）信息可视化表达与处理；

  （3）协同设计、协同可视化、协同工程以及协同工程的理论与技术的研究；

  （4）复杂系统融合集成技术研究；

  （5）新型网络通信技术研究与嵌入式智能软硬件系统开发与研究。

  3.成果与应用

  目前，智能嵌入式Linux车载计算机与高性能管理支撑平台已成功应用于公交、 出租车、物流、铁路等公共交通行业；产品和技术广泛应用于国家重点行业领域。'
