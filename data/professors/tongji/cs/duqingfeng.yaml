bio_raw: '杜庆峰

  DU QING FENG 博士 教授，博导

  智慧城市感知与规划重大工程软件技术教育部工程研究中心 常务副主任

  电子邮件：Du_cloud@tongji.edu.cn

  主讲课程：

  1.软件工程(上海市重点课程)

  2.软件测试技术

  3.软件度量

  研究方向：

  1.

  大数据及机器学习

  2.

  软件工程（软件估算模型、软件（系统）故障模型、软件测试与质量控制及软件的韧性等）

  目前主要研究领域

  1.

  深度学习的云平台复杂系统的故障检测、诊断分析，故障注入（测试）及预测模型研究；

  2.

  知识图谱的微服务架构云平台的智能运维研究；

  3. AI

  （人工智能）语义场景研究。

  4.

  深度学习的软件缺陷预测方法研究。

  工作经验

  1991年7月---2003年11月：

  2003年至今，同济大学软件学院，中国软件测试认证委员会资深专家、专家组组长，中国软件行业协会软件过程改进分会专家，同济大学第二届教学质量督导专家，国家自然科学基金委员会评议专家，同济大学教学名师.

  1994年11月～2003年3月在上海华腾软件公司工作.

  1993年10～1994年11月在安徽大潮软件技术公司从事软件开发及管理.

  1988年7月～1993年10月在安徽省测绘局工作.

  2013年12～2014年7月在美国圣地亚哥州立大学高级研究访问学者.

  部分研究项目：

  1)主持科技部科技创新2030—重大项目《数字货币风险分析和可信防控技术研究及示范应用》课题《知识驱动的风险防控与数字身份长期安全》。

  2)主持国家自然科学基金项目面上项目《SVG格式的时态GIS数据动态解析模型及增量存取机制研究》。

  3)主持国家自然科学基金高铁联合基金重点项目《高铁隧道采集-设计-施工一体化智能建造关键技术》子课题。

  4)主持科技部国家重点研发计划《城市重大市政设施智能化运维与管控平台构建及应用示范》子课题《市政设施运营状态网络协同自校正与虚拟重构技术研究》。

  5)主持与华为合作项目《opnfv测试领域技术研究》。

  6)主持与华为合作项目《OPNFV故障注入技术及可靠性测试研究》。

  7)主持与华为合项目《电信领域微服务定界定位运维本体模型构建》。

  8)

  主持与华为合作项目《复杂系统更新作业影响半径模型研究》。

