title: 副教授
bio_raw: '张毅超，

  同济大学计算机科学与技术学院副教授、博士生导师、数据科学与人工智能系副主任。

  研究领域：

  长期致力于复杂网络、博弈论、链路预测、社交网络、量子计算、水声信号识别、智慧医疗、智能建造等方向的研究。

  学术成果：

  共主持国家自然科学基金面上、青年科学基金项目各1项，上海市自然科学基金1项，作为科研骨干参与科技部国家重点研发计划2项，社科重大项目1项，国家自然科学基金重点项目1项、面上项目多项。曾以第一、通讯作者发表SCI论文20余篇。其中第一作者15篇，共同一作3篇，通讯作者3篇，封面论文1篇，ESI高被引论文1篇，JCR-Q1
  12篇，SCI总引用次数400余次（其中他引390余次）；此外，发表专著1本、申请发明专利13项、软件著作权1项；曾获IEEE International Conference
  on Internet of People (IoP 2015) Outstanding Paper Award；一篇论文入编多院院士陈关荣教授《复杂网络基础》一书。

  学术职务：

  现任中国工业与应用数学学会终身会员，复杂网络与复杂系统专业委员会委员。此外，还是CCF数据库专委会执委、生物信息学专委会通讯委员、SCI期刊Cognitive
  Neurodynamics、Mathematics客座编辑、Nature Sustainability、IEEE Transactions on Cybernetics、IEEE
  Transactions on Systems, Man and Cybernetics: Systems、IEEE Transactions on Network
  Science and Engineering、IEEE Transactions on Circuits and Systems II、Physical Review
  E等复杂网络以及人工智能顶级或权威期刊审稿人，国际会议Program Committee: WWW 2025和AAAI 2026。

  电子邮箱

  ：

  yichaozhang@tongji.edu.cn'
