  通讯地址

  上海市曹安路4800号同济大学智信馆217室

  张亚英，教授，2004年毕业于上海交通大学计算机科学与技术系，获工学博士学位，毕业后进入同济大学计算机系任教，主要的研究方向包括大数据与人工智能、智能交通系统以及分布计算。

  主讲本科课程“数据结构”、“算法设计与分析”和硕士课程“分布式系统”。

  长期从事时空大数据挖掘和分布式计算等方面的基础研究工作。先后承担和参与了包括国家自然科学基金、国家重点研发计划、科技部国际重点合作项目、国家基金委重大集成计划、上海市基础重大计划等各类科研项目20余项。对多源数据的融合与清洗、时空大数据的
  挖掘与分析、数据驱动的漂移检测、分布计算环境中的大数据存储与计算任务调度、数据流中的不确定性建模与评估等领域进行研究，并在智能交通信息系统等多个领域进行应用验证。

