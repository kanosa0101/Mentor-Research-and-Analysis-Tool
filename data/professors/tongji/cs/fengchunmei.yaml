  冯春梅，同济大学计算机科学与技术学院长聘副教授（青百A岗）、博士生导师，国家级青年人才（海外）。长期从事医疗人工智能、多模态大模型与AI智能体等方向研究，致力于推动人工智能在真实复杂场景中的高效、安全与可信应用。拥有丰富的国际科研与教学经历，包括都柏林大学（UCD）助理教授、新加坡科技研究局（A*STAR）研究员，并与斯坦福大学（Stanford
  University）、伦敦国王学院（KCL）与阿卜杜拉国王科技大学（KAUST）开展访问研究合作。2024年入选“Rising Star in AI”，该荣誉由KAUST
  AI Initiative评选（负责人为“LSTM之父” Jürgen Schmidhuber）。

  近年来，在人工智能与医学影像领域国际顶级期刊与会议发表论文60余篇，多篇论文入选ESI高被引论文。研究成果发表于CVPR、ICCV、ICLR（Spotlight）、MICCAI（Early
  Accept）、AAAI、ECCV，以及Nature Communications、npj Digital Medicine、TPAMI、IJCV、TIP、TNNLS、TMI等国际顶级期刊与会议。长期担任TPAMI、CVPR、ICCV、ICML、NeurIPS、ICLR等国际顶级期刊与会议审稿人，积极参与国际学术共同体建设。

  课题组聚焦于：

  - 医疗大模型与多模态学习

  - AI智能体与复杂任务推理

  - 医学影像分析与临床智能系统

  - 可信、安全与可解释人工智能

  - 真实世界场景中的AI系统落地

  课题组学术氛围开放自由，鼓励原创性与高价值研究，注重“理论创新、系统实现与临床应用”协同推进。团队与国内多家顶级三甲医院保持长期深度合作，拥有丰富的高质量临床数据与真实应用场景支撑。同时，课题组与全球多所知名高校和研究机构保持紧密合作关系，并积极推动学生参与国际合作研究、海外交流访问及联合培养。优秀学生将有机会获得国际顶尖高校交流与访问机会、与全球知名研究团队和头部科技企业合作科研、推荐至国内外知名高校深造的机会！

  现招收2027年入学的硕士研究生（保研/考研）、博士研究生（直博/普博）、博士后、科研助理，同时欢迎具有科研热情与创新潜力的校内本科生提前进入课题组参与科研训练与顶级论文研究。课题组鼓励学生开展高水平原创研究，支持国际合作交流与学术发展，欢迎对人工智能前沿方向充满热情、具备扎实编程能力与科研兴趣的同学加入团队，共同探索下一代智能系统。

  有意者请将个人简历发送至：

  chunmeifeng

  @tongji.edu.cn

  或

  fengcm.ai@gmail.com'
