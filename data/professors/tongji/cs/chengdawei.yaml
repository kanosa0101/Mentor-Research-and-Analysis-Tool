bio_raw: '姓　　名

  程大伟

  职　　称

  研究员

  学　　科

  计算机科学与技术学科

  专　　业

  计算机科学与技术

  研究方向

  大数据分析与挖掘、图数据学习、深度学习、多智能体

  联系电话

  通讯地址：同济大学嘉定校区智信馆

  电子邮件：dcheng@tongji.edu.cn

  程大伟，同济大学计算机学院研究员、博士生导师，国家优秀青年基金获得者。博士毕业于上海交通大学计算机科学与工程系。曾在教育部人工智能重点实验室从事博士后研究工作。担任中国计算机学会高级会员、数字金融分会副秘书长、大数据专家委员会执行委员；国家级网络金融安全协同创新中心主任助理。主要研究领域包括大数据分析与挖掘、图数据学习、金融大数据、多智能体、强化学习与生成式人工智能。教学课程：算法分析与设计、机器学习、深度学习。

  在TKDE、KDD、NeurIPS、ICML、ICLR、ICDE、SIGIR、VLDBJ、ACL、AAAI、IJCAI等数据科学/人工智能领域的国际学术会议和期刊上发表百余篇学术论文，多篇入选ESI高被引论文。入选斯坦福大学和Elsevier共同发布的年度全球前2%顶尖科学家榜单。主持国自然青年科学基金（B类、C类）及面上项目，先后承担/参与国家重点研发计划、中国工程院战略咨询与研究项目、中国证监会科技监管创新研究项目、中国金融期货交易所、国家电网等科研项目，累计申请/授权20余项中国/美国发明专利/软著。获吴文俊人工智能科技进步一等奖、东方英才青年项目（原上海市青年拔尖人才计划）、世界人工智能大会青年优秀论文奖、上海市计算机学会科技进步一等奖、上海市优秀发明金奖、ACM中国上海新星奖、国家电网科技进步二等奖等荣誉。担任TKDE、TPAMI、TNNLS、FCS、计算机学报、Intelligent
  Computing等期刊编委/(客座)主编/审稿人，担任KDD、ICDE、NeurIPS、ICML、ICLR、ACL、AAAI等国际学术会议领域主席/(资深)程序委员会委员。

  Personal Homepage: http://cs1.tongji.edu.cn/~dawei/

  备　　注

  博导、硕导'
