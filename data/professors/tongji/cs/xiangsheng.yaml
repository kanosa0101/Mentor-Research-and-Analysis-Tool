  个人简介：

  向声，现为同济大学计算机科学与技术学院研究员，国家级高层次人才青年人才，上海市白玉兰海外高层次青年人才。2025年博士毕业于悉尼科技大学，同年加入同济大学计算机科学与技术学院。担任中国计算机学会数字金融分会执行委员，研究方向为生成式人工智能系统和智能数据合成，专注于基于学习的图数据模拟，金融网络模拟，以及生成式人工智能系统，至今已在TKDE、ICDE、VLDBJ、AAAI、ACM
  WWW、IEEE Transactions on Big Data等大数据领域顶级期刊/会议上发表20余篇论文，其中以第一作者/通讯作者身份发表论文10余篇。累计申请/授权多项发明专利。先后获得世界人工智能大会青年优秀论文奖、互联网与大数据国际会议最佳学生论文奖等荣誉。目前担任KDD、NeurIPS、VLDB、ICDE等多个CCF-A类会议程序委员，担任TKDE、TNNLS等多个顶级期刊的审稿人。

  我正在寻找有上进心的本科生/研究生，目标是在大数据模拟合成、生成式人工智能系统、金融网络模拟等课题上做出有影响力的工作。请随时通过电子邮件与我联系。欢迎通过xiangsheng
  [AT] tongji.edu.cn联系我！

  代表性论文（详见个人主页）：

  [1] Sheng Xiang, Guibin Zhang, Dawei Cheng, Ying Zhang (2025).

  Enhancing Attribute-driven Fraud Detection with Risk-aware Graph Representation

  . In

  IEEE TKDE 2025

  .(CCF-A, 第一作者)

  [2] Sheng Xiang, Chenhao Xu, Dawei Cheng, Xiaoyang Wang, Ying Zhang (2025).

  Efficient Learning-based Graph Simulation for Temporal Graphs

  . In

  IEEE ICDE 2025

  . (CCF-A, 第一作者)

  [3] Sheng Xiang, Yidong Jiang, Yunting Chen, Dawei Cheng, Guoping Zhao, Changjun
  Jiang (2025).

  Generative Dynamic Graph Representation Learning for Conspiracy Spoofing Detection

  . In

  ACM WWW 2025

  .(CCF-A, 第一作者)

  [4] Sheng Xiang, Mingzhi Zhu, Dawei Cheng, Enxia Li, Ruihui Zhao, Yi Ouyang, Ling
  Chen, Yefeng Zheng (2023).

  Semi-supervised Credit Card Fraud Detection via Attribute-driven Graph Representation

  . In

  AAAI 2023. (CCF-A, 第一作者)

  [5]

  Sheng Xiang, Dawei Cheng, Jianfu Zhang, Zhenwei Ma, Xiaoyang Wang, Ying Zhang (2022).

  Efficient Learning-based Community-Preserving Graph Generation

