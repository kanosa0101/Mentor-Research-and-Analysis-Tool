bio_raw: '饶卫雄

  rao weixiong 教授、博士

  http://sse.tongji.edu.cn/wrao

  wxrao (at) tongji.edu.cn

  主讲课程：

  数据挖掘

  机器学习

  分布式系统

  研究方向：

  机器学习及

  深度强化学习

  应用

  时空

  数

  据科学

  移动计算/边缘计算

  目前本研究组在

  移动计算、数据科学等方向拟招收

  博士/硕士研究生

  。拟根据同学的个人兴趣，与海外的多个研究机构和工业界广泛合作为同学提供良好的研究和工程实践机会。如有兴趣，请发送邮件至邮箱（wxrao (at) tongji.edu.cn）。

  最近更新

  [

  NEW

  ] (2020/07) Three Paper got accepted: "Context-aware Telco Outdoor Localization"
   accepted by IEEE Trans. on Mobile Computing (TMC), "

  SST: Synchronized Spatial-Temporal Trajectory Similarity Search

  " accepted by

  Springer GeoInformatic

  , and "

  IFLoc: Indoor Height Estimation by Telco Data

  " by

  IEEE MDM 2020

  .

  (2020/01) Three

  Paper got accepted: "

  Transfer Learning-Based Outdoor Position Recovery with Cellular Data

  "  accepted by IEEE Trans. on Mobile Computing (TMC), "

  A Data-driven Sequential Localization Framework for Big Telco Data

  " accepted by

  IEEE Trans. on Knowledge and Data Engineering

  (TKDE), and "Accurate Demand Forecasting for Retails with Deep Neural Networks

  " by

  EDBT 2020

  (short paper).

  (2019/11)

  Our Paper "DeepLoc: Deep Neural Network-based Telco Outdoor Location Recovery" by
  Yige Zhang, Yu Xiao, Kai Zhao and Weixiong Rao won the

  Best Paper Award

  at

  MobiQuitous 2019

  (see the photo).

  Two papers got accepted by ACM CIKM 2019:  1) "PRNet: Outdoor Position Recovery
  for Heterogenous Telco Data by Deep Neural Network" and 2) "Experimental Study of
  Multivariate Time Series Forecasting". Congs to Yige and Jiaming.

  We are orgnazing the

  5th Joint Finland-China-Germany Workshop on  Mobile Networking, Analytics and Edge
  Computing

  . Welcome to attend the worshop

  (

  2018-09-04

  )

  .

  One poster paper and one demo paper are accepted by

  Sensys 2018

  : Deep Neural Network-based Telco Outdoor Localization (Poster)

  by Yige Zhang, Weixiong Rao, Yu Xiao, and Frequent Pattern-based Trajectory Completion
  (Demo) by Zhiqiang. Zhang,  Weixiong Rao,  Fehmi Ben Abdesslem  (

  2018-09-04

  )

  Dr Kun Zhang

  from CMU visted us and gave the talk "Causal Modeling and Machine Learning

  "

  (

  2018-7-13)

  Dr Yu Xiao

  from

  Aalto U. visited us and give the talk "

  Visual Crowdsourcing for Smart Mobility

  "

  (

  2018-6-21)

  One paper is accepted by

  ALGOSENSORS 2018:

  Localization of MR Records with Missing RSSI Information by Jinhua Lv, Qinpei Zhao,
  Weixiong Rao, Yige Zhang, Mingxuan Yuan, Jia Zeng (2018-07)

  赵鹏访问

  纽约城市大学、

  美国纽约大学城市科学和发展中心

  的

  Dr.

  Huy T. Vo

  (2017年11-12月).

  张奕格访问德国慕尼黑工业大学

  Prof. Dr.-Ing. Jörg Ott

  和

  Dr. Aaron Yi DING

  (2017年10

  月

  ).

  2017/09: 参加德国慕尼黑工业大学

  "Mobile Networking, Analytics and Edge Computing"FGC 2017 研讨会

  ，报告题目：When Outdoor Localization meets Telco Big Data

  Our paper "Topic Model-Based Road Network Inference from Massive Trajectories" won

  IEEE MDM 2017

  Best Paper Award

  (see the photo)

  个人简介

  自2014年中期加入同济大学软件学院, 曾在

  英国剑桥大学计算机实验室

  (2013),

  芬兰赫尔辛基大学 计算科学系

  (2011-2012)和

  香港科技大学计算机科学与工程系

  (2010) 分别从事副研究员和博士后研究。在2005-2009年期间在

  香港中文大学计算机科学与工程系

  学习，获博士学位。此前分别在北方交通大学和上海交通大学获得本科和硕士学位。

  研究方向及项目

  1、

  分布式计算

  ：

  面向高维稀疏语义空间的云端高通量匹配机理的研究 [国家自然科学基金面上项目 2016-2019]

  面向集群云平台的并行内容发布和订阅技术研究 [上海自然科学基金项目 2015-2017]

  2、

  时空数据科学

  ：

  面向异构稀缺标注样本的全城用户数字足迹恢复关键技术研究

  [国家自然科学基金面上项目 2020-2023]

  立体定位技术研究  [企业合作项目 2019-2020]

  室内外混合定位技术及应用研究 [中央高校基金项目 2017-2019]

  电信时空洞察引擎技术合作项目

  [企业合作项目 2016-2017

  ]

  深度推荐引擎研究

  [企业合作项目 2017-

  ]

  指导学生

  博士生

  ：2019：尹嘉铭[合作]、沈佳静；2020：杨思绮；2021：周添龙

  毕业生：2016级（答辩时间：2021年中）：赵鹏-->美团金融；张奕格-->华为上海。

  硕士生

  ：

  2021级：高宏业；时奕晨

  2020级：杨广大

  2019级：胡嘉鑫[合作]、余秉权、竺金浩

  毕业生：2018级：吕金华-->蚂蚁金服-->货拉拉、张志强-->北大读博；2017级（廖山河-->京东北京、邸晓蕾-->上海证券交易所信息公司、张颖-->国泰君安)；2016级
  (陈柏君-->SAP、冯涛-->京东)；2015级 (黄雨琨-->百度、钟韵松-->上海航天技术研究院、李国华、袁鹏程-->国泰君安、刘思琦-->中国证券登记结算)

  本科毕设

  ：

  2015届：赵俊尧、陆艺青、梁圃核；2016届：胡圣托、姜木慧、黄徐欢、赵鹏、张奕格；2017届：代东洋、廖山河、吴雨霏、刘旭东'
