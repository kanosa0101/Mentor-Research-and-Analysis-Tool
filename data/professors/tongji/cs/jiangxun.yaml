title: 助理教授
bio_raw: '蒋寻，现任同济大学助理教授（特聘研究员）、博士生导师，博士毕业于电子科技大学，并于新加坡南洋理工大学开展国家公派联合培养，主要研究方向是多媒体内容理解、多模态学习及多模态空间智能等。累计在IEEE
  TPAMI、TIP、TMM、TNNLS、TFS、TCSVT、CVPR、ACM MM、AAAI等多媒体/人工智能领域的CCF A类会议或中科院JCR一区Transactions期刊上发表高水平论文20余篇，授权发明专利10余件，获多媒体领域CCF-B推荐国际会议ICME最佳学生论文奖，担任TPAMI、TIP、TMM、NeurIPS、CVPR、ICCV、ACM
  MM、AAAI等多个知名国际期刊/会议审稿人，作为项目骨干参与国家级、省部级重大重点项目及蚂蚁、美团、华为等知名科技企业合作课题项目多项。

  课题组隶属于同济大学多模态空间智能实验室，目前主要围绕多模态机器学习、多模态大模型、空间智能及其应用三个方面开展学术研究与技术应用工作，具体包括：

  1. 多模态机器学习：多模态信息融合、多模态鲁棒表征

  2. 多模态大模型：大模型智能体、大模型推理增强、大模型幻觉消除

  3. 空间智能及其应用：第一视角理解与交互、空间目标定位与自主导航、具身实战应用

  课题组持续招收硕士、博士，可分为学术导向型与应用实战型，培养方案与就读收获有所差异，详情请见课题组主页。也欢迎感兴趣的本科生联系，学术导向可远程参与科研训练，应用实战型暂不支持远程参与。

  研究组主页：https://sig-mipal.github.io/homepage'
