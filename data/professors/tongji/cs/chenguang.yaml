bio_raw: '陈广，慕尼黑工业大学自然科学博士、同济大学长聘教授、上海创智学院全时导师、同济大学科学技术研究院副院长（青干计划），曾任慕尼黑工业大学客座高级研究员。入选国家高层次青年人才计划，担任国家重点研发计划首席科学家，获评上海市东方英才（青年拔尖人才）、上海市青年科技启明星、上海科技青年35人引领计划、首批小米青年学者等荣誉。

  以第一作者/通讯作者在《自然·计算科学》（Nature Computational Science）及 IEEE TPAMI、IJCV、NeurIPS、ICCV、CVPR
  等 CCF A 类国际期刊和会议发表论文 100 余篇。指导学生获世界人工智能大会青年优秀论文奖（WAICYOP 奖）等重要荣誉；培养学生进入 UC Berkeley、CMU、TUM、JHU、NTU
  等高校攻读全奖研究生；合作指导博士后入选“博新计划”并获博士后面上基金。兼任中国人工智能学会具身智能专委会首任秘书长、中国具身智能大会组织委员会主席。

  课题组研究方向聚焦 Embodied AI 与 AI4Science（如生物信息、药物发现），并与 UC Berkeley、TUM、KTH、ETH Zürich
  等国际知名高校保持长期合作。实验室欢迎：

  •

  本科生

  ：成绩优异、编程能力突出、英语良好、自驱力强，且有志于发表高水平论文；

  •

  强基班学生

  ：鼓励优秀学生提前联系，互选导师；

  •

  硕/博申请者

  ：有意在同济大学/上海创智学院继续深造的同学；

  •

  博士后

  ：期待加入，共同开展高水平研究；

  •

  上海创智学院博士生招生

  ：请关注夏令营、金秋营、春季营，欢迎提前联系！

  联系方式：guangchen@tongji.edu.cn

  实验室主页：www.embodiment.ai'
