bio_raw: '邵立智

  邮箱：

  lizhi_shao@tongji.edu.cn

  研究方向：医学图像人工智能算法研究及其在肿瘤临床中的应用（医工交叉）

  欢迎致力于人工智能研究及医学领域应用的同学联系与报考。研究组采用工科+医学合作模式（不需具备专业医学知识，强调“术业专攻”），长期邀请临床领域知名专家参与深度指导，提升医工交叉思维与研究能力。

  指导或联合指导毕业研究生毕业去向：中国医学科学院北京协和医院（读博）、北京工业大学（读博）、郑州大学（读博）、中国医学科学院肿瘤医院（泌尿外科医师）、中国航天科技集团有限公司（工程师）、首都医科大学附属北京回龙观医院（影像科医师）等。

  个人简介：

  现任职同济大学计算机科学与技术学院，

  助理教授（特聘

  研究员

  ）

  、

  博士生导师

  。博士研究生至今研究领域聚焦于医学图像人工智能算法研究及其在肿瘤临床中的应用，研究内容涉及：影像组学、影像病理组学、影像基础模型/图像-语言大模型和多模态医学图像智能体。东南大学计算机博士毕业，中科院自动化所博士后。先后任中科院自动化所助理研究员、安徽大学副教授。中国体视学学会青年托举人才，北京市青年托举人才。主持国自然面上、青年C、博士后面上等项目，并作为子课题负责人多次参与国家重点研发计划、重点项目等。以第一作者、通讯作者（含共同）分别在信息类和医学类
  SCI 期刊发表论文十余篇，包含自然子刊Nature cancer、柳叶刀子刊Lancet Digital Health、精准医学类NPJ Digital Medicine、生物医学工程类
  IEEE TBME、人工智能顶会 NeurIPS、计算机视觉顶会CVPR等。授权发明专利（中国）6项。2024年获北京市

  科学技术进步奖二等奖

  ，多次作为共同执笔人参与专家共识、团体标准制定。所提人工智能辅助直肠癌新辅助疗效预测方法被中国临床肿瘤学会连续六年（2021~2026）写入中国临床肿瘤学会（CSCO）结直肠癌诊疗指南（中文临床肿瘤诊疗权威指南）。

  多次作为骨干参与国家基金委、科技部、北京市科委等重点研发计划项目、重点项目等。与中国医学科学院北京协和医院、中国医学科学院肿瘤医院、北京大学第三医院、上海交通大学医学院附属仁济医院、中山大学肿瘤防治中心、南京医科大学附属第一医院、安徽医科大学第一附属医院等国内多家知名三甲医院的外科、影像科和病理科建立深度医工合作。

  目前任中国体视学学会智慧医疗分会委员、中国老年保健协会泌尿系统增龄性疾病防治分会委员、北京市整合医学会人工智能与转化分会委员、安徽省抗癌协会放射放疗与免疫专委会常务委员。多模态病理智能诊断北京市重点实验室学术委员会成员。《Military
  Medical Research》（2024 IF=22.9）、《Brain-X》青年编委。《Nature Cancer

  》《

  IEEE TBE

  》《

  IEEE JBHI

  》《

  AIIM》等国际期刊审稿人。

