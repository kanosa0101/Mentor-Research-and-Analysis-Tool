bio_raw: '徐行，现任同济大学计算机科学与技术学院教授，青年百人计划

  A

  岗，博士生导师，国家高层次青年人才。

  研究成果

  主要研究方向为多模态信息感知与理解、跨媒体智能分析、多模态大模型应用。已发表人工智能、多媒体、计算机视觉相关领域的中科院

  JCR1

  区

  /CCF A

  类论文

  80

  余篇，

  ESI

  高被引

  /

  热点论文

  10

  余篇，授权国内外发明专利

  30

  余项。获得

  2025

  年教育部科学研究优秀成果奖自然科学奖一等奖，

  2022

  年吴文俊人工智能自然科学一等奖、国际多媒体大会

  ACM Multimedia (CCF A) 2017

  最佳论文奖，多媒体顶级期刊

  IEEE Transactions on Multimedia 2020

  最佳论文奖，人工智能顶级期刊

  IEEE Transactions on Fuzzy Systems (

  中科院

  JCR 1

  区

  )

  杰出论文奖，国际多媒体展览会

  IEEE International Conference on Multimedia & Expo

  （

  CCF B

  ）

  2017

  最佳会议论文铂金奖和

  2022

  最佳学生论文奖等科技成果及国际学术奖励。入选第十四批四川省学术和技术带头人及后备人选。主持包括国自然青年科学基金（

  B

  类、

  C

  类）及面上项目、四川省科技厅重大专项，并参与科技部、国自然及省部级科研项目

  20

  余项。

  人才培养

  指导博士生入选中国科协青年人才托举工程博士生专项计划，多名硕士

  /

  本科生论文入选省级

  /

  校级优秀毕业论文；指导多位本科生发表

  CCF A

  类

  /

  中科院

  JCR 1

  区学术论文，并获得

  CCF A/B

  类会议最佳论文奖；团队硕士研究生毕业去向大多为国内知名互联网公司及国企，从事人工智能

  /

  计算机视觉算法研发。

  招生

  欢迎有志于从事多媒体内容理解、多模态大模型、空间智能方向学术研究和工程应用的同学报考研究生，同时也欢迎计划保研和出国的本科同学提前参与实验室科研训练。（请联系

  Email:

  interxuxing@tongji.edu.cn

  / interxuxing@hotmail.com

  ）

