  欢迎具有强烈成功欲望、学习能力强、数理编程基础良好的同学报考硕/博士研究生，也欢迎学有余力且能够坚持的本科生加入网络与机器智能实验室从事人工智能/优化算法与应用方面的研究，将为大家推荐名校深造和名企实习的机会。实验室目前的项目主要包括国家重点研发计划、国家自然科学基金与企业院所委托的工程项目。

  注：方向1招生原则上要求学生是电子/通信/网络/数学相关专业毕业。

  Recent research directions/近期研究方向:

  1. 网络系统优化（Intelligent communication and networking）

  大规模天线系统 (预编码、均衡、信道估计)，无线资源调度（用户配对、MCS选择、功率控制），网络性能建模与优化（信道建模，覆盖优化等），AI-RAN

  2. 空间感知与计算（Spatial sensing and computing）

  空间目标检测/识别/定位、低空安防、无人机巡检、无人机网络规划（用频规划，轨迹规划）等

  3. 大模型技术及应用（LLM technology and applications）

  低成本训练推理、多智能体协同等技术以及在医疗/运营/生活服务中的垂直应用

  Brief intro/简介:

  Dr. Qingjiang Shi received his Ph.D. degree in electronic engineering from Shanghai
  Jiao Tong University, Shanghai, China, in 2011. From September 2009 to September
  2010, he visited Prof. Z.-Q. (Tom) Luo''s research group at the University of Minnesota,
  Twin Cities. In 2011, he worked as a Research Scientist at Bell Labs China. From
  2012, He was with the School of Information and Science Technology at Zhejiang Sci-Tech
  University. From Feb. 2016 to Mar. 2017, he worked as a research fellow at Iowa
  State University, USA. From 2018, He is currently a professor with the School of
  Computer Science and Technology at Tongji University. His interests lie in algorithm
  design and analysis with applications in machine learning, signal processing and
  wireless networks. So far he has published more than 100+ IEEE journals and filed
  more than 50 national patents.

  Dr. Shi has served on the editorial board of IEEE TRANSACTIONS ON SIGNAL PROCESSING
  as an Associate Editor. He was the recipient of the IEEE Signal Processing Society
  Best Paper Award in 2022, the Second Prize of Zhejiang Provincial Natural Science
  Award in 2023, the Excellent Technical Cooperation Award From Huawei Wireless Network
  Product Line in 2024, the Huawei Technical Cooperation Achievement Transformation
  Award (2nd Prize) in 2022, the Huawei Outstanding Technical Achievement Award in
  2021, the Golden Medal at the 46th International Exhibition of Inventions of Geneva
  in 2018, the First Prize of Science and Technology Award from China Institute of
  Communications in 2017, the National Excellent Doctoral Dissertation Nomination
  Award in 2013, the Shanghai Excellent Doctoral Dissertation Award in 2012, and the
  Best Paper Award from the IEEE PIMRC''09 conference.

