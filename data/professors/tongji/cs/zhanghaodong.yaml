bio_raw: '张浩东，同济大学计算机科学与技术学院助理教授、硕士生导师。先后于北京理工大学、德国慕尼黑工业大学、清华大学等国内外高校学习与工作，入选国家博士后创新人才支持计划、清华大学水木学者。曾获中国交通运输协会技术发明奖一等奖、第五届中国交通运输工程学会全国优秀博士学位论文奖。

  主要研究方向为具身交互智能，围绕人工智能与先进功能材料、生物信息、自动驾驶等前沿领域开展交叉研究，致力于推动智能交互系统的技术创新与场景落地。目前已在Nature
  Communications等国际顶级期刊发表学术论文20余篇，论文累计影响因子超130。主持国家自然科学基金青年基金项目（C类），作为核心成员参与国家自然科学基金面上项目、科技部重点研发计划等多项国家级科研任务。

  欢迎有意愿发表高水平学术论文、自驱能力强的同学共同开展研究工作，同时欢迎符合条件的校内外优秀学子联系推免硕士研究生。

  联系方式：zhanghaodong@tongji.edu.cn'
