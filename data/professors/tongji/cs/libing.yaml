bio_raw: '副教授，博导/硕导

  办公地点：济事楼507

  Email：

  lizi@tongji.edu.cn

  研究方向

  无人机/低空经济、低空智联网、多智能体系统、大模型、网联具身智能

  导师简介

  李冰，博士，同济大学计算机科学与技术学院副教授、博士生导师，上海市“晨光学者”。主要研究方向包括无人机、低空智联网、多智能体系统、大模型、网联具身智能等领域，目前相关中、英文学术专著2本；在TWC、TMC、TITS、TIV、TVT、TIFS等国际权威学术期刊和ICLR、ICRA、IEEE
  ICC、GLOBECOM等国际顶级学术会议上发表论文50余篇，其中，ESI高被引论文1篇、获最佳论文奖1篇；申请/授权发明专利20余项；作为主要起草人参与撰写并发布网联多智能体协同行业标准1项、团体标准2项。主持国家自然科学基金青年科学基金、上海市自然科学基金面上项目、上海市“晨光计划”项目、教育部产学合作协同育人项目、新一代人工智能国家科技重大专项项目子课题等国家级和省部级项目5项，此外，主持同济大学自主原创项目、同济大学教育研究与改革重点项目等10余项，作为项目骨干参与国家重点研发计划项目、国家自然科学基金重点项目等项目10余项。目前担任中国自动化学会网联智能专委会委员，以及IEEE
  TWC、IEEE TVT、ICLR、IROS等多个国际权威期刊/会议审稿人。

  课题组长期招募校内外本科生、硕博士、博士后及科研助理等加入实验室从事网联智能、低空具身智能等方向的研究工作。我们期望您具备的条件：1）学有余力，能够保证科研时间的投入；2）态度积极认真，自驱力强，拖延症弱；3）具备良好的英语阅读写作能力以及数学基础；4）乐观开朗、热爱运动。我们能提供的待遇：1）课题组将积极指导进行科研实习并以发表高水平论文为目标；2）科研助理按照学校要求提供相应的酬金待遇；3）对于表现优秀的同学，可优先获得本组的硕士/博士研究生名额，或推荐至香港科技大学、北京大学等国内外顶尖高校进行读博深造。欢迎感兴趣的同学来信咨询，请将个人简历发送至lizi@tongji.edu.cn。

