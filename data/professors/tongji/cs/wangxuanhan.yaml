  王轩瀚，同济大学研究员，博士生导师。主要研究方向是以人为中心的视觉智能、多模态具身智能等。累计在ICCV、ACM MM、AAAI等CCF A类会议，TIP、TCYB、TMM、TCSVT等中科院JCR一区期刊上发表高水平论文30余篇，ESI高被引1篇。申请/授权发明专利10余件。主持国家自然科学基金及省部级项目3项，主研国家级重大重点项目3项，省部级项目1项。目前担任TIP、TMM、NeurIPS、CVPR、ICCV、ACM
  MM等多个国际期刊/会议审稿人。

  欢迎有志于从事人工智能高价值研究的本科生、

  硕士、博士

  、博士后来信垂询！希望您具备如下特点：1）强烈的科研兴趣与自驱力；2）热爱生活，踏实进取，勤于思考与实践；3）扎实的数理基础与编程能力，以及良好的团队协作与沟通能力。'
