bio_raw: '宾燚，同济大学研究员，博士生导师。主要研究方向为多媒体理解、自然语言处理、多模态大模型等人工智能相关方向。近五年在ACM MM、CVPR、ACL、AAAI等CCF
  A类会议及TIP、TMM等中科院一区期刊发表论文40余篇。ESI高被引/热点论文1篇。申请/授权发明专利10余件。主持国家自然科学基金及省部级项目5项，主研国家级重大重点项目4项，省部级重大重点项1项。

  欢迎对课题组研究方向感兴趣的本科生、硕博士、博士后及研究助理来信垂询，加入课题组共同学习进步！兴趣对象是计算机、软件、自动化、数学、统计等相关专业学生。希望您是这样的：1）有兴趣从事学术研究和前沿技术探索；2）自驱力强，踏实肯干，积极进取，勤动手脑；3）具备良好的编程能力，英语和数理基础；4）热爱生活、热爱运动。欢迎邮件垂询。优秀学生可推荐海外交流、访问和深造，如新加坡国立大学、昆士兰大学、香港理工大学等。

  联系邮箱：yi.bin@hotmail.com'
