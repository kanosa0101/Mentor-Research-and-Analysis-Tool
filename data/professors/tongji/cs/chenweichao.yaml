  个人简介

  陈伟超，现任同济大学软件学院预聘助理教授。

  2

  016

  年获西安电子科技大学学士学位，

  2

  021

  年获同济大学博士学位。博士毕业后加入华为技术有限公司无线网络产品线工作，任高级研发工程师。

  2

  023

  年加入同济大学，在计算机科学、无线通信网络、信源信道联合编码、图像

  /视频理解传输、人工智能应用上具有丰富的科研经验，发表论文十余篇（IEEE Trans./CCF-A），申请/授权专利十余项。博士期间，获同济大学“学术前锋”（全校仅10人），上海市优毕。

