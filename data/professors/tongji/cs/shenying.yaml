  导师简介

  2006

  年和

  2009

  年在上海交通大学软件学院分别获得学士和硕士学位，

  2012

  年

  7

  月在香港城市大学计算机系获得博士学位。

  2013

  年进入同济大学工作，现为同济大学计算机科学与技术学院教授。长期致力于人工智能、计算机视觉以及语音与语言处理领域的原创性基础与应用研究，取得了一系列具有重要国际影响力的系统性成果。在

  IEEE TPAMI

  ，

  IEEE TIP

  ，

  IEEE TAC, IEEE TASLP

  ，

  NeurIPS

  ，

  ACL

  ，

  AAAI

  ，

  ACM MM

  ，

  WWW

  等国际顶尖期刊与会议上发表一系列高质量论文，

  Google Scholar

  论文累计被引用

  4000+

  次

  。

  目前为

  中国计算机学会高级会员

  、中国计算机学会语音对话与听觉专委会委员、中国图像图形学学会人机交互专委会委员。获

  2019

  年全国软件工程教学案例比赛一等奖，

  2020

  年吴文俊人工智能技术发明二等奖，

  2023

  年全国计算机类课程实验教学案例设计竞赛一等奖，

  2023

  年教育部

  -

  华为

  “

  智能基座

  ”

  优秀教师，

  2025

  年同济大学教学成果一等奖

  。所主讲的课程《用户交互技术》入选

  上海高校市级重点课程

  。

