  季洪飞，博士，副教授。现任人工智能教研室主任。2005年毕业于同济大学模式识别与智能系统专业，获硕士学位。2015年毕业于同济大学计算机软件与理论专业，获工学博士学位。2013至2014年，美国杜克大学脑成像研究中心访问学者。

  主要研究领域：模式识别、机器学习、人工智能、深度学习、脑与认知科学。­­­负责及参与完成的项目包括国家自然科学基金项目5项，上海市自然科学基金项目1项，以及其他省部级项目6项。获上海市科技进步奖一等奖1项、教育部科技进步奖一等奖1项。

  主讲的本科生课程有《形式语言与自动机》、《可计算理论》、《多媒体技术》等。'
