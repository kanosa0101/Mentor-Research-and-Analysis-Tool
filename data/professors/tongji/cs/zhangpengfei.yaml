bio_raw: '姓

  名

  张鹏飞

  职

  称

  研究员

  研究方向

  空间智能、多模态信息处理与多模态安全

  导师类型

  博导/硕导

  办公地址

  同济大学嘉定校区济事楼

  518R

  电子邮件

  mima.zpf@gmail.com

  张鹏飞，2023年毕业于昆士兰大学并获博士学位。2026年3月加入同济大学计算机科学与技术学院，现任研究员、博士生导师，入选上海白玉兰海外高层次青年人才计划。其主要研究方向包括空间智能、多模态信息处理以及多模态模型安全与攻防。目前已在CVPR、SIGIR、ACM
  MM等国际顶级会议，以及TIP、TKDE、TMM等权威期刊发表论文30余篇，并曾获杰出论文奖。指导学生在ACL、WWW、AAAI等CCF-A类会议发表多篇论文。作为项目骨干参与多项跨学科与国际合作研究，包括澳大利亚研究理事会探索研究计划（ARC
  Discovery Program）、澳大利亚研究理事会生命历程中心项目以及国家自然科学基金面上项目等。同时，担任TPAMI、TIP、TMM、CVPR、ICCV、ACM
  MM等多个国际期刊与学术会议审稿人。

  欢迎对相关研究方向感兴趣、踏实专注的学生加入实验室开展科研工作。优秀学生可推荐海外交流、访问和深造，如昆士兰大学、阿德莱德大学、新加坡国立大学、香港科技大学等。'
