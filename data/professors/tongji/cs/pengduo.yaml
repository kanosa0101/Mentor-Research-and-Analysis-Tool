  上海市嘉定区同济大学济事楼314

  彭铎，同济大学计算机科学与技术学院长聘副教授（青百A岗）、博士生导师，国家级青年人才（海外）。主要研究方向为人工智能、计算机视觉、跨域适应与泛化、多模态学习等。长期围绕跨域视觉理解、基础模型泛化与开放环境智能感知开展系统研究，重点关注具身模型在跨场景、跨分布、跨本体及跨任务条件下的鲁棒表征、迁移适应与泛化推理能力。

  研究成果持续发表于 IEEE TPAMI、IEEE TIP、CVPR、ICCV、ECCV、NeurIPS、ICML 等国际重要期刊与会议，并形成多项专利及成果转化。相关成果两次受邀在计算机视觉顶级会议
  CVPR 2022 和 ECCV 2024 作口头报告，并获 PREMIA 2024 最佳论文奖。

  目前担任多个国际期刊的青年编委及 BMVC 2026 领域主席，长期担任 CVPR、ICCV、ECCV、NeurIPS、ICML、ICLR 等国际顶级会议的程序委员，以及
  TPAMI、AI、TIP、TMM、TNNLS等国际权威期刊的审稿人。

  课题组主要研究方向包括：

  ⟡ 跨域适应及泛化

  ⟡ 多模态大模型

  ⟡ 具身智能

  ⟡ 世界模型

  ⟡ 生成式人工智能

  欢迎对相关方向感兴趣的学生加入课题组。

  课题组常年招收直博生、普通博士生、硕士推免生及考研学生，并且随时欢迎本科生加入课题组进行科研实习，共同开展前沿科研工作！'
