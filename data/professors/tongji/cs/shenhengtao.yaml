title: 教授
bio_raw: '申恒涛教授，欧洲科学院院士、国际计算机学会会士（ACM Fellow）、国际电气与电子工程师协会会士（IEEE Fellow）、美国光学学会会士（OSA
  Fellow）、科睿唯安全球高被引科学家，是同济大学计算机科学与技术学院院长。他分别于2000年和2004年获得了新加坡国立大学计算机科学系一等荣誉学士和博士学位。随后加入昆士兰大学并于2011年底成为教授。他一直从事最前沿的计算机科学研究，研究方向包括多媒体搜索，计算机视觉，人工智能，和大数据管理。

  申恒涛教授持续20多年在多媒体大数据的分析、理解、索引和搜索等方面深入研究，在国际上率先实现了实时的近重复视频内容搜索系统。累计发表了500多篇高水平同行评审论文，包括200多篇
  IEEE/ACM Transactions和300多篇CCF A类论文,并获得了10个国际会议和期刊的最佳论文奖，包括A类会议ACM Multimedia 2017最佳论文奖和ACM
  SIGIR 2017最佳论文-Honourable Mention奖，以及IEEE Transactions on Multimedia 2020最佳论文奖。他获得2010年澳洲计算研究与教育学会授予的Chris
  Wallace Award，2012年澳大利亚研究理事会Future Fellowship，中华全国总工会颁发的2016年第六届“中国侨界贡献奖”，2020年四川杰出人才奖，2021年四川省高等教育教学成果奖一等奖，2022年CCF-ACM人工智能奖，以及2022年科学探索奖。曾管理了15个国家级科学研究项目，包括国家科技部科技创新2030—“新一代人工智能”重大项目，国家自然科学基金会重点项目，国家自然科学基金会国际合作重点项目等。

  申恒涛教授目前/曾经担任ACM Transactions of Data Science, IEEE Transactions on Image Processing,
  IEEE Transactions on Multimedia, and IEEE Transactions on Knowledge and Data Engineering编委。申恒涛教授作为大会联合主席在成都成功举办了多媒体领域唯一的CCF
  A类学术会议ACM Multimedia 2021，也曾在澳大利亚分别作为Local Organization Co-Chair和TPC Co-Chair成功举办过数据库领域CCF
  A类学术会议ICDE 2013和多媒体领域CCF A类学术会议ACM Multimedia 2015。'
