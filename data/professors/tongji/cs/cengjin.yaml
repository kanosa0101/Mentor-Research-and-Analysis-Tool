bio_raw: '曾进

  Email: zengjin@tongji.edu.cn

  Website: https://jzengust.github.io/

  Office: 济事楼408R

  个人简介

  曾进，现任同济大学软件学院预聘助理教授。2012年于南京大学获学士学位，2018年于香港科技大学获博士学位，导师为Prof. Khaled B. Letaief
  (Member of US National Academy of Engineering, IEEE Fellow) 和 Prof. Gene Cheung
  (IEEE Fellow)。博士期间曾在日本国立情报学研究所访问两年。博士毕业后在商汤科技智能影像组工作，任高级研究员。2021年9月加入同济大学。主要研究方向为3D视觉，图像处理，图信号处理，共发表18篇国际顶级期刊与会议论文，包括IEEE
  T-IP，

  IEEE

  T-SP，CVPR，ECCV，3DV等。

  研究方向

  3D Computer Vision

  : Time-of-Flight (ToF) depth sensor, point cloud denoising, scene understanding,
  3D-based portrait relighting

  Image Processing

  : image restoration, quality assessment, hyper-spectral imaging

  Graph signal processing

  : graph neural network, graph wavelet transform, graph-based signal compression

  教育背景

  2012.9 - 2018.1, The Hong Kong University of Science and Technology, Ph.D. in Electronic
  and Computer Engineering

  2008.9 - 2012.6, Nanjing University, B.Sc in Electronic and Information Science

  工作经历

  2021.9 - now, Tongji University, Assistant Professor

  2020.4 - 2021.9, SenseTime Research (Shenzhen), Senior Researcher

  2018.2 - 2020.3, SenseTime Research (Hong Kong),

