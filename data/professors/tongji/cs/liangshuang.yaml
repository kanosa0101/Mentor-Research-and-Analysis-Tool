  导师简介

  我于2012年底加入同济大学软件学院。此前，我于香港中文大学计算机科学与工程系、香港理工大学电子计算学系和香港城市大学电脑科学系从事博士后和副研究员工作。

  我中学就读于东北育才学校少年班，毕业后保送浙江大学计算机科学与工程系，获学士学位。随后，保送南京大学计算机科学与技术系，获博士学位。并于博士期间，赴荷兰乌特列支大学信息与计算机科学系做访问学者。我的研究方向包括：多媒体检索、智能人机交互、模式识别、计算机图形学。

  目前，我在视觉计算与识别、多媒体理解与检索等领域拟招收多名学生，欢迎有兴趣的同学加入。我注重学生能力的提升与个人发展，将根据学生的兴趣和特点制定个性化的培养方案，并提供科研津贴。同时，实验室和微软、阿里、百度等知名企业以及美国、香港、加拿大、新加坡等多个学校和研究机构有广泛的合作，将推荐优秀学生去国内外知名企业实习/工作和出国交流/深造。有兴趣的同学可直接通过邮件（shuangliang@tongji.edu.cn）与我联系。

