bio_raw: '王冬青

  WANG DONG QING 硕士、讲师

  电子邮件:wangboxes@gmail.com

  主讲课程：

  汇编语言

  数字逻辑

  操作系统

  Firmware程序设计

  嵌入式实时操作系统

  ARM体系结构

  研究方向：

  嵌入式系统

  计算机网络

  移动通讯

  教学工作

  主讲课程：

  1)汇编语言 2) 数字逻辑 3)操作系统4）Firmware程序设计5）嵌入式实时操作系统6）ARM体系结构

  部分科研项目简介

  [1] “ARM计算机系统及WIN CE操作系统研发”，上海市科委子项目，2004-2006，第一负责人

  [2] “新能源车辆远程监控信息系统平台软件改进”，同济汽车学院与软件学院联合项目，2009-2011，第一负责人

  部分论文

  [1] “谱域方法的射线近似研究”. 中国核学会计算物理学会计算电磁学专业委员会第二届计算电磁学研讨会.1998成都电子科技大学

  [2] “嵌入式微处理器MPC855T在局域网分析仪中的硬件实现”.《现代电子技术》.第一作者.2003-17

  [3] “手持式仪器中液晶控制板的硬件设计”.《现代电子技术》. 第二作者.2004-20

  [4] “时域回波反射法在双绞线测试中的应用”. 《电信科学》. 第二作者.2004-6

  [5] 参与编著《ARM&Linux嵌入式系统开发详解》，北京航空航天出版社.2007.3

  精品课程

  [1] 教育部-微软精品课程：嵌入式软件开发导论，2005-2006

  [2] 教育部-微软精品课程：嵌入式矽统实验，2006-2007

  [3] 教育部-Intel精品课程：UEFI程序设计，2008-2009

  获奖经历

  [1] 同济大学软件学院年度先进个人，2009

  [2] 同济大学软件学院优秀青年教师, 2009

  [3] 同济大学软件学院优秀青年教师, 2010'
