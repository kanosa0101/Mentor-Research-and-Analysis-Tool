  王晓国，同济大学电子与信息工程学院计算机科学与技术系教授，博士生导师，工学博士。IEEE上海分会副主席。

  主要从事智慧城市、大数据、互联网金融反欺诈等领域的研究和应用工作。

  主持或作为主要参与人员，承担和完成了包括国家高技术研究发展计划（863）、教育部和财政部、上海市科委、上海市经委等以及其他省市、企业的多个科研项目，获得国家教学成果二等奖1次、上海市教学成果奖1等奖、二等奖多次。发表被EI、SCI收录的论文30多篇。'
