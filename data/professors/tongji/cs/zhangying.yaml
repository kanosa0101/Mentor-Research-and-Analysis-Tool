bio_raw: '张颖

  ZHANG YING 副教授

  电子邮件： yingzhang@tongji.edu.cn | 地址: 同济大学软件学院

  主讲课程：

  数据结构

  实时系统

  智能计算系统

  研究方向：

  5G网络安全与容错

  深度学习与智能计算系统

  元宇宙

  个人简介

  本人主要研究深度学习,智能计算系统和硬件安全相关技术，2011年在中科院体系结构国家重点实验室获得博士学位后，先后瑞典林雪平大学和美国杜克大学进行研究学习。欢迎计算机,自动化,集成电路和数学等相关专业,
  对深度学习或智能计算系统感兴趣的同学加盟实验室。在学习期间，我们将安排学生在国内知名院所进行交流学习。科研潜力突出者，我们将推荐到牛津大学，宾夕法尼亚大学等国外著名高校继续深造。

  教学工作

  1)数据结构 2)

  智能计算系统

  3)C实时系统

  部分科研项目简介

  国家省部级课题：

  2015年，国家重点实验室开放课题“高性能处理器的指令级自测试方法”，项目负责人

  2014年，自然科学基金青年项目“处理器的指令级自测试方法”，项目负责人

  2014年，自然科学基金重点项目“差错容忍计算器件基础理论与方法”，骨干成员

  2014年，江苏省产学研联合创新资金项目“未来网络的容错与容侵”，骨干成员

  2011年，瑞典战略研究基金“Fault-Tolerant and Secure Automotive Embedded Systems”（RIT08-0056），参与成员

  2009年，国家973 课题高通量计算系统的构建原理、支撑技术及云服务应用，参与成员

  2006年，国家973 课题延长摩尔定律的微处理器新原理、新结构与新方法研究，参与成员

  企业合作课题：

  2013年，华为技术有限公司“同济大学Linux故障模式与基于故障注入的测试技术研究”，骨干成员

  2013年，华为技术有限公司“无线网络平台云和虚拟化可靠性研究项目”, 骨干成员

