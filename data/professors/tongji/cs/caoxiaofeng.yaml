bio_raw: '曹晓锋

  ，

  男，中共党员，现为同济大学长聘副教授。于澳大利亚悉尼科技大学获得哲学博士学位。他曾在澳大利亚人工智能研究院、新加坡前沿人工智能中心、香港科技大学、吉林大学等机构从事教学科研工作与学术交流活动。长期从事泛化分析理论、凸解析与非凸性近似逼近、非欧氏几何（如庞加莱圆盘与洛伦兹模型），以及物理人工智能，在机器学习领域以及泛人工智能权威期刊和会议发表近100篇同行评议学术工作，如JMLR、IEEE
  T-PAMI、TNNLS、ICML、NeurIPS，并在先进应用领域主持和参与多项基础性和技术性研究课题，另多次入选省部级人才计划与科学智能领域评审专家，如基金委重大项目评审专家、教育部留学基金委评审专家等，指导研究生获多项重要奖励和荣誉。在学术领域，他担任机器学习理论汇刊Transactions
  on Machine Learning Research  执行编委，Frontiers in Artificial Intelligence 副主编，以及数学期刊Mathematics编辑等；他是IEEE计算社区高级会员（IEEE
  Senior Member），担任IEEE PRMVAI 2026程序委员会共同主席、IEEE ICDM 2026 论坛主席，获ACSTA 2026优秀青年学者奖励；指导学生获挑战杯省级竞赛银牌、十佳研究生（排名第一）、优秀硕士毕业论文、优秀本科生毕业论文、IEEE
  PRMVAI Best Paper Award 、CCF本科生学术新秀等，另培养多名学生进入国家部委、国际知名高校及IT行业领军企业工作。

  目前，已指导完成对低年级本科生、硕士生至博士生、博士后20余人培训工作，在多个研究课题取得重要成果，具有丰富的科学研究与思政管理工作经验。欢迎有意向同学积极联系：

  xiaofeng.cao.uts@gmail.com

  。

  个人主页详见： https://xiaofengcaoml.github.io/

  代表性著作：

  [1] Xiaofeng Cao*, Yaming Guo, Heng Tao Shen, and Ivor W. Tsang, James T. Kwok,
  Black-box Teaching an Active Learner, Journal of Machine Learning Research 2025（
  机器学习顶级基础理论期刊）。

  [2] Xiaofeng Cao, Ivor W. Tsang, Distribution Disagreement via Lorentzian Focal
  Representation, IEEE Transactions on Pattern Analysis and Machine Intelligence,
  2021. （非欧洛伦兹焦点逼近！）

  [3] Xiaofeng Cao, Weiyang Liu, Ivor W. Tsang, Data-efficient learning via Minimizing
  Hyperspherical Energy, IEEE Transactions on Pattern Analysis and Machine Intelligence,
  2023. （NP 难近似优化！）

  [4] Xiaofeng Cao, Ivor W. Tsang, Shattering Distribution for Active Learning, IEEE
  Transactions on Neural Networks and Learning Systems, 2020. (破碎分布降低VC维！）

  [5] Xiaofeng Cao, Ivor W. Tsang, Distribution-based Machine Teaching for a Black-box,
  IEEE Transactions on Neural Networks and Learning Systems, 2022. （黑盒机器教学）

  [6] Bohao Qu#, Xiaofeng Cao#*, Yi Chang, Ivor W. Tsang, Yew-Soon Ong, Diversifying
  Policies with Non-Markov Dispersion to Expand the Solution Space, IEEE Transactions
  on Pattern Analysis and Machine Intelligence, 2024.（非马尔可夫空间决策扩散！）

  [7] Mingwei Xu, Xiaofeng Cao*, Ivor W. Tsang, James T. Kwok, Heng Tao Shen, Generalized
  Distribution Aggregation Protocol for Federated Statistical Heterogeneity, IEEE
  Transactions on Pattern Analysis and Machine Intelligence (TPAMI), 2026. (统计异质性优化)

  [8] Chen Zhang, Xiaofeng Cao*, Weiyang Liu, Ivor W. Tsang, James T. Kwok, Nonparametric
  Iterative Machine Teaching, ICML 2023. （非参机器教学优化）

  [9] Yadong Sun, Xiaofeng Cao*, Ivor W. Tsang, Heng Tao Shen, Analytical Construction
  on Geometric Architectures: Transitioning from Static to Dynamic Temporal Link Prediction,
  ICML 2025. （非欧几何优化）

  [10] Xiaofeng Cao, Mingwei Xu, Xin Yu, Jiangchao Yao, Wei Ye, Shengjun Huang, Minling
  Zhang, Ivor W. Tsang, Yew Soon Ong, James T. Kwok, Heng Tao Shen, Analytical Survey
  of Learning with Low-Resource Data: From Analysis to Investigation, ACM Computing
  Surveys, 2025. （低资源解析）'
