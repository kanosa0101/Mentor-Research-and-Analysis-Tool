bio_raw: '个人简介

  Personal Profile

  何家玲，副研究员，本硕博毕业于北京理工大学，2025年中国电子学会青年人才托举工程，中国计算机学会区块链专委会、网络与系统安全专委会执行委员。主要从事人工智能安全，智能电网，区块链相关研究。在TMC、TSC、TIFS、TKDE、INFOCOM、AAAI、MM、WWW等CCF
  A类期刊和会议上发表论文30余篇。担任SCI期刊IEEE Wireless Communications、TNSE、IoT-J以及Mathmatics客座编辑，SCI期刊Scientific
  Reports编委，以及CCF-C会议Inscrypt Program Chair，TIFS、TDSC、TMC、TSG、IoT-J、AAAI、ICLR等期刊和会议审稿人。主持包括国家重点研发项目子课题、国家自然科学基金青年项目、重庆2024年度技术创新与应用发展重大专项项目课题、重庆市自然科学基金面上项目等多个国家级和省部级纵向项目。获重庆市科技进步二等奖、中国发明协会发明创业奖创新奖二等奖等奖励。

  年度招收1-2名硕士！

  欢迎对人工智能安全以及区块链感兴趣的研究生和本科生与我交流，提前进行课题研究，同时本人与奥克兰大学、北京理工大学等相关实验室保持广泛深入的合作，可推荐优秀毕业生前往著名高校攻读硕士博士学位。'
