bio_raw: '个人简介

  Personal Profile

  一、基本信息

  姓名：李明妍

  职称：副研究员

  研究方向：AI+工业互联网，边缘计算，智算集群调度

  团队目前招收博士研究生、硕士研究生和本科生，主要研究方向包括

  工业互联

  网，边缘计算，

  智算集群调度

  ，

  算力网络、

  深度强化学习等

  。

  通过国家级课题研究，培养你发表高水平学术论文

  ；

  通过校企合作项目实践，

  提升研究探索和编程动手能力，欢迎感兴趣、具备较强学习和动手能力的同学，发送简历至

  limy2021

  @cqu.edu.cn。

  二、个人简介

  李明妍，博士，副研究员。博士毕业于上海交通大学，加拿大滑铁卢大学联合培养博士生。主要研究方向为工业算力网络、分布式学习、高性能交换网络等。入选

  2023

  年度中国电子学会博士学位论文激励计划，获得

  2022

  年度上海市自动化学会最佳博士学位论文奖、第一届全国博士后创新创业大赛优胜奖和

  2025

  年华为难题挑战“火花奖”。

  作为项目负责人，主持了国家自然基金委青年基金、国家自然基金委面上项目，重庆市科技部面上项目和重庆市博士后研究人员特别资助项目；作为项目子课题负责人和核心骨干，参与国家重大科技专项、科技重点研发、重庆市重大项目，横向合作项目等项目。

  以一作/通讯

  作者发表论文

  20余篇，包括IEEE TII，IEEE TMC，IEEE TWC、IEEE INFOCOM等。'
