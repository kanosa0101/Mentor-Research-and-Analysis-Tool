bio_raw: '个人简介

  Personal Profile

  陈雪峰，博士，副研究员，硕士生导师。本科和硕士都毕业于电子科技大学，博士毕业于澳大利亚新南威尔士大学（UNSW）。主要研究方向为

  智能计算、

  时空数据管理、大数据分析与优化、机器学习、智能建造等，相关研究成果已发表在AAAI、ICDE等国际顶会（CCF A类）与IEEE Transactions on
  Evolutionary Computation、IEEE Transactions on Neural Networks and Learning Systems、Automation
  in Construction等国际顶刊（SCI一区）上。主持包括国家自然科学基金青年项目、重庆市自然科学基金面上项目和重庆市留创项目等多个国家级和省部级纵向项目。获得2023年ACM中国新星奖（重庆分会）。

  目前在

  冯亮教授

  （国家级青年人才）团队，团队经费充足，学术氛围很浓，注重学术能力和工程实践能力的协同培养，现招收博士研究生、硕士研究生及本科生。团队开展了大量前沿学术问题和应用问题的研究，诸如大语言模型、强化学习、神经架构搜索、智能建造、机器人路径规划等。本团队与香港城市大学、香港科技大学、澳大利亚

  新南威尔士大学、新加坡南洋理工大学等研究机构有

  广泛深入的合作。团队毕业生已深造于

  新加坡南洋理工大学、

  香港城市大学等知名研究机构，就业于华为、字节、百度、阿里等国内大厂，以及某些国内知名研究所。有意加入我们一起

  enjoy research

  的请发送

  简历

  到我的邮箱。'
