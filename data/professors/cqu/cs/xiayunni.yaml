bio_raw: '理学博士，博士后，教授，博士生导师，国际电气和电子工程师协会高级会员（IEEE SENIOR MEMBER），重庆市学术技术带头人，重庆市新产品创新青年人才。2003年7月毕业于重庆大学计算机系，获工学学士学位。2008年7月毕业于北京大学信息学院计算机软件与理论专业，获理学博士学位。2006-2007年在微软亚洲研究院理论组从事分布式算法性能分析的研究，2013年在美国新泽西理工学院周孟初教授（IEEE
  FELLOW）处进行访问研究。师从于北京大学袁崇义教授和王捍贫教授。在博士期间参与了北京大学梅宏院士主持的973项目“基于知识的网构软件需求建模理论和方法研究”、863项目“基于正确性验证的web服务可信性研究”，由于研究工作的开创性和重要性，于2008年获得北京大学“学术精英”奖。

  在微软亚洲研究院理论研究组从事可信容错网络协议和算法研究期间，相关工作作为微软亚洲研究院核心技术报告（Wei Chen, Xuezheng Liu, Yunni
  Xia, and Lidong Zhou. Quorum-based perfect failure detection Service. Technical
  Report MSR-TR-2009-62, Microsoft Research, May 2009）收录。同时，在服务计算、移动云计算、车联网、智能推荐系统、能源互联网、工业互联网等领域已有多年的研究经验，因在相关工作的出色成果于2012年被推选为中国计算机协会PETRI网专委会委员，2015年被推选为国际电气和电子工程师协会高级会员（IEEE
  SENIOR MEMBER），2016年被国际服务科学学会推选为SSYSF（国际服务学会中国青年科学家论坛）副主席。

  第一/通信作者IEEE TRANSACTION期刊文章12篇，均为信息与计算机科学的知名国际期刊，可被SCI检索的其他期刊文章50+篇；第一/通信CCF推荐国际会议论文25+篇，其中中英文CCFA类期刊会议论文3篇。

  连续3次受到国家自然科学基金项目的支持。

  主要科技获奖和相关荣誉包括：

  （1）2023年获得日内瓦发明金奖（排名第三）；

  （2）2023年获得南方电网科技进步一等奖（排名第八）；

  （3）2023年获得中国安全科技进步一等奖（排名第四）；

  （4）2020年获得重庆市科技进步一等奖“猪八戒网众创平台智能服务关键技术及应用”（排名第三）；

  （5）2020年获得中国人工智能学会吴文俊人工智能技术发明二等奖“基于混合云架构的智能诊疗关键技术及应用”（排名第三）；

  （6）2020年获得中国发明协会发明创业一等奖“面向工业互联网的云边协同的高可用安全安全关键技术及应用”（排名第二）；

  （7）2019年获得重庆市自然科学一等奖“高维稀疏大数据智能分析理论与方法”（排名第5）；

  （8）2019年获得教育部科技进步二等奖“边云协同的油气物联网智能决策关键技术及应用”（排名第5）；

  （9）2018年获得吴文俊人工智能一等奖“智慧金融中的集成生物识别关键技术及应用”（排名第7）；

  （10）2021年获得重庆市科技进步二等奖（排名第一）

  （11）2017年获得重庆市自然科学3等奖（排名第2）“高维数据挖掘算法及可信服务计算预测模型研究”

  （12）2014年获得ACM（美国计算机学会）学术新星奖；

  （13）2014年获得重庆市“创新青年科技人才”称号；

  （14）2015年获得四川省科技进步1等奖（排名第8）“基于北斗系统的灾害监控预警平台关键技术及应用系统研究”；

  （15）2017年获得重庆大学自然科学奖（排名第二）；

  （16）2011获得黄尚廉院士创新奖教金；

  （17）2008年6月获得北京大学“学术精英”奖；

  （18）2014年获得重庆大学十佳青年教师称号；

  （19）2014年获得重庆市教委“高等学校青年骨干教师资助计划”奖；

  （20）2007年获得北京大学信息科学技术学院“学术十杰”奖。

  承担和主持的主要科技项目包括：

  （1）主持：2021年，国家自然科学基金面上项目:“恶劣条件下Web服务QoS预测与QoS确保的服务组合卸载方法研究”，58万，NSF62172062；2014年，国家自然科学基金面上项目:“基于Peitr网与协同过滤的云上web服务可信性分析与预测的研究”，84万，NSF61472051

  （2）主持：2011年，国家自然科学基金青年项目:“领域本体服务组合的PETRI网建模和非功能特性分析”，22万，NSF61103036

  （3）主持：2015年，国家博士后基金一等资助金项目：“基于Petri网与协同过滤的云系统能耗分析与预测的研究”，2015M570770，8万；重庆市博士后特别资助基金：“异构云计算系统可信性与能耗优化”，XM2015078，5万；

  （4）主持：2019年三个重庆市产业类重点研发项目子课题，“智能制造成本质量管控云平台研发及应用”、“面向液晶显示面板生产的大数据分析平台技术研究与应用”、“电力巡检人员智能体征检测与云端融合的协同传感关键技术研发”，累计经费约45万；2017年，重庆市重点研发计划项目，“云端融合的高可信基础软件及中间件的研究与应用”，100万；2009年，重庆市自然科学基金：“WEB服务组合模型与形式化验证方法的研究”，2009jj0835，3万；2017年，重庆市自然科学基金：“模型驱动的云服务QoS分析和预测的研究”，5万

  （5）主持：2010年，博士点新教师基金：“模型驱动的服务合成可信性方法的研究”，20100191120026，3.6万；

  （6）主持：2010年，中央高校科研基金面上项目，8万；2014年，重庆大学信息学部中央高校重点基金，20万；2016年，重庆大学中央高校基金学院创新项目，8万；

  （7）主持：2010年，重庆移动联合科技攻关项目:“基于信令的移动客户群欠费风险预测和提前干预系统的设计与开发”，9万；

  （8）主持：2013年，重庆科委创新青年科技人才项目：“云环境下海量数据集成理论与方法的研究”，ctsc2013kjrc-qnrc0079，8万；2017年，第二主持教委“高校优秀科技成果转化”项目，“面向深度学习与大数据处理的高可信云计算平台和关键技术的应用与推广”，KJZH17104，30万；

  （9）主持：国家电网重庆客户服务中心科技开发项目：“多元化服务渠道的在线分析及智能互动应用研究”，10万；

  （10）主研项目：国家973项目“基于知识的网构软件需求建模理论和方法研究”、国家863项目“基于正确性验证的web服务可信性研究”、微软研究院/北京大学信息科学技术学院理论实验室联合项目“分布式错误检测算法的设计和分析”、国家自然科学基金项目“混成系统的描述与验证理论研究”。

  （11）主研项目：国家科技部支撑计划“统筹城乡第四方就业服务体系研究与应用示”，承担经费10万'
