bio_raw: '个人简介

  Personal Profile

  郑林江  博士（后）、教授、博士生导师，计算机学院副院长。主要从事大数据智能、时空数据挖掘（交通与航空）、机器学习与人工智能、行业大数据服务平台等领域的科研教学工作。作为负责人，主持国家重点研究计划课题、国家自然科学基金民航联合基金重点项目课题、

  国家自然科学基金青年基金课题、

  国家重点研发计划子课题、国家863 计划子课题、国家支撑计划子课题等'
