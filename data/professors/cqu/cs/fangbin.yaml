bio_raw: '房斌

  教授是重庆大学教授、博士生导师， “模式识别与信息处理研究所”所长。IEEE Senior Member，重庆市巴渝学者，教育部新世纪优秀人才。国家自然科学奖信息领域网评及会评专家，教育部自然科学奖信息领域网评专家，国家自然科学基金委信息学科网评及会评专家，科技部重大项目网评及会评专家，教育部人才计划网评专家，教育部学科评估专家（计算机科学与技术）。

  SCI

  国际期刊《

  IJPRAI

  》副主编，

  SCI

  国际期刊《MPE》特邀编委。重庆市政协委员，重庆市数字医学学会副理事长，重庆市认知科学学会秘书长。

  “

  可信计算

  ”

  教育部重点实验室学术带头人、“软件理论与技术”重庆市重点实验室学术带头人。获教育部自然科学奖一等奖1项，重庆市自然科学奖二等奖2项。承担国家科技部973项目、科技部支撑计划项目、基金委自然科学基金等重要课题30余项。主要研究方向为：人工智能、计算机视觉、模式识别，医学图像处理等。发表SCI论文200余篇。获得授权发明专利10余项。'
