bio_raw: '工学博士，博士后，副教授，硕士生导师。日本电气通信大学计算机系统结构专业联合培养硕士，重庆大学计算机软件与理论专业博士，重庆大学控制科学与工程流动站从事博士后。现为中国计算机学会会员、重庆市数字诊疗专委会委员。研究领域包括自然语言处理、计算机视觉、大语言模型。先后主持国家自然科学基金项，重庆市自然科学基金项，中国博士后科学基金项，中央高校基本科研业务费科研专项项目，主研国家重点研发计划项目、科技部国家重大专项项目。近年在国内外知名学术期刊及会议上发表深度学习相关研究

