  专利

  1. 一种用于在3D虚拟引擎中模拟实时全局光照的自适应方法. ZL201910453097.4

  2. 一种基于VR的人体关键点数据扩充的方法. 2021107370546

  3. 一种用于地球仪区域检测的数据集获取及自动标注的方法. ZL202110672555.0

  4. 一种基于多特征融合的河面图像区域分割方法.专利号：ZL201310524589.0

  5. 一种基于图像的燃气指数自动识别方法.专利号：ZL201610518252.2

  6. 一种不规则轮廓缺陷监测方法.专利号：ZL202010676665.X

