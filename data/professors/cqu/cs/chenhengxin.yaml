bio_raw: '陈恒鑫，博士，副教授，硕士生导师，1979年6月出生，于2002年、2005年和2010年在重庆大学计算机学院分别获得学士学位、硕士学位和博士学位。研究领域包括虚拟现实、图像处理、人工智能。作为项目负责人，主持国家自然科学基金青年项目1项，重庆市自然科学基金面上项目1项，博士后基金面上项目1项，中央高校基本业务费项目2项，横向项目10余项。作为主研人员参与国家重大专项1项，国家自然科学基金2项，博士点基金项目1项，重庆市科委重大专项项目1项。共发表论文20余篇，其中被SCI检索12篇。

