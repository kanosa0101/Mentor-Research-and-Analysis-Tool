bio_raw: '个人简介

  Personal Profile

  郑洪英，女，副教授，任《现代密码学》、《入侵检测原理与技术》和《人工神经网络基础》的课程负责人。自 2004 年开始从事信息安全方面的研究，前期主要集中于入侵检测方面，后来随着项目和团队的参与开始涉足信息隐藏技术、深度学习与多媒体安全的交叉融合研究，持续关注和思考“机器学习理论与多媒体安全领域的交叉融合问题”。'
