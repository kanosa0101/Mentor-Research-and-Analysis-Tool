bio_raw: '个人简介

  Personal Profile

  罗甫林，重庆市巴渝青年学者、重庆大学弘深青年学者、教授、博士生导师。于

  2016

  年获得重庆大学仪器科学与技术专业博士学位，

  2017

  年和

  2019

  年分别进入武汉大学测绘遥感信息工程国家重点实验室和武汉大学计算机学院博士后流动站工作，

  2020

  年任新加坡南洋理工大学

  Research Fellow

  。入选

  2017

  年博士后创新人才支持计划（入选当年全国总共

  300

  人）、国际电气与电子工程师协会高级会员（

  IEEE Senior Member

  ）、中国图象图形学学会遥感图像专业委员会委员、中国人工智能学会会员。获得

  2022

  年湖北省自然科学二等奖

  1

  项、

  2022

  年国际期刊

  IEEE TGRS

  、

  IEEE GRSL

  和

  2021

  年《大气与环境光学学报》最佳审稿人、

  2018

  年重庆市优秀博士学位论文、

  2015

  年重庆市优秀硕士学位论文。指导学生获得第八届中国国际

  “

  互联网

  +”

  大学生创新创业大赛重庆市银奖和重庆大学银奖和重庆市大学生创新训练项目。

  长期从事人工智能相关理论研究，围绕流形学习、表示学习、图学习、深度学习等机器学习算法理论展开，解决计算机视角中面临的基础问题和挑战，理论研究成果应用于基因分析、地物分类、目标检测和场景理解等领域。目前，主持国家自然科学基金面上项目

  2

  项、国家青年科学基金

  1

  项、重庆市自然科学基金

  1

  项、国家博士后创新人才计划项目

  1

  项、国家博士后科学基金特别资助

  1

  项、国家博士后科学基金面上项目

  2

  项、湖北省博士后科学基金

  1

  项、中央高校基金

  1

  项，参与国家重点研发

  2

  项、国家自然科学基金

  3

  项。目前在人工智能领域已发表科研论文

  50

  余篇，以第一

  /

  通信作者在国内外权威期刊上发表

  SCI

  论文

  34

  篇（其中

  IEEE Trans.

  期刊

  15

  篇、

  ESI

  热点论文

  2

  篇、

  ESI

  高被引论文

  11

  篇）、

  CCF A

  类会议论文

  2

  篇、

