bio_raw: '重庆大学计算机学院副教授，加拿大魁北克大学访问学者。作为项目负责人主持国家自然基金，省部级项目和多项横向课题；

  作为主研人员参与科技部国家基础研究规划项目

  (973

  计划

  )

  ，国家自然基金面上项目，教育部高等学校博士点专项科研基金，重庆市自然重点基金，重庆市自然基金等多项研究课题。主要研究领域包括模式识别，图像处理，智能系统等。已发表论文多篇，其中

  SCI

  检索论文

  10

  余篇。曾获重庆市科学技术奖自然科学奖二等奖，获软件著作权两项，专利获权

  6

  项，申请专利

  5

  项，专利转让两项。

  团队目前主要从事人工智能，深度学习，医学图像处理，工业缺陷检测等相关的研究，欢迎对该方向感兴趣的同学加入。'
