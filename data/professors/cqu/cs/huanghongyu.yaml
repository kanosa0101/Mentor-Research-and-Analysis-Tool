bio_raw: 黄宏宇，博士、副教授。主要研究方向包括无线网络、车辆自组织网络、无线传感网等。2002年毕业于重庆师范大学，获学士学位。2002年至2005年就读于重庆大学。2005年获硕士学位并于同年至上海交通大学攻读计算机应用技术专业博士学位。攻读博士学位期间从事车辆自组织网络和无线传感网方面的研究。2008年4月至10月参加教育部10+10合作科研联盟项目“基于CalRadio（加州无线电）的新型无线网络协议设计与性能研究”，前往加州大学圣迭戈分校（UCSD）交流学习，从事软件无线电方面的研究。2009年9月起在重庆大学计算机学院工作。2015年9月至2016年9月前往加拿大多伦多大学交流学习。目前是多个国际期刊和学术会议的审稿人，如TVT、COMCOM、COMNET等。在国际期刊和学术会议上发表或录用论文20多篇。作为项目负责人，承担了国家级
