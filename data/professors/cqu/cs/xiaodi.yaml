bio_raw: '个人简介

  Personal Profile

  博士，三级教授，博士生导师，教育部新世纪优秀人才，重庆市杰

  出青年科学基金获得者，

  重庆

  市

  英才计划创新领军人才、

  重庆市

  学术带头人

  。

  2014-202

  3

  年连续

  十

  次入选

  “Elsevier中国高被引学者”，

  连续入选

  “全球前2%顶尖科学家”。IEEE高级会员，中国密码学会高级会员，中国图象图形学会高级会员，中国计算机学会高级会员

  ，

  中国密码学会混沌保密通信专委会委员，中国图象图形学会数字媒体取证与安全专委会委员，中国人工智能学会人工智能与安全专委会委员

  , 中国中文信息学会大数据与隐私计算专委会委员。

  2005年6月毕业于重庆大学计算机软件与理论专业，获工学博士学位；2006年1月至2008年6月在重庆大学控制科学与工程博士后流动站作博士后研究；2008年12月至2009年12月由国家公派到美国New
  Jersey Institute of Technology计算机系做访问学者；2019年由国家公派到澳大利亚Deakin University信息学院做高级研究学者。

  近年来主要从事信息安全、多媒体安全、云计算与大数据隐私保护技术、人工智能安全等方面的研究。作为项目负责人曾先后主持国家自然科学基金项目

  5

  项、重庆市杰出青年科学基金项目

  1项、重庆市基础科学与前沿技术研究专项重点项目1项、中国博士后科学基金项目1项、重庆市自然科学基金

  面上

  项目

  2项及教育部新世纪优秀人才支持计划项目1项

  等

  ；作为主研人员曾先后参研多项

  国家重点研发项目、

  国家自然科学基金重点项目和面上项目、教育部博士点专项科研基金项目、重庆市自然科学基金重点项目、重庆市自然科学基金项目及横向项目。

  已在包括

  IEEE TIFS、IEEE TMM、IEEE TII、IEEE TCAS、IEEE IOTJ、IEEE SPL、ACM TOMM、计算机学报、计算机研究与发展

  等国内外重要学术刊物上发表相关学术论文

  1

  50

  余篇（第一或通讯作者

  12

  0余篇）。此外，在科学出版社出版学术专著《混沌密码学原理及其应用》（第二作者），并分别受邀参编德国Springer出版社和美国CRC出版社出版的两本安全专著Chaos-based
  Cryptography和Multimedia Security:Watermarking, Steganography, and Forensics。参与申请获准国家发明专利2项。

  曾两次获得重庆市自然科学二等奖（分别排名第一、第三）、重庆大学

  /重庆市优秀博士学位论文奖、重庆大学优秀博士后研究成果奖，入选重庆大学年度十佳优秀青年教师、教育部新世纪优秀人才支持计划和重庆市杰出青年科学基金计划。

  长期致力于信息安全一线教学工作，曾获得

  “重庆大学唐立新奖教金”，入选“重庆大学年度十佳优秀青年教师”，近几年所直接指导毕业的博士生、硕士生先后多人次获得“硕士生/博士生国家奖学金”、“重庆大学优秀博士论文”、“重庆大学优秀硕士论文”、“重庆市优秀博士论文”、“ACM中国优秀博士学位论文”、“重庆市优秀硕士论文”、“重庆市优秀毕业研究生”等荣誉。

  招生信息：年度招收硕士生

  3-4名、博士生1名。欢迎对信息安全领域学术研究感兴趣、吃苦耐劳、踏实努力、有长远规划的同学报考我的博士生和硕士生。特别欢迎原毕业专业为信息安全类、计算机类、电子信息类、数学类的同学联系报考。'
