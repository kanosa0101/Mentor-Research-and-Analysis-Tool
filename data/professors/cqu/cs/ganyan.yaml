bio_raw: '个人简介

  Personal Profile

  淦艳，

  博士，副教授，硕士生导师。主要研究方向包括计算机视觉、深度学习与人工智能安全等。多项研究成果发表在ICLR (Oral)、AAAI、IEEE TIFS、IEEE
  TMM、IEEE TCSVT、ACM TOMM、ACM TOPS等国际知名会议与期刊。入选首批国家资助博士后研究人员计划，获2025年度博士后科研业绩评估考核资助；主持国家自然科学基金、重庆市自然科学基金、中国博士后面上项目等多个项目；主研/参研国家重点研发计划、国家自然科学基金（面上/联合基金）等多项课题。长期担任IEEE
  TCYB、IEEE TMM、IEEE TCSVT、ICLR、NeurIPS、CVPR、ICCV、ECCV、ICME等期刊与会议的审稿人。

  Ø

  招生信息

  ：

  每年招收2-3名硕士生。欢迎计算机、软件、数学等相关专业同学申请，

  同时欢迎本科生

  加入团队。请有意者将简历发送至：

  shiyangancq@cqu.edu.cn

  .。

  注意：

  （1）实验室关注学生编程（Python、C/C++等）、数学及英语（听说读写等）三方面的能力。

  （2）进组流程：保研的需过学院筛选简历/考研的需过学校学院划线--->组内面谈（线上+线下均可）。

  Ø

  团队优势

  ：

  国际国内合作

  ：与英国、澳大利亚、中科院、电子科技大学等海内外高校及科研机构联系紧密，特别优秀者可推荐赴海外攻读博士学位。

  科研条件

  ：经费充足，学习氛围融洽，以国家任务与'
