bio_raw: 博士，副教授，硕导；中国计算机学会（CCF）会员。重庆大学计算机应用技术博士学位；英国Loughborough大学访问学者。主要研究方向包括计算智能、计算机视觉；近年来主持完成国家自然科学基金青年项目、重庆市科委科技计划攻关项目、重庆市自然科学基金面上项目及川渝科技合作项目；参与国家自然科学基金面上项目，科技部国家重点研发计划子课题和国家支撑计划等多项。发表学术论文多篇，国家发明专利获权8项，软件著作权获权3项。主持及参与教育部及重庆市级教学改革项目多项，发表教学论文多篇。
