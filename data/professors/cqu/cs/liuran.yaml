bio_raw: '曾为长虹企业博士后、哈佛大学医学院博士后；研究方向集中在人工智能中的机器视觉与嗅觉部分，具体包括：计算机立体视觉，医学影像处理和机器嗅觉。发表论文

  90

  多篇，授权专利

  60

  余项，获软件著作权

  6

  项。

  2021

  年获

  Society for Imaging Science and Technology

  颁发的

  Itek Award

  奖项。

  研究成果已应用于长虹、纳通医疗集团、斯斐德等公司的产品中。

  近期研究聚焦于基于电子鼻的肺癌检测，涉及视觉语言大模型、定性表示与推理、时间序列图像处理、小样本数据增强及蒸馏等技术。同学们可根据自身兴趣选择更细分的方向。当热，也可以根据自己的兴趣来选择任何方向，只要你愿意为这个方向全身心投入就行。毕竟兴趣（而不是我）才是你最好的老师！'
