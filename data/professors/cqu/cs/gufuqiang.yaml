bio_raw: '个人简介

  Personal Profile

  古富强，重庆大学计算

  机学院教授、博士/硕士生导师，澳大利亚墨尔本大学博士, IEEE/ACM/CCF/CAAI会员，CCF普适计算专委会委员、智能机器人专委会委员、神经科学学会类脑计算专委会委员、测绘学会位置服务专委会委员，入选“重庆市高层次人才计划”和2025年“斯坦福大学全球前2%顶尖科学家榜单”。

  曾先后在德国亚琛工业大学、加拿大多伦多大学、新加坡国立大学从事研究工作

  。研究方向包括（但不局限于）人工智能、无人系统、机器人、导航定位、活动识别、类脑计算等。在IEEE TRO、TMC、TVT、T-ITS、TIM、ACM Computing
  Surveys、RA-L、IJCAI、GLOBECOM、ICRA、IROS等国际主流期刊及会议上发表高水平论文80多篇，申请国家发明专利20余项。主持了国家自然科学基金面上项目（2项）、重庆市留学回国人员创新创业项目、重庆市博士直通车项目、之江实验室开放基金和德国DAAD研究基金等10多项'
