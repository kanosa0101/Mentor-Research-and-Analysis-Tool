bio_raw: '刘凯，重庆大学国家卓越工程师学院、计算机学院教授，博士生导师。

  2011

  年

  8

  月获得香港城市大学计算机科学博士学位。曾为美国弗吉尼亚大学访问学者、香港城市大学高级研究助理及博士后、新加坡南洋理工大学博士后、以及香港浸会大学博士后。

  主要研究方向包括边缘智能、移动计算、具身智能、自动驾驶、车联网等。共发表学术论文

  200

  余篇，包括

  JCR

  一区期刊论文

  80

  余篇、

  IEEE/ACM Transactions 60

  余篇、

  CCF A

  期刊

  /

  会议论文

  30

  余篇，出版专著

  2

  部、教材

  1

  本、

  Book Chapter 2

  篇；

  曾荣获

  Chester W. Sall Memorial Awards

  （暨

  IEEE Transactions on Consumer Electronics

  最佳论文奖），

  3

  次荣获国际会议最佳论文奖，

  4

  次入选年度斯坦福全球前

  2%

  顶尖科学家榜单；主持'
