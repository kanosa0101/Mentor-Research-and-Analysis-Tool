bio_raw: '个人简介

  Personal Profile

  李小国，山西运城人，重庆大学弘深优秀学者，教授，博（硕）士生导师。

  先后在澳大利亚、香港、新加坡从事研究工作，主要研究方向包括应用密码学、可信计算、人工智能与密码学等，在IEEE S&P (Oakland)、NDSS、IEEE
  TDSC/TIFS等网络与信息安全领域顶级会议和期刊发表学术论文40余篇。

  担任《网络与信息安全学报》青年编委，WWW等多个国际高水平会议程序委员会委员，IEEE TDSC、TIFS、TCC等多个国际高水平期刊审稿人；获“互联网+”全国总决赛金奖、FCS国际会议最佳论文奖。

  主持国家自然科学基金、重庆市优青专项等多项国家级和省部级项目。

  目前团队经费充足，年度招收博士2名，硕士3名；欢迎自驱力强的数学、计算机、软件工程等相关专业的学生报考！ 有意者可邮件联系：csxgli@cqu.edu.cn。

  2027年度：博士1/2，硕士0/3'
