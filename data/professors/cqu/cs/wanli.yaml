bio_raw: '个人简介

  Personal Profile

  万里，博士，重庆大学计算机学院，教授，大数据、物联网智能化专家。

  国家智慧城市标准化总体组专家

  重庆城市建设安全管理智能化工程研究中心（重庆市发改委）主任

  重庆软件产业专家顾问委员会专家

  主持和参与完成多项国家级和省部级项目，包括国家重点研发计划（1项）、973项目（1项）、国家863项目（1项）和国家自然科学基金项目（2项）；重庆市自然科学基金项目（1项）、重庆市科技局重点专项（2项目）、重庆市经信委科技创新项目（2项）、网络与交换技术国家重点实验室重点专题项目（1项）以及横向科研应用类项目多项。

  在高水平国际会议（SIGKDD, ICDM, EDBT等）和期刊上发表研究论文五十余篇（SCI/EI检索）。'
