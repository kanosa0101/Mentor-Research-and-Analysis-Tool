bio_raw: '王逸群，副教授，硕士生导师

  ，

  博士毕业于中国科学院自动化研究所（

  CASIA

  ），模式识别国家重点实验室（

  NLPR

  ），本科毕业于重庆大学。

  2019-

  2022年期间于阿卜杜拉国王科技大学（

  KAUST

  ）进行计算机图形学、3D视觉、人工智能的访问研究。主要研究方向为计算机图形学、三维重建、空间智能、机器视觉等。已在

  ACM TOG，IEEE TVCG，IEEE TPAMI，ACM SIGGRAPH，CVPR，NeurIPS，AAAI

  等国际顶级

  （

  CCF A类

  ）

  期刊与会议上发表论文20余篇，其中第一/通讯作者A类论文10余篇

  。

  曾获得

  CVM 2026最佳论文奖（唯一）、

  中科院院长奖、

  CCF-

  腾讯犀牛鸟优秀基金奖、

  重庆市优秀毕业生等

  奖项

  ，并

  在GAMES (图形学与混合现实研讨会) 、中国计算机学会（CCF）计算机辅助设计与图形学专业委员会，中国图形图像学会（CSIG）智能图形学专业委员会，中国工业与应用数学学会（CSIAM）几何设计与计算专业委员会等多个学术组织中担任执行委员。

  他担任The Visual Computer Journal (TVCJ) 副编辑，中国图学学会高级会员，先后主持了国自然青年项目、重点项目课题，重庆市面上项目、重大项目课题等'
