bio_raw: '个人简介

  Personal Profile

  张迪，重庆大学计算机学院副研究员，硕士生导师。2021年12月获计算智能与信息处理博士学位，导师为廖晓峰教授（IEEE/AAIA/AIIA Fellow、长江学者特聘教授）；曾是重庆大学计算机科学与技术学科博士后，合作导师为向涛教授（长江学者特聘教授）；曾在美国弗吉尼亚理工学院暨州立大学（Virginia
  Polytechnic Institute and State University）交流访问两年。

  研究方向包括：应用密码学，区块链、隐私保护、AI安全、大模型安全、后门攻防等，相关研究成果在 IEEE TIFS、IEEE TDSC、IEEE TCC、IEEE
  TSMC等国际知名期刊上发表SCI论文20余篇，其中一作/通信15篇；获EI国际会议IEEE CCPQT 2025 最佳论文奖；主持了国家重点研发计划子课题、国家自然科学基金青年基金、重庆市自然科学基金面上、中国博士后面上等国家/省部级项目6项；参与了国家自然科学基金重点项目、面上项目等国家级项目3项；申请国家发明专利7项；2025年、2026年指导国家（市）级大创项目3项、校级SRTP多项。

  每年度有2-3个硕士名额。如果你对信息安全领域的研究充满好奇和热情，渴望探索安全技术，对“发现未知风险”或“设计防御方案”感兴趣，那就快来加入我们团队吧！

  欢迎交流咨询，请将简历发送至邮箱 dizhang@cqu.edu.cn

