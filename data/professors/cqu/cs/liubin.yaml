  研究方向： 量子信息及其在密码学中的应用；量子计算及其在网络安全、机器学习等领域的应用。

  招生信息： 招收计算机、数学、物理等专业硕士研究生。

  2个人简介：

  个人简历：刘斌，山西太原人，北京邮电大学数学与应用数学学士、密码学博士。主要从事量子密码领域的研究工作，研究方向是量子密码协议的设计与分析，包括量子密钥分发的安全性分析、量子保密查询的实用化进程以及信息论安全的量子位置认证可行性分析等；在包括《Physical
  Review A》《Optics Express》《IEEE Journal of Selected Topics in Quantum Electronics》《IEEE
  Transaction on Computer》等国际著名期刊上发表SCI检索论文40余篇，其中第一作者论文18篇，非一作的通信作者论文11篇，SCI总引用次数达1800余次，H因子22。2016年入选首届“博士后创新人才支持计划”；2017年获首届“中国密码学会优秀博士学位论文”；2018、2019、2024年分别获得上一年度“《中国科学：物理学
  力学  天文学》年度优秀论文”。2019年、2020年借调教育部科技发展中心。2023年8月-2026年7月赴石河子大学援疆（中组部第十一批援疆计划）。

  自我描述：佛系、随性，科研上的idea很多，也乐于专研问题，但是疲于甚至有些抵触攥写论文（懒+不擅长对成果的包装+厌恶写英文Introduction）；可以半年研究&攥写3篇论文，也有两年不写1篇的时候。

  爱好长距离跑步，参加过60余次全程马拉松，10次100公里以上距离的越野赛。喜欢玩游戏，初三开始接触电脑游戏，高考前一个多月开始沉迷魔兽世界，目前偶尔玩玩《文明6》、《原神》和《崩坏·星穹铁道》，后面会试一下绝区零和黑神话悟空。

  与人相处时尊重他人的意见，习惯先考虑别人的立场和诉求，不习惯给人下命令。

  招生说明：如果你与我性格相仿或者兴趣相投，那么我们一定会相处得很愉快；如果你与我性格互补（如果你勤奋、踏实、认真），那我们的组合会发挥1+1>>2的效果。

  如果你有继续读博的计划，无论校内还是校外，国内还是国外，那么我会是你的神助攻；如果你计划毕业后直接工作，那么……我助攻你毕业吧=。=b

  最后也是最重要的：按照目前学院的毕业要求，在我这里基本不需要为小论文发愁，目前已指导本科生发表SCI论文6篇（论文目录22、23、26、28、29、31）。最后以一个上古原神梗结束吧：我以前一直是不干正事的巴巴托斯，现在想学一下至冬国女皇，来当我的执行官吧。

  Ps：我的研究方向的正经说明见第4部分。

  Ps2：我这边的研究和项目不需要编程语言的熟练掌握，懂最简单的算法即可，不过你的编程能力得通过学院复试。

