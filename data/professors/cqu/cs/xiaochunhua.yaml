bio_raw: '个人简介

  Personal Profile

  肖春华，教授，博士生导师

  /

  硕士生导师，重庆大学引进人才，任职于

  CPS

  （

  信息物理社会可信服务计算

  ）

  教育部重点实验室

  及

  重庆大学计算机学院。美国加州大学洛杉矶分校（

  UCLA

  ）国家公派联合培养博士，澳大利亚昆士兰大学国家公派博士后。作为负责人主持项目

  16

  个，包括中央军委快速扶持

  /

  十四五装备预研项目

  2

  项，国家自然科学基金

  2

  项，省部级基金

  2

  项，以及与中国电科、国防科大、成飞、华为、

  OPPO

  等国家级科研机构

  /

  行业领军企业的横向合作项目十余项。已发表领域高质量权威期刊

  /

  会议学术论文四十余篇，获科技进步奖

  1

  项。

  由肖春华教授引领的

  领域专用计算

  DSC

  （

  Domain Specific Computing

  ）实验室

  ，以领域专用计算架构创新和特定应用系统

  级

  优化为双引擎驱动，

  研究方向覆盖软件应用优化，系统级软硬件协同优化，以及特定领域的硬件加速，

  致力于培养兼具系统级创新思维和综合实践能力的高端复合型人才。

  在智能系统优化领域

  ，实验室与中电科研究所、中国空气动力研究与发展中心、国防科技大学等多个国家级机构，以及华为、

  OPPO

  等多家行业领军企业深度合作。

  聚焦基于大模型的

  AI

  辅助编码、

  移动终端数据使用模式

  优化

  、边缘

  AI

  高效部署及分布式云存储优化等方向，通过“产学研用”协同创新，实现传统

  计算

  系统的

  应用性能深度优化

  。

  领域专用计算方面

  ，实验室目前已经成功构建了国内领先的

  雷达信号处理

  专用设计平台，覆盖了从高性能计算算子库、可重构阵列式计算架构，

  到

  Agile-V

  敏捷仿真平台

  的全栈式

  软件定义开发工具链

  ，

  并实现了关键技术的应用验证。相关技术平台和方法学具备推广到其它领域（能实现共性操作特征抽象的领域），如神经网络计算及通信基带处理芯片设计等。

  领域

  专用计算

  实验室期待与更多的

  优秀人才，

  专家和企业携手并进，共攀计算机科学研究的新高峰。

  课题组有博士生，硕士生招生名额，欢迎联系沟通，通过考核后我们将择优录用。

  课题组承担了国家自然基金面上项目、青年项目、科技部863项目、华为横向项目、重庆市前沿与应用基础研究计划项目等多个项目。目前的研究重点包括：基于AI的辅助编码，领域专用的可定制计算研究，软硬件协同设计等。团队科研经费充足、能够为团队研究生提供丰富的锻炼机会和劳务津贴支撑。研究生能够通过实际'
