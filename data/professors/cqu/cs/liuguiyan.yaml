bio_raw: '个人简介

  Personal Profile

  刘贵燕，西南大学博士，重庆大学弘深青年教师、博士后。曾为加拿大多伦多大学访问学生，香港理工大学研究助理。研究方向包括软件定义网络，数据中心网络，移动边缘计算和

  5G

  网络切片等。相关研究成果先后表在

  IEEE TCC

  、

  TNSM

  、

  FGCS

  、

  IPDPS

  等国际主流期刊及会议20余篇。主持中国博士后科学基金（面上）1项，重庆市自然科学基金（博士后）1项，中央高校学生项目 1 项，参与国家自然科学基金 2 项、中央高校一般项目
  2 项，之江实验室开放课题 1 项。'
