bio_raw: '个人简介

  Personal Profile

  乐俊青

  ，江西抚州，副研究员，硕士生导师，CCF网络与系统安全专委执行委员，轨交数据治理与安全实验室负责人。师从廖晓峰教授（教育部长江学者

  特聘教授

  ， IEEE/AAIA/AIIA Fellow），现为计算智能与信息安全团队—负责人为向涛教授（教育部长江学者特聘教授）。主要研究方向包括隐私计算、人工智能及其安全、计算机视觉

  及其

  安全、大模型安全、智能网联汽车安全等。

  1）近五年，主持国家及省部级'
