bio_raw: 叶春晓，博士，教授，博士生导师，伦敦大学皇家霍洛威学院（Royal Holloway, University of London）信息安全团队（Information
  Security Group）访问研究学者。主要研究方向为区块链、信息安全、云计算等。发表论文70余篇。主持和主研了国家十五科技攻关、国家十一五科技攻关、国家发改委科学研究计划、国家“863”计划、国家自然科学基金、国家重点研发计划、军委科技委、教育部博士点基金、重庆市自然科学基金、国家十一五重大社科基金等各类国家和省部级（军工）
