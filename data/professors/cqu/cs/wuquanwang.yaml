bio_raw: '个人简介

  Personal Profile

  教授，博导/硕导；中国计算机学会（CCF）高级会员、IEEE

  高级

  会员。从2003年到2013年于重庆大学依次获得学士、硕士、博士学位；2014年到2015年于日本National Institute of Informatics担任Special
  Researcher；2016年起于重庆大学计算机学院任职。主要研究方向包括云计算、计算智能、数据挖掘，在IEEE Transactions on Parallel
  and Distributed Systems, IEEE Transactions on Services Computing等SCI期刊和国际会议上发表学术论文60余篇。主持

  国家自然科学基金面上和青年项目、

  国家重大研发计划子课题、中国博士后科学基金面上项目和特别资助、重庆市博士后'
