bio_raw: '个人简介

  Personal Profile

  研究方向

  ：

  深度学习与

  数据挖掘

  、

  自动控制与工业自动化

  、

  动漫制作与仿真

  招生信息

  ： 年度招收全日制学术硕士与专业硕士（含计算机、电子信息、车辆工程）、非全日制硕士，涉及软件、机械、经管、工程等背景。

  个人简介

  ：

  由北京大学获得计算机软件与应用理学学士学位、由北京航空航天大学控制科学与工程博士学位。目前为重庆大学专职教师、省部级专家人才。专注于数据挖掘、动漫制作、嵌入式系统研究与开发十余年。申请国家发明专利11项，其中7项获得授权（获批）；发表学术论文五十余篇，其中被SCI、EI和ISTP三大检索机构检索四十余篇。

  担任《

  INT J INF TECH DECIS

  》、《

  ARTIF INTELL

  》、《

  COMPUT MATH APPL

  》等顶级SCI期刊和国际会议

  IEEE International Conference on Data Mining

  (

  ICDM

  )的审稿专家，是国家审计署网络信息技术的外聘咨询专家。

  主持、主研国家高技术研究发展计划（863计划）、总装备部装备预研基金（军）、国家自然科学基金、重庆市科技攻关计划、重庆市自然科学基金等项目三十余项。

  先后师从张师超、吴信东、张成奇、韩亮、龚光红等教授，属于机器学习与智能仿真团队，近年来一直活跃在大数据与物联网研究与应用前沿。

  研究基础

  ：在大数据与人工智能关键技术方面已获得一定的研究和应用成果，在多届物联网远程监护技术大赛、全国挑战杯大赛、教授博士创业计划大赛中获得大奖。自主研发的针对远程监护的智能物联网协议（简称

  C-MAC

  ）在通讯距离，组网规模、多级路由、智能化支持等指标上超过国外

  Zigbee

  协议。其产品先后入选2012年、2013年、2014年、2015年“物联网产业重点项目”计划，在“2012龙芯嵌入式产品发布会”上，香港卫视、江苏电视台、南京电视台等25家媒体进行了报道。

