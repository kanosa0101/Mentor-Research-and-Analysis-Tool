bio_raw: '个人简介

  Personal Profile

  周明强，博士，副教授，硕士生导师，ACM会员，中国计算机学会会员，CCF YOCSEF ChongQing AC委员、重庆计算机学会理事，软件理论与技术重庆市重点实验室和软件工程重庆市（高校）重点实验室副主任，主要研究人工智能（表示学习）、服务计算、大数据及复杂网络应用（社交网络）的相关问题与技术，研究软件理论与技术并从事工程项目的研发，专注于人工智能与多媒体交互技术在教育教学中的应用研究。

  获重庆市科技进步二等奖，重庆市自然科学三等奖，重庆大学自然科学二等奖。主持科技部国家科技支撑计划重点项目，重庆市科委自然科学基金计划面上项目，重庆市科技计划项目决策咨询与管理创新研究计划（技术预见与制度创新）重点项目，重庆市高等教育教学改革研究项目，重庆市信息产业局科技计划项目，中央高校基本科研业务费科研专项自然科学类项目等10余项，作为重要研究人员参与国家863计划、国家科技支撑计划、国家自然科学基金及重庆市人工智能技术创新重大主题专项等省部级项目和各类横向'
