bio_raw: '黎勇（1982.10—），男，博士，教授，博士生导师，国家级重点项目首席科学家。2012.12月获厦门大学工学博士学位。2011.9-2012.8美国加州大学戴维斯分校联合培养博士生；2006.8-2007.1任香港城市大学电子工程系研究助理。

  主要研究兴趣为：信息论与编码、编码计算、视频/图像智能分析。目前主持国家级重点项目

  1项（经费千万元级）

  、企业委托项目2项、中央高校基本业务费项目2项。近年来先后主持国家自然科学基金项目、川渝联合实施重点研发项目、中国电子科技集团委托项目、陆军军医大学委托项目、华为委托项目、中央高校业务费项目、重庆市科委、教委等项目20余项，在IEEE
  TIT/TCOM/TISF/TWC/TIP/TGRS/TVT等国际权威SCI期刊和AAAI/CVPR/ICME等CCF A/B类会议上发表论文50余篇。获国家发明专利10项、美国专利3项。获重庆市技术发明奖二等奖1项（序1）、中国通信学会科学技术奖1项（序9）、网络空间部队信号处理创新挑战赛三等奖1项（序1）。

  课题组长期招收弘深青年教师和博士后，方向包括但不限于：信息论、编码理论、信息安全、分布式计算、大模型、视频\图像分析。

  课题组研究经费充足，氛围融洽，2026年度计划招收4

  -5名硕士生

  （计算机、通信、数学等专业）、2

  -3

  名计算机、通信或数学背景的

  博士生

  （研究方向为：边缘计算、信道编码、大模型等），要求：如果是硕士生申请学术博士，需毕业于上一轮学科评估B+以上的985/211高校或者在CCF B类以上会议/期刊或在IEEE
  CL、IEEE WCL、IEEE Trans.等领域内高水平期刊以主要作者发表过相关论文。

