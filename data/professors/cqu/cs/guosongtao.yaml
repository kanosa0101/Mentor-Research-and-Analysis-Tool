bio_raw: '个人简介

  Personal Profile

  郭松涛，男，博士、二级教授、博士生导师，教育部“新世纪 优秀人才支持计划”入选者，

  重庆市学术技术带头人

  。ACM重庆分会主席、CCFYOCSEF 重庆主席，IEEE/ACM高级会员，重庆大学计算机学院副院长，信息物理社会可信服务计算教育部重点实验室副主任，CCF
  物联网专委会常委，CCF网络与数据通信专委会常委。主要在边缘联邦学习，深度学习与图像处理、

  智能边缘计算、边缘智能与无人系统

  等方面开展研究，已取得显著的研究成果，在包括

  在 TC、TMC、TPDS、TCC、TSC、TCOM、TVT、TMM、TNSE、TNSM、IOTJ、INFOCOM、IPDPS、 SECON、IWQOS、计算机学报等著名期刊和会议上发表高质量论文220多篇

  ，其中第一作者/通信作者140余篇。主持千万级国家重大科技项目、国家自然科学基金项目、中国博士后科学基金项目、重庆市自然科学基金重点项目、千万级横向项目等20多项。获得重庆市自然科学一等奖2项、二等奖1
  项，担任第十三届IEEE网络架构与存储国际会议、第十三届中国物联网学术会议等10余个国际国内会议主席、副主席，2020IEEEIPDPS程序委员会领域主席。'
