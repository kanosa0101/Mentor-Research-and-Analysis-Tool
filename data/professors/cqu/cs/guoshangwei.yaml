bio_raw: '个人简介

  Personal Profile

  郭尚伟（

  谷歌学术主页

  ），重庆大学副教授、国家级青年人才、博士生导师，重庆大学智能汽车网络安全实验室负责人，先后在香港浸会大学数据库实验室和新加坡南洋理工大学网络安全实验室从事研究工作。主要从事人工智能、多媒体大数据等应用背景下的安全与隐私保护相关研究。在TPAMI、TIFS、TDSC、ICLR、ICML、NeurIPS等国际高水平期刊和会议发表论文60余篇，担任多个审稿编辑和期刊审稿人/会议程序委员会委员。主持包括国家自然科学基金重点项目课题、面上/青年项目等多个国家级和省部级纵向项目，以及华为、重庆市轨道交通、CCF-腾讯犀牛基金等横向项目，获重庆市科技进步一等奖。

  研究方向

  团队整体研究方向为

  人工智能安全治理

  ，聚焦智能系统安全与隐私保护，面向通用智能系统、智能车载系统、智能轨道交通等典型场景，研究安全评测、攻击检测、防御增强、隐私保护与可信构建等关键问题。团队强调面向真实应用场景建立可验证、可落地、可持续演进的安全治理方法和技术体系，支撑智能系统在复杂开放环境中的可信应用。

  招生与项目制培养

  团队实行项目制学生管理：以真实科研和工程项目为牵引，逐步形成问题定义能力、论文阅读能力、系统实现能力、实验评测能力和团队协作能力。

  2027级招生计划：

  博士生：拟招收3名（已招满）

  硕士生项目方向一：通用Agent系统安全（剩余名额2名）

  硕士生项目方向二：智能车载系统安全（剩余名额2名）

  硕士生项目方向三：智能轨道交通安全（剩余名额1名）

  团队研究方向为高热度研究，节奏快；欢迎对技术有持续热情的同学，若缺少技术热情，请考虑其他导师！'
