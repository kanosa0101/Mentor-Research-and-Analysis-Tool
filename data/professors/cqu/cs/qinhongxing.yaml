bio_raw: '个人简介

  Personal Profile

  秦红星，男，博士，教授，博士生导师。2008年获上海交通大学博士学位，2008年至2009年于美国罗格斯新泽西州立大学从事博士后研究工作。主要研究方向为计算机图形学、三维视觉、可视化与可视分析。

  在ACM TOG，IEEE TVCG、CGF等国际著名期刊发表二十余篇；取得授权专利8项；作为课题负责人先后主持国家自然科学基金项目3项，国家重点研发子课题1项目，重庆市基金2项；作为骨干成员参与国家自然科学基金重点项目、重庆市重点项目等多项；指导学生参加科技竞赛多次获得一等奖。

  研究兴趣

  计算机图形学、三维视觉、可视化与可视分析

  招生信息

  年度招收硕士生2-3名，博士生1名。欢迎对学术研究感兴趣、踏实努力、有长远规划的同学报考。特别欢迎计算机类、电子信息类、数学类同学报考。

