  in采样方法与应用研究（6177209

  7），国家自然科学基金面上项目，61万元，2018-2021，负责人。

  基于多模态医

  学图像处理的多维可视化辅助诊疗关键技术研究（U1401252），国家自然科学基金-广东联合基金重点项目，242万元，2015.01-2018.1，排名第2。

  结合数据认知与视觉

  感知的体数据理解与可视化（61100113），国家自然科学基金青年基金项目，22万元，2012.01-2014.12，项目负责人。

  赛迪集团-BIM的“EDA”研究项目： 既有设备图纸数字化研究软件平台开发服务，横向项目，66万元，2024.03-2025.09，项目负责人。

