  代表性项目

  拓扑感知的高维数据降采样投影理论与方法研究（62672070），国家自然科学基金面上项目，50万元，2027-2030，负责人。

  通用视觉驱动的城市计算交

  通及应用（课题：开放式云原生城市级数字孪生平台），科技创新2030-重大项目，100万元，2023-2025，子课题负责人。

  面向高维数据可视分析投影与采样相结合的理

  论与方法研究（62272071），国家自然科学基金面上项目，54

  万元，2023-2026，负责人。

