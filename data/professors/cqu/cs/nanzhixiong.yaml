bio_raw: 'Personal profile

  个人简介

  南智雄，男，重庆大学计算机学院副教授。加州大学洛杉矶分校（UCLA）联合培养博士。主要研究方向是自动驾驶和人机交互，在T-IP, T-MM, T-CSVT, T-IV,
  T-NNLS, T-ITS, Pattern Recognition等期刊和AAAI,CVPR, NIPS, ACM-MM, ICCV, IROS等会议上表论文40篇。主持、参与多项国家重点研发计划项目课题、国家自然科学基金委...

