  招生信息

  🛠️🔬

  ：

  欢迎对上述方向感兴趣的本科生、研究生同学，与本人联系；

  本科生

  可以指导参加大学生SRTP、大学生科研创新项目（国家级、重庆市级）等类别的项目，定制题目；

  研究生

  可以协商方向，愿意做硬件系统的同学也可以加入，与中科院自动化所、华为诺亚方舟实验室固定人员，也有联合研究的内容，均可按兴趣参与。'
