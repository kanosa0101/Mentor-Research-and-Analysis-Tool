bio_raw: '个人介绍🎞️👨🏻‍🎓

  本人现为重庆大学计算机学院助理研究员，IEEE Member，CCF，中国自动化学会会员，（2023年1月～至今）；

  本人博士（直博）毕业于

  中国科学院自动化研究所

  （所在实验室为中国科学院工业视觉智能装备技术工程实验室）（2017年9月~2023年1月）；

  读博期间，本人在量产辅助驾驶Top Tier

  独角兽公司

  Momenta

  （中国智能驾驶公司第一梯队：华为、Momenta）实习，从事无人驾驶视觉感知算法研发工作；

  本人本科毕业于中国矿业大学（2013年9月~2017年6月）；

  本人一直从事机器人智能感知与定位、广域大视野目标搜索算法、高速视觉的研究工作；在IEEE Trans. 期刊发表论文8篇，作为第一作者发表论文8篇，通讯作者论文3篇；

  研究目标：为机器人提供高速准确的环境感知与定位能力。

  本人长期从事的研究领域

  🤖

  🔬：

  高速视觉（High-Speed Vision）

  机器人智能感知与定位（Intelligent Perception and Localization for Robotics）

  多传感器融合感知（Multi-sensor Fusion for Perception）

  广域目标检测与搜索算法与系统设计（Wide-Area Object Detection and Searching）

  事件相机及其在智能机器人上的应用（Event Camera and Its Applications on Intelligent Robotics)

  Latest News!🆕🔥

  🔥

  项目

  2025年12月，本人获批

  GF

  基础加强计划联合基金项目

  资助，项目名称：WRXT智能感知算法xxx研究。

  2024年8月24日，本人获批

  国家自然科学基金青年基金[C]

  资助， 项目名称：面向复杂场景的多目标高速探测方法研究。

  2024年7月17日，本人获得

  中央高校基本科研业务费-GF专项

  资助，项目名称：基于xxxx的神经网络xxxx算法与系统研究。

  2024年4月06日，本人获批

  重庆市2023年度重庆市博士后研究项目特别资助名单

  资助

  ，项目名称：基于多源信息融合技术的无人感知系统研制。

  2023年11月07日，本人获得

  中国博士后科学基金第74批面上项目

  资助

  ，

  项目名称：多模态信息融合的类脑定位导航算法研究。

  获奖

  2025年8月，项目组获得了2024年重庆市科技进步一等奖，👏🏻

  论文

  🔥

  🔥

  ○

  2026年2月，一篇利用新型事件相机进行高精度鲁棒位置识别Event-based Visual Place Recognition的论文，

  投稿至

  ECCV。

  ●

  2026年6月5日，一个与中科院自动化所合作的工作：“Dual-Galvanometer-Based Active Stereo Vision for Large-FOV

  High-Precision

  3D

  Reconstruction of Moving Objects”，构建了双振镜大视野高精度立体系统，

  实现了移动目标的3D重建

  ，

  被IEEE RAL接收（机器人知名期刊，本人通讯）

  。

  ●  2025年11月1日，MambaSeg: Harnessing Mamba for Accurate and Efficient Image-Event
  Semantic Segmentation，被

  AAAI 2026

  （CCF-A，本人通讯）接收，

  该模型利用Mamba减少算法复杂度，提出了新的跨模态融合模块，目前在两个数据集上性能均为SOTA。

  ●

  2025年8月22日，一篇本人深度合作的论文，基于边缘特征的机器人定位算法（EdgeSLAM）在挑战环境下进行高效、准确与鲁棒的定位，

  被

  国际机器人顶级期刊 IEEE Transactions on Robotics (T-RO)接收（SCI，中科院一区Top，机器人领域Top，IF：10.5，共同作者）。祝贺赵辉博士！

  ●

  2025年6月16日，一篇基于Transformer的事件相机轻量化分割算法的论文“SLTNet: Efficient Event-based Semantic
  Segmentation

  with Spike-driven Lightweight Transformer-based Networks”，被

  IEEE/RSJ IROS 2025接收

  （

  机器人领域顶会，

  本人通讯

  ）。

  ○

  2025年6月2日，一篇关于结合事件相机的高动态优势与RGB相机的丰富纹理优势，提出的Event-Image融合算法并应用于自动驾驶场景理解的论文，

  投稿至

  IEEE Transactions on Circuits and Systems for Video Technology

  （SCI，中科院1区，

  本人通讯

  ）。

  ●  2

  025年4月29日，一篇半监督轻量化的人体活动识别的论文，被IEEE Sensors Journal（SCI，JCR Q1，本人一作）接收。

  ●  2025年2月13日，一篇关于事件相机用于机器人触觉感知增强的算法DeepTactile被

