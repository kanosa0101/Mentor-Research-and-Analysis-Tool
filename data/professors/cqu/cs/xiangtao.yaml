bio_raw: '向涛，教授，博导，重庆大学计算机学院院长，国家级人才，国家重点研发计划项目首席科学家，教育部“新世纪优秀人才支持计划”获得者，重庆市杰出青年基金获得者，重庆市英才计划创新领军人才，信息物理社会可信服务计算教育部重点实验室中心主任，四川省网络空间攻防对抗工程技术研究中心副主任，重庆市人工智能技术创新战略联盟副秘书长，重庆市信创联盟专家工作组成员，重庆市计算机类专业教学指导委员会委员，重庆大学学术委员会委员，

  香港中文大学、香港城市大学、美国马萨诸塞大学洛厄尔分校访问学者。

  IEEE高级会员，中国计算机学会高级会员，中国密码学会高级会员，中国保密协会隐私保护专业委员会常务委员，中国电子学会电路与系统分会混沌与非线性电路专委会副主任，中国计算机学会区块链专委会委员，中国图象图形学学会数字媒体取证与安全专委会委员，中国密码学会混沌保密通信专委会委员，四川省计算机学会网络与信息系统专委会副主任。

  主要研究方向为区块链、隐私保护、人工智能安全、多媒体安全、云计算安全、大数据安全等。承担了包括国家重点研发计划项目、国家自然科学基金重点项目、国家自然科学基金区域创新发展联合重点项目、国家自然科学基金面上项目、重庆市自然科学基金重点项目等20余项国家和省部级'
