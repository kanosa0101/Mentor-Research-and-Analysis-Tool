bio_raw: '伍星，博士，副教授，硕士生导师，1978年6月出生，于2001年在东北大学秦皇岛分校获得学士学位，于2004年和2012年在重庆大学计算机学院分别获得硕士学位和博士学位。研究领域包括计算机视觉领域中的目标检测、视觉大模型、医学图像处理。近三年来专注于医学图像的视觉大模型研究，聚焦于视觉大模型在医学领域的领域适配和轻量化。指导的硕士多数就业于阿里、腾讯、字节、华为、快手、美团等互联网大厂，少数就业于研究所、国有银行、知名国企。

  研究方向

  视觉大模型、医学图像处理、知识蒸馏'
