bio_raw: '孙天昊，博士，高级实验师，硕士生导师，CCF会员。分别于2001、2004和2008年获重庆大学计算机学院计算机科学与技术专业学士学位、计算机系统结构专业硕士学位和博士学位。2009.11-2011.10在嘉陵集团（重庆大学联合招收）博士后工作站从事电子商务、企业信息化研究。

  主要研究领域为电子商务，机器学习与计算智能，智能推荐系统与大数据处理。

  先后主持或主研'
