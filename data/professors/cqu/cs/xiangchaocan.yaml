bio_raw: '向朝参，博士，重庆大学计算机学院教授/博士生导师，

  高层次青年人才

  ，重庆市杰出青年科学基金获得者，重庆市学术技术带头人，

  重庆市“

  巴渝青年学者

  ”，

  重庆大学小米青年学者。

  2009

  年和

  2014

  年在解放军理工大学通信工程学院分别获得学士和博士学位；

  2017

  年到美国

  University of Michigan-Ann Arbor

  计算机系留学一年(师从著名的

  Kang G. Shin

  院士)。

  2014

  年至

  2018

  年在解放军后勤工程学院工作。

  2019

  年以副教授引进到重庆大学计算机学院工作，

  2023

  年破格晋升为教授。

  主要从事人工智能、城市计算、物联网、移动智能感知、大数据等方面的研究。近

  5

  年

  主持国家

  /

  省部级纵向项目

  10

  项

  ，

  包括JKW

  国防创新特区重点项目

  1

  项

  、

  国家自然科学基金项目

  3

  项

  、重庆市自然科学基金项目

  3

  项、教育部教改重点项目

  2

  项、国防项目

  1

  项、中央高校基金项目

  1

  项，以及企业横向项目

  2

  项；作为主要核心骨干承担国家自然科学基金项目

  2

  项和国防项目

  4

  项。共发表学术论文

  60

  余篇，包括

  CCF A/IEEE/ACM

  汇刊

  /SCI

  一区

  高水平论文

  35

  余篇，

  ESI

  高被引论文

  2

  篇

  ，如

  IEEE/ACM TON

  、

  IEEE TMC、IEEE TPDS、IEEE ITS、IEEE TVT、ACM TOSN、IEEE INFOCOM、ACM UbiComp、

  《计算机学报》、《电子学报》等。获

  军队科技进步三等奖2项；ACM中国2021年新星奖(重庆)；大学科研学术成果一等奖1项(排名第一)；中国电子学会2021年优秀学术论文奖1项(排名第一)；

  第十七届中国物联网学术会议

  (

  CWSN)

  最佳论文奖(通信作者)

  ；

  CCF推荐重要国际学术会议最佳论文奖1项

  (排名第一)；被计算机科学期刊编委会评为

  2020

  年全国“突出贡献专家”；获大学教学成果三等奖1项。指导学生获第三届全国高校物联网应用创新大赛西南赛区一等奖(第一名)，并被评为优秀指导教师。出版

  Springer

  英文专著和中文专著各1部(排名1)，申请/授权国家发明专利

  8

  项(排名

  1

  )。

  担任计算机领域中文重要期刊《计算机科学》(

  CCF B

  )执行编委、担任国际学术会议

  IEEE UIC

  物联网分会主席、中国图灵大会(

  ACM TURC

  )志愿者委员会主席、中国和谐人机环境联合会议

  (HHME)

  宣传主席、国家自然科学基金评审专家、中国计算机学会

  CCF

  高级会员、中国计算机学会物联网专委会委员和普适计算专委会委员、国际计算机学会

  ACM SIGBED

  专委会首届委员、中国电子学会物联网青年专技组委员。

  社会兼职

  研究方向

  2023年至今担任计算机领域国际期刊《Tsinghua Science and Technology》 (SCI JCR-1, IF=5.2)编委

  2022年至今担任计算机领域国际期刊《High-Confidence Computing》编委

  2022年至今担任中国计算机学会CCF 高级会员

  2020年担任中国和谐人机环境联合会议(HHME)宣传主席

  2019年至今担任ACM中国图灵大会(ACM TURC)志愿者委员会主席

  2019年担任国际知名学术会议IEEE UIC 2019物联网分会主席(Track Chair)

  2021年担任计算机领域中文重要期刊《计算机科学》(CCF B)执行编委

  2021年至今担任国际计算机学会ACM China SIGBED委员会首届委员

  2020年至今担任中国计算机学会物联网专委会委员

  2020年至今担任中国电子学会物联网青年专技组委员

  2019年至今担任中国计算机学会普适计算专委会委员

  2021年担任计算机领域著名国际会议IWQoS 2021(CCF B)TPC member

