bio_raw: '个人简介

  Personal Profile

  任骜，重庆大学

  “

  弘深青年学者

  ”

  、教授、博士生导师、美国东北大学博士，主要研究大模型推理加速、多智能体系统优化。

  获重庆大学优秀青年教师、

  重庆大学“最受学生欢迎的老师”、

  ACM

  中国新星奖（高性能计算）、

  重庆市科技进步一等奖等荣誉。

  先后在

  ASPLOS

  、

  ISCA

  、

  AAAI

  、

  DAC

  、

  ISSCC

  、

  ICASSP

  、

  ICCAD

  、

  TCAD

  、

  Neural Networks

  等领域标志性会议和期刊上发表论文

  80

  余篇，获得

  ICASSP2017

  的最佳论文奖和学术竞赛奖，

  ISQED

  最佳论文提名等荣誉。受邀担任

  Nature Electronics、TIP、TNNLS

  、

  TC

  、

  TCAD

  、

  JSA

  、

  TVLSI

  等国际期刊审稿人，担任

  DAC

  、

  ICCAD

  、

  ASAP

  、

  ASP-DAC

  等国际会议的技术委员会委员。

  招生信息：年度招收博士生1名、硕士生3名，欢迎计算机、软件、通信、自动化、数学等相关专业同学申请。

