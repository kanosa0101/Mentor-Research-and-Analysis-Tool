bio_raw: 'Personal profile

  个人简介

  王志杰于上海交通大学计算机科学与工程系获博士学位，现为重庆大学计算机学院副教授、博士生导师。他曾在中山大学、香港理工大学等机构从事科学研究工作。主讲离散数学、数据挖掘技术及应用、自然语言处理、大数据挖掘与分析等课程。他曾/现担任硕士\博士学位论文通讯评审专家、职称通讯评审专家、国家自然科学基金通讯...

