bio_raw: '个人简介

  Personal Profile

  周鹏展，

  重庆大学“弘深青年学者”引进人才、教授、博导、硕导。本科毕业于上海交通大学，获双学士学位，就读期间入选教育部“珠峰”计划；博士毕业于纽约州立大学石溪分校（导师为杨元元教授）。主要从事物联网、机器学习、具身智能和智能家居的相关研究，目前共发表论文32篇（CCF-A类12篇，CCF-B类8篇），其中以第一作者身份在CCF-A类会议INFOCOM/IJCAI和CCF-A类期刊TMC/TC共发表论文7篇，以第一作者身份在CCF-B类会议ICDCS和CCF-B类期刊TOSN共发表论文3篇。同时长期担任期刊TMC,
  TPDS, TCC和会议INFOCOM, KDD, NeurIPS, IJCAI, AAAI, ICDCS等的审稿人，以及ICDCS''22 & 23、NAS''22、MSN''20的程序委员会成员，iThings''22的Workshop
  Chair和2024年ACM中国图灵大会安全委员会主席。任中国计算机学会物联网专委会执行委员。获得2022年ACM中国新星奖（重庆）。

  招收有志于从事具身智能、智能家居、机器学习等领域研究的研究生，年度招收博士生1名、硕士生3名，招收计算机、电子信息、数学、物理等专业背景。同时欢迎有志于在本科阶段参与科研的同学加入团队开展科研探索，本团队成员会尽力辅导，争取做出发表成果。本团队和上海交通大学、浙江大学、香港理工大学、纽约州立大学石溪分校、纽约州立大学宾汉姆顿分校、新加坡国立大学等高校以及小米公司等企业拥有广泛合作，团队成员如有意，我会尽力推荐到以上合作高校深造，以及到以上公司实习、就职。'
