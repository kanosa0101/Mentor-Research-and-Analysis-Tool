bio_raw: '陈咸彰，重庆开州人，民进会员，重庆大学教授、博士生导师，新加坡国立大学Research Fellow。

  担任中国计算机学会(CCF)高级会员、IEEE Senior Member、国际计算机学会（ACM）会员、重庆市高等学校交叉学科专业类教学指导委员会委员。

  获得

  全国新时代青年先锋奖

  、新重庆青年创新人才、重庆市巴渝青年学者、民进全国参政议政工作先进个人、首届全国高等学校计算机教育研究会优秀青年教师、全国高校教师教学创新大赛一等奖

  （排名3）

  、重庆市科技进步奖一等奖

  （排名3）

  、民进中央参政议政成果一等奖

  （排名1）

  、全国高校教师数智教育创新大赛一等奖

  （排名2）

  、重庆市高校教师教学创新大赛一等奖

  （排名3）

  、重庆大学高等教育（研究生）教学成果一等奖（排名1）、重庆大学教书育人奖等荣誉或奖励。

  我的研究方向包括智能操作系统、存储系统、智能体等，与

  新加坡国立大学、阿联酋MBZUAI、

  香港城市大学、

  航天五院

  等海内外多所高校和院所建立了科研合作。主持了国家重点项目课题、国家自然科学基金面上项目和青年项目，以及华为、航天五院、中电科22所等头部企业的横向'
