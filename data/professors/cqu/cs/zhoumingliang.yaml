bio_raw: '个人简介

  Personal Profile

  周明亮，男，

  博士（后），博士

  /

  硕士生导师，

  “

  濠江学者

  ”

  ， 博士毕业于北京航空航天大学计算机学院，师从重庆大学计算机学院杰出校友李波教授，博士毕业后前往香港城市大学做博士后，师从

  Sam KWONG

  教授和贾维嘉教授，

  发表了论文 90 余篇，其中超过 50 余篇发表在 TIP、TMM、 TMC、TCSVT、TOMM、TBC、ACM MM 等 IEEE/ACM Transaction
  和 CCF A 类期刊和会议上，在学术界产生了重要的学术影响力。研究经费主要来自军科委基础加强重点项目课题、装备发展部与教育部联合基金重点项目、国家自然科学基金面上项目、中央军委装备快速扶持项目等多个重要'
