bio_raw: '王宁，重庆大学“泓深青年学者”教授、博士生导师，IEEE Member。北京邮电大学博士，美国乔治梅森大学博士后研究员。

  研究方向包括（但不局限于）：物理层安全，无人系统安全，具身智能安全，隐私保护以及机器学习等。相关研究成果先后发表于IEEE Networks Magazine,
  IEEE Transactions on Information Forensics and Security, IEEE Transactions on Wireless
  Communication, IEEE INFOCOM, IEEE Internet of Things Journal等国际顶级期刊及会议，截至目前发表论文40余篇，受邀为多个个国际期刊及会议审稿人，包括：IEEE
  TIFS, IEEE TWC, IEEE TMC, IEEE TCOM, IEEE TVT, IEEE TCCN, IEEE Wireless Communication
  magazine, IEEE IoT Journal, IEEE INFOCOM, IEEE CNS, IEEE GLOBECOM等主流学术期刊杂志，申请国家发明专利8项，出版专著1本。

  Book:

  Ning Wang,

  Long Jiao, Jie Tang, and Kai Zeng. Chapter: "Physical Layer Security for mmWave
  Massive MIMO Communications in 5G Networks", Book: "Frontiers in Hardware Security
  and Trust" [B], IET, 2020.

