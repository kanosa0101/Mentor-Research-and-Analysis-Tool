bio_raw: '个人简介

  Personal Profile

  吕庆国，博士（后），重庆大学计算机学院副研究员，硕士生导师。于2021年获得西南大学博士学位，导师为廖晓峰教授（IEEE/AAIA/AIIA Fellow、长江学者特聘教授、CPS教育部重点实验室主任）。曾为

  重庆大学计算机科学与技术学科博士后，合作导师为邓绍江教授（教育部新世纪优秀人才）

  ，

  美国德州农工大学卡塔尔分校访问学者，合作导师为黄廷文教授（世界科学院院士、欧洲科学院院士、IEEE/AAIA/IAPR Fellow、长江学者客座教授）。

  主要从事机器学习、智能电网、隐私安全等应用背景下的分布式优化理论与算法相关研究。在IEEE TPDS、IEEE TDSC、IEEE TSC、IEEE TCYB、IEEE
  TSMCS、IEEE TNNLS、IEEE TAC等国际高水平期刊和会议上发表高质量学术论文50余篇（IEEE Transactions系列汇刊论文30余篇），其中第一作者、通信作者等主要作者身份40余篇；出版英文专著4部；申请国家发明专利和国际专利10余项。担任国际期刊Journal
  of Machine Learning and Information Security执行编委（Executive Editor）、人工智能与控制系统期刊（Journal
  of Artificial Intelligence & Control Systems）首届青年编委、CSCD期刊重庆大学

  学报首届青年编委、国际期刊“

  Frontiers in Big Data、Complex Engineering Systems、Mathematics、Applied Sciences

  ”

  客座编辑

  等，长期担任IEEE TIFS、IEEE TPDS、IEEE TDSC、IEEE TNNLS、IEEE TCYB、IEEE TSMCS等著名期刊的审稿专家。

  主持

  包括

  国家自然科学基金面上项目、

  国家自然科学基金青年基金项目、中国博士后科学基金面上项目、重庆市自然科学基金面上项目、重庆市博士后研究项目特别资助（一等资助）、中央高校基本科研业务费项目、省部级重点实验室开放课题项目等多个国家级和省部级纵向项目，作为项目骨干参研国家重点研发计划项目课题、国家自然科学基金重点项目

  、国家自然科学基金面向项目

  、百万级横向项目等。获得2021年重庆市自然科学二等奖（3/4）、2021年ACM中国优

  秀博士论文（重庆分会）、2019年重庆市优秀硕士学位论文、2018年重庆市普通高等教育优秀毕业研究生、国际会议EEI 2024最佳展示论文等奖励或荣誉称号，指导本科生/研究生获重庆市研究生科研创新项目、中国高校计算机大赛-网络技术挑战赛-西南赛区二等奖、第十二届科慧研究生创新创业大赛科技创新三等奖、第十五届大学生科研训练计划（SRTP）项目等。

  个人主页：https://scholar.google.com.hk/citations?user=-EkVp0sAAAAJ&hl=zh-CN'
