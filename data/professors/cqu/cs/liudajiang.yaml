bio_raw: '刘大江，博士，重庆大学计算机学院副教授、硕士生导师；2009年本科毕业于电子科技大学微电子技术专业；同年9月进入清华大学微纳电子系直接攻读博士学位，2015年获得工学博士学位；同年8月进入清华大学计算机系进行博士后研究，2017年出站；同年9月进入重庆大学计算机学院工作至今，现为重庆大学计算机学院副教授，于2018年在澳大利亚昆士兰大学和悉尼科技大学进行访问交流。研究领域包括可重构计算架构及编译优化、图计算硬件加速器和三维场景表示加速器；曾主持和参与了国家自然科学基金、科技创新2030-新一代人工智能、华为高校合作技术合作和CCF-腾讯犀牛鸟基金等多个项目；在DAC、ICCAD、DATE、TCAD、TVLSI等重要国际会议和期刊发表十余篇论文；现为IEEE和中国计算机协会会员；曾获教育部科技成果完成者证书。

