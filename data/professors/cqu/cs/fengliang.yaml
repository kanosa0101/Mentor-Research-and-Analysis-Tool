bio_raw: '个人简介

  Personal Profile

  冯亮为重庆大学“百人计划”引进人才、教授、博士生导师、国家级青年人才、新加坡南洋理工大学博士。先后在南洋理工智能计算实验中心，多平台游戏创新中心，以及新加坡A*Star南洋理工联合复杂系统实验室从事研究工作。研究方向包括（但不局限于）智能计算，大数据挖掘与优化，机器学习，以及多智能体系统等。获得2019
  IEEE Transactions on Evolutionary Computation 杰出论文奖、重庆市科技进步一等奖、中国钢结构协会科学技术特等奖等。担任IEEE
  Transactions on Evolutionary Computation、IEEE Transactions on Emerging Topics in
  Computational Intelligence、IEEE Computational Intelligence Magazine等国际期刊副主编。 IEEE智能计算协会Task
  force on transfer learning and transfer optimization 创办主席

  。

  招生信息：年度招收博士生1名、硕士生3-5名，课题组与国内外知名高校、研究机构及IT企业合作紧密，欢迎计算机、软件、数学及自动化等相关专业同学申请加入课题组。

  招收弘深青年教师（特别资助：37-40万元/年，重点资助：27-30万元/年）'
