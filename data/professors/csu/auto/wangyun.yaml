bio_raw: '个人简介

  中南大学副教授、博士研究生导师、硕士研究生导师

  ，湖南省优青，

  入选2023、2024、2025/2026年全球前2%顶尖科学家榜单（World''s Top 2% Scientists）年度科学影响力排行榜

  。2012年本科毕业于安徽大学经济学院，2015年硕士毕业于兰州大学数学与统计学院，2019年毕业于天津大学智能与计算学部。2017年至2018年于新加坡国立大学Dipti
  Srinivasan教授的Centre for Green Energy Management & Smart Grid (GEMS)实验室联合培养。

  主持1项国家自然科学基金面上项目，1项国家自然科学基金青年项目，

  1项湖南省优秀青年项目，

  1项湖南省自然科学基金青年项目，1项重点实验室开放基金

  ，参与/承担多项国家级科研项目。发表学术论文50余篇（https://scholar.google.com.hk/citations?user=HfLiXM4AAAAJ&hl=en），谷歌引用约4000次，高被引论文3篇，申请发明专利8项，授权发明专利6项。目前担任Renewable
  and Sustainable Energy Reviews, IEEE Transactions on Sustainable Energy, Applied
  Energy, Knowledge-Based Systems, Energy Conversion and Management, Renewable Energy等国际期刊审稿人。

  此外，长期与Dipti Srinivasan教授实验室保持良好的合作关系，有机会可以推荐同学去新加坡国立大学进行交流学习。

  招收：

  硕士生：

  2-3名

  ，进入团队的同学会手把手带，欢迎感兴趣的同学联系我！（团队也比较适合有上博士计划的同学积累科研成果）

  具体的研究方向为：不确定性人工智能（深度学习，机器学习），主要应用领域为

  （1）极端天气预报

  （2）风速/风功率预测（3）光伏

  预测

  （4）电池SOC和SOH估计/预测（5）其他人工智能方向，如故障诊断，环境监测等。

  博士生：1名，要求：人工智能算法，且代码能力强的优先。

