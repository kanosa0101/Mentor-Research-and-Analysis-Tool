bio_raw: '个人简介

  徐德刚，工学博士，博士后，教授，博士生导师，湖南芙蓉学者，湖南科技领军人才。浙江大学信息学院国家工业控制重点实验室控制科学与工程专业获博士学位，参与了浙江大学国家重点实验室和国家工业自动化工程技术研究中心的多项纵横向课题。2010年12月进入中南大学控制科学与工程博士后流动站，2013年以优秀成绩出站。2013年11月-2014年12月，美国佛罗里达大学工程学院电子与信息工程系访问学者。

  湖南省自动化学会常务理事，中国计算机学会智能机器人专委会执行委员，中国自动化学会标准化工作委员会委员，

  中国有色金属学会有色设备学术专委会委员，

  中国自动化学会智慧教育专委会委员，国家科技部重点研发计划评审专家，教育部高等教育学位中心评审专家，湖南省、山东省、北京市等科技奖励评审专家。

  主要研究方向为

  智能机器人、具身智能

  、复杂系统建模与优化控制、机器视觉，嵌入式系统等，作为项目负责人，主持国家重点研究计划2项，国家863高科技计划1项、国家自然科学基金4项、中国博士后科学基金特别资助1项，中国博士后科学面上基金1项，中央高校科研业务基金1项，与企业校企联合技术攻关项目30余项，参与国家自然科学基金4项，开展了工业过程智能制造、工业装备建模与智能化、

  智能决策与智能系统、智能机器人感知与智能控制

  等多项研究方向，在国内外学术期刊发表学术论文110 余篇，申请国际PCT发明专利1项，获得中国发明专利授权36项，获得软件著作权3项。入选中南大学531人才计划和创新驱动计划，获得中国有色金属协会科技进步一等奖、中国产学研合作创新成果一等奖等省部级奖励12项。

  可招生控制科学与工程、电子信息和人工智能等方向研究生。

  网页链接

  http://202.197.61.251/soa/blog.jsp?lg=208010

  邮箱 dgxu@csu.edu.cn'
