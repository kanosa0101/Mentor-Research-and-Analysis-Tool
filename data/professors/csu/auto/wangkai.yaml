bio_raw: '个人简介

  王凯，教授，博士生导师。2014年获浙江大学学士学位，同年于浙江大学免试直接攻博，2017年9月至2018年9月于加拿大英属哥伦比亚大学进行联合培养，2019年6月获浙江大学博士学位，2023年9月破格晋升为教授，入选国家级高层次青年人才、中国科协第七届青年人才托举工程、长沙市杰出创新青年培养计划等，是湖湘青年英才、湖南省自然科学优秀青年基金获得者。

  主持国家自然科学基金、国家科技重大专项课题、国家重点研发计划子课题等，以第一和通讯作者在IEEE汇刊、IFAC会刊等期刊上发表SCI论文60余篇，申请和授权国家发明专利20余项，连续多年入选全球前2%顶尖科学家榜单。研究工作曾获中国有色金属工业科学技术一等奖、中国自动化学会自然科学二等奖、湖南省自然科学二等奖、中国过程系统工程年会优秀论文一等奖，担任多个国际著名期刊审稿人。发表论文

  详见

  王凯的谷歌学术Google Scholar

  或

  王凯的Research Gate

  .

  承担本科生课程《自动控制原理》、《Python程序设计》，研究生课程《现代数字信号处理》、《大数据处理与分析技术》等，担任大学生创新创业项目指导老师，获中国有色金属学会高等教育教学成果特等奖、湖南省专业学位研究生优秀教学案例1项，获评中南大学创新创业项目优秀指导教师、优秀班导师、教学质量优秀奖。指导学生在全国研究生电子设计竞赛、数模竞赛、全国大学生创新创业年会等多次获奖。

  研究方向

  ：制造数据智能解析与优化控制，包括领域大模型与智能体、机器学习与深度学习、时序模型与异常监测、强化学习与智能控制等

  实验室长期招收博士、硕士研究生以及部分学有余力的本科生，欢迎有意向从事相关研究工作的同学加入课题组。

  联系邮箱：kaiwang@csu.edu.cn'
