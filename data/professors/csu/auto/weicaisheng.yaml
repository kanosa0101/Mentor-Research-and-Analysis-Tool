bio_raw: '个人简介

  魏才盛，江苏徐州人，特聘教授，博士生导师，入选湖南省杰青、

  中国科协青托、

  中南大学创新驱动等人才计划以及斯坦福全球前2%顶尖科学家（2021-2025连续5年，航空航天领域），获湖南省科技进步二等奖(排1）、

  陕西省技术发明一等奖

  (排5）

  、

  陕西省

  高等学校科

  学技术奖一等奖

  (排5）

  与中国发明协会发明创新奖二等奖

  (排1）、

  比亚迪科研奖教金

  各1项

  。目前任中国自动化学会全驱系统理论与应用专业委员会委员、中国指挥与控制学会集群智能与协同控制专业委员会委员。研究领域包括：（1）航天动力学与智能控制；（2）飞行器/机器人任务规划与决策技术；（3）飞行系统状态智能感知技术；（4）数据驱动视景仿真技术。

  截止到目前，在IEEE TCY、IEEE TAES、IEEE TCST、JGCD、航空学报、宇航学报等动力学与控制领域国内外权威期刊发表论文80余篇，授权国家发明专利20余项，由Springer
  Nature与国防工业出版社出版学术专著2部。主持和参与了国家自然基金重大项目、国家重点研发计划课题任务、 国家自然科学面上/青年基金、装备预研基金、湖南省自然科学基金以及航天院所科研委托项目等多项。

  博士招生专业：控制、力学、机械等博士生 1-2 名/年（方向团队）

  硕士招生专业：控制、力学、航天工程、机械、计算机等硕士生3名/年

  。

  欢迎特别优秀、学习能力强的大二、大三本科生联系我，参与我与团队的科研工作。

  有意推免/报考2027年研究生（直博、申请考核博士、硕士），其中热衷于算法、软硬件开发优先，

  欢迎提前联系。

  电子邮箱：

  caisheng_wei@csu.edu.cn

  工作地址：中南大学本部升华后楼313#

  Scholar homepage:

  ①

  https://www.researchgate.net/profile/Caisheng-Wei

  ②

  https://scholar.google.com/citations?user=M9g5jMEAAAAJ&hl=zh-CN&oi=sra'
