bio_raw: '个人简介

  李勇刚，男，1974年生，教授，博士生导师，教育部新世纪优秀人才。2004年毕业于中南大学获工学博士学位。2011年至2012年作为访问学者在澳大利亚科廷大学合作研究。

  研究方向包括：复杂过程建模与控制、智能制造、工业大数据、机器学习、数字孪生等。

  作为负责人主持国家自然科学基金重大项目课题、区域创新发展联合基金重点项目和面上项目、科技部重点研发计划项目课题、工信部工业互联网创新发展工程及校企合作项目10余项。

  获国家技术发明二等奖1项、省部级科技进步一等奖4项、二等奖2项。申请发明专利50余项，授权30余项。

  研究成果以第1作者或通讯作者在IEEE系列期刊、《Journal of Process Control》、《Control Engineering Practice》、《Systems
  & Control Letters》、《自动化学报》、《控制理论与应用》等国内外刊物与会议上发表学术论文60余篇，SCI、EI收录50余篇。

  联系方式：中南大学自动化学院，民主楼308，410083，E-mail：

  liyonggang@csu.edu.cn'
