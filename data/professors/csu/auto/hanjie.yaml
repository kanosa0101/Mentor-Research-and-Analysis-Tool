bio_raw: '个人简介

  韩洁，副教授，博士生导师。2014年本科毕业于中南大学自动化专业，同年推荐面试中南大学控制科学与工程专业硕博连读生。2018年获得国家公派奖学金赴澳大利亚阿德莱德大学联合培养两年，期间获欧洲创新与技术研究所RawMaterials项目资助，赴芬兰阿尔托大学参加短期博士课程。2020年6月获得中南大学控制科学与工程专业博士学位，同年8月加入中南大学自动化学院工作，2023年9月晋升副教授。获中国自动化学会、中国有色金属学会优秀博士学位论文奖，入选中国科协第九届青年人才托举工程。主要研究方向包括：复杂工业过程智能建模与优化方法、工业大模型与智能决策方法等。先后承担国家自然科学基金青年基金项目、面上项目各1项，湖南省自然科学基金青年基金项目1项，作为课题/子课题负责人承担科技部重点研发计划青年科学家项目1项、国家科技重大专项2项，以第一和通讯作者在IEEE汇刊、IFAC会刊等期刊上发表SCI论文30余篇，申请和授权国家发明专利10余项。研究工作曾获全国智能优化学术会议优秀青年论文奖、中国自动化学会青年学术年会优秀理论与应用论文奖，担任多个国际著名期刊审稿人。

  邮箱：hanjie@csu.edu.cn

  地址：中南大学校本部升华后楼514室

  【教学与课程】

  承担本科生课程《检测技术与仪表》、《过程控制仪表》、《过程控制系统》，承担湖南省教改项目1项，中南大学教改项目2项。

  【招生情况】

  实验室招收博士和硕士研究生，及部分学有余力的优秀本科生，欢迎有意向从事相关研究工作的同学加入课题组，联系邮箱：

  hanjie@csu.edu.cn

  【科研项目】

  国家科技重大专项，多元素***制造系统演技及示范工程，2026.3-2029.2，子课题负责人

  国家科技重大专项，钢铁生产***计划排程与协同优化软件研发及工程验证，2025.7-2029.12，子课题负责人

  国家自然科学基金面上项目，有色冶金换热过程慢时变特性分析与能效协同优化方法，2025.1-2028.12，项目负责人

  国家自然科学基金青年项目，氧化铝多效逆流蒸发过程负荷优化分配与协调控制，2022.1-2024.12，项目负责人

  科技部重点研发计划青年科学家项目，工业智能软件敏捷开发理论与方法，2021.10-2024.10，课题负责人

  湖南省自然科学基金青年项目，具有模糊不确定参数的有色冶金过程鲁棒优化方法研究，2021.1-2023.12，项目负责人

