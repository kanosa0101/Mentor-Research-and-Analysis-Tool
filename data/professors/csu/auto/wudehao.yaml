bio_raw: '个人简介

  吴德浩，中南大学副教授，博士生导师，江西赣州人。2016年本科毕业于北京科技大学自动化专业，同年免试进入清华大学自动化系直接攻博；2022年1月获得清华大学工学博士学位，并进入中南大学自动化学院任教。曾获北京市优秀毕业生、清华大学优秀博士学位论文奖、中南大学优秀班导师等荣誉。入选中国科协青年人才托举工程，获得湖南省优秀青年科学基金项目，是全国高校黄大年式教师团队、工业智能与系统教育部重点实验室骨干成员。

  【学术研究】

  主要研究方向包括：（1）机器学习与工业大数据解析；（2）复杂工业过程监测与智能制造；（3）人工智能驱动的系统建模与先进控制

  。在IEEE Trans. Industrial Informatics、IEEE Trans. Neural Networks and Learning Systems、IEEE
  Trans. Industrial Electronics、IEEE Trans. Control Systems Technology等国际权威期刊上发表高水平论文20余篇，授权国家发明专利10余项。主持国家自然科学基金面上项目/青年科学基金项目、国家重点研发计划项目子课题、工信部工业大模型重大专项子课题、湖南省优秀青年科学基金项目等国家级/省部级项目，作为技术骨干参与国家自然科学基金重大项目/重大研究计划项目、国家重点研发计划项目等。

  【教学与竞赛】

  主讲本科生专业核心课程《人工智能》《数字图像采集与处理》。担任大学生创新创业项目指导老师；获得中南大学优秀班导师荣誉称号。指导学生在全国大学生计算机设计大赛、全国研究生数学建模竞赛、湖南省研究生人工智能创新大赛中获奖。

  【学术兼职】

  担任《Journal of Central South University》《中国有色金属学报》等期刊青年编委，以及IEEE Trans. Industrial
  Informatics、IEEE Trans. Control Systems Technology、IEEE/CAA Journal of Automatica
  Sinica等期刊审稿人。兼任中国自动化学会青年工作委员会委员、中国自动化学会技术过程的故障诊断与安全性专委会委员、中国人工智能学会智能融合专业委员会委员等。

  【招生情况】

  每年有3名左右硕士/博士研究生招生指标，以及6名本科生毕业设计指导指标，欢迎数理基础扎实、对学术研究感兴趣的学生来信交流。

  同时，欢迎本科生进入实验室开展科研训练，可推荐优秀学生到国内外高校继续深造。

  联系方式：wudehao@csu.edu.cn

  通信地址：中南大学岳麓山校区（校本部）民主楼216室

