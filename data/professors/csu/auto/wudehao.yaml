  【科研项目】

  [1] 国家自然科学基金面上项目，锌冶炼焙烧炉动态耦合反应气氛调控与控制性能监测方法研究

  [2] 国家自然科学基金青年科学基金项目，有色冶金焙烧炉异常工况智能监测与自愈控制方法研究

  [3] 国家重点研发计划项目子课题，有色金属生产过程多相多场先进工艺控制与优化软件

  [4] 工信部工业大模型重大专项子课题，面向生产制造环节的生成决策工业大模型

  [5] 中国五矿集团国家技术策源地科技专项，有色冶金数字化标准体系及前沿技术

  [6] 华为技术有限公司校企合作重点项目，基于业务感知的节能优化算法技术研究'
