bio_raw: '个人简介

  王璐珩，教授、博士生导师、升华学者、国家级高层次领军人才。现在中南大学自动化学院从事检测领域的教学和科研工作，长期致力于

  “

  传感器理论与技术

  ”

  研究，主攻方向包括：“多传感功能测量系统”、“柔性传感材料与器件”和“电子皮肤与机器触觉”，在测量机理与应用方面取得了一系列国际领先的原创性成果。近年来，主持国家级重大/重点科研项目，在“

  IEEE Trans. Instrum. Measur.

  ”、

  “

  Measurement

  ”、“

  Sens. Actuat. A-Phys.

  ”、“

  Sens. Actuat. B-Chem.

  ”、

  “

  IEEE Sens. J.

  ”、

  “

  IEEE Sens. Lett.

  ”、

  “

  Chem. Eng. J.

  ”、

  “

  Carbon

  ”

  、“

  IEEE-ASME Trans. Mecharonics

  ”、“

  IEEE J. Microelectromech. Syst.

  ”、“

  IEEE Trans. Electron Dev.

  ”、“

  IEEE Electron Dev. Lett.

  ”和“

  IEEE Trans. Ind. Electron.

  ”等传感测量、微机电、电子器件和自动化领域的国际权威期刊上发表了系列学术论文，

  获得40余项发明专利授权，

  为多敏感功能本征柔性传感器系统研究奠定了理论与技术基础，并在工程实践方面解决了传感测量领域的多项科技难题。

  “传感器实验室”情况：实验室宽容失败、笃行务实、氛围宽松、配备了国际上最先进的仪器设备群，为每一位能够全身心投入科研工作的研究人员提供了优异的软件与硬件条件。实验室研究工作的核心学术思想具有世界首创性，相关成果的理论意义和工程价值都处于国际引领地位。

  实验室不给研究人员施加“发表文章”等各种指标性压力，尽最大可能确保每位研究人员能够在宽松自由的环境中把宝贵的时间精力有效地用于科学探索本身。

  招生：实验室招收博士与硕士研究生，相关专业包括

  “

  控制科学与工程

  -

  检测技术与自动化装置

  ”

  、

  “

  仪器科学与技术

  ”

  ，同时也欢迎材料、物理、化工或机电等其它相关专业的同学报考。

  招聘：实验室招收博士后和青年教师，欢迎有志于从事“多传感功能测量系统”、“柔性传感材料与器件”和“电子皮肤与机器触觉”等领域研究的具有传感测量、微电子、机械、应用物理、材料和化工等学科背景的研究者加入课题组。此外，实验室长期招聘研究助理，协助完成实验室的日常管理工作并参与课题研究。

  对以上招生招聘有意者可通过邮件提交个人简历以及能够证明个人知识、能力、水平和业绩的相关资料，联系方式：

  wangluheng@csu.edu.cn

  或

  1354829299@qq.com

  对实验室人员的要求：

  对科研工作能够做到“全身心投入”

  。

  选择在本实验室开展本科毕业设计的同学们请注意：本实验室的课题工作涉及到

  大量的动手实验

  ，“

  对科研工作

  全身心投入

  ”是对每位毕设同学的

  最基本要求

  ，特别适合于有志在传感器领域

  继续攻读硕士和博士学位

  的同学。'
