bio_raw: '个人简介

  姜曹洋，1988年生，先后在美国密歇根理工大学获得学士与博士学位。2015至2025年间在美国 HypeVR 担任高级工程师及首席技术官（CTO），2026年全职加入中南大学任特聘教授。长期从事高性能视频压缩、三维实景视频重建与流媒体传输技术研究。针对新型多媒体需求，成功开发了基于双目视觉与多视角的毫米级、实时动态三维重建系统与算法，实现物体的动态三维“瞬时传送”。核心技术被
  Qualcomm（高通）、Intel（英特尔）、Amazon（亚马逊） 等企业采用，并曾在 CES 展会上与 Intel 时任总裁联合发布“可漫游视频”项目，获得国内外多家媒体报道，包括
  福布斯、搜狐。带领团队累计获得战略融资超过1000万美元，高质量体积视频流媒体压缩技术被纳入 Intel 白皮书。在三维视频压缩与重建领域，已授权和申请美国发明专利7项、国家专利1项。2024年获得国家自然科学基金优秀青年科学基金（海外）资助。在多媒体与分布式计算领域发表论文8篇，其中包括中科院一区TOP期刊论文2篇及数据压缩、电路系统领域重要会议论文5篇（DCC、ISCAS、ICIP等），目前担任
  IEEE TCSVT 审稿人。

  研究兴趣:

  动态三维重建、静态三维重建、三维数据压缩与传输、可微渲染。

  招收博士、硕士生，有意者可发邮件联系。'
