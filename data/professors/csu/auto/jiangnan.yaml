title: 讲师
bio_raw: '个人简介

  姜南，男，工学博士，中南大学自动化学院讲师，硕士研究生导师。

  本科、硕士阶段就读于电子科技大学-信息与通信工程学院-相控阵雷达与自适应处理团队，并赴英国莱斯特大学（University of Leicester）联合培养，导师李会勇教授。博士阶段

  就读于

  国防科技大学-电子科学学院-战场监视与先进成像团队，导师黄晓涛教授。

  近年来，主持JKW-173-JCJQ-**

  *

  领域基金项目、JKW**

  *

  重大专项子课题、国家自然科学基金青年基金C类、自动目标识别全国重点实验室基金项目等国家级科研项目

  多项

  。

  近五年在国内外学术期刊与会议上发表论文30余篇，其中以第一/通讯作者在IEEE Transactions on Geoscience and Remote Sensing（TGRS）、IEEE
  Journal of Selected Topics in Applied Earth Observations and Remote Sensing（JSTARS）等本领域优秀期刊发表论文10余篇，入选ESI
  1%高被引论文2篇。获授权国家发明专利10余项。现任《现代雷达》青年编委，兼任多个国际学术期刊审稿人，多次担任国际学术会议分会场主席并作邀请报告。

  主要研究方向：合成孔径雷达（Synthetic Aperture Radar, SAR）成像，新体制雷达技术与系统等。

  课题组项目经费充足，氛围融洽，每年可招收硕士研究生1-3名，团队内可招收博士

  研究生

  1-2名，欢迎报考！'
