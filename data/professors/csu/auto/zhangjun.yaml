title: 特聘研究员
supervisor: 博导、硕导
bio_raw: '个人简介

  2004年3月获日本东北大学机械智能工学博士；2004年4月至2011年2月在日本富士通公司任职，曾任三维图形处理器芯片研发部门Project Leader，参与过的芯片产品有Carmine、Ruby、Emerald等三维图形处理芯片；2011年3月进入中南大学工作，任特聘研究员，硕士及博士生导师。先后主持国家自然科学基金委面上项目2项、湖南省科技项目2项，航天集团项目4项。研究方向为视频编解码芯片、运动控制芯片、人工智能芯片、三维图形处理器芯片、RISC-V微处理器芯片等，在芯片及FPGA设计领域拥有超过20年的丰富经验。'
