bio_raw: '个人简介

  薛晓鹏，副教授，博士生导师，中南大学-北京空间机电研究所-香港理工大学智能柔性减速与飞行控制联合研究中心副主任，中国宇航学会返回与再入专业委员会委员，

  《

  Space: Science & Technology

  》

  （中科院1区Top期刊）编委、《航空学报》“柔性气动减速技术”专栏执行主编、

  《

  航天返回与遥感》编委。长期从事深空探测航天器气动减速技术、流动智能控制、智能感知与控制等相关领域研究。近年主持了国家自然科学基金面上项目等2项，湖南省自然科学基金面上项目等2项、其他横向项目等4项目。近五年已在国内外权威学术期刊和会议发表论文40余篇，其中包括Progress
  in aerospace sciences（航空航天领域Top1期刊）、AIAA Journal、Chinese Journal of Aeronautics等国际权威期刊，授权国家发明专利4项，参与出版研究生教材1部。受邀担任为AIAA
  Journal、Chinese Journal of Aeronautics等学术期刊审稿人。荣获2022年度中国航天科技集团十大技术突破奖（相当于科学技术一等奖），荣获2022、2025年《Space：Science
  & Technology》、《航天返回与遥感》优秀编委，2024年《

  Space: Science & Technology

  》、

  《航空学报》优秀审稿专家，荣获2021年中南大学高等教育教学成果二等奖，指导本科生荣获全国高校航空航天类毕业设计大赛特等奖、二等奖等奖项。

  硕士/博士研究生招生专业方向：人工智能、控制科学与工程、航空航天工程、力学等相关专业，

  1-3人/年

  。'
