bio_raw: '个人简介

  周灿，中南大学自动化学院教授，博士生导师，入选国家高层次青年人才

  研究方向包括：工业过程智能感知、模式识别与机器学习、多源异数据表征与融合、智能制造

  主持国家重点研发计划政府间国际创新合作专项，国家自然科学基金重大研究计划培育类项目、面上项目，湖南省杰出青年基金等国家级/省部级项目10项，发表SCI论文70余篇，授权发明专利20余项。

  先后获江西省科技进步一等奖1项、湖南省技术发明二等奖1项，中国有色金属工业科学技术一等奖2项，具体如下：

  1.

  高纯阴极铜电解智能化关键技术与应用，中国有色金属工业科学技术一等奖，2023年，排1；

  2.

  面向新型信息器件封装的复杂空间曲面精密点胶关键技术及应用，湖南省技术发明二等奖，2022年，排1；

  3.

  铜冶炼物质流协同优化与智能监控关键技术及应用，江西省科学技术进步一等奖，2022年，排5.

  ResearchGate

  :

  https://www.researchgate.net/profile/Can-Zhou-3

  Can Zhou | ResearchGate'
