bio_raw: '个人简介

  谢永芳，男，博士，中南大学二级教授、博士生导师，

  国家杰出青年基金获得者

  ，IEEE高级会员。1993、1996、1999年在中南大学信息科学与工程学院分别获工学学士、硕士、博士学位；2003年6月作为引进人才，在中南大学信息科学与工程学院工作，被聘为副教授，2008年被聘为教授，
  2007年入选教育部“新世纪优秀人才支持计划”和湖南省高校青年骨干教师培养对象，2017年获国家自然科学基金委杰出青年基金项目资助。曾为《自动化学报》《控制工程》编委，兼任中国自动化学会环境感知与保护自动化专业委员会副主任、中国自动化学会过程控制专委会常务委员、中国指挥与控制学会智能控制与系统专业委员会常务委员、国家自然科学基金创新研究群体“复杂有色冶金过程控制理论、技术与应用”的骨干成员。

  长期从事工业人工智能方法及应用技术研究，先后主持国家自然科学基金委

  杰出青年科学基金项目、

  人工智能应急管理项目、重点项目、国家科技支撑计划、国家重点研发计划课题、863计划、国家高技术产业化示范工程、高校博士点基金及重大厂校横向合作项目等 23项，研究成果应用效果显著，先后

  获国家科技进步二等奖1项，省部级和行业协会一等奖6项、二等奖5项。在IEEE汇刊、IFAC会刊等期刊发表SCI 收录论文180篇，出版学术专著5部，授权国家发明专利36项。

  指导2名博士研究生获

  中国自动化学会优秀博士学位论文奖

  、2名获

  湖南优秀博士学位论文奖

  、1名获

  湖南省优秀硕士论文奖

  ，多名研究生获国家奖学金、校长奖学金、校级奖学金等奖励。

  每年招收博士后1名、博士研究生1名、硕士研究生3名，

  研究课题方向：

  工业

  人工智能方法及应用，工业大模型，机器视觉与感知，

  深度学习（图神经网络、知识图谱、深度卷积网络）

  等。有意向请联系，QQ：82420314，邮箱：yfxie@csu.edu.cn。

  读研、读博有疑惑，论文写不出来，创新点不知道如何找：

  【我和优博有个约会】中南大学谢世文副教授：科学研究与工程项目的融合——我的博士科研感悟_哔哩哔哩_bilibili

  课题组优势：

  1. 研究方向属于前沿技术，研究方向不愁；

  2. 课题组氛围好，杰青课题组，属于院士团队，学业不愁；

  3. 多位毕业生在华为、阿里、讯飞等大型企业（可内推），就业不愁；

  4. 与国内外多所高校合作紧密，深造不愁；

  指导研究生发表学术成果：

  近3年指导博士研究生发表IEEE汇刊论文30余篇、IFAC旗舰期刊论文20余篇，指导硕士研究生发表SCI/EI论文20余篇，一硕士研究生获2023YAC最佳应用

  论文奖，获国际会议IAI最佳论文奖，获

  博士生/硕士生国家奖学金、校长奖学金20人次

  。带领研究生到湖北宜昌、福建厦门、重庆、云南昆明、新疆乌鲁木

  齐、黑龙江哈尔滨、安徽合肥等地参加学术会议。

