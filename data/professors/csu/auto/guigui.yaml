bio_raw: '个人简介

  桂瑰，中南大学自动化学院特聘教授。 英国Essex大学获计算机博士学位。入选国家海外高层次人才和湖南省

  芙蓉计划高层次人才

  。

  2002年毕业于中南大学，获计算机科学与技术专业学士学位和

  硕士学位。2007年在

  英国Essex

  大学

  获计算机博士学位。多年在

  国际知名交通规划公司

  担任技术模型部门总监，主要从事智能交通系统，大数据交通模型以及土地经济模型。

  现任英国高速公路技术规划协会委员

  ,

  英国物流运输学会学术委员会高级委员。

  长期从事智能交通系统和大数据建模研究。主持了英国和国际大数据项目２５个，

  总项目金额超过

  1000

  万英镑。参与了英国国家高速公路网络战略模型研究，完成了省级和国家级高速公路网络和智能交通系统软件平台。与伦敦市交通管理部门

  保持长期合作关系。领导建立了伦敦最大的一个交通仿真模型，帮助论证伦敦市中心未来交通管理和设计方案。负责建立英国交通部

  的大数据交通预测模型，预测未来５０年英国轻型货车流量。

  领导和英国剑桥大学的合作项目

  ,

  首创将多维时间序列模型应用于建立基于人工智能经济模型和基于大数据的预测模型。受卡塔尔交通部邀请，完成了多哈土地使用大数据模型和交通预测模型的研发。具有丰富的产学研结合经验

  ,

  曾主持英国商务部技术转化项目

  ,

  实现项目商业化金额

  50

  万英镑。在国际重要会议、学术期刊和书籍章节中发表

  12

  篇专业论文

  ,

  重要期刊

  3

  篇

  ,

  主要研究方向：智能交通系统、人工智能，基于大数据的交通和经济模型。

  招收具有计算机，数学，自动化，交通工程背景的硕士生和博士生。 优先考虑有编程经验，良好数学基础以及独立解决问题能力的学生。 有意者可email联系我。

  email：guigui@csu.edu.cn

  Main Journal Publication

  1.     桂瑰，陈松桥：一种基于Agent技术的JAVABEAN构件搜索方法《计算技术与自动化》 2002年第21卷第3期, 页码27-32。

  2.     Gui Gui, Paul D. Scott: “Ranking Reusability of Software Components Using
  Coupling Metrics”, Elsevier Journal of Systems and Software, June, 2006。

  3.     Gui Gui, Paul D. Scott: “Measuring Software Component Reusability by Coupling
  and Cohesion Metrics” Academy Publisher JOURNAL OF COMPUTERS (JCP) Issue 7 of 2009

  4.     Peng Lin, Yu Tian, Gui Gui, Chunhua Yang: “

  Cooperative control for multiple train systems: Self-adjusting zones, collision
  avoidance and constraints

  ”

  Automatica

  volume 144， October  2022'
