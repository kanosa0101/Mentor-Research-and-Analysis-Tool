bio_raw: 张航，男，1966年4月生，工科博士，教授。现为中南大学自动化院博士生导师。 1988年至1998年在化工部乳胶工业研究所设备研究室从事自动控制以及仪器设备的研制工作，并担任设备研究室主任，1995年，主持化工部部控项目，并获株洲市科技进步三等奖，1998年至2001年在中南大学信息科学与工程学院攻读交通信息工程及控制专业硕士学位，并担任校研究生会副主席，参与国家863/长沙自来水CIMS应用示范工程，完成了长沙市自来水八水厂、一水厂的集散控制系统设计、施工和调试，并通过国家科技部的验收，成果获建设部华夏科技二等奖。2001年毕业后留校任教至今，主讲《自动控制原理》、《最优控制》、《传感器原理及应用》等多门专业课程，参加水厂集散控制系统、基于地理信息技术的城市环境保护管理信息系统等多项纵横向项目。2003年晋升副教授，并担任硕士研究生导师，出版著作《微处理器与现场总线近年来，在《电子学报》、《中国图象图形学报》、《控制理论与应用》、《信息与控制》、《系统工程与电子技术》、《计算机工程与应用》等知名刊物以及国际学术会议发表论文二十多篇，EI及ISTP检索多篇。
  学历：于1988年6月、2001年5月、2006年4月分别在南京化工学院自动化专业、中南大学交通信息工程及控制专业、中南大学交通信息工程及控制专业学士、硕士以及博士学位。
  研究工作：1）高速铁路轨道快速检测技术；2）轨道检测大数据挖掘技术；3）多源轨道检测数据融合处理技术。
