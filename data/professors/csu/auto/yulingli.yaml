bio_raw: '个人简介

  余伶俐，中南大学自动化学院教授，人工智能系副主任，博士生导师，中国自动化学会专家库专家，国家级

  “

  智能科学系列课程

  ”

  教学团队成员，长期从事具身智能、智能驾驶、机器人导航的研究。主持了国家自然科学基金面上

  /

  青年

  项目、国家重点研发计划子任务、湖南省科技重大专项子课题、

  湖南省自然科学基金

  面上

  /

  青年等项目，

  参与了湖南省智能农机装备创新研发项目。承担了中车时代电动汽车

  “

  智能驾驶决策与控制系统

  ”

  开发，获批湖南省第一张智能驾驶客车牌照，其成果转化使智能客车在巴黎继续开跑。在

  “Transportation Research Part C”, “IEEE TVT”, “IEEE TIM”

  ，

  “Neurocomputing”,

  《电子学报》与《控制理论与应用》等国内外刊物上

  发表第一

  /

  通讯作者

  SCI

  论文

  20

  余篇，

  授权国家发明专利

  35

  项，获批软件著作权

  14

  项，编著专著

  /

  教材

  5

  部，曾获

  IEEE CYBER

  等会议优秀论文奖。在教学方面，为

  教育部“智能控制”精品资源共享课程主讲教师之一，配套编教材入选“十四五”国家级规划教材。参与了智能基座课程合作，获省级教学竞赛一等奖、湖南省“互联网+” 大学生创新创业大赛优秀教师、全国智能设计大赛优秀指导教师,
  中南大学“十佳课件”。指导研究生获得湖南省优秀硕士学位论文，指导本科生在伦敦参加了全球重大挑战论坛竞赛，获省“互联网+”大学生创新创业大赛一等奖、湖南省程序设计大赛获一等奖、“华为杯”智能设计大赛获专项奖、一等奖。

  邮箱：llyu@csu.edu.cn

  办公地点：湖南长沙岳麓区中南大学校本部升华后楼211

  招生专业：控制科学与工程、电子信息、智能科学与技术'
