title: 副教授
supervisor: 硕导
bio_raw: '个人简介

  中南大学航空航天学院副教授，硕士生导师。

  长期从事多传感器信息融合、室内导航技术、飞机起落架系统性能检测和安全认证等领域科研与产业化工作，在无人车导航与控制、信号检测与处理等方面积累了丰富的科研经验。

  主持和参与完成863计划、国家重点研发计划项目、科技创新驱动、湖南省自然科学基金、各类科技计划项目、外协项目等近30项；在《IEEE SENSORS JOURNAL》、

  《SENSORS 》、

  《中南大学学报》等期刊上发表论文20余篇；专利3项。'
