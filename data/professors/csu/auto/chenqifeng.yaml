bio_raw: '个人简介

  陈琪锋，男，1976年生，河南荥阳人，博士，教授，博士生导师。主要从事飞行器集群智能协同规划与控制研究。作为项目负责人主持国家自然科学基金项目3项、国家863项目4项、其它国家级科研项目7项。获发明专利授权14项，发表学术论文60余篇，出版教材1部、学术专著1部。任中国指挥与控制学会集群智能与协同控制专业委员会委员、中国指挥与控制学会空天防务体系工程专业委员会委员、中国指挥与控制学会空天安全平行系统专业委员会委员、中国自动化学会平行控制与管理专业委员会委员、中国仿真学会仿真技术应用专业委员会委员、中国计算机仿真用户协会仿真应用分会理事、湖南省宇航学会理事。'
