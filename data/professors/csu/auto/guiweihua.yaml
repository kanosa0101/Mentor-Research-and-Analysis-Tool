bio_raw: '个人简介

  桂卫华，中国工程院院士、教授、博士生导师、全国优秀教师，全国优秀科技工作者。1975年毕业于中南矿冶学院工业企业电气化及自动化专业，1981年获得中南矿冶学院工业自动化专业硕士学位，1986年赴德国Duisburg大学自动控制专业做访问学者两年，曾任中南大学信息科学与工程学院院长，现任中南大学控制工程研究所所长、有色冶金自动化教育部工程研究中心主任、中国自动化学会特聘顾问、湖南省自动化学会名誉理事长。

  长期致力于流程工业生产过程控制理论、技术和工程应用的研究，围绕流程工业企业信息化和智能制造的技术问题，创建了以智能集成为核心的复杂有色冶金过程建模、控制与优化的理论与方法。成果主要应用在有色金属行业的多家大型企业，获得显著的经济效益和社会效益，为我国流程工业的快速发展、特别是自动化技术的提升和自主创新作出了重要贡献。其研究成果获国家科技进步二等奖3项、国家技术发明二等奖1项，省部级科技奖励18项，发表学术论文400余篇，EI、SCI收录250余篇；获“何梁何利基金科学与技术进步奖”、“湖南光召科技奖”、
  “中国过程控制终身成就奖”、“中国过程控制技术贡献奖”、“杨嘉墀科技奖”等荣誉称号；出版专著5部等。执教三十余年，获得“全国教书育人楷模”、“全国模范教师”、
  “全国优秀教师”、“全国优秀科技工作者”、 “全国有色金属行业劳动模范”、“中国有色金属工业优秀科技工作者”等荣誉称号。

  作为学术带头人，带领科研团队于2013年成为国家自然科学基金创新研究群体，2016年创新群体以整体优秀结题并获得国家自然科学基金委滚动支持。'
