  https://scholar.google.com/citations?user=kF70U3oAAAAJ&hl=zh-CN

  ResearchGate主页:

  https://www.researchgate.net/profile/Zhang_Junchao2

  已发表论文的Code下载链接：

  https://github.com/Junchao2018

  联系方式：

  邮箱/E-mail

  ：junchaozhang(AT)csu(dot)edu(dot)cn

  电话/Tel：

  +86-13032468630'
