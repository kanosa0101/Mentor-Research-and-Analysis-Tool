bio_raw: '个人简介

  张俊超，男，河南周口人，工学博士，副教授，硕/博士生导师，

  国家一流课程负责人

  ，芙蓉计划高校学术拔尖人才（原芙蓉青年学者），

  湖南省普通高校青年骨干教师，

  中南大学

  “

  青年岗位能手

  ”

  ，

  中南大学课程思政

  “

  示范教师

  ”

  。

  美国光学学会高级会员（Optica Senior Member）、

  中国光学工程学会成像与探测技术专业委员会委员、

  中国光学工程学会计算成像专业委员会青年委员、

  中国自动化学会青工委委员

  、国际光学学会会员(SPIE Member)，《红外与激光工程》、《激光与光电子学进展》、《应用光学》、PhotoniX Life等期刊青年编委，Applied
  Optics期刊Topical Editor。博士期间

  国家CSC公派访学美国亚利桑那大学（美国三大光学中心之一）。

  教学方面：

  承担本科生专业课《数字图像处理》、《计算机视觉》和《模式识别与人工智能》等教学任务，

  《数字图像处理》课程入选国家级一流本科课程

  ，

  主持教育部和省级等教学改革项目4项，发表教改论文3篇，主编教材2部，曾获

  第六届全国高校电子信息类专业

  青教赛一等奖

  、

  第三届、第四届和第六届湖南省普通高校教师教学创新大赛一等奖

  、

  中南大学课堂教学

  “三十佳”

  、中南大学课程思政教学

  “三十佳”

  等荣誉15余项。

  主编《数字图像处理（Matlab版）》教材入选教育部高等学校电子信息类专业教学指导委员会规划教材

  。

  获

  中国电子学会教学成果二等奖

  （排1/9）

  、

  中国仿真学会教学成果二等奖

  （

  排1/6

  ）

  。

  科研方面：

  主要研究方向为光电信息处理、图像处理、模式识别和机器学习，在IEEE TIP、ECCV、NeurIPS、AAAI、

  Information Fusion、Pattern Recognition等期刊和会议

  发表论文70余篇，

  入选斯坦福全球前2%顶尖科学家榜单（Optics领域，连续三年）

  。主持国家自然科学基金、国家重点研发计划子课题、湖南省自然科学基金和重点实验室基金等项目多项。

  获湖南省自然科学优秀学术论文二等奖

  （排1/3）、

  中国光学工程学会自然科学二等奖

  （排2/5）、

  中国发明协

  会发明创业奖-创新奖二等奖

  （排1/6）

  。

  学生培养方面：

  硕士生罗毅东

  获得国家奖学金、中国激光杂志社青衿奖提名奖、中南大学优秀毕业生等多项荣誉和奖励

  硕士生Mim获中南大学2026届优秀国际毕业生

  本科生陈知颖、刘颖、卢海威、王晨玮、杨宇恒5人毕业论文入选《中南大学优秀毕业论文集》

  指导本科生杨飞帆、胡跃坤、黄俊彬、袁邦哲申请发明专利和发表高水平学术论文多篇

  指导本科生获得中国机器人及人工智能大赛一等奖、二等奖等学科竞赛近10项

  硕、博士研究生招生专业方向：人工智能、自动化、计算机、电子信息、光学工程等相关专业，

  1-3人/年

  。

  研究生招生专业：控制科学与工程、电子信息（专硕）、智能科学与技术

  ******欢迎广大学子报考中南大学自动化学院，从事光电信息处理和机器学习方面的研究。******

  毕业生去向：

  ·罗毅东（2022级硕士）：浙江大学博士（西湖大学联合培养）

  ·Mim（2023级硕士）：中南大学博士（CSC全额奖学金）

  ·Mortuza（2023级硕士）：深圳大学博士（荔园国际一等奖学金）

  ·乔成平（2023级硕士）：深圳市新凯来技术有限公司（视觉算法工程师）

  ·付胜（2023级硕士）：杭州海康威视数字技术股份有限公司（图像算法工程师）

  ·金佳堃（2023级硕士）：杭州海康威视数字技术股份有限公司（图像算法工程师）

  ·伍彩云（2024级硕士）：杭州海康威视数字技术股份有限公司（实习，2027年毕业）

  ·刘颖（2024级硕士）：联想集团（实习，2027年毕业）

