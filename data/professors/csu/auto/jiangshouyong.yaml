bio_raw: '个人简介

  姜守勇，男，中南大学自动化学院教授，博导，国家高层次青年人才。

  本科计算数学、硕士控制理论与控制工程、博士计算机科学、博士后计算生物学方向。先后在英国纽卡斯尔大学（2017-2019）、英国林肯大学（2019-2021）、英国阿伯丁大学（2021-2023）从事科研与教学。西班牙国家研究理事会Misión
  Biológica de Galicia、苏黎世联邦理工学院副研究员/访问学者。曾获国家留学基金委优秀留学生（2016）、 IEEE计算智能学会全球杰出博士论文(2021，每年一人)、英国青年科学家New
  Investigator Award（2022）、小米青年学者（2024）等。国家自然科学基金重大项目子课题负责人，主持国家自科基金面上项目、湖南省自科基金面上项目，主持/承担英国政府、企业和欧盟区域联合项目10余项，发表高水平论文近50篇。英国高等教育协会会士，担任英国EPSRC、BBSRC、UKRI"未来之星"等科研基金同行评议资深评审专家，法国、奥地利等国项目评审专家，全球大学生奖（Global
  Undergraduate Awards）评审专家。担任CAAI Transactions on Information Technology副编，iMeta、CAAI
  Artificial Intelligence Research青年编委，30+国际期刊审稿人，10+国际会议程序委员会成员，会议竞赛、分会议等组织者。

  研究兴趣以建模与优化为主，包括但不限于：

  计算智能：智能优化、多智能体协同与博弈

  机器学习：数据与知识建模技术、强化学习、生成式优化、大模型应用

  数字孪生：数字建模、计算机仿真、数据分析与决策

  计算生物：基因组尺度网络建模、

  系统生物学

  代谢工程设计

  团队以人工智能驱动的交叉学科研究为主，以应用需求为导向，致力于突破相关技术瓶颈。长期欢迎具有良好专业背景/编程基础（如计算机、自动化、数学、计算生物等）的有志青年加入我们团队，团队氛围好，鼓励自主灵活时间管理和自由科学探索。优秀学员可推荐至英国、新加坡、香港等相关名校交流和深造。

  此外，也欢迎有毅力、能坚持做科研的

  本科生

  加入我们，需要熟悉Python/Matlab。

  中南大学新进教师代表发言：

  https://news.csu.edu.cn/info/1002/157574.htm'
