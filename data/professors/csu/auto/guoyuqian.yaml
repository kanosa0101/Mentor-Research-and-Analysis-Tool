bio_raw: '个人简介

  Yuqian Guo graduated from the Department of Physics, Changsha University, China,
  in 1995. He received the M.S. degree in Mathematics from Hunan Normal University,
  China, in 2003 and Ph.D. degree in Systems Science from the Institute of Systems
  Science, Chinese Academy of Sciences, Beijing, China, in 2006. He was with the School
  of Electrical and Electronic Engineering, Nanyang Technological University, Singapore,
  as a Research Fellow from Aug. 2006 to Jan. 2009 and from Feb. 2011 to Dec. 2012,
  respectively. Since 2009, he has been with the School of Automation, Central South
  University, China, where he is currently a full professor. His research interests
  include nonlinear control, hybrid control systems and logical dynamical networks.'
