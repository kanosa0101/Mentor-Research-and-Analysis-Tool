bio_raw: 陈晓方，中南大学自动化学院三级教授，博士生导师，副院长。现为思源人工智能协同创新联盟理事会理事，中国自动化学会过程控制专委会委员和大数据专委会委员，中国有色金属学会自动化学术委员会委员，国家自然科学基金创新研究群体、湖南省优秀研究生导师团队和湖南省科技创新团队骨干成员。长期从事流程工业智能优化制造、知识自动化、工业大数据分析等方面研究，近年来主持国家自然科学基金重点项目1项，面上项目2项，参与国家自然科学基金创新研究群体、基础科学中心等多项国家重大重点项目。获得国家科技进步二等奖1项，湖南省自然科学一等奖1项，湖南省优秀研究生导师团队奖1项，湖南省创新团队奖1项，中国有色金属科学技术一等奖1项，其它省部级科技进步奖5项。发表SCI、EI和国内权威期刊高水平论文70余篇，授权发明专利16项，为工信部、中国工程院、有色金属工业学会等撰写战略技术咨询报告5份。
