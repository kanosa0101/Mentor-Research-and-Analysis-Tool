bio_raw: '个人简介

  陈显达，中南大学自动化学院讲师，硕士生导师，现依托桂瑰教授智能交通团队开展科研工作。

  主要研究方向包括世界模型、前馈几何重建与生成、自动驾驶、智能决策与控制，以及面向安全关键场景的多模态大模型应用。

  近年来围绕跟驰行为建模、个性化驾驶行为生成、自动驾驶风格控制及交通事故因果理解等开展研究。

  相关成果发表于 Scientific Data、Transportation Research Part C、IEEE TITS、IEEE TIV、IEEE TVT、CVPR
  等期刊和会议。

  课题组目前具有多个硕士研究生招生指标，欢迎对智能交通与自动驾驶研究感兴趣的同学联系交流。

  目前团队仍有多个硕士生指标

  What I can offer:

  手把手科研指导：论文写作、代码实现、实验推进

  亦师亦友的氛围：认真带，也愿意耐心沟通

  学术指导 + 职业规划：读博、科研、就业都可以一起聊

  团队支持有保障：团队经费较为充足，导师们也都很nice，沟通顺畅、指导认真

  联系邮件： cxdcsu@csu.edu.cn'
