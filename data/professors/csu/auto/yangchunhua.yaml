bio_raw: '个人简介

  现任中南大学学术委员会副主任/信息学部主任，自动化学院教授委员会主任，自动化学院学位评定分委员会主席。是

  IEEE Fellow、中国自动化学会会士

  ，国家杰出青年科学基金获得者，教育部“长江学者和创新团队发展计划”团队带头人，全国高校黄大年式教师团队负责人，

  享受国务院“政府特殊津贴”专家

  。于1985年、1988年和2002年在中南大学获工学学士、硕士和博士学位。1999年至2001年作为访问教授在比利时鲁汶大学从事合作研究，2009年至 2010年在加拿大西安大略大学从事高访研究。

  长期从事工业过程控制、智能感知与自动化装置、工业

  大数据分析与深度学习、工业智能制造系统技术、工业具身大模型等研究，先后承担国家自然科学基金重大/重点/杰青、国家重点研发计划、国家863计划、国家科技支撑计划以及厂校合作重大科研项目30多项；获国家技术发明二等奖1项、国家科技进步二等奖3项，获何梁何利科学与技术进步奖、全国创新争先奖、全国三八红旗手、宝钢优秀教师特等奖等；授权国家发明专利100余项，发表学术论文400余篇，其中SCI收录200余篇，出版学术专著3部。

  兼任国际自动控制联合会IFAC TC6.2技术委员会副主席，

  中国自动化学会副理事长，中国女科技工作者协会常务理事，中国有色金属学会

  常务理事，中国人工智能学会理事，

  中国有色金属学会

  自动化学术委员会主任委员，中国自动化学会女科技工作者工作委员会主任委员，“十四五”国家重点研发计划工业软件专项总体专家组专家，担任

  《IEEE Trans. on Industrial Electronics》、

  《IEEE Trans. on Mechatronics》

  、《控制理论与应用》、《控制与决策》等国际国内高水平期刊编委。'
