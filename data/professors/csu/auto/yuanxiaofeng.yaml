bio_raw: '个人简介

  袁小锋，教授，博导，分别于2011年和2016年获浙江大学学士和博士学位，2014年至2015年赴加拿大Alberta大学进行联合培养，入选国家高层次青年人才、湖南省杰出青年基金、中国科协青年

  托举

  人才、湖湘青年英才、湖南省青年骨干教师等。

  担任国际自动控制联合会IFAC Industry Committee委员、IFAC TC 1.1委员、以及中国自动化学会过程控制专委会、中国自动化学会数据驱动控制与学习系统专委会等多个专委会委员，担任IEEE
  TIM、IEEE SJ等国际SCI期刊Associate Editor，并担任IEEE-CAA JAS等期刊青年编委。

  主要研究方向包括：

  工业大数据分析与建模、

  过程监测与软测量、

  人工智能与深度学习、机器学习与模式识别、医学人工智能、工业机器人等。目前，主持国家自然科学基金项目、国家重点研发计划项目子课题、湖南省自然科学基金项目、校企合作项目等15项，以主要学术骨干参与国家973计划、863计划、科技支撑计划、国家自然科学基金重大项目、重点项目等6项。在国内外期刊和会议发表学术论文130余篇，其中第一作者/通讯作者论文60篇，高被引论文10篇，授权国家发明专利26项，登记软件著作权6项，曾获2023年吴文俊人工智能优秀青年奖、2022年中国自动化学会自然科学一等奖、2020年湖南省自然科学二等奖、2019
  CPCC会议优秀论文奖、2019 CAA SAFEPROCESS会议优秀论文奖、2017年中国PSE年会最佳论文一等奖等奖项。

  指导学生获湖南省优秀硕士论文、湖南省人工智能学会优秀硕士论文、湖南省研究生创新论坛优秀论文奖。指导学生在全国研究生电子设计竞赛、全国大学生创新创业年会等

  全国

  竞赛获奖20余项，其中全国一等奖6项、二等奖8项，并获得全国优秀指导老师6次。指导学生双创项目等 17 项，10余人次获得国家奖学金和校长奖学金。

  每年可招收2-3名硕士生，1-2名博士研究生， 欢迎有意向从事相关研究工作的同学加入课题组。

  yuanxf@csu.edu.cn'
