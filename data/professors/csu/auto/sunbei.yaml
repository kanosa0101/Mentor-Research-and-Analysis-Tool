bio_raw: '个人简介

  孙备，中南大学自动化学院教授、博士生导师。

  2015

  年

  12

  月获中南大学控制科学与工程专业工学博士学位，纽约大学联合培养博士(

  2012-2014

  )，芬兰阿尔托大学博士后(

  2016-2018

  )。

  入选

  国家级青年人才计划、

  湖湘青年英才

  、

  中国科协青年

  托举

  人才。

  主要从事工业人工智能研究工作，主持国家重点研发计划课题，国家自然科学基金面上项目等。

  兼任国际自动控制联合会

  TC6.2

  技术委员会委员，中国有色金属学会自动化学术委员会秘书长

  。

  近

  5

  年第一/通讯作者发表论文

  34

  篇，合作出版英文专著

  1

  部，参编《中国自动化技术发展报告》等，申请/授权国家发明专利

  56

  项。

  曾获教育部技术发明奖一等奖、中国自动化学会自然科学奖一等奖

  ，和全国有色金属优秀青年科技奖、张钟俊奖等。指导学生获湖南省优秀硕士论文，以及中国自动化大会最佳论文等奖项。

  研究方向

  1.

  工业智能

  2.

  智能控制与优化决策

  3.

  系统建模与参数估计

  4.

  模式识别与机器学习

  5.

  最优控制与强化学习

  招生：有

  1-2

  名博士生、

  3

  名硕士研究生招生指标，请对上述研究方向感兴趣、踏实上进的同学与我联系，

  Email：sunbei@csu.edu.cn

  。

  代表性论著

  专著、教材：

  1.

  《Modeling, optimization and control of zinc hydrometallurgical purification processes》.
  Chunhua Yang, Bei Sun. London: Elsevier, 2021.

  2.

  《智能控制: 方法与应用》第十八章：流程工业过程智能控制. 周晓君, 孙备. 北京: 中国科学技术出版社,

  2020

  .

  论文：

  1.

  复杂生产流程协同优化与智能控制[J]. 自动化学报, 2023, 49(3): 528-539.

  2.  A Hierarchical Stochastic Network Approach for Fault Diagnosis of Complex Industrial
  Processes[J]. IEEE/CAA Journal of Automatica Sinica, 2025, 5(2): 564-576.

  3.  Towards adaptive and interpretable process monitoring: Incremental variational
  graph attention autoencoder with probabilistic inference[J]. IEEE Transactions on
  Cybernetics, 2025, 55(9): 4114-4127.

  4.  Mechanism-aware multimodal modeling of industrial processes via state-modulated
  graph networks[J]. Control Engineering Practice, 2025, 165: no. 106601.

  5.  A dynamics-learning multirate estimation approach for the feeding condition
  perception of complex industry processes[J]. IEEE Transactions on Cybernetics, 2024,
  54(5): 3286-3298.

  6.  A Spatial-Temporal variational graph attention autoencoder using interactive
  information for fault detection in complex industrial processes[J]. IEEE Transactions
  on Neural Networks and Learning Systems, 2024, 35(3): 3062-3076.

  7. An interpretable operating condition partitioning approach based on global spatial
  structure compensation-local temporal information aggregation self-organizing map
  for complex industrial processes, Expert Systems With Applications, 2024, 249: no.
  123841.

  8.  A spatial-temporal structural estimation model based on GATE-PCGRU for multirate
  industrial process[J]. IEEE Transactions on Instrumentation and Measurement, 2023,
  72: no. 3524911.

  9.

  An integrated multi-mode model of froth flotation cell based on fusion of flotation
  kinetics and froth image features[J]. Minerals Engineering, 2021, 172: no. 107169.

  10.

  A comprehensive hybrid first principles/machine learning modeling framework for
  complex industrial processes[J]. Journal of Process Control, 2020, 86: 30-43.'
