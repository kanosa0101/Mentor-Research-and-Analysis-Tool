title: 副教授
bio_raw: '个人简介

  刘子建，中南大学自动化学院电子信息工程系副教授。主讲电路、模拟电路、数字电路、微控制器技术、电气控制与PLC应用技术等课程。主要研究方向为电力电子与电力传动，主持和参与科研项目10余项，发表学术论文20余篇。'
