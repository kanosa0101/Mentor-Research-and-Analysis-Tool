bio_raw: '个人简介

  【基本情况】

  桂明臻，男，博士，江西南昌人，中南大学自动化学院副教授。自2013年9月进入北京航空航天大学惯性技术国家重点实验室攻读硕士与博士学位，于2019年6月博士毕业。

  主要研究方向：（1）航天器自主导航方法；（2）深空探测器新型智能导航方法；（3）非线性自适应最优估计方法。

  主持了国家自然科学基金青年项目、湖南省自然科学基金青年项目、智慧地球重点实验室开放基金重点课题、航天一院高校联合创新基金项目、航天五院合作项目、中南大学高层次人才项目；参与了国家973项目、国家自然科学基金重点项目等多个项目的研制与结题过程。在IEEE
  Transactions on Aerospace and Electronic Systems、IEEE Transactions on Instrumentation
  and Measurement、Aerospace Science and Technology等期刊发表SCI论文二十余篇，授权国家发明专利十余项。受邀担任广东省自然科学基金评审专家、《深空探测学报（中英文）》青年编委、SCI期刊Applied
  Sciences(IF: 2.5, Q1)客座主编、Frontiers in Aerospace Engineering Review Editor、湖南省信息技术标准化技术委员会专家，受邀担任IEEE
  Transactions on Aerospace and Electronic Systems、IEEE Transactions on Industrial
  Informatics、IEEE Access、Acta Astronautica、Chinese Journal of Aeronautics、Journal
  of Navigation、Journal of Aerospace Engineering、Advances in Space Research等SCI期刊审稿人。

  ----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------

  硕士研究生招生专业方向：控制科学与工程，电子信息工程

  ，2-3人/年

  本科专业不限，不要求学生本科掌握导航相关知识，有能力、有信心让零基础学生快速入门。

  鼓励学生产出成果，并给予优厚助研金及成果奖励，

  支持学生申报各种荣誉奖励，

  目前所带研究生人均产出论文3篇，获中南大学2024届优秀毕业生、华为校级奖学金，

  热忱欢迎对航天及导航感兴趣的有志青年加入！

