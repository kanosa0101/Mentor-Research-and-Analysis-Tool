bio_raw: 覃爱娜，博士，教授，中南大学自动化学院电工电子教学中心主任，国家线上一流课程、国家精品在线开放课程“数字电子技术”的负责人，中国高校电工电子在线开放课程联盟理事。主要研究方向：数字信息技术、语音信号处理。承担国家863项目、国家自然科学基金面上项目、湖南省自然科学基金项目等。主持教育部产学协同育人项目、湖南省高校教学教改研究项目和中南大学教研教改项目多项。主编出版教材4部，参编教材4部，发表学术论文和教改论文30余篇；曾获全国高校青年教师电子技术电子线路教学竞赛全国二等奖、中南赛区一等奖、湖南省信息化教学竞赛一等奖、湖南省微课大赛三等奖、西南铝奖励金优秀教师奖，校级成果一等奖，指导全国大学生电子设计大赛获全国一等奖等。
