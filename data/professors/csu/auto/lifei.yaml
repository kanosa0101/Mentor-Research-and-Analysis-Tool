bio_raw: '个人简介

  李飞，博士，教授，硕士生导师。中南大学自动化学院电工电子基础教学中心支部书记。主要研究方向：过程控制、信号处理和智能系统，主持湖南省自然科学基金项目1项，参与国家自然科学基金、“973”和“863”项目多项。发表学术论文12余篇，授权专利2项。主编教材5部，参编5部。获湖南省教学成果一等奖1项，湖南省教学成果三等奖1项，校教学成果一等奖2项，校教学成果二等奖1项。主持湖南省教改项目2项，校级教改项目7项。曾被评为SME优秀教师，华为奖教金优秀教师，西南铝优秀教师；荣获首届全国高等学校青年教师电子技术基础、电子线路课程授课竞赛全国三等奖、中南地区一等奖，首届全国高等学校青年教师电工学程授课竞赛全国二等奖，湖南省高校教师信息化教学竞赛二等奖，湖南省课堂教学教学竞赛三等奖，中南大学“十佳讲课”。指导全国大学生电子设计竞赛、机器人及人工智能大赛获国家及省级奖20余项。负责湖南省线上一流课程1门，湖南省线上线下混合一流课程1门，校开放式精品示范课堂《电子技术》和《电工学》负责人，校级在线开放课程1门，获评校级课程思政示范课程及教学团队，国家精品在线开放课程《数字电子技术》主讲老师，目前任湖南省高等院校电工学研究会副理事长。'
