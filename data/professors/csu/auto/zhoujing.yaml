bio_raw: '个人简介

  Personal Profile

  2015年本科毕业于华中科技大学机械学院，2018 年硕士毕业于北京大学工学院，在动态系统故障诊断领域取得多项成果；2022 年博士毕业于加拿大阿尔伯塔大学电气与计算机工程学院（导师：Prof.
  Tongwen Chen, 加拿大皇家科学院院士 , 加拿大工程院院士 , IEEE/IFAC Fellow, Tier 1 Research Chair) ，在信息物理系统安全、网络脆弱性分析和攻击防御、工业过程报警管理等控制理论和应用的前沿方向取得多项原创性研究成果。2022年9月至2024年7月为阿尔伯塔大学博士后研究员，2024年8月至2025年2月为香港城市大学博士后研究员，2025年3月加入中南大学自动化学院（海外优青）。

  在国际重要期刊和会议接收/发表论文24篇：包括控制理论类顶级期刊 IEEE Trans. on Automatic Control 和 Automatica 论文9篇(均为一作/通讯,
  其中长文6篇)。博士期间提出的“分离设计”原理解决了远程状态估计性能退化分析中攻击性能和隐性约束难以平衡、信息未能充分利用等多个难题。研究成果得到了美国国家工程院院士Richard
  D. Braatz 教授，加拿大国家工程院院士Peter Liu教授等多位知名学者的引用和正面评价。

  曾获国际会议最佳学生论文奖、北京大学优秀科研奖、国家奖学金等多项荣誉。硕士期间参与基金委重点项目“大型船舶推进系统故障诊断与健康管理”。博士和工作期间，作为核心成员参与加拿大自然科学与工程研究委员会(NSERC)和Alberta省能源公司资助的“先进工业报警设计与管理”项目，进行报警和事件日志分析，报警管理工具箱开发等工作，相关分析算法和工具箱成功应用于北美能源输送网络(Enbridge，Suncor
  等世界500强公司)。'
