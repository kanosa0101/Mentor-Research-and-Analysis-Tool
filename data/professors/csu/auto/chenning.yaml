bio_raw: 陈宁，中南大学二级教授，博士生导师。1992年毕业于中南工业大学，获工业自动化学士学位；1995年毕业于中南工业大学，获工业自动化硕士学位；2002年毕业于中南大学，获控制理论与控制工程博士学位。2004年和2014年分别在日本大阪大学和美国中弗罗里达大学进行访问。2008年计算机科学与技术博士后出站。现为IFAC
  Large Scale Complex Systems委员，中国自动化学会过程控制专业委员会委员，TCCT新能源控制学组委员，自适应动态规划与强化学习专业委员会委员，中国人工智能学会会员。
  主要研究方向：复杂系统的建模和优化控制、新能源电池材料的智能制造、新能源汽车动力电池管理系统等。已发表论文80多篇，其中SCI收录50多篇，获 授权 国家发明专利30多项，获省部一等奖2项。
  主持国家级自然科学基金重点项目1项，国家自然科学基金面上项目3项，工信部智能制造项目1项和企业横向项目资助30余项。
research_direction_raw: 复杂系统的建模和优化控制、新能源电池材料的智能制造、新能源汽车动力电池管理系统等
