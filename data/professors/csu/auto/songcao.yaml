bio_raw: '个人简介

  宋操，

  中南大学自动化学院讲师，硕士生导师。

  2025年6月获清华大学控制科学与工程专业博士学位。主持国家自然科学基金青年基金项目、国家重大专项子课题，作为技术骨干参与国家重点研发计划项目、国家自然科学基金重大仪器研制项目、国家自然科学基金面上项目

  、湖南省卫生健康科研课题等

  。

  在

  IEEE Transactions on Geoscience and Remote Sensing、IEEE Transactions on Instrumentation
  and Measurement、IEEE Photonics Journal

  等遥感领域、信号处理领域国际权威期刊、会议上发表论文

  20

  余篇，授权专利

  20

  余项。

  兼任中国自动化学会系统仿真专委会委员、中国仿真学会信创与仿真专委会委员、兼任

  《Earth Sciences》、《Computational Earth System Dynamics》

  期刊编委，兼任

  《Geophysical Prospecting for Petroleum》、《Advanced Equipment》、《AI in Neurology》、《Journal
  of Artificial Intelligence for Medical Sciences》、《Brain Horizon》

  等期刊青年编委、担任

  《IEEE Transactions on Geoscience and Remote Sensing》、《IEEE Transactions on Instrumentation
  and Measurement》、《IEEE Transactions on  Artificial Intelligence》、《IEEE Transactions
  on Medical Imaging》、《IEEE Geoscience and Remote Sensing Letters》、《Petroleum Science》

  等国际期刊审稿人，是中国自动化学会、中国人工智能学会、中国地球物理学会、中国图象图形学学会、中国仿真学会会员。

  曾获得有色金属工业科学技术一等奖、北京市优秀毕业生、湖南省优秀毕业生、优秀学位论文等奖励。曾指导学生获得本科生实验室开放项目（学生自主项目）、研究生自主探索创新项目、大学生创新训练项目、中国国际大学生创新创业大赛获奖等。

  主要研究方向：

  一、人工智能算法理论研究

  人工智能与深度学习算法

  多模态信息处理与分析

  工业多智能体

  大小模型协同优化与控制

  物理信息深度神经网络

  二、人工智能 + 深地探测

  地震、电磁、测井等地球物理信号智能处理

  多模态地球物理反演建模

  深地资源分布智能预测

  三、人工智能 + 精神医学

  脑电信号、脑部磁共振成像等医学影像智能处理

  多模态脑部医学信息智能解码与客观生物标志物发现

  抑郁症、焦虑症等精神疾病的智能诊断与闭环神经调控物理治疗

  课题组招收博士后/博士研究生/硕士研究生/科研助理，及部分学有余力的优秀本科生！

  相关学科和研究领域包括但不限于：自动化、控制科学与工程、人工智能、电子信息、计算机、数学、通信、工业互联网、大数据分析等。

  课题组氛围融洽，欢迎有意向从事相关研究工作的同学加入课题组！

  课题组负责人：

  王雅琳老师

  ，教授/博士生导师

  联系邮箱：

  songcao@csu.edu.cn

  【团队名称】：控制工程研究所

  课题组隶属控制工程研究所，具有良好的科研平台，包括国家自然科学基金创新研究群体，制造过程智能控制与优化决策创新引智基地（“111”计划），工业智能与系统教育部重点实验室、有色冶金自动化教育部工程研究中心等。

  【合作平台】

  清华大学自动化系、北京信息科学与技术国家研究中心

  中南大学湘雅二医院、国家精神心理疾病临床医学研究中心'
