bio_raw: '个人简介

  邓镇华，中南大学自动化学院副教授，博士生导师、硕士生导师，IEEE Senior Member，湖南省优青。主要从事智能电网、集群智能无人系统、分布式优化与博弈、分布式机器学习、多智能体控制、多电机系统协调控制等方面的研究，主持相关纵向项目多项。在分布式优化与博弈领域做出了国际公认的开创性工作（具体评价见文献[1]-[11]等

  ，相关方向目前被称为具身智能），取得

  了一批有特色的原创性成果，并形成了一套研究体系

  。此外，还在集群系统、分布式自主博弈、分布式在线博弈、分布式时变优化等方向上，提出了四类技术，解决了已有方法在仿真上都无法解决的问题。近

  年来，在《Automatica》(顶刊)、《IEEE Transactions on Automatic Control》(顶刊)、《IEEE Transactions
  on Industrial Electronics》、《IEEE Transactions on Smart Grid》、

  《IEEE Transactions on Neural Networks and Learning Systems》、

  《IEEE Transactions on Control of Network Systems》、

  《IEEE Transactions on Automation Science and Engineering》、《IEEE Transactions on
  Systems, Man and Cybernetics: Systems》、

  《IEEE Transactions on Network Science and Engineering》、《IEEE Transactions on Signal
  and Information Processing over Networks》、

  《IEEE Transactions on Cybernetics》、

  《IEEE Transactions on Fuzzy Systems》、

  《IEEE Systems Journal》等国内外高水平期刊发表SCI论文60余篇，其中JCR一区论文近50篇；会议论文12篇，获优秀论文奖1篇。独作/唯一第一/唯一通信作者科研工作得到了西方主要科技发达国家的广泛引用（含美、俄、德、法、英、加拿大、澳大利亚、意大利、西班牙、丹麦、荷兰、瑞士、瑞典、芬兰、挪威、比利时、希腊、波兰），其中包括来自牛津大学、斯坦福大学、瑞士苏黎世联邦理工大学、多伦多大学、伊利诺伊大学、纽约大学、加州大学、亚利桑那州立大学、比利时鲁汶大学、瑞典皇家理工学院、荷兰代尔夫特理工大学、德国亚琛工业大学、澳大利亚国立大学、新加坡国立大学、南洋理工大学、香港大学等世界知名高校的知名学者。

