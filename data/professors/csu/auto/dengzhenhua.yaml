  团队名称

  ：集群控制与集群智慧实验室。

  团队任务

  ：本团队以培养学生为核心任务，针对学生特点和兴趣爱好，为每位学生制定符合其发展的培养方案，促进学生全面发展；团队科研气氛浓厚，所指导的学生都取得了令人羡慕的科研成绩（40%以上硕士生能在顶刊发表研究成果，70%硕士生能在IEEE
  Trans. 期刊发表研究成果）。欢迎对科研感兴趣的同学加入！本实验室常有瑞典、西班牙、澳大利亚、香港等地知名高校师生访问交流，欢迎世界知名高校师生来本实验室指导工作。

  部分学生成绩如下：

  l

  2024年4月12日，指导硕士生刘聪研究成果被期刊《IEEE Transactions on Industrial Electronics》录用（SCI, EI,
  JCR 一区, IF: 7.7） 。《IEEE Transactions on Industrial Electronics》是自动化学科领域高质量科技期刊T1级期刊。

  l

  2024年1月13日，指导硕士生陈涛研究成果被期刊《IEEE Transactions on Network Science and Engineering》录用（SCI,
  EI, JCR 一区, IF: 6.6）。

  l

  2023年7月30日，

  指导

  硕士生罗瑾研究成果被顶刊《IEEE Transactions on Automatic Control》录用（顶刊、SCI、EI、JCR一区，影响因子：6.8)。

  l

  2022年12月7日，

  指导

  硕士生陈涛研究成果被《IEEE Systems Journal》录用（SCI、EI、JCR一区，影响因子：4.802)。《IEEE Systems Journal》是自动化学科领域高质量科技期刊T1级期刊。

  l

  2022年6月1日，

  指导

  硕士生陈涛研究成果被顶刊《Automatica》录用（顶刊、SCI、EI、JCR一区，影响因子：5.944)。这是陈涛同学发表的第二篇顶刊论文。研二期间就能发表2篇顶刊论文，在国际控制届都非常少见！该生由于发表了2篇Automatica
  论文，找工作时直接免面试录用（世界500强央企）。

  l

  2022年4月27日，

  指导

  硕士生刘洋洋研究成果被《IEEE Transactions on Neural Networks and Learning Systems》录用（SCI、EI、JCR一区，影响因子：14.225)。《IEEE
  Transactions on Neural Networks and Learning Systems》是自动化学科领域高质量科技期刊T1级期刊。

  l

  2022年3月3日，

  指导

  硕士生陈涛、刘洋洋研究成果被顶刊《Automatica》录用（顶刊、SCI、EI、JCR一区，影响因子：5.944)。硕士生能在顶刊Automatica上发表论文非常难得！

  l

  2020年7月9日，

  指导

  硕士生王磊研究成果被《IET Control Theory and Applications》录用(SCI、EI、JCR一区，影响因子：3.527)。

