bio_raw: '个人简介

  2018年6月取得中南大学控制科学与工程专业博士学位，2018年6月-2020年9月任浙江大学助理研究员，2020年9月至今在中南大学从教学科研岗，现任中南大学副教授，主要研究方向为复杂工业过程先进检测技术及智能方法研究。科研详情见网址：https://www.scholarmate.com/psnweb/homepage/show'
