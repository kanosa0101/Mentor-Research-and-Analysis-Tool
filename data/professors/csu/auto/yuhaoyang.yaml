bio_raw: '个人简介

  余浩洋，工学博士，本科、博士毕业于清华大学精密仪器系，现任中南大学自动化学院讲师、硕士生导师，中国图像图形学会图像应用与系统集成专委会委员，中国光学工程学会光谱技术及应用专委会青年委员，入选中国自动化学会第十一届青年人才托举工程。研究方向包括：智能精密光谱分析、计算成像与视觉检测、多维信息处理与融合、智能超快光学技术等。

  主持国家自然科学基金面上项目、青年项目、宝钢校企合作项目等10项，作为骨干参与国家科技重大专项、国家自然科学基金重大科研仪器、重点等项目。近五年以第一/通讯作者发表高水平期刊论文27篇，以第一发明人授权/公开发明专利10项，获中国自动化学会科技进步特等奖、中国自动化学会科技进步一等奖、中国有色金属工业科学技术一等奖、中国计量测试学会科技进步一等奖、北京市优秀博士毕业生等荣誉，担任Nanomanufacturing
  and Metrology、Nanotechnology and Precision Engineering、Instrumentation期刊青年编委，

  Laser & Photonics Reviews、IEEE TIP、

  IEEE TII、IEEE TIM、Measurement、Optics Letters、Optics Express、Optics & Laser Technology等期刊审稿人。

  主讲《信号处理与系统分析》、《先进检测技术与仪表》、《工程光学》等专业核心课程，承担教育部产学合作协同育人项目、湖南省研究生教学改革研究项目等，获湖南省高等教育（研究生）教学成果特等奖、中南大学研究生教学成果一等奖、中南大学本科生教学成果一等奖、湖南省自动化领域课程教学创新大赛一等奖等教学奖励。

  硕士研究生招生专业方向：自动化、测控、人工智能、光学工程等相关专业，2-3人/年。

  鼓励和推荐成果优异的研究生在本团队和清华大学等国内外团队继续深造。

  欢迎有志于人工智能与光电信息技术在工业智能感知、前沿科学研究领域应用的学生与我联系。

  邮箱：yu.haoyang@csu.edu.cn'
