title: 特聘副教授
supervisor: 硕导
bio_raw: '个人简介

  耿静轩，副教授、硕导。长期从事先进计算感知与智能检测研究，聚焦复杂工业场景下高维信息感知与小样本、弱监督应用情景中的人工智能基础理论与关键技术。先后主持国家科技重大专项课题，国家自然科学基金青年项目，获国家博士后创新人才支持计划（B类）资助，并作为核心成员参与国家自然科学基金重大、重点及仪器专项等多个国家级项目。目前于IEEE
  Trans. Industr. Inform. IEEE Trans. Ind. Electron.等权威期刊发表论文20余篇，申请及授权发明专利10余项。

  目前研究兴趣集中在计算高光谱成像、图像异常检测、多传感器故障监测、多模态信息融合与自监督学习，欢迎感兴趣的同学加入。每年有2-3名硕士招生名额和1名博士招生名额。'
