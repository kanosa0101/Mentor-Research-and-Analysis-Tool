bio_raw: 本人研究主要围绕两大方向： 低功耗超宽带（UWB）雷达理论与工程 、 电磁装备性能一体化测试技术 。 一、低功耗超宽带（UWB）雷达理论与工程方向
  本人在低功耗超宽带雷达领域理论基础 夯实 ，积累了丰富的工程落地经验；牵头研制多款民用低功耗超宽带雷达装备，涵盖生命探测雷达、穿墙雷达、地质探地雷达（GPR）、微型合成孔径雷达（Mini‑SAR）等系列产品，相关成果已实现产业化落地。该系列雷达先后在玉树地震、雅安地震、深圳光明新区山体滑坡、泉州楼房坍塌等重大灾害抢险救援中发挥关键作用。
  二、电磁装备性能一体化测试技术方向 依托电磁场基础理论与试验方法，自主研发软硬件一体化的电磁性能自动化测试系统，实现电磁参数高效自动检测，有力推动了国内电磁装备一体化测试技术的行业发展。
  近五年科研项目与成果： 近五年以项目负责人（PI）身份主持国家级、省部级科研课题 23 项 ，累计获批科研经费超 1600 万元人民币 ；发表高水平 SCI/EI
  等同行评议学术论文 10 余篇，出版学术专著 2 部，获授权发明专利 20 余项。
