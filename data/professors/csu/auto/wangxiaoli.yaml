bio_raw: 王晓丽，工学博士，教授，自动化学院和国家卓越工程师学院硕士博士生导师， 现任中南大学自动化学院自动化系副主任。兼任国际自动控制联合会MMM技术委员会委员、中国有色金属学会自动化学委会委员、中国自动化学会会员等，任IEEE系统汇刊、自动化学报等十多个国内外权威期刊以及国家科技部和国家自科项目等评审专家。
  长期致力于有色金属生产过程自动化和智能化理论方法与应用技术研究。主持在研或完成国家然科学基金项目3项、中国五矿集团重大研发计划1项、省部级项目3项、校企合作项目3项，作为技术负责人完成国家863计划1项，参与国家级重点等项目7项。申请国家发明专利20余项，其中授权12项、获软著4项；发表学术论文70余篇，其中第一和通讯作者SCI收录22篇、EI收录24篇，获省部级科技奖2项、中国自动化学会科技成果鉴定1项，鉴定结果认为部分技术达国际领先。
research_direction_raw: 智能优化控制 图像处理与音频分析 工业大数据智能解析 深度学习及应用
