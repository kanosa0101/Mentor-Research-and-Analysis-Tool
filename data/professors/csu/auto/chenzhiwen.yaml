bio_raw: '个人简介

  陈志文，教授，博士生导师，湖湘青年英才、中南大学创新驱动人才，分别于2008年和2012年在中南大学获得学士和硕士学位。2012年9月至2016年10月，受国家留学基金委资助，在德国杜伊斯堡-埃森大学（University
  of Duisburg-Essen）获得博士学位。现为IFAC（国际自动控制联合会）TC 6.2委员会成员，国际电气电子工程师学会高级会员（IEEE Senior
  Member），中国自动化学会高级会员，中国自动化学会技术过程的故障诊断与安全性专业委员会委员。曾获湖南省科技创新团队奖、湖南省自然科学奖和湖南省博士后创新创业奖、

  中国有色金属学会高等教育教学成果奖。

  已在IEEE汇刊、IFAC系列期刊、《自动化学报》等国内外高水平期刊、IFAC World Congress, IFAC SAFEPROCESS 和 IEEE
  IECON等国际会议上发表学术论文70余篇(包括SCI论文40余篇，ESI高被引论文4篇，ESI热点论文1篇)，入选全球前2%顶尖科学家（年度&终身科学影响力）、中国精品期刊顶尖学术论文（F5000）、最佳会议论文等，授权国家发明专利十余项，登记软著5项。在国际著名出版社Springer
  Vieweg出版英文专著1部、编著2部。担任IEEE TII等SCI期刊编委，及Automatica、IEEE TIE、Applied Energy、IEEE
  TNNLS、ISAT等多个国际期刊的审稿人。

  主持国家自然科学基金项目3项，湖南省优秀青年基金，湖南省青年科技创新人才项目等多项，作为研究骨干参与了国家自然科学基金重大/重点项目、科技部重点研发计划、装备预研教育部联合基金等项目，为“轨道交通节能控制与安全监测”湖南省重点实验室骨干成员。

  【研究方向】工业数据智能解析、

  系统健康管理与故障诊断、

  中央空调系统节能优化和智能监测、轨道列车动力系统故障诊断与优化控制、

  机器视觉等

  。

  【学生指导】：（1）指导研究生和本科生发表SCI一区论文20余篇；（2）指导本科生获全国嵌入式大赛一等奖等；（3）课题组氛围融洽，充分

  尊重学生个人发展，就业/深造等都会提供充足指导和资源支持。

