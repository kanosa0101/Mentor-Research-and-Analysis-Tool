bio_raw: '个人简介

  教授，博士生导师。主要从事智能学习与优化的研究，并且以汽车轻量化设计、智能目标检测与识别、锂离子电池设计、移动边缘计算、智能系统研发等为背景。

  主持国家自然科学基金5项（含重点项目1项），JKW重大基础研究项目子课题1项，省部级和企业项目20余项，以第一作者/通讯作者发表IEEE汇刊论文70篇，包括：IEEE
  Transactions on Evolutionary Computation（IF=15.9，

  20篇

  ）、IEEE Transactions on Cybernetics（IF=11.3，

  17篇

  ）、IEEE Transactions on Systems, Man and Cybernetics: Systems（IF=8.4，

  15篇

  ）等。所发表论文被谷歌学术总引用1.3万余次，授权国家发明专利16项，软件著作权1项。

  获湖南省自然科学二等奖、中国仿真学会自然科学一等奖、中国仿真学会高等教育教学成果特等奖等。入选教育部青年长江学者、爱思唯尔中国高被引学者、全球“计算机科学”高被引学者、欧盟玛丽居里学者、香江学者计划、湖南省杰出青年基金等。

  研究团队主页：

  https://intleo.csu.edu.cn/'
