bio_raw: '个人简介

  黄科科，男，中南大学教授，博士生导师，硕士生导师

  ，自动化学院副院长兼卓越工程师学院副院长

  。

  入选长江学者特聘教授、国家

  “

  万人计划

  ”

  青年拔尖人才、

  湖南省科技创新领军人才、湖南省杰青、中国科协青年托举人才、湖湘青年英才等。

  主持国家重点研发计划项目/课题、国家科技重大专项课题、

  国家自然科学基金重大研究计划培育/面上/青年项目、教育部学科突破先导项目课题、工信部工业大模型/工业互联网创新发展工程专项课题、校企合作重点项目等10余项。

  在IEEE Trans.、IFAC旗舰期刊、CCF A类会议等发表高水平论文120余篇，其中，8篇论文入选ESI热点/高被引学术论文，授权中国/美国发明专利40余项。

  曾获国家科技进步二等奖、

  湖南省科技进步一等奖、

  中国自动化学会自然科学一等奖、中国有色金属工业科技进步一等奖、湖南省高等教育(研究生)教学成果特等奖、中国有色金属学会高等教育教学成果特等奖、IEEE TCSDM
  Young Professional Award、全球前2%顶尖科学家榜单等。

  兼任

  IEEE Transactions on Automation Science and Engineering、IEEE Systems, Man, and Cybernetics
  Magazine、

  IET Cyber-Physical Systems、《电子学报》等多个国内外期刊编委和中国有色金属学会自动化学术委员会副秘书长、

  中国人工智能学会智能融合专委会常务委员、中国计算机学会计算机应用专委会执行委员、中国自动化学会过程控制专业委员会/技术过程的故障诊断与安全性专委会委员、中国图学学会数字孪生专业委员会委员、信息技术新工科产学研联盟工业互联网工作委员会委员等。

  招才引智：博士、硕士、本科生，欢迎联系。

  相关学科和研究领域包括但不限于：自动化、控制科学与工程、

  人工智能、

  计算机、

  数学、材料科学等。

  课题组氛围融洽，欢迎加入！

  主要研究方向：

  1、AI for Scienc

  e:

  面向新材料研发和制备，研究人工智能驱动的新材料发现、微观组织感知与理解、多物理场控制

  2、

  前沿控制与具身智能：

  面向机器人自主操作、自动驾驶等场景，研究强化学习、大模型驱动前沿控制理论，研制自主机器人、自动驾驶等具身智能系统

  3、

  过程监测与机器视觉：

  面向工业视觉检测、重大装备安全运行需求，研究数据和知识融合的机器视觉、过程监测方法和系统'
