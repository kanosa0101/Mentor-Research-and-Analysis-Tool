bio_raw: '个人简介

  山东济宁人，本硕分别毕业于中南大学自动化专业和控制科学与工程专业，博士毕业于美国阿拉巴马大学电气与电子工程专业。留美8年，拥有多年海外工作经验，主要研究方向包括电池储能系统，

  能源转换及新型电力系统，

  电池管理设计，电力电子变换器，无线充电系统，嵌入式系统，电动汽车及其电池系统设计，以及人工智能技术在电力、储能、电子系统中的应用。

  本人业界工作经验丰富，有很强的实操和项目经验，指导学生亲力亲为。（PS:

  杜绝Pua，杜绝画大饼，论文专利初稿三天内一定返回修改，做实验亲自动手帮调程序

  ）。

  团队招收电动工程、能源动力、控制科学与工程

  、智能科学

  等学科硕士与博士生。

  欢迎大家前来咨询交流学习（邮箱：caoyuan3116@csu.edu.cn，QQ731732128 欢迎加QQ咨询）

  课题组不大，一年招生五个硕士，每年课题组可以发表IEEE Trans系列（中科院TOP期刊）3篇左右，其他一区论文4篇左右，每人都有很好的成果，不push，不卡毕业；

  喜欢打篮球，实验室每周打篮球；

  横向课题大部分是电网相关，过去几年很多学生去电网；

  学生有自己的研究方向，也跟着课题（有老师和师兄师姐带），尽量均衡发展；

  实验室的几个老师都很真诚，欢迎大家咨询实验室毕业的学生和在读学生，充分了解实验室情况（老师不在场，学生单独坐在新校区信息楼212和215，或者找论文里面学生的邮箱，因隐私问题，不能在这里发学生联系方式）。

  -----------------------------------------------------------------------------------------------

  最近一直在出差，每天收到很多学生的保研咨询邮件，这两天实在是没时间回复，请大家加自动化学院的保研群806577763。根据去年的情况，学院会在九月报名推免，然后进面试考核，最后是九推系统提交（所以学院的面试至关重要）。如果对我们课题组特别感兴趣，意愿很强烈，可以加我

  QQ731732128

  ，我更容易看到。群发的邮件我回复的会慢一些。

  祝大家

  Good Luck！

  Update by Aug 11th, 2026.'
