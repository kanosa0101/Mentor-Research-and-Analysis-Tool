bio_raw: '个人简介

  1983年至1987年，北京大学，学士

  1987年至1990年，北京大学，硕士

  1998年至2002年，中南大学，博士

  2003年，

  加拿大，达尔豪西大学，教育部公派留学一年。

  2005年至2008年，国防科大，博士后

  2012年，英国，华威大学，教育部公派留学一年。

  1990年8月至1996年8月，长沙理工大学工作，从事教学和科研。

  1996年9月至今，中南大学工作，

  从事教学和科研。

  2016年起担任中央XX科技委专家。

  主要研究领域为计算机视觉、机器人、大模型。

  主持和参与国家自然科学基金重大专项、自然科学基金重点项目、国防基础研究、863项目、横向课题40余项。在国内外公开发表论文100余篇，被SCI检索收录50余篇。27项发明专利获得授权。获国家级二等奖1项，省部级三等奖2项，第二届湖南省优秀博士后，2次获湖南省技术创新先进个人称号。

  主要研究领域：

  1、计算机视觉

  主要有步态识别、图象超分等。以第一作者或通讯作者在国际顶刊顶会IEEE Transaction on Image Processing、Pattern Recognition等发表了多篇论文。2024年发表的论文已有1、Cross-Covariate
  Gait Recognition: A Benchmark ：The 38th Annual AAAI Conference on Artificial Intelligence，March
  2024（AI顶会）；2、LPSRGAN: Generative adversarial networks for super-resolution of license
  plate image：Neurocomputing, May 2024；３、FHFN: content and context feature hierarchical
  fusion networks for multi-focus image fusion，The Visual Computer，August 2024。4、Sound
  source localization and detection based on densely connected network and attention
  mechanism，Applied Acoustics，15 January 2025。

  2、工业智能

  主要有目标检测识别、目标位姿检测、生产运输成本控制、智能装配装卸等。

  3、国防反恐

  主要有卫星定位导航系统拒止时绝对定位、隐蔽人员装备的检测定位等。

  4、大模型

  主要有建筑CAD大模型技术方案验证、物流垂直领域大模型等。所指导的学生队伍在ATEC2023全国大模型竞赛中获得知识引入赛道的第四名。

  承担的部分科研项目：

  大语言模型的行业应用研究，横向项目，2024年

  透镜外观质量的智能化检测，横向项目，2024年

  大语言模型应用研究，横向项目，2023年

  眼动仪控制系统，横向项目，2023年

  集装箱卸货机器人视觉测控技术，

  横向项目，2022年

  危化品智能管控系统，

  横向项目，2022年

  智能传感器---新一代人工智能开放创新平台雷视融合技术及数据集标准，纵向项目，2022年

  基于DNA的宫颈癌筛查系统，

  横向项目，2022年

  智能目标识别系统研制，军工项目，2021年

  火炮校准系统研制，军工项目，2021年

  芯片插座精确定位系统，横向项目，2021年

  基于机器视觉的布料识别技术，横向项目，2021年

  透明XX班组系统：多源异构侦查数据融合及可视化系统，军工项目，2020年

  透明XX班组系统：基于激光XX的声源定位，军工项目，2020年

  XXX拒止条件下XX感知方法与技术——基于XXXXXXXXXXX的XX感知，军工项目，2018年

  图像拼接处理单元技术开发，军工项目，

  2017

  年

  国家自然科学基金“视听觉信息的认知计算”重大研究计划集成项目合作研究，“交通标识快速识别研究”，2017年

  ADAS

  交通指示检测技术合作项目，

  华为，

  2016

  年

  基于参数化人体模型的高鲁棒性三维步态识别研究，湖南省自然科学基金，

  2016

  年

  无人车全天候准确识别交通信号灯的关键技术研发，湖南省科技计划重点项目，

  2015年

  铁芯叠片机器人工作站的研发，横向项目，

  2015

  年

  自主驾驶车辆关键技术与集成验证平台，国家自然科学基金重大研究计划子课题，

  2014

  年

  视角大幅变化时步态识别的关键技术研发，湖南省科技计划，2

  014

  年'
