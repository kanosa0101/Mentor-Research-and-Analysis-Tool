bio_raw: '个人简介

  刘乾易，工学博士，中南大学硕士生导师、IEEE高级会员，从事新型电力系统电能质量优化与控制研究；入选中国电机工程学会青年人才托举工程、湖南省小荷人才专项支持计划、中南大学十佳青年。

  科研方面

  ，主持国家自然科学基金（面上、青年）、湖南省自然科学基金（青B、青C）、湖南省教育厅优秀青年项目等项目；在能源电力领域发表论文30余篇，4篇入选ESI热点论文和高被引论文，授权美国和中国发明专利9项；获湖南省电力优秀青年科技人才奖、中国机械工业科技进步一等奖、中国电工技术学会科学进步奖一等奖、湖南大学优秀博士学位论文。

  教学方面，序一获机械行业教育优秀成果二等奖、电气类实验教学案例竞赛全国二等奖、中南大学优秀班导师等荣誉；指导学生获中国研究生双碳大赛一等奖、大学生电力创新设计竞赛一等奖、全国大学生可再生能源竞赛二等奖、高校电气电子工程创新大赛二等奖。

  担任《Protection and Control of Modern Power Systems》、《西安交通大学学报》、《华南理工大学学报》等期刊青年编委。

  注重培养学生动手实践能力，强调软件与硬件融合，建有含多类型可调资源的离并网实验系统，

  欢迎报考

  电气工程（专硕）/控制科学与工程（学硕/专硕）

  同学

  🥕🥕🥕加入实验室。

  联系方式：liu7y@foxmail.com

