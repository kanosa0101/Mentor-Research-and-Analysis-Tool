bio_raw: '个人简介

  赵逸云，博士，中南大学自动化学院讲师。2017年6月本科毕业于西北工业大学自动化学院电气工程及其自动化专业，同年9月于西北工业大学自动化学院电气工程专业直接攻读博士学位。2024年6月获得工学博士学位。2024年8月，以讲师加入中南大学自动化学院。主要从事复杂系统智能控制与优化、飞行器全电式自主刹车控制技术、航空电机智能控制与测试技术等方面研究。发表（录用）IEEE
  汇刊、自动化学报（英文版）等国内外权威SCI/EI检索论文30余篇，其中以第一/通讯作者发表SCI检索期刊论文10余篇，EI检索论文5篇；申请国家发明专利10余项，授权6项。现为IEEE会员、中国自动化学会会员、中国自动化学会无人飞行器自主控制专业委员会委员、中国自动化学会计算智能及其应用专业委员会委员等，并受邀担任国内外权威期刊IEEE
  汇刊、富兰克林学报、IET控制理论与应用、控制理论与应用等期刊的审稿人。作为负责人主持国家自然科学基金青年科学基金项目(C类)、国防科研院所委托项目等，作为技术骨干参与国家自然科学基金联合基金重点项目、国家级J口纵向重点项目及国防科研院所型号研制等项目，相关成果已成功应用于多型号无人飞行器，并实现批量化工程应用。

  通讯地址：中南大学校本部民主楼116

  邮箱：zhaoyiyun@csu.edu.cn'
