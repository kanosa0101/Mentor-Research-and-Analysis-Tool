bio_raw: '个人简介

  刘剑锋，男，博士、博士后，中南大学自动化学院副教授，病理诊断人工智能湖南省工程研究中心主任，湖南省病理AI人工智能辅助诊断工程技术研究中心主任，

  从事机器人智能控制策略、计算机视觉与机器学习、数字信号及图像处理等方面的研究，主要研究

  课题均

  来源于现场的实际应用需求，

  绝大部分的项目研究成果都已经在工业现场

  获得了

  大规模落地

  推广

  应用

  。

  主持国家自然科学基金项目、国家重点研发计划子课题、湖南省自然科学基金、教育部博士点基金等省部级科研项目十余项，获授权发明专利20余项；在ICCV、NeurIPS等国际顶级会议和IEEE
  Trans. on Industrial Informatics (TII)、Journal of Advanced Computational Intelligence
  and Intelligent Informatics、Pattern Recognition、IEEE Journal of Biomedical and Health
  Informatics、IEEE/ACM Transactions on Computational Biology and Bioinformatics、Signal
  Processing、Neurocomputing等权威期刊上发表论文60余篇。担任IEEE Transactions on Image Processing、IEEE
  Transactions on Medical Imaging、IEEE Transactions on Cybernetics、AAAI、BMVC、 Signal
  Processing、Neurocomputing、Computer Methods and Programs in Biomedicine、自动化学报、电子学报等期刊/会议审稿人。

  承担《数字信号处理》、《计算机视觉》、《深度学习技术》、《微型计算机系统》等本科生课程和《数字图像处理及应用》等研究生课程的教学工作。

  目前主要研究领域包括先进机器人智能控制策略、机器视觉、目标检测、图像语义/实例分割、人工智能辅助筛查与诊断、智能机器人协同控制等方面的研究与应用。

  常年招生，欢迎对多模态学习、计算机视觉、生物图像分析处理

  、

  智慧医疗、智能机器人等方面具有浓厚兴趣的优秀同学加入研究团队！ (Email: ljf@csu.edu.cn;  QQ：357355453;  Mobile/WeChat:
  13875853239 )

  组内论文分享: Paper-Reading-Group'
