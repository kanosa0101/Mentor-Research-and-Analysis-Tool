bio_raw: '个人简介

  年晓红，男，1965年生，博士，二级教授，博士生导师。一直从事控制理论与应用相关研究工作，在多智能体系统的分布式学习与优化、分布式控制、分布式博弈、多智能体强化学习、大规模集群对抗、无人系统的分布式控制、电力系统的协调控制与优化、复杂系统的故障诊断与容错控制、工业过程控制与优化、集群无人系统的设计等方面取得了丰硕的研究成果，主持国家自然科学基金项目、国家科技支撑计划项目、湖南省自然科学基金、湖南省科技计划项目、博士点基金等省部级以上项目十多项，在《IEEE
  Transactions on Industrial Electronics》、《IEEE Transactions on Neural Networks and
  Learning Systems》、《IEEE Transactions on Industrial Informatics》、《IEEE Transactions
  on Cybernetics》、《Automatica》、《自动化学报》、《控制理论与应用》、《控制与决策》、《中国电机工程学报》等国内外高水平学术期刊上发表论文百余篇，被SCI/EI收录200多篇。'
institutes:
- 自动化科学与技术系
research_direction_raw: '[1]  多智能体系统分布式优化与博弈、[2]  多智能体系统的分布式学习、[3]  无人集群系统的分布式协同与优化控制、[4]  复杂多集群网络的分布式智能决策、[5]  非良性环境下无人集群系统的安全控制、[6]  虚拟现实仿真'
