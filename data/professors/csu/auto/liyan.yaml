bio_raw: 黎燕，博士，副教授，研究生导师。member of IEEE，中国电源学会第九届标准化工作委员会委员，中国电源学会电气女科学家工作委员会委员，湖南省电工技术学会理事。湖南大学电气科学与工程学院电气工程获得博士后，美国伊利诺伊理工大学的访问学者。是多个国内外知名期刊和高级别国际学术会议审稿人。主持了国家自然科学基金、湖南省自然科学基金等纵向项目，作为技术骨干参与了国家重点研发计划课题、湖南省科技重大专项、国家电网横向项目等多个项目。获得中国机械工业科学技术奖特等奖。在国内外知名刊物和高级别国际国内学术会议上发表了论文70多篇，出版教材2本，作为第一发明人授权发明专利12项。
research_direction_raw: 微电网控制技术，容错技术，电力电子技术，智能控制
