bio_raw: '个人简介

  罗彪，教授、博士生导

  师、国家自科青年项目A类（国家杰青）、

  国家自科青年项目B类（

  国家优青）

  、湖南省科技

  创新领军人才、湖南省杰

  青

  、

  IEEE Senior Member

  、

  2015

  年中国自动化学会优秀博士论文获得者。近年来在IEEE TPAMI、IEEE TNNLS、IEEE TCYB、Automatica、AAAI、ICML、自动化学报等学术期刊与会议上发表学术论文100余篇。

  2014-2018

  年在中国科学院自动化研究所任助理研究员、副研究员。现担任中国自动化学会（

  CAA

  ）自适应动态规划与强化学习专业委员会副主任；现（曾）担任国际期刊

  《

  IEEE Transactions on Neural Networks and Learning Systems

  》

  、

  《

  IE

  EE Transactions on Emerging Topics in Computational Intelligence

  》

  、

  《

  Artificial Intelligence Review

  》

  、

  《

  Neurocomputing

  》

  与《

  Journal of Industrial & Management Optimization

  》的

  Associate Editor

  。

  研究方向：

  具身智能、无人机

  /

  机器人软硬件研发、

  智能控制

  /

  决策

  /

  博弈、

  群体协作/对抗博弈、

  深度学习、强化学习、金融

  量化交易

  等

  我们的部分科研设备：

  Autolabor Pro 3 两台

  http://www.autolabor.com.cn

  招生：

  -欢迎

  热爱学术、立志投身科研，向往发表高水平学术论文

  ，具有良好数学、英文和编程能力的相关专业学生报考我的研究生和博士生！

  -长期招收相关研究方向的

  博士后

  ，欢迎联系!

  相关研究参考资源：

  TensorFlow

  OpenAI

  机器人算法与研究：

  http://www.autolabor.com.cn

  DeepMind

  CHAI at UC Berkeley

  RL&AI (ualberta.ca)

  RL at Microsoft Research'
