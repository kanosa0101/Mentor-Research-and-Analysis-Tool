bio_raw: '个人简介

  陈溅来，男，1990年11月出生，博士，中南大学自动化学院 教授/博士研究生导师，研究方向为

  雷达信号与图像的智能化处理与应用相关研究

  。2013年本科毕业于西安电子科技大学电子信息工程专业，2018年博士毕业于西安电子科技大学雷达信号处理国家重点实验室。

  2022年入选中国科协青年人才托举工程（国拨经费，中国电子学会口）

  。

  担任《IEEE JSTARS》期刊和《IEEE JMASS》期刊副主编。

  主持国家自然科学基金面上项目、国家自然科学基金青年项目、国家重点研发计划子课题等项目/课题20余项。在国内外高水平学术期刊发表论文60余篇，以第一作者（含通讯）发表SCI论文40余篇（IEEE
  Trans. 13篇，ESI前1‰1篇、ESI前1％5篇），Google引用近2000次，单篇引用最高150余次，h指数23。授权国家发明专利10余项，合著专著2部。

  曾

  获

  IEEE Transactions Prize Paper Award (全球每年仅1名，IEEE颁发)

  曾受邀在国际学术会议 CISS 2023 作大会报告

  、在《雷达学报》创刊10 周年学术研讨会做主题报告、在中国电磁频谱学术年会作分会场报告、在第八届高分对地观测年会作口头报告等。曾获2019年度中国电子教育学会优秀博士论文（提名奖）、2020年度陕西省优秀博士学位论文、2022年度雷达未来之星。担任《电子与信息学报》和《雷达学报》编委。

  主要研究方向：

  雷达信号与图像的智能化处理与应用，

  聚焦

  雷达图像智能识别、

  雷达超高分辨成像

  、雷达干涉测绘等

  。

  每年招生名额：

  博士研究生1-2名（含本博拔尖计划），硕士研究生2-3名，欢迎报考！

  研究生待遇：

  在本课题组内学习的同学除了可以获得国家级和校级各种奖学金外，本课题组还向积极努力参加科研项目的同学发放研究生助研津贴。

  博士研究生三助津贴：

  3000

  -5000元/月（学校部分除外）

  硕士研究生三助津贴：

  1300-1500元/月（学校部分除外）

  教育经历：

  [1]   2013.8-2018.6

  西安电子科技大学  |  信号与信息处理  |  博士学位  |  博士研究生毕业

  [2]   2009.8-2013.7

  西安电子科技大学  |  电子信息工程  |  学士学位  |  大学本科毕业

  主要荣誉：

  1.2024 Transactions Prize Paper Award (IEEE颁发，全球每年仅1名)

  2.2024年中国海洋工程咨询协会技术发明二等奖

  3.2022年首届雷达未来之星（全国仅10位，排名第2）

  4.2020年度陕西省优秀博士学位论文

  5.2019年度中国电子教育学会优秀博士论文（提名奖）

  6.2022年高分辨率对地观测年会优秀论文奖（排1）

  联系方式

  邮箱： jianlaichen(@)163.com

  团队名称：

  雷达信号与图像的智能化处理与应用

  团队介绍：

  目前在读博士生3人（均为直博生），在读硕士研究生6人。

  研究生代表：

  “中南大学本博拔尖计划入选者”熊蓉琪博士，

  博士入学前发表了

  3篇

  顶级SCI期刊论文，

  包括IEEE GRS Magazine （IF=16.2,中科院1区Top）1篇、

  IEEE Transactions on GRS

  （IF=7.5,中科院1区Top）

  论文1篇、

  IEEE GRS Letters（中科院2区Top）论文1篇

  。

  指导研究生毕业去向：

  金养昊博士入职顶

  级211高校副教授（西安电子科技大学）

  ，硕转博三人（熊毅-中南，李萌亮-哈工大，朱钰灿-中南），其余研究生均进入了企事业单位工作。'
