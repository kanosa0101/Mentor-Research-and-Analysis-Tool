bio_raw: '个人简介

  王雅琳，女，中南大学教授，博士生导师/硕士生导师，自动化学院院长。

  入选国家级领军人才、国务院政府特殊津贴专家、教育部新世纪优秀人才、中国自动化学会会士、科睿唯安“全球高被引科学家”等，是湖南省自然科学创新研究群体负责人、湖南省科技创新团队负责人、湖南省研究生优秀教学团队负责人。

  主持国家重点研发计划项目、国家科技重大专项课题、国家自然科学基金重大项目课题/重大研究计划重点支持项目/联合基金重点支持项目、教育部学科突破先导项目课题、校企合作重点项目等。发表高水平论文200余篇，授权发明专利50余件。

  兼任工业智能与系统教育部重点实验室副主任、IFAC Industry Committee委员、中国人工智能学会自主无人系统专委会副主任委员、中国自动化学会技术过程的故障诊断与安全性专委会副主任委员、湖南省自动化学会常委副理事长等职。

  科研方面曾获国家科技进步二等奖、国家技术发明二等奖、湖南省科学技术创新团队奖、湖南省技术发明一等奖、湖南省自然科学一等奖等。

  教学方面曾获国家教学成果二等奖2项、湖南省高等教育教学成果特等奖/一等奖/二等奖、中国有色金属学会高等教育教学成果特等奖、中国自动化学会高等教育教学成果一等奖等。

  主要研究方向：

  1.

  工业人工智能基础理论方法

  ：

  研究深度学习、强化学习、多模态学习、可信人工智能与大模型智能体等方法，面向复杂工业过程开展智能感知与优化调控研究。

  2.

  自主无人系统与具身智能

  ：

  研究多模态感知、空间智能、世界模型与自主决策等技术，探索机器人和无人系统在复杂环境中的自主学习、智能交互与协同控制。

  3.

  脑机接口与神经智能

  ：

  研究脑电与多模态神经信号解析、神经信息解码和脑机接口技术，探索人工智能在脑认知、精神健康与人机协同中的应用。

  课题组长期招收博士后、科研助理，全力协助申请各类研究基金，支持博士后个人发展！

  课题组氛围融洽，欢迎自驱力较强的攻读硕/博士的学生加入课题组，及部分学有余力的优秀本科生！

  欢迎具有自动化、电子信息、人工智能、计算机、数学、通信、工业互联网、大数据分析等相关学科背景，以及对智能系统与交叉研究感兴趣的同学联系。

  联系邮箱：ylwang@csu.edu.cn'
