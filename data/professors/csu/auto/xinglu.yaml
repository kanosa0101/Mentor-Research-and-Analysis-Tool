bio_raw: '个人简介

  博士，副教授，硕士生导师，

  湖南省湖湘青年英才（荷尖人才），

  现依托

  桂卫华院士、桂瑰教授

  智能交通团队开展科研工作。

  本科毕业于东南大学交通学院，保研直博为东南大学与美国中佛罗里达大学联合培养博士（导师：何杰教授、Mohamed Abdel-Aty教授），清华大学自动化系博士后&助理研究员（合作导师：姚丹亚教授、张毅教授、裴欣副教授、封硕

  副教授

  ）。

  2025年2月进入中南大学，自动化学院任教。

  获得湖南省“三尖”创新人才工程项目，是智能与系统教育部重点实验室、交通系统智能控制与安全运维湖南省重点实验室、智能交通与车路协同湖南省重点实验室骨干成员。担任中国自动化学会会员（综合交通专委会&青年工作委员会委员）；交通领域女科学家论坛创始人；中国交通运输协会青年科技工作者工作委员会委员；中国人工智能学会会员（智能交通专业委员会委员）、世界交通运输大会技术委员会青年委员等，多个期刊青年编委，《IEEE
  Intelligent Transportation Systems Transactions》《IEEE Transactions on Vehicular
  Technology》《Transportation Research Part A: Policy and Practice》《Accident Analysis
  and prevention》《中国公路学报》《IEEE Transactions on Intelligent Transportation Systems 》等国内外权威期刊审稿人。

  主要研究方向：

  自动驾驶智能决策：

  传统预测-决策-规划-控制、基于世界模型与推理大模型的智能驾驶决策与规划、端到端自动驾驶技术；

  交通场景理解与风险生成：

  高风险与对抗场景的加速生成、基于大模型的场景语义理解、场景库自动化构建与标注；

  自动驾驶加速测试：

  可扩展虚实结合测试环境搭建、基于对抗场景的自动驾驶/无人系统加速测试；

  矿区无人系统：

  矿区复杂环境感知与建图、矿区无人驾驶矿卡协同控制、矿区车辆协同与动态调度优化；

  重卡及特殊车辆智能管控：

  针对重载及特殊车型动力学、运动学特性，研发专用智能决策与控制算法；

  复杂交通系统仿真建模与态势推演：

  多交通主体交互建模、多级别混合交通流微观建模、动态交通环境下的态势演化推演与风险态势预测；

  车路协同智能管控：

  面向CAV和HDV混合流协同管控、粒流协同管控；

  低空空域无人机路径规划：

  面向动态环境建模的无人机路径规划、空地协同等。

  近年来出版学术专著1部（独著），共发表SCI/SSCI/EI学术论文50余篇，Google总引1574次，单篇最高被引288次，一作单篇最高被引155次。申请国家发明专利60余项，其中第一发明人28项（授权17项），软著12项。

  近5年主持2项国家级项目、1项湖南省“三尖”创新人才工程项目、1项教育部人文社科项目、多项省级科研项目（省十大技术攻关、省重点研发、省自科面上、省自科青年、省教育厅优青项目）、2项国家或行业重点实验室科研项目，3项校级/校企联合科研项目。参与完成国家级/省部级项目15余项，包含中国工程院战略研究与咨询项目、国家重点研发计划项目、国家自然科学基金面上项目、科技创新2030“新一代人工智能(2030)”重大项目等。

  基于多个项目的依托，研究成果在京雄高速、长益高速、金川矿山、三一智能重卡等重大项目中落地应用推广，也在IEEE ITSC、TRB、COTA、WTC、HKSTS等国际顶级会议上多次宣讲，共获得5项科技奖项，包含：中国公路学会科学技术奖一等奖1项，中国交通运输协会科学技术奖二等奖1项，中国公路建设行业协会科学技术奖二等奖1项，中国产学研合作促进会产学研合作创新与促进奖优秀奖1项，湖南省交通工程学会科学技术奖科技团体奖特等奖1项。

  教学方面，

  曾获校级优秀教师、校级优秀班主任等荣誉，主持1项省级重点教改项目（结题优秀），1项校级教改项目，发表5篇教研教改论文。获得1项湖南省教育教学成果奖一等奖，1项校级本科教育教学成果奖一等奖。参与教育部新工科项目、“交通运输”国家级一流本科专业建设、“道路工程智能建养课程群虚拟教研室”国家级虚拟教研室建设、课程思政示范课程和金课建设等重要教研工作。

  学生培养方面

  ，指导本科生参加学科竞赛，获批国家级、省级大学生创新创业训练计划项目立项，并发表论文、授权专利及软著。着力提升研究生科研素养，指导其多次参加国际顶级会议并做报告、发表高水平论文，并获得国家奖学金资助。

  【招生信息】

  2026年招生计划：团队还有1-3名额，欢迎联系。（AI+智能交通方向，欢迎士兵计划、少数民族骨干计划），有自动化、交通工程、车辆工程、通信、计算机、人工智能等专业背景的优先。

  欢迎本科生提前入组学习，将提供定制化研究计划支持

  、学术指导 、职业规划。'
