bio_raw: '个人简介

  蒋朝辉，男，中南大学教授，博士生导师，长江学者特聘教授，湖南省科技创新领军人才。现任自动化科学与技术系主任、有色冶金自动化教育部工程研究中心副主任，主要从事视觉检测与智能感知、图像处理与模式识别、人工智能与机器学习等方面的教学科研工作。担任中国图象图形学学会理事、中国自动化学会应用专业委员会副主任委员、中国自动化学会过程控制专业委员会委员、湖南省自动化学会副理事长。主持国家重大科研仪器研制项目、国家科技重大专项课题、

  工信部工业互联网创新发展工程项目、国家自然科学基金面上项目以及校企合作项目30余项，出版专著1部，在IEEE

  汇

  刊、IFAC旗舰会刊、CCF A类会议等发表高水平论文100余篇，授权国家发明专利70件，获省部级/国家一级学会科技特等奖/一等奖5项，获第九届中国自动化学会青年科学家、第十三届发明创业奖人物奖等荣誉称号。

  教学方面

  获评国家级一流本科课程 1 门；荣获湖南省研究生高等教育教学成果特等奖、中国自动化学会教学成果一等奖各 1 项，湖南省高等教育教学成果二等奖 2 项、中国有色金属学会高等教育教学成果二等奖
  1 项；获校级教学成果一等奖 3 项、创新教学设计大赛一等奖 2 项。牵头建成湖南省研究生精品示范课程 1 门、省级专业学位优秀教学案例 1 项。主讲并负责的课程《数字信号处理》，获评校级课程思政示范课程，个人获评课程思政示范教师，所属团队入选示范教学团队。

  诚纳英才，携手共进！

  诚邀优秀博士、硕士及本科学子加盟本课题组。

  研究方向涵盖

  视觉检测与智能感知、图像处理与模式识别、人工智能与机器学习

  等相关领域。

  团队科研底蕴深厚，氛围轻松融洽，平台资源充足，助力科研成长与职业发展，热忱期待有志青年共聚于此，并肩求索！'
