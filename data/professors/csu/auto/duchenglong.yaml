bio_raw: '个人简介

  杜城龙，

  中南大学特聘副教授、博士生导师，

  入选人社部博新人才、湖南省优青

  。本科毕业于哈尔滨工业大学自动化专业，博士毕业于中南大学控制科学与工程专业（硕博连读），师从

  阳春华教授、李繁飙教授

  ，曾在加拿大维多利亚大学机械工程系博士联合培养2年，师从加拿大皇家科学院、工程院

  施阳（Yang Shi）院士

  ，

  入选中国自动化学会优秀博士学位论文(

  一等

  )、中南大学优秀博士学位论文，

  博士毕业后在中南大学从事博士后研究工作2年，合作导师中国工程院

  桂卫华院士

  ，目前是中南大学自动化学院特聘副教授。研究方向包括

  控制理论、

  多智能体

  强化学习

  、分布式控制与优化

  、

  智慧交通能源一体化、

  低空飞行安全管控、大飞机起降控制技术等

  ，在自动控制、航空、机电、能源领域的

  国际顶级期刊发表论文30余篇，其中IEEE TAC、Automatica论文5篇，其他IEEE Trans 顶刊论文20

  余

  篇，4篇入选ESI高被引论文（2篇热点论文），申请国家发明专利10项（授权6项），研究成果获湖南省自然科学奖一等奖1项，中国自动化学会自然科学奖一等奖1项，湖南省自然科学优秀论文奖1项。

  主持国家自然科学基金重点项目课题/青年项目、湖南省自然科学基金优秀青年项目等8项，参与国家自然科学基金重大项目/重大仪器项目/重点项目、科技部科技创新2030-“新一代人工智能”重大项目(课题)、湖南省科技创新重大专项等7项。中国自动化学会高级会员，

  现任

  中国自动化学会无人飞行器自主控制专业委员会/智能探测与控制专业委员会/青年工作委员会、

  中国人工智能学会青年工作委员会、

  中国指挥与控制学会智能控制与系统专业委员会、中国仿真学会仿真技术应用专业委员会委员，《自动化学报》“低空飞行理论与技术”专刊客座编委，

  JCR 2区期刊 Electronics“Multi-UAV Systems and Mobile Robots”专刊客座编委，

  《信息与控制》《工况自动化》

  《智能安全》青年编委

  。欢迎编程能力强、勤奋踏实的优质学生报考研究生（目前还有名额，欢迎提前咨询），招收学有余力本科生加入课题组。

  站点收藏：

  谷歌学术Google scholar：https://scholar.google.com/citations?user=mmv7ba0AAAAJ&hl=zh-CN

  研究之门Researchgate：https://www.researchgate.net/profile/Chenglong-Du

