bio_raw: '个人简介

  本人2004年本科毕业于天津大学，2010年于曼彻斯特大学获得博士学位，2011年4月加入中南大学信息学院工作，2017年9月获评为副教授，本人的研究方向包括系统辨识、目标定位和运动分析，欢迎有志之士咨询报考。'
institutes:
- 人工智能系
research_direction_raw: '[1]  研究方向包括：1）系统辨识，即利用统计学方法根据黑箱动态系统的输入和输出进行建模；2）目标定位，即通过角度、距离等传感器所得的信息对目标对象的位置进行估计。'
