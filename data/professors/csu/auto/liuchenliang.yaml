bio_raw: '个人简介

  刘晨亮，男，中南大学副教授，硕士生导师，博士毕业于中南大学（导师：王雅琳教授），曾赴新加坡南洋理工大学访学。入选长沙市杰出青年科技人才培养计划。

  主持国家自然科学基金青年科学基金项目、国家科技重大专项子课题、湖南省自然科学基金青年基金项目、校企合作重点项目等8项，作为技术骨干参与国家重点研发计划项目、国家科技重大专项、国家自然科学基金重大研究计划重点项目等。

  在IEEE Trans.、IFAC旗舰期刊、CCF A类会议等发表高水平论文60余篇，

  5篇入选

  ESI 1％高被引论文，谷歌学术引用1400余次，授权国家发明专利20余项。

  曾获有色金属工业科学技术一等奖、中国自动化学会自然科学二等奖、湖南省人工智能学会人工智能科学一等奖、湖南省优秀毕业生、湖南省“芙蓉学子”学术科研奖、中南大学优秀博士学位论文、中南大学优秀毕业生、中南大学大学生年度人物等。

  兼任中国人工智能学会自主无人系统专委会副秘书长、IEEE-IES数据驱动控制与监测技术委员会委员、中国仿真学会复杂系统建模与仿真专业委员会委员等和《Digital
  Twins and Applications》、《Journal of Engineering》、《AI Agent》、《人工智能与创新》、《中南大学学报（英文版）》、《Algorithms》等期刊编委/青年编委。

  主要研究方向：

  1. 人工智能基础理论方法：

  研究深度学习、强化学习、多模态学习、迁移学习、可信人工智能与大模型智能体等前沿方法，探索机器如何从复杂数据中学习、推理和决策。

  2. 人工智能 + 工业过程：

  面向智能制造和流程工业，研究工业数据智能感知、关键指标预测、生产过程优化与智能控制，让人工智能真正走进工厂、服务工程现场。

  3. 人工智能 + 医学健康：

  面向医学影像、精神疾病诊断和健康风险评估，研究医学数据智能处理与疾病辅助诊断方法，探索人工智能服务生命健康的新路径。

  课题组长期招收博士后、科研助理，全力协助申请各类研究基金，支持博士后个人发展！

  课题组氛围融洽，欢迎

  自驱力较强

  的的攻读硕/博士（2027年保研）的学生加入课题组

  ，及部分学有余力的优秀本科生！

  相关学科和研究领域包括但不限于：自动化、控制、计算机、数学、通信、工业互联网、人工智能、大数据分析等。

  课题组负责人：

  王雅琳老师

  ，教授/博士生导师

  课题组联系人：刘晨亮，

  联系邮箱：lcliang@csu.edu.cn'
