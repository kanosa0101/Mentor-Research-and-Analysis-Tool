bio_raw: '个人简介

  黄志武，男，中南大学控制科学与工程专业博士。现为中南大学自动化学院教授，博士生导师，是国家重点学科交通信息工程及控制的学术带头人，任

  轨道车辆制动技术湖南省工程实验室专家委员会委员

  ，是湖南省首批新世纪121人才工程培养对象。2008年4月至2009年4月国家公派在英国Essex大学做访问学者一年。长期从事智能交通网络通信与安全控制、新能源混合能源管理、交通大数据与机器学习、信息物理融合系统(CPS)的协同控制与优化、智能移动机器人等方向的深入研究。

  多年来与中国铁路总公司和中车集团密切合作，联合组建了轨道车辆制动技术湖南省工程实验室。主动对接轨道交通安全领域国家重大需求，紧盯国际前沿、构筑高水平创新平台。研制出列车控制通信网络系统、网络化故障诊断等关键设备，打破国外技术垄断，实现自主知识产权成果转化。先后主持完成国家自然科学基金项目、国家863计划项目、高等学校博士学科点专项科研基金资助课题（博士生导师类）、省部级部重点科技项目、湖南省重点科技攻关项目和工业应用科研项目80余项。获得湖南省科技进步一等奖1项，湖南省科技进步三等奖2项。取得授权发明专利8项，受理发明专利30项，获得软件著作权18项。以世界上第一条应用4G移动宽带技术LTE-R的重载铁路——朔黄铁路上运行的重载组合列车操控为研究背景，采用协同控制、非线性系统理论和博弈优化等理论和方法研究重载组合列车异步操控，为开行超长编组、高效、绿色的重载组合列车提供有效的控制和优化解决方案。将多智能体理论和故障诊断技术有机结合解决了多故障并发、耦合、时变等故障诊断问题，提出了一种基于多智能体的层次型重载组合列车同步操控系统的分布式多故障诊断解决方案。

  主持和承担的主要科研项目：

  1.主持国家自然科学基金面上项目，项目名称：软件定义云服务网络的大规模混合人在环CPS架构研究，项目时间：2017.1-2020.12

  2.主持国家自然科学基金面上项目，项目名称：变结构多故障系统中多智能体动态联盟的分布式诊断， 项目时间：2011.1-2013.12

  3.承担国家自然科学基金面上项目，项目名称：融合深度学习与智能推理的高速列车制动系统安全评估，项目时间：2019.1-2022.12

  4.主持铁道部重大课题，项目名称：“机车车辆关键技术自主创新深化研究??机车制动系统技术和应用研究”的子课题“制动控制单元”，项目时间：2013.1-2015.12

  5.主持铁道部科技计划，项目名称：“大秦线-重载组合列车机车制动系统与同步控制系统适用研究”的子项“制动控制单元 BCU的研制”，项目时间：2009.1-2011.12

  6.主持高等学校博士点（博导类）基金项目，项目名称：智能交通网络信号控制系统的协同分布式优化方法研究，项目时间：2012.1-2014.12

  7.主持校企重大合作项目，项目名称：重载组合列车紧急制动有效控制对策的深化研究，项目时间：2013.7-2016.12

  8.主持校企重大合作项目，项目名称：有线电控空气制动（ECP）系统技术开发，项目时间：2014.1-2015.12

  9.主持校企重大合作项目，项目名称：四类MVB网关研制，项目时间：2012.3-2014.12

  10.主持校企重大合作项目，项目名称：DJ1 型电力机车网络控制故障诊断专家系统的研制，项目时间：2012.1-2013.12

  11.主持校企重大合作项目，项目名称：重载组合列车紧急制动风管排风监测装置，项目时间：2011.8-2012.12

  12.主持校企重大合作项目，项目名称：基于 Lonworks 网络的 CCBII 制动机控制系统故障诊断测试装置，项目时间：2011.1-2012.12

