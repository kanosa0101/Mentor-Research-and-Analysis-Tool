bio_raw: '个人简介

  廖宇新，男，湖南长沙人，工学博士，教授，博士生导师。

  主要从事飞行器智能自主控制，空天运载器轨迹规划、制导和控制等方向的研究。主持国家自然科学基金、其他国家级项目、

  湖南省

  自然科学基金、

  教育部重点实验室基金、其他横向课题等，参与国自科重大研究计划重点项目、国家重点研发计划青年科学家项目等20余项科研项目；在国内外学术期刊和会议发表论文40余篇，其中SCI检索20余篇；授权专利20余项；获湖南省科学技术进步奖二等奖1项、中国发明协会发明创业奖创新奖二等奖1项，担任中国自动化学会空间及运动体控制专业委员会委员、中国指挥与控制学会智能控制与系统专业委员会委员、中国人工智能学会自主无人系统专业委员会委员，《International
  Journal of Micro Air Vehicles》、《无人系统技术》、《空天技术》青年编委，国内外多个学术期刊审稿人；

  入选中国科协青年人才托举工程，湖南省芙蓉计划科技创新类青年人才项目。'
