bio_raw: '个人简介

  周盛超，男，中南大学自动化学院副教授，人工智能系，硕士生导师。2016年在中国科学技术大学获博士学位，2009年在南京理工大学获学士学位。2014年8月至2015年12月，由国家留学基金委资助，在美国田纳西大学工业与系统工程系进行博士联合培养。

  主要研究方向包括复杂制造过程建模、调度与优化、智能优化方法与应用、切割与装填问题、大数据等。目前，已发表学术论文30余篇。其中，在SCI期刊发表论文20篇，包括IEEE
  Transactions、Energy、Applied Mathematical Modelling、COR、IJPE等国际重要期刊。获2015年美国工业工程年会（ISERC）最佳论文奖，2016年安徽省优秀博士毕业生，2014年中国科学院院长奖等。担任十余个国际期刊审稿人，中国仿真学会智能仿真优化与调度专委会委员。

  主持国家自科基金、湖南省自科基金、湖南省教育厅科研项目等课题，参与国家级、省部级、以及横向科研项目多项。

  研究方向

  [1] 复杂制造过程建模、调度与优化

  [2] 智能优化方法与应用

  [3] 图像处理与模式识别

  [4] 切割与装填问题（Cutting & Packing）

  [5] 智能物流

  [6] 大数据

  招生意向：每年招3名硕士生；同时也欢迎本科生参与科研项目和创新创业项目，欢迎有志于读研和出国的本科生联系。'
