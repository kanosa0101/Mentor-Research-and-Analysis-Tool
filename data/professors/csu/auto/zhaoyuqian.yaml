bio_raw: '个人简介

  赵于前，博士，教授，博士生导师，2013年入选教育部“新世纪优秀人才”支持计划。1997年6月本科毕业于中南工业大学(现中南大学)应用地球物理专业，2002年4月硕士毕业于中南大学控制理论与控制工程专业，2006年5月博士毕业于中南大学计算机应用技术专业。2007年5月-2009年7月，中南大学信息学院从事博士后研究，2009年7月-2010年7月，美国新泽西理工大学从事博士后研究，2012年7月-2015年9月，先进储能材料国家工程研究中心从事博士后研究；2015年1月-2015年2月，法国里昂中央理工大学高级访问学者。2004年入选湖南省高等学校青年骨干教师培养对象，2006年9月被评为副教授，2012年9月被评为教授。2002年5月-2006年6月，中南大学生物医学工程研究所副所长，2005年12月-2010年10月，中南大学信息物理工程学院副院长，现任

  中南大学自动化学院人工智能系书记，

  湖南省高强度紧固件智能制造工程技术研究中心主任，湖南省机器视觉与智慧医疗工程技术研究中心副主任，湖南省人工智能学会常务理事；中国计算机学会计算机视觉专委会委员，中国自动化学会模式识别与机器智能专委会委员、混合智能专委会委员，中国图象图形学会视觉大数据专委会委员、三维视觉专委会委员，中国生物医学工程学会生物医学信息与控制分会委员，中国人工智能学会智慧医疗专委会委员。

  主要研究领域为智能感知与智能系统、

  具身智能与机器人、

  自动驾驶、智慧医疗、数字孪生、计算机视觉、机器学习、图像处理、模式识别、表面检测等，已发表学术论文100余篇，被SCI检索70余篇；已申请国家发明专利60项，授权47项，实用新型专利3项，软件著作权17项。主持国家级和省部级科研项目20余项，企业合作项目20余项。获得省部级科技奖励一等奖4项，二等奖4项。

  博士招生学科（一级学科）：控制科学与工程（081100），智能科学与技术（140500），电子信息（085400，工程博士）'
