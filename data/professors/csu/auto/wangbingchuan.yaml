bio_raw: '个人简介

  王冰川，江西高安人， 博士，副教授，博士生导师，IEEE Senior Member；2013年和2016年分别本科和硕士毕业于中南大学信息科学与工程学院，2019年博士毕业于香港城市大学系统工程与工程管理系；获湖南省自然科学二等奖
  (2021，2/4)；主持国家自然科学基金2项

  （青年项目、面上项目）

  ，

  湖南省自然科学基金2项（青年项目、优秀青年项目），全国重点实验室/

  教育部重点实验室开放课题1项；参与香港政府GRF项目2项，区域创新联合发展基金重点项目1项，国家重点研发计划课题1项；以第一/通讯作者发表JCR1区论文30余篇，授权国家发明专利7项；入选2026年全球前2%顶尖科学家榜单（World''s
  Top 2% Scientists）年度科学影响力排行榜，担任湖南省系统仿真协会副理事长，湖南省人工智能学会理事，国家自然科学基金通讯评审专家，教育部学位论文通讯评审专家，教育部第五轮学科评估通讯评审专家，

  广东省科技厅通讯评审专家，中国石油创新基金评审专家，知网评审专家；《Machine Intelligence Research》《Robot Learning》青年编委，IEEE
  SMC会议Associate Editor，IEEE TPAMI, T-ASE, TEVC, TFS, TNNLS, TIE, TCYB, TMECH, TSMCA,
  TKDE, TMECH, TPEL, TII, TETCI, TVT, TTE, TITS, TSTE, TAI, TSG, TIM, TICPS, Information
  Sciences, Swarm and Evolutionary Computation, Neural Networks, Applied Soft Computing,
  Information Fusion, Applied Energy, Journal of Power Sources, Applied Thermal Engineering,
  Energy, Journal of Energy Storage, Journal of The Electrochemical Society, ACS Applied
  Materials & Interfaces, Computers and Chemical Engineering, Journal of Intelligent
  Manufacturing, Applied Mathematical Modelling等期刊审稿人；

  本课题组聚焦

  AI for Science 与智能工程系统

  前沿交叉研究，致力于探索机理驱动与数据驱动深度融合的下一代人工智能方法，重点开展以下方向：

  1. AI for Science：偏微分方程智能求解与应用

  研究基于

  Transformer、神经算子、扩散模型及科学大模型

  的偏微分方程智能求解方法，探索物理机理与数据驱动模型的深度融合。重点面向复杂流场、能源动力及多物理场系统开展高效建模与科学计算。

  2. 新能源系统与智能电池管理

  面向新能源汽车与储能系统，研究

  电池状态估计、寿命预测、快速充电、热管理及故障诊断

  等智能算法。进一步探索融合物理知识与人工智能的电池领域大模型和智能决策方法。

  3. 智能算法云—边—端协同部署

  研究人工智能算法在云计算、边缘计算和嵌入式平台上的高效部署，重点开展

  模型轻量化、推理加速、异构计算及软硬件协同优化

  。实现复杂智能算法在实时、资源受限场景下的高效运行。

  4. 无人机与自主智能系统研发

  面向智能无人系统，研究

  自主感知、导航定位、路径规划、多机协同及飞行控制

  等关键技术。探索强化学习、大模型与智能 Agent 在无人机自主决策和复杂任务执行中的应用。

  课题组欢迎具有扎实

  数学基础、编程能力和工程实践能力

  的同学加入，尤其欢迎具有

  嵌入式系统、无人机、机器人及硬件开发基础

  的学生。课题组与香港城市大学、新加坡南洋理工大学等高校保持紧密合作，优秀学生可获得联合培养及海外交流深造的推荐。

  智能学习与优化实验室主页：

  https://intleo.csu.edu.cn/people.html

