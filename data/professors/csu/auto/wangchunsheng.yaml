bio_raw: 中南大学自动化学院副院长，博士，教授，博士生导师。1991、2004、2008年先后毕业于北方交通大学电力牵引与传动控制、西南交通大学电气工程和中南大学控制科学与工程专业，分获工学学士、硕士和博士学位。目前主要研究领域为：多载体能源网络建模优化与控制、能源管理与综合能源系统、人工智能与应用。
  担任中国电工技术学会电力电子专业委员会委员、湖南省电工技术学会理事及《Journal of Process Control》、《Computers & Education》、《自动化学报》、《控制理论与应用》等权威和重要学术期刊论文审稿人。近年来，先后主持承担国家自然科学基金、国家863计划课题、国家发改委重大科技专项以及企业委托开发实际工业应用项目15项。先后在《IEEE
  Transactions on Industrial Informatics》、《Industrial & Engineering Chemistry Research》、《Control
  Engineering Practice》、《Journal of Process Control》、《Neurocomputing》、《自动化学报》、《控制理论与应用》、《控制与决策》等国内外权威与重要学术期刊上发表被SCI&EI收录的高水平学术论文50余篇，获国家授权发明专利9项，申请国家发明专利5项，获软件著作权4项，出版专著1部。
  欢迎优秀本科生、研究生加入多载体能源网络控制团队！
research_direction_raw: 多载体能源网络建模优化与控制、能源管理与综合能源系统、人工智能与应用
