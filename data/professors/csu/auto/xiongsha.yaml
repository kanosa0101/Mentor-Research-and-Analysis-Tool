bio_raw: '个人简介

  熊莎，博士，硕导，中南大学自动化学院副教授，电子信息工程系副主任，光电信息工程中心光流控智能检测研究室主任。依托团队“光电信息工程中心”与“铁路信息技术工程研究所”（https://tlxxjsgc.csu.edu.cn/），“光电智能测控”湖南省重点实验室（http://oeimc.csu.edu.cn/）。

  2014年在新加坡南洋理工大学（Nanyang Technological University）获得电子与电气工程专业博士学位。2007-2008年在香港大学任研究助理，2013-2018年在南洋理工大学任研究员。2018年7月进入中南大学工作，任特聘副教授。先后主持国家自然科学基金项目、湖南省自然科学基金项目等国家级和省部级项目，参与国家自然科学基金重大项目和国家重大科研仪器研制项目。已出版学术专著1部，申请及授权发明专利10余项，在国内外学术期刊发表论文40余篇，部分成果刊载于Nature
  Communications(IF=15.7)、Science Advances(

  IF=12.5)

  、

  Sensors and Actuators B: Chemical

  (IF=7.7)、

  ACS Photonics(

  IF=7.1

  )、

  Lab on a Chip

  (IF=6.0)

  等国际知名期刊。在MNF、SIWW、ISMM、CAV、 ICMAT、IEEE MEMS等国际会议做口头报告。在IMCO、微流控技术应用创新论坛、微纳传感技术与检测创新论坛等国内外会议做邀请报告，担任

  IMCO

  国际会议

  指导委员会委员

  、

  IMCO

  执行议程主席及分会主席，担任Photonics期刊客座编辑，担任 Journal of Optical Microsystems 、Quantum Information
  Processing、Nano Letters、Microsystems & Nanoengineering、JOSA B、Optics Express、Optics
  Letters等期刊审稿人。指导省级大学生创新创业项目2项，其中1项被评为“创响中国”2021年中南大学大学生创新创业年会“优秀案例”。曾获“中南大学2021/2023/2024届本科优秀毕业设计(论文)”指导教师，“2019-2020学年优秀班导师”，“2023-2024学年研究生课堂教学质量优秀奖”等荣誉。

  课题组近期主要研究方向包括：

  人工智能水质评估、微型传感器与自动化检测仪器、生物检测芯片、以及片上集成光学器件

  。每年有研究生和本科生毕设指导指标，欢迎感兴趣的同学来信交流。课题组会根据学生科研兴趣和未来工作意向等制定专门的培养计划，提供良好的学习和实验环境，并适当提供学生助研津贴。可推荐优秀硕士、本科生到国内外高校进一步深造交流。

  往届毕业生主要去向为知名企业，如高通、比亚迪、潍柴动力、海信、上能电气、中车、中国电研、国家电网等，亦有学生选择继续攻读博士学位。

  每年有2-3名研究生招生名额，欢迎报考联系！

  电子邮箱：xiongsha@csu.edu.cn'
