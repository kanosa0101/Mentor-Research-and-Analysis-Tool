bio_raw: '个人简介

  中南大学自动化学院，讲师，2022-2024中南大学自动化学院博士后，硕士生导师。入选2022年博士后国际交流计划引进项目，主持国家基金委青年科学基金项目1项，参与科技部重点研发计划2项，在国内外高水平期刊和会议上发表论文10余篇。长期从事图机器学习、网络推理与分析、系统辨识、故障诊断、应用概率论和统计学习等领域的相关研究。'
