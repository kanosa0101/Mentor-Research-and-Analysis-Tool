bio_raw: '个人简介

  Personal Profile

  刘芳，教授，博导，早稻田大学博士，自动化系副书记。国家级高层次青年人才，获湖南省科技创新领军人才、湖南省杰出青年基金项目、湖南省湖湘青年英才计划、中南大学创新驱动人才计划、升华猎英计划。曾在东京富士电机控制技术部从事博士后研究，早稻田大学环境综合研究所任职研究员。

  研究方向：面向国家发展目标和能源重大需求，主要从事控制、电气、智能交叉学科研究，研究新能源电力系统稳定与控制，新能源发电技术，新型电力系统、分布式配电系统、信息物理系统；针对复杂系统和网络时滞等时滞相关鲁棒控制问题，开展时滞系统稳定，电网时滞影响，神经网络时滞，模糊系统时滞等方面的研究；研究成果主持国家级、省（部）级、企业等项目30项。在国际高水平学术期刊和国际高水平学术会议发表论文100多篇。出版中/英文著书4部、授权专利/软著20多项。

  智慧能源先进控制实验室长期招收控制科学与工程及电气工程专业的研究生，特别欢迎立志从事科研，打算硕士毕业后攻读博士学位或是海外深造的学生。课题组老师均具有海外留学经历，与美国，德国，日本，英国，俄罗斯，澳大利亚等大学开展了广泛的合作与交流活动。鼓励课题组学生多参加国际会议，扩展视野，表现优秀的研究生可以推荐海外联合培养或攻读博士学位。

  招生计划：

  1）每年招收博士研究生1-2名，硕士研究生3名

  2）欢迎有意愿本-博拔尖计划和保研学生联系

  3）联系方式：csuliufang@csu.edu.cn'
