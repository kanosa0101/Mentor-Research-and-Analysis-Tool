bio_raw: '个人简介

  李志勇，工学博士，中南大学自动化学院副教授，硕士生导师，瑞士联邦理工大学访问学者，曾入选湖南省121人才工程、获评湖南省青年骨干教师、铁道部茅以升铁路教育专项奖-教学奖。主持国家自科基金1项，省自科基金1项，铁道部专项基金1项，教育部留学归国科研项目1项，教育部中央高校科研前瞻项目1项，教育部协同育人项目2项，主持横向技术合作10余项。近年来，以第一作者或通信作者发表SCI、EI检索论文20余篇，授权发明专利2项，在新能源发电、电能质量控制、微电网、智慧医疗、机器视觉等研究方向上，部分成果已实施推广，曾获湖南省科技进步二等奖、三等奖各1项，有色工业科学技术二等奖1项，国家重点新产品证书1项。主讲本科生课程《自动控制原理》、《电磁场理论与应用》（2021年获批湖南省线下一流课程）、《新能源发电技术》，研究生课程《现代电力系统分析》、《牵引供电系统》等，主编教材1部，发表教改论文8篇，获湖南省教学奖一等奖2项。

