bio_raw: '个人简介

  伍国华，中南大学自动化学院教授，博士生导师，入选

  国家“万人计划”青年拔尖人才，湖南省杰青，

  湖湘青年英才（湖南省青年科技创新人才），

  IEEE Senior Member

  ，

  中国仿真学会优秀科技工作者，中南大学“十佳青年”，中国智能仿真优化与调度青年科学家，入选斯坦福大学全球前

  2%

  顶尖科学家年度和终身榜单（连续6年入选）

  ，担任湖南省系统仿真学会副理事长，国防科技大学本科、硕士和博士，国防科技大学优秀博士毕业生，加拿大阿尔伯塔大学联合培养博士生。

  主要研究方向为人工智能、决策优化、深度强化学习、无人机和机器人集群系统、智能调度与规划。以

  第一或通讯作者

  发表

  高水平

  论文

  100

  余篇，

  其中

  IEEE Trans./Journal长文46篇

  ，

  ESI高被引论文12篇

  ，含

  IEEE TEVC

  （

  3

  篇）、

  IEEE TNNLS

  （

  2

  篇）、

  IEEE TSMC

  （

  6

  篇）、

  IEEE TCYB

  （

  1

  篇）、

  IEEE TITS

  （

  8

  篇）

  IEEE TAES

  （

  6

  篇）

  , IEEE TVT

  （

  4

  篇）、

  IEEE/CAA JAS

  （

  4

  篇）、

  IEEE TASE

  （

