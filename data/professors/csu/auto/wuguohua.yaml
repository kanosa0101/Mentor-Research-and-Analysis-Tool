  篇）

  、IEEE TETCI (3篇)，IEEE JSYST

  （

  1

  篇）、

  IEEE JSTARS

  （

  1

  篇）、

  IEEE TBD

  （

  1

  篇）等，

  Google学术引用1.1W+，H指数56。

  主持国家军队重大工程、国防科技创新特区、装备预先研究项目、国家自科基金（青年

  1

  项、面上

  2

  项）、湖南省重点研发、湖南省杰出青年基金、企业横向等

  40

  余项课题。研究成果获中国仿真学会自然科学一等奖（排

  1

  ）、教育部

  自然科学二等奖（排1）

  、湖南省自然科学二等奖（排

  1

  ）

  、中国物流与采购联合会科技进步二等奖（排

  1

  ）、吴文俊人工智能科技进步一等奖、国防科技大学教学成果一等奖、荣立军队三等功一次。

  担任国际权威期刊

  Information Sciences、

  Swarm and Evolutionary Computation、

  Computers and Electrical Engineering

  副主编

  、

  International Journal of Bio-Inspired Computation

  的编委，在智能优化主流会议

  WCCI

  、

  CEC

  、

  SSCI

  等多次组织专题会议，担任会议

  Chair

  。受邀在国际智能优化领域顶会

  IEEE CEC

  做大会报告

  。

  【招生信息】

  每年稳定招收3名硕士和1-2名博士研究生（欢迎本科是人工智能、电子信息、数学、自动控制或计算机等方向的学生）

  招收本-博拔尖计划的学生（欢迎联系，进组后提供非常好的科研津贴和科研环境）

  注意：

  （1）欢迎对研究感兴趣，以学习知识、锻炼能力为目的的本科生提前进入课题组学习交流

  （2）本课题组研究经费充足，为研究生提供良好的科研环境和津贴

  【联系方式】

  邮箱：guohuawu@csu.edu.cn'
