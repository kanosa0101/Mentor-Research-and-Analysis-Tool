bio_raw: 蓝丽娟，工学博士，讲师，硕士生导师。本、硕、博分别毕业于清华大学精密仪器系、清华大学热能工程系和德国慕尼黑工业大学电气工程与信息技术（计算机工程）专业。主要从事工业自动化检测技术、工业过程光谱在线检测技术的仪器研发及其工业应用、冶金过程低碳排放检测及流程优化控制等研究工作。国家自然科学基金国家重大项目课题一“开放环境下工业过程碳排放智能感知与动态监测 ”重要成员、主持国家/省级自然科学基金项目2项，主持研究生教育教学改革项目2项；在IEEE
  TII, IEEE TIM, IEEE Sensors J, Neucomputing, Spectrochim Acta A等发表SCI期刊论文10余篇。曾获清华大学优秀硕士学位论文、综合优秀一等奖（“一二·九奖学金”，Top
  10）、研究生国家奖学金、第三届全国工程硕士实习实践优秀成果奖、国家留学基金委奖学金(CSC)等。 研究方向： 基于深度学习的碳排放气体逸散轨迹预测； 恶劣工况环境下光谱检测信号精准获取和碳排放浓度反演；
  融合逸散机理与学习算法的高碳排区域碳排放预测。 欢迎感兴趣的同学加入。
