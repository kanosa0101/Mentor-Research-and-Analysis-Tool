bio_raw: '个人简介

  左峙岳，博士，硕士研究生导师，主要从事连续变量量子信息相关领域的研究工作。

  2023年获中南大学控制科学与工程专业博士学位，2020年10月至2022年1月赴上海交通大学光子传输与通信全国重点实验室联合培养（导师：曾贵华教授），2022年2月至2023年2月受国家留学基金委资助，在英国约克大学Quantum
  Communication Hub进行联合培养（导师：Stefano Pirandola教授）。

  以第一作者/通信作者身份在Physical Review系列、Optics Express、Science China Physics, Mechanics &
  Astronomy等期刊发表SCI论文10余篇，担任npj Quantum Information、Communications Physics等期刊审稿人。主持国家自然科学基金青年科学基金项目、横向项目等。作为技术骨干参与合肥国家实验室“科技创新
  2030（重大项目）-量子通信与量子计算机”重大项目（2021ZD0300703）、国家自然科学基金“叶企孙”科学基金重点项目（U2441219）等。课题组依托合肥国家实验室、光电智能测控湖南省重点实验室等支撑平台开展建设，已经购置一批先进光电仪器设备和一流的高性能计算设备。

  2027年还有硕士生招生名额，面向量子保密通信、量子精密测量方向招生，欢迎联系（邮箱：zuozuo@csu.edu.cn）。'
