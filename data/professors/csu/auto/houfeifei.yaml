bio_raw: '个人简介

  侯斐斐，博士，硕导。中南大学计算机科学与技术专业博士，美国田纳西大学联合培养学者。

  中南大学自动化学院青年潜力人才

  。依托团队“光电智能测控”湖南省重点实验室（网址：http://oeimc.csu.edu.cn/index/index/index.html），中南大学“光电信息工程中心”与“铁路信息技术工程研究所”（网址：https://tlxxjsgc.csu.edu.cn/）。

  近年来，

  主持并参与国家级、省级、各类横向项目累计10余项。

  在国内外重要学术期刊发表学术论文40余篇，其中在国际杂志（ELSEVIER，IEEE，等）上共发表了40余篇SCI期刊，申请/授权发明专利20余项。作为20th
  International GPR Conf.、中国地球物理学会首届青年地球物理大会、第二届水文地球物理青年交叉论坛、PIERS、12th ICEEG等国内外会议特邀发言人。担任IEEE
  TGRS/GARS/JSTARS、AUTCON、COMPUT-AIDED CIV INF

  、

  NDT&E等20余国际期刊审稿人。曾获

  “

  2026年

  中南大学自动化学院青年潜力人才”、

  “2024年度北京市轨道交通学会科技进步二等奖”、“2023年湖南省自然科学三等优秀学术论文奖”、“2023年第六届全国青年地质大会优秀报告奖”、“中南大学2022-2023学年优秀班导师”等荣誉。

  研究方向包括深度学习智能分析与信息挖掘、无损检测、探地雷达、计算机视觉、雷达信号处理等。每年有研究生和本科生毕设指导指标，以及大学生多类竞赛指标，

  欢迎对计算机视觉、

  大语言模型

  、智能目标检测与识别、机器学习和深度学习，雷达理论与技术等领域感兴趣的同学来信交流

  。课题组会根据学生科研兴趣和未来工作意向等制定专门的培养计划，提供良好的学习和实验环境，并适当提供学生助研津贴。可推荐优秀硕士、本科生到国内外高校进一步深造交流。

