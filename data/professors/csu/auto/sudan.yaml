title: 讲师
bio_raw: 苏丹，中南大学自动化学院讲师，工学博士。2014年本科毕业于 中南大学信息科学与工程学院 ，2017年获 美国德克萨斯大学奥斯汀分校电气与计算机工程系
  硕士学位，2024年获 兰州大学 信息科学与工程学院 工学博士学位。求学与工作经历横跨中美学界与产业界：曾任职 美国硅谷优步科技公司 （Uber Technologies,
  Inc.）软件工程师，从事大规模软件系统算法设计与开发；2018年回国创业， 联合创办科技公司 并深耕智慧城市与智慧矿山领域，先后主持铅锌矿智慧矿山数字化综合管控平台（998万元）、教育部国有资本经营预算项目"中国西部智慧孵化服务平台"（总经费1500万元）、人社部中国留学人员回国创业启动支持计划重点项目等产业化课题，累计主持科研与产业项目经费逾两千万元。
  2024年起先后在中南大学自动化学院与香港城市大学计算机科学系从事博士后研究，合作导师为阳春华教授（国家杰青）与王钧教授（香港工程院院士、IEEE Life Fellow）。主要从事神经动力学优化、深度学习优化算法及复杂工业过程智能建模与控制研究，在
  IEEE Transactions on Cybernetics、IEEE/CAA Journal of Automatica Sinica、Neural Networks
  等期刊发表 SCI 论文13篇（JCR Q1 区10篇），授权发明专利2项、软件著作权2项；主持国家自然科学基金青年C类科学基金项目、湖南省自然科学基金青年项目，参与国家重点研发计划课题。现任中国人工智能学会青年工作委员会委员、甘肃省创新创业导师、全国大学生"挑战杯"评审专家，并多次出任
  ICIST、ICACI、ISNN 等国际会议出版主席、宣传主席。曾获甘肃省"陇原青年英才"、甘肃省"大学生年度人物"、中国大学生"自强之星"、兰州市人才创新创业奖等荣誉。联系邮箱：
  dan.su@csu.e du.cn。
