bio_raw: '个人简介

  杨超，湖南株洲人，中共党员，工学博士、副教授、硕士研究生导师，中国科协青年人才托举工程入选者，"轨道交通节能控制与安全监测"省重点实验室固定成员，曾获湖南省优秀博士学位论文、中国自动化学会优秀博士学位论文、全国"工程硕士实习实践优秀成果获得者"和教育部科学研究成果奖、

  中国自动化学会技术进步奖

  等荣誉和奖励。

  主要从事轨道交通车辆车载装备/系统故障诊断与优化调控研究，在

  IEEE Trans. Transport. Electrific

  .、

  IEEE Trans. Intell. Transp. Syst.

  、

  IEEE Trans. Power Electron.

  、

  IEEE Trans. Ind. Electron

  .、

  ISA Trans.

  、

  《自动化学报》、《中国科学：信息科学》等自动化控制、交通电气化领域的顶级刊物上发表学术论文

  23

  篇；已申请国家发明专利

  12

  项，其中

  8

  项专利获得授权；参与制定团体标准

  1

  项，企业标准2项。受邀担任教育部学位中心论文评审专家和

  IEEE Trans. Power Electron.

  、

  IEEE Trans. Ind. Informat.

  、

  IEEE

  Trans.

  Neural Netw. Learn. Syst.

  等十余个国际期刊的审稿人。

  目前，主持国家自然科学基金面上项目（

  2026-2029

  年

  ），青年项目和湖南自然科学基金青年项目各

  1

  项

  （

  2023-2025

  年）

  ，作为主要成员参与国家自然科学基金重点项目

  （

  2023-2027

  年）

  、面上项目

  （

  2022-2025

  年）

  和“十四五”国家重点研发计划项目任务课题

  （

  2022-2026

  年）

  等。曾主持湖南省研究生科研创新（重点）项目

  1

  项，作为项目技术骨干参与了国家自然科学基金重大项目、面上项目，装备预研教育部联合基金一般项目等科研项目

  6

  项。

  拥有高速列车半实物平台、深度学习服务器、动车组车辆TEDS系统、列车混合储能系统实验台等一批实验仪器设备，涉及多物理场建模、多模态融合感知、深度学习、运动控制系统服役性能优化、信息域攻防、嵌入式开发等内容学习，将为学生从事科研工作提供较全面、较好实验条件，每年可招收2-

  3

  名硕士生（欢迎士兵计划、少数民族骨干计划），

  6

  名本科生，欢迎有意从事相关研究工作的同学加入课题组。

  ***

  欢迎2027年保研生和考研生咨询联系（chaoyang@csu.edu.cn），

  欢迎士兵计划、少数民族骨干计划考生

