bio_raw: '个人简介

  刘一顺，人工智能系讲师，硕士研究生导师。2017年本科毕业于中南大学自动化专业，2023年6月获中南大学控制科学与工程专业博士学位，

  2021年至2022年在香港大学工业及制造系统工程系联合培养。作为技术骨干参与国家自然科学基金委重大项目、国家

  重点研发计划项目、工信部工业互联网创新发展工程项目、湖南省十大攻关项目等。

  主要研究方向：新一代人工智能方法、大模型驱动的优化方法/软件工程、工业过程智能控制与优化决策等

  以第一/通讯作者在IEEE Trans. Neural Networks and Learning Systems、

  IEEE Trans. C

  ybernetic、

  IEEE Trans. A

  utomation Science and Engineering、IEEE Internet of Things Journal等期刊发表SCI论文20余篇，其中ESI高被引论文2篇，申请/授权国家发明专利20余项，担任

  IEEE Trans. I

  ndustrial Informatics、Applied Intelligence等国际期刊审稿人。

  通讯地址：中南大学校本部民主楼216

  邮箱：liuyishun@csu.edu.cn'
