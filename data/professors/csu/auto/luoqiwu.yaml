bio_raw: '个人简介

  罗旗舞，教授，博士生导师，国家优秀青年基金获得者，IEEE/CAA/ CSIG Senior Member，湖南省优秀青年基金获得者，湖湘青年科技创新人才，中南大学高端装备精密检测实验室筹建人、常务副主任，湖南省自动化学会副秘书长，全国大学生电子设计竞赛湖南省责任专家，板石智能科技（深圳）有限公司首席科学家。

  一直从事高端装备精密检测技术研究和仪器研制工作，涉及光谱实时分析、自动视觉检测、可重构计算架构等研究方向。主持国家自然科学基金（优青、国际合作、面上、青年）、国家科技重大专项课题等国家级/省部级科研项目13项，国家重大科研仪器研制项目执行负责人（序2）。在TPAMI、TII、Information
  Fusion等权威期刊以第一/通讯作者发表SCI论文50余篇，以第一发明人获授权发明专利30项，实现技术成果转化14项。部分科研成果已在钢铁冶金、生物制药、半导体制造等产业形成了规模化应用。

  曾就职威胜集团、镭目科技等科技公司，具有丰富的智能电子和工控产品的系统架构、高速数字设计、逻辑开发从业经验，成功案例包括无菌制剂激光顶空残氧在线检测仪（打破国际禁运）、热轧带钢表面缺陷在线检测仪（打破国际垄断）、电力台式智能交互终端、燃气管网抄表终端、声磁商品防盗设备、人脸识别等系列产品。

  秉承研究生职业赛道定制化培养的卓越工程师育人理念，课题组明确设置硬件设计、嵌入式开发、FPGA逻辑开发、算法研究、软件开发等工程师岗位，以赛促研，以研推产，以产育人，两度指导学生斩获中国研究生电子设计竞赛全国最高荣誉——“研电之星”（2022年全国TOP3，2024年全国TOP1）。

  更多详细请关注主页：www.triple-olab.com

  ※

  招生信息

  ：

  1.  博士研究生 1-2名/年，硕士研究生 3-4名/年

  欢迎 081100控制科学与工程、085406电子信息（控制工程）、085410人工智能 相关专业，具备较强独立学习、分析问题和团队协作能力的同学与我联系，

  特别欢迎获得全国大学生电子设计竞赛、全国大学生智能汽车竞赛等国家一等奖学生提前联系入组

  。

  2.  本科生 5-7名

  欢迎自动化、计算机和电子信息相关专业本科生提前加入课题组，提前开展科研活动。'
