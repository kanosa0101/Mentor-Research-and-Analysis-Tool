bio_raw: '个人简介

  博士，副教授，硕士生导师，自动化学院。

  目前主要研究方向包括：工业感知与控制、自动驾驶场景感知、机器学习与深度学习算法。

  目前共发表SCI论文40余篇，专利10余项、主持国家自然科学基金青年项目、湖南省自然科学基金面上/青年项目、国家重点实验室自主课题、湖南省重点研发项目、企业横向课题。

  联系方式: zhangfan219@csu.edu.cn'
