bio_raw: '个人简介

  雷琪，工学博士，中南大学教授，硕士生导师。2007年获中南大学控制理论与控制工程专业博士学位。2017年9月聘为教授。主持/参与国家自然科学基金重点项目、重大项目、面上项目、青年项目、湖南省自然科学基金以及各省部级项目。从事模式识别、复杂系统控制理论与方法的研究，在国内外高水平学术刊物和会议发表论文40余篇，授权/申请发明专利20余项。'
