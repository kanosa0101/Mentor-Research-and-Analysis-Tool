bio_raw: '个人简介

  谷歌学术：

  https://scholar.google.com/citations?user=XFQOmY0AAAAJ&hl=en

  Rsearchgate:

  https://www.researchgate.net/profile/Xiaodong-Xu-11

  徐晓东，教授，硕士生导师，博士生导师。

  国家自然科学基金海外高层次人才，湖南省优青。

  2010年在北京理工大学取得自动控制专业学士学位，2017年在加拿大阿尔伯塔大学取得过程控制专业博士学位。2017年8月至2018年8月，在阿尔伯塔大学化工与材料学院从事博士后研究工作，研究人工智能方法用于生产过程故障诊断。2018年9月至2020年9月，在美国德克萨斯大学奥斯汀分校，从事博士后研究工作，研究基于机器学习技术现代工业过程，流程工业系统的模型失配在线智能检测与估计问题，

  从事智能制造技术及工业应用研究。

  近5年在《Automatica》、《IEEE Transactions on Automatic Control》、IEEE TNNLS、IEEE CYB、自动化学报等学术期刊上发表学术论文80余篇。《Biomimetic
  Intelligence and Robotics》青年编委，《Processes》客座主编。全区系统理论与应用会议(FASTA 2025、2026)副主编。

  兼任中国人工智能学会智能控制与智能管理专业委员会委员、湖南省有色金属学会智能制造专业委员会委员,CAAI自主无人系统专委会委员等。主持国家自然科学基金项目2项，科技部重点研发计划课题（300万）1项，湖南省重点研发项目

  1项

  ，湖南省科技创新平台与人才计划项目

  1项

  ，湖南省自然科学基金优秀青年项目

  1项

  。

  主要研究方向包括：

  （1）基于人工智能学习的分布参数系统协同信息感知、

  状态估计、故障检测与估计;

  （2）基于数据驱动具身智能，强化学习的工业大数据先进决策与过程控制;

  （3）基于边缘计算、云控制、模糊逻辑系统、深度神经网络的工业系统自适应学习建模；

  （4）基于人工神经网络、Autoencoder等模型参数失配估计；

  （5）智能车、机器人等基于学习策略的智能巡检控制、路径优化等。

  常年担任Automatica、IEEE Transactions on Automatic Control、IEEE Transactions on Fuzzy
  system、International Journal of Robust and Nonlinear Control、Journal of Process
  Control等十余个国际主流SCI期刊审稿人。

  实验室实验平台：

  招生：

  -每年有三个硕士生名额，一个博士生名额

  -欢迎报考我的研究生和博士生

  -为学生提供海外深造的机会，自己常年投身科研一线，可指导学生科研，提供学习相关的高配置科研设备！

  -长期招收相关研究方向的博士后，欢迎联系!'
