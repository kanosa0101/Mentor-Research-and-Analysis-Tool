bio_raw: '个人简介

  陈有根，男，1976年生，江西萍乡籍，工学博士，副教授，硕士生导师。1998年获长沙铁道学院电力牵引与传动控制专业学士学位，2004年获中南大学交通信息工程及控制专业硕士学位；2004年赴东北师范大学进修日语，2005年获日本政府奖学金公派赴日本筑波大学攻读博士学位，2009年获日本筑波大学系统情报工学研究科智能控制专业工学博士

  学位

  。现研究领域包括电传动与控制、牵引供电系统检测与控制、数智化监控与智能运维系统等。已在国内外知名期刊公开发表

  SCI、EI收录

  论文30多篇，主持参与各类科研项目20余项。

  招生方向：新型电力系统、

  电传动与控制、牵引供电系统检测与控制、数智化监控与智能运维系统

  招生专业：

  招收

  能源动力

  专业型硕士研究生1-2名

  招收

  控制科学与工程、电子信息

  学术型/专业型硕士研究生1-2名

  兼招智能科学与技术、低空技术与工程领

  域

  硕士

  由于学院调整，本人目前归属于自动化学院。

  欢迎电气或自动化专业保研考研学子报名自动化学院

  能源动力、

  控制科学与工程、电子信息

  专业。

  办公地点：潇湘校区信息楼211&天心校区一综312

  联系邮箱：chen_yougen@csu.edu.cn'
