bio_raw: '个人简介

  樊欣宇，湖南长沙人，中南大学自动化学院副教授，硕士生导师。主要围绕轨道交通牵引系统、电池系统、智能建造在控制、优化、序列数据预测、图像识别等方面开展研究。分别于2011年、2013年和2019年在

  北京理工大学

  获得学士、硕士和博士学位，于

  2016至2017年在

  德州大学达拉斯分校联合培养。第一/通讯作者发表SCI论文十余篇，申请国家发明专利30余项，授权10余项。

  研究方向

  1. 轨道交通

  电池系统智能运维

  2.

  深度学习预测和图像识别

  3. 轨道交通牵引系统控制与优化

  4.

  智能建造

  招生：有3名硕士研究生招生指标，请对上述研究方向感兴趣的同学与我联系，Email：

  auxyfan@csu.edu.cn

  。

  科研项目

  1.

  纵向, 国家自然科学基金青年科学基金项目, 多服役工况下永磁同步牵引系统实时损耗分析与优化控制研究, 主持

  2.

  纵向,

  湖南省自然科学基金-青年基金

  ,

  轨道交通永磁同步牵引系统损耗控制与损耗平衡研究

  , 主持

  3.

  横向, 轨道车辆关键部件故障诊断与寿命预测技术

  , 主持

  4.

  纵向, 重点研发计划, 自主式交通系统运行及环境状态全息感知技术

  , 参与（负责专题：车线协同的轨道交通全息感知原型系统集成与验证

  ）

  5.

  纵向,

  国家自然科学基金面上项目 轨道交通车辆牵引传动系统运行性能监测与优化研究, 参与

  6.

  横向, 机车车辆锂离子电池智能运维技术

  ,

  参与

  代表性论著

  1.

  Distributed H∞ Consensus Problem for First-Order Multi-Agent Systems with Antagonistic
  Interactions and Nonconvex Constraints, Journal of Systems Science and Complexity,
  2023, 36(2): 540-554

  2.

  Prediction of Axial Compressive Load– Strain Curves of Circular Concrete-Filled
  Steel Tube Columns Using Long Short-Term Memory Network, Materials, 2023, 16(9):
  3285

  3. Integrated Mixed Attention U-Net Mechanisms with Multi-Stage Division Strategy
  Customized for Accurate Estimation of Battery State of Health. electronics, 2024,
  13(16), 3244.

  4.

  Refined Target Signature Segmentation from GPR B-scans based on the MaskScoreNet-E
  Model and RATS Method. IEEE Transaction on Geoscience and Remote Sensing, 2024,
  62: 1-14.

  5.

  JITL-MBN: A Real-Time Causality Representation Learning for Sensor Fault Diagnosis
  of Traction Drive System in High-Speed Trains, IEEE Transactions on Neural Networks
  and Learning Systems, 2022

  6.

  Prediction of the axial compressive strength of circular concrete-filled steel tube
  columns using sine cosine algorithm-support vector regression, Composite Structures,
  2021, 273: 0-114282

  7.

  Voltage band analysis for maximum power point tracking of stand-alone PV systems,
  Solar Energy, 2017, 144: 221-231

  专利

  1.

  一种用于内置式永磁同步电机 DTC的MTPA控制方法

  2.

  一种永磁同步电机直接转矩控制 最大转矩电流比控制方法

  3.

  基于门控循环网络和典型相关分析的电梯故障

  4.

  基于观测模块的贝叶斯网络轨道客车牵引系统故障诊断方法及系统

  5.

  针对轨道列车牵引变流器的开路故障诊断方法及系统'
