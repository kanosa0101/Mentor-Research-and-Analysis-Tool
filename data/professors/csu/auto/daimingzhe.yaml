bio_raw: '个人简介

  戴明哲，工学博士，副教授，博士生导师。

  现任职于中南大学自动化学院，

  毕业于哈尔滨工业大学航天学院。主要研究方向：（1）

  群体智能分布式协同

  ；（2）

  航天器姿轨动力学与智能控制

  ；（3）

  无人机目标检测、跟踪与协同控制

  。先后主持和参与国家自然科学基金、湖南省自然科学基金、国家重大科学仪器设备开发专项、国家重点研发计划子课题、航天院所科研委托项目等多项。在

  IEEE Trans. Aerosp. Electron. Syst., IEEE Trans. Syst., Man, Cybern., Syst., IEEE
  Trans. Cybern., IEEE Trans. Circuits Syst. II, Exp. Briefs, Int. J. Robust Nonlinear
  Control, Int. J. Control, Aerosp. Sci. Technol.

  等知名国际

  SCI

  期刊发表论文近五十篇（一作/通

  信

  论文

  近

  30

  余

  篇），授权国家发明专利

  10

  余项

  。受邀担任国家自然科学基金委员会通讯评议专家，受邀担任

  SCI

  期刊

  Applied Sciences

  (Impact Factor: 2.7, JCR Q2)

  客座编委，受邀担任包括

  IEEE Trans. Autom. Control, IEEE Trans. Aerosp. Electron. Syst., IEEE Trans. Cybern.

  在内

  20

  多个高水平期刊审稿专家。

  ---------------------------------------------------------------------------

  硕士研究生招生专业方向：

  控制科学与工程

  ，

  人工智能

  ，

  电子信息工程

  ，

  1-3

  人/年

  2025年

  硕士研究生招生指标：预计1-3名

  ******

  欢迎广大学子报考中南

  大学自动化学院！

  不限于自动化专业，也热烈欢迎数学、机械电子、航空航天、计算机等多学科专业背景的同学报考，一起从事群体智能和空天智能探测与控制方面的研究！

