bio_raw: '个人简介

  岳俊，博士，中南大学自动化学院副教授、博士生导师，

  湖南省优青

  ，入选

  国家自然资源部高层次科技创新人才工程

  。

  本科毕业于武汉大学，博士毕业于北京大学(

  在校期间获

  武汉大学优秀毕业生、北京大学校长奖学金

  等奖励

  )，

  长期从事机器学习、计算机视觉、光电智能传感研究，以第一作者/通讯作者身份在IJCV、IEEE TIP、IEEE TGRS、IEEE GRSM、ECCV、自动化学报英文版、遥感学报等期刊/会议发表论文三十余篇。

  所发表论文Google Scholar总被引超过5000次，ESI高被引论文12篇，H指数为29，I10指数为41，11篇引用次数超过100次，单篇最高被引超过1700次

  ，

  入选

  斯坦福大学全球前2%顶尖科学家榜单

  。以第一作者发表的遥感解译论文位列遥感领域著名期刊《Remote Sensing Letters》

  最高被引论文(

  Most Cited Articles of All Time

  )。

  主持国家自然科学基金重点项目课题、国家自然科学基金面上项目/青年科学基金项目、湖南省自然科学基金优秀青年项目、湖南省教育厅优秀青年项目、湖南省自然科学基金青年基金项目等国家级省部级项目，授权国家发明专利12项、美国/欧洲发明专利5项，3项专利被评为华为公司级潜在高价值专利，获

  吴文俊人工智能自然科学奖一等奖

  。研究成果应用于华为P30、华为P40、华为云、全球舰船态势感知系统、湖南省卫星云遥系统、矿区生态天眼系统等，已在AI云计算、智能终端、自然资源智能监测、矿山视觉监测等业务领域深入应用。

  学术兼职

  [1]

  《

  Pattern Recognition

  》

  (JCR 1区，中科院一区

  ，影响因子7

  .

  6

  )

  ，

  编委

  (

  Associate Editor

  )

  [2]

  《Neurocomputing》(JCR 1区，中科院二区，影响因子6.5)，编委 (Associate Editor)

  [3] 中国图象图形学学会图像应用与系统集成专业委员会，委员

  [4] ICSI 2024 程序委员会委员 (PC member)

  [5] CVPR 2025 杰出审稿人 (Outstanding Reviewer)

  [6] 权威期刊审稿人

