bio_raw: '个人简介

  胡文峰，男，中南大学自动化学院副教授，硕士生导师、博士生导师，香港城市大学博士，

  湖南省优青，芙蓉计划湖湘青年英才、斯坦福大学与爱思唯尔全球前2%顶尖科学家（

  2024、2025

  ）

  。中国自动化学会专家库专家、广东省基础与应用基础研究基金项目评审专家、浙江省自然科学基金委员会项目评审专家、长沙市科技项目评审（评估）专家库专家、中国指挥与控制学会智能控制与系统专委会委员、SCI期刊Applied
  Sciences和Frontiers In Control Engineering等特刊客座编辑。担任IEEE Trans. on Automatic Control、Automatica、

  IEEE Trans. on

  Control Systems Technology、IEEE Trans. on Cybernetics、《中国科学》、《自动化学报》等多个国内外顶级期刊的审稿人。

  2012年6月，获重庆大学计算机科学与技术硕士学位，2012年8月-2016年10月，在香港城市大学攻读博士学位，导师刘璐与冯刚教授，2017年进入中南大学信息科学与工程学院从事教学科研工作，2017年、2019年两次曾在美国德州农工大学卡塔尔分校做访问学者。2014年获得“重庆市优秀硕士学位论文奖”，于2015年，2016年连续两年获得香港城市大学“杰出学术表现奖”，2019年获得第六届信息、控制论及计算社会系统国际会议（IEEE
  ICCSS 2019）“扎德”最佳论文提名奖，2019、2020连续两年被评为“中南大学优秀班导师”，2021年获得“第四届全国大学生嵌入式芯片与系统设计竞赛一等奖（

  指导教师

  ）”，2021年获得湖南省人工智能学会优秀硕士学位论文奖（

  指导教师

  ），2024、2025连续两年获得中国自动化学会优秀硕士学位论文奖（指导学生：成毅、侯亚辉）。

  主持国家自然科学基金2项（青年、面上），湖南省自然科学基金3项（青年、面上、优青），中国博士后基金2项；参与国家自然科学基金重大项目在内的国家基金项目4项。近五年以第一作者（或通讯作者）在SCI检索学术杂志发表学术论文40余篇，其中

  IEEE Trans汇刊和Automatica论文

  12篇，3篇论文曾入选

  ESI热点/高被引论文

  ，授权发明专利5项。

  主要研究方向

  复杂系统智能控制：多智能体系统、多无人机分布式控制、多机器人编队、多机械臂协同控制

  人工智能：多智能体强化学习

  高铁：高铁的控制与调度

  指导研究生发表学术成果

  指导硕士研究生发表SCI论文28篇，3人次获得研究生国家奖学金，2021届研究生丁瑞获

  湖南省人工智能学会优秀硕士学位论文奖，

  2022届研究生侯亚辉、2023届研究生成毅获得

  中国自动化学会优秀硕士学位论文奖

  ，每年带领研究生到全国各地参加学术会议。

  主讲课程

  本科生：《现代控制理论》、《信号与系统》

  研究生（留学生）：《多智能体系统与应用》

  邮箱：wenfenghu@csu.edu.cn

  地址：中南大学新校区信息楼227房间

  招生：每年3~6名硕士生，1~2名博士生（课题组）

  招生专业：控制科学与工程学科

  课题组与香港、澳洲纽卡斯尔大学、德州农工大学等海外名校保持紧密合作关系，欢迎数学、自动化理论基础好、编程能力强的学生积极报考研究生，

  尤其鼓励有读博规划的学生积极联系。

  单纯混学历，不想做科研、不想出成绩的，我们双方都会很难受。

  毕业生去向：美国名校（排名前50）、哈工大、中南大学计算机学院等读博、长沙银行、华为等互联网公司'
