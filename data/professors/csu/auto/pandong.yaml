bio_raw: '个人简介

  潘冬，河南南阳人，副教授，博士生导师，入选国家级青年人才，中国科协青年人才托举工程。

  主要研究方向包括具身智能感知、红外热成像、多模态大模型、信息融合（多模态图像融合、多源信息融合）、智能检测与自动化装置等。主持国家级/省部级项目6项，作为核心成员参与国家自然科学基金重大项目、重大科研仪器研制项目、工信部重大专项及校企合作项目8项。目前，在Information
  Fusion、IEEE Transactions on Instrumentation and Measurement、IEEE Transactions on
  Industrial Informatics、Measurement、自动化学报、仪器仪表学报等领域权威期刊

  发表SCI、EI论文

  40余篇

  ，

  H指数22。授权国家发明专利23项，相关成果获中国自动化学会科技进步特等奖、

  中国自动化学会科技进步一等奖、福建省科技进步二等奖、湖南省先进制造业科技创新大赛“十大科技创新技术”、金国藩青年学子奖、

  中国有色金属学会优秀博士学位论文、中南大学优秀博士学位论文、仪器仪表学报年度优秀论文、张钟俊院士优秀论文奖、中国自动化学会青年学术年会最佳中文论文奖等荣誉奖励。

  担任检测领域TOP期刊Measurement副主编、IEEE TIE、TII、TIM、EAAI等30余个国际期刊审稿人，获得检测领域权威期刊IEEE Transactions
  on Instrumentation and Measurement“杰出审稿人”称号。指导学生获研究生电子设计竞赛、中国（国际）传感器创新创业大赛等竞赛国家奖多项，指导多名本科生参加大学生创新创业竞赛并获省级/校级项目立项。

  课题组

  经费充足

  、

  氛围融洽

  ，建有“

  智能传感与在线检测

  ”实验室，实验条件完善，拥有红外热成像仪、红外光谱仪、高温黑体炉、内窥成像仪等先进仪器设备，鼓励并资助研究生参加国内外学术会议，与加拿大Université Laval（拉瓦尔大学）、University
  of British Columbia(不列颠哥伦比亚大学)、新加坡Nanyang Technological University（南洋理工大学）等国外知名高校建立了合作关系，可为有意于出国的研究生提供

  深造机会。

  博士招生：每年招收本-博拔尖、学术博士2人；

  硕士招生：

  每年招收

  学术/工程硕士3人。

  欢迎对

  具身智能感知

  、

  红外热成像

  、

  多模态

  大模型

  、

  视觉检测

  、

  信息融合

  、

  智能检测与自动化装置

  等研究方向感兴趣的同学加入课题组（邮箱：pandong@csu.edu.cn，

  欢迎交流，邮件一般当天就回复或第二天回复

  ）。

  学术网址：

  ResearchGate:

  https://www.researchgate.net/profile/Dong_Pan8

  Google Scholar:

  https://scholar.google.com/citations?hl=zh-CN&user=AQBYQSAAAAAJ

  指导学生情况

  满足以下条件者优先考虑

  有志于科学研究；

  具有较好的数学基础；

  具有较好的编程能力（

  C#,

  Python,Matlab等）；

  具有较好的英语水平（阅读和写作）

