bio_raw: '个人简介

  周晓君，中南大学教授，博士生、硕士生导师。2009年本科毕业于中南大学信息科学与工程学院教改班，自动化专业，同年推荐免试中南大学控制科学与工程专业直博生，2011年获得国家公派奖学金前往澳大利亚联邦大学攻读博士学位，于2014年获得应用数学专业博士学位，同年加入中南大学信息科学与工程学院工作，于2016年度破格晋升副教授，2021年晋升教授。研究方向包括：运筹优化、

  过程控制、

  机器学习、智能决策等， 及其在复杂系统智能控制与优化决策中的应用，目前已发表高水平学术论文100余篇，包括SCI期刊论文80余篇，主持国家级、省部级项目10余项，包括国家自然科学基金青年基金1项和面上项目3项。现担任《 IEEE
  Systems, Man, and Cybernetics Magazine》、《Artificial Intelligence Science and Engineering》、《中南大学学报(自然科学版)》、《Journal
  of Central South University》等期刊（青年）编委工作，曾获得中国自动化学会自然科学一等奖，湖南省自然科学一等奖等。

