bio_raw: '个人简介

  谢斌，中南大学自动化学院教授，博士生导师，人工智能系党支部副书记，人工智能与机器人实验室主任，湖南省普通高校教学能手，主要从事智能机器人，智慧医疗，大模型相关领域的科研和教学工作。2003年9月至2008年12月，在浙江大学信息与通信工程研究所攻读博士学位，毕业后作为引进人才进入中南大学任教。2011年5月至2014年4月在中南大学控制科学与工程博士后流动站继续研究工作，师从中国人工智能著名学者蔡自兴教授，从事无人驾驶研究。2014年7月至2015年7月在美国卡内基梅隆大学机器人研究所作为国家公派访问学者，从事复杂环境下机器人环境感知研究。2018年6月至2019年10月，挂职担任湖南湘江新区管委会主任助理，负责智能网联汽车产业规划、重点项目建设，筹建湖南湘江人工智能学院。

  作为项目负责人和技术骨干，承担了国家重点研发计划、国家自然科学基金、湖南省重点研发计划、长沙市科技计划、中央高校基本科研业务费等项目，以及多项企业横向课题，总经费1000余万元。近年来在相关领域发表论文40余篇，申请（授权）发明专利10余项。

  中南大学人工智能与机器人实验室主页网址：https://airl.csu.edu.cn/'
