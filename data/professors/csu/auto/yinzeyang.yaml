bio_raw: '个人简介

  殷泽阳，副教授，博士生导师，陕西省“秦创原”首席工程师、湖南省青年骨干教师。主要从事飞行器与机器人动力学建模、智能决策以及先进控制方法研究。现任中国宇航学会高级会员，中国指挥与控制学会高级会员、建模与仿真专委会委员、青工委委员，中国金属学会设备分会委员。主持国家自然科学基金面上项目/青年项目、国家重点研发计划课题任务、军科委装备预研基金、

  战略火箭创新基金、

  湖南省自然科学基金、校企合作项目等10余项，参与国家自然科学基金重大项目/重点项目(2项)、国家重点研发计划(3项)、军科委JCJQ重点项目、校企合作项目等20余项；出版学术专著3部；在国际、国内主流控制理论以及航空航天领域期刊发表SCI论文40余篇，H指数14；授权国家发明专利10余项；获湖南省科技进步二等奖、中国发明协会发明创新二等奖；受邀担任Astrodynamics期刊青年编委、多个国际会议分会主席，担任IEEE
  TIE/TAES/TCST、AST、AA、ND、CDC会议、ACC会议等多个顶级期刊和国际会议审稿人。

  博士招生：招收飞行器智能决策与运动规划方向博士生1~2名/年，具有大模型、深度强化学习、飞行动力学基础的学生优先。

  硕士招生：招收飞行器智能决策与运动规划、工业过程智能决策与控制方向，控制科学与工程、人工智能、电子信息专业学术/专业硕士3人/年。

  攻读研究生学位期间资助参加国内外高水平学术会议1-3次；鼓励和推荐成果优异的研究生在本团队和国内外团队继续深造；除学校规定的基础助研费外根据学术和科研工作情况额外发放助研津贴。

  邮箱：yinzeyang@csu.edu.cn

  地址：中南大学校本部升华后楼502'
