bio_raw: '个人简介

  李繁飙，博士

  、教授、

  博士研究生导师，

  九三学社中南大学校本部委员会主委，

  国家优秀青年科学基金获得者、湖南省科技创新领军人才、德国洪堡学者

  。从事飞行器起降系统智能控制与应用研究，在

  Automatica

  、

  IEEE Transactions

  等权威期刊和会议上发表学术论文

  80

  余篇，

  出版英文专著一部。曾获中国自动化学会自然科学一等奖（排名第

  1

  ）、湖南省

  自然科学一等奖（排名第

  2

  ）、

  黑龙江省自然科学一等奖（排名第

  3

  ）、中国自动化学会青年科技奖、湖南省教学成果二等奖、中国百篇最具影响国际学术论文奖等。 担任

  IEEE Trans. Systems, Man and Cybernetics: Systems

  、

  IEEE Trans. Fuzzy Systems

  、

  IEEE/CAA Journal of Automatica Sinica

  、

  自动化学报

  等

  国内外

  权

  威

  期刊的副主编或编委；担任

  中国自动化学会计算智能及其应用专业委员会副主任、

  中国自动化学会控制理论

  专委会

  委员、中国指挥与控制学会智能控制与系统

  专委会

  委员、中国计算机学会智能机器人

  专委会委员等

  。作为项目负责人主持

  国家自然科学基金联合基金重点/优青/面上项目、

  科技创新2030-“新一代人工智能”重大专项课题、湖南省科技创新重大项目/重点研发项目等

  。'
