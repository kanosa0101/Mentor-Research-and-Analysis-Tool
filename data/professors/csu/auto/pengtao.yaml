bio_raw: 彭涛，博士，中南大学教授，博士生导师。分别于1991年6月、2005年6月获国防科技大学飞行器仪表与测试硕士学位、中南大学控制理论与控制工程工学博士学位。2002-2003年德国Duisburg-Essen大学访问学者，2012年9月北京理工大学模式识别与智能系统学博士后出站。2008年入选“湖南省新世纪121人才工程”。现为中国自动化学会技术过程的故障诊断与安全性专业委员会委员、湖南省自动化学会理事。
  长期从事复杂系统/过程/装备的故障诊断、容错控制和健康管理以及模式识别等理论研究与工程实践，先后主持或参与国家自然科学基金面上项目、国家自然科学基金重大项目之子课题、国家863计划项目之子课题、国防科工局装备预研领域基金项目、装备预研教育部联合基金项目等20余个科研项目的研究开发工作；主持完成或作为技术负责人完成的项目获省部级科技进步一等奖2项、二等奖1项、三等奖1项。近年在IEEE
  TRANSACTIONS ON INDUSTRIAL ELECTRONICS\自动化学报等国内外权威刊物上发表论文60余篇，被 SCI收录40余篇。申请发明专利40余项，获授权发明专利20项，软件著作权14件。
