bio_raw: '个人简介

  裘智峰，博士，中南大学引进人才，2015年获聘副教授、硕士生导师，2020年获聘博士生导师，主要从事研究方向为电力市场及新能源接入，人工智能技术及其在能源系统中的应用，人工智能驱动的自动化技术，主持和参与了多项国家级项目，在高水平学术期刊和高水平学术会议发表论文30余篇，授权多项专利、软件著作权。

  热忱欢迎各位读研的同学联系并加入我们！

