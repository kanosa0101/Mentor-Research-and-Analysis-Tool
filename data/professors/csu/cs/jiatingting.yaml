bio_raw: '贾婷婷(

  Jia

  Tingting,

  1991-

  )

  ,

  博士，中南大学

  计算机学院

  副教授，硕士生导师（

  计算机学院

  、国家卓越工程师学院

  ），CCF专业会员，致力于

  非线性科学与大数据应用的交叉研究

  ，主要研究方向为

  物理-数据驱动的大数据分析/计算

  ：关注非线性波动/PDEs、物理信息神经网络、医疗大数据方向（医学辅助诊断、生物信息学算法），旨在通过嵌入物理信息的神经网络方法融合解析分析方法，刻画非线性现象的演化及反演，揭示其物理非线性现象潜在规律与本质性征，预测其发展规律及关键影响因素。

  研究工作成果三十余篇发表在数学物理、力学、计算机等领域学术期刊/会议 (Nonlinear Dyn., Phys. Rev. E, Phys. Fluids,
  Chaos，Appl. Math. Lett.等), 长期担任 POF, ND, Chaos, CSF, AML, RINP、

  AAAI、ICASSP

  等期刊会议的PC/Reviewer.

  研究方向：

  致力于

  非线性科学与大数据应用的交叉研究

  ，

  研究方向：物理-数据驱动的大数据分析/计算

  ；

  重点关注流体、医疗大数据、深

  度学习等领域学科交叉问题。

  1.  非线性波动力学/

  PDEs

  ：

  关注薛定谔类和水波类系统(非线性偏微分方程)，拓展其可积性，奇异解，以及动力学分析等；描述物理现象的PDE求解及系统结构解析分析，持续关注连续和离散系统。

  2.

  物理-数据驱动的大数据分析

  ：

  关注PINNs结构重构、改进及应用研究，旨在融合非线性现象物理信息(守恒量等)，基于神经网络方法阐释人工智能的大数据应用中的非线性现象，预测规律发展演化趋向及其关键因素。

  3.

  医疗大数据分析

  ：

  关注融合物理信息神经网络与解析分析的联合方法，为疾病防治筛查提供可靠监测和预警支持，支撑计算机辅助诊断。

  4.  AIforScience/

  物理引导神经网络

  ：

  关注实际应用场景模型的物理信息引导约束，构建面向对象的神经网络算法，优化算法。

  Tips: 欢迎对上述方向感兴趣的本科生咨询(jtt0129 at csu.edu.cn)，提前体验/开展科研工作，共同探索兴趣之所在。

  <方向：物理-数据驱动的大数据计算、物理引导神经网络、非线性波、可积系统、计算机辅助诊断>

