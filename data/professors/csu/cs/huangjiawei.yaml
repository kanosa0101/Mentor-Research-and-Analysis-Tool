bio_raw: 中南大学计算机学院教授、副院长、博导，主要从事计算机网络与人工智能领域的研究，主持国家自然科学基金重点项目/联合基金项目/面上项目、湖南省重点研发计划、华为企业合作项目等研究项目，在TON、TC、TMC、TPDS、TCOM、TCC、TMM、软件学报、通信学报、电子学报等期刊和INFOCOM、ATC、EuroSYS、KDD、ICNP、ICDCS、ICPP等国际会议上发表150多篇学术论文。发明专利授权35项。担任中国计算机学会互联网专委会委员、分布式计算与系统专委会委员、中国人工智能学会智能信息网络专委会委员、湖南省普通本科高校教学数字化建设指导委员会委员、中国网络空间安全人才教育联盟理事、科创中国未来网络专家、华为智库咨询专家，获得湖南省科技创新领军人才、中国计算机学会技术发明二等奖、湖南省科学技术进步奖二等奖、湖南省教学成果奖一等奖、湖南省普通高校青年骨干教师、长沙市工业科技特派员、中南大学励志奖与光云科技奖、华为难题挑战火花奖、ICNP最佳论文等奖励与称号。
