bio_raw: '杨展

  （

  Zhan Yang

  ）

  ，男，博士，计算机学院副教授，博士生导师，先后入选湖南省优秀青年人才、中南大学升华学者，CCF专业会员，主要研究方向为多模态数据检索、时空大数据与人工智能、多模态医学数据分析，发表了为数不多的期刊和会议论文，致力于多模态信息检索与大数据医学人工智能研究。平日里时常化身学术质检员，担任多家期刊和会议审稿人，偶尔客串各类项目评审专家。

  --------------------------------------

  研究方向

  ：

  信息检索

  > 大数据分析与人工智能大模型（

  目前比较火

  ）

  >

  多模态数据理解与信息检索（

  稍微

  偏理论

  ）

  > 多模态

  医学数据分析（

  稍微偏应用

  ）

  --------------------------------------

  本课题组坚持轻松务实、以人为本的培养理念，无过度科研压力，坚决杜绝 PUA，尊重学生的成长节奏与想法。团队科研基础扎实，成果产出稳定，可全力支持学生发表高质量学术论文。组内科研氛围融洽开放、互助共进，同时兼顾科研与生活，倡导张弛有度、有温度、有生活气息的科研环境，欢迎踏实进取、心怀热爱的同学加入！

