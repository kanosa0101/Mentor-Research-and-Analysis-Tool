bio_raw: '郑美光，女，博士，硕士生导师，副教授。

  主要从事云计算和大数据管理等方面研究工作。现主持国家自然科学基金青年项目，湖南省自然科学基金青年项目，作为研究骨干先后参与国家自然科学基金面上项目3项、教育部博士点专项科研基金1项。近4年（2019-2022）以第一作者/通讯作者发表SCI、EI论文12篇，授权和申请国家发明专利多项。

  密切关注云计算和联邦机器学习的最新研究进展，开展云边资源管理和应用部署、云存储管理、大数据的流式处理方法等重点问题开展理论与技术研究工作。

  主讲本科生课程《操作系统原理》、《软件测试技术》。

  联系邮箱：

  zhengmeiguang@csu.edu.cn'
