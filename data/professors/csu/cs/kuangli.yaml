bio_raw: '个人简介

  Personal Profile

  邝砾，中南大学教授、博导，主要从事软硬件协同的代码智能、生成式内容检测、服务监管领域的研究工作。在软件学报、TKDE、ACL、MM等知名期刊会议上发表论文100余篇，获CCF推荐会议最佳论文奖3次，出版教材/专著2部，授权发明专利20余项。重点研发首席青年科学家，入选湖南省科技创新领军人才、湖南省科技人才托举工程中青年学者。获得教育部科学技术进步一等奖、湖南省技术发明二等奖、中国指挥与控制学会科技进步一等奖、中国电子学会科技进步二等奖、CCF服务计算专委青年学者激励计划奖等。主持科技部重点研发青年科学家项目/子课题、国家自然科学基金、省重点研发计划项目/自然科学基金、CCF-腾讯犀牛鸟基金等10余项。担任International
  Journal of Web Information Systems期刊主编，服务计算领域两大顶会IEEE ICWS和ICSOC分会主席/宣传主席，CCF中国数字服务大会、中国软件大会论坛主席，CCF服务计算和软件工程专委会执行委员，杭州市钱江特聘专家。

  本人2027年硕士和博士正在招收中，博士生优先AI4EDA、集成电路设计方向，请感兴趣的同学发邮件，谢谢！ 2026.8.31'
