bio_raw: '黄俊予，2024年于中南大学获得计算机科学与技术专业博士学位，研究方向为机器学习算法优化、聚类算法优化、大规模数据处理。毕业后留校任教，致力于机器学习模型算法的可扩展性与计算效率研究。面向线性时间的机器学习算法优化，提出一系列兼顾理论质量保证与求解效率的算法设计方法，在ICML、NeurIPS、ICLR、IJCAI、AAAI、COCOON、Theoretical
  Computer Science等国际会议和期

  刊上发表论文10余篇。曾获2024年度ACM中国长沙分会优秀博士论文奖等荣誉。长期担任机器学习、人工智能等领域顶级会议（如ICML、NeurIPS、ICLR、AAAI、IJCAI等）审稿人。

  每年招收两名硕士研究生。欢迎具有良好算法与编程基础，对机器学习以及相关应用感兴趣的同学联系。相关要求如下：

  1、具备良好的理工科背景，熟悉数学基本知识，有一定的编程基础；

  2、对理论算法与机器学习算法研究有浓厚兴趣，能够接受较多的数学推导与形式化分析；

  3、态度端正、勤奋踏实，具备较强的数理逻辑思维与科研耐心。

  联系方式：junyuhuangcsu [AT] foxmail [DOT] com

