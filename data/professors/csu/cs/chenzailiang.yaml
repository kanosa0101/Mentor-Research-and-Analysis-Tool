bio_raw: '陈再良，男，工学博士，中南大学计算机学院副教授，硕士生导师。2012年5月毕业于中南大学计算机科学与技术专业，获博士学位。2014年8月至2015年8月美国斯蒂文斯理工学院访问学者，中国计算机学会计算机视觉专委会委员，中国图象图形学学会机器视觉专委会和视觉大数据专委会委员，CCF高级会员。主要研究方向为计算机视觉、医学图像处理、目标检测与跟踪、视觉定位、多模态信息融合等。

  主持完成国家自然科学基金2项，湖南省自然科学基金2项，长沙市自然科学基金1项；参与国家自然科学基金3项，参与湖南省自然科学基金2项以及与企业合作的横向课题；在包括AAAI、ECCV、Pattern
  Recognition、MICCAI等发表学术论文50余篇，授权发明专利15项；获湖南省自然科学二等奖(2018年），中国自动化学会科技进步奖二等奖（2023年），担任CVPR、ECCV、MICCAI、CIBM等国际学术会议和期刊审稿人，教育部学位论文通讯评审、省科技项目通讯评审。

  教学及人才培养工作：主讲本科生《数据结构》和《数据库原理》课程，担任中南大学程序设计竞赛总教练。获国家级教学成果奖二等奖（2023年），湖南省高等教育教学成果一等奖（2022年）、中国图像图形学学会高等教育教学成果奖二等奖（2022年）、中南大学教育基金会奖励金茅以升优秀教师奖（2021年），湖南省计算机学会高等教育教学成果奖特等奖（2020年）、湖南省高等教育教学成果一等奖（2019年）等，多次荣获中南大学学科竞赛优秀指导教师。

  招收计算机、大数据、软件工程等专业研究生，欢迎对计算机视觉、医学图像处理、机器学习等领域感兴趣的同学加入实验室，请提前联系！欢迎与同行老师和企业交流合作！联系方式：Email：xxxyczl@163.com。'
