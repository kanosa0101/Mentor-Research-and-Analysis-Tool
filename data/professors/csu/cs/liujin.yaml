bio_raw: '刘锦，男，中南大学计算机学院教授，博/硕士研究生导师，湖南省芙蓉计划科技创新青年人才，

  湖南省普通高校青年骨干教师，

  湖南省优秀研究生导师团队核心骨干，IEEE/CCF/CSIG高级会员，CCF生物信息学专委会委员，CSIG脑图谱专委会委员，CSIG医学影像专委会委员，湖南省生物医学工程学会脑科学与神经工程专委会副主委，湖南省数字医学学会医学智能影像分会常务委员，主要研究方向是人工智能、医疗及健康大数据分析与挖掘、健康监测智能设备研发等。目前已在IEEE
  TMI、MedIA、MICCAI等国际学术期刊或会议上发表高水平学术论文80余篇，其中IEEE Transactions系列20余篇，ESI Top 1% 高被引论文6篇，据Google
  Scholar统计显示总引用4500余次，单篇最高引用500余次，H指数为34，入选美国斯坦福大学发布的全球前2%顶尖科学家榜单（2023-2025），

  《

  Big Data Mining and Analytics

  》、《Health Information Science and Systems》等多个国际期刊编委

  。

  主持或作为科研骨干参与国家重点研发计划、国家自然科学基金面上基金、湖南省重点领域研发计划等省部级'
