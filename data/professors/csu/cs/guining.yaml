bio_raw: '桂宁，中南大学计算机院教授，博士生导师。2012年比利时安特维普大学博士，2012年~2013 鲁汶大学博士后，主要研究领域，可解释的人工智能，图表示学习和图神经网络。发表SCI论文20余篇，近4年作为通讯作者发表
  CCF 期刊和会议文章20余篇，其中CCF A类期刊/会议9篇， 期刊包括 IEEE TKDE（A类），IEEE TDSC（A类）,  IEEE TNNLS（B类), 
  ACM TKDD(B类） Knowledge-based System(C类）等，CCF 会议 ICML

  （A类）

  , NeurIPS SIGKDD

  （A类）

  ，AAAI

  （A类）

  ，PAKDD(C类) 等。 累计授权专利10余项。承担工信部中国制造2025和工业互联网重大项目2项,（曾）承担国家基金4项，参与浙江省重大项目1项。获得省部级二等奖2项，厅局级二等奖一项。主要研究方向：面向可解释的工业大数据和人工智能。

  实验室有着良好的硬件条件：配备六台高性能服务器，包括 A100等各类 GPU卡24张，另有多屏显示器、人体工学椅等。

  实验室成员以研究生为主，有少量的优秀本科生。现有成员均获得较好的工作和深造机会: 罗宾理（本科生）和李幽 （研究生）两位 分别在 2019年 和2022年获得
  微软亚洲研究院 的实习。已毕业的学生主要在阿里，腾讯，华为，网易，国网等单位。也有部分同学在美国和新加坡知名高校攻读学位，或者保研到清华、北大、南大等优秀院校。

  每年可招收3名硕士研究生，经费充足，待遇优秀。招生名额有限，优先考虑有编程经验、独立解决问题、态度端正的学生。

  欢迎具有推免资格的学生联系我, 招收 计算机学院 学硕和专硕研究生, 有意者可email联系我。

  同时也欢迎对 图神经网络， 时序数据表示学习，可解释人工智能感兴趣的本科生加入我的团队。

  email：ninggui@csu.edu.cn or ninggui@gmail.com

