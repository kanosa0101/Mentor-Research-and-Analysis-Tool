bio_raw: '杨浩然，男，汉族，湖南新化人，现任中南大学计算机学院特聘副教授、硕士生导师

  。

  2025年2月博士毕业于悉尼科技大学，师从

  徐贯东

  教授（现任香港教育大学助理副校长、人工智能讲座教授），期间于2023年9月至2024年12月在香港理工大学进行联合培养，导师为

  李青

  教授（IEEE Fellow，电子计算学系系主任），2020年6月本科毕业于南京大学计算机科学与技术系（现计算机学院）计算机与金融工程实验班。近几年来，在数据挖掘、人工智能等领域的主流国际期刊和会议发表论文10余篇，代表性论文发表在相关领域的顶级国际会议和期刊如ICDM、WWW、NeurIPS、TKDE、KDD等，并在相关会议上作报告分享科研成果。长期担任

  数据挖掘（如CIKM、ICDM、WWW、SIGIR、KDD、TKDE、TOIS等）与人工智能（如AAAI、IJCAI、NeurIPS等）等领域顶级会议和期刊的程序委员和审稿人。

  本课题组目前经费充足，配备有课题组专属服务器，每年招收硕士生2-3名，欢迎对图数据挖掘与大语言模型在推荐系统中的交叉应用感兴趣且致力于发表高水平论文的同学联系。请将简历、成绩单以及相关成果材料发送至本人邮箱，因邮件数量过多，恕不一一回复。

  查看全部'
