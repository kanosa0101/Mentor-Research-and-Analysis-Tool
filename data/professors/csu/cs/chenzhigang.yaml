bio_raw: '陈志刚，教授，博士生导师，享受国务院“政府特殊津贴”专家，

  国家教学名师，

  高校计算机专业优秀教师，湖南省芙蓉教学名师，教育部软件工程专业教学指导委员会秘书长，

  入选美国斯坦福大学全球

  2%

  顶尖科学家榜单，

  中国工程教育认证专家，湖南省计算机学会副理事长，湖南省通信学会副理事长，示范性软件学院联盟研究生教育委员会常委会常委，“信创人才产教融合共建计划”智库专家。

  主要研究方向是智能无线网络与协同计算、网络与分布式计算、移动医疗、物联网。主讲本科生和研究生的《编译原理》、《分布式系统》、《人工智能原理》等课程，是国家精品课、国家级一流课程主讲教师，

  获国家级教学成果奖1项、省级教学成果奖5项。

  主持和参加包括科技创新2030—“新一代人工智能”重大项目、国家自然科学基金、国家863计划课题、国家自然科学基金委员会与韩国国家研究基金会联合资助合作项目、教育部优先发展领域课题、教育部重点科研计划项目、信息产业科研试制项目、国防科技重点实验室基金项目、高等学校青年骨干教师资助计划、国家留学回国人员基金、湖南省自然科学基金、湖南省学科带头人资助计划等等纵横向'
