bio_raw: '个人简介

  Personal Profile

  张士庚，教授，博士生导师，目前担任网络空间安全系主任。2004年于南京大学计算机系获学士学位，2010年于南京大学计算机系获博士学位，2010年7月进入中南大学信息科学与工程学院工作。多次在香港理工大学、香港浸会大学等高校进行访问研究。中国计算机学会(CCF)杰出会员，目前担任CCF分布式系统与计算专委会常务委员，物联网专委会与普适计算专委会执行委员。

  研究兴趣包括物联网、无线感知、物联网安全、人工智能安全等。主持和承担国家自然科学基金面上项目/青年项目、JWKJ项目、湖南省重点研发计划等'
