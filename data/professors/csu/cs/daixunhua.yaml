bio_raw: '戴训华，男，博士，现为中南大学计算机学院副教授、硕士生导师。主要研究内容为无人机/机器人系统的优化设计、虚拟现实仿真、自主智能控制（视觉导航、集群编队、AI博弈决策等）、健康诊断和安全评估等方向。在国际知名期刊IEEE
  TIE/TMECH/TAES和AIAA JGCD等发表论文多篇，出版专著三部，申请专利十余篇，开发了多套应用广泛的旋翼无人机设计与控制相关网站

  https://rflysim.com

  与工具箱

  https://flyeval.com

  。

  【硕士招生】本实验室每年招收2个左右硕士研究生，1名博士生，感兴趣的同学可以联系邮箱dai.xh@csu.edu.cn

  实验室配套条件（团队更多最新视频见

  https://rflysim.com/doc/zh/0.Show/videos.html

  ）：

  其他平台

  1）无人机Vicon毫米级室内集群编队飞行平台

  2）基于UE5的无人机视觉算法开发平台

  3）空中机器人专业课程与专著

  4）机器人底层控制算法快速开发平台

  https://rflysim.com

  5）无人机智能自动设计工具箱

  https://flyeval.com

  6）基于FPGA的控制系统自动测试平台

  7）其他实验条件动图

  虚拟现实故障模拟                                                无人车硬件在环控制

  无人机室内编队飞行                                                     室内抗扰飞行实验

  无人车/机协同编队平台                                            机器视觉控制算法开发平台

  8）数字孪生&虚拟现实&无人机市区蜂群编队

  9）RflySim分布式多机视觉开发平台'
