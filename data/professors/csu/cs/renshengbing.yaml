bio_raw: '个人简介

  Personal Profile

  任胜兵，男，中共党员，博士，硕士生导师，CCF高级会员（10663S），湖南岳阳人，1969年9月生。2002年8月至2003年8月，加拿大Concordia大学计算机系，访问学者。主要研究兴趣：嵌入式人工智能、软件工程、可信软件、嵌入式系统、图像处理与模式识别。

  主讲本科生《软件工程基础》、《计算机原理与结构》等课程。出版教材3本，教改专著1本，发表CSSCI论文3篇，SCI论文12篇，EI论文11篇。主持省级教改项目2项，获国家教学成果二等奖1项、省教学成果奖一等奖1项、二等奖2项，获省计算机学会高等教育教学成果奖特等奖1项，获省科学技术进步奖二等奖1项。获发明专利10项、软件著作权5项。从2015年开始，连续9年指导学生参加“中国大学生服务外包创新创业大赛”获一等奖。

  热烈欢迎喜欢嵌入式linux和C/C++/Python/Opencv软件开发的同学加盟。'
