bio_raw: 刘嫔，女，1980年3月生，计算机学院讲师。2002年以来一直从事教学与科研工作。主讲了“信息安全概论”，“网络安全协议及应用”"面向对象编程（C++）"等课程。作为主要研究人员参与国家自然科学基金重点项目1项，面上项目项目2项，国家863课题1项。已发表SCI和EI论文10多篇。
