bio_raw: '刘丽敏，副教授，硕士生导师。一直从事工业大模型、智能计算、群智协同、强化学习、调度理论及应用、空天地一体化等研究，在大模型、群智协同、调度理论及应用与空天地一体化等研究领域耕耘多年，长期专注于

  “大模型

  “、

  “群智协同”等研究，提出了微云架构卫星协同计算及其系列方法（包括空天地一体化资源分配、任务调度模型及其系列方法等）。近年来，在人工智能、卫星计算等领域的国内外顶级及著名学术期刊
  Expert Systems with Applications、Aerospace、Computer Systems Science and Engineering、软件学报等上发表学术论文十余篇。并作为子任务负责人参与“国家科学技术部国家重点研发计划项目1项”与“军科委基础重点加强项目目1项”。基于研究成果，获得了新疆维吾尔自治区科技进步一等奖1项，湖南省科技进步二等奖1项，湖南省计算机协会科技进步一等奖1项。

  【招生】每年招收硕士研究生2-3名，请提前邮件（liulimin@csu.edu.cn）联系！'
