bio_raw: '沈海澜，女，中南大学计算机学院副教授，

  2011

  年毕业于中南大学计算机科学与技术专业，获博士学位，中国计算机学会会员。

  主要研究方向机器学习、医学图像分析、医学数据处理、目标检测、个性化推荐等。实验室同中南大学湘雅医院、中南大学湘雅二医院、爱尔眼科医院建立了良好的合作关系，主要基于医学图像分析、病历分析、机器学习等方法开展医学辅助诊断相关的理论和应用性研究。主持国家自然科学基金面上

  1

  项、湖南省自然科学基金

  2

  项、横向课题

  2

  项，参与纵向/横向课题

  3

  项。近年来在包括

  Pattern Recognition

  、

  MICCAI

  、

  ECCV

  等模式识别和医学图像处理领域著名国际期刊和会议上发表论文20余篇，申请国家发明专利

  16

  项，授权

  10

  项。担任

  ECCV

  、

  CIBM

  、

  BOE、

  Neurocomputing、

  通信学报

  等期刊和会议审稿人，教育部学位论文通讯评审。主讲《操作系统原理》、《离散数学》、《

  Linux

  系统及应用》等课程。主持完成湖南省本科教育教学改革项目1项，校教育教学改革项目

  2

  项，获

  2022-2023

  年课堂教学质量优秀奖，学科竞赛和大学生创新创业项目优秀指导教师，

  2023

  年中南大学西南铝教育奖励金优秀教师奖。

  招生专业方向：计算机科学与技术，电子信息（包括计算机技术、人工智能、大数据、软件工程方向）专业学位研究生。欢迎对相关方向感兴趣的研究生加入实验室！

  联系邮箱：

  hailansh@csu.edu.cn'
