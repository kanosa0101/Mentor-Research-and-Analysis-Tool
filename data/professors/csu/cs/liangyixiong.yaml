bio_raw: '梁毅雄，中南大学计算机学院教授、博士生导师

  ，

  分别于1999年、2002年和2005年在重庆大学获得学士、硕士和博士学位；2005年至2007年在中国科学院自动化研究所进行博士后研究，2007年6月加入中南大学信息科学与工程学院，

  2009年

  入选“湖南省普通高校青年骨干教师培养对象”，

  2011年7月至2012年7月在美国卡耐基梅隆大学机器人研究所（Robotics Institute, Carnegie Mellon University）进行访问研究

  ，

  2013年入选中南大学531人才。长期从事计算机视觉与机器学习、数字图像/医学影像处理等方面的研究，主持国家自然科学基金面上项目、

  国家自然科学基金青年基金

  项目

  、

  国家重点研发计划子课题任务、湖南省自然科学基金面上项目、教育部博士点基金、长沙市自然科学基金等科研

  项目10余项

  ，获授权发明专利20余项；在ICCV、NeurIPS、ACM MM、

  MICCAI

  等

  国际顶级会议

  和

  PR, IEEE JBHI, IEEE/ACM TCBB,

  IEEE TBME,

  IEEE TCSVT, ACM TIST

  等权威期刊上发表论文70余篇；长期担任ICCV

  、

  CVPR、ICLR、NeurIPS、ICML、AAAI、ACM MM、MICCAI等国际顶级会议程序委员会

  委

  员/审稿人以及IEEE TPAMI、IEEE TIP、IEEE TMI、IEEE TC、

  MedIA

  、

  IEEE

  JBHI

  、

  自动化学报、计算机

  学报、

  电子学报等国内外权威期刊的审稿人。

  目前主要研究兴趣包括基于多模态学习的目标检测、图像语义/实例分割、计算机辅助筛查与诊断、智能机器人等方面的研究与应用，承担《机器学习》、《计算机视觉》、《深度学习技术》、《数字图像处理》等本科生课程和《数字图像处理及应用》等研究生课程的教学工作，获本科

  生

  教学质量优秀奖2次，研究生

  教学质量优秀奖1次，指导研究生获中南大学优秀硕士学位论文3次，湖南省优秀硕士学位论文1次

  。

  欢迎对多模态学习、计算机视觉、生物图像分析处理

  、

  智慧医疗、智能机器人等方面具有浓厚兴趣的优秀同学加入！ (Email: yxliang[at]csu[dot]edu[dot]cn;  QQ：6532695; 
  Mobile/WeChat: 13548670948 )

