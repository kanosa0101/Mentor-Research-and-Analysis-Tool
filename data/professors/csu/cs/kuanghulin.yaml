bio_raw: '匡湖林，湖南双峰人，男，博士，现为中南大学计算机学院副教授，博士生导师，硕士生导师，数据科学与工程系研究生副主任，

  湖南省湖湘青年英才（荷尖）和中南大学升华学者计划入选者

  。中国电子学会智慧医疗专委会委员、中国医学图像计算青年研讨会（MICS）委员会委员和中国科学产业化促进会数字健康专委会委员。本硕均毕业于武汉大学电信院。2017年1月博士毕业于香港城市大学电子工程系。2017年1月至2020年12月在加拿大卡尔加里大学做博士后。研究方向为医学图像处理、智慧医疗，计算机视觉、人工智能。

  目前已在IEEE Transactions on Medical Imaging，Medical Image Analysis， Radiology， Stroke，IEEE
  Transactions on Systems Man Cybernetics-Systems，IEEE Transactions on Intelligent
  Transportation Systems和IJCAI、ACM MM、MICCAI等国际权威期刊和会议上发表论文100余篇，其中一作或通讯50余篇。申请国家发明专利15项，已授权6项。主持或参与包括国家重点研发计划、国自然区域联合重点、国家自然科学面上项目、青年基金项目、湖南省青年科技人才项目和湖南省自科面上项目在内的项目6项。脑卒中研究成果获2024年度中国医学人工智能代表性算法奖。获2025年湖南省数字医学学会优秀青年奖。

  招生：

  联系方式：hulinkuang[at]csu[dot]edu[dot]cn

  每年可招收3名硕士研究生。经费充足。招生名额有限，优先考虑有编程经验和态度端正的学生。欢迎推免生联系。

  同时也欢迎对医学图像处理、智慧医疗、人工智能感兴趣的本科生加入我的团队。

  研究方向：

  [1]医学图像处理和智慧医疗：智能疾病辅助诊断，疗效预测，医学图像分割和分类

  [2]计算机视觉：目标检测，图像增强，图像去噪

  [3]人工智能：深度学习、机器学习

