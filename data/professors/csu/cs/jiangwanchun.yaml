bio_raw: '个人简介

  Personal Profile

  蒋万春，中南大学教授，博导。先后获清华大学优秀博士论文奖、CCF技术发明二等奖；入选湖南省优秀青年基金、湖南省科技创新计划

  青年

  荷尖

  人才

  。主持

  国家自然科学基金面上项目2项、国自科青年基金1项，湖南省重点研发计划等省部级项目6项。获CCF-蚂蚁科研基金、华为创新旗舰计划项目等资助。在SIGCOMM，

  NSDI

  , Eurosys,

  IEEE/ACM Trans. on Networking, IEEE Trans. on Computers, TPDS等高水平期刊和会议上发表论文共计九十余篇。

  主要研究方向为计算机网络，具体关注AI系统的网络优化、基于AI技术的网络优化、视频

  传输

  等方向；一方面专注于为AI优化基础设备及其资源利用率，加速AI训练和推理，另一方面将AI手段引入计算机网络技术研究，提升网络性能。

  长期招聘有志于科研的博士研究生，硕士研究生，也欢迎中南大学的优秀本科生以及各地具有强烈上进心的本科生加入课题组，欢迎大家申请中南大学"本-博"拔尖创新人才培养计划。提供便利的科研环境，充足的助研津贴，一对一的科研指导和训练。'
