bio_raw: '曾敏，男，中南大学计算机学院副教授，博士研究生导

  师，

  湖南省芙蓉计划科技创新青年人才。于201

  3年获得兰州大学电子信息科学与技术学士学位；2016年，2020年分别获得中南大学系统科学硕士学位和计算机科学与技术博士学位。主要研究方向是AI for Science，研究工作集中在利用和开发人工智能方法对生物信息学中的交叉前沿科学问题进行探索和研究，具体研究内容包括生物序列分析、疾病相关预测、医学大数据分析等，目前在Cell、

  Nature Communications、Advanced Science、

  Bioinformatics、Briefings in Bioinformatics

  等国际权威期刊

  和NeurIPS、ACL、

  IJCAI、ACM MM、ECCB等国际顶级会议上发表学术论文70余篇，据Google Scholar统计显示总引用2500余次。担任BMC Bioinformatics的编委，Frontiers
  in Genetics的客座编辑，CCF-B类推荐会议BIBM、CCF-C类推荐会议APBC、ISBRA的程序委员会成员，担任

  Nucleic Acids Research、Bioinformatics、Briefings in Bioinformatics等多个国际权威期刊审稿人。主持国家自然科学基金面上/青年项目、国家重点研发计划子课题、湖南省自然科学基金面上/青年项目等'
