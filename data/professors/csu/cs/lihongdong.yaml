bio_raw: '李洪东，中南大学计算机学院教授, 博士生导师，国家重点研发计划青年首席科学家，2021至2025年连续入选斯坦福大学全球前 2%顶尖科学家榜单，2023年度“中国高被引学者”，2014年获人类蛋白组世界大会Young
  Investigator Award(青年研究员奖)。密歇根大学（安娜堡）医学院计算医学博士后，美国系统生物学研究所(Institute for Systems
  Biology, ISB)（西雅图） 研究员(Research Scientist)。在 Nature Communications,

  Nature Genetics,

  Alzheimer''s Dementia,

  Nucleic Acids Research, Trends in Genetics, Bioinformatics, IEEE/ACM TCBB等期刊上发表SCI文章100余篇，据Google
  Scholar, 总引用10000余次，H指数36，单篇最高引用1400余次；合著英文专著一本(美国CRC Press出版)。主持或承担科技部科技创新2030“脑科学与类脑研究”重大项目青年科学家项目（主持），国家自然科学基金联合基金（共同主持）、面上（主持）等项目。

  研究生招生

  ：

  研究生将获得参与科研和项目的机会，课题组毕业的学生主要就业于顶级互联网公司或继续深造等。

  要求学生具有自我上进精神和团队合作精神，

  欢迎军人（士兵计划）报考

  。

  招生名额有限，欢迎联系

  E-mail：hongdong@csu.edu.cn

  科学研究方向：

  人工智能、

  生物信息学

  更新信息请见个人主页 (see updated info on my personal website)

  ：

  https://genemine.github.io/'
