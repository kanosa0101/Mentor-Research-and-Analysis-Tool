bio_raw: '云南玉溪人，工学博士

  ，二级教授，

  中南大学升华领军岗教授，计算机专业

  博士研究生导师，曾任计算机学院副院长，邓迪国际学院副院长。现任中国教育和科研计算机网主干网长沙核心节点主任，全国高等学校计算机教育研究会青年教师工作委员会副主任

  ，教育部高等学校计算与智能教学指导委员会委员，全

  国高等院校计算机基础教育研究会理工专委会委员，CCF高级会员，智慧高校数字化转型先锋人物，计算机“101计划”湖南省工作组专家，CCF理论计算机科学专委会执行委员，CCF教育专委会执行委员，CCF

  CAD&CG专委会执行委员，《电子学报》、《现代教育技术》、《Meta-Radiology》、《BIO Integration》和《计算机教育》编委，《软件学报》优秀审稿人，机器视觉与智慧医疗湖南省工程技术研究中心主任，湖南省大学计算机教学指导委员会主任，湖南省高等教育学会计算机教育专业委员会理事长，湖南省大学生计算机程序设计竞赛指导委员会主任，湖南省物联网学会副理事长，中国高校计算机教育MOOC联盟（CMOOC）

  湖南省工作委员会副主任，湖南省计算机学会机器视觉与医学影像专委会副主任，湖南省人工智能学会医学人工智能专委会副主任，湖南省数字医学学会医学智能影像分会副主任委员，

  湖南

  制造强省建设专家咨询委员会委员，湖南省电子信息职业教育教学指导委员会委

  员，湖南省计算机学会常务理事，湖南省信息技术标准化技术委员会专家，中国中医药信息学会中医诊断信息分会常务理事，湖南省数字医学学会理事，全国高等院校计算机基础教育研究会医学专委会常委，亚太人工智能学会高级会员，湖南省软件行业协会理事，湖南省检验检测学会专家委员会（

  名匠智库）专家库成员，广东省数字政府专家资源池专家，长

  沙市工业和信息化局工信系统专家人才库专家，长沙市新型智慧城市建设专家，长沙市科技项目评审专家

  ，长沙市科学技术协会评审咨询专家，长沙马栏山视频文创产业园行业专家库专家，长沙市重大人才工程评审专家

  。研究方向为

  ：

  模式识别与图像处理、机器视觉与智慧医疗、医疗大数据、

  智能医学影像分析、数据可视化与可视分析、教育信息化等

  。

  高校数字化转型先锋人物，建党百年湖南省教育系统优秀共产党员，湖南省普通高校教学能手, 湖南省芙蓉百岗明星，湖南省芙蓉计划高层次人才，湖南省青年骨干教师，国家级一流本科课程和省级一流课程主讲人，全国青年教师课堂教学竞赛湖南省种子选手，中国科协“中学生英才计划”湖南省优秀导师，湖南湘江新区首批中小学科学副校长，中南大学十佳青年，中南大学课程思政示范教师，中南大学“三十佳”比赛唯一大满贯获得者，入选“中南人物”和“中南师范”，中南大学课程思政教学名师，湖南省高校计算机学科课程思政优秀教学团队负责人。湖南省首届青年科协委员, 中国大学生计算机设计大赛中南地区赛竞赛组织委员会委员,
  ACM SIGCSE China委员，国家自然科学基金评议专家，教育部学位与研究生教育发展中心通讯评议专家，教育部普通高等学校本科教育教学评估专家，中国科协科技人才奖项评审专家，腾讯云TVP行业大使，湖南省教育厅督学专家，湖南省创新创业大赛评审专家，湖南省政府采购评审专家，长沙市科技计划项目评审专家，CCF
  CCSP华中分赛区委员。

  曾获宝钢优秀教师特等奖（2025年全国十强），教育部-华为“智能基座”优秀教师奖励计划（全国首届20人），教育部基础学科拔尖学生培养计划2.0优秀管理人员奖，教育部-华为智能基座“栋梁之师”，华为高斯传道授业杰出贡献奖，全国高等院校计算机基础教育研究会优秀教师奖（2022年全国七人之一），高等教育（本科）国家级教学成果奖二等奖（排2），全国生态文明信息化教学成果奖（排1），湖南省高等教育教学成果奖一等奖/二等奖/三等奖各1项，中国图象图形学学会高等教育教学成果奖二等奖1项（排1），湖南省计算机学会高等教育教学成果奖特等奖/一等奖各1项，思政案例获全国高等院校计算机基础教育研究会优秀课程思政教学案例奖，湖南省普通高校教师课堂教学竞赛一等奖，中南大学高等教育教学成果奖一等奖3项，发表CSSCI/EI等收录的教改论文30余篇，主编教材15部，主审教材1部，参编10余部，主编出版“十二五”职业教育国家级规划教材1部，主持教育部新文科、教育部基础学科拔尖学生培养计划2.0研究课题等国家级教改项目6项，获电子工业出版社成立40周年教育出版杰出贡献者称号。爱岗敬业，性格温和、乐观、积极上进，工作态度谦和，认真负责，思路清晰，学生评价达95分以上，入选中南大学学生评价排名在各学院前20%的教师名单。

  主持国家自然科学基金重点、面上及青年基金项目，科技部高端外国专家引进项目以及省部级'
