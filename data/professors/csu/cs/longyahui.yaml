bio_raw: '龙亚辉，博士后，特聘教授，博士生导师，国家优青。

  入选2025年度ACM SIGBIO China 新星奖、2025年度湖南省“芙蓉学者计划”及中南大学“升华学者计划”。

  2024年12月从新加坡A*STAR博士后出站，2025年1月作为海外人才引进回国工作。2019-2021年作为访问学者在新加坡

  A*STAR

  李晓黎教授（

  IEEE Fellow

  ）团队从事生物信息学研究。长期从事生物医学应用算法开发，主要研究领域为AI for Biology、生物信息学、空间组学等。近五年，以第一

  /

  通讯作者身份在

  Nature Methods, Nature Communications, Briefings in Bioinformatics, Bioinformatics

  等国际权威期刊以及

  ECCB

  等生物信息学顶级会议发表学术论文

  20

  余篇。

  Google Scholar

  引用

  2011

  次，单篇引用最高超

  500

  次，入选ESI Top 1‰热点论文和Top 1%高被引论文，H指数为16。长期担任

  Nature Methods, Nature Machine Intelligence, Advanced Science, Genome Biology, Bioinformatics,
  PLOS Computational Biology

  等期刊审稿人。主持国家自然科学基金青年项目、优青（海外）项目

  等。

  Google Scholar:

  https://scholar.google.com/citations?user=lUoNEgcAAAAJ&hl=zh-CN&oi=ao

  【招生信息】

  1.

  每年可招收1-2名博士研究生和3名硕士研究生。

  2.

  课题组经费充足，

  欢迎对AI for Biology、生物信息学、空间组学感兴趣的优秀本科生、硕士生加入实验室。

  3.

  希望申请者具备较强的自主科研能力、代码实现能力及英文文献阅读与写作能力，有相关科研成果优先。

  4.优先吸纳有继续深造规划的同学。

  5.

  联系方式：longyahui@csu.edu.cn

