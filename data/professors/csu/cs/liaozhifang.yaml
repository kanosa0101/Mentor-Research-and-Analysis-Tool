bio_raw: '廖志芳，女，博士，中南大学计算机学院教授，博士生导师。

  近期主要从事开源智能软件、医学影像分析、知识图谱与推荐以及领域大数据分析等相关方面的研究。

  近3年来以第一作者或通讯作者在国内外学术期刊和专题会议上发表论文近30余篇，其中包括AAAI、ICML、CVPR等CCF A会、BIBM/SANER等B会以及SCI检索期刊20余篇，获得软件工程CCF
  B会 SANER2024最佳论文，获得20项软件著作权，7项专利。

  主持国家重点研发课题、JK重大专项子课题、国家自然科学基金、国家社科基金、省自然科学基金、总装预研项目、国家科技支撑项目子课题多项，担任《计算机学报》、《软件学报》、TNSE、AAAI等期刊以及会议审稿人。

  为CCF 软件工程专委会、计算机教育专委会委员。

  所在实验室气氛活跃且和谐，指导老师包括廖志芳老师与郁松老师。

  本实验室根据名额招收1-2名博士研究生，5-6名硕士研究生。

  欢迎计算机、大数据、软件工程等相关专业学生加入实验室，联系邮箱：zfliao@csu.edu.cn。'
