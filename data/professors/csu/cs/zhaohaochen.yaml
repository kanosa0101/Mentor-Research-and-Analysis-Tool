bio_raw: '赵皓晨，男，计算机应用技术博士（导师：王建新教授），硕士生导师。主持和参与国家自然科学基金多项，在Nature子刊、CCF A类期刊、生物信息学领域权威期刊和会议发表论文50余篇（第一/通信20余篇）。现为湖南省生物信息学会医学生物信息学专委会委员，CCF
  B类国际会议 BIBM 程序委员会成员，CCF C类国际会议 ISBRA 程序委员会成员以及多个

  生物信息学领域权威

  期刊审稿人。

  研究方向：

  利用人工智能算法解决生物信息学问题

  >小分子药物发现

  >肽药物识别与功能预测

  >药物生物效应属性预测

  >

  药物信息学

  硕士招生：

  每年招收2-3名硕士研究生，本课题组依托良好的科研平台与学术合作基础，具备充足的计算资源和稳定的研究支撑，能够为学生开展科研训练提供完善的条件保障。团队重视学生科研能力、学术视野与长期发展的培养，愿意在科研入门、论文写作、项目参与以及继续深造等方面给予充分支持与具体指导。对于认真投入、踏实努力并取得良好成果的同学，课题组也将给予充分认可与积极激励。课题组注重营造开放、平等、务实的学习科研环境，鼓励独立思考、合作交流与持续积累。欢迎有兴趣、有热情、踏实进取的同学加入。

