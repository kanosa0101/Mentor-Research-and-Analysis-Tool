bio_raw: '王伟平，中南大学计算机学院，教授，博士生导师，教育部网络空间安全教学指导委员会委员。中南大学计算机学院“网络威胁发现与隐私数据保护”学科方向负责人，湖南省网络空间安全研究生创新培养基地负责人。1991年获东南大学电子工程学士学位，1994年获中南大学计算机应用技术硕士学位，2004年获中南大学计算机应用技术博士学位。1994年开始在中南大学任教，2009年至2010年在美国德州A&M大学访学一年。2009年入选教育部新世纪优秀人才支持计划。主要研究兴趣包括互联网应用安全、物联网安全、安全大数据分析、网络协议分析与行为监测等。作为项目负责人承担了4项国家自然科学基金，承担及参与了其他重大科

  研项目10余项。在包括《IEEE Transactions on Information Forensics & Security》、《软件学报》、《计算机学报》等在内的国内外刊物发表学术论文90余篇。获得发明专利5项，国家软件著作权3项。作为主要参与者获得教育部自然科学一等奖1项，湖南省科技进步二等奖2项。

  长期致力于信息安全人才培养，信息安全专业负责人，主讲课程：《网络安全》、《网络与信息安全》、《信息安全专业导论》、《计算机网络》等。担任教育部网络空间安全教学指导委员会委员、湖南省网络空间安全协会专家咨询委员会专家、中国网络空间安全人才教育联盟中南大学代表。

  办公

  室：中南大学新校区信息楼429

  Email：

  wpwang@csu.edu.cn

  课题组每年招收博士研究生和硕士研究生，热忱欢迎热爱科研、积极进取的研究生和优秀本科生加入本研究组。

  正在开展的研究

  随着互联网应用的日益复杂，应用自身的异构性、开放性，带来了很多新的安全问题。课题组面向新型互联网应用的威胁感知问题，应用数据流跟踪、软件逆向、模糊测试等方法来发现应用中潜在的不安全因素，应用机器学习、深度学习、自然语言处理、可视化等数据处理方法来分析安全相关的数据，发现恶意行为和异常行为。主要研究内容包括：

  l

  复杂应用背景下的流量建模与入侵检测

  l

  恶意流量智能处置技术

  l

  APT攻击检测

  l

  攻防知识图谱及其应用

  l

  移动互联网应用安全

  l

  物联网安全

  主持'
