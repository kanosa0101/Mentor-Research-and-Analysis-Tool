bio_raw: '高杨，男，中南大学计算机学院

  硕士生导师，

  澳大利亚University of Queensland 客座研究员（Honorary Fellow），2022年8月于澳大利亚昆士兰大学信息技术与电子工程学院（school
  of ITEE）获得博士学位，11月加入中南大学计算机学院工作。研究方向专注于人工智能赋能的新型医学成像技术，尤其是快速高分辨率定量磁共振技术(Magnetic
  Resonance Imaging)及前沿

  定量磁化率（

  Quantitative Susceptibility Mapping

  ）成像,

  磁粒子成像

  （

  Magnetic Particle Imaging

  )重建及分析技术。

  主持国家自然科学基金青年项目1项，湖南省自然科学基金青年项目1项。参与国家自然科学基金国际合作项目等'
