bio_raw: '刘熙尧，中南大学计算机学院副教授, 博士生导师。北京大学本、博毕业。

  长期致力于

  生成式人工智能（AIGC）及可信内容治理研究

  ，聚焦AIGC大模型开发、多模态内容生成、数字版权保护及深度伪造识别核心领域。

  相关研究成果在

  CVPR

  ,AAAI,ECCV,IJCAI,

  PR

  ,

  TMM,

  Information Sciences, ICME, IEEE Transactions on Instrumentation and Measurement,
  Archives of Computational Methods in Engineering, Neurocomputing等国际知名学术刊物会议上发表40余篇论文。现担任中南大学学报英文版青年编委；CSIG数字取证和安全专委会委员。包括国家自然科学青年基金项目1项，国家自然科学基金子课题1项，国家军事科学院子课题1项，湖南省自然科学面上项目1项和湖南省自然科学青年基金项目1项，参与过多项国家自然科学基金面上项目和湖南省自然科学面上项目。

  与北大、拉夫堡大学等海内外顶尖团队深度合作，

  支持研究生联合培养与国际交流，获权威专家指导，优秀者可推荐至北京外企AI算法岗实习。

  本年可招收1名博士研究生、3名硕士研究生，要求诚信踏实、爱钻研、有编程基础、能胜任算法研究与工程项目实践。

  欢迎本科生加入团队进行科研训练。

  联系邮箱：lxyzoewx@csu.edu.cn 微信lxyzoewx

  研究方向简介：

  1）生成式大模型理论研究：

  混合模型协同方法研究：通过整合不同类型的人工智能模型(例如，预训练大模型、领域专用小横型、先验知识模块等) ，可以弥补大模型的不足。

  2）生成式大模型应用研究：

  文-图生图大模型用于教育领域，如教材生成：

  文-图生图大模型,应用于文创领域（刺绣、国画、唐卡、脸谱）：

  3）生成式大模型数字内容安全：

  生成式大模型中的数据样本保护，在扩散模型中嵌入内生水印和外置水印结合并进行联合训练，对数据进行有效的版权保护和溯源。

  4）伪造视频检测：

  深度视频合成技术的滥用会给国防、军事、民生等多方面带来全新安全的挑战。基于深度生成网络和分类网络实现深度合成视频的主动和被动检测，相关成果对深度合成视频的安全管控有重要作用，是现在人工智能和AIGC安全方面研究热点问题。

  5）图像视频指纹：

  将数字内容版权保护视为二分类问题，基于深度学习网络提取图像视频数字内容的鲁棒性特征，实现对数字内容的的可靠保护，是人工智能在信息安全中应用的热点问题。

  6）生成式信息隐藏方法：

  传统的信息隐藏会修改信息内容，无法达到可证的安全，会受到隐写分析器的威胁。而基于对抗式生成网络可以将特定的信息生成图像，并使用生成图像传递和还原秘密信息，从而实现可证安全的隐蔽通讯，是人工智能在信息安全中应用的热点问题。'
