bio_raw: '覃立波，男，中南大学特聘教授，博士生导师，小米青年学者，师从车万翔教授。现任中国中文信息学会青工委秘书长。主要研究兴趣为人工智能、自然语言处理、人机对话、大模型等，在人工智能及自然语言处理等领域国际会议NeurIPS、ACL、EMNLP、AAAI上发表论文多篇。研究成果曾入选Paper
  Digest高影响力论文

  及

  获得世界人工智能大会青年优秀论文提名和EMNLP2022 MMNLU Workshop最佳论文奖。入选斯坦福“全球前2%顶尖科学家”榜单、全球 AI 华人百强新星等。担任ACL、EMNLP、NAACL、ACL
  Rolling Review、AAAI、IJCAI等国际会议（高级）领域主席或高级程序委员会委员。（协助）指导学生曾获得CCF优秀大学生、国家奖学金、港府奖学金、腾讯奖学金等。

  【招生信息】

  欢迎对人工智能、自然语言处理、人机对话、大模型等方向感兴趣，

  自驱力强

  、积极主动，致力于

  科研

  的同学联系。可招收少量RA。（表现优异的同学可以帮助推荐至

  腾讯

  、

  百度

  、

  阿里巴巴、华为

  等企业实习，其中有意出国读博的同学可以帮助推荐至

  新加坡

  、

  美国

  、

  加拿大

  等知名学校）

  【联系方式】

  lbqin[AT]ir.hit.edu.cn。

