bio_raw: 邓磊，男，中南大学计算机学院教授、博士生导师。博士毕业于同济大学，曾在美国哥伦比亚大学从事博士后研究。主要研究大数据挖掘、生物计算、智能诊疗和JavaEE/C#/iOS/Android/微信应用软件开发。近年来主持和参与国家级和省部级
