bio_raw: '鲁鸣鸣副教授，博导，留美博士。

  本科、硕士、博士分别毕业于上海同济大学、复旦大学和美国佛罗里达大西洋大学

  招生

  ：博士生、

  硕士（联系方式：mingminglu@csu.edu.cn）。

  常年招收科研助理、本科/硕士实习生、博士后。

  加入课题组的研究生将依据基础不同，在老师的带领下开展Python数据处理、深度学习入门等基础课程的学习和讨论。在掌握一定基础的前提下，将在学长的带领下参与各类实际项目进行实战训练，并通过讨论班的形式训练论文阅读、写作和算法复现等科研训练。

  课题组学生基本都能获得各类奖学金，并根据项目和科研贡献发放相应的科研津贴。

  课题组毕业生去向都是一线城市的大厂或金融银行业、国企。招生名额有限，尽快邮件联系，要求动手能力强、自我约束能力强、团队合作能力强。

  科研方向：

  近年来主要研究基于视觉大语言模型的智能体及其在视频安防异常检测、无人机/卫星遥感监测、半人型机器人、智能体仿真等方面的应用，以及类脑启发下的新型人工神经网络。在国内外会议和期刊上发表高水平学术论文八十余篇（包括ACL、CVPR、Ubicomp、InfoCom、TPDS、TKDE、

  Nature Communications等

  ）,部分已发表论文列表：

  https://dblp.org/pers/hd/l/Lu:Mingming

  ，

  https://www.semanticscholar.org/author/Mingming-Lu/2057267

  https://deepai.org/profile/mingming-lu

  专利三十余项。'
