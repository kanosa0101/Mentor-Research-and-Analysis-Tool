bio_raw: '个人简介

  Personal Profile

  李芳芳，女，教授，博士生导师。

  湖南省自然科学基金杰出青年基金获得者、

  湖南省湖湘青年英才、湖南省科技创新计划青年科技人才、长沙市杰出创新青年人才。中南大学网络内容安全研究中心主任

  。面向维护国家安全和社会稳定的重大战略需求，长期专注研究网络内容安全

  感知

  与大数据智能处理

  算法、自然语言处理等，培养国内紧缺的网络内容安全人才，提出社交媒体数据语义表示方法、内容安全态势感知方法等。

  2006年于武汉大学遥感学院获得地图学与地理信息系统硕士学位，2009年于武汉大学遥感学院获得摄影测量与遥感博士学位。2009-2014年任职于国防科技大学信息系统与管理学院，讲师。2015年至今任职于中南大学计算机学院，副教授、教授。担任2024大模型、大搜索与生成专委会GenTalk真知论坛本地主席。现为湖南省网络空间安全协会理事、湖南省网络安全标准化技术委员会委员、CCF高级会员、CCF自然语言处理专委会委员、中国人工智能学会青年工作委员会委员、中文信息学会青年工作委员会委员、中国指挥控制学会大模型与决策专委会委员等。担任多个
  JCR 1区国际重要学术期刊审稿人，国家自然科学基金通讯评审专家、教育部学科评估专家、湖南省发改委项目评审专家等。

  教学方面：

  获中南大学2024年度光云科技优秀教师奖、获省级教学成果奖2项、省计算机学会教学成果奖1项，

  主持省部级教改课题2项、主持校级教改课题5项，第一作者发表教改论文5篇。

  指导学生竞赛获国家级和省部级等奖项21项。

  科研方面：

  获湖南省科学技术进步奖二等奖

  1

  项

  （排名2）

  、

  湖南省人工智能学会技术应用二等奖

  1

  项（排名1）、第十一届国际发明展览会银奖1项（排名1）。

  作为第一负责人先后主持：国家级重点项目1项、国家级一般项目2项、国家自然科学基金青年基金1项、国家自然科学基金面上基金1项、省自然科学基金3项、市自然科学基金1项、中国博士后科学基金1项等。作为第一负责人先后主持：企业横向项目40余项，相关落地产品8套、算法28个。多项课题均围绕互联网内容安全和大数据智能处理展开，

  所主持的科研成果作为学院代表，被2021年世界计算机大会收录参展。

  以第一发明人授权发明专利36项，成果转化9项。

  论文方面：

  近几年以第一/通讯作者在

  ACL、

  WWW

  、

  SIGIR

  、NIPS、AAAI、TKDE、ACM TKDD、ACM TOMM、PR、EMNLP

  等国内外顶级会议和学术期刊发表论文32篇，获得ACL2024杰出论文奖（排名1）。

  此外，代表学院为我省疫情防控作出贡献，省卫健委专门发来感谢信。

  参与编写书籍1部。

  2023年，指导本科生和研究生获

  第十三届“挑战杯”中国大学生创新创业计划竞赛全国铜奖。

  2022年，指导本科生和研究生获全国大学生“互联网+”大赛产业赛道全国铜奖。

  2021年，指导研究生参加首届全球人工智能技术创新大赛中，获得赛道三：小布助手对话短文本语义

  匹配的

  全国一等奖。

  2020年，指导研究生参加“中国法研杯”司法人工智能挑战赛 CAIL 2020，获得阅读理解赛道

  全国总冠军

  。

  2019年，指导研究生参加最高人民法院举办的“中国法研杯”司法人工智能挑战赛（CAIL 2019）中

  ，

  获得阅读理解赛道

  全国三等奖

  。

  毕业的研究生动手能力优秀，非常受大型企业欢迎，近几年毕业研究生主要去向：腾讯、快手、字节跳动、华为、网易等。

  2026年有2名博士生指标，欢迎报考。'
