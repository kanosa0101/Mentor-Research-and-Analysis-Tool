bio_raw: '教授、博士生导师、国家高层次青年人才计划入选者。研究方向为

  机器学习、深度学习、数据挖掘、生物信息学、医学图像分析等，研究工作集中在AI for Science相关研究，主要研发人工智能算法助力生物分子序列、结构与功能发现，及智能计算驱动的生物合成及精准医疗。

  发表生物信息学领域重要期刊与

  会议论文百余篇，其中代表作包括：Nat. Commun.、IEEE T Pattern Anal.、IEEE T Knowl. Data En.、ACM Comput.
  Surv.、Natl. Sci. Rev.、Nucleic Acids Res.、Genome Biol.、Genome Res.等SCI期刊论文、NeurIPS、ICML、ICLR、AAAI、IJCAI、ACM
  MM、WWW等顶级会议论文，ESI高被引论文13篇、热点论文2篇，总引用7500余次，Google H-index为49。主持五项国家自然科学基金（重点、优青、面上、青年）、一项科技部重点研发项目课题、一项科技委创新特区项目课题、两项湖南省自科基金（重点、优青）、一项湖南省教育厅重点项目等。荣获2021年天津市自然科学二等奖（排名第一）、2023年吴文俊人工智能自然科学二等奖（排名第二）、2022年浙江省生物信息学会自然科学二等奖（排名第三）、2024年山东省计算机学会科技进步二等奖（排名第三）、2025年山东省计算机学会

  自然科学二等奖（排名第二）

  ，入选2024年度小米青年学者。授权中国发明专利10项、申请中国发明专利15项、卢森堡发明专利4项、南非发明专利3项。担任CCF生物信息学专业委员会委员、CAAI生物信息与人工生命专业委员会委员、CAA智能健康与生物信息专业委员会委员、ACM
  SIGBIO China委员；同时担任PLOS Computational Biology等

  SCI期刊

  编委、国际会议BIBM 2022（CCF B类）程序委员会主席、CCF生物信息学大会CBC 2022程序委员会主席、BIBM、APBC等国际会议程序委员会成员。培养多名博士、硕士研究生获得国家奖学金。

  课题组常年招收博士后、博士研究生、硕士研究生，欢迎有科研兴趣的本科生加入实验室，请邮件与我联系。欢迎对人工智能研究有兴趣的其他专业本科生和研究生（生物、化学、药学、基础医学等）进组学习。课题组在学校政策允许范围内给予科研补助。'
