bio_raw: '张潮，中南大学计算机学院研究生导师，2024年入选芙蓉计划高层次人才（湖南省“百人计划”）。 2018年博士毕业于巴黎萨克雷大学(原巴黎第十一大学)，先后在美国普林斯顿大学和巴黎萨克雷大学从事博士后研究，在阿联酋哈利法大学6G研究中心担任研究科学家。近年以第一作者或通讯作者在国际权威期刊和会议JSAC/TWC/Applied
  Energy/TVT/Nature Reviews Electrical Engineering等上发表了论文40余篇，与贝尔实验室等合作授权美国专利三项。多次担任IEEE
  WIOPT等通信国际会议的workshop联合组织主席。

  【硕士招生】

  每年招收2-3名左右硕士研究生，欢迎对大模型压缩、边缘大模型、语义通信等领域感兴趣的同学与我联系。

  研究方向：

  1. 模型压缩（量化、剪枝、低秩分解、高效微调）与边缘大模型

  2. 语义通信与任务导向通信

