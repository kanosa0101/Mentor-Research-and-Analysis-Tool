bio_raw: '段俊文，博士，现为中南大学计算机学院副教授、博士生导师。博士毕业于哈尔滨工业大学计算机学院社会计算与信息检索研究中心，博士期间曾赴美国伊利诺伊大学香槟分校（UIUC）联合培养，导师ACM
  Fellow 翟成祥教授。主要研究内容为大语言模型，自然语言处理、医学人工智能等。在国际知名期刊和会议TASLP/AAAI/IJCAI/EMNLP/COLING/NAACL等发表论文30余篇，同时担任ACL，AAAI,
  IJCAI, EMNLP等领域顶级会议和期刊审稿人，社会媒体处理专委会常委/秘书。

  【研究方向】围绕自然语言处理展开，具体包括：医学人工智能、多模态、大语言模型应用等。

  【

  硕士招生

  】每年招收3名左右硕士研究生，目前还有少量名额，欢迎对自然语言处理、大语言模型感兴趣的同学与我联系（邮箱：jwduan@csu.edu.cn）。指导的研究生曾获得国家奖学金、比亚迪特别奖学金。

  【

  本科生科研训练

  】欢迎对自然语言处理感兴趣的优秀本科生加入课题组。

