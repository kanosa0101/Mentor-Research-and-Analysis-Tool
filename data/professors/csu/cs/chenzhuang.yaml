  陈壮

  ，

  中南大学计算机学院特聘副教授

  、硕士生导师，2024年10月入职。在清华大学计算机系完成博士后研究工作，合作导师为

  黄民烈教授

  。博士毕业于武汉大学计算机学院，导师为

  钱铁云教授

  。本科和硕士毕业于华中科技大学光学与电子信息学院，导师为

  余国义副教授

  。主要研究方向为大语言模型、社交智能和计算心理学等。近五年在ACL、EMNLP、AAAI等自然语言处理和人工智能顶级会议或期刊上发表论文二十余篇，其中一作/通讯A类论文十余篇，被引千余次。获得ACL2024领域主席奖、CIPS-LMG

  2024优秀海报奖、MNLP2024论坛突出成果奖，作为核心成员研发角色大模型CharacterGLM和心理大模型Emohaa。担任计算语言学顶会ACL、EMNLP、NAACL的领域主席和顶刊TACL、CL的常驻审稿人，中文信息学会大模型与生成专委会、情感计算专委会委员。受邀在全国知识图谱与语义计算大会、全国社会媒体处理大会、全国大模型智能生成大会等重要学术会议上做报告。主持博士后科学基金面上资助项目。

  CoLa研究小组（Cognition & Language

  Group

  ）

  CoLa

  Group

  主要研究方向为

  Mental World Simulation

  ，聚焦于通过大语言模型等人工智能方法进行心理状态建模，使机器能够理解并表现出人类的情绪、认知和行为。我们在机器心智、情绪支持、角色扮演等方向开展了多项前沿性研究，在多个CCF
  A/B类国际顶级会议上发表论文并获奖。在实际场景中，

  CoLa Group

  关注

  AI x Mental Healthcare

  ，与

  聆心智能

  一起在评估筛查、陪伴干预、评价督导等方向开展前沿示范应用，已覆盖数十万真实用户。小组

  每年招收3名左右硕士研究生

  ，目前仍有

  2027年秋季入学名额，欢迎联系。

  CoLa Group

  还与

  清华大学CoAI课题组

  及

  聆心智能

  联合招收实习生

  ，提供科研训练机会，实习地点可选北京&长沙

  [实习生目前已满]

  。

  CoLa Group

  隶属于

  张健教授

  带领的中南大学认知计算与智能信息处理团队。欢迎对大语言模型、社会科学、心理学感兴趣的同学与我联系（zhchen18邮箱符号foxmail.com，标题 202x-硕士生/实习生申请-姓名-学校）。

  🌟

  🌟🌟

  近期有大量同学联系，无法一一回复，请

  已明确会选择中南

  的同学在邮件中注明后，再重新与我联系，谢谢！！！

  特别提醒：

  - 保研过程中，导师仅有推荐权，学生需要获得学校名额才能最终入学；

  - 请明确进组意愿后再申请，节省彼此时间；

  - 课题组每周开组会，请能接受该培养方式的同学再申请

  ；

  - 大四需提前进组进行科研训练（线上/线下）。

  核心优势

  - 聚焦“人工智能 × 心理学 × 社会科学”前沿

  ，做更有意思的研究

  ；

  - 算力资源充沛，能支持大size（>200B）LLMs训练与推理；

  - 亲自指导选题、实验、写作等科研全流程，鼓励学术交流与实习实践；

  - 与顶尖实验室和AI大厂保持紧密合作，研究能落地，解决“真”问题。

  招生要求

  - 诚信；

  - 对科研工作有热情，有自驱力和独立思考能力，认可“读书是为自己而不是为别人”；

  - 优先考虑有NLP研究基础、数学/编程竞赛获奖、发表过论文、有升学意愿、交流能力强的同学；

  - 联系时请发送详细简历与成绩单。个人精力有限无法回复所有邮件，对合适人选会尽快安排面试。

