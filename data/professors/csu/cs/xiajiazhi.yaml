bio_raw: '夏佳志，博士，教授，博士生导师，中南大学计算机学院副院长。研究领域包括文化智能、大数据智能、数据可视化、计算机图形学。

  入选国家级青年人才，主持国家自然科学基金区域联合重点项目“面向建筑艺术文化创新的民族建筑景观图像可信智能融合关键技术”、国家某部委重大项目课题、湖南省

  杰出青年基金、国家自然科学基金等项目多项。于IEEE VIS、IEEE TVCG、ACM MM、ACM SIGCHI等会议和期刊上发表相关学术论文多篇，曾获CAD/Graphics
  2017最佳

  论文奖，IEEE VIS 2020 最佳论文提名奖，CHI 2025 最佳论文提名奖。曾任CCF CAD/CG 2025 程序主席、GAMES 2022 程序主席、ChinaVis
  2021论文共同主席、ChinaVis

  2019-2020综述论文共同主席，IEEE VIS 2025 -2026 短文主席、IEEE VIS 2023-2024海报主席、《Frontiers of
  Computer Science》青年编委，《Visual Informatics》青年

  编委，《计算机辅助设计与图形学学报》编委。

  个人最新成果见：www.xiajiazhi.com

  每年招收博士生2名，硕士生3名，欢迎有志于科研的同学加入课题组，有人工智能、可视化、图形学、三维视觉相关基础优先。博士申请人建议提前一年联系。

  电子邮件：xiajiazhi@csu.edu.cn'
