bio_raw: 2021年6月毕业于北京交通大学信息科学研究所，2019年9月至2020年10月在美国密苏里大学哥伦比亚分校访学，2021年9月入职中南大学，主要研究方向为多模态大模型。近年来在国际高水平期刊和会议上发表论文六十余篇，其中包括CCF-A类期刊IEEE
  TPAMI、IEEE TIP、IEEE TMM，以及IEEE TNNLS、IEEE TCSVT等主流期刊，并在CCF-A类国际会议ICML、CVPR、ACMMM等发表多篇论文。主持或联合承担国家自然科学基金青年基金、湖南省自然科学基金青年基金等
