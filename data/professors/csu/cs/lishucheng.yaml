bio_raw: '李书城，男，1998年9月生，湖南华容人。本科、博士（保送直博）均毕业于南京大学计算机科学与技术系，博士导师为许封元教授，所在团队为仲盛教授带领的COSEC（网络合作与安全）课题组。自2025年1月起，正式入职中南大学计算机学院，合作指导老师为吕丰教授。

  主要研究方向包括物联网、大数据、边缘智能、智能辅助诊疗。主持国自然青年项目，主持湖南省自然科学基金面上项目，以核心骨干身份参与科技部国家重点研发计划课题 2 项。在ToN、TMC、CCS、SIGIR、INFOCOM等高水平国际期刊/会议发表论文
  10 余篇，谷歌学术引用 800 余次，单篇最高 500 余次。曾获信息安全领域国际顶会ACM CCS最佳论文提名奖（2%）、数据挖掘顶级会议KDD图深度学习研讨会最佳学生论文奖（唯一）
  。担任ICPADS（系统领域CCF-C会）、ICCCN（网络领域CCF-C会）、ICCT等国际会议 TPC 。ACM南京分会优博奖（第一）。

  - 非常欢迎对科研感兴趣的本科生、硕士生与我联系，邮箱: shuchengli@csu.edu.cn；

  - 【新】2026年硕士招生还有名额，欢迎感兴趣的同学与我联系；

  - 优秀的同学可帮助推荐至腾讯、字节跳动、阿里巴巴、华为、美团等企业实习;

  - 学术主页：

  [Google Scholar]'
