  招聘

  ：

  2027年招生：

  秋季入学博士生：名额还有1，外校有论文发表经验（1区期刊/CCF-A类会议），本校直博生须GPA排名前8%。

  硕士生：名额还有1，github维护的好/算法竞赛突出/ccf-b以上优先考虑。

  研究助理：须有（2区以上期刊/CCF- B以上）论文发表经历。

  远程实习生：名额有1，动手能力好欢迎联系。

  《招生须知》：

  大模型是比较火，但是技术在快速更新迭代，以月为单位，此外现在就业好不代表以后就业好，对AI感兴趣才能保持长久热情，一时兴起的仔细考虑一下想要什么。follow前沿技术非常辛苦并且是是实验科学，需要花大量时间投入和做实验。需要提前做好心理建设，
  coding太弱的不适合。

  本人水平有限，想小几个月发顶会的同学请勿联系。

  诚实靠谱是重要品质，老师们每年也都收到大量邮件，我这里没有waiting list的说法，只有几个名额，请考虑确实合适了再联系。论文/竞赛不是自己完成，过度包装的也请勿联系。

  Self-motivated的再联系，套瓷勿扰。

  感兴趣的请把简历提交至 jinpengwang at csu dot edu dot cn，并加入prompt [已读《招生须知》]，有必要的我一周内会安排面试。'
