bio_raw: '钟萍，副教授，博士生导师/硕士生导师。2004年获国防科技大学学士学位，2011年获厦门大学博士学位，2013年于剑桥大学计算机实验室完成博士后研究。中国计算机学会（CCF）高级会员、物联网专委会执行委员、计算机应用专委会执行委员，中国人工智能学会具身智能专委会委员，国家自然科学基金函评专家，教育部学位与研究生教育学位论文评审专家，广东省科技项目评审专家，江西省科技项目评审专家，长沙市科技项目评审专家，
  计算机“101 计划”湖南省工作组专家。SCI期刊IEEE Trans系里TRO、TSC、TITS、TCSVT、TCDS、CYB-E等，以及SCI期刊JAS、 ITSC、JNCA、CCPE等，和国内《计算机学报》《信息安全学报》等审稿专家。主要从事物联网、智慧交通、人工智能、具身智能等方面研究工作。作为研究骨干先后参与了英国工程和自然科学研究委员会（EPSRC）项目，英国企业技术开发项目，中国国家科技重大专项，国家自然科学基金项目，省科技重大专项等。主持国家自然科学基金、湖南省自然科学基金、教育部科技发展中心高校产学研创新基金、长沙市自然科学基金、校级实验室开放专项基金、校级教育教学改革研究项目、湘江人工智能学院教育教学改革研究项目等。以第一作者和通讯作者发表学术论文80余篇，

  DBLP

  。 授权国家发明专利15项。获得比亚迪优秀教师奖、中南大学优秀班导师、湖南省高等教育教学成果奖一等奖、湖南省教学创新大赛二等奖等奖励。现任学院《人工智能》课程组长、计算机科学系副主任、计算机科学拔尖基地（图灵）班T2201班导师、邓迪学院计算机D2201班导师。

  联系邮箱  ping.zhong@csu.edu.cn

  研究指导

  指导研究生多次获得研究生自主探索创新项目、国家奖学金、学科竞赛、高水平论文等成果。

  我们小组现主要基于计算机视觉和强化学习的机器人探索与导航工作，包括对象目标导航、视觉语言导航、车臂融合、人机物融合场景等，详见本页“

  研究方向

  ”。A demo video is available at: https://youtu.be/mzsFSr4e3sQ

  组内拥有高质量、数量充足的机器人实验平台，包括Husky移动机器人（1台）、UR5机械臂（1台）、AutoDriver自动驾驶车辆（1台）、Base物流机器人（1台）、Turtlebot4移动机器人（多台）等机器人科研平台。拥有NVIDIA
  Xavier AGX、NVIDIA JetSon TX2、树莓派等机器人控制器，以及三维激光雷达、Zed深度相机、IMU等传感器若干，为机器人自主探索、导航和环境感知研究提供硬件支持。

  欢迎有志于物联网、人工智能、具身智能、自主无人系统、机器人等领域的同学加盟，共度三年精彩时光。

  同时，欢迎学习主动且能力优秀的本科生，尤其是热爱AI技术、对计算机视觉、语音语言理解、机器人感兴趣、有一定的编程基础或硬件基础，加入我们的研究小组，共同进步，这里将有优秀师兄师姐带队打比赛、做项目、发论文，积累宝贵的科研经历。

  竞赛指导

  多次担任学科竞赛评委，并指导学生获得相关竞赛奖项。获得全国大学生物联网设计竞赛优秀指导教师（2021）、中国大学生软件创新大赛中荣获优秀指导老师（2023）、中国高校计算机大赛-AIGC创新赛
  全国优秀组织教师奖（2025）。

