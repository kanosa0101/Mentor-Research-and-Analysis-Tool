bio_raw: '裘嵘，女，

  博士，副教授，硕士生导师，湖南省神经科学学会青年委员。主要研究方向为机器学习、

  医学大数据分析和挖掘、生物信息学

  。

  2008

  年

  11

  月－

  2009

  年

  12

  月，在美国精神遗传学研究的著名学者——芝加哥大学

  Elliot S. Gershon

  教授的实验室进修，在他和中南大学医学遗传学国家重点实验室特聘教授刘春宇的指导下，从事

  GWAS

  数据分析研究。通过从事计算机应用技术与生物数据相结合的研究，在国际权威期刊和学术会议发表

  SCI

  论文多篇。主持和参加国家重点研发，国家自然科学基金等省部级课题多项。'
