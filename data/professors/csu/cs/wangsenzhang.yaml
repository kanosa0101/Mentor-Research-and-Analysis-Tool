bio_raw: '王森章，教授，

  博士生导师，

  湖南省青年“芙蓉学者”，

  网络空间安全系副主任。

  2016年1月博士毕业于北京航空航天大学， 2013年9月至2015年9月，作为联合培养博士生在美国伊利诺伊大学芝加哥分校访学，指导教授为Philip S. Yu教授。2016年5月加入南京航空航天大学。入选“香江学者”项目资助，2018年1月至2020年1月在香港理工大学工作。2021年3月加入中南大学

  计算机学院

  。

  王森章教授的主要研究方向是机器学习、时空数据和图数据挖掘、大模型、推荐系统等。

  在数据挖掘、人工智能等领域的主流国际期刊和会议发表论文

  200

  余篇，其中发表在

  CCF推荐A类会议期刊论文60余

  篇，

  B类期刊会议以及ACM/IEEE Trans.汇刊论文70余篇。

  申请发明专利

  10余

  项。代表性论文发表在相关领域的顶级国际会议和期刊，包括数据挖掘和人工智能领域顶级国际会议

  KDD、NeurIPS、SIGIR、IJCAI、AAAI、WWW、ICLR、SDM、CIKM

  、

  ICDM等

  ，以及期刊

  IEEE Transactions on Intelligent Transportation Systems、IEEE Transactions on Knowledge
  and Data Enginerring、ACM Transactions on Information Systems、ACM Transactions on
  Intelligent System and Technology、IEEE Transactions on Cybernetics

  、

  IEEE Transactions on Big Data

  等。所发表论文根据谷歌学术统计，累积被引1万1千余次，H-index=60。一篇论文获CCF- C类会议ADMA2020“最佳学生论文奖”，一篇论文入选CCF
  B类会议ICDM的Best Paper Candidate，一篇论文获得CCF-C类会议PAKDD2025“最有影响力论文”，一篇论文获得CCF-B类会议WSDM2025
  “Top-Ranked papers”。

  先后获得2021湖南省青年“芙蓉学者”、

  2020

  年江苏省科协“青年托举人才”、

  2019年南京航空航天大学“长空学者”、

  2018

  年

  “

  香江学者

  ”

  博士后项目、

  “北京航空航天大学优秀博士论文”，“北京市优秀博士毕业生”

  等人才项目资助。主持包括国家自然科学基金面上/青年基金、江苏省自然科学基金面上项目、重点实验室开放课题基金、腾讯

  “犀牛鸟”基金、中国人工智能学会-华为MindSpore项目、中央高校基本科研业务经费、广东省自然科学基金面上项目等20余项研究课题

  。王森章博士是中国计算机学会数据库专委会执行委员，

  中国计算机学会大数据专家委员会执行委员，中国计算机学会人工智能与模式识别专委会执行委员，

  担任《智能科学与技术学报》编委，《计算机工程》青年编委，国际知名期刊

  ACM Transactions on Intelligent Systems and Technology（JCR1区）和Remote Sensing

  （JCR1区）

  的客座编委。先后四十余次担任所在领域国际期刊、国际会议的审稿人，经常性担任国际顶级会议程序委员会成员（

  PC Member

  ）及高级成员（

  Senior PC Member

  ）。

  查看全部'
