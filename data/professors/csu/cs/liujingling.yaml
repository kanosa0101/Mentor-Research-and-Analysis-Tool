bio_raw: '刘敬玲 (Jingling Liu)，博士，现为中南大学计算机学院网络空间安全系副教授，硕士生导师。研究方向为数据中心网络，目前主要研究高性能网络协议、大模型训推系统优化、

  新型可编程网络

  等。主持国家自然科学基金青年项目一项、湖南省自然科学基金青年项目一项，联合承担贵州省科技支撑计划项目一项，参与国家自然科学基金重点项目、面上项目多项，在IEEE
  ToN、IEEE TMC、软件学报、电子学报等期刊和EuroSYS、ATC、ICNP、ICDCS、IWQoS等国际会议上发表40余篇学术论文，担任中国计算机学会分布式计算与系统专委会执行委员，获得CCF技术发明二等奖、CCF互联网专委优博提名、湖南省优秀毕业研究生、ICA3PP最佳学生论文、中南大学优秀博士学位论文等奖项。

  【硕士招生】

  每年招收2名左右硕士研究生，欢迎对数据中心网络感兴趣的同学与我联系（邮箱：jinglingliu@csu.edu.cn）'
