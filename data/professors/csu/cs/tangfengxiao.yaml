bio_raw: '唐枫枭，男，

  中南大学教授，

  2012年本科毕业于武汉理工大学，2015年获得中南大学软件工程硕士学位，2019年获得日本东北大学博士学位。2019年担任日本东北大学助理教授，2020年担任日本东北大学副教授，2021年至今任中南大学教授。

  主要研究方向包括网络智能化，复杂系统数字孪生与故障诊断，网络智能运维，空天地一体化网络运维与优化等。

  承担国家青年基金/科技部2030子课题/重大专项子课题等，近五年相关工作在IEEE JSAC、IEEE TC、IEEE Proceedings、IEEE WCM、IEEE
  COMMAG和IEEE Network等权威期刊与会议发表论文80余篇（JCR1区60+, CCFA类论文20+），累计被70多个国家/地区的学者引用一万余次。获通信领域旗舰会议Globecom（2017，2018）和ICC(2025)最佳论文奖，IEEE通信协会亚太地区杰出论文奖、IEEE认知网络技术委员会论文贡献奖、ICNIDC最佳论文奖等奖项十余项，

  2021,2022与2025全球高被引学者，2021年度IEEE通信学会亚太地区杰出青年学者。

  更多信息欢迎访问我的个人主页：https://csufunlab.github.io/tangfengxiao/

  团队每年招收博士研究生，硕士研究生，对本人研究方向感兴趣的同学请联系：Email: tangfengxiao@csu.edu.cn。'
