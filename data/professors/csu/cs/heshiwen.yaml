bio_raw: '个人简介

  Personal Profile

  何世文，男，1978年出生，湖南汝城县人，教授，

  博士生导师，IEEE高级会员

  (Senior Member, IEEE）

  ，

  天池英才

  特聘教授

  ，

  中

  国计算机学会高级会员(CCF Senior Member）。2009年于成都理工大学获得计算数学专业理学硕士学位，2013年于东南大学获得信息与通信工程专业工学博士学位。2013-2015年东南大学电子科学与技术工作站博士后。2013年12月至2018年4月兼任中兴微通信息科技有限公司技术技术总监。2015年11月起任职于东南大学信息科学与工程学院，助理研究员。2017年4月30日起任职于东南大学信息科学与工程学院，副研究员，硕士生导师。2018年4月15日起任职于中南大学计算机学院，教授，博士生导师。

  本人

  曾入选美国斯坦福大学发布的全球前2%顶尖科学家榜单--《2024年度科学影响力排行榜》，曾获2024年安徽省通信学会科学技术奖自然科学类二等奖，

  曾获2024年IEEE ICC国际会议最佳论文奖，

  曾获《无线电通信技术》2023年度十佳论文奖，

  团队曾获鹏程实验室南京基地紫金山实验室2021年度优秀集体荣誉称号，曾

  入选美国斯坦福大学发布的全球前2%顶尖科学家榜单--《2019年度科学影响力排行榜》，曾获教育部2018年高等学校科学研究优秀成果技术发明二等奖，

  曾获IEEE 802.11aj国际标准发展杰出贡献奖（IEEE Standard Association），曾获中国电子教育学会2017年度优秀博士学位论文，曾获2015年度全国无线个域网工作优秀编辑奖，

  曾获2015年度东南大学优秀博士学位论文，曾获2005年度湖南省机要密码工作先进个人和湖南省普通高等学校2001届优秀毕业生。

  本人从事

  无线

  内生智能

  通信和并行计算体系结构的基础理论研究与标准协议制定和

  可编程无线内生智能通信原型系统研发。本人曾作为技术副编辑及总体构架制定者，负责起草IEEE 802.11家族中毫米波无线局域网技术规

  范(中国首次主导)IEEE 802.11aj（技术副编辑）和国内无线局域网信息技术系统间远程通信和信息交换局域网和城域网特定要求Q波段超高速无线局域网的媒体访问控制和物理层规范。

  利用FPGA、URSP、分布式系统与云边计算、微服务、高性能计算及虚拟化等先进通信与计算机技术，依据3GPP标准协议及IEEE 802.11系列标准

  协议规范

  ，

  着力

  研发

  集数据采析、内生智能、性能评估、实时可视于一体的可编程无线内生智能通信关键技术验证系统，有效提升新兴通信技术可行性分析及加速新兴通信技术新产品研发。

  本人曾

  在Proceeding of the IEEE，IEEE Wireless Communication Magazine，IEEE Journal of Selected
  Area in Communications，IEEE Transactions on Signal Processing, IEEE Transactions
  on Communications和IEEE Transactions on Wireless Communications等国际权威SCI期刊、国际会议和国内权威期刊论文共170篇。本人已获国际授权发明专利7件和国内授权发明专利112件；向IEEE
  802.11国际标准组织提交技术提案27项。

  本人曾

  担任国际期刊IEEE Signal Processing Letters和EURASIP Journal on Wireless Communications
  and Networking的副编辑。

  本人曾主

  持国家重大科技专项课题、中央军委装备发展部“十三五”全军共用信息系统装备预先研究项目课题、国家重点研发计划项目子课题、国家自然科学基金面上项目、湖南省2025年十大技术攻关项目课题、江苏省

  重点研发项目子课题、湖南省自然科学基金面上、东南大学移动通信国家重点实验室开放课题项目和桂林电子科技大学教育部重点实验室开放基金项目、主持级教改项目。

  本人曾主持

  主持与深圳千通科技有限公司、中国人民解放军75841部队、中国电信股份有限公司、华为技术有限公司、中兴通讯股份有限公司、长沙金维信息技术有限公司、树根互联股份有限公司、OPPO广东移动通信有限公司和维沃移动通信（杭州）有限公司等企业合作的横向项目。本人曾作为核

  心技术负责人参与完成国家863计划重大项目、重大专项项目、江苏省成果转化项目和华为合作项目和作为核心技术骨干人员参与国家重点项目、国际重点合作项目和国家自然科学基金面上项目。

  主要讲授：

  计算机程序设计基础（C语言）（必修课程）、编译原理

  （必修课程）、

  计算机体系结构（必修

  课程

  ）

  ；

  欢迎具有良好的

  数学

  基础和较强

  C/C++程序

  开发能力，及志向于开展融合机器学习、深度学习、数据分析于

  网络底层通信机理、内生智能通信机理与应用技术研发

  的广大学子加入团队学习深造。

  邮箱：

  shiwen.he.hn@aliyun.com

  2026年招学术博士研究生1名，硕士研究生2-3名。'
