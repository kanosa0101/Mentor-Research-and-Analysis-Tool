bio_raw: '宋虹，博士，

  副教授，

  硕士生

  导师，

  网络空间安全系副主任

  。主要研究方向为系统安全、漏洞检测与挖掘、网络安全。主持和参与国家国际科技合作专项子项、国家重点研发计划、横向课题等

