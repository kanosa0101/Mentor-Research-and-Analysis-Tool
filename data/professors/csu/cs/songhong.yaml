  项。出版“十一五”国家级规划教材

  1

  部，荣获高校计算机专业优秀教师奖励计划、湖南省高等教育教学成果奖一等奖、湖南省网络安全技能竞赛一等奖、励志优秀教师奖、茅以升教师奖等奖励和荣誉。指导学生参与国家级和省部级专业竞赛获一等奖多项，荣获全国第十届大学生信息安全竞赛优秀指导教师等称号。

  课题组常年招收博士研究生和硕士研究生，热忱欢迎热爱科研、积极进取的研究生和优秀本科生加入。'
