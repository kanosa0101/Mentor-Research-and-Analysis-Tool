bio_raw: 女，1980年6月出生，籍贯湖南长沙，博士，中共党员，副教授，现任教于中南大学计算机学院。2011年获得中南大学计算机应用技术博士学位。2007年至2008年在美国芝加哥大学和Argonne国家实验室里从事分布式计算（网格计算）的相关研究。2014年在国防科学技术大学软件工程博士后流动站中从事分布式虚拟化环境中资源弹性管理与调度的相关科研工作。曾作为主要参与人多次参加国家自然科学基金项目、国家高技术研究发展计划（863项目）、湖南省自然科学基金项目等项目，近年来共发表科研论文20余篇。近年来的主要研究方向包括分布式处理与云计算、工业数据智能、数字孪生、工业互联网等，在新代一代信息技术在工业领域的应用中方面具有丰富的经验，参加了工业领域中多项国标和行标的编写，并参与了水电、商用航空发动机、水泥、型材等行业中龙头企业的数字化项目和工业互联网平台的建设工作。
