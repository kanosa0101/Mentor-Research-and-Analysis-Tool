bio_raw: '个人简介

  Personal Profile

  赵颖，男，博士，中南大学计算机学院，教授，博导，湖南省青年芙蓉学者，数据科学与工程系主任，网络安全可视化校企联合实验室主任。2002年本科毕业于中南大学计算机专业，2002-2005年在清华大学攻读计算机应用技术硕士学位，2005年开始在中南大学任教，2011-2014年在中南大学攻读计算机应用技术博士学位，2015年被评为副教授，2020年获博士生导师资格，2020年被评为教授。研究方向主要包括：大数据

  、大模型与智能体

  、可视化与可视分析、人机混合智能、数据挖掘、机器学习。应用实践领域主要包括：网络安全、无线通信、智能制造、智慧城市、数据治理。

  近5年，主持国家级项目5项、省部级项目3项；主持与奇安信、华为云、阿里云、博世、中电科、航天科技等著名企业的产学研合作项目10余项；发表论文50余篇，其中可视化领域CCF
  A类期刊和会议论文11篇，高被引论文3篇；申请发明专利20余项和软件著作权30余项；获IEEE VAST Challenge 2012-2017国际可视分析挑战赛大奖6项；获IEEE
  VIS 2020和IEEE VIS 2022最佳论文提名奖，获

  CAD/Graphics 2025和

  IEEE PacificVis 2018最佳论文提名奖，获ChinaVis 2018和CSS 2013最佳论文奖。获省级教学成果二等奖2项, 省级科技成果二等奖2项。担任中国图象图形学会可视化与可视分析专业委员会常务委员，中国数据可视分析挑战赛2015-2020主席，VINCI
  2020 论文主席，ChinaVis 2022-2023论文主席, GAMES 2022组织委员会主席，IEEE VIS 2020-2022程序委员会委员。

  最新动态请关注新浪微博：@中南大学可视化小组

  部分成果视频请访问主页：

  http://i.youku.com/csuvis

  ；

  https://space.bilibili.com/1609083276

  本人每年招收硕士生3人，博士生1-2人，博士后1-2人，欢迎联系！zhaoying@csu.edu.cn

  <代表性'
