bio_raw: '张祖平，男，计算机应用技术博士，基础数学本科、硕士，中南大学教授，博士生导师，基础医学博士后（在湘雅医学院肿瘤研究所从事基因数据分析与处理），加拿大西安大略大学(The
  University of Western Ontario)国家公派访问学者。计算机科学与技术系主任，中南大学大数据技术及应用研究团队负责人。中南大学“531人才计划”第二层次人才。

  长期从事大数据与知识工程、信息度量与信息融合、软件工程与信息系统、参数计算与生物计算等方向研究。在大数据技术与应用方向采用深度学习与循环神经网络等进行实际工程项目的研究与推广应用，在
  Multimedia Tools and Applications，IEEE Access等国际刊物上发表论文多篇，承担交通大数据项目建设；在信息度量与信息融合方向主要从事信息获取、清洗、粒化、聚类、融合与比对等处理研究，在Expert
  Systems with Applications，Knowledge-Based Systems等国际刊物上发表论文多篇，研究成果具体应用于项目查重与文献甄别，连续8年承担国家自然科学基金委基金项目相似性检查系统研究与实际应用，项目推广应用到10多个省部级单位。在生物计算方向采用多源数据融合的方法进行结构功能预测、细菌功能分析及人脑功能结构与疾病关联关系分析等，在Nature子刊Scientific
  Reports,Bioinformatics, IEEE/ACM Transactions on Computational Biology & Bioinformatics,Neuroscience
  Letters等国际刊物上发表高影响因子多篇。发表学术论文100多篇，其中近5年（2016-2020）发表SCI论文28篇，Ei论文7篇。主编《数据科学与大数据技术导论》、《信息学科导论》、《数据库原理与应用》、《计算机网络技术教程》等教材。主持国家自然科学基金项目面上项目2项，委主任基金2项，企事业单位大型软件工程或信息化项目10多项，多项大型软件系统通过国家或省级鉴定，获省部级科技进步一等奖2项、二等奖1项、三等奖2项。

  近几年，主要承担《长沙市大联合交管中心系统》（交通大数据）建设、国网电力湖南公司《电力知识图谱关键技术研究》，并为多个大型集团企业提供质量大数据建设方案。

  教育经历：

  １2000-2005 中南大学计算机应用技术，获博士学位，导师海外教授 陈松乔教授

  ２1989-1992 吉林大学基础数学专业，获硕士学位，导师董乃昌教授、郭元春教授

  ３1985-1989 湖南师范大学基础数学专业，获学士学位

  工作经历：

  １2018-至今 中南大学大数据技术及应用团队，负责人，主要从事大数据相关的理论、技术及应用研究，承担企事业单位有大数据实际项目，承担计算机相关的计算机科学与技术、数据科学与大数据技术等专业管理。

  ２2008-2018 中南大学网络评审系统工程研究所，副所长。主要从事科技评价、会评数据终端、项目相似性检查及信息融合与信息系统等方面研究

  ３2006-2009 湘雅医学院肿瘤研究所基础医学博士后，从事鼻咽癌与多癌家系遗传数据处理，指导老师李桂源教授

  ４2006-2007 教育部科技发展中心借调

  ５2005-2006 加拿大The University of Western Ontario，国家公派访问研究，从事遗传数据处理研究。

  6.1992.7－至今 中南大学（原中南工业大学），从事教学与科研工作，2001晋升为副教授。2006年晋升为教授，2008年聘为博士生导师。'
