bio_raw: '郭霖

  ，中南大学大数据研究院

  （计算机学院）

  特聘副教授，硕士生导师。研究方向为医学人工智能、生命体征多模态数据表征、心律失常监测与实时预警、穿戴式设备与人机交互。主持国家重点研发计划重点专项（子课题负责人）、国家自然科学基金委员会青年项目、中国博士后科学基金特别资助项目(站前)（1/400）、湖南省自然科学基金青年项目、湖南省教育科学“十四五”规划重点课题。一作或通讯作者

  在IEEE Trans Cybern，IEEE IoTJ，IEEE TVT，IEEE BIBM等高水平国际会刊发表论文20余篇

  ；授权国际发明专利（美国）1项，中国发明专利3项，专利成果转化1项；参与出版教材1部；获得湖南省计算机学会科学技术一等奖、湖南省自然科学三等奖、中南大学“升华博士后”等学术奖励。

  本人每年硕士生指标2-3名，欢迎计算机科学与技术、通信工程、电子信息、大数据等专业同学报考，同样欢迎对生命体征信号处理、分析、识别、应用有浓厚兴趣的高年级本科生，简历请发至邮箱：guolincsu

  {at}

  csu

  [dot]

  edu

  [dot]

  cn。

