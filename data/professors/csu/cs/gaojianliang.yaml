bio_raw: '高建良，博士，教授，博导，硕导，留美博士后。

  本科和博士（硕博连读）分别毕业于国防科技大学计算机学院和中国科学院大学（中国科学院计算技术研究所）。

  科学研究方向：

  本团队立志于“做有意义的研究，开发有价值的系统”！

  科研方向为“

  人工智能和大数据前沿技术

  ”，主要包括：人工智能应用、

  金融时序预测、自动

  机器学习

  等。发表高水平学术论文五十余篇，部分已发表论文列表：

  https://dblp.uni-trier.de/pers/hd/g/Gao:Jianliang

  ，专利多项。作为项目负责人主持国家自然科学基金项目、中国博士后特别资助项目、企业项目等，项目经费充足。

  研究生招生：

  本团队研究生培养质量高，研究生在读期间可以同时获得项目开发和科学研究经历，团队毕业生多人获得国家奖学金和省级优秀毕业生；毕业研究生就业非常好，去向主要包括互联网大企业、大型金融企业、国家电网、国内外高校等。目前正在招收2027年入学的研究生，名额有限，尽快邮件联系：gaojianliang@csu.edu.cn
  。

  （1）硕士生。目前正在招收保研硕士生。招收硕士研究生的条件：编程能力较强、学习主动性强、团队合作能力强。

  （2）博士生。招收博士研究生的必要条件：已发表高水平论文，不低于JCR 1区或CCF B类；团队合作能力强；学习主动性强。

  （3）博士后。招收博士后，必要条件：已发表CCF A/B等高水平论文。

  教学：

  作为最早研究大数据的教授之一，推动了中南大学获批成为全国第一批设立数据科学与大数据技术专业的三所高校之一，主编了大数据教材《Spark大数据编程基础（Scala版）》

  http://aibigdata.csu.edu.cn

  。主讲的课程《大数据编程》获批省级一流课程。'
