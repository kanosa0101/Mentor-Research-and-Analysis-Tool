bio_raw: '李钦松，博士，中南大学计算机学院（大数据研究院）副教授、硕士生导师。依托医疗大数据应用技术国家工程研究中心（中南大学），主要围绕三维形状分析、多模态医学影像智能分析与计算机辅助诊疗开展研究。主持国家自然科学基金青年项目及湖南省自然科学基金青年项目各1项，作为核心成员参与国家自然科学基金重点项目与面上项目各1项。在CVPR、AAAI、TVCG、TNNLS、CGF、KBS等CCF-A/B类及中科院一区TOP等期刊与会议发表学术论文40余篇；其中以第一或通讯作者发表20余篇；申请国家发明专利21项（已获授权9项），登记计算机软件著作权4项；相关成果获湖南省科学技术进步奖二等奖、中国自动化学会科技进步奖二等奖和湖南省数字医学学会年度青年科技奖。教学方面，主持湖南省研究生教改项目1项，获中南大学高等教育教学成果一等奖，主讲专业核心课程《数据库原理》。学术服务方面，担任湖南省数字医学学会青年工作委员会副主任、湖南省计算机学会机器视觉与医学影像专业委员会委员，以及机器视觉与智慧医疗湖南省工程技术研究中心、中南大学眼科医学影像处理研究中心等科研平台委员，积极参与教育部学位中心学位论文、国家自然科学基金项目、CVPR/ICCV/AAAI/KBS/ESWA等会议和期刊评审任务。邮箱：qinsli.cg(at)csu.edu.cn

