  学术奖励：

  1.First Place in the AAPM Deep Generative Modeling for Learning Medical Image Statistics
  (DGM-Image Challenge), 2023.

  2.Second Place in the MICCAI Low-Dose CT Perceptual Image Quality Assessment Grand
  Challenge, 2023.

  3.Best Poster Award at the 17th international Meeting on fully 3D Image Reconstruction
  in Radiology and Nuclear Medicine, 2023.'
