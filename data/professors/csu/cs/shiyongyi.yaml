bio_raw: '石勇义，中南大学计算机学院特聘副教授，硕士生导师。于2014年获得西安交通大学信息工程学士学位；2016年、2022年分别获得西安交通大学信息与通信工程硕士学位和博士学位。主要研究方向为人工智能与医学影像重建的交叉研究，具体研究内容包括光子计数CT重建，医学图像生成、医学图像质量评价等。目前在IEEE
  Transactions on Medical Imaging、Nature Communications、Medical Image Analysis等国际权威期刊和Fully3D、SPIE等国际会议上发表学术论文30余篇。Google
  Scholar引用2100余次。担任医学物理领域知名期刊Medical Physics编委，担任IEEE Transactions on Medical Imaging、npj
  Digital Medicine、IEEE Signal Processing Magazine、Medical Physics等多个国际权威期刊审稿人。

  【招生信息】

  每年招收2-3名硕士研究生，欢迎对人工智能、医学图像重建与分析感兴趣的同学与我联系。（联系方式：shiyongyi@csu.edu.cn）

