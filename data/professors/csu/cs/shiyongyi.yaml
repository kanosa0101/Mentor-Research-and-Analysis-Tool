  , Yongfeng Gao, Qiong Xu, Yang Li, Xuanqin Mou*, Zhengrong Liang*.Learned Tensor
  Neural Network Texture Prior for Photon-Counting CT Reconstruction.IEEE Transactions
  on Medical Imaging,43(11),3830-3842,2024.

  5.

  Yongyi Shi

  , Wenjun Xia, Ge Wang*, Xuanqin Mou*.Blind CT Image Quality Assessment Using DDPM-Derived
