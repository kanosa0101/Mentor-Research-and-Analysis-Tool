bio_raw: '刘佳琦，副教授，博士，内蒙古赤峰人，CCF会员。2005年6月毕业于中南大学计算机科学与技术专业，获学士学位；2008年6月毕业于中南大学计算机应用技术专业，获硕士学位；2012年6月毕业于中南大学计算机应用技术专业，获博士学位。2012年9月进入中南大学软件学院工作，教研。

  团队侧重于计算机、软件工程、通信工程和行为经济学的交叉研究、在各领域都多有建树。主要研究方向物联网、车联网、大数据、人工智能、深度学习等。对基于行为经济学的群智感知网络行为优化有深入研究，首次将行为经济学引入信息科学领域，用损失厌恶、锚定、禀赋效应、心理账户等理论分析网络系统中各主体的行为，解决网络节点合作及行为决策、资源共享、协作通信系统的协作促进、众包网络激励机制设计等实际问题。研究医疗行为的多维度感知技术；研究基于深度学习的信息设备异常检测关键技术。

  近年来在物联网、群智感知、车联网用户行为优化方面取得了较好的研究成果，在《IEEE Transactions on Parallel and Distributed
  System》（CCF A类期刊）、《IEEE Transactions on Mobile Computing》（CCF A类期刊）、《IEEE Internet
  of Things Journal》（中科院一区 IF>10）、《IEEE Transactions on Vehicular Technology》等分布式、移动计算、物联网、车联网领域顶级期刊和国内外会议共发表论文
  20 余篇。主持国家自然科学基金2项、主持教育部博士点基金1项、主持湖南省自然科学基金1项、参与科技创新2030-“新一代人工智能”重大项目1项、参与国家自然科学基金3项。获得省部级科技进步二等奖1项、自然科学奖三等奖2项；已授权国家发明专利10余项，获得软件著作权10余项。

  作为国家级本科线下一流课程、国家精品资源共享课《编译原理》课程骨干成员获本科教学质量优秀奖1次，指导研究生获省级优秀硕士论文1篇，校级优秀硕士论文2篇，主持国家软件工程教指委特色化示范性软件学院立项项目1项。获国家级教学成果奖二等奖1项、湖南省省高等教育教学成果一等奖1项、二等奖1项、省计算机学会高等教育教学成果特等奖1项、校级高等教育教学成果奖一等奖2项、获得2018年度全国高校绿色计算大会（项目挑战组）优秀指导教师、获得第四届中国软件开源创新大赛优秀指导老师。

  同国内外知名高校和企业都有一定的合作，团队主要侧重于对研究生科研能力的训练和素质的培养，在研究生毕业可以推荐到国外读博士，或者国内独角兽企业进行研发。目前指导的研究生毕业后就职于腾讯、阿里、百度、华为、电信、国家电网等知名公司以及政府部门和银行系统等。

  欢迎有志于进行科研的研究生与本科生加入实验室，联系邮箱liujiaqi@csu.edu.cn。'
