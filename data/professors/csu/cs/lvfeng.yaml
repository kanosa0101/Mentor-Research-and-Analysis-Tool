bio_raw: '吕丰，男，中共党员，2018年毕业于上海交通大学计算机科学与工程系，获工学博士学位，导师李明禄教授（IEEE Fellow），2018年9月-2020年1月，在加拿大滑铁卢大学电子与计算机工程系从事博士后研究，导师
  Xuemin (Sherman) Shen院士。目前是中南大学计算机学院教授，博导，国家优青。

  主要研究方向包括物联网、大数据、移动具身智能、端边云协同计算。主持多项国家及省部级项目与课题，包括国自科优青项目、国家重点研发计划课题、国自科重点国际(地区)合作研究项目课题、湖南省自科优青项目、湖南省重点研发计划项目等；出版Springer英文专著3部，在相关领域发表高质量SCI/EI收录论文100余篇，包括Proceedings
  of the IEEE, IEEE/ACM ToN, IEEE TMC, IEEE TPDS, IEEE JSAC等国际权威SCI期刊，以及ACM MobiCom,
  IEEE INFOCOM, VLDB等国际顶级会议；

  荣获2023年中国电子学会自然科学一等奖（排名2）、

  IEEE Technical Committee on Hyper-Intelligence (IEEE HITC 2023)早期职业成就奖（全球5人）、

  国际通信领域旗舰会议

  IEEE ICC 2019最佳论文奖(<0.6%获奖率)、SCI期刊《IEEE/CAA JAS》 诺伯特.维纳综述奖、《物联网学报》优秀论文奖、ACM SIGAPP
  China 新星奖 ；2

  篇论文入选ESI同领域前千分之一热点论文、11

  篇论文入选ESI同领域前百分之一高被引论文；

  入选国家优青、斯坦福“全球前2%顶尖科学家”榜单、

  IEEE ComSoc Distinguished Lecturer、

  中国科协第六届青年人才托举工程项目、

  湖南省2020年度引进100个科技创新人才项目、湖南省湖湘青年英才、湖南省优青；目前正担任国际SCI期刊

  《

  IEEE Transactions on Cognitive Communications and Networking

  》、

  《IEEE Internet of Things Journal》、《IEEE Systems Journal》、《Peer-to-Peer Networking
  and Applications》、《

  Chinese Journal of Electronics

  》编委

  ；

  现/曾

  担任IEEE VTC2021-Fall、IEEE GLOBECOM''24、IEEE ICPADS''25、IEEE ICCT''25等国际会议领域共同主席;
  现/曾担任 IEEE INFOCOM, IEEE ICDCS, IEEE/ACM IWQoS, IEEE GLOBECOM等10多个国际会议程序委员会成员。

  [Google Scholar]

  欢迎有志于科学研究的本科生、硕士生、博士生、博士后随时与我联系！邮箱：fenglyu@csu.edu.cn'
