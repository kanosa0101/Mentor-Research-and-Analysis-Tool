bio_raw: '周芳芳，女，工学博士，中南大学计算机学院，教授。分别于2002年、2007年在中南大学获得工学学士和工学博士学位，2005年-2006年清华大学智能技术与系统国家重点实验室访问学生，2009年-2010年UC
  Davis(美国加利福尼亚大学Davis分校)博士后。2011年评为副教授，2012年创建中南大学可视化研究小组，2013年入选中南大学“531”人才，2016年评为教授。

  长期从事可视化与可视分析、大模型与智能体、数据挖掘与机器学习等方向的研究与应用。近五年来，主持国家自然科学基金项目3项，省部级'
