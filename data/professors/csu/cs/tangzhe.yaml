bio_raw: '个人简介

  Personal profile

  Teacher homepage

  中南大学计算机学院教授，博士生导师，国家级领军人才，国家茶叶产业技术体系岗位科学家，国家茶叶加工装备研发专业中心主任，长沙湘丰智能装备股份有限公司首席科学家，长沙市高层次人才国家领军级B类人才。

  汤哲长期致力于

  智慧农业

  、

  智能控制与农业装备自动化领域

  的研究，尤其在茶叶加工装备的智能化、连续化与数字化方向上取得了系统性创新成果。先后主持

  国家自然科学基金、国家重点研发计划、中央引导地方科技专项、湖南省重点研发计划

  等'
