bio_raw: '陈玥丹

  ，女，中南大学大数据研究院

  特聘副教

  授，博士生导师，硕士生

  导师

  。

  湖南省芙蓉计划青年人才

  ，入选湖南省科协科技人才托举工程 (小荷人才)、中南大学首届“小米青年学者”、博士后国际交流计划、湖南省优秀博士后创新人才。主要研究方向为

  高性能智能计算

  等。在本领域国内外权威会议和期刊IEEE ICDE/TC/TPDS/TKDE、ACM TOPC/TORS/Computing Surveys、《中国科学：信息科学（英文版）》、《计算机学报》等发表和录用相关学术论文30余篇，包括中国计算机学会（CCF）推荐A类会议和期刊论文10篇（其中一作/通讯9篇），IEEE/ACM汇刊、中科院1区论文8篇（其中一作/通讯5篇），ESI热点/高被引论文3篇；授权受理国家发明专利和软件著作权11项。主持国家自然科学基金

  面上、青年

  项目等国家和省部级项目9项，作为项目骨干参与国家重点研发计划项目、科技部国际合作与交流重点项目等国家项目4项。研究成果获湖南省自然科学奖二等奖1项

  (排名4)

  、湖南省计算机学会科学技术奖一等奖2项

  (排名4和5)

  。担任 IEEE-TC/TPDS/TKDE/TII/TSC/TNNLS/IoT、INS、HPCC等著名期刊和会议审稿人。

  每年博士生招生指标1名

  ，每年硕士生招生指标2-3名

  ，欢迎对高性能计算、AI计算、医学人工智能等方面感兴趣的同学与我联系（邮箱：chenyuedan@csu.edu.cn）。

  同时，也欢迎欢迎学习主动且具有一定编程能力的本科生加入。

  近期主要研究成果

  G-SPAC: A More Granular Greedy Graph Partition Algorithm with Spatial Locality and
