bio_raw: '赵荣昌 中南大学 , Ph.D

  研究兴趣：医学图像分析 , 计算机视觉与模式识别 , 机器学习

  赵荣昌 博士 副教授 2011年毕业于兰州大学，获得博士学位。2015年在中南大学完成博士后研究工作。2018--2020年在加拿大西安大略大学进行学术访问。主要研究领域为医学影像分析与计算机辅助诊断、模式识别与人工智能、图像分析与理解。赵荣昌博士领导的研究小组依托湖南省机器视觉与智慧医疗工程中心、移动医疗
  教育部-中国移动联合重点实验室、中南大学眼科医学影像处理研究中心，长期从事医学影像分析，计算机视觉，模式识别与人工智能方向的研究工作。研究小组同中南大学湘雅医院PETCT中心、湘雅二医院眼科、放射科等单位建立了良好的合作关系，主要针对医学辅助分析和医疗AI中的关键问题，利用模式识别、机器学习特别是深度学习方法，开展医学图像配准、目标检测、病灶与器官组织分割、参数估算、眼底组织三维建模等方向的基础与应用研究。赵荣昌博士已发表学术论文40余篇，其中ESI检索10多篇；多篇论文发表在本领域国际顶级会议或期刊，包括AAAI、ECCV、MICCAI、MedIA、TMI等；申请国家发明专利3项；主持国家重点研发计划子课题2项、国家自然科学基金1项、湖南省重点研发计划2项、湖南省自然科学基金1项。赵荣昌博士同美国凯斯西储大学、加拿大西安大略大学、芬兰奥卢大学、英国拉夫堡大学等国外顶级研究小组有着长期稳定的合作，本小组研究生可以参与国际合作，并进行联合培养，得到国外领域大亨的亲自指导。

  ！！！本小组每年招收3名硕士研究生，请大家提前联系。

  ！！！非常欢迎有志于从事医学影像分析、计算机视觉研究和实践的硕士研究生、客座学生以及优秀的大三、大四本科生加入本研究组！

