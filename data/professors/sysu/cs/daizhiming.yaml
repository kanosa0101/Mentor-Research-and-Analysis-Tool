bio_raw: 戴智明，男。中山大学计算机学院副教授。本、硕、博阶段的学习都在中山大学完成。博士毕业后留校任教。研究方向为生物信息学、数据挖掘、机器学习。已发表SCI论文三十余篇，主持数项国家、省部级科研项目。获广东省“特支计划科技创新青年拔尖人才”、广州市“珠江科技新星”等人才项目资助。
