office_address: 中山大学广州校区东校园计算机学院A410
bio_raw: '马啸 ，工学博士、教授、博士生导师，IEEE Senior Member，IEEE T-COMM编辑，《电子学报》编委，《Entropy》编辑等。主要研究信息理论与信道编码技术及其在数字通信和数字存储系统中的应用，出版译著《信道编码：经典与现代》、专著《多元LDPC码及其应用》，在《IEEE信息论汇刊》（IEEE
  Trans. Information Theory）等国际重要刊物和IEEE信息论年会（ISIT）等国际旗舰会议及《电子学报》等国内重要刊物上发表学术论文两百余篇，授权中国发明专利二十余项，授权美国发明专利两项，研究成果已被同行引用三千余次，其中一项研究成果被国外教授大篇幅写进专业教科书，入选2023/2025年度全球前2%顶尖科学家榜单（斯坦福大学）。2024年受邀在加州大学伯克利分校西蒙斯计算理论研究所（Simons
  Institute for the Theory of Computing）发表学术演讲，分享编码理论研究进展。

  · 2022年高等教育国家级教学成果奖二等奖。

  · 2021年获中国电子学会科学技术奖自然科学奖三等奖。

  · 2020年主持国家重点研发计划项目“6G无线空口传输技术”课题之一。

  · 2016年获得广东特支计划“百千万工程领军人才”项目资助。

  · 2012年主持国家重点基础研究发展计划（973计划）项目“高移动性宽带无线通信网络重点理论基础研究”课题之一。

  · 2008年成为广东省高校“千百十工程”省级培养对象。

  · 2007年入选教育部新世纪优秀人才计划。

  · 2006年，获IEEE通信学会颁发的2005年度最佳论文奖（2005 Best Paper Award in Signal Processing and Coding
  for Data Storage by IEEE Comm. Soc.）。'
