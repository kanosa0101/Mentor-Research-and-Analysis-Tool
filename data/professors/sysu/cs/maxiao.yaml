research_direction_raw: '信息论与编码、空间通信、B5G/6G通信、光通信、高性能存储、语义通信、隐蔽通信等。

  ● 本科生课程：离散数学、概率论与数理统计、信道编码、数学分析

  ● 研究生课程：随机过程、信息论

  欢迎电子通信、计算机、应用数学等相关专业人士加入团队。

  ● 长期招收博士后。

  ● 长期招收博士、硕士研究生，也欢迎优秀本科生前来学习实践。'
