office_address: 广州大学城外环东路132
bio_raw: '博士生导师 ，中山大学“百人计划”引进人才

  博士毕业于香港浸会大学，曾于美国罗格斯大学和美国约翰霍普金斯大学（世界综合大学排名前 20 ）进行博士后科研工作；在机器学习与计算机视觉领域的国际权威期刊（如IEEE
  TPAMI，IJCV，IEEE TIP，IEEE TMM，PR等）和国际权威会议（如ICCV，CVPR，ECCV，AAAI，IJCAI，MICCAI等），在医学领域的国际权威期刊（如Alimentary
  Pharmacology & Therapeutics，Critical Care Medicine）发表论文超过60篇；指导学生以通讯作者身份发表多篇学术论文和多项专利；善于帮助学生
  提炼创新点 ，将所提出方法 理论化公式化 。

  海外合作导师 ：Prof. Pong C Yuen（香港浸会大学）、Prof. Grace L H Wong（香港中文大学）、Prof. Suchi Saria（美国约翰霍普金斯大学）等

  本科生科研 ：长期招收优秀本科生参与科研体验，符合科研助理条件的同学给予生活补贴。特别优秀的学生有机会推荐到海外知名院校交流或深造。（ 注 ：欢迎对机器学习、计算机视觉和智能医疗领域充满热情的同学邮件附上成绩单和简历联系，
  majh8@mail.sysu.edu.cn 。）

  博士、硕士研究生招生 ：按学院名额规定招收博士、学硕（计算机科学与技术）和专硕学生（专业不限），每名学生（不论博士、学硕或专硕）都由本人亲自指导且给予生活补贴。特别优秀的学生有机会推荐到海外知名院校交流或深造。（
  注 ：欢迎对机器学习、计算机视觉和智能医疗领域充满热情的同学邮件附上成绩单和简历联系， majh8@mail.sysu.edu.cn 。）

  已毕业硕士生 ：英国帝国理工（卢彦作），新加坡国立（王金鹏），香港浸大（沈萌），港科大广州（林逸淇），腾讯（高远、李璐圆、佘锦文），字节（张曼琳、吴发明、贾晓玉）、华为（胡彦旭、陈培鹏、马阳、潘阳山），阿里云（褚宏伟），建行总行（蔡晨语）、农行广东省分行（彭佳文），五矿（陈嘉昕），TP-LINK（严晓威），
  Shopee（陈曦），小马智行（张皓），璟云智能（林罗杰），公务员（朱雪瑜）'
