office_address: 计算机学院 - A417室
bio_raw: '博士，教授，博士生导师，网络空间安全系主任。

  主要研究兴趣为 人工智能数据与模型安全、多模态大模型/多智能体的智能感知、大数据信息分析与溯源 。

  近年来，在包括IEEE Transactions on Mobile Computing、IEEE Transactions on Image Processing、Pattern
  Recognition、IEEE Conference on Computer Vision and Pattern Recognition、 ACM International
  Joint Conference on Pervasive and Ubiquitous Computing等本领域顶级期刊和学术会议发表论文多篇，并获得国家发明专利授权多项。

  主持了包括科技部国家重点研发计划课题2项、国家自然科学基金面上项目2项、广东省自然科学基金和广东省与广州市重点科技项目等。对于人工智能数据与模型安全、多模态大模型/多智能体的智能感知、大数据信息分析与溯源等领域感兴趣的同学欢迎报考。并欢迎优秀本科生加入实验室（
  https://www.sysu-imsl.com/ ），在这里将提供良好的科研与学术环境。研究团队与香港科技大学、上海交通大学、西安交通大学、国防科技大学和华为公司等研究团队合作密切，可以提供较多的交流、交换与推荐深造的机会。'
