research_direction_raw: 人工智能数据与模型安全： 研究人工智能模型安全风险评估方法与防控策略，提升AI模型的鲁棒性。 多模态大模型的智能感知：
  研究基于多模态大模型强大的表征、推理及多任务学习能力并结合移动物联网技术，提升智能感知与定位能力。 多智能体的智能感知： 基于多智能体的自主决策、环境交互及分布式协同感知，研究构建高效的群智感知网络，实现智能感知与定位。
  大数据信息分析与溯源： 研究多模态数据融合、大数据分析和异常检测技术，实现精准的海量多元异构数据异常检测与分析。
