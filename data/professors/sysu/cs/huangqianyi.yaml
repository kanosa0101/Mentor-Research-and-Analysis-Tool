office_address: 国家超算广州中心529F
bio_raw: '黄倩怡，博士，中山大学计算机学院“百人计划”副教授。2013年于上海交通大学计算机科学与技术系本科毕业，2018年于香港科技大学计算机科学与工程系博士毕业，2022年12月加入中山大学计算机学院。研究方向包括移动端机器学习(Mobile
  Deep Learing)、人工智能物联网(Artificial Intelligence of Things, AIoT)、具身感知、通信感知一体化、Wireless+AI等课题，迄今为止发表论文50余篇，包括IEEE/ACM
  Transactions on Networking, IEEE Transactions on Mobile Computing, ACM IMWUT, MobiCom,
  INFOCOM, Sensys等领域旗舰期刊和会议。主持国家自然科学面上/青年基金、 广东省重点领域研发计划课题等项目。更多信息请访问我的个人主页 huangqy89.github.io
  .

  所指导的学生均获得深造机会或大厂Offer，欢迎计算机、通信相关专业硕士生、优秀本科生与我联系（长期有效），期待与你一起探索移动计算、具身智能等前沿领域！'
