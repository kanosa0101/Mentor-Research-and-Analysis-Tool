bio_raw: '现为中山大学计算机学院副教授、硕士生导师，已发表SCI期刊论文110余篇，谷歌学术引用3200多次，H-index为32；其中发表IEEE Transactions
  Top期刊论文近50篇，6篇论文入选ESI高被引论文。主持多项国家级和省部级科研项目，曾获广东省科学技术奖（自然科学）二等奖，连续多年入选全球前2%顶尖科学家“年度影响力”榜单。个人主页：
  https://www.researchgate.net/profile/Quanzhong_Li ； https://dblp.org/pid/36/4657-1.html

  ##欢迎具有计算机、通信、数学等相关专业背景的同学报考研究生（学硕、专硕），如有兴趣请Email联系##'
