bio_raw: '国家重大人才计划青年专家、中山大学计算机学院教授、博士生导师（计算数学与计算机科学与技术双专业）、广东省计算科学重点实验室副主任。曾任国际综合类权威期刊《Science
  Bulletin》 编委，现为中国计算机学会会刊《软件导刊》编委，兼任中国工业与应用数学学会高性能计算与数学软件专业委员会委员、中国工业与应用数学学会反问题与成像专业委员会委员、中国电力企业联合会输变电设备仿真技术标准化技术委员会委员、广东省环境科学学会数智生态环境专委会副主任委员、广东省计算数学学会常务理事等职务。

  高中毕业于江苏省苏州中学，后于本科、硕士及博士阶段均留学德国，并在德国“精英大学”亚琛工业大学机械工程学院（机械工程排名全德第一、世界顶尖）获自然科学博士学位。博士研究期间，师从莱布尼茨奖得主、德国国家科学院（Leopoldina）/工程院（acatech）及英国皇家工程院（RAEng）院士Wolfgang
  Marquardt教授。博士毕业后，曾任职于德国于利希国家实验室等国际级研究机构，并作为核心成员主导或参与了由欧盟哥白尼计划、德国科学基金会、德国联邦经济与科技部等资助的多项重要科研项目。回国后，研究方向紧密围绕“HPC+AI
  for Science and Engineering”，聚焦于数学物理反问题、高性能计算与人工智能等领域的交叉研究，致力于攻克相关共性关键技术难题，推动多学科协同创新，实现从科学发现到工程应用的突破。

  已在国际顶尖综合性期刊《The Innovation》（中科院一区TOP期刊；影响因子：39.5）、《Science Bulletin》（中科院一区TOP期刊；影响因子：20.7）、《Environmental
  Science & Technology》（中科院一区TOP期刊；影响因子：12.2）、《Water Research》（中科院一区TOP期刊；影响因子：12.8）、Nature旗下期刊《npj
  Clean Water》（影响因子：11.0）、中国数学会T1类期刊《Inverse Problems》等高水平期刊发表和录用学术论文70余篇；出版英文学术专著2部，分别由英国物理学会（IOP）与德国工程师协会（VDI）出版；2025年9月主持国家香山科学会议（Y12）“人工智能驱动绿色低碳水处理中的关键核心问题”，作大会评述报告。此次会议获《科技日报》2025年10月27日“数智”专栏报道，“破解水处理难题——
  “算法驭水”更环保更高效”。）。同年9月，受邀在国家自然科学基金委员会中德科学中心举办的“智能数值数学”双边研讨会上作报告。近年来在国内外学术会议上展示交流高水平研究成果60余项，涉及应用数学（Applied
  Inverse Problems Conference, International Conference on Inverse Problems in Engineering，中国数学会学术年会,
  全国反问题大会等）、工程热物理（International Heat Transfer Conference, AIChE Annual Meeting, 中国工程热物理学会传热传质学术会议等）、高性能计算（Supercomputing
  Conference, 全国高性能计算学术年会等）、以及交叉学科（European Geosciences Union General Assembly, International
  Conference on Desalination using Membrane Technology, 全国微重力科学学术会议等）等多个领域。

  近五年来，主持国家级、省部级及头部企业在内的各类科研项目十余项，其中包括广东省重点研发计划重大专项、科技部国家创新人才交流外专项目、央企重点项目等；同时作为核心成员参与国家重点研发计划重点专项、国家自然科学基金重点项目等。主要研究方向涵盖数学物理反问题理论与算法、工业软件与人工智能、传统产业数字化与智能化、超算并行大气扩散建模、生物医药智能发现与合成推荐系统，以及极端空间环境下的多学科耦合模拟等领域。自主研发高性能多物理场仿真智能工业软件
  FIND Multiphysics，荣获广东省工业软件科学技术发明一等奖，参与制定国家标准1项，主持发布团体标准1项、参与发布团体标准2项，公开国内外发明专利14项（含已授权国际专利1项、国内专利6项，及通过国际PCT审核1项），登记计算机软件著作权6项。

  主讲《高等代数》《线性代数》《矩阵分析》《程序设计及实践》等课程，荣获广东省教学成果奖一等奖、广东省计算机学会教育教学成果奖一等奖、中国计算机教育大会优秀论文奖、中国计算机研究生教育大会优秀论文等多项荣誉，指导学生在国内外顶级数学建模竞赛中多次获奖，包括：美国大学生数学建模竞赛一等奖（M奖）、全国大学生数学建模竞赛国家二等奖及广东省一等奖（两次荣获
  “广东省分赛优秀指导教师奖”）、国家大学生创新创业训练计划项目（省级项目）、“大湾区杯”粤港澳AI for Science 科技竞赛银奖等。积极搭建国际化培养平台：指导学生获批国家留学基金委(CSC)公派博士研究生项目、广东省青年优秀科研人才国际培养计划博士后项目、中山大学国际合作项目资助赴海外访学；获中国政府奖学金资助，接收来自国际顶尖大学的本科交换学生；招收多名来自国际顶尖大学的毕业生攻读博士和硕士学位。

  累计指导并培养研究生29名，其中包括博士研究生6名、硕士研究生23名。毕业生中有多人在学术界与产业界取得良好发展，目前担任高校副教授、科研机构助理研究员、大学讲师、博士后研究员、企业首席技术官等职务，已顺利成长为相关科研领域或专业技术岗位上的骨干力量。毕业生深造与就业去向：国内外顶尖高校及研究机构包括中国科学院大学、清华大学、北京大学、浙江大学、中山大学、苏州大学、德国于利希国家实验室、德国亚琛工业大学、英国伦敦帝国理工学院、英国伦敦大学学院、美国哥伦比亚大学、荷兰代尔夫特理工大学，以及香港大学、香港科技大学、新加坡国立大学、南洋理工大学等；知名国内外企事业单位包括国家信息中心、南方电网、华为、三环集团、TCL华星光电、宝洁公司等。'
