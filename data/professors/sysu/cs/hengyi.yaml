research_direction_raw: '新时期，我们紧密围绕“HPC+AI for Science and Engineering”这一核心方向，开展偏微分方程数学物理反问题、自主化多物理场耦合仿真与智能工业软件、高性能科学计算与人工智能深度融合等前沿研究，致力于推动多学科交叉创新，实现科学发现与工程应用的双重突破。与中国航天科技、中石化、南方电网、中广核、中国盐业、华为、中望软件、十沣科技、颖力科技等行业领军企业深度合作，以工业三维物理场景的感知、理解与智能操控为牵引，系统布局智能模型架构、系统级工业设计等基础性研究，研发多学科融合的仿真智能软件及科学与工程大模型。面向智慧双碳、能源化工、航空航天、工业制造、生物医药等国家重大战略领域，我们持续开展颠覆性技术攻关，推动产业能级跃升，突破关键瓶颈，打造新兴研发范式，为实现高水平科技自立自强提供核心驱动力。

  具体研究方向包括：

  偏微分方程数学物理正反问题与高性能科学计算 多物理场耦合仿真工业软件与智慧工业数字孪生 仿真智能、工业大模型与AI Agent智能体技术 典型科学与工程应用场景：极端环境下的大规模多学科联合仿真与分析、人工智能驱动的绿色低碳水处理技术、基于智能仿真的工业数智化操作、高功率散热微纳结构表面的传热极限研究、生物医药智能发现与合成推荐系统、高端新材料的智能优化设计方法等。'
