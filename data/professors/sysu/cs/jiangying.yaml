research_direction_raw: '长期从事高性能计算、医学成像与分析、深度学习、积分方程快速算法、高维稀疏逼近、随机偏微分方程等方向的研究。在相关领域顶级期刊
  MATHEMATICS OF COMPUTATION、SIAM JOURNAL ON NUMERICAL ANALYSIS、JOURNAL OF COMPUTATIONAL
  PHYSICS、IEEE TRANSACTIONS ON MEDICAL IMAGING、IEEE INTERNET OF THINGS JOURNAL、JOURNAL
  OF SCIENTIFIC COMPUTING、INTERNATIONAL JOURNAL OF DIGITAL EARTH、JOURNAL OF TRANSLATIONAL
  MEDICINE 等发表多篇论文。

  长期招收计算数学博士、计算数学学硕、计算机技术专硕，欢迎对以上研究方向感兴趣的同学与我联系！

  毕业学生去向：国内外高校深造、腾讯、英特尔、字节、华为、东软、深圳公立中学教师等。'
