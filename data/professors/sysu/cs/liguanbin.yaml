bio_raw: 李冠彬，副院长，教授，博士生导师，国家优青。主要研究领域为图像视频内容理解与生成。迄今为止累计发表计算机学会A类/中科院一区论文200余篇，谷歌学术引用超过24000次，入选ScholarGPS全球前0.05%顶尖科学家榜单，连续4年入选“全球前2％顶尖科学家榜单（终身影响力榜单）”。曾获得广东省青年科技创新奖、中国图象图形学学会青年科学家奖、吴文俊人工智能优秀青年奖、中国图象图形学学会科学技术一等奖、ICCV2019最佳论文提名奖、CVPR2024最佳论文候选等荣誉。主持了包括国家自然科学基金优青、面上、重点研发课题、广东省杰青、CCF-腾讯犀牛鸟科研基金、华为科研合作基金等
  20多项科研项目。担任广东省大数据分析与处理重点实验室副主任、广东省图象图形学会计算机视觉专委会主任等职务。担任人工智能领域顶级会议CVPR、ECCV、AAAI等领域主席，获得10余项人工智能领域国际顶级会议竞赛冠军，研究成果应用于华为智驾系统，OPPO小布助手及智慧医疗诊断等。
