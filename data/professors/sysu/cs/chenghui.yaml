bio_raw: '成慧，教授，博士生导师，中山大学“百人计划”人才引进，主要从事机器人的单机自主与多机协同、具身智能、群体智能等方面的研究。研究成果发表在T-RO、IJRR、TMECH、TASE、
  RAL、RSS、NeurIPS、ICML、CVPR、ICLR、ICRA、CoRL、ICCV、ACM MM、IROS等重要期刊与国际学术会议论文中。主持和参与国家重点研发项目课题、科技创新2030“新一代人工智能”重大项目课题、国家自然科学基金、国家基金委-深圳市机器人基础研究中心项目、广东省重大科技专项、广东省自然科学基金研究团队项目、广东省自然科学基金、中央高校基本科研业务费重点项目、广州市科技计划科学研究专项、香港研资局科研基金项目等项目。中山大学空中机器人队与中山大学Robomaster机器人队指导老师。

  欢迎有志于从事机器人和人工智能方向研究，专业方向为计算机、自动化、电子、通工、数学、物理、机械等专业领域的同学和科研人员加入机器人感知决策与自主运动RAPID实验室：
  http://lab.sysu-robotics.com/index.html'
