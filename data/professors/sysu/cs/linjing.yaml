bio_raw: 二级教授，国家自然基金委青A(杰青)项目获得者，Fellow of IEEE/IAPR/IET，广东省大数据分析与处理重点实验室主任。长期从事多模态人工智能、机器学习等领域的应用基础研究，主持科技部人工智能重大项目，国家自然基金委重点项目，入选国家万人计划青拔人才；曾任商汤科技研究院执行院长/首席研发总监，带领企业研发团队搭建大规模AI基础设施，开拓新兴行业。在国际顶级学术期刊和会议发表论文400余篇，论文被引用近5万次(谷歌学术统计)，H因子>103，多次入选全球高被引学者榜单；获权威期刊Pattern
  Recognition年度最佳论文奖，多媒体计算旗舰会议ICME最佳论文钻石奖，计算机视觉旗舰会议ICCV最佳论文奖提名，自然语言处理旗舰会议ACL杰出论文奖；获CCF-ACM人工智能奖、广东省科技进步一等奖，中国图像图形学会科学技术一等奖、吴文俊人工智能自然科学奖，黑龙江省自然科学一等奖；指导博士生(梁小丹、王可泽、王广润等)获得CCF优秀博士论文奖、ACM
  China优秀博士论文奖及CAAI优秀博士论文奖，指导博士生黄中展获得国家自然基金委首批博士生青年基金，蒲韬入选首批中国科协青年人才托举工程博士生专项。（曾）担任知名期刊IEEE
  Trans. Human-Machine Systems, IEEE Trans. Multimedia, IEEE Trans. Neural Networks
  and Learning Systems 编委 (Associate Editor)，十余次担任IEEE CVPR、ICCV、NeurIPS、KDD、ACM Multimedia 等国际会议的领域主席。欢迎访问实验室网站：
  http://www.sysu-hcp.net
