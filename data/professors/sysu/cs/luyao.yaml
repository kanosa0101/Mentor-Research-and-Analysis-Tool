bio_raw: '陆遥，博士，中山大学计算机学院教授，科学计算研究所所长，博士生导师，广东省十届科协常委。入选国家级人才项目和中山大学“逸仙优秀学者”。

  曾就读于中国科学技术大学，中国科学院数学与系统科学研究院，美国雪城大学。博士毕业后在美国密西根大学从事乳腺癌医学成像的研究。曾任密西根大学医学院Postdoctoral
  Research Fellow和Research Investigator。

  现为华南肿瘤学国家重点实验室PI、广东省高性能计算学会理事长、广东省医疗行业协会超声医学创新与发展管理分会副主任委员、广东省医师协会人工智能临床应用专委会副主任委员、中国图形图像学会医学影像专委会委员、中国生物医学工程学会医学人工智能学会委员。长期从事医学影像分析、医学大数据分析和机器学习领域的研究工作。主持过世界著名的乳腺癌基金会Susan
  Komen基金会研究基金、国家自然科学基金天元基金重点项目、科技部重点研发国际合作重点项目、科技部重点研发课题、广东省前沿与关键技术创新重大专项基金、教育部重大科技基础培育计划课题等，教育部学位中心研究生教育主题案例项目首席专家，以第一完成人获得广东省科技进步二等奖，参与制定一项人工智能国际组织标准和三项人工智能医疗器械国内行业标准，发表学术论文100余篇，转让发明专利六项。

  欢迎计算机、计算数学、图像处理相关专业人才加入团队！长期招聘特聘（副）研究员、博士后，招收优秀博士生、研究生、本科生。'
