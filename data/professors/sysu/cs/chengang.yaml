bio_raw: '陈刚, 教授，博士生导师。博士毕业于慕尼黑工业大学计算机系，本硕毕业于西安交通大学。在近年来在相关领域的国内外学术会议及期刊上发表100+篇论文；授权专利17项，集成电路登记证书1项；作为项目/课题负责人承担了国家自然科学基金、广东省重点研发计划等国家、省部级项目以及横向课题10余项。以第一作者或者通讯作者获得领域知名国际会议最佳/杰出论文（提名）7次，集成电路特别设计奖1次,
  最佳系统演示奖2次，其中 A类会议获奖1次，B类会议获奖2次，C类会议获奖3次 ， 包括DATE 2021 (CCF-B)、ICESS 2022、ICET 2021、ESTIMedia
  2013最佳论文奖、ICPADS杰出论文奖(CCF-C)、ASP-DAC 2023 特别设计奖 (CCF-C)以及FPL 2022(FPGA领域三大会议), CODES+ISSS
  2020（CCF-B）最佳论文提名奖，CCF-DAC 2023最佳原型系统演示奖，CACAI 2023 最佳原型系统演示奖亚军(CAAI-A)。指导学生参加学科竞赛获得国家级奖项10余次，包括ICRA
  DJI RoboMaster Mobile Manipulation Challenge获得冠军和杰出技术奖 , 全国大学生机器人大赛RoboMaster 机甲大师赛全国一等奖（1次，4强）、全国赛区亚军和特等奖（各1次）,
  “挑战杯”全国大学生课外学术科技作品竞赛广东省特等奖（2次）、全国一等奖（1次）、全国三等奖（1次），第七届国际“互联网+”大学生创新创业大赛国赛银奖。

  培养国家奖学金1人，入选优秀学生代表名录，人民日报报道（全国100名，2024年中大唯一研究生代表），中山大学优秀毕业生1人；硕士毕业学生在华为、腾讯、阿里等头部科技大厂工作（1人入选腾讯青云计划），近10名学生前往慕尼黑工业大学（德国）或留在课题组继续深造读博；

  现招收博士后/博士/硕士研究生/高年级本科生，优先考虑具有硬件设计背景的学生。 我的主要研究方向是高性能计算（领域定制加速器）、人工智能、机器人系统，并注重培养学生工程实操能力培养​。如果你对以上方向兴趣，同时
  也是务实并且自我驱动能力强的人，出于兴趣且能静下心来从事科研工作， 希望攻读博士/硕士学位，欢迎随时和我联系! 课题组对学生的科研工作态度要求比较高， 如果抱着混学位混日子态度的学生，请勿联系！
  同时也欢迎本科生加入实验室从事科研工作 （标准同上） 。'
