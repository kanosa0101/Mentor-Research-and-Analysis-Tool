bio_raw: '陈亮博士，中山大学计算机学院副教授，软件工程系副主任，广东省“珠江人才计划”引进创新创业团队核心成员，主持国家自然科学基金青年项目、国家自然科学基金联合基金重点项目课题、广东省基础与应用基础研究基金项目和广州市科技项目等国家/省部/市级项目多项，并参与多项国家重点研发计划项目。陈亮博士于2009和2015年在浙江大学计算机学院获得学士和博士学位，2015.9-2016.9在墨尔本皇家理工进行博士后研究，目前担任国际服务协会青年科学家论坛副主席，国际期刊International
  Journal of Web Science副主编，中国计算机学会服务计算专业委员会委员，成果发表在KDD、SIGIR、ICML、IJCAI、WWW、ICDE、CIKM、ICWS、ICSOC、TKDE、TII、IOTJ、TSC、TSMC等领域顶级会议及期刊上，共计发表论文100余篇，Google
  Scholar引用数据2000余次。

  News. 长期招收博士后、特聘科研人员、硕士研究生。欢迎优秀本科生加入研究团队，表现优秀者可以推荐至美国、澳洲、香港各地继续深造。'
