bio_raw: '陈川、博士、副教授、博士生导师、广东省高层次青年人才。2012 于中山大学数学与应用数学专业获学士学位，2016 于香港浸会大学数学统计专业获博士学位。近年来主要研究方向：
  可信机器学习理论与应用（联邦学习，机器学习鲁棒性, LLM可靠性等），及图机器学习理论与应用 （图神经网络、社交网络分析等） 。近年发表SCI索引国际期刊（包括IEEE
  TNNLS, TIP, TPDS, TKDE, ACM TOIS, TKDD, NSR等）及国际会议论文（包括ICLR, ICML, NeurIPS, KDD,
  AAAI, IJCAI, WWW, INFOCOM, CIKM, ICDM等）80余篇，包括 中科院一区及CCF A类论文60余篇, ESI高被引论文3篇 ，申请及授权专利20余项。现任Elsevier国际期刊Software
  Impacts副主编，担任IEEE TPAMI/TIP/TSP/TNNLS 等多份国际期刊审稿人，担任ICLR/KDD领域主席(Area Chair)、ICML/NeurIPS/AAAI/IJCAI等多个国际学术会议的（高级）程序委员会委员(Senior
  PC)及论坛主席(Section Chair)，中国计算机学会(CCF)人工智能与模式识别专委会委员。主持国家重点研发计划项目课题，国家自然科学面上项目、青年基金，广东省基础研究项目/面上项目两项，CCF开放课题项目一项，2019年CCF-腾讯犀牛鸟科研基金项目一项，2021年腾讯微信犀牛鸟专项基金一项，课题组与多个企业（包括微信/微众银行/网易游戏/美图/平安银行/招联金融）等开展长期的研究合作项目，部分成果完成技术转化并在相关企业及单位中得到应用。获
  广东省计算机学会科技进步二等奖，CCF-腾讯犀牛鸟科研基金优秀奖 ，IEEE Computer Society 评选2022年度最佳论文（全球18篇，所在期刊唯一入选）,入选2024/2025年度全球前2%顶尖科学家榜单（斯坦福大学）
  。

  教学与学生指导 ：获中山大学首届青年教师教学优秀奖，担任《人工智能》（课程评教曾列全校课程前0.02%、中国电子学会电子信息教学成果大赛二等奖、广东省高校（本科）青年教师教学大赛二等奖、广东省高校教师教学创新大赛二等奖​、中山大学教师教学竞赛一等奖、中山大学一流本科课程、中山大学本科教育教学成果二等奖、广东省教学改革项目）、《人工智能实验》（课程评教曾列全校课程前0.05%）、《代数与解析几何》及《矩阵分析》等多门本科及研究生课程教学工作，
  小组学生曾获CCF优秀大学生奖,  腾讯犀牛鸟精英人才，ICDM/CIKM/SIAM/AAAI等会议Travel Grand,“隐语杯”全国高校隐私计算大赛决赛一等奖（1/74), 校级优秀毕业论文20余次
  ，其中2020,2021年度所指导学生均获得校级优秀毕业论文。表现优秀可协助推荐至海外知名高校深造及网易/微信/微众银行等企业实习。

  【长期面向 博士后、博士研究生、硕士研究生、及本科实习生， 欢迎26级同学联系！ 】 ： 如果您对联邦学习，图机器学习，鲁棒机器学习，LLM可靠性的 理论方法、工程实现与应用落地
  等方面感兴趣 ，有较强自我驱动并有志于学术研究，欢迎通过邮件 ( chenchuan@mail.sysu.edu.cn ) 与我联系！'
