bio_raw: 孟静珂，中山大学副教授，研究方向为计算机视觉、多模态学习与具身智能导航，以第一作者 / 通讯作者身份发表 CCF-A/ 中科院一区论文多篇，其中包括
  TPAMI 、 CVPR 、 ICCV 、 ECCV 等，并获得 ACM MM 2024 （ CCF-A ）最佳论文提名；作为负责人，主持承担国家自然科学基金青年科学基金、国家重点研发计划课题任务等项目。
