office_address: 中山大学东校区南实验楼D203b
bio_raw: '刘阳，中山大学计算机学院副教授， 人机物智能融合实验室（HCP-Lab） 核心成员。 主要研究方向为具身智能与机器人、自进化智能体、多模态感知与推理
  。 累计发表论文60余篇，包括TPAMI、TIP、CVPR、ICCV、ICML、NeurIPS等CCF-A/中科院一区期刊和会议，10余篇入选ESI高被引和口头报告/亮点论文，1篇入选TMech期刊最受欢迎（Polular）论文榜首。出版中英文专著《多模态大模型：新一代人工智能技术范式》（销量过万，被20余所高等院校选用为参考教材）和《物理智能：世界动作模型的原理、系统与实践》。主持国家自然科学基金面上、青年、重点课题、鹏城“揭榜挂帅”、华为合作等科研项目十余项。担任国际知名期刊IEEE
  Transactions on Image Processing 和 Pattern Recognition编委。牵头制订《具身智能多模态感知与模式识别技术要求》团体标准一项。主导研发自进化物理智能体开源操作系统PhyAgentOS，累计Github
  Stars 3K+。入选斯坦福全球前2%顶尖科学家榜单。

  招生信息：

  欢迎2027年9月入学的预推免同学联系，具备AI算法研发经验、熟悉机器人软硬件开发的同学优先考虑，请发送个人介绍、成绩单和简历到 liuy856@mail.sysu.edu.cn
  。 全年招收科研实习生，并提供补贴，优先招收留组读研的学生。 拥有充足计算资源和机器人硬件设备，支撑具身智能机器人的软硬件研发。

  招生要求： 对科研有浓厚兴趣，基础扎实，具备独立思考能力，自驱力强，品行端正，身心健康的学生。'
