research_direction_raw: '医疗机器人、具身智能机器人、神经计算

  拟重点研究基于人工智能/大模型的机器人学习方法，长期欢迎对AI + Robotics感兴趣、求学态度端正、能静心投入时间的研究生和本科生加入课题组（如有"混学位"想法的，请勿联系，多谢~）

  长期招收计算机、机械工程、自动化、电子信息、生物医学工程（排名无先后）等相关领域的博士后研究人员与专职科研系列人员

  长期招收GAP准备出国、考研、深造的本科生、研究生，每月发放助研津贴，并有成果奖励

  课题组与国内外多个研究机构如英国利兹大学、英国布里斯托大学及香港中文大学等已建立长期稳定的合作与交流关系

  学生去向：近年来，本科毕业设计学生中，3名同学拿到Carnegie Mellon University、Johns Hopkins University、University
  of Pennsylvania、University of Copenhagen、University of Zurich、Nanyang Technological
  University、The University of Warwick、King''s College London、University of Bristol等世界名校的研究生入学offer，4名同学获得中山大学校级优秀本科毕业论文奖；硕士研究生中，1名同学（为非全日制学生，半工半读）校内申请读博成功，1名同学获得中山大学校级优秀硕士毕业论文奖和优秀毕业生奖，其他同学于科技大厂/独角兽企业（如优必选、云深处、戴盟）、三甲医院、国有金融企业、科研机构工作；课题组优秀在读研究生成功前往腾讯Robotics
  X机器人实验室、戴盟机器人等大厂/独角兽企业实习。

  课题组现有的机器人平台（含人形机器人、灵巧机械手、移动机器人、协作机械臂、力传感器、深度相机等）

  人形机器人 & 灵巧机械手 & 移动机器人

  具身智能（大模型 + 深度强化学习 + 生成式AI + 机器人）

  https://guowei-zou.github.io/dmpo-page/

  https://guowei-zou.github.io/d2ppo/

  dVRK + 柔性内窥镜 & UR5 + 柔性内窥镜

  UR5 + MAGS内窥镜 & 脑活检机器人

  机器人运动规划 & 物理性人机交互

  模块机器人'
