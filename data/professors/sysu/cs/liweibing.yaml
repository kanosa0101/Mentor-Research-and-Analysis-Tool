bio_raw: 中山大学“百人计划”引进人才、副教授、博士生导师，2022年至2025年连续入选美国Stanford大学/Elsevier发布的全球Top 2%科学家榜单，2023年广州市“青年科技人才托举工程”项目入选者，担任国家医疗器械技术审评中心外聘专家、广州市大湾区智能科技人才联合会理事、广东省医疗行业协会专科管理分会委员、粤港澳大湾区人工智能产业智库专家。2018年获得英国利兹大学机械工程博士学位，随后于香港中文大学周毓浩创新医学技术中心（位于威尔斯亲王医院）从事医疗机器人博士后研究工作。现主要从事智能机器人和神经计算研究，目前已发表英文专著1部、学术论文140余篇，获中国商业联合会服务业科技创新奖一等奖、海南省科学技术奖自然科学奖二等奖、广东省生物医学工程科学技术奖技术发明奖三等奖，获国际会议（含机器人顶会ICRA
  2024自动化领域）最佳论文奖/最佳论文提名奖4项，申请发明专利20余项（已获授权13项），主持国家级、省部级、市区级以及横向项目多项，指导学生获“挑战杯”全国大学生课外学术科技作品竞赛二等奖（2025）、“挑战杯”广东大学生创业计划竞赛金奖（2026）、粤港澳大湾区博士博士后创新创业大赛揭榜领题赛金奖（2026）。
