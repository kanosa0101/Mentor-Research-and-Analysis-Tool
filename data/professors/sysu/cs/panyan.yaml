research_direction_raw: '主要研究兴趣是多模态大模型、信息检索与推荐、因果推断，包括

  1、多模态大模型幻觉抑制、多模态问答、因果推断在大模型中的应用

  2、基于深度神经网络的哈希方法，图像检索

  3、生成式推荐，排序融合、排序学习'
