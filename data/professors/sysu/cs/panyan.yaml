bio_raw: 潘炎，副教授，博士生导师。2007年在中山大学计算机科学系计算机软件与理论专业获得工学博士学位（导师：汤庸教授）。2012年在新加坡国立大学的 Learning
  and Vision Research Group 做访问研究员（合作导师：颜水城教授）。在IEEE TIP，IEEE TNNLS，IEEE TCB，IEEE
  TC等国际期刊和CVPR/AAAI/SIGIR/ECCV等国际会议上发表论文50多篇。主持国家自然基金面上项目3项，国家基金青年基金项目1项。
