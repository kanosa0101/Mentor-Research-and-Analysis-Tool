bio_raw: 中山大学计算机学院教授，博士生导师。2003年获华中科技大学计算机软件与理论专业博士学位。主要从事大数据，数据库与数据挖掘等方面的研究。近年来在SIGMOD,
  TODS, VLDB, VLDBJ, SIGIR, IJCAI, AAAI, CIDR等国内外权威期刊和顶级学术会议上发表论文60多篇，获得软件版权2项，发明专利10多件。先后主持和参与了10多项国家和省部级研究项目，其中主持国家自然科学基金项目4项（含广东联合基金重点项目子课题1项）。是中国计算机学会（CCF）高级会员，CCF数据库专委会委员，CCF大数据专家委员会委员，CCF教育工作委员会委员，ACM和IEEE成员。是国家自然科学基金和广东省自然科学基金等通讯评审专家。主要从事数据库，高级数据库等本科和研究生课程的教学，合作出版数据库教材1本。获中山大学教学成果一等奖1项，广东省教学成果二等奖1项。
