bio_raw: '黄聃，教授，2018年8月获得美国中佛罗里达大学计算机工程专业博士学位。2015年11月至2016年8月在美国橡树岭国家实验室从事研究工作。在国家超级计算广州中心从事超算和大数据、人工智能融合创新发展的技术、系统和应用研究和实现。研究成果发表在IEEE
  TC, IEEE TPDS, SC, PPoPP,ICML, ACL, IPDPS, ICDCS, ICS, ICPP等期刊和会议。

  欢迎有意报考中山大学的硕士生和博士生与我联系。

  硕士培养路径：探索一个领域应用，研发一个系统软件，熟悉一个硬件设备（1+1+1）

  博士培养路径：在硕士路径基础上，独立发现问题、诊断分析问题、提出技术方案、系统研发验证、论文撰写修改、PPT设计汇报、项目资料整理'
