bio_raw: '基本情况： 卢伟 ，男，博士，教授，博士生导师，籍贯 河南南阳 网络空间安全研究所 所长 信息技术教育部重点实验室 主任 入选wxb国家级人才计划项目

  教育经历： 2002年7月毕业于东北大学自动化专业，获工学学士学位； 2005年3月毕业于上海交通大学计算机软件与理论专业，获工学硕士学位； 2007年4月毕业于上海交通大学计算机软件与理论专业，获工学博士学位；
  2005年至2006年于香港理工大学计算学系担任助理研究员； Email： luwei3@mail.sysu.edu.cn

  主要合作/招聘方向: （1）博士后研究员： 主要方向：AI安全与对抗、开源情报分析，大数据安全、数字媒体安全、数字取证、信息隐藏。 （2）特聘研究员： 岗位工作要求：1）以本研究组为基础，开展研究工作；2）协助研究组开展科研、培养学生和项目申请。

  主要研究生招生专业: 博士生：计算机科学与技术，有意向请提前联系，欢迎优秀本科生直博 学术型硕士： 计算机科学与技术 专业型硕士： 电子信息、计算机技术、网络空间安全、软件工程
  欢迎计算机、电子、自动化、数学、物理、信息等相关专业的同学报读、欢迎本科生提前进入实验室研习。'
