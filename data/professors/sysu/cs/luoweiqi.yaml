office_address: 广州大学城中山大学实验中心B501
bio_raw: '2008年博士毕业于中山大学信息科学与技术机学院，现为中山大学计算机学院教授，博士生导师。 IEEE Senior Member、中国计算机学会（CCF）高级会员，中国图象图形学学会高级会员、中国电子学会通信分会“多媒体信息安全”、SCIG数字媒体取证与安全专委会委员。信息安全领域国际权威期刊
  IEEE Trans. on Information Forensics and Security （TIFS） 、 IEEE Trans on Dependable
  and Secure Computing （TDSC） 与IEEE Transactions on Circuits and Systems for Video
  Technology (TCSVT) 的 Associate Editor， 国内著名刊物《网络与信息安全学报》（CCF-T2） 青年编委, AAAI Senior
  Program Committee等。近二十个国际著名学术期刊及会议的审稿人。国家自然科学基金、省自然科学基金等评审专家。获得首届珠江科技新星、广东省特支计划-
  科技创新青年拔尖人才（考核：优秀）、霍英东教育基金-青年教师基金获得者、广东省千百十人才培养工程校级培养对象。

  作为第一作者（通讯作者）在包括本领域国际顶级期刊如IEEE Trans. on TIFS,  TDSC,  CSVT 、本领域国际权威会议如IEEE S&P,
  ACM IH&MMSEC，WIFS 、ACM MM，AAAI ，以及国内顶级期刊如中国科学、软件学报，计算机学报、JCST 等中国计算机学会CCF推荐的国际期刊 /会议上发表学术论文100多篇；此外，申请中国发明专利近20项，其中获得授权16项，转让授权专利1项；软件著作2项。主持并完成国家自然科学基金项目4项，省部级、广州市级项目近10项。作为主要参与人完成包括国家973项目、国家自然科学基金重点项目等多项。
  获得2019年中国计算机学会CCF科学技术奖自然科学一等奖 （项目名称：信息隐藏理论与方法；2019年仅1项获一等奖），入选 2020年-2025年爱思唯尔“中国高被引学者”榜单（网络空间安全方向），2022年度广东省计算机学会-自然科学奖二等奖（项目名称：图像隐写安全关键技术）
  。

  如果你对生成式深度学习、数字媒体安全、机器学习应用等感兴趣，欢迎报考我的博士（计算机科学与技术、网络空间安全）、硕士 (学硕：计算机科学与技术，工程硕士：各方向)
   研究生 ！ 研究基础主要包括：数字图像处理、深度学习、以及python 编程。

  毕业后的博士主要在国内知名高校任职，而硕士则主要进入国内著名IT企业，如阿里巴巴、华为、美团等，以及证券公司和银行工作。'
