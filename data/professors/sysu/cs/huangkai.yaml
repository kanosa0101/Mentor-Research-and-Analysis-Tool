bio_raw: '三级教授, 博士生导师, 国家级人才项目领军人才入选者，人工智能与机器人研究所所长、机器智能与先进计算教育部重点实验室副主任

  任政协第十三届广东省委员会委员, 广东省知联会第四届理事会理事，全国两融合标委会工业软件标准工作组WG8专家咨询委员会委员，广东省医师协会医学机器人分会常委、广东省医学会医学人工智能分会委员、广东省呼吸与健康学会医工融合专委会委员。

  曾入选国家青年海外高层次人才引进计划、国家优秀自费留生，在Science Robotics、Nature Machine Intelligence、IJRR、PAMI、TC、TPDS、RSS、ICRA、IROS、DAC、HPCA等国际著名期刊\会议上发表多篇论文、并获十余项最佳论文/提名,
  授权专利80余件，主导多项知识产权转化。

  曾获2020年第十二届深圳创新创业大赛先进制造行业团体组一等奖，2021年获得吴文俊人工智能科学技术奖一等奖，2022年获中国安全生产协会安全科技进步奖二等奖，2023年广西科学技术进步奖三等奖，2023年广东省优秀医药成果，2024年广东高校最具转化价值知识产权奖，2024年广东省人工智能协会科技进步一等奖，2025日内瓦发明奖银奖。

  曾指导学生获互联网+大学生创新创业大赛国家铜奖、省银奖，“挑战杯”大学生创业计划竞赛国家银奖，中国研究生电子设计竞赛Xilinx企业专项最佳作品奖，2023全国大学生机器人科技创新交流营暨大赛特等奖。

  更多研究领域及成果详情可参考实验室主页： https://www.usilab.cn

  欢迎有志于从事机器人、无人驾驶、医疗器械、人工智能等领域的科研人员和博士生、硕士生、本科生同学加入实验室。'
