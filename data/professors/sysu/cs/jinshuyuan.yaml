bio_raw: '金舒原，博士，教授/博士生导师

  广州市高层次人才（2022年5月）

  入选国家级人才计划项目（2024年） 20多年来一直从事网络与信息安全领域的科研和学术一线工作，近年来，主持了国家重点研发课题、国家自然基金、广东省重点研发子课题、粤深联合基金重点、863计划课题等科研多项，广泛开展产学研合作，参编我国首部《论网络空间主权》白皮书，参编广东省网信办内参《全球互联网治理观》。主持了包括国家重自然科学基金、863计划、国家发改委信息安全专项、国家重点研发课题等科研20余项；参与了973、863重大、广东省重点研发等科研30余项，多项专利已转化，牵头形成并发布行业标准。获中央网络安全与信息化领导小组办公室安全专项奖2项，获2017年度教育部科学技术进步奖一等奖（排名第1）。

  News: 长期招收博士、硕士研究生、博士后，团队会为每位研究生预留一笔科研经费支撑其科研直至毕业。团队与鹏城实验室、清华大学、360等业界知名研究团队和头部企业长期合作，优秀研究生优先推荐工作。欢迎优秀本科生加入实验室，表现优秀者可以推荐至北大、清华、国家实验室、香港、澳门等优秀团队工作。'
