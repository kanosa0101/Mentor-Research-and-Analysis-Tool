bio_raw: 中山大学计算机学院教授、博士生导师。中国图象图形学学会副理事长、会士，自动化学报副主编，中国计算机学会杰出会员，中国计算机学会计算机视觉专业委员会副主任（第一、二届）。广东省图像图形学会理事长（第四、五届），广东省人工智能与机器人学会副理事长、广东省安防协会人工智能专委会主任。IEEE高级会员。已主持承担国家自然科学基金与广东联合重点项目，科技部科技支撑课题，国家自然科学基金、广东省前沿与关键技术创新专项等多项，获得广东省自然科学一等奖（2018年）、中国图象图形学学会自然科学一等奖（2020年）、广东省自然科学二等奖（2020年）、广东省科学技术奖励二等奖（2016年）等。已发表了200多篇学术论文，主要发表在IEEE
  TPAMI、IJCV 、IEEE TIP、IEEE TNN、IEEE TCSVT、Pattern Recognition等国际权威刊物以及ICCV、 CVPR、
  ICDM等专业重要学术会议上。拥有30多项国家发明专利。
