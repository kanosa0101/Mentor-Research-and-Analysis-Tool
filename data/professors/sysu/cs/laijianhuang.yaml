research_direction_raw: '计算机视觉：工业视觉检测、人脸识别、对象检测、增强与跟踪；

  模式识别：脑启发的神经网络计算机模型、可解释的深度学习新方法、非线性模式识别；

  视频图像分析与理解：智慧城市计算中的行人重识别、空地一体化图像分析、行为识别、群体状态检测与分析；

  人工智能大模型技术应用。'
