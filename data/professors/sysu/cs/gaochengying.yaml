office_address: 数据科学与计算机学院 - A209室
bio_raw: '副教授，硕士生导师

  博士毕业于中山大学信息科学与计算机学院，2015-2016年于加拿大西蒙佛雷泽大学计算机科学与工程系从事研究工作。在 SIGGRAPH、SIGGRAPH Asia、CVPR、Pacific
  graphics、ECCV、ACM Transactions on Graphics、Computer Graphics Forum、ACM Transactions
  on Sensor Networks 和计算机学报等国内外知名学术期刊和会议上发表学术论文30余篇。主持国家重点研发计划子课题、国家自然基金青年科学基金项目、广东省自然基金项目及香港科技创新署基金子课题等项目，并参与多个国家自然基金面上项目和广东省、广州市科技计划项目。曾荣获中国国家教育委员会科技进步一等奖、国家科技进步二等奖等奖项。

  欢迎计算机科学、软件工程、信息与计算科学等相关专业的同学报考本人的研究生，包括学术型硕士(计算机科学与技术)、专业型硕士（计算机技术、软件工程）。同时，也欢迎优秀本科生能加入我的实验室（
  https://www.sysu-imsl.com/ ）。'
