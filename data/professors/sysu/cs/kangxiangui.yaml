bio_raw: 'Xiangui Kang Received B.S. degree from Peking University, Beijing, China,
  and Ph.D. degree from Sun Yat-Sen University, Guangzhou, China. He was a visiting
  scholar with University of British-Columbia in 2014, with University of Maryland-College
  Park during 2011 – 2012, and with New Jersey Institute of Technology during 2004
  – 2005. He is currently a professor with the school of computer science and engineering,
  Sun Yat-Sen University, Guangzhou, China. His research interests include information
  forensics, watermarking, multimedia communication and security. He has published
  more than 80 research papers in major international academic journals and peer-reviewed
  conference proceedings. Dr. Kang was the chair of Multimedia Security and Forensics
  Technical Committee of Asian-Pacific Signal and Information Processing Association
  ( http://www.apsipa.org/TC/MSF.html ), and  a member of IEEE Signal Processing Society''s
  Information Forensics and Security Technical Committee.

  Associate Editor: IEEE Transactions on Information Forensics and Security (2025-
  ), IEEE Signal Processing Signal Letters (2020-2023), Signal Processing: Image Communication
  (2016-2025).

  Senior Associate Editor: IEEE Signal Processing Signal Letters (2023- )

  中山大学计算机学院教授、博士导师，广东省信息安全重点实验室副主任。广东省优秀博士论文获得者、IEEE Transactions期刊编委、亚太国家信息与信号处理协会(APSIPA)信息取证与安全技术委员会的主席(
  http://www.apsipa.org/TC/MSF.html )、多次国际会议最佳论文获得者，2020年起连续多年入榜” 中国高被引学者 “。先后毕业于北京大学、中山大学，并取得学士和博士学位。美国大学博士后和访问学者经历。

  多年从事人工智能安全、多媒体信息取证、 信息隐藏等信息安全方面的研究，主持各类科研项目20多项，包括主持国家自然科学基项目8项、国家重点研发计划项目任务2项、广东省自然科学基金重点项目1项，作为骨干成员参加国家973计划项目、国家自然科学基金重点项目和国家自然科学基金-广东省联合基金重点项目等多项，在数字多媒体信息安全方向发表论文100多篇，包括在IEEE/ACM
  Transactions和CCF A类期刊等顶级期刊上以第一作者/通讯作者发表30多篇论文，获教育部自然科学一等奖和广东省优秀博士论文奖，已经获得相关专利授权16项。在加拿大蒙特利尔举行的2017年IEEE
  GlobalSIP盛会上做了深度学习与信息安全方面的杰出演讲（Distinguished Talk）和2019年本领域重要国际会议International Workshop
  on Digital-Forensics and Watermarking (IWDW)上作主旨演讲，且研究成果获得本领域重要国际会议International
  Workshop on Digital-Forensics and Watermarking (IWDW)的2008年、2013年及2018年等多次最佳论文奖。

  招收计算机科学与技术，网络空间信息安全和通信与信息系统专业的专职研究员，博士后，博士和硕士研究生，欢迎有兴趣的同学请联系 。

  同时特别欢迎优秀的本科生联系进入实验室学习和深造。

  毕业学生分配去向统计（截止到2025年5月）：毕业博士生：高校（12名，其中11名已经是副教授，5个已经获得国家自然科学基金项目资助），毕业硕士生（70名）： 国家、广东省、广州市公务员，
  IBM、网易、 腾讯、阿里、华为、字节跳动、唯品会、TPLINK等其他IT高科技公司，中国移动、南方电网、中国电信、中国联通等国企，银行与证券等。'
