office_address: 计算机学院310
bio_raw: '中山大学教授, 博士生导师, 广东省杰出青年基金获得者，量子计算与软件研究所副所长，广东省大数据分析与处理重点实验室副主任，中山大学逸仙学者。2016年6月于西安交通大学计算机科学与技术系获博士学位。2012年7月－2012年11月作为“明日之星”在微软亚洲研究工作实习，2016年6月－2018年1月在IBM中国研究员云计算部门担任研究员，2017年2月－2017年4月作为访问研究员在IBM
  T.J. Watson研究中心工作。主要方向为： 分布式系统、操作系统、计算机网络、云计算、无服务器计算、软件可靠性 等。近年来在国际会议和期刊共发表高水平论文80余篇，同时担任多个国际期刊和会议的审稿人。

  如果你对云计算 (IaaS、PaaS、SaaS、FaaS)、分布式系统、计算机网络、操作系统感兴趣，并能沉下心来做研究，可以联系读博士或者博士后！'
