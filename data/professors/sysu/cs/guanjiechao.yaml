bio_raw: 管界超，预聘助理教授，博士生导师。在中国人民大学获得数学专业学士学位和计算机专业博士学位，曾在香港科技大学（广州）人工智能学域担任博士后研究员。研究方向是机器学习理论与算法，以第一作者身份在机器学习期刊和会议TPAMI、ICML、NeurIPS、ICLR上发表多篇论文，曾获NeurIPS和ICLR的Spotlight奖。
