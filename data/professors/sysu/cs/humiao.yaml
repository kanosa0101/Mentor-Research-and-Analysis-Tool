bio_raw: '胡淼，博士，副教授，博士生导师。2011 年和 2017 年在北京交通大学获学士和博士学位。2014 年至2015 年于美国宾夕法尼亚州立大学博士联合培养。2017
  年加入中山大学计算机学院工作，先后担任特聘副研究员（合作导师： 吴迪 教授 ）、副教授。发表高水平学术论文 100 余篇，包括 IEEE TON, TMC, JSAC,
  TPDS, TSC, TMM, INFOCOM, ICML, KDD, AAAI, MM 等顶级期刊和会议，主持科研项目 10 余项，包括：国家自然科学基金面上项目、国家自然科学基金青年项目、广东省自然科学基金面上项目、广东省自然科学基金博士科研启动项目、广州市重点研发计划课题、中山大学创新人才培育计划项目以及企业委托研发项目等，以项目骨干身份参与国家重点研发计划（排名第三）和国家自然科学基金联合基金重点项目等。中国计算机学会（CCF）高级会员，担任中国自动化学会边缘计算专业委员会执行委员、
  中国计算机学会分布式计算与系统专委会执行委员，先后担任多个国际研讨会的程序委员会成员，以及若干顶级期刊和会议的审稿人。主要研究方向包括： 新型计算系统（NCSys）、人工智能系统（AISys）
  以及 多模态系统（MMSys） 等。

  长期招收博士研究生、硕士研究生。欢迎优秀本科生加入实验室，表现优秀者可以推荐深造。

  欢迎推免/考研学生联系本人咨询实验室的招生名额和相关事宜！'
