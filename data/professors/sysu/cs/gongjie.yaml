office_address: 广州大学城外环东路132号中山大学计算机学院
bio_raw: '龚杰，中山大学计算机学院副教授，博士生导师。分别于2008年和2013年在清华大学获得学士和博士学位，期间于2012年访问英国爱丁堡大学。2013年至2015年在清华大学从事博士后研究工作，获得了博士后科学基金面上项目和特别资助。2015年加入中山大学工作至今，入选“广东特支计划”科技创新青年拔尖人才。作为负责人承担了国家自然基金青年基金和面上项目、广东省自然基金面上项目、广州市科学研究专项等，作为骨干参加了国家973项目、国家重点研发计划国际合作项目等。已在国内外期刊和会议上发表或录用论文80余篇，授权专利7项。目前担任学术期刊
  IEEE Transactions on Green Communications and Networking 编辑、国际会议IEEE/CIC ICCC 2022
  workshop co-chair，在IEEE WCNC上组织了边缘计算专题系列研讨会、IEEE/CIC ICCC 2018 上组织了智慧城市专题研论会。获得了2013年第二届IEEE通信学会亚太杰出论文奖，2016年
  IEEE Wireless Communications Letters 模范审稿人称号，2021年广东省科技进步二等奖。

  招收电子、计算机、通信、数学等相关专业博士、硕士研究生，博士后研究员 ，特别欢迎具有较好数学、英语基础的学生加入实验室。更多详情请前往个人主页: http://cse.sysu.edu.cn/coin/~gj/index.html'
