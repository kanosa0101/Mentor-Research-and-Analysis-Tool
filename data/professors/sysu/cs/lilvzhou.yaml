bio_raw: '李绿周，中山大学计算机学院教授、博士生导师，量子计算与软件研究所所长，计算机科学系主任；中国计算机学会（CCF）量子计算专委副主任委员、中国网络空间安全学会（CCSS）量子计算安全专委副主任委员、CCF理论计算机科学专委会常务委员、CCF杰出会员、CCF杰出演讲者(2019、2021、2022、2023年度）。长期从事量子计算理论研究，主要包括量子算法、量子线路编译与优化、量子人工智能、量子体系结构等方向，近年来带领研究团队在量子算法方面形成一定研究特色，相关成果被New
  Scientist等科技媒体报道。在IEEE TIT/TFS/TIFS/JSAC/TCAD、Information and Computation、Algorithmica、JCSS、TCS、NPJ
  Quantum Information、Physical Review A/Applied、中国科学系列等计算机、物理、量子信息领域知名学术期刊以及SODA、ICALP、ICML等一流会议发表论文110多篇，出版专著、译著、教材等5部。获湖南省自然科学二等奖、广东省杰出青年基金、中国计算机学会优秀博士学位论文奖、中山大学青年教师授课大赛一等奖等。指导学生多次获CCF量子计算编程挑战赛、挑战杯揭榜挂帅专项赛等国家级赛事的特等奖、一等奖等。

  NEWS： 招聘专任教师、博士后，其中专任教师按照学校预聘-长聘新机制招聘，待遇及配套措施优厚，欢迎从事量子计算相关研究的青年才俊加入！招收访问学者、访问学生、博士、硕士、高年级本科生，欢迎感兴趣的联系李老师（
  lilvzh@mail.sysu.edu.cn ）。

  NEWS: 研究团队重视对本科生研究兴趣的引导，开设本科生量子计算研讨班，组织对量子计算基础知识的学习与开展创新性研究，组织参加国内外有影响力的赛事，有兴趣者请联系冯老师(
  fengshg3@mail.sysu.edu.cn )。

  中山大学计算机学科已有20年多年量子计算研究历史，是国内计算机领域最早从事量子计算研究的力量之一，已培养量子计算方面的研究生数十人，博士毕业生30余人，目前建有量子计算与软件研究所。如果你是对量子计算感兴趣的学生，欢迎一起来探索量子计算领域有趣的问题。如果你已学业有成，欢迎加入中山大学，我们一直在致力于团队建设。期待有志青年加入，携手共创未来！

  研究团队的详细介绍请见 https://www.scholat.com/team/quantumlab ，欢迎关注“好好聊量子”公众号了解相关学术信息。'
