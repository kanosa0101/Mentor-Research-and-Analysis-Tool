research_direction_raw: '研究团队主页： 量子计算实验室

  研究生招生公告

  本科生量子计算研究兴趣小组招生公告

  量子计算研究方向学习资料

  团队的研究方向主要包括：

  1. 量子计算：量子算法、量子机器学习、量子线路编译与优化等

  2. 工程实践：量子计算软件开发

  欢迎感兴趣的同学与我们联系，研究团队与国内外知名高校、重点实验室、业界有广泛的学术合作， 鼓励对外交流，提供丰厚研究补贴。

  研究生招生专业：

  博士生：计算机科学与技术（学术博士）、计算机技术（工程博士）

  硕士生：（1）学术硕士：计算机科学与技术；（2）工程硕士：电子信息（含计算机技术、软件工程等）

  博士后、专职研究员招聘：

  欢迎计算机、物理、数学等学科背景的博士毕业生加入本团队做博士后或专职研究员，提供具有竞争力的薪酬待遇，欢迎联系咨询。

  团队科研经费充足。'
