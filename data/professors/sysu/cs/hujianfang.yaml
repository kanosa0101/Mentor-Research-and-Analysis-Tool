office_address: 计算机学院
bio_raw: '中山大学副教授，博士生导师。在国际顶级会议（CVPR、ICCV、 NeurIPS等 ）和一区期刊（IEEE TPAMI等）发表论文70余篇，获广东省杰出青年基金、中山大学优秀指导教师、广东省科学技术奖自然科学奖二等奖、中国图象图形学学会优秀博士学位论文奖（全国仅4篇）、CVPR
  Workshop 2021 Person In Context Challlenge 最佳论文奖，获国际顶级会议ACM MM 2022 Workshop 跨模态视频-语言定位竞赛和国际顶级会CVPR2018大规模行为识别等比赛冠军。指导的24届毕业生谭超镭同学获
  中山大学优秀硕士学位论文奖 （论文题目：基于自然语言描述的视频内容定位），全学院仅4人入选。已毕业学生多数去腾讯、阿里巴巴、科大讯飞、中移动和字节等大厂或重要国企，或公务员，或升学读博（境外/海外名校或留本团队）。个人主页链接：
  JianFang Hu - Homepage 。

  27级硕士生可选方向 ：聚焦最新研究技术热点热门方向，包括多模态大模型推理，视频理解与生成，大模型融合（偏机器学习），多智能体，世界模型和机器人情感分析，其中机器人情感分析方向与郑伟诗教授的机器人团队一起合作。

  26/27级博士生可选方向 ：物理规律引导的视频生成，机器人情感分析，多模态视觉理解。

  硕士要求 ：勤奋，有自驱力，不轻言放弃，思维较活跃，具有较强的编程或数学能力，英语基础好 。

  博士要求 ：具有强自驱力，扎实的科研基础和能力，在硕士期间具有较好的科研成果，在CCF A会议或中科院一区发表1篇以上论文，具有团队意识。

  指导方式 ：导师+海外牛博师兄+组内牛师兄师姐（如博士生、在大厂基模组实习的学生）指导，每周固定讨论1次。

  1，课题组以科研为主，但也会接部分横向项目支撑团队发展（购买计算服务器等），但总的横向任务不会多，每个愿意做科研的学生都可以将大部分时间用于科研。2，组内内合作氛围好，师兄师姐也乐于指导师弟师妹，3，课题组会尽可能给予比较大的研究自由和资源，对科研成果有一定要求（如发A会或一区顶刊），
  课题组不是放羊组 。

  欢迎2027年9月入学的 夏令营/保研 和 读博同学 联系，发送简历至 hujf5@mail.sysu.edu.cn .

  工程硕士（与南方电网联合培养）招生：研究课题“面向交直流混合电网的设备及人身风险防控多模态大模型及智能体构建关键技术研究” 和 “公里级分辨率灾害天气Al快速预报技术研究”，欢迎感兴趣的推免同学联系报名。'
