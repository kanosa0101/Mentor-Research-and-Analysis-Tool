bio_raw: '潘嵘，男，汉族，1976年生。博士，副教授，硕士生导师。在过去十年一直从事数据挖掘、人工智能的研究工作。博士研究方向是非线性特征提取。2004年底获得中山大学理学博士学位后，先后在香港科技大学与美国惠普实验室进行数据挖掘、人工智能等方面的研究。2009年10月至今任职于中山大学。

  已在国际一流学术会议、期刊和杂志上发表超过十篇学术论文，其中包括Artificial Intelligence, IEEE Transactions on Knowledge
  Discovery and Data Engineering, ACM Transactions on Information Systems, AAAI, IJCAI,
  ACM SIGKDD, 和ICDM等等。

  2005年，参加美国计算机学会（ACM）举办的数据挖掘国际比赛（KDDCup：数据挖掘方面每年全球最重要的比赛）。当年比赛的主题是搜索引擎查询的分类。最终获得全部三个项目（包括查询分类算法的精确度、性能以及创新性）的第一名。

  是多个杂志、会议的审稿人（程序委员），包括：IEEE Transactions on Knowledge Discovery and Data Engineering,
  IEEE/ACM Transactions on Computational Biology and Bioinformatics, Artificial Intelligence
  in Medicine, ACM TKDD Special Issue on Social Computing, Behavioral Modeling, and
  Prediction, AAAI, IJCAI, ECML, 和PRICAI等等。'
