bio_raw: '赖韩江，博士。2014年获中山大学工学博士学位。2014年到2015年作为Research Fellow在新加坡国立大学Learning & Vision
  实验室进行计算机视觉方面的研究。2015年起加入中山大学，2018年转聘为副教授。近年来主要从事大数据与人工智能方面的研究，包括多模态数据分析、多智能体强化学习、信息检索等方向的研究。作为项目负责人或参与人先后承担了多项国家及省部级项目的研发工作。获2019年广州市珠江科技新星、2020年广东省计算机学会科学技术奖一等奖等奖励。近年在相关领域的国际会议和期刊上发表论文多篇，详见学者网个人主页（
  https://www.scholat.com/laihanj ）和 [ Google学术赖韩江的个人主页 ]。

  欢迎对大数据、人工智能等方向感兴趣的同学与我联系。联系方式是 laihanj3@mail.sysu.edu.cn 。'
