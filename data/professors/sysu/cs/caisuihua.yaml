bio_raw: 蔡穗华，2011年本科毕业于中国地质大学（武汉）信息与计算科学专业，分别在2016年和2019年于中山大学获得基础数学硕士学位和信息与通信工程博士学位，研究方向是信息论、纠错编码技术及其应用。迄今已发表论文20篇，包括IEEE
  Transactions on Information Theory、IEEE Transactions on Communications、ISIT等信息与编码领域旗舰期刊和会议，已授权发明专利7件，主持一项国家自然科学基金青年基金项目，所参与研究项目“信道编码纠错新机理”获2021年中国电子学会自然科学三等奖。
