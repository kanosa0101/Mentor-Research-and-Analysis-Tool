bio_raw: '董浩业，副教授、博士生导师、国家级高层次青年人才、逸仙优秀学者。博士毕业于中山大学，曾在美国卡内基梅隆大学、新加坡国立大学从事博士后及高级研究员工作。主要面向三维视觉与具身智能开展研究，重点关注三维人体建模、多模态人—场景交互学习，以及世界模型驱动的人形机器人感知、决策与控制。近年来在
  NeurIPS、CVPR 等顶级会议发表多篇论文，担任 NeurIPS、ICLR、CVPR 等领域主席，组织三届 CVPR Workshop 国际研讨会。

  欢迎对人形机器人、三维视觉、具身智能、多模态大模型等方向感兴趣的同学加入团队。

  招生对象： 2026/2027 年 9 月入学硕士生、博士生 支持与资源：优秀学生可推荐至 CMU、NUS、TikTok、NVIDIA 等海内外高校/企业深造、访学或实习；团队提供充足计算资源和机器人实验平台。'
