bio_raw: '李洽，中山大学计算机学院副教授，博士生导师，现任计算机学院数据科学系副主任，广东省计算数学学会常务理事兼副秘书长，广东省计算科学重点实验室成员。研究方向包括最优化理论与算法及在机器学习、大数据分析、图像处理等领域中的应用，研究成果发表于SIAM
  Journal on Optimization, Applied and Computational Harmonic Analysis, Mathematics
  of Operations Research, Inverse Problems等期刊。

  如果您对我的研究方向感兴趣，欢迎报考我的研究生！招收专业：计算数学博士、计算数学学硕及其它专业专硕'
