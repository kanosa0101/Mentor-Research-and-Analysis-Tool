bio_raw: Jianlin Feng is currently a full professor of the School of Software in Sun
  Yat-Sen University. He received B.E, M.E. and Ph. D.  from the Department of Computer
  Science, Huazhong University of Science and Technology , under the supervision of
  Professor Yucai Feng . He was a post-doctor fellow for one year in the Hong Kong
  University of Science and Technology under the supervision of Professor Hongjun
  Lu . From 2005 to 2007, he was a visiting scholar for two years in the University
  of Illinois at Urbana-Champaign under the supervision of Professor Jiawei Han .
