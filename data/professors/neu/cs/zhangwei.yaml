bio_raw: '张伟，女，博士，副教授。

  2010年1月调入东北大学工作。主讲本科生《数据结构》、《面向对象程序设计》课程。2002年于中国海洋大学计算机系获工学学士学位；2005年于中国科学院沈阳计算技术研究所获工学硕士学位；2014年于东北大学获工学博士学位。主要从事多媒体智能信号处理、网络多径传输优化等方面的研究工作。以第一作者身份在Computer
  Communications、Computer

  Networks、Cloud Computing等国际期刊、国际顶级会议上发表论文

  20

  余篇。作为项目负责人主持

  1项国家自然科学青年基金项目，1项辽宁省自然科学基金项目，多项中央高校基本科研业务费专项；作为课题负责人承担教育部中国移动科研基金项目等；并完成多项横向课题。相关成果已获得国家发明专利授权

  10

  余项，取得软件著作权

  1项，获2

  021

  年辽宁省科技进步二等奖。

  电子邮箱：

  zhangwei1@mail.neu.edu.cn。'
