bio_raw: '张松伟，博士，东北大学计算机科学与工程学院副教授，博士生导师，主要研究方向包括工业物联网、网络拓扑控制、拓扑鲁棒性优化、人工智能、量子计算等，利用量子计算+机器学习新方法来解决物联网规模化发展带来的海量设备组网鲁棒性差的关键难题。在IEEE/ACM
  ToN（CCF-A类）、IEEE TMC（CCF-A类）、IEEE IoT Journal（中科院一区）、IEEE Wireless Communications（中科院一区）、IEEE
  Network、IEEE ICC等国际顶级SCI期刊和国际顶级会议发表学术论文18篇（含CCF-A类论文6篇，中科院/SCI一区论文2篇）。申请发明专利6项，授权发明专利2项。撰写国际上首部介绍物联网拓扑鲁棒性的学术专著，由Springer出版。自出版以来，在线下载量已突破4.3万人次。作为项目骨干参与国家重点研发计划项目课题/子课题、国家自然科学基金联合基金重点项目、工业和信息化部重点项目课题、国家自然科学基金面上项目、国网天津电力公司科技项目等国家级/省部级项目6项。搭建工业物联网综合感知平台，该平台已经通过中国工业互联网研究院测试，并获得CNAS认证。担任IEEE/ACM
  ToN、IEEE TMC、IEEE IoT Journal、IEEE TNSE、IEEE Wireless Communications、IEEE Network等国际顶级SCI期刊审稿人，以及国际会议IEEE
  ICPADS 2022、ICC 2024、CSCWD 2024、CSCWD 2025审稿人，IEEE SmartIoT 2023分会主席等。

  电子邮箱：zhangsongwei@neu.edu.cn'
