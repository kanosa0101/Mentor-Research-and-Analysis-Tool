title: 副教授
bio_raw: '耿蓉，女，博士，副教授，长期从事无线网络关键技术研究工作，在智能通信、网络优化与安全等领域取得多项创新成果。曾赴美国

  The University of Texas at San Antonio

  进行为期

  12

  个月的访问学者，与国际学者合作开展前沿课题。作为项目负责人主持国家自然科学青年基金项目、辽宁省科技厅博士启动和自然基金项目、中央高校基本科研业务费引导项目和重大项目等多项课题。作为核心成员参与国家

  863

  计划项目、国家自然科学基金面上

  基金

  等多个纵向项目。以第一作者身份在

  SCI

  、

  EI

  收录的国际期刊、国内学报及国际会议上已发表论文

  10

  余篇。担任多个国际期刊和国内学报审稿人。主讲本科生《通信原理》及硕士研究生《数字通信理论基础》等课程。

  个人邮箱

  ：

  gengrong@mail.neu.edu.cn

  。'
