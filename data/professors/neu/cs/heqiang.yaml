bio_raw: '何强，

  男，

  教授，博士生导师。

  从事边缘计算、算力网络、端边云协同、智能网络、人工智能（模型可解释性、安全性）、机器学习算法（图神经网络、多智能体）等方向教学研究工作。

  目前担任

  CCF

  高级会员、

  CCF

  互联网专委会、网络与数据通信专委会执行委员

  、

  YOCSEF

  沈阳

  25-26

  主席，

  担任

  16

  个国际

  /

  国内期刊编委。在

  IEEE/ACM Transactions on Networking

  、

  IEEE Transactions on Computers

  、

  IEEE Transactions on Mobile Computing

  等国际知名期刊和

  NeurIPS

  等国际会议上发表或录用论文

  100

  多篇，其中

  SCI

  检索

  9

  0

  多篇，

  第一作者或通信作者发表

  CCF A

  、

  IEEE/ACM Transactions

  30

  余

  篇

  ，第一作者高被引

  /

  热点论文

  5

  篇

  ，

  授权

  /

  申请国家发明专利

  20

  多项；负责国家级和省部级项目

  10

  余项；荣获

  辽宁省优青、

  辽宁省优博、辽宁省自然学术成果奖

  2

  项、国际会议最佳论文

  /

  最佳引用奖

  5

  项。

  个人主页：

  http://faculty.neu.edu.cn/heqiang/zh_CN/index/152032/list/index.htm

  电子邮箱：

  heqiang@mail.neu.edu.cn'
