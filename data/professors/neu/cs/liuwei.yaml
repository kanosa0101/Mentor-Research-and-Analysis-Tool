title: 教授
bio_raw: '刘威，东北大学控制理论与控制工程博士毕业，现任东软睿驰汽车技术（沈阳）有限公司自动驾驶业务线副总经理，东北大学教授、博士生导师。带领团队重点研究辅助驾驶和自动驾驶环境感知、传感器融合、决策控制、高性能计算等关键技术，研发出辅助驾驶产品成功在美国、日本及国内市场销售。兼任中国人工智能学会智能驾驶专业委员会委员、中国汽车工程学会智能交通分会理事、汽车电子产业联盟专家委员会、辽宁省人工智能学会理事会理事。作为负责人，承担国家重点研发计划、自然科学基金、电子基金、

  863

  计划等项目

  8

  项。作为第一发明人获得授权发明专利

  24

  项，其中，国际专利

  5

  项，在

  IEEE Transaction on ITS

  、

  IEEE Transactions on Cybernetics

  等国内外期刊发表论文

  30

  余篇。荣获国家科技进步二等奖

  1

  项、教育部科技进步一等奖

  1

  项、辽宁省科技进步一等奖

  1

  项，中国汽车工业技术发明二等奖

  1

  项、辽宁省科技进步二等奖

  1

  项。先后被评为沈阳市拔尖人才、辽宁省兴辽人才创新领军人才，沈阳市优秀科技工作者。

