bio_raw: '金曦，教授、博士生导师，主要从事物联网、物理信息系统、工业网络、实时调度、星闪网络和

  5G

  的相关研究；作为项目负责人主持国家自然科学基金重点项目、面上项目、青年基金等；获得中科院杰出科技成就奖、辽宁省科技进步一等奖、辽宁省自然科学学术成果二等奖；获辽宁省优青、中国科学院青年创新促进会优秀会员和会员等人才项目资助；发表论文

  50+

  篇、著作

  2

  本、发明专利

  30+

  项、软件著作权

  2

  项；目前是中国计算机学会杰出会员、中国计算机学会嵌入式系统专委会委员、中国计算机学会物联网专委会委员、中国自动化学会会员、

  中国人工智能学会会员、

  20+

  期刊和会议的审稿人。

  邮箱：

  jinxi@cse.neu.edu.cn

  个人主页：

  http://faculty.neu.edu.cn/jinxi'
