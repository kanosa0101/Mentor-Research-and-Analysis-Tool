bio_raw: '李海燕，女，博士，副教授，硕士生导师，国家自然科学基金项目同行评议专家，中国计算机学会会员，主要研究方向为智能优化算法和多目标优化算法，主要是面向物流运输和自动导引车中的车辆路径问题以及工业生产问题。所指导的硕士生所撰写的外文期刊论文(A
  Novel Tabu Search Algorithm for Multi‐AGV  Routing Problem)于2020年已被SCI检索，硕士生所撰写的外文期刊论文A
  Hybrid Discrete Differential Evolution Algorithm to Solve the Split Delivery Vehicle
  Routing Problem已录用。

  以第一作者在国际SCI检索源期刊、国际会议以及国内重要刊物发表相关论文10余篇，其中第一作者SCI检索国外期刊文章3篇， EI检索12篇，撰写专著1部。作为项目负责人成功申请项目3项，其中，作为项目负责人完成国家自然科学基金1项，作为项目负责人完成辽宁省课题1项，作为项目负责人完成沈阳市课题1项；另外，作为主要研究人员参与了多项国家自然科学基金项目、国家863计划课题等项目的研究工作。

  联系方式：Email:  lihaiyan@mail.neu.edu.cn   微信：13897920283'
