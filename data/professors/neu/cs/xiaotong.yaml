title: 教授
bio_raw: '肖桐，博士，教授，博士生导师，东北大学计算机学院人工智能系主任，东北大学自然语言处理实验室主任。

  2012

  年博士毕业于东北大学，中国中文信息学会首届优秀博士论文提名奖获得者，曾先后在东京富士通研究中心、微软亚洲研究院访问学习。

  2013-2014

  赴英国剑桥大学开展博士后研究。

  NiuTrans

  开源项目技术负责人（

  https://github.com/NiuTrans

  ），并主持多套机器翻译评测（比赛）系统的研发，在

  WMT

  、

  CCMT/CWMT

  、

  NTCIR PatentMT

  等评测中取得多项任务的第一。至今，

  NiuTrans

  系统已经被来自全世界的两千多个机构下载注册使用，该系统也于

  2016

  年获得国内自然语言处理领域最高奖

  –

  钱伟长中文信息处理科学技术奖（一等奖）。

  主要从事自然语言处理领域的研究，包括：机器翻译、语言建模等。在人工智能及自然处理语言领域重要期刊

  AI

  、

  JAIR

  及顶级会议

  ACL

  、

  EMNLP

  、

  AAAI

  、

  IJCAI

  发表论文

  60

  余篇。在

  ACL

  、

  TACL

  等国际著名会议及期刊上担任领域主席和常驻审稿人。社会学术兼职包括：中国中文信息学会青年工作委员会委员、中国中文信息学会信息检索与内容安全专业委员会委员

  等、中国计算机学会中文信息技术专委会。'
