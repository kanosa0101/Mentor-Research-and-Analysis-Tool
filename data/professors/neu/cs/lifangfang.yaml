title: 副教授
bio_raw: '李芳芳，女，东北大学计算机科学与工程学院副教授、硕士生导师，中国计算机学会会员。本硕博均毕业于东北大学计算机专业，控制科学与工程博士后，美国犹他大学访问学者。主要研究方向包括交互式数据探索、人工赋能数据库技术。主持国家自然科学青年项目

  1

  项及多项中央高校基本科研业务费项目以及多项企业联合项目。近年来，在

  ACL

  、

  CIKM

  、

  ITBD

  、

  FCS

  、

  DASFAA

  、《计算机学报》、《软件学报》等国内外顶级期刊与会议上发表数十篇高水平论文。曾获辽宁省研究生教学成果奖二等奖、主讲课程“离散数学”“数据库原理”“算法设计与分析”均为辽宁省一流本科课程，指导学生在

  ACM-ICPC

  、

  CCF

  创新设计大赛等赛事中屡获佳绩，是“辽宁省优秀研究生导师团队”骨干成员。'
