bio_raw: '吴菁晶：博士，副教授。毕业于东北大学通信与信息系统专业。主要研究方向为通信网，网络生存性和可靠性等。现已在IET、PHOTONIC、OFT等SCI收录的国际期刊和国际会议上发表学术论文。作为项目负责人主持过国家自然科学基金、辽宁省博士启动基金、中央高校基本科研业务费等国家级和部级项目。

  【工作邮箱】wujingjing@cse.neu.edu.cn'
