bio_raw: '鲍喜荣，男，博士，讲师，硕士研究生导师。主要研究方向为基于

  AI驱动的复杂工业场景信号实时处理及故障诊断系统、基于大型语言模型推理的节能处理器加速机制研究、多模态临床与影像信息融合的 AI 模型在肿瘤疗效预测方法研究。承担过国家“863”计划项目子课题、辽宁省重点研发计划课题、省博士启动基金等多项国家及省部级科研项目。以产学研结合为导向，推动20余项企业联合研发项目，涉及领域包括高端智能仪器、AI驱动的工业实时信号处理及故障诊断、智能医疗设备、边缘计算与物联网大数据系统等，获沈阳市科技奖励。在国内外期刊发表SCI、EI检索论文20余篇论文，主编教材1部、副主编教材2部，并获得4项国家发明专利。指导学生获国家级科技竞赛奖项一二等奖10余次。

  Email:

  baoxirong@mail.neu.edu.cn'
