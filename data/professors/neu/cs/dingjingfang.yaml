bio_raw: '丁菁芳

  ，女，

  1994

  年出生，工学博士，

  讲师

  。本科毕业于东北大学，

  硕士

  毕业于

  国防科技大学，博士毕业于中国科学院沈阳自动化研究所。主要从事无线智能网络、工业物联网等相关领域的研究工作。目前，在

  IEEE/CAA JAS

  、

  IEEE TVT

  等国际期刊和会议上发表论文

  15

  篇，其中第一作者

  9

  篇，参与申请专利

  7

  项，参与多个国家自然科学基金项目和国家科技部重点研发项目。

  电子邮箱：

  dingjingfang@cse.neu.edu.cn'
