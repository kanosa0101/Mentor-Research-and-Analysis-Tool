bio_raw: '张岩峰，东北大学教授、博士生导师，东北大学与美国麻省州立大学联合培养博士，入选国家级高层次青年人才、辽宁省杰青、沈阳市高精尖科技优才领军人才、沈阳市中青年科技创新人才，担任CCF数据库专委会、分布式计算与系统专委会、信息系统专委会的执行委员。研究方向为数据库系统、机器学习系统。承担国家重点研发计划课题、国家自然科学基金重点项目课题等多项国家和省部级科研项目，承担华为2012实验室、阿里巴巴达摩院、蚂蚁研究院等校企合作项目。在SIGMOD、VLDB、ICDE、PPoPP、SOCC等国际顶级会议期刊上发表论文50余篇。曾获中国计算机学会自然科学二等奖、云计算国际会议ACM
  SOCC杰出论文奖、华为年度优秀项目奖等奖励。

  电子邮箱：zhangyf@mail.neu.edu.cn

