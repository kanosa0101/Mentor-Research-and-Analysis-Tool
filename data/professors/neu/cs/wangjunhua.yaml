bio_raw: '王俊华，东北大学计算机科学与工程学院副教授，博士生导师。

  主要研究方向为边缘智能与端云协同计算，重点包括：大模型端侧推理与训练优化、多模态感知与融合技术、智能车联网系统等。

  2014

  年与

  2019

  年分别于重庆大学获得学士与博士学位，期间曾公派赴美国休斯敦大学访问交流。

  迄今已在国际主流期刊和会议上发表论文

  30

  余篇，其中包括

  CCF-A

  类及

  IEEE Trans.

  系列期刊论文

  10

  余篇（平均影响因子达

  8.0

  ），以及多篇

  CCF

  推荐会议论文；申请

  /

  授权发明专利

  4

  项。曾获

  2020

  年

  ACM

  重庆分会

  最佳博士论文奖

  、

  2024

  年

  KSEM

  （

  CCF-C

  类会议）

  最佳论文奖

  。

  作为项目负责人主持国家自然科学基金青年项目、江苏省自然科学基金青年项目、中国博士后科学基金第

  67

  批面上项目、南京市留学人才择优资助项目、中央高校基本科研业务费项目，以及多项国家

  /

  教育部重点实验室开放课题和横向课题。作为技术骨干参与多项国家自然科学基金面上项目、国际合作项目和国防联合技术攻关项目。长期担任

  IEEE TMC

  、

  IEEE IoT Journal

  、

  IEEE T-TIS

  、

  IEEE TVT

  等多个

  SCI

  期刊的审稿人。

  【研究生与本科生招生】

  欢迎对端边云协同智能、多模态感知、车联网、边缘计算等相关领域有浓厚兴趣，有志于从事学术研究与技术创新的同学加入本课题组。课题组积极支持学生成长与发展，可推荐优秀学生至

  哈尔滨工业大学、华中科技大学、

  武汉大学、

  中南大学、香港城市大学

  、美国休斯敦大学

  等海内外知名高校继续深造，或赴

  华为、阿里、腾讯、字节、英特尔

  等知名企业实习。同时鼓励并资助学生参加国内外高水平学术会议。

  课题组注重营造和谐、尊重、开放的科研氛围，倡导师生平等沟通与合作。在完成基本科研训练和项目任务的前提下，支持学生优先进入企业实习积累实践经验。导师亦乐于结合自身阅历，为学生在学术规划、职业发展和人生选择等方面提供积极建议和个性化指导，助力每一位成员成长。

  邮箱：

  wangjunhua@cse.neu.edu.cn'
