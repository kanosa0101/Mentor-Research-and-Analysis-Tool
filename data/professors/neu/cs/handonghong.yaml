bio_raw: '韩东红，女，东北大学计算机科学与工程学院教授，博士生导师，

  中国计算机学会（

  CCF

  ）会员、中国中文信息学会（

  CIPS

  ）会员、

  CIPS

  社会媒体处理专委会委员

  ，

  辽宁省普通高等学校本科教学名师。

  2

  007

  年获东北大学工学博士学位，并于

  2

  013

  年

  8

  月

  -2015

  年

  3

  月期间在

  美国

  Brigham Young University

  （

  BYU

  ）

  作

  公派访问学者。

  近年来，

  作为项目负责人主持

  （

  完成

  ）

  国家自然科学基金面上项目

  2

  项

  、

  省部级横向项目

  2

  项

  ，作为技术骨干参与

  国家重点研发计划课题、国家

  自然科学基金重点项目课题

  等多项

  。在

  DASFAA

  、

  ECML

  -

  PKDD

  、

  APWEB

  等高水平国际会议，以及

  Information

  Science

  、

  WWWJ

  、

  Neurocomputing

  、

  JCST

  、

  FCS

  等高水平国际

  期刊发表论文

  40

  余

  篇

  ，授权国家发明专利

  1

  0

  余项

  。担任

  Applied Intelligence

  、

  IEEE Transaction on Cybernetics

  、

  WWWJ

  等国际学术

  期刊审稿人。

  曾获辽宁省自然科学学术成果奖（三等奖）、沈阳市自然科学学术成果奖（二等奖），以及

  “东北大学我最喜爱的老师（专业课系列）”、东北大学本科生毕业设计“优秀指导教师”等称号。

  主要

  研究兴趣

  包括

  ：面向社会媒体的情感分析与计算、智能对话生成

  等。

  电子邮箱

  ：

  handonghong@cse.neu.edu.cn'
