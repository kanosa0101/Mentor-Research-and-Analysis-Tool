title: 讲师
bio_raw: '叶宁，女，博士，讲师，主持参加多项国家级、省部级科研项目。目前重点专注于无线移动自组织网络的研究，涉及移动自组网（

  ad hoc网络）、空间网络、天空地一体化网络、航空自组网、车载自组网、传感器网络等，研究方向广泛应用在应急救援、智能交通等领域，在该领域作为项目执行负责人完成三项国家高技术研究发展计划863课题，作为负责人主持1项国家自然科学基金课题，2项中央高校基础科研项目。

  电子邮件：

  yening1@ise.neu.edu.cn。

  通信地址：辽宁省沈阳市和平区文化路

  3号巷11号东北大学134信箱

  。'
