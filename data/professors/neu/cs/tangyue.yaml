title: 副教授
bio_raw: '唐月，副教授，2020年博士毕业于香港理工大学，导师为关楠教授。CCF嵌入式专委会、系统软件专委会执行委员。研究方向包括实时嵌入式操作系统、机器人及自动驾驶系统。近年来在RTSS、DAC、TC等高水平国际会议和期刊发表论文二十余篇。多次担任RTSS、RTAS等国际高水平会议程序委员，以及TC、TCAD等CCF-A类期刊审稿人。主持国家自然科学基金青年项目（青c），参与国家重点研发计划等。与国内外多所高校（宾夕法尼亚大学
  、香港城市大学、挪威科技大学、电子科技大学等）保持密切学术交流。

  联系方式：tangyue@cse.neu.edu.cn

  个人主页：http://faculty.neu.edu.cn/tangyue/zh_CN/index.htm'
