bio_raw: '宋晓诗，男，

  1983

  年出生，

  2008

  年本科毕业于大连理工大学电子信息工程（英语强化）专业，

  2014

  年博士毕业于北京邮电大学通信与信息系统专业。 近年来一直从事

  5G

  及

  B5G

  无线通信网络、无线数据缓存网络、

  D2D

  无线通信网络、认知无线网络、无线蜂窝网络等相关领域的理论研究工作，具有一定的理论基础与工作积累。其中，于

  2011

  年至

  2013

  年在美国加州大学欧文分校（

  University of California, Irvine

  ）进行公派访问，师从干扰对齐（

  Interference Alignment

  ）创始人

  Syed Ali Jafar

  教授，学习网络信息论及干扰对齐理论等方面的知识。

  2014

  年

  7

  月至

  2014

  年

  10

  月，受邀到香港大学进行访问，进行

  5G

  移动通信系统关键技术研究。目前，已在相关领域发表

  1

  部专著、

  15

  篇

  SCI

  论文和

  12

  篇

  EI

  会议论文。其中，以第一作者或通讯作者身份发表

  SCI

  论文

  9

  篇，单篇最高影响因子

  11.42(

  发表于无线通信领域的国际顶级期刊

  IEEE Journal on Selected Areas in Communications)

  。合著

  SCI

  论文

  6

  篇，单篇最高影响因子

  11.391(

  发表于无线通信领域的国际顶级期刊

  IEEE Wireless Communications)

  。同时，担任多个国际顶级期刊的审稿人，如

  IEEE Journal on Selected Areas in Communications

  ，

  IEEE Transactions on Wireless Communications

  ，

  IEEE Transactions on Communications

  ，

  IEEE Wireless Communications Letters

  ，以及

  ICC

  ，

  GLOBECOM

  ，

  WCNC

  ，

  VTC

  等国际旗舰会议的技术委员会委员，并受邀担任

  1st Workshop on Fog Computing-Based Radio Access Networks for 5G

  会议的联合主席。近五年来，以项目负责人身份，承担多项国家级、省部级、以及企业横向项目。个人邮箱：

  songxiaoshi@cse.neu.edu.cn

  。个人主页

  :http://faculty.neu.edu.cn/songxiaoshi

  。'
