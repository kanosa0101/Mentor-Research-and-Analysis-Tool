bio_raw: '栗伟，博士，东北大学计算机学院教授，博士生导师。2003年毕业于吉林大学获取学士学位，2014年获得东北大学博士学位。研究方向是人工智能/机器学习，重点研究医学影像处理与分析、生物标志物发现、单细胞组学分析、健康监测机器人。主持国家重点研发计划、国家自然科学基金、省市科技创新计划等多项科研项目，发表SCI论文50余篇，申请/授权专利20余项，荣获“辽宁省科技进步一等奖”、“教育部科技进步二等奖”等奖励。

  邮箱：liwei@cse.neu.edu.cn

  个人主页：http://faculty.neu.edu.cn/liwei1/zh_CN/index.htm'
