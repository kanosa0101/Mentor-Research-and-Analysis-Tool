bio_raw: '冯朝路，男，东北大学人工智能系，副教授，博士研究生导师，沈阳市领军人才，中国人工智能协会智慧医疗专业委员会委员、中国图象图形学学会生物医学图像专委会委员、辽宁省细胞生物学学会智能影像与细胞学研究专业委员会、女性盆底疾病与生殖整复及数字化技术专业委员会副主任委员，国际会议

  ICBEB

  组委会委员，

  Biomedical Engineering Online

  副主编，国际会议

  ISICDM 2020 Web Chair

  、挑战赛组织者；研究方向包括计算机视觉与人工智能，目前重点围绕人工智能方法及其在心脑血管疾病诊断中的应用开展研究工作。首发多个领域内数据集，填补研究空白。在

  TMI

  、

  MIA

  、

  MICCAI

  等顶级期刊上发表

  SCI

  论文

  30

  余篇、

  ESI

  高被引论文

  1

  篇，

  Google

  引用

  1500

  余次，申请专利

  20

  余项，获授权

  6

  项；获

  MICCAI SATA

  心室分割比赛第

  1

  名、

  MICCAI ISLES

  分割比赛第

  2

  名，以第

  1

  著作人编写《人工智能的数学基础》新工科专业建设教材

  1

  部（印

  1.3

  万册）。主持国自然项目

  1

  项、重点研发计划课题及任务各

  1

  项、辽宁省科技重大专项课题

  1

  项、辽宁省自然基金

  1

  项；参与国家科技支撑计划项目

  2

  项、重点研发计划课题项目

  3

  项、国自然面上项目

  3

  项、国自然区域联合创新基金

  2

  项。获吴文俊人工智能科技进步一等奖

  1

  项、辽宁省科技进步一等奖

  2

  项、二等奖

  1

  项，沈阳市科技进步一等奖

  2

  项。担任包括《

  IEEE Journal of Biomedical and Health Informatics

  》、《

  Signal Processing

  》、《

  Computer Methods and Programs in Biomedicine

  》、《计算机学报》等在内的

  10

  余个

  SCI/

  中文

  CCF A

  类期刊论文审稿工作。

  邮箱：fengchaolu@cse.neu.edu.cn'
