title: 教授
bio_raw: '赵大哲，女, 教授，博士生导师，1996年毕业于德国柏林工业大学，获博士学位，现任国家医学影像计算教育部重点实验室主任，长期从事软件工程和医学影像计算的基础研究和应用开发工作，作为项目负责人和执行负责人承担了国家自然科学基金、“863计划”、科技支撑计划、电子信息产业发展基金、国家高技术产业化示范工程项目、国家技术创新计划项目、国家工程中心创新能力建设项目等40余项；在国内期刊和国内外会议上发表论文130余篇，主持参与出版学术专著2部；申请发明专利15项，取得授权5项；先后获得过教育部科技进步一、二等奖，教育部项目成果奖，辽宁省科技进步一、二等奖，沈阳市科技进步一等奖等科技奖励10余项

  。'
