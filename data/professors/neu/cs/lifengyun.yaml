bio_raw: '李凤云，女，博士，副教授，硕士生导师，沈阳市高层次人才（

  C类领军人才）

  。科研方面，主要研究方向包括联邦机器学习、目标检测、数据隐私保护、车联网、自动驾驶、人工智能等。作为项目负责人主持国家重点研发计划项目子课题

  1项、国家自然科学基金青年基金项目

  1项、教育部基本科研业务费国家项目培育基金和科研启动项目各1项。作为主要参加者，参加国家自然科学基金面上项目

  等纵向课题

  4项

  。

  主持横向课题

  7项，

  申请发明专利

  3项，已授权2项

  。近年来，在国内

  外学术期刊及国际会议上发表并被

  SCI/EI检索的学术论文近30篇。

  教学方面，

  获得辽宁省教学成果一等奖

  1项、东北大学教学成果一等奖1项，以及其它多项教学奖励。

  主持和

  参加省

  级、校级等各级教

  改项目

  5余

  项，参编教材

  3部

  ，指导学生竞赛获得国家级奖项

  2项

  。曾获得东北大学三育人先进个人、东北大学计算机科学与工程学院优秀共产党员、优秀党务工作者等荣誉称号。

  电子邮箱：

  lifengyun@mail.neu.edu.cn'
