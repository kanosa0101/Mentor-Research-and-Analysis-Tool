title: 教授
bio_raw: '王兴伟，男，博士，教授，博士生导师。国家杰出青年科学基金获得者，国务院政府特殊津贴获得者，教育部新世纪优秀人才，辽宁杰出科技工作者，兴辽计划特聘教授，辽宁省优秀教师，沈阳五一劳动奖章获得者；全国工程专业学位研究生教育指导委员会委员；中国计算机学会网络与数据通信专委会副主任委员，中国计算机学会互联网专委会副主任委员；中国通信学会理事，会士，会士遴选委员会委员；中国教育和科研计算机网

  CERNET

  专家委员会委员；辽宁省互联网协会副理事长；《计算机学报》编委，《软件学报》编委，《计算机研究与发展》编委。爱思唯尔中国高被引学者。辽宁省智能互联网理论与应用重点实验室主任，辽宁省创新团队负责人。主要研究方向为互联网、云计算和网络空间安全等。获国家科技进步二等奖

  2

  项、教育部科技进步一等奖

  2

  项、中国通信学会科学技术一等奖

  1

  项、教育部技术发明二等奖

  1

  项、辽宁省技术发明二等奖

  1

  项、湖南省自然科学二等奖

  1

  项；在

  IEEE Trans

  等著名学术期刊和

  IEEE ICDCS

  等著名学术会议上发表论文

  100

  余篇，

  SCI

  收录

  100

  余篇；出版学术著作

  9

  部；取得国家发明专利授权

  27

  项；国家级和省部级人才培养奖励

  20

  项。

  现任东北大学副校长。曾任东北大学研究生院常务副院长，东北大学学术委员会秘书长，东北大学国家示范性软件学院院长，东北大学发展规划与学科建设处处长、

  985

  工程办公室主任、

  211

  工程办公室主任、高等教育研究所所长，东北大学计算中心主任、网络中心主任等。'
