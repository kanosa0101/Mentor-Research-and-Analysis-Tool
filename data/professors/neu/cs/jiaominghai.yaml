bio_raw: '个人网页链接：http://faculty.neu.edu.cn/cc/mhjiao/index.html

  简介：

  中国计算机学会CCF会员。主持或参加国家自然科学基金、教育部基础科研费重大科技创新项目、教育部留学回国人员启动基金、国家中小企业创新基金等共7项，主持企事业单位委托的横向课题10余项，与中国石油化工股份有限公司、国家电网科技公司有良好的科研合作关系。已发表SCI、EI、ISTP检索的学术论文50余篇。主要研究方向包括：不确定大数据识别、分布大数据机器学习、人脑学习、图像深度学习、大数据管理与决策等。联系方式：mjiao@mail.neu.edu.cn.
  微信（电话）联系方式：15566104459'
