bio_raw: '东北大学计算机科学与工程学院教授、博导，计算机软件与理论专业博士。曾于2010至2011年在新加坡国立大学进行访问学者研究，近年来一直从事大数据管理与分析、感知数据管理、不确定数据管理、计算机辅助诊断和医学信息学等领域的研究工作，先后在《IEEE TKDE》、《Scientific Reports》、《DKE》、《Neurocomputing》、《Physica Medica》、《Multidimensional Systems and Signal Processing》、《WWWJ》、《FCS》、《Memetic Computing》、《BMC Cancer》、 《Computer Methods and Programs in Biomedicine》、 《IEEE Access》、《Journal of X-Ray Science and Technology》、《计算机学报》和《计算机研究与发展》，以及EDBT、CIKM、DASFAA、WISE和WAIM等国内外的重要期刊和会议发表论文70余篇。作为负责人承担了国家自然科学基金面上项目、国家863计划子课题、国家自然科学基金青年项目、基本科研业务费探索导向重点项目和基本科研业务费国家项目种子基金等多项国家和省部级项目；作为核心成员参与了国家自然科学基金联合基金项目、国家自然科学基金面上项目、基本科研业务费创新群体培育项目和基本科研业务费重大科技创新项目等国家和省部级项目。其中，依托863计划子课题开展大数据管理与分析相关技术的研究成果获得了2016年度教育部科技进步一等奖（排序第2）。作为第一或主要参与人获得授权发明专利8项、软件著作权2项，参编教材1部，指导本科生参加国际大学生数学建模竞赛和全国大学生数学建模竞赛，获得了国际二等奖7项；东北大学2018年度创新创业教育教学名师，获得东北大学教学成果二等奖2次、东北大学学生创新创业活动“优秀指导教师”2次。邮箱：xinjunchang@mail.neu.edu.cn；主页：

  http://faculty.neu.edu.cn/xinjunchang/'
