bio_raw: '刘辉林，男，教授、博导，计算机应用技术专业博士

  研究方向：新型数据库技术、云计算、大数据、计算机视觉、物联网等；

  中国计算机学会高级会员、人工智能学会会员、IEEE会员。先后在《IEEE Access》、《Neural Computing and Applications》、《Mathematical
  Problems in Engineering》、《Computer Journal》、CIKM等国内外会议或杂志发表相关论文50余篇。作为负责人或主要参与人员，完成包括国家发展和改革委员会、国家“八六三、国家自然科学基金面上项目、国家自然科学基金重点项目、省、市及企业课题30余项，获得省、部级二等奖各一项、省、自然科学基金三等奖各一项。出版《接口技术》、《微型计算机实用大全》等教材和其他著作各一部。指导数学模型美赛、国赛及全国大学生程序设计比赛多次，分别获得一等奖多次，被评为创新创业学院优秀指导教师一次，目前在读研究生、博士生共计20人，被评为院级优秀研究生指导教师一次。同时担任DKE、IEEE
  ACCESS、计算机学报、软件学报等十几家杂志的审稿人，教育部学位中心博士、硕士论文评审专家、国家科技部、辽宁、吉林、河北、沈阳、本溪、营口等省市项目评审专家。

  部分优秀毕业生去向：IBM中国、国家电网、各大银行、华为、中兴、联通、移动、百度、阿里巴巴、高校、政府等

  电子邮箱：liuhuilin@mail.neu.edu.cn

  个人主页：http://faculty.neu.edu.cn/liuhuilin/'
