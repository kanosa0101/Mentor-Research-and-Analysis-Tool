bio_raw: '东北大学优秀博士学位论文获得者。作为项目负责人承担国家自然科学基金、教育部博士点基金、中国博士后科学基金、教育部基本科研业务费等国家及省部级课题等

  10

  项。作为主要成员参与国家自然科学基金面上项目、国家

  863

  计划项目、国家

  973

  计划子课题、省部级科技项目等

  10

  余项。在国内外知名期刊和会议上发表学术论文

  90

  余篇，

  50

  余篇被

  SCI(E)

  、

  EI

  收录。担任多个国际期刊审稿专家。申请发明专利

  6

  项，出版学术专著

  1

  部。多次获得辽宁省和沈阳市的

  “

  自然科学学术成果

  ”

  奖。现为美国

  ACM

  、

  IEEE

  会员和中国计算机学会会员，

  CCF

  中国计算机学会软件工程专委会委员。

  主要研究方向包括但不限于：数据挖掘、智能软件优化、机器学习和推荐系统等。电子邮箱：

  yinying@mail.neu.edu.cn'
