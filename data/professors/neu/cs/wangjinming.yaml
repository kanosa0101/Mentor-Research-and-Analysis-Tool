title: 副教授
bio_raw: '王金明，博士，副教授，博士生导师。2019年、2021年和2026年分别获哈尔滨工业大学通信工程专业学士、信息与通信工程专业硕士和博士学位。主要从事无线通信与智能网络优化相关研究，研究方向涵盖低轨卫星互联网、智能反射面与反向散射通信、可移动天线、车联网通信、物理层安全及人工智能等，重点聚焦复杂无线通信环境下的智能传输、资源优化与安全通信理论及关键技术。

  近年来，围绕智能反射面辅助反向散射通信、智慧物联网通信、低轨卫星通信及可移动天线等方向开展研究，在IEEE Communications Surveys & Tutorials、IEEE
  Transactions on Wireless Communications、IEEE Transactions on Vehicular Technology等国际期刊发表学术论文15篇。长期担任IEEE
  Transactions on Wireless Communications、IEEE Communications Surveys & Tutorials、IEEE
  Transactions on Mobile Computing、IEEE Transactions on Green Communications and Networking、IEEE
  Transactions on Vehicular Technology、IEEE China Communications等国际期刊审稿人。主持及参与国家自然科学基金等多项科研项目，相关研究成果已获授权中国发明专利，并形成多项专利申请。

  博士期间获国家留学基金委资助赴新加坡国立大学开展联合培养研究，主要从事可移动天线与低轨卫星互联网相关研究。目前主要面向下一代无线通信技术、空天地一体化网络与低空通信网络，开展新型无线传输理论、智能通信技术及其应用研究。'
