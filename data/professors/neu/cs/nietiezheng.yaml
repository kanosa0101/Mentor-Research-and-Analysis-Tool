bio_raw: '聂铁铮，男，1980年生，博士，东北大学副教授。2002年毕业于东北大学获得学士学位，2005年获得东北大学计算机软件与理论专业工学硕士学位，
  2009年获得东北大学计算机软件与理论专业工学博士学位。2013年至2014年在美国宾夕法尼亚州立大学（PSU）做访问学者。目前主要研究方向为数据库、分布式数据管理、数据集成与数据分析、异构体系结构数据处理等。作为项目负责人承担国家自然科学基金青年项目和面上项目各1项，参与多项国家重点研发计划课题、国家863课题、国家973课题、国家自然科学基金、教育部基本科研业务费项目及多项企业合作科研项目的研制与开发工作。目前在研课题研究方向主要包括：1）国家自然科学基金面向项目 “大数据环境中面向实体的精准集成关键技术研究”，2）国家重点研发课题“异构体系结构的分布式数据存储与管理”。先后在国内外学术期刊和学术会议上发表数十篇学术论文，多篇被SCI、EI、ISTP收录，申请并获得国家发明专利6项。

  主讲课程:

  数据库原理（本科）

  数据库系统实现技术（本科）

  并行程序设计（研究生）

  研究方向：数据库、数据集成与分析、大数据处理

  联系方式：

  EMAIL： nietiezheng@mail.neu.edu.cn'
