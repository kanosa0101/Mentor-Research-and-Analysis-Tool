title: 副教授
bio_raw: '乔百友，博士，副教授, 中国计算机学会会员。

  主要研究方向：云计算、大数据管理及分析，深度学习、虚拟化技术、空间数据管理技术、P2P数据管理等。

  在国内外重要学术杂志和期刊发表学术论文30余篇（包括软件学报、计算机研究与发展、清华大学学报、武汉大学学报、东北大学学报、东南大学学报、

  NEUROCOMPUTING

  ，PAKDD、WISE、WAIM、Informationg Science等），参与编写专著1部。获教育部自然科学奖二等奖1项。先后作为课题负责人和主要参加完成了国家863计划项目、973项目、国家自然科学基金项目及辽宁省基金项目等十余项。承担国家重点研发计划项目（海洋大数据分析预报技术）国家自然科学基金（P2P数据管理技术）、国家海洋局公益项目（海洋环境信息云计算项目）和开放实验室项目（海洋大数据管理项目）。

  主讲的课程：计算机体系结构（本科生必修课），高性能计算机体系结构（研究生必修课）。

  电子邮箱：

  qiaobaiyou@mail.neu.edu.cn。'
