title: 副教授
bio_raw: '季策，女，1969年6月生，东北大学通信与电子工程系，副教授。1991 年毕业于大连理工大学应用电子专业，获工学学士学位；1997 年毕业于东北大学工业自动化专业，获工学硕士学位；2005
  年毕业于东北大学控制理论与控制工程专业，获工学博士学位；同年进入东北大学计算机科学与技术博士后流动站作博士后工作，并于2008年6月出站。

  近年来，在“Lecture Notes in Computer Science”、“Neurocomputing”、“Journal of Systems Engineering
  and Electronics”、“通信学报”、“电子学报”等国内外权威杂志和重要会议上发表学术论文四十余篇，其中多篇论文获“辽宁省自然科学学术成果奖”。 2016年12月，参加了香港理工大学的“现代教育法”培训。

  作为课题负责人，主持了多项辽宁省自然科学基金、教育部“产学合作、协同育人”项目及沈阳市科技计划项目的研究工作；作为子课题负责人，参加了三项国家自然科学基金项目。作为主编，完成了《信号与线性系统》教材的编写工作（科学出版社，2018年11月）；作为副主编，完成了译著《人工递归神经网络的定性分析与综合》（科学出版社，2004年5月）。'
