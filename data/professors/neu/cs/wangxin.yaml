bio_raw: '王欣，硕士研究生导师，中国计算机学会生物信息学专委会通讯委员，

  CCF

  会员。

  2023

  年博士毕业于哈尔滨工业大学计算机科学与技术学院。近年来以第一作者在

  Briefings in Bioinformatics

  、

  IEEE/ACM Transactions on Computational Biology and Bioinformatics

  等国内外期刊发表学术论文多篇。目前主要从事人工智能、深度学习、生物信息学等领域研究。曾获哈尔滨工业大学优秀博士学位论文提名奖。作为负责人主持国家自然科学基金青年科学基金项目，中国博士后科学基金面上项目。

