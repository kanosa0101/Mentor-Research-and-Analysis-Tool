bio_raw: '李宇溪，女，

  1990

  年

  3

  月生，博士，东北大学计算机科学与工程学院讲师，硕士研究生导师，

  IEEE/CCF

  会员，美国佐治亚理工学院访问学者。长期从事数据安全、隐私计算、工业互联网智能安全与计算机视觉相关研究，重点围绕工业互联网云边协同场景下的私有检索、安全推理、访问模式保护与高敏数据隐私保护等关键问题开展工作。

  在复杂设备故障诊断、根因分析等应用方向形成了较系统的研究积累与技术基础，相关研究涵盖云边端协同部署、受限链路条件下的安全推理与端到端评测等内容。作为子课题负责人参与国家重点研发计划项目

  1

  项，主持辽宁省博士科研启动基金项目

  1

  项、中央高校基本科研业务费专项项目

  3

  项；以第一作者发表

  /

  形成相关代表性成果

  23

  篇，其中

  CCF-A/JCR

  一区论文

  6

  篇。

  研究方向：

  （

  1

  ）

  隐私计算与安全推理

  ：安全多方计算、可搜索加密、同态加密、低交互安全推理；

  （

  2

  ）

  工业互联网智能安全

  ：云边协同检索增强推理、私有检索、访问模式保护、故障诊断与根因分析；

  （

  3

  ）

  图像

  /

  视频理解

  ：图像去噪、目标识别、域自适应

  。

  通讯

  /

  办公地址：东北大学浑南校区信息学馆

  B333B。

  电子邮箱：

  liyuxi@mail.neu.edu.cn'
