bio_raw: '高韵淇，东北大学副教授、博士生导师，浙江大学与英国萨里大学联合培养博士（国家留学基金委资助），

  CCF

  分布式计算与系统专委会执行委员，

  CCF

  会员。

  2026

  年获浙江大学工学博士学位。

  2024

  年

  11

  月至

  2025

  年

  11

  月公派赴英国萨里大学计算机科学与电子工程学院

  5G/6G

  创新中心担任访问学者，师从英国皇家工程院院士、

  IEEE Fellow Rahim Tafazolli

  教授。主要研究方向为机器学习系统、高性能计算，围绕大模型训练与推理加速、分布式机器学习系统设计与优化、深度学习框架优化等领域开展研究。在

  NeurIPS

  、

  ICML

  、

  IEEE TPDS

  、

  TMC

  等顶会或顶刊论文上共发表文章

  16

  篇。长期担任

  IEEE JSAC

  、

  TMC

  、

  TON

  、

  TPDS

  、

  TC

  、

  NeurIPS

  等顶刊顶会审稿人。作为主要参加人参与国家重点研发计划、华为

  2012

  实验室合作项目等。被推荐中国通信学会优秀博士学位论文、浙江大学优秀博士学位论文。

  电子邮箱：

  gaoyq@mail.neu.edu.cn

  个人主页：

  http://faculty.neu.edu.cn/gaoyq/

  https://yunqigao-neu.github.io/

  iDC

  实验室主页：

  https://idc-neu.github.io/

  常年招收保送或报考的硕士、博士研究生，欢迎执行力强且有志于从事科学研究的同学与我联系。'
