bio_raw: '杨晓翠，东北大学讲师，硕士生导师。博士毕业于东北大学计算机科学与工程学院，于

  2021-2023

  年赴新加坡科技与设计大学进行

  CSC

  博士联培学习。目前，担任中文信息学会情感计算大会

  (CCAC)

  、社交媒体处理大会（

  SMP

  ）专委会委员、

  CCF

  自然语言处理（

  NLPCC

  ）专委会委员。主要研究方向为多模态信息感知与理解、多模态情感计算、多模态大语言模型等，在

  CCF-A/B

  类会议及期刊上发表论文

  30

  余篇，谷歌学术引用

  1500

  余次。主持

  3

  项科研项目，参与多项国家自然科学基金项目。

  个人主页：

  https://yangxiaocui1215.github.io

  邮箱：

  yangxiaocui@cse.neu.edu.cn'
