title: 教授
bio_raw: '曹鹏，男，博士，加拿大阿尔伯塔大学联合培养博士，教授，博士生导师，人工智能系副主任。

  主要研究方向：

  可信性机器学习理论，多模态融合，脑科学。

  讲授课程：

  机器学习、医学影像智能计算。

  科研成果：

  以第一及通讯作者共发表论文

  100余篇，包括国际顶级会议

  (MICCAI,ACL,IJCAI,AAAI,ACM Multimedia,

  ECAI

  ,

  EMNLP

  ,WSDM,

  PAKDD

  ,DASFAA,

  BIBM等

  ),

  国际知名期刊

  (

  I

  EEE TMI

  ,IEEE TMM

  ,

  IEEE TAC

  ,

  IEEE TNNLS

  ,

  IEEE TCSVT

  ,

  Science Bulletin

  ,

  Neural Network,PR,MedIA，ACM TKDD,IEEE

  J-BHI

  等

  )。

  科研项目：

  围绕

  医学复杂数据智能分析关键技术，多模态数据融合分析，脑网络建模与分析理论

  ，

  主持多项自然基金等项目，包括自然科学基金

  3项，重点研发计划课题2项，辽宁省自然科学基金

  及

  重点专项

  3项，并参与申请多项国家重点研发项目，重点基金等项目。

  荣誉与奖项

  ：

  获辽宁省科技进步一等奖

  2

  项、二等奖

  1

  项，吴文俊人工智能科技进步一等奖

  1项，辽宁省自然成果二等奖2项，辽宁省科技成果转化二等奖1项，中国体视学学会科技进步二等奖，入选全球2%顶尖科学家榜单，东北大学 “我心目中的好导师” 称号，辽宁省优秀研究生导师团队成员，多次获得校优秀指导教师。

  毕业生去向：

  华为，阿里达摩院，京东，拼多多，百度，美团，字节，唯品会，人大（读博），香港科技大学（读博），南洋理工大学（读博），日本早稻田大学（读博）

  ,日本名古屋（读博)等。'
