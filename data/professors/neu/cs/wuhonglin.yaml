bio_raw: 吴宏林，男，汉族，1978年3月生，辽宁沈阳人，1997年8月参加工作，2001年6月加入中国共产党，东北大学信息科学与工程学院计算机软件与理论专业毕业，研究生学历，工学博士学位。现为东北大学信息科学与工程学院计算机软件研究所讲师。
