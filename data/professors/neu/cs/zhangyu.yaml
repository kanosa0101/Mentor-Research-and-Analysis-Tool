bio_raw: '张昱，博士，东北大学计算机科学与工程学院讲师，硕士生导师，沈阳市高层次人才计划C类人才，中国计算机学会会员。主讲《Python语言程序设计》、《数据科学与计算智能》等多门课程，是辽宁省本科一流课程《Python语言程序设计》课程负责人，国家级本科一流课程《计算机硬件技术基础》主讲教师。曾主持辽宁省教改项目1项，获辽宁省教学成果一等奖3项，参与编写多部规划教材，发表教改论文十余篇。科研方向为人工智能技术在教育领域的应用，主持国家自然科学基金子课题1项，横向项目多项，发表论文多篇。

  电子邮箱：zhangyu@mail.neu.edu.cn

  教师主页：http://faculty.neu.edu.cn/zhangyu/'
