title: 副教授
bio_raw: 李大宇，男，1981 年5 月生，博士，通信与电子工程系副教授。04年本科毕业于中国科学技术大学电子信息工程专业、10年博士毕业于中国科学院上海技术物理研究所。2017年获中国分析测试协会科学技术奖(CAIA奖)一等奖，2023年获全国大学生电子设计竞赛组委会颁发的竞赛三十周年突出贡献奖（个人）。多年从事仪器电子学及信号处理相关研究工作，开发了适用于现场实时检测需求的高性能小型生化质谱仪样机。主要研究方向为质谱、光电信号处理技术研究，及相关嵌入式系统和FPGA开发和应用。主持国家自然科学基金面上项目1项，主持其他科研项目10余项。从事学生创新创业工作十余年，注重科研与教学实践相结合，指导学生获各类科技竞赛国家级奖项二十余项。
