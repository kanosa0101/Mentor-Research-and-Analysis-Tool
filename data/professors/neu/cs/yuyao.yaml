bio_raw: '于尧，教授，博士生导师，沈阳市领军人才，

  IEEE

  Senior

  Member

  。现任

  东北大学计算机科学与工程学院通信与电子工程系主任，计算机科学与工程学院教学指导分委员会委员，

  曾任

  澳大利亚悉尼大学访问学者，香港理工大学博士后研究员。长期从事无线网络和移动通信网络、网络安全、网络态势感知、网络攻击与防御等方面的研究工作，作为项目负责人主持国家

  **

  安全专项、国家自然科学基金、教育部装备部联合预研青年人才项目等国家级和省部级科技项目

  20

  余项。以第一作者或通讯作者在

  IEEE Journal on Selected Areas in Communications

  、

  IEEE Trans. on Industrial Informatics

  、

  IEEE Trans. on Wireless Communications

  、

  IEEETrans. on Vehicular Technology

  、

  GLOBECOM

  等

  SCI

  收录的国际期刊和国际会议上发表学术论文

  50

  余篇。近年申请国家发明专利

  30

  余项（授权

  20

  余项）。曾获得中国产学研合作创新成果奖一等奖

  、

  沈阳市自然科学学术成果评价一等奖

  、

  CCF

  教育激励计划

  等科研奖项。在多个学术组织担任职务，如

  IEEE VTS Committee Member

  、科技部入库专家、

  辽宁省人工智能学会理事、

  CCF

  智能汽车分会执行委员等。已培养博士、硕士毕业生

  6

  0

  余人，博士后

  1

  人，所指导的学生多次获得

  省级、学会级、校级优秀博士

  和优秀硕士学位论文。主讲《信号与线性系统》、《电磁场与电磁波》等课程，荣获辽宁省高校教师教学创新大赛二等奖，并多次获得

  “

  最喜欢老师

  ”

  等教学荣誉。

  Email

  ：

  yuyao@mail.neu.edu.cn

  。'
