title: 副教授
bio_raw: '李婕，博士，东北大学计算机科学与工程学院副教授，博士生导师，国家计算机实验教学示范中心副主任。中国计算机学会高级会员、

  IEEE会员、ACM会员。美国宾夕法尼亚州立大学访问学者。辽宁省通信学会优秀工作者。中国互联网专业委员会委员和中国物联网专业委员会委员。东软集团博士后研究员。本人研究方向

  移动网络与智能计算、面向

  空天地海一体化网络、无人集群系统

  、

  低空网络、车联网、

  工业互联网、

  高精度场景建模和

  边缘计算

  ，

  在网络体系结构、

  多模态融合感知、感传算一体化、空间智能

  、

  智能体决策

  等关键技术研究上取得创新性成果

  ，

  在工业信息系统、矿山测绘和粮食仓储等领域实现成果转化。

  主持国家重点研发计划子课题、

  国家自然科学基金

  面上项目、

  国家自然科学基金青年基金项目、中国博士后基金面上项目、中央高校基本科研业务费、教育部新一代信息技术创新项目等

  30

  余项省部级以上项目，参与国家杰出青年基金、

  科技部重点研发项目

  、

  工信部重大专项、自然科学基金重点项目

  、国家科技支撑计划、教育部

  -中国移动专项等科技项目50余项。先后在

  IEEE Transactions on Knowledge and Data Engineering

  、

  ACM Transactions on Sensor Networks

  、

  INFOCOM

  、

  IEEE Transactions on Intelligent Transportation Systems

  、

  IEEE Internet of Things Journal

  、计算机学报、软件学报、计算机研究与发展等国内外重要期刊和会议上发表论文

  9

  0

  余篇。出版《新一代互联网原理、技术及应用》、《未来互联网技术》和《认知网络的数据传输机制》等学术著作

  5部

  ，

  《

  下一代互联网技术

  IPv6+

  》

  和《

  C

  语言程序设计实验指导》等省部级以上规划教材

  3

  部

  ；申报国家发明专利

  40余项，授权25项，软著

  7

  个，团体标准

  2项。获得中国仪器仪表学会科学技术奖科技进步二等奖1项，

  中国

  “发明创业奖项目奖”

  一等奖

  1

  项，

  沈阳市自然科学二等奖

  1项。担任国

  内外学术

  会议

  IEEE MSN、

  CWSN、ICCN等

  宣传主席

  、

  程序委员和分会主席；

  担任国内外学术期刊及会议审稿专家，如《计算机学报》、《软件学报》

  、

  《

  IEEE Internet of Things Journal

  》

  、《

  Transactions on Intelligent Transportation Systems

  》

  及

  《

  IEEE Transactions on Vehicular Technology

  》

  等

  ；

  担任国际期刊的客座编辑。

  于

  2011年和2017年两次入选国家留学基金委全额资助访问学者项目，2015年对英国利物浦大学、英国伦敦国王学院、意大利帕维亚大学、法国EPITA大学进行访问，开展科研合作和学术交流。2017-2018年美国宾夕法尼亚州立大学，访问学者。'
