bio_raw: '汪力行：女，博士，计算机工程系副教授。

  2007

  年

  7

  月于上海交通大学获工学学士学位。

  2013

  年

  6

  月于香港理工大学获博士学位。

  2013

  年进入东北大学计算机科学与工程学院计算机工程系，任副教授一职。主要研究方向为

  RFID

  技术的应用以及后台数据处理，无线传感网络，信息挖掘与管理。其涉及的领域包括：人工智能，数据挖掘，决策支持系统，供应链管理，优化计算等方向。主持并参与完成国家自然科学基金青年科学基金、教育部基本科研业务费等多项项目。以第一作者身份发表国际会议和期刊论文二十余篇，其中多篇被

  SCI

  、

  EI

  检索。担任多个国际期刊和国内一级学报审稿人。参与出版专著一本。获得发明专利一项。电子邮箱：

  wanglixing@mail.neu.edu.cn

  。'
