title: 副教授
email: fengzw@mail.neu.edu.cn
bio_raw: '冯智伟，副教授，博士生导师，计算机工程系副主任，CCF嵌入式系统专委会执行委员，自动化学会会员，“兴沈英才计划”拔尖人才（D类）。2020年4月博士毕业于东北大学计算机软件与理论专业，攻博期间公派美国伊利诺伊大学厄巴纳-香槟分校（UIUC）进行博士联合培养。

  近年来主要从事物联网，工业互联网，实时嵌入系统可靠性，时间敏感任务、大规模分布式机器学习任务容错调度等方面的研究。在TCAD（嵌入式领域国际顶刊，CCF-A）、IOTJ（物联网领域国际顶刊，中科院1区TOP）、DATE
  （EDA领域顶会）、EMSOFT（嵌入式领域国际顶会） 、TECS（嵌入式领域国际知名期刊） 、JSA（嵌入式领域国际知名期刊）和RTSS（实时系统领域国际顶会）等期刊和会议发表论文二十余篇。作为项目负责人，主持国家自然基金青年基金项目1项、中央高校基本科研业务费项目2项，参与国家重点研发计划项目2项、国家自然科学基金项目1项。获得发明专利3项，软件著作权2项。同时，担任ICESS
  2023 出版主席，IEEE ICPADS 2023和IEEE ISPA 2024程序委员会成员，以及TCPS、 JSA、T-ITS和控制与决策等期刊审稿人。

  邮箱：fengzw@mail.neu.edu.cn

  个人主页：http://faculty.neu.edu.cn/fengzhiwei'
