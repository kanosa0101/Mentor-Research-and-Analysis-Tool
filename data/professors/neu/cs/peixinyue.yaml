bio_raw: '裴欣月，副教授，中国通信学会会员。

  2018

  年和

  2023

  年分别在华南理工大学获得信息工程专业工学学士学位，以及信息与通信工程专业工学博士学位。在

  2022

  年，以国家公派联合培养博士生身份在英国南安普顿大学电子与计算机科学学院进行学术访问，师从英国皇家工程院院士

  Lajos Hanzo

  教授。目前研究工作面向基于下一代多址接入技术的低空智联网、车联网、通感一体化网络等

  6G

  核心通信网络，开展基于强化学习、凸优化、生成式

  AI

  的算法设计。截至目前，已在

  IEEE JSAC, IEEE IoTJ, IEEE TII, IEEE TCOM, IEEE TVT, IEEE WCL

  等国际重要期刊和

  IEEE GLOBECOM

  等国际知名会议上以第一作者

  /

  通讯作者身份发表多篇论文，拥有多件发明专利和软著。作为项目负责人主持国家自然科学基金青年项目、国家资助博士后

  B

  档、辽宁省自然科学基金等项目，作为骨干成员参与国自然面上项目、国自然重点项目等。

  电子邮箱：

  peixy@cse.neu.edu.cn

  个人主页：

  http://faculty.neu.edu.cn/peixy0/zh_CN/index.htm'
