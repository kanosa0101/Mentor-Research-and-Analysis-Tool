title: 教授
bio_raw: '张霞，女，博士，东软智能医疗科技研究院董事及院长，计算机软件国家工程研究中心副主任，东北大学教授

  /

  博士导师，

  1986

  年毕业于东北大学计算机系计算机科学专业，

  1989

  年获得东北大学计算机应用工学硕士学位，

  1994

  年获得东北大学计算机应用工学博士学位。现为辽宁省第三批百千万人才工程百人层次，沈阳市杰出人才，沈阳市五一劳动奖章获得者，国务院政府特殊津贴获得者，教育部新世纪优秀人才。

  长期从事数据管理与数据科学、软件架构与应用支撑平台、健康医疗信息化与智能化等计算机软件技术研究、软件产品研发和产业化工作，当前聚焦医疗数据智能与知识工程、医学影像临床工程以及融合多模态医疗数据和知识以及人工智能算法模型的医学科研平台。曾任东软集团股份有限公司高级副总裁兼首席技术官、首席知识官，建立了东软创新与技术发展和知识管理体系，使公司产品与技术竞争力不断提升，先行研发投入成果，在公司历次业务转型过程中发挥了关键推动作用，并获得了国际同行的认可，公司

  2012

  年获得了

  Asia MAKE(

  亚洲最受赞赏的知识型企业

  )

  大奖，本人曾荣获中国“最具领导力

  CTO

  奖”、“最具价值

  CTO

  奖”。

  曾担任

  “863

  计划

  ”

  数据库管理系统及其应用重大软件专项总体专家组成员，现兼任

  “

  中国电子学会计算机工程与应用分会

  ”

  副主任委员；

  “

  中国人工智能开源软件发展联盟

  ”

  副理事长；

  “

  全国专业标准化技术委员会

  ”

  委员；

  “SOA

  标准化委员会

  ”

  专家委员；

  “

  中国云计算技术与产业联盟成员单位

  ”

  常务理事；“中国计算机学会”杰出会员。作为项目负责人或项目执行负责人先后承担国家

  973

  计划、

  863

  计划、核高基、自然科学基金重点、科技创新

  2030

  等十余项国家项目，先后获国家科技进步二等奖、三等奖以及教育部及省市科技进步奖一等奖等奖励。出版专著两部，获得授权专利

  84

  项，在国际、国内学术期刊发表论文

  100

  余篇。

  从

  1997

  年开始研究生培养工作，共指导硕士研究生

  72

  名，指导（包括协助指导）博士研究生

  16

  名

  .

  。

  联系方式

  Email

  ：

  zhangx@neusoft.com

  个人主页

  ：

