bio_raw: '潘家雨，博士，东北大学计算机科学与工程学院教授，博士生导师，主要研究方向包括物联网边缘计算理论、

  量子计算与

  网络、边缘智能网络系统等。

  曾于

  2017

  年本科毕业于上海交通大学，

  2023

  年博士毕业于美国俄亥俄州立大学电子与计算机工程学院。曾于

  2023

  年担任浙江大学软件学院特聘研究员，

  2025

  年担任浙江大学百人计划研究员。

  2026

  年起担任东北大学计算机与工程学院教授，博士生导师。担任多个计算机网络

  方向国际学

  术会议的

  tpc member

  ，如

  ACM MobiHoc

  。曾研究方向属于物联网中的边缘计算，主要通过强化学习及停止时间等技术，大幅改善网络中的重要性能，包括信息年龄与评估误差。在此过程中提供多个基础数学贡献，如延伸

  Shiryaev

  的单一停止时间理论体系并精确求解一类多重停止时间问题等。

  部分研究成果应用到一项美国海军科研室项目。

  以第一作者

  /

  通讯作者身份在

  ACM Sigmetrics

  、

  IEEE/ACM ToN

  、

  IEEE INFOCOM

  等计算机网络及建模方向的会议期刊发表

  论文

  10

  篇，其中

  CCF A

  类论文

  5

  篇。主持国家级青年人才项目（海外）、国家自然科学基金青年项目、宁波市甬江人才项目。

  电子邮箱：

  panjiayu@cse.neu.edu.cn'
