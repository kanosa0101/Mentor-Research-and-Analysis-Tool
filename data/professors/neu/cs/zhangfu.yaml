bio_raw: '张富，

  1983

  年生，教授，博士

  /

  硕士生导师，东北大学计算机科学与工程学院，美国南加州大学

  USC/ISI

  访问学者，中文信息学会语言与知识计算专业委员会委员。辽宁省优秀博士论文提名奖，辽宁省优秀硕士论文获得者，辽宁省百千万人才工程入选者，辽宁省优秀研究生导师团队成员。

  研究方向包括：大语言模型、知识图谱、自然语言处理、深度学习、语义

  Web

  。

  主持承担国家自然科学基金

  -

  面上项目和青年基金、教育部中央高校科研基金、双一流建设项目、华为大模型基金、知识图谱一站式构建与问答系统研发等多项纵向和横向科研项目。以第一作者或通讯作者发表科研论著

  80

  余篇，包括

  CCF A/B

  类会议论文（

  ACL

  、

  AAAI

  、

  IJCAI

  、

  EMNLP

  、

  NAACL

  、

  CIKM

  、

  ECAI

  、

  COLING

  等）、

  SCI

  中科院一区

  /JCR

  一区期刊论文、以及

  CCF

  中文

  A

  类（计算机学报和软件学报）等。出版英文学术专著

  2

  部（德国

  Springer-Verlag

  斯普林格出版社）。多次获得科研论文优秀奖、科研论文他引次数奖、东北大学学术之星、专业和实验室建设先进个人奖、青年教师教学基本功竞赛一等奖、本科教学质量优秀奖、学生最喜爱的专业课程等多项科研与教学类奖项。

  实验室学生在研期间大多都到企业进行了实习，毕业后也相继到企业和高校从事相关工作（包括阿里巴巴、字节跳动、腾讯、拼多多、今日头条、百度、京东、美团、各大银行、中国石化、多家科研院所与高校、本博或硕博连读等）。实验室鼓励学生发表高水平学术论文或参加国内外学术竞赛，曾获得全国知识图谱与语义计算大会

  CCKS

  评测任务“中文短文本实体链指”第一名，

  CCF

  大数据计算与智能大赛隐私信息识别二等奖以及文本摘要提取三等奖，知识图谱构建挑战赛冠军等多项优秀成绩，同时也多次指导本科生科研训练与大创项目和竞赛等。

  电子邮箱

  : zhangfu@neu.edu.cn

  更多信息详见个人主页

  : http://faculty.neu.edu.cn/zhangfu/'
