  年出生，博士，

  东北大学计算机科学与工程学院讲师，硕士生导师，

  IEEE会员，CCF会员。2015年获得东北大学计算机

  系统结构

  硕士学位，

  2022年获得东北大学

  计算机软件与理论

  博士学位。曾于

  2018-2019年在

  加拿大麦吉尔大学

  交流访问。

  近年来一直从事

  实时性能分析

  、

  实时锁协议及自动驾驶系统等

  相关技术研究。

  近五年来在

  IEEE Transactions on Computer Aided Design of Integrated Circuits & Systems

  、

  Real-Time Systems

  Symposium

  、

  Design & Automation Conference

  、

  IEEE Transaction on Parallel and Distributed System

  等计算机系统结构、嵌入式系统领域方向顶级期刊

