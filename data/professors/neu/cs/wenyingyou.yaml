bio_raw: '闻英友，男，博士，教授，博士生导师，计算机软件国家工程研究中心副主任，国家重点研发计划首席科学家，中文信息学会大模型专家委员会委员，辽宁省科技伦理委员会委员，兼任辽宁省网络空间安全专业技术创新中心主任，中国医科大学客座教授；曾任教育部计算机类专业教指委委员。研究方向：人工智能、生成式

  AI

  、医疗

  AI

  、

  AIGC

  应用。作为项目负责人，承担了国家重点研发计划、国家

  863

  计划、国家发改委高技术产业化、国家工信部工业强基重大专项、辽宁省人工智能科技重大专项等多个基础研究和产业化项目。获得教育部科技进步一等奖

  1

  项，省科技进步一等奖

  1

  项，二等奖

  3

  项；获评国家

  **

  创新人才、辽宁省科技创新领军人才、辽宁省产业高端人才、辽宁省优秀科技工作者、沈阳市杰出人才、沈阳市高精尖优才，沈阳市十大科技英才、沈阳市劳动模范等称号。

  实验室地点：东北大学浑南校区文管

  学馆

  B

  10

  4

  。

