title: 教授
bio_raw: '刘积仁教授，博士生导师，我国自主培养的第一位计算机应用专业博士。刘积仁教授毕业于东北工学院（东北大学前身）计算机应用专业，师从李华天教授。博士培养期间曾赴美国国家标准局计算机研究院计算机系统国家实验室留学，学成归国后留校任教，一年后被破格提拔为教授，年仅

  33

  岁，是当时中国最年轻的教授之一。

  刘积仁教授曾主持国家自然科学基金、国家“

  863

  ”、国家经贸委、科技部、工信部等多项重大课题的研究工作，在计算机网络、多媒体技术、软件工程方面取得了多项科研成果。多次获得国家科技进步奖，省市级科技进步一、二等奖，被国家授予“五一劳动奖章”、“有突出贡献的中国博士”、“跨世纪优秀人才”、“有突出贡献的中青年科技工作者”等称号。

  刘积仁带领东软创建了中国第一个大学科技园，第一个软件园，第一个国家计算机软件工程研究中心，第一家中国的软件上市公司。

  1997

  年在中国的大型医疗设备还完全依赖进口时，他带领东软将中国自己制造的第一台

  CT

  推向市场，并走向世界。

  1998

  年，刘积仁开始推动大连软件园的建设，

  2000

  年开始带领中国软件走向世界，连续

  7

  年成为中国软件出口第一名，并从

  2000

  年开始投资建设信息技术学院，培养满足市场发展需要的软件产业人才，先后在大连，成都，佛山建立了三所大学，在校学生近

  5.5

  万余人，累计毕业生

  12

  万人，为我国软件产业的发展源源不断地输送满足市场发展需要的人才。

  现任职务：中国国际经济交流中心常务理事；中国电子学会常务理事；计算机软件国家工程研究中心主任。

  曾任职务：世界经济论坛新兴跨国公司议程理事会成员

  ;

  亚太经合组织

  APEC

  工商咨询理事会成员

  ;

  东北大学副校长

  ;

  中国软件行业协会副理事长

  ;

  第八、九、十届全国政协委员。

  联系方式

  Email

  ：

  liujr@neusoft.com

  个人主页：

  http://faculty.neu.edu.cn/liujiren/zh_CN/index.htm'
