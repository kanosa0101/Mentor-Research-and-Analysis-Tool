title: 副教授
email: yushangshu@cse.neu.edu.cn
bio_raw: '于尚书，副教授，博士

  /硕士生导师

  ，

  IEEE/

  CCF/CSIG会员

  。

  博士毕业于厦门大学计算机科学与技术专业

  ，

  2023年-2025年于新加坡南洋理工大学从事博士后研究工作。主要研究方向

  包括

  三维计算机视觉、激光点云定位与重建

  、具身智能与世界模型

  等。

  近年来以第一

  /通讯作者身份在IEEE TCSVT、IEEE TITS

  、

  PR

  等中科院一区

  Top期刊和CVPR、

  NeurIPS、ICML

  等

  CCF-A类会议上发表论文

  13

  篇

  。

  长期

  担任

  三维

  视觉领域国际高水平期刊

  与

  会议审稿人

  。在科研项目方面，主持科研项目

  3项，并作为核心骨干参与国家自然科学基金面上项目、NTU-DESAY SV等多项重要研究项目。

  曾

  担任国际计算机视觉与深度学习会议

  CVDL 2024

  研讨会主席

  ；

  荣获

  2024年全国激光雷达优秀博士学位论文奖

  ；

  并

  入选辽宁省

  “兴辽英才计划”

  。

  电子邮箱：

  yushangshu@cse.neu.edu.cn

  个人主页：

  https://psyz1234.github.io/'
