bio_raw: '王千阁

  ,

  东北大学计算机科学与工程学院教授、博士生导师，东北大学博士，新加坡国立大学博士后，入选国家高层次青年人才。研究方向为图数据管理，图机器学习，大模型检索增强生成，数据智能体系统等。在

  SIGMOD、VLDB、ICDE、TPDS、TKDE等CCF

  A类国际顶级会议期刊发表论文

  20

  余篇。曾获中国计算机学会自然科学二等奖，

  APWEB-WAIM

  最佳论文提名奖等。多次担任

  VLDB

  , ICDE,TKDE,

  TC等国际顶级会议和期刊的程序委员会委员和审稿人。

