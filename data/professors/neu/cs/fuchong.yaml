bio_raw: '付冲，教授

  /

  博士生导师，九三学社社员，

  IEEE

  会员。

  1975

  年出生，

  1998

  年毕业于东北大学信息学院通信工程专业，获学士学位，

  2001

  年获东北大学通信与信息系统专业硕士学位，

  2006

  年获东北大学计算机软件与理论专业博士学位。于

  2010

  年

  6

  月至

  9

  月以访问学者身份在香港理工大学电子与资讯系进行研究工作。主要研究方向为深度学习

  与计算机视觉、

  医学图像计算机辅助诊断

  、

  基于混沌密码学的多媒体信息安全。近年来在

  IEEE TMM, IEEE JBHI

  ，

  IEEE TCSVT, IEEE TCE, ACM TOMM, Knowledge-Based Systems, ICCV, AAAI

  等人工智能与多媒体领域重要期刊、国际会议发表论文

  80

  余篇

  ，并有多篇论文

  进入

  ESI

  高被引

  。获批国家发明专利

  近

  20

  项，出版

  “

  十二五

  ”

  国家重点图书出版规划项目

  1

  部。主持完成多项国家、省部级课题。获

  2014

  年辽宁省自然科学学术成果一等奖、

  2016

  年辽宁省自然科学学术成果二等奖。指导本科生获多批次信息安全类全国竞赛奖项，指导博士、硕士生多次获得辽宁省、中国冶金教育学会等省部级优秀学位论文。

  2010

  年代表东北大学参加沈阳市青年教师教学竞赛获

  “

  沈阳市教学能手

  ”

  称号，当选

  2012

  年度东北大学

  “

  我最喜爱的老师

  ”

  ，

  2017

  年入选东北大学第一批

  “

  教学标兵

  ”

  ，

  2021

  年入选辽宁省教学名师

  。

  谷歌学术引用

  4600+

  ，

  H-

  因子

  37

  。

  邮箱：

  fuchong@mail.neu.edu.cn

  。'
