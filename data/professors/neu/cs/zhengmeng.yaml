bio_raw: '郑萌，博士，东北大学树梁学者，三级教授，硕士/博士生导师，国家优秀青年基金和辽宁省首批优秀青年基金获得者，入选“兴辽英才计划”青年拔尖人才、中国科学院青年创新促进会会员、辽宁省百千万人才工程-千层次和沈阳市中青年科技英才培养工程-领军人才。曾荣获辽宁省青年科技奖、辽宁省自然科学学术成果奖一等奖、中国科学院杰出科技成就奖、中国科学院沈阳分院优秀青年科技人才奖、中国科学院院长优秀奖和中国青年科技奖提名（2022）。担任中国自动化学会信息与控制信息物理系统专委会委员和青年工作委员会委员、中国计算机学会物联网专委会委员，入选IEEE
  Senior Member、中国计算机学会高级会员、中国通信学会高级会员。曾在德国弗劳恩霍夫HHI通信技术研究所作联合培养博士生（2010.11-2012.10）、在柏林工业大学作国家公派访问学者（2018.12-2019.11）。研究方向为无线智能网络、工业物联网和无线网络化控制系统，在Proceedings
  of the IEEE、IEEE/ACM TON、TMC、TWC、TCOM、IOT J、TII、TVT、TNSE、TGCN、INFOCOM、ICC等无线通信和网络领域国际期刊和会议上发表论文120余篇，出版Springer专著1部，申请发明专利54项。欢迎计算机、人工智能、通信、应用数学、自动化等相关专业的学生报考。

  电子邮箱：zhengmeng@cse.neu.edu.cn'
