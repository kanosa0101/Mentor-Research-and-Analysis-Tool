title: 讲师
bio_raw: '刘尧，东北大学计算机科学与工程学院讲师，医学影像智能计算教育部重点实验室成员，澳大利亚麦考瑞大学荣誉助理教授（讲师）。

  本科和硕士毕业于浙江大学，博士毕业于澳大利亚新南威尔士大学。

  曾到访哈佛大学学习，并在华为杭州研究院担任软件工程师和在麦考瑞大学担任博士后研究员。

  本人长期从事时空数据的分析与建模研究，主要关注多模态影像处理与医学影像智能计算，已发表十余篇论文，包括KNOSYS, TKDE, IJIS, TOMM, CIKM等。

  曾担任CIKM 2022~2024，IEEE BigData 2024，ICONIP 2024程序委员会成员，并担任CVPR, ICCV, NIPS, KDD,
  KNOSYS, TAI，TST等多个会议与期刊审稿人。

  曾核心参与澳大利亚研究委员会Discovery Projects及Cooperative Research Centres Projects (CRCP) Grants项目。

  具有与良好的国际国内合作关系，并多次联合指导本科生与硕士研究生。'
