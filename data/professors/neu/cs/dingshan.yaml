bio_raw: '丁山，男，1967年10月出生,工学博士,副教授,硕士生导师.1985年到1989年于东北大学计算机专业获得工学学士，1997年到1999年硕士毕业于日本国名古屋工业大学电气信息工学专业，1999年到2003年博士毕业于日本国名古屋工业大学电气信息工学专业， 2004年到2006年在日本国名古屋大学作日本文部省学术振兴会（JSPS）研究员。2006年到现在，任东北大学副教授

  邮箱:dingshan@cse.neu.edu.cn 电话：13704001031'
