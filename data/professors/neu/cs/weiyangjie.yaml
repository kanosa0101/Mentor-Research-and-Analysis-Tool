bio_raw: '魏阳杰，女，1978年出生，博士，教授，博士生导师。

  Ÿ 1998/09-2002/07，吉林大学，电子信息工程专业，本科/学士；

  Ÿ 2002/09-2005/07，中国科学院沈阳自动化研究所，模式识别与智能系统专业，硕士；

  Ÿ 2008/09-2013/01，中国科学院沈阳自动化研究所，模式识别与智能系统专业，博士；

  Ÿ 2010/11-2012/10，Fraunhofer IZFP-D（德国），传感器和传感器系统方向，中欧博士联合培养。

  2013年博士毕业，通过东北大学杰出人才引进计划聘为副教授。现担任中国自动化学会大数据委员会委员、中国计算机学会（CCF）会员、国际电气电子工程师协会（IEEE）会员；多个国际会议程序委员会委员、国际国内重点期刊审稿人。作为项目负责人承担国家重点研发计划、国家自然科学基金等课题7项，作为项目骨干参与国家自然科学基金、欧洲区域发展项目等课题5项。在国际、国内知名学术期刊和会议中共发表学术论文50余篇、SCI检索论文篇15篇、EI检索论文40余篇，英文书刊章节3篇。授权国家发明专利4项。

  2018年入选沈阳市高层次人才拔尖人才。曾荣获中国科学院百篇优秀博士论文奖、中国科学院院长奖、中国科学院沈阳自动化研究所优秀博士论文、国际会议IEEE ICMA
  2009优秀学生论文奖、国际会议IEEE CYBER 2015优秀大会论文提名奖、辽宁省自然科学学术成果奖一等奖、东北大学五四奖章。研究成果得到辽宁抚顺消防总队、河南南阳消防总队等应用。

  主要研究领域和研究内容包括：

  （1）微纳米尺度光学视觉感知与信息处理：研究光学显微成像机理和传统光学成像模型中的理论成像极限问题，研究提高基于常规光学显微镜的分辨率和观测能力的理论方法和相应的图像处理技术；研究面向生物、生命科学、医药学研究的超高分辨率动态无损观测技术和系统。

  （2）动态多声源实时感知与智能声音处理：以实时动态多声源信号为对象，研究多动态声源叠加信号的快速智能处理以及基于声纹特征的自主识别技术，研究基于声音信号的复杂环境感知和建模技术。

  （3）面向移动机器人的智能环境感知：以机器人为研究的载体，以实时动态音视频信号为对象，研究多尺度、多视角、非结构环境下的动态听视觉协同处理技术，研究复杂野外环境下的机器人智能环境感知与多源信号融合技术。

  联系方式：weiyangjie@cse.neu.edu.cn'
