title: 教授
email: baoyubin@cse.neu.edu.cn
bio_raw: '博士，教授，计算机科学与工程学院副院长。1990年毕业于中南大学计算机系，获学士学位，分别于1993年和2003年获东北大学硕士学位和博士学位。主要研究兴趣为商务智能、数据挖掘、大数据分析、图像处理、图数据管理等。主持完成国家自然科学基金项目2项，参与完成了国家863计划项目、NSFC项目、NSFC重点项目子课题以及企业合作项目多项。在研国家自然科学基金重点项目课题1项，参与国家重点研发计划项目1项。在国内外高水平的期刊和会议上发表学术论文50余篇，多篇论文被SCI、EI和ISTP收录，合作出版专著2部，合作翻译著作3部，获教育部自然科学二等奖1项，辽宁省自然科学二等奖1项、科技进步奖3项。讲授过《操作系统》、《计算机图形学》、《运筹学》、《Linux操作系统分析》、《程序设计方法学》等课程，主持辽宁省教改项目3项，获辽宁省教学成果二等奖1项（排名第一），参与完成辽宁省教学成果一等奖1项。

  个人邮箱：baoyubin@cse.neu.edu.cn'
