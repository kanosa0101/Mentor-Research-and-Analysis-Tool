bio_raw: '林树宽，女，计算机科学系教授，博士学位，中国计算机学会高级会员。研究方向为时空数据挖掘、机器学习、人工智能、并行计算。近年来，作为项目负责人，主持国家自然科学基金

  2

  项、国家工信部项目

  1

  项、辽宁省重点攻关项目和自然科学基金项目

  3

  项、沈阳市重点攻关和自然科学基金项目

  2

  项；参加国家攻关项目

  3

  项以及多项省市重点攻关项目和横向项目。获辽宁省科技进步二等奖

  1

  项，辽宁省科技成果

  1

  项。近年来，在国内外重要学术会议、国际期刊、国内一级学报、核心期刊发表

  SCI

  、

  EI

  和

  ISTP

  收录的论文

  70

  余篇。获得发明专利授权

  5

  项。出版专著

  2

  部。讲授的课程包括本科生课程

  “

  操作系统原理

  ”

  和研究生课程

  “

  并行程序设计

  ”

  、“深度学习及其应用”。电子邮箱：

  linshukuan@cse.neu.edu.cn'
