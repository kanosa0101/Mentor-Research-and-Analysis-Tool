title: 副教授
bio_raw: '于亚新，现任计算机科学与工程学院计算机科学系副教授，博士，硕士研究生导师，东北大学计算机科学与工程学院国家级示范教育中心副主任。作为项目负责人主持和参加国家自然科学基金项目多项，作为执行负责人参加过国家

  863

  项目等，并获得过辽宁省自然科学技术进步二等奖。近年来，在“

  Frontiers of Computer Science

  ”、

  “DASFAA”

  、

  “WAIM”

  、

  “MDM”

  、

  “Lecture Notes in Computer Science”

  等国际期刊和国际会议，以及

  “

  软件学报

  ”

  、

  “

  计算机研究与发展

  ”

  、

  “

  计算机科学与探索”、“计算机小型微型系统”等国内重要核心期刊杂志发表论文

  40

  多篇，多篇被

  SCI

  和

  EI

  检索。出版专著

  1

  部，参与译著

  2

  部。在计算机领域的社交网大数据分析、数据科学、深度并行数据处理、社交网轨迹挖掘、虚拟现实等方向有一定研究造诣。先后申请和授权国家发明专利、软件著作权

  10

  多项。指导的硕士研究生曾获得校优秀硕士毕业生称号。'
