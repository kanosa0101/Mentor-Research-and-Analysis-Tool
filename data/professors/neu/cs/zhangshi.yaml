bio_raw: 张石， 男，1963年11月出生，现任电子信息工程研究所所长，教授，博士生导师。1985获学士学位，1988年获硕士学位，1998年获博士学位。2001年晋升为教授，兼任信息科学与工程学院电子信息研究所所长。辽宁省高等学校电工学研究会理事长。2001年沈阳市优秀教师，2001年度百千万人才工程千人层次人选，是校精品课程和辽宁省优秀课“电工学”的课程带头人，电工电子教学基地的负责人，多次获校优秀教学成果奖。在科学研究方面，多年来，承担多项科研课题，科研项目涉及PLC应用、嵌入式技术的应用，管理信息系统，并开发了一些新的科研项目，他指导的学生在2004年第二届“Intel杯全国嵌入式系统设计大赛”中获一等奖，在第五届Motorola“飞思卡尔”杯嵌入式大赛获三等奖。撰写科技论文多篇。主编两本教材，参编两本教材。E-mail:zhangshi@ise.neu.edu.cn
