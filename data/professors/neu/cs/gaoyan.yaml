bio_raw: '高岩，男，1970年出生，副教授。主要研究方向为云计算、服务计算、边缘计算、智慧交通，主要针对云环境下自适应资源调整、云环境中面向SLA的云服务系统自适应、基于服务的软件系统（SBS）性能自优化、动态服务选取、边缘智能以及智慧交通等方面开展研究工作。作为项目负责人承担辽宁省自然科学基金等省部级课题多项，参加国家科技支撑计划项目、国家科技攻关项目、国家自然科学基金、863计划等国家级课题多项，发表论文多篇。获辽宁省科技进步二等奖一项。

  E-mail: gaoyan@mail.neu.edu.cn'
