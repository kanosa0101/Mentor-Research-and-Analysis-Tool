bio_raw: '姚 迪，男，

  1988

  年生，东北大学计算机学院副教授，博士生导师。分别于

  2007

  年和

  2014

  年获得哈尔滨工程大学水声工程学士和硕士学位，

  2019

  年获哈尔滨工业大学信息与通信工程博士学位。主要从事雷达与水下超声信号处理技术、抗干扰与杂波抑制、目标

  DOA

  估计。主持国家自然科学基金青年基金、辽宁省自然科学基金面上基金、国家重点实验室自主课题、中央高校基本科研业务费专项等，以第一作者发表期刊和国际会议论文

  16

  篇，其中

  SCI

  检索的期刊论文

  12

  篇，并担任

  IEEE

  、

  IET

  等信号处理领域期刊审稿人。

  电子邮箱：

  yaodi@cse.neu.edu.cn'
