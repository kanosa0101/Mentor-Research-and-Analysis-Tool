bio_raw: '吴刚，男，博士，教授，博士生导师。辽宁省大数据管理与分析重点实验室副主任。中国中文信息学会语言与知识计算专委会委员，中国计算机学会会员，

  ACM会员。

  在重要的国际会议和国内外期刊上发表相关论文

  60余篇（包括TKDE，WWWJ，Information Systems，NCA，JCST，FCS，计算机学报，软件学报，计算机研究与发展，WWW，SIGIR，ICDE，CIKM，COMPSAC，ISWC，ESWC，PAKDD，DASFAA，WISE，WAIM，APWeb）；编辑书籍1部（Semantic
  Web

  ，

  ISBN：978-953-7619-54-1）。

  申请发明专利

  18项，已授权9项。获得软件著作权4项。

  牵头起草

  “信息技术

  众包服务平台

  功能通用要求

  ”等多个国家标准、团体标准和行业标准。曾任S

  CI2

  区期刊

  Frontiers of Computer Science青年

  副主编

  （入选

  FCS青年AE计划），以及多个国际

  国内

  期刊

  和会议

  的审稿人。

  主持完成国家重点研发计划课题

  1项；

  主持并完成国家自然科学基金

  3项；主持并完成计算机软件新技术国家重点实验室（南京大学）开放课题1项、江苏省自然科学基金1项；北京市“现代信息科学与网络技术”重点实验室开放课题1项、中央高校基本科研业务费专项基金3项

  。作为骨干成员参与并完成国家自然科学基金重点项目

  1项；作为骨干成员参与并完成国家重点研发计划课题1项。

  2次获评NDBC最佳论文。指导本科生

  曾

  获

  2010年“江苏省普通高校本专科优秀毕业设计（论文）二等奖”

  ；

  。

  指导本科生获得数模美赛

  M奖，数模国赛全国二等奖，数模国赛省奖多次；国家级大学生创新创业训练计划（大创）优秀结题。

  荣获

  2022年中国商业联合会全国服务业科技创新奖一等奖（排名第10/13），2022年中国电子学会科学技术奖科技进步一等奖（排名11/11）。

  研究方向：

  新型数据库（向量数据库、内存数据库、图数据管理

  ）、知识图谱（语义

  Web）

  、

  分布式、并行数据管理、

  F

  PGA

  加速（深度神经网络、数据库）

  。

  电子邮件：

  wugang@mail.neu.edu.cn

  个人主页：

  http://faculty.neu.edu.cn/wugang/'
