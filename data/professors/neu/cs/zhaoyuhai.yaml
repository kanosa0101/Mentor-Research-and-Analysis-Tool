bio_raw: '赵宇海，东北大学计算机科学与工程学院教授、博士生导师，教育部新世纪优秀人才，辽宁省“百千万人才工程”百人层次，辽宁省高等学校创新人才，曾荣获全国百篇优秀博士学位论文提名奖和辽宁省优秀博士学位论文奖。担任《Frontiers
  of Computer Science》执行编委，《Computational and Mathematical Methods in Medicine》编委。近年来，在KDD、ICDE、AAAI、FSE、TKDE等CCF
  A类的数据库、数据挖掘、人工智能、软件工程等领域顶级学术会议和期刊上发表90余篇学术论文，授权发明专利10余项，主持863计划项目、科技部重点研发计划课题、国家自然科学基金重点项目课题、国家自然科学基金面上项目等20余项。主持研发的“批流融合大数据计算系统”在阿里巴巴“双十一”和杭州、上海等地城市大脑等实际场景获得应用。指导学生多次荣获全国数据库学术会议NDBC最佳论文奖、CCF大数据学术会议最佳学生论文奖、国际数据库领域重要会议DASFAA最佳学生论文奖、东北大学优秀硕士毕业论文奖等。现为中国计算机学会CCF高级会员、ACM会员、IEEE会员。

  主要研究兴趣为：智能计算与学习、大数据挖掘、图计算、推荐系统、智能软件工程等。

  电子邮箱：zhaoyuhai@mail.neu.edu.cn'
