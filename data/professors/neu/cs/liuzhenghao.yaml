bio_raw: '刘正皓，男，1994年10月生，2016年于东北大学获得工学学士学位，2021年于清华大学获得工学博士学位，师从孙茂松教授。东北大学计算机科学与工程学院副教授，硕士研究生导师，CCF会员，中文信息学会会员，中文信息学会青工委委员。主要研究方向为人工智能、自然语言处理中的信息检索、自动问答以及语法改错等工作。近年来在国际顶级会议或期刊上发表学术论文20余篇，其中包括ACL、EMNLP、NAACL、SIGIR、WebConf、IJCAI、ICTIR以及JCST等。多次作为程序委员会委员参与ACL、EMNLP、NAACL以及AAAI等国际顶级会议或期刊的审稿工作。曾获CCL
  2018最佳论文奖。

  开源项目

  清华文达、文正中英文批改（网址：http://wenda.thunlp.org）

  神经信息检索工具包OpenMatch（网址：https://github.com/thunlp/OpenMatch）

  研究方向

  自然语言处理、信息检索、自动问答

  联系邮箱：liuzhenghao@cse.neu.edu.cn'
