bio_raw: '巩树凤，

  1991年，博士，副教授，博士生导师，中国计算机学会数据库专委会、并行与分布式专委会执行委员。2021年毕业于东北大学计算机学院，主要研究方向为大规模数据处理与挖掘，并行与分布式计算，增量计算理论和系统，图数据库和向量数据库。于2018年10月-2019年10月在新加坡国立大学科研实习，于2020年12月-2021年3月在阿里巴巴达摩院科研实习。承担国家自然科学基金青年基金，辽宁省自然科学基金，CCF-华为胡杨林基金数据库专项课题。在计算机数据库领域顶级会议SIGMOD、VLDB，ICDE，《TPDS》，等CCF-A类会议和期刊发表论文20余篇。曾获CCF自然科学二等奖，ACM
  SIGMOD中国优博，辽宁省优秀硕士/博士学位论文奖，全国数据库学术会议最佳论文奖，东北大学优秀硕士/博士学位论文奖等奖励。指导学生获中国图计算挑战赛季军，数学建模大赛（美赛

  ）

  一等奖，计算机博弈大赛一等奖等奖项。招收自我驱动力，动手能力，探索欲强的硕士生、博士生和直博生

  (含本博班)，鼓励本科生参与科研训练与能力提升。

  电子邮箱：

  gongsf@mail.neu.edu.cn

  个人主页：

  http://faculty.neu.edu.cn/gongsf

  或

  https://gongsf-neu.github.io/

  依附团队：

  分布式智能计算系统课题组

  [

  https://idc-neu.github.io/

  ]'
