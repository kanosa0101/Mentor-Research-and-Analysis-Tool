title: 教授
bio_raw: '于戈，东北大学计算机学院教授，博士生导师，中国计算机学会会士，

  CCF

  数据库专委会委员，

  CCF

  信息系统专委会副主任。

  1982

  年、

  1986

  年先后获得东北大学计算机学士学位和硕士学位，

  1996

  年获得日本九州大学计算机博士学位。主要研究领域包括：数据库理论与技术、分布与并行式系统、云计算与大数据管理等。《计算机学报》、《软件学报》、《计算机研究与发展》等期刊编委。曾担任第五届、第六届国务院学位委员会学科评议组成员，第十二届、第十三届国家自然科学基金委员会评审专家组成员，以及

  VLDB, ICDE, CIKM, DASFAA

  等多届重要国际会议的程序委员会委员。主持和完成国家

  973

  计划课题、国家

  863

  计划课题、国家自然科学基金课题等国家级课题

  10

  余项，发表论文

  200

  余篇，出版“分布式数据库系统”等专著和教材

  6

  部，译著

  4

  部。获得“教育部自然科学二等奖”等省部级科学技术奖

  8

  项、省教学成果一等奖

  1

  项。获得“教育部跨世纪人才基金”和“中国高校青年教师奖”。目前承担的在研课题有国家重点研发计划课题、国家自然科学基金重点课题。

  个人主页：

  //faculty.neu.edu.cn/yuge/'
