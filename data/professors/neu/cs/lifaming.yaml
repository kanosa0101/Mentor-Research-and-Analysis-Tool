bio_raw: '李发明，本硕博毕业于哈尔滨工业大学计算学部，东北大学计算机科学与工程学院讲师，硕士研究生导师，CCF会员，CCF数据库专委会执行委员。主要从事数据管理、数据库、大数据计算等领域研究。近年来在TKDE、Information
  Sciences、ICDE、DASFAA、KBS、PAKDD、软件学报等国内外重要期刊和会议发表论文10篇。作为负责人主持国家自然科学青年基金1项、中国博士后科学基金2项。

  研究方向：数据管理、数据库、大数据计算

  个人主页：https://lifaming-neu.github.io/homepage

  联系邮箱：lifaming@mail.neu.edu.cn'
