bio_raw: '薛丽芳：女，博士，讲师，

  1977

  年

  9

  月生，湖北随州人。

  1999

  年

  7

  月获得东北大学计算机科学与技术专业学士学位，

  2010

  年

  1

  月获得东北大学检测技术与自动化装置专业博士学位（硕博连读），

  2010-

  至今任教于东北大学计算机科学与工程学院基础教学部。

  为本科生讲授《

  Python

  程序设计》、《

  C++

  语言程序设计》、《多媒体技术及应用》等多门计算机基础课程。主要研究方向包括机器学习、图像处理等，

  参与并完成多项国家级项目。在核心期刊和国际会议上发表学术论文

  10

  余篇，多篇被

  EI

  和

  ISTP

  收录。

  Email

  ：

  xuelf@mail.neu.edu.cn。'
