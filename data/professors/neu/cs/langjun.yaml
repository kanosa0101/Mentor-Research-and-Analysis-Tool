title: 副教授
bio_raw: '郎俊，男，1982年2月出生，工学博士，副教授，硕士生导师。2005年和2007年于哈尔滨工业大学数学系分获理学学士、硕士学位，2011年于北京理工大学信息安全与对抗技术专业获工学博士学位，师从两院院士王越教授。2011年3月作为引进人才，就职于东北大学信息科学与工程学院信号与信息处理研究所。2009年曾荣获“微软学者”称号（共25位博士生获此荣誉，其中中国地区11名），并获得微软亚洲研究院提供的6000美元课题科研资助。主要研究方向：信息安全与对抗、分数傅里叶变换、小波变换和压缩感知理论及其在信号处理中的应用。作为项目负责人主持国家自然科学基金青年项目、教育部中央高校基本科研经费人才和种子项目、教育部985工程自由探索基金项目共5项。曾参与国家973项目、国家科技支撑计划、国家自然科学杰出青年基金、国家自然科学基金面上项目、教育部博士点基金等科研项目共8项。在光学领域顶级期刊Optics
  Express（SCI二区，影响因子3.993）、Optics Letters（SCI二区，影响因子3.772）、Optics and Lasers in Engineering、Optics
  Communications、Computers & Electrical Engineering、Science China Information Sciences等国内外权威杂志和IEEE国际会议上共发表科研论文25篇，其中被SCI检索13篇，EI检索23篇，发表的论文已被他引二百余次。担任IEEE、OSA、ELSEVIER系列国际期刊以及中国科学、电子学报、电子与信息学报等国内杂志审稿人。

  通信地址：沈阳市浑南新区创新路195号东北大学浑南校区H016信箱，邮编：110169。

  个人主页：http://faculty.neu.edu.cn/langjun；电子邮箱：langjun@mail.neu.edu.cn。'
