bio_raw: '杨松，男，教授，博士生导师，

  CCF

  杰出会员，

  IEEE

  高级会员，

  CIC

  高级会员。从事边缘计算

  /

  云计算，智能物联网，新型网络系统（卫星互联网，量子网络）以及人工智能系统与算法等研究。目前担任

  Elsevier Computer Networks

  期刊编委，

  Elsevier Computer Communications

  期刊编委，

  CCF

  网络与数据通信专业委员会常务委员，

  CCF

  分布式计算与系统专业委员会委员，同时担任包括

  ACM MM

  ，

  IEEE INFOCOM, ACM WWW, IEEE ICDCS, IEEE IWQoS

  等多个

  CCF A/B

  类会议的

  Area Chair

  或

  TPC

  。杨松于

  2015

  年

  6

  月获得荷兰代尔伏特理工大学博士，

  2015

  年

  8

  月至

  2017

  年

  7

  月在德国哥廷根大学下属数据研发计算中心（

  GWDG

  ）担任博士后研究员（玛丽居里奖学金）。

  2017

  年

  12

  月至

  2026

  年

  6

  月任北京理工大学计算机学院副教授，特别研究员，

  2026

  年

  7

  月至今任东北大学计算机学院教授。近年来在国际知名期刊和会议上发表论文

  80

  余篇，其中包括

  CCF A

  类论文

  40

  余篇，中科院一区

  20

  余篇，并且出版英文专著

  2

  部和中文教材

  1

  部，入选

  Standford/Elsevier 2024

  ，

  2025

  年全球前

  2%

  顶尖科学家榜单。主持了国家重点研发计划子课题、国家自然科学基金和北京市自然科学基金等项目

  10

  余项。

  毕业生去向：目前已经指导

  7

  名毕业博士生，

  20

  余名毕业硕士生。博士生就职于北京工业大学，内蒙古大学，中科院等，硕士生就职于京东，快手，小米，阿里巴巴，华为等，另有部分硕士生出国深造攻读博士学位（英国格拉斯哥大学等）。

  个人主页：

  http://faculty.neu.edu.cn/yangs/zh_CN/index.htm

  电子邮箱

  : yangs@cse.neu.edu.cn'
