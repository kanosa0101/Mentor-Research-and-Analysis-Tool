bio_raw: '谷峪，

  1981

  年生，东北大学计算机科学与工程学院教授（长聘岗），博士生导师，计算机科学系主任，辽宁省“数字化装备综合信息处理系统重点实验室”主任，首批辽宁省“兴辽英才计划”青年拔尖人才，首届辽宁省“优秀研究生导师团队”核心成员，沈阳市“领军人才”，中国计算机学会杰出会员，数据库专委会执行委员，信息系统专委会执行委员，计算机科学杂志执行编委。主要研究方向为大数据分析、新型数据库系统、分布式计算系统、图和时空数据管理、大模型训练推理加速、图神经网络、大模型检索增强生成等。作为项目负责人承担（完成）国家自然科学基金面上项目

  4

  项、国家自然科学基金青年基金

  1

  项、国家自然科学基金联合重点项目课题

  1

  项、

  973

  子课题

  1

  项、国家重点研发计划子课题

  2

  项、辽宁省兴辽英才计划项目

  1

  项、教育部基本科研业务费项目

  4

  项；承担

  CCF-

  华为胡杨林基金等企事业合作项目多项，牵头或参与设计了移动、海洋、渔业、电网等领域的大数据管理与分析平台。在

  SIGMOD

  、

  VLDB

  、

  KDD

  、

  ICDE

  、

  ACL

  、

  NeurIPS

  、

  AAAI

  、

  SIGIR

  、

  WebConf

  、

  VLDBJ

  、

  TKDE

  、

  TPDS

  、

  TC

  、

  TOIS

  、

  TIFS

  等顶级国际会议和期刊上发表

  CCF A

  类长文

  50

  余篇，在

  CIKM

  、

  EMNLP

  等重要国际会议和期刊上发表

  CCF B

  类长文

  40

  余篇，在计算机学报、软件学报等国内一级学报发表论文

  20

  余篇，获

  DASFAA

  最佳学生论文奖、

  ADMA

  最佳论文奖、

  APWeb/WAIM

  最佳论文提名奖、

  NDBC

  最佳论文奖，

  5

  次指导研究生获全国数据库会议优秀学生论文奖。指导博士生获中国计算机学会优博（副导师）、

  ACM SIGMOD

  中国优博、

  CCF

  信息系统专委优博。主编大规模图数据的分布式处理学术专著一部，由清华大学出版社出版；参编分布式数据库系统教材一部，由机械工业出版社出版；参编现代分布式系统教材一部，由高等教育出版社出版。获得发明专利

  10

  余项。多次担任

  ICDE

  、

  SIGIR

  、

  ACL

  、

  ICML

  、

  KDD

  、

  TKDE

  、

  VLDBJ

  等顶级会议和期刊的审稿人。获中国计算机学会自然科学二等奖，

  2

  次获辽宁省自然科学学术成果奖一等奖，

  5

  次获评东北大学学生创新创业活动优秀指导教师，

  4

  次获东北大学“我最喜爱教师”提名奖，主讲的“面向对象程序设计”获国家级一流本科课程，获辽宁省研究生教学成果二等奖、东北大学教学成果一等奖等教学奖励。

