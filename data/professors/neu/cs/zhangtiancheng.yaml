title: 教授
email: tczhang@mail.neu.edu.cn
bio_raw: '张天成：男，博士，东北大学计算机学院教授，博士生导师，中国计算机学会高级会员，中国信息系统专委会执行委员。

  2012年5月至2013年4月，在澳大利亚新南威尔士大学做访问学者研究。主要研究兴趣包括：人工智能，智慧教育，大数据分析与挖掘，时空数据管理技术等。

  作为负责人

  主持国家自然科学基金

  重点项目课题和

  面上项目

  多

  项，主持

  完成多个

  辽宁省基金以及与百度、英特尔等企业的合作项目

  ，

  参加国家

  “九五”科技攻关计划、国家863高技术计划和企事业合作项目

  等

  20余项。近年来，在

  CCF A类国际会议SIGMOD、ICLR、WWW、AAAI

  和

  CCF A类期刊TKDE、TOSEM以及

  《软件学报》、《计算机学报》等国内外

  会议和

  杂志上发表论文

  8

  0余篇，参编著作5部，

  授权

  发明专利

  10余项

  ，获辽宁省自然科学学术成果一等奖等多项奖励。多次指导

  ACM-ICPC、CCPC等全国大学生程序设计竞赛和数学建模竞赛，获得10余项各等级竞赛奖。指导多项大学生创新创业训练计划项目。曾获东北大学优秀共产党员、东北大学三育人先进个人、东北大学优秀班导师等称号。

  电子邮箱：

  tczhang@mail.neu.edu.cn

  个人主页：

  http://faculty.neu.edu.cn/tczhang/'
