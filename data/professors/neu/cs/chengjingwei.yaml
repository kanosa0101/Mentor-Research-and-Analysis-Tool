bio_raw: 程经纬，男，1974年生，辽宁抚顺人，博士，讲师。研究方向为语义Web、本体、描述逻辑等。主持和参与国家自然科学基金、中央高校基本科研业务费等多项课题。近年发表了论文20余篇，包括国际著名科技出版集团Springer出版的英文学术专著1部。目前担任多个国际期刊和国际会议的评审专家。多次在东北大学优秀网络课程大赛、信息学院青年教师教学基本功大赛和青年教师实验技能大赛中获奖。电子邮箱：chengjingwei@ise.neu.edu.cn。
