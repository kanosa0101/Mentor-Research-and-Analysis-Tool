title: 副教授
bio_raw: '王璐，女，1980年生，博士，东北大学计算机学院副教授，硕士研究生导师，IEEE会员，CCF会员。分别于2003年和2005年获得哈尔滨工业大学计算机科学与技术学士和硕士学位，2011年获得香港大学电子工程博士学位。2005年7月至2006年2月在香港理工大学做研究助理，2015年5月至2016年5月在美国加州大学梅喜德分校访问。主要从事计算机视觉，机器学习，医学信号处理等方向的研究。主持国家自然科学基金青年科学基金、辽宁省自然科学基金、教育部基本科研业务费青年种子基金、辽宁省科协中青年科技工作者国（境）外交流提升计划等多个项目，参与国家自然科学基金面上项目和香港RGC项目多项。以第一作者发表国际会议和期刊论文二十余篇，其中SCI检索的期刊论文6篇（包括JCR一区的IEEE
  Transactions长文3篇），获得辽宁省自然科学学术成果奖一等奖和二等奖各一项

  ，

  获得发明专利授权4项

  。现讲授“算法设计与分析”和“物联网专业英语”两门专业课。

  电子邮箱：wanglu@cse.neu.edu.cn。'
