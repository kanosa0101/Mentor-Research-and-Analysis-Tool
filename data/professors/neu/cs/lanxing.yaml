bio_raw: '兰星，

  男，

  博士，东北大学计算机科学与工程学院副教授，博士生导师。主要研究方向包括多模态大模型、图像

  /

  视频理解、具身智能等相关领域。

  2025年6月于中国科学院大学获工学博士学位

  ，

  曾公派赴新加坡国立大学访问交流

  ，

  获中国科学院院长奖、中国科学院朱李月华奖。在国际主流期刊与会议上发表论文

  20余篇，其中CCF-A/IEEE Trans.论文10余篇，授权国家发明专利2项。曾获3DMM最佳学生论文、ChinaMM最佳海报论文。参与多项国家自然科学基金重点项目及国际合作重点项目。

  目前担任

  IJCV、IEEE

  TIP

  、

  IEEE TII、ACM ToMM等SCI期刊审稿人。

  欢迎具有计算机、

  自动化

  、数学、机械等相关专业背景的学生报考。

  邮箱：

  lanx@cse.neu.edu.cn'
