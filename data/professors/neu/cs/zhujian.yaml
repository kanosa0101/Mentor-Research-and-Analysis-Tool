bio_raw: 朱剑，男，博士，讲师，1981年8月生，江苏扬中人。2010年毕业于东北大学计算机系统结构专业，获博士学位， 2010-至今在东北大学信息科学与工程学院任教。参编著作一本，在《软件学报》，《通信学报》，《电子学报》等刊物上发表论文15篇。作为课题负责人获批省部级项目两项，承担横向科研项目9项。Email：zhujian@ise.neu.edu.cn
