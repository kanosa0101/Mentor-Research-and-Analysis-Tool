bio_raw: '刘仡男，硕导，中国计算机学会数据库专委会执行委员，中国人工智能学会智能服务专委会委员。本科毕业于东北大学，硕博毕业于南开大学，攻博期间曾在牛津大学计算机系公派联合培养（

  2021.10 - 2022.11

  ）。目前研究工作主要关注于知识融合、数据集成、知识抽取、知识图谱、大语言模型等。在数据挖掘、数据库、人工智能等领域国际重要会议期刊（

  ACM SIGMOD

  、

  ACM SIGKDD

  、

  IEEE ICDE

  、

  ACL

  、

  AAAI

  、

  ACM CHI

  、

  WWW

  、

  IEEE TKDE

  、

  IEEE TDSC

  ）上发表论文

  10

  余篇。先后主持国家自然科学基金青年基金、辽宁省自然科学基金、中央高校基本科研业务费等项目。

  邮箱：

  liuyinan@cse.neu.edu.cn'
