title: 副教授
email: lubingxian@neu.edu.cn
bio_raw: '卢炳先，博士，东北大学计算机科学与工程学院副教授，博士生导师，主要研究方向为新型感知与计算、无线位置安全、工业大模型等，综合利用智能感知与无线定位等新方法来增强无线网络安全性与易用性。研究成果发表在国际知名期刊以及ACM
  SIGCOMM （CCF A类）、IEEE INFOCOM（CCF A类）等国际顶级会议。以第一及通信作者发表高水平论文20余篇，成果获发明专利授权12项。主持国家自然科学基金青年项目1项，辽宁省科技创新重大专项课题1项，大连市重点研发计划课题1项，参与国家自然科学基金重点项目2项。研究成果获得辽宁省科学技术进步二等奖，获2021年ACM
  科技新星奖。入选中国电子学会物联网青年专业技术组通信委员，担任WCMC等SCI期刊客座编辑与WASA（CCF C）等国际会议的技术委员会成员（TPC）。欢迎具有计算机科学与技术、软件工程、人工智能、网络工程、信息安全、数学等专业背景的同学报考。

  电子邮件：lubingxian@neu.edu.cn'
