title: 副教授
bio_raw: 李晓华 ，女，1969年5月生，副教授，中国计算机学会会员。1993年毕业于东北大学计算机科学与工程系计算机应用专业，获工学学士学位；2008年毕业于东北大学计算机软件与理论专业，获工学硕士学位；2010年就读于东北大学计算机软件与理论专业，攻读博士学位。1993年7月留校任教，主讲计算机安全与保密，信息安全基础等课程。
