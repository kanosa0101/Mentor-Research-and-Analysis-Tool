title: 副教授
bio_raw: '董晓梅：女，1970年5月出生，博士，副教授，硕士生导师，中国计算机学会信息保密专业委员会委员。1992年毕业于吉林大学计算机科学系，获理学学士学位。1995年毕业于东北大学计算机应用专业获得工学硕士学位。2004年毕业于东北大学计算机软件与理论专业获得工学博士学位。现任计算机软件与理论研究所副教授，主要学术方向为信息安全。自1995年以来，一直从事信息安全保密的教学和研究工作。作为负责人主持并完成了一项国家自然科学基金项目“无线传感器网络数据安全免疫模型研究”，主持并完成一项教育部中央高校基本科研业务费项目“僵尸网络犯罪数据特征分析及取证关键技术研究”，参与了国家自然科学基金项目、国家八六三课题、国家教委八五重点课题、国际合作项目等多项科研课题的研制与开发工作，主要包括国家863项目“面向CIMS领域的支持企业业务柔性集成的服务网格技术的研究”、“基于ASP模式支持企业动态联盟的使能系统”、“面向虚拟企业的信息集成技术的研究及基于CORBA/IIOP
  的原型系统的实现”、“海洋遥感信息可视化用户建模系统”以及教育部博士点基金课题“基于Web服务的电子商务平台的信息安全技术研究”等。曾获辽宁省科技进步奖一等奖一项、教育部自然科学奖二等奖一项、辽宁省科学技术奖三等奖一项、辽宁省教委科技进步奖一等奖一项、东北三省第四届CAI年会一等奖一项。先后在国内外重要学术期刊和学术会议上发表70余篇学术论文，其中多篇论文被SCI、EI和ISTP收录，出版专著两部，获得计算机软件著作权登记2项。曾于2004年12月赴香港参加由香港城市大学组织的“Croucher
  Foundation ASI: Cryptography and Wireless Security”高级研讨班。'
