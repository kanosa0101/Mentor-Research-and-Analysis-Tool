bio_raw: '冯时：男，副教授，博士，博士生导师。

  2011

  年于东北大学获计算机软件与理论博士学位，

  2009

  年至

  2010

  年间赴香港中文大学担任研究助理。目前担任中国中文信息学会青年工作委员会委员，中国中文信息学会社会媒体处理专委会委员，中国中文信息学会情感计算专委会委员，中国计算机学会

  自然语言处理

  专委会通讯委员。主要从事数据挖掘、机器学习和自然语言处理等方面的研究。主要研究方向包括：

  (1)

  面向社会媒体的情感分析。研究如何利用深度学习

  、大模型

  技术，检测、识别、分析与生成社会媒体

  数据

  中所蕴含的情感与情绪，并应用在网络舆情分析

  、聊天机器人

  等系统中。

  (2)

  情绪化、个性化

  对话

  系统。以人机情感交互

  、情感陪伴

  为目的，以深度学习

  、大模型

  技术为手段，研究如何将情绪与个性引入到对话系统中，获得更符合上下文

  情境

  以及情绪状态的回复

  ，实现人机共情

  。

  作为项目负责人承担（完成）国家自然科学基金面上项目

  2

  项，青年基金

  1

  项和教育部基本科研业务费项目

  2

  项；参与国家重点研发项目子课题

  1

  项，国家自然科学基金面上项目

  4

  项，

  973

  子课题

  1

  项。在

  ACL

  、

  AAAI

  、

  IJCAI

  、

  M

  M

  、

  SIGIR

  、

  WWW

  、

  EMNLP

  、

  C

  OLING

  、

  DASFAA

  、

  Knowledge and Information System

  、

  World Wide Web Journal

  、

  IEEE Transactions on Knowledge and Data Engineering

  、

  IEEE Transactions on Multimedia

  、

  IEEE Transactions on Neural Networks and Learning Systems

  等计算机学会

  A

  类

  /B

  类期刊会议发表（或合作）论文

  40

  余篇。目前担任

  IJCAI

  、

  AAAI

  、

  ACL

  等多个人工智能与自然语言处理国际会议程序委员会委员、高级委员

  、领域主席

  。获得辽宁省科技进步二等奖

  1

  项、学院小牛翻译奖教金、东软奖教金。参编教材

  3

  部。

  课题组主页：

  https://neu-datamining.github.io/

  个人主页：

  https://neu-datamining.github.io/cse/fengshi/

  http://faculty.neu.edu.cn/fengshi/

  发表论文：

  https://www.semanticscholar.org/author/Shi-Feng/2087586948

  谷歌学术主页：

  https://scholar.google.com/citations?hl=zh-CN&user=XjA2Le4AAAAJ

  电子邮箱：

  fengshi@cse.neu.edu.cn'
