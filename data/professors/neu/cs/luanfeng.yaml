bio_raw: '栾峰，男，1979年出生，工学博士，副教授，硕士生导师。2002年和2005年于东北大学，信息科学与工程学院，分获工学学士和硕士学位；2012年于韩国，首尔大学，电气工程与计算机科学学院，电气与计算机工学专业，获工学博士学位。现就职于东北大学，计算机科学与工程学院，通信与电子工程系。

  详细介绍请参见个人主页和博客，主页：http://faculty.neu.edu.cn/luanfeng，博客：http://blog.neu.edu.cn/luanfeng，电子邮箱：luanfeng@mail.neu.edu.cn'
