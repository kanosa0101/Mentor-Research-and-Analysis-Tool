bio_raw: '李传文，男，1982，教授，博士生导师，CCF数据库专委会执行委员，乌普萨拉大学、奥尔堡大学访问学者。主要研究方向为数据管理、云计算、大数据。作为项目负责人承担（完成）国家重点研发计划课题1项、子课题1项、国家自然科学基金面上项目1项、青年项目1项、教育部基本科研业务费项目4项、横向项目若干。第一作者在VLDB、ICDE、DASFAA等著名国际会议期刊发表论文50余篇，主编学术专著一部。担任多个国际期刊和国内一级学报审稿人。重视培养研究生的编程和解决实际问题的能力，毕业生多在百度、华为、京东、中兴等知名IT企业工作。

  E-mail：lichuanwen@mail.neu.edu.cn'
