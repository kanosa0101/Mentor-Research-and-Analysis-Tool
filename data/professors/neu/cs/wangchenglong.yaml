bio_raw: '王成龙，男，

  1996

  年

  10

  月生，

  2026

  年博士毕业于东北大学，师从肖桐教授与朱靖波教授。现为东北大学计算机科学与工程学院副教授。主要从事自然语言处理领域的研究，重点关注大语言模型对齐技术，包括奖励模型优化、高效强化学习、推理增强，以及多语言与多模态场景下的大语言模型对齐等方向。近年来在国际顶级会议或期刊发表学术论文

  20

  余篇，其中以第一作者发表

  12

  篇论文，包含

  7

  篇

  CCF A

  类论文，相关成果发表于

  NeurIPS

  、

  ICML

  、

  ACL

  、

  CVPR

  、

  AAAI

  等国际顶级会议。入选中国科协青年人才托举工程博士生专项计划，并担任

  ACL

  、

  EMNLP

  领域主席（

  Area Chair

  ），长期担任

  NeurIPS

  、

  AAAI

  、

  ACL

  、

  COLING

  等国际顶级会议审稿人。曾获

  EMNLP 2024 Outstanding Reviewer

  、

  CCL 2025 Highlight Poster

  、

  CCMT 2025 Highlight Poster

  等荣誉，并作为核心成员参与

  WMT2021

  国际机器翻译评测任务，获得英俄翻译冠军与高效翻译冠军。

  个人主页：

  https://wangclnlp.github.io/wangchenglong.github.io/'
