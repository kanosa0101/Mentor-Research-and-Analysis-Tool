bio_raw: '王斌

  :

  男，九三学社社员，现任东北大学计算机科学与工程学院，长聘教授、博士生导师，

  2011

  年入选辽宁省百千万人才，

  2018

  年入选沈阳市领军人才。先后在美国加州大学

  (

  两次

  )

  、香港中文大学、香港科技大学、香港浸会大学、澳大利亚新南威尔士大学、澳大利亚斯威本理工大学、新加坡南洋理工大学等多所大学进行合作访问。

  研究方向：

  数据质量分析与清洗、大数据管理与知识工程、分布式数据管理、社交网络分析、文本和时序数据处理与分析、机器学习和推荐算法等。

  研究成果：

  发表学术论文

  200

  余篇，其中，在

  CCF A

  类顶级会议和期刊上发表论文

  60

  余篇，包括

  SIGMOD

  、

  VLDB

  、

  ICDE

  、

  NeurIPS

  、

  AAAI

  、

  IJCAI

  、

  TODS

  、

  TKDE

  、

  TSE

  、

  TOIS

  、

  TASA

  等录用并发表，这些会议和杂志代表全球数据库、人工智能和软件工程方面的最高水平。并且，获得美国国家发明专利授权

  1

  项，中国国家发明专利

  25

  项，受理国家发明专利

  22

  项，撰写教材

  3

  部。主持和参与国家、省部级课题

  20

  余项，包括国家自然科学基金项目（重点和面上），国家重点基础研究发展计划（

  973

  计划），国家重点研究发展计划，教育部基础科研资助重点和预研项目，辽宁省重点和揭榜挂帅项目等。此外，还获国际会议最佳优秀论文奖

  4

  次，国内最佳优秀论文奖

  5

  次。

  电子邮箱：

  binwang@mail.neu.edu.cn'
