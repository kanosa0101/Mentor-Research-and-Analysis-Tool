bio_raw: '张高原，男，1977年4月出生，工学博士，信息与通信工程专业。

  2003年留校任教，现任职于东北大学计算机科学与工程学院通信与电子工程系，讲师。

  在《 Security and Communication Networks》 ，《PLOS ONE》等杂志上发表SCI检索论文多篇，拥有中国授权专利1项。目前感兴趣的研究方向有混沌图像加密技术，机器学习与无线信号处理，嵌入式系统等。

  邮箱：zhanggaoyuan@cse.neu.edu.cn'
