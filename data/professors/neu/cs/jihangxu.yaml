bio_raw: '季航旭，东北大学讲师，硕士生导师。本、硕、博毕业于东北大学，曾在东北大学信息科学与工程学院从事博士后研究工作（

  2022.11-2025.03

  ），目前研究方向主要关注于大数据管理与分析、分布式计算系统、数据湖等。在内外重要会议和期刊（

  IEEE IoTJ

  、

  IEEE ICDE

  、

  Information Sciences

  、

  FGCS

  、

  WWWJ

  、

  DASFAA

  、

  GeoInformatica

  、《软件学报》、《计算机研究与发展》等）上发表论文

  19

  篇，其中以第一作者发表论文

  10

  篇；公开国家发明专利

  20

  项；连续两年（

  2020

  、

  2021

  ）获得中国数据库学术会议（

  NDBC

  ）大会最佳论文奖；获得“互联网

  +

  ”大学生创新创业大赛辽宁省金奖、国家级铜奖。作为项目负责人主持国家自然科学基金青年基金项目、广东省基础与应用基础研究基金项目、辽宁省教育厅项目子课题、东北大学博士后基金等；作为骨干参与国家重点研发计划项目

  3

  项、国家“

  863

  计划”项目

  1

  项、国家自然科学基金重点项目

  3

  项。

  招生信息：每年招收硕士生

  2

  名，欢迎有兴趣的同学加入课题组。

  办公地点：东北大学浑南校区信息学馆

  B226

  办公室

  电子邮箱：

  jihangxu@mail.neu.edu.cn'
