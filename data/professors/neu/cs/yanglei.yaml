title: 副教授
bio_raw: '杨雷

  ，1974年4月生，男，辽宁营口人。中共党员，现任东北大学计算机科学与工程学副教授。针对大数据有效管理与利用的迫切需要，根据国家需求和跟踪国际学术前沿，紧扣“大数据管理”主题，以“分析业务流程优化”为主线，在交互式业务流程建模、分析应用性能优化、数据优化管理等方面进行系统深入地研究，并取得创新性学术成果。主持承担国家以及省部级等纵向科研课题6项，其中作为课题负责人承担国家科技支撑计划课题1项，发表论文50余篇。授权国家发明专利6项。获辽宁省自然科学学术成果一等奖1项、辽宁省科技进步二等奖1项、辽宁省高等教育学会优秀论文一等奖1项。

  研究方向

  ：云应用性能优化、机器学习、大数据分析技术。

  联系方式：手机13516045851；邮箱yanglei@mail.neu.edu.cn

  部分承担科研项目

  [1].    国家科技支撑计划，2015BAH09F02，健康大数据管理与分析服务支撑系统研发及应用，2015/04-2017/12，210万元，已结题，主持

  [2].    国家重点研发计划课题“面向高端装备制造领域的科技服务SaaS应用构建以及示范”中的“科技服务模式研究”子课题，2018/01-2020/12，进行中，主持

  [3].    教育部基础科研业务费项目，N130404011，云环境中基于资源使用行为的应用性能保证技术研究，2014/01-2015/12，已结题，主持

  [4].    辽宁省科技厅博士启动基金，20091022，环境依赖的组合服务QoS保证技术研究，2010/01-2011/12，已结题，主持

  部分 荣誉、奖励、专利与专著

  [1].    2006，面向中小企业的管控一体化平台及应用，辽宁省科技进步二等奖

  [2].    2010，Performance Prediction Based EX-Qos Driven Approach for adaptive Service
  Composition，辽宁省自然科学学术成果一等奖

  [3].    MapReduce 作业执行性能优化若干关键技术研究，东北大学出版社，2015.12

  [4].    2016年《基于大数据的课堂教学质量评价体系构建与实》 获得东北大学教学成果一等奖。

  [5].

  2017 《学生课堂教学质量评价应用研究》在辽宁省高等教育学会第八届学术年会获得优秀论文一等奖。

  [6].    2010，支持自适应调整的组合服务执行系统V1.0，软件著作权登记，登记号：2010SR066281

  [7].

  2010，控制流集中数据流分布的组合服务执行系统及执行方法，已授权，中国发明专利，第一发明人。中华人民共和国国家知识产权局，专利号：ZL 2010 1 0563748.4

  部分代表性论文

  [1].   Yang Lei, Dai Yu, et al.Optimized Speculative Execution to Improve Performance
  of MapReduce Jobs on Virtualized Computing Environment. Mathematical Problems in
  Engineering. Volume 2017, Article ID 2724531, 11 pages.

  [2].   Yang Lei, Dai Yu,  et al. Interactive K-Means Clustering Method Based on
  User Behavior for Different Analysis Target in Medicine. Computational and Mathematical
  Methods in Medicine. Volume 2017, Article ID 4915828, 9 pages.

  [3].   Yang Lei, Dai Yu, et al. MapReduce Scheduler by Characterizing Performance
  Interference.China Communications.2016.13(10)

  [4].   Yang Lei, Dai Yu,  et al. Characterizing Performance Interference for Performance
  Crisis Mitigation in the Virtualized environment      Intelligent Automation and
  soft computing.2016.  22(4) .

  [5].   Yang Lei, Dai Yu, et al. Performance Prediction Based EX-QoS Driven Approach
  for Adaptive Service Composition. Journal of Information Science and Engineering.
  2009，25(2): 345-362.

  [6].   杨雷，代钰等.一种基于执行环境特征的组合服务混合执行机制,东北大学学报，2015年12期，1682-1689.

  [7].   杨雷，代钰等. 考虑虚拟机间性能互扰的虚拟资源分配方法，通信学报，2014年第9期，79-90.'
