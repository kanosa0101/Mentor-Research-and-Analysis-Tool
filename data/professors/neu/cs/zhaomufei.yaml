title: 副教授
email: zhaomufei@mail.neu.edu.cn
bio_raw: '赵慕飞，副教授，博士生导师，中国通信学会、中国电子学会会员，入选第一届辽宁省青年科技人才托举工程项目。2018年6月及2024年9月分别获得哈尔滨工业大学

  通信工程专业工学学士学位和信息与通信工程专业工学博士学位。2022年-2023年以联合培养博士研究生身份访问加拿大英属哥伦比亚大学。

  主要研究方向包括：光量子检测及应用，量子通信，量子信息理论等。

  作为项目负责人主持辽宁省自然科学基金项目，国家资助博士后计划项目（B档），中央高校基本科研业务费项目等，参与国家自然科学基金面上项目等。

  在国内外知名期刊与会议发表论文十余篇，第一作者成果涵盖IEEE JSAC（IF=17.2）、IEEE TCOM（IF=8.3）、IEEE Network（IF=6.3）等权威期刊，

  曾获IEEE IWCMC2021最佳论文奖。曾任IEEE ICC、EAI AICON和EAI WiSATS等旗舰会议TPC member，及ICCT 2025光通信分会联合主席；

  并长期担任IEEE JSAC、IEEE TCOM等顶级期刊审稿人。担任《量子通信》课程负责人，译著《量子信息论》即将出版。

  【招生信息】2026研究生招生还有少量名额，欢迎对以上研究方向感兴趣的同学报考。有意者请邮件联系并附上简历。

  电子邮箱：zhaomufei@mail.neu.edu.cn

  个人主页：http://faculty.neu.edu.cn/zhaomufei/zh_CN/index.htm'
