bio_raw: '李福亮，博士毕业于清华大学计算机系，东北大学计算机学院教授、博士生导师，国家级高层次青年人才。担任华为中央研究院专家顾问、华为数通产品线智库顾问，

  CCF互联网专委会委员、CCF体系结构专委会委员。主要从事新一代互联网技术方向研究，近年来发表高水平学术论文60余篇，包括TON、TC、JSAC、TMC、SIGCOMM、NSDI、INFOCOM、ICNP等。申请发明专利20余项，出版学术专著5部、教材3部。作为项目负责人主持国家级项目7项，包括国家自然科学基金联合基金、面上、青年、科技部重点研发计划项目/课题/子课题等，主持互联网头部企业研究类项目10余项，包括华为公司、字节跳动、阿里巴巴、蚂蚁集团、中国电信。获辽宁省“兴辽英才计划”青年拔尖人才、辽宁省百千万人才工程万人层次、辽宁省通信协会优秀科技工作者、辽宁省优秀研究生导师团队、沈阳市中青年科技创新人才、华为公司“难题揭榜”火花奖、IEEE
  ICNP 2025 最佳论文、IEEE/ACM IWQoS 2025最佳学生论文提名等荣誉10余项。

  研究方向：

  一、

  大模型推理加速：集合通信优化、分布式推理、分布式

  KV缓存

  、通算融合

  二、

  大模型网络观测：集合通信观测、

  RDMA网络遥测、慢节点分析与故障定位

  三、

  网络配置大模型：配置合成、配置验证、配置翻译、配置推荐、配置核查

  联系邮箱：

  lifuliang207@126.com

  个人主页：

  https://fuliang-li.github.io/'
