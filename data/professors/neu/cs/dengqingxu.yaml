bio_raw: '东北大学计算机学院教授、博士导师，中国计算机学会嵌入式系统专委会副主任。辽宁省嵌入式软件重点实验室主任。教育部新世纪人才，辽宁省“兴辽人才”科技创新领军人才，政府津贴获得者。主要研究方向为实时嵌入式系统、可重构计算、CPS(信息物理系统)/物联网工程。在多核/多处理器实时嵌入式系统、物联网等领域，以负责人身份承担国家863计划项目、国家支撑计划、国家自然基金、国际合作基金、国家重点研发计划课题等项目30余项。相关成果已获得22项发明专利，
  2012年获得辽宁省技术发明一等奖（排名第三），2014年获得辽宁省科技进步一等奖（排名第一），2014年获得国家科技进步二等奖（排名第六），2022年获得辽宁省科技进步一等奖（排名第一）。已在相关领域的国内外著名期刊和会议上发表论文180多篇。多次担任嵌入式实时系统和设计自动化系统国际会议RTSS、DAC等多个国际会议的程序委员会委员和嵌入式软件国际会议ICESS2022
  General Chair。山东省、江苏省、浙江省、河北省、北京市、河南省科技奖励评审专家。

  实验室主页：http://www.neu-rtes.org/

  邮箱：dengqx@mail.neu.edu.cn'
