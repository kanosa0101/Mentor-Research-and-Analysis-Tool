bio_raw: 宋清洋，博士，教授，博导，教育部新世纪优秀人才。毕业于澳大利亚悉尼大学通信工程专业。担任IEEE Transactions on Vehicular
  Technology编委（Area/Associate Editor）、澳大利亚研究理事会（ARC）国际评委、IEEE车载技术协会（VTS） 2021年度最佳编委（Top
  Editor）。现任IEEE VTS 理事会成员，IEEE VTS Fellowship and Scholarship Committee 主席，IEEE VTS
  Distinguished Lecturer, IEEE高级会员。主要研究方向为异构边缘智慧网络、协作通信、网络资源管理等。已主持国家自然科学基金项目（包括重大研究计划培育类项目、面上项目）、工信部产业基础再造和制造业高质量发展专项项目子课题、国家攻关项目子课题、教育部博士点基金等10余个项目。在无线通信领域顶级期刊和国际旗舰会议上已发表或录用120多篇高水平学术论文，已获国家发明专利授权10多项，软件著作权3项。获辽宁省自然科学学术成果一等奖2项、辽宁省优秀硕士学位论文指导教师奖2项。已出版两本专业书籍。http://faculty.neu.edu.cn/songqingyang/zh_CN/index.htm
