bio_raw: '陈迪，博士，讲师。本、博毕业于东北大学

  ，主要从事大图数据管理与分析、数据库、时空众包等领域研究。近年来在ICDE、APWeb、软件学报等国内外重要期刊和会议发表论文6篇。作为负责人主持中央高校基本科研业务费项目一项，参与国家自然科学重点项目两项。

  研究方向：大数据管理、时空众包、数据库

  联系邮箱：

  dichenneu@gmail.com'
