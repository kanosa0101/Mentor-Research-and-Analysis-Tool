bio_raw: 郭楠，东北大学计算机学院人工智能系副教授。中国通信学会高级会员、中国计算机学会会员。2005年9月毕业于东北大学信息科学与工程学院，获得计算机应用技术专业博士学位。2010-2012年美国普渡大学访问学者。主要研究方向为数字身份管理、智能推荐、虚拟/增强现实。在数字身份管理方向，主持的课题包括国家自然科学基金项目、辽宁省博士科研启动基金项目、中央高校基本科研业务费项目、沈阳市科学技术计划项目等。在智能推荐方向，主要开展以深度学习和强化学习为核心、融合文本和图像特征的推荐算法研究与工程项目。在虚拟/增强现实方向，主持了涵盖VR/AR教育、VR/AR培训、数字孪生等领域的工程项目，并开展对渲染优化、3D模型重建、图像理解等方向的算法研究。持有国家发明专利6项，在国内外核心刊物发表论文30余篇。担任《算法设计与分析》、《高级算法与数据结构》课程负责人，2021年被评选为辽宁省一流本科课程。电子邮件guonan@mail.neu.edu.cn。
