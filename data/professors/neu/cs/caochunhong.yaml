bio_raw: '曹春红，女，

  1976

  年

  8

  月出生，毕业于吉林大学计算机科学与技术学院，获得计算机应用技术专业博士学位。现为东北大学计算机科学与工程学院副教授，人工智能系副主任兼党支部书记。中国计算机学会多媒体专委员会委员，中国图像图形学会多媒体专委会委员。担任科技部

  863

  计划信息技术领域虚拟现实专题会评组专家，同时担任

  863

  计划信息技术领域真三维视频实时获取与生成专题会评组专家。迄今在国内外核心刊物发表论文

  50

  余篇，多篇被

  SCI

  检索。担任多个期刊及会议的评审。担任第四届全国几何设计与计算学术会议程序委员会委员，第

  18

  届全国多媒体学术会议程序委员会委员，第五届中国数据挖掘学术会议程序委员会委员等多个会议的委员。主持国家自然科学基金、国家博士后基金、国家博士后特别资助、辽宁省自然科学基金等多个国家级和省部级的项目。

  2009

  年入选“辽宁省百千万人才工程”千人层次。

  2017

  年入选“

  沈阳市高层次人才拔尖人才”。电子邮件

  caochunhong@cse.neu.edu.cn

  。

  主要研究方向为计算机图像处理、计算机图形学、计算机辅助设计等，包括但不限于：图像风格转换、人体姿态识别、目标检测及识别、图像语义分割等。'
