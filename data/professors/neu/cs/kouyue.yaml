title: 教授
bio_raw: 寇月，女，东北大学计算机科学与工程学院教授、博士生导师，中国计算机学会高级会员及信息系统专业委员会、数据库专业委员会委员。本硕博均毕业于东北大学计算机专业，曾于2018至2019年赴美国杨百翰大学担任访问学者。研究领域包括推荐系统、社交计算与数据集成等。主持国家自然科学基金面上项目2项、青年项目1项及多项中央高校基本科研业务费项目。近年来，以第一或通讯作者在ICDE、CIKM、EDBT、DASFAA、ICME、WWWJ、JCST、TORS、《计算机学报》、《软件学报》等国内外顶级期刊与会议上发表数十篇高水平论文，并荣获DASFAA
  2025最佳论文、WISA 2020/2021最佳及优秀论文等多项学术殊荣。曾获辽宁省研究生教学成果奖二等奖、辽宁省高校教师教学创新大赛三等奖等荣誉，指导学生在ACM-ICPC、CCF创新设计大赛等赛事中屡获佳绩，其所在团队被评为“辽宁省优秀研究生导师团队”。
