title: 副教授
bio_raw: 刘学：男，博士，东北大学计算机学院副教授。2006年7月于浙江大学获工学学士学位，2011年12月于浙江大学获工学博士学位。博士毕业后，进入中国航天科技集团公司第八研究院工作，2012年11月来东北大学工作至今。主要研究方向为基于FPGA的嵌入式系统设计，其涉及的领域包括：软件无线电、图像与视频处理等。所取得的研究成果已在国际期刊及会议上发表论文5篇（其中被SCI索引5篇）。
