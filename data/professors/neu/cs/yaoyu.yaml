bio_raw: 姚羽，男，1976年生，博士，教授，博士生导师，教育部“新世纪优秀人才”，现担任东北大学信息学院院长助理、计算机系统研究所副所长。分别于1998年、2001年、2005年于东北大学获得工学学士、工学硕士、工学博士学位。主要研究方向包括：网络安全、恶意软件、非线性动力系统分析。作为课题负责人获得国家自然科学基金、教育部“新世纪优秀人才资助计划”、教育部中央高校基本科研业务费、辽宁省自然科学基金、辽宁省优秀人才资助计划等项目资助，主持或参加国家自然科学基金、国家“863”高科技计划、辽宁省科技计划等各类横纵向科研课题10余项，近5年科研经费200余万元。在Mathematical
  and Computer Modelling、Computers & Electrical Engineering、Discrete Dynamics in Nature
  and Society等相关领域的SCI、EI检索期刊及国内外学术会议上发表文章30余篇，被 SCI、EI和ISTP 等收录论文20余篇次，出版教材3部。中国计算机学会高级会员，ACM会员，CCF
  YOCSEF（中国计算机学会青年计算机科技论坛）沈阳分论坛副主席，候任主席。担任Computers & Electrical Engineering，Mathematical
  and Computer Modelling，International Journal of Mathematics and Mathematical Sciences，China
  Communications等国际期刊的审稿人。电子邮箱：yaoyu@mail.neu.edu.cn。个人网页：http://faculty.neu.edu.cn/yaoyu/
