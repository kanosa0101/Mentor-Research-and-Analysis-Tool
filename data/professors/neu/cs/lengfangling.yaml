title: 讲师
bio_raw: 冷芳玲（1978-），女，辽宁锦州人，东北大学讲师，CCF会员。2008年于东北大学计算机软件与理论专业获得博士学位。曾参与国家基金研究项目、中小企业基金项目、国家海洋局信息中心委托研究开发项目等。其中参与完成的“面向先进制造企业的综合数据挖掘系统ScopeMiner”获得了辽宁省优秀软件产品奖。在国家海洋局专项项目“海洋数据体系规划和海洋数据仓库构建技术”的开发中作为主要负责人完成了数据仓库的建模和设计实现。在“Lecture
  Notes in Computer Science”、“Journal of Computing Science and Engineering”、“计算机科学”等科技期刊和DaWak、WAIM
  等国际、国内学术会议上发表多篇学术论文。
