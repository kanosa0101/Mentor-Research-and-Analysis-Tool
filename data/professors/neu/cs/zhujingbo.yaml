bio_raw: '朱靖波，1999

  年

  9

  月博士毕业于东北大学计算机软件与理论专业，同年

  11

  月留校受聘于东北大学，现任计算机科学与工程学院教授、博士生导师，自然语言处理研究方向学术带头人。社会学术兼职有：科大讯飞

  AI

  大学首批特聘教授、中国中文信息学会常务理事等。

  2004-2005

  年曾在香港城市大学访问研究，

  2006-2007

  年曾在美国南加州大学开展国家公派访问学者研究。入选教育部新世纪优秀人才和辽宁省百人层次人才计划。从

  92

  年开始一直从事语言分析和机器翻译基础性研究工作，先后发表

  100

  多篇学术论文。主持研制的国际学术界知名机器翻译开源系统

  NiuTrans

  ，

  2016

  年荣获国内自然语言处理领域最高奖

  -

  钱伟长中文信息处理科学技术一等奖，已经共享给七十多个国家的

  2000

  多家大学和企业研究机构免费研究。主持研制的小牛翻译系统是目前世界上支持语种最多的机器翻译系统（

  118

  种语言到中文双向翻译），在国际最顶级机器翻译评测比赛

  WMT2018

  的中英翻译人工评价上荣获第一和英中

  /

  中英双向翻译自动评价上双获第二。主持研制的小牛翻译云平台入选国家首批人工智能与实体经济深度融合创新项目。小牛翻译已经为包括科大讯飞、联通、腾讯、携程、京东、国家专利局、国家民委等五十多个企事业单位提供了机器翻译技术服务，逐渐成为了国内机器翻译产学研的领头羊。

  联系方式：

  地址：辽宁沈阳东北大学

  (

  浑南校区

  )

  计算机科学与工程学院

  110004

  邮箱：

  zhujingbo@mail.neu.edu.cn

  主页：

  http://www.nlplab.com/members/zhujingbo.html'
