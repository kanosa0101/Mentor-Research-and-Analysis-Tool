bio_raw: "张新晨，东北大学计算机学院副教授，博士生导师、硕士生导师。博士毕业于香港大学电机与计算机工程系，本科毕业于哈尔滨工业大学（深圳）自动化系。与香港大学、哥伦比亚大学、芝加哥大学、香港科技大学、香港理工大学、南方科技大学等海内外高校保持密切学术合作。\n\
  研究兴趣聚焦于人工智能与安全的交叉领域，以及\nAI\n驱动的智慧健康。具体包括：\n1\n）网络与系统安全：基于机器学习\n/\n深度学习\n/\n大模型的入侵检测、物联网系统安全防御；\n\
  2\n）\nAI\n安全与可信智能：大模型与智能体安全、可信\nAI\n；\n3\n）\nAI for Healthcare\n：智慧医疗、基于机器学习\n/\n\
  深度学习\n/\n大模型的医学信号与影像智能分析。\n近年来，在\nIEEE INFOCOM\n、\nIEEE TDSC\n、\nACM UbiComp\n、\n\
  ACM UIST\n、\nIEEE TVCG\n等\nCCF\x1EA\n类国际顶级会议与期刊发表发表多篇论文。授权及登记多项发明专利和计算机软件著作权。参与国家自然科学基金重大研究计划培育项目、深圳市重点实验室项目等多项国家及省部级科研项目。担任\n\
  IEEE INFOCOM\n、\nACM SenSys\n、\nIPSN\n、\nIEEE ICDCS\n等国际会议及\nIEEE TII\n等期刊审稿人。\n\
  本科、研究生招生信息：\n欢迎对网络入侵检测与自适应安全防御、大模型\n/\n智能体安全（\nLLM & Agent Safety\n）、\nAI\n驱动的智慧健康（\n\
  AI for Healthcare\n）方向感兴趣的研究生同学联系。\n2026\n年\n9\n月入学硕士仍有名额，欢迎咨询。\n同时欢迎对科研感兴趣的本科生入组科研，参与科研训练、论文发表与项目实践，为升学与发展打下坚实基础。\n\
  有意者请将个人简历发送至邮箱：\nzhangxinchen@cse.neu.edu.cn\n。"
