bio_raw: '贾杰，教授，博士生导师，中国物联网专委会委员，中国通信学会高级会员，中国计算机学会会员，第十届辽宁省青年科技奖获得者，辽宁省“兴辽英才计划”青年拔尖人才。主要研究方向包括

  5G

  网络、

  物联网与大数据分析、

  云边协同、人工智能、移动定位等。作为项目负责人与骨干承担国家重点研发计划、国家自然科学基金重大研究计划、国家自然科学基金面上项目、教育部中国移动联合基金项目、辽宁省科技厅和企事业合作课题等

  20

  余项。在

  IEEE Journal of Selected Areas in Communications

  、

  IEEE Trans. on Communications

  、

  IEEE Trans. on Wireless Communications

  、计算机学报、软件学报、电子学报等国内外著名期刊与会议上发表论文

  100

  余篇。授权国家发明专利

  20

  余项。指导的硕士研究生多人获辽宁省优秀硕士学位论文以及东北大学优秀硕士学位论文。现担任数十个国内外学术期刊的审稿人以及著名国际会议的程序委员会委员。曾获教育部技术发明二等奖、辽宁省科技进步二等奖、第十届辽宁省青年科技奖、辽宁省优秀硕士指导教师、辽宁省及沈阳市自然科学学术成果奖等。

  Email

  ：

  jiajie@mail.neu.edu.cn

  。'
