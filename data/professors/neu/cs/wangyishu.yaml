bio_raw: '王一舒，博士，讲师。2022年博士毕业于东北大学计算机科学与工程学院计算机软件与理论专业，曾于2019年11月至2020年11月赴澳大利亚新南威尔士大学交流学习。主要研究方向为大规模图数据管理与分析、时空数据管理与分析等，在VLDB、TKDE、ICDE、Information
  Sciences、《计算机研究与发展》等国内外顶级会议和期刊发表多篇论文。作为项目负责人主持国家自然科学基金青年基金项目、中国博士后科学基金面上项目、以及中央高校基本业务科研费等。

  电子邮箱：wangyishu@mail.neu.edu.cn

  个人主页：http://faculty.neu.edu.cn/wangyishu'
