title: 教授
bio_raw: '任飞亮，东北大学教授、博士生导师、剑桥大学访问学者，中文信息学会语言与知识计算专业委员会委员，

  “东北大学知识图谱研究组”团队负责人。主要研究方向包括：智能问答、知识图谱构建、大模型技术等。

  以第一作者发表数十篇高水平学术论文，包括清华大学计算机推荐论文

  A类论文、CCF A、CCF B、CCF C、以及ACM Transactions论文多篇。主持多项国家级、省部级科研项目。曾获2016-2018年度东北大学优秀教师、2017年度东北大学计算机学院管理工作贡献奖和教学改革创新奖、2016年度东北大学计算机学院学科建设工作优秀奖、

  2023年“东北大学毕业生就业工作先进个人”

  、

  2022-2024年度东北大学“三育人”先进个人等称号。

  带领研究团队多次参加国内外各类顶级学术竞赛，并取得多项优秀成绩。包括：（

  1

  ）

  2022年，工业和信息化部、科学技术部、深圳市人民政府主办的首届兴智杯全国人工智能创新应用大赛，在多模态技术创新赛中的图像描述生成任务中获竞赛三等奖

  ；（

  2

  ）

  中国中文信息学会、中国计算机学会和百度公司联手举办的

  “2021语言与智能技术竞赛：多形态信息抽取任务”第4名(共1690支参赛队伍)；（3）中国中文信息学会、中国计算机学会和百度公司联手举办的“2020语言与智能技术竞赛：机器阅读理解”任务第3名(共1514支参赛队伍)、“关系抽取”任务第5名(共1166支参赛队伍)；（4）中国中文信息学会、中国计算机学会和百度公司联手举办的“2018机器阅读理解技术竞赛”第3名(1062支参赛队伍)；（5

  ）

  CCKS2018(2018全国知识图谱与语义计算大会) “微众银行智能客服问句匹配大赛”第1名(共259支参赛队伍)、“面向音乐领域的命令理解任务”第2名(共75支参赛队伍)。

  主持完成并开源了国内第一个面向中文、面向学术、多领域的大型知识图谱知识库

  TechKG(

  www.techkg.cn

  )，该知识库自2018年12月底上线以来，已被国内外研究机构累计下载近万次。在TechKG的基础上，上线了大型知识图谱演示网站“爱图谱”(www.neukg.com)，目前该网站每日查询请求量近1万。

  2023年6月带领研究团队成功研发大语言模型TechGPT，并于2023年11月完成在纯国产软硬件平台的适配与升级迭代。TechGPT是国内最早一批以高性能“知识图谱构建”与“智能问答”为主要研发目标的大语言模型，具有较强的文本语意理解能力和逻辑推理能力。该大语言模型成果被新华社进行了专门报道，相应报道被财联社、凤凰网、钛媒体等多家权威媒体转载。同时，TechGPT大语言模型成果也受到辽宁省和沈阳市科技主管部门的认可，获评“辽宁省人工智能标杆应用场景”、“沈阳市人工智能示范应用场景”等称号。

