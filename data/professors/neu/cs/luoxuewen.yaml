bio_raw: '罗雪文，男，工学博士，副教授。研究领域聚焦无线通信、信息安全、语义通信、通信感知一体化等

  B5G/6G

  移动通信关键技术。

  作为第一作者

  在

  IEEE Communications Surveys & Tutorials

  （

  IF:46.7

  ）、

  IEEE Wireless Communications

  （

  IF:11.6

  ）、

  IEEE Transactions on Wireless Communications

  （

  IF:10.7

  ）、

  IEEE Transactions on Vehicular Technology

  （

  IF:7.1

  ）、

  IEEE Network

  （

  IF:6.3

  ）等通信领域旗舰期刊上发表论文

  8

  篇，其中

  ESI

  高被引论文

  1

  篇，在通信领域知名会议

  IEEE/CIC ICCC

  上发表一作论文

  1

  篇，授权发明专利

  2

  项。作为负责人主持博士后面上项目、中央高校基本科研业务费项目

  等

  ，参与国家自然科学基金面上项目、重点项目、黑龙江省自然科学基金优青项目

  等

  。长期担任

  IEEE JSAC

  、

  IEEE TWC

  、

  IEEE TCOM

  、

  IEEE TVT

  、

  IEEE WCM

  、

  IEEE Communications Magazine

  、

  IEEE Network

  、

  Nature Reviews Electrical Engineering

  等通信领域顶级期刊审稿人。担任国际会议

  ACC6G 2026

  Program Committee Chair

  、

  RSGPA 2026

  Publication Chair

  、

  IEEE ICCT 2025 Tutorial Chair

  等。

  电子邮箱：

  luoxw@cse.neu.edu.cn

  个人主页：

  http://faculty.neu.edu.cn/luoxw0/zh_CN/index.htm'
