title: 教授
bio_raw: '杨金柱，男，教授，博士生导师，美国科学院Cozzarelli奖联合获得者，东北大学计算机学院常务副院长，计算机软件国家工程研究中心常务副主任，医学影像智能计算教育部重点实验主任，美国霍华德休斯医学院博士后，东北大学人工智能专业负责人，中国人工智能教育联席会理事，辽宁省人工智能学会理事，人工智能学会智慧医疗专委会常委，中国图形图像学会医学影像专委会委员，人工智能学会智能服务专委会委员，肿瘤人工智能专委会委员，中国计算机学会高级会员；主要研究方向人工智能、影像处理与分析，医学数据分析，医学影像重建与优化、三维可视化与高性能计算等方面的研究工作；先后主持国家科技支撑计划重点项目项、国家重点研发课题、自然基金项目、辽宁省及沈阳市项目累计20余项；先后入选辽宁省高校杰出青年学者成长计划，辽宁省百千万人才“千”层次，沈阳市中青年科技创新人次；先后获教育部科技进步二等奖1次，辽宁省科技进步一等奖2次，辽宁省科技进步二等奖1次，沈阳市科技进步一等奖1次，电子学会电子信息科学技术二等奖1次，辽宁省教学成果二等奖，东北大学教学成果二等奖4次，东北大学创新活动优秀指导教师3次,东北大学五四青年奖1次；在MRI、BMC
  Bioinformatics、PNAS、PR等国际期刊发表SCI/EI检索论文50余篇；先后主持研发过 CT医学影像工作站、PET/CT影像工作站、PACS、云诊断系统等多类软件产品，具有多年软件产品研发经验。

  联系方式:yangjinzhu@cse.neu.edu.cn'
