bio_raw: '宋伟，博士，硕士生导师。

  2022

  年博士毕业于东北大学通信与信息系统专业。

  主要研究方向为多媒体信息安全以及隐私保护深度学习。截至

  2025

  年底，在

  ESWA

  、

  Information Sciences

  、

  JISAS

  等期刊发表论文

  20

  余篇，其中第一

  /

  通讯作者

  11

  篇，包括

  ESI

  高被引论文

  2

  篇（

  2023,2025

  ）。

  学生指导：指导硕士生获国家奖学金（

  2025

  ），获东北大学本科毕业设计优秀指导教师（

  2025

  ）。

  科研

  &

  教学项目：主持辽宁省纵向课题项目

  1

  项，中央基本科研业务费

  2

  项，东北大学校级课程改革项目

  1

  项。

  学术兼职：

  Associate Editor, Expert Systems (Wiley) (SCI, JCR Q2), 2026.2

  —至今；

  Guest Editor, Future Internet (ESCI, JCR Q2), 2025

  —

  2026

  。

  招生信息：每年招收硕士研究生

  2

  名。欢迎各位同学选择我作为导师，我的指导风格是开会只聊干货，主打分工明确，高效沟通，完成毕业条件即可实习。

  联系邮箱

  songwei@mail.neu.edu.cn

  。'
