bio_raw: '雷为民，男，

  东北大学计算机科学与工程学院教授，

  博士生导师

  ，沈阳市

  “兴沈英才”杰出人才（B类）

  。

  1992年南开大学获理学士学位，1995年在中国科学院沈阳计算技术研究所获工学硕士学位，1999年大连理工大学获工学博士学位。曾先后担任中

  国

  科

  学

  院沈阳计算所系统与软件室副主任、网络与通信部主任、副所长，

  东北大学通信与信息系统研究所所长、通信与电子工程系主任

  、

  辽宁省通信学会副理事长等职。中国通信学会高级会员、

  中国计算机学会高级会员

  、

  《小型微型计算机系统》编委

  。长期从事工业实时通信、

  IP通信信令和多媒体智能业务技术研究。主持完成了

  2

  0多项科研项目，作为项目负责人，主持完成“国家重点研发计划项目（软件定义的工业异构网络融合关键技术与设备研发2018YFB1702000）”；获授权发明专利22项；

  获辽宁省科技进步二等奖

  2项、三等奖1项；

  已

  发表论文

  1

  6

  0多篇

  。目前主要研究方向包括视频语义压缩、智能业务网络技术、多媒体信号处理等。

  Email：leiweimin

  @

  mail.neu.edu.cn'
