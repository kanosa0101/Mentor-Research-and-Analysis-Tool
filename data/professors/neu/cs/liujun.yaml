title: 教授
bio_raw: '刘军，男，博士，教授，在科研方面，长期从事未来网络、AI大模型、无线移动自组织网络、天基信息网络、天空地一体化网络、传感器网络等方面的研究工作，研究方向广泛应用在航空航天、应急救援、智能交通等领域。作为项目负责人主持并完成七项国家高技术研究发展计划863课题，两项国家自然科学基金课题等多个国家级科研项目，与高校、科研院所等单位开展广泛的项目合作。

  电子邮件：liujun@cse.neu.edu.cn。'
