title: 副教授
supervisor: 博导、硕导
bio_raw: '易波，男，博士，副教授，硕导/博导：

  （1）研究方向：主要从事下一代互联网技术、新型服务编排与计算、SDN/NFV、路由、资源分配等相关研究。（面谈）

  （2）学术成果：在国内外权威期刊上一作或参与发表论文40余篇。（能发论文）

  （3）项目情况：主持和参与若干基金项目。（饿不死，吃不饱）

  （4）团队情况：目前拥有一批青春有活力的中坚力量。（三年期流动人口）

  （5）社会服务：中国计算机学会会员、IEEE会员、某些学术期刊审稿人。（呼之则来，挥之则去）

  （6）联系邮箱：yibo@cse.neu.edu.cn（非诚勿扰！）

  课题组长期招收相关专业硕博士，欢迎有意向从事网络方面研究的同志加入！

  http://faculty.neu.edu.cn/~eEnmqi/zh_CN/index.htm'
