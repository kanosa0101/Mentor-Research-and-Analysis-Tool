bio_raw: '彭玉怀，

  教授

  ，

  博士生导师。

  长期

  从事

  无线通信、智能信息网络、物联网

  /

  大数据

  /

  人工智能、智联网（

  AIoT

  ）、信息物理系统（

  CPS

  ）、云计算

  /

  边缘计算、复杂体系建模与仿真等多学科交叉方向的研究工作

  。

  作为负责人承担国家重大专项课题、国家重点研发计划课题

  /

  子课题、国家

  973

  预研课题、国家科技支撑计划课题、

  NSFC

  重大研究计划课题、国家自然科学基金（面上、青年）、教育部中国移动联合基金、中国博士后基金、国家电网科技项目等

  30

  多项。相关成果已获得

  10

  项发明专利，

  6

  项软件著作权，辽宁省科技进步二等奖

  1

  项。

  在

  IEEE Transactions on Industrial Informatics

  、

  IEEE Transactions on Network Science and Engineering

  、

  IEEE Transactions on Intelligent Transportation Systems

  、

  IEEE Internet of Things Journal

  等

  SCI

  收录的权威国际期刊、国际会议上发表论文

  6

  0

  余篇

  （

  ESI

  高被引论文、热点论文各

  1

  篇）

  。

  常年招收通信

  /

  计算机

  /

  软件工程相关专业背景的博士后、博士生和硕士生，待遇优厚。

  研究方向关键字；

  智能信息网络；无线通信；物联网

  /CPS

  ；

  云计算

  /

  边缘计算；复杂体系建模与仿真。

  Email

  ：

  pengyuhuai@

  c

  se.neu.edu.cn'
