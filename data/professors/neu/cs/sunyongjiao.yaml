title: 教授
bio_raw: '孙永佼，男，长聘教授，博士生导师。辽宁省数字职教研发中心主任，中国人工智能学会理事会会员，中国计算机学会会员。

  2020

  年获辽宁省青年拔尖人才，沈阳市领军人才。主要研究方向为：大数据管理与分析（非结构化数据管理与分析、图数据管理与分析、社会网络管理与分析）、数据共享与定价、机器学习、不确定数据管理、分布式数据管理。

  主持国家重点研发计划课题

  1

  项、国家自然科学基金面上项目

  2

  项、国家自然科学基金青年基金项目

  1

  项、辽宁省科技计划项目

  2

  项、国家支撑计划重点项目子课题

  1

  项、国家重点研发计划子课题

  1

  项、武汉大学开放基金项目

  1

  项。作为主要人员参加国家自然基金重点项目、重点研发计划课题、国家

  863

  计划和国家

  973

  项目子课题等

  10

  多项。在

  VLDBJ

  、

  TKDE

  、

  TPDS

  、

  NEUCOMPUTING

  、

  World Wide Web Journal

  、

  Information Sciences

  、

  Complexity

  、

  Neural Computing and Applications

  、

  DASFAA

  、

  WAIM

  、

  APWeb

  、计算机学报、东大学报等国内外重要学术会议和期刊上发表论文

  60

  余篇，获得发明专利十余项，出版学术专著

  1

  部。

  2014

  年获辽宁省科技进步一等奖，

  2017

  年获教育部科技进步一等奖，

  2020

  年获电子学会自然科学一等奖。

