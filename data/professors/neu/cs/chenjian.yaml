bio_raw: '陈剑，男，教授，博士生导师，教授，

  IEEE Member，中国通信学会高级会员，中国计算机学会会员，沈阳市优秀科技工作者，辽宁省通信协会优秀科技工作者，英国伦敦国王大学访问学者。主要从事5G/B5G/6G、智能物联网、人工智能、智慧医疗、智慧检务等多学科交叉研究工作。作为项目负责人主持国家重点研发计划课题、国家自然科学基金、辽宁省重点研发计划以及企事业合作项目20余项。近年来，在IEEE
  Journal on Selected Areas in Communications、

  IEEE Trans. on Information Forensics and Security

  、

  IEEE

  Trans. on Wireless Communications、IEEE

  Trans

  . on Communications

  、

  IEEE

  Trans. on Vehicular Technology、GLOBECOM等国内外重要学术期刊和会议上发表相关学术论文50余篇。荣获教育部科技进步一等奖、中国计算机学会科技进步一等奖、辽宁省技术发明一等奖、教育部技术发明二等奖、辽宁省科技进步二等奖（2项）等。担任国际知名期刊及会议的审稿专家或TPC

  Member。

  Email: chenjian@mail.neu.edu.cn'
