title: 讲师
bio_raw: 王会珍，博士，讲师。女，汉族。 2002年起，一直致力于文本分析处理方面的研究与开发工作，目前担任中国中文信息学会青年工作委员会委员。作为项目负责人承担一项国家自然科学基金项目，一项国家重点实验室开放课题项目，两项东北大学基础科研项目。曾作为主要研发人员参加国家自然基金课题、国家863计划项目、国家242计划项目的申请及研究。在国内外期刊杂志和学术会议上发表三十多篇学术论文，包括国际计算语言学领域顶级国际学术会议Coling、IEEE-NLPKE、IJCNLP、ICCPOL、《软件学报》、《中文信息学报》等著国内期刊。研究成果曾获得辽宁省科技进步三等奖(2004)。作为评测小组的主要负责人之一参加了2010年在中国北京举办的国SIGHAN人名消歧评测（取得第一名的成绩）。
