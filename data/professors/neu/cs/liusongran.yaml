bio_raw: '刘松冉，博士，香港理工大学博士后。研究方向包括实时操作系统、机器人操作系统ROS 2的优化与设计，机器人视觉导航，以及嵌入式AI相关技术。近五年来在RTSS、DAC、DATE、EMSOFT、TCAD等计算机系统与嵌入式系统领域CCF
  A/B类高水平期刊与会议发表论文10余篇。主持国家自然科学基金青年基金（C类）1 项、省部级课题2项、国防军工课题4项；参与国家重点研发计划1项，横向课题2项。曾获国际程序自动化设计会议DATE（CCF
  B）最佳论文提名。

  更多信息请访问https://liusongran.github.io/，或邮件联系：liusognran@cse.neu.edu.cn。'
