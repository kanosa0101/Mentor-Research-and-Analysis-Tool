bio_raw: '霍树伟，副教授，博士

  &

  硕士生导师。

  2024

  年

  3

  月博士毕业于天津大学自动化学院信息与通信工程专业。主要从事图像

  /

  视频处理、深度学习理论及应用相关研究。近年在

  IEEE Transactions on Neural Network and Learning System (TNNLS), IEEE Transactions
  on Cybernetics (TCYB), IEEE Transactions on Circuit Systems for Video Technology
  (TCSVT), IEEE Transactions on Multimedia (TMM), IEEE Transactions on Geoscience
  and Remote Sensing (TGRS)

  等权威国际期刊发表学术论文

  30

  余篇；授权发明专利

  5

  项；

  作为项目负责人

  主持国家自然科学基金项目、

  国家重点研发计划子课题、

  辽宁省自然科学基金

  等

  项目，作为骨干人员参与国家重点研发计划、国家自然科学基金联合基金重点项目、国家自然科学基金面上项目

  多

  项；担任

  ICCV

  、

  ECCV

  、

  CVPR

  、

  IEEE TCYB

  、

  IEEE TMM

  、

  IEEE TCSVT

  、

  KNOSYS

  、

  ESWA

  等权威期刊

  /

  会议审稿人；担任

  SCI

  期刊

  Electronics

  客座编辑；获中国电子教育学会（国家一级学会）优秀博士学位论文奖、中国电子学会（国家一级学会）优秀硕士学位论文奖、青岛市科学技术进步一等奖等奖项。任

  IEEE/

  中国图像图形学会

  (CSIG)/

  中国人工智能学会

  (CAAI)/

  中国电子教育学会会员。

  电子邮箱：

  huosw@cse.neu.edu.cn'
