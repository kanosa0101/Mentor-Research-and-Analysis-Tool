bio_raw: '易秀双，男，

  1969

  年

  9

  月生，博士，教授。毕业于东北大学计算机科学与技术专业，获博士学位，毕业后留校工作至今。现任东北大学计算机科学与工程学院教授，兼任东北大学信息化建设办公室主任，中国计算机学会高级会员、互联网专业委员会委员，中国高教信息化学会常务理事，辽宁省互联网学会常务理事，沈阳市拔尖人才。主要研究领域为计算机网络、互联网及其应用技术、网络与信息安全、数据处理等。

  长期从事计算机网络、互联网及其应用技术、网络与信息安全、数据处理等方向的一线教学、研究和工程设计工作。参与并完成

  CERNET

  东北地区主干网、东北大学校园网络主干网的设计、规划、建设和管理工作。作为主要完成人，参与并完成中国教育科研网格计划东北大学网格节点的建设、

  CERNET2

  东北地区主干网的建设和管理、网格平台管理和网格关键技术研究等工作。近年来，作为项目负责人完成国家自然科学基金、国家科技支撑计划、国家计划专项等省部级以上科研项目

  5

  项，作为执行负责人完成了国家自然科学基金、

  863

  、科技支撑计划、

  242

  信息安全计划、国家专项计划等项目

  10

  余项。获省部级以上科技进步奖和教学成果奖各

  2

  项。编写《新一代互联网原理、技术及应用》、《计算机硬件技术基础》、《高级语言程学设计》等教材

  5

  部，在国内外重要学术期刊和学术会议上发表论文

  50

  余篇，其中被三大检索系统收录

  30

  余篇。 电子邮件：

  xsyi@mail.neu.edu.cn'
