bio_raw: '陈默，女，

  1983

  年

  1

  月出生，中国计算机学会会员，基础教学部专任教师，主讲课程：高级程序语言设计（

  C

  语言、

  Python

  语言）、数据科学基础。

  2012

  年于东北大学获计算机软件与理论博士学位。主要研究领域为教育大数据分析、地理社交网络分析与挖掘等。作为项目负责人主持完成国家自然科学基金项目、辽宁省自然科学基金项目、中央高校基本科研业务费项目，作为项目骨干参与国家自然科学基金委及广东大数据科学中心联合重点项目、国家自然科学基金面上项目、国家

  973

  课题、辽宁省高等教育教学改革研究课题等项目。曾获辽宁省科技进步奖二等奖

  1

  项、辽宁省自然科学学术成果三等奖

  1

  项、沈阳市自然科学学术成果一等奖

  1

  项。近年来，在

  JCST

  、软件学报、计算机学报、

  IJCS

  等国内外重要学术刊物和会议上发表学术论文，并在国内重要教学期刊发表教改论文，其中多篇被

  SCI

  、

  EI

  、

  ISTP

  收录。

  电子邮箱：

  chenmo@mail.neu.edu.cn'
