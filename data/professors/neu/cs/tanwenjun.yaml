bio_raw: '覃文军，男，

  1983

  年生，教授，博士生导师，九三学社成员，研究方向为人工智能、计算机辅助医疗、计算机视觉、虚拟现实等。担任计算机软件国家工程研究中心副主任兼计算机科学与工程学院副院长，兼任中国胸外科三维重建与人工智能联盟副主席、中国人工智能学会智慧医疗专委会委员、中国图象图形学学会生物医学图像专委会委员、计算机学会高级会员，

  Health Information Science and Systems

  期刊副主编，入选沈阳市中青年创新人才支持计划、沈阳市领军人才。获得辽宁省五一劳动奖章、东北大学五四青年奖章。作为项目负责人承担国家重点研发计划课题、国家自然科学基金、基本科研业务费重大创新项目、省市科技计划、技术开发等多项科研项目。作为负责人研发的多个计算机辅助医疗系统已在国产高端影像装备和临床医院中获得应用。在国内核心期刊与国际会议上发表和录用论文

  50

  余篇，

  SCI

  收录

  20

  余篇，申请发明专利

  18

  项（已授权

  7

  项）、软件著作权

  10

  项。第一完成人获得第二十三届全国发明展览金奖、辽宁省总工会直属高校科技成果转化大赛一等奖、辽宁省科技进步二等奖，参与人获得辽宁省科技进步一等奖、教育部科技进步二等奖。指导学生获得

  “

  互联网

  +

  大赛

  ”

  全国银奖

  1

  项和铜奖

  1

  项、

  “

  挑战杯大赛

  ”

  全国银奖

  1

  项，国际数学建模大赛

  /

  全国数学建模大赛一等奖、二等奖多

  项

  。指导

  10

  余

  项国家大学生创新训练计划项目，获得

  3

  项结题优秀。指导的学生团队入选

  “

  东北大学创新创业示范团队

  ”

  。连续多年获得

  “

  东北大学优秀科技创新活动指导教师

  ”

  、

  “

  东北大学优秀班导师

  ”

  等称号。承担《计算机视觉》、《虚拟现实技术》、《数学建模技术》、《专业概论与职业发展》等课程。

  个人主页：

  http://faculty.neu.edu.cn/tanwenjun/zh_CN/index.htm

  联系方式；

  tanwenjun@cse.neu.edu.cn'
