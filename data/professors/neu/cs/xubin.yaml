bio_raw: '徐彬，博士。ACM China SIGCSE分会理事，中国计算机学会信息系统专委会执行委员，全国高等院校计算机基础教育研究会实验教学专业委员会委员，辽宁省大学计算机基础类教学指导委员会秘书长。沈阳市高层次人才计划拔尖人才。
  研究方向为人工智能与智慧教育。

  更多信息详见个人主页：http://faculty.neu.edu.cn/bx/

  电子邮件：xubin@mail.neu.edu.cn'
