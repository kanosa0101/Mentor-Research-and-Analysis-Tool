bio_raw: '柳秀梅，女，1976年4月出生，副教授，硕士研究生导师，中国计算机学会会员，中国密码学会会员。1997年获东北大学计算机系管理信息系统专业学士学位，2000年获东北大学计算机软件专业硕士学位，2009年获东北大学计算机系统结构专业博士学位，2014-2015年麻省大学洛威尔分校计算机学院访问学者。

  主要研究方向为：信息安全、网络安全、计算机网络、社会网络、计算机教育等。主持完成教育部青年教师科研基金项目2项，参与完成国家自然科学基金项目、国家863计划项目、辽宁省自然科学基金项目等多项。发表高水平的杂志论文、会议论文20余篇。主编或参编出版国家级规划教材多部。电子邮箱：liuxm@mail.neu.edu.cn'
