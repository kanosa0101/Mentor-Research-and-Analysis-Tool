bio_raw: '毕远国，东北大学长聘教授/博士生导师，复杂网络系统安全保障技术教育部工程研究中心副主任，辽宁省高校物联网关键技术重点实验室主任。2007年9月-2009年9月在加拿大滑铁卢大学做联合培养博士生，2010年7月博士毕业于东北大学计算机应用技术专业，并作为引进人才就职于东北大学计算机科学与工程学院。研究领域包括车联网、移动边缘计算、空天地一体化网络、网络空间安全、联邦学习、深度强化学习、人工智能等。作为负责人主持国家重点研发计划项目课题/子课题、ZB重大基础研究项目课题、国家自然科学基金重点项目课题、国家自然科学基金面上项目等国家级/省部级项目20余项。近年来在IEEE
  JSAC、IEEE TMC、IEEE TWC、IEEE TITS、IEEE TVT、IEEE IoT Journal、IEEE Communications Magazine、IEEE
  Wireless Communications、IEEE Network等国际顶级SCI期刊和IEEE INFOCOM、AAAI、IEEE ICC、IEEE GLOBECOM等国际顶级会议发表学术论文100余篇，主编中、英文学术专著3部，参与制定IEEE国际标准2项、国家标准3项，授权发明专利30余项、软件著作权4项；获得全国百篇优秀博士学位论文提名奖、中国通信学会科技进步二等奖（排名1）、辽宁省科技进步二等奖（排名1）、辽宁省自然科学学术成果奖3项（排名1）、国际会议最佳论文/奖项4项。担任IEEE
  Communications Magazine、IEEE Wireless Communications、IEEE Network等国际顶级SCI期刊客座编委，以及国际会议IEEE/CIC
  ICCC 2023、ICCSN 2024、ICN 2024、ICN 2023程序委员会主席、ICCSN 2023大会共同主席、IEEE MSN 2018出版主席等；担任全国信息技术标准化技术委员会数据通讯分技术委员会委员、全国工业机械电气系统标准化技术委员会安全控制系统分技术委员会副秘书长/委员、中国计算机学会物联网专业委员会/互联网专业委员会/智能汽车分会委员、中国自动化学会边缘计算专业委员会委员、辽宁省通信学会副理事长。

  电子邮箱：

  biyuanguo@mail.neu.edu.cn

  个人主页：http://faculty.neu.edu.cn/biyuanguo/zh_CN/index.htm'
