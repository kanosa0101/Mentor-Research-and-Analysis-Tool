bio_raw: '吕鸣松：男，1980年生，博士，副教授，现就职东北大学信息学院计算机软件研究所，任副所长。分别于2002年、2005年、2010年于东北大学获得工学学士、工学硕士、工学博士学位。从事“多核实时系统设计与验证、新能源汽车电子”等方面的研究。曾主持国家自然科学基金青年基金项目1项、辽宁省博士启动基金项目1项、东北大学基本科研业务费项目2项。曾作为主要参与人参加多项863、国家自然基金项目。在实时嵌入式领域国内外会议期刊发表论文20篇。曾于2007~2008年访问香港科技大学，于2010,、2011、2012、2013-2014年四次赴瑞典乌普萨拉大学进行学术访问。电子邮箱：

  lumingsong@cse.neu.edu.cn'
