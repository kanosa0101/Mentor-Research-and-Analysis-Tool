bio_raw: '姓名：苏锦钿

  职称 / 职务：副教授

  主要研究领域：人工智能、自然语言处理和大数据

  所在团队：软件开发环境团队

  办公邮箱：sujd@scut.edu.cn

  个人简介：

  苏锦钿，CCF会员，毕业于华南理工大学获得硕博学位。发表SCI、一级学报和EI论文40多篇，获软件著作权及专利20多项。曾获2021年广东教育教学成果奖（高等教育类）二等奖（排名第6）。先后主持国自然青年基金、高等学校博士学科点专项科研基金、中央高校基本科研业务费等项目，参与多项国自然重点、科技部重点研发计划、广东省重点领域研发计划和广东省科技厅应用型科技研发专项资金等项目。先后主持企事业单位委托项目30多项和教学改革项目10多项。多次获优秀教师和优秀班主任称号。

  教育经历：

  1998-2002//厦门大学/工学学士（计算机软件与理论）

  2002-2007//华南理工大学/工学博士（计算机应用技术）

  工作经历：

  2007-至今/华南理工大学/教师

  2019.01-2019.12/中共西藏林芝市委网信办/副主任

  学术兼职：

  长期任《计算机科学》、《计算机应用研究》、《计算机工程与科学》、《电子与信息学报》等期刊的审稿专家。

  自2017年以来，长期任广东省数字政府改革建设专家委员会核心成员、广东省财政厅造价评审专家、广东数字政府研究院特聘专家、数字广东公司-广东省电子政务信息技术应用创新企业重点实验室学术委员会委员和外部顾问、自然资源部粤港澳大湾区自然资源数据协同应用工程技术创新中心技术委员会委员、广东阳江，江门，清远，肇庆和潮州等地市数字政府改革建设工作专家组成员、原广东省信息中心长期特聘专家（2015年至2018年）。

  课程教学（选填）：

  《软件工程》、《软件工程课程设计》、《企业级软件开发技术》、《形式语义》等

  科研项目：

  按级别从高到低排列，包括项目名称、项目来源（国家级 / 省部级 / 横向等）、起止时间、角色（负责人 / 参与人）

  1. 面向检察办案的电子化签名大数据智能溯源检索关键技术研究课题，科技部重点研发计划（国家级），2022.10-2025.09，参与人。

  2. 面向数字人文的中文古籍文档图像智能识别与理解, 2019年国家自然科学基金重点项目（国家级），2019.01-2021.12，参与人。

  3. 智慧科技服务平台及关键技术研究，广东省科技厅应用型科技研发专项资金项目子课题（省部级），2017.01-2020.112，负责人。

  4. 智能学习与视觉感知计算，广东省自然科学基金研究团队（省部级），2017.01-2022.12，参与人。

  5. 面向智能无人船开放测试场关键技术研究与建设，广东省重点领域研发计划项目（省部级），2019.01-2021.12，参与人。

  6. 面向智慧金融服务的智能感知与识别关键技术研究及应用示范，广东省重点领域研发计划项目（省部级），2017.01-2020.12，参与人。

  7. Comonads理论及其在计算机科学中的应用研究，国家自然科学基金－青年科学基金项目（国家级），2012.01-2014.12，主持人。

  8. 与“搜索引擎”相关的网络服务提供者注意义务与必要措施研究专项，优视科技（中国）有限公司（横向），2025.02-2026.02，主持人。

  9. 数字潮州建设“十五五”规划，潮州市政务服务和数据管理局（横向），2025.05-26.12，主持人。

  10. 征地云系统技术咨询服务，广州征云科技有限公司（横向），205.03-2026.02，主持人。

  11. 2022年中国联通广东全客电话数据分析系统研发项目，中国联合网络通信有限公司广东省分公司（横向），2022.01-2024.12，主持人。

  12. 2022年中国联通广东系统压测及性能监控系统研发项目，中国联合网络通信有限公司广东省分公司（横向），2022.01-2024.12，主持人。

  13. 智慧化工科研安全监管一体化平台，广东长盈科技股份有限公司（横向），2020.01- 2023.12，主持人。

  14. 大气候气候灾害预警项目合同，广州大气候农业科技有限公司（横向），2021.01-2023.12，主持人。

  15. 操作系统及数据库稳定性测试技术服务，工业和信息化部电子第五研究所（横向），2018.10-2018.12，主持人。

