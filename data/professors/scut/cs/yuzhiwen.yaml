  个人介绍

  余志文博士，华南理工大学计算机学院教授、博导、鹏城国家实验室双聘导师、华为顾问、CCF理事（2016-2023），发表学术论文200多篇，其中90篇IEEE Transactions系列长文，google引用为16000多次，h-index为56，担任IEEE
  Transactions on Systems, Man, and Cybernetics: Systems副主编、IEEE Transactions on Neural
  Networks and Learning Systems副主编、CCF会刊《计算机应用》编委。主持和参与的项目30多项，其中主持国家基金重点项目（人工智能应急管理专项）、优青项目、国基重大研究计划培育项目、面上项目和青年项目、以及主持广东省重点研发计划（人工智能基础方向）和广东省杰出青年科学基金。曾获吴文俊人工智能自然科学奖二等奖（排名1）、中国计算机学会自然科学奖二等奖（排名1），入选斯坦福大学2024年度全球前2%顶尖科学家榜单。

  Brief introduction

  Zhiwen Yu (S''06-M''08-SM''14) is a Professor in School of Computer Science and
  Engineering, South China University of Technology, China. He received the Ph.D.
  degree from the City University of Hong Kong, Hong Kong, in 2008. Dr. Yu has authored
  or coauthored more than 200 refereed journal articles and international conference
  papers, including more than 90 articles in the journals of IEEE Transactions, h-index
  56，Google citation 16300. He is an Associate Editor of the IEEE Transactions on
  systems, man, and cybernetics: systems, IEEE Transactions on Neural Networks and
  Learning Systems and the informatics journal. Dr. Yu is in charge of or take part
  in more than 30 research projects, such as the National Natural Science Foundation
  of China (the Key Program、the General Program and the Youth Program), National Natural
  Science Foundation of China for Excellent Young Scientists, the Key R&D Program
  of Guang Dong Province, and so on. He is a senior member of IEEE and ACM, a Member
  of the Council of China Computer Federation from 2016 to 2023 (CCF). Ranked among
  the top 2% of scientists worldwide in Stanford University''s 2024 World''s Top 2%
  Scientists List.

