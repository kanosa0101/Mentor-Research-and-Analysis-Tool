bio_raw: '个人简介

  林伟伟：华南理工大学计算机科学与工程学院教授（三级）、博士生导师、学院党委委员、先进计算体系结构团队负责人，入选广东省重大人才计划特聘教授，CCF杰出会员，IEEE高级会员，
  TBench期刊副主编，《计算机科学》期刊执行编委。当前主要研究兴趣包括云计算调度优化与节能、算力能效建模与优化、大模型与边缘智能、时序预测建模与应用等，2021-2025年连续入选斯坦福大学全球前2%顶尖科学家榜单，与国际知名学者(IEEE
  Fellow)美国李克勤、澳洲Rajkumar Buyya 和Albert Y. Zomaya 等院士保持长期学术科研合作；作为第一指导老师指导学生获中国国际大学生创新大赛总决赛金奖2项；主持科研项目30余项，包括3个国家自然基金、多个省部级重大项目和华为公司委托合作研究项目4项；发表SCI论文200余篇，授权发明专利50余件，撰写著作5本，参与制定国家标准《塔式和机架式服务器能效限定值及能效等级》（标准号为GB
  43630-2023），项目成果“云计算调度优化技术”获2020年广东省科技进步奖二等奖（排名第一），获华为火花奖（基于抢占的NPU集群资源调度与碎片卡整理技术），科研成果应用到华为、OPPO、广电运通、云宏信息、广州鼎甲等公司，取得了良好的经济和社会效益。

