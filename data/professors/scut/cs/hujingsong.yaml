  cshjs@scut.edu.cn

  技术职称：

  教授

  导师类别：

  硕导、工程博导

  招生专业：

  计算机应用技术

  招生类型：

  工程博士、学术硕士生、专业硕士、留学生

  教育经历：

  湖南大学 工学学士

  华南理工大学 硕士

  华南理工大学 博士

  工作经历：

  2002

  至今，华南理工大学计算机学院

  社会兼职：

  中国多值逻辑与模糊逻辑专委会委员

  广东省计算智能学会副主任

  研究方向：

  1）

  面向行业领域的类chatGPT工具，深度学习语音及图像识别；2）自动驾驶及智能交通关键技术，包括自动驾驶的3D图像识别及多源数据融合、共享汽车及无人物流车的多目标路径导航及统一调度、交通及网络流量全局优化；3）智能优化算法及应用，提出了一种新的优化算法，不是已有算法的改进或融合。

  主要业绩：

  在计算机学报、自动化学报等国内外知名期刊上发表了多篇论文。为国内通信企业开发了多套手机软件及系统。为《计算机学报》、《电子与信息学报》、《浙江大学学报》、《西安交大学报》、《

  IEEE Trans on SMC

  》等杂志审稿。主持国家自然科学基金

  2

  项。'
