  个人简介

  华南理工大学计算机科学与工程学院教授，博士生导师，美国加州大学（圣地亚哥分校）访问学者，中国计算机学会（

  CCF

  ）高级会员。主要从事人工智能、机器学习、数据挖掘、时序数据分析、自然语言处理等方向的科研工作，主持国家级项目

  2

  项，省部级项目

  7

  项，参与国家及省部级项目

  10

  余项。曾获得广东省科技进步奖二等奖，中国南方电网科技进步二等奖，华南理工大学教学优秀奖一等奖。已发表论文

