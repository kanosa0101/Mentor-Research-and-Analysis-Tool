  研究方向

  以人工智能、机器学习和数据挖掘为主要研究方向，以建立面向时空序列数据学习、自然语言处理中的新型机器学习算法、深度学习模型为主要目标，推动将研究成果应用于教育、金融、电力、交通、安防等领域。

