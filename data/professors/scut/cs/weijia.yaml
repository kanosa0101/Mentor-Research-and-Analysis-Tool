bio_raw: '姓名：韦佳

  职称 / 职务：副教授，硕士生导师

  主要研究领域：人工智能、机器学习、深度学习、医学图像分析、智慧医疗等

  所在团队：多模态与类脑智能计算团队

  办公邮箱：csjwei@scut.edu.cn

  办公室电话：无

  个人简介：

  韦佳，男，1982年1月出生于江西省永修县，现为华南理工大学计算机科学与工程学院副教授，硕士生导师，中国仿真学会算力系统仿真专委会委员。2003年和2006年在哈尔滨工业大学计算机科学与技术专业获工学学士和工学硕士学位，2009年在华南理工大学计算机应用技术专业获工学博士学位。2004年至2005年为中兴通讯CDMA测试部工程师，2015年至2016年作为中组部团中央第十六批博士服务团成员赴遵义市工业和能源委员会挂职副主任，2018年至2019年为美国犹他大学访问学者。主要研究兴趣包括人工智能、机器学习、深度学习、医学图像分析、智慧医疗等。主持国家自然科学基金项目1项，广东省自然科学基金项目4项，广东省科技计划项目1项，广州市科技计划项目2项，华南理工大学基本科研业务费项目2项，参与国家级、省部级项目10余项。发表学术论文50余篇，授权发明专利5项。

  教育经历：

  1999.9-2003.7，哈尔滨工业大学，计算机科学与技术，学士

  2003.9-2006.7，哈尔滨工业大学，计算机科学与技术，硕士

  2006.9-2009.6，华南理工大学，计算机应用技术，博士

  工作经历：

  2004.6-2005.8，中兴通讯，CDMA测试部，工程师

  2009.7-2014.8，华南理工大学，计算机科学与工程学院，讲师

  2014.9-至今，华南理工大学，计算机科学与工程学院，副教授

  2015.11-2016.11，遵义市工业和能源委员会，副主任（挂职）

  2018.9-2019.9，犹他大学，Scientific Computing and Imaging Institute，访问学者

  学术兼职：

  2024.10-至今，中国仿真学会算力系统仿真专委会，委员

  课程教学（选填）：

  Java程序设计，人工智能

  科研项目：

  主持国家自然科学基金项目1项，广东省自然科学基金项目4项，广东省科技计划项目1项，广州市科技计划项目2项，华南理工大学基本科研业务费项目2项，参与国家级、省部级项目10余项。近期相关项目：

  ①国家自然科学基金面上项目，基于深度学习的轻中度抑郁障碍个性化心理治疗决策模型研究，合作单位负责人（2020）；

  ②广东省自然科学基金项目，基于目标感知的多模态医学图像翻译研究，负责人（2023）；

  ③广州市基础与应用基础研究项目，基于目标感知的多模态医学图像翻译研究，负责人（2022）；

  ④广东省自然科学基金项目，基于生成对抗学习的医学图像分割研究，负责人（2020）。

  代表性成果：

  近期代表性论文：

  1.Sun H, Wei J*, Yuan W, et al. Semi-supervised multi-modal medical image segmentation
  with unified translation[J]. Computers in Biology and Medicine, 2024, 176: 108570.
  （JCR一区）

  2.Liu Z, Wei J*, Li R, et al. SFusion: Self-attention Based N-to-One Multimodal
  Fusion Block[C]//International Conference on Medical Image Computing and Computer-Assisted
  Intervention. Cham: Springer Nature Switzerland, 2023: 159-169. （CCF B类会议）

  3.Liu Z, Wei J*, Li R, et al. Learning multi-modal brain tumor segmentation from
  privileged semi-paired MRI images with curriculum disentanglement learning[J]. Computers
  in Biology and Medicine, 2023, 159: 106927. （JCR一区）

  4.Wu Z, Wei J*, Wang J, et al. Slice imputation: Multiple intermediate slices interpolation
  for anisotropic 3D medical image segmentation[J]. Computers in biology and medicine,
  2022, 147: 105667. （JCR一区）

  5.Chen Z, Wei J*, Li R. Unsupervised Multi-Modal Medical Image Registration via
