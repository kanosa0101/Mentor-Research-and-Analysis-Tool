  24-33. （CCF B类会议）

  7.Yuan W, Wei J*, Wang J, et al. Unified generative adversarial networks for multimodal
  segmentation from unpaired 3D medical images[J]. Medical Image Analysis, 2020, 64:
  101731. （JCR一区）

  8.Xiao Y, Wei J*, Wang J, et al. Graph constraint-based robust latent space low-rank
  and sparse subspace clustering[J]. Neural Computing and Applications, 2020, 32(12):
