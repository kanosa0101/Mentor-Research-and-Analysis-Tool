  发明专利：

  陈俊晓, 韦佳. 基于目标感知生成对抗网络的多模态医学图像翻译方法. 发明专利, 2024.

  张凯文, 韦佳. 一种面向噪声图像的深度学习聚类方法. 发明专利, 2023.

  张凯文, 韦佳. 一种结合分类任务的目标分割方法. 发明专利, 2022.

  张凯文, 韦佳. 一种结合分类任务的弱监督目标分割方法. 发明专利, 2022.

  潘宇琳, 韦佳. 一种结合浅层与深层特征的小样本丝织品图像检索方法. 发明专利, 2022.

  获奖荣誉：

  2022-2023学年优秀班主任，华南理工大学

  第十八届“挑战杯”全国大学生课外学术科技作品竞赛校赛一等奖（指导教师），华南理工大学，2023

  第十八届“挑战杯”全国大学生课外学术科技作品竞赛校赛三等奖（指导教师），华南理工大学，2023

  第七届全国青年人工智能创新创业大会创新组二等奖（指导教师），中国人工智能学会，2022

  2017年学生科技创新优秀指导教师一等奖，华南理工大学

  2017学年度本科毕业设计（论文）优秀指导教师奖，华南理工大学

  2015学年度本科毕业设计（论文）优秀指导教师奖，华南理工大学

  2015年学生科技创新优秀指导教师三等奖，华南理工大学'
