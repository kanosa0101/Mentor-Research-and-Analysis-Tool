bio_raw: '姓名：张幸林

  职称 / 职务：教授

  主要研究领域：边缘智能、联邦学习、群智感知、人工智能

  所在团队：异构算力并行加速与性能优化

  办公邮箱：csxlzhang@scut.edu.cn

  办公室电话：

  个人简介：

  张幸林，IEEE/ACM/CCF会员，毕业于香港科技大学，获得博士学位。发表CCF A/中科院1区论文40余篇，连续5年入选斯坦福大学发布的“全球前2%顶尖科学家榜单”。先后主持或参与多项国自然面上/重点、科技部重点研发计划等项目。

  招收自驱力强的学生。

  教育经历：

  2010，中山大学，学士

  2014，香港科技大学，博士

  工作经历：

  2015-2016 华南理工大学计算机学院

  博士后2017-2021 华南理工大学计算机学院

  副教授2022-至今 华南理工大学计算机学院  教授

  学术兼职：

  年份/机构名称/职务

  课程教学（选填）：

  个人主讲课程名称

  科研项目：

  1.面向联邦学习的智能边缘网络服务关键技术研究，国基面上项目，在研，负责人2.群体智能的时空敏感协同决策与可持续计算研究，国家重点研发计划，已结题，参与人3.群体感知的隐私保护方法，国基重点项目，已结题，负责人4.面向多目标群智感知的任务分配算法研究，国基面上项目，已结题，负责人5.群智感知中动态用户的在线激励机制研究，国基青年项目，已结题，负责人

  代表性成果：

  1. Haoyu Fu, Fengsen Tian, Guoqiang Deng, Lingyu Liang, Xinglin Zhang*, Reads: A
  Personalized Federated Learning Framework With Fine-Grained Layer Aggregation and
  Decentralized Clustering, IEEE Transactions on Mobile Computing, 2025

  2. Fengsen Tian, Mingzi Wang, Yu Zhang, Guoqiang Deng, Lingyu Liang, Xinglin Zhang*,
  A Pricing Game for Federated Learning Supporting Lightweight Local Model Training,
  IEEE Transactions on Mobile Computing, 2025

  3. Qihang Zhou, Xinglin Zhang*, Zheng Yang, Unknown Worker Recruitment With Long-Term
  Incentive in Mobile Crowdsensing, IEEE Transactions on Mobile Computing, 2025

  4. Fengsen Tian, Xinglin Zhang*, Xiumin Wang, Yue-Jiao Gong, Two-Layer Optimization
  With Utility Game and Resource Control for Federated Learning in Edge Networks,
  IEEE Transactions on Mobile Computing, 2024

  5. Jinyi Zhang, Xinglin Zhang*, Multi-task allocation in mobile crowd sensing with
  mobility prediction, IEEE Transactions on Mobile Computing, 2023

  (https://scholar.google.com/citations?user=ecFvovoAAAAJ&hl=zh-CN)

  获奖荣誉：

  2018 广东省杰出青年基金获得者2018 广东特支计划科技创新青年拔尖人才2018 广州市珠江科技新星2021 广东省计算机学会优秀论文奖一等奖2023 广东省计算机学会优秀论文奖一等奖'
