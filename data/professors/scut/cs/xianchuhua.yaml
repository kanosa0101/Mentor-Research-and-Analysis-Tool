bio_raw: '姓名：冼楚华

  职称 / 职务：副教授

  主要研究领域：计算机图形学，几何建模与处理，计算机辅助设计，图像处理

  所在团队：

  办公邮箱：chhxian@scut.edu.cn

  办公室电话：无

  个人简介：

  冼楚华，中国民主促进会广东省省委会第八届、第九届科技专门委员会委员，民进华南理工第二届基层委员会副主委，中国计算机学会会员，中国人工智能学会会员，中国计算机学会计算机辅助设计与图形学专委会执委，广东省计算机学会教育与科学普及工作委员会副主任。毕业于浙江大学计算机辅助设计与图形学国家重点实验室（现计算机辅助设计与图形系统全国重点实验室），获博士学位。曾在香港中文大学放学。目前已发表论文60多篇，先后主持国家级、省部级、企业委托科研项目等20多项，参与科技部重点研发计划多项。

  担任华南理工大学ACM程序设计竞赛集训队总教练，获“广东省大学生程序设计竞赛二十周年优秀教练”，“广东省大学生程序设计大赛杰出贡献奖”。

  教育经历：

  年份//学校/学位

