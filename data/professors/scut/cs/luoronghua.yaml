title: 副教授
bio_raw: '日期：2012年11月27日 21:13:36

  罗荣华, 男, 1975年生，博士、副教授, 主要从事智能机器人、机器人视觉、机器人认知原理的研究工作。作为项目主持人，承担国家自然科学基金项目、广东省国际合作项目、广东高校优秀青年创新人才

  培育项目、，中央高校基本科研业务费项目多项。作为项目主要完成人员，参加国家自然科学基金资助项目、国家“863”计划支持项目、广东省科技计划项目、广州市科技计划项目和国际合作项目十余项。作为主要技术骨干，开发设计了中央空调风管空气质量检测机器人系统和智能服务机器人系统及软件平台，获得发明专利2项，软件著作权6项。近几年来在《电子学报》、《International
  Journal of Advanced Robotic Systems》等国内外知名期刊和《ICRA》等机器人领域的顶级国际会议上发表论文30多篇，其中SCI检索9篇，EI检索20多篇。'
