  吕建明博士, 华南理工大学计算机学院教授、博导，国家重点研发计划项目负责人，多模态与类脑智能计算团队负责人。2002年本科毕业于中山大学计算机系,2008年获中科院计算技术研究所博士学位。2017年在香港城市大学任高级副研究员（Senior
  Research Associate）。ACM/IEEE/CCF会员，CCF教育专业委员会委员，CCF人工智能与模式识别专委会通讯委员，中文信息学会信息检索专委会委员。研究兴趣包括多模态、脑启发记忆机制、计算机视觉、人工智能安全、AI赋能交叉学科。已经在相关领域发表70余篇会议和杂志论文，其中包括CVPR, MM, ICML，ACL等领域顶会，以及IEEE Transactions
  on Pattern Analysis and Machine Intelligence、IEEE Transactions on Affective Computing、IEEE
  Transactions on Intelligent Transportation Systems等领域顶刊。

  近年来，主持了5项国家级科研项目，20余项各类项目，包括国家重点研发计划项目、国家自然基金面上项目、广州市重点研发计划项目、广东省科技计划项目等。获发明专利授权15项，发明专利申请30余项，与华为有限技术公司、广州市妇女儿童医疗中心、广东电力科学研究院、金发科技、广州市赋安数字科技、怡安翰威特等企业开展广泛合作。

  曾获优秀获校级本科教学成果一等奖，广东省本科高校在线教学优秀课程案例一等奖，卓越大学联盟高校教师教学创新大赛三等奖，指导学生获得泛珠三角大学生计算机作品赛全国总决赛金奖。所主持的《数据结构》在线课程报名人数超过2万人。

  课程网址：

  https://www.xuetangx.com/course/SCUT08091000960/5882715

  。

  招贤纳士

