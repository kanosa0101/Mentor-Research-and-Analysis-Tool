bio_raw: '姓名：郑运平

  职称 / 职务：副教授/无

  主要研究领域：计算机视觉、深度学习、图像分割、遥感图像处理、医学图像处理、显著性检测、图像语义分割、图像表示等

  所在团队：计算机公共课团队

  办公邮箱：zhengyp@scut.edu.cn

  办公室电话：无

  个人简介：

  郑运平，CCF、ACM会员，毕业于华中科技大学计算机科学与技术学院，获计算机应用技术专业博士学位，博士论文荣获湖北省优秀博士学位论文奖。广东省高等学校“千百十人才培养工程”第八批校级培养对象。曾在美国宾夕法尼亚大学（University
  of Pennsylvania）做访问学者一年。在科研方面，先后主持国家自然科学基金项目1项、省部级项目7项、厅级项目1项、中央高校重点项目1项、中央高校面上项目2项、横向项目3项，参与国家863项目1项、国家自然科学基金项目1项。在《IEEE
  Transactions on Image Processing》、《Journal of Visual Communication and Image Representation》、《Frontiers
  of Computer Science》、《IET Image Processing》、《Chinese Journal of Electronics》、《计算机学报》、《软件学报》等国内外重要学术期刊和会议集上发表学术论100余篇，获发明专利授权10余项。在教学方面，主持省级教改项目3项、校级重点及面上等教改项目10余项，发表教改论文10余篇，荣获华南理工大学本科教学优秀教师“南光奖”（学校教学质量最高奖）。

  教育经历：

  2003-2008 华中科技大学 博士

  工作经历：

  2009-2013 华南理工大学 讲师

  2013-2015华南理工大学 副教授

  2015-2016宾夕法尼亚大学 访问学者

  2016-至今华南理工大学 副教授

  学术兼职：

  无

  课程教学（选填）：

  主讲《高级语言程序设计C++（一）》、《高级语言程序设计C++（二）》、《C++程序设计》、《C++程序设计基础》等课程。

  科研项目：

  按级别从高到低排列，包括项目名称、项目来源（国家级 / 省部级 / 横向等）、起止时间、角色（负责人 / 参与人）

  1.主持2013年国家自然科学基金青年科学基金项目(基于NAM和生物视知觉的医学图像分割算法研究No.61300134)一项

  2.主持2015年广东省自然科学基金自由申请项目(基于NAM和“大范围首先”的医学图像处理与分析的关键技术No.2015A030313206)一项

  3.主持2017年广东省自然科学基金自由申请项目(基于NAM和模糊连接度的医学图像处理的关键技术研究NO.2017A030313349)一项

  4.主持2021年广东省自然科学基金自由申请项目(基于NAM和亲和力的分层图像分割算法研究No.2021A1515011517)一项

  5.主持2023年广东省自然科学基金自由申请项目(基于弱监督学习和NAM的图像语义分割算法研究NO.2023A1515011288)一项

