research_direction_raw: 三维视觉、人工智能、计算机图形学、图像理解；个人简介：华南理工大学计算机科学与工程学院，教授，硕士/博士生导师，广东省高等学校优秀青年教师，广东高校优秀青年创新人才入选者，美国俄亥俄州立大学访问学者。在三维视觉、人工智能、计算机图形学、图像理解、智能CAD技术等方面进行了系统深入的研究探索，同时取得一系列的研究产出。近年来已发表三大检索学术论文60余篇，其中发表在SIGGRAPHAsia、IEEE
