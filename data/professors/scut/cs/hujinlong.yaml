bio_raw: '姓名：胡金龙

  职称 / 职务：副教授

  主要研究领域：人工智能、脑影像分析、高效智能计算、未来网络与安全

  所在团队：大数据与视觉计算

  办公邮箱：jlhu@scut.edu.cn

  办公室电话：无

  个人简介：

  胡金龙，广东省多模态大数据智能分析重点实验室成员，毕业于华南理工大学获得本硕博学位，曾先后在华南大学信息网络工程研究中心和计算机科学与工程学院工作，并曾赴宾夕法尼亚州立大学进行交流访问。发表学术论文70多篇，授权发明专利40多项。曾获广东省科技进步二等奖。先后主持或参与了广东省自然科学基金、教育部-中国移动科研基金、广东省省部产学研结合项目、广东省重大科技专项、国家863计划、国家科技支撑计划、国家CNGI等项目30多项。

  教育经历：

  2008-2012 华南理工大学 计算机科学与工程学院 博士研究生2001-2004 华南理工大学 电子与信息学院 硕士研究生1995-1999 华南理工大学
  电子与信息学院 本科生

  工作经历：

  2013-至今 华南理工大学 计算机科学与工程学院 高工，副教授

  2004-2013 华南理工大学 信息网络工程研究中心 讲师，高工

  2016-2017 美国 宾夕法尼亚州立大学 访问学者

  学术兼职：

  课程教学（选填）：

  人工智能安全、网络管理与未来网络、高性能计算与云计算、信号处理与通信基础

  科研项目：

  1. 基于多模态磁共振影像的可解释精神疾病分类方法研究，省基金项目，2025-2027，负责人

  2. 基于图神经网络的功能脑网络分析方法研究，省基金项目，2021-2023，负责人

  3. 基于大规模图分析的移动广告欺诈检测研究，省基金项目，2018-2021，负责人

  4. 基于多组学学习的智能医疗辅助诊断技术及应用，市科技项目，2019-2024，参与人

  5. 数据中心算力负荷预测及调度技术研究，企事业委托项目，2025-2028，负责人

  6. 超高清信号IP网络转换传输交互控制，企事业委托项目，2024-2025，负责人

  7. 智能计算平台集群管理技术研发，企事业委托项目，2021-2022，负责人

  8. 多协议流量采集与分析系统，企事业委托项目，2017-2020，负责人

  代表性成果：

  [1] Jinlong Hu, Jiacheng Liu, Shoubin Dong, Bin Liao, Junjie Liang, Vasant Honavar, DGX:
  Uncovering General Behavior of Deep Graph Models with Model-level Explanation. IEEE
  Transactions on Computational Biology and Bioinformatics, 2025.

  [2] Jinlong Hu, Yaqian Hou, Bo Peng, Bin Liao, Ziyun Xu, Gangqiang Hou, Shoubin
  Dong, Identifying major depressive disorder based on cerebral blood flow and brain
  structure: An explainable multimodal learning study. Journal of Psychiatric Research, 2025,
  182: 304-311.

  [3] Jinlong Hu, Yangmin Huang, Nan Wang, Shoubin Dong, BrainNPT: Pre-training of
  Transformer networks for brain network classification, IEEE Transactions on Neural
  Systems and Rehabilitation Engineering, 2024.

  [4] Jinlong Hu, Jianmiao Luo, Ziyun Xu, Bin Liao, Shoubin Dong, Bo Peng, Gangqiang
  Hou. Spatio-temporal learning and explaining for dynamic functional connectivity
  analysis: Application to depression. Journal of Affective Disorders, 2024, 364:
  266-273.

  [5] Jinlong Hu, Yangmin Huang, Xiaojing Zhang, Bin Liao, Gangqiang Hou, Ziyun Xu,
  Shoubin Dong, Ping Li, Identifying suicide attempts, ideation, and non-ideation
  in major depressive disorder from structural MRI data using deep learning, Asian
  Journal of Psychiatry, Volume 82, 2023.

  获奖荣誉：

  广东省科技进步二等奖，2020'
