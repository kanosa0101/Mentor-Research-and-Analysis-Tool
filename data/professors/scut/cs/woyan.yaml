bio_raw: '姓名：沃焱

  职称 / 职务：教授

  主要研究领域：图像/视频处理、机器视觉、人工智能安全

  所在团队：多媒体技术与图形图像处理

  办公邮箱：woyan@scut.edu.cn

  办公室电话：无

  个人简介：

  简要介绍任职情况/学术兼职/教育背景/工作经历/学术经历/研究特色/学术影响等，（约 200-300 字）。

  如有需要，可补充个人对研究生的招生要求。

  Xxx，CCF理事/杰出会员，CCF人工智能/大数据/自然语言处理专委会/数据发展委员会执委，CCF YOCSEF总部副主席（2024-2025），毕业于xxx大学获得本硕博学位，曾先后在香港大学及中科院xxx研究院工作。发表CCF
  A/中科院1区论文60余篇，连续3年入选斯坦福大学发布的”全球前2%顶尖科学家榜单“。曾获xx市自然科学技术奖一等奖及广东省自然科学技术奖二等奖。先后主持或参与多项国自然面上/重大研究计划培育/重点、科技部重点研发计划、中国科学院战略性先导科技专项等项目。

  主要从事图像/视频处理、深度学习及人工智能安全方面的研究工作。主持1 项国家自然科学基金青年基金项目，1 项国家自然科学基金-广东省联合基金项目子课题，省部级项目7项，厅级项目2项。作为核心成员参与4项国家自然科学基金面上项目，1项国家支撑项目，以及十余项各类省部级基金项目及重点研发项目。在《IEEE
  Transactions on Information Forensics and Security》、《Knowledge-Based Systems》、《计算机学报》、《通信学报》等国内外著名刊物上共发表80余篇学术论文，获近二十项授权发明专利，获1项广东省科学技术奖自然科学奖二等奖。

  教育经历：

  年份//学校/学位

  2001-09 至 2004-06: 华南理工大学,  博士

  1996-09 至 1999-06, 兰州大学,  硕士

  1992-09 至 1996-06, 云南师范大学, 学士

  工作经历：

  年份/单位名称/职务/职级

  2014-09 至 今, 华南理工大学, 计算机科学与工程学院, 教授

  2015-08 至 2016-08, University of California, San Diego, Electrical and Computer
  Engineering, 访问学者

  2008-12 至 2014-09, 华南理工大学, 计算机科学与工程学院, 副教授

  2004-07 至 2008-12, 华南理工大学, 计算机科学与工程学院, 讲师

  1999-07 至 2001-09, 云南师范大学, 计算机学院, 助教

  学术兼职：

  年份/机构名称/职务

  课程教学（选填）：

  《高级语言程序设计C++》、《数字图像处理》

  科研项目：

  按级别从高到低排列，包括项目名称、项目来源（国家级 / 省部级 / 横向等）、起止时间、角色（负责人 / 参与人）

  反演重构攻击防御机制与模型安全性评估研究，广东省自然科学基金面上项目，2025/01-2027/12，负责人。

  面向韧性提升的城轨网络化列车运行计划编制与智能调度关键技术,广州市重点领域研发计划项目，2022/04-2025/04，参与。

  可检索的图像加密及压缩表示方法研究，广东省自然科学基金面上项目，2021/01-2023/12，负责人。

  抗相似性攻击的安全图像哈希方法研究，广州市科技计划项目，2020/04-2022/04，负责人。

