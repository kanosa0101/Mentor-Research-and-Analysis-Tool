bio_raw: '姓名：许勇

  职称/职务：教授（二级）/副校长、国家卓越工程师学院院长

  主要研究领域：人工智能、大数据、计算机器视觉、模式识别、图像处理等

  所在团队：大数据与视觉计算团队（负责人）

  办公邮箱：yxu@scut.edu.cn

  个人简介：

  许勇，现任华南理工大学副校长，卓越工程师学院院长，计算机科学与工程学院/未来技术学院二级教授、博士生导师，“广东省多模态大数据智能分析重点实验室”主任，“广东省大数据分析与处理工程技术研究中心”主任，“人体数据感知教育部工程研究中心”副主任。1993、1996和1999年分获南京大学学士、硕士和博士学位。1999年至今在华南理工大学工作，历任计算机学院系主任、副院长、软件学院院长、研究生院常务副院长。教育部“新世纪优秀人才”，“广东特支计划”教学名师，IEEE高级会员，ACM高级会员，CCF杰出会员，广东省“千百十”省级培养对象。华南理工大学“大数据与视觉计算”学术团队带头人，主要研究方向是人工智能、大数据、计算机器视觉、模式识别、图像处理等。近年来，主持和参加了40余项国家级和省部级等科研项目，发表科研论文200余篇，入选全球前2%顶尖科学家榜单。获广东省科技进步二等奖、广东省计算机学会科学技术奖一等奖、第七届中国国际“互联网+”大学生创新创业大赛产业命题赛道金奖(第一指导老师)及第六届中国国际“互联网+”大学生创新创业大赛国际赛道金奖(第一指导老师)等奖项。学术出访美国、欧洲、新加坡等知名高校近30次。

