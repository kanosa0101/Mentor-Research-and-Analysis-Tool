bio_raw: '姓名：陈敏

  职称 / 职务：教授、博士生导师、高被引研究员

  主要研究领域：认知计算、6G网络、大数据分析、情感智能、无人机强化学习、深度学习、边缘计算、健康智能感知

  所在团队：数据科学与人工智能团队

  办公邮箱：minchen@ieee.org

  办公室电话：+86-13349999659

  个人简介：

  陈敏，华南理工大学计算机科学与工程学院，琶洲实验室长聘教授、博导，人工智能领域专家，IEEE Fellow，全球人工智能领域高被引科学家。现任嵌入与普适计算（EPIC）实验室主任，IET
  Fellow、AAIA Fellow。2012年入选海外高层次人才计划，教育部新世纪优秀人才，2014年入选湖北省杰青。曾任湖北省智能认知技术国际合作基地主任。2020年（40岁以下）当选为IEEE
  Fellow（国际电气电子工程师学会会士），并自2018年至2025年连续八次入选科睿唯安全球高被引科学家榜。长期专注于认知计算、大模型、人工智能、脑科学交叉研究，现已出版学术专著或教材12部，谷歌学术总引用超过5.2万次，H指数101（中国H指数100或以上的计算机方向学者不到30人，占全球相关研究人员的
  0.0016%）。发表SCI论文200余篇，发表 CCF A类会议、IEEE-ACM Trans./Magazine论文80余篇，34篇ESI高被引论文，12篇ESI热点论文，单篇最高引用超过5200次。

