  1. 担任国际MDPI Big Data and Cognitive Computing期刊创刊主编。

  2. 担任IEEE计算机协会大数据技术社区（STC）创始主席

  3. 担任湖北省智能认知技术国际科技合作基地主任

  4. 曾任华中科技大学计算机学院数据所所长

  5. 积极组织筹办国际学术大会，曾任2022年第七届计算机与通信系统国际会议大会共同主席，IEEE CIT 2012、第九届Tridentcom、第八届Mobimedia 等国际大会副总主席

  6. 曾任IEEE ICC 2012 通信理论程序委员会主席及IEEE ICC 2013无线网络程序委员会主席，EEE GLOBECOM 2022 eHealth程序委员会主席

