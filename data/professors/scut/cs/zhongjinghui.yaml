bio_raw: '姓名：钟竞辉

  职称 / 职务：教授、博士生导师

  主要研究领域：高性能AI算法设计与跨领域应用，核心方向包括复杂系统的智能优化决策、多模态大模型、可解释AI for Science等。

  所在团队：计算智能

  办公邮箱：jinghuizhong@scut.edu.cn

  办公室电话：

  个人简介：

  广东省高层次人才计划引进青年拔尖人才，主要研究领域为高性能AI算法设计与跨领域应用，近年来在国际权威期刊和会议发表论文100余篇，其中IEEE/ACM Trans系列期刊论文40余篇，多次入选斯坦福全球前2%顶尖科学家榜单，目前担任国际期刊《Memetic
  Computing》 编委、《ICT Express》编委、IEEE 高级会员，CCF高级会员，IEEE 计算智能学会广州Chapter副主席，中国计算机学会协同计算专委会委员，中国仿真学会智能仿真优化与调度专委会委员，主持国家级、省级和企业横向项目二十余项。

  教育经历：

  2009-2012 中山大学 博士

  2005-2007中山大学硕士

  2001-2005 中山大学 学士

  工作经历：

  2016-至今华南理工大学副教授，教授

  2013-2016南洋理工大学博士后

  学术兼职：

  2022年至今 IEEE CIS 广州Chapter 副主席

  2019 至今 Memetic Computing 编委

  2021 至今 ICT Express 编委

  课程教学（选填）：

  操作系统

  深度强化学习导论

  智能优化

  数字乡村与人工智能

  科研项目：

  1.知识辅助的高性能可信遗传编程算法研究，国家自然科学基金面上项目，2025-2028，主持

  2.面向高维复杂优化的多态遗传编程算法研究，2021-2024，主持

  3.基于协同遗传程序设计算法的人群行为建模与仿真技术的研究，国家自然科学基金青年项目，2017-2019，主持

  4.知识驱动的高性能进化迁移优化算法研究，国家级外专项目，2021-2023，主持

  5.跨媒体智能感知计算理论、关键技术及产业化应用珠江创新团队项目（总经费2000万），2018-2023，子课题负责人

  6.数据驱动的计算智能方法，广东省自然科学基金研究团队项目（总经费300万）, 2018-2023，核心成员&子课题负责人

  7.数据驱动的人群行为建模技术及其应用，中新国际联合研究院产业化项目，2019-2021，联合负责人

  8.知识驱动的高性能图神经网络优化关键技术研究，省自然科学基金面上项目, 2023-2025，主持

  9.基于深度学习与计算机视觉技术的智能环境控制屏项目，企业横向项目, 2024-2025，主持

  10.面向服务机器人的多模态大模型和三维感知的人工智能芯片及系统, 横琴粤澳深度合作区产业核心和关键技术攻关项目（总经费1000万）, 2025-2027, 课题负责人

  代表性成果：

  [1] J. Dong, and J. Zhong*, “Recent Advances in Symbolic Regression”, ACM Computing
  Surveys, 2025, Accepted.

  [2] M. -Y. Zheng, Y. Wang, J. Zhong and J. Zhang, Discovering Infinite Recursive
  Conjectures Through Genetic Programming, in IEEE Transactions on Evolutionary Computation,
  doi: 10.1109/TEVC.2025.3611312.

  [3] X. Han, J. Zhong*, Z. Ma, X. Mu, and N. Gligorovski, “Transformer-assisted Genetic
  Programming for Symbolic Regression,” IEEE Computational Intelligence Magazine,
  vol. 20,no. 2, pp. 58-79, May 2025

  [4] J. Zhong, J. Dong, W.-L. Liu, L. Feng and J. Zhang, “Multiform Genetic Programming
  Framework for Symbolic Regression Problems,” IEEE Transactions on Evolutionary Computation,
  vol. 29, no. 2, pp. 429-443, April 2025.

  [5] X. Han,  X. Mu, J. Zhong*,” HGFF: A Deep Reinforcement Learning Framework for
  Lifetime Maximization in Wireless Sensor Networks,” IEEE Transactions on Artificial
  Intelligence, vol. 6, no. 4, pp. 859-873, April 2025.

  [6] J. Dong, J. Zhong*, W. Liu, and J. Zhang, “Evolving Equation Learner For Symbolic
  Regression”, IEEE Transactions on Evolutionary Computation, 2024, Accepted

  [7] 麦伟杰，刘伟莉，钟竞辉*，基于机器学习的演化多任务优化框架，计算机学报，2023，已接收

  [8] 钟竞辉，林育钿，李稳强，蔡文桐，基于数字孪生的机场人群智慧管控技术，系统仿真学报，2023-02-17

  [9] Z. Huang, Y. Mei*, and J. Zhong*, “Semantic Linear Genetic Programming for Symbolic
  Regression,” IEEE Transactions on Cybernetics, vol. 54, no. 2, pp. 1321-1334, Feb.
  2024.

  [10] J.Zhong, D. Li, W. Cai, W.-N. Chen, Y. Shi, “Automatic Crowd Navigation Path
  Planning in Public Scenes Through Multiobjective Differential Evolution,” IEEE Transactions
  on Computational Social Systems, vol. 11, no. 1, pp. 905-918, Feb. 2024

  获奖荣誉：

  产学合作协同育人项目优秀案例，麒麟软件有限公司，2024

  IEEE TETCI 期刊年度杰出论文奖，IEEE CIS, 2023

  教育部自然科学一等奖，教育部，2010'
