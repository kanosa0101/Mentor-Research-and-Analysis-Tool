  研究方向/领域：无线传感器网络；RFID软件技术及应用；企业信息化

  教学情况：

  一直承担《计算机概论》，《数字逻辑》，《计算机组成原理》，《计算机组织与系统结构》的本专科课程的教学；还承担过《高级程序设计语言C++》,《计算机网络》的本科教学工作；曾负责《UNIX操作系统》和《JAVA程序设计语言》工程硕士工作。参与撰写电子工业出版社的《计算机组成原理习题与题解》，并多次指导学生SRP项目。

  科研情况：

  参与和负责过《智能交通综合管理系统》，《番禺信息中心信息管理系统》等纵向项目的研发；独立负责《中山三院睡眠信息系统》等横向项目的研发工作。'
