bio_raw: '姓名：刘竹琳

  E-mail

  ：

  liuzhl@scut.edu.cn

  所在团队：数据科学与人工智能团队

  研究方向：机器学习、动态神经网络架构、类脑智能、工业数据智能等

  技术职称：副教授

  导师类别：博导、硕导

  招生专业：计算机科学与技术、计算机技术

  招生类型：博士、学术型硕士、专业型硕士

  个人简介：

  刘竹琳博士，现任华南理工大学计算机科学与工学院数据科学与人工智能团队副教授，对深度网络、宽度网络和相关的优化算法理论进行了系统的学习与研究，尤其是宽度学习系统上，做出了原创性的工作。

  该网络结构在过去五年内蓬勃发展，引起了海内外许多研究团队的关注，其中包括数家省、国家重点实验室，并被广泛应用于多个场景，例如隐私计算、遗忘学习、分布式学习、持续学习等。已

  已发表IEEE Transactions 期刊文章以及其他SCI、章节以及CCF-A类会议等共37篇。其中，发表在IEEE Transactions on Neural
  Networks and Learning Systems上阐述宽度学习架构的文章，已经被Web of Science核心引用1092次，同时被列为2019年Computer
  Science领域高被引论文，并获得2021 IEEE TNNLS Outstanding Paper Award；同期发表在TNNLS阐述宽度学习理论的文章，已被Web
  of Science核心引用426次，合计被他人SCI引用2000余次。

  承担了国家自然科学基金青年项目（2021.01-2023.12）、中国博士后基金特别资助项目（2020.08-2022.07）、广东省面上项目（2021.04-2023.03）等项目，以第一核心成员参与广东省“珠江人才计划”引进创新创业团队（多模态情感大数据智能分析方法与应用，2020.10-2024.10）。

