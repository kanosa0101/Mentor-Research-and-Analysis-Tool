bio_raw: '姓名：徐雪妙

  职称 / 职务：教授/副院长

  主要研究领域：人工智能视觉技术，多模态大模型，图形图像处理，及其在智能交通、智能制造、非遗文化传承等领域的应用。

  所在团队：视觉智能及交叉融合

  办公邮箱：xuemx@scut.edu.cn

  个人简介：

  教授、博士生导师。国家级高层次人才，广东特支计划领军人才，广东省卓越青年团队牵头人，广东省大模型与生成式人工智能工程技术研究中心主任。现任计算机科学与工程学院副院长、国际校区峻德书院副院长。

  长期探索“类人渐进式场景理解”科学前沿，攻克开放动态环境下人工智能精准理解的瓶颈，多项成果被鉴定为国际领先。发表TPAMI、TIFS等顶刊论文120余篇（CCF
  A/Trans. 80+）；承担2项国家重点研发计划、2项国家自然科学基金等共计20余项国家级、省部级重点/重大项目；获得广东省科技进步二等奖（排名第1）、中国图象图形学会科技进步二等奖（排名第1）等多项荣誉。

  教育经历：

  2009/08：香港中文大学，计算机科学与工程，博士

  2005/07：华南理工大学，计算机科学与工程，硕士

  工作经历：

  2023/11-至今，   华南理工大学，计算机科学与工程学院，副院长

  2021/05-至今，   华南理工大学，广州国际校区峻德书院，副院长

  2019/05-2021/05，华南理工大学，广州国际校区，党委副书记（挂职）

  2015/09-至今，   华南理工大学，计算机科学与工程学院，教授

  2010/11-2015/09，华南理工大学，计算机科学与工程学院，副教授

  学术兼职：

  2015-至今  中国计算机学会多媒体技术、计算机视觉专委会委员

  2015-至今  中国图象图形学学会多媒体、女工委专业委员会委员

  2018-至今  中国图学学会图学大数据专委会、可视化与认知计算专委会理事

  2024-至今  广东省大模型与生成式人工智能工程技术研究中心主任

  2021-至今  广东省计算机学会数字经济委员会副主任

  2024-至今  广东省交通运输协会低空经济专业委员会副主任

  2024-至今  广州人工智能学会副会长

  2024-至今  广州智能工程研究会副会长

  课程教学：

  1.人工智能与3D视觉（主讲人，2025年国家一流课程，2023年省一流课程）

  2.Advanced Language Programming Course Design（主讲人）

  3.Advanced Language Programming(C++)(2)（主讲人）

  4.小白学人工智能（主讲人）

  5.具身人工智能系统概述 （主讲人）

  主持在研项目：

  1. 国家网信创新人才支持计划网信创新人才，“人工智能创新应用技术攻关”，2025

  2. 广东省特支计划科技创新领军人才，“新一代人工智能”，2025-2028

  3. 国家重点研发计划项目，“云边端协同的工业机器人集群运维关键技术”（课题四），2025-2027，课题负责人；

  4. 国家自然科学基金联合基金项目，“面向前列腺粒子植入的跨模态影像智能识别与动态图像精准融合的理论和方法研究”，2024-2027，联合单位负责人；

  5. 国家重点研发计划项目，“基于视觉智能技术的大规模城市交通营运安全防控关键技术研发与示范应用”，2023-2025，项目负责人；

  6. 广东省自然科学基金卓越青年团队项目，“机器元学习方法研究”，2024-2027，项目负责人；

  7. 广州市重点研发计划项目，“骨科微创手术辅助机器人及模拟训练系统”，2023-2026,联合单位负责人；

  获奖荣誉：

  1. 茅以升科学技术奖——交通运输科学技术奖三等奖，北京茅以升科技教育基金会，2025

  2. 中国轻工业联合会科学进步奖二等奖，2025

  3. 中国仪器仪表学会科技进步三等奖，中国仪器仪表学会，2025

  4. 中国图象图形学会科技进步二等奖（第一完成人），中国图象图形学会，2022

  5. 广东省科技进步二等奖（第一完成人），广东省人民政府，2022

  6. 中国公路学会科学技术二等奖，中国公路学会，2022

