bio_raw: '姓名：聂勇伟

  职称 / 职务：副教授

  主要研究领域：视频理解、智能眼镜

  所在团队：交叉智能团队

  办公邮箱：nieyongwei@scut.edu.cn

  办公室电话：

  个人简介：

  聂勇伟现为华南理工大学副教授，博士生导师。主持国家自然科学基金，广东省自然科学基金，广州市科技计划等项目十余项。获湖北省自然科学二等奖，湖北省自然科学优秀学术论文一等奖，CCF
  CAD/CG 2022最佳论文奖。在计算机图形学领域 Top期刊ACM Transactions on Graphics和会议SIGGRAPH，SIGGRAPH
  Aisa，以及IJCV，TVCG，TIP等Top期刊和CVPR，ICCV，NIPS，ICLR等Top会议上发表或接收论文50余篇，其中CCF A类通讯/一作论文30余篇。申请专利20项，获发明专利授权13项。研究成果涵盖计算机图形学、计算机视觉等方向。

  教育经历：

  年份//学校/学位

  2009/09-2015/06，武汉大学，计算机学院，工学博士

  2005/09-2009/06，武汉大学，计算机学院，学士

  工作经历：

  年份/单位名称/职务/职级

  2019/09-至今，华南理工大学，计算机科学与工程学院，副教授

  2018/09-2019/08，华南理工大学，计算机科学与工程学院，副研究员

  2017/08-2018/08，华南理工大学，计算机科学与工程学院，讲师、博士后副研究员

  2015/07-2017/07，华南理工大学，计算机科学与工程学院，博士后，合作导师：李桂清

  学术兼职：

  年份/机构名称/职务

  1)广东省图象图形学会元宇宙与智能交互专业委员会，常委

  2) 健康智能感知与数字平行人教育部工程研究中心成员

  3)广东省大模型与生成式人工智能工程技术研究中心成员

  4)中国图象图形学会智能图形学专委会委员

  5)广东省图象图形学会专业委员会委员

  课程教学（选填）：

  个人主讲课程名称

  《数字图像分析》

  《MATLAB在数字图像处理中的应用》

  《软件测试与质量保证》

  《Multimedia Technology》

  《面向元宇宙的4D智能空间技术》

  科研项目：

  按级别从高到低排列，包括项目名称、项目来源（国家级 / 省部级 / 横向等）、起止时间、角色（负责人 / 参与人）

  主持国家自然科学基金，广东省自然科学基金，广州市科技计划等项目十余项。

  代表性成果：

  1. 学术论文（列出个人发表的，具影响力的学术论文，注明作者、标题、期刊 / 会议名称、发表时间）2. 专著 / 教材（名称、出版社、出版时间）

  [1] Yongwei Nie, Wei Ge, Siming Zeng, Qing Zhang, Guiqing Li, Ping Li, Hongmin Cai.
  Occlusion-preserved surveillance video synopsis with flexible object graph. International
  Journal of Computer Vision (IJCV). Volume 133, pages 2653–2669, 2025.

  [2] Yongwei Nie, Mingxian Fan, Chengjiang Long, Qing Zhang, Jian Zhu, Xuemiao Xu.
  Incorporating Test-Time Optimization into Training with Dual Networks for Human
  Mesh Recovery. Proceedings of the thirty-eighth Annual Conference on Neural Information
  Processing Systems (NeurIPS 2024). Vancouver, Canada, Dec 9-15, 2024.

  [3] Yongwei Nie, Jiaqi Yu, Chengjiang Long, Qing Zhang, Guiqing Li, Hongmin Cai.
  Single-Image SVBRDF Estimation Using Auxiliary Renderings as Intermediate Targets.
  IEEE Transactions on Visualization and Computer Graphics (TVCG). 10.1109/TVCG.2024.3422079.

  [4] Yongwei Nie, Changzhen Liu, Chengjiang Long, Qing Zhang, Guiqing Li, Hongmin
  Cai. Multi-RoI Human Mesh Recovery with Camera Consistency and Contrastive Losses.
  Proceedings of the 18th European Conference on Computer Vision (ECCV 2024). MILAN,
  Italy, 29 Sep. - 04 Oct., 2024.

  [5] Yongwei Nie, Hao Huang, Chengjiang Long, Qing Zhang, Pradipta Maji, Hongmin
  Cai. Interleaving One-Class and Weakly-Supervised Models with Adaptive Thresholding
  for Unsupervised Video Anomaly Detection. Proceedings of the 18th European Conference
  on Computer Vision (ECCV 2024). MILAN, Italy, 29 Sep. - 04 Oct., 2024.

  获奖荣誉：

  按时间倒序排列，包括奖项名称、授予单位、授予时间

  1) CCF第24+25届全国计算机辅助设计与图形学学会会议(CCF CAD/CG 2021+2022)最佳论文奖，杨韫韬(学生),聂勇伟(通讯作者),张青,李平,李桂清.基于RNN和注意力机制的双向人体姿态补全方法.

  2) 2019年度湖北省自然科学二等奖，肖春霞，何发智，邹勤，聂勇伟，张青，多元视觉信息的内容处理与编辑.

  3) 2016年度ACM(武汉)博士学位论文奖.

  4) Compact Video Synopsis Via Global Spatiotemporal Optimization. Yongwei Nie, Chunxia
  Xiao, Hanqiu Sun, Ping Li. 湖北省第十五届自然科学优秀学术论文一等奖.'
