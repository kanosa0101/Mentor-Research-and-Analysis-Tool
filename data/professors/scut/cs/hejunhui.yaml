bio_raw: '姓名：何军辉

  职称 / 职务：副教授

  主要研究领域：多媒体安全、人工智能安全

  所在团队：软件可靠性保障与网络空间安全

  办公邮箱：hejh@scut.edu.cn

  个人简介：

  何军辉，CCF会员，CSIG会员/数字媒体取证与安全专委会委员，先后主持或参与NSFC-广东联合基金、广东省自然科学基金面上项目、广东省科技计划、广州市科技计划等项目，曾担任广东省科技特派员，获广东省科学技术三等奖，授权发明专利十多项，发表学术论文二十多篇。曾获本科教学优秀二等奖、本科生科技创新优秀指导教师二等奖和优秀班主任等，指导学生获全国大学生信息安全竞赛二等奖、专业实践优秀研究生、广东省南天高校杯软件作品设计一等奖等。

  教育经历：

  2006/中山大学/博士

  2000/华南理工大学/硕士

  1997/中南大学/学士

  工作经历：

  2009/华南理工大学/副教授

  2006/华南理工大学/讲师

  代表性成果：

  [1] J. He∗, S. Huang, S. Tang, and J. Huang, ”JPEG image encryption with improved
  format compatibility and file size preservation,” IEEE Transactions on Multimedia,
  vol. 20, no. 10, pp. 2645–2658, 2018.

  [2] J. He∗, J. Chen, W. Luo, S. Tang, and J. Huang, “A novel high-capacity reversible
  data hiding scheme for encrypted JPEG bitstreams,” IEEE Transactions on Circuits
  and Systems for Video Technology, vol. 29, no. 12, pp. 3501–3515, 2019.

  [3] J. He∗, J. Chen, and S. Tang, “Reversible data hiding in JPEG images based on
  negative influence models,” IEEE Transactions on Information Forensics and Security,
  vol. 15, pp. 2121–2133, 2020.

  [4] J. He∗, Y. Xu, W. Luo, S. Tang, and J. Huang, “A novel selective encryption
  scheme for H.264/AVC video with improved visual security,” Signal Processing Image
  Communication, vol. 89, p. 115994, 2020.

  [5] J. He∗, X. Pan, H. tian Wu, and S. Tang, “Improved block ordering and frequency
  selection for reversible data hiding in JPEG images,” Signal Processing, vol. 175,
  p. 107647, 2020.

  [6] Y. Chen, J. He∗, and YuntingXian, “Reversible data hiding for JPEG images based
  on improved mapping and frequency ordering,” Signal Processing, vol. 198, 2022.'
