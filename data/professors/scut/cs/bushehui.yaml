bio_raw: '日期：2012年11月13日 14:01:47

  布社辉的个人简介：

  布社辉，男，2006年3月取得日本国立筑波大学工学博士学位，2006年4月至2008年10月曾就职于日本日立制作所中央研究所，从事语音合成方面的研究开发工作。2008年10月至今为华南理工大学计算机科学与工程学院讲师。主要从事语音合成，韵律分析，语音识别，多国语言的分类可视化等方面的研究工作。'
