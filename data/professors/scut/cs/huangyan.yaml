bio_raw: '姓名：黄艳

  职称 / 职务：副教授

  主要研究领域：图像处理、模式识别、人工智能

  所在团队：大数据与视觉计算

  办公邮箱：aihuangy@scut.edu.cn

  办公室电话：无

  个人简介：

  黄艳，现任华南理工大学计算机科学与工程学院副教授，博士生导师；于2013年和2018年分别获得湖南大学学士学位和华南理工大学博士学位；曾在新加坡国立大学、北京大学深圳研究生院等机构从事科研工作。主要研究兴趣为图像处理、模式识别与人工智能；主持国家自然科学基金、广东省自然科学基金、广州市科技计划、博士后基金、中央高校基金、国家级平台开放课题等项目，参与多项国家级、省部级和校企合作科研项目；发表高水平学术论文30余篇；获得了2019年度广东省科技进步二等奖和2021年广东省电子信息行业科学技术进步一等奖等奖项。

  教育经历：

  2013.09~2018.06: 华南理工大学，计算机科学与工程学院，博士，导师：许勇教授

  2009.09~2013.06: 湖南大学，信息科学与工程学院，本科

  工作经历：

  2021.09至今：华南理工大学，计算机科学与工程学院，副教授

  2020.07~2021.05: 北京大学深圳研究生院，信息工程学院，高级研究助理（科研系列）

  2018.06~2020.07: 华南理工大学，电子与信息学院，博士后，合作导师：金连文教授

  2015.09~2015.12: 新加坡国立大学，理学院，研究助理

  学术兼职：

  IEEE TPAMI、IEEE TNNLS、IEEE TCSVT、Pattern Recognition、Image and Vision Computing、CVPR、AAAI、ICME等国际著名期刊和会议审稿人

  中国计算机学会会员

  中国图象图形学会会员

  深圳市人工智能学会会员

  课程教学（选填）：

  离散数学、Discrete Mathematics、Visual Computing、Sparse Representation、神经网络与深度学习等

  科研项目：

  1. 国家重点研发计划：中法图像处理与通信联合实验室，2024.07-2027.06（参与）

  2. 国家自然科学基金面上项目：面向非特定流形结构化数据的稀疏编码关键技术研究，2019.01-2022.12（参与）

  3. 国家自然科学基金青年项目：基于重影线索的单图像去反射关键技术研究，2020.01-2022.12（主持）

  4. 国家自然科学基金青年项目：基于稀疏表达与间隙度描述的纹理分析研究，2017.01-2019.12（参与）

  5. 中央高校基金重点项目：基于病毒传播模型的校内疫情发展态势预测，2024.09-2026.09（主持）

  6. 广东省科技计划项目-国际合作：图像/视频增强和认知关键技术研究及应用，2020/01-2021/12（参与）

  7. 广东省自然科学基金面上项目：区分性稀疏编码关键技术研究, 2017.05-2020.05（参与）

  8. 广州市科技计划项目-重点研发计划：面向智慧城市的感知与认知智能关键技术研究及应用，2024.01-2026.12（参与）

  9. 广州市科学技术局基础研究计划项目：弱光条件下的图像去反射关键技术研究，2024.04-2025-03（主持）

  10. 中国博士后科学基金面上项目：针对高维视觉数据识别的卷积字典学习方法研究, 2018.09-2020.06结题（主持）

  11. 校级教研教改项目：线上-线下混合式教学质量保障研究，2023.06-2025.06（主持）

  12. 华南理工大学2023年度本科精品教材专项建设项目，2022-2023（参与）

  13. 校企合作项目：中国书法碑帖数字大辞典和书法特征智能识别关键技术研发及应用，2019/04-2021/04（参与）

  代表性成果：

  1. Yan Huang, Xiaoshan Liao, Jinxiu Liang*, Yuhui Quan, Boxin Shi, Yong Xu. Zero-Shot
  Low-Light Image Enhancement via Latent Diffusion Models. AAAI, 2025.

  2. Yan Huang, Xiaoshan Liao, Jinxiu Liang*, Boxin Shi, Yong Xu, LE Callet, Patrick.
  Detail-Preserving Diffusion Models for Low-Light Image Enhancement. IEEE TCSVT,
  2025.

  3. Yan Huang, Huixin Luo, Yong Xu, Xianbing Meng*. A temporally-aware noise-informed
  invertible network for progressive video denoising. Image and Vision Computing,
  2025.

  4. Yan Huang, Xinchang Lu, Yuhui Quan*, Yong Xu, Hui Ji. Image Shadow Removal via
  Multi-Scale Deep Retinex Decomposition. Pattern Recognition, 2024.

  5. Yuhui Quan, Xi Wan, Tianxiang Zheng, Yan Huang*, Hui Ji. Dual-path Deep Unsupervised
  Learning for Multi-focus Image Fusion. IEEE TMM, 2025.

  6. Yuhui Quan, Xiaoheng Tan, Yan Huang*, Yong Xu, Hui Ji. Enhancing Underwater Images
  via Asymmetric Multi-Scale Invertible Networks. ACM Multimedia, 2024.

  7. Le Jiang, Yan Huang*, Lianxin Xie, Wen Xue, Cheng Liu, Si Wu*, Hau-San Wong.
  Hunting Blemishes: Language-guided High-fidelity Face Retouching Transformer with
  Limited Paired Data. ACM Multimedia, 2024.

  8. Yuhui Quan, Xiaoheng Tan, Yan Huang*, Yong Xu, Hui Ji. Image Desnowing via Deep
  Invertible Separation. IEEE TCSVT, 2023.

  9. Yan Huang, Zihan Zhou, Xiangyu Sai, Yong Xu, & Yuexian Zou. Hierarchical hashing-based
  multi-source image retrieval method for image denoising[J]. Applied Soft Computing,
  2021, 113: 108028.

  10. Yan Huang, Yuhui Quan, Yong Xu, Ruotao Xu, & Hui Ji. Removing Reflection from
  a Single Image with Ghosting Effect. IEEE Transactions on Computational Imaging,
  2020, 6: 34-45.

  获奖荣誉：

  1. 2021年度广东省电子信息行业科学技术进步一等奖，智能金融服务机器人研发及产业化

  2. 2019年度广东省科技进步奖二等奖，基于虚拟机器人的政务服务平台'
