bio_raw: '日期：2012年11月27日 21:13:36

  贺小箭，男，博士，副教授。上海交通大学计算机软件与理论专业博士毕业。华南理工大学计算机科学与工程学院副教授，硕士生导师。硕士招生专业为计算机应用技术。在教学工作中，担任过：操作系统、计算机网络、分布式计算、数据结构、计算机组成原理等课程的授课任务。长期致力于开放式动态环境下的软件运行技术、普适计算环境下的计算协调与终端系统、商业数据分析、商务智能处理与自动化编程、生物特征识别及其应用系统研究，力求通过实践活动推动研发系统的深入开展，并检验研发成果的实效性。主持开发的嵌入式系统软件运行平台、大型分布式商管软件在一些行业企业进行推广应用，为广泛的电子办公、电子商务提供了技术和系统支撑。在

  IEEE Transactions on Consumer Electronics

  、

  Lecture Notes in Computer Science

  、计算机研究与发展等刊物上发表了多篇学术论文。

