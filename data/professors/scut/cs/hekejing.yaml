bio_raw: '姓名：何克晶

  职称 / 职务：教授

  主要研究领域：人工智能、大数据技术及应用

  所在团队：

  办公邮箱：kjhe@scut.edu.cn

  办公室电话：

  个人简介：

  何克晶，博士，教授（华南理工大学计算机科学与工程学院），博士生导师，广东省本科高校智能计算联合实验室负责人，广东省通信学会人工智能专业委员会副主任，广东省计算机学会物联网与网络专业委员会副主任，中国计算机学会高级会员，广东省高等学校优秀青年教师，珠江科技新星，中国计算机学会高性能计算专家委员会执行委员、计算机教育专家委员会执行委员，入选广东省培养高层次人才特殊支持计划。先后获得国家留学基金委-IBM奖研金，华南理工大学-华为“智能基座”奖教金，教育部-华为智能基座“栋梁之师”称号，“智能基座”华为云与计算先锋教师称号，广东省教学成果奖（二等奖），参与的“中国教育科研网格”项目获得国家科技进步二等奖。

  历任网络工程系主任，教授。主要的研究领域为人工智能与大数据处理，高性能计算与云计算。主持和参与国家自然科学基金、广东省科技计划重大专项、广东省自然科学基金等国家、省部级及其他科研项目40余项。近年来，在AAAI，IJMLC，JBHI，PRE等权威期刊和会议上发表SCI和EI索引论文80余篇。获发明专利授权20余件。

  主讲“智能计算基础”、“高性能计算与云计算”课程，其中承担的《高性能计算与云计算》为教育部-IBM产学合作专业综合改革精品课程、广东省精品资源共享课程、教育部产学合作协同育人项目共建课程、华南理工大学—华为“智能基座”产教融合协同育人基地一流本科课程。主持广东省专业综合改革试点（网络工程专业）等教研教改项目建设。

  教育经历：

  1999-2002，华南理工大学，本科

  2002-2004，华南理工大学，硕士

  2004-2007，华南理工大学，博士

  工作经历：

  2014/9–至今，华南理工大学，计算机科学与工程学院，教授

  2014/3–2018/3，华南理工大学，计算机科学与工程学院网络工程系，系主任

  2009/12–2014/9，华南理工大学，计算机科学与工程学院，副教授

  2007/07 –2009/12，华南理工大学，计算机科学与工程学院，讲师

  2014/02–2014/08，香港中文大学，访问学者

  2005/12–2006/06，美国Los Alamos国家实验室，研究助理

  2005/11–2005/12，美国Alabama大学，访问学者

  学术兼职：

  广东省本科高校智能计算联合实验室负责人

  广东省通信学会人工智能专业委员会副主任

  广东省计算机学会物联网与网络专业委员会副主任

  中国计算机学会高性能计算专家委员会执行委员

  中国计算机学会计算机教育专家委员会执行委员

