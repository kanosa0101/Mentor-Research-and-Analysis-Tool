bio_raw: '姓名：俞鹤伟

  职称 / 职务：教授

  主要研究领域：计算机视觉、模式识别、机器学习

  所在团队：多模态与类脑智能计算

  办公邮箱：hwyu@scut.edu.cn

  办公室电话：无

  个人简介：

  俞鹤伟，博士生导师。曾赴美国哥伦比亚大学和佛罗里达大学做访问学者。长期从事人工智能和无线网络技术的研究，曾主持国家自然科学基金、广东省自然科学基金、广东省教育部产学研合作项目、广东省科技计划项目、广州市重点研发计划重大科技专项、中央高校基本科研业务费重点项目及若干信息领域横向项目的研究工作。曾在国内外重要学术期刊或国际会议上发表论文80余篇，其中36篇被SCI或EI收录，获授权发明专利7件、计算机软件著作权32项。2014年荣获第七届广东教育教学成果（高等教育）一等奖，2023年获第三届全国高校教师教学创新大赛广东分赛二等奖，同年入选教育部高等学校计算机类专业教学指导委员会“2022-2023年度高校计算机专业优秀教师奖励计划”。

