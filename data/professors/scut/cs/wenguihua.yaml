bio_raw: '姓名：文贵华

  职称 / 职务：教授

  主要研究领域：脑认知计算、机器学习、情感识别、智能医疗

  所在团队：华南理工大学机器学习与数据挖掘团队负责人、广东省人工智能中医工程技术研究团队负责人

  办公邮箱：crghwen@scut.edu.cn

  个人简介：

  提出了认知几何方法，创造性机器学习方法，分阶段学习方法，内成像神经网络等新方法，研究成果分别发表在IEEE Traction on cybernetics、IEEE
  Transaction on Multimedia、Pattern Recognition等JCR 1区期刊。发表一作或通信SCI论文55篇，获授权发明专利33项。与英国南安普顿大学副校长，英国两院院士，曾任ACM主席的Dame
  Wendy Hall签署了校际协议，组建了知识图谱及其医疗应用的国际化研究团队。申请项目属于典型的多学科交叉，涉及到人工智能、物理学、数学、中医学、中西医结合等学科，项目组在交叉学科研究方面有较好的前期研究基础。

  教育经历：

  (1) 1998-9 至 2001-7/华南理工大学/博士

  (2) 1991-9 至 1994-4/南京航空航天大学/硕士

  (3) 1987-9 至 1991-7/湖北汽车工业学院/学士

  工作经历：

  (1)  2009-12 至 今/华南理工大学, 计算机学院/教授

  (2)  2006-09 至 2009-12/华南理工大学, 计算机学院/ 副研究员

  (3)  2003-12 至 2006-09/华南理工大学, 计算机应用研究所/副研究员

  (4)  1994-04 至 2003-12/华南理工大学, 计算机应用研究所/工程师

  学术兼职：

  2018至今/世界中医药联合会诊断分会/常务理事

  2020-2024/中华中医药学会治未病分会/常务理事

  2020-2024/世界中医药联合会信息分会/常务理事

  2022-2027/中国中医药信息学会信息诊断分会/常务理事

  2023起/中国中医药信息学会人工智能分会/常务理事

  2023-2028/全国卫生产业企业管理协会治未病分会/常务理事

  2024起/中国社区卫生协会社区中医药专业委员会/委员

  课程教学：

  人工智能

  科研项目：

  [1] 可解释深度神经网络舌诊方法研究，国家自然科学基金面上项目，2022-2025，项目负责人

  [2] 基于复杂感知和深度学习的中医诊疗康复设备研发，广东省重点领域研发计划项目，2020-2024，项目负责人

  [3] 基于智能中医的食疗养生装备研发，广州市重点领域研发计划项目，2023-2025，项目负责人

  [4] 构建中医药治未病技术体系促进“中医药+”新业态创新发展--以高尿酸血症防治为例，广州地区中医药重大科技项目，2025-2027，参与单位负责人

  [5] 基于连续对话的智能针灸问诊系统研发，广州市市校(院)联合资助项目，2024-2025，参与单位负责人

  [6] 基于大规模知识图谱的人工智能针灸诊疗方法与系统研究，广州市市校(院)联合资助项目，2023-2024，参与单位负责人

  [7] 广州市中医院和华南理工大学《智能中医诊疗联合实验室》项目，2023-2026，负责人

  [8] 人工智能大数据中医望诊关键技术及平台研发，广州市产学研协同创新重大专项，2018-2020，参与单位负责人

  [9] 大数据体质辨识关键技术及移动应用研发，广州市产学研协同创新重大专项，2016-2017，项目负责人

  [10] 格式塔规律的几何推理关键技术研究，国家自然科学基金面上项目，2013-2016，项目负责人

  [11] 基于认知规律几何化的流形学习，国家自然科学基金面上项 目，2010-2012，项目负责人

  [12] 老年人情绪视频监控系统研发，广东省公益研究与能力建设专项资金，2015-2016，项目负责人

  [13] 大数据特定人群识别关键技术研发，广东省公益研究与能力建设专项资金，2016-2017，项目负责人

