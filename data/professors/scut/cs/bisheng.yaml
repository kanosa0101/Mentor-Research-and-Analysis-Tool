bio_raw: '姓名：毕盛

  职称 / 职务：副教授

  主要研究领域：智能机器人、智能系统、嵌入式系统和边缘计算

  所在团队：先进计算体系结构

  办公邮箱：picy@scut.edu.cn

  办公室电话：无

  个人简介：

  嵌入式技术大会专家委员，CCF嵌入式系统专家委员，获教育部-华为“智能基座”优秀教师奖励，教育部-华为“智能基座”栋梁之师，鸿蒙生态高校人才领域优秀教师，华为开发者布道师，华为云开发者专家(HCDE)，发表SCI/EI研究论文40多篇，授权发明专利20多项，主编出版嵌入式和智能系统相关书籍7部，主持和参与完成国家级、省部级和企业30多项研究项目。指导学生参加华为云人工智能大赛和中国机器人大赛等获得冠军成绩，并获“教育部产学合作协同育人项目”优秀项目案例，
  广东“金博奖”科普突出贡献奖等奖励。

  教育经历：

  华南理工大学，计算机应用技术，博士

  先后在香港城市大学和香港大学进行博士后研究工作

  工作经历：

  华南理工大学 计算机科学与工程学院 副教授

  学术兼职：

  无

  课程教学（选填）：

  嵌入式系统，数字逻辑，智能系统及应用，数字系统创意设计'
