bio_raw: '姓名：徐玲玲

  职称 / 职务：副教授 / 信息安全系主任

  主要研究领域：数据安全与隐私保护、人工智能安全、密码学

  办公邮箱：csllxu@scut.edu.cn

  办公室电话：18826463520

  个人简介：

  广东省密码科学咨询专家，广东省云计算应用协会教育数字化专业委员会副主任，广东省工业软件学会软件安全专业委员会常务委员，CCF会员、中国密码学会会员。在国内外权威学术会议和期刊上，已发表与本项目相关论文50余篇，分别发表于IEEE
  Transactions系列期刊等多个国内外权威期刊。主持国家自然科学基金项目、广东省自然科学基金项目和企事业委托项目多项，并参与国家自然科学基金重点项目等多项国家级项目。

  教育经历：

  Ø 2008-09 至 2011-06, 中山大学，博士，导师：张方国教授

  Ø 2005-09 至 2008-06, 山东大学，硕士，导师：王小云院士

  Ø 2001-09 至 2005-06, 山东大学，学士

  工作经历：

  Ø 2016 至今, 华南理工大学, 计算机科学与工程学院, 副教授

  课程教学：

  信息安全数学基础

  信息安全导论

  PKI原理与技术

  数字认证技术

  计算机安全

  科研项目：

  南方数字集团，访问链路风险智能识别算法研究，参与，在研

  国家自然科学基金青年项目，云计算环境下的安全外包计算研究，主持，结题

  国家自然科学基金-重点项目，群体感知的隐私保护方法，核心成员，结题

  广东省自然科学基金面上项目，更强安全模型下的云外包计算协议研究，主持，结题

  广州市重点研发计划，面向金融行业应用的信息安全及风险防控人工智能决策平台，核心成员，结题

  南方电网研究院，基于联邦学习的电力大数据隐私保护技术研究，主持，结题

  973计划课题，抗量子密码分析的多变量密码体制研究，核心成员，结题

  代表性成果：

  Lingling Xu*, Xiaofeng Chen, Fangguo Zhang, Wanhua Li, Hao-tian Wu, Shaohua Tang, Yang
  Xiang. “ASBKS: Towards attribute set based keyword search over encrypted personal
  health records”. IEEE Transactions on Dependable and Secure computing, 18(6): 2941-2952
  (2021).

  Lingling Xu*, Wanhua Li, Fangguo Zhang, Rong Cheng, Shaohua Tang. “Authorized keyword
  searches on public key encrypted data with time-controlled keyword privacy”. IEEE
  Transactions on Information Forensics and Security, 15(1): 2096-2109, December 2020.

  Yu Lin, Lingling Xu*, Wanhua Li, Zhiwei Sun, Attribute Set-Based Boolean Keyword
  Search over Encrypted Personal Health Records, Security and Communication Networks,
  vol. 2021, Article ID 9023141, 13 pages, 2021.

  获奖荣誉：

  华南理工大学本科优秀指导教师奖

  华南理工大学优秀班主任奖'
