title: 教授
bio_raw: '姓名：李桂清 性别：男 出生年份：1966.2 民族:汉 籍贯：广西 学历：博士 职称（职务）：教授 研究兴趣：数字几何处理,3D动画, 图像编缉,
  可视分析等

  教学情况（概括说明，不要求列清单）：承担算法设计,计算机图形学,数据结构,计算几何,数字几何处理等课程教学

  科研情况（概括说明，不要求列清单）：

  研究围绕数字几何处理特别是细分曲面造型及应用领域展开. 涉及细分曲面构造与分析、细分曲面拟合、自适应细分、GPU快速绘制、网格优化与光顺等内容. 目前研究兴趣集中在基于三维形状与结构分析的几何造型方法,
  如逆向工程中的控制网格构造、三维模型的基于内容检索与替换、基于形状分析的网格模型造型与计算机动画等。也比较关注数字几何处理在GIS、医学图像处理、分子几何及植物生长仿真等研究领域中的应用。

  已主持过三项国家自然科学和两项广东省自然科学基金项目的研究. 在IEEE TVCG, Computer Graphics Forum, CAGD, Graphical
  models, The Visual Computer, Computers and Graphics等国际期发表论文近20篇. 是CSIAM几何设计与计算专委会和CCF
  CAD/CG专委会委员，担任《计算机辅助设计与图形学学报》和《CADDM》编委。

  曾获陆增镛CAD&CG高科技二等奖，广东省科技进步二等奖，GDC 2007优秀论文奖。

  研究主页：

  ;

  http://www.cadcg.org/'
