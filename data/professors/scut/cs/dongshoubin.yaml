bio_raw: '姓名：董守斌

  职称 / 职务：教授

  主要研究领域：多模态大数据分析、高性能计算与云计算、信息检索与大语言模型

  所在团队：大数据与高性能计算团队

  办公邮箱：sbdong@scut.edu.cn

  办公室电话：020-39380238

  个人简介：

  教授、博士生导师，1994年毕业于中国科学技术大学电子工程与信息科学专业获工学博士学位，美国卡耐基-梅隆大学访问学者。主持国家863项目、国家自然科学基金，国家发改委下一代互联网计划，教育部重大专项、广东省自然科学基金项目重大基础培育、前沿与关键技术创新重大专项、应用型科技研发专项等多项国家和省部级重大科研项目。在国内外学术刊物及会议上发表科研论文100余篇，出版专著4部，获授权发明专利50多项。曾获国家科技进步二等奖1项、广东省科技进步奖二等奖2项、教育部科技进步一等奖1项。指导毕业博士硕士生超过200名，获华南理工大学首届“我最喜爱导师”称号。

  教育经历：

  1994   中国科学技术大学 信息科学与电子工程 博士

  1991   中国科学技术大学 信息科学与电子工程 硕士

  1988   中国科学技术大学 信息科学与电子工程 学士

  工作经历：

  2005.12-至今华南理工大学计算机学院 教授

  2001.9-2002.8美国卡耐基-梅隆大学计算机学院 访问学者

  1997.9-2005.11华南理工大学电信学院 副教授

  1994.11-1997.8华南理工大学电信学院 讲师

  学术兼职：

  中文信息学会信息检索学会常务委员

  课程教学（选填）：

  l 研究生课程：信息检索与大语言模型

  l 本科生课程：新一代网络体系结构、 高性能计算与云计算

  科研项

  目

  ：

  l 高性能IPv6路由器基础平台及实验系统，国家863计划项目，2002/03-2004/04，主持

  l 下一代互联网分布式搜索引擎应用示范，国家发改委CNGI项目，2008/12-2010/12，主持

  l 肿瘤生长调节机制的系统建模及高性能计算方法研究，国家自然科学基金项目，2011/01 2013/12，主持

  l 基于云计算的生物基因大数据管理技术研究，广东省自然科学基金-重大基础研究培育， 2015/08-2019/08，主持

  l 基于移动广告大数据分析的手机游戏服务平台，广东省前沿与关键技术创新专项，2015/01-2017/12，主持

  l 面向桥梁长期健康监测的大数据处理技术及应用，广东省应用型科技研发专项，2015/01-2017/12，共同主持

  l 基于多组学学习的智能医疗辅助诊断技术及应用，广东省中山市引进高端科研机构创新专项资金项目，2019/09-2024/06，主持

  代表性成果：

  l Ziye Zhang, Weixian Huang, Shijin Wang, Kaiwen Tan, Xiaorou Zheng, Shoubin Dong*.
  ADFusion: Multi-modal adaptive deep fusion for cancer subtype prediction. Information
  Fusion, 2025, 121: 103138

  l Xiaofeng Liu, Jiajie Tan, Shoubin Dong*, Knowledge enhanced edge-driven graph
  neural ranking for biomedical information retrieval, Expert Systems with Applications,
  2025, 263:125787

  l Zhidong Huang, Xiaofei Wua, Shoubin Dong*, Multi-objective Task Offloading for
  Highly Dynamic Heterogeneous Vehicular Edge Computing: an Efficient Reinforcement
  Learning Approach, Computer Communications, 225: 27-43, 2024

  l Yichen He, Xiaofeng Liu, Jinlong Hu, and Shoubin Dong*, Entity Relation Aware
  Graph Neural Ranking for Biomedical Information Retrieval, IEEE International Conference
  on Bioinformatics and Biomedicine (BIBM), 2023:1118-1124

  l Kaiwen Tan, Weixian Huang, Xiaofeng Liu, Jinlong Hu, Shoubin Dong*, A multi-modal
  fusion

  framework based on multi-task correlation learning for cancer prognosis prediction,
  Artificial Intelligence in Medicine, 2022, 126: 102260

  l Zuoxi Yang, Shoubin Dong*, HAGERec: Hierarchical Attention Graph Convolutional
  Network In corporating Knowledge Graph for Explainable Recommendation, Knowledge-Based
  Systems, 2020, 204: 106194

  l 周静、董守斌*、唐德玉，基于入侵肿瘤生长优化的云计算调度算法，计算机学报，41(6): 1360-1374, 2018.6

  l 董守斌，袁华，网络信息检索，西安电子科技大学出版社，2010

  获奖荣誉：

  l 面向桥梁长期健康监测的大数据处理技术及应用, 广东省科技进步二等奖（排名第二），广东省人民政府,  2021

  l 中国教育科研网格，国家科技进步二等奖（排名第八），国务院，2008

  l 中国教育科研网格，教育部科技进步一等奖（排名第六），教育部，2007

  l 智能邮件处理系统，广东省科技进步二等奖（排名第一），广东省人民政府，2006'
