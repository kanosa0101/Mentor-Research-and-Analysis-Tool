bio_raw: '个人简介

  Personal profile

  李伟明，男，1975年04月03日生，华中科技大学网络与计算中心副教授，1997年毕业于华中理工大学计算机系，2000年和2006年在华中科技大学计算机科学与技术学院分别获硕士和博士学位，主要研究方向为网络安全。作为项目负责人主持国家自然科学基金、国家863计划、国家科技攻关计划'
