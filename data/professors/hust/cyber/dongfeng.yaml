bio_raw: '个人简介

  Personal Profile

  基本信息：

  董枫，华中科技大学网络空间安全学院副教授、博士生导师，武汉金银湖实验室特聘研究员，入选 "武汉英才" 计划。目前也是王浩宇教授领导的Security Pride
  Group成员。在2023年加入学术界之前，我曾在深信服科技股份有限公司（Sangfor Technologies）担任高级安全研究员五年，积累了丰富的工业界经验。2018年，我获得北京邮电大学计算机科学博士学位。本页面不常更新，详细请参见：

  https://fengdonghust.github.io/

  研究方向：

  凭借“工业界+学术界”的双重背景，我与腾讯、绿盟科技（NSFOCUS）、深信服等头部安全企业保持着密切的研究协作。我的研究始终扎根于企业实际安全场景，聚焦解决真实环境中的安全挑战，核心研究方向为

  网络与系统安全，特别专注于APT攻击检测和漏洞攻防，

  包括：

  下一代检测与响应

  ：涵盖大语言模型（LLM）赋能的高级持续性威胁（APT）攻击检测、安全运营中心（SOC）告警降噪、自主响应智能体等。

  终端evasion与防御

  ：包括端点检测与响应（EDR）规避技术评估、EDR攻防智能体之间的对抗博弈等。

  漏洞研究

  ：涉及大语言模型赋能的漏洞挖掘、自动化漏洞利用生成（AEG）等。

  相关成果概述：

  长期聚焦网络与系统安全领域，主攻终端高级威胁攻防对抗、智能化安全检测与防御技术研究。主持 GF 科研纵向（500 万元）、国家自然科学基金面上项目、国家自然科学基金青年项目、湖北省重点研发计划、CCF
  - 腾讯犀牛鸟基金等9 项国家级、省部级及企业合作项目。在 USENIX Security、ACM CCS、NDSS 等国际顶级会议发表论文 14 篇（一作11篇，CCF-A类8篇）；申请发明专利
  30 余项，获授权 7 项；发现微软、WordPress Plugin 等多个主流厂商高危漏洞并获官方致谢。先后荣获华为 OpenHarmony 先锋课题、教育部研究生网安大赛全国一等奖及全国优秀指导教师等奖励。

  深耕人才培养，承担《计算机网络安全》、《汇编语言程序设计》等核心课程教学，主讲的《网络安全综合实践》获评 2025 年国家一流本科课程，连续两学期获校教学评估优秀。具备宏观产业视野与政策研究能力，撰写11
  篇资政报告获国家与省级部门采纳，其中 1 篇获两位湖北省委常委批示，为国家 AI 安全政策制定提供重要技术支撑。担任《软件学报》、IEEE TIFS 等 CCF-A
  类期刊审稿人，CCF网络与系统安全专委会、系统软件专委会执行委员，积极参与领域学术共同体建设。

  招生信息：

  我目前正在寻找具备自驱力的博士、硕士研究生加入我们团队。如果你对安全研究充满热情，欢迎将个人简历发送至我的邮箱。

