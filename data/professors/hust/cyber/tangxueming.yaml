bio_raw: '个人简介

  Personal profile

  汤学明，工学博士，教授，博士生导师，湖北省密码协会理事，湖北省网络空间安全学会理事、密码专委会副主任。主要研究领域为数论、密码学、数据库安全和网络安全。主持和参与国家重点研发计划、国家密码发展基金、国家自然科学基金、总装备部预研和型号项目、重要部门项目共40余项，获中共中央办公厅科学技术二等奖、密码科技进步二等奖。'
