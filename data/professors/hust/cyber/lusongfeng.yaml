bio_raw: 路松峰，博士，教授,博士生导师，国家重点研发计划首席科学家。长期从事网络空间安全、人工智能、量子计算等方面的研究，主要研究领域包括：密码学、访问控制、区块链及其应用、工业互联网及其安全、自然语言处理、机器视觉、多目标优化、绝热量子计算、量子密码、量子机器学习等。负责多项大型工程项目工作，具有丰富的工程实践经验。在国内外重要刊物和国际会议发表论文223篇，其中被SCI
  收录90篇，EI 收录70多 篇。申请/授权... More+
