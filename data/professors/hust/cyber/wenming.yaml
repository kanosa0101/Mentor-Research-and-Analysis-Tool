bio_raw: '个人简介

  Personal profile

  文明，华中科技大学网络空间安全学院教授，硕士生/博士生导师。文明博士于2014年从浙江大学计算机科学与技术学院获得本科学位，2019年6月在香港科技大学计算机科学与工程学院取得博士学位，师从张成志教授。2017年7月至2018年1月，在美国加州大学戴维斯分校苏振东教授课题组担任访问学者。2019年6月至2019年11月，在香港科技大学全职任职博士后研究员。2019年12月，加入华中科技大学网络空间安全学院，聘为副教授，主要聚焦大模...

