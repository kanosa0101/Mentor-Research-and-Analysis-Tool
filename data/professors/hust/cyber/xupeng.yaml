bio_raw: '个人简介

  Personal Profile

  华中科技大学网络空间安全学院教授、博导。主要研究方向包括：密码学，数据安全，格密码，可搜索加密，全同态加密等。在数个国内外知名期刊/会议发表论文，主要包括：CCS，

  USENIX Security，NDSS，DAC，ESORICS，PKC，

  IEEE TC，IEEE TIFS，IEEE TDSC，IEEE TII，IEEE TSC，Chinese Science Bulletin，Science China
  Information Science，中国科学等。入选2021年全国高校计算机专业优秀教师奖励计划、湖北省第四批中小微企业“科技副总”，获第三批国家级一流本科课程、2025年湖北省教学成果一等奖、

  2024年省级一流本科课程、2025年与2021年密码科学技术奖、2021年中国电子学会科技进步奖、2019年武汉黄鹤英才、2018-2019年中国密码学会优秀会员奖、ACISP
  2017最佳论文奖、湖北省自然科学优秀学术论文奖。获国际发明专利5项、国内发明专利27项，出版专著《云数据安全》、《中国网络空间安全前沿科技发展报告2018》和《中国网络空间安全前沿科技报告2019系统安全篇》。主持国家科技重大专项项目

  （No. 2025ZD0300600）、

  国家重点研发计划课题（No. 2021YFB3101304）、国家密码科学基金重点项目（

  2026NCSF01011

  ）、国家自然科学基金

  项目

  （No.61100222、No. 61472156、No.61872412、No.62272186、

  No.

  62672203）、教育部产学合作协同育人项目（No. 202102508001）、深圳市基础研究（学科布局）项目、武汉市科技计划项目（应用基础前沿专项）；课题负责广东省省级科技计划项目（No.
  2017B010124001、No. 2019B010139001）；参与国家重点研发计划课题（No. 2022YFB4501502、No. 2017YFB0801804），973项目（No.
  2014CB340600），863课题（No. 2012AA012604）。担任全国密码专业学位研究生教育指导委员会委员，教育部高等学校密码科学与技术专业教学指导分委员会委员；中国通信学会可信通信技术专业委员会副主任委员、合肥国家实验室量子密码基础设施标准技术联合工作组成员；中国密码学会理事、高级会员、区块链专委会委员、安全协议专委会委员、密码算法专业委员会委员、大数据与人工智能安全专委会委员；中国网络空间安全学会理事、提名与奖励工作组委员；中国人工智能学会智能信息网络专委会委员；中国中文信息学会大数据与隐私计算专委会常务委员；湖北省商用密码协会副会长；ACM中国SIGSAC技术委员会委员。指导本科生参加各类竞赛并获奖18次（第十七届“挑战杯”竞赛“揭榜挂帅”专项赛“信息安全中的‘矛’‘盾’交锋——抵抗量子计算冲击的量子安全应用”竞赛中，获全国特等奖）。

  团队热烈欢迎有密码学基础、或AI基础、或量子密码/密码量子分析，

  或GPU/FPGA开发经验的学生！'
