bio_raw: '个人简介

  Personal profile

  博士，副教授。1998年本科毕业于华中理工大学，2008年12月获华中科技大学计算机系统结构博士学位；2002年至今，在华中科技大学计算机科学与技术学院工作。目前主要承担的本科课程数字逻辑与电路设计，主要的研究方向是基于内容的视频信息处理与检索，信息安全。

