bio_raw: '个人简介

  Personal Profile

  冯君，华中科技大学副教授。在华中科技大学计算机科学与技术学院获得博士学位。从事大数据安全与隐私保护、人工智能安全、深度学习、区块链等研究工作，在这些领域发表重要学术论文50余篇，包括IEEE
  TDSC、IEEE TC、IEEE TIFS、AAAI、IEEE TII、ACM TOIT、IEEE TBD、IEEE TSUSC、IEEE IOT、INS、IEEE
  WCM等，其中第一作者IEEE/ACM Transactions论文10余篇。主持国家自然科学基金面上项目“实用不经意差分隐私张量机器学习研究”，国家自然科学基金青年项目“面向人机物系统的实用隐私保护张量深度学习研究”；参与国家重点研发计划网络空间安全重点专项、国家自然科学基金重点项目。入选国家级博士后人才计划；获得IEEE
  TCSC杰出博士论文奖；获得博士研究生国家奖学金、硕士研究生国家奖学金。担任国际会议IEEE ATC 2024、ICBC 2023、IEEE PriComp 2022、IEEE
  DependSys 2021、IEEE DependSys 2020、SpaCCS 2019的程序委员会主席；担任顶级会议ICLR 2026、AAAI 2026、ACSAC
  2025、NeurIPS 2025、ACM MM 2025、IJCAI 2025、ICML 2025、WWW 2025 (ACM TheWebConf 2025)、ICLR
  2025、AAAI 2025、NeurIPS 2024、ACM MM 2024、AAAI 2024、AAAI 2023等领域主席或程序委员会委员。担任CCF A类期刊IEEE
  Transactions on Information Forensics and Security (IEEE TIFS) 的副编辑 (Associate Editor)。担任20多个国际学术期刊和会议例如A类期刊IEEE
  TDSC、IEEE TIFS、IEEE TC、IEEE TMC、ACM TOSEM的审稿专家。担任中国中文信息学会大数据安全与隐私计算专委会委员、中国计算机学会嵌入式系统专委会执行委员。担任国家科技专家库专家；担任国家自然科学基金评审专家。担任湖北省科技厅专家库专家、浙江省科技专家库专家、北京市自然科学基金评审专家等科技项目评审专家。

  欢迎相关领域专家学者进行交流合作！

  欢迎积极进取、热爱科研的本科生或研究生与我联系，参与大数据安全与隐私保护、人工智能安全、深度学习、应用密码学等前沿研究，发表顶级论文，参加学科竞赛比赛，表现优秀者提供到国外学习交流。

  邮箱：junfeng@hust.edu.cn；电话/微信：18827365073

  最新科研动态网址：https://junfeng989.github.io/'
