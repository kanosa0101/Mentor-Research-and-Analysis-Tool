  个人简介

  本科、硕士、博士均毕业于华中科技大学。博士后阶段在美国密西根大学完成，并参与两项美国国家自然科学基金。现工作于华中科技大学网络空间安全学院，主要研究方向为射频干扰抑制，阵列信号处理，无线网络安全，在国际期刊IEEE
  transactions on mobile computing, IEEE transactions on information forensics and
  security, IEEE transactions on vehicular technology，I

  EEE

  transactions on

  g

  e

  oscience and remote sensing

  等期刊，以及IEEE\ACM国际会议上发表多篇论文，以合作作者身份获得授权专利3项，专著上、下册各一本，主持国防项目，国家自然科学基金等。

  研究方向

  电磁学，射频干扰抑制，阵列信号处理，无线网络安全等

