bio_raw: '华中科技大学计算机学院教授、博士生导师，华中科技大学“数智化大模型”联合研究中心主任、计算机学院

  自然语言处理与知识图谱实验室负责人。

  IEEE会员，ACM会员，CCF会员，CCF信息系统执行专委，在TKDE、TSC等IEEE/ACM Trans，以及ICML、TheWebConf.、AAAI、ACL、MM、ICDE、

  IJCAI、

  ICDM、EMNLP、CIKM、COLING、DASFAA、软件学报等国际著名期刊和领域顶级会议上发表/录用论文约100篇。担任TC、TPDS、TBD、《中国科学》等30多个杂志的审稿专家，担任ACL、AAAI等多个国际学术会议领域主席、程序委员会委员。已获批/申请专利20余项，获批软件著作版权10余项。主持

  国家重点研发计划项目、

  国家重点研发计划课题、国家自然科学基金、省重点研发计划项目、省科技攻关课题、政府/企业横向课题多项；作为主要成员参与了教育部专项、国家重点基础研究发展计划（973项目）、863项目、教育部重点项目等多个课题的研究。多次获湖北省优秀硕士学位论文、湖北省优秀学士论文指导教师，获湖北省教学成果奖一等奖1次，湖北省科技进步二等奖1次。

  研究方向为自然语言处理、知识发现、大模型、语义计算、数据挖掘、信息检索、社交网络等。近年来主要从事

  自然语言处理

  和

  知识图谱+大模型

  的研究，主要研究方向包括（但不限于）：（1）

  自然语言处理：围绕大数据环境下的自然语言处理各类任务，如

  ：NLG、NLU、QA等多个热点问题，

  研究数据和知识驱动的自然语言处理的基本理论和关键技术。（2）知识图谱和大模型：知识图谱是语义网络和大数据相结合的产物，作为智能系统的大脑，为智能系统提供丰富的背景知识，并通过强大的推理计算引擎，
  为预测、分类、推荐、因果分析等重要任务提供支持。我们主要研究知识图谱的构建、推理、可解释，知识图谱+大模型及其应用等。

  热忱欢迎同学们推免和报考博士研究生和硕士研究生，欢迎本科生同学们提前进入课题组、项目组开展早期科研活动。

  热忱欢迎博士毕业生来从事博士后研究，待遇从优。'
