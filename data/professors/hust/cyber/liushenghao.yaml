bio_raw: '刘生昊，博士，华中科技大学网络空间安全学院副教授。2016年及2021年分别获得华中科技大学学士学位及博士学位。在华中科技大学网络空间安全学院从事博士后工作3年。近年来主要从事社交网络安全、社交物联网安全、工业物联网安全的相关研究工作，在国际会议和期刊发表学术论文20余篇，包括SIGIR、ICDM、ACM
  TKDD、IEEE TNSE等国内外高水平会议/期刊。获得IEEE HITC优秀博士学位论文奖、IEEE SCSTC优秀青年科学家奖。主持国家自然科学基金青年基金项目1项，湖北省重点研发专项项目课题1项，工业物联网与网络化控制教育部重点实验室开放基金项目1项，横向项目课题2项。作为项目骨干参与国家重点研发计划项目1项、国家自然科学基金面上项目3项。20...

  查看更多>'
