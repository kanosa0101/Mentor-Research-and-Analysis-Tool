bio_raw: '个人简介

  Personal profile

  博士，男，华中科技大学网络空间安全学院，教授，博士生导师，武汉市黄鹤英才，武汉市东西湖区政协委员，无党派人士。华科国家网安基地创新与实践中心主任，系统与软件安全研究所教学、科研骨干。长期从事网络、信息安全方面的教学、科研工作，是国家有关部门多项安全项目负责人。近10年来为本科生主讲《计算机病毒原理及防治技术》（主编）、《软件安全》，《网络安全综合实践III级》，已为ACM班主讲《图论与组合》（双语教学...

