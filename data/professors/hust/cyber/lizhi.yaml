bio_raw: '李志，华中科技大学副教授，长期保持与国际学术界以及国内工业界的合作，蚂蚁集团访问学者。主要从事云计算与系统安全、大模型安全方向的研究工作，研究方向包括云原生安全、操作系统与虚拟化安全、云原生黑产分析、AI
  Agent安全等，在安全顶级会议S&P，CCS以及IEEE TDSC、IEEE TIFS、IEEE TPDS等国际顶级期刊上发表多篇论文。主持国家自然基金项目（青年），参与多项国家重点研发计划、973计划项目、国家自然科学基金项目。

  查看更多>'
