bio_raw: '唐赫，博士，华中科技大学软件学院副教授、博士生导师，同时担任华中大软件学院-武汉利德轨道交通视觉联合研究中心主任。主持国家科技重大专项课题、国家自然科学基金青年项目及湖北省自然科学基金面上项目；同时作为单位负责人参与国家自然科学基金联合基金重点项目。研究方向为多模态大模型和智慧医疗：首次提出面向病理图像的视觉定位任务、数据集和基线模型，有效缓解现有病理图像理解模型看不准、灵活性差的问题；提出多模态大模型OwlCap，在VDC和DREAM-1K等权威榜单上排名前三，准确率超过千问大模型4个百分点以上。近五年来在ICCV、ECCV、AAAI、ACM
  MM、MICCAI、IEEE TIP、TMM、TCSVT等人工智能和医学图像领域顶级会议和期刊上发表论文...

  查看更多>'
