bio_raw: '个人简介

  Personal profile

  分别从重庆大学、南京大学和华中科技大学获得理学学士、理学硕士和工学博士学位，2007年入选教育部新世纪优秀人才计划。主持国家自然科学基金面上项目4项、863探索导向类项目1项、与东芝微电子合作项目2项，与华为合作项目2项，主持其他企业横向项目多项。研究方向涵盖了数字集成电路、硬件安全、安全CPU、车联网安全、超低功耗、存储器测试、各种算法硬件加速等多方面。相关的研究成果主要发表在IEEE
