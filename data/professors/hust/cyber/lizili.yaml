bio_raw: '教授，中国光谷VR·AR产业联盟专家组成员。中国计算机学会高级会员，中国计算机学会虚拟现实与可视化技术专业委员会委员，中国图象图形学会虚拟现实专业委员会委员，中国图象图形学会数码艺术专业委员会委员，中国动画学会会员。主持或参加了国家自然科学基金、国家863项目、预研基金、培训用途虚拟现实与仿真项目多项，内容涉及图像处理与识别、虚拟现实与视景仿真。发表学术论文二十多篇，被EI、SCI、ISTP收录十几篇。研究方向：计算机图形与虚拟现实、多媒体信息处理、动漫与3D游戏技术、影视动画艺术。教育经历：1982年9月—1986年7月四川大学物理系物理学专业本科毕业；1986年9月—1989年9月中科院物理研究所（北京）等离子体物理学专业硕...

