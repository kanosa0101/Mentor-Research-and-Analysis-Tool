bio_raw: '王杰，副研究员，硕士生/博士生导师，2021年获中国科学院大学博士学位，美国乔治梅森大学CSIS中心访问学者。 项目：主持/参与国家自然科学基金、CCF-华为胡杨林基金可信计算专项、CCF-蚂蚁科研基金隐私计算专项、国家科技重大专项、国家重点研发计划项目等课题。
  论文：课题组论文发表于CCS、Usenix Security、SenSys、TDSC、TIFS等国际会议与期刊，担任TDSC、TIFS、TrustCom等期刊和会议审稿专家。
  获评：武汉英才，华为云高校人才项目，担任中国计算机学会系统软件专委、计算机安全专委委员、OpenEuler学术与教育委员会委员。 研究方向：我们关心AI的快速发展会对现有的操作系统产生怎样的影响，以及有什么新的需求。1...

  查看更多>'
