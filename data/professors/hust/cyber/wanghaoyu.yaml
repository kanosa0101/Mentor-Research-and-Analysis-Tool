bio_raw: '个人简介

  Personal Profile

  王浩宇，教授，博士生导师，国家级青年人才，Security PRIDE团队负责人，华中科技大学OpenHarmony技术俱乐部主任，华科网安-烽火通信网络安全联合研究中心主任。研究关注于新兴软件系统中的安全、隐私和可靠性问题，研究方向包括移动系统安全、Web3/区块链系统安全、大模型系统安全、网络公害/黑灰产治理、新兴程序分析技术等。在软件分析（ICSE/FSE/ASE/ISSTA/OOPSLA）、系统安全(CCS/USENIX
  Security/NDSS)、网络和系统度量（SIGMETRICS/IMC/WWW）领域的顶会'
