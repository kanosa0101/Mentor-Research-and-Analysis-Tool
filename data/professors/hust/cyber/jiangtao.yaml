bio_raw: '个人简介

  Personal profile

  IEEE Fellow，现为华中科技大学二级教授、博士生导师，国家级人才获得者、享受国务院政府特殊津贴，爱思唯尔中国高被引学者榜单、教育部新世纪优秀人才支持计划和湖北省高层次人才工程第一层次等。长期从事于群体智能、多载波宽带通信、天地一体化信息网络、深海目标探测与定位等研究。现已发表学术论文600余篇，其中IEEE汇刊论文400多篇；论文他引逾万次；出版专著6部、编著2部、参编4部，申请国家发明专利50多项，其中授权30...

