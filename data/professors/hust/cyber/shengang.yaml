bio_raw: '沈刚，男，博士，教授。1990年及1992年毕业于清华大学自动化系生产过程自动化专业和系统工程专业，分别获学士学位和硕士学位。后留校任教，曾参与多项CIMS课题研究。1995年至1999年在加拿大McGill大学Electrical
  and Compter Engineering系学习，获博士学位。1999年9月至12月，在多伦多大学Electrical Engineering系作访问研究。1999年起，在加拿大Kerr
  Vayne Systems及美国Motorola公司工作，从事自动化系统和移动通讯系统的研究及开发。2003年起，在华中科技大学软件学院开设《计算机网络》，《嵌入式系统》，《软件能力成熟度模型》等双语课程。在IEEE
  Transactions on Automatic Control等期刊和IEEE Conference on Decision and Control等会议上发表多篇论文。现主要研究兴趣包括实时系统，无线通讯系统，数字通信网络和软件工程等方向。

  Email

  :

  Gangshen@126.com'
