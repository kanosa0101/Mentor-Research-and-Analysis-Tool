bio_raw: 武剑洁，博士，副教授，硕士生导师。现为华中科技大学软件学院教师。面向本科生和研究生主要开设《计算机程序设计基础（C++）》、《计算机程序设计基础（Python）》、《软件质量与测试》、《软件测试与质量保证实践》等课程。出版教材两部。主持国家精品在线开放课程“软件测试与质量”，在中国大学MOOC平台面向社会公开运行。研究方向：计算机辅助设计与图形学（CAD&CG）、建筑信息建模及应用（BIM）、人工智能与图像/视频处理分析、虚拟现实与增强现实（VR&AR）、软件工程、软件测试等方面研究。主持和参与国家重点研发计划项目、国家自然科学基金项目等多项国家和企业合作
