bio_raw: '个人简介

  Personal profile

  廖小飞，1978年出生，2005年获计算机系统结构专业工学博士学位，现为计算机学院教授、博导、院长，湖北省计算机学会理事长。主要学术方向为内存计算、图计算、大数据系统等。先后主持国家杰出青年科学基金、国家自科基金优青项目、面上项目、青年基金项目以及国家重点研发计划项目（首席）、国家863计划项目、霍英东青年教师基金等项目。廖小飞是国家杰出青年科学基金获得者、国家自然科学基金委优秀青年科学基金获得者...

  More+'
