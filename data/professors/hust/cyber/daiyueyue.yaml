bio_raw: '代玥玥，女，博士，副教授，博士生导师，硕士生导师，CCF会员，中国电子学会会员。于2014年和2019年分别获电子科技大学学士和博士学位。2017年至2019年在挪威奥斯陆大学访学，师从欧洲科学院院士、挪威科学院院士、挪威工程院院士Yan
  Zhang教授。2020年至2021年在新加坡南洋理工大学担任博士后研究员，师从南洋理工副校长 Yong Liang Guan教授。研究方向主要包括数字孪生、边缘智能与区块链。近5年在IEEE
  Trans等领域内核心学术期刊和国际会议共计发表30+篇高水平论文（16篇一作），包括中科院Journal Citation Reports（JCR）一区期刊论文13篇（IEEE
