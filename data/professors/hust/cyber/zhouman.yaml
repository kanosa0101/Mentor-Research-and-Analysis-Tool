bio_raw: '个人简介

  Personal Profile

  周满，副研究员，博士生/硕士生导师，于2021年在武汉大学网络空间安全学院取得博士学位。以智能系统安全为核心，长期关注以智能终端为载体的各种新颖身份认证和感知通信系统，并研究其中的安全问题，近期侧重于研究机器人、自动驾驶系统、无人机等具身智能系统安全、端侧大模型安全等方向。近年在ACM
  CCS、NDSS、Usenix Security、ACM MobiCom、ACM SenSys、IEEE INFOCOM、

  IEEE TIFS、

  IEEE TMC、IEEE TDSC、IEEE TWC、IEEE TCSVT、IEEE  TCCN、软件学报等权威学术会议和期刊上发表论文30余篇，授权专利9项。研究成果引起华为重视，入选2021年华为天才少年计划，2024年华为“东湖学者”。

  主持国家自然科学基金面上项目、青年科学基金项目、华为终端企业项目（179万元）、珈港企业项目（100万元）、全国重点实验室开放基金2项，参与科技创新2030“新一代人工智能”重大项目、国家自然科学基金联合重点项目、腾讯和华为等知名互联网企业项目。指导本科生获“挑战杯全国大学生揭榜挂帅专项赛”特等奖、“全国大学生信息安全设计竞赛”一等奖、二等奖，指导研究生获“中国研究生网络安全创新大赛”二等奖、三等奖、“强网杯全国网络安全挑战赛”二等奖、三等奖。指导2名本科优等生，6人获国家奖学金，多人拿到国家级大创项目，指导2名研究生获国家奖学金，多人拿到研究生创新资助计划。 担任IEEE
  TIFS (CCF A类)、IEEE TDSC (CCF A类)、IEEE TMC (CCF A类)、IEEE ToN (CCF A类)、IEEE TSC (CCF
  A类)、IEEE TCSVT (CCF B类)、ACM TOIT (CCF B类)、ACM TOPS (CCF B类)、计算机学报 (CCF T1)、电子学报
  (CCF T1)、信息安全学报 (CCF T2) 等多个期刊审稿人；担任IEEE/ACM IWQoS'' 25-26 (CCF B类)、USENIX Security''
  24  AE (CCF A类)、IEEE ICDCS'' 24 (CCF B类)、IEEE TrustCom'' 22-25、IEEE HPCC'' 24-25、KSEM''
  22-23、IEEE ISPA'' 23、IEEE GlobeCom'' 19-21等国际会议技术程序委员会成员；担任中国计算机学会网络与系统安全专委会执行委员、计算机安全专委会执行委员、国家自然科学基金评审专家。

  长期招收对智能终端、机器人、自动驾驶系统、无人机等具身智能系统安全与端侧大模型安全问题感兴趣的研究生。同时，招收大二大三本科生参与相关方向课题研究，了解科学前沿发展，参加学科竞赛，发表高水平研究成果。对于优秀学生将提供去国外高校学习交流的机会，以及推荐到国内外知名大学攻读博士学位，欢迎有意向的同学通过邮件与我联系。'
