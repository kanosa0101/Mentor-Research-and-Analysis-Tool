bio_raw: '个人简介

  Personal Profile

  胡胜山，副研究员，博士生导师。

  2014

  年取得武汉大学学士学位，

  2019

  年分别取得武汉大学和香港城市大学博士学位。长期从事人工智能安全、大数据隐私保护、生物信息安全等相关方向研究，目前重点关注具身智能机器人、

  自动驾驶、

  智慧医疗等智能系统的安全与隐私问题，入选湖北省人才项目计划。在IEEE S&P、

  ACM CCS、NeurIPS、ICLR、ICCV、CVPR、IJCAI、ACM MM、IEEE INFOCOM

  、

  IEEE TIFS

  、

  IEEE TDSC

  等

  CCF A

  类

  国际会议和期刊上发表论文四十余篇，获得

  IEEE Trustcom 2016最佳论文奖。

  受邀担任IEEE TIFS、IEEE TDSC、IEEE TPDS、IEEE TC、IEEE TMC、IEEE ToN、IEEE IoT-J、IEEE Comm.
  Mag.、IEEE Wireless Comm.等10多个CCF A类或中科院一区国际期刊审稿人，以及IEEE ICCV''23‘24、IEEE/CVF CVPR''23''24、IJCAI''23''24''25、AAAI''23''24''25、ACM
  MM''22''23''24''25等CCF A类国际会议程序委员会委员和审稿人。

  参与国家自然科学基金联合重点、国防某计划、教育部装备预研、香港创新及科技基金、香港协作研究基金等多个项目。

  胡胜山副研究员现招收（大二、大三）本科生参与人工智能系统隐私保护与安全攻防、生物信息安全等方向研究，接触最新科学进展，参加学科竞赛，发表高水平研究成果，对于优秀学生将提供去国外高校学习交流的机会，以及推荐到国内外知名大学攻读博士学位。欢迎有意向的同学通过邮件与我联系。本课题组最新动态见网站http://trustai.cse.hust.edu.cn/index.htm。'
