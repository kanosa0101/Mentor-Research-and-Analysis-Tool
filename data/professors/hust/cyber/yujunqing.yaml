bio_raw: 于俊清（1975-），男，博士，教授，博士生导师，国家一流（线下）本科课程负责人、国家精品课程和国家精品共享课负责人，湖北省优秀基层教学组织负责人，华中科技大学本科和研究生课程责任教授、华中科技大学计算机科学与技术学院智能媒体计算与网络安全研究团队负责人。2002年6月在武汉大学获得计算应用技术专业工学博士学位，2002.8-2003.5加拿大曼尼托巴大学学习，2003.8至今在华中科技大学任教。现任华中科技大学副校长，中...
