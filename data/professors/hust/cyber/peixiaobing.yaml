bio_raw: '裴小兵，男，博士，教授，华中科技大学教师。2006年获得华中科技大学计算机软件与理论专业博士学位。曾在华为技术有限公司中央研究部从事电信标准与软件的研究和开发多年。在IEEE
  Transactions on Neural Networks and Learning System、IEEE Transactions on Cybernetics等国际期刊以及计算机学报、软件学报等中文期刊发表论文六十多篇。曾获得华中科技大学“三育人”奖以及华中科技大学教学成果一等奖、教学质量二等奖。长期与业界开展人工智能、软件技术方面的合作研究。目前主要研究方向：机器学习（图机器学习）、人工智能安全、时空大数据分析与挖掘、智能体以及数字孪生方面的研究。主要讲授《软件工程》、《机器学习导论》（本科生...

