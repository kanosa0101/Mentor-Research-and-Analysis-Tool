bio_raw: '薛志东，男，

  1973年生，博士，研究员。1997年7月于原华中理工大学获学士学位；2002年6月于华中科技大学计算机应用专业获硕士学位；2006年6月于华中科技大学系统分析与集成专业获博士学位；2006年9月-2008年8月于华中科技大学计算机科学与技术博士后流动站开展研究工作；2011年9月至2012年8月美国密歇根大学（安娜堡）计算医学与生物信息学系访问学者。2007年11月晋升副教授，2015年11月晋升教师科研岗研究员。先后讲授Java面向对象技术、数字图像处理、虚拟现实、大数据管理等课程；近年来承担'
