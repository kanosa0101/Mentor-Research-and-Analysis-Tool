bio_raw: '周潘，网络空间安全学院，教授、博导，IEEE Senior Member。本科毕业于华中科大提高班，博士毕业于美国佐治亚理工学院。2011-2013年曾在美国甲骨文公司（全球企业软件排名第一）担任高级技术科学家。周教授师从国际信息安全权威、IEEE
  Fellow、佐治亚理工学院讲座教授John A Copeland博士，在博士研究生阶段参与导师Dr. Copeland发明的StealthWatch网络安全系统基础应用研发，创立了LANcope,
  Inc.公司，并于2015年被美国Cisco公司以4.5亿美元收购，目前为超过100家单位提供网络安全服务。周教授是“全域物理对齐/原生安全世界模型”实验室主任和PI，科研成果详情见Github主页https://nswm-lab.github.io。周教授在全球首次提出“全域物理对齐/...

