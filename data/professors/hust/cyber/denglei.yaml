bio_raw: '邓磊，华中科技大学教授、博士生导师，国家高层次青年人才，IEEE Senior Member，丹麦科技大学留学回国人员，华中卓越学者特聘岗，长期从事高速长距离光传输网关键技术、

  光载无线关键技术和安全光纤通信技术研究。华中科技大学2022年度“十佳青年教工”、华中科技大学2023年“三育人奖”。主持承担了包括国家重点研发计划项目、国基金重点项目、装发部共用信息系统装备预研重点项目、国家重点研发计划项目课题、科技部863计划主题项目在内的9项纵向项目（总经费5091万）。所取得的研究成果获得了华为、中兴通讯和烽火通信公司的重点关注，以第一负责人身份获批横向产业化合作项目8项（总经费1105万）。以第一/通讯作者在国际权威期刊上发表SCI收录论文60篇，在光通信领域国际顶级会议（OFC、ECOC）上发表论文18篇。所发表论文Google累计引用次数2876次，H因子30。累计申请国家发明专利22件，其中授权13件，获批中国通信标准化协会标准1项。获得2012年教育部自然科学奖二等奖（第五），2019年中国光学工程学会技术发明奖一等奖（第二），2021年湖北省技术发明奖二等奖（第二）。获2022年湖北省高等学校教学成果奖一等奖（第六），2022年高等教育（研究生）国家级教学成果二等奖（第四）。先后15次受邀在国际学术会议上作邀请报告或担任会议Session
  Chair。'
