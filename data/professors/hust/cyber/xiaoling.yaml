bio_raw: '个人简介

  Personal profile

  肖凌，1976年11月出生于湖北省宜昌市。2009年与华中科技大学获工学博士学位，主要研究方向为网络空间安全、网络安全。自1999年入职华中科技大学计算机科学与技术学院，主要承担《计算思维》、《计算机通讯与网络》、《网络安全》、《电子数据取证》等课程的建设和教学工作，多次主持教育部等各级教学研究项目，曾获“华中科技大学教学竞赛一等奖”一次；主持、参与多项国家、省部级科学研究项目，获“湖北省科技进步一等奖”一...

  More+'
