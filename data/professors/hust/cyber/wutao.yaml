bio_raw: '吴涛，男，博士，教授。1972年出生，软件科学与工程系主任。主要研究方向包括：软件开发与质量保证、软件复用与产品化、软件病毒、三维造型技术等，发表相关论文10余篇。2005年赴新加坡主持软件外包项目开发；2006年参与863项目基于复杂性科学的车间动态调度理论与方法研究；2007年赴爱尔兰参加面向工业化的教育进修；2008年主持教育部特色专业建设项目。2003-2008年主持开发微软亚洲研究院资助项目2项，国防项目1项，省部级以上项目4项。率队获首届“花旗杯”科技应用大赛全国一等奖，首届微软“创新杯”大赛全国三等奖，2008年获华中科技大学教学成果一等奖。

