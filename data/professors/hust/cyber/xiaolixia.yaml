bio_raw: '个人简介

  MORE+

  肖丽霞，华中科技大学，教授，博士生导师，主要从事移动通信物理层关键技术研究，包括无源物联网通信、低空智联通信、低轨卫星物联网通信及智能信号处理；发表IEEE汇刊论文100余篇，授权专利20余项；主持及参与国家级项目16项，包括主持国家重点研发青年科学家项目、国自然面上项目、国自然青年基金、国自然重点基金课题、国家重点研发计划子课题，中国信息通信研究院及中国星网企业合作项目9项；获中国电子教育学会优秀博士论...'
