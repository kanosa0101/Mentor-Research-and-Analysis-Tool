bio_raw: '个人简介

  Personal profile

  柯昌剑，光电信息学院教授、博士生导师，现任下一代互联网接入系统国家工程研究中心副主任、本科生院副院长兼教务工作办公室主任（正处级）。2015年入选国家重大人才计划青年项目，2021年入选国家重大人才计划项目。1995年至2007年在华中科技大学光电信息学院学习，先后获学士、硕士和博士学位。2001年硕士研究生毕业后留校工作至今，先后任讲师、副教授、教授。2010年至2011年，在美国南加州大学电子工程系访问研究；2018年6月...

