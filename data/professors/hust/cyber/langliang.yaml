bio_raw: '工学博士，教授，博士生导师，硕士生导师。

  1997

  年毕业于

  中南民族大学电子工程系，获学士学位；

  1999

  年和

  2009年

  毕业于华中科技大学电子与信息工程系，分别获工学硕士和博士学位；

  2012-2013

  年在美国休斯敦大学电子与计算机学院作访问学者。

  主要研究领域为：水下电磁波

  /

  磁通信、微波辐射成像技术、天线以及射频电路设计。

  主持过国家自科青年基金项目、

  973

  计划子专题项目、国家

  863

  计划以及湖北省重大创新项目等

  20

  余项'
