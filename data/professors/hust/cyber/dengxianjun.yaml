  “武汉英才”，重庆市巴渝学者特聘教授，湖南省芙蓉学者等荣誉。担任IEEE 加拿大大西洋区通信学会副主席、IEEE HITC技术委员会联络主任、IEEE TCSC技术委员会秘书长、国家关键信息基础设施安全保护培训教学指导委员会委员、湖北省网络...

