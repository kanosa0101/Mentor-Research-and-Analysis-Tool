bio_raw: '个人简介

  Personal Profile

  周威，男，副研究员。同时担任学校开源俱乐部和CTF战队指导教师。

  研究方向主要包括物联网安全、二进制程序分析、嵌入式设备可信计算技术

  ，

  特别是在检测与分析真实物联网产品安全问题方面取得突出成果。

  曾多次获得

  小米、京东、三星、阿里巴巴

  等众多国际知名厂商公开认可与致谢，获批50+CNVD/CVE漏洞编号，在网络与信息安全顶级会议和期刊发表论文十余篇，包括

  CCS

  、

  Usenix等

  。

  曾在美国宾州州立大学刘鹏老师研究团队访问学习2年多，长期和国外多个顶级系统安全研究团队保持密切合作。

  多次主持和参与国家自然科学基金、国家重点项目，多次与头部IT企业包括华为、小米和蔚来等开展物联网安全测试技术合作项目。

  欢迎各位同学报考我的研究生，也欢迎对物联网安全，二进制程序分析感兴趣本科生进入我的实验室学习，参与实际的物联网安全项目研究，接触最新科研进展。对于优秀的学生，可提供去国外高校与头部企业学习交流和实习的机会。欢迎自我驱动力强对科学研究有兴趣的同学通过邮件与我联系

  ：

  个人主页：

  https://weizhou.netlify.app/

  邮箱：

  weizhou_sec@hust.edu.cn'
