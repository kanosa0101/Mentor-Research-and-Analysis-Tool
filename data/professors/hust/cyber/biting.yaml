bio_raw: '毕挺，男，博士，副教授、博士生导师。入选湖北省海外高层次人才计划，担任中科院一区期刊IEEE Transactions on Broadcasting
  编委（Associate Editor）。2010年毕业于武汉大学软件工程专业后前往爱尔兰留学工作十余年。于2011年在都柏林城市大学获得硕士学位后师从 Gabriel-Miro
  Muntean 教授（IEEE Fellow）攻读博士，2017年起先后担任了都柏林城市大学博士后研究员，爱尔兰大数据分析中心研究员，华为爱尔兰研究所技术顾问和梅努思大学助理教授等职位。长期致力于研究多媒体传输、多体感媒体、人机交互、用户体验和无线网络安全等关键技术，主持了爱尔兰科学基金委(SFI)工业研究员项目，参与欧盟地平线2020项目及SFI
  Enable项目，在IEEE Communications Magazine、IEEE Communications Surveys & Tutorials、IEEE
  Transactions on Multimedia等权威国际期刊和会议上发表研究论文40余篇，其中第一和通信作者论文21篇，获邀参与10余次国际会议并作会议报告，参与编撰多媒体传输英文专著1部，申请多体感媒体传输相关的相关专利5项，其中1项已被美国专利局授权（排1），一项被英国专利局授权（排2），并担任多个国际学术期刊客座编委和会议程序委员会委员，
  是CCF、IEEE和ACM会员。

  欢迎有志于科研及工程实践的优秀本科生和硕士生加入研究团队，申请攻读

  2025

  秋或

  26

  年硕士、博士的同学可通过

  tingbi@hust.edu.cn

  邮件联系我。'
