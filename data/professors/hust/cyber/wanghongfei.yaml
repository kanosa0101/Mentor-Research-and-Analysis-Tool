bio_raw: '个人简介

  Personal profile

  主要研究方向包括：人工智能理论算法设计、机器学习、芯片EDA、硬件安全。曾就职于英特尔研究中心（匹兹堡）、卡内基梅隆大学（CMU）先进芯片测试实验室，在美国半导体研究联盟负责EDA后端关键技术研发。获批纵向预研项目，负责多个校企合作项目。（欢迎对大模型、人工智能应用、图神经网络等感兴趣的研究生及本科生与我联系，参与Real-World
  Study） 指导本科生荣获优秀毕业设计奖，指导本科生在CCF-A/B类期刊与会议上发表高水...

