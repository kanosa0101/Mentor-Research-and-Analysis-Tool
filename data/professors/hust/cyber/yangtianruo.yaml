bio_raw: '个人简介

  Personal profile

  杨天若博士，毕业于清华大学获计算机和应用物理双学士，于加拿大维多利亚大学获计算机科学博士学位。现任加拿大国家工程院院士，加拿大工程研究院院士, IEEE/IET
  会士, 全球高被引学者。 杨教授主要从事并行, 分布式和云计算, 嵌入式和普适计算, 信息-物理-社会系统设计及大数据方面的研究。在这些领域中, 共计发表了 200多篇IEEE和
  ACM 汇刊/期刊论文, 其中有7篇文章入选ESI热点(top 0.1%)文章, 28篇论文入选ESI高被引 (top 1%...

