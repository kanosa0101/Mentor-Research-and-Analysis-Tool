bio_raw: 付铨，男，博士，副教授，达梦数据库的核心研发人员之一，在数据库、数据安全、嵌入式数据库、项目管理等方面具有丰富的理论知识和实践经验。长期跟踪国际数据库先进技术，熟悉数据库功能拓展和性能提高。作为主要研制人员，所参与科研项目曾获国家级、省部级科技进步奖。
