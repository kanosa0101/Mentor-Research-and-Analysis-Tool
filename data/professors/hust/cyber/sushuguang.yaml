bio_raw: '华中科技大学，博士，教授，院长助理。1975年出生，中共党员，湖南临湘人。1998年华中理工大学电子系本科毕业。1998年至2000年在长虹电子集团工作。2006年华中科技大学计算机学院博士毕业(硕博连读)并留校任教。研究兴趣操作系统、嵌入式系统和图像处理。主讲本科生“操作系统原理”和”微机原理与接口技术“，研究生”嵌入式系统协同设计“等课程。“操作系统原理”获评国家级一流本科课程。主编教材2部。2024年入选”教育部计算机专业优秀教师奖励计划”。荣获华中科技大学教学质量一等奖，教学竞赛一等奖，三育人积极分子，大学生创新创业优秀指导教师，华为开发者布道师，华为鸿蒙生态高校人才领域优秀教师，麒麟软件校企合作突出贡献教师...

  查看更多>'
