bio_raw: '刘光华，博士，副教授，华中科技大学地下网络与智能通信实验室负责人，IEEE Senior Member，入选中国科协第九届青年人才托举工程，入选全球前2%顶尖科学家榜单，湖北省高层次人才计划，华中卓越学者，中国通信学会天线与射频技术委员会委员，全国信息技术标准化技术委员会数据通讯分技术委员会委员，中国通信学会高级会员，美国纽约州立大学访问学者。于2019年获得华中科技大学电子信息与通信学院和创新研究院博士学位，并留校工作。长期从事磁通信、磁探测与磁安全等相关方向研究，重点关注地下/水下通信、毫米波探测、弱网通信安全和通信感知一体化等应用场景，包括信道建模、极化编码构造、磁天线调制和地下通信协议/路由设计等相关技术。...

  查看更多>'
