bio_raw: '个人简介

  Personal profile

  凌贺飞，1999、2002、2005年分别毕业于华中科技大学能源与动力工程学院(学士、硕士)、计算机科学与技术学院(博士)，2006年破格副教授，2011年晋升为教授。2008年-2009年曾在英国伦敦大学学院（UCL）做访问教授。现担任数字媒体与智能技术研究所所长、二级教授、博导、华中学者。2010年入选武汉晨光青年人才计划、2013年武汉光谷“3551”人才，多个学术组织专委会委员。主持国家自然科学基金重点项目、国家重点研发计划、国家863...

