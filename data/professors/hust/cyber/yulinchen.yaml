bio_raw: 余林琛：主要研究方向为内存安全、稀疏图计算等。主持国家自然科学基金青年科学基金项目、湖北省自然科学基金各一项，作为骨干成员参与国家自然科学基金多项。先后指导本科生团队获第十一届全国大学生信息安全竞赛一等奖、第十五届全国大学生信息安全竞赛二等奖、湖北省第十二届“挑战杯”大学生课外学术科技作品竞赛三等奖、全国高校移动互联网应用开发创新大赛（本科组）一等奖、全国高校移动互联网应用开发创新大赛一等奖、...
