bio_raw: '个人简介

  Personal profile

  主要从事计算机网络及网络安全领域的研发工作，设计和开发了状态检测防火墙NGFW3000、IPSec VPN网关SJW11等国内最早一批网络安全设备，获得市场和用户广泛认可。发表学术论文多篇。2011年获湖北省科技进步一等奖，2021年获中国电子学会科技进步二等奖。多次指导学生在全国信息安全竞赛中获奖，其中2021年获挑战杯科技作品竞赛“揭榜挂帅”专项赛全国一等奖。'
