bio_raw: '个人简介

  Personal profile

  梅松，男，1977年4月生，2007年华中科技大学计算机学院系统结构专业博士毕业，现任华中科技大学信息安全系讲师，主要从事系统结构和网络安全技术的研究。从1999年开始同国内著名网络安全厂商进行合作，负责网络安全技术研究和产品开发。2001年荣获国家密码管理委员会颁发的省部级科技进步三等奖。2011年荣获湖北省科技进步一等奖。先后承担了多项国家级、省部级的'
