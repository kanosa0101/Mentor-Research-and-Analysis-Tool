bio_raw: '个人简介

  Personal Profile

  王秀华于

  2021

  年

  4

  月加入华中科技大学网络空间安全学院任副研究员。于

  2021

  年取得香港中文大学哲学博士学位。于

  2014

  年

  10

  月至

  2015

  年

  7

  月在香港科技大学做研究助理。于

  2021

  年

  1

  月

  -2021

  年

  4

  月在香港中文大学深圳做访问学者。在安全类顶级会议

  IEEE S&P

  ，及

  ACNS

  上以第一作者发表文章，同时在

  SecureComm

  ，

  COCOON

  ，

  NSS

  等国际知名会议上发表文章数篇。在密码类及安全类顶级会议

  CRYPTO

  ，

  ASIACRYPTO

  ，

  Infocom

  ，国际知名会议

  ESORICS, CT-RSA

  ，

  ACNS

  ，

  GlobeCom, AsiaCCS, SecureComm, AsiaPKC, CANS, ICPADS, ISC, ISPEC, ProvSec, ICICS,
  IWSEC, DSC, C2SI

  等，安全类顶级期刊

  T-IFS

  及

  JISA

  担任审稿人。担任

  ICICS，IEEE ICC,，GlobalComm等国际

  会议的程序委员。科研兴趣为前沿密码学概念包括访问控制加密，广播加密，函数加密，代理重加密，基于身份加密，基于属性加密等，和应用密码学包括群签名，增强隐私技术，可搜索加密，区块链技术，密码辅助人工智能安全技术等。

  更多详情信息请见我的个人主页：

