bio_raw: '个人简介

  Personal profile

  袁斌，博士，华中科技大学网络空间安全学院副院长。主要研究方向包括：物联网安全、逻辑漏洞检测、安全测试等。主持国家网络空间安全国家科技重大专项项目课题、国家自然科学基金青年/面上项目等项目，参与了国家重点研发计划项目、973项目等多项重大科技项目；获得湖北省教学成果一等奖；在网络空间安全国际顶级会议（Top
  4）S&P、USENIX Security、CCS以及其他国内外顶级会议/期刊ICSE、ISSTA、ACSAC、DSN、SCIS、IEEE TD...

