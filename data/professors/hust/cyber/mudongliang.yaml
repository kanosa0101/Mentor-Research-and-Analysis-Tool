title: 副教授
supervisor: 博导、硕导
bio_raw: '慕冬亮，男，河南焦作人，于2019年获得南京大学计算机科学与技术系授予的博士学位。在博士期间，他曾在宾州州立大学邢新宇老师实验组访问和学习。 2020年9月，他加入华中科技大学网络空间安全学院，聘为副教授，硕士生导师。他现在的研究方向为软件与系统安全。具体来说，研究兴趣主要集中于软件崩溃诊断，漏洞重现，漏洞挖掘，以及二进制分析。他在招收新的博士生和研究生，欢迎对操作系统和软件安全感兴趣的同学前来咨询。具体请看其主页：https://mudongliang.github.io/about/

  查看更多>'
