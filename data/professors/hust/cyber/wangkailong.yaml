bio_raw: '王凯龙，博士，网络空间安全学院副研究员。

  2022

  年于新加坡国立大学计算机学院取得博士学位，期间聘为助理研究员。此前

  2015

  年于新加坡南洋理工大学电子与电机工程学院取得一等荣誉学士学位。

  2023

  年

  3

  月回国加入华中科技大学。研究方向为大模型安全、网络及移动安全和隐私分析。在安全方面主要研究大模型和安全协议层面（如认证和授权协议）的漏洞，和应用层面的恶意软件检测。在隐私方面致力研究应用层面的隐私合规（如隐私政策，应用数据收集行为是否符合法律要求）等。

  相关研究成果发表在数篇国际顶级会议和期刊（包括

  MobiCom

  ，

  WWW

  ，

  SIGMETRICS

  ，

  ASE

  ，

  ISSTA

  ，

  TSE

  等）。'
