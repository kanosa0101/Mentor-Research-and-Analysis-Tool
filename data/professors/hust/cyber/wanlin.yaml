bio_raw: '个人简介

  Personal profile

  万琳，女，1975年6月出生。华中科技大学软件学院教授，华中科技大学计算机应用专业博士。长期从事计算机图形学、C语言程序设计等课程的一线教学，在中国大学MOOC平台开设计算机图形学课程。积极进行教学改革，2021年入选“高校计算机专业优秀教师奖励计划”。曾获得校教学质量一等奖、教学竞赛一等奖、课堂教学优质奖、最满意课堂，曾获评知心导师、优秀班主任、三育人积极份子、华中卓越学者。主持教育部产学研协同育人项目、...

