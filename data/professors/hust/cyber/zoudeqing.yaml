bio_raw: '个人简介

  Personal profile

  邹德清，博士，华中科技大学二级教授、博士生导师，网络空间安全学院院长，长江学者特聘教授，武汉金银湖实验室主任，分布式系统安全湖北省重点实验室主任。国家网络安全优秀教师，教育部新世纪优秀人才，网络空间安全国家科技重大专项专家组成员，华中科技大学开源创新研究院院长，华中科技大学网络空间安全智库主任
  （中央网信办首批网信智库试点单位），教育部网络空间安全教育指导委员会委员，全国信息安全标准化技...

