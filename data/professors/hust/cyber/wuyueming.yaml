bio_raw: '个人简介

  Personal Profile

  吴月明，华中科技大学教授，博士生导师，国家级青年人才，湖北省海外高层次人才，华中学者卓越特聘教授。2021年博士毕业于华中科技大学，2022年至2025年在新加坡南洋理工大学担任博士后研究员。2025年加入华中科技大学网络空间安全学院，主要研究方向为软件供应链安全、移动安全、人工智能安全等，在包括USENIX
  Security、CCS、NDSS、ICSE、FSE、ASE、ISSTA等会议/期刊上发表CCF-A类论文40余篇，获2021年湖北省科技进步奖一等奖，2025年中国通信学会科学技术奖二等奖，入选“中国精品科技期刊顶尖学术论文”，担任多个CCF-A类国际会议和期刊的程序委员会委员或审稿人。

  （详细信息见本人主页：https://wu-yueming.github.io/）'
