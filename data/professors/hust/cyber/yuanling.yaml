bio_raw: '个人简介

  Personal profile

  本科和研究生均毕业于武汉大学计算机学院，博士毕业于新加坡国立大学计算机学院。主要研究方向：大数据分析及处理、机器学习、基于联邦学习的隐私保护等。承担的相关纵向项目包括国家自然科学基金、总装预研项目、教育部博士点基金、湖北省自然科学基金等。并致力于将学术成果向社会应用的转化，与烽火技术服务公司、国家电网等建立了深入的合作关系，主要包括企业大数据的分析应用平台、运维系统的故障检测平台、微服务智能检...

