bio_raw: 郑俊，副教授，博士生导师，湖北省网络空间安全优秀教师，中国密码学会混沌保密通信专委会委员，湖北省网络空间安全学会青年委员会秘书长。在IEEE TCSVT、IEEE
  TCSⅠ、IEEE TII、Applied Mathematics and Computation、Chaos, Solitons & Fractals等顶级期刊上发表论文二十余篇，担任IEEE
  SMCA, IEEE TACS、Nonlinear Dynamics、计算机学报等权威期刊审稿人。主持国家自然科学基金青年科学基金项目，作为骨干成员参与国家重点研发计划重点专项项目，“十三五”国家密码发展基金密码理论课题，密码科学技术国家重点实验室开放课题，湖北省重点研发计划项目等
