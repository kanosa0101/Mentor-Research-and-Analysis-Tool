bio_raw: '李瑞轩

  华中科技大学计算机科学与技术学院教授，博士生导师，副院长，华中卓越学者计划特聘岗教授，华中科技大学计算机科学与技术学院信息安全研究所所长，华中科技大学智能与分布计算实验室主任，湖北省大数据应用工程企校联合创新中心主任，分布式系统安全湖北省重点实验室副主任，湖北省大数据安全工程技术研究中心副主任，大数据与国家传播战略教育部哲学社会科学实验室副主任，中国科学院信息工程研究所客座研究员、博士生导师，加拿大康考迪亚大学兼职教授，澳大利亚西悉尼大学兼职高级研究员。

  2009

  年入选武汉市青年科技晨光计划，

  2017

  年入选武汉市黄鹤英才计划。

  1997

  年毕业于华中理工大学计算机科学与工程系，

  2000

  年和

  2004

  年在华中科技大学计算机科学与技术学院分别获硕士和博士学位，

  2005

  年赴澳大利亚西悉尼大学进行访问研究，

  2009

  ～

  2010

  赴加拿大多伦多大学做博士后研究。

  现为

  IEEE

  会员，

  ACM

  会员，中国计算机学会杰出会员，中国计算机学会信息系统专业委员会副主任，中国计算机学会分布式计算与系统专业委员会常委，中国计算机学会大数据专家委员会委员，中国计算机学会数据库专业委员会委员，中国人工智能学会人工智能与安全专业委员会副主任，湖北省计算机学会理事，武汉计算机软件工程学会理事，湖北省电子政务咨询专家组副组长，

  国家自然科学基金评审专家。

  曾任中国计算机学会分布式计算与系统专业委员会副主任，中国计算机学会办公自动化专业委员会副主任，系统软件专业委员会委员，

  CCF

  武汉分部副主席

  /

  监事会主席，

  CCF YOCSEF

  武汉分论坛学术委员会主席（

  2013-2014

  ）。

  主要研究方向为

  大数据管理与分析，数据挖掘与机器学习，自然语言处理

  ，

  云计算与边缘计算，人工智能安全与隐私计算。

  作为项目负责人主持国家自然科学基金重点项目、国家重点研发计划、国家

  863

  计划、国家科技攻关计划、工信部电子发展基金、国家高性能计算基金、湖北省自然科学基金以及合作研究项目等'
