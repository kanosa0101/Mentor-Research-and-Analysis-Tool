bio_raw: '个人简介

  Personal profile

  冯丹，教授，博士生导师，国家杰出青年基金获得者。华中科技大学计算机科学与技术学院院长，武汉光电国家研究中心信息存储与光显示功能实验室主任，信息存储系统教育部重点实验室主任，数据存储系统与技术教育部工程研究中心主任。主要从事计算机系统结构、大数据存储系统、非易失存储技术、存算融合技术等方面的研究。先后担任973项目“面向复杂应用环境的数据存储系统理论与技术基础研究”和“下一代互联网信息存储的组织模式...

