bio_raw: '个人简介

  Personal profile

  付才：华中科技大学二级教授，博士生导师，华中学者特聘教授，信息安全实验室主任，武汉英才，光谷3551人才。中国密码学会，计算机学会以及IEEE成员。长期参与网络与信息安全方面的科研工作，是国家有关部门多项安全系统技术负责人。主要研究方向为代码安全、移动网络安全、网络行为分析；在TDSC、TCSS、计算机学报、中国科学、JPDC、IJCI、HPCC、TrustCom、ISPA等期刊、国际会议上发表文章50余篇，并40余次被SCI,EI检索；担任...

