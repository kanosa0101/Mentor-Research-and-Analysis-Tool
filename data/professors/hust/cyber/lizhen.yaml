bio_raw: 李珍，女，博士，副教授。2019年9月于华中科技大学取得网络空间安全专业工学博士学位，2019年12月至2021年5月在美国得克萨斯大学圣安东尼奥分校任博士后研究员，2022年1月加入华中科技大学网络空间安全学院，聘为副教授。主要研究领域包括软件安全和人工智能安全，具体在开源软件漏洞分析与检测、漏洞验证与修复、软件供应链安全、深度学习模型安全性分析与测试等方面开展深入研究。以第一或通讯作者身份的论文发表在系统安全领域和软件工程领域国际顶级会议NDSS和
  ICSE、国际顶级期刊TDSC和TOSEM、国际知名会议ACSAC和DIMVA等，获得国家发明专利授权7项，主持国家自然科学基金青年项目和面上项目各1项，参与国家重点研发计划项目多项，获得2021年度湖北省科技进步一等奖（第四完成人）和2021年度电子学会科技进步二等奖（第七完成人）。
