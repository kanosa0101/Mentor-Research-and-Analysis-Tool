bio_raw: '个人简介

  MORE+

  华中科技大学计算机科学与技术学院教授，博士生导师。华中科技大学计算机科学与技术学院数据工程研究所副所长。国家级精品资源共享课“汇编语言程序设计”负责人。主要研究方向为：新一代云数据库管理系统、大数据环境下的隐私保护、大数据分析与数据挖掘以及高安全等级系统的测试研究。作为项目负责人主持国家自然科学基金、国家863计划、国防预研等项目、密码基金，参与核高基重大研究、工信部电子发展基金以及横向'
