  年本科毕业于浙江大学竺可桢学院混合班；2021 年毕业于香港大学计算机科学系，获香港大学研究生奖学金（UPF）、龙荣轼教授及朱淑濂女士研究生奖学金和李兆基研究生奖学金资助。主要研究方向包括：（1）理论计算机科学：致力于具有可证...
