  个人简介

  个人基本情况

  罗云峰：男，

  1966

  年

  5

  月生。

  1994

  年华中理工大学系统工程专业毕业，获博士学位。

  1997

  年华中理工大学系统工程博士后出站后留校工作。现为华中科技大学自动化学院教授、博士生导师。

  主要研究方向

  决策分析、博弈论和社会选择理论。

  研究成果

  作为项目负责人及主要成员主持与参与完成多项国家自然科学基金、国家教委博士点基金、湖北省自然科学基金及横向科研项目。先后在国内外重要期刊和学术会议上发表多篇论文，出版学术专著《社会选择的理论与进展》和高校教材《博弈论教程》各一部。'
