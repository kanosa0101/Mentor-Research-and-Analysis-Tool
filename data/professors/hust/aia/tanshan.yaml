  研究方向：

  生物医学成像与计算重建

  医学影像分析、多模态大模型与智能体

  智能诊疗系统与医疗设备

  个人简介

  谭山，男，湖南娄底人。2007年3月毕业于西安电子科技大学，获模式识别与智能系统专业博士学位。2007年6月至2011年6月分别在美国休斯敦大学、马里兰大学从事博士后研究。2011年6月回国工作。谭山博士主要从事图像处理、生物医学成像、智能医疗等领域的研究。曾获全国百优博士论文提名奖（教育部、国务院学位委员会，2009）、全国高等学校科学研究优秀成果奖（自然科学一等奖，教育部，2009）、陕西高等学校科学技术奖（一等奖，陕西教育厅，2009）、美国医学物理师协会年会最佳论文奖(AAPM
  Best Paper in Physics, 2012)，IOP Publishing Top Cited Paper Award (英国物理学会出版社，2021)，模式识别国际会议最佳论文奖
  (ICPR Best Scientific Paper Award，2022)。谭山博士课题组提出的Hessian结构光超分辨荧光显微成像算法入选“2018年度中国光学十大进展”。

  讲授课程：

  数字图像处理、

  医学图像处理、

  人工智能进展、科学研究方法导论、文献检索与科技论文写作

  主持的部分项目:

  [1].

  基于扩散先验的真实场景贝叶斯图像复原，国家自然科学基金，面上项目，2025.1-2028.12，主持

  [2].

  高分辨荧光显微成像的信号恢复理论与算法研究, 国家自然科学基金，面上项目，2021.1-2024.12，主持；

  [3].

  锥形束CT图像重构中的最优多重正则理论及算法研究, 国家自然科学基金，面上项目，2017.1-2020.12，主持；

  [4].

  PET图像盲分割问题的理论和算法研究, 国家自然科学基金，面上项目，2014.1-2017.12，主持；

  招生信息：

  欢迎热爱学术研究且数学基础较好的同学报考博士或硕士研究生，本科专业不限。同时接收本科生（理、工类）进行科研培训。有意者请Email联系。

