bio_raw: '个人简介

  Personal profile

  陈立群，人工智能与自动化学院副教授。2019年毕业于华中科技大学人工智能与自动化学院，获博士学位。主要从事计算机视觉和嵌入式智能计算相关研究。主持国家自然科学基金青年项目、航天领域预基础科研、装备预研项目多项。发表IEEE
  Trans., AAAI, ACM MM等国际权威期刊和顶级会议在内的学术论文十余篇，授权发明专利16项。2017年获教育部科技进步一等奖，2024年入选湖北省青年拔尖人才计划。

  More+'
