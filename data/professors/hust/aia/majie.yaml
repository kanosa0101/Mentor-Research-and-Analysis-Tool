bio_raw: '个人简介

  Personal Profile

  马杰，

  博士，教授，博士生导师，现任职于华中科技大学自动化学院，同时担任多谱信息处理技术国家级重点实验室制导中心副主任，广东华中科技大学工业技术研究院“全自主无人艇环境感知与智能控制研究中心”系统集成室主任，同时兼任自然科学基金项目评议人，中国宇航学会会员，《

  Journal of Electronics

  》，《宇航学报》，《电子与信息学报》，《中国图像图形学报》，

  SPIE MIPPR

  等杂志和会议审稿专家。

  在学术研究方面，一直从事导航与制导、目标检测与识别等领域的科学研究和人才培养工作。在三维点云处理，图像信息处理，深度学习，目标检测与识别等领域取得了丰富的研究成果，国内外权威期刊发表相关论文百余篇

  ，授权发明和国防专利十余项

  。主持和完成国家自然科学基金、国家级预研基金、国家级装备预先研究计划，国防973、863等课题等

  30

  余项。'
