bio_raw: '个人简介

  孙建坤，现为华中科技大学人工智能与自动化学院副教授、博士生导师、国家级青年人才、小米青年学者，2013年在东南大学数学系获得数学与应用数学学士学位，2019年在东南大学自动化学院获得控制理论与控制工程博士学位，师从东南大学李世华教授和英国拉夫堡大学杨俊教授，2015年9月-12月在澳洲西悉尼大学做访问学者，合作导师为Wei
  Xing Zheng教授，2016年9月-2018年10月获得国家留学基金委资助在美国圣母大学联合培养，合作导师为Hai Lin教授。2020年3月-2023年5月在华中科技大学人工智能与自动化学院做博士后，合作导师为曾志刚教授。入选2020年度博士后创新人才支持计划、2023年度万人计划青年拔尖人才、2023年度小米青年学者，被评为2021年...

