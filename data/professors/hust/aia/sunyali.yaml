bio_raw: '个人简介

  Personal Profile

  孙雅丽，国家级青年人才计划入选者，华中科技大学人工智能与自动化学院教授、博士生导师。长期从事微纳光子学及智能生物检测等领域的研究工作。在 Light: Science
  & Applications、Advanced Materials、Laser & Photonics Reviews、Nano Letters、Advanced
  Optical Materials、Analytical Chemistry等学术期刊发表研究论文20余篇。主持国家自然科学基金优秀青年科学基金项目(海外)、青年科学基金项目(C类)、俄罗斯科学基金会优秀青年基金项目，参与金砖国家科技创新框架计划及中俄政府间科技合作重点专项。多次获得国际学术组织奖项，包括OSA
  Zuegel Family Scholarship，SPIE MKS Instruments Research Excellence Awards，ITMO大学Academic
  Mobility，纳米光子学与微纳光学国际会议最佳墙报奖等。多次在国际会议做邀请报告和口头报告。担任 Advanced Functional Materials，The
  Journal of Physical Chemistry Letters等学术期刊审稿人。

  近年来通过光与物质相互作用将微纳尺度物理量的测量转化为光学信号的测量，显著提高测量速度上限与测量信噪比上限。利用有限元分析方法设计微纳光子器件，共聚焦实验平台测量光学信号，实现基础物理量（温度、电场等）和生物标志物的精确测量。近期进一步引入人工智能算法，结合机器学习、神经网络与深度学习方法，开展生物光学信号的智能分类、生物/物理参数预测、器件性能评估与微纳光子器件或者结构逆向设计，实现从“光学信号获取”到“智能分析与结构优化”的一体化研究，进一步提升检测准确性、响应速度与器件性能。

  招生专栏：

  课题组具有完备的光学实验测试设备和仿真计算服务器，并聘请了专职行政助理处理日常事务。团队包括多名俄罗斯籍学生，并每年聘期多名外国专家来访交流，支持博士生就读期间参加国际会议和国际交流访问。欢迎光电、物理、测控、人工智能等相关专业的优秀学子加入攻读硕士及博士学位。联系方式：

  yali_sun@hust.edu.cn

  。'
