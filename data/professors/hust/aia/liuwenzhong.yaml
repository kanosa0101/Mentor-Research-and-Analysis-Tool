bio_raw: '个人简介

  Personal Profile

  刘文中，华中科技大学二级教授，国家级领军人才，曾获2015年湖北省技术发明一等奖。现任国家级科技创新平台基地：

  测控技术“一带一路”联合实验室中方主任，以及中国-波兰医学光子学与医学影像联合实验室中方主任

  。

  围绕“向极微观深入”前沿领域面临的纳米尺度精密测量科学挑战，研究以纳米Fe

  3

  O

  4

  为敏感元件，探索单磁颗粒实时成像与单磁纳米颗粒编码方法，以及在此基础上的微纳尺度温度、流速、磁场或力学测量技术。具体应用

  在神经细胞离子通道动作的纳米尺度实时同步观测，为神经信号输入信号（树突/突触前活动）与输出信号（轴突前脉冲）之间时空映射关系的研究提供科学仪器。研究方向涉及光学精密测量、干涉散射显微成像、弱信号检测、电磁场设计、机电一体化、光学精密机械设计等。

  博士硕士招生专栏：

  欢迎以科学研究为

  未来职业的、

  有志于科学仪器与

  生物智能交叉

  前沿研究的本科生、硕士生，

  学生骨干优先

  。

  欢迎提前联系来实验室交流。

  本团队配备高效专业的科研助理

  。累计培养与引进HW优青3名，洪堡或JSPS博士后3人次，

  曾牵线引进2007年诺贝尔物理学奖获得者P. Gruenberg为华中科技大学荣誉教授

  。本团队优先考虑

  团队合作、内驱力强、乐于分享的学生，招收专业为

  仪器科学、测控技术、机械自动化、电气自动化、神经生物学及应用物理等。联系Email：

  LWZ7410@hust.edu.cn

  。'
