bio_raw: 副教授，博士生、硕士生导师。现任华中科技大学人工智能与自动化学院专任教师，中国指挥与控制学会建模与仿真专业委员会委员。2020年度赴新加坡南洋理工大学计算机科学与工程学院（QS
  by Subject 2025：Computer Science & Information Systems 全球 Top6）以访问学者身份开展为期1年的合作研究。同时，为多谱信息智能处理技术全国重点实验室、图像信息处理与智能控制教育部重点实验室的核心研究人员。长期从事计算...
