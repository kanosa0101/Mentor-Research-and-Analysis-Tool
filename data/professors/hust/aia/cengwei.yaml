  主要研究方向

  决策理论与方法、安全与应急管理、供应链管理、信息集成技术

  招生要求

  （专业需求和招生方向）

  专业需求：自动化，测控，管理科学与工程，信息管理与信息系统，物流管理与物流工程，计算机科学，数学等。

  招生方向：系统工程

  代表性成果及获奖情况

  （论文、科研或奖励情况）

  近年来，一直从事系统工程理论与方法的教学和科研工作，在

  决策理论与方法、安全与应急管理、供应链管理、信息集成技术

  等领域取得了一定成果，主持和承担了国家自然科学基金、国家科技支撑计划、中国国际战略学会、校自主创新研究基金等科研项目；同时主持和承担了省、市、企业等科研项目，包括国民经济动员信息系统、三峡工程管理系统、湖北储备物资地理信息系统、国家储备粮库信息系统、黄冈融入武汉城市圈区域对接规划、非传统安全等项目，在国内外学术期刊和学术会议上发表论文三十多篇。'
