bio_raw: '职称：

  教授、博士生导师

  电话：

  027-87540210

  邮箱：

  houshengsu@qq.com

  研究方向：

  多自主体系统的一致性和蜂拥控制及其应用、复杂网络等

  个人简介

  个人基本情况

  苏厚胜，华中科技大学自动化学院教授，博士研究生导师。2008年12月毕业于上海交通大学自动化系获工学博士学位；2008年12月至2010年1月在香港城市大学电子工程系博士后；2010年至今多次在香港大学机械工程系作为高级访问学者从事合作研究工作。

  主要的学术荣誉包括：

  （1）2018年科睿唯安全球高被引科学家；

  （2）2018年湖北省杰出青年基金获得者；

  （3）2017年美国大学生数学建模竞赛一等奖指导教师；

  （4）2016年湖北省优秀硕士学位论文指导教师；

  （5）2016年湖北省自然科学优秀学术论文一等奖（排1）；

  （6）2016年第十四届上海图书奖二等奖（排1）；

  （7）2015年国家自然科学奖二等奖（排3）；

  （8）2014年教育部自然科学奖一等奖（排2）；

  （9）2013年“华中学者”晨星岗；

  （10）2013年湖北省优秀学士学位论文指导教师；

  （11）2012年湖北省优秀学士学位论文指导教师；

  （12）2012年教育部新世纪优秀人才；

  （13）2012年华中科技大学学术新人奖；

  （14）2011年亚洲控制会议最佳论文提名奖（排1）；

  （15）2010年上海市优秀博士论文奖。

  主要学术任职包括：

  主要学术任职包括：全国复杂网络学术会议程序委员会委员；中国控制会议程序委员会委员；中国系统仿真学会智能物联系统专业委员会委员；中国自动化学会控制理论专业委员会多自主体学组专业委员会委员；国家自然科学基金面上基金通讯评审；亚洲控制协会会员；湖北省自动化学会理事。

  国际期刊IET Control Theory & Applications的Associate Editor；国际期刊Journal of Applied Mathematics的Editorial
  Board Member；国际期刊Journal of the Franklin Institute、IET Control Theory & Applications和Mathematical
  Problems in Engineering的Guest Editor；IEEE CSS Conference Editorial Board Member；IEEE
  CDC、ACC、ASCC和CCC的Associate Editor。

  作为项目负责人主持国家自然科学基金、教育部博士点基金、湖北省自然科学基金面上基金和华中科技大学自主创新基金等多项科研项目。作为第一作者在Springer出版社出版一本英文学术专著，发表SCI期刊论文80多篇，所发表论文包括自动控制领域国际主流学术刊物IEEE
  Transactions on Automatic Control（长文），Automatica等。

  学术专著：

  [1] Housheng Su and Xiaofan Wang, Pinning control of complex networked systems,
  Springer, 2013.

  代表论文：

  [1] Housheng Su, X. Wang and Z. Lin, Flocking of Multi-Agents with a Virtual Leader,
  IEEE Transactions on Automatic Control, 2009, 54(2):293-307. (Regular Paper) (SCI)

  [2] Housheng Su, X. Wang, G. Chen and Z. Lin, Adaptive Second-order Consensus of
  Networked Mobile Agents with Nonlinear Dynamics, Automatica, 2011, 47(2): 368-375.
  (SCI)

  [3] Housheng Su, X. Wang and Z. Lin, Synchronization of Coupled Harmonic Oscillators
  in a Dynamic Proximity Network, Automatica, 2009, 45(10):2286-2291. (SCI)

  [4] Housheng Su, Z. Rong, M. Z. Q. Chen, X. Wang, G. Chen and H. Wang, Decentralized
  Adaptive Pinning Control for Cluster Synchronization of Complex Dynamical Networks,
  IEEE Transactions on Cybernetics, 2013, 43(1): 394-399. (SCI)

  [5] Housheng Su, M. Z. Q.  Chen, J. Lam and Z. Lin, Semi-Global Leader-following
  Consensus of Linear Multi-agent Systems with Input Saturation via Low Gain Feedback,
  IEEE Transactions on Circuits and Systems I: Regular Papers, 2013, 60(7): 1881-1889.
  (Regular Paper) (SCI)

  [6] Housheng Su, M. Z. Q. Chen, X. Wang and J. Lam, Semiglobal Observer-based Leader-Following
  Consensus With Input Saturation, IEEE Transactions on Industrial Electronics, 2014，61(6):2842-2850.
  (Regular Paper) (SCI)

  主要研究方向：

  群体智能；多无人艇系统编队集群；多智能体系统协同控制；复杂网络；非线性控制。

  研究成果：

  (1) 国家自然科学基金（61473129、61104140）；

  (2) 教育部新世纪优秀人才支持计划项目（NCET-12-0215）；

  (3) 教育部博士点基金（20100142120023）；

  (4) 湖北省自然科学基金面上项目（2011CDB042）；

  (5) 华中科技大学自主创新基金。'
