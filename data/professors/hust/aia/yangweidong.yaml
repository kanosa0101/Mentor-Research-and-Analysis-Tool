bio_raw: '杨卫东

  职称：

  副教授

  电话：

  027-87558913

  邮箱：

  yangwd@mail.hust.edu.cn

  研究方向：

  多模成像目标识别、多谱图像分析与融合、匹配参考图制备等

  个人简介

  个人简介

  1993

  —1997年，华中理工大学，工业电气自动化专业，获学士学位；

  1997

  —2000年，华中科技大学，模式识别与智能系统专业，获硕士学位；

  2000

  —2005年，华中科技大学，模式识别与智能系统专业，获博士学位；

  2005

  —2007年，华中科技大学，计算机软件与理论博士后流动站；

  2006-至今

  ，华中科技大学自动化学院留校任教

  主要研究方向

  多模成像目标识别、多谱图像分析与融合、匹配参考图制备、工业在线检测、实时处理软件优化与设计

  招生要求

  （专业需求和招生方向）

  专业需求：自动化，电信，计算机，软件工程等

  招生方向：模式识别与智能系统

  代表性成果及获奖情况

  （论文、科研或奖励情况）

  近五年承担的科研项目情况：

  1)

  863

  计划：成像特性处理技术应用研究

  2)

  教育部博士后科学基金：多谱图像地物目标共性特征建模、反演与匹配方法研究

  3)

  国家级重点预研计划：目标特性多源信息融合处理技术，目标前视红外特征提取技术，红外成像目标信息保障技术研究

  4)

  国家级预研基金：SAR成像弱特征提取及匹配方法研究，基于纹理基元的场景表达与目标识别方法研究

  5)

  省部级基金：基于视皮层模型的红外目标识别置信度估计方法，雷达景象匹配参考图制备技术,前视红外地面目标识别特征图生成技术研究

  6)

  横向合作：红外成像目标识别技术，红外信息处理器研制，SAR参考图匹配子区选取与评估技术，图像/非图像信息融合算法，融合算法评估子环境

  作为主要完成人参与项目：

  国家重点预研项目：自动目标检测识别处理技术

  国家自然科学基金重点项目：高速平台多模检测识别动目标的理论方法与关键技术

  省部级预研项目：毫米波成像自动目标识别技术

  已授权国家发明专利：

  （１）

  杨卫东，龙睿，张天序，一种红外图像海面目标检测识别定位方法，ZL200910063265.5

  （２）

  杨卫东，黄伟麟，殷凯等，一种基于支持向量机的SAR景象匹配区选取方法，ZL201110031907.0

  （３）

  杨卫东，朱鹏，朱虎，一种基于平台惯姿参数的序列图像目标递推识别方法，ZL201110266278X

  （４）

  杨卫东，黄伟麟，邹腊梅等，基于可见光卫星影像的下视红外匹配识别模板选取方法，2011100102478

  （５）

  孙向东，杨卫东等，基于可见光图像的DBS雷达匹配特征参考图快速更新方法，2011100102514

  科研获奖情况：

  部委级科技进步一等奖1项，二等奖2项，三等奖2项。'
