bio_raw: '个人简介

  Personal profile

  高常鑫，华中科技大学教授、全国重点实验室副主任，国家级青年人才，任中国人工智能学会模式识别专委会副秘书长、中国图象图形学学会成像探测与感知专委会副秘书长。研究领域为计算机视觉、图像/视频智能理解、语义分割、行为识别，图像/视频生成等。近年来发表IEEE
  TPAMI、IJCV、IEEE TIP、CVPR、ICCV、ECCV等高水平期刊会议论文40余篇。先后主持湖北省杰出青年基金项目、国家自然科学基金面上项目、装备预研项目等。获湖北省...

  More+'
