bio_raw: '个人简介

  Personal profile

  副教授、硕导、国家自然科学基金青年科学基金项目（B类）获得者。研究方向主要包括多智能系统编队控制、车辆队列控制等。以第一作者在IEEE汇刊、Automatica、SIAM期刊共发表论文17篇，入选ESI高被引论文2篇。获中国自动化学会自然科学奖二等奖（排1）、中国自动化学会优博奖、亚太神经网络学会青年研究者奖等奖项。主持国家自然科学基金（青B、面上、青C）以及博士后科学基金站前特别资助等，参与了科技部重大专项、武汉市科技...

