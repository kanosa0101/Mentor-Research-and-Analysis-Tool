  代表性成果及获奖情况

  （论文、科研或奖励情况）

  作为项目负责人已主持承担8项国家自然科学基金项目。2003年入选教育部“优秀青年教师资助计划”，2005年入选教育部“新世纪优秀人才支持计划”及湖北省“新世纪高层次人才工程”。在科学出版社等出版社出版《面向复杂系统的群集智能》（获得

  国家科学技术学术著作出版基金资助

  ）等学术专著6本；在国内外学术期刊发表论文100多篇，其中30多篇被SCI、SSCI收录（第一作者20余篇）。指导2名博士生完成的博士学位论文被评为湖北省“优秀博士学位论文”。

  迄今已获得以下5项省部级自然科学奖和科技进步奖，均为第一完成人；

  l

  “几类管理优化问题的建模与求解研究”2011年获得高等学校科学研究优秀成果奖自然科学奖二等奖（排名第一）

  l

  “复杂管理系统的数字化求解研究”2011年获得湖北省自然科学奖三等奖（排名第一）

  l

  “产品设计与金融工程中的若干问题的智能求解研究”2009年获得湖北省自然科学奖三等奖（排名第一）

  l

  “复杂系统决策理论与方法研究”2008年获得湖北省自然科学奖三等奖（排名第一）

  l

  “面向CIMS的嵌套式管理决策机制与方法研究”2000年获得湖北省科技进步奖二等奖（排名第一）'
