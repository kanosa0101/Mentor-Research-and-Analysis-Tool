bio_raw: '个人简介

  Personal profile

  伍冬睿，2003年中国科学技术大学自动化学士，2006年新加坡国立大学电子与计算机工程硕士，2009年美国南加州大学电子工程博士。华中科技大学卓越首席教授、博导，脑机接口研究院副院长，IEEE
  Fellow, IEEE模糊系统汇刊 (IF=11.9) 主编。主要研究方向为脑机接口、机器学习、智慧医疗、情感计算。主持基金委（青A）、科技部、湖北省科技厅、武汉市科创局、深圳市科创委、中船、东风、华为、阿里、百度、蚂蚁等项目。出版学术专著《...

