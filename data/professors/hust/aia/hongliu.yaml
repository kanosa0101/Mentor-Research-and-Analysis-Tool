  个人简介

  个人简历

  洪流

  ，

  博士，华中科技大学自动化学院教授，博士生导师。

  2007

  年在华中科技大学自动化学院获博士学位。

  2007

  年在华中科技大学计算机学院从事博士后研究工作。

  2012

  年在美国普度大学

  交通工程系访学。

  已

  发表

  SCI

  收录论文

  三十余篇，主持国家自然科学基金三

  项、及湖北省自然科学基金、中国博士后科学基金等多个科研项目，获国家发明专利授权三项。担任

  Reliability Engineering and System Safety, Transportation Research Part E

  等多个国际重要期刊及

  Transportation Research Board

  等多个国际研究组织的审稿人。

  担任中国系统工程学会系统可靠性专业委员会理事，世界交通大会智慧基础设施系统专业委员会委员

  。

  主要研究方向：

  交通基础设施系统的脆弱性、弹性及保护，复杂系统的建模与仿真等。

  近年来主持的科研课题：

  1)

  国家自然科学基金面上项目：综合交通系统在典型自然灾害下的脆弱性评估与脆弱性控制策略研究，

  7

  2071088

  。

  2)

  国家自然科学基金面上项目：互补交通基础设施系统脆弱性分析方法及其应用研究，61572212

  。

  3)

  国家自然科学基金青年项目：关联基础设施网络的脆弱性研究，60903174

  。

  4)

  湖北省自然科学基金：自然灾害下互补交通网络的脆弱性分析及改进策略研究，

  2012FFB02203.

  5)

  中国博士后科学基金：基于网格的决策支持系统中决策资源的描述及管理模式研究，

  20080430961

  。

