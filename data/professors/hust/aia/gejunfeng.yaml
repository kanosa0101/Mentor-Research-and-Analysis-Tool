bio_raw: '葛俊锋

  职称：

  副教授

  电话：

  027-87556579

  邮箱：

  gejf@mail.hust.edu.cn

  研究方向：

  结冰传感器及探测技术、光纤式燃油液位传感器等

  个人简介

  个人简介

  1999—2003

  年，华中科技大学，测控技术与仪器专业，获学士学位；

  2003—2005

  年，清华大学，检测技术与自动化装置专业，获硕士学位；

  2005—2009

  年，清华大学，控制科学与工程，获博士学位；

  主要研究方向

  结冰传感器及探测技术，光纤式燃油液位传感器，发射率在线测量及红外非接触测温技术，视觉测量技术，图像视频处理及模式识别

  ,

  嵌入式测控系统。

  招生要求

  （专业需求和招生方向）

  专业需求：自动化，测控，机械，光学等

  招生方向：

  检测技术与自动化装置

  代表性成果及获奖情况

  （论文、科研或奖励情况）

  [1] Ge Junfeng, Ye Lin, Zou Jianhong. A Novel Fiber-optic Ice Sensor Capable of
  Identifying Ice Type Accurately[J]. Sensors and Actuators A: Physical, 2012, 175:
  35-42

  [2] Ge Junfeng,Luo, Yupin,Tei Gyomei.Real-time Pedestrian Detection and Tracking
  at Nighttime for Driver Assistance Systems[J].IEEE Transactions on Intelligent Transportation
  Systems, 2009, 10(2): 283-198.

  [3]Zou Jianhong, Ye Lin, Ge Junfeng. Ice type detection using an oblique end-face
  fibre-optic technique[J]. Measurement Science and Technology. 2013, 24(3):035201.

  [4] Zou Jianhong, Ye Lin, Ge Junfeng, et al. Novel fiber optic sensor for ice type
  detection[J]. Measurement: Journal of the International Measurement Confederation.
  2013, 46(2): 881-886.

  [5] Zhao Chengrui, Ye Lin, Ge Junfeng, et al. Novel light-leaking optical fiber
  liquid-level sensor for aircraft fuel gauging[J]. Optical Engineering. 2013, 52(1):
  14402.

  主持光纤式飞机结冰探测相关项目三项，其中国家自然科学青年基金项目一项。主持风力机结冰探测、三维手势识别等其他横向项目四项。参与国家自然科学面上基金项目1项，航空联合基金重点项目1项。近几年来在国内外期刊及会议发表论文二十多篇，十篇论文被SCI和EI收录，申请专利8项，获中国航空工业集团公司航空科学技术奖三等奖1项。'
