title: 副教授
bio_raw: '个人简介

  Personal Profile

  蒋建华，工学博士，华中科技大学人工智能与自动化学院副教授，香江学者，国际清洁能源拔尖人才；主要从事机器学习、大数据分析与智能控制算法，及其在固体氧化物燃料电池系统、氢

  /

  电动力储能系统、微电网等新能源系统的应用研究，包括电池智能监控与故障诊断，系统健康预测机器学习算法，工业大数据智能分析，微网及无人多机系统群体智能协同控制等。

  在研究领域内获批主持国家自然科学基金

  （

  3

  项

  ）

  、省部级以上科研项目十余项，在

  Applied Energy, Energy conversion and management, Energy, Journal of Energy Storage,
  International Journal of Hydrogen Energy

  等国际一流

  SCI

  权威期刊上发表

  论文近四十余篇，申请获批授权专利四十余项，并获得日内瓦发明金奖（

  2018

  ）、中国商业联合会科技进步特等奖（

  2018

  ）、湖北省科技进步二等奖（

  2018

  ）、湖北省技术发明二等奖（

  2021

  ）、中国自动化大会最佳论文等奖项（

  2021

  ），获香港

  “

  香江学者

  ”

  与国际清洁能源拔尖人才项目（

  ICET2019

  ）。

  中国自动化学会会员、青年工作委员会委员、中国能源学会会员、燃料电池系统领域行业标准起草及制定骨干、曾/现担任国家自然科学基金、省基金评审人与多个国际一流期刊审稿人及

  CAC

  等会议分会主席。指导的学生在国企、外企均有良好的就业，多人获得国家奖学金，一人获得国家留学基金委

  CSC

  保送德国亚琛工业大学攻读博士学位。

  自动化与人工智能是人类科技文明的基石，欢迎积极努力、踏实诚恳、有理想的自动化、人工智能、电气及能源等相关专业的同学加入，在以梦为马的年纪，努力拼搏、学有所成、勇攀高峰。'
