  keyluo@mail.hust.edu.cn

  研究方向：

  全数字化交流驱动技术、新型交流传动系统理论与应用等

  个人简介

  个人基本情况

  罗慧，

  1976

  年

  3

  月生，

  工学博士，华中科技大学自动化学院讲师。

  1998

  年

  毕业于武汉理工大学动力系，获内燃机专业学士学位，

  2001

  年

  12

  月获华中科技大学控制理论与控制工程专业工学硕士学位，

  2002

  年

  7

  月赴美国密西根州罗克韦尔总部

  进修学习

  ，

  2009

  年

  5

  月获华中科技大学控制理论与控制工程专业工学博士学位

  。

  主要研究方向

  长期从事全数字化交流驱动技术、新型交流传动系统理论与应用、

  信号处理技术

  以及智能控制等方面的

  教学与

  研究工作，在该领域积累了

  大量

  的研究经验

  。

  研究成果

  近

  5

  年主持项目：

  全数字交流伺服驱动系统开发

  、主轴驱动系统超高速区域磁场准确定向策略研究、

  无速度传感器矢量控制技术研究

  、岩石激发极化自动测量系统开发。近

  5

  年参与项目：

  全数字通用变频器开发、多目标下结构进化型再励学习方法及其实现技术研究等。近

  3

  年来主持横向课题

  4

  项，

  主持纵向项目

  1

  项，

  作为主要技术人员参与国家自然科学基金

  3

  项，在国内外重要学术期刊发表学术论文1

  8

  篇，其中EI收录5篇。

  曾获校教学成果二等奖、教学质量二等奖、已指导

  2

  名研究生攻读硕士学位。'
