bio_raw: '个人简介

  华中科技大学人工智能与自动化学院，智能系统与系统工程系，教授。主要从事系统工程、运营管理、运筹优化、分布式仿真、AI技术增强等方面的教学与科研工作。研究方向为复杂系统安全应急与智能决策，包括：供应链/物流系统安全与决策优化、城市安全应急调度与仿真优化、安全风险实时感知与智能预警等。担任国家国民经济动员仿真演练研究中心技术负责人，以及安全预警与应急联动技术湖北省协同创新中心、区域（福建）反恐研究中心特聘技术专家。主持国家自然科学基金面上项目3项；技术负责科技部重点研发计划、基金委重大研究计划、中国工程院重大战略咨询项目6项；主持或技术负责省、市级政府专项和企业科技创新项目30余项。一作发表SCI/SSCI期...

