bio_raw: '个人简介

  Personal profile

  徐飞，华中科技大学人工智能与自动化学院，副研究员。毕业于华中科技大学，获生物医学工程博士学位，导师是刘笔锋教授；博士后研究方向是生物计算及应用，合作导师是潘林强教授；2022年5月入职华中科技大学人工智能与自动化学院。
  研究方向包括生物计算、DNA计算、DNA纳米技术等。在Angewandte Chemie International Edition、Nanoscale、Nanotechnology等国际期刊发表论文20篇，申请发明专利6项，获批1项；主持国家自然科学...

