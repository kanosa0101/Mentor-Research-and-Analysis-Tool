bio_raw: '个人简介

  Personal profile

  俞耀文，男，湖北武汉人。2019年10月起任华中科技大学人工智能与自动化学院副教授，主要研究方向：电力能源系统优化调度、人工智能与电网大数据、电力市场策略竞价与机制设计。2011年在华中科技大学获得自动化专业工学学士学位，2016年于美国康涅狄格大学（University
  of Connecticut）获得电子工程专业博士学位。2016年9月至2019年9月在ABB集团（世界500强企业）美国硅谷办公室任高级应用工程师，并作为技术带头人，带领跨美国...

  More+'
