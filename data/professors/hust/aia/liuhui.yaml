bio_raw: '个人简介

  Personal Profile

  Work Experience:

  §

  2025/03-Now, Huazhong University of Science & Technology, Professor

  §

  2014/03-2025/02, Huazhong University of Science & Technology, Associate Professor

  §

  2014/05-2014/08, Polytechnic University of Hong Kong, Post Doctor

  §

  2014/01-2014/02, Chinese Academy of Sciences, Visiting Scholar

  Education:

  §

  2001-2005, Wuhan University, Bachelor Degree

  §

  2005-2010, Wuhan University, PhD Degree

  §

  2009-2013, University of Groningen, PhD Degree

  Honors

  ：

  （1）获得校优秀教师班主任（2018、2020、2023年度）。

  （2）入选湖北省楚天学者计划 （2014年、青年）。

  （3）获得中国网络科学论坛十周年“青年希望奖”（2014年）。

  （4）获得湖北省优秀博士论文奖（2011年）。

  （5）获中国自动化学会高等教育教学成果特别贡献奖（2024年）。

  （5）获中国仿真学会科学技术奖一等奖（2025年）。

  （6）获湖北省自然科学基金青年A类项目（2026年）。

  研究领域及招生：

  人工智能、（图）机器学习、机器视觉、工业互联网大数据挖掘；多智能体系统、自主无人系统协同感知与智能控制

  招生：

  每年招收博士生1名、硕士生若干名。招收人工智能、自动化、计算机、计算或应用数学等相关专业的研究生。欢迎勤奋踏实、吃苦耐劳、具有团结合作精神的硕士、博士研究生报考！课题组期待数理基础好及有较强编程能力的同学加入，以梦为马、共展华章。
  已毕业学生多进入多家IT及AI高端科技公司，包括：华为、阿里、腾讯、小米、网易、Bigo、上海证券交易所、中国移动、百度等龙头企业或者国企。

  长期欢迎有研究兴趣的本科生、毕设学生参与课题或者竞赛，组织挑战杯、大创及其它科创比赛等赛事。本人指导过多名本科生进入实验室课题、指导过多个大学生创新创业项目，并获得省级优秀奖励等。

  欢迎有兴趣参加各级竞赛及挑战杯的同学联系，多次担任过美赛、图形图像竞赛、挑战杯等重要赛事指导老师，并获多项奖项。

  指导学生学科竞赛：

  1. 2025年，第十九届“挑战杯”全国大学生课外学术科技作品竞赛2025年度中国青年科技创新“揭榜挂帅” 插台赛全国二等奖，指导老师

  2. 2025年，第十九届“挑战杯”全国大学生课外学术科技作品竞赛“人工智能+”专项赛应用赛全国三等奖，指导老师

  3. 2025年，第十九届“挑战杯”全国大学生课外学术科技作品竞赛2025年度中国青年科技创新“揭榜挂帅”插台赛全国优胜奖，指导老师

  4. 2022年，湖北省大学生创新创业计划结题优秀，指导老师

  5. 2021年，美国大学生数学建模竞赛Honorable奖，指导老师

  6. 2024年， CSIG 图像图形技术挑战赛优秀奖，指导老师

  科研项目

  ：

  1.

  基于图学习的高阶动态网络协同优化调控与重要结构挖掘研究，国家自然科学基金面上项目， 基金号：62573208，2026/01-2029/12，主持

  2.

  多层时变有向网络的超扩散研究，国家自然科学基金面上项目，基金号：62176099，2022/01-2025/12，主持

  3.

  基于图谱方法的多层网络层间作用机理，国家自然科学基金面上项目，基金号：61773175，2018/01-2021/12，主持

  4.

  复杂动态环境下跨域自主智能无人集群系统协同优化调控，湖北省自然科学基金青年A类项目，基金号：JCZRQNA202600158，2026/03-2029/03，主持

  5.

  融入突触可塑性的脑功能机制及新一代脑启发神经网络计算，华中科技大学交叉研究重点支持项目，2024/01-2026/12，参与

  6.

  基于神经可塑性的脉冲网络高效学习机制与类脑智能系统, 科技部, 科技创新2030-重大项目, 基金号: 2021ZD0201300, 2021/12-2026/11,
  参与

  7.

  基于忆阻的类人情感生成与演化及其在情感机器人中的应用, 国家自然科学基金委员会, 重点项目, 基金号: 61936004, 2020/01-2024/12, 参与

  8.

  开放环境下异质微电网的群智协同主动安全调控理论与方法，科技部科技创新2030—新一代人工智能前沿交叉研究项目，2023/03-2027/02，参与

  9.

  无人“机-艇”水空协同关键技术及其在海面巡逻中的应用示范, 国家自然科学基金委员会, 联合基金项目, 基金号: U1913602,  2020/01-2023/12,
  参与

  10.

  基于粗糙信息的多自主体编队控制，国家自然科学基金青年项目，基金号: 61403154，2015/01-2017/12， 主持

  11.

  基于图方法的多智能体编队控制，湖北省自然科学基金面上项目，基金号：2017CFB426，2017/08-2019/07，主持

  12.

  有限时间收敛的多智能体编队控制，华中科技大学自主创新基金项目，2014/01-2015/12，主持

  13.

  高比例新能源系统出力场景生成及多周期优化理论，企业开发：可再生能源并网全国重点实验室，2024/05-2025/09，主持

  14.

  基于类脑智能的全自主控制理论与应用，湖北省创新群体项目，湖北省科技厅，基金号：2017CFA005，参与

  学术任职：

  担任中国人工智能协会会员，中国网络科学专委会委员，中国复杂系统与复杂网络专委会委员，中国智能控制与系统专委会委员，中国工业与应用数学学会会员。担任国内外多个学术会议程序委员会委员。担任多种国际著名学术期刊/会议评审人。

  科研成果介绍：

  主持和参与了国家级、省部级科学研究课题10多项，包括多项国家自然科学基金面上项目、青年项目、国家自然科学基金重点项目，参与企业横向多项。在重要学术刊物上发表论文60多篇，其中3篇论文入选ESI
  Web of Knowledge高引用率文章、1篇论文被评为期刊季度热点论文。出版学术专著1 部（合著，获得国家科学技术学术专著基金资助），出版外文书1章节（英国伦敦IET
  出版社）。 详细见论文列表。

  与本领域及相关交叉学科的若干国际知名学者和科研单位有密切的合作和联系，优先推荐优秀硕博学生海内外深造、就业及交流学习。

  实验室团队：

  类脑智能与智能控制实验室

