title: 副教授
bio_raw: '孙志刚

  职称：

  副教授

  邮箱：

  sunzg@mail.hust.edu.cn或szg_hust@sina.com

  研究方向：

  计算机实时控制、网络化控制、机器视觉与图像处理等

  个人简介

  个人基本情况

  孙志刚，男（

  1969~

  ）。

  1991

  年在华中理工大学获自动控制专业学士学位；

  1994

  年在华中理工大学工业自动化专业获硕士学位。

  1994

  年在华中科技大学控制系任教。

  1999

  年破格任副教授。在职博士。研究兴趣包括：网络控制系统、混杂控制系统、离散事件动态系统；计算机集成控制与网络；视觉检测、视觉伺服及其工业应用；

  CPLD

  、

  FPGA

  、

  DSP

  系统开发及其在信号处理、系统控制和图像处理中的应用。

  主要研究方向

  主要研究方向：计算机实时控制、网络化控制、机器视觉与图像处理、混杂系统；

  CPLD

  、

  DSP

  、嵌入式系统开发及其在视觉系统和工业控制中的应用。

  研究成果

  近年来完成的主要科研项目包括：“线性多值评价空间上的一般系统可控性研究（国家自然科学基金）”、“网络控制系统理论研究与系统设计”（教育部博士点基金）”、“视觉伺服在同步控制中的应用研究（研究生基金）”、“新型磁棒圆网印花联合机控制系统（原纺织总会“九五”计划项目）”、和企业委托项目“高精度高速多轴同步计算机控制系统、“平网印花机网络化控制系统”、“陶瓷印刷激光雕刻机”、“数字圆网印花机控制系统”等。协助和独立培养研究生13名。发表学术论文20余篇，获湖北省科技进步二等奖1项，完成的多项科研项目已产品化，取得了一定的经济效益和社会效益。'
