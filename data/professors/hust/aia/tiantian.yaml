bio_raw: '个人简介

  田甜，人工智能与自动化学院、多谱信息智能处理技术全国重点实验室副教授，全重实验室部副主任、图像识别与智能科学系副主任。2015年博士毕业于华中科技大学自动化学院。主要研究方向为计算机视觉、多谱图像解译、图像导航与制导等。发表期刊论文40余篇、会议论文30余篇，出版专著3部，授权专利和软著十余项。主持国家自然科学基金面上及青年项目、航天预研项目等，获指控学会科技进步二等奖1项。中国计算机学会会员，《飞控与探测》青年编委、Remote
  Sensing客座编辑，PAMI、TGRS、CVPR、ECCV、AAAI等顶级期刊与会议审稿人。

  查看更多>'
