bio_raw: '个人简介

  Personal profile

  胡晓娅，博士，教授，IEEE 高级会员，中国自动化学会仪表与装置专业委员会和网联智能服务系统专业委员会委员，国家科技专家库专家，公安部人工智能安全领域专家，教育部科技专家库专家，中央网信办专家库专家，湖北省科技奖励评审库专家，湖北省公安厅科技兴警智库专家。长期从事人工智能、人工智能安全、数据安全、工业互联网及系统信息安全等相关研究。主持国家重点研发计划项目（课题/任务）3项、国家自然科学基金项目4项、...

