bio_raw: '个人简介

  Personal Profile

  王卓，工学博士，华中科技大学人工智能与自动化学院副教授。研究方向聚焦氢能、智能电网、航空航天自动化测试系统、电力储能系统四大领域，致力于交叉学科探索与"理论—工程"深度融合，推动前沿技术从实验室走向产业落地，服务于新能源发展与航空、降碳的国家战略需求。

  近年来在 IEEE Transactions on Power Electronics、IEEE Transactions on Industrial Electronics、International
  Journal of Hydrogen Energy、Applied Energy、Energy Conversion and Management、Journal
  of Cleaner Production 等国际顶级期刊发表高水平论文 20 余篇，研究内容覆盖燃料电池故障诊断、混合动力能源管理、电力市场与微电网优化等方向。同时拥有多项发明专利，在电液伺服阀气动测量、滑阀副配磨等技术方向形成自主知识产权，已成功应用于航空航天工业装备。

  主持及参与国家级、省部级与企业委托项目 20 余项，代表性项目包括国家重点研发计划子课题（兆瓦级 SOFC 系统关键技术）、国家自然科学基金项目，以及来自中国航发、中国航天、中船重工、南方电网、广东能源集团等领军单位的横向课题，具备扎实的工程组织与产学研协同经验，可为研究生提供高水平科研平台与真实工程场景。2025
  年荣获中国电子学会科学技术奖技术发明奖二等奖与湖北省科技进步奖技术发明奖二等奖。

  注重学生实践与创新能力培养，指导学生获得：

  ◇ 2025年第十九届"挑战杯"中国青年科技创新"揭榜挂帅"擂台赛一等奖

  ◇ 多届 CIMC"西门子杯"中国智能制造挑战赛全国总决赛特等奖、一等奖等

  ◇ 2021 年中国大学生工程实践与创新能力大赛虚拟仿真赛道金奖

  招生信息：

  课题组聚焦氢能、智能电网、航空航天自动化测试、电力储能等方向，面向自动化、电气工程、电子信息、机械工程、应用数学等相关专业，长期招收硕士、博士研究生。

  期待你具备：

  1. 诚实严谨，具备扎实的数学与专业基础；

  2. 热爱钻研，对未知问题保持探索热情；

  3. 乐观坚韧，具备良好的抗压与协作能力；

  4. 较强的英文阅读与写作能力，能够独立研读外文文献并撰写学术论文。

  我们能提供：

  ◇ 充足的科研经费与一流的实验条件；

  ◇ 真实的产业课题与航空航天、新能源头部单位的合作机会；

  ◇ 平等开放的学术氛围，以及面向国际顶级期刊的发表训练；

  ◇ 因材施教的成长路径——无论你志在学术深造还是产业发展，都将获得针对性的支持。

  在这里，师生不仅是指导关系，更是并肩攻坚的科研伙伴。期待与志同道合的你共同探索有价值、有影响力的研究课题。有意者欢迎来信联系。

