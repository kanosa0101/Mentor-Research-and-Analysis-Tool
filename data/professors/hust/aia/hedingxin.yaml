  个人简介

  个人基本情况

  何顶新，男，

  1966年

  11

  月生，湖北天门人，教授。

  1987

  年本科毕业于华中理工大学计算机系；

  1995

  年获华中理工大学工业自动化专业工学硕士学位；

  1987

  年进入华中理工大学数控工程中心

  工作

  ；

  1996

  调入控制系；

  现任人工智能与自动化学院教授，任人工智能与自动化学院教学实验中心主任。担任本科生双语课程《计算机网络》课程组组长，还承担湖北省精品课程《

  C语言程序设计

  》和校精品课程《

  C语言课程设计

  》等课程的教学工作；主持和参与省、校级教改项目十余项，多次获省、校级教学成果一等奖；主持和参与国家自然科学基金面上项目、国际合作项目、数控系统及机器人技术等纵横向科研项目

  25项，

  曾获教育部科技

  进步

  三等奖和湖北省科技进步二等奖

  各一项；在《

  Automatica

  》、

  《

  IEEE Transactions on

  Neural Networks and Learning Systems

  》、《

  Neural Networks

  》等国内外权威刊物和会议上发表学术论文

  50

  余篇，论文被

  SCI收录

  20

  余篇，主编

  “十一五”国家级规划教材

  1

  本，参编教材

  2

  本。

  主要研究方向

  主要研究方向为：计算机控制技术、机器人控制系统、嵌入式控制技术、智能地图建模、多机器人定位与导航、智能群体网络协同优化等。

  研究成果

  主持

  纵

  横向科研项目

  : “多维度智能群体网络的感知与协同优化研究”

  、

  “一种远程控制的家用机器人研究”、“瑞萨电子中国联合基金项目”、

  “氨基酸纯化过程自动化系统”、“台式万用表数字电路软件

  和

  硬件开发

  ”等

  。

  曾获得教育部科技

  进步

  三等奖和湖北省科技进步二等奖各一项

  。

  主持湖北省教改项目

  1项、校级教改项目3项，参与省、校级教改项目十余项，曾先后获湖北省高等学校教学成果一等奖、华中科技大学教学质量一等奖、华中科技大学“三育人奖”等奖项。

  担任智能机器人创新基地负责人，入选全国万名优秀创新创业导师人才库，

  连续十余年获评华中科技大学科技创新优秀指导教师，

  指导学生获各类奖项

  100余项，其中100余人次获全国一等奖，全国冠军十余项。

  先后指导硕士研究生

  30

  余人。

  两次获湖北省优秀学士学位论文指导奖。

  近年来主要奖励

  2018年度 获湖北省高等学校教学成果奖一等奖

  2017年度 入选

  全国万名优秀创新创业导师人才库

  2017年度 获华中科技大学教学质量一等奖

  2016年度 获华中科技大学优秀教师班主任'
