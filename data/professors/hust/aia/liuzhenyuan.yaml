bio_raw: '个人简介

  现任华中科技大学人工智能与自动化学院智能系统与系统工程系教授、博士生导师，学院本科教育指导委员会委员，兼任中国运筹学会排序专业委员会常务理事、医疗运作管理分会会员、中国双法学会项目管理研究委员会委员、中国岩石力学与工程学会地下物流专业委员会委员、湖北省系统工程学会理事、中国人工智能学会会员、中国自动化学会会员、中国系统工程学会会员、中国物流学会会员，2016年入选武汉市“黄鹤英才计划”（创新人才）。受邀担任国家自然科学基金管理委员会管理科学部、信息科学部通讯评议专家、教育部学位论文评审专家以及AUTOMAT
  CONSTR、EJOR、COR、CIE、APJOR、ASOC、自动化学报、系统工程理论与实践、系统工程学报、运筹学学报、...

