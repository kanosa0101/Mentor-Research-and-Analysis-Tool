bio_raw: '个人简介

  Personal Profile

  刘智伟，男，1982年生，教授/博士生导师，教育部青年长江学者，湖北省杰出青年基金获得者。主持国家自然科学基金项目5项（含联合基金、面上项目、青年项目），承担国网总部科技项目、国网电科院科研项目等多项国家及企业级项目20余项。在

  IEEE Transactions

  发表论文83余篇、

  Automatica

  9篇

  ，16篇论文入选

  ESI

  高被引论文，谷歌学术引用超6300次，获授权发明专利21项。曾获日内瓦国际发明展金奖、银奖各1项，中国自动化学会自然科学二等奖（排名第一）、中国发明协会发明创业奖二等奖（排名第一）、指挥与控制学会技术发明二等奖（排名第二）、机械工业科学技术奖科技进步奖二等奖（排名第二），国际会议论文奖4次。担任

  IEEE Wuhan Section

  副主席、（曾）任

  IEEE Transactions on Industrial Informatics、

  控制工程

  、Energy Conversion and Economics

  等国内外期刊的副编辑或编委。

  研究方向

  ：人工智能在电力系统和无人集群系统的应用、基于人工智能的电力数据分析与预测、电力需求侧管理、

  智能电网优化与控制、无人集群系统优化与控制、

  多智能体分布式协同、混杂控制系统

  招生信息

  ：长期招聘博后、博士与硕士研究生、本科生进实验室，专业方向不限（人工智能、自动化、计算机、数学等方向优先），具有扎实的数学、英语与编程基础，欢迎联系

  zwliu@hust.edu.cn

