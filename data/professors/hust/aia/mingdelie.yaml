  代表性成果及获奖情况

  （论文、科研或奖励情况）

  明德烈

  ，博士，副教授，博士生导师，1974年2月生于湖北武汉，1999年于武汉理工大学计算机科学系获计算机及应用专业硕士学位，2002年在华中科技大学模式识别与人工智能专业博士生毕业，获博士学位（博士学位论文题目：增强现实系统中的若干关键技术研究——获得“湖北省优秀博士论文”称号），毕业后留校在华中科技大学图像识别与人工智能研究所工作。现为华中科技大学图像识别与人工智能研究所遥感图像信息处理研究室副主任，中国航天图像识别技术研究所研究员，图像信息处理与智能控制教育部重点室中心试验室副主任。一直从事图像分析与机器视觉等方面的研究工作。在国内外重要学术刊物及学术会议上发表有关学术论文40余篇，其中被四大检索收录论文20余篇。已主持完成湖北省自然科学基金、863项目课题等50余项。

