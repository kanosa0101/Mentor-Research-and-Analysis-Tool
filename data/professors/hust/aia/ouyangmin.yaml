bio_raw: '个人简介

  Personal Profile

  欧阳敏，华中科技大学人工智能与自动化学院教授，博士生导师，湖北省楚天学者。

  2009

  年获得华中科技大学系统工程专业博士学位，

  2009-2012

  年在美国莱斯大学土木与环境工程系从事博士后研究工作。主要研究方向为关键基础设施与城市韧性、城市科学等跨学科交叉领域。主持国家自然科学基金青年项目、面上项目共

  3

  项以及多项横向项目，参与工程与材料学部重点项目以及管理学部创新研究群体项目各

  1

  项。在

  Nature Communications

  等多学科领域

  Q1

  区期刊发表论文

  40

  余篇，谷歌学术引用

  4700

  余次，单篇最高引用

  1060

  次，

  H

  指数

  28

  ，多篇

  ESI

  高被引论文在领域顶级期刊自发表以来引用排名第一，曾连续六年（

  2014-2019

  ）入选

  ELSEVIER

  发布的

  “

  中国高被引学者

  ”

  （领域：安全、风险、可靠性与质量），连续三年（

  2020-2022

  ）入选斯坦福大学发布的全球前

  2%

  顶尖科学家榜单（

  2022

  年在

  Strategic, Defense & Security Studies

  领域的终身科学影响力世界排名

  33

  位，国内排名第

  3

  ）。研究成果被

  Science News

  报道，获得十余位院士正面评价、十余位知名同行大篇幅介绍。担任

  ASCE-Journal of Infrastructure Systems

  （

  JIS

  ），

  Reliability Engineering & System Safety

  ，

  Resilience Findings

  期刊编委，被美国土木工程协会

  JIS

  期刊评为

  2018

  年度杰出审稿人；担任

  Informs 2016

  、

  ICASP 2019

  、

  ICOSSAR2021

  等十余个国际学术会议的

  Session Chair

  ；担任

  Nature Energy

  等四十余个期刊或会议的审稿人。'
