bio_raw: '个人简介

  Personal Profile

  方哲梅，浙江义乌人，分别于2008年和2011年在华中科技大学控制科学与工程系（现人工智能与自动化学院）获得自动化学士学位和控制理论与控制工程硕士学位，并于2017年在美国普渡大学（Purdue
  University）航空航天学院获得博士学位。

  主持国家自然科学基金、JKW预研基金等国家级项目多项，曾参与来自美国防部系统工程研究中心（SERC），美国家航空航天局（NASA）与联邦航空局（FAA）等部门的多个项目。从事基于模型的系统工程（MBSE）、体系架构设计理论与方法、AI赋能系统工程（AI4SE）、系统工程赋能AI（SE4AI）等相关研究，已在国际知名期刊与会议上发表论文四十余篇。

  招收全日制工学硕士和工程硕士，欢迎勤奋、踏实、不浮躁，对系统工程及军事系统感兴趣的学生联系 (zmfang2018@hust.edu.cn)。'
