  个人简介

  个人基本情况

  余明晖，男，生于

  1971

  年

  5

  月，湖北省武汉市人，中共党员，现任华中科技大学自动化学院副教授。

  2001

  年毕业于华中科技大学系统工程专业，获得系统工程工学博士学位，

  2001

  年至

  2003

  在华中科技大学热能工程与工程热物理博士后流动站从事博士后研究工作。

  主要研究方向

  目前主要研究领域为决策支持系统、复杂工程系统以及物流系统。

  研究成果

  先后在学术期刊上发表文章十余篇，作为项目负责人和主要研究人员参与了多项大型纵向和横向科研项目的科研工作，其中“三峡工程散装水泥/粉煤灰调运指挥系统”及“数字轨道交通工程集成关键技术及应用”先后获得国家科技进步二等奖两项（2001、2006）、教育部科技进步一等奖（2000）和湖北省科技进步一等奖（2005）各一项。'
