bio_raw: '个人简介

  郑策，主要研究方向为计算机视觉与具身智能。 曾担任美国卡内基梅隆大学博士后。博士毕业于美国中佛罗里达大学计算机视觉中心(UCF-CRCV)，导师为Prof. Chen
  Chen。截止2026年4月，共计19篇论文发表于CVPR、ICCV、NeruIPS等国际顶级会议和期刊，谷歌学术引用超3500次，其中一作引用量超2500次。
  入选斯坦福大学和爱思唯尔发布的2025年度全球前2% 顶尖科学家榜单。担任NeurIPS 2025和ACM Multimedia 2025，2026领域主席（Area
  Chair）。个人学术主页：cezhenghust.cn

  查看更多>'
