bio_raw: '个人简介

  Personal Profile

  袁烨，华中科技大学人工智能与自动化学院教授、博士生导师，国家领军人才。2008年获上海交通大学学士学位，2009年与2012年分别获剑桥大学硕士、博士学位，其中2011年期间赴加州理工学院进行联合培养。2012年至2016年间，先后担任剑桥大学博士后、达尔文学院研究员（Fellow）及加州大学伯克利分校博士后。

  主要从事物理AI系统建模优化理论及其工程应用研究。主持国家基金委“青A”（原国家杰出青年）科学基金、重大研究计划（重点项目、集成项目课题）、科技部重点研发计划课题等国家级项目。以第一作者或通讯作者身份在
  National Science Review、Nature Machine Intelligence、Nature Communications、Journal
  of Machine Learning Research、IEEE Trans.、Automatica 等期刊发表论文50余篇，在 COLT、CDC、Neurips、ICML、IJCAI、ICRA
  等顶级会议发表论文40余篇；由剑桥大学出版社出版英文专著1部；获授权发明专利70余项，相关成果已在航空工业等领域实现转化。牵头荣获2022年湖北省自然科学奖一等奖、2020年华中科技大学重大学术进展、2020年IEEE信息物理系统技术委员会青年科学家提名奖等荣誉。其研究成果曾获《国家科学评论》、国际工业人工智能大会等十余个国际期刊与学术会议的最佳论文奖。

  指导学生两度斩获世界人工智能大会全球工业互联网算法大赛冠军，培养的多名优秀毕业生赴清华大学、剑桥大学、加州大学伯克利分校及本校深造，或前往华为、成飞等知名企业及高校工作。个人曾获评中国“新时代青年先锋”、华中科技大学“青年五四奖章”、“我最喜爱教师班主任”、“优秀教师班主任”等称号。

  现任（或曾任）中国自动化学会大数据专委会副主任委员，NSR、NSO、Engineering、《中国科学：技术科学》、IEEE Trans. on Control
  of Network Systems 等期刊的编委或青年编委，以及 IEEE Trans. on Mechatronics 工业智能方向专刊编辑。'
