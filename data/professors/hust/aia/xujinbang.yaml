bio_raw: '个人简介

  教授，博士研究生导师，华中科技大学人工智能与自动化学院自动控制系，系主任。2004.12，毕业于华中科技大学控制系，控制理论与控制工程专业，获得工学博士学位；2004.12-2006.12，于华中科技大学电子科学与工程系从事博士后研究；2007.12-2014.11，华中科技大学，副教授；2014.12，华中科技大学自动化学院教授、博士研究生导师。先后前往德国纽伦堡大学、日本上智大学等学术机构进行交流，长期从事电力电子装备、自动控制系统、数字化低碳以及智慧城市相关的研究。研究方向数字化平台建设、低碳相关技术、新一代电力电子技术，主要包括：
  研究方向一：新一代电力电子与运动控制系统的研究与开发 1、背景：低碳与清洁能源的开发...

  查看更多>'
