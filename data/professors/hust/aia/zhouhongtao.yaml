bio_raw: '周洪涛

  职称：

  副教授

  电话：

  027-87540210-805

  邮箱：

  zht730@qq.com

  研究方向：

  复杂社会经济系统建模与仿真、金融系统工程等

  个人简介

  个人简介

  1988

  —1992年，武汉科技大学，机械工程及自动化专业，获学士学位；

  1997

  —2000年，武汉科技大学，管理科学与工程专业，获硕士学位；

  2000

  —2004年，华中科技大学，系统工程，获博士学位；

  2004

  —2006年，华中科技大学，管理科学与工程博士后流动站，博士后。

  主要研究方向

  复杂社会经济系统建模与仿真、金融系统工程、决策理论与决策支持系统

  招生要求

  （专业需求和招生方向）

  专业需求：自动化，测控，管理科学与工程，信息管理与信息系统，物流管理与物流工程，计算机，数学等。

  招生方向：系统工程

  代表性成果及获奖情况

  （论文、科研或奖励情况）

  近年来，一直从事系统工程理论与方法的教学和科研工作，在复杂社会经济系统建模与仿真、金融系统工程、决策理论与决策支持系统等领域取得了一定成果，获国家自然科学基金面上项目和中国博士后科学基金资助，作为主要承担者参与了国家自然科学基金、国家科技支撑计划、中国国际战略学会、校自主创新研究基金等科研项目；同时主持和参与了省、市、企业等科研项目研究工作，包括国民经济动员信息系统、湖北储备物资管理局地理信息系统、黄冈融入武汉城市圈区域对接规划、武钢信息化发展战略、武汉市城市垃圾物流系统规划、三峡工程安全管理信息系统、国家储备粮库信息化系统、非传统安全系统等。

  近年来，在《International Journal of Advancement System Science and Applications》、《The
  international journal of systems & cybernetics》、《International Conference on Management
  Science and Engineering》、《系统管理学报》、《数学的实践与认识》、《系统工程》、《管理学报》和《华中科技大学学报（自然科学版）》等期刊和国内外会议上发表论文三十多篇。'
