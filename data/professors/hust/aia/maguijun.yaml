bio_raw: '个人简介

  Personal Profile

  华中科技大学人工智能与自动化学院，讲师。2017年获华中科技大学机械设计制造及其自动化学士学位，2023年获本校机械工程博士学位（导师：丁汉教授、袁烨教授），2021年至2022年赴英国伦敦大学布鲁内尔学院联合培养（导师：王子栋教授）。

  主要从事工业AI、机器人化智能制造交叉研究，主持国家自然科学基金青年项目等课题。在

  National Science Review

  、

  National Science Open

  、

  Energy & Environmental Science

  等期刊发表论文多篇。成果荣获湖北省自然科学一等奖（排3）、

  National Science Review

  最佳论文奖，以及两届ICACAI最佳论文奖等。

  协助指导课题组多名博士生、硕士生获得国家奖学金及国内外算法竞赛冠军。'
