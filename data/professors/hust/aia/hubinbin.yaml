bio_raw: '个人简介

  Personal Profile

  个人简历

  胡斌斌，男，1995年生，浙江临海人。现任华中科技大学教授，博士生导师，入选国家级海外高层次（青年）人才。2022年获华中科技大学博士学位。2022年至2026年，先后在新加坡南洋理工大学、荷兰格罗宁根大学等单位从事博士后科研工作。

  围绕自主智能与集群机器人方向研究，主持国基金人才项目，国重实验室开放课题等，先后参与承担国基金联合重点项目，德国舍弗勒—NTU联合项目、阿联酋—NTU联合项目以及荷兰NWO国家发展基金等重大科研项目。以第一作者出版Springer英文专著1部。近五年发表SCI期刊论文二十余篇，其中第一作者论文12篇，包括2篇IEEE
  Transactions on Robotics (IEEE TRO)、3篇Automatica长文、1篇IEEE TAC论文等；合作发表IEEE Control
  Systems Magazine封面文章和National Science Review观点文章，并在ICRA、IROS、CDC等机器人与控制领域国际会议发表多篇论文。授权发明专利6项。

  曾获中国自动化学会优秀博士学位论文奖、IEEE MRS Young Pioneer、日内瓦国际发明展金奖、Asian Journal of Control杰出审稿人奖、Unmanned
  Systems期刊Editor Highlights等荣誉。

  现任ICRA2027机器人会议副编辑，并担任IEEE Transactions on Consumer Electronics、Unmanned Systems等多个期刊客座编委；同时担任IEEE
  TRO、IJRR、IEEE TAC、Automatica、ICRA、IROS、CDC等机器人与控制领域重要期刊和会议审稿人。

  研究领域

  集群机器人系统（含无人艇、无人机、以及子母无人系统等）、导航规划与控制、集群具身智能、自动驾驶与智能交通

  每年招收博士1-2名、硕士生3名（

  27年已满，欢迎28年入学提前联系

  ）。欢迎（自动化、机器人、机械、计算机、电子信息、人工智能、航空航天）等相关专业背景，具有科研热情、人品端正、勤奋踏实、编程与数理扎实的同学申请加入。同时招生本科生加入课题组开展科研实习，在学有余力的同时，发表高水平论文或完成毕业设计。（详细情况请附带简历发邮件至binbinhu@hust.edu.cn）

  博士后：招收机器人、控制等方向加入，欢迎发邮件询问，待遇从优，常年有效。

