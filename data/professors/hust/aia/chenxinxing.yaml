bio_raw: '个人简介

  （2027年秋季入学的保研名额已满，套磁邮件将不再回复）测控技术“一带一路”联合实验室主任助理，“类脑智能系统”湖北省重点实验室骨干教师。入选中国仪器仪表学会青年科技人才培育计划、湖北省青年科技人才晨光托举工程、深圳市“鹏城孔雀”人才计划、小米青年学者。担任广东省康复医学会智能康复技术与转化分会理事、中国指挥与控制学会虚拟现实与人机交互专业委员会委员、深圳市科技创新局科技评审专家、中国智能机器人大会评奖主席、IEEE
  T-ASE期刊副编、IEEE ARM、IEEE CDL、IEEE CBS等国际学术会议编委等。长期从事人机环交互中的多模态感知与决策相关研究，已在Pattern
