bio_raw: '姜军

  职称：

  讲师

  电话：

  027-87543576

  邮箱：

  junjiang@mail.hust.edu.cn

  研究方向：

  机器学习及其在图像检索和处理中的应用、生物特征识别

  个人简介

  个人基本情况

  于华中科技大学智能获模式识别与智能系统专业硕士学位（指导导师为国内知名红外专家张桂林教授），

  10

  年于香港城市大学计算机系获哲学博士学位（指导导师为

  IAPR

  创建院士叶豪盛讲座教授）。

  00

  年留校任教至今。曾在各类期刊杂志发表文章

  10

  余篇，单篇文章最高索引率为

  25

  （

  Google

  学术搜索）。研究经历主要分为两部分：读博之前，在人脸识别

  /

  检测、图像跟踪等领域做了一些工作，主要关注点为图像处理和特征提取部分，也就是如何“提取模式”；读博之后，主要兴趣转为机器学习及其在图像处理中的应用，也就是如何“识别模式”。合起来，整个研究经历就是“模式识别”。

  主要研究方向

  （1）机器学习及其在图像检索和处理中的应用

  （2）生物特征识别

  研究成果

  在实验室为智能控制研究室从1984年起就进行自动目标识别和成像跟踪技术方面的理论和应用研究，同时也在人脸生物特征识别、车牌识别等领域进行研究。参与的人脸生物特征识别项目分别获湖北省科技进步三等奖和武汉市科技进步二等奖。本人的主要研究项目如下：

  （1）02~03年，部级项目，“红外/电视图像跟踪系统研制”，第二主持人；

  （2）03~05年，湖北省自然科学基金项目，“实时自动人脸图像检测的理论和应用研究”，第一主持人；

  （3）11~12年，校自主创新基金项目，“主动学习中的小样本分析及应用”，第一主持人；

  （4）12~13年，横向项目，“便携式激光扫描投影仪的开发与研制”，第一主持人。

  招生要求

  专业要求：数学，计算机，信号处理等；

  招生方向：模式识别与智能系统。'
