bio_raw: '个人简介

  Personal Profile

  个人介绍

  华中科技大学人工智能与自动化学院副教授、博士生导师，入选

  中国科协和武汉市青年人才项目

  。于

  2012年在天津大学获测控技术与仪器学士学位，2013和2018年在英国伦敦帝国理工控制系统系获硕士和博士学位（导师为控制系统系Simos Evangelou与机械工程学院英国皇家工程院院士Daniele
  Dini教授）。

  主持国家自然科学基金面上项目、青年基金、湖北省面上项目、国家重点实验室开放基金、教育部重点实验室开放基金等项目，参与国家自然科学基金重大研究计划（重点支持项目）、科技部重点研发计划课题等项目，成果获2022年湖北省自然科学一等奖（排2）、

  2022年WAIC世界人工智能大会青年优秀论文提名奖等

  奖励。在柳叶刀子刊（The Lancet Digital Health)、NEJM AI、IEEE/ASME Transactions on Mechatr

  onics、

  IEEE Transactions on Instrumentation and Measurement、

  IEEE Transactions on Industrial Informatics

  等期刊发表第一/通讯作者论文，ESI高被引论文3篇，Google Scholar引用3600余次。

  研究方向

  信息物理系统建模、演化分析与优化方法及其在智能制造

  中的应用研究；

  机器人化智能制造中的灵巧操作研究

  。'
