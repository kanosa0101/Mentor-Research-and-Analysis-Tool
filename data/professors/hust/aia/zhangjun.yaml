  个人简介

  个人简介

  1966

  年出生.工学博士,华中科技大学自动化学院副教授,硕士生导师,博士生副导师.研究方向为机器学习、机器视觉、图像处理等. 发表论文56篇,其中SCI收录12篇, EI收录24篇.
  参与国家级项目9项、省部级项目2项，主持横向项目5项.

  教育经历

  1982—1986

  年，上海交通大学，应用数学专业，获学士学位；

  1996—1999

  年

  ，

  华中科技大学

  ，通信与信息系统专业，获硕士学位；

  2000—2006

  年

  ，

  华中科技大学

  ，模式识别与智能系统专业，获博士学位。

  工作经历

  1986—1997

  年， 武汉理工大学（原武汉汽车工业大学），基础课部数学教研室，助教、讲师，从事工科数学的教学工作；

  1997—2013

  年

  ，

  华中科技大学

  ，图像识别与人工智能研究所，讲师、副教授，从事机器视觉、机器学习、数据挖掘、优化方法等方面的科研与教学工作；

  2007—2011

  年

  ，

  华中科技大学

  ，生命科学学院生物医学工程博士后流动站，博士后，从事生物信号处理方面的科研工作；

  2008—2009

  年

  ，澳大利亚Charles Sturt University, 数学与计算机学院，Visiting Academic, 从事机器学习方面的科研工作；

  2013—

  今

  ，

  华中科技大学

  ，自动化学院，副教授，从事机器视觉、机器学习、信息检索等方面的科研与教学工作。

  主要研究方向

  机器视觉、机器学习、信息检索、数据挖掘

