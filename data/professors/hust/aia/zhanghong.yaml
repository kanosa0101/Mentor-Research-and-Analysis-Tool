title: 讲师
bio_raw: '张洪

  职称：

  讲师

  研究方向：

  飞机结冰防护技术、多相流检测技术和智能检测技术等

  个人简介

  个人简介

  1973年12月出生，华中科技大学自动化学院讲师。

  1997年本科毕业于华中理工大学检测技术与仪表专业，2001年硕士毕业于华中科技大学控制系测控所。在国内外发表学术论文十几篇，参编专著1本（排名第2），拥有多项国家专利。

  长期从事测控技术与系统相关领域研究，近年着重于飞机结冰防护技术，特别是飞机结冰探测技术方面的研究，曾于2008年6月~12月参加中国商用飞机大型客机联合工程队工作，参加了我国大型客机研发的方案论证工作，并与相关研究单位保持良好合作关系。

  主要研究方向

  飞机结冰防护技术、多相流检测技术和智能检测技术等相关理论与装置研究

  代表性成果及获奖情况

  多年来长期从事相关领域科研工作，曾参与国基金项目两项（编号分别为：69974019，10577008）以及多项结冰探测技术方面的大型项目，其中作为第一负责人主持的项目有：

  1、大型客机结冰探测技术方案研究；

  2、SLD结冰探测技术研究；

  3、防冰系统试验器（结冰风洞）结冰探测系统；

  4、大型民用客机飞机结冰探测系统方案研究；

  5、井下高温压力计研制。

  相关成果除发表了相关论文和获得专利外，部分成果已成功实现市场化，比如“井下高温压力计”和“舰船用温度巡检仪”已成为企业获利来源。'
