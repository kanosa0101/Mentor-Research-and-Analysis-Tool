  个人简介

  个人简介

  刘雪明，国家自然科学基金委优秀青年科学基金项目获得者。2010年华中科技大学自动化专业学士，2016年华中科技大学控制科学与工程博士，2014年至2016年访问美国波士顿大学，2019年访问哈佛医学院、美国布莱根妇女医院。

  华中科技大学人工智能与自动化学院教授、博士生导师、硕士生导师。

  从事网络科学、

  计算生物信息学及人工智能在生物系统中的应用研究，代表性工作包括多层生物分子网络构建与鲁棒性分析算法开发、多层网络鲁棒性分析、网络可控性分析、及这些方法在生物分子网络中的应用研究等。相关研究成果以第一或通讯发表在Nature
  Communications、PNAS、Physics Reports、Engineering、BMC Systems Biology、Physical Review
  E和TCBB等期刊上。获2022年湖北省自然科学一等奖，2018年中国ACM SIGBIO分会学术新星奖，2020年华中科技大学教师教学竞赛一等奖，2020年湖北省优秀学士学位论文指导教师等奖励。

  本课题组长期招聘博后、长期招收博士与硕士研究生，专业方向不限（人工智能、自动化和计算机方向优先），具有扎实的数学、英语与编程基础，欢迎联系xm_liu@hust.edu.cn'
