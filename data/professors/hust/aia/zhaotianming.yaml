bio_raw: '个人简介

  华中科技大学多谱信息智能处理技术全国重点实验室助理研究员，研究方向为三维视觉感知、多谱成像探测，以一作/通讯在TVCG/TGRS/PR等国际高水平期刊发表论文数篇，主持国基金青年项目、博士后特别资助项目、科研院所横向课题等，指导研究生获2025年“挑战杯”竞赛“揭榜挂帅”专项赛擂主。

