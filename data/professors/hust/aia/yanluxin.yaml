bio_raw: '个人简介

  Personal profile

  颜露新，教授、博士生导师，长期从事多谱成像处理与目标识别研究，现任华中科技大学多谱信息处理技术国家级重点实验室副主任，人工智能与自动化学院飞行器导航制导系主任，中国图象图形学会成像探测与感知专委会、中国电机工程学会电力机器人专委会委员，《数字海洋与水下攻防》期刊编委。研究方向主要包括多谱图像处理、目标检测与识别、嵌入式实时图像处理系统等，主持国家自然科学基金、总装预研基金、国家重大专项子题以及...

  More+'
