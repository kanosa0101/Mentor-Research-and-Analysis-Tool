  2013

  —

  现在， 华中科技大学，自动化学院飞行器导航制导系教师

  。

  主要研究方向

  图像处理与分析、成像目标检测，识别与跟踪、多DSP信息并行处理

  招生要求

  （专业需求和招生方向）

  专业需求：自动化，计算机，电信等

  招生方向：飞行器导航制导

  代表性成果及获奖情况

  （论文、科研或奖励情况）

  主要从事成像目标检测、识别与跟踪等方面的科研工作。承担了某中心“****目标自动识别算法研究”，“**图像处理系统研制”，某院“****处理板/压缩板研制”等项目。参与并完成了国家自然科学基金重点项目"复杂条件下目标自动识别的理论与关键技术"研究。目前承担的主要研究有“校自主创新基金”一项、航天支撑基金一项、“*****数据信息应用”“红外场景图像质量评价”等项目。获得专利授权和软件著作权各一项。教育部科技进步一等奖一项、工信部科学技术二等奖两项。

  主要发表文章有：

  [1] Li Yun, Sheng zhong. ”Stable imaging tracking method based on learning online
  for ground moving target with multi-DSP processing”, Proceedings of SPIE, vol.8003,
  p800314(7pp.),2011

  [2] 黎云，张天序. 红外成像大气作用效果模拟. 华中科技大学学报(自然科学版). 2002, 30(2): 78-80.

  [3] Li Yun, Zhang Tianxu. A precise tracking algorithm for small target based on
  feature identification. “International Conference on Computer Graphics And Spatial
  Information System”2002， Aug.6-8,2002,Beijing,China ，PP.526-533.

  [4] Li Yun, Tianxu Zhang “Adaptive tracking method for ground target of FLIR imaging”Proceedings
  of SPIE,vol.7495, p74951A(7pp.),2009.

  [5] Li Yun, Zhang Tianxu.“A precise Tracking Algorithm for Small Target based on
  Event Supervision”Proceedings of SPIE, vol. 6786, 67863u-1~67863u-6,2007.'
