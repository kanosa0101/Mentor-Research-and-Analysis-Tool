bio_raw: '个人简介

  Personal profile

  曹治国，现为华中科技大学人工智能与自动化学院教授、博士生导师、中国自动化学会高级会员、湖北省人工智能学会副理事长。研究方向是计算机视觉，近年来的研究兴趣包括单张图像及单目视频深度预测、图像配准与三维场景重建、神经辐射场及新视图生成、计算摄影与计算美学如焦外散景渲染、智能构图等。研究成果发表在IEEE
  TPAMI/TIP/TNNLS/TGRS/TMM/TCSVT/TASE/TIFS/T-Cybernetics、IJCV、Information Fusion、PR以及CVPR、ICCV、...

  More+'
institutes: []
research_direction_raw: 图像理解与分析、平面图像与视频的深度信息估计与提取、运动检测与行为分析等
