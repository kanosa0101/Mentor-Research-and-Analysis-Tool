bio_raw: '个人简介

  Personal Profile

  盛银，男，华中科技大学人工智能

  与自

  动化学院副教授、博士生导师、硕士生导师。

  2018

  年毕业于华中科技大学人工智能与自动化学院，获博士学位，导师是

  曾志刚

  教授

  (

  院长、国家杰青、长江特聘教授、

  IEEE Fellow)

  ；

  2018

  年

  7

  月至

  2020

  年

  10

  月在华中科技大学从事博士后研究，合作导师是

  缪向水

  教授

  (

  长江特聘教授

  )

  ；

  2018

  年

  12

  月至

  2019

  年

  11

  月赴美国德州农工大学卡塔尔分校进行访问研究，合作导师是

  黄廷文

  教授

  (IEEE Fellow

  、欧洲科学与艺术院院士、国际系统与控制科学院院士

  )

  ；

  2020

  年

  11

  月入职华中科技大学人工智能与自动化学院。

  研究方向包括自主无人系统、强化学习、智能控制等，发表

  SCI

  期刊论文

  40

  余篇，其中

  IEEE

  汇刊论文

  20

  余篇，先后主持国家自然科学基金面上项目

  2

  项、国家自然科学基金青年项目、中国博士后科学基金第

  64

  批面上一等，获中国人工智能学会优秀博士学位论文提名奖和亚太神经网络学会青年学者奖，入选国家博士后创新人才支持计划和湖北省楚天学者计划，担任

  IEEE Transactions on Systems, Man, and Cybernetics: Systems(

  一区

  )

  、

  Neural Networks(

  一区

  )

  、

  Cognitive Computation

  等期刊编委

  (Associate Editor)

  。参与科技创新

  2030

  重大项目、国家自然科学基金集成项目、国家自然科学基金重点项目等。

  欢迎谦虚诚恳、思想上进、勤奋踏实的学生报考博士硕士研究生！

  (

  Email: shengyin2020@hust.edu.cn

  )'
