bio_raw: '个人简介

  Personal Profile

  李远征，教授，国家优秀青年基金获得者，博士生导师

  , IEEE高级会员。主要研究领域为人工智能赋能的智能电网与能源互联网，以第一/通讯作者在《自然》子刊Nature Reviews Electrical Engineering、国际工程领域权威刊物Proceedings
  of the IEEE（创刊114年），以及IEEE Transactions 等期刊发表论文40余篇，11篇论文荣获期刊特色/ESI热点/高被引论文。出版学术专著4部，主持了国家自然科学基金优青、面上、青年项目，国家重点研发子课题，湖北省重点研发计划等，参与了国基金重点，973计划等具有一定影响力的科研课题。担任IEEE
  Transactions和IET等5个权威国内外刊物的编委，中国控制与决策大会（CCDC)分会—人工智能赋能的智能电网与能源互联网共同主席，以第一完成人获天津市科技进步二等奖、腾讯优秀专利项目奖。

  研究方向：

  基于深度学习的大数据分析、优化及预测；人工智能及其在

  电力和能源系统中的应用；

  系统风险辨识与管控；智能电网/微电网优化与运行；

  代表论著：

  (1)

  Y. Z. Li

  , Y. Z. Ding, S. Y. He, F. Hu, J. T. Duan,

  et al

  , Artificial Intelligence-based Methods for  Renewable Power System Operation,

  Nature Reviews Electrical Engineering

  , 2024, 1: 163-179.

  (2)

  Y. Z. Li,

  C. F. Yu, M. Shahidehpour, T. Yang, Z. G. Zeng, T. Y. Chai, Deep Reinforcement  Learning
  for Smart Grid Operations: Algorithms, Applications, and Prospects.

  Proceedings of the IEEE

  , 2023, 111(9):1055-1096.

  (Selected as a Feature Paper)

  (3)

  Y. Z. Li

  , Y. Ding, Y. Liu, T. Yang, P. Wang, J. Wang, W. Yao, Dense Skip Attention based
  Deep Learning for Day-Ahead Electricity Price Forecasting,

  IEEE Transactions on Power Systems

  ,  2023, 38(5): 4308-4327.

  (ESI hot paper and ESI highly cited paper)

  (4) X. Yang

  ,

  Y. Z. Li

  *,

  Zhao Y, et al. Gaussian Mixture Model Uncertainty Modeling for Power Systems Considering
  Mutual Assistance of Latent Variables[J]. IEEE Transactions on Sustainable Energy,
  2024,

  DOI

  : 10.1109/TSTE.2024.3356259.

  (5)

  X. Yang

  ,

  Y. Z. Li

  *,

  Zhao Y, et al. Hierarchical Uncertainty Characterization of Monthly Net Load in
  Renewable Power Systems. IEEE Transactions on Automation Science and Engineering,
  2024.

  研究生招生：

  招收全日制工学硕士(保研/考研)和工程硕士，欢迎勤奋踏实、持之以恒、有上进心的学生联系(Yuanzheng_Li@hust.edu.cn)。'
