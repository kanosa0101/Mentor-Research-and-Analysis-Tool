bio_raw: '个人简介

  刘桐君，华中科技大学人工智能与自动化学院教授，入选国家级青年人才项目、湖北省“百人计划”。聚焦于智能光学精密测量与超分辨成像、微纳光机电传感器、感存算一体器件的研究。以唯一第一作者在
  Nature Materials、Nature Physics、Science Advances 等顶刊发表论文。在研方向：1. 极微观（近原子）尺度智能光学精密测量与光学超分辨成像2.
  面向智能感知的微纳光机电及量子传感器件3. 类脑神经形态感存算芯片能为学生提供什么：1. 前沿科研课题：覆盖皮米光子学、智能光学精密测量与感知器件等方向，对接英国南安普顿大学、美国耶鲁大学等国际顶尖团队，支持高水平论文、专利、竞赛及成果转化。2.
  完整科研训练：从文献阅读、方案设计、实验...

  查看更多>'
