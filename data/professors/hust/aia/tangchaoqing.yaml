bio_raw: '个人简介

  Personal profile

  本科毕业后在全额奖学金的资助下到英国Newcastle University(QS120-150)攻读博士学位，期间曾到剑桥大学交流学习，三年完成博士课题后拿到剑桥大学、帝国理工和牛津大学的博后offer。牛津大学博后结束后回国到华为2012实验室工作，负责产线生产质量前沿检测技术研发。于2020.12月加入华中科技大学。现研究方向为智能感知、深度学习、机器视觉和计算成像等，理论研究与实践并重，主要应用于无损检测/监测、模式识别及医疗图像处...

  More+'
