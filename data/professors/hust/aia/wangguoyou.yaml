  个人简介

  个人基本情况

  1984年--1988年华中理工大学电子与信息工程系本科学习，获无线电技术专业学士学位

  1988年--1989年华中理工大学光学系光纤教研室工作

  1989年--1992年华中理工大学图像所攻读硕士学位，获模式识别和智能系统硕士学位

  1992年毕业后留校任教至今，

  1997年破格晋升为副教授。

  1999年破格晋升为教授。

  现为华中科技大学图像识别与人工智能研究教授，中国图像图形学会、湖北省计算机学会与湖北省宇航学会理事、国际SPIE和IEEE学会会员。

  主要研究方向

  主要研究成像精确制导、数字图像压缩、医学影像分析、生物特征识别、车牌识别、工业检测、综合测试和综合控制等应用领域涉及的算法仿真、系统体系结构以及应用系统优化与设计技术。具体研究方向包括：

  1

  ）模式识别技术

  研究内容是针对匹配制导、医学图象分析、指纹识别、人脸识别、车牌识别、工业监测和领域的应用要求，研究人类目标识别的视觉计算机理和人脑思维模型，研究和开发目标特征提取、建模与识别方法理论与计算算法，建立基于人类视觉计算机理的仿真模型，实现自动目标识别。

  2

  ）数据压缩技术

  研究内容是针对多媒体通信、多媒体娱乐、交通监测以及成像侦察领域的传输和存储应用要求，研究数据压缩的质量评价模型、计算算法，实现高倍率、高保真的数据压缩。

  3

  ）通信总线技术

  研究内容是针对综合测试、综合控制以及无线通信等领域的应用要求，研究VXI总线、MXI总线、1394总线、USB总线、以太网、1553b总线以及CAN总线等总线协议标准、软硬件的实现结构优化和设计，为数据传输应用系统提供中间件软硬件。

  4

  ）软件实现技术

  研究内容包括针对成像精确制导、数字图像压缩、医学影像分析、生物特征识别、车牌识别、工业检测、综合测试和综合控制等应用，研究和开发仿真试验算法、应用软件、Linux操作系统软件以及设备驱动程序等软件设计和计算与数据结构优化技术

  5

  ）硬件实现技术

  研究内容包括针对成像精确制导、数字图像压缩、医学影像分析、生物特征识别、车牌识别、工业检测、综合测试和综合控制等应用，研究和开发ARM、Intel、ADI以及TI等公司DSP实时处理系统、专用处理芯片、总线接口和总线桥路等电路设计和优化技术。

  研究成果

  八五、九五和十五以来，先后

  完成了

  “

  基于序贯显著性计算的多特征融合目标识别方法”、“图像高保真快速旋转稳像技术”、

  “

  图像特征提取与识别的稳定性理论与自主智能算子研究”、“复杂条件下目标自动识别的理论与关键技术

  ”、

  “基于感知清晰度的低比特率遥感数据压缩方法研究

  ”、

  “遥感景象内容自适应分组高保真压缩快速算法及其实现”、“可见光遥感数据压缩技术”、“VXI综合测试技术”、“多媒体编解码技术”和“全自动全血细胞分析技术”等国家和省部级科研项目50余项。'
