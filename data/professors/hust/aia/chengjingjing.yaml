bio_raw: '个人简介

  Personal profile

  程晶晶，博士，副研究员。在华中理工大学自动控制工程系获学士学位，在华中科技大学控制科学与工程系获硕士学位，在华中科技大学控制科学与工程系获博士学位，在日本神户大学系统信息学科开展了博士后研究工作（JSPS
  Fellow），现为华中科技大学人工智能与自动化学院副研究员。主要从事计算光学成像和高温微系统技术方面的研究。主持湖北省自然科学基金和教育部博士点青年教师基金各一项,主持和参与十余项中海油田服务股份有限...

  More+'
