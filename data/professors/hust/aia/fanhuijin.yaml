bio_raw: '个人简介

  Personal Profile

  樊慧津

  人工智能与自动化学院、多谱

  信息

  智能处理技术全国重点实验室教授，博士生导师，校教学名师。

  研究兴趣：多智能体

  协同控制与编队、飞行控制系统等

  。

  主持多个国家自然科学基金项目，在国内外权威期刊和会议上发表学

  术论文100余

  篇，

  部分成果发表在Automatic、TAC和IEEE Transactions等期刊上。担任IEEE工业电子学会行业女科学家论坛主席及CCC和CCDC的程序委员会委员。获2018年中国指挥与控制学会科学技术一等奖和2023年度IEEE工业电子学会最佳会议论文奖。

  国家级一流本科课程《自动控制原理》责任教授；

  国家在线精品课程《自动控制原理（二）》负责人。

  中国自动化学会信息物理系统控制与决策专委会、数据驱动控制、学习与优化专委会委员；

  湖北省自动化学会理事。

  湖北省回国科技人员创业促进会第一届会员，湖北省知识分子联谊会第四届会员，华中科技大学留学人员联谊会理事，校侨联委员。'
