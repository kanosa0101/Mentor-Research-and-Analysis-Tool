bio_raw: '个人简介

  Personal Profile

  主要从事航空航天领域的科学研究工作，具体研究方向为飞行器控制、制导和轨迹优化，协同控制与决策，无人机飞行控制等。

  科学研究工作：

  主持承担国家自然科学基金、教育部博士点基金、湖北省重点研发计划、湖北省自然科学基金等民口科研课题；主持承担基础加强计划重点基础研究项目，装备基础研究项目群，973项目，相关专项工程项目及预研项目等纵向科研课题；主持承担航天一院、航天三院、三江航天等多项科研合作项目，为现代空天飞行控制技术提供最新的解决方案。在航空航天及控制领域Top期刊Chinese
  J of Aeronautics，Automatica，IEEE T AES，IEEE T SMC，IEEE T CST，JFI等，发表论文30余篇，授权发明专利7项。

  教育教学工作：

  长期承担本专业的核心课程《自动控制原理II》和本领域专业课程《飞行器制导控制基础》的教学工作；获得华中科技大学2021～2022学年度教学质量优秀奖二等奖，担任MOOC课程《自动控制原理（二）》主讲教师，该课程获批2019年国家精品在线开放课程；主持建设“运载火箭控制系统设计虚拟仿真实验”平台，获批湖北高校一流本科虚拟仿真实验教学课程；主持湖北省教学研究专项项目；指导本科生获“西门子杯”中国智能制造挑战赛ITEM4工程创新赛项全国总决赛二等奖；获华中科技大学“大学生创新创业活动优秀指导教师”称号。

  社会公益工作：

  担任飞导系党支部书记，院纪委委员，承担纪委监察、支部党建、院系招生等多项公共服务工作。担任湖北省自动化学会秘书长，支持和服务我省自动化领域高校、企业和科研院所的学术交流、学科建设、专业竞赛和技术合作等工作。'
