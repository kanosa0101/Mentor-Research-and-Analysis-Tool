  张海涛，华中科技大学人工智能与自动化学院副院长、二级教授、博导、享受国务院特殊津贴专家、国家杰青。华中学者首席教授、自主智能无人系统教育部工程研究中心主任、国家科技创新2030新一代人工智能重大项目首席科学家。2005年在中科大获得博士学位，2007年在剑桥从事博士后研究，
  2010年晋升为教授，博导。从事群体智能、无人艇集群协同等领域研究。发表Nature Machine Intelligence、Nature Communications、National
  Science Review、Automatica和IEEE汇刊100余篇。理论成果被Nature Physics研究亮点报道，应用成果在中船重工、广船国际等转化，支撑大湾区跨海通道、海上风电场等国家重大海洋工程建设和南海油气资源勘测，被国务院官网和国防部官网报道。排名第一获湖北省自然科学一等奖2项和广东省技术发明一等奖1项。担任/曾任IEEE
  Trans. SMC-Systems, IEEE Trans. CASII，Engineering等国际期刊编委。

