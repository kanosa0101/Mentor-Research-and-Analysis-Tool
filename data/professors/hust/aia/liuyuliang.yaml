bio_raw: '个人简介

  Personal Profile

  华中科技大学人工智能与自动化学院教授，博导，华中科技大学人工智能研究院双聘教师，所在团队VLRLab实验室（白翔教授领衔），入选国家高层次人才特殊支持计划青年拔尖人才,
  IEEE Senior Member，中国图象图形学学会文档分析与识别专委会副秘书长。主持国家自然科学基金面上/青年，企业/区域联合重点子课题，国家重点研发计划子课题等项目，曾获湖北省技术发明一等奖（排2）。研究方向围绕大模型、文本图像智能开展，围绕解析，理解，推理，生成，安全及文档+科学开展相关工作。

  教学指导：

  获中国大学生“互联网+”创新大赛高教主/产业/红旅赛道全国金奖

  获挑战杯全国特等奖、挑战杯揭榜挂帅专项赛全国擂主

  本科生一作发表CCF A类会议ACL 2024最佳论文奖

  入选华中科技大学五四青年、我最喜爱的教师班主任

  进组（

  来信附带个人简历)

  ：

  组内要求严格，论文/纪律/实习严控，毕业要求身体素质过关（跑步测试）

  若对研究有追求，鼓励学硕

  若目标是去大厂工作，鼓励专硕

  攻读博士至少在组内待满两年，导师推荐制

  欢迎本科生进组学习，实验室iPad团队提供相关支持

