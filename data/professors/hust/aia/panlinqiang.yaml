bio_raw: '个人简介

  Personal profile

  潘林强，2000年毕业于南京大学，获理学博士学位；2000年至2002年在华中科技大学控制理论与工程博士后流动站从事博士后研究，出站后留校任教；2002年晋升为副教授，2004年晋升为教授，同年被评为博士生导师。2020年入选国家百千万人才工程，2021年入选国家万人计划科技创新领军人才。现为华中科技大学自动化学院副院长、华中学者特聘教授，兼任湖北省运筹学学会理事长。
  主要从事生物计算及其相关的纳米技术和人工智能研究和教学...

  More+'
