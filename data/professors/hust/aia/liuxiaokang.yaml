bio_raw: '个人简介

  Personal Profile

  个人简介：

  刘骁康，华中科技大学人工智能与自动化学院副教授、博士生导师，

  2019

  年获得控制科学与工程专业博士学位，从事新能源微电网协同控制与优化方向。一作/通讯

  发表

  Automatica

  和

  IEEE

  汇刊26篇

  ，授权国家发明专利22

  项

  。主持国家自然科学基金面上项目和

  青年项目、湖北省自然科学基金青年项目、教育部高等学校自动化类专业教学指导委员会专业教育教学改革研究课题，入选武汉英才、中国科协青年人才托举工程。

  教育经历：

  2014.09 - 2019.06

  华中科技大学 人工智能与自动化学院 博士

  2010.09 - 2014.06

  华中科技大学 自动化学院 本科

  主要经历:

  2024.02

  - 至今  华中科技大学 人工智能与自动化学院 副教授

  2021.03 - 2024.01

  华中科技大学

  人工智能与自动化学院

  讲师

  2019.10 - 2021.02

  新加坡南洋理工大学 电气与电子工程系

  Research Fellow

  2019.06 - 2019.09

  中科院数学与系统科学研究所 访问学者

  2018.11 - 2019.02

  新加坡南洋理工大学 能源研究院(

  ERI@N

  )

  Visiting Scholar

  2017.07 - 2018.08

  美国罗德岛大学 电气工程系

  Visiting Scholar

  中文主页

  教学授课:

  本科生：《自动控制原理（一）》、《智能芯片设计》、《自主智能系统》

  研究生：《自适应与学习系统》、《学术规范与论文写作》

  研究方向:

  智能电网的控制与优化；分布式协同与群集智能

  团队招生：

  响应

  国家“双碳”战略需求，团队围绕

  新型电力系统的大数据分析、协同控制、优化运行、韧性恢复等内容开展研究。

  团队每年招收硕士研究生、博士研究生若干名，欢迎感兴趣的同学随时咨询联系。'
