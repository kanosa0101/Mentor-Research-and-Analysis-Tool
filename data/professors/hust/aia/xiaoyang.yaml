bio_raw: '个人简介

  Personal profile

  本人现为华中科技大学人工智能与自动化学院教授（博导），从事与计算机视觉、机器学习与模式识别相关的教学与科研工作。招生信息：专业方向不限（人工智能、电信和计算机方向优先），需对计算机视觉与机器学习的相关研究有热情，具有扎实的数学、英语与编程基础；近期计划招收从事多模态大语言模型研究的本科实习生1-2名，欢迎报名联系（Yang_Xiao@hust.edu.cn）。学习经历：2007-2011年，华中科技大学，图像识别与人工智能研究...

  More+'
