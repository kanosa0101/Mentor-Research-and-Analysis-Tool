bio_raw: '个人简介

  张朴，博士，副教授。主要从事传感技术、测控系统及信号处理方向科研与教学工作。主持了近10项有关激光焊接焊熔池温度场测量、焊接过程监测，及石油测井仪研制相关项目。发表论文30余篇，获授权发明专利10项，获湖北省科学技术奖（技术发明）一等奖（排名第二）1项，省优秀硕士学位论文指导奖1项。

  查看更多>'
