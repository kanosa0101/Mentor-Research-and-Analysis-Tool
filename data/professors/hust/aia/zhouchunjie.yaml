bio_raw: '个人简介

  Personal profile

  周纯杰，华中科技大学二级教授，博士生导师，享受国务院政府特殊津贴专家，教育部高等教育自动化类专业教学指导委员会委员，华中卓越学者特聘教授，宝钢优秀教师奖获得者。中国自动化学会技术过程的故障诊断与安全性专业委员会副主任委员，中国自动化学会人工智能技术及工业应用专业委员会副主任委员，武汉市自动化学会理事长。
  长期从事工业互联网技术和工业信息物理系统安全的研究，研究方向包括工业通信网络及工业互联网技...

  More+'
