  个人简介

  个人简介

  王博，男，华中科技大学副研究员，省部级人才；

  博士毕业于清华大学精密仪器系（2023），主要从事计算机视觉、医学影像及手术光流导航领域研究工作，已在国际权威期刊及学术会议上发表学术论文10余篇，授权发明专利20余项，成果入选ESI热点论文与ESI高被引论文。主要成果包括：面向颅脑、胸外、肝胆、泌尿与骨科临床场景的人工智能手术规划系统、图像引导手术导航系统。

  请访问我的个人主页：

  https://www.labxing.com/-wangbo

  。'
