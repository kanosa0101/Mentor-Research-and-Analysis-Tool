bio_raw: '个人简介

  Personal Profile

  个人简历

  ：王苗苗，教授， 博士生导师，国家级青年人才，IEEE Senior Member。2013年获得华中科技大学学士学位，2015年获得加拿大湖首大学（Lakehead
  University）硕士学位，2020年获得加拿大西安大略大学（The University of Western Ontario）博士学位，2020年至2024年期间先后在加拿大西安大略大学和加拿大湖首大学从事博士后研究工作。长期从事自主无人系统感知、优化、控制以及无人机集群相关领域的研究，近年来发表30余篇学术期刊和会议论文，其中在控制领域

  国际顶尖期刊

  Automatica 和 IEEE Transactions on Automatic Control（IEEE TAC）发表第一作者论文7篇（长文5篇），以及在IEEE
  CDC，ACC等国内外顶尖会议发表论文10余篇。担任IEEE CSS 会议编委，中国自动化学会青年工作委员会委员，Journal of Marine Scienceand
  Application青年编委。

  个人英文主页：

  https://miaomiaowang101.github.io

  .

  研究方向

  ：

  无人系统状态估计、SLAM和导航控制

  ，

  无人机集群协同控制，

  人工智能驱动的

  无人系统

  招生信息

  ：团队常年招收对以上研究方向感兴趣的优秀硕士、博士研究生、博士后。详细情况请发邮件至mmwang@hust.edu.cn。

  部分代表性论文：

  [1]

  M. Wang*

  and A. Tayebi, “Hybrid feedback for affine nonlinear systems with application to
  global obstacle avoidance,”

  IEEE Transactions on Automatic Control

  , 69(8), pp. 5546–5553, 2024.

  [2]

  M. Wang*

  and A. Tayebi, “Nonlinear attitude estimation using intermittent and multi-rate
  vector measurements,”

  IEEE Transactions on Automatic Control

  , 69(8), pp. 5231–5245, 2024.

  [3]

  M. Wang*

  and A. Tayebi, “Hybrid feedback for global tracking on matrix Lie Groups SO(3) and
  SE(3),”

  IEEE Transactions on Automatic Control

  , 67(6), pp.2930-2945, 2022.

  [4]

  M. Wang*,

  S. Berkane, and A. Tayebi, “Nonlinear observers design for vision-aided inertial
  navigation systems,”

  IEEE Transactions on Automatic Control

  , 67(4), pp. 1853-1868, 2022.

  [5]

  M. Wang

  and A. Tayebi*, “Nonlinear state estimation for inertial navigation systems with
