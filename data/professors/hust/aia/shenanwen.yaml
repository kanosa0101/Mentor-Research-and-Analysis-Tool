bio_raw: '沈安文

  职称：

  教授

  邮箱：

  sawyi@mail.hust.edu.cn

  研究方向：

  先进运动控制、电力电子、新能源、电动汽车控制等

  个人简介

  个人基本情况

  1967

  年

  4

  月出生湖北省武汉市江夏区

  ,1991

  年、

  1994

  年毕业于浙江大学电机工程系分别获工业电气自动化专业工学学士学位和工业自动化专业工学硕士学位，

  1997

  年毕业华中理工大学自动控制系获电力传动及其自动化专业工学博士学位，

  1997

  年

  ~1999

  年在华中理工大学控制科学与工程博士后流动站工作，自

  1999

  年起在华中理工大学、华中科技大学任教，被聘为教授和博士生导师。主要社会兼职有湖北省暨武汉自动化学会副理事长、秘书长，先后担任中国自动化学会电气自动化专业委员会、电控装置委员会、仪器仪表装置委员会委员，《变频器世界》、《电机与控制应用》等杂志编委。讲授的本科生课程有《单片机原理与应用》、《功率变换技术》，讲授的研究生课程有《现代交流电机控制技术》、《交流电机控制原理与设计》等。先后指导博士研究生

  8

  名，硕士研究生

  30

  余名，博士后多名。

  主要研究方向

  先进运动控制、电力电子、新能源、电动汽车控制、集成数字化控制、机器人、生产过程控制等。

  研究成果

  自

  近年来主持和承担的科研项目包括大冶铁矿竖炉球团生产过程自动控制系统研究、高性能伺服驱动器研究、交流交流电机变频器研究、高性能工业缝纫机驱动控制研究、电动汽车新型动力系统驱动控制研究、大功率电力有源滤波器研究、智能光伏并网装置研究、大功率高性能中频电源研究、淡水湖水环境监测机器鱼研究、便携式数字血铅仪研究，以及参加了多项国家自然科学基金项目的研究等等。

  成果主要为所完成的多项科研成果成功转化为生产力，形成产品并批量生产，带来极大的社会和经济效益。在国内外权威刊物发表论文50余篇，获发明和实用新型专利授权多项。'
