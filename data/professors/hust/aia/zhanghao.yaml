bio_raw: '个人简介

  张浩，华中科技大学人工智能与自动化学院教授，国家级青年人才计划入选者。先后获得南京大学学士学位、香港中文大学硕士学位并于2018年获香港城市大学计算机专业博士学位，师从跨媒体分析领域知名学者、ACM杰出科学家Chong-Wah
  Ngo教授。主要从事跨媒体智能分析研究，聚焦多模态内容识别（图像、视频与点云）、跨模态检索及决策推理等方向，围绕轻量化表征学习、精细语义对齐、知识迁移学习和视觉溯因推理等关键技术开展系统性研究。曾任阿里巴巴达摩院高级工程师（2018—2019）、香港城市大学博士后研究员（2019—2021）、新加坡管理大学研究科学家（2021—2022）以及新加坡科技研究局（A*STAR）高级研究科学家（2022—2026）；2026年起任职...

  查看更多>'
