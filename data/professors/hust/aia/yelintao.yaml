bio_raw: '个人简介

  Personal Profile

  个人介绍：

  叶林涛，华中科技大学人工智能与自动化学院副教授、硕士生导师。2015年获华中科技大学本科学位，2017年和2020年分别获美国普渡大学硕士和博士学位，2020-2021年于美国圣母大学从事博士后研究。主要研究方向包括：优化算法、控制理论、机器学习、强化学习等。近年来，在IEEE
  Transactions on Automatic Control (TAC)、Automatica、SIAM Journal on Control and Optimization
  (SICON) 等国际期刊发表论文十余篇；获美国控制会议（ACC）最佳学生论文奖finalist、IEEE决策与控制会议（CDC）杰出论文奖。详情请见：

  https://sites.google.com/view/lintao-ye

  研究方向：

  设计具有

  可解释性和性能保障

  的优化算法及人工智能算法， 包括以下主要方向：

  （1）基于强化学习的模型未知动态系统最优控制与观测；

  （2）在线优化和序贯决策问题

  ；

  （3）

  基于次模性的组合优化

  ；

  （4）

  大规模和分布式系统中的强化学习问题；

  （5）

  强化学习算法在无人系统集群、大规模电力系统中的应用。

  招生信息：

  课题组常年招收感兴趣的本科生、硕士生、博士生以及博士后进组从事相关研究工作，需要申请人具有较强的数学基础、编程能力和英语水平，具备自我激励和持之以恒的精神，以自身兴趣为驱动从事关键科学问题研究。（详情请发送邮件至

  yelintao93@hust.edu.cn

  ）

