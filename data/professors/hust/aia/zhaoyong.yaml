  至今，华中科技大学

  ，

  自动化学院

  ，教授、博士生导师，

  其中，2005.4至2006.7年在Oxford University访学。

  主要研究方向

  决策理论、方法及应用；大型工程项目管理；社会经济系统的建模与仿真；系统分析与集成

  招生要求

  专业需求：自动化、测控、物流、电力、交通、环境、计算机、工业工程、数学及经济管理等

  招生方向：系统工程与决策

  代表性成果及获奖情况

  （论文、科研或奖励情况）

  主持和参与完成了多项理论和应用科研课题，内容涉及多目标群

  决策理论与方法、运筹学、博弈论与行为科学、系统分析、建模与仿真、人工智能与信息技术、以及决策支持系统等，涉及的应用领域包括水资源与水环境、电力系统、工业工程、物流与供应链、电子商务与拍卖、教育系统、大型工程项目管理等

  。主持已完成和在研项目主要有国家自然科学基金项目

  7项、预研重点基金1项、863计划项目1项、教育部回国人员基金1项、湖北省自然科学基金5项、全国教育事业“十五”计划和2015年规划重点研究课题1项、国家教委“八五”重点课题1项，以及世界银行、亚行贷款的湖北、广西和上海等地的城市环保项目4项，湖北省环保“十五”规划、华能澜沧江梯级水电站工程项目管理、河北电网资产全寿命周期成本分析与决策支持系统开发、广东省河源市水资源可持续分析与开发对策等，并获省部级科技进步奖1项。在国内外权威和重点刊物上发表论文90多篇，其中SCI和SSCI收录34篇，并合作出版教材1部和著作1部。已毕业硕士研究生33名，博士研究生16名，其中1人获湖北省优秀硕士论文，4人获湖北省优秀博士论文。'
