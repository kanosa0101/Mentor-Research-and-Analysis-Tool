bio_raw: '个人简介

  陆昊，副教授，博导，华中卓越青年学者，武汉英才，楚天学子，研究方向为计算机视觉与植物表型视觉。其在视觉和表型领域有十余年研究经历，在视觉领域的顶刊顶会包括TPAMI、IJCV、CVPR、ICCV、ECCV、NeurIPS、AAAI、ACM
  MM等发表论文30余篇，在Plant Phenomics、Comput Electron Agric、ISPRS J Photogramm Remote Sens,
  IEEE Trans Geosci Remote Sens等植物表型和农业遥感领域国际权威期刊发表论文20余篇，4篇论文入选ESI高被引。谷歌学术引用5500余次，H指数40。其是Plant
  Phenomics期刊编委（AE）、Frontiers in Plant Science期刊客座编委，是AAAI高级程序委员（SPC）、VALSE执行领域主席（EAC）、PRCV
  2023领域主席（AC），CSIG视觉大数...

  查看更多>'
