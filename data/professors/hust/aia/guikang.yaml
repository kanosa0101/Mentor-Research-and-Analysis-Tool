title: 助理研究员
bio_raw: '个人简介

  桂康，男，湖北武汉人。华中科技大学多谱信息智能处理技术全国重点实验室助理研究员。2019年毕业于华中科技大学人工智能与自动化学院，获博士学位。个人研究领域为波谱特性测量技术，并在复阻抗谱、多光谱测量方向有多项应用成果。主持研发的复阻抗谱薄膜感知技术服务于C929过冷大水滴结冰防护研究，并在交通、风电、输电产业中快速渗透应用；参与研发的光纤结冰传感器装备于多款航空器。主持项目包括：国基金青年项目、博士后基金面上项目、重点实验室开放课题、航空工业院所横向项目等。以第一/通讯作者在Applied
  Thermal Engineering、Measurement、Sensors and Actuators A: Physical等具国际影响力的期刊/会议发表论文18篇，申请/授权专...

  查看更多>'
