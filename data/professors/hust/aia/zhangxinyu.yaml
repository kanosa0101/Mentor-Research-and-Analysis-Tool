  个人简介

  个人简介

  1982—1986

  年，长春光学精密机械学院，红外技术专业，获学士学位；

  1986—1992

  年，

  供职于陕西青华机电研究所；

  1992—1995

  年

  ，

  华中理工大学

  ，凝聚态物理专业，获硕士学位；

  1995—1999

  年

  ，

  华中理工大学

  ，物理电子学，获博士学位；

  2000

  —

  2002

  年，华中科技大学外存储系统国家专业实验室，博士后；

  2002

  —

  2003

  年，荷兰Delft University of Technology，第二站博士后；

  2004

  —2012

  年

  ，供职于华中科技大学图像识别与人工智能研究所；

  2013

  —

  至今，

  供职于华中科技大学人工智能与自动化学院。

  主要研究方向

  多谱多模成像探测与制导，微纳光学与光电技术，多谱图像信息处理与模式识别，智能化光学/光电芯片，光学射频复合成像探测，THz技术

  招生要求

  专业需求：电子、光学、应用物理、自动化、测控、电信、计算机软硬件等。

  招生方向：模式识别、光学光电图像信息处理、智能科学与技术、成像探测与制导、微纳光学与光电技术、光学/光电芯片技术，THz科学与技术等。

