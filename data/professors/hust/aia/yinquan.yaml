  个人简介

  个人基本情况

  尹 泉，男，

  1968

  年

  10

  月生。江苏省泰州人

  1990

  年毕业于华中理工大学理自控系工业电气自动化专业

  ,

  获工学学士学位，曾在核工业部二七二厂工作，

  1995

  年获华中理工大学工业自动化专业硕士学位，

  2001

  年获华中科技大学控制理论与控制工程专业工学博士学位，同年进入华中科技大学电子科学与技术博士后流动站工作，出站后留校工作被聘为华中科技大学自动化学院副教授。

  主要社会兼职：《伺服控制》编委，《电工技术学报》等多家期刊的审稿人。

  主要研究方向

  全数字交流伺服系统、广义变频电源的数字化控制、嵌入式控制系统，智能控制在运动控制系统中的应用。

  研究成果

  作为主要技术骨干参加多项国家“八•五”、“九•五”、“十•五”海军预研项目，作为第一完成人的“基于DSP的全数字交流伺服驱动系统”项目于2001年12月由国家教育部主持通过技术鉴定。评价为达到二十世纪末国际先进水平。作为主要技术负责人完成的科研工作有：电动汽车用电机控制系统开发、数字化驱动控制技术研究、舰炮交流驱动器开发、交直流传动装置研制及产业化、全数字交流伺服驱动系统开发、系统综合控制模块、基于CAN总线的全数字交流伺服系统等，在国内外期刊发表论文30余篇。'
