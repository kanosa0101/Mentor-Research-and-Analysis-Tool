bio_raw: '个人简介

  Personal profile

  叶杰，2021年3月入职华中科技大学人工智能与自动化学院，博士生导师、武汉英才（优秀青年人才），主要研究方向：并网变换器谐振及谐波抑制、电力电子变换器的建模与控制以及复杂柔性直流电网的稳定性分析。2017年在华中科技大学控制科学与工程专业获得工学博士学位，随后在国家电网公司智能电网研究院直流输电技术研究所从事博士后研究工作，合作导师是汤广福院士。相关研究内容以第一作者或通讯作者身份在IEEE
