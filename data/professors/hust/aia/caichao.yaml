bio_raw: '个人简介

  蔡超，华中科技大学，多谱信息智能处理技术全国重点实验室，人工智能与自动化学院，博士， 副教授。1994年毕业于山东曲阜师范大学数学系，获理学学士学位；1997年获华中理工大学理学硕士学位；2005年获华中科技大学工学博士学位，获2006年校级博士优秀论文奖；1997.4-2002.10于华中理工大学（现华中科技大学）数学系任教；2002.10-至今于多谱信息智能处理技术全国重点实验室、人工智能与自动化学院工作。目前从事的研究工作主要有机器视觉、目标识别与态势估计、强化学习与群体智能、医学图像处理等。先后主持国家863项目、航天基金项目、湖北省自然科学基金项目、航空科学基金以及国防横向项目40余项，获国家发明专利4项。发表学术论文50余篇...

  查看更多>'
