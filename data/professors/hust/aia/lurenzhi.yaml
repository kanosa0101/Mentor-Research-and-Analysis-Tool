bio_raw: '个人简介

  Personal profile

  卢仁智，男，1991年出生，湖北十堰人。华中科技大学副教授，博士生导师，入选2022年度中国科协青年人才托举工程，主要从事复杂系统安全学习理论及应用（深度强化学习与无人系统调控博弈和工业制造能源优化）。2014年6月本科毕业于武汉科技大学，2019年8月博士毕业于韩国汉阳大学，2019年11月至2021年10月任华中科技大学人工智能与自动化学院讲师，2021年11月晋升副教授，2024年11月被评为博士生导师。
