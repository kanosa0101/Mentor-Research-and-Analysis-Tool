bio_raw: '个人简介

  Personal profile

  1999年毕业于华中理工大学自动控制工程系，获自动化专业学士学位；2002年毕业于华中科技大学图像识别与人工智能研究所，获模式识别与智能系统专业硕士学位；2012年毕业于华中科技大学图像识别与人工智能研究所，获控制科学与工程专业博士学位；2016年，亚利桑那州立大学，访问学者；自1999-至今，先后于华中科技大学图像所、自动化学院、人工智能与自动化学院任教。email:
