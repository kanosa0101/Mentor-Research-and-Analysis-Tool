  代表性成果及获奖情况

  （论文、科研或奖励情况）

  先后承担并完成了十余项的国家级科研项目，作为项目负责人承担了重点基金项目“多谱图像匹配识别技术”，十一五、十二五国家重点预先研究项目“卫星图像信息处理技术”、“卫星图像信息地面处理技术”，作为主要研究人员承担了”卫星侦察图像解译技术”,”卫星图像匹配末制导技术”、"卫星信息处理技术"、"自动目标识别技术"、"长波红外图像智能化信息处理技术研究"，“多传感器、多特征地物图像的数据融合技术研究”,
  “红外成像目标检测识别处理技术”、“多源观测数据综合处理与分析技术基础研究“等重点预研和关键技术攻关项目等十余项,获部委级科技进步一等奖1 项，二等奖2 项，三等奖2项，在国内外重要学术刊物和国际学术会议上发表论文20余篇。'
