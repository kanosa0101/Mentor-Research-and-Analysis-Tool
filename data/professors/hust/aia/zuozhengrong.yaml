  2013.3—

  至今，华中科技大学自动化学院，教师

  主要研究方向

  模式识别、图像分析、图像制导、计算机视觉、自动目标识别、图像跟踪

  招生要求

  （专业需求和招生方向）

  专业需求：自动化，计算机，测控，电信，数学等

