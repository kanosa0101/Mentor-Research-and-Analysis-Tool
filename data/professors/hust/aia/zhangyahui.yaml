bio_raw: '个人简介

  张亚辉，人工智能与自动化学院讲师。博士毕业于荷兰阿姆斯特丹大学，随后分别在美国西北大学、英国帝国理工学院进行博士后研究，主要研究方向为面向人形机器人的三维视觉感知。近年来以第一作者在IEEE/ASME
  Transactions on Mechatronics、Pattern Recognition等期刊发表多篇论文。每年招收硕士研究生，并欢迎本科生进组学习。'
