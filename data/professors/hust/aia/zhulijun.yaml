bio_raw: '个人简介

  Personal Profile

  个人简介：

  朱力军，华中科技大学人工智能与自动化学院教授、博导、国家海外青年特聘专家、湖北省海外特聘专家。2013年毕业于澳大利亚纽卡斯尔大学取得博士学位。2013年-2019年先后在澳大利亚纽卡斯尔大学和香港大学从事博士后研究。主要研究领域包括网络化控制及其应用与仿生机器人。在自动化领域顶级期刊Automatica、IEEE
  TAC与会议上共发表论文七十余篇，获机器人领域顶会ICRA最佳论文提名。担任Frontiers in Neurorobotics等SCI期刊编委成员和IEEE国际会议程序委员会委员。

  研究方向：

  仿生机器人智能控制与集群协同，包括人形机器人、四足机器人

  等仿生机器人智能控制、强化学习在机器人领域的应用，以及机器人

  集群协同控制等。

  招生要求：

  常年招收对以上研究方向感兴趣的博士后、博士和硕士研究生。详细情况请发邮件至ljzhu@hust.edu.cn.'
