bio_raw: '个人简介

  Personal Profile

  个人介绍

  邰若晨，教授，博士生导师，国家级青年人才。2016年获得南京理工大学学士学位，2019年获得上海交通大学硕士学位，2023年获得新加坡南洋理工大学博士学位，2023年至2024年期间在新加坡南洋理工大学从事博士后研究工作。研究方向为智能机器人与群体智能系统、安全自主可信的无人系统，主持国基金人才项目、国基金青年科学基金项目（C类）、湖北省重大科技项目课题，参与国家重大科研平台项目。

  近年来在IEEE Transactions on Automatic Control、Automatica、

  IEEE Transactions on Industrial Informatics、

  IEEE/ASME Transactions on Mechatronics、IEEE Control Systems Letters、中国科学·技术科学、IEEE
  Conference on Decision and Control (CDC)、IEEE/RSJ International Conference on Intelligent
  Robots and Systems (IROS)等重要期刊和会议上发表30余篇学术论文，其中在控制领域顶刊IEEE Transactions on Automatic
  Control和Automatica发表第一作者论文8篇（常文4篇）。

  获机器人领域国际高水平会议IEEE International Conference on Robotics and Biomimetics (ROBIO)和 IEEE International
  Conference on Real-time Computing and Robotics (RCAR)最佳论文奖提名；获新加坡南洋理工大学2024年最佳博士论文奖；获New
  Generation Star Project@IROS 2025（机器人顶会）。

  担任机器人

  领域

  顶会ICRA 2026、ICRA 2027的Associate Editor、

  机器人领域国际高水平期刊

  Robot Learning青年编委、

  18th International Conference on Control, Automation, Robotics and Vision (ICARCV
  2024）的Track Co-Chair、2026 IEEE International Conference on Real-time Computing and
  Robotics (RCAR 2026)的Publicity Chair。

  （作为指导老师）获2026中国机器人大赛暨

  RoboCup机器人世界杯中国赛一等奖（冠军）、

  第七届中国研究生机器人创新设计大

  赛全国

  三等奖、第九届中国（国际）传感器创新创业大赛华中赛区三等奖。

  研究方向

  1. 智能机器人与群体智能系统

  ·多无人机—车集群协同与群体智能

  ·

  大模型驱动的具身智能

  ·

  多移动机械臂协作与智能控制

  ·

  灵巧操作与技能学习

  ·

  无人机自主感知与任务规划

  ·

  软体机器人建模与智能控制

  2.

  安全自主可信的无人系统

  ·

  多机器人集群协作安全

  ·

  无人系统中的 AI 安全

  ·

  无人驾驶系统信息安全

  ·

  安全攸关能源场景下无人系统的安全运行与人机协同

  ·

  机器人化智能制造系统安全

  ·

  无人机感知与驱动安全

  ·

  人—机—环境交互安全

  招生信息

  课题组常年招收对以上研究方向感兴趣的优秀本科生、硕士、博士、博士后。欢迎

  勤奋踏实、自驱力强、持之以恒

  的学生联系（详细情况请附带简历发邮件至ruochen_tai@hust.edu.cn）

  博/硕士

  ：欢迎有志于

  智能机器人与群体智能系统、安全自主可信的无人系统

  等学术研究的同学加入！

  博士后

  ：亟需智能机器人、AI/系统安全等方向的博士后，待遇从优，常年招聘！

  本科生

  ：欢迎学有余力的同学加入实验室参加比赛、课题研究、毕业设计等！

  课题组具有多种机器人平台及辅助测试设备（无人机、无人车、四足、机械臂、灵巧手、软体机器人、动捕系统、高精密力传感器等），并聘请了专职行政助理处理日常事务。

