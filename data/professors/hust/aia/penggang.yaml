bio_raw: '个人简介

  个人基本情况 毕业于华中理工大学（现华中科技大学）自动控制专业，2002年获工学博士学位，同年进入华中科技大学机械电子工程从事博士后研究工作。之后任职华中科技大学人工智能与自动化学院副教授、博士生导师。现为“教育部图像信息处理与智能控制重点实验室”智能机器人研究室负责人、“自主智能无人系统教育部工程研究中心”副主任/低速无人驾驶与智能巡检研究室负责人、中国人工智能学会智能机器人专业委员会常委、中国自动化学会机器人/共融机器人专业委员会委员、中国自动化学会建筑机器人专业委员会委员、中国嵌入式系统产业联盟和中国软件行业嵌入式系统协会理事、中国电子学会高级会员、IEEE
  Member。主要研究方向 具身智能机器...

