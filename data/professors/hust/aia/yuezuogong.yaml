bio_raw: '个人简介

  Personal Profile

  人工智能与自动化学院讲师、硕士生导师，入选武汉市青年人才项目。于2011年获浙江大学机械电子工程学士、2013年获香港科技大学机械工程研究型硕士（MPhil）、2018年获卢森堡大学博士学位（指导老师为剑桥大学、LCSB双聘教授
  Prof. Jorge Goncalves，欧洲科学院院士、美国科学院外籍院士 Prof. Lennart Ljung），2019-2021在新南威尔士大学电子工程与通信学院作博士后（指导老师为IEEE、美国统计学会会士
  Prof. Victor Solo）。在Automatica、IEEE Trans. on Automatic Control、IEEE Trans. on Industrial
  Informatics发表一作/通讯论文，担任CCF-A级人工智能顶会 NeurIPS 领域主席（Area Chair）等。

  主持国家自然科学基金面上项目、青年基金、国家智能制造与机器人重大专项子课题、湖北省面上项目、教育部重点实验室开放基金等，参与国家自然科学基金重大研究计划（重点项目）、集成项目、科技部重点研发计划课题等。

  主要研究方向：

  物理AI理论与优化算法

  研究数据驱动学习中引入高维动力学、网络拓扑等物理内蕴性质的模型表征，并设计优化算法

  解决有限时序数据下的

  可靠训练

  与辨识问题

  ，为复杂物理系统、高自由度机器人系统提供了

  建模

  理论与算法基础。

  仿人机器手的灵巧操作与优化

  主要关注高自由度仿人机器手的动力学建模、灵巧操作控制算法研究，以及在灵巧操作反馈下的本体

  优化

  设计（除AI与控制专业外，也诚招对本体机电设计有兴趣的学生）。

  交叉应用研究：航空智能装配

  当前主要在研方向：

  1）航空部件形性协同装配优化算法研究：

  在超高精度装配场景中

  ，考虑由于复杂结构、材料异质导致的复杂物理形变，设计AI算法对装配参数与工艺进行优化设计。

  2）狭缝高精度测量

  的光纤传感器设计及学习算法（华中科技大学交叉研究计划，与光电学院合作研究）。'
