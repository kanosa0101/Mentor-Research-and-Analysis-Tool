bio_raw: 谢旻晖，博士，现任中国人民大学信息学院吴玉章青年英才（讲师）。2019年、2024年分别于南京大学、清华大学计算机系获得学士和博士学位。研究方向包括机器学习系统、存储系统、操作系统等，在SC、EuroSys、ATC、ASPLOS、VLDB等CCF
  A类会议与期刊上发表论文二十余篇。入选北京市青年托举人才工程、国际计算机协会(ACM)中国优秀博士论文奖（全国仅2位）、ACM SIGOPS China (ChinaSys)
  优博、吴玉章青年青才、玉兰青年学者、微软铸星学者计划等奖励。最新信息请查看个人主页https://minhui-xie.github.io/。
