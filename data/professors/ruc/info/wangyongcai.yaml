bio_raw: 王永才，中国人民大学计算机系教授，博导，计算机系副系主任、信息学院科研与学科建设工委主任。本科、博士均毕业与清华大学自动化系，师从郑大钟和赵千川教授，是CCF智能机器人专委会执行委员、物联网专委会执行委员、中国控制学会DEDS专委会执行委员、SIGBED
  China专委、CAAI认知与信息处理等专委会委员，主要研究领域为：智能体系统、视觉空间计算、Spatial AI、协同感知、SLAM、多智能体强化学习，在国内外知名期刊和会议发表论文120余篇，其中CCF
  A，B类论文50余篇。研究成果被应用于智能车、智能船、视觉目标检测与定位等领域。主持国家自然科学基金项目多项，国家科技支撑计划子课题，企业项目多项，2021年由于海上目标定位工作获得交通运输部航海学会技术发明奖一等奖，2022年获得交通运输部航海学会科技进步二等奖，交通运输部重大创新成果入库成果奖。担任CIKM2025,
  WWW2025, AAAI2026 等会议程序委员会委员，Computer Science and Technology 期刊编委， 担任NeurIPS, ACM
  MM, TON, TMC, TPAMI, CVPR, ICCV 等知名期刊和会议审稿人。
