bio_raw: 金琴，教授，博士生导师。主要研究领域包括多媒体智能计算，人机交互。获2016年IBM SUR Award；2018-2020 CVPR ActivityNet
  Dense Video Captioning Challenge蝉联冠军，2016-2017 ACM Multimedia (Video to Language)
  Grand Challenge蝉联冠军；2017-2019 NIST TrecVID Video to Text(VTT)蝉联冠军；2017-2019 Audio-Visual
  Emotion Challenge (AVEC)蝉联冠军；2015年ImageCLEF评测（Image Sentence Generation）冠军。
