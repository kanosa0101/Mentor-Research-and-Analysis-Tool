bio_raw: 吴云乘，中国人民大学副教授、吴玉章青年学者，入选国家级青年人才项目。目前的研究方向包括：隐私计算、联邦学习、无服务器计算、可信执行环境等。相关研究成果在SIGMOD、VLDB、ICDE、TKDE等国内外学术期刊和学术会议上发表论文30余篇，获SIGMOD
  2024系统奖、ICDE 2024最佳论文提名奖。近年来担任数据库顶级会议包括VLDB和ICDE在内的多个CCF-A类会议的程序委员会委员以及TKDE、TIFS等CCF-A类期刊的审稿人。
