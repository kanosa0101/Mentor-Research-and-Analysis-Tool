title: 副教授
email: yanyu@ruc.edu.cn
bio_raw: 余艳，中国人民大学信息学院副教授，获香港城市大学信息系统方向博士、北京大学管理学硕士、经济学双学士。主要研究领域包括企业数字化转型与创新、知识管理、智能社会与治理、智慧医养，发表学术论文60余篇，包括Technovation,
  Journal of Business Research, Tourism Management, IJIM, I&M, JKM,《管理科学学报》、《南开管理评论》等，合著《思科实访录：从创新到运营》（中英文）。获浙江省科学技术进步二等奖、钱伟长中文信息处理科学技术奖、首届数据空间大会优秀成果、省部公共管理优秀成果奖、ICIS最佳论文提名奖。主持多个国家自然科学基金项目、北京市自然科学和社会科学基金项目，参与国家自然科学基金重大研究计划、国家社会科学基金重大项目、教育部哲学社会科学研究重大课题攻关项目，及多个香港大学研究基金项目。
