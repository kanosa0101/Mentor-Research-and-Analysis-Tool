bio_raw: 付虹蛟，副教授，1990年7月在北京理工大学获得工学学士学位，1993年7月在中国人民大学获得经济学硕士学位，2004年7月在中国人民大学获得管理学博士学位。2004年受国家留学基金委资助在美国加州大学圣迭戈分校（UCSD）做访问学者。
