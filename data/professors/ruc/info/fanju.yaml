bio_raw: 范举，中国人民大学教授，博士生导师，入选国家级人才项目（国家自然科学基金优秀青年基金）。目前的研究方向包括：智能数据库技术（AI4DB）、人在回路的数据准备、大数据管理与分析等。近年来，作为负责人先后主持国家自然科学基金优秀青年基金项目、重点项目课题、面上项目、青年项目，以及多项产学研合作项目。相关研究成果在SIGMOD、VLDB、ICDE、TKDE等CCF-A类期刊和会议上发表论文40余篇。获得2017年度ACM中国新星奖、中国人民大学教学标兵等奖励。
