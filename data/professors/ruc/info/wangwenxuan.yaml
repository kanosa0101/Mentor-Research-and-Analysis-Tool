bio_raw: 王文轩，博士，中国人民大学信息学院讲师。2024年博士毕业于香港中文大学计算机系，师从ACM/IEEE Fellow吕荣聪教授。曾先后前往斯坦福大学、哈佛大学、加州大学洛杉矶分校、加州大学伯克利分校访问合作，并长期在腾讯AI
  Lab实习。研究方向为大模型及其应用的可靠性和安全性。近五年发表CCF A论文三十余篇，发表论文获ACM杰出论文奖，谷歌学术引用三千余次。指导本科生经验丰富，曾指导十余名本科生发表CCF
  A论文，并先后四次获得港中文本科生暑研最佳论文奖。
