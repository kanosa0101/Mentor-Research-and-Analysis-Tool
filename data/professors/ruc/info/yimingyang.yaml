bio_raw: 易鸣洋，男，博士，中国人民大学信息学院讲师。2022年博士毕业于中科院数学与系统科学研究院，师从中科院院士马志明。曾在华为诺亚方舟实验室，微软亚洲研究院等科研机构工作或实习。主要研究方向包括人工智能中生成式AI及大模型的理论，算法，应用。相关成果发表在ICML，NeurIPS，ICLR，CVPR，UAI，IJCAI等人工智能领域顶级会议。
