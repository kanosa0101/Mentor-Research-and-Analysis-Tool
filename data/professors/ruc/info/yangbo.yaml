bio_raw: 杨波，中国人民大学信息学院经济信息管理系教授，博士生导师，管理学博士。长期从事电子商务创新创业、AI应用、服务外包、IT治理、CIO的研究，出版学术专著一部和译著六部。在Management
  Science, Journal of Information Science, Internet Research，Electronic Commerce Research,
  Group Decision and Negotiation, British Journal of Educational Technology, Electronic
  Commerce Research and Applications等国内、国际期刊杂志和国际国内会议上共发表了100余篇文章。主持和参与了多个国家自然科学基金、国家社科基金、北京科技计划项目课题的研究工作。走访过近百家电子商务和服务外包企业。2015-2023连续9篇案例入选《中国人民大学中国社会科学案例库》。2018年《“天生全球化的社交工具YeeCall——市场缝隙的探索之路”》，入选全国百篇优秀管理案例（微案例）。
