bio_raw: 许伟，男，博士，中国人民大学信息学院副院长、智慧治理学院副院长、教授、博士生导师。国家级青年人才，北京市青年教学名师，北京市科技新星，北京市优秀人才，中国人民大学杰出学者。苏州市人工智能与社会治理技术重点实验室主任，中国人民大学智慧校园研究中心主任，智慧城市研究中心副主任，信息学院信息系统与大数据应用实验室主任。中国信息经济学会副理事长兼秘书长，中国系统工程学会信息系统工程专业委员会副秘书长，《系统工程学报》、Journal
  of Safety Science and Resilience编委，Internet Research、《系统工程理论与实践》、《管理评论》等国内外期刊客座主编。主要研究领域为金融科技、商业分析、智慧健康、智慧治理。主持国家自然科学基金、北京市自然科学基金、北京市社会科学基金等多项，在MISQ、ISR、POMS、IJOC、IEEE
  Trans.、ACM Trans.、IJCAI、WWW等国内外顶级期刊和会议上发表研究论文200余篇，出版著作6部，获得宝钢优秀教师奖、国家级高等教育教学成果奖、北京市哲学社会科学优秀成果奖、北京市高等教育教学成果奖、中国人民大学教学标兵、优秀共产党员、先进工作者等多项。
