bio_raw: 汪云海，中国人民大学特聘教授，博士生导师，国家级青年人才项目获得者。研究方向聚焦于基于大模型的数据智能前沿，涵盖大数据可视分析、复杂图数据建模学习、知识增强大模型与智能体等，并应用于非法金融监测预警、智能体决策仿真及CAE工程等领域。至今已在IEEE
  VIS、ACM SIGCHI、SIGMOD、SIGKDD、NeurIPS、VLDB、IEEE TVCG等CCF-A类会议期刊发表论文70余篇。现招收本科生、（免试）研究生及访问学生，将根据个人兴趣因材施教，提供个性化科研指导。
