bio_raw: 王伶俐，女，博士，副教授，国家级青年人才。主要研究方向为人-AI交互、智能系统价值分析和信息系统中的用户行为等。主持国家自然科学基金青年项目B类、面上项目和青年项C类。在MIS
  Quarterly, Information Systems Research, Production and Operations Management, ACM
  Transactions on Computer-Human Interaction, ICIS, AMCIS, PACIS等主要学术期刊和会议上发表多篇论文。
