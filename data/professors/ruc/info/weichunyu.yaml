research_direction_raw: 关系智能（Relational Intelligence），即理解和建模复杂系统中多层次关系结构的科学范式，具体包括：；1.知识增强的语言模型：；o组织：智能体记忆（Agent
  Memory）；o检索：检索增强（RAG）；o微调：知识编辑（Knowledge Editing）；o对齐：模型个性化（Personalization）；2.拓扑感知的数据模型：；o建模：拓扑数据合成（Data
  Generation）；o预测：图表征学习（Representation Learning）；o仿真：多智能体交互（Multi-agent Collaboration）；o计算：关系基础模型（Foundation
  Model）
