bio_raw: 韦淳于，博士，硕士生导师。中国人民大学信息学院讲师，吴玉章青年英才，中国人民大学国家治理大数据和人工智能创新平台研究员。2019年于清华大学自动化系获学士学位，2024年于清华大学自动化系获博士学位。以第一/通讯作者发表CCF-A类论文二十余篇，研究成果在腾讯、阿里和快手等公司落地。
