bio_raw: 黄科满，男，博士，副教授，硕士生导师中国人民大学信息学院副教授、中国人民大学吴玉章青年学者、麻省理工斯隆管理学院兼职研究员、全国智能技术社会应用与评估基础标准化工作组委员、CCF数据治理发展委员会执行委员、CCF服务计算委员会执行委员、国际网络安全认证专家
  (CISSP)、中国人民大学人工智能研究院兼职研究员、中国人民大学数据要素研发中心双聘研究员，基于案例分析、数据实证、模拟推演和社会实验等多学科研究范式，分析智能数字创新生态（如群智服务生态、数商生态、创新生态等）的自适应行为和动态演化规律，探讨企业和政府构建数字生态和网络安全治理体系的路径和模式，探索人智混合生态系统协同增长的机理和技术。目前已经在计算机、管理和政策领域的顶级期刊会议包括斯隆管理评论、哈佛商业评论、ACM
  CSCW、IEEE TSC、IEEE TASE、IEEE TC、ACM Computing Survey等发表论文70余篇。部分研究成果被中央、发改委、网信办、卫健委、军科委等相关国家部委采纳和批示，并应用于腾讯、摩根斯坦利、BV
  Tech、纳斯达克等国内外企业，成为MIT等名校的教学材料，被斯隆管理评论和哈佛商业评论等选为数字经济管理必读材料。申请专利和软件著作权多项。
