bio_raw: 张绍磊，博士，中国人民大学信息学院讲师。现工作于范举教授领导的数据治理技术与系统实验室。2025年于中国科学院计算技术研究所获得博士学位，师从冯洋研究员。研究方向为大模型、以数据为中心的AI、智能体系统。在NeurIPS、ICLR、ACL等人工智能与自然语言处理国际会议发表论文30余篇，其中以第一作者身份发表论文15篇。开源的多语言与多模态大模型项目在GitHub社区累计获得5000+星标。长期担任CCF-A类国际会议ACL
  ARR的领域主席（Area Chair），及各项国际会议和期刊审稿人。
