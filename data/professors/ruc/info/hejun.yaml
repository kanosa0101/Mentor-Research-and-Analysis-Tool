bio_raw: 何军，工学博士，教授，博士生导师，中国计算机学会杰出会员，中国计算机学会大数据专家委员会委员，中国计算机学会数据库专委会委员，数据工程与知识工程教育部重点实验室研究员，有多次的海外研究经历，在推荐系统、数据治理、人工智能、数字人等领域积淀了丰富的研究和开发经验，发表研究论文100多篇，主持和参加了二十项科研项目，获得过五次国际会议和期刊的最佳论文奖。申请人近年在国际著名期刊和学术会议，如ACM
  Computing Surveys、ACM TOIS、IEEE TKDE、AAAI、IJCAI、NeurIPS、ACM MM、CVPR/ICCV/ECCV、SIGKDD、VLDB等上发表多篇研究论文，担任TPAMI、TKDE、ACM
  Computing Surveys、Information Sciences、Decision Support Systems、计算机学报、软件学报等的审稿人，获得国家发明专利授权12项。
