bio_raw: 杜玮，博士，副教授，硕士生导师。担任经济信息管理系副系主任、教工党支部组织委员。入选北京市科协青年人才托举工程。主要研究领域为大模型智能体、推荐系统、金融科技、知识图谱、电商平台数据分析等数据智能和信息系统应用，利用前沿的人工智能和大数据技术解决管理决策中的复杂问题，在MIS
  Quarterly (MISQ)、Decision Support Systems (DSS)、International Journal of Electronic
  Commerce (IJEC)、Scientometrics、Internet Research (IR)等国际期刊和ICIS、HICSS、PACIS等国际会议上发表研究论文多篇。任IJEC、DSS、Scientometrics、IR、ECR等多个国际期刊和信息系统领域国际顶级会议同行评审员。申请专利十余项，多项授权，技术成果已应用于多个专利交易平台以促进科技成果转化。主持国家自然科学基金、教育部人文社科项目等科研项目多项。
