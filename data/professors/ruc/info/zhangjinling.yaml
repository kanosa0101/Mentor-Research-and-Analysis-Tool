bio_raw: 张金玲，女，1998年毕业于山东师范大学计算机系，获得计算机科学教育专业学士学位，2001年毕业于中国科学院软件研究所，获得计算机应用硕士学位，2009年7月毕业于北京邮电大学自动化学院，获得机械电子工程专业博士学位.
