title: 副教授
email: kunzhang@ruc.edu.cn
bio_raw: 张琨，男，博士，中国人民大学信息学院副教授。主要研究领域为运筹优化、仿真优化、机器学习、金融工程与风险管理，商业分析。主持国家自然科学基金面上项目、青年项目。在Operations
  Research、INFORMS Journal on Computing、European Journal of Operational Research、IEEE
  Transactions on Neural Networks and Learning Systems等国际期刊发表多篇论文，出版著作1部，获得中国人民大学玉兰青年学者，中国人民大学优秀党务工作者(基层党支部书记专项)，中国人民大学优秀班主任等荣誉。
