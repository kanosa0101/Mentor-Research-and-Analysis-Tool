bio_raw: 程絮森，男，中国人民大学教授、博士生导师，信息技术中心副总工程师，首都发展与战略研究院副院长、信息学院经济信息管理系主任，英国曼彻斯特大学商学院信息学博士。国家重大人才工程青年学者入选者，教育部哲学社会科学研究重大课题攻关项目首席专家，国家自然科学基金重点项目负责人，北京市国家治理青年人才培养计划入选者，全球前2%顶尖科学家榜单入选者，中国高被引学者榜单入选者，数字经济与智慧协作研究所所长，中国人民大学元宇宙研究中心副主任。中国信息经济学会常务理事，中国管理科学与工程学会理事，中国老年学与老年医学学会理事，中国软科学研究会理事，中国信息经济学会互联网经济与跨境电商专委会副主任、中国信息经济学会人工智能与变革管理专委会副主任、中国老年学与老年医学学会智慧医养分会副主任、中国科技新闻学会科幻传播与未来产业专委会副主任。主要从事信息管理与电子商务领域相关研究。主持过国家自然科学基金重点项目、组织间国际合作研究项目、面上项目、青年项目共6项，教育部项目4项，北京市项目3项，国家社科重大项目子课题2项。在MIS
  Quarterly, Production and Operations Management, Journal of Management Information
  Systems, Nature, Nature子刊等国际SSCI顶级与权威期刊, ACM CHI等顶级学术会议以及CSSCI核心等录用/发表成果100余篇（发表SSCI/SCI论文90余篇），出版中英文著作11部。在16本SSCI期刊担任编委相关工作，包括Information
  Technology and People高级主编（SE）、Internet Research 副主编（AE）、Information Technology for
  Development 副主编（AE）、Journal of Electronic Commerce Research 副主编（AE）、Electronic Commerce
  Research and Applications副主编（AE）、Electronic Commerce Research副主编（AE），ISJ、IPM、BJET、BIT、EM、JECR、JGITM
  、IJIM、INTR、JGIM、IJCHM、JOEUC期刊客座主编与编审委，以及国际顶级会议HICSS、AMCIS、ICIS、ECIS分会主席和编委，获得过教育部高等学校科学研究优秀成果奖（人文社科）青年成果奖，北京市哲社优秀成果奖二等奖，中国信息经济学优秀成果奖与青年创新奖，北京市教学成果奖二等奖、北京高校青年教师教学基本功比赛二等奖，北京高校青年教师社会调研成果一等奖等。担任过商务部、交通部、工信部等特邀专家，国家高端智库人大国发院研究员，首都高端智库人大首发院副院长，所撰写咨政建议多次获得领导重要批示，接受过新华社、人民日报社、中央电视台、中央人民广播电台等主流媒体多次专访。
