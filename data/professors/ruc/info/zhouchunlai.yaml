bio_raw: 周春来，副教授，硕士生导师。2007年8月毕业于美国印第安那大学(Indiana University， Bloomington), 获应用数学博士学位（辅修计算机科学）。曾在阿姆斯特丹大学获得理学硕士学位。目前主要研究领域是人工智能不确定性和数据科学方面的隐私计算（主要是差分隐私）。在哈佛大学做长期（1年）公派访问学者，在德国多特蒙德大学计算机系，澳大利亚国立大学计算机实验室和悉尼科技大学量子计算研究中心做短期（1-6个月）访问学者。
