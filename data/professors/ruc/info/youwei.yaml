bio_raw: 游伟，副教授，博士生导师，入选国家级青年人才项目。长期从事软件漏洞的自动化挖掘和二进制程序的动态/静态分析。在信息安全和软件工程领域国际顶级学术会议/期刊论文上发表论文二十余篇，获得SIGPLAN最佳论文奖，CSAW最佳应用安全论文提名奖。荣获中国计算机学会“科学技术奖自然科学一等奖”，中国人民大学本科生课外教学优秀指导教师。
