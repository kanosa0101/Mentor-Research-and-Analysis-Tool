bio_raw: 陈红，女，工学博士、教授、博士生导师。中国计算机学会数据库专业委员会常务委员、大数据专家委员会委员、物联网络专业委员会委员。作为项目负责人主持国家重点研发计划项目、国家“核高基”重大专项课题、国家863计划项目、国家自然科学基金重点项目等项目30余项；在国内外学术期刊和学术会议上发表论文300余篇，出版数据库方面的著译作8部。参加了具有自主版权的并行数据库系统软件的研制，主持了具有自主版权的联机分析处理系列软件的研制。获国家科技进步二等奖、教育部科技进步一等奖和二等奖、北京市科学技术进步二等奖、北京市科学技术二等奖、中国计算机学会科技进步一等奖、北京市高等教育教学成果一等奖，主讲的《数据库系统概论》课程入选国家精品课程、国家精品资源共享课、国家精品在线开放课程、国家级线上一流本科课程、国家级线上线下混合式一流本科课程。2005年入选教育部新世纪优秀人才支持计划。
