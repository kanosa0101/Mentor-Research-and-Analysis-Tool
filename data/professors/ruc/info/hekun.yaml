bio_raw: 何昆，博士毕业于中科院计算所，曾任中科院计算所助理研究员、副研究员，获中科院院长特别奖、CCF优秀博士论文奖、计算所百星等荣誉。主要从事理论计算机领域尤其是概率方法的研究，解决多个由哥德尔奖得主、莱布尼茨奖得主提出的开放问题，在理论计算机顶会STOC、FOCS、SODA上发表论文多篇。
