bio_raw: 蒋洪迅，中国人民大学信息学院教授、博士生导师、研究生工委委员。主要研究领域为智慧医疗、推荐系统、运筹优化、具身智能、大模型智能体、供应链管理等信息系统和商务智能应用，利用前沿的人工智能和大数据技术解决管理决策中的复杂问题，在管理科学和工程领域顶级期刊包括ACM
  Transactions on Information Systems (TOIS)、Decision Support Systems (DSS)、Information
  Sciences (IS)、Omega、Journal of Informetrics (JOI)等国际期刊和计算机科学与技术领域的国际会议AAAI、ACM MM、ACM
  CSCW等上发表研究论文60余篇，任DSS、JOI、IS等多个国际期刊和ACM、IEEE国际顶级会议的同行评审员。授权国家发明专利十余项，软件著作权若干。主持国家自然科学基金、教育部人文社科项目、北京市社科基金重点项目、中国人民大学科研基金重点项目等科研项目多项。
