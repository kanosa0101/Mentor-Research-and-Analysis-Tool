bio_raw: 周季蕾，女，博士，副教授，硕导，中国人民大学杰出学者。主要研究领域为商务智能等领域的决策支持机制和方法研究。主持国家自然科学基金青年项目。曾在Decision
  Support System，International Journal of Electronic Commerce, Information Processing
  and Management, Electronic Commerce Research and Applications，Electronic Commerce
  Research，ICIS，ACM CSCW等主要学术期刊和会议上发表论文多篇。
