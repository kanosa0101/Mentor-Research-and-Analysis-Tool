bio_raw: 傅哲，男，中国人民大学讲师，北卡罗莱纳大学夏洛特分校计算与信息系统专业博士。主要研究领域为商务智能、智慧治理、大数据决策、多媒体分析、生成式人工智能等。曾在INFORMS
  JOC、POM、I&M、ACM CSUR、ACM TKDD、ACM TORS、Decision Sciences、信息系统学报等国内外顶级学术期刊，以及SIGIR、ACL、EMNLP、PAKDD、HICSS、PACIS、AMCIS等重要学术会议发表论文20多篇，获PACIS
  2024 最佳论文奖。
