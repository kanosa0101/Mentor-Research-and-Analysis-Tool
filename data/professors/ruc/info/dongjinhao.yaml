bio_raw: 董谨豪，博士，中国人民大学信息学院讲师，入选中国人民大学「吴玉章青年英才」计划，任职于杜小勇教授所在的数据工程与知识工程教育部重点实验室。2025
  年于北京大学计算机学院获得计算机软件与理论博士学位（导师：郝丹 教授），2016—2020 年就读于西安电子科技大学计算机学院软件工程专业。博士期间于 2023—2024
  年在新加坡国立大学计算机学院担任访问学者。
