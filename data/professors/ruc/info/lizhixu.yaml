bio_raw: 李直旭，男，博士，中国人民大学信息学院教授、博士生导师。主要研究方向为大语言模型、知识图谱、数据治理、自然语言处理、多模态数据智能等。主持国家和省部级科研项目10余项，在领域主流期刊和国际会议如TKDE、ICDE、ACL、AAAI、IJCAI、MM等上发表论文200余篇，获得发明专利授权60余项，长期与人工智能头部公司保持产学研合作，有着丰富的人工智能与大数据技术的研究与实践经验。
