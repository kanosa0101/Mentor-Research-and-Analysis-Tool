bio_raw: 张帆进，博士，现任中国人民大学信息学院吴玉章青年英才（讲师）。博士毕业于清华大学，本科毕业于南京大学。研究方向包括数据挖掘、知识图谱、大语言模型。在KDD、TKDE、ACL、WWW等CCF-A类会议期刊发表论文十余篇，谷歌被引3000余次。曾在微软、腾讯及智谱公司实习与合作。
