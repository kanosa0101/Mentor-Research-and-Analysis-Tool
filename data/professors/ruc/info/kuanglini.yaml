bio_raw: 匡丽妮，女，博士，讲师。主要研究领域为智慧健康、智慧教育、生成式人工智能等。主持国家自然科学基金青年项目和中国博士后基金面上项目。曾在Production
  and Operations Management, Journal of Management Information Systems, ICIS等主要学术期刊和会议上发表论文多篇。
