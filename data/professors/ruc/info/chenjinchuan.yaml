bio_raw: 陈晋川，工学博士, 中国人民大学信息学院教授、博士生导师，中国计算机学会数据库专委会委员。曾获国家级教育成果奖二等奖、北京市高等教育教学成果奖一等奖。长期从事分布式数据管理、区块链方面的研究，在VLDB、ICDE、VLDBJ等数据库领域国际会议期刊发表高水平论文30余篇，曾获ICWS2023最佳论文、FCS
  Outstanding Paper Award。主持国家重点研发项目课题、国家自然科学基金等国家级科研项目，作为核心成员参与重点研发、核高基、973等重大项目。
