bio_raw: 李翠平,女,工学博士，教授,中国计算机学会杰出会员，大数据专家委员会常务委员，数据库专委会委员。2003年毕业于中科院计算所获得博士学位，2008年在美国UIUC大学计算机系访问交流。目前研究方向为大数据分析与挖掘、基于机器学习的数据库系统、深度学习、图表示学习、社会网络分析、自然语言处理及推荐系统等。主持和参与国家自然科学基金、973、863等10多项国家级和省部级项目，先后在SIGKDD、SIGMOD、VLDB、EDBT等重要国际会议和TKDE、KAIS、JCST、软件学报等国内外期刊发表论文100多篇，出版著作3部，申请国家发明专利6项，获得软件著作权登记2项。2007年入选北京市委组织部优秀人才培养资助计划。2009年入选教育部新世纪优秀人才支持计划。2011年获得中国计算机学会“青年科学家奖”。
