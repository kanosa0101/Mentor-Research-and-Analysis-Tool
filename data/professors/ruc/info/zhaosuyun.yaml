bio_raw: 赵素云，于2009年香港理工大学毕业，现为中国人民大学信息学院教授、博士生导师。目前，主要研究方向为机器学习、深度学习与计算机视觉。具体为智能数据标注、多模态文本识别、安全可控生成、大模型安全风险控制、小样本与低成本学习、复杂环境机器学习理论与泛化性分析等。现为中国计算机学会数据库专委会执行委员，中国人工智能学会
  知识工程专委会委员。参与并主持国家自然科学基金项目多项。作为主要参与人员参研国家自然科学基金重点项目、973项目和核高基项目等多项国家级重大科研项目。现已发表学术论文60余篇，其代表性文章分别发表在人工智能领域顶级会议或期刊TPAMI,
  CVPR, AAAI, ICCV, ICML, ICDE, IJCAI, ECAI, TKDE, TFS, TCyberB等。现为ICLR, ICML, CVPR,
  ECCV, ACMMM, ICMR, TKDE, TFS, TCyberB, INS, PR等国际权威会议或期刊的审稿人。
