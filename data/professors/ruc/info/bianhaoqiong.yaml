bio_raw: 卞昊穹，副教授，研究生导师，入选国家和北京市海外引才项目，以第一发明人获得中国专利金奖。研究方向为面向人工智能和大数据分析的高性能数据系统。曾在国际顶尖数据系统团队EPFL
  DIAS Lab负责云原生数据系统研究、在腾讯公司从事分布式数据库内核研发，具有学术界和工业界双重研发背景，长期在一线负责关键算法和系统架构研发，坚持研究工作来自实际问题、应用于实际系统。自2017年以来主持研发开源云数据湖仓引擎Pixels
  (https://github.com/pixelsdb/pixels)，在SIGMOD、ICDE等CCF A类会议发表论文多篇，获得多个产研重点合作项目支持，应用于多个企业级数据库产品，其中部分关键技术编入大数据领域国家标准。
