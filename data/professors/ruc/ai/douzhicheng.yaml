title: 教授
bio_raw: '中国人民大学高瓴人工智能学院副院长、教授、长聘教授、博士生导师，现任中国计算机学会大数据专家委员会秘书长，中文信息学会理事、信息检索专委会副主任。主要研究兴趣为智能信息检索、智能体、大模型检索增强、AI搜索、司法智能等。在国际知名学术会议和期刊上发表论文200余篇，带领团队研发涉外法治大模型，开源大模型检索增强工具包FlashRAG、iAgent系列信息智能体（WebThinker、ARPO、DeepAgent等）累计获得GitHub星标1万余枚。曾获教育部自然科学一等奖，国际信息检索大会SIGIR
  2013最佳论文提名奖，国际万维网会议TheWebConf 2023 Spotlight Best Paper提名奖、全国信息检索学术会议CCIR 2021最佳论文奖等奖励。个人主页：

  http://playbigdata.ruc.edu.cn/dou/

  点击访问个人主页'
