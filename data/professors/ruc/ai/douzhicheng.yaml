research_direction_raw: 智能体 (Agent) - agentic RL, self-evolving, long-horizon tasks, OPD/OPSD, data/enviroments, memory & skills, auto-harness, etc.；后训练（Post Training）；AI自演进（RSI、Self-Evolving）；搜索智能体、智能体搜索、AI搜索（Agentic Search）- wide & deep search task, deep research, search strategy, information reliability, report quality, etc.；科学推理与智能体（Scientific Reasoning & Agent, Auto Research, AI-Scientist）；检索增强的大模型（Retrieval Augmented Generation）；多模态与跨模态（Multi-modal AI）- multi-modal agents, multi-modal embedding & search, agentic photo/album search, agentic long video understanding, etc.；数据智能体（Data Agent）；GUI智能体 (GUI Agent)；生成式检索（Generative Retrieval）；对话式搜索（Conversational Search）；大语言模型（Large Language Model）；预训练模型（Pretrained Models）；智慧司法（Legal AI) & 涉外法治大模型；个性化搜索、对话与推荐（Personalized Search, Dialogue, and Recommendation）；多样化搜索与推荐（Diversified Search and Recommendation）
