title: 教授
bio_raw: '徐君，中国人民大学高瓴人工智能学院教授、长聘教授、博士生导师。曾就职于微软亚洲研究院、华为诺亚方舟实验室（香港）和中科院计算所。研究领域为互联网搜索与推荐，在重要国际期刊和会议发表论文超过100篇，出版英文专著2本、中文教科书1本。论文获SIGIR
  2019时间检验提名奖、SIGIR 2024最佳论文提名奖、SIGIR-AP 2023和2024 最佳论文奖、CIKM 2017 最佳论文第二名和CCIR 2022最佳论文奖，被提名WWW
  2023最佳论文和SIGIR 2024最佳短文。获教育部自然科学奖一等奖、北京市自然科学奖二等奖。担任学术会议 SIGIR和NeurIPS领域主席，是学术期刊ACM
  TIST副主编和JASIST编委，主持多项国家重点研发计划项目/课题和国家自然科学基金项目 。 谷歌学术主页：https://scholar.google.com/citations?user=su14mcEAAAAJ
  ; 研究小组主页：https://ruc-iir-lab.github.io/

  点击访问个人主页'
