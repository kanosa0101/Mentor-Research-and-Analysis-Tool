bio_raw: 中国人民大学高瓴人工智能学院讲师。2026年获瑞士洛桑联邦理工学院（EPFL）博士学位，曾任加州大学洛杉矶分校（UCLA）访问学者。主要研究方向为机器学习理论与优化，重点从优化理论视角研究神经网络的训练动力学；同时也将优化方法应用于可信大模型研究。在
  NeurIPS、ICML、ICLR、IEEE TPAMI 等人工智能领域重要会议和期刊发表论文10余篇。曾组织瑞士洛桑联邦理工学院数字信任中心大模型微调陷阱研讨会，并协助组织
  NeurIPS 2024 FITML 研讨会。曾获瑞典皇家理工学院年度奖学金。长期担任 NeurIPS、ICLR、ICML、AISTATS、IJCV、TMLR
  等国际会议和期刊审稿人。
