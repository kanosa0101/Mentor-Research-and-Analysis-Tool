bio_raw: '返回列表

  邮箱：ybma1998@ruc.edu.cn

  个人网页：--

  马彦彪于2020年和2025年获得西安电子科技大学学士和博士学位。主要关注多模态大模型视觉理解，模态统一范式，长尾学习和联邦学习领域的研究。以第一作者在TPAMI、IJCV、CVPR、ICLR等人工智能领域顶级期刊发表论文10余篇，曾获6项由IGARSS、CVPR、ICCV等举办的国际竞赛冠军。长期担任TPAMI、CVPR、NeurIPS、ICLR等期刊和会议的审稿人。'
