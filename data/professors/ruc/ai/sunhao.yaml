bio_raw: 孙浩，现任中国人民大学高瓴人工智能学院副院长、长聘教授、博导，国家青A项目获得者（原国家杰青）。哥伦比亚大学博士、麻省理工学院博士后，先后任美国匹兹堡大学、美国东北大学终身序列助理教授、中国人民大学高瓴人工智能学院长聘副教授，曾入选国家高层次青年人才。从事智能科学计算理论方法与前沿交叉研究。以第一/通讯作者在Nature
  Machine Intelligence（2篇）、Nature Computational Science（封面文章）、Nature Communications（3篇）等国际一流期刊和ICLR、NeurIPS、KDD、ICML等计算机顶会发表及录用论文80余篇，发表其他合作论文30余篇。主持国家青年科学基金A类（原国家杰出青年科学基金）项目、国家高层次人才计划青年项目、国家自然科学基金（重大培育、面上）、美国科学基金（重点、面上、专题）等科研项目十余项。先后获得福布斯北美30位30岁以下精英榜（科学类）、美国十大华人杰出青年、中国智能计算科技创新人物、AI100先锋青年等荣誉。
