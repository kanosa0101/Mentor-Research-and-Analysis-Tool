bio_raw: '张瑞，现任中国人民大学讲师，青年英才。于2024年获得中国科学院数学与系统科学研究院理学博士学位。2024年至2026年在中国人民大学高瓴人工智能学院从事博士后研究工作。主要研究方向为智能科学计算，关注物理规律与人工智能的深度融合，以及面向复杂物理系统的模拟、反演、控制与优化，相关成果应用于汽车与飞行器优化设计、极端天气预警与防灾减灾、油气能源勘探等重要场景。主持国家自然科学基金青年项目及多项国家重点研发计划子课题，累计负责科研经费 400 余万元。作为第一或通讯作者，已在 National
  Science Review、IEEE TPAMI、ICML、KDD、AAAI 等国际重要期刊与会议上发表论文十余篇。

