bio_raw: '赵鑫，中国人民大学高瓴人工智能学院教授，长聘副教授，国家优青项目获得者。2014年7月于北京大学获得博士学位，随后进入中国人民大学工作至今。研究领域为信息检索与自然语言处理，共计发表论文200余篇，谷歌学术引用1.8万余次，曾主导研发了伯乐（推荐系统库RecBole）、妙笔（文本生成库TextBox）等开源工具，组织编写了大语言模型综述论文《A
  Survey of Large Language Models》(预印版文章)，《大语言模型》中文书。荣获2020年吴文俊人工智能优秀青年奖、ECIR 2021时间检验奖（Test
  of Time Award）、RecSys 2022最佳学生论文提名（Best student paper runner-up）、CIKM 2022最佳资源论文提名（Best
  resource paper runnerup）等，入选中国科协青年人才托举工程、北京智源青年科学家、CCF-IEEE CS青年科学家。研究成果荣获教育部自然科学奖一等奖，北京市自然科学奖二等奖，中国计算机学会自然科学奖二等奖等。

