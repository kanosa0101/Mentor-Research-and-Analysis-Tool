bio_raw: '中国人民大学高瓴人工智能学院讲师。主要研究方向为多模态感知与机理等。在TPAMI、NeurIPS、ICML、CVPR等人工智能顶级期刊及会议发表论文10余篇。多篇论文入选NeurIPS、CVPR等会议口头报告。代表性工作包括关注异质模态信息有效利用的平衡多模态学习算法OGM、围绕模态特性的多模态大模型参数高效微调算法MokA等。曾入选CVPR
  Doctoral Consortium；曾荣获百度奖学金、中国人民大学吴玉章奖学金等。长期担任TPAMI、NeurIPS、ICML、CVPR等期刊和会议的审稿人。

  点击访问个人主页'
