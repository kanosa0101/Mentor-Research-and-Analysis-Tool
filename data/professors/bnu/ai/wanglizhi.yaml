bio_raw: 王立志，教授、博士生导师、国家优青。2011年和2016年在西安电子科技大学获得工学学士和工学博士学位，博士期间入选微软亚洲研究院（MSRA）联合培养项目，于2013年至2016年在微软亚洲研究院实习。主持多项国家级项目，包括国家优秀青年科学基金项目、应用创新装备预研项目、国家自然科学基金面上项目，主持多项企业委托项目，包括华为、OPPO、兵科院、航天五院。发表论文50余篇，包括TPAMI、IJCV、TIP等CCF
  A类期刊和CVPR、ICCV、MM等CCF A类会议，担任IEEE TIP编委（Associate Editor）。荣获CCF A类会议ACM MM 2022最佳论文提名奖、中国电子学会2018年度优秀博士学位论文奖、IEEE
  VCIP 2016最佳论文奖、北京市优秀本科毕业设计指导教师。
