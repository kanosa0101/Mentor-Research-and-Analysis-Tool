bio_raw: '2006年9月起就读于北京交通大学思源班（理科实验班，核心理学课程按照北京大学的理学培养模式进行），培养了较为扎实的理论基础。2010年9月被推免直接攻读博士学位，重点参与了3项科技部973课题、国家自然基金等国家级课题。2013年10月至2015年11月在美国劳伦斯伯克利国家实验室进行合作研究，并作为项目研究员主持了2项美国劳伦斯伯克利国家实验室开放项目。依托上述科研项目发表的多篇论文曾入选高被引论文或实现了重要的成果转化。获得国家奖学金、北京市优秀毕业生、智瑾奖学金、专项奖学金、一等学习奖学金等荣誉三十多次，并作为优秀毕业生代表在校毕业典礼上发言。入职北京师范大学以来，在项目完成、论文发表、国际合作、成果应用等多个方面取得了丰硕成果。

  在项目完成方面，已经主持完成或正在主持完成2项国家自然科学基金项目、3项科技部高端外国专家引进计划项目、6项美国劳伦斯伯克利国家实验室开放项目，并作为骨干成员重点参与了10余项国家级、省部级或其它高水平科研项目。

  在论文发表方面，每年稳定地发表多篇高水平期刊、会议论文，并成功指导了多位同学发表高水平期刊、会议论文。担任《

  Future Generation Computer Systems

  》（中科院一区TOP期刊），

  《

  Software: Practice and Experience

  》

  （CCF B类期刊）

  等国际期刊的特邀编委，并作为审稿人常年为IEEE TRANSACTIONS ON IMAGE PROCESSING, IEEE TRANSACTIONS ON
  MULTIMEDIA，PATTERN RECOGNITION, NEUROCOMPUTING, JOURNAL OF VISUAL COMMUNICATION
  AND IMAGE REPRESENTATION，SIGNAL PROCESSING: IMAGE COMMUNICATION等知名期刊审稿。

  在国际合作方面，作为美国劳伦斯伯克利国家实验室的客座项目负责人，和美国劳伦斯伯克利国家实验室保持稳定、高效的合作，连续承担该实验室的高水平开放项目。已经将图像修复、图像去噪、三维重建等技术较好地应用于生命科学领域，并在劳伦斯伯克利国家实验室、南京大学进行了多次报告，多位顶级的科学家高度评价了相关科研成果。

  在成果应用方面，将多项技术或模型成功应用到了教育、文化、心理等领域。已经申请或协助其它科研机构、企业申请国家发明专利数十项，为多项国家标准的制定提供了直接的支撑。'
