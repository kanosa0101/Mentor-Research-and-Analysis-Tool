bio_raw: '目前从事的主要研究方向为计算智能及其在交叉学科中的应用，包括：天文、地理、脑科学、心理、医学、教育等。致力于探索新一代机器学习模型的核心机理与性能边界，深入研究神经网络的自动构建与动态演化规律，旨在赋予机器智能应对持续变化环境的终身学习能力，为开发更具适应性和鲁棒性的AI系统提供理论基石。同时，在智能特征提取与多源信息融合的建模方法论上进行了系统性探索，通过创新性地整合现代学习理论与传统原则，显著提升了模型在复杂场景下的语义理解与知识发现能力。目前重点关注人工智能在教育领域的应用，探究智能化多模态可解释的课堂教学质量分析系统，做过多场人工智能赋能教师的讲座。

  到目前为止发表了具有较高水平的学术论文100余篇，主持了多项国家自然科学基金项目，并参与了多项国家自然科学基金重点项目和科技部的重大研发计划。并出版了多部著作和教材，还主持和参与了多项北京师范大学教改项目及北京市精品课程项目。'
