bio_raw: '黄永祯

  ，湖南郴州人，2006年毕业于华中科技大学获学士学位，2011年毕业于中国科学院自动化所获博士学位(师从谭铁牛院士),现任北京师范大学教授、多模态感知与计算团队负责人，研究方向包括计算机视觉、多模态大模型、具身智能、AI4Science等。

  黄永祯博士在人工智能领域出版专著1部并发表论文130多篇，

  引用约9000次，入选2025年全球前2%顶尖科学家榜单（斯坦福大学(Stanford University)与爱思唯尔(Elsevier)共同发布），

  获近100项专利授权和10多项荣誉奖励，如中国专利优秀奖、中国科学院科技成果转化一等奖、北京市科学技术二等奖、天津市科技进步特等奖、中国图象图形学学会科技进步二等奖，入选国家万人计划青年拔尖人才、北京市科技新星、中科院青促会、北京市青年骨干人才、华为昇腾MVP等。黄永祯博士现任/曾任中国图象图形学学会理事和视觉检测专委会副主任、中国计算机学会计算机视觉专委会委员、中国人工智能学会模式识别专委会委员、国际期刊Neurocomputing编委以及10多个国际会议的程序委员会委员。'
