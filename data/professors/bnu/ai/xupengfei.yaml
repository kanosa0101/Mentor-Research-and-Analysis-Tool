bio_raw: 北京师范大学程序设计竞赛队主教练，近五年指导队伍获ICPC/CCPC获金/银牌三十余枚。主要研究方向为机器学习、人工智能教育，发表相关论文四十余篇。主要教授课程为《信息竞赛师资培训》。
