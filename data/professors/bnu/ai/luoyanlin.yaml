bio_raw: 主要研究领域是虚拟现实和可视化，包括:（1）针对目前基于虚拟现实的虚拟学习环境远不能满足直观、自然和高效操作等问题，研究智能体交互技术,支持视觉、听觉、力触觉多感官交互学习；（2）为了提高大规模体数据可视化的质量和效率，研究基于半自动传递函数设计的GPU体绘制算法，解决遮挡、多模态数据三维融合等问题；（3）研究虚拟手术路径规划算法以及手术工具的精细模拟。
