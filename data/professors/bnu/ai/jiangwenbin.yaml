bio_raw: 姜文斌，北京师范大学人工智能学院教授，当前研究领域为认知计算与大语言模型。2011年至2017年在中国科学院计算技术研究所先后任助理研究员和副研究员，2014年起负责自然语言处理研究组。2015年至2017年在中国科学院大学兼任岗位教授。2017年至2023年在百度先后负责通用推理前瞻研究组和文心一言推理能力建设组，2022年通过北京市人才通道晋升正高级工程师。2024年起在北京师范大学人工智能学院任教。长期从事自然语言处理方面的研究工作，主持和参与多项国家自然科学基金、科技部863计划等项目，发表学术论文60余篇，获得专利授权20余项，部分成果在多个知名企业、国防安全部门、百度核心业务等场景得到应用。获得北京市科学技术奖、中科院青促会人才计划、百度十大前沿发明等奖项，担任中国科协工程领域评审专家、中国中文信息学会青年工作委员会委员、中国计算机学会自然语言处理专委会委员等公益职责。
