bio_raw: '1999-2012年，先后在中科院计算所、清华大学、多伦多大学、北京师范大学从事面向集成电路辅助设计的电子设计自动化(EDA)教学与科研工作，发表科研论文100余篇，主持完成了国家科技部863课题1项、国家自然基金面上项目2项。

  2013年至今，长期专注于课堂教学智能评价(CTIE)及其相关方向的教学研究，先后从事课堂教学智能评价、教育数字化技术、教育数字化转型理论与实践等领域的教学研究，关注作弊行为智能监测与智慧考场建设、教学行为智能分析与评价、智能认知诊断与个性化教学、互动教学场景下创新能力智能评价、教育大模型在学科教学创新中的应用、课堂研究数字化转型、高校督导数字化转型等教研工作，发表研究论文30余篇，申请与授权专利5项，主持与参与科研项目8项，其中主持国家科技部重点研发项目子课题2项，先后出版国内首部CTIE专著《课堂教学自动评价：从理论到应用》和首部CTIE教材《课堂教学智能评价简明教程》。'
