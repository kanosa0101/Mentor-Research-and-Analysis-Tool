bio_raw: 别荣芳，教授，博士生导师，北京师范大学知识区块链研究中心主任。1996年毕业于北京师范大学，获理学博士学位，后留校工作至今。2003年获得国家留学基金资助，访问英国剑桥大学计算机系。长期以来主要从事数据库与数据挖掘、物联网中的知识工程等重要领域的基础理论及应用的创新性研究。近年来重点开展了区块链技术在知识成果和教育资源共享传播、价值认定、安全存储等方面的应用研究，以及基于区块链的在线教育评估与认证系统架构，为构建公平、健康、开放的在线教育环境提供解决方案。主持完成和参与多项国家863项目、国家自然科学基金项目、以及多项国际合作、市级和横向科研项目，曾获得多项北京市和校级奖励。近五年以来，在国内外学术刊物和国际国内学术会议上合作发表学术论文40余篇，合作出版学术著作一部，译著多部，主持或者参与编写教材多部。为本科生、研究生开设数据库系统原理、大型数据库、数据挖掘、智能计算方法等多门课程，已培养计算机专业的硕士研究生30余人。主讲的“数据挖掘”课程获批成为教育部-IBM课程改革项目建设课程。
