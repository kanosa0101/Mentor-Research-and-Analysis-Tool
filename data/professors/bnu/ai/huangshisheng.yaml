bio_raw: '本人本科毕业于北京交通大学，免试推荐到清华大学计算机系直接攻读博士学位，并在清华大学计算机系从事博士后研究，导师均为胡事民教授，2021年7月入职北京师范大学人工智能学院，现为北京师范大学人工智能学院副教授、博士生导师，虚拟现实应用教育部工程中心主任助理，研究方向为计算机图形学、虚拟现实，近年来在计算机图形学、虚拟现实等相关领域发表论文40篇，其中包括ACM
  SIGGRAPH/Asia、ACM TOG、IEEE TVCG等CCF-A类论文30篇，GoogleScholar它引>1000(HIndex=16)，主持国家自然科学基金面上项目/青年基金、国家重点研发计划子课题项目、中国博士后科学基金面上项目等项目，作为课题骨干参与国家自然科学基金重点项目、国家重点研发计划项目、科技创新-2030重大项目等4项，主持CCF-百度松果基金、小米学者科研基金等项目，获北京师范大学19届青年教师教学比赛特等奖（理科组第一名）等荣誉。

  个人学术主页：

  https://shishenghuang.github.io/index/'
