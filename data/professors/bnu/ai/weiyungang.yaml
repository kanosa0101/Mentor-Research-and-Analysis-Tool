bio_raw: 北京师范大学智能计算与软件研究中心副主任。主要研究人工智能与教育，利用技术促进学科学习。关注虚拟世界、游戏化学习、STEAM教育、软件工程等，主要应用领域覆盖中小学英语、语文、数学、编程、音乐以及信息科技等。发表相关领域专业学术论文三十余篇，主编出版书籍三部，承担各类科研项目十余项。担任北京市高等教育学会计算机教育研究分会常务理事，
  入选全国万名优秀创新创业导师人才库、中国高校创新创业教育研究中心专家库。
