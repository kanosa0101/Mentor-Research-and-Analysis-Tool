bio_raw: 李健，北京师范大学人工智能学院副教授、博士生导师，智能媒体计算实验室（黄华教授团队）成员。2020年获中国科学院大学博士学位，2024年9月起在北京师范大学任教。主要研究大模型信息压缩与高效智能体，长期关注机器学习中的信息压缩、计算效率与泛化理论，并开展教育智能体系统研究。已发表高水平学术论文40余篇，其中以第一作者在IEEE
  Transactions on Information Theory（IEEE TIT）、Journal of Machine Learning Research（JMLR）、Artificial
  Intelligence（AIJ）、ICML、NeurIPS、AAAI等人工智能领域顶级期刊和会议发表论文十余篇。近五年主持国家自然科学基金面上项目和青年项目、国家重点研发计划子课题、中国博士后科学基金、中央高校基本科研业务费等科研项目。曾入选微软亚洲研究院“铸星计划”、中国科学院特别研究助理、中科院信工所优才计划A类与B类，曾获PRICAI
  2021最佳学生论文奖。
