title: 教授
supervisor: 博导、硕导
subjects: 081200计算机科学与技术
bio_raw: '2003年6月于华中科技大学计算机学院获工学博士学位；2005年6月于清华大学计算机系博士后流动站出站，获博士后证书；2010年入选“教育部新世纪优秀人才支持计划”；2012年7月晋升教授。

  研究方向：AI+；数据与知识工程。先后在Nature子刊，IEEE Transactions on Knowledge and Data Engineering,
  IEEE Transactions on Parallel and Distributed Systems, Information Science, Future
  Generation Computer Systems, Journal of Systems & Software, Intelligent Data Analysis, Physica
  A, 计算机学报、计算机研究与发展等国内外重要学术期刊和会议上发表学术论文60余篇，获批中国软件著作权登记8项。

  主持北京师范大学首批本科大规模在线开放课程建设项目（数据库系统原理），出版教材《数据库应用、设计与实现》和《数据库系统原理与实践》（北京: 清华大学出版社）；主讲过操作系统(北京师范大学精品课程)、计算机组成原理等课程。'
