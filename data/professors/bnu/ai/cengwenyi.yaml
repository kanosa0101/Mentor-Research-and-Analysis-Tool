bio_raw: 主要从事模糊信息处理方面的研究及应用工作，在模糊系统理论、近似推理、模糊控制及模糊决策等方面开展研究，特别针对模糊系统的信息测度（贴进度、模糊度、包含度、距离）、近似推理、变权决策、模糊数据分析及其应用等领域。主持国家自然科学基金和教育部留学回国人员科研启动基金项目各一项，参加多项国家自然科学基金项目，在“FUZZY
  SETS AND SYSTEMS”、“INFORMATION SCIENCES”、“APPLIED MATHEMATICAL MODELLING”等期刊发表学术论文130余篇。
