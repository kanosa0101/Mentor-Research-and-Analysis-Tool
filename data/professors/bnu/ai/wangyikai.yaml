bio_raw: '王一凯，人工智能学院副教授，博士生导师。2017年6月获得西安交通大学电气工程及其自动化专业学士学位；2022年6月获得清华大学计算机科学与技术专业博士学位，师从孙富春教授。研究方向包括深度多模态融合感知、多模态生成、具身智能等科研领域，学术论文发表于TPAMI、NeurIPS、ICLR、CVPR等国际顶级期刊和会议50余

  篇，

  以第一作者

  /

  通讯作者在国际顶级

  期刊TPAMI上发表3篇。

  申请国家（国际）发明专利公开20项，授权8项。系列工作GitHub开源代码累计获得8000余星。主持国自然面上基金、青年基金、博士后基金、华为学术基金项目，入选中国人工智能学会博士

  学位论文激励计划

  、北京市青年人才托举工程和中国自动化学会青年人才托举工程

  。'
