title: 教授
supervisor: 博导、硕导
bio_raw: '北京师范大学人工智能学院副院长、智能技术与教育应用教育部工程研究中心副主任，教授，博士生导师。主持多项国家自然科学基金项目、国家重点研发项目子任务、以及企业合作项目，参与多项国家和省部级项目。代表性成果包括多模态教育知识图谱构建及概念认知关系发现、多源异构知识图谱实体对齐、

  多源知识驱动的协同表征与自适应推理等。研究成果发表于

  ACL

  、

  AAAI

  、

  EMNLP

  、

  ISWC

  、

  WWW

  等顶级会议和

  KBS

  、

  JCST

  等学术期刊。目前为中文信息学会理事、中国计算机学会公益工作委员会执行委员。曾担任

  CCKS2025

  、

  CCKS2024

  程序委员会主席，以及

  WWW

  、

  AAAI

  、

  IJCAI

  、

  ACL

  、

  EMNLP

  、

  ISWC

  等学术会议的程序委员会委员。'
