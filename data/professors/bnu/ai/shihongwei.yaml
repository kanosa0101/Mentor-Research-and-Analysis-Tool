bio_raw: '石红薇于2023年6月博士毕业后入职北京师范大学人工智能学院，任双肩挑辅导员、讲师，主要从事计算机网络、区块链理论与应用、联邦学习、数据安全治理与隐私保护等方向的研究。主持/参与国家重点研发计划、科技创新
  2030—“新一代人工智能”重大项目、国家自然科学基金面上项目、青年项目、中央高校基本科研业务费资助项目等，在IEEE/ACM  ToN、TMC、TDSC、TSC等国际高水平期刊和会议上发表论文十余篇，现为IEEE国际标准《Guide
  for Privacy-preserving Computation-based Price Mechanism for the Data Element Market》(P3823)工作组专家，多个领域顶级期刊/会议审稿人。曾获北京市第十四届青年教师基本功比赛（理科）二等奖、最受学生欢迎奖；北京师范大学第十九届青教赛（研究生理科组）特等奖、最受学生欢迎奖、最佳教案奖；北京师范大学高等教育教学成果奖一等奖（2项）。

  欢迎具有扎实数理基础、编程能力，较强内驱力和责任感，热爱科研的同学积极加入，请有意攻读硕士研究生和科研实习生的同学尽早联系。我相信，科研是一场共同的冒险，我们是伙伴，是战友，期待共同探索科研世界！撒花~'
