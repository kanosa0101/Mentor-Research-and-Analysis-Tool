bio_raw: '郭宇博士，北京师范大学人工智能学院副教授，博士研究生导师，

  IEEE

  高级会员，

  CCF

  高级会员。主要从事隐私计算、人工智能安全等领域研究工作。2019年获得香港城市大学计算机科学博士学位，目前已在

  TDSC, TIFS, TPDS,TKDE,ICDE

  等国际知名期刊和会议发表论文四十余篇，并两次荣获会议唯一最佳论文奖，多次担任国际一流学术会议的程序委员会委员以及期刊审稿人工作。先后主持和参与了国家自然科学基金项目、科技创新2030课题、国家区块链创新应用试点以及包括CCF-蚂蚁隐私计算专项、退役军人事务部等横向课题研究。'
