bio_raw: '王川，博士毕业

  于清华大学，

  后分别在北京邮电大学和北京师范大学任教。主要从事量子计算和量子人工智能交叉领域的研究工作，至今在

  Light

  :

  Science & Applications,

  Science Bulletin

  ,

  Laser & Photonics Reviews,

  Photonics Research

  等国内外学术期刊上发表SCI论文150余篇，论文被SCI引用5000余次,申请\授权发明专利20项。主持完成国家自然科学基金优青项目，霍英东基金等多项国家级课题。目前承担国家自然科学基金重点项目、联合基金项目，研究成果曾获国家自然科学二等奖、中国通信学会自然科学二等奖等奖励。连续五年入选

  Elsevier

  中国高被引学者和斯坦福大学发布的全球Top 2%科学家榜单。现担任中国通信学会量子通信专业委员会副主任，中国计算机学会量子计算专委会执委，中国物理学会量子光学专委会委员和中国密码学会量子密码专委会委员；同时担任

  《Frontiers of Physics》编委，《量子光学学报》编委，《Science Bulletin》和《科学通报》特

  邀编委等。'
