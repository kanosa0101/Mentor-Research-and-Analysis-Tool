bio_raw: 田沄，北京师范大学人工智能学院教授、博士生导师、原人工智能系主任，主要从事智能媒体计算、人工智能相关研究。当前担任北京师范大学校工会副主席（兼职），UNESCO国际工程科技知识中心第四届顾问委员会委员，医学图像计算青年研讨会(MICS)副主席、计算机学会高级会员、中国图象图形学学会医学影像专委会委员。参与国家战略“新一代人工智能发展规划”起草工作。近年来，先后主持国家重点研发计划课题、国家自然科学基金项目、省部级及委托项目25余项，在国内外学术期刊和会议上发表论文70余篇，申请国家发明专利15余项，获北京市科学技术二等奖1项、北京市教育教学成果二等奖1项、吴文俊教学成果奖1项，主笔起草的“关于加快发展福建省新一代人工智能产业的建议”获省地方领导批示，2022年评为北京师范大学优秀共产党员，2024年获北京师范大学“领军人才计划”项目资助。
