bio_raw: 主要从事以人为中心的计算机视觉和多模态大模型等相关研究。目前在TPAMI、IJCV、TIFS和CVPR、ICCV、NeurIPS、ICLR等期刊和会议发表60余篇论文，其中CCF-A/IEEE
  Transactions论文50余篇，第一作者和通讯作者40余篇，Google引用次数6000余次。申明专利40余项，主持国家自然科学基金面上项目、青年项目、中央高校基本科研业务费专项资助项目，以及多个校企合作项目。获中国科学技术大学优秀博士论文和中国科学院院长奖，入选2023-2025北京市科协青年人才托举工程，连续入选（2024/2025）由Stanford和Elsevier发布的全球前2%顶尖科学家榜单。
