bio_raw: '张鸿文，北京师范大学人工智能学院副教授，博士生导师。主要从事虚拟数字人和人形智能体的运动捕捉、化身重建、具身交互与行为生成等研究，发表

  TPAMI/TOG/CVPR/ICCV/SIGGRAPH

  等

  CCF-A

  类顶刊顶会论文

  50

  余篇，包含口头报告/亮点论文7篇，

  Google Scholar

  引用量

  7000

  余

  次，一作提出的动捕系列开源算法累计获

  GitHub

  星标上千次，主持承担由国家自然科学基金委以及华为、联想等企业支持的多项科研项目，入选或获评中国科学院院长奖、中国科学院优秀博士论文、中国科协青年人才托举工程、斯坦福全球前2%顶尖科学家榜单等。'
