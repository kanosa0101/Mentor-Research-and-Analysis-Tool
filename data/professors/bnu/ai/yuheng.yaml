bio_raw: 北京师范大学人工智能学院副教授，2014年到2023年先后在三星北京研究院、搜狗、阿里巴巴和Shopee从事多语言信息处理技术的研究，并将其成功应用于面向全球电子商务的商业化场景，发表学术论文20余篇，获得ACL杰出论文奖，浙江省科学技术进步二等奖，达摩奖等荣誉。2024年起在北京师范大学任教，主要研究领域为大语言模型，表示学习，自然语言处理。欢迎感兴趣的老师、研究生和本科生随时通过邮件或微信联系进行学术交流与合作。
