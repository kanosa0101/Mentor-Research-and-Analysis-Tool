bio_raw: '张少魁，北京师范大学人工智能学院副教授、硕士生导师。他于2023年6月在清华大学计算机系取得博士学位；于2025年7月在清华大学计算机系博士后出站，均师从张松海教授。

  张少魁的研究方向为计算机图形学、虚拟现实和三维数字场景构建，主要讨论如何度量物体间的空间关联关系，基于几何算法/扩散模型/大模型/多模态输入/交互，以智能、高效且可控地构建三维场景。他已在相关领域发表八篇一作CCF-A类期刊/会议长文。

  张少魁目前主持国家自然青年科学基金项目、北京市自然科学基金面上项目。他还入选中国科协青年人才托举工程项目；先后两次作为骨干参与国家重点研发计划项目、作为骨干参与北京市科技计划项目。相关数字场景算法已在索菲亚、酷家乐、构家、不鸣科技应用。'
