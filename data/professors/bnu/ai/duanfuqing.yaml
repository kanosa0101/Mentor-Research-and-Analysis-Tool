bio_raw: 北京师范大学人工智能学院教授，博士生导师，教育部新世纪优秀人才，研究方向为计算机视觉、模式识别、文物三维数字化等，近年来主持国家自然科学基金、国家重点研发计划课题、子课题等多项国家级项目，获得国家发明专利10余项，发表高水平论文百余篇。研究工作获省部级科技奖励5项，研究成果在秦始皇帝陵博物院、公安部物证鉴定中心、故宫博物院等单位进行了应用。
