bio_raw: '钟方威，北京师范大学人工智能学院副教授，博士生导师。博士毕业于北京大学计算机学院，后在北京大学智能学院从事博士后研究。入选国家博士后创新人才支持计划、北京市科技新星计划，获
  ACM 中国人工智能分会新星奖、优秀博士论文奖等荣誉。

  主要研究方向为具身社交智能，聚焦面向类人智能体的认知建模与计算方法，研究智能体在物理与社会环境中的感知、推理、决策和学习能力，并探索相关研究与教育、心理等学科的交叉融合。

  （随时欢迎感兴趣的老师/同学们通过邮件联系交流、合作）'
