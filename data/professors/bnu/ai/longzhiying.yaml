bio_raw: 研究概况：基于各种神经影像技术，运用人工智能和计算机科学的基本理论、方法和技术手段，开展神经影像数据的分析、信息挖掘以及类脑计算模型等方面的方法学研究。与认知问题相结合，开展人脑的认知加工动态网络连接模型以及视觉信息加工的神经编解码模型研究。
