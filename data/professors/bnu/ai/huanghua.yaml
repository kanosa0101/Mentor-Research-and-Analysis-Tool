bio_raw: '黄华，北京师范大学人工智能学院教授，院长。2011年在西安交通大学破格晋升教授。2012年至2020年在北京理工大学计算机学院任教。2022年7月起在北京师范大学人工智能学院任教。

  主要从事图像/视频处理、计算摄像学、计算机图形学方面的研究工作。主持国家自然科学基金重点项目、国家重点研发计划项目等；发表学术论文百余篇，获授权国家发明专利60余项，部分成果在工业、互联网行业得到应用。

  兼任“新一代人工智能”科技创新2030重大项目管理专家组成员；中国计算机学会常务理事、学术工作委员会副主任；中国图像图形学会常务理事、多媒体专业委员会主任；中国自动化学会理事、副秘书长。'
