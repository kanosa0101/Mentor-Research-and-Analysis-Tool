bio_raw: '朱林，北京师范大学人工智能学院副教授。2022-2025年在北京理工大学计算机学院担任助理教授/副研究员，2018—2022年于北京大学计算机学院获得博士学位，2019—2021年在鹏城实验室人工智能中心访问交流。主要研究方向包括教育人工智能、大模型、OCR、计算机视觉、神经形态视觉以及图像视频处理等。

  近期的研究兴趣是围绕智能视觉理解与教育场景人工智能开展系统研究，在TPAMI、CVPR、ICCV、ICML、NeurIPS、AAAI、ACM MM等CCF-A类国际高水平期刊与会议发表论文40余篇，其中第一作者或通讯作者20余篇；担任 IEEE
  Transactions on Image Processing (TIP) 编委（Associate Editor），已授权国内外专利10余项。主持国家自然科学基金青年项目、博士后创新人才支持计划等科研项目，入选
  2024—2026年度北京市科协青年人才托举工程，曾获 中国图象图形学学会优秀博士论文提名 等荣誉。'
