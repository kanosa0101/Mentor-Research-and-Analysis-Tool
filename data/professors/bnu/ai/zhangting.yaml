bio_raw: 北京师范大学人工智能学院副教授， 2013年至2017年在微软亚洲研究院视觉计算组实习，2015年获微软学者奖学金，2017年起在微软亚洲研究院视觉计算组工作，2024年起在北京师范大学任教。主要研究领域为计算机视觉，包括视觉表征学习，多模态内容理解与生成等。欢迎感兴趣的老师、研究生和本科生随时通过邮件或微信联系进行学术交流与合作。
