bio_raw: 作为项目负责人，王胜灵博士获得了5项国家自然科学基金、2项国家重点研发计划子课题、1项国家科技重大专项子课题的资助，共发表论文100余篇，其中，第一作者代表性成果发表在中科院一区TOP国际期刊IEEE
  Communications、IEEE Wireless Communications、IEEE Network、中国计算机学会认定的 A类国际顶级期刊IEEE
  JSAC (中科院一区TOP期刊)、IEEE TPDS、中科院二区国际期刊IEEE TVT，以及中国计算机学会认定的 A类国际顶级会议IEEE INFOCOM
  2019，中国计算机学会认定的B类国际顶级会议ACM MOBIHOC 2017 (全球仅录用27篇正文)、IEEE ICDCS 2014/2019，作为第二作者兼通信作者的代表性论文发表在中科院一区TOP期刊IEEE
  Wireless communications、中国计算机学会认定的 A类国际顶级期刊IEEE TKDE、中科院二区期刊IEEE TVT，中国计算机学会认定的B类国际期刊Computer
  Networks，中国计算机学会认定的 A类国际顶级会议IEEE INFOCOM 2017、中国计算机学会认定的 B类国际顶级会议IEEE ICDCS 2017/2019。此外，王胜灵博士还获得相关领域重要国际会议WASA
  2010/2020以及ACM MobiCom Workshop CRAB 2013唯一最佳论文奖。
