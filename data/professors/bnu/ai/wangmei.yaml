bio_raw: '王玫，北京师范大学人工智能学院副教授，2022年博士毕业于北京邮电大学，研究兴趣包括计算机视觉、深度学习、模式识别等方向。已在

  IEEE TPAMI、IEEE TIP、PR、CVPR、ICCV

  等领域内重要期刊和会议发表论文近30篇，其中ESI高被引论文2篇，谷歌学术引用6900余次（截至2026年1月）。主持国家自然科学基金青年基金、中国博士后科学基金面上项目，参与国家重点研发计划、国自然面上、企业横向等多个项目。获邀担任

  IEEE TPAMI、IEEE TNNLS、IJCV、CVPR、ICCV、ECCV、ACM MM

  等期刊和会议的审稿人。获得2023年度北京图象图形学学会优秀博士学位论文奖、2022年北京邮电大学优秀博士学位论文奖，入选斯坦福大学“全球前2%顶尖科学家”。'
