bio_raw: '丁春涛，

  北京师范大学人工智能学院副教授、硕士生导师，主要从事

  边缘智能、

  多模态模型加速推理、

  模型压缩与量化

  等方向的研究

  。

  2018

  年

  4

  月至

  1

  2

  月

  赴

  香港理工大学

  访学，

  2019

  年

  11

  月至

  2020

  年

  11

  月

  赴

  美国密歇根州立大学访学。

  主持国自然

  面上项目、国自然

  青年基金

  项目及北京市自然科学基金

  -

  小米联合基金项目各

  1

  项。相关研究成果发表于

  IEEE TPDS

  、

  IEEE TMC

  、

  IEEE TSC

  等国际期刊

  ，

  以及

  IEEE CVPR

  、

  IEEE ICWS

  等国际会议

  ，

  累计

  发表论文

  5

  0

  余篇

  。

  其中

  ，

  1

  篇

  CCF A

  类论文

  获

  2024

  年度

  IEEE-CCF

  云计算最佳论文奖；博士学位论文

  获

  2022

  年度

  IEEE TCCLD

  杰出博士论文奖。'
