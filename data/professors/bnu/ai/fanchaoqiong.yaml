bio_raw: 主要从事强化学习、深度学习、类脑神经网络、智能决策等领域的研究。主持国家自然科学基金青年基金1项、中央高校基本科研业务费专项资助项目1项，以及多项企业横向合作项目；参与国家自然科学基金重点项目。近年来在IEEE
  TMC、TWC、Research等国内外知名期刊和会议上发表论文20余篇，申请专利10余项。
