bio_raw: 白璐，教授，博导，国家优青（2021，交叉学部首届优青）。英国约克大学计算机科学博士（2015），师从皇家工程院院士Edwin R. Hancock教授。荣获/入选教育部国家优秀自费留学生（2015），百度全球华人AI青年学者（2022），国际模式识别学会IAPR
  Newsletter下一代报道（2016，全球每年4位青年学者），全球前2%顶尖科学家榜单等。研究方向：结构模式识别、图机器学习、金融人工智能等。主持国家自然科学基金项目4项，以及其他纵/横向项目多项。累计发表国际权威期刊会议论文150余篇（CCF/CAA-A类及管理学部-A类近100篇），包括：10篇ESI高被引/热点，3篇IEEE/IAPR国际会议论文奖，1篇MICCAI
  2025最佳论文提名。完成项目《结构模式识别的理论、方法及其在金融人工智能的应用》，获2025年度中国计算机学会“CCF科技成果奖”（第一完成人）。部分成果应用于中国电信、科大讯飞等实际业务，或形成报告被“国家发展和改革委员会”采纳。担任国际权威期刊IEEE
  TNNLS，PR，NN，Humanities and Social Sciences Communications编委（Associate Editor）。曾作为责任客座编辑（Managing
  Guest Editor）组织期刊PR首个关于金融人工智能主题特刊。作为主编共同编写金融人工智能类教材《金融科技导论》与“教育部101计划”人工智能类核心教材《模式识别与数据挖掘》，作为副主编共同编写教材《智能金融》（2025年度北京市优质本科教材）。2015年7月至2024年4月任职于中央财经大学，并入选首批“龙马学者”（2018
  - 2021）。
