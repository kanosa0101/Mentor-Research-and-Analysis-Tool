bio_raw: 白璐，教授，博士生导师。国家优青（2021），教育部国家优秀自费留学生（2015），百度全球华人AI青年学者（2022），曾入选国际模式识别学会IAPR
  Newsletter下一代报道（2016，全球每年4位青年学者）。2015年1月于英国约克大学获博士学位，师从IEEE/IAPR Fellow、皇家工程院院士Edwin
  R. Hancock教授。主要研究方向：结构模式识别、图机器学习、金融人工智能、智能教育等。主持国自科优秀青年、面上、青年项目3项，及其他项目多项。累计发表国际权威期刊会议论文130余篇，代表性成果包括：国际权威期刊TPAMI、TKDE、TNNLS、TCYB、TVCG、PR、TITS、TASE、TGRS、TIM、INF，国际顶级会议ICML、NeurIPS、IJCAI、ICDE、AAAI、SIGIR、ECML-PKDD、ICDM、CIKM、MICCAI、EMNLP，以及国际会议最佳论文与管理学部A类期刊论文70余篇（CCF/CAA-A类60余篇）。其中，9篇入选ESI高被引/热点，5篇分别获IAPR“最佳科技论文奖”（ICPR
  2018）、IAPR意大利分会“Eduardo Caianiello最佳学生论文奖”（ICIAP 201）、国际管理学重要会议IEEE IEEM 2019“杰出论文奖”，MICCAI
  2025最佳论文提名，以及CCF 2024首届中国数字金融大会“优秀海报”（TNNLS 2023）与CCF 2025首届中国图机器学习会议“优秀海报”（AAAI
  2025）。获2025年度中国计算机学会“CCF自然科学三等奖”（第一完成人）。部分研究成果应用于科大讯飞、中国电信等企业实际业务，或形成报告被“国家发展和改革委员会”采纳。担任国际权威期刊Pattern
  Recognition（PR）、IEEE Transactions on Neural Networks and Learning Systems（TNNLS）、Neural
  Networks（NN）编委（Associate Editor），并曾作为责任客座编辑（Managing Guest Editor）组织PR期刊“基于图方法的金融大数据分析特刊”。担任中国计算机学会（CCF）计算机视觉专委会、人工智能与模式识别专委会、计算经济学专业组、数字金融分会执行委员；中国自动化学会（CAA）模式识别与机器智能专委会委员；中国图像图形学学会（CSIG）视觉大数据专委会委员。2015年7月15日-2024年4月1日曾任职于中央财经大学，并入选首批“龙马学者-青年学者”（2018-2021）。
