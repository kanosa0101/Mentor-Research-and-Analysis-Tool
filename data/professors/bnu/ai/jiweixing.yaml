bio_raw: '计卫星，教授，博士生导师，教育部智能技术与教育应用工程研究中心副主任，信息技术新工科产学研联盟副秘书长，

  ACM SIGOPS/ChinaSys

  执行委员。主要研究方向包括计算机体系结构、并行与高性能计算、代码分析与优化、大模型推理优化等，主持和参与国家自然科学基金项目、国家自然科学基金重点项目、国家重点研发计划等项目多项，在国内外著名期刊和国际会议（

  TPDS

  、

  TACO

  、

  PLDI

  、

  TCAD

  、

  ICSE

  、

  RTSS

  、

  FSE

  和

  DATE

  等）上发表论文多篇；获国家级和省部级教学成果奖各

  1

  项，出版专著

  1

  部，科普图书

