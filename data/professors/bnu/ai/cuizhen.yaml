bio_raw: '曾入选国家高层次青年人才计划，并获得江苏省杰出青年基金资助。研究涉及计算机视觉、模式识别等领域，近期主要聚焦于

  概率分布学习（扩散模型、概率流等）、图深度学习（Graph Deep Learning）与深度强化学习

  等理论/技术方向，及其在

  多模态内容感知与生成

  （如视频异常分析、网络多媒体理解、视频生成等）和

  AI4Science

  等方面的应用。

  以第一作者/通讯作者身份

  ，在Nature子刊、IEEE汇刊及CCF A类会议上发表论文近百

  篇，

  Google学术引用累计逾万次。'
