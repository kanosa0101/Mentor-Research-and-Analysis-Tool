bio_raw: 郭建伟，北京师范大学人工智能学院教授、博士生导师。主要研究方向为计算机图形学、虚拟现实、人工智能、虚拟仿真教育。迄今已在ACM SIGGRAPH/Asia、ACM
  TOG、IEEE TPAMI、IEEE TVCG、IEEE TIP、CVPR等高水平期刊或会议发表论文90余篇，授权发明专利18项。主持多项国家级项目，包括国家自然科学基金青年基金B类、国家重点研发计划课题、国家自然科学基金面上项目等，主持企业委托项目10余项，研究成果成功应用于工业智能制造、数字孪生、虚拟仿真等领域。曾荣获10项学术奖励，包括中国产学研合作促进会科技创新成果一等奖、中国体视学学会青年科学技术奖、CVMJ期刊年度最佳论文奖等。曾担任国际权威SCI期刊The
  Visual Computer、IET Image Processing编委及VCIBA和VRIH期刊青年编委。
