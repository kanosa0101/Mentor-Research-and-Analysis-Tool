bio_raw: '顾庆博士于2009年至今任职南京大学计算机科学与技术系教授，博士生导师。2001年6月获得南京大学计算机科学与技术系计算机软件与理论专业博士学位。1996年6月至南京大学计算机科学与技术系任教至今。主要研究领域包括分布计算与并行处理、软件质量与软件测试、复杂网络等。先后访问澳大利亚Swinburne大学、日本会津大学、香港理工大学等。多年来一直相继主持国家八六三高技术研究发展计划课题、国家自然科学基金项目等的研究；参与多项国家九七三重点基础研究发展计划、国家八六三高技术研究发展计划重点课题的研究。参研项目“分布和并行程序设计环境的研究”获江苏省科学进步二等奖。十五期间参与主持863软件专业孵化器技术支持中心工作。至2012年底，在“计算机学报”、“电子学报”、“软件学报”等国内计算机领域主要专业刊物，“IPDPS”、“PAKDD”、“COMPSAC”、“SAC”等国际会议上发表研究论文80余篇。累计申请并公示国家发明专利19项，目前已获得专利授权8项。

