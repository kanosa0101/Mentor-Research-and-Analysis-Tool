bio_raw: '黄书剑，博士，南京大学计算机学院教授，博士生导师。现任中国中文信息学会理事、大模型专家委员会委员、机器翻译和多语言处理专委会副主任；中国计算机学会高级会员、自然语言处理专委会执行委员；中国人工智能学会多语种只能信息处理专委会委员。主要研究方向包括机器翻译、大语言模型、多语言大模型等。在ACL、AAAI、IJCAI、Neurips、EMNLP、NAACL等自然语言处理和人工智能顶级国际会议发表论文50余篇，获EMNLP2024杰出论文奖、CCMT2019和CCMT2023最佳论文奖。2017年获江苏省自然科学基金优秀青年基金项目资助。2019年获中国中文信息学会杰出服务奖，2020年获中国计算机学会自然语言处理与中文计算奖-青年新锐奖，2022年获钱伟长中文信息处理奖-青年创新奖。联合指导博士生获中国人工智能学会优秀博士学位论文奖、中国中文信息学会优秀博士学位论文奖、江苏省人工智能学会优秀博士学位论文奖等荣誉。

