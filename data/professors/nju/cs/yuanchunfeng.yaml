bio_raw: '袁春风，1963年生，1987年毕业于南京大学计算机系，获工学硕士学位，教授。主要研究领域为多媒体文档处理、远程教学环境与资源建设、Web信息检索与挖掘技术等。在相关领域已承担科研项目近10项，发表论文近20篇，获江苏省科技进步二等奖两次。作为主要编著者编写计算机组成原理和有关多媒体处理方面的书籍教材4本，95年获国家教委优秀教材二等奖。

