bio_raw: '马晓星，1975年8月生，1993年进入南京大学计算机科学与技术系学习，于1997年、2000年和2003年分别获得学士、硕士和博士学位。现任南京大学计算机科学与技术系教授、博士生导师，南京大学计算机软件研究所副所长。其研究领域为计算机软件技术，近年来工作重点包括网构软件、自适应软件系统、软件在线演化等面向开放环境的软件新技术。主持承担包括国家自然科学基金项目、国家重大基础研究计划（973）课题、国家高技术研究发展计划（863）课题在内的多项国家级科研项目。在ICSE、FSE、ASE等国际会议和IEEE
   TSE、TC、TPDS、TSC以及CACM、IST、JSS等国际期刊和《中国科学》、《软件学报》等国内一级学报发表学术论文60余篇。曾任ICSE ''10  Education
  Track、SCORE ''11、SEAMS ''12-''14, ''16 等国际学术会议和竞赛的程序委员、Internetware  ''15程序委员会主席、《软件学报》责任编委。曾两次获得国家科技进步二等奖（2006年度/第二完成人，2011年度/第四完成人），两次获得教育部一等奖（2004年度/第三完成人，2010年度/第二完成人）；还曾获2009年度中创软件人才奖、2015年度东软－NASAC青年软件创新奖。2007年入选教育部新世纪优秀人才支持计划，2013年入选江苏省“333工程”第二层次培养对象。

