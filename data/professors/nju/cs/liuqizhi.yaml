bio_raw: '刘奇志，博士，南京大学计算机学院教授。现为中国计算机学会高级会员和数据库专委会执行委员。曾在英国伦敦大学学院访学。主要研究方向为高性能数据管理技术。参加

  /

  主持过国家自然科学基金项目、国家社科基金重点项目、国家

  “863

  计划

  ”

  项目、江苏省自然科学基金项目、江苏省高等教育教改研究立项课题及横向合作研发项目。长期承担“程序设计基础”教学任务，面向本科新生持续开展教学研究与改革。在

  SIGIR

  、

  DASFAA

  、

  APWeb/WAIM

  、

  NDBC

  、

  TKDE

  、南京大学学报和计算机教育等国内外学术会议和期刊发表论文，已获授权多项国家发明专利

  /

  软件著作权，应邀编写出版了相关教材。曾获“高校计算机专业优秀教师”、南京大学“我最喜爱的老师”和“师德先进个人”称号，以及南京大学教师教学竞赛一等奖等奖项。所负责的课程入选国家一流本科课程，并连年获评“南京大学计算机系本科毕业生

  -

  我心目中的好课程”。

  个人主页网址：

  https://cs.nju.edu.cn/liuqizhi/

  电子邮件：

  lqz@nju.edu.cn

  办公电话：

  025-89684681'
