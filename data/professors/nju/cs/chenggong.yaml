bio_raw: '程龚，南京大学计算机学院教授/博导，入选国家高层次青年人才计划。主讲“图论与算法”、“计算机问题求解”等课程，获国家级教学成果奖二等奖、南京大学青年五四奖章，入选南京大学“我最喜爱的老师”。研究兴趣包括大数据搜索、知识图谱、大模型推理等技术，并应用于搜索引擎、决策支持、问答系统等。主持完成国家重点研发计划课题和多个国家自然科学基金项目。在WWW、SIGIR、TKDE等CCF-A/B类国际学术会议期刊上发表论文60余篇，获ISWC、ESWC、COLING等国际会议最佳论文奖或提名7次。担任过ISWC、CCKS等会议程序委员会主席，现任江苏省人工智能学会知识工程与智能服务专委会副主任。

