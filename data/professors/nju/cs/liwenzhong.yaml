bio_raw: '李文中，博士，教授，博导。毕业于南京大学计算机科学与技术系，并获得理学学士学位和工学博士学位。

  2011

  年至

  2013

  年被德国洪堡基金会遴选为

  “

  洪堡学者

  ”

  ，获邀到德国哥廷根大学（德国首批

  9

  所精英大学之一）从事合作研究。目前担任南京大学计算机系教授，博士生导师。李文中教授的研究兴趣包括大数据挖掘，智能分布式系统，多模态融合、具身智能、社交网络分析等。他曾主持国家自然科学基金和江苏省前沿引领技术基础研究等多项省部级项目，并作为技术骨干，参与多项国家项目。担任过多个国际会议的程序委员会成员（

  TPC Member

  ），并担任多个国际学术期刊和国际会议的审稿人。已经在

  INFOCOM, WWW, ICDE, AAAI, IJCAI

  ，

  ACM MM

  ，

  CVPR

  等国际会议和学术刊物如

  IEEE/ACM ToN

  ，

  IEEE JSAC

  ，

  IEEE TKDE, IEEE TMC, IEEE TPDS

  ，《中国科学》，《计算机学报》上发表论文

  150

  余篇，其中

  SCI

  论文

  80

  余篇。曾获得

  2016

  年和

  2019

  年江苏省科学技术一等奖，

  2023

  年获得

  “

  江苏省科学技术二等奖

  ”

  ，研究成果入选

  “2023

  年度江苏省行业领域十大科技进展

  ”

  ，获得

  ICC2009

  国际通信会议和

  APNet2018

  亚太网络会议

  “

  最佳论文奖

  ”

  。

  2022-2024

  年连续入选爱思唯尔

  “

  中国高被引学者

  ”

  。

  个人主页：

  http://cs.nju.edu.cn/lwz/

  Email: lwz@nju.edu.cn'
