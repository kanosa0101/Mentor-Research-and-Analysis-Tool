bio_raw: '徐锋，教授（博导），2003年进入南京大学计算机软件新技术国家重点实验室，2010年2月获聘为计算机软件与理论岗位教授。多年来一直从事面向Internet开放环境的软件系统可信保障技术方面的研究。2007-2009年主持国家自然科学基金项目“面向网构软件体系结构的可信管理模型与技术研究”；2007-2009年主持国家863项目“面向开发环境软件系统的可信保障技术研究”；2010-2012年主持国家自然科学基金项目“基于声誉的网构软件可信保障技术研究”，并作为骨干人员参加了973项目、863高技术、国家杰出青年科学基金、国家自然科学基金、江苏省自然科学基金等多项科研项目。在中国科学、软件学报、电子学报、JCST、TKDE等国内外重要刊物和KDD,
  CIKM, WWW等国际会议上发表论文40余篇，并申请国家专利多项。曾获2006年度国家科技进步二等奖（第9完成人），2010年度高等学校科学研究优秀成果技术发明奖一等奖(第7完成人）。

