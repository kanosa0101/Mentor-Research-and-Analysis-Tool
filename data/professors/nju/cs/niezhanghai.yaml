bio_raw: '聂长海，教授，博士生导师。

  1、主要教学科研经历：多次主讲过计算机操作系统、模糊数学、离散数学、软件工程、编译原理、数据结构、算法设计与分析、网络编程、软件测试和软件质量保证等十多门课程，在清华大学出版社出版教材《软件测试的概念与方法》。已在ACM
  Computing Survey、ACM Transaction On Software Engineering and Methodology (TOSEM)
  、Information and Software Technology (IST)、《计算机学报》和《软件学报》等国内外一级学报和重要的会议上发表文章70多篇。获得过多项软件著作权和国家发明专利，主持完成过多项国家自然科学基金项目，参与的项目多次获得省部级科研奖，在科学出版社出版专著《组合测试》。

  2 、研究方向：软件测试与软件质量保证；智能计算及其应用；智能与学习软件设计与测试；软硬件故障大数据挖掘与应用；容错与可靠性；软件形式化方法与应用；应用驱动的大数据系统设计与测试

  3、当前科研项目：1）组合测试与软件测试技术的组合应用研究；2）大数据系统可视化与测试；3）健康大数据系统的设计、实现与测试；4）云计算平台与大数据系统安全性和可靠性理论与方法

  4、招生信息：课题组常年招收本科生、硕士研究生、博士研究生、博士后研究人员进组，欢迎同学们踊跃报名！同时欢迎具有博士学位的国内外有意加盟南京大学的优秀学者加盟我们的课题组！

  课题组主页：gist.nju.edu.cn

  个人主页：http://gist.nju.edu.cn/~changhai/

  电子邮件：changhainie

  @

  nju.edu.cn'
