bio_raw: '张天，男，南京大学计算机学院教授、博士生导师，

  CCF

  形式化专委、软件工程专委委员，

  IEEE

  电力物联数据传输及信息交换技术分委常务理事，

  2015

  年任中国计算机学会青年学者论坛（

  CCF YOCSEF

  ）南京主席。

  2019

  年受到国务院学科（软件工程）评议组的邀请，为全国研究生核心课程指南撰写《软件方法学》的课程指南。

  2024

  年主讲课程《软件工程》被认定为省一流课程。

  2007-2008

  年赴法国国家计算机与控制研究所（

  INRIA

  ）与模型驱动工程领域开创者之一的

  Jean Bézivn

  教授合作，

  2013

  年受

  IEEE Fellow Lionel Briand

  教授邀请，并获卢森堡政府基金资助赴卢开展合作。

  所研究工作主要涉及模型驱动软件开发及机器学习交叉领域的智能软件方法与技术、大模型推训分析与测试等。研究成果发表在国际重要会议和期刊

  80

  余篇（包括

  TSE

  、

  TOSEM

  、

  ICSE

  、

  FSE

  、

  ASE

  、

  OOPLSA

  等），获软工顶会

  ISSTA2020

  杰出论文奖。相关研究成果申请发明专利

  30

  余项，授权

  20

  余项，开发工具、系统等获软著

  30

  余项，多项成果已应用在华为、腾讯（微信）、小米、字节跳动、

  OPPO

  等国内领头企业中，相关专利授权和技术开发经费过千万。

  欢迎访问我的个人主页了解

  Models

  研究小组的工作 ！

  个人主页：

  https://cs.nju.edu.cn/zhangtian/index.htm

  电子邮件：

  ztluck

  @nju.edu.cn'
