bio_raw: '徐宝文，男，1961年生，博士，教授，博导；兼任软件工程国家重点实验室（武汉大学）主任、江苏省软件质量研究所所长；国家杰出青年科学基金获得者。分别获武汉大学、华中科技大学、北京航空航天大学学士、硕士、博士学位，国防科大博士后。1990年与1994年分别破格晋升副教授与教授。国家自然科学基金委员会第十一、十二届专家评审组成员。软件工程国家重点实验室（武汉大学）、教育部高可信软件重点实验室（北京大学）、上海市计算机软件评测重点实验室、安徽省计算与通讯软件重点实验室（中国科学技术大学）、广西区高可信软件重点实验室（桂林电子科技大学）等学术委员会委员/主任。曾先后担任中国计算机学会理事暨电子政务与办公自动化专业委员会主任（荣誉主任）、中国软件行业协会理事、江苏省计算机学会副理事长、江苏省软件行业协会副理事长（副会长），教育部高等学校计算机科学与技术、软件工程教学指导分委员会委员等。主要从事程序设计语言、软件工程（软件方法论、软件分析、度量与测试）、Web技术等方面的研究。与美、英、加、澳、港、台等国家和地区的学者有比较广泛的合作关系。担任国际学术会议主席、程序委员会主席/委员等100余次。主编系列丛书（教材）三部，出版著译作10余部，发表论文300余篇，被SCI、EI、ISTP收录500余篇次，多篇论文被50多个国家和地区学者引用与采用，国内外他引约4000次(其中国外他引1000多次)。作为第一获奖者获得省部级科技进步（自然科学）一等奖三次、省部级科技进步（自然科学）二等奖5次、三四等奖若干次。1990年开始指导硕士生，1995年评为博士生导师。已指导博士后10人、博士生40余人（其中已毕业30余人）、各类硕士生100余人。所指导的学生10多人次获得全国百篇优秀博士论文（全国软件工程学科第一篇百优博士论文）、中国计算机学会青年科学家奖、微软学者奖、江苏省优秀博士论文、江苏省优秀硕士论文、江苏省优秀本科毕业论文一等奖。第八至十一届江苏省政协常委，中国民主同盟中央委员。先后担任中国民主同盟江苏省委副主委、公安部特邀监督员、江苏省公安厅警风警纪监督员、江苏省劳动厅行风监督员、江苏省质量技术监督局政务公开监督员、东方航空江苏公司督查员，江苏省公安系统行风评议组、江苏省建设系统行风评议组、江苏省质监系统行风评议组成员/组长，马鞍山市人民政府顾问与决策咨询委员会委员、无锡市政府信息顾问、南京市科技拥军服务团专家组成员、广东省软件科学园专家组专家等。获航空航天部优秀青年教师、江苏省优秀教育工作者、江苏省优秀青年骨干教师、江苏省跨世纪学术带头人、江苏省优秀博士生导师、教育部跨世纪教育部跨世纪优秀人才、江苏省优秀科技工作者等称号。中创软件人才奖获得者，政府特殊津贴获得者，江苏省中青年科技领军人才、“六大人才高峰”A类人才培养对象。

