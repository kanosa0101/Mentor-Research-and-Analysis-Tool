bio_raw: '南京大学计算机学院教授。1997年和2000年于南京大学电子科学与工程系分别获得理学学士和理学硕士学位，2008年9月于新加坡国立大学电机与电脑工程系获得博士学位。曾在微软亚洲研究院及中兴通讯从事过多年的无线网络研究与标准化工作。主要研究方向为无线智能感知、软件无线电、机器学习加速等，主持过多项国家自然基金项目及企业合作项目。在ACM
  Mobicom, ACM CCS,IEEE/ACM trans. Networking, IEEE trans. Mobile Computing等会议和期刊上发表过多篇论文，并获得过IMWUT
  Distinguished Paper Award及SECON Best Paper Award。2011年获江苏省双创人才奖。

  个人主页：

  http://cs.nju.edu.cn/ww

  电子邮件：ww@nju.edu.cn'
