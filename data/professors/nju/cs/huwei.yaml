bio_raw: '胡伟，博士，南京大学教授、博士生导师。于东南大学计算机学院获学士、博士学位，先后赴荷兰阿姆斯特丹自由大学、IBM中国研究院、美国斯坦福大学、加拿大多伦多大学访学。

  主要研究方向为人工智能、数据库，以及与医学领域的交叉。具体研究：（1）知识图谱，通过表示学习、预训练模型等技术，深度挖掘知识。成果发表在ICML、NeurIPS、AAAI、IJCAI、ACL等人工智能领域著名会议，入选AI
  2000最具影响力学者榜单。（2）数据集成，通过实体对齐、区块链等技术，消除知识异构性，促进知识的重用与迁移。成果发表在SIGMOD、VLDB、ICDE、TKDE、VLDBJ等数据库领域著名会议和期刊。（3）个人兼任南京大学健康医疗大数据国家研究院研究员，通过数智技术赋能医疗创新。研究成果得到新华日报、学习强国等主流媒体的报道。

  主持了4项国家自然科学基金项目，参加国家重点研发计划、863计划等课题，并与阿里巴巴、腾讯、华为等长期合作。论文获得过ISWC、JIST、CCKS、CHIP等会议的最佳论文奖或提名。担任中文信息学会语言与知识计算专委会和计算机学会数据库专委会委员、万维网联盟W3C南京大学学术代表，Big
  Data Research和Data Intelligence等期刊编委，以及系外事秘书。指导学生获得中国大学生服创大赛全国一等奖、南京大学本科优秀毕业论文特等奖等。

  个人主页：

  http://ws2.nju.edu.cn/kgwiki/

  电子邮件：whu@nju.edu.cn'
