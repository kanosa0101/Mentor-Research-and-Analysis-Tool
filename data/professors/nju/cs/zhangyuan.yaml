bio_raw: '张渊，教授，博导，研究方向为网络空间安全，

  主要研究领域

  包括安全多方计算，保护隐私的网络和通讯安全协议设计，基于博弈论的机制设计，后量子安全计算协议设计等。已发表论文50余篇，包括国际一流学术会议CCS，INFOCOM，VLDB等，国际一流学术期刊TDSC、TIFS、JSAC、TON、TMC、TPDS等。

  担任ACM南京分会联合秘书长，研究成果

  曾获江苏省科学技术奖三等奖，在字节跳动、美团等

  多家知名企业落地应用。

  邮箱：zhangyuan@nju.edu.cn

  个人主页：https://zynju.github.io/zhangyuan/'
