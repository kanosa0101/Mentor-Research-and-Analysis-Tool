bio_raw: '李俊，毕业于南京大学计算机科学与技术系，承担《计算机系统设计综合实验》课程的教学工作；研究兴趣是嵌入式技术、精确定位技术和智能自动化；最近几年主要研究智能制造的相关平台、技术，尝试制造领域的智能化和大数据应用。

  从事嵌入式应用、物联网、无线定位、智能自动化的技术和应用开发有

  10

  多年时间，完成多个科研项目，研究成果在港口物流、离散制造、生产安全等多个领域有成功应用。与

  ZPMC

  、

  Sany

  等知名港机制造商，

  DPW

  、

  APM

  和

  HPH

  等大型港口集团有长期合作，相关设备自动化和智能管理产品在全球

  50

  多个大型集装箱码头有成功应用。

  物联网和自动化结合的产品作为

  “

  网构软件技术

  ”

  的应用成果获得过国家科技进步二等奖；近年来，我申请并获得授权专利

  10

  余项、软件著作权和产品

  20

  多项；获得过省市领军人才计划的支持，

  4

  项产品被认定为江苏省

  “

  高新技术产品

  ”

  、获得过江苏省软件产品

  “

  金慧奖

  ”

  。

  除了日常的教学、科研工作外，顺应国家创新创业的号召，我参与了

  “

  江苏省软件新技术与产业化协同创新中心

  ”

  和

  “

  南京大学双创示范基地

  -

  智能软件技术和应用平台

  ”

  的工作，用创新的方式促进我系的研究工作对接产业需求，推进科技成果的转化和产业化。有需求的企业、有成果的老师，欢迎你们随时联系我！

  个人主页：

  http://cs.nju.edu.cn/lijun

  电子邮件：lijun77

  @

  nju.edu.cn'
