bio_raw: '王林章，教授、博士生导师，中国计算机学会会士，入选国家“国家高层次人才特殊支持计划”科技创新领军人才。主要研究大规模复杂基础软件的可信保障、智能化程序分析与测试、软件与系统安全，在模型驱动的测试与验证、基于静态分析的安全缺陷检测、基于深度学习的缺陷预测等方面取得了创新性成果，研制了面向基础软件的可扩展高精度自动化缺陷检测技术与系统，在提升检测精度、减低误报、增强可扩展性等方面取得突破，论文发表在

  ACM TOCS

  、

  ACM TOSEM

  、

  IEEE TSE

  、

  OOPSLA

  、

  PLDI

  、

  ICSE

  、

  ASE

  、

  ISSTA

  、

  JCST

  、软件学报等软件领域旗舰期刊和会议上，研究成果得到国内外同行广泛认可和引用，产生重要的影响，获

  OOPSLA2020

  杰出论文奖和

  OOPSLA2013

  最佳论文奖（为该

  CCF-A

  类会议自

  1986

  年召开

  36

  年来国内单位仅有的

  2

  次获奖）；获得中国、美国、德国授权发明专利和软件著作权多项，参与制定多项国家标准，主持国家自然科学基金重点项目、国家重点研发计划项目课题、国防重要项目，指导博士生获

  CCF

  优博提名奖，成果服务国家重大需求和产业应用成效显著。

  近年来服务于多个国内外学术共同体、学术会议，现为中国计算机学会会士、理事，国家信息技术标准化委员会委员，《电子学报》领域编委，江苏省计算机学会常务理事、江苏省计算机学会软件专委会主任，曾任中国计算机学会系统软件专委会副主任、秘书长，软件工程领域

  HASE

  、

  TASE

  、

  Chinasoft

  、

  Internetware

  多个国内外会议组织委员会主席、程序委员会委员。牵头依托计算机软件新技术全国重点实验室创建了具有国家级计量认证资质的第三方权威软件测试中心，对外提供测试技术咨询和测试服务，参与

  GB/T 30847.1-2014

  、

  GB/T 30847.2-2014

  、

  GB/T 37970-2019

  等标准制定。

  电话：025-89685750

  邮件：lzwang@nju.edu.cn'
