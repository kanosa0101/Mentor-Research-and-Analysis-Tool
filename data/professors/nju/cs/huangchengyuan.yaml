bio_raw: '黄程远，

  1993

  年

  10

  月生，

  2011

  年进入北京邮电大学大学学习，于

  2015

  年和

  2021

  年分别获得电子科学与技术学士和信息与通信工程博士学位，导师刘韵洁院士。于

  2023

  年加入南京大学，现任南京大学计算机学院助理研究员。

  主要研究领域为计算机网络和分布式系统，具体包括：网络传输协议、可编程网络硬件、

  RDMA

  加速的分布式系统等。

  主持或参与国家重点研发计划（子课题负责人）、国家自然科学基金重点项目、南京市博士后科研特别资助（项目负责人）等多项国家

  /

  省部级项目。

  研究成果在计算网络领域国际顶级会议与期刊发表论文

  10

  余篇，包括

  ACM SIGCOMM

  、

  IEEE ICNP

  、

  ACM ICS

  、

  IEEE ToN

  等国际顶级会议和期刊，并且受邀担任

  IEEE HPCC

  等国际学术会议

  TPC

  。

  已授权或申请发明专利

  10

  余项，参与研发的多项原型系统已经在阿里云、华为云等头部科技企业进行测试部署。

  个人网页：

  https://ryanhuang1014.github.io/

  电子邮件：

  huangchengyuan@nju.edu.cn'
