bio_raw: '武港山，男，1967年2月生，博士、教授，博士生导师，南京大学多媒体教研室主任。曾在台湾交通大学资讯工程学系进修。主要从事计算机应用技术研究与系统开发工作，主持或承担过国家重大专项专题、863重大项目、科技部基础条件平台项目、国家自然科学基金重点项目、江苏省高技术研究项目等纵向项目，主持或承担过日本富士通公司、中石化南京物探研究院等国内外知名公司的横向合作项目多项；在计算机视觉计算、多媒体信息检索、Web智能信息处理、数字博物馆以及海量地质数据处理等领域的技术研究和系统开发方面取得成果；在国内外学术期刊或学术会议上发表论文80余篇；获得1999年江苏省科技进步二等奖，2007年江苏省教学成果特等奖和2009年高等教育国家级教学成果二等奖。

