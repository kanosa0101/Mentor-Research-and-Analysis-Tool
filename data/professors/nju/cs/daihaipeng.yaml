  Haipeng Dai is a professor, doctoral supervisor with the School of Computer Science
  at Nanjing University, Young Chang Jiang Scholar, and IET Fellow. He received the
  B.S. degree in the Department of Electronic Engineering in Shanghai Jiaotong University
  in 2007, the M.S. degree in Department of Electrical Engineering in Shanghai Jiaotong
  University in 2010, and the Ph.D. degree in the Department of Computer Science and
  Technology in Nanjing University in 2014. He received ACM China Rising Star Award
  in 2018 (2 awardees in China), IEEE TCSC Middle Career Researcher Award (4 awardees
  worldwide), Excellent Scientific and Technological Member of Chinese Institute of
  Electronics, ACM SIGCOMM China Rising Star Award, Excellent Scientific and Technological
  Member of Jiangsu Computer Society, Youth Science and Technology Award of Jiangsu
  Computer Society, Excellent Doctoral Dissertation of Jiangsu Computer Society, Youth
  May-4th Medal of Nanjing University,

  Silver Award of the 8th China International College Students’ Internet+ Innovation
  and Entrepreneurship Competition

  , and First Prize and Best Instructor Award of National College Competition on Internet
  of Things. His research interests are mainly in the areas of Internet of Things,
  edge intelligence, data mining, and mobile computing. He has published more than
  300 papers (including 130 CCF A papers), including ACM UbiComp, ACM EuroSys, USENIX
  ATC, IEEE INFOCOM, VLDB, IEEE ICDE, ACM WWW, ACM SIGMETRICS, ACM MobiHoc, ACM MobiSys,
  IEEE ICNP, IEEE ICDCS, ACM/IEEE TON, IEEE JSAC, IEEE TPDS, IEEE TMC, The VLDB Journal,
  IEEE TKDE, IEEE TDSC, IEEE TIFS, and other top international conference journals.
  He received Best Paper Award Candidate from CCF A conference IEEE INFOCOM, Best
  Paper Award from CCF B conference IEEE ICNP, Best Paper Award Runner-up from CCF
  B conference IEEE SECON, Best Paper Award from CCF C conference IEEE HPCC, Best
  Paper Award from CCF C conference IEEE WASA, Best Paper Award from CCF C conference
  APWeb-WAIM, Best Paper Award from IEEE Cybertics Congress 2025 (including CCF C
  conference ICA3PP), and other paper awards. He has 6 papers selected as ESI highly
  cited papers and 1 paper selected as ESI hot paper. His Google Scholar citation
  has reached over 6200 times, with citations from more than 100 academicians ACM/IEEE
  Fellow. He chaired and participated in more than ten projects including Key Projects
  of Joint Funds of NSFC, General Projects of NSFC and the National Key R&D Program
  of China, and the relevant research results have been implemented in Huawei, Alibaba,
  Tencent, ZTE, Sinopec, and other companies. He was selected for Stanford University''s
  Top 2% Scientists list.

  He serves as the distinguished member of CCF, the senior member of ACM and IEEE,
  secretary general of ACM SIGCOMM China, chair of CCF YOCSEF Nanjing, vice director
  of Jiangsu Computer Society Youth Working Committee, vice director of JiangSu Association
  of Artificial lntelligence Intelligence and Security Committee, member of CCF Technical
  Committee of Internet of Things, CCF Technical Committee of Network and Data Communication,
  and CCF Technical Committee of Database, member of CIC Technical Committee of Cloud
  Computing and Big Data Applications, and CIC Technical Committee of Open Source,
  young member of CIE Technical Committee of Internet of Things, member of ACM SIGBED
  China and ACM SIGAPP China.

  He is the program committee chair of CCF A conference INFOCOM Workshop WNA 2022,
  publication chair of CCF B conference ICNP 2014, tutorial & workshop chair of CCF
  B conference COCOON 2024, TPC chair of CCF C conference ISPA 2022, TPC vice-chair
  of CCF C conference HPCC 2021, track chair of CCF C conferences ICCCN 2019 and ICPADS
  2021, workshop chair of CCF C conference MSN 2023, TPC chair of EI Conference iThings
  2021, and other positions. He also serves as the program committee member of important
  international academic conferences such as INFOCOM, IJCAI, VLDB, SIGKDD, SC, MobiHoc,
  ICNP, ICDCS, IWQoS, and IPDPS. In addition, he serves as an associate editor of
  Chinese CCF A Journal Acta Electronica Sinica, associate editor of TII, associate
  editor of Chinese CCF B Journal Computer Science, and guest editor of CCF B Journal
  JSA. He has served as a reviewer for more than 50 international top journals such
  as TON, JSAC, TPDS, TMC, and TKDE.

  He has guided several students to win the President''s Special Scholarship, ICNP
  Best Paper Award, SECON Best Paper Award runner-up, Silver Award of the 8th China
  International College Students’ Internet+ Innovation and Entrepreneurship Competition,
  and

  First Prize of National College Competition on Internet of Things, etc. Some of
  his students have been employed by head companies such as Tencent, Ali, Huawei,
  ByteDance, Ant Financial, Microsoft, Netease, and Huatai Securities. Some have joined
  Tsinghua University, Nanjing University, National University of Defense Technology,
  Nanjing University of Aeronautics and Astronautics, and others are studying at the
  University of Illinois at Urbana-Champaign, Purdue University, Rice University,
  and University of Minnesota.

