  全国银奖、“挑战杯”全国一等奖、全国高校物联网应用创新大赛一等奖等奖项，被阿里、腾讯、华为、字节跳动、蚂蚁金服、微软、网易、华泰证券等头部公司聘用，入职清华大学、南京大学、国防科技大学、南京航空航天大学，及美国密歇根大学等高校，以及在美国伊利诺伊大学香槟分校、霍普金斯大学、普林斯顿大学、普渡大学、莱斯大学、明尼苏达大学、新加坡南洋理工大学、德国哥廷根大学等名校深造。

