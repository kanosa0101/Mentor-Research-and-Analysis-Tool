  。荣获江苏省计算机学会科学技术奖一等奖（第一完成人）、中国通信学会科技奖二等奖（第一完成人）等奖项。担任国家重点研发计划项目、教育部学科突破先导项目课题负责人，主持和承担国自科面上、联合基金重点等项目十余项。相关研究成果在华为、阿里巴巴、腾讯、中兴、中石化、国家电网、南京脑科医院等公司转化落地。入选斯坦福大学“全球前

