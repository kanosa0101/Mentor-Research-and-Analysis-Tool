bio_raw: '陶先平，男，博士，1970年生，九三学社南大社委。南京大学计算机科学与技术系教授、博士生导师、南京大学计算机科学与技术系副主任。兼任中国计算机学会系统软件专业委员会秘书长、中国计算机学会教育工委副主任。主要研究方向为软件Agent技术、软件中间件技术、网构软件方法学、普适计算技术等。
   工作期间，主持或参与了国家自然科学基金重点及面上项目、973项目、863项目（含目标导向类和探索导向类项目）、国家八五、九五、十五攻关项目、国家发改委高新技术产业化项目、江苏省自然科学基金重点及一般项目、江苏省高技术等项目等二十余项，均圆满完成了相关任务并获得好评。在国内外重要刊物及一流国际会议论文集上发表论文60余篇，相关成果被国内外研究者多次引用。
   2004年获得教育部提名国家科技奖自然科学一等奖（第二完成人），2006年获国家科技进步二等奖（第三完成人）。2010年获教育部技术发明奖一等奖（第三完成人）。获得国家发明专利一项，申请国家发明专利6项，软件著作权4项。

