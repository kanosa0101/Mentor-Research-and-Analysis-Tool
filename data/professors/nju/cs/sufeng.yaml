bio_raw: '苏丰，男，1975年4月生，1997年毕业于南京大学计算机科学与技术系，获学士学位，2002年获博士学位。主要研究方向为计算机图形学、CAD及应用、图像处理、计算机视觉。在国内外核心刊物和国际会议上发表论文10余篇。

