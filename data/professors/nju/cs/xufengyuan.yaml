bio_raw: '南京大学计算机学院教授、博导，软件新技术全国重点实验室学术骨干，国家级青年人才，江苏“双创人才”，江苏“六大人才高峰“入选者，微软“铸星计划”学者。从事数据与智能安全的研究，现聚焦在安全专业领域代理式AI、移动端隐私计算与AI安全等。主持国家重点研发计划课题等多个国家级项目，发表CCS、S&P、MobiCom、FSE、CVPR、TIFS等CCF-A类会议期刊40余篇，获安全4大CCS
  2022最佳论文提名奖，已授权10余项发明专利并许可两项，主持和参与多项国标和获奖团标。指导的学生荣获中国中文信息学会优博论文奖、江苏省计算机学会优秀博士论文奖、以及ACM中国嵌入式系统专委会优博。担任中国中文信息学会大数据安全与隐私计算专委会常委、ACM中国SIGBED专委会常委，担任安全4大S&P、Usenix
  Security、CCS的TPC，获CCF-A类会议Infocom Distinguished TPC奖。

  个人主页：

  http://cs.nju.edu.cn/fxu

  电子邮件：fengyuan.xu@nju.edu.cn'
