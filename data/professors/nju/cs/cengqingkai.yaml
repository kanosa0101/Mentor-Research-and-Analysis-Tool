bio_raw: '曾庆凯，教授、博士生导师，南大信息安全研究所所长，中国互联网协会网络与信息安全专业委员会常委、国家反计算机入侵和防病毒研究中心专家、国家信息安全成果产业化基地专家委员会委员、江苏省网络与信息安全专家咨询委员会委员。先后于清华大学、南京大学计算机系获学士、硕士和博士学位。曾任国家863计划信息安全技术主题专家组成员，科技部信息安全重大专项总体专家组成员、组长助理等。先后主持国家863计划、国家自然科学基金、国家科技攻关计划、博士点专项基金、高校骨干教师计划和省自然科学基金等课题十多项。获省科技进步奖2项。目前研究兴趣为操作系统安全、软件安全、网络安全、安全评估与测试。

  电话：025-83686700

