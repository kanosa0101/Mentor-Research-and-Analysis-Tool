bio_raw: '一、现在职位：南京大学计算机科学与技术系、计算机软件新技术国家重点实验室（南京大学）教授、博士研究生导师，南京大学智能机器人研究院院长。

  二、研究方向：智能机器人。

  三、研究内容

  1、

  智能机器人：人

  -

  机

  -

  环境共融机器人基础理论与关键技术，包括人工智能、非结构环境下的自主导航、动态环境下的即时定位与地图构建（

  SLAM

  ）、同构环境下的智能避障、双臂协作机器人及机器人操作系统（

  ROS

  ，

  Robot Operating System

  ）等；

  2、

  机器人多模态融合感知技术：包括

  RFID

  识别与感知技术、计算机视觉、无线感知技术及多模态信息融合等

  四、“智能物资盘点机器人”入选“2022世界智能制造十大科技进展”。

  https://mp.weixin.qq.com/s/gtxWcxZuiwnJfbkMGirVrw

  五、招生信息：课题组常年招收本科生、硕士研究生、博士研究生、博士后研究人员进组，欢迎同学们踊跃报名！

  六、具体要求：满足南京大学招生条件即可。

  七、课题组招聘启示：

  南京大学智能机器人研究院招聘启示

  诚招天下英才！南京大学智能机器人研究院面向国（境）内外公开招聘专职科研岗位，欢迎感兴趣的研究人员踊跃应聘！

  团队简介

  南京大学智能机器人研究院隶属于南京大学计算机科学与技术系、计算机软件新技术国家重点实验室（南京大学）。研究院以国家重大战略需求和前沿基础理论为引领，坚持以问题为导向，做原创科研！开展智能机器人相关领域的科学和工程技术问题研究。

  招聘条件

  1、

  国内外高校及研究机构取得相关专业博士学位，对下述岗位有浓厚兴趣；

  2、

  具备良好的道德素养和团队合作精神；

  3、

  在相关领域期刊和会议上已发表高水平研究论文，对本领域基础知识和前沿方向有良好把握。

  招聘岗位：

  智能机器人

  材料提供

  1、

  个人简历（学习简历、工作简历、发表论文、参与项目等）；

  2、

  三篇重要代表性论著或论文。

  岗位待遇

  享受南京大学专职科研岗位福利待遇，被聘用者年薪

  18

  ～

  30

  万元（面谈）。对于在岗期间表现突出人员，课题组予以额外奖励。鼓励和支持被聘用者申报国家与地方各类科研项目。南京大学专职科研系列岗位聘用办法请查阅以下网址：

  https://hr.nju.edu.cn/d8/3b/c6655a186427/pagem.htm

  联系方式

  联系人：陈力军

  联系电话：

  18951991936

  Email:

  chenlj@nju.edu.cn'
