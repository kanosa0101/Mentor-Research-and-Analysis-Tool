bio_raw: '高阳教授，博导。目前任南京大学健康医疗大数据国家研究院常务副院长，南京大学陆海安全决策技术教育部重点实验室副主任，江苏省XX人工智能技术军民融合创新平台负责人。曾任南京大学计算机科学与技术系副主任(2011-2023)。2009年入选江苏省“333高层次人才培养工程”第二批中青年科学技术带头人，2010年入选教育部新世纪优秀人才支持计划，2019年度入选江苏省高等学校优秀科技创新团队负责人，2022年入选江苏省军民融合创新领军人才，2022年入选“天山学者”。中国人工智能学会会士，江苏省人工智能学会常务副理事长。

  1997年开始从事人工智能、机器学习、多智能体系统、大数据、图像和视频分析等领域的学术研究。作为第一负责人主持国家自然科学基金重大项目课题、重点项目、军民共性技术联合基金项目各一项、面上项目三项、青年项目一项；主持科技部国际合作专项一项、科技创新2030—“新一代人工智能”重大项目课题两项；主持江苏省自然科学基金重点项目一项，江苏省重点研发计划项目一项等。

  基于所研究成果，在国际学术期刊(IEEE Transactions系列)、国际会议(CCF-A/B类会议)和国内一级刊物上(计算机学报、软件学报等)发表学术论文数200余篇，译著《统计强化学习》、《机器学习的算法视角》，编著《分布式人工智能》等。获授权专利10项，国际PCT专利1项；获江苏省科学技术奖二等奖一次(“面向复杂交互场景的新型机器学习技术”，排名第一)、中国人工智能学会吴文俊自然科学奖二等奖一次(“强化学习理论与应用”，排名第一)、军队医疗成果奖二等、三等各一项。

  目前为中国人工智能学会会士、智能服务专委会副主任/机器学习专业委员会常委/粒计算与知识发现专业委员会常委；中国计算机学会杰出会员，人工智能与模式识别专业委员会常委、秘书长/多智能体与智能系统学组常务副组长/大数据专家委委员；中国指挥与控制学会信息融合专委会副主任/智能博弈与兵棋推演专委会常委；江苏省人工智能学会常务副理事长；江苏省软件与信息服务标准化委员会人工智能标准工作组组长等。担任《软件学报》、《智能系统学报》、《计算机科学》、《模式识别与人工智能》、《ZTE
  Communications》等期刊的编委。

