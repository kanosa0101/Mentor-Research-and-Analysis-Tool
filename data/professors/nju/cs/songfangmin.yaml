bio_raw: '宋方敏，1961年11月出生，1982年2月本科毕业于南京大学，1982年获理学学士学，1985年获理学硕士学位1988年获理学博士学位。1993年和1994年在瑞士ETH和瑞典CTH从事博士后研究工作。目前研究方向是数理逻辑和量子计算机。主持和参加多项国家自然科学基金项目、863项目和中法先进研究计划（PRA），发表论文40余篇。曾获"江苏省优秀科技工作者"称号，国家教委科技进步三等奖和教育部提名国家科学技术奖（二等）。

