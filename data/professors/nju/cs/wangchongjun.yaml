bio_raw: '王崇骏，

  男，博士，教授，博导，

  任职于南京大学计算机科学与技术系及南京大学软件新技术国家重点实验室，

  南京大学

  IIP

  研究组负责人

  、南京大学（中德）

  HPI

  研究院联合创始人。研究兴趣是自主智能与群体智能、复杂网络分析、大数据分析及智能系统等，近五年发表论文

  50

  余篇、出版专著

  2

  部。截至

  2018

  年底，主持和参与包括国家重点研发项目、

  973

  、发改委

  4G

  专项、工信部产业化基金、国家自然科学基金、国家社会科学基金、省自然科学基金、支撑计划及重点研发项目在内的国家及省部级基金与企事业资助项目

  50

  余项。在教育医疗类惠民行业、优政兴业类政府领域、互联网新经济领域有

  30

  余项科研成果获得产品化和商品化推广。详见研究组主页

  http://iip.nju.edu.cn

  介绍。

  附南京大学

  IIP

  研究组介绍：

  位于南京大学仙林校区

  计算机

  科学技术楼

  325

  、

  526

  ，隶属于

  计算机软件新技术国家重点实验室

  和

  南京大学计算机科学与技术系

  。研究组秉承理论与应用相结合的工作思路，积极探索计算机科学与人工智能的若干前沿方向；结合行业应用推进相关的应用研究，并在此基础上为典型应用领域提供智能化解决方案。

  附南京大学（中德）

  HPI

  研究院介绍：

  南京大学（中德）

  HPI

  研究院（

  HPI Research School at Nanjing University

  ，简称南大

  HPI

  或

  HPI_NJU

  ）成立于

  2011

  年

  11

  月

  17

  日，成立于

  2011

  年

  11

  月

  17

  日，主旨是围绕

  “

  海量数据分析与知识发现

  ”

  （

  2011-2016

  ）和

  “

  大数据关键技术及行业应用

  ”

  （

  2016-2021

  ）展开中德双边的博士生培养、协作科研等全方位的合作。

  南京大学

  HPI

  研究院的德方合作伙伴是哈索

  -

  普拉特纳信息技术系统工程研究院（

  Hasso Plattner Institute for IT-Systems Engineering, HPI

  ，

  http://www.hpi.uni-potsdam.de

  ），

  HPI

  由

  SAP

  创始人哈索

  -

  普拉特纳教授（

  P

  rof. Dr. h. c. Hasso Plattner

  ）创办于

  1998

  年，是德国第一所由私人独立出资、公私合作管理的大学教学研究机构。

  电话：83593163 个人主页：

  http://cs.nju.edu.cn/chjwang/

  电子邮件：chjwang@nju.edu.cn'
