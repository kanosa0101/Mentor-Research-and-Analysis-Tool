bio_raw: '姚鹏晖，教授，博士生导师；

  2013

  年博士毕业于新加坡国立大学

  CQT

  ，之后先后在荷兰国家数学与计算机中心（

  CWI

  ）、加拿大滑铁卢大学量子计算研究所（

  IQC

  ）从事博士后研究。

  2016.9

  申请到美国马里兰大学量子信息与计算机科学联合中心（

  QuICS

  ）的

  Hartree

  荣誉博士后研究员职位。合作导师为该中心负责人

  Andrew Childs

  ，美国

  量子信息与计算机科学联合中心首任主任。

  研究成果发表于

  ACM

  旗舰期刊《

  Journal of the ACM

  》（

  JACM

  ），以及多个理论计算机科学顶级会议和期刊，如《

  SIAM Journal on Computing

  》、

  STOC

  、

  FOCS

  等。

  7

  次在量子信息顶级会议

  QIP

  上作报告，

  2017

  年受邀担任全会报告（

  plenary talk

  ）之一（该会议共设

  6

  个全会报告）。并且作为长期访问学者受邀参与伯克利

  Simons

  计算理论研究所（国内唯一学者，

  2

  次）、普林斯顿高等研究院（国内唯一学者）等国际一流研究机构的量子项目。建立的泡利分析理论被

  IBM

  、谷歌、哈佛大学、剑桥、

  MIT

  、加州理工等量子团队以及美国科学院院士

  Preskill

  、多名斯隆奖得主广泛引用，应用于量子算法设计。

  学术任职

  2024~

  至今亚洲量子信息科学会议（

  AIQS

  ）委员

  2022~

  至今合肥国家实验室双聘人员

  2022~

  至今

  Frontiers of Computer Science

  青年编委

  2020~

  至今多个量子信息国际权威会议

  QIP

  、

  TQC

  、

  AQIS

  等程序委员

  部分主持和参与的科研项目：

  1.

  国家自然科学基金委员会，重点项目，分布式容噪量子算法理论，

  2024-01-01

  至

  2028-12

  -31

  ，

  228

  万元，在研，主持

  2.

  国家自然科学基金委员会，面上项目，基于信息论的量子通信复杂性研究，

  2020-01-01

  至

  2023-12

  -31

  ，

  60

  万元，结题，主持

  3.

  合肥国家实验室“量子通信与量子计算”国家科技重大专项，量子算法和量子密码算法理论和应用研究，

  2021-11

  至

  2026-11

  ，

  3283

  万元，在研，课题骨干

  具体研究方向：

  1.

  人工智能在量子计算中的应用

  2.

  量子算法和复杂性（包括电路复杂性、通信复杂性等）

  3.

  布尔函数分析以及在量子计算中的应用

  4.

  量子信息论

  个人主页：

  http://penghuiyao.info

  电子邮件：pyao@nju.edu.cn'
