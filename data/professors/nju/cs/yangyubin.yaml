bio_raw: '杨育彬，博士、教授、博士生导师。教育部“新世纪优秀人才”、江苏省“333高层次人才”(中青年科学技术带头人)、江苏省“六大人才高峰”第十批高层次人才、南京大学优秀中青年学科带头人、Springer国际期刊《Frontiers
  of Computer Science》青年编委；南京市“高层次留学归国人员”、IBM Innovation Award 获得者、华为全球创新研究计划项目获得者。长期专注于数字媒体理解、机器学习、数据挖掘等方向的研究。主持多项国家自然科学基金面上项目、江苏省自然科学基金重点项目、江苏省自然科学基金青年科技创新人才学术带头人项目；参与“973”、“863”计划项目、国家自然科学基金创新群体项目、国家自然科学基金重点项目、国家自然科学基金优秀国家重点实验室项目、科技部国际科技合作计划项目，以及澳大利亚、加拿大和香港多项基金研究项目。担任中国人工智能学会“机器学习”专委会、“知识工程与分布智能”专委会、“粗糙集与软计算”专委会委员、江苏省计算机学会人工智能专委会委员。担任国家自然科学基金重大研究计划项目通信评审专家、国家自然科学基金项目信息科学部和地球科学部通信评审专家、科技部国际科技合作计划项目通信评审专家。

