bio_raw: '黄宜华，博士，南京大学计算机科学与技术系教授，博导。PASA大数据实验室学术带头人，南京大学大数据技术研究中心主任。中国计算机学会大数据专家委员会副主任，江苏省计算机学会大数据专家委员会主任、云计算专业委员会副主任。1979年进入南京大学计算机科学与技术系本科学习，1983年毕业获得计算机学士学位，并继续攻读硕士研究生。1986年研究生毕业后留校任教。1994年提升为南京大学计算机科学与技术系副教授。1994年攻读博士学位，并于1997年获计算机应用博士学位。1998年提升为南京大学计算机科学与技术系教授。1999年赴美国佛罗里达大学数据库系统研究中心作访问学者；2002-2008年工作于美国佐治亚州医学院从事生物信息技术研究。2008年重新回到南京大学计算机科学与技术系工作，主要从事大数据技术研究（大数据实验室网址：http://pasa-bigdata.nju.edu.cn），是国内最早从事大数据技术研究的学者之一，主要研究领域包括大数据处理与并行计算、云计算、大数据智能计算、文本语义分析，在大数据存储管理与查询、大数据并行计算、大数据系统性能优化、大数据机器学习、AutoML自动化机器学习、大数据文本语义分析、大数据行业应用等方面开展一系列的研究工作，发表研究论文60多篇。在大数据技术领域承担国家级和省级科研项目多项，并带领实验室开展了与Intel、Google、微软亚洲研究院、华为、字节跳动、百度、360、中兴通讯等国内外著名IT企业在大数据方面的合作研究工作，并开展与Spark和Alluxio等著名大数据系统开源社区的合作研究。2010年在Google和Intel公司资助下在本系建设并开设了大数据并行处理技术研究生和本科生课程，是国内最早开设该课程的教师之一，在教学和研究工作基础上，编写出版大数据技术书籍2部。

  个人主页：

  http://cs.nju.edu.cn/yhuang

  电子邮件：yhuang

  @

  nju.edu.cn'
