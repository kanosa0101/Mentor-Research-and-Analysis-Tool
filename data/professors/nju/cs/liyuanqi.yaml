title: 讲师/专职科研/博士后
email: yuanqili@nju.edu.cn
bio_raw: '2018年本科毕业于南京大学物理学院，2024年博士毕业于南大计算机学院，现任南大计算机学院助理研究员，研究方向为三维视觉与智能图形，包括三维重建与生成、三维场景理解与分析、智能建模、矢量图形、图像视频处理等。发表ACM
  SIGGGRAPH, IEEE TVCG, CVPR等CCF-A类论文十余篇。作为骨干成员参与国自然重点项目、面上项目。担任SIGGRAPH、CVPR、ICCV等期刊、会议审稿人。

  长期招收保研、考研学生，也非常欢迎本科各个年级的同学联系我参与本科生科研实践。

  个人主页：

  www.njumeta.com/liyq/

  邮箱：yuanqili@nju.edu.cn'
