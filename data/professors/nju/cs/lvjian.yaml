bio_raw: '吕建教授，博士生导师，计算机软件新技术国家重点实验室主任。1960年3月生，1982年毕业于南京大学计算机系，1988年获博士学位，1993年－1994年在英国曼彻斯特大学计算机系作为访问学者。1995年在联合国大学澳门国际软件研究所从事研究工作。现任南京大学计算机科学与技术系副主任，计算机软件研究所副所长，中国计算机学会理事和江苏省计算机学会理事。研究方向包括软件自动化、面向对象语言与环境和并行程序的形式化方法。曾参加国家重点项目11项。获国家教委科技进步一等奖二次，国家教委科技进步二等奖一次，获江苏省科技进步二等奖一次，光华科技三等奖一次，完成论文40余篇。发表在《JournalofSystemsandSoftware》、《AnnualsofSoftwareEngIneerIng》、《ACMSIgplanNotIces》、《ACMSoftwareEngineerIngNotes》、《中国科学》等刊物上。合著专著《软件自动化》获国家教委学术著作优秀奖和优秀教材一等奖。1990年被授予“做出突出贡献的中国博士学位获得者”称号。1993年获霍英东青年教师奖。1994年进入“国家教委跨世纪优秀人才计划”。1995年获江苏省青年科技奖。1995年获“国家杰出青年科学基金”资助。1996年获首届江苏省青年科学家奖(提名奖)；1996年获中国青年科技奖。

