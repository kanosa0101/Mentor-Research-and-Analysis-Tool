bio_raw: '谢磊，南京大学计算机学院副院长，教授，博导，入选国家级青年人才计划，工业互联网战略咨询专家委员会委员，教育部高等学校网络空间安全专业教学指导委员会委员,
  CCF杰出会员，CCF杰出演讲者。担任中国计算机学会普适计算专委会副主任、南京大学-南方电网数字平台工业互联网联合实验室主任。曾获江苏省科学技术奖一等奖（2016年/2019年两次获得）、国家级教学成果奖一等奖、宝钢优秀教师奖、高校计算机专业优秀教师奖励计划、江苏省六大人才高峰创新人才团队、国际会议MobiQuitous/Metaverse最佳论文奖、国际期刊TPDS的SpotlightPaper等荣誉称号，成果入选江苏省行业领域十大科技进展。主要研究领域为“具身智能多模态感知计算”与“大小模型协同边缘智能”，具体包括：1)
  面向工业互联网/新型电力系统的感算控分布式协同技术研究，2) 基于具身智能的多模态感知协同融合技术研究，3) 基于摩尔纹视觉的新型感知技术研究，4) 基于毫米波/超声波/RFID的新型无线感知技术研究，5)
  面向工业互联网/智能电网/智慧医疗的分布式系统与大模型智能体研发。目前共发表论文150余篇，包括国际一流学术会议MOBICOM、UBICOMP、INFOCOM，国际一流学术期刊JSAC、TON、TMC、TPDS等。主持了国家自然科学基金重大研究计划-重点支持项目、国家重点研发计划项目课题、江苏省基础研究计划重点项目等重大科研项目，研究成果为工业互联网、新型电力系统、智慧医疗领域“感传算控一体化”的发展实现了基础理论突破，提供了核心技术支撑，并在多家大型制造/能源企业和三甲医院开展示范应用。培养的学生中多人次获得ACM中国优秀博士学位论文、江苏省优秀博士学位论文、校长特别奖学金、谷歌计算机学科奖学金等，并被国家电网、南方电网、华为、腾讯、阿里巴巴、字节跳动、大疆科技、华泰证券等知名企业聘用，以及在美国卡耐基梅隆大学、哥伦比亚大学、密西根大学等知名大学进一步深造。

