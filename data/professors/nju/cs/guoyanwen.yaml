bio_raw: '郭延文：南京大学教授、博导，计算机软件新技术全国重点实验室研究人员，PI。浙江大学博士、美国伊利诺伊大学香槟分校和香港大学等访问学者。主要研究方向为三维计算机视觉和智能图形学、人工智能，研究成果发表在ACM
  TOG, IEEE T-PAMI/TVCG/TIP/TMM/TGRS、《中国科学》等领域顶级期刊以及ACM Siggraph/NeurIPS/ ICCV/CVPR/ECCV/VR等顶级会议，论文被引用5000余次，获授权发明专利30余项；主持国家自然科学基金重点项目和十三五装发预研等国家级重要研目以及江苏省杰出青年科学基金研目，团队负责与华为、OPPO、三星等头部公司合作项目二十余项，成果转化产生了良好的经济和社会效益，关于三维场景分析和智能重建的研究成果应用于流程工业数字化，显著提升了智能工厂、数字孪生构建的效率，系统性成果登载在《中国人工智能学会通讯》，受邀在中国科学院学部科学与技术前沿论坛做主题报告；牵头撰写的“加快江苏元宇宙技术创新和产业发展的对策建议”刊发在中共江苏省委宣传部《智库专报》。

  获得江苏省杰出青年科学基金和江苏省六大人才高峰高层次人才培养计划等支持，获陆增镛CAD/CG高科技奖、华为公司“难题揭榜”火花奖、南京大学中行奖教金等；担任CCF-A类期刊《IEEE
  Transactions on Visualization and Computer Graphics》编委（Associate Editor）, 中国图象图形学学会理事，江苏省计算机学会图形图像专委会主任和江苏省工程师学会常务理事兼虚拟现实与元宇宙专委会主任，ICCV、CVPR和PG、CAD&CG，Chinagraph等全国性或顶级国际学术会议程序委员或主席；多次担任国家自然科学基金多个类别重要项目的函评、会评和指南论证专家。培养的学生中多人次获江苏省优秀硕士论文、优秀本科论文一等奖、美国大学生数学建模大赛（MCM）一等奖、SUN/教育部杰出大学生创新项目奖等。

  电话：+86-25-8968-0928

