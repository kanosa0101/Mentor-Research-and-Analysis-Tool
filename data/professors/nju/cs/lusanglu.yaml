bio_raw: '陆桑璐，教授、博导，计算机软件新技术全国重点实验室副主任，CCF杰出会员。先后于1992年、1995年、1997年在南京大学计算机科学与技术系获学士、硕士、博士学位。曾在澳大利亚昆士兰大学、香港理工大学、美国威廉玛丽学院、德国哥廷根大学等进行访问和合作研究。主要研究方向是分布式计算、普适计算等。主持过包括国家自然科学基金重点、国家863计划、江苏省科技支撑/重点研发等国家、省部级重要科研项目；出版两部学术著作，在国际重要期刊IEEE
  Trans.系列（如ToN、TMC 、TPDS、TC）、JSAC、国内一级学报等，国际重要会议MobiCom、UbiComp、INFOCOM、MobiHoc、ICNP、ICDCS等发表论文。2004年入选教育部“新世纪优秀人才计划”，2017年入选江苏省“六大人才高峰”创新人才团队（团队带头人），多次获江苏省科学技术奖一等奖、二等奖。

  电话：89686757

  电子邮件：sanglu

  @

  nju.edu.cn'
