bio_raw: '赵建华教授学历简介 1．1989年9月，进入南京大学计算机系本科学习，1993年获理学学士(计算机软件)学位 2．1993年9月，进入南京大学计算机系研究生学习，
  1996年获工学硕士(计算机软件与理论)学位 3．1996年3月，于南京大学计算机系攻读博士学位，师从郑国梁教授， 1999年5月获工学博士学位。 4．攻读博士期间，
  1997年9月至 1998年10月在澳门联合国大学国际软件技术研究所 (UNU／IIST)学习和研究工作。 5．1999年4月进入南京大学计算机系从事教学科研工作
  研究兴趣与方向： 形式化方法(主要包括模型检验(Model checking)，数据精化技术)，软件工程，程序设计语言。 已发表论文： 1．并发实时系统的自动验证，软件学报，1999年2月，赵建华，郑国梁，Dang
  Van Hung 2． Message Conversion and A New Type System for OO-Model， SIGPLAN Notices
  32(9)：P61-67 (1997) Zhao Jianhua , Chen Jiajun，Zheng Guoliang 3．C十十的一种并发扩充方案，软件学报，第9卷第8期，1998年8月。陈家骏，赵建华，郑国梁。
  4．Hybird Regular Expressions． Lin Proceedings of the First International Workshop
  on Hybrid Systems： Computation and Control(HSCC''98)， Springer,Berkeley， California，1998．Li
  Xuandong，Zheng Tao，Hou jianmin，Zhao Jianhua，Zheng Guoliang． 5．On Checking Parallel
  Real-time Systems for Linear Duration Properties,In Proceedings of 5th International
  Symposium.FTRTFT''98,Lyngby,Denmark,September 1998.LNCS 1486.Zhao Jian Hua,Dang
  Van Hung.

  电话：83593433

