bio_raw: '李宣东，南京大学计算机科学与技术系教授、博士生导师，软件学院院长；

  兼任中国计算机学会软件工程专业委员会主任，国家自然科学基金委员会信息科学部专家咨询委员会委员，

  国务院学位委员会学科评议组成员（软件工程）。曾任南京大学计算机科学与技术系系主任（

  2006-2018

  ），中国计算机学会系统软件专业委员会主任（

  2015-2019

  ），江苏省计算机学会理事长（

  2010-2019

  ）。近年来主要教学与科研工作集中于复杂软件建模与分析、软件测试与验证，部分研究工作获

  2011

  年国家科技进步二等奖，

  2004

  年获得国家杰出青年科学基金资助。

  电话：025-89683671

  个人主页：

  http://cs.nju.edu.cn/lixuandong

  电子邮件：lxd@

  nju.edu.cn'
