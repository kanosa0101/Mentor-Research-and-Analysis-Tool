bio_raw: '史颖欢，博士，南京大学计算机学院教授、博士生导师。于2007和2013年在南京大学计算机科学与技术系（现计算机学院）获学士和博士学位。研究兴趣为机器学习、模式识别、医疗影像分析、医疗数据分析、脑机接口与脑信号解码。近年来，主持国自然重点项目、国自然优秀青年基金、国家重大科技专项课题、国家重点研发计划数字诊疗重点专项课题，江苏省前沿技术研发计划项目。以合作单位负责人承担国自然重大仪器研制项目。以一作/通作在Nature
  Machine Intelligence、CCF-A会议、IEEE/ACM汇刊等发表论文90余篇，学术引用1万余次。目前任中国计算机学会人工智能与模式识别专委、中国人工智能学会智能服务专委、模式识别专委委员、MICS执委、江苏省神经科学学会脑科学创新与转化分会常务委员。出版科普书籍《口袋里的人工智能-AI与健康医疗》一册。获得/入选中国仿真学会科技奖创新技术一等奖（第一完成人）、江苏省自然科学二等奖（第二完成人）、中国人民解放军军队医疗成果奖（第三完成人）、吴文俊人工智能优秀青年奖、中国科协青年人才托举工程、全国脑机接口十大杰出青年科学家、全球前2%顶尖科学家榜单，南京大学首届优秀研究生德育导师、南京大学优秀本科生班主任、南京大学青年五四奖章、江苏省计算机学会青年科技奖、中国计算机学会大数据会议最佳应用论文奖、IEEE
  ICME杰出领域主席、ACM南京新星奖、中国人工智能学会-华为MindSpore学术奖励基金优秀结题项目、《数据采集与处理》年度优秀论文等荣誉。

  有幸和学生共事科研，见证大家不断成长。课题组博士/硕士研究生获得/入选：国自然青年学生基础研究项目（博士研究生）、首届蚂蚁Intech博士生奖学金、首届中国科协青年博士生托举计划（托举学会：中国人工智能学会）、中国电子学会-腾讯博士生科研激励计划混元大模型专项、“中国茅台·国之栋梁”本硕博优才计划、江苏省人工智能学会优秀硕士论文、南京大学优秀硕士论文、南京大学栋梁奖学金特等奖、南京大学小米特等奖学金、南京大学研究生铸剑计划、南京大学博士研究生创新引领计划-创优项目，腾讯犀牛鸟精英人才计划，研究生国家奖学金（10+人次）等。

  个人主页：

  http://cs.nju.edu.cn/shiyh

  电子邮件：syh@nju.edu.cn'
