bio_raw: '林冰凯，本科

  (2010)

  和硕士

  (2013)

  毕业于上海交通大学

  ACM

  试点班。博士

  (2016)

  毕业于日本东京大学。

  2016-2019

  年在日本国立情报学研究所担任研究员。

  2019

  年入职南京大学。研究领域是参数复杂性、图算法、

  PCP

  理论和不可近似性。代表性成果包括：

  (1)

  独自解决了参数复杂性领域基础性难题

  k-BICLIQUE

  问题；

  (2)

  在集合覆盖问题与

  k

  团问题的参数算法不可近似性取得重要进展；

  (3)

  证明了指数时间假设蕴含参数不可近似假设。成果发表在

  Journal of the ACM (JACM)

  、

  SIAM Journal on Computing (SICOMP)

  、

  Information and Computation (IANDC)

  等国际重要期刊、以及

  STOC

  、

  FOCS

  、

  SODA

  、

  ICALP

  等国际重要会议。两篇合作论文获得理论计算机国际会议

  STOC

  ’

  24

  最佳论文奖与

  WG

  ’

  17

  最佳论文奖。两篇单独作者论文分别获国际算法会议

  SODA’15

  最佳论文奖和最佳学生论文奖以及欧洲理论计算机重要会议

  ICALP’19

  最佳论文奖。

  邮箱：

  lin@nju.edu.cn

  主页：

  https://sites.google.com/site/bingkai314159/'
