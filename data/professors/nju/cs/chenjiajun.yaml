bio_raw: '陈家骏，教授、博士生导师。南京大学计算机系自然语言处理实验室主任，中国中文信息学会理事。毕业于南京大学计算机软件专业，获学士、硕士和博士学位。

  从20世纪80年代就开始从事自然语言处理和软件工程领域的研究与系统开发工作，研究方向包括机器翻译、汉语语言处理以及程序设计语言等。承担过国家863高技术、国家自然科学基金、国家社科基金以及教育部博士点基金等项目的研究工作；获得过国家七•五科技攻关重大成果奖、教育部科技进步二等奖等科研奖励；发表学术论文180余篇，其中包括领域顶级会议和期刊（ACL、EMNLP、NAACL、TALLIP、TACL、AAAI、IJCAI等）论文50余篇。

  获南京大学2019年度赵世良讲座教授荣誉。主持了《程序设计》江苏省精品课程（2008年）建设，编写的教材（《程序设计教程－－用C++语言编程》，机械工业出版社）获得2009年度国家精品教材和国家十一五规划教材以及2015和2019年度江苏省重点教材建设。

  电话：89683672

  个人主页：

  http://cs.nju.edu.cn/chenjiajun

  电子邮件：chenjj@nju.edu.cn'
