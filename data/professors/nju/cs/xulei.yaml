bio_raw: '许蕾，南京大学副教授、博士生导师，研究方向为智能化软件分析测试。在

  ICSE

  、

  FSE

  、

  ISSTA

  、

  TACO

  、

  SCIS

  、软件学报等国内外高水平期刊、会议上发表三十余篇论文。担任软件学报、计算机学报、计算机研究与发展、

  TSE

  、

  TOSEM

  等国内外期刊、会议审稿人。开发的工具获中国软件大会原型竞赛二等奖。将授权专利成果转化于华为、华为云、

  OPPO

  公司等，支持企业解决基础软件的核心关键问题。

  个人主页：

  http://cs.nju.edu.cn/xulei

  电子邮件：xlei

  @

  nju.edu.cn'
