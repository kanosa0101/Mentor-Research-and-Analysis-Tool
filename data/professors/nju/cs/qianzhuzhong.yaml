bio_raw: '钱柱中，南京大学计算机学院教授、博士生导师，江苏省计算机学会网络与分布计算专委会副主任，入选江苏省

  333

  高层次人才培养工程，

  2007

  年

  6

  月在南京大学计算机科学与技术系获得工学博士学位，

  2008

  年和

  2009

  年分别于加拿大滑铁卢大学计算机科学学院和日本会津大学计算机工程学院进行访问研究。钱柱中博士长期从事智能计算系统、云边端协同计算等研究工作，近期聚焦大模型性能优化、分布式机器学习与异构算力调度等研究主题，主持国家重点研发子课题、国家自然科学基金、教育部创新科研基金、江苏省科技支撑等科研项目，获得江苏省科学技术奖一等奖（

  2016

  、

  2019

  ）和二等奖（

  2023

  ）、国家教学成果一等奖（

  2022

  ）和二等奖（

  2014

  ）等；与国家电网、中国移动、华为、腾讯等深入开展产学研合作，主持并落地各类科技成果转化项目

  15

  项，获得中国电机工程学会电力科学技术进步奖一等奖（

  2022

  ）、中国电力企业联合会科学技术奖一等奖（

  2022

  ）、国电南瑞科学技术奖一等奖（

  2024

  ）；在

  ACM/IEEE JSAC

  、

  ToN

  、

  TPDS

  、

  TC

  等重要学术期刊与

  INFOCOM

  、

  ICDCS

  等重要国际会议，发表论文

  100

  余篇，获得国际会议最佳论文（提名）奖

  6

  次；获得基础学科拔尖学生培养计划优秀导师奖，指导博士生获得

  ACM

  中国优秀博士论文提名奖（

  2015

  ）、江苏省优秀博士论文（

  2023

  ），指导本科生获得江苏省优秀毕业论文一等奖（

  2017

  ），指导本科生主持首批国家自然科学基金青年学生项目（

  2023

  ）。

  主页：

  http://cs.nju.edu.cn/qzz/

  邮件：

  qzz@nju.edu.cn'
