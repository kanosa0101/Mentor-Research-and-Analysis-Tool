bio_raw: '郭金涛，南京大学计算机学院毓秀博士后。2020年本科毕业于中国科学技术大学，2026年获南京大学计算机科学与技术博士学位。主要研究方向为机器学习、模式识别与领域泛化，重点关注复杂场景下的稳定表征学习与泛化能力提升，以及相关方法在医疗影像分析、脑机接口等领域的应用。主持中国科协青年人才托举工程博士生专项、南京大学博士研究生创新能力引领计划等科研项目，作为骨干参与国家自然科学基金重点项目、重大项目及国家科技创新2030重大项目等多项国家级科研项目。在IEEE
  TIP、ACM TOMM等国际高水平期刊及CVPR、ICCV、NeurIPS等CCF-A类国际会议发表学术论文10余篇，担任IEEE TCVST、CVPR、ICML、ICLR、NeurIPS等期刊、会议审稿人。

  个人主页：

  https://lingeringlight.github.io/

  电子邮件：guojintao@nju.edu.cn'
