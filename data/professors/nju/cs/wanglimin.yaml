bio_raw: '王利民，南京大学计算机学院教授、博士生导师。研究领域为计算机视觉和多模态大模型，专注视频理解与动作识别，在

  IJCV

  、

  T-PAMI

  、

  CVPR

  、

  ICCV

  、

  NeurIPS

  等学术期刊和会议发表论文

  100

  余篇，论文引用

  3.4

  万余次，两篇一作论文单篇引用超过

  4000

  次。在视频分析领域做出了一系列有代表性的工作，例如：

  TDD

  视频深度特征、

  TSN

  视频网络架构，

  VideoMAE

  视频预训练方法等。带领团队研发了首个性能领先的通用视频理解大模型

  InternVideo

  ，被

  Google

  、

  Meta

  、

  NVIDIA

  等知名企业关注和使用，产生了重要国际影响力。曾获得广东省技术发明一等奖，

  ACM MM 2023

  唯一最佳论文提名奖、世界人工智能大会青年优秀论文奖。入选

  2022

  年度

  AI 2000

  人工智能全球最具影响力学者榜单，

  2022

  年度全球华人

  AI

  青年学者榜单，

  2021-2023

  年度爱思唯尔中国高被引学者榜单。担任

  CVPR/ICCV/NeurIPS

  等会议的领域主席和

  TPAMI/IJCV

  编委。

  主页：

  http://wanglimin.github.io/

  邮箱：lmwang@nju.edu.cn'
