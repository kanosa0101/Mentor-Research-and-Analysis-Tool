bio_raw: '叶保留，博士、教授、博士生导师，现为中国计算机学会（

  CCF

  ）理事、

  CCF

  分布式计算与系统专委会副主任、

  CCF

  杰出会员，曾任

  CCF

  分布式计算与系统专委会秘书长、

  CCF

  南京分部主席。

  长期从事分布式计算与系统领域研究工作，包括云计算与边缘计算、边缘智能与分布式机器学习、新型存储体系结构，近年来先后主持国家自然科学基金重点项目、国家自然科学基金专项项目、国家重点研发计划课题、

  JW

  装备发展部预研项目、江苏省基础研究计划（重点项目）、江苏省重点研发计划项目、国家电网公司科技计划项目等重要科研项目的研究工作，在国内外权威学术期刊与重要学术会议发表论文

  120

  余篇，包括

  ACM MobiCom

  、

  USENIX ATC

  、

  IEEE INFOCOM

  、

  VLDB

  等国际一流学术会议及

  ToN

  、

  JSAC

  、

  TMC

  、

  TPDS

  、

  TC

  等

  IEEE/ACM Transactions

  汇刊，论文被遴选为

  TPDS

  、

  TC

  亮点论文，获

  APNet 2018

  最佳论文奖。在面向云端融合的大规模分布式数据处理支撑技术、面向端边智能服务的计算系统基础理论与方法等方面形成特色，创新成果先后获得

  2016

  年度江苏省科学技术奖一等奖（第三完成人）、

  2019

  年度江苏省科学技术奖一等奖（第一完成人）、

  2023

  年度江苏省科学技术奖二等奖（第三完成人）、

  2024

  年度上海市自然科学奖一等奖（第四完成人）。指导的研究生多次获得江苏省优秀硕士论文，并被华为、阿里巴巴、腾讯、字节跳动、百度、国家电网等知名企业聘用。

  个人主页网址：

  cs.nju.edu.cn/yebl

  电子邮箱：

  yebl@nju.edu.cn'
