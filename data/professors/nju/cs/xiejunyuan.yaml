bio_raw: '谢俊元 男，1961年生，南京大学计算机科学与技术系全职教授、博导，南京大学HPI研究院联合创始人（联合中德双方资源，围绕“海量数据分析与知识发现”联合培养博士研究生，并在此基础上进行产学研用一体化合作，德方合作伙伴是Hasso
  Plattner Institut, Potsdam University， http://www.hpi.uni-potsdam.de）、南大IIP研究组创始人（http://iip.nju.edu.cn，该研究组在理论研究的基础上，开发有实用导向的原型系统，基于论域特点进行有针对性的应用研究，面向垂直应用领域细分行业提供智能化解决方案），研究兴趣是智能Agent及多Agent系统、复杂网络理论与应用、智能信息处理及智能应用系统。截止2012年底，发表论文100+篇，授权发明专利10+项。产业化经验丰富，多项科研成果获得国家、省部级单位鉴定、验收的同时，多项研究成果成功产品化和商品化。负责完成过多个国家、省部级和企业合作项目，其中包括国家信息安全专项基金项目在内的多个重大科研和技术成果转化项目。主持研发的产品技术成果获得国家、省、市的多项奖励，其中包括省部级科技进步一等奖1次，二等奖3次，三等奖1次，国家优秀软件产品奖1
  次，省部级优秀软件产品奖5 次。

  电话：83685541

  电子邮件：jyxie

