bio_raw: '孙正兴，男，汉族，江苏省张家港市人，1996年于南京航空航天大学获博士学位，1999年南京大学博士后流动站出站后留校任教，现任南京大学计算机科学与技术系教授、博士生导师，江苏省微型电脑应用协会第五届理事会副理事长、多媒体及其应用技术专业委员会主任，江苏省计算机学会计算机辅助设计与图形学专业委员会主任，中国图像图形学会计算机动画与数字艺术专业委员会常务委员。先后主持“中国博士后科学基金”项目1项，“国家自然科学基金”项目两项，先后入选教育部“高等学校骨干教师资助计划（1999年度）”和“新世纪优秀人才资助计划（2004年度）”。主要研究领域为：多媒体计算、计算机视觉和感知人机交互。

