bio_raw: '杨若瑜，女，1977年生，安徽滁州人，副教授、硕士生导师。1997年毕业于南京大学计算机科学与技术系，获学士学位。2002年毕业于南京大学计算机科学与技术系，获工学博士学位并留校任教。2004年底被聘为副教授、硕士生导师至今。主要研究方向为图形识别、计算机视觉及三维建模和仿真。主持和参与多个研究或应用型项目。先后在《Automation
  in Construction》、ICPR（International Conference on Pattern Recognition）、GREC（ Graphics
  Recognition: International Workshop）、ICME（IEEE International Conference on Multimedia
  & Expo）等国际期刊或会议和《计算机学报》、《软件学报》、《计算机辅助设计与图形学学报》《计算机应用》等中文核心期刊发表学术论文三十余篇；作为主要完成人之一通过江苏省科技成果鉴定两项、获中国发明专利授权多项。获2007年教育部自然科学二等奖1项（计算机读图技术，个人排名第五）。江苏省计算机学会计算机辅助设计与图形学专委会常务委员，中国计算机学会会员。担任国家自然科学基金通信评审专家、《计算机辅助设计与图形学学报》等国内期刊审稿人。

