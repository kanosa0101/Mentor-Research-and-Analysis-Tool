bio_raw: '陈贵海，南京大学教授、博导、CCF会士、IEEE会士。1984年获南京大学计算机软件专业学士学位，1987年获东南大学计算机应用专业硕士学位，1997年获得香港大学计算机科学博士学位，1998年任日本九州工业大学访问教授，1999年任香港大学研究员，2000年任澳洲昆士兰大学访问教授，2001~2003年任美国韦恩州立大学访问教授。主要研究方向为分布式网络与数据处理，包括未来网络系统与协议、物联网与传感网、新型计算机体系结构、数据中心核心技术、数据分析与处理、AI模型与边缘智能等。已发表论文700余篇，包括IEEE
  Trans论文120余篇。Google Scholar引用22000余次，单篇论文最高引用1500余次。多次获得包括CCF A类或B类国际会议的论文奖，包括2009年MOBICOM最佳展示提名奖、2011年INFOCOM学生最佳展示一等奖、2014年ICCS最佳学生论文奖、2014年AAMAS全球交易代理竞赛冠军、2015年ICNP最佳论文奖、2016年ICPADS最佳论文奖、2016年CloudComp最佳论文奖、2017年DSAFA最佳论文奖、2017年INFOCOM最佳论文提名奖、2018年CSoNet最佳学生论文奖、2018年AAIM最佳学生论文奖、2019年ICPADS最佳论文奖、2020年IWQoS最佳论文奖、2023年UbiComp优秀论文奖。现为中国计算机学会分布计算与系统专委会名誉主任、ACM
  SIGCOMM China主席、华为全国重点实验室学术委员。担任国际学术会议的程序委员或主席60余次。曾获多种奖励，包括2000年江苏省跨世纪学术带头人称号、2001年江苏省教学成果二等奖、2002年教育部高校青年教师奖、2003年国家自然科学基金委员会项目特优评价、2004年中创软件人才奖、2005年南京市人民政府颁发的留学回国人员特殊贡献奖、2006年江苏省六大人才高峰称号、2008年国家杰出青年科学基金、2011年国务院政府特殊津贴、2015年教育部自然科学一等奖、2018年江苏省科学技术一等奖、2021年CCF自然科学一等奖。

