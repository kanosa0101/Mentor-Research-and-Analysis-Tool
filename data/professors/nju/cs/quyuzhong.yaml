bio_raw: '瞿裕忠教授，博士生导师。1965年9月出生，1985年7月毕业于复旦大学数学系，1988年7月获复旦大学数学专业硕士学位，1995年4月获南京大学计算机软件专业博士学位。1999年上半年作为访问学者在美国北卡州大开展合作研究。在来南京大学工作之前，在东南大学工作了15年。现任中国计算机学会系统软件专业委员会委员和软件工程专业委员会委员。主要研究方向包括万维网科学(Web
  Science)、语义万维网（Semantic Web）、计算机软件方法与技术。多次担任国际语义万维网会议(ISWC)、欧洲语义万维网会议或扩展语义万维网会议(ESWC)、以及亚洲语义万维网会议(ASWC)等会议的程序委员，担任过中国语义万维网研讨会(CSWS2009)联合主席。先后承担包括国家自然科学基金项目、国家973计划课题、江苏省基础研究计划重点项目和国家863课题在内的科研项目近十项，发表学术论文50余篇，在国际万维网大会、语义万维网会议和万维网科学会议上有多篇论文发表。曾获多种奖励，包括2004年教育部
  “新世纪优秀人才”称号、2008年江苏省“六大人才高峰”称号和2007年度江苏省科技进步二等奖。

  个人主页：

  http://cs.nju.edu.cn/qyz

  电子邮件：yzqu@nju.edu.cn'
