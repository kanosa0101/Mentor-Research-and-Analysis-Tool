bio_raw: '梁红瑾，2009年本科毕业于中国科学技术大学少年班，2014年博士毕业于中国科学技术大学计算机学院，2014-2017年在中国科学技术大学计算机学院担任副研究员，2017年加入南京大学。研究方向是程序设计语言理论。在POPL、PLDI、TOPLAS等程序设计语言领域顶级国际会议与期刊上发表多篇论文，多次担任POPL、PLDI等国际会议的程序委员会委员。

  个人主页：https://hongjin-liang.github.io/

  电子邮件：hongjin@nju.edu.cn'
