bio_raw: '许畅，现为南京大学计算机软件新技术全国重点实验室和计算机学院教授、博士生导师。他于

  2000

  年在中国科学技术大学获得学士学位，

  2003

  年在中国科学院软件研究所获得硕士学位，

  2008

  年在香港科技大学获得博士学位。

  他于

  2008

  至

  2010

  年期间在香港科技大学计算机科学及工程学系担任研究助理教授，自

  2010

  年

  9

  月加入南京大学计算机软件新技术国家重点实验室（后重组为全国重点实验室）和计算机科学与技术系（后改名为计算机学院），担任副教授，于

  2015

  年提升为教授。他于

  2005

  和

  2006

  年获得

  IBM PhD Fellowship

  两次，

  2010

  年入选教育部新世纪优秀人才支持计划，

  2011

  年获得南京大学青年骨干教师称号和国家科学技术进步二等奖，

  2012

  年获得中创软件人才奖，

  2013

  年入选南京大学登峰人才支持计划，

  2014

  年获得南京大学北京银行

  “

  京

  ”

  英奖教金和

  ACM

  南京分会新星奖，

  2015

  年获得中国计算机学会

  CCF

  青年科学家奖，

  2017

  年获得南京大学杜厦奖教金和计算机学科美德之星奖励，

  2021

  年入选教育部

  “

  长江学者奖励计划

  ”

  特聘教授，

  2024

  年入选

  ACM

  杰出会员。

  他主持和参与了多项国家和省部级的科研项目，包括国家重点研发计划、

  973

  、

  863

  、自然基金（创新群体、重大、重点、中美软件合作、面上和青年）、以及教育部新世纪优秀人才支持计划等项目。他的研究兴趣包括大数据软件工程、智能软件测试与分析、以及自适应与自控软件系统。他发表了

  190

  余篇学术论文（被引

  3700

  多次），工作被包括

  ACM Transactions on Software Engineering and Methodology (TOSEM)

  、

  IEEE Transactions on Software Engineering (TSE)

  、

  ESEC/FSE

  、

  ICSE

  和

  ASE

  等在内的国际顶级期刊与会议（

  CCF-A

  类）所收录，获得了五次

  ACM SIGSOFT

  杰出论文奖（

  ICSE 2014

  、

  ASE 2018

  、两次

  ICSE 2021

  和

  ICSE 2025

  ）、四次最佳论文奖（

  APSEC 2014

  、

  ICSE 2021

  、

  SOSP 2023

  和

  EUROSYS 2025

  ）、以及一次最佳论文提名奖（

  ISSRE 2022

  ）。他组织了

  MIDDLEWARE 2013 Doctoral Symposium

  、

  FSE 2014 SEES Symposium

  、

  COMPSAC 2017 SETA Symposium

  和

  INTERNETWARE 2018

  ，服务于

  ESEC/FSE

  、

  ICSE

  和

  ASE

  等程序委员会，担任了

  Journal of Software: Evolution and Process

  、

  Journal of Computer Science and Technology

  、

  Frontiers of Computer Science

  和《计算机科学》等期刊编委、

  CCF

  系统软件专委副主任、以及教育部

  101

  计划课程建设组专家工作。

  个人主页：

  http://cs.nju.edu.cn/changxu

  电子邮件：changxu@nju.edu.cn

  办公电话：

  025-89680919'
