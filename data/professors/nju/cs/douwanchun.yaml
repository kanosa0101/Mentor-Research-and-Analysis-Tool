bio_raw: '窦万春，南京大学计算机学院教授，博士研究生导师，江苏省领军型人才团队负责人，主要研究内容为：云-边-端智能协同计算技术、智能工业互联网。先后入选教育部“新世纪优秀人才资助计划”、江苏省“333高层次人才培养计划”（第二层次）、江苏省“六大人才高峰计划(A类)。作为项目负责人，先后主持1项国家重点研发计划项目（首席科学家）、5项国家自然科学基金、6项江苏省重点研发计划项目/江苏省科技支撑计划项目等，相关研究成果分别获2018年江苏省科学技术一等奖、2022年山东省科学技术二等奖。在国内外国际期刊、国际会议发表论文300余篇、出版中英文专著3部。2023年入选斯坦福大学发布的世界顶尖科学家榜单，2024年入选国际学术机构ScholarGPS发布的全球0.05%顶尖科学家榜单。

  个人主页：

