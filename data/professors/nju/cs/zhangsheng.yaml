bio_raw: '张胜，博士，副教授，博士生导师。于2008年和2014年在南京大学计算机科学与技术系获理学学士和工学博士学位。主要研究方向为分布式计算与网络，具体包括边缘计算、边缘智能、云计算等。发表论文80余篇（其中CCF
  A类论文30余篇），包括IEEE JSAC、IEEE/ACM TON、IEEE TMC、IEEE TPDS、IEEE TC、ACM MobiHoc、IEEE INFOCOM、IEEE
  ICDCS等国际一流期刊/会议，被引1500余次。主持和参与国家自然科学基金面上和青年项目、江苏省自然科学基金面上项目、国家重点研发项目课题、国家自然科学基金重点项目在内的项目十余项。两次获得中国计算机学会-腾讯犀牛鸟项目资助。获得江苏省科学技术一等奖、ACM中国优秀博士论文提名奖（全国4人）、江苏省优秀博士论文奖、IEEE
  MASS最佳论文亚军奖、IEEE ICCCN最佳论文奖、NASAC原型系统自由型竞赛优秀奖、ACM南京分会新星奖、ACM南京分会优秀博士论文奖、南京大学优秀博士论文奖等奖项。担任中国计算机学会分布式计算与系统专委会委员，江苏省计算机学会网络与分布计算专委会委员等职务。担任重要国际学术会议如INFOCOM、MASS、ICPADS、ICC等程序委员会委员，获得IEEE
  INFOCOM卓越程序委员会委员等荣誉。担任JSAC、TON、TMC、TPDS等国际一流期刊审稿人。指导学生多人次获得国家奖学金、校长特别奖学金、华为奖学金、南京大学优秀本科毕业论文、南京大学计算机科学与技术系优秀硕士论文等奖项，被阿里巴巴、华为、蚂蚁金服、微软、英特尔、京东、拼多多等公司聘用，以及在美国卡内基美隆大学、哥伦比亚大学等名校深造。

  个人主页：

  http://cs.nju.edu.cn/sheng

  电子邮件：sheng

  @

  nju.edu.cn'
