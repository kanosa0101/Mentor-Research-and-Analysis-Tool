bio_raw: '李樾，南京大学计算机学院教授，博士生导师，入选国家级青年人才计划、南京大学登峰人才计划，南京大学紫金学者。2016年博士毕业于澳大利亚新南威尔士大学，
  之后先后在新南威尔士大学（编译组）与丹麦奥胡斯大学（程序设计语言组）从事博士后研究工作。 研究方向为程序设计语言与程序分析，在程序设计语言与软件领域相关国际顶级期刊与会议，如TOPLAS、PLDI、POPL、OOPSLA等发表学术论文30余篇。
  曾获ICSE 2025最佳软件制品奖、ICSE 2025 杰出论文奖、OOPSLA 2023杰出软件制品奖、ECOOP 2016 杰出论文奖，CGO 2013最佳论文奖和ISSRE
  2017最佳论文提名等学术奖项。目前担任软件领域顶刊ACM Transactions on Software Engineering and Methodology
  (TOSEM) Associate Editor。 其讲授的两门程序设计语言专业课程《计算机程序的构造和解释》、《软件分析》选课均超百人，均获得毕业生“我心目中的好课程”。与谭添老师共同创建并管理PASCAL（程序设计语言与静态分析）研究组，研发“太阿”、“骑河”等通用型软件与硬件程序分析平台，和学生们一道不断深挖拓展程序分析技术的边界。

  个人主页：

  https://cs.nju.edu.cn/yueli

  Email：yueli@nju.edu.cn'
