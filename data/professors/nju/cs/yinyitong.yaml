bio_raw: '尹一通，教授，博士生导师；2003年本科毕业于南京大学计算机科学与技术系；2009年博士毕业于耶鲁大学计算机科学系，同年回到母校南京大学任教。
  至今已开设课程：高级算法、组合数学、随机算法、概率论等。

  尹一通的研究领域为理论计算机科学。以“数据科学的计算理论基础”为线索，主要研究兴趣包括：随机算法、计算采样理论、计算相变、数据结构、并行与分布式计算理论等。在JACM、SICOMP、STOC、FOCS、SODA等理论计算机科学的重要期刊与会议发表论文五十余篇。主持国家重点研发计划项目“数据科学的若干基础理论”，获国家自然科学基金优秀青年科学基金，多次受邀参加UC
  Berkeley Simons计算理论研究所的访问项目。在UC Berkeley Simons计算理论研究所、EPFL伯努利数学中心、亨利-庞加莱研究所IHP、佐治亚理工学院算法与随机性中心ARC、爱丁堡大学计算机科学基础实验室LFCS、韩国科学技术院KAIST、全国理论计算机科学年会NCTCS
  2019、STOC 2020 workshop、IJTCS-FAW 2021等重要学术单位及学术场合做邀请报告。曾获CCF/IEEE CS青年科学家奖、中创软件人才奖、教育部新世纪人才、SPAA优秀论文奖、南京大学青年五四奖章、南京大学杜厦奖教金、南京大学计算机系奖教金、南京大学登峰人才、南京大学中青年优秀骨干教师等。指导博士生获得CCF优秀博士学位论文奖、江苏省优秀博士学位论文奖、南京大学优秀博士学位论文奖等荣誉。

  担任南京大学理论计算机科学研究组的团队负责人（主页：

  http://tcs.nju.edu.cn

  ）。

  个人主页：

  http://tcs.nju.edu.cn/yinyt/

  电子邮件：yinyt@nju.edu.cn'
