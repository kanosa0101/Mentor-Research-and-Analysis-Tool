bio_raw: '李武军

  ，博士，

  教授

  ，

  博导

  。研究方向为人工智能、机器学习与大数据。

  2003

  年毕业于南京大学计算机科学与技术系，获理学学士学位；

  2006

  年毕业于南京大学计算机科学与技术系，获工学硕士学位；

  2010

  年毕业于香港科技大学计算机科学与工程系，获工学博士学位。

  2010

  年

  9

  月至

  2013

  年

  12

  月于上海交通大学计算机科学与工程系从事教学与科研工作，任讲师和副教授。

  2014

  年

  1

  月加入南京大学计算机科学与技术系，入选南京大学登峰人才支持计划（

  B

  层次）。

  2021

  年获得

  AI 2000

  人工智能全球最具影响力学者奖。近年来，在大数据机器学习领域（包括哈希学习和分布式机器学习等方向）开展了系统地深入研究，取得了一系列创新成果，并将其应用于互联网、医疗、安防、网络安全和油气勘探等领域。在

  AAAI/CVPR/ICML/IJCAI/MICCAI/NIPS/TIP/TKDE/

  《科学通报》等国内外知名会议和期刊上发表学术论文

  50

  余篇，获授权发明专利

  3

  项，申请发明专利

  20

  余项。

  论文被国内外同行广泛引用，引用者来自斯坦福、伯克利、剑桥大学等国际著名机构，包括中

  、

  美

  、

  英

  、加、欧等

  国

  /

  地的

  20

  余位

  科学院

  /

  工

  程

  院院士

  和

  80

  余位

  AAAI/ACM/IEEE Fellow

  。截至

  2021

  年

  3

  月，四篇论文（

  2

  篇

  AAAI

  ，

  1

  篇

  IJCAI

  ，

  1

  篇

  SIGIR

  ）入选

  Paper Digest

  最具影响力论文（

  https://www.paperdigest.org/best-paper-digest/

  ），一篇论文入选

  2019

  年领跑者

  5000

  （

  F5000

  ）中国精品科技期刊高被引论文。研究成果

  被国际著名学者评价为“首个方法”、“先进水平”等。

  主持科研项目

  10

  余项，包括国家重点研发计划课题、国家自然科学基金以及腾讯、字节跳动、国家电网、中石油等企业的横向项目。参与了阿里巴巴云计算平台（

  “

  飞天

  ”

  ）的研发，并参与编写关于

  “

  飞天

  ”

  的第一本专著《飞天开放平台编程指南

  –

  阿里云计算的实践》。

  研究成果应用于多家大型企业和国家重要部门。担任包括

  AAAI/CVPR/ICCV/ICML/IJCAI/NIPS/SIKDD

  等

  CCF-A

  类会议在内的

  国内

  外知名会

  议领域主席

  /

  高级

  程序

  委员

  /

  程序

  委员

  60

  余次

  ，担任包括

  IEEE TIP/TKDE/TPAMI/AIJ/IJCV/JMLR/ACM TOIS

  等

  CCF-A

  类期刊在内的

  20

  余种

  国内

  外

  知名期刊审稿人。

  指

  导

  的学生

  获得

  华

  为

  天

  才

  少

  年

  、阿里星（每年阿里巴巴集团

  10

  名左右获得者）、百度奖学金（每年全球共

  10

  名获得者）和多次国内外竞赛的冠亚军等荣誉

  。更多信息请参见个人主页：

  http://cs.nju.edu.cn/lwj/

  。

  个人主页：

  http://cs.nju.edu.cn/lwj'
