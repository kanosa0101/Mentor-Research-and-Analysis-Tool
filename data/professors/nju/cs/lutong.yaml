bio_raw: '路

  通，男，南京大学计算机学院教授、博导，计算机软件新技术全国重点实验室成员，研究方向为模式识别与计算机视觉。现任南京大学计算机学院副院长、南京大学计算机类学科学位委员会主任、南京大学学位评定委员会委员、南京大学卓越工程师学院学位委员会委员、北京中关村学院（国家人工智能学院）学位委员会委员等。

  主持各类科研项目

  40

  余项，主持江苏省研究生教改重点课题

  1

  项，入选省部级人才计划

  4

  项，先后获

  教育部自然科学二等奖、高校计算机专业优秀教师、江苏省教学成果奖等。

  发表高水平论文一百余篇，其中

  3

  篇分获

  Paper Digest

  发布的计算机视觉顶会

  CVPR

  、

  ICCV

  、

  ECCV

  “十大最有影响力论文”，

  1

  篇入选

  Zeta Alpha

  发布的全球

  100

  篇引用最高

  AI

  论文。谷歌学术引用

  20000+

  次，单篇最高引用

  4711

  次，连续入选爱思唯尔全球高被引学者。指导研究生获得

  CVPR 2022

  、

  2023

  、

  2024

  年全球自动驾驶等十多项赛事冠军；指导的博士生李志琦以排名第一入选“南京大学十大年度人物”，并作为中国高校首位博士生获得

  NVIDIA

  全球奖学金；指导的博士生王文海获中国图形图像学会

  2023

  年优博提名，并获

  2023

  年世界人工智能大会青年优秀论文奖；指导的博士生陈喆获首批国家自然科学基金青年学生（博士生）项目资助，并获

  2025

  年世界人工智能大会青年优秀论文奖。此外，先后获南京大学优秀党支部书记、南京大学党内评优通报表彰、南京大学五四评优奖章等，指导江苏省高校本科优秀毕业设计团队

  1

  项，主讲的课程连续多年入选

  AI

  学院本科毕业生“我心目中的好课程”。

