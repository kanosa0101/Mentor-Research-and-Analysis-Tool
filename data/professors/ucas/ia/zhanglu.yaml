  个人简历

  张璐，中国科学院自动化研究所多模态人工智能系统全国重点实验室副研究员，获中国科学院特别研究助理人才项目资助。发表国际期刊与会议论文20余篇，包括IEEE-TPAMI,
  IEEE-TNNLS, Information Fusion，IEEE-RAL, IEEE-ICCV, IEEE-ICRA, IEEE-ICASSP等机器人与人工智能领域的高水平SCI论文及国际顶级会议，申请发明专利8项。承担或参与国家自然科学基金委、科技部等部门项目（课题）10余项。在国家自然科学基金委主办的水下机器人抓取大赛中，2017、2018连续两年取得两次第一名；获2019年“天智杯”人工智能挑战赛目标检测季军。

  教育背景和工作经历：

  2024.09–至今，中国科学院自动化研究所，副研究员

  2021.07–2024.8，中国科学院自动化研究所，助理研究员

  2016.09–2021.06，中国科学院自动化研究所，模式识别与智能系统，工学博士

  2012.09–2016.06，山东大学，控制科学与工程学院，自动化专业，工学学士

  研究方向

  机器人多模态感知、具身智能

  承担科研项目情况

  1.

  面向无人平台的多模态图像目标检测算法研究，2023.1-2025.12，国家自然科学基金青年基金，30万，项目负责人

  2.

  中国科学院特别研究助理资助项目，2022.3-2024.12，中国科学院人才项目，60万，项目负责人

  3. XX信息融合分析，2022.8-2025.2，XX项目独立课题，335/2300万，课题负责人

