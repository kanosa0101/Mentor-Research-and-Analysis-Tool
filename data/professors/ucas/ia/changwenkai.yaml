  个人简历

  常文凯于2013年获得华北电力大学自动化专业学士学位，2018年获得中国科学院自动化研究所控制理论与控制工程专业博士学位。目前是中国科学院自动化研究所复杂系统认知与决策实验室的副研究员。研究兴趣包括水下机器人、数据驱动的机器学习和机器人感知等。

  研究方向

  研究兴趣包括水下机器人、数据驱动的机器学习和机器人感知等

  承担科研项目情况

  (1) 国家自然科学基金委员会, 面上项目, 62373353, 仿䲟鱼机器人水下自主吸附控制研究, 2024-01-01至 2027-12-31, 50万元,
  在研, 参与

  (2) 国家自然科学基金委员会, 面上项目, 62273342, 双臂机器人灵巧操作的多模态表征与技能学习,2023-01-01 至 2026-12-31, 54万元,
  在研, 参与

  (3) 国家自然科学基金委员会, 面上项目, 62073316, 面向生物体捕获的水下机器人仿生设计与自主控制,2021-01-01 至 2024-12-31,
  59万元, 在研, 参与

  (4) 国家自然科学基金委员会, 青年科学基金项目, 62003342, 巡线目标样本的隐式结构表征机制及其合成方法, 2021-01-01 至 2023-12-31,
  24万元, 资助期满, 主持

  (5) 国家自然科学基金委员会, 面上项目, 61973303, 仿蝠鲼机器人水下视觉环境感知与智能跟踪控制,2020-01-01 至 2023-12-31,
  60万元, 资助期满, 参与

