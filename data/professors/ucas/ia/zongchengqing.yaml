bio_raw: '宗成庆

  /

  研究生毕业

  职　　称:

  正高级

  电子邮件:

  cqzong@nlpr.ia.ac.cn

  通讯地址:

  北京市海淀区中关村东路95号

  个人简历

  研究员，博士生导师，中国科学院大学岗位教授（A类），电气与电子工程师协会会士（IEEE Fellow），国际计算语言学学会会士（ACL Fellow），亚太人工智能学会会士（AAIA
  Fellow)，中国人工智能学会会士（CAAI Fellow），中国计算机学会会士（CCF Fellow），2025年4月当选欧洲科学院(Academia Europaea)外籍院士。

  于1998年3月毕业于中国科学院计算技术研究所，获博士学位。 1998年5月至2000年4月在中国科学院自动化研究所模式识别国家重点实验室从事博士后研究，博士后出站后留在自动化所工作至今。
  1999年和2001年两次在日本国际电气通信基础技术研究所（ATR）做客座研究员，2004年在法国信息与应用数学研究院（IMAG）做高访。 曾于2006年至2014年担任模式识别国家重点实验室副主任。

  长期从事自然语言处理、机器翻译和语言认知计算等研究，作为项目负责人主持国家自然科学基金重点项目和国家重点研发计划重点专项等10余项，发表论文200余篇，出版学术专著6部、译著两部。2025年担任本领域顶级学术组织国际计算语言学学会(ACL)主席，现任国际计算语言学委员会(ICCL)委员、中国中文信息学会副理事长，曾任亚洲自然语言处理学会(AFNLP)主席，国际顶级学术会议ACL2015程序委员会主席和ACL2021大会主席。荣获国家科技进步奖二等奖和北京市科技进步奖一等奖等多个省部级及国家一级学会的科技奖励，曾获北京市优秀教师、中国科学院优秀导师和国科大李佩教学名师奖等多种荣誉。享受国务院特殊津贴。

  研究方向

  自然语言处理，机器翻译，文本数据挖掘，人机对话系统等'
