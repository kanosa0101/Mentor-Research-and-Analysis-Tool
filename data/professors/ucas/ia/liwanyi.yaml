  多模态人工智能系统全国重点实验室

  通讯地址:

  北京市海淀区中关村东路95号自动化大厦419室

  个人简历

  教育经历：

  (1) 2010-09 至 2014-01, 中国科学院自动化研究所, 控制理论与控制工程, 博士

  (2) 2007-09 至 2010-07, 贵州大学, 计算机应用技术, 硕士

  (3) 2005-03 至 2007-01, 贵州教育学院, 计算机科学与技术, 学士

  (4) 1997-09 至 2000-07, 贵州省黔西师范学校, 小学教育, 其他

  博士后工作经历：

  (1) 2014-05 至 2017-09, 中国工程物理研究院 激光聚变研究中心

  科研与学术工作经历（博士后工作经历除外）：

  (1) 2016-11 至 今, 中国科学院, 自动化研究所, 副研究员

  (2) 2017-07 至 2017-10, City University of Hong Kong, Department of MBE, 副研究员

  (3) 2014-01 至 2016-10, 中国科学院, 自动化研究所, 助理研究员

  (4) 2000-09 至 2005-01, 贵州省大方县毛栗小学, 数学组, 教员

  研究方向

  机器人感知与操作学习、终身机器学习理论方法及应用

  承担科研项目情况

  作为负责人承担：国家自然科学基金青年及面上、科技委领域基金、装备预研、中国博士后基金等项目10余项；并作为技术骨干参与科技创新2030“新一代人工智能”重大项目等多项。部分项目如下：

  1.面向灵巧操作的类人高效学习技术研究，科技委领域基金，2024-2026，负责人

  2.具有终身学习能力的动态开放环境目标感知，2021-2024，主要完成人

  3.基于点云深度学习的光机组件三维位姿估计与跟踪，国家自然基金面上项目，2018-2021, 负责人

  4. 多频段目标探测与信息融合处理技术，装备预研项目，2019-2020， 负责人

  5. 基于快速视觉注意模型和深度学习的视觉跟踪，国家自然科学基金青年项目，2015-2017,负责人

  6. 基于 RGBD 传感器的大型激光装置光机组件检测与位姿测量,中国博士后基金2015 -2016，负责人

  代表论著

  在Cell子刊iScience, Neurocomputing, IEEE Transactions on Cognitive and Developmental
  Systems等重要期刊及ICRA、ICPR等国际会议上发表论文20余篇。代表性论文如下：

  (1) Wanyi Li; Wei Wei; Peng Wang ; Neuro-inspired Continual Anthropomorphic Grasping,
  iScience, 2023, 0(0)( IF: 5.8, JCR Q1, Cell子刊，第一作者 )

  (2) Wanyi Li; Wei Wei; Peng Wang ; Continual Learning for Anthropomorphic Hand Grasping,
  IEEE Transactions on Cognitive and Developmental Systems, 2023, 0(0) (  IF:4.5,
  JCR Q2，第一作者 )

  (3) Wanyi Li; Peng Wang; Hong Qiao ; Robust object tracking guided by top-down spectral
  analysis visual attention, Neurocomputing, 2015, 152: 170-178 ( IF:6.0, JCR Q2,第一作者
  )

  (4) Wanyi Li; Peng Wang; Hong Qiao ; Top-down visual attention integrated particle
  filter for robust object tracking, Signal Processing: Image Communication, 2016,
  43: 28-41 ( IF: 3.5，JCR Q2, 第一作者 )

  (5) Weiping Liu; Jia Sun; Wanyi Li; Ting Hu; Peng Wang ; Deep Learning on Point
  Clouds and Its Application: A Survey, Sensors, 2019, 19(19): 4188 (  IF: 3.8, JCR
  Q2,通讯作者)

  获奖及荣誉

  获省部级科技成果转化奖一等奖1项;论文入选“中国精品科技期刊顶尖学术论文(F5000)”, 获国际会议优秀论文1次; ；获评中科院自动化所“优秀党员”

  专利成果

  (1) 王鹏; 罗永康; 黎万义; 乔红 ; 一种显著性区域检测方法及装置, 2017-1-15, 中国,

  2014103017979

  (2) 孙佳; 王鹏; 黎万义; 罗永康 ; 基于视觉注意建模融合的缺陷样本自动标注方法及系统, 2022-09-

  02, 中国, CN202110555658.9

  社会任职

  国家自然科学基金委项目评审专家，担任《IEEE Robotics and Automation Letters》、《IEEE Transactions on Industrial
  Informatics》、《Expert Systems with Applications》、《自动化学报》、《计算机学报》等国际国内一流期刊审稿人'
