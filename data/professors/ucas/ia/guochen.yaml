  个人简历

  工学博士，毕业于北京邮电大学信号与信息处理专业。

  2009年7月-2014年8月 普天信息技术研究院有限责任公司，3G和4G通信系统研发。

  2014年8月-2023年8月 中国科学院自动化研究所国家专用集成电路设计工程技术研究中心，高级工程师。主要研究方向为高性能数字信号处理器在通信领域及超算领域的应用与发展。

  2023年9月-至今 中国科学院自动化研究所复杂系统管理与控制国家重点实验室，高级工程师。主要研究方向为智能光学系统。

  研究方向

  智能光学

