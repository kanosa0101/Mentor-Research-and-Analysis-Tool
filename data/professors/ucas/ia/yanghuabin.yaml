bio_raw: '杨化彬

  /

  职　　称:

  副研究员

  邮　　编:

  100190

  电子邮件:

  huabin.yang@ia.ac.cn

  部门/实验室:

  中国科学院工业视觉智能装备技术工程实验室

  通讯地址:

  北京市海淀区中关村东路95号自动化大厦712室

  个人简历

  杨化彬，博士研究生，2015年获中国科学院大学博士学位，一直从事工业视觉检测方面的工作，包括需求定义、整机结构及系统开发设计等相关工作，相关工作成果在多个行业规模应用，应用领域包括手机、显示面板、家居板材、半导体等，产生经济价值达数亿元。

  研究方向

  工业产品外观缺陷检测

  代表论著

  [1] Li, Tengyang, Zhang, Feng, Yang, Huabin, Luo, Huiyuan, Zhang, Zhengtao. A Novel
  Method for LCD Module Alignment and Particle Detection in Anisotropic Conductive
  Film Bonding. MACHINES[J]. 2023, 11(1): http://dx.doi.org/10.3390/machines11010049.

  [2]Yunpeng Li, Bo Chen, Xuejing Dai, Hongchen Yang, Huapeng Wang, Huabin Yang, Xiaoduo
  Wang, Xiaodong Wang, Yang Liu. Temperature environmental adaptability on electrical
  and stress properties of Ge film in space[J]. Journal of Materials Research and
  Technology, 2021;15:6670-6677. (SCI)

  [3]Gong XY, Hu Su, De Xu, Huabin Yang, Zhengtao Zhang, Lei Zhang.(2019).Contour
  Extraction and Quality Inspection for Inner Structure of Deep Hole Components.IEEE
  Transactions on Components, Packaging and Manufacturing Technology,9(3),575-585.

  专利成果

  (1)内窥镜套件以及包含该内窥镜套件的工业内窥镜检测系统，发明，第1作者，专利号: 201610962759.7

  (2)插针式自动上料定位装置，发明，第1作者，专利号: 201610269269.9

  (3)图像的缺陷检测方法，发明，第6作者，专利号: 201611143938.4

  (4)白玻璃板表面崩边缺陷检测方法，发明，第6作者，专利号: 201611001403.3

  (5)基于显微视觉的白玻表面缺陷检测方法.，发明，第3作者，专利号: 201611092438.2

  社会任职

  2016年-至今，担任中科慧远视觉技术（洛阳）有限公司'
