  个人简历

  汪胜佩，中科院自动化所副研究员，长期从事医学影像和神经调控的方法与应用研究，以多模态电生理和脑影像为技术手段，融合认知神经科学、复杂网络科学、系统动力学、人工智能科学和精神病学等多学科理论，提出一系列跨领域交叉的分析方法，在赋能智能医疗具体应用任务的同时，系统地解决了精神病学智能诊疗和精准调控中的瓶颈问题。已累计发表SCI论文19篇，以第一（含共一）/通讯作者发表SCI论文6篇，作为项目负责人和项目骨干承担多项国家和省部级项目，研究成果已在神经调控和医疗领域进行推广和试点应用。教育经历：
  (1) 2014-09 至 2020-10, 中国科学院大学, 模式识别与智能系统, 博士 ；(2) 2009-09 至 2013-06, 华东理工大学, 测控技术与仪器,
  学士； 科研与学术工作经历： (1) 2023-07 至 今, 中国科学院, 自动化研究所, 副研究员 (2) 2020-10 至 2023-06, 中国科学院,
  自动化研究所, 助理研究员

  研究方向

  神经计算与神经调控

  承担科研项目情况

  国家自然科学基金委员会，青年科学基金项目，62201569，面向抑郁症的重复经颅磁刺激个体化调控的关键技术研究，2023-01-01至2025-12-31，30万元，在研，主持；科技部,
  重点研发计划, 2023YFF1205300, 面向生机交互的高通量读译控关键技术及应用, 2023-11至 2026-10, 300万元, 在研, 参与；国家自然科学基金委员会，面上项目，62276262，面向脑卒中运动功能康复的闭环重复经颅磁刺激关键技术研究，2023-01-01至2026-12-31，53万元，在研，参与；国家自然科学基金委员会，面上项目，82071906，原发开角型青光眼患者杏仁核及皮层下通路和脑网络改变及机制研究，2021-01-01至2024-12-31，54万元，在研，参与；国家自然科学基金委员会，国际(地区)合作与交流项目，62020106015，青光眼患者的脑网络调控及视觉修复研究，2021-01-01至2025-12-31，230万元，在研，参与

