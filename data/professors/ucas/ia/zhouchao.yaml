  个人简历

  周超，男，中国科学院自动化研究所研究员。2003年毕业于东南大学，获得学士学位；2008 年毕业于中国科学院自动化研究所，获博士学位，同年留所工作。先后主持国家863计划、国家自然科学基金项目等多项科研项目，发表学术论文100余篇，包括在LSA、IEEE
  TRO，IEEE TMECH、IS等国际刊物；发明专利授权60余项。近年来主要在仿生机器鱼，仿生机器人、微操作机器人、机器人运动控制等方面开展研究工作。

