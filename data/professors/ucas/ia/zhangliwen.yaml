  个人简历

  长期面向国家量子科技、深空探测、无人系统等重大战略需求，致力于多模态智能感知与物理信息建模研究，重点开展融合物理先验知识与数据驱动方法的科学人工智能理论与方法研究，解决复杂系统建模中的高维非线性、数据稀疏及多物理场耦合难题。

  【研究领域】

  1.大模型驱动的信息检索与智能建模分析： 紧密结合国家量子计量基准自主化与极低温制冷（重点攻坚任务）、温度计量等前沿需求，针对极低温流体物性数据稀缺、机理复杂等特点，创新性地将物理信息神经网络、符号回归等人工智能方法引入物性分析与温度计量学领域，重点突破高维非线性、数据稀疏、多物理场耦合等复杂系统的建模、预测与控制问题。

  2. 多模态图像分析： 针对国家重大科研设施项目需求 （国自然基金委重大科研仪器研制项目，经费约8000万），开展磁信号成像系统研制及多模态医学影像融合分析研究。此外，面向无人检测系统研发的战略需求，深入研究基于文本信息搜索与物理场等多源异构数据的跨模态融合与推理技术。构建了面向复杂环境的软硬一体化智能控制与感知系统。

  【学术成果与项目】

  迄今在

  AAAI

  、

  IEEE TKDE

  、

  JAMA Network Open

  、

  IEEE TMI

  、

  Advanced Science

  等高水平期刊与会议发表论文20余篇，申请/授权发明专利10余项。作为负责人主持国家自然科学基金、面上项目、科技部重点研发计划课题、中科院仪器子课题项目；作为核心骨干参与国家重大科研仪器研制专项，具备从理论创新、算法研发到智能探测与计量装备自主研制的能力。

  教育经历

  2018-9至2021-7，中国科学院自动化研究所，计算机应用技术，博士。

  2015-9至2018-7，中国科学院自动化研究所联合培养，控制理论与控制工程，硕士。

  工作经历

  2021.07至2024.09， 中国科学院自动化研究所，复杂系统管理与控制国家重点实验室，助理研究员。

  2024.09至今， 中国科学院自动化研究所，复杂系统认知与决策重点实验室，副研究员。

  招生信息

  组内每年可招收2-4

  名研究生

  ，招生方向：在自动化所、中国科学院大学人工智能学院、未来技术学院、前沿交叉学院招收人工智能、计算机、数学、物理等和人工智能结合的相关专业，特别是对人工智能和低温制冷、温度计量等前沿方向有浓厚兴趣，有意愿实习的学生也可以联系，组内有充足的算力资源，实习优秀者优先推荐攻读硕士或者博士。

