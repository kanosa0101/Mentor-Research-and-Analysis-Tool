bio_raw: "王秀娟\n/\n1.\t2005.9-2011.6 中国农业大学资源与环境学院 土地利用与信息技术 农学博士\n2.\t2007.11-2009.10,\
  \ 2010.6-2011.2 巴黎中央理工大学应用数学实验室 应用数学 理学博士\n3.\t2001.9-2005.7 中国农业大学信息与电气工程学院 计算机科学与技术专业\
  \ 工学学士                 4.\tJul 2014~Now: Research Scientist in Smart Agriculture,\
  \ CASIA\n职　　称:\n副研究员\n邮　　编:\n100190\n电子邮件:\nxiujuan.wang@ia.ac.cn\n部门/实验室:\n多模态人工智能系统全国重点实验室\n\
  通讯地址:\n北京市中关村东路95号自动化大厦918室\n个人简历\n2005年获中国农业大学信息与电气工程学院计算机科学与技术学士学位，同年考入资源与环境学院硕博连读。2007.11-2009.11获国家留学基金委公派留学资助，作为联合培养博士生赴法国巴黎中央理工大学应用数学实验室学习两年，并于2010年获法国奖学金继续在法学习近一年。2011年到中科院自动化研究所从事博士后工作，2014年留所工作至今。主要研究方向为智慧农业和植物生长建模相关研究。主持国家自然科学基金委青年项目1项，新一代人工智能重大项目子课题1项，国重复杂实验室青年基金项目1项，参与国家自然科学基金、科技部、中科院以及横向课题等项目10余项。发表论文40余篇，其中SCI/EI论文15篇，包括\
  \ Plant Phenomics, IEEE/CAA Journal of Automatica Sinica, IEEE Transactions on Cybernetics,\
  \ Frontiers in Plant Science, Annals of Applied Biology, Field Crops Research等，授权发明专利7项。\n\
  研究方向\n计算植物，智慧农业\n承担科研项目情况\n1.\t2021.12-2024.12，科技创新“2030”新一代人工智能重大项目子课题，2021ZD0113701,\
  \ 农作物水稻和大豆环境及生命状态识别，在研，主持\n2.\t2022.01-2024.12，中科院-荷兰“垂直农场”领域合作项目，, 159231KYSB20200010,\
  \ TWINERGY：以数字孪生提升垂直农场能源利用效率,在研, 参与\n3.\t2020/01-2022/12，中国科学院与泰国科技发展署合作研究资助项目，GJHZ20176，基于作物生长的温室环境控制系统研究，结题，参与\n\
  4.\t2019/01-2022/05，中国科学院A类先导项目子课题，基于复杂系统平行理论的防风固沙效应可视化模拟与智能决策， XDA20030000，结题，参与\n\
  5.\t2018/01-2020/12，国家自然科学基金青年项目，31700315，油菜产量构成因素形成的时间动态和空间特征模型研究，结题，主持\n6.\t2015/01-2017/12，国家自然科学基金青年项目，31400623，基于三维空间结构和光线追踪算法的树木冠层光分布研究，结题，参与\n\
  7.\t2015/01-2015/12，复杂系统管理与控制国家重点实验室青年研究基金，99S9021F4N，结题，主持\n代表论著\n1.\tWang, X.\
