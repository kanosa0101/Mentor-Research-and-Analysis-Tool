bio_raw: '沈丽君

  /

  博士研究生

  职　　称:

  副研究员

  邮　　编:

  100190

  电子邮件:

  lijun.shen@ia.ac.cn

  部门/实验室:

  脑图谱与类脑智能实验室

  通讯地址:

  北京市海淀区中关村东路95号，自动化大厦207A

  个人简历

  中国科学院自动化研究所副研究员、中国自动化学会智能健康与生物信息专业委员会委员、系统仿真学报青年编委。从事电子显微图像微观结构智能分析技术研究多年，发表相关高质量论文20余篇，获得国家授权专利10余项，软件著作权20余项。主持开发的超大规模数据管理与智能分析系统有效应对大体量突触水平神经结构重建过程中PB级数据管理以及人工校验效率瓶颈等问题，能够保证研究平台稳定高效地获得各类模式动物、功能脑区精细准确的微观脑连接图谱，进而助力国家脑计划的顺利实施。

  研究方向

  超大规模数据管理与分布式计算、大规模微尺度神经网络分析

  承担科研项目情况

  2022ZD0211902，脑认知与分子细胞图谱平台研究，参与单位课题负责人，2022.8至2027.7，250万元

  E1J5040401， 怀柔科学城脑智技术产业转化， 中国科学院人工智能创新研究院2035创新任务， 子任务负责人， 2021.1至2023.12， 300万元

  E3J1230101，基于透射电镜的大视场病毒检测技术功能开发， 中国科学院仪器设备功能开发技术创新项目， 项目负责人， 2020.9至2023.9，30万元

  E1F3230101，基于深度学习的纳米尺度高通量脑连接图谱解析研究，国家自然科学基面上项目，课题骨干，2022.1至2025.12，62.12万元

  Y8SA034L32，脑微观图谱新技术研究，中国科学院任务/战略性先导科技专项（B类），课题骨干，2018.1至2022.12，898万元

  E0G1230201，面向脑微观图谱的高通量技术体系研发及商业化应用，省部级项目，北京市科学技术委员会北京脑科学研究项目，子任务负责人，2020.9至2022.12，450万元

