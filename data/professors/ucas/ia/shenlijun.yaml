  ZL201811213274.3. 大视场光学显微图像成像装置及方法. 陈曦，韩华，沈丽君，马宏图.

  ZL201110014847.1. 一种基于MCA的图像超分辨率重建方法. 韩华，张旭，沈丽君，陈曦，谢启伟.

