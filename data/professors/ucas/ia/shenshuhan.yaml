bio_raw: "申抒含\n/\n职　　称:\n研究员\n邮　　编:\n100190\n电子邮件:\nshshen@nlpr.ia.ac.cn\n部门/实验室:\n\
  中国科学院工业视觉智能装备技术工程实验室\n通讯地址:\n北京市海淀区中关村东路95号\n个人简历\n申抒含，中国科学院自动化研究所研究员、博士生导师，中国科学院大学人工智能学院岗位教授，中科院工业视觉智能装备技术工程实验室副主任。研究领域为三维计算机视觉理论与应用，包括大规模场景三维重建、智能机器人三维环境感知、场景三维语义理解等。在计算机视觉、摄影测量、机器人等领域国际期刊和国际会议，如IEEE\
  \ Trans、IJCV、ISPRS JPRS、CVPR、ICCV、ICRA、IROS等发表论文80余篇。作为项目负责人主持国家自然科学基金联合重点项目、北京市自然科学基金联合重点项目、以及各类企业研发项目20余项。入选中科院青年创新促进会、中科院自动化所特聘青年骨干、中科院特聘研究岗位，曾获2016年ACM北京新星奖、2018年中国图像图形学会科学技术二等奖、2023年中国测绘学会科学技术一等奖、2023年中国自动化学会自然科学一等奖等。\n\
  研究方向\n三维计算机视觉，大规模场景三维重建，场景三维语义理解\n承担科研项目情况\n2023-2026, “恶劣天候下大规模复杂三维场景理解理论与方法”,\
  \ 国家自然科学基金-企业创新发展联合基金重点项目\n2023-2026, “城市场景三维语义矢量化重建关键问题研究”, 国家自然科学基金面上项目\n2023-2026,\
  \ “高精度稠密地图构建及定位用地图轻量化存储方法”, 北京市自然科学基金-小米创新联合基金重点项目\n2023-2026, “元宇宙三维数字孪生关键技术研究与示范应用”,\
  \ 河南省重点研发专项项目\n2022-2023, “基于倾斜摄影的点云语义分割和LOD2建筑物单体化系统”, 企业合作项目\n2022-2023, “电力走廊三维数字化检测平台”,\
  \ 企业合作项目\n2021-2023, “面向地理信息和定位导航的三维视觉系统与装备”, 中国科学院人工智能创新研究院2035创新任务\n2021-2022,\
  \ “城市场景高精三维感知与高效语义理解”, 模式识别国家重点实验室自主课题\n2020-2021, “高效矢量化地图构建与视觉定位”, 企业合作项目\n2019-2023,\
  \ “室内外大规模场景三维语义矢量重建技术”, 企业合作项目\n2019-2020, “基于手机图像采集的室内视觉定位技术”, 企业合作项目\n2019-2020,\
  \ “基于视觉的大规模室内场景重建与定位”, CCF-滴滴盖亚青年学者科研基金项目\n2019-2022, “中国古建三维数字化保护中的天地图像融合问题研究”,\
  \ 国家自然科学基金面上项目\n2017-2021, “基于语义分析的大规模场景视觉重建关键技术研究”, 国家自然科学基金重点项目子课题\n2016-2017,\
  \ “基于手机图像的桌面场景三维重建”, 企业合作项目\n2015-2018, “基于深度图融合的大场景多视图立体重建研究”, 国家自然科学基金面上项目\n2015-2018,\
