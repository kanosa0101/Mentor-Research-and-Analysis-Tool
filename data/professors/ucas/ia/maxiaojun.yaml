  研究领域

  数字信号处理系统研制；区块链专用硬件和芯片研制；集成电路研制；

  教育背景

  1998-03--2001-07   中国科学院自动化研究所   工学博士

  工作简历

  2001.9 ~ 2002.9 日本名古屋大学工学部 国家公派访问学者

  2002.9 ~ 今 中科院自动化所 国家专用集成电路工程中心 助研、副研、研究员

  （2017.11 ~ 今 国家专用集成电路工程中心 主持工作副主任）

  兼职经历

  中国自动化学会第十届理事会理事

  中国仪器仪表学会数字城市测控技术分会第一届理事会理事

  荣誉及奖励

  曾获国家科技进步二等奖

  科研项目

  2009年负责国家技改项目筹建实验中心，之后担任负责人，实验部门产地800平米，拥有九千多万元软硬件设备，是自动化所集成电路研制的重要保障。

  作为子任务负责人，参与多项国家重点型谱、核高基等重大项目，项目经费累计3.11亿。曾研制了国内一流的多机并行高温全速全功能测试系统，多项技术方案均为国内首创。

  2017年11月，担任国家专用集成电路工程中心主持工作副主任以来，在数字信号处理系统、集成电路研制、区块链专用硬件等方面深入开展研究工作，并承担多项任务。'
