  个人简历

  关强，男，研究员，2006年博士毕业于中国科学院自动化研究所。主持了国家自然科学基金和863计划项目。目前从事智能对抗方向研究，主要关注知识与学习混合驱动的智能体构建、决策指挥智能应用研究，目前负责多项国家级项目，先后完成了多个人机对抗系统研制。。

  研究方向

  博弈与决策智能

  代表论著

  RFID系统测试与应用实务, RFID System Testing and Applications, 电子工业出版社, 2010-11,

  专利成果

  （ 1 ） 基于RFID公共服务体系的读写器编码管理方法, 发明, 2009, 第 1 作者, 专利号: ZL200510126480.7

  （ 2 ） 一种RFID标签排列密度的基准测试系统及方法, 发明, 2012, 第 1 作者, 专利号: ZL201010185468.4

  （ 3 ） 基于激光测距和加速度测量的井下姿态测量系统及方法, 发明, 2011, 第 1 作者, 专利号: ZL201110451812.4

  （ 4 ） 基于射频识别技术的防伪专用读写器与管理方法 , 发明, 2011, 第 2 作者, 专利号: ZL200610104118.4

  （ 5 ） 一种RFID标签介质影响的基准测试系统及方法, 发明, 2010, 第 1 作者, 专利号: ZL201010185459.5

  （ 6 ） 基于赋优先级事件图的复杂事件调度方法, 发明, 2011, 第 1 作者, 专利号: ZL201110443232.0

  （ 7 ） 对无线射频识别服务系统进行自动化测量的系统与方法 , 发明, 2010, 第 2 作者, 专利号: ZL200610113240.8

  社会任职

  2011-10-31-今,中国系统仿真学会智能物联系统专业委员会, 副主任委员'
