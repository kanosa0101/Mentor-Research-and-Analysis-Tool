  通讯地址:

  北京市海淀区中关村东路95号

  个人简历

  2019-09~至今, 中国科学院自动化研究所, 副研究员                                             2017-07~2019-10,中国科学院自动化研究所, 助理研究员

  研究方向

  研究目标为研发面向轮式机器人、推荐系统应用的强化学习算法，重点涉及强化学习、自动驾驶轨迹预测、决策规划等算法开发。

  承担科研项目情况

  （1）数据驱动的仿真交通场景生成方法研究, 主持, 国家级, 2021-01--2025-12

  （2）强交互场景下联合轨迹规划算法与模型研究, 主持, 企业合作, 2023-11--2024-11

  （3）基于智能计算的列车关键区段路侧感知及车辆定位理论与方法  课题参与，  北京市自然科学基金  2019-12至2022-12

  （4）“限定场景交通仿真smart agent算法研究合作项目技术开发”  主持  横向课题

  代表论著

  （1） Ding Li, Qichao Zhang*, Shuai Lu, Yifeng Pan, Dongbin Zhao, “Conditional goal-oriented
  trajectory prediction for interacting vehicles,” IEEE Transactions on Neural Networks
  and Learning Systems，2023，第2作者 (通信作者)                            （2） Zhiyuan Zhang,
  Qichao Zhang*, Xiaoxu Wu, Xiaowen Shi, Guogang Liao, Yongkang Wang, Xingxing Wang
  and Dongbin Zhao, User response modeling in reinforcement learning for Ads allocation,
  The Web Conference 2024. 第2作者  (通信作者)                              （3） Qichao Zhang,Yinfeng
  Gao, Yikang Zhang, Youtian Guo, Dawei Ding, Yunpeng Wang, Peng Sun, Dongbin Zhao,
  “TrajGen: generating realistic and diverse trajectories with reactive and feasible
  agent behaviors for autonomous driving," IEEE Transactions on Intelligent Transportation
  Systems, DOI: 10.1109/TITS.2022.3202185, 2022.，第1作者

  获奖及荣誉

  1.北京市自然科学技术二等奖，2022年（排名第3）

  社会任职

  中国人工智能学会智能驾驶专委会，委员；

  中国计算机学会智能汽车专委会，执行委员；

  中国自动化学会自适应动态规划专委会，会员；

  中国自动化学会数据驱动学习控制专委会，会员；

  中国生产力促进中心汽车工作委员会，副秘书长'
