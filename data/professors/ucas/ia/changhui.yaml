  通讯地址:

  北京市海淀区中关村东路95号

  个人简历

  常慧，博士，中国科学院自动化研究所副研究员，长期从事服务机器人感知认知和多机器人系统等方向研究，在国家重大科研装备研制项目、国家重点研发计划、国家自然科学基金面上项目、北京市科技计划课题等多项课题支持下，承担并完成了机器人多模态协同感知等相关的研究工作。

  研究方向

  智能机器人、人工智能

  承担科研项目情况

  1.

  北京市科技计划课题：异构多维智能群体协同决策与智能控制关键技术研究与应用验证，主要完成人，2022-2023

  2.

  国家重点研发计划子课题：硬脆材料的激光加工中的激光光束调制及稳定性控制关键技术研究，负责人，2017-2021

  代表论著

  [1] Yi Pan, Yujia Zhang, Hui Chang, et al. Coarse-to-Fine Recurrently Aligned Transformer
  with Balance Tokens for Video Moment Retrieval and Highlight Detection, IJCNN,2024.

  [2] Chang H, Fan Z, Qiu J, et al. Beam-pointing drift prediction in pulsed lasers
  by a probabilistic learning approach. Applied optics, 2019, 58(4): 948-953.

  [3] 王琪,常慧,赵晓光,等. 利用平衡器官解剖标志构筑三维头影测量坐标系的方法. 专利号：ZL202410126189.2.

  [4]常慧,樊仲维,葛文琦,等. 一种应用于光斑整形的二值图像的生成方法. 专利号：CN113096205B.

  [5] 常慧, 樊仲维, 葛文琦, 韩哲, 袁洪. 一种应用于光斑振幅调制整形的调制图像生成方法.专利号: CN202110255504.8

  社会任职

  中国指挥与控制学会智能可穿戴技术专业委员会委员'
