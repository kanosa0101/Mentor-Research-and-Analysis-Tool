  个人简历

  程健，博士，目前担任中国科学院自动化研究所研究员、博导，中国科学院大学岗位教授，国家高层次领军人才，中科南京人工智能创新研究院副院长。主要研究深度学习， 图像与视频内容分析、智能芯片架构设计等问题。在IEEE
  TPAMI、TNNLS、TCAD、JMLR、NeurIPS、ICML、ICLR、HPCA、MICRO、CVPR、ICCV、AAAI 等高水平杂志和会议上发表学术论文100余篇。

  研究方向

  高效神经网络计算、智能科学计算（AI4S）、无人自主系统

  招生信息请访问个人主页：

  https://people.ucas.ac.cn/~chengjian

  承担科研项目情况

  北京市科委“支持超大模型研发和产业应用的深度学习框架研发”，2023.12-2025.12，任务负责人。

  科技部“新一代人工智能”重大项目，项目负责人，2020.07-2023.06。

  国家自然科学基金委“深度神经网络高效计算方法研究”，2020.1-2023.12，课题负责人。

  中科院先导“类脑视听觉芯片架构设计方法”，2018.01-2022.12，课题负责人。

