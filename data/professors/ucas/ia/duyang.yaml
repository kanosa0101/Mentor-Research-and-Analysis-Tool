  个人简历

  研究领域

  ：医学分子影像，医学图像处理与分析，医学影像大数据分析

  个人简介

  ：杜洋，研究员，博士生导师，中科院分子影像重点实验室副主任。主要聚焦肿瘤多模态分子影像新技术研发及临床转化应用研究，共发表SCI论文百余篇，其中作为第一或通讯作者（含共同）在Nat
  Rev Clin Onco (封面文章)，Nat Rev Bioeng (封面文章)，Nat Commun，Cell Rep Med，Adv Sci，IEEE
  Trans Med Imaging，Eur J Nucl Med Mol Imaging，J Immunother Cancer，EBioMedicine，Angew
  Chem Int Ed Engl (封面文章)及Adv Mater等权威期刊上发表系列论文，连续入选全球前2%顶尖科学家榜单（World’s Top 2% Scientists
  2023-2025），授权20余项中美发明专利，制定中国图学学会团体标准4项已发布。相关研究成果曾获世界分子影像大会（WMIC）最佳预临床研究论文奖（每年仅1项）和女科学家奖，黄家驷生物医学工程一等奖、中华医学科学技术奖二等奖以及北京市科学技术奖自然科学奖二等、北京医学科技奖二等奖等。主持国家基金委区域联合重点项目、面上项目、中科院科研装备研制项目，及科技部重点研发计划和国家基金委重大研究计划集成项目课题等。任中国图学会医学图像与设备专业委员会常委、中国医促会肿瘤免疫治疗学分会常委等多个学术任职。

