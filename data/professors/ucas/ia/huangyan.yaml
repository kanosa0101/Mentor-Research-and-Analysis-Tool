  个人简历

  黄岩，研究员，2012年获电子科技大学学士学位，2017年获中科院大学博士学位。研究方向为视觉-语言理解与视频分析。目前已在相关领域权威会议和期刊上发表70多篇文章，包括TPAMI,
  TIP, NeurIPS, CVPR, ICCV 和AAAI等。相关论文曾获得CVPR Workshop最佳论文奖、ICPR最佳学生论文奖、RACV最佳墙报奖。相关技术曾获得VOT
  Challenge和WIDER Challenge两项冠军。成功组织ICCV和CVPR会议期间的3次国际研讨会。曾获得中科院院长特别奖、中国人工智能学会优秀博士论文奖、北京市优秀青年人才称号、NVIDIA
  创新研究奖、百度奖学金等奖项，入选中国科协青年人才托举工程、北京市科技新星计划和微软铸星计划。

  研究方向

  计算机视觉

  代表论著

  (1) Yan Huang; Jingdong Wang; Liang Wang ; Few-Shot Image and Sentence Matching
  via Aligned

  Cross-Modal Memory, IEEE Transactions on Pattern Analysis and Machine Intelligence
  (TPAMI), 2022,

  44(6): 2968-2983

