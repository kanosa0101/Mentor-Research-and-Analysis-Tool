  2970-

  2983

  (3) Yan Huang; Qi Wu; Wei Wang; Liang Wang ; Image and Sentence Matching via Semantic

  Concepts and Order Learning, IEEE Transactions on Pattern Analysis and Machine Intelligence

  (TPAMI), 2020, 42(3): 636-650

  获奖及荣誉

  CSIG青年科学家奖、中国科学院院长特别奖、CAAI优博'
