bio_raw: "董迪\n/\n博士研究生\n职　　称:\n研究员\n邮　　编:\n100190\n电子邮件:\ndi.dong@ia.ac.cn\n部门/实验室:\n\
  中国科学院分子影像重点实验室\n通讯地址:\n北京市海淀区中关村东路95号智能化大厦904\n个人简历\n董迪，工学博士，基金委优青，中国科学院自动化研究所研究员，博士生研究生导师，中科院分子影像重点实验室影像组学方向负责人，中科院青年创新促进会优秀会员，北京癌症防治学会胃癌防治专委会常务委员，中国医师协会放射医师分会互联网与大数据影像专业组副组长，入选了“全国医学影像领域学者论文学术影响力排名(2012~2021)\
  \ Top 100”学者，入选美国斯坦福大学团队和爱思唯尔数据库发布的全球前2%顶尖科学家榜单（World's Top 2% Scientists 2022），中国图象图形学会“青年科学家”获得者，全国胃癌学术大会“未来科学家”，国家科技部重点研发计划青年科学家项目首席科学家（诊疗装备与生物医用材料）。\n\
  牵头主持国家基金委优秀青年基金项目、国家基金委重大研究计划培育项目、科技部重点研发计划青年科学家项目等多项。在肿瘤影像组学和医学影像大数据智能分析等方面开展了长期的研究工作，提高了影像辅助肿瘤诊疗的效果，近年来在医学领域主流SCI期刊Annals\
  \ of Oncology (SCI IF: 50.5，2篇)，European Respiratory Journal (SCI IF: 24.3)等上发表论文100余篇，ESI\
  \ Top 1%高被引论文12篇，谷歌H因子55，2篇论文入选2021年中国医学影像领域TOP100高价值论文，1篇论文获评2022 IEEE Engineering\
  \ in Medicine and Biology Prize Paper Award，Web of Science检索胃癌影像组学和鼻咽癌影像组学两个方向，申请人发表的2篇论文引用次数均排名国际第一。研究连续五年（2019-2023）纳入《中国临床肿瘤学会CSCO胃癌诊疗指南》，被写入美国、日本等十余国家专家在Gut杂志上联合撰写的胃食管结合部肿瘤国际临床共识，入选基金委重大研究计划中期亮点成果，并获评为首都前沿学术成果。此外，还获四川省科技进步一等奖，获授权国家发明专利25项，申请软件著作权23项。多次在影像组学会议、北美放射年会、世界分子影像会议、国际生物医学工程会议等国际主流会议上做口头报告。\n\
