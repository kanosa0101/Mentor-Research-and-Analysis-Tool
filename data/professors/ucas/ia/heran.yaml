bio_raw: "赫然\n/\n职　　称:\n研究员\n邮　　编:\n100190\n电子邮件:\nrhe@nlpr.ia.ac.cn\n部门/实验室:\n多模态人工智能系统全国重点实验室\n\
  通讯地址:\n北京市海淀区中关村东路98号智能化大厦\n个人简历\n赫然，研究员，IAPR Fellow。主要研究方向是模式识别、生成式人工智能和计算机视觉，并应用到异质图像合成与识别、深度伪造与鉴别。获国家优秀青年科学基金、北京杰出青年科学基金、国家自然联合重点基金、国家重点研发课题和中科院青年促进会优秀会员等项目支持。出版学术专著2部，在权威国际期刊IEEE\
  \ TPAMI和IJCV上发表论文23篇，第一作者谷歌学术引用过百论文11篇。获IEEE信号处理协会最佳青年论文奖、ICPR最佳科学论文奖、ICB最佳论文提名奖和北京青年优秀科技论文一等奖，以及中国科学院优秀导师(2023/2024)、李佩优秀讲师奖、朱李月华优秀教师奖、中国科学院大学领雁奖等；指导学生获得IEEE生物特征理事会优秀博士论文、北京市优秀博士论文、中国科学院优秀博士论文等。担任IEEE\
  \ TIP/TIFS/TCSVT/TBIOM、Pattern Recognition和自动化学报等多个国内外期刊编委，NeurIPS/ICML/ICLR/CVPR/ECCV等会议领域主席，ACPR/PRCV/CCBR等会议程序主席。\n\
  研究方向\n模式识别,计算机视觉,机器学习, 深度学习\n承担科研项目情况\n(1) 生物特征生成与安全理论和方法研究, 主持, 国家级, 2022-01--2025-12\n\
  (2) 异质人脸图像迁移技术合作项目, 主持, 院级, 2019-01--2019-12\n(3) 基于对抗学习的视觉计算理论与方法研究, 主持, 省级, 2018-11--2021-12\n\
  (4) 对抗式图像模式分析理论与方法, 主持, 市地级, 2018-01--2020-12\n(5) 多视角人脸图像合成技术合作项目, 主持, 院级, 2017-12--2018-11\n\
  (6) 基于深度学习的人脸超分辨率技术合作项目, 主持, 院级, 2017-11--2018-10\n(7) 对抗生成网络及在视觉中的应用, 主持, 省级, 2017-08--2018-10\n\
  (8) 视觉大数据透彻感知特征学习方法, 主持, 国家级, 2016-07--2020-06\n(9) 图像分析与模式识别, 主持, 国家级, 2017-01--2019-12\n\
  (10) 基于结构约束的多模态学习理论和方法, 主持, 国家级, 2015-01--2018-12\n(11) 基于非凸共轭函数的鲁棒学习理论和方法研究, 主持,\
  \ 国家级, 2012-01--2014-12\n(12) 鲁棒非负稀疏表示方法及应用研究, 主持, 国家级, 2010-01--2012-12\n代表论著\n\
