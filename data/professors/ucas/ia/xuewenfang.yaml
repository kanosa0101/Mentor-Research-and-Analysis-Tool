bio_raw: "薛文芳\n/\n职　　称:\n副研究员\n邮　　编:\n100190\n电子邮件:\nwenfang.xue@ia.ac.cn\n部门/实验室:\n\
  智能感知与计算研究中心\n通讯地址:\n北京市海淀区中关村东路104号智能化大厦\n个人简历\n薛文芳，副研究员，硕士生导师。2002年在北京航空航天大学获得通信与信息系统专业博士学位，2003年在中国科学院自动化研究所模式识别国家重点实验室从事博士后研究工作，2005年留所工作。主持和参与外交部与基金委联合资助重大研究计划、中国科协海智计划、“新一代人工智能”重大专项等多个国家级重点项目。研究新型机器学习/强化学习算法和新型图数据建模分析框架，提升大宗商品价格预测稳定性、可解释性和推理认知能力。目前正全力整合金融、科技、产业、政策，协力打造全球投资智慧风控综合智库，服务中国企业更好走出去。相关研究成果获得外交部郑泽光副部长的高度认可和专函表扬，获得新华网和中央电视台的多次报道。\n\
  研究方向\n新型机器学习/强化学习算法和新型图数据建模分析框架\n承担科研项目情况\n1.\t科技创新2030“新一代人工智能”重大项目，网络多媒体反伪造基础理论和技术研究，\
  \ 2020.7-2023.6\n2.\t科技创新2030“新一代人工智能”重大项目，对抗推演关键技术及系统研发,2020.7-2023.6\n3.\t国家自然科学基金委员会，面上项目，空间目标光度微变化计算感知方法研究，2021-01至2024-12。\n\
  4.\t中国科学院战略性先导科技专项，地球大数据科学工程，2018.1-2022.12\n5.\t中国科学院人工智能创新研究院，2035创新团队专项子任务，数据驱动的重大事件演化传播建模研究与实现，2020-01至2022-12。\n\
  6.\t天津市发展改革委员会，服务业升级项目， 国际产能合作风险评估与信息服务平台，2018-01至2021-12。\n7.\t天津市滨海新区合作共建研发平台科技项目“京津冀企业走出去公共服务平台”，2018-02至2021-12。\n\
  8.\t外交部，重大外交政策研究年度课题，人工智能等科技革命发展趋势对国际形势和格局的影响及我对策，2017-01至2017-12。\n代表论著\n1.\tBo-Jing\
  \ Feng* Xi Cheng* Hao-Nan Xu Wen-Fang Xue，Corporate Credit Ratings Based on Hierarchical\
  \ Heterogeneous Graph Neural Networks，Machine Intelligence Research,12 Januart,2024\n\
  2.\tHaonan Xu, Jiange Li, Peng Wang, Xianchen Yin, Wenfang Xue. Fusing Multi-Granularity\
  \ Data for Stock Trend Prediction with Contrastive Pre-training[C]//Proceedings\
  \ of the 2023 15th International Conference on Machine Learning and Computing. 2023:\
  \ 597-601.\n3.\tHaonan Xu, Wenfang Xue. Spatial-Temporal Graph Neural Networks Fusing\
  \ Multiple Data[C]//2022 4th International Conference on Frontiers Technology of\
  \ Information and Computer (ICFTIC). IEEE, 2022: 414-418.\n4.\tBojing Feng, Haonan\
  \ Xu, Wenfang Xue, Bindang Xue. Every Corporation Owns Its Structure: Corporate\
  \ Credit Rating via Graph Neural Networks[C]//Chinese Conference on Pattern Recognition\
  \ and Computer Vision (PRCV). Cham: Springer International Publishing, 2022: 688-699.\n\
  5.\tBojing Feng, Wenfang Xue,Contrastive Pre-training for Imbalanced Corporate Credit\
  \ Ratings, ICMLC 2022\n6.\tBojing Feng, Wenfang Xue,Adversarial Semi-supervised\
  \ Learning for Corporate Credit Rating，Journal of Software，Volume 16, Number 6,\
  \ November 2021，pp.259-266.\n7.\tBojing Feng ,Wenfang Xue, Every Corporation, Owns\
  \ Its Image: Corporate Credit   Ratings via Convolutional Neural Networks 2020 IEEE\
  \ 6th International Conference on Computer and Communications Chengdu，China.\n8.\t\
  Bindang Xue* ; Shaojie Zheng; Wenfang Xue; Multi-scale adaptive factors video acceleration\
  \ magnification, Signal Processing: Image Communication, 2018, 71(2019): 36-44."
