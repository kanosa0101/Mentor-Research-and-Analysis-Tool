  个人简历

  郭海云，2013年本科毕业于武汉大学，2018年博士毕业于中国科学院大学。现为中国科学院自动化研究所大模型中心副研究员、硕士研究生导师。十余年来一直从事多模态内容理解、大模型高效训练方面的应用基础研究，同时也涉及了特征表示、连续学习、领域自适应、自监督学习方面的相关理论研究。至今共发表或录用高水平论文
  40 余篇，其中一作或通讯作者论文 20 篇。Google Scholar 引用次数总计 1287，H-index 15。申请国家发明专利20 多项。主笔起草智能交通领域行业标准
  2 项，参与制定 3 项大模型方向国家标准。入选北京科协2022-2024 年度青年人才托举工程，获得北京市自然科学二等奖、欧洲图形学会议三维目标检索竞赛第一名、吴文俊人工智能科学技术进步二等奖、中国发明协会发明创新二等奖等
  10 余项荣誉。主持或参与科技部重大项目、国家自然科学基金、广东省重点研发计划项目等 10 余项纵向项目，研究内容涵盖大模型训练与应用、多模态理解、视频图像分析等，承担经费累计超过
  3000 万元。所研发的核心技术为智慧交通、智慧安防、智能监管等产业服务，并与阿里、华为、影谱科技、公安部交通管理科学研究所、中国电子进出口有限公司等多家单位开展了技术合作。

  研究方向

  多模态理解，大模型高效训练，持续学习

  承担科研项目情况

  主持科技部重大项目课题1项、国家自然科学基金青年项目1项、广东省重点研发计划项目课题2项、阿里巴巴创新研究计划项目1项、公安部交通管理科学研究所开放课题1项，作为技术骨干参与国家自然科学基金面上项目3项、工信部揭榜挂帅项目1项、中科院STS双创计划项目1项、广州市领军团队项目1项。所研发的核心技术为智慧交通、智慧安防、智能监管等产业服务，并与阿里、华为、公安部交通管理科学研究所、中国电子进出口有限公司等多家单位开展了技术合作。

