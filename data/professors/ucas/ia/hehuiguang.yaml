  个人简历

  何晖光，中国科学院自动化研究所研究员，博士生导师，中国科学院特聘核心岗位研究员，国家高层次领军人才。先后主持包括多项国家自然科学基金、863项目、国家重点研究计划课题等多个重要项目。先后获得国家科技进步二等奖两项（排二、排三），北京市科技进步奖两项，教育部科技进步一等奖（排三），中国科学院首届优秀博士论文奖等奖项。入选国家高层次人才计划，北京市科技新星，中国科学院“卢嘉锡青年人才奖”，中国科学院青年创新促进会优秀会员等。其研究领域为人工智能，医学影像分析，脑-机接口等，其研究结果在IEEE
  TPAMI/TNNLS/TCYB/TMI/TMM, ICML等发表文章200余篇。自动化学报编委，中国图象图形学报编委。IEEE高级会员, CCF/CSIG杰出会员。建国七十周年纪念章获得者。

  研究方向

  人工智能，医学影像分析，脑-机接口

