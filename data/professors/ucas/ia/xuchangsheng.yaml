  个人简历

  (1) 2008-05 至 今, 中国科学院自动化研究所, 模式识别国家重点实验室, 研究员

  (2) 2008-06 至 2016-03, 中国-新加坡数字媒体研究院, （China-Singapore Institute of Digital Media）,
  研究员

  (3) 1998-03 至 2008-05, 新加坡资讯通信研究院, 媒体分析实验室, 研究员

  研究方向

  多媒体分析与检索、计算机视觉、模式识别

  承担科研项目情况

  1. 国家自然科学基金联合基金项目—面向第一视角的多模态主动感知与交互方法研究；2024.1-2027.12

  2. 国家自然科学基金重点项目——面向领域大数据的跨媒体可解释分析与推理,2021.1-2025.12

  3. 国家自然科学基金国际(地区）合作与交流项目—基于实时行为数据的个性化健康管理2018.1-2022.12

  4. 国家重点研发计划项目—大数据多模态交互协同关键技术2017.10-2021.9

  5. 国家自然科学基金重点项目—大数据环境下复杂多媒体内容分析、推送与展示2015.1-2019.12

  6. 国家自然科学基金国家杰出青年科学基金项目—多媒体内容分析与搜索2013.1-2016.12

  7. 科技部973计划项目—物理与网络空间的协同感知2012.1-2016.12

