  1. 2018年中国电子学会自然科学一等奖

  2. 2020年政府特别津贴

  3. 2020年科技部创新人才推进计划重点领域创新团队负责人

  4. 2017年中国计算机学会杰出会员

  5. 2012/2013/2016/2027/2018/2020/2021年中国科学院优秀导师奖

  6. 2012年ACM Distinguished Scientist

  7. 2012年度杰出青年科学家获得者

  8. 2014年IAPR FELLOW

  9. 2014年 IEEE FELLOW

  社会任职

  1.ACM多媒体专委会中国区（ACM SIGMM China Chapter）主席

