  （ 9 ） 特定区域（北京汽车产业聚集区）工业互联网平台试验测试, 主持, 院级, 2020.11-2021.02

  （ 10 ） 中国科学院工业视觉智能装备技术工程实验室, 主持, 部委级, 2020.06-2023.06

