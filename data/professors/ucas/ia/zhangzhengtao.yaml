  个人简历

  张正涛，博士，中国科学院特聘核心研究员，博士生导师，中国科学院工业视觉智能装备技术工程实验室主任，自动化学会智能制造系统与技术专业委员会主任，工信部智能检测装备产业专家咨询委员会委员，中国科学院大学岗位教授，中国科学院青年联合会委员，洛阳市首届科技领军人才，洛阳市第一届优秀企业家，长期从事工业外观检测、计算机视觉、智能机器人系统的研究。在IEEE
  Trans.等高质量期刊发表学术论文60余篇，其中SCI论文24篇，合著图书2本，授权发明专利36项。主持及参与国家自然基金、国家基金委创新研究群体、重点研发计划、企业横向课题20余项，获2022年度中国科学院科技促进发展奖（排名第1
  ）、2023年度中国图象图形学学会科技进步奖一等奖（“复杂工业场景机器视觉鲁棒感知关键技术及应用”），获2013与2015年度北京市科技进步奖2项，河南省“河洛英才”计划与中国科学院青年创新人才计划支持。

  研究方向

  工业外观缺陷检测，智能机器人，显微视觉测量与控制，计算机视觉

