  （ 6 ） 基于明暗场融合的大口径光学元件表面损伤检测关键技术研究, 主持, 国家级, 2015.01-2018.12

  （ 7 ） 手机盖板玻璃外观精密检测关键装备研发, 主持, 部委级, 2017.07-2018.06

