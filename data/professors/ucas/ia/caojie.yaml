  个人简历

  曹杰，中国科学院自动化研究所多模态人工智能系统全国重点实验室副研究员，中国图象图形学学会视觉大数据专委会委员。2016年于华北电力大学获得学士学位，2021年于中国科学院大学获得模式识别与智能系统专业博士学位。主要从事计算机视觉和生成式模型方面的研究，以及多模态视觉内容生成鉴别、生物特征识别等应用领域。已在国际权威期刊（TPAMI、IJCV等）和会议（NeurIPS、CVPR等）发表论文30余篇，其中包括CCF-A类论文21篇。入选北京市科协青年人才托举工程，曾获得北京市科学技术进步奖二等奖、中国图象图形学学会博士学位论文激励计划、北京图像图形学学会优秀博士学位论文、北京市优秀毕业生。

  研究方向

  生成式模型、图像视频生成与编辑、视觉内容鉴别

  代表论著

  1. Jie Cao, Mandi Luo, Junchi Yu, Ming-Hsuan Yang, Ran He. ScoreMix: A Scalable
  Augmentation Strategy for Training GANs With Limited Data. IEEE Transactions on
  Pattern Analysis and Machine Intelligence (TPAMI), 2023.

  2. Jie Cao, Yibo Hu, Hongwen Zhang, Ran He, Zhenan Sun. Towards High Fidelity Face
  Frontalization in the Wild. International Journal of Computer Vision (IJCV), 2020.

  3. Jie Cao, Yibo Hu, Bing Yu, Ran He, Zhenan Sun. 3D Aided Duet GANs for Multi-View
  Face Image Synthesis. IEEE Transactions on Information Forensics and Security (TIFS),
  2020.

  4. Jie Cao, Yibo Hu, Hongwen Zhang, Ran He, Zhenan Sun. Learning a High Fidelity
  Pose Invariant Model for High-resolution Face Frontalization. in Conference on Neural
  Information Processing Systems (NeurIPS), 2018.

  5. Jie Cao, Luanxuan Hou, Ming-Hsuan Yang, Ran He, Zhenan Sun. ReMix: Towards Image-to-Image
  Translation with Limited Data. in Conference on Computer Vision and Pattern Recognition
  (CVPR), 2021.

  获奖及荣誉

  （1）北京市科协青年人才托举工程，2023

  （2）北京市科学技术进步奖二等奖（8/10）,2021

  （3）中国图象图形学学会博士学位论文激励计划，2023

  （4）北京图像图形学学会优秀博士学位论文，2022

  （5）北京市优秀毕业生，2021

  社会任职

