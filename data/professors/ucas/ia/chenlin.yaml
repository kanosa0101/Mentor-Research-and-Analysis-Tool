  个人简历

  陈琳，女，中国科学院自动化研究所博士，副研究员，研究方向：人机融合认知决策方法研究及工程研发。 近年主持或主力参与相关领域研制和预研类相关领域项目近20项，获相关授权专利近20项。研究方向围绕决策求解认知不确定性及可解释性问题，提出以态势任务图为决策共识的筹划决策表征方法，带领团队以筹划决策应用为牵引，逐步突破群体研讨、策略博弈、按需推演等人机群智交互理解和决策融合技术，研制了人机融合筹划决策系统平台原型，形成初步的开放环境、资源、模型的积累模式，为相关方向的资源收集、整理、学习和应用奠定一定的资源基础，系统核心模块已经部署应用于多种场景下的多类任务决策辅助。

  研究方向

  智能辅助决策，人机协同决策

  承担科研项目情况

  承担知识、规则、决策等项目

  专利成果

  1、陈琳;武利娟;刘尚卿;段旭磊   面向云环境的多机器人协同感知服务系统、方法及设备

  2、陈琳;武利娟;刘尚卿;段旭磊   基于角色的多智能体任务协同消息传递及异常处理方法

  3、陈琳;武利娟;刘尚卿;段旭磊    基于角色的多智能体任务协同系统

  4、陈琳; 谢冰; 卢朋; 高一波; 武利娟; 代文; 宋江龙; 温伟娜  一种数字出版资源语义增强描述系统及其方法

  社会任职

  领域专家'
