  个人简历

  中国科学院紫东太初大模型研究中心副研究员、硕士研究生导师，主要研究方向是视频内容理解、行为识别、行为检测、视觉目标跟踪等。担任国家科技创新2030—“新一代人工智能”重大项目课题负责人和科技部重大专项任务负责人，主持自然科学基金2项，曾作为核心骨干申请并参与了包括国家重点研发计划、中科院先导A项目、广东省重点研发计划等在内的多个国家或省级项目。在IEEE
  Transactions on Image Processing、IEEE Transaction on Neural Networks and Learning
  System、IEEE on Cybernetics等国际权威期刊和NeurIPS、AAAI、IJCAI等人工智能国际顶级会议上发表第一作者学术论文十余篇。曾获得第一届中科院Rokid人工智能科学奖，在数据挖掘领域国际顶级竞赛KDD
  CUP 2012竞赛中获优胜奖，获过3项国内外图像与视频分析领域竞赛冠军，包括欧洲图形国际会议三维目标检索第一名（Eurographics2015）、第二届全国研究生智慧城市技术与创意设计大赛中视频挑战赛目标跟踪第一名、2019年
  VideoNet视频内容识别挑战赛冠军，担任CVPR2020年anti-UAV反无人机竞赛&研讨会的程序委员会共同主席。作为中科院“科苑名匠”紫东太初多模态大模型研究团队核心成员，全程参与大模型从0到1的全过程。团队研发的大模型于2022年获得中国计算大会“DC
  Tech创新先锋”优秀成果奖、世界人工智能大会SAIL最高奖。

  研究方向

  模式识别与智能系统；通用人工智能；多模态大模型

  承担科研项目情况

  （ 1 ） 基于时空序列建模和自学习的鲁棒高效视觉目标跟踪, 负责人, 国家任务, 2021-01--2024-12

  （ 2 ） 基于在线对抗学习的视觉目标跟踪研究, 负责人, 国家任务, 2018-01--2020-12

  （ 3 ） 室内零售安防场景中的人体动作识别关键技术研究项目, 负责人, 企业委托, 2021-01--2022-01

  （ 4 ） 跨媒介智能理解软件关键技术, 参与, 地方任务, 2020-01--2022-12

  （5 ） 跨模态通用人工智能平台, 参与, 中国科学院计划, 2021-01--2022-12

  （ 6 ） 基于大规模预训练基础模型的多模态多任务理解关键技术研究, 负责人, 地方任务, 2021-12--2023-11

  （ 7） 通用视觉模型关键技术研究, 负责人, 国家任务, 2021-12--2023-11

  （ 8 ） 多模态关联建模与统一表征, 负责人, 国家任务, 2023-01--2025-12

