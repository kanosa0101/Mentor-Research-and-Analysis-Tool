bio_raw: "何世柱\n/\n职　　称:\n研究员\n邮　　编:\n100190\n电子邮件:\nshizhu.he@nlpr.ia.ac.cn\n部门/实验室:\n\
  复杂系统认知与决策实验室\n通讯地址:\n北京市海淀区中关村东路95号\n个人简历\n何世柱研究员，硕士生导师。主要研究方向为问答系统、知识工程和自然语言处理。主持或参与国家自然科学基金面上项目、重点项目、科技部\"\
  新一代人工智能”重大项目等多项国家项目和企业项目，在ACL、AAAI、EMNLP等顶级国际会议和重要学术期刊上发表论文40余篇，Google Scholar总引用6600余次。参与撰写《知识图谱》《知识图谱：算法与实践》两本专著，在中国科学院大学主讲《知识工程》本科生课程，参与讲授的《知识图谱》研究生课程入选中国科学院大学校级研究生优秀课程(2021年)。曾获中国中文信息学会\"\
  钱伟长中文信息处理科学技术奖”一等奖(个人排名第三，2018年)，北京市科学技术进步奖一等奖(个人排名第四，2019年)。2020年入选中国科学院青年创新促进会。\n\
  研究方向\n自然语言处理、人工智能、大模型、知识工程\n承担科研项目情况\n1. 面向问答系统的神经与符号知识相互增强方法研究，国家自然科学基金面上项目，2024.01.01-2027.12.31.\n\
  2. 信息抽取与知识图谱构建，国家重点研发计划, 2022.06.01-2024.05.30.\n3. 基于认知计算的热点事件分析与推理，国家自然科学基金联合基金，2020.01.01-2023.12.31.\n\
  4. 知识问答中自然答案生成关键技术研究，国家自然科学基金青年科学基金，2018.01.01-2020.12.31.\n代表论著\n(1)赵军;刘康;何世柱;陈玉博;《知识图谱》，高等教育出版社，2018.\n\
  (2) Yixuan Weng, Minjun Zhu, Fei Xia, Bin Li, Shizhu He, Kang Liu, Jun Zhao. Mastering\
  \ Symbolic Operations: Augmenting Language Models with Compiled Neural Networks.ICLR\
  \ 2024(会议论文).\n(3) Yao Xu, Shizhu He, Cunguang Wang, Li Cai, Kang Liu, Jun Zhao.\
  \ Query2Triple: Unified Query Encoding for Answering Diverse Complex Queries over\
  \ Knowledge Graphs. EMNLP 2023 Findings(会议论文).\n(4) Runxin Sun; Shizhu He; Chong\
  \ Zhu; Yaohan He; Jinlong Li; Jun Zhao; Kang Liu ; LeveragingExplicit Lexico-logical\
  \ Alignments in Text-to-SQL Parsing. ACL 2022(会议论文).\n(5) Fangyu Lei, Shizhu He,\
  \ Xiang Li, Kang Liu, Jun Zhao. Answering numerical reasoning questions in table-text\
  \ hybrid contents with graph-based encoder and tree-based decoder. COLING 2022(会议论文).\n\
  获奖及荣誉\n（1）大规模知识图谱构建关键技术与应用, 北京市人民政府, 科技进步, 省部一等奖, 2020(赵军; 刘康; 刘升平; 何世柱; 陈玉博; 张元哲;\
  \ 任禾; 崇伟峰) (科研奖励)\n（2）大规模开放域文本知识获取与应用平台, 中国中文信息学会, 钱伟长中文信息处理科学技术奖，一等奖, 其他, 2018(赵军;\
  \ 刘康; 何世柱; 陈玉博) (科研奖励)\n专利成果\n1.201910685616.X\t基于人工智能的回复消息生成方法、装置、服务器及介质\t发明专利\t\
  何世柱 ;刘康 ;赵军 ;刘操\n2.202211193891.8\t知识问答方法、装置、电子设备和可读存储介质\t发明专利\t何世柱;刘康;赵军;徐遥\n社会任职\n\
  中国中文信息学会医疗健康与生物信息处理专业委员会\t委员\n中国中文信息学会青年工作委员会\t委员\n中国中文信息学会语言与知识计算专业委员会\t委员"
