  个人简历

  张春成，中科院自动化所副研究员，从事人工智能、神经编解码、多模态神经计算、脑机接口领域的研究，发表多篇研究论文。主持北京市自然科学基金青年基金项目，作为研发骨干参与科技创新2030—“脑科学与类脑研究”重大项目，国自然重点项目，科技部国家重点研发项目等。教育经历：
  (1) 2012-09 至 2018-06, 北京师范大学, 计算机应用, 博士 ；近5年的工作内容集中在神经信息解码与脑机接口系统研究，提升脑机接口系统的可解码范围和适用场景。在日常生活中，大脑对周围环境产生感知并形成决策，这一过程对应特异性的神经活动，脑机接口系统在神经信息解码的基础上，通过合理地控制外围设备对人进行辅助。针对脑机接口系统中神经信号强度低且解码性能高度依赖特定实验范式的特点，通过范式设计、解码方法和反馈系统的研究，提升信号可解码性，并且提升解码结果转换为控制指令的设计合理性，从而在关键节点提升脑机接口系统的响应速度和适用范围。(2)
  2005-09 至 2009-06, 天津大学, 电子信息工程, 学士 博士后工作经历： (1) 2018-06 至 2020-06, 自动化研究所 科研与学术工作经历：
  (1) 2022-04 至 今, 中国科学院, 自动化研究所, 副研究员 (2) 2020-06 至 2022-04, 中国科学院, 自动化研究所, 助理研究员

  研究方向

  认知神经科学、脑机接口

