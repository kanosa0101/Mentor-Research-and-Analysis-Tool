  主持；国家自然科学基金委员会, 联合基金项目, U21A20388, 基于原子磁力计脑磁图的新型脑机接口系统原 理及方法研究, 2022-01-01 至 2025-12-31,
  260万元, 在研, 参与；国家自然科学基金委员会, 面上项目, 61976209, 基于自然场；国家自然科学基金委员会, 面上项目, 62276262, 面向脑卒中运动功能康复的闭环重复经颅磁刺激关
  键技术研究, 2023-01-01 至 2026-12-31, 53万元, 在研, 参与景刺激的脑活动语义解码及视觉重建, 2020-01-01 至 2023-12-31,
  61万元, 结题, 参与

