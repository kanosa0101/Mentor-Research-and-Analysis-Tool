  个人简历

  高颖，中国科学院自动化研究所副研究员，2009年于西南大学心理学部获学士学位，2012年于西南大学心理学部获硕士学位，2018年于德国马格德堡大学心理学系获博士学位，2018-2020年就职于德国SAVIR视觉修复中心技术研发部；2020年于德国马格德堡大学医学心理系从事博士后研究工作；2021年加入中国科学院自动化研究所从事科研工作。致力于运用心理学量表、眼动追踪、脑电等测量技术开展感知与认知功能评估研究，以及基于经颅电刺激技术的功能增强方法与应用研究，在相关领域多个重要期刊，如Investigative
  Ophthalmology & Visual Science、Neural regeneration research等发表论文10余篇，获国家发明专利1项。承担1项国家自然科学基金青年科学基金项目与1项中国博士后科学基金面上项目，参与国家重点研发计划课题、国家自然科学基金重点国际合作研究项目、京津冀基础研究合作专项项目等。担任中国研究型医院学会神经再生与修复专业委员会脑机接口与神经康复研究学组委员。研究成果已在多家合作医院进行试点应用。

  研究方向

  脑机接口，神经调控，功能修复

  承担科研项目情况

  国家自然科学基金委员会，青年科学基金项目，62301560，基于脑电和眼动的早期青光眼视觉功能及脑网络评估研究，2024-01-01至2026-12-31，30万元，在研，主持；中国博士后科学基金，第70批面上资助，2021M703490，微扫视对偏盲视知觉的影响及功能性神经网络机制，2021-11至2023-12，8万元，结题，主持；国家自然科学基金委员会，国际(地区)合作与交流项目，62020106015，青光眼患者的脑网络调控及视觉修复研究，2021-01-01至2025-12-31，230万元，在研，参与；科技部,
  重点研发计划课题, 2023YFF1203501, 视觉空间信息高精度解码关键技术, 2023-11至 2026-10, 350万元, 在研, 参与；北京市科技委，北京市科技新星计划交叉课题，20230484460，基于MRI的青光眼患者经颅交流电刺激视觉修复的视觉通路响应机制研究，2023-10至2025-10，25万元，在研,
  参与。

  代表论著

  [1] Gao, Y., He, H., Sabel, B. A. (2024) Enhanced long-range communication among
  large scale brain networks during the pre-microsaccadic period. In 46th Annual International
  Conference of the IEEE Engineering in Medicine and Biology Society (EMBC).IEEE.

  [2] Sabel, B. A., Gao, Y., & Antal, A. (2020). Reversibility of visual field defects
  through induction of brain plasticity: vision restoration, recovery and rehabilitation
  using alternating current stimulation. Neural regeneration research, 15(10), 1799-1806.

  [3] Gao, Y., Huber, C., Sabel, B. A. (2018) Stable microsaccades and microsaccade-induced
  global alpha band phase reset across the life span. Investigative Ophthalmology
  & Visual Science. 59(5): 2032-2041.

  [4]  Sabel, B. A., Cárdenas-Morales, L., & Gao, Y. (2018). Vision restoration in
  glaucoma by activating residual vision with a holistic, clinical approach: a review.
  Journal of Current Glaucoma Practice, 12(1), 1.

  [5] Gao, Y., Sabel, B. A. (2017). Microsaccade dysfunction and adaptation in hemianopia
  after stroke. Restorative Neurology and Neuroscience. 35(4):365-376.

  获奖及荣誉

  (1) 新医科与生物医药博士后优秀论文二等奖，2024；

  (2) 马格德堡医学院优秀博士奖学金（Promotionsstipendium

  Im Rahmen der Leistungsorientierten Mittelvergabe an der Medizinischen Fakultaet
  Magdeburg），2015.

