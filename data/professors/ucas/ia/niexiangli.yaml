  个人简历

  聂祥丽，现任中国科学院自动化研究所多模态人工智能系统全国重点实验室副研究员，2015年毕业于中国科学院数学与系统科学研究院。研究方向为模式识别与智能系统。主要从事开放干扰环境下无人平台智能感认知方面研究。在相关领域发表学术论文30余篇，包括IEEE
  TCYB、TIP、TNNLS、TGRS、JSTARS、GRSL等；申请发明专利10余项。主持相关科研项目10余项，包括国家自然基金面上项目/青年项目、北京市科技新星计划/青年项目、中科院空天院/中电集团/中科院软件所等合作项目，相关工作在工业部门得到集成应用。获2022年度北京市科学技术奖（自然科学奖二等奖，排名2/3），2016年入选中国新锐科技人物，2022年入选北京市科技新星计划-创新新星。

  研究方向

  模式识别与智能系统

  承担科研项目情况

  [1] 国家自然科学基金面上项目，62076241，“面向极化SAR数据解译的在线持续学习方法研究”，58万，2021/01-2024/12，项目负责人；

  [2] 北京市科技新星计划项目，20220484070，开放干扰环境下无人系统持续学习技术研究, 40万，2022-10--2025-10，项目负责人；

  [3] 中国电子科技集团公司第二十研究所，数据链技术重点实验室开放基金, CLDL-20202208_1, 面向无人机对抗的态势评估与智能决策算法研究，25万，2021.7-2024.6，项目负责人

  代表论著

  [1]  Xiangli Nie, Mingyu Fan, Xiayuan Huang, Wenjing Yang, Bo Zhang, Xiaoshuang
  Ma, “Online Semisupervised Active Learning for Multiview PolSAR Data Classification.”IEEE
  Transactions on Cybernetics, vol. 52, no. 6, pp. 4415-4429, 2022. Digital Object
  Identifier: 10.1109/TCYB.2020.3026741.

  [2]  Xiangli Nie*, Zhiguang Deng, Mingdong He, Mingyu Fan, Zheng Tang*, Online Active
  Continual Learning for Robotic Lifelong Object Recognition, IEEE Transactions on
  Neural Networks and Learning Systems, 2023. Digital Object Identifier 10.1109/TNNLS.2023.3308900.

  [3]  Xiangli Nie, Hong Qiao, Bo Zhang, “A Variational Model for PolSAR Data Speckle
  Reduction Based on the Wishart Distribution,” IEEE Transactions on Image Processing,
  vol. 24, no. 4, pp. 1209-1222, 2015.

  [4]  Xiangli Nie, Hong Qiao, Bo Zhang, Xiayuan Huang, “A Nonlocal TV-based Variational
  Method for PolSAR Data Speckle Reduction,” IEEE Transactions on Image Processing,
  vol. 25, no. 6, pp. 2620-2634, 2016.

  [5]  Weiwei Liu, Xiangli Nie*, Bo Zhang, Xian Sun, Incremental Learning with Open
  Set Recognition for Remote Sensing Image Scene Classification, IEEE Transactions
  on Geoscience and Remote Sensing, vol. 60, pp. 1-16, 2022, Art no. 5622916, doi:
  10.1109/TGRS.2022.3173995.

  专利成果

  1. 基于多视角学习的极化SAR数据分类器实时更新方法, 聂祥丽，黄夏渊，丁曙光，乔红，张波，发明专利申请号：201711482208.1，国家发明专利号:ZL
  201711482208.1，申请日：2017.12.29；授权日：2021.3.2。

  2. 基于多视角主动学习的在线半监督学习方法及系统, 聂祥丽，黄夏渊，贾立好，乔红, 张波，发明专利申请号：201910539276.X. 国家发明专利号：ZL201910539276.X，申请日：2019年6月20，授权日：2021.6.22

  3. 基于深度森林的在线多视角分类方法、系统、装置, 聂祥丽，高若飞，项德良，樊明宇，乔红，发明专利申请号：201910502702.2, 国家发明专利号:ZL
  201910502702.2，申请日：2019年6月11日，授权日：2021.4.13

  4. 极化SAR图像有监督分类方法及装置，黄夏渊，聂祥丽，乔红，张波，发明专利申请号：201810036297.5，发明专利号:ZL201810036297.5，授权公告号：CN108460402，授权日期：2020.7.24.

  5. 基于协同正则化和超像素的极化SAR图像分类方法，黄夏渊，聂祥丽，乔红，张波，申请号：201911333974.0，发明专利号：ZL201911333974.0，授权公告号：CN111062445B，申请日期：2019.12.23，授权日期：2023.5.19

  6. 多任务图像复原方法、系统、电子设备及存储介质，李玉苹，聂祥丽，发明专利申请号：202110949258.6专利号：ZL202110949258.6,申请日期：2021-08-18，授权公告号：CN113689348B，授权日期：2023年12月26日'
