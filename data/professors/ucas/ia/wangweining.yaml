  研究方向

  视频内容理解、视频内容生成、多模态分析

  承担科研项目情况

  1. 基于低成本标注样本的长视频行为分析，国家自然科学基金青年基金项目，2022.01-2024.12，项目负责人

  2. 受限环境的跨模态目标识别与行为理解，国家自然科学基金重点项目， 2022.01-2025.12，主要完成人

  3. 基于结构化深度学习的场景理解，国家自然科学基金面上项目，2019.01-2022.12，主要完成人

  4. 多模态知识驱动的图文匹配，国家自然科学基金面上项目，2023.01-2026.12，项目骨干

