bio_raw: "何赛克\n/\n职　　称:\n副研究员\n邮　　编:\n100190\n电子邮件:\nsaike.he@ia.ac.cn\n部门/实验室:\n\
  多模态人工智能系统全国重点实验室\n通讯地址:\n北京市海淀区中关村东路95号，自动化大厦。邮编：100190\n个人简历\n何赛克，博士，中国科学院自动化研究所复杂系统管理与控制国家重点实验室副研究员，中国科学院“2035创新团队”青年骨干，互联网大数据与安全信息学研究中心研发团队负责任人，国家自然科学基金委（NSFC）评审专家、国家计算机网络与信息安全管理中心（CNCERT）评审专家、人工智能产业发展联盟（AIIA）知识产权工作组专家。分别于2007年和2010年获得北京邮电大学学士和硕士学位，并于2015年在中国科学院大学获得工学博士学位。\n\
  何赛克副研究员2010年3月至中国科学院自动化研究所工作，在大数据驱动的复杂网络分析方面提出了一系列原创性理论与方法，发表学术论文40余篇，获得国际学术会议最佳论文2项，出版英文学术专著1部，申请专利6项、软件著作权2项。作为核心技术研发负责人，研发4套大数据挖掘与决策支持系统，相关技术成果4次获得国内外权威大数据竞赛冠军。\n\
  何赛克副研究员目前已主持11项科研项目，包括：国家重点研发计划子课题1项、国家自然科学基金委项目3项、国家重点实验室优秀人才项目1项、以及国家部门及企事业单位横向项目6项。同时，作为核心骨干承担9项国家项目以及横向课题，包括：863计划、973项目、科技部重点研发计划、国家自然基金重大项目、以及中国科学院先导专项。相关技术成果获得国家计算机网络应急技术处理协调中心优秀成果奖（排名第一，2017年）。\n\
  研究方向\n因果推断，\t超图建模与学习\n决策智能，\t认知域风险解析\n网络动力学，\t竞争智能\n承担科研项目情况\n博弈对抗自主进化智能, 主持, 部委级,\
  \ 2020-07--2025-06\n商业危机事件中大规模文化基因抽取与追踪分析方法, 主持, 国家级, 2020-01--2023-12\n大规模模拟仿真与风险评估关键技术研究,\
  \ 主持, 国家级, 2017-07--2021-08\n大数据信息平台升级, 参与, 国家级, 2020-12--2021-08\n社交舆情大数据项目, 参与,\
  \ 国家级, 2019-12--2021-12\n社交网络动力学研究, 参与, 国家级, 2018-02--2021-07\n危机事件中的社会媒体用户行为模式挖掘,\
