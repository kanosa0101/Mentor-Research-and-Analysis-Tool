bio_raw: '李浩然

  /

  2015-09--2020-08   中国科学院自动化研究所   博士

  2011-09--2015-07   中南大学   学士

  职　　称:

  副高级研究员

  邮　　编:

  100190

  电子邮件:

  lihaoran2015@ia.ac.cn

  部门/实验室:

  多模态人工智能系统重点实验室

  通讯地址:

  北京市海淀区中关村东路95号

  个人简历

  2022-05至今，中国科学院自动化研究所，副研究员                                           2020-10-2022-04，中国科学院自动化研究所，助理研究员

  研究方向

  研究目标为面向机器人领域的通用策略模型，重点涉及深度强化学习（离线强化学习、在线强化学习以及离线到在线强化学习）及其Sim2Real算法、机器人系统等。

  承担科研项目情况

  （1）复杂动态环境下基于深度强化学习的机器人导航策略，主持，国家任务，2022-01至2024-12

  （2）多智能体对抗博弈仿真及实体验证，主持，国家任务，2023-01至2027-12

  （3）数据驱动的仿真交通场景生成方法，参与，国家任务，2022-1至2025-12

  代表论著

  Haoran Li; Qichao Zhang; Dongbin Zhao ; Deep reinforcement learning-based automatic
  exploration for navigation in unknown environment, IEEE Transactions on Neural Networks
  and Learning Systems,2020（第一作者）

  Haoran Li; Yaran Chen; Qichao Zhang; Dongbin Zhao ; BiFNet: Bidirectional fusion
  network for road segmentation, IEEE Transactions on Cybernetics, 2022（第一作者）

  Yuhui Chen; Haoran Li; Dongbin Zhao; Boosting continuous control with consistency
  policy, International Conference on Autonomous Agents and Multiagent Systems, 2024(通讯作者)

  获奖及荣誉

  DJI RoboMaster人工智能挑战赛学术激励奖, 2020年（排名第一）

  “国科大杯”创新创业大赛新一代信息技术分项赛决策一等奖， 2020年（排名第一）

  2020届ICRA Robomaster AI Challenge 决赛感知、导航与路径规划和决策三个赛道冠军，2020（排名第二）

  中国国际“互联网+”创新创业大赛北京赛区二等奖（排名第一）

  第二届中国AI+创新创业大赛一等奖（排名第一）

  2017年中国智能车未来挑战赛——前方车辆距离监测第一名（排名第四）

  2017年中国智能车未来挑战赛——前方车辆检测第一名（排名第四）

  北京市科技技术奖——高效深度强化学习算法和最优性分析（排名第六）

  专利成果

  面向地铁视觉图像的轨道检测方法及系统，发明，2023，第一作者，专利号：CN111611956B'
