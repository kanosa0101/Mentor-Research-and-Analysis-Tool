  2003

  年毕业于北方交通大学电子信息工程学院，

  2008

  年于中国科学院自动化研究所获计算机应用技术博士学位，

  2008

  年至今在中国科学院自动化研究所国家专用集成电路工程技术研究中心担任助理研究员、副研究员、研究员、脑机接口与信号处理芯片课题组组长。其间于

  2016

  年在美国加州大学洛杉矶分校电子系做高级访问学者

  。中科院青年促进会会员、中国科学院元器件专家组专家。'
