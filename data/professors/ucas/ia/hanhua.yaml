  研究领域

  随着脑科学和信息科学的发展，脑科学研究产生的数据量呈现爆发式增长，如脑图谱绘制、单细胞分型、光/电/磁记录等方面的数据规模已经进入大数据范畴。海量数据的产生带来新的问题，如何挖掘数据、展示数据、共享数据已成为神经科学研究领域新的重大挑战。

  微观重建团队聚焦于微观尺度脑连接图谱新技术研究，致力于海量电镜图像的高通量采集、实时处理、三维重建和智能分析等，基于脑连接图谱大数据对真实神经网络机制进行建模和阐释，为国家脑科学和类脑智能研究提供突触水平神经重建所需的技术服务、解决方案和共享平台。

  微观重建团队是目前国内唯一能够提供脑微观图谱全流程分析技术的成建制团队，合作成果发表于Science、Nature Communications、Nano Research、IJCAI、ISBI等。毕业生去向包括中科院自动化所、海南大学、华为、美团、阿里、IBM等。

