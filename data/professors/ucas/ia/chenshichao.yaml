  2.国家重点研发计划，面向集成电路复杂制造过程的多模态智能感知与优化调度研究，课题负责人，2025.07-2028.06

  3.市重点研发计划，面向工业质检的云 -边 -端协同的视觉检测系统研究及应用，主持，2023.06-2025.06

  4.北京市自然科学基金-小米创新联合基金，面向离散制造的边缘智能管控关键技术研究，项目骨干，2024.1-2027.12

  5.国铁集团实验室基础课题《技术作业站站区一体化平行调度系统关键技术研究》，项目骨干，2023.01-2024.12

  6.科技部重点研发计划，基于边缘计算的云制造资源/能力接入研究，项目骨干， 2019-03-2022-06

