  个人简历

  陈世超，博士，中国科学院自动化研究所副研究员，主要从事边缘计算、物联网、机器人，智能无人系统方向的研究与产业化工作，发表学术论文近50余篇，申请及授权发明专利20余项，软著15余项，担任IEEE
  IoT Journal，IEEE Transactions on Intelligent Transportation Systems 、IEEE/CAA Journal
  of Automatica Sinica、IEEE Transactions on Industrial Informatics，IEEE Transactions
  on Intelligent Vehicles, CAAI Transactions on Intelligence Technology等期刊的审稿人，及 ITSC、SMC等国际会议的审稿人并在
  DPTI、ICCSI、ITSC等国际会议作学术报告。先后主持及参研交通部科技重大专项，科技部重点研发，STS专项，国自然面上项目等课题20余项，参与起草发布《工业互联网
  微服务架构》、《云制造服务平台开放接口要求》《云计算 边缘云通用技术要求》3项国家标准，《边缘人工智能平台技术要求和测试方法》等行业标准多项。现任中国计算学会（CCF）高级会员，CCF计算机应用专委会执行委员、智能机器人专委会执行委员，中国自动化学会（CAA）高级会员，CAA边缘计算专委会委员、普及委员会委员，中国指挥与控制学会（CICC）高级会员、大模型与决策智能专业委员会委员、中国机电一体化技术应用协会专家委委员及标准化工作委员会副秘书长、具身智能分会理事，北京机械工程学会理事，担任2021-2023
  ICCSI国际会议学生活动主席，2022 CSCWD国际会议Special Session Chair。

  研究方向

  边缘计算、云边协同、机器人、智能无人系统

