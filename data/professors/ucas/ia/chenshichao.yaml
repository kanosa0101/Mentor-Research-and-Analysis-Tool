  9.中科院STS东莞专项 ，面向3C制造产业集聚区域的网络协同制造核心技术集成应用示范,项目骨干，2021.02-2024.06

  10.铁路科学院开放课题  面向铁路技术站复杂环境的作业人员多源融合定位技术研究， 主持，2021.10-2023.12

