  个人简历

  张峰，博士研究生，中国科学院自动化研究所硕士生导师。2012年获中科院自动化研究所博士学位，毕业之后留所工作，一直从事工业视觉自动化相关工作，具体工作包括传统图像处理算法研究、深度学习图像处理算法研究、工业视觉软件开发、工业运动控制软件开发等相关工作，相关工作成果成功在中科慧远的多款产品上进行规模应用，应用领域包括手机、显示面板、家居板材、半导体等，产生经济价值达数亿元

  研究方向

  工业产品外观缺陷检测、机器视觉、深度学习、运动控制

  承担科研项目情况

  多模物理与认知双向人机交互, 主持, 国家级, 2017-12--2020-11

