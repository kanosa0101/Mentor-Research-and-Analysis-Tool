bio_raw: "黄怀波\n/\n职　　称:\n副研究员\n邮　　编:\n100191\n电子邮件:\nhuaibo.huang@cripac.ia.ac.cn\n\
  部门/实验室:\n多模态人工智能系统全国重点实验室、智能感知与计算研究中心\n通讯地址:\n北京市海淀区中关村东路95号\n个人简历\n黄怀波，中国科学院自动化研究所多模态人工智能系统全国重点实验室副研究员，北京图象图形学学会理事，中国图象图形学学会视觉大数据专委会委员。2012年和2016年分别于西安交通大学和北京航空航天大学获得学士学位和硕士学位，2019年于中国科学院大学获得计算机应用技术专业博士学位。从事模式识别和计算机视觉基础理论研究，并应用到视觉内容合成与鉴别、图像和视频处理、生物特征识别等领域。在TPAMI、IJCV、NeurIPS、CVPR、ICCV等国际权威期刊和会议发表论文合计50余篇，其中包括CCF-A类论文30篇，出版Springer专著一部。入选北京市科技新星计划、北京市科协青年人才托举工程和中国科学院青年创新促进会，曾获得吴文俊人工智能科学技术奖技术发明奖一等奖、北京市优秀毕业生和中国科学院院长优秀奖，获得国际多媒体大会(ICME)研讨会最佳学生论文奖。\n\
  研究方向\n计算机视觉、生成式人工智能、深度学习网络架构、图像恢复和增强\n承担科研项目情况\n（ 1 ） 基于解耦表达的高保真人脸图像合成理论和方法研究, 负责人,\
  \ 国家任务, 2021-01--2023-12\n（ 2 ） 多媒体混合伪造生成模型的稳定性研究, 负责人, 国家任务, 2020-07--2023-06\n\
  （ 3 ） 中国科学院青年创新促进会, 负责人, 中国科学院计划, 2022-03--2025-12\n（ 4 ） 人脸增强、旋转与Sketch转换技术, 负责人,\
  \ 境内委托项目, 2018-12--2024-06\n（ 5 ） 面向复杂场景的小样本视频自动生成研究, 负责人, 境内委托项目, 2021-09--2022-08\n\
  （ 6 ） 基于MindSpore的视觉内容智能合成与鉴别技术研究, 负责人, 境内委托项目, 2022-11--2023-11\n（ 7 ） 北京市科技新星创新新星计划,\
