  个人简历

  教育背景：

  2015-09--2020-07   中国科学院自动化研究所   博士

  2011-09--2015-07   西安交通大学         学士

  工作经历

  2020-07~2023-07, 中国科学院自动化研究所, 助理研究员

  2023-07~至今, 中国科学院自动化研究所, 副研究员

  研究方向

  多媒体内容分析、计算机视觉、模式识别

  承担科研项目情况

  1. 细粒度可解释的跨模态视频检索研究，主持，国家级，2021-2024

  2. 开放环境下可解释的视频多模态协同理解研究，主持，之江实验室开放课题，2022-2024

  3. 面向开放环境的弱监督视频物体定位研究，主持，CCF-海康威视斑头雁基金，2021-2022

  4. 复杂环境下的知识学习，参与，国家级，2020-2023

  5. 数据和知识联合驱动的跨媒体语义理解与文本生成，参与，国家级，2023-2027

  6. 复杂时空环境下视觉目标理解理论和方法，参与，国家级，2022-2025

