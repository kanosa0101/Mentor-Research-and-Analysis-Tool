  个人简历

  吴书，博士。中科院-京东金融联合实验室主任，CCF杰出会员，微软亚洲研究院“铸星计划”学者、FCS期刊青年AE。主要从事网络内容分析与理解和大数据分析研究，以第一作者或通讯作者发表ACM和IEEE
  Trans. 20余篇、CCF-A长文40余篇、第一作者Springer和科学出版社专著两部，授权专利14项。7篇文章入选PaperDigest发布的最有影响力论文AAAI(×2),
  SIGIR(×2), WWW(×1), CIKM(×2)，其中WWW 2021论文引用第一，AAAI2019论文为大数据领域第一。获得AI2000人工智能最具影响力学者、斯坦福大学2022年全球前2%顶尖科学家榜单(Elsevier)，中国图像图形学会年度“高关注度领域综述”、UIC
  2011和CICAI 2022最佳论文奖等。研究被国内外学者广泛引用并正面评价，Google Scholar总引用超9400次，第一作者论文单篇最高引用超1400次。构建的验证和推理系统在多个单位落地和常态化应用，获得局级单位的好评和感谢信，多家单位的应用证明。也服务于产业界，主持京东科技联合实验室和腾讯、阿里等合作项目，将算法成果落地到车险预估、应用宝、搭配宝等在线系统中，较大的提升了线上效果，获评首届阿里学者。

