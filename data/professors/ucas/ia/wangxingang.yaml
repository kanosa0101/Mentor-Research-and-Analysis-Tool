  个人简历

  中科院自动化研究所研究员，博士研究生导师，中科（洛阳）机器人与智能装备研究院副院长，中国自动化学会智能制造系统专业委员会委员，中国仪器仪表学会测量与控制专业委员会委员，科技部、国家自然基金委、北京市科委等多部委项目评审专家。多年从事机器视觉、模式识别等相关领域研究，主持和参与过国家航天军工重大项目、科技部、基金委和企业产品研发项目30余项。在信号处理、模式识别、智能控制、机器视觉等领域发表高水平论文40余篇，国家发明专利30余项。

  研究方向

  计算机视觉

