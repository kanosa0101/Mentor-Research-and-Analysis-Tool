  of artificial intelligence in acute coronary syndrome: a brief literature review[J].
  Advances in Therapy, 2021: 1-9.

  Jiaojiao Wang, Jinglu Chen, Quannan Zu, Zhidong Cao, Saike He, Daniel Dajun Zeng.
  Healthcare-seeking behavior study on Beijing Hand-Foot-Mouth Disease Patients[C]//2019
  IEEE International Conference on Intelligence and Security Informatics (ISI). IEEE,
  2019: 140-142.

  刘文英, 王拥军, 王宝山, 陈阳, 陈经禄. 一种研究逆向卸荷膜片式减压器稳定性的 BP 神经网络改进算法[J]. 航空动力学报, 2017, 32(5):
  1241-1249.

