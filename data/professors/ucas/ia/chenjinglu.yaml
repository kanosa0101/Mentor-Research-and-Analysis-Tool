  个人简历

  陈经禄，中国科学院自动化研究所多模态人工智能系统全国重点实验室副研究员，课题负责人，中国科学院“2035创新团队”青年骨干。长期从事自然语言处理、知识图谱推理等方面的研究。已主持科研项目7项，包括国家重点研发子课题1项，
  广东省重点领域研发计划1项，国家部门研究项目4项，雄安新区横向项目1项。作为核心骨干参研国家部门项目10项。

  研究方向

  自然语言处理、知识图谱推理

  承担科研项目情况

  主持 广东省重点领域研发计划（2020B111420003）, 基于社交媒体的开源信息关键技术研究与应用

  主持 雄安新区（E1D802209）, 互联网信息系统

  参与 国家重点研发计划（2022YFC3302100, 虚假与不良信息多元传播治理关键技术研究及应用示范）

  参与 国家自然科学基金委员会面上项目（72074209）, 融合人群流动信息的传染病时空风险建模研究

  代表论著

