  个人简历

  杜长德，中科院自动化所副研究员，从事人工智能、脑科学、模式识别、AI for Brain 领域的研究，在神经编解码、多模态神经计算、视觉-语言-大脑联合建模、大模型评估与解释等方面发表了40多篇高水平研究论文，包括
  Cell子刊/TPAMI/ICLR/AAAI/ACMMM/KDD 等。主持国家自然科学基金青年基金、中科院特别研究助理资助项目、中国人工智能学会—华为 MindSpore
  学术奖励基金，科技创新2030—“新一代人工智能”重大项目子课题等人才项目。作为研发骨干参与科技创新2030—“脑科学与类脑研究”重大项目，国自然重点项目，科技部国家重点研发项目等。长期担任
  TPAMI, NeuroImage, ICLR, CVPR 等期刊/会议的审稿人/程序委员，是中国自动化学会模式识别与机器智能专委会委员。多次受邀在国际顶级人脑图谱大会
  (OHBM)、国际顶级多媒体大(ACMMM)、国际顶级人工智能大会（AAAI）做学术报告。曾获得中科院院长奖、北京市优秀毕业生、2021年AI华人新星百强、IEEE
  ICME 2019 最佳论文奖（亚军）、研究成果被《MIT Technology Review》等科技媒体头条报道。

  研究方向

  人工智能、脑科学、模式识别、AI for Brain 领域，方向包括神经编解码、多模态神经计算、视觉-语言-大脑联合建模、大模型评估与解释等

  承担科研项目情况

  (1) 国家自然科学基金委员会, 面上项目, 82272072, 基于眼-脑跨模态影像构建稀疏贝叶斯线性回归模型

  预测脑小血管病程度的研究, 2023-01-01 至 2026-12-31, 52万元, 在研, 参与

  (2) 国家自然科学基金委员会, 青年科学基金项目, 62206284, 融合视觉和语义特征的视觉神经信息编解

  码方法研究, 2023-01-01 至 2025-12-31, 30万元, 在研, 主持

  (3) 国家自然科学基金委员会, 面上项目, 61976209, 基于自然场景刺激的脑活动语义解码及视觉重建,

  2020-01-01 至 2023-12-31, 61万元, 资助期满, 参与

  (4) 科技部, 科技创新2030-“脑科学与类脑研究”重大项目, 2021ZD0201503, 类脑听觉前端模型与系统

  研究, 2021-12 至 2026-11, 400万元, 在研, 参与

  (5) 科技部, 科技创新2030-“新一代人工智能”青年科学家项目, 2022ZD0116500, 认知启发的智能无人

  系统协同进化学习理论与方法, 2023-03 至 2026-02, 500万元, 在研, 参与

  (6) 中国科学院, 特别研究助理资助项目, ***, 基于神经编解码的预训练大模型类脑特性研究与提升,

  2021-12 至 2023-11, 80万元, 结题, 主持

