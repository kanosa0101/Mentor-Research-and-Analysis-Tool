  个人简介：

  李伟，男，中国科学院自动化研究所副研究员。于2015年、2020年分别获得北京航空航天大学硕士、清华大学博士学位。主要从事软体医疗机器人、智能人机交互、脑影像学信号分析与处理、多模态深度学习的慢病诊断与预测等方面研究。近五年作为项目负责人承担国自然青年基金、国家重点研发子课题，北京市自然科学基金海淀联合基金、北京市自然科学基金重点项目子课题和全国重点实验室青年基金等项目，作为项目骨干参与2035创新任务，国自然基金重点项目等项目。近五年已在Advanced
  Functional Materials、Nano Energy、IEEE Transactions on Neural Systems and Rehabilitation
  Engineering、Journal of NeuroEngineering and Rehabilitation等SCI期刊发表论文10余篇，其中一作或通讯（含共同）共10篇，学术成果被美国科学院院士、美国工程院院士等多名院士和IEEE
  Fellow等引用，并给出正面评价，已申请10余项发明专利。作为主要完成人2023年中国康复医学会科学技术一等奖和获得2024年中国仪器仪表学会技术发明一等奖。'
