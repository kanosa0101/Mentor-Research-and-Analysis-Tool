bio_raw: "王亮\n/\n职　　称:\n研究员\n邮　　编:\n100190\n电子邮件:\nwangliang@nlpr.ia.ac.cn\n部门/实验室:\n\
  多模态人工智能系统全国重点实验室\n通讯地址:\n北京市海淀区中关村东路96号智能化大厦\n个人简历\n王亮，博士，研究员，博导，国际模式识别学会会士（IAPR\
  \ Fellow, 2014），国际电子电气工程师学会会士（IEEE Fellow, 2019），中国电子学会会士（CIE Fellow，2019），中国人工智能学会会士（CAAI\
  \ Fellow，2021），中国计算机学会会士（CCF Fellow, 2023），中国图象图形学学会会士（CSIG Fellow, 2023）。1997、2000年分别于安徽大学电子工程与信息科学系获得工学学士、硕士学位，2004年于中科院自动化所获得工学博士学位，获得中国科学院院长奖特别奖、中国科学院优秀博士论文、全国百篇优博提名。2004-2010期间，先后于英国帝国理工学院、澳大利亚莫纳什大学、澳大利亚墨尔本大学、英国巴斯大学工作，历任助研、研究员和讲师。2015年获得国家杰出青年科学基金（结题优秀），2016年获得第十四届中国青年科技奖，2017年入选科技部中青年科技创新领军人才，2018年入选首都科技创新领军人才培养工程及国家第四批万人计划科技创新领军人才。目前是多模态人工智能系统全国实验室副主任，中国计算机学会计算机视觉专委会副主任，中国图象图形学学会副理事长及视觉大数据专委会主任，中国科学院大学特聘岗位教授，国家重点研发计划项目首席科学家等。目前是IEEE\
  \ TPAMI期刊编委，曾是IEEE TIP（2018-2022） IEEE TIFS（2013-2016）、IEEE TSMC-B（2007-2016）、《自动化学报》（2015-2018）、Neurocomputing（2009-2014）、Pattern\
  \ Recognition（2017-2021）等国内外学术期刊的编委，中国电子学会青年科学家俱乐部副主席（2015-2018），AVSS2012、ACPR2015、DSP2016、IJCB2017、ACPR2019、ICPR2018等国际会议的大会、程序或组织主席等。承担国家级、省部级各类科研项目20余项，主要从事计算机视觉、模式识别、机器学习、数据挖掘等相关领域的研究。截至目前，已申请或授权发明专利80余项，出版编专著10余部，已发表或接收论文300余篇，获得ICPR2014最佳学生论文奖、CCCV2015最佳学生论文奖、CCPR2016最佳论文奖、ICDAR2019最佳论文提名等。目前，谷歌学术引用39000余次，H-index是93（2014-2023连续入选ESI中国高被引科学家名单）。与华为、爱奇艺、腾讯、京东金融、高德、美的等知名企业进行技术研发或应用的合作，部分研究成果已孵化银河水滴科技（北京）有限责任公司。\n\
  研究方向\n模式识别、计算机视觉、机器学习、数据挖掘等\n承担科研项目情况\n基于多模态协同与主动探索的场景态势评估，科技创新2030-重大项目\n面向人机协同任务的情境认知与效能优化，科技创新2030-重大项目\n\
