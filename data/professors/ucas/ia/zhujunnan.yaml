  个人简历

  朱军楠，博士，副研究员，中文信息学会自然语言生成与智能写作专委会委员。他于2020年6月毕业于中国科学院自动化研究所，获博士学位。自2020年7月起留在自动化所工作至今。

  他主要从事自动摘要、文本生成、多模态等研究，在国际顶级学术会议或期刊上发表论文数十篇，作为项目负责人主持国家自然基金青年基金一项、承担预研项目一项，作为项目骨干参与国家重点研发计划、国家自然科学基金重点项目等十余项。

  荣获ACL2020杰出审稿人和百度2021年全球AI华人新星百强等荣誉。

  研究方向

  自然语言处理、自动摘要及文本生成

  承担科研项目情况

  主持国家自然基金青年基金项目一项：多模态信息融合的自动摘要方法研究；承担预研项目一项，参与多项国家重点研发计划以及横向课题

  代表论著

  Junnan Zhu, Yu Zhou, Jiajun Zhang, Haoran Li, Chengqing Zong and Changliang Li. Multimodal
  Summarization with Guidance of Multimodal Reference. In Proceedings of the Thirty-Fourth
  AAAI Conference on Artificial Intelligence（AAAI）, New York, USA,  Feb. 7-12, 2020,
  pp. 9749-9756

  Junnan Zhu, Haoran Li, Tianshang Liu, Yu Zhou, Jiajun Zhang and Chengqing Zong.MSMO:
  Multimodal Summarization with Multimodal Output.In Proceedings of the 2018 Conference
  on Empirical Methods in Natural Language Processing(EMNLP), Brussels, Belgium, October
  31st–November 4th, 2018, pp. 4154-4164

  获奖及荣誉

  ACL2020杰出审稿人和百度2021年全球AI华人新星百强

