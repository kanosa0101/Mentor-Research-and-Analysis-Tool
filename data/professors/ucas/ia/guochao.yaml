  个人简历

  郭超，中国科学院自动化研究所，多模态人工智能系统全国重点实验室，副研究员。长期致力于大模型智能体、智能认知推理决策系统、智能机器人、AI for Creation等方向的研究与应用。主持国家自然科学基金、北京市自然科学基金、CCF腾讯犀牛鸟基金、企业合作项目等共14项，作为核心骨干参与科技部国家重点研发计划、国家自然科学基金国际（地区）合作项目等多项。在IEEE汇刊、NeurIPS等权威期刊和会议发表论文20余篇，申请/授权专利10余项，获中国自动化学会技术发明二等奖、CCF腾讯犀牛鸟基金优秀项目奖等奖励。

  研究方向

  智能推理与决策方法、大模型智能体、AI for Creation

  承担科研项目情况

  作为项目负责人/骨干，近3年承担国家自然科学基金青年/面上/国际合作、科技部重点研发等国家项目，并与腾讯、航天科工等多家企事业单位开展长期合作：

  1.  国家自然科学基金-青年项目，人机协同的绘画笔触序列规划与机器人绘制方法研究，2023.1至2026.12，主持。

  2.  国家部委专项项目，任务协同规划技术，2024.3至2024.12，主持。

  3.  CCF-腾讯犀牛鸟基金，基于语言大模型多智能体的剧本生成与评价，2024.10至2025.10，主持。

  4.  北京市自然科学基金-怀柔创新联合基金项目，面向智慧城市的主动式光视一体机系统研究，2024.7至2027.6，主持课题。

  5.  全国重点实验室开放课题，机器人绘画创造性技能学习，2024.8至2025.8，主持。

  6.  企业委托项目，任务决策规划大模型，2025.10至2026.12，主持。

  7.  企业委托项目，智能认知与决策控制技术，2024.7至2025.7，主持。

  8.  企业委托项目，分析推理模型，2025.12至2026.12，主持。

  9.  企业委托项目，多模态融合识别技术，2025.10至2026.6，主持。

  10. 企业委托项目，智能算法评估测试技术，2023.12至2024.12，主持。

  11. 科技部国家重点研发计划项目，面向集成电路复杂制造过程的多模态智能感知与优化调度研究，2025.7至2028.6，项目骨干。

  12. 国家自然科学基金国际（地区）合作项目，数据与知识联合驱动的智能系统研究及增材制造技术应用，2025.1至2027.12，项目骨干。

  代表论著

  1.  J. Cheng, G. Xiong, R. Qiao, L. Li, C. Guo, et al. Stop Summation: Min-Form
  Credit Assignment Is All Process Reward Model Needs for Reasoning. The Thirty-ninth
  Annual Conference on Neural Information Processing Systems. 2025.

  2.  H. Gu, C. Guo, J. Wang, et al. Planning Beyond Text: Graph-based Reasoning for
  Complex Narrative Generation. The 64th Annual Meeting of the Association for Computational
  Linguistics. 2026.

  3.  W. Xie, C. Guo, J. Wang, et al. Plug-and-Play Dramaturge: A Divide-and-Conquer
  Approach for Iterative Narrative Script Refinement via Collaborative LLM Agents.
  arXiv preprint arXiv:2510.05188, 2025.

  4.  C. Guo, Y. Dou, T. Bai, et al. ArtVerse: A Paradigm for Parallel Human–Machine
  Collaborative Painting Creation in Metaverses. IEEE Transactions on Systems, Man,
  and Cybernetics: Systems, 2023, 53(4): 2200-2208.

  5.  Y. Lu, C. Guo, X. Dai, et al. Generating Emotion Descriptions for Fine Art Paintings
