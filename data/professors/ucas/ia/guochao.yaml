  6.  C. Guo, Y. Lu, Y. Dou, et al. Can ChatGPT Boost Artistic Creation: The Need
  of Imaginative Intelligence for Parallel Art. IEEE/CAA Journal of Automatica Sinica,
  2023, 10(4): 835-839.

  7.  Y. Lu, C. Guo, Y. Dou, et al. Could ChatGPT Imagine: Content Control for Artistic
