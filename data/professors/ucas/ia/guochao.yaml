  Journal of Intelligent & Robotic Systems, 2022, 105(3): 61.

  10.  Y. Lu, C. Guo, X. Dai, et al. Data-efficient Image Captioning of Fine Art Paintings
  via Virtual-real Semantic Alignment Training. Neurocomputing, 2022, 490: 163-180.

