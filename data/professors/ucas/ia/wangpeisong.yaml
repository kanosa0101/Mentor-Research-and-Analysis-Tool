  个人简历

  王培松，中国科学院自动化研究所复杂系统认知与决策实验室副研究员，硕导。2013年在山东大学获得学士学位，2018年在中国科学院大学获得博士学位。目前主要从事高效智能计算、神经网络加速与压缩等方面的研究。在IEEE
  TPAMI、TNNLS、ICML、CVPR、ICCV、ECCV等国际期刊和会议发表论文40余篇。主持国家自然科学基金青年基金、中科院战略先导子课题，参与国家重点研发计划、基金重点、以及华为、阿里巴巴、三星等多项科研项目。曾获Nvidia奖学金、IEEE国际标准突出贡献奖、NeurIPS国际神经网络压缩竞赛MicroNet
  Challenge冠军，入选中科院特聘研究骨干、北京市科协青年人才托举工程、微软亚洲研究院“铸星计划”、CCF-百度松果基金学者等。

  研究方向

  轻量化人工智能

  承担科研项目情况

  1.深度神经网络无监督定点量化方法研究, 负责人, 国家自然科学基金青年基金, 2020.01-2022.12

  2.基于目标行为的视频流内容安全分析与智能检索（课题）, 课题负责人, 国家自然科学基金重点项目, 2020.01-2023.12

  3.中科院A类先导科技专项，子课题负责人，2020.07~2025.06

  4.科技部“新一代人工智能”重大项目, 核心骨干,2020.07-2023.06

  5.类脑视听觉芯片架构设计方法, 核心骨干, 中国科学院B类先导, 2018.01-2022.12

  6.深度学习模型小型化和硬件加速合作项目（四期），负责人，华为合作项目，2022.09-2023.07

  代表论著

  1.Peisong Wang, Weihan Chen, Xiangyu He, Qiang Chen, Qingshan Liu, Jian Cheng. Optimization-based
  Post-training Quantization with Bit-split and Stitching. IEEE Transactions on Pattern
  Analysis and Machine Intelligence (TPAMI), 2022.

  2.Peisong Wang*, Xiangyu He*, Jian Cheng. Towards Accurate Binarized Neural Networks
  with Sparsity for Mobile Application. IEEE Transactions on Neural Networks and Learning
  Systems (TNNLS), 2022.

  3.Peisong Wang*, Fanrong Li*, Gang Li, Jian Cheng. Extremely Sparse Networks via
  Binary Augmented Pruning for Fast Image Classification. IEEE Transactions on Neural
  Networks and Learning Systems (TNNLS), 2021.

  4.Peisong Wang, Qiang Chen, Xiangyu He and Jian Cheng. Towards Accurate Post-training
  Network Quantization via Bit-Split and Stitching. ICML, 2020.

  5.Peisong Wang, Qinghao Hu, Yifang Zhang, Chunjie Zhang, Yang Liu and Jian Cheng.
  Two-Step Quantization for Low-bit Neural Networks. CVPR, 2018.

