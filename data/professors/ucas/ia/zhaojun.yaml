  个人简历

  1.简历

  1998年清华大学博士毕业，1998年-2002年香港科技大学博士后工作，2002年进入中国科学院自动化研究所工作至今，现任二级研究员，博士生导师，中国科学院特聘核心岗位研究员，享受国务院政府特殊津贴专家。长期从事自然语言处理、知识工程方向的研究和教学工作。作为负责人承担科技部国家科技创新2030-新一代人工智能重大项目“以自然语言为核心的语义理解”、国家自然科学基金重点项目“大规模知识关联与文本语义计算方法及应用”、
  国家自然科学基金联合基金重点支持项目“面向社交媒体的事件建模与情感分析关键技术研究”等国家级科研项目，发表中国计算机学会CCF A, B类学术论文100余篇，Google
  Scholar引用超过27000多次，最高单篇引用超过3300次，曾获第25届国际计算语言学大会COLING-2014（CCF-B）最佳论文奖、第22届国际语义网大会ISWC-2023（CCF-B）最佳张贴论文奖等学术奖励；主持完成的科研项目“大规模开放域文本知识获取与应用平台”获得中国中文信息学会钱伟长中文信息处理科学技术奖一等奖（2018，排名第一），主持完成的科研项目“大规模知识图谱构建关键技术与应用”获得北京市科学技术进步奖一等奖（2019，排名第一）；作为中国科学院大学人工智能学院的岗位教授，主讲《知识工程》课程，获评中国科学院大学2021年校级研究生优秀课程，本人获评中国科学院朱李月华优秀教师奖（2020）。

  个人主页：https://zhaojun-nlpr.github.io/

  招生说明

  ：2025年招收免试推荐研究生（中国科学院自动化研究所，中国科学院大学人工智能学院，中国科学院大学前沿交叉科学学院）。简历及相关材料请发送至

  jzhao(at)nlpr(dot)ia(dot)ac(dot)cn。

