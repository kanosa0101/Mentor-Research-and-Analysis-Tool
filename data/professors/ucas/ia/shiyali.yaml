  通讯地址:

  北京市海淀区中关村东路95号自动大厦707

  个人简历

  2004.09—2009.07 中国科学院长春光学精密机械与物理研究所 工学博士 机械制造及其自动化

  2000.09—2004.07 长春理工大学 工学学士 机械设计制造及其自动化

  2012.10—现在，中国科学院自动化研究所，高级工程师

  2009.09—2012.09，中国科学院自动化研究所，助理研究员

  研究方向

  仿人智能光学成像感知，工业外观缺陷检测，微装配

  承担科研项目情况

  (1)曲面表面缺陷自动检测仪，负责，所级，2021.8-2023.12

  (2)超精密曲面光学元件缺陷检测仪，负责，院级，2022.10-2023.12

  (3)基于机器学习的大口径曲面光学元件外观缺陷检测系统，负责，北京市，2020.12-2022.12

  (4)基于视觉感知的复杂外形产品表面缺陷检测理论方法研究与应用，骨干，部委级，2022.11-2025.10

  (5)手机盖板玻璃外观精密检测关键装备研发，参与，部委级，2017.7-2018.7

  (6)显微扫描成像采集系统，负责，所级，2016.1-2016.12

  (7)元件表面状态检测平台，参与，所级，2013.6-2013.12

  (8)反射镜表面颗粒污染物在线监测系统，参与，所级，2014.1-2014.12

  (9)糖块尺寸测量仪，负责，公司，2015.12-2016.8

  (10)异型零件精密微装配设备研制，参与，国家级，2013.1-2017.12

  (11)精密装配技术研究2011，参与，国家级，2011.6-2012.5

  (12)精密装配技术研究2013，参与，国家级，2013.7-2014.6

  (13)精密装配技术研究2014，参与，国家级，2014.7-2015.6

  代表论著

  (1)光学元件激光损伤在线检测装置，红外与激光工程，2018，第1作者

  (2)跨尺度微管微球三维半自动装配点胶系统，光学精密工程，2015，第1作者

  (3)Pose Measuring and Aligning of a Micro Glass Tube and a Hole on the Micro Sphere,
  International Journal of Precision Engineering and Manufacturing，2014，第4作者

  (4)Motion-based microscopic camera calibration and application on micro tube-hole
  insertion，Optical Engineering, 2014，第3作者

  (5)用于微胶接的pL级点胶方法，光学精密工程，2012，第1作者

  (6)时间/压力型pL级微点胶技术，光学精密工程，2011，第1作者

  (7)Characteristic of Monocular Microscope Vision and Its Application on Assembly
  of Micro-Pipe and Micro-Sphere，32st Chinese Control Conference，2013，第4作者

  (8)Development of Vision Based Force Measurement，31st Chinese Control Conference，2012，第3作者

  获奖及荣誉

  获得北京市科学技术叁等奖，排名第四。

  专利成果

  (1)发明专利：一种光学元件夹持装置和方法，2017，第1发明人，授权号CN106392932A

  (2)发明专利：一种微管零件的夹持装置及方法，2016，第1发明人，授权号CN106239086A

  (3)发明专利：一种适用于微小透光零件的照明夹持器和夹持方法，2014，第1发明人，授权号CN103707280A

  (4)发明专利：适用于微米级微管和微孔的装配点胶装置，2012，第1发明人，授权号CN102744590A

  (5)发明专利：大口径光学元件表面损伤检测装置和相应的检测方法，2014，第1发明人，授权号CN103674977A

  (6)发明专利：适用于微米级微管和微孔的装配点胶装置, 2014, 中国, CN102744590B'
