bio_raw: '鲁涛

  /

  职　　称:

  副高级

  电子邮件:

  tao.lu@ia.ac.cn

  个人简历

  鲁涛，中国科学院自动化研究所多模态人工智能系统重点实验室副研究员，硕士生导师，中科院自动化所特聘青年骨干，国家机器人技术标委会协作机器人标准工作组专家委员，工信部工业互联网安全、国家自然科学基金等项目评审专家。长期从事智能机器人控制、人机交互、操作技能学习、模仿学习等，在

  IEEE/CAA JAS

  、

  SCIS

  、

  IJARS

  、

  IROS

  、

  ICRA

  、

  ROBIO

  等国际期刊和会议发表论文

  40

  余篇，授权国家发明专利

  12

  项。参与或主持智能机器人重点研发项目多项，其中包括新一代人工智能重大专项

  1

  项，国家科技重大项目智能机器人专项

  1

  项，北京市重点专项

  1

  项等。

  研究方向：

  (1)

  移动机器人导航与人机交互。 重点研究服务型移动机器人室内外自主导航、多模态人机交互、人机协作、移动操作等关键技术。

  (2)

  机器人操作技能自主学习。 面向家庭服务、工业装配等操作场景需求，基于深度学习、强化学习等人工智能技术，研究机器人操作技能的快速模仿以及自主学习方法。

  个人主页：

  http://people.ucas.ac.cn/~casialutao'
