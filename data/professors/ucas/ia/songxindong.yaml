bio_raw: "宋欣东\n/\nJohns Hopkins University, Biomedical Engineering, PhD\n清华大学，生物学，硕士\n\
  清华大学，电子工程，学士\n职　　称:\n研究员\n邮　　编:\n100190\n电子邮件:\nxindong.song@ia.ac.cn\n部门/实验室:\n\
  脑图谱与类脑智能实验室\n通讯地址:\n中关村东路95号智能化大厦207\n研究方向\n光学脑机接口、听觉类脑模型、灵长类脑科学\n承担科研项目情况\n国家自然科学基金委项目，主持\n\
  国家科技部，科技创新2030-“脑科学与类脑研究”重大项目“类脑听觉前端模型与系统研究”2021ZD0201500，参与\n国家自然科学基金委交叉学部，重大专项项目“音乐智能量化和脑科学认知研究”NSFC\
  \ T2341003，参与\n研究所2035创新项目：“面向人体应用的灵长类光学脑机接口的基础问题研究”2024-2026， 主持\n代表论著\n•\tSong\
  \ X#, et. al. (2022) “Mesoscopic landscape of cortical functions revealed by through-skull\
  \ wide-field optical imaging in marmoset monkeys”. Nature Communications. 13:2238.\n\
  •\tSong X#, Guo Y, Chen C, Wang X# (2022) “A silent two-photon imaging system for\
  \ studying in vivo auditory neuronal functions”. Light: Science and Applications.\
  \ 11:96. (news by nature.com/articles/s41377-022-00843-3)\n•\tSong X#, Osmanski\
  \ MS, Guo Y, Wang X# (2016) “Complex pitch perception mechanisms are shared by humans\
  \ and a New World monkey”. Proceedings of the National Academy of Sciences of the\
  \ USA. 113:781-786 (cover story, news by Nature, Scientific American)\n•\t刘自鸿、宋欣东、张若昕译，《感官及运动功能重建的神经修复技术》，国防工业出版社，2007\n\
  获奖及荣誉\n（1） 国家级人才计划入选者（青年人才）, 国家级, 2022\n（2） Kavli Distinguished Postdoctoral Award,\
  \ Kavli NDI, 一等奖, 研究所（学校）, 2017\n（3） The 39th Young Investigator Award, Johns Hopkins\
  \ School of Medicine, 一等奖, 研究所（学校）, 2016\n社会任职\n2023-06-17-今,清华大学脑与智能实验室, 兼职高级研究员\n\
  2023-04-29-今,中国科学院大学人工智能学院, 双聘教授"
