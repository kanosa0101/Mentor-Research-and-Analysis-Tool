  个人简历

  研究方向：主要关注智能决策、计算机视觉等相关领域研究，特别对有限理性对手建模等方向有深入研究。

  2013年获中国科学院自动化研究所工学博士学位（专业：模式识别与智能系统）。2013年7月加入中国科学院自动化所，任助理研究员。2018年11月任副研究员。陈晓棠博士主要研究方向包括：模式识别、计算机视觉、智能感知与决策等。已在重要国际期刊、会议上，包括TIP,
  PR, CVPR，AAAI，ICIP, ACCV，计算机学报、IJCAI等发表论文多篇；是多项国际国内期刊审稿人，包括IEEE T-CSVT, IEEE TSMC：Systems,
  Pattern Recognition,计算机学报，自动化学报等。目前作为课题负责人主持国家自然科学基金1项，实际课题负责人承担国家重点研发计划课题、科技部2030项目课题等，并作为项目负责人承担多个企业横向。

  研究方向

  计算机视觉、智能决策等

  承担科研项目情况

  1.对手建模算法体系，中国科学院战略性先导科技专项, 负责人

  2.心理投射图像的智能分析关键技术研究，国家重点研发计划，负责人

  3.人机博弈智能对抗机制与开放生态，科技创新2030—重大项目，研究骨干

  4.大范围场景透彻感知的验证系统和示范应用，国家重点研发计划，研究骨干

  5.复杂摄像机网络中的跨场景目标跟踪研究，国家自然科学基金，负责人

  6.基于层次化表达的大规模图像物体识别，国家自然科学基金，研究骨干

  7.智能心理评估系统开发，研究骨干

  8.手指遮挡处理技术委托技术开发，负责人

  9.监控视频中行人特征识别技术开发，负责人

  10.Database and Algorithm License Agreement，负责人

  11.自动化学习算子设计与加速算法研究，负责人

  12.手机部件生产线上工业缺陷智能视觉检测，负责人

