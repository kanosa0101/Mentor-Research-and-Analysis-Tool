  部门/实验室:

  脑图谱与类脑智能实验室

  通讯地址:

  北京市海淀区中关村东路95号自动化大厦，100190

  个人简历

  （1）2007.9-2011.3 北京航空航天大学 博士毕业

  （2）2011.3-2013.10 中国科学院自动化研究所 助理研究员

  （3）2013.11-2022.3 中国科学院自动化研究所 副研究员

  （4）2022.4-至今中国科学院自动化研究所 研究员

  研究方向

  微创植入式柔性脑机接口、微操作机器人，微器件位姿测量与控制

  承担科研项目情况

  近五年共主持项目6项，累计经费933万元。其中，包括科技创新2030-“脑科学与类脑研究”重大计划子课题1项、科技创新2030-“新一代人工智能”重大项目子课题1项、中国科学院先导子课题1项，国家自然科学基金面上项目1项、北京自然科学基金1项。

  （1）科技创新2030 -脑科学与类脑研究重大计划子课题，微创脑机接口植入装置与系统，主持，400万，2021-2026

  （2）北京自然科学基金-海淀原始创新联合基金，微创植入式柔性脑机接口系统关键技术研究与实验验证，主持，100万，2023-2026

  （3）国家自然科学基金，微装配机器人感知测量与自适应控制技术研究，59万，主持，2021-2024

  （4）科技创新2030-“新一代人工智能”重大项目子课题，175万，主持，2019-2023

  （5）中国科学院先导科技专项子课题，柔性电极微创植入机器人研制，主持，120万，2021-2023

