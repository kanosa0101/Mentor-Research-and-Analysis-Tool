  个人简历

  董秋雷，博士，研究员，博士生导师。2008年毕业于中国科学院自动化所，获工学博士学位。从2008年至今，在中科院自动化所模式识别国家重点实验室工作。2014年至2015年间，在美国加利福尼亚大学洛杉矶分校（UCLA）进行访问研究。目前受聘为中国科学院自动化研究所研究员、中国科学院大学岗位教授、中国科学院脑科学与智能技术卓越创新中心青年骨干，并担任国际期刊《Journal
  of Computer Science and Technology》青年编辑、中国自动化学会模式识别与机器智能专业委员会委员、北京人工智能学会理事、以及多个国内外学术会议的程序委员会委员（Program
  Committee Member）。先后主持承担国家自然科学基金联合基金重点项目、科技部科技创新2030重大项目课题、中科院战略先导专项课题等20余项科研项目。曾获2020年度中国科学院朱李月华优秀教师奖。主要研究方向为模式识别、计算机视觉、基于生物视觉机理的建模。

  研究方向

  计算机视觉、模式识别

  承担科研项目情况

  1. 癫痫复杂脑网络建模、预测与闭环调控研究，科技创新2030重大项目课题；2 面向台风灾害评估的目标快速三维重建与动态监测研究，国家自然基金联合基金重点项目

  代表论著

  1. Y. Liu and Q. Dong*, Descriptor Distillation: a Teacher-Student-Regularized Framework
  for Learning Local Descriptors, International Journal of Computer Vision, 2024,
  Accepted; 2. Q. Dong*, X. Gao, H. Cui, and Z. Hu, Robust Camera Translation Estimation
  via Rank Enforcement, IEEE Transactions on Cybernetics, vol. 52, no. 2, pp. 862-872,
  Feb. 2022; 3. Z. Zhou and Q. Dong*, Two-in-One Depth: Bridging the Gap Between Monocular
  and Binocular Self-supervised Depth Estimation, in Proc. IEEE International Conference
  on Computer Vision (ICCV), pp. 9411-9421, 2023; 4. J. Li and Q. Dong*, Open-set
  Semantic Segmentation for Point Clouds via Adversarial Prototype Framework, in Proc.
  IEEE Conference on Computer Vision and Pattern Recognition (CVPR), pp. 9425-9434,
  2023; 5. T. Tan and Q. Dong*, SMOC-Net: Leveraging Camera Pose for Self-Supervised
  Monocular Object Pose Estimation, in Proc. IEEE Conference on Computer Vision and
  Pattern Recognition (CVPR), pp. 21307-21316, 2023

  获奖及荣誉

