  个人简历

  2008 年进入自动化所以来一直从事无人系统自主决策与协同规划方向的研究，2013 年晋升副研究员，并荣获自动化所十佳员工，近几以实现飞行器智能算法的学习演进和性能升级为研究目标，通过智能算法在群体对抗中的运行缺口，完成智能算法学习演进训练方案的自动生成，为飞行器智能快速升级提供技术途径。

  研究方向

  无人系统自主决策与协同规划方向

  承担科研项目情况

  针对 AI 技术应用展开工作，并先后承担智能体算法演进决策系统、无人集群决策技术等研究。'
