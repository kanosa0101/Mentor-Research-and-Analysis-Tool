  个人简历

  赵阳，博士，中国科学院自动化研究所副研究员，硕士生导师。主要研究方向为自然语言处理和机器翻译等，作为负责人和技术骨干承担多个国家自然基金项目、国家重点研发计划子课题和特定领域应用项目等，在领域著名期刊（AI、TASLP、TALLIP等）和会议（AAAI、IJCAI、ACL、EMNLP、COLING等）发表论文30余篇，作为共同作者出版专著《自然语言处理基础与大模型案例与实践》，出版译著《神经机器翻译》，获CCMT
  2023最佳论文。 目前担任国际学术期刊 ACM TALLIP 副主编（Associate Editor）。

  研究方向

  自然语言处理

  承担科研项目情况

  1）国家自然基金青年基金项目负责人：融合知识图谱的神经机器翻译方法研究

  2）预研项目负责人：文本识别技术

  3）科技创新2030-新一代人工智能重大项目子课题负责人：多模态预训练模型的知识增强

  4）自动翻译软件项目负责人

  5）CCF-腾讯犀牛鸟基金项目负责人

