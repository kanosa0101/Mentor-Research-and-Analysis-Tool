  个人简历

  刘阿建，中国科学院自动化研究所多模态人工智能系统全国重点实验室，副研究员。长期深耕人脸防伪与深伪检测领域，创新性地提出了多模态融合、跨模态转换及灵活模态的人脸防伪新范式，并围绕物理-数字人脸联合攻击检测发表了一系列代表性成果。

  研究方向

  计算机视觉、可信人工智能、生物特征安全

