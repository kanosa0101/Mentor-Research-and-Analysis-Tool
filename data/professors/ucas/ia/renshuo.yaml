  个人简历

  任烁，本科与博士毕业于北京航空航天大学计算机学院，为北京航空航天大学与微软亚洲研究院联合培养直博生，师从马帅教授与周明博士，博士研究方向为机器翻译。博士毕业后先后任于微软亚洲研究院自然语言计算组，中国证券监督管理委员会科技监管局，中国科学院自动化研究所紫东太初大模型研究中心。目前为中科院自动化所副研究员，研究方向为大模型预训练、多模态对齐等。

  研究方向

  人工智能，自然语言处理，预训练

