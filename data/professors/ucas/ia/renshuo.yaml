  （2）Shuo Ren, Yu Wu, Shujie Liu, Ming Zhou, Shuai Ma, Explicit Cross-lingual Pre-training
  for Unsupervised Machine Translation, 2019 Conference on Empirical Methods in Natural
  Language Processing (EMNLP 2019).

  （3）Shuo Ren, Zhirui Zhang, Shujie Liu, Ming Zhou and Shuai Ma, Unsupervised Neural
