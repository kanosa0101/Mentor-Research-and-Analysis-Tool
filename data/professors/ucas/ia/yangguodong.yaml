  个人简历

  杨国栋，中国科学院大学人工智能学院岗位教师，硕士生导师，主要从事机器人、无人自主系统的研究与应用。是中国指挥与控制学会ADRC分会委员、IEEE PES 电力系统通信与网络安全技术委员会（中国）
  电力信息通信人工智能技术分委会委员。主持和参加国家自然科学基金项目、国家863计划、国家科技支撑计划、国家重点研发计划等国家级、省部级科研项目20余项，在国内外学术刊物和会议上发表论文40余篇，获授权发明专利20余项。

  研究方向

  机器人控制

  承担科研项目情况

  (1). NSFC面上项目，混合式巡线机器人自主巡检关键技术研究，2020.1-2023.12，60万，负责人，在研

  (2). NSFC青年项目，巡线机器人动态时变环境下特征识别与路径规划研究，2015.1-2017.12，24万，负责人，结题

  (3). NSFC重点项目，架空输电线路巡检机器人关键技术研究，2018.1-2021.12，306万，主要参与人，结题

  (4). NSFC 集成项目，面向肢体功能重建的智能康复机器人基础理论与关键技术，2020.1-2023.12，1091万，主要参与人，在研

  (5). 工信部装备工程化攻关专项，大尺度灾情研判与目标精准识别定位装备，2021.4-2023.3，2400万，负责人，在研

  (6). 国家重点研发计划课题，500kV输电线路带电作业机器人技术，2019.6-2022.5，265万，主要参与人，在研

  (7). 国家科技支撑计划子课题，多机网络协调控制与故障诊断技术研究，2015.4-2017.12，58万，负责人，结题

  (8). 国家重点研发计划子课题，面向复杂环境的机器人共性关键技术研究，2017.7-2020.12，57.8万，负责人，结题

  (9). 国家电网科技项目，基于仿生学的混合式巡检机器人及其定位技术研究，2020.1-2022.12，195万，负责人，在研

  (10). 国家电网科技项目，多传感器融合临场感遥操作机器人技术研究及应用，2023.1-2024.12，150万，负责人，在研

  (11). 国家电网科技项目，直升机激光扫描巡检数据处理及安全保障技术研究，2013.1-2015.12，59万，负责人，结题

  (12). 国家电网科技项目，面向电力行业的作业机器人系统研究及应用，2020.8-2022.5，523万，主要参与人，在研

