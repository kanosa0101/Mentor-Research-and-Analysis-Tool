  个人简历

  刘冰，中国科学院自动化研究所副研究员。2012年于中国科学院生物物理研究所王毅实验室获得神经生物学博士学位。毕业后前往芝加哥大学Osborne Lab进行博后研究，探索视觉运动信息的高效编码与群体解码。后在加州大学伯克利分校Carmena
  Lab，杜克大学神经生物学系Lisberger Lab进行植入式脑机接口方面研究。2023年加入中国科学院自动化研究所。

  研究方向围绕非人灵长类动物的植入式闭环脑机接口和视觉／运动信息的编码解码（包括计算神经和类脑计算）展开，主要研究神经系统在与外界交互中的适应和学习过程，特别是大脑与机器的相互协同融合的双学习系统及其在脑机接口中的应用，以开发下一代的脑机融合系统。现已在相关领域内Nature
  Biomedical Engineering，Nature Communications，Journal of neuroscience，PLoS computational
  biology等顶级期刊上发表多篇文章。

  研究方向

  研究方向围绕非人灵长类动物的植入式闭环脑机接口和视觉／运动信息的编码解码（包括计算神经和类脑计算）展开，主要研究神经系统在与外界交互中的适应和学习过程，特别是大脑与机器的相互协同融合的双学习系统及其在脑机接口中的应用，以开发下一代的脑机融合系统。

