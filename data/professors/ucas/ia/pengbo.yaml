bio_raw: "彭勃\n/\n职　　称:\n副研究员\n邮　　编:\n100190\n电子邮件:\nbo.peng@nlpr.ia.ac.cn\n部门/实验室:\n\
  智能感知与计算研究中心\n通讯地址:\n北京市海淀区中关村东路108号智能化大厦\n个人简历\n彭勃，博士，副研究员，2018年至今在中科院自动化所工作。在图像内容取证与安全、深度伪造对抗攻防等领域有着深入研究经验。主持科技部重点研发课题、国家自然科学基金面上项目、中国科协青年托举项目、北京市自然科学基金面上项目、华为MindSpore学术奖励基金等共10项。在IEEE\
  \ TIFS、TCSVT、CVPR、ACM MM等重要国际期刊和会议上发表论文30余篇，获发明专利授权16项，软件著作权授权2项，曾获中国发明协会发明创业奖创新奖一等奖、中国图象图形学学会技术发明奖二等奖等奖项和荣誉。目前是中国图象图形学会数字媒体取证与安全专业委员会委员、北京图象图形学会青工委委员、IEEE\
  \ Beijing Biometrics Council Chapter Secretary。\n研究方向\n计算机视觉、图像取证\n代表论著\n1.\tBo\
  \ Peng, Hongxing Fan, Wei Wang, Jing Dong and Siwei Lyu, \"A Unified Framework for\
  \ High Fidelity Face Swap and Expression Reenactment,\" in IEEE Transactions on\
  \ Circuits and Systems for Video Technology, 2021.\n2.\tBo Peng, Wei Wang, Jing\
  \ Dong and Tieniu Tan, “Image Forensics Based on Planar Contact Constraints of 3D\
  \ Objects”, IEEE Transactions on Information Forensics and Security (TIFS), vol.\
  \ 13, no. 2, pp. 377-392, Feb. 2018.\n3.\tBo Peng, Wei Wang, Jing Dong and Tieniu\
  \ Tan, “Optimized 3D Lighting Environment Estimation for Image Forgery Detection”,\
  \ IEEE Transactions on Information Forensics and Security (TIFS), vol. 12, no. 2,\
  \ pp. 479-494, Feb. 2017.\n4.\tBo Peng, Wei Xiang, Yue Jiang, Wei Wang, Jing Dong,\
  \ Zhenan Sun, Zhen Lei, Siwei Lyu, \"DFGC 2022: The Second DeepFake Game Competition\"\
  , 2022 IEEE International Joint Conference on Biometrics (IJCB)\n5.\tBo Peng, Wei\
  \ Wang, Jing Dong, Tieniu Tan, \"Learning Pose-invariant 3D Object Reconstruction\
  \ from Single-view Images\", Neurocomputing, vol. 423, pp. 407-418, Jan. 2021.\n\
  获奖及荣誉\n2022年度中国发明协会发明创业奖创新奖一等奖，2022年\n第二届广播电视和网络视听人工智能应用创新大赛（MediaAIAC）深度合成技术应用类一等奖，2022年\n\
  中国科协青年人才托举工程，2021年\n中国图象图形学学会技术发明二等奖， 2021\n北京市优秀毕业生，2018\n中国科学院Rokid人工智能科学奖，2017\n\
  专利成果\n1\t谭铁牛、董晶、王伟、彭勃，基于透视失真特性的人脸图像鉴伪方法、存储、处理设备，申请号：201710484342.9，公开号：CN107292269B，申请日期：2017.06.23，授权日期：2020.02.28\n\
