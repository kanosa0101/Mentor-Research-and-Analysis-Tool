bio_raw: "高翔\n/\n职　　称:\n副研究员\n邮　　编:\n100190\n电子邮件:\nxiang.gao@ia.ac.cn\n部门/实验室:\n\
  中国科学院工业视觉智能装备技术工程实验室\n通讯地址:\n北京市海淀区中关村东路95号\n个人简历\n工作简历\n1. 2023.07至今, 中国科学院自动化研究所,\
  \ 副研究员\n2. 2022.09至2023.07, 中国科学院自动化研究所, 助理研究员\n3. 2019.08至2022.09, 中国海洋大学, 讲师\n\
  学习简历\n1. 2015.09至2019.06, 中国科学院大学, 工学博士\n2. 2012.09至2015.06, 中国海洋大学, 工学硕士\n3. 2008.09至2012.06,\
  \ 中国海洋大学, 工学学士\n研究方向\n三维计算机视觉理论与应用，包括大规模从运动恢复结构、基于图像的场景三维建模等\n承担科研项目情况\n1. 2024-2027,\
  \ 面向大规模场景三维重建的增量式运动平均理论与方法研究, 国家自然科学基金面上项目\n2. 2023-2024,\t面向空间智能的基础模型学习, 中国科学院战略性先导科技专项子课题\n\
  3. 2021-2024, 三维点云特征学习与自适应采样方法研究, 国家自然科学基金面上项目课题\n3. 2021-2023, 基于多源数据与多层次特征融合的城市三维地图构建研究,\
  \ 国家自然科学基金青年基金项目\n4. 2021-2023, 基于众包手机图像与主被动视觉融合的大规模室内场景建模方法研究, 山东省自然科学基金青年基金项目\n\
  5. 2021-2022, 增量式旋转平均化方法研究, 中国博士后科学基金面上资助项目\n代表论著\n1. Xiang Gao, Lingjie Zhu, Zexiao\
  \ Xie, Hongmin Liu, Shuhan Shen. Incremental Rotation Averaging, International Journal\
  \ of Computer Vision (IJCV), 2021, 129: 1202-1216.\n2. Xiang Gao, Dongdong Tao,\
  \ Yuqian Liu, Zexiao Xie, Shuhan Shen. Vehicle-borne Multi-sensor Temporal-spatial\
  \ Pose Globalization via Cross-domain Data Association, IEEE Transactions on Intelligent\
  \ Transportation Systems (TITS), 2023, 24(12): 13962-13975.\n3. Xiang Gao, Lingjie\
  \ Zhu, Bin Fan, Hongmin Liu, Shuhan Shen. Incremental Translation Averaging, IEEE\
  \ Transactions on Circuits and Systems for Video Technology (TCSVT), 2022, 32(11):\
  \ 7783-7795.\n4. Xiang Gao, Lingjie Zhu, Hainan Cui, Zexiao Xie, Shuhan Shen. IRA++:\
  \ Distributed Incremental Rotation Averaging, IEEE Transactions on Circuits and\
  \ Systems for Video Technology (TCSVT), 2022, 32(7): 4885-4892.\n5. Xiang Gao, Shuhan\
  \ Shen, Lingjie Zhu, Tianxin Shi, Zhiheng Wang, Zhanyi Hu. Complete Scene Reconstruction\
  \ by Merging Images and Laser Scans, IEEE Transactions on Circuits and Systems for\
  \ Video Technology (TCSVT), 2020, 30(10): 3688-3701.\n获奖及荣誉\nCVPR 2019大时间跨度视觉定位竞赛冠军\n\
  专利成果\n1. 高翔, 王欣宇, 解则晓. RGB-D图像检索方法, 2023-12-26, 中国, ZL202010691431.2.\n2. 高翔, 罗家铮,\
  \ 解则晓. 层次式相机旋转估计方法, 2023-10-27, 中国,\nZL202010886419.7.\n3. 高翔, 李梦晗, 马孝冬, 解则晓. 增量式平移平均化方法、系统、设备,\
  \ 2021-11-19, 中国,\nZL202110992939.0.\n4. 高翔, 陶冬冬, 解则晓, 于筱萱, 王皓月, 胡晨. 基于街景图像与车载激光雷达融合的城市场景构图\n\
  方法及系统, 2021-9-21, 中国, ZL202110781760.0.\n5. 申抒含, 高翔, 朱灵杰, 时天欣, 胡占义. 融合图像与激光数据的场景建模方法、系统、装置,\n\
  2021-5-4, 中国, ZL201910502755.4.\n社会任职\n中国图象图形学学会三维视觉专委会委员"
