  个人简介

  面向“制造强国”战略需求，长期从事机器人三维感知与自主作业研究，提出了多场景高精度感知与智能操作方法，解决了微装配机器人智能控制、FAST靶标三维感知与柔顺拆装、大型舱段自主对接、复杂焊缝自主焊接等关键技术难题，在国家重大项目中得到应用并获得认可；作为项目负责人主持国家科技重大专项课题、国家重点研发计划子课题、国家自然科学基金青年基金（C类）等重要科研项目；担任中国人工智能学会智能机器人专委会委员、中国指挥与控制学会无人系统专委会委员；在机器人和自动化领域发表高水平学术论文20余篇，其中以第一/通讯作者身份发表顶刊/顶会15篇，涉及机器人、自动化领域的国际刊物IEEE
  TII、TIE、TASE、TIM等，人工智能、模式识别领域的国际刊物PR、ESWA, 国际会议ICCV、ICRA、CVPR、CASE等；目前已申请国家发明专利20余件，登记软件著作权10余件，参与制定国家标准1项。个人主页：https://yunkaima.github.io。

  承担科研项目情况

  1. 国家重点研发计划子课题，自主移动机器人集群大规模实时调度，2023.12至2026.12，主持。

  2. 国家自然科学基金青年基金（C类），多模态大模型交互的人形焊接机器人自主编程与智能控制研究，2026.01至2028.12，主持。

  3. 四川省重点研发计划子课题，微装配机器人多模态精密感知与智能决策方法研究，2024.10至2027.10，主持。

  4. 中国博士后科学基金面上项目，基于大模型交互的人形机器人自主焊接方法研究，2025.01至2026.12，主持。

  5. 国家自然科学联合基金重点项目，基于多机器人协调的大型舱段轴孔精密装配控制方法，2019-01至2022-12，参与。

  6. 科技部重点研发计划课题，反射面激光靶标维护机器人，2020-01至2022-12，参与。

