bio_raw: "蔡莹皓\n/\n职　　称:\n副研究员\n邮　　编:\n100190\n电子邮件:\nyinghao.cai@ia.ac.cn\n部门/实验室:\n\
  多模态人工智能全国重点实验室\n通讯地址:\n北京市海淀区中关村东路95号\n研究方向\n具身智能、智能机器人\n承担科研项目情况\n1. 面向跨域异构自主无人系统的高端智能控制器集成验证，科技创新\
  \ 2030—新一代人工智能重大项目课题负责人，2022.6-2025.5.\n2. 室外大范围复杂动态场景安保机器人长期导航与场景理解,  国家自然科学基金联合基金重点,\
  \ 2020-01-2023-12.\n代表论著\n1. L Zheng, W Ma, Y Cai, T Lu, S Wang, GPDAN: Grasp Pose\
  \ Domain Adaptation Network for Sim-to-Real 6-DoF Object Grasping, IEEE Robotics\
  \ and Automation Letters, 2023.\n2. L Zheng, Y Cai, T Lu, S Wang，VGPN: 6-DoF grasp\
  \ pose detection network based on hough voting， 2022 IEEE/RSJ International Conference\
  \ on Intelligent Robots and Systems （IROS）, 2022.\n3. C Zhang, S Cui, S Wang, J\
  \ Hu, Y Cai, R Wang, Y Wang， GelStereo 2.0: An Improved GelStereo Sensor With Multimedium\
  \ Refractive Stereo Calibration， IEEE Transactions on Industrial Electronics， 2023.\n\
  4. X Cao, T Lu, L Zheng, Y Cai, S Wang，PLOT: Human-like Push-grasping Synergy Learning\
  \ in Clutter with One-shot Target Recognition， IEEE Transactions on Cognitive and\
  \ Developmental Systems，2024.\n5. X Xing, Y Cai, T Lu, Y Yang, D Wen, Joint self-supervised\
  \ monocular depth estimation and SLAM, 2022 26th International Conference on Pattern\
  \ Recognition (ICPR), 4030-4036\t.\n获奖及荣誉\n1. Intel 室内机器人学习挑战赛, 一等奖, 其他, 2023\n\
  2. CVPR2019视觉定位竞赛第三名, , 其他, 2019\n3. Mobile Multimedia Computing研讨会最佳论文奖, 其他, 2015\n\
  4. ECCV多摄像机目标跟踪竞赛第一名, , 其他, 2014\n专利成果\n（1）基于本体知识表示的机器人任务处理方法及系统, 发明专利, 2021, 第\
  \ 5 作者, 专利号: CN113821648A\n（2）面向杂质性目标的机器人操作协同抓取方法、系统及设备, 发明专利, 2021, 第 3 作者, 专利号:\
  \ 202110290232.5\n（3）用于连接ROS的通讯系统, 发明专利, 2020, 第 4 作者, 专利号: CN110955536A\n（4）消防机器人和基于云平台架构的消防机器人系统,\
  \ 发明专利, 2020, 第 3 作者, 专利号: CN110888442A\n（5）一种具备在线地图构建和导航功能的自主消防机器人系统, 发明专利, 2019,\
  \ 第 6 作者, 专利号: CN110201340A\n（6）基于视觉的遥操作机器人控制系统及方法, 专利授权, 2017, 第 4 作者, 专利号: CN107363831A\n\
  （7）基于虚拟现实的机器人远程示教系统, 专利授权, 2017, 第 4 作者, 专利号: CN107263449A\n（8）基于多摄像机的目标连续跟踪方法,\
  \ 发明专利, 2010, 第 3 作者, 专利号: CN101751677A\n（9）基于信息融合的夜间视觉监控方法, 发明专利, 2009, 第 3 作者,\
