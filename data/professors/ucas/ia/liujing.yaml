  研究方向

  视频图像分析与理解；视觉与语言；多媒体分析与检索

  承担科研项目情况

  承担或参与十余项国家自然科学基金项目、国家973项目、国家基金重大研究计划、国家重点研发项目、新一代人工智能国家科技重大专项等。

