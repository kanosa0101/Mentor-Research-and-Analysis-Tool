  个人简历

  赵恺，工学博士，中国科学院自动化研究所副研究员，研究和技术领域为决策智能与自主作业机器人，主要工作致力于将高性能人工智能与机器人控制系统相结合，研发高自主、高智能的行业落地可用的机器人本体和系统。参与科技部新一代人工智能（2030）重大专项、国家自然科学基金项目、山东省自然科学基金项目、江苏省重点研发计划（产业前瞻与关键核心技术）、江苏省工业和信息产业转型升级专项（关键核心技术装备工程化攻关）、系统与算法开发等研究和研发项目多项。发表期刊或会议学术论文9篇，其中1篇第一作者EI会议论文获得第十四届国际通信技术会议ICCT2012大会最佳论文奖；获得授权国家发明专利4项。以核心成员完成企业委托的横向开发项目多项。

  研究方向

  决策智能、自主作业机器人

  承担科研项目情况

  1. 基于大数据传输与处理的高速动车组齿轮传动系统复杂场景智能态势感知技术，江苏省工业和信息产业转型升级专项资金（关键核心技术装备工程化攻关），2023.01-2024.12，课题负责人

  2. 基于昇腾全栈技术的决策大模型与通用平台研发，江苏省重点研发计划（产业前瞻与关键核心技术），2023.09-2027.09，参与

  3. 城市地下管网自主巡检机器人，企业委托开发，2023.04-2024.12，项目负责人

  4. 双孢菇自主采摘机器人，企业委托开发，2023.04-2024.12，项目负责人

  5. 肌电信号精准采集和智能分析装备，企业委托开发，2022.10-2024.12，项目负责人

  6. 企业级深度学习计算与服务平台开发，企业委托开发，2016.07-2020.10，参与

  7. Massive MIMO 系统中接收端低复杂度检测技术研究，国家自然科学基金青年项目，2016.01-2018.12，参与

  8. 智能交通复杂网络环境下基于博弈理论和非凸优化理论资源优化理论研究，复杂系统管理与控制国家重点实验室优秀人才基金，2016.01-2017.12，项目负责人

  代表论著

