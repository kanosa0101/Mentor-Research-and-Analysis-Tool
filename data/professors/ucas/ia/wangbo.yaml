  个人简历

  2003-09至2007-06，南京大学，电子科学与工程学院，学士；

  2007-09至2013-06，中国科学院自动化研究所，模式识别国家重点实验室，博士，导师：胡占义；

  2013-07至2016-07, 中国科学院自动化研究所, 综合信息系统研究中心, 助理研究员；

  2016-07至2019-06, 中国科学院自动化研究所, 综合信息系统研究中心, 副研究员；

  2019-06至今，中国科学院自动化研究所, 多模态人工智能系统全国重点实验室, 副研究员；

  研究方向

  计算机视觉、模式识别

  承担科研项目情况

  （1）中华人民共和国科学技术部, 数字诊疗装备研发, 2018YFC0117005, 面向医疗健康数据智能分析云平台开发及新型服务模式创新, 2018-08 至
  2021-12, 253万元

  （2）中华人民共和国科学技术部, 科技创新2030-“新一代人工智能”重大项目, 2020AAA0109600, 医疗行为多维度感知关键技术及应用研究, 2020-11
  至 2023-10, 1774万元

  （3）国家自然科学基金, 联合基金项目, U1805264, 面向台风灾害评估的目标快速三维重建与动态监测研究, 2019-01-01 至 2022-12-31,
  218万元

  （4）国家自然科学基金, 面上项目, 62273346, P3P问题解的鲁棒性研究, 2022-01 至 2026-12, 54万元

  （5）国家自然科学基金, 青年基金项目, 61403373, 广义双视几何理论及其在无限广角显示中的应用, 2014-01 至 2017-12, 23万元

  代表论著

  (1)Bo Wang, Hao Hu, Caixia Zhang; New insights on Multi-Solution Distribution of
  the P3P Problem, Image and Vision Computing, 2020

  (2)Bo Wang, Hao Hu, Caixia Zhang; Geometric Interpretation of the Multi-solution
  Phenomenon in the P3P Problem, Journal of Mathematical Imaging and Vision, 2020

  (3) Bo Wang, Caixia Zhang, Zhanyi Hu; the Role of the Deltoidal Surface in the Solution
  Variation of the P3P Problem, Journal of Mathematical Imaging and Vision, 2021

  (4) Michael Rieck, Bo Wang; Locating Perspective Three-Point Problem Solutions in
  Spatial Regions, Journal of Mathematical Imaging and Vision, 2021

  专利成果

  （1）分布式红外视觉检测与投影融合自动矫正的触控显示系统

  （2）基于 Unity 拼接融合系统的多投影仪无缝拼接融合方法

  （3）智能异形投影非接触式交互系统和方法

  （4）基于旋转折射片的单目摄像机三维重建方法、系统

  （5）基于多投影仪拼接融合的影片加密方法、解密方法

  （6）基于目标物对接环的对接设备位姿调整方法、系统

  （7）基于深度学习的混合跟踪方法及装置'
