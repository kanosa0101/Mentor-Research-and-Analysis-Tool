  个人简历

  2013-01~今, 中国科学院自动化研究所, 研究员

  2007-07~2012-12,中国科学院自动化研究所, 副研究员

  2003-07~2007-07,中国科学院自动化研究所, 助理研究员

  邹伟，中国科学院自动化研究所多模态人工智能系统全国重点实验室研究员，博士生导师，所学位委员会、所教学委员会委员，中国科学院大学人工智能学院岗位教授，中国自动化学会智能制造系统专委会、中国计算机学会智能机器人专委会委员。主要从事机器人智能控制与视觉感知、智能制造与系统集成控制等相关技术的研究。作为负责人承担重点研发计划、国家863、国家自然科学基金等国家级纵向课题10余项，承担并完成企业委托项目10余项。发表SCI/EI收录学术论文100余篇，授权发明专利20余项，专著1部。

  研究方向

  机器人视觉；视觉伺服；机器人智能控制

  社会任职

  2017-07-06-今，中国自动化学会智能制造系统委员会

  ，

