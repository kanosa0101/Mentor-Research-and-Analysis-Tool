  Metric-based Few-shot Learning with Dynamically Scaled Softmax Loss, Image and Vision
  Computing, 2023, 140: 104860. (通讯)

  (2) Bo Wang; Shiang Wang; Chunfeng Yuan; Zhonghai Wu; Bing Li; Weiming Hu; Jeffrey
