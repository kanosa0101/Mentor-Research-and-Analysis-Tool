  个人简历

  王博，副研究员，硕士生导师。目前主要从事多模态深度伪造检测、跨模态语义理解与信息检索等方面的研究，已在IEEE T-IP、IEEE T-MM等权威期刊和CVPR、ICIP等国际会议上发表多篇论文。

  研究方向

  多模态深度伪造检测与溯源

  跨模态语义理解与信息检索

  承担科研项目情况

  身份信息和频率特性驱动的伪造人脸检测方法研究，北京市自然科学基金，青年项目

  代表论著

