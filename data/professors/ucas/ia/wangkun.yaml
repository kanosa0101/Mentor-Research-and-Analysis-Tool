  个人简历

  比利时鲁汶大学工学院和医学院双硕士，英国纽卡斯尔大学医学院医学影像博士（Ph.D），中国科学院自动化研究所研究员，北京市杰出青年科学基金获得者，中国科学院青年创新促进会优秀会员，专注于实时多模态医学成像的智能可视化和深度解析技术研发，以及相关临床转化应用研究。其研究目标是通过医学影像和人工智能的交叉融合与方法创新，不断提高对肿瘤等重大疾病的可视化观测能力和影像定量分析能力，推进疾病诊疗的个体化和动态化决策。以第一或通讯作者（含并列）在Nature
  Reviews Bioengineering、Nature Communications、Gut、Engineering、IEEE汇刊等 SCI期刊发表论文60余篇，发表论文在“谷歌学术”总引用6200余次（h指数42）。多篇学术论文被编入美国高校医学影像人工智能的教科书（IPEM-IOP
  Textbook）。获授权美国发明专利一项、授权国家发明专利12项。其中4项专利通过技术转移形成国产高端医疗器械，并获得我国药监局的医疗器械注册证和欧盟EC认证，在全国1000余家三家医用开展临床应用。

  研究方向

  医学影像人工智能

  承担科研项目情况

  1. 2023-01-01至2026-12-31，国家自然科学基金重大研究计划集成项目，“肺癌新辅助免疫治疗中肿瘤演进机制及关键分子功能的可视化研究”，资助号：92259303，资助金额：350万元，在研，子课题负责人。

  2. 2022-01-01至2025-12-31，国家自然科学基金重大研究计划集成项目，“肝癌演进监测与治疗决策的分子功能多模态超声可视化研究”，资助号：92159305，资助金额：350万元，在研，子课题负责人。

  3. 2023.01至2026.12，国家自然科学基金面上基金，“基于超声多模态多时间点影像智能分析的早期肝癌治疗决策研究”，资助号：82272029，直接费用：55万元，在研，主持。

  4. 2022.10至2025.12，北京市杰出青年科学基金项目，“多模态多时间点超声影像智能分析与肝癌诊疗应用研究”，资助号：JQ22013，经费：100万元，在研，主持。

  5. 2023.11至2026.10，国家重点研发计划“生物与信息融合（BT 与IT 融合）”重点专项，“鼻咽癌乏氧多模态数据时空动态可视化建模”，资助号：2023YFF1204602，资助金额：2000万元，在研，课题负责人。

