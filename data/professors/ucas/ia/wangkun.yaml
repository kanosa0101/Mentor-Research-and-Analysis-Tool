  社会任职

  当选中国生物物理学会分子影像分会副秘书长（2013-2017年），世界分子影像大会（World Molecular Imaging Congress）2015年执行委员会委员。现为中国医学装备协会人工智能和医用机器人委员会委员，中国医师协会放射医师分会第四届专业委员会委员，中国抗癌协会肿瘤人工智能专业委员会委员，中国研究型医院学会超声医学专业委员会委员，中国研究型医院学会消化内镜分子影像学专业委员会常务委员。'
