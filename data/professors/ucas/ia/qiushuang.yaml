  ; Time-Distributed Attention Network for EEG-based Motor Imagery Decoding from the
  Same Limb, IEEE Transactions on Neural Systems and Rehabilitation Engineering, 2022.春季
  (期刊论文) ( 本人标注: 共同第一作者 ).

  获奖及荣誉

