  个人简历

  邱爽，中国科学院自动化研究所副研究员。长期从事神经信息编解码、脑机交互研究，2017年获得天津大学生物医学工程专业博士学位（天津市优秀博士论文），2014年-2016年于美国哈佛医学院作为公派联合培养博士生访问学习。获得中国科学院脑智卓越创新中心青年人才激励项目、世界机器人大赛—BCI脑控机器人大赛一等奖（指导老师）等荣誉。

  近五年，主持项目包括国家重点研发计划青年科学家项目1项、国家自然科学基金项目2项、北京市自然科学基金面上项目 1 项、人机混合智能主题项目1项；作为参与单位负责人承担国自然重点项目等。共发表
  SCI/EI 论文 60 余篇（一作或通讯 SCI 论文 31 篇），近五年 40 余篇（一作或通讯 SCI 论文 20 篇），包括ESWA、IEEE TNSRE、IEEE
  TCYB、JNE等，已授权国家发明专利10余项。学术论文获 JNER 高关注（Highly Accessed）论文，并获得国际顶级学术期刊《Science》6203
  期专题报道。

  研究方向

  脑机接口，神经调控，信息编解码

  承担科研项目情况

  科技部, 重点研发计划, 2023YFF1205300, 面向生机交互的高通量读译控关键技术及应用, 2023-11至 2026-10, 300万元, 在研,
  主持；

  国家自然科学基金委员会，面上项目，62276262，面向脑卒中运动功能康复的闭环重复经颅磁刺激关键技术研究，2023-01-01至2026-12-31，53万元，在研，主持；

  国家自然科学基金委员会, 联合基金项目, U21A20388, 基于原子磁力计脑磁图的新型脑机接口系统原理及方法研究, 2022-01-01 至 2025-12-31,
  260万元, 在研, 参与。

