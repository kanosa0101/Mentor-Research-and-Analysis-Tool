  共同通讯作者 );[3]  Kangning Wang; Shuang Qiu; Wei Wei; Yukun Zhang; Shengpei Wang; Huiguang
  He; Minpeng Xu;Tzyy-Ping Jung; Dong Ming ; A multimodal approach to estimating vigilance
