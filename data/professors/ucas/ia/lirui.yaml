bio_raw: "李睿\n/\n职　　称:\n研究员\n邮　　编:\n100190\n电子邮件:\nrui.li@ia.ac.cn\n部门/实验室:\n多模态人工智能系统全国重点实验室\n\
  通讯地址:\n北京市海淀区中关村东路95号\n个人简历\n李睿，中国科学院自动化研究所多模态人工智能系统全国重点实验室研究员（硕士生导师），主要参与人形机器人平台重大任务，从事人形机器人本体与部件研究，参与自动化所谱系化人形机器人Q1-Q3平台搭建。2018年6月毕业于中国科学院自动化研究所，2018年9月至2020年2月在慕尼黑工业大学从事Research\
  \ Fellow研究工作。主要研究领域包括环境约束操作、机器人自主抓取、机器人学习等，至今发表权威期刊论文30余篇，目前担任IEEE RAS 机器人手、抓取与操作技术委员会委员、留德学者计算机学会机器人专业委员会委员。作为项目负责人主持国家自然科学基金、北京市科委重点项目、中国博士后基金、重庆市博士后特别资助等项目。参与欧盟人脑计划（Human\
  \ Brain Project）项目、国家自然科学基金委、科技部等项目，曾获得国家留学基金管理委员会与德国学术交流中心奖学金。\n研究方向\n环境约束操作、机器人自主抓取、机器人学习\n\
  承担科研项目情况\n2023.7-2025.6\n北京市科技计划 智能制造与机器人技术创新项目 Z231100007123004\n项目负责人\n面向未知不平整地形的通用人形机器人全身协同运动控制技术研究\n\
  2021.1 – 2023.12\n国家自然科学基金委青年基金项目 62003059\n项目负责人\n面向机器人灵巧操作的环境约束与触感反馈融合抓取研究\n2020.7\
  \ – 2022.6\n中国博士后科学基金面上资助项目 2020M673136\n项目负责人\n基于事件驱动视觉的机械臂智能控制及精细化操作\n2021.1 –\
  \ 2023.12\n广东省重点领域研发计划项目 2020B0909020001\n子课题负责人\n基于视觉导航的警用巡逻机器人关键技术研究\n负责视觉定位、建图、导航关键技术研究\n\
  2018.9 – 2020.3\n国家留学基金委与德国学术交流中心博士后项目 5091113\n项目负责人\nDiscovery of the Underlying\
