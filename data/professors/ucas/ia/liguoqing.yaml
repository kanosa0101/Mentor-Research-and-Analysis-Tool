  个人简历

  长期从事纳米电镜系统集成研发工作。2007年获北京交通大学电子科学与技术（集成电路）专业工学学士学位，2012年获中国科学院大学工学博士学位，计算机应用技术专业。至今任中国科学院自动化所副研究员，中国科学院大学硕士生导师。已负责主持国家基金委项目1项；主持科学院级（省部级）仪器功能开发项目1项；作为科研骨干同时参与省市级多项科学项目研发，2019年4月受邀代表中国科学院和中科院自动化所参与连接组学国际会议并做大会演讲报告，首次面向国际，系统性地介绍了自主研发高通量微观脑图谱扫描电镜三维影像系统。2021年8月申请并成功获评昆山市双创人才；2022年1月申请并成功获评苏州市姑苏双创人才；2023已申报省级首台套（重大）技术产业系统设备。

  研究方向

  （1）半导体制程全晶圆纳米级量检测系统及其自动化

  （2）智能化图像与视频处理

  （3）基于哺乳动物视网膜神经连接环路建模研究

  承担科研项目情况

  科研项目：

  （ 1 ） 面向超薄序列切片的三维电镜自动成像技术研究, 主持, 国家级, 2018-01--2020-12

  （ 2 ） 高通量扫描电镜三维影像系统产业化, 主持, 省级, 2018-01--2020-12

  （ 3 ） 面向脑微观图谱的高通量技术体系研发及商业化应用, 参与, 省级, 2020-09--2022-12

  （ 4 ） 斑马鱼全脑微介观联接图谱绘制, 参与, 部委级, 2020-08--2021-12

  （ 5 ） 脑连接图谱绘制新技术, 参与, 部委级, 2018-01--2022-12

  （6） 典型中药饮片品种快速智能识别装备，参与，部委级，2024.01-2026.12

