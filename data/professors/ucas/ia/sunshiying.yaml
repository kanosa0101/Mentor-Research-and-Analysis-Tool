  个人简历

  （1）2023-01 至 今，中国科学院自动化研究所，多模态人工智能系统全国重点实验室，副研究员

  （2）2022-07 至 2022-12，中国科学院自动化研究所，复杂系统管理与控制国家重点实验室，副研究员

  （3）2019-01 至 2022-06，中国科学院自动化研究所，复杂系统管理与控制国家重点实验室，助理研究员

  研究方向

  智能机器人系统、环境感知、运动规划、技能学习

  承担科研项目情况

  (1)国家自然科学基金青年科学基金项目，面向公共服务机器人的拟人化社交导航，2023-01-01至2025-12-31，在研，主持

  (2)中关村国家自主创新示范区开放实验室概念验证项目，中医针灸机器人穴位识别定位系统，2020-11 至 2022-10，结题，主持

  (3)中关村国家自主创新示范区开放实验室概念验证项目，人机共融的机器人智能感知与决策，2020-11 至 2022-10，结题，主持

  (4)中关村国家自主创新示范区开放实验室概念验证项目，基于视觉和激光的移动机器人导航系统，2020-11 至 2022-10，结题，主持

  (5)国家电网济南供电公司委托横向项目，适用于变电智能巡检装置的多传感模组类脑感知技术研究，2022-01至2023-12，在研，主持

  (6)国家自然科学基金重点项目，子母式水下仿生机器人系统集群协同环境感知与作业规划，2021-01-01至2025-12-31，在研，参与

  (7)北京市科技计划课题，异构多维无人协同控制系统融合通讯关键技术研究，2020-08至2021-10，结题，参与

  (8)北京市科技计划课题，异构多维无人协同控制系统融合建模与决策关键技术研究，2021-03至2022-10，结题，参与

  (9)北京市科技计划课题，异构多维智能群体协同决策与智能控制关键技术研究与应用验证，2022-06至2023-12，结题，参与

  (10)北京市科技计划课题，异构多维无人系统空地协同搬运关键技术与紧急救援实验验证，2023-06至2024-12，在研，参与

