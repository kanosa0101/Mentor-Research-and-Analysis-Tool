  个人简历

  （1）2022-04 至 今，中国科学院，自动化研究所，副研究员

  （2）2020-10 至 2022-03，中国科学院，自动化研究所，助理研究员

  研究方向

  水下机器人，计算机视觉，主动感知

  承担科研项目情况

  （1）仿生滑翔机器海豚重点项目，2018.07-2025.12，参与

  （2）国家基金委重点项目 水空跨介质仿生机器人多模态运动机理与控制，No. 62233001, 2023.01-2027.12，参与

  （3）面向珊瑚礁生态环境调查的仿生机器人探索路径规划方法研究，复杂系统管理与控制国家重点实验室青年基金，2021.01-2022.12，主持

  （4）预研基金项目，基于声光图像信息的水下航行器目标识别与定位，2022.01-2023.12，参与

  代表论著

  [1] Peng Li, Yang Cai-yun, Wang Rui, Wang Shuo. "A High-Efficiency, Information-Based
  Exploration Path Planning Method for Active Simultaneous Localization and Mapping".
  International Journal of Advanced Robotic Systems, 2020, 17(1): 1-14.

  [2] Yupei Huang, Li Peng, Yan Shuaizheng, Tan Min, Yu Junzhi, Wu Zhengxing. "Self-Localization
  of a Biomimetic Robotic Shark Using Tightly Coupled Visual-Acoustic Fusion". IEEE
  Transactions on Industrial Electronics, 2024.

  [3] Wenkai Chang, Li Peng, Wu Zhengxing. "Self-Supervised Local Topology Representation
  for Random Cluster Matching". IEEE Robotics and Automation Letters, 2023, 8(3):
  1303-1310.

  [4] 李朋, 王硕, 杨彩云. "面向地图构建的移动机器人局部路径自主规划". 控制理论与应用, 2018, 35: 1765-1771.

  [5] Xiaoyun Lu, Tang Shuming, Zhang Lifu, Li Peng, Li Chuang, Wang Yunkuan. "A Novel
  Steering Control for Real Autonomous Vehicles Via Pi Adaptive Dynamic Programming".
  2019 Chinese Control And Decision Conference (CCDC), 2019: 926-930.

  [6] Yupei Huang, Li Peng, Yan Shuaizheng, Ou Yaming, Wu Zhengxing, Tan Min, Yu Junzhi.
  "Tightly-Coupled Visual-Dvl Fusion for Accurate Localization of Underwater Robots";
  proceedings of the 2023 IEEE/RSJ International Conference on Intelligent Robots
  and Systems (IROS), 2023.

  [7] Wenkai Chang, Li Peng, Yang Caiyun, Lu Tao, Cai Yinghao, Wang Shuo. "Self-Modeling
  Tracking Control of Crawler Fire Fighting Robot Based on Causal Network"; proceedings
  of the 2019 IEEE/RSJ International Conference on Intelligent Robots and Systems
  (IROS), 2019.

  [8] 李朋，杨彩云，王硕，鲁涛，常文凯，刘巍. "一种基于信息熵地图的消防机器人未知环境探索方法"; proceedings of the 第十四届中国智能机器人大会,
  中国 重庆, 2019.

  专利成果

  （1）一种基于红外线的检测识别交通信号灯的方法及装置，发明，2017，第2作者，ZL201610902205.8

  （2）一种无人车转向控制方法，发明，2017，第2作者，ZL201710395937.7

  （3）一种车辆行驶控制方法及装置，发明，2017，第2作者，ZL201710079942.7

  （4）基于RFID的检测识别交通信号灯的方法及装置，发明，2017，第3作者，ZL201710065161.2

  （5）绳牵引仿生机器鱼驱动装置及绳牵引仿生机器鱼，发明，2021，第6作者，ZL202111007409.2

