  个人简历

  赵美静，博士，中国科学院自动化所副研究员，中国人工智能学会教育工作委员会委员。研究领域为博弈智能决策与规划、知识表示与推理；申请国家专利10余项，发表国内外学术期刊论文10余篇。先后主持中国科学院战略先导课题、国家自然科学基金等10余项课题研究。研究成果荣获中国指挥与控制学会科学技术奖“科技进步奖”一等奖。

  研究方向

  博弈智能决策与规划、知识表示与推理

  承担科研项目情况

  基于动态推演知识挖掘的协同策略演化方法, 中科院先导专项重点项目子课题，主持

  快速、可信的大规模连续空间序列决策过程理论与算法研究，国家自然科学青年基金，主持

  多智能体协同对抗态势评估与决策规划系统，企业委托，负责人

  兵棋推演智能体态势认知和方法研究，企业委托，负责人

  基于深度学习的高性能质量分数无损压缩方法开发，企业委托，负责人

  基于仿真推演的空地协同搜索策略优化技术研究，企业委托，负责人

