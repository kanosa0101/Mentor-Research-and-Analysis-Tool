  研究方向

  数据挖掘，可信人工智能，大模型安全，虚假信息检测

  承担科研项目情况

  知识驱动的复杂场景多模态语义理解与文本生成，国家自然科学基金重点项目，骨干

  社会大数据跨尺度系统学习关键技术与示范应用，国家自然科学基金专项项目，骨干

  面向事件预测的动态知识图谱推理方法研究，国家自然科学基金青年科学基金项目，主持

  基于图神经网络的产业链风险传导预警，重点研发计划子课题，主持

