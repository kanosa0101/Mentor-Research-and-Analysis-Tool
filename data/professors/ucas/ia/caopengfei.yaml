  个人简历

  曹鹏飞，中国科学院自动化研究所副研究员，2023年博士毕业于中国科学院自动化研究所。主要研究方向为自然语言处理、大模型可解释分析与增强。主持或参与国家自然科学基金联合基金重点支持项目、青年科学基金项目、中国科学院特别研究助理资助项目、博士后面上项目及多项头部企业合作科研项目。近年来在人工智能及自然语言处理领域国际重要学术期刊和会议发表论文60余篇，相关成果获ACL-2025
  SAC Highlights Award、ICLR-2026 Oral、ICLR-2025 Spotlight，谷歌学术引用超2000次。担任ACL、EMNLP、NAACL等会议领域主席，以及TPAMI、NeurIPS、ICML、ICLR等顶级期刊与会议审稿人。曾入选中国中文信息学会优博、获中国科学院院长奖。

  研究方向

  ：

  自然语言处理、大语言模型、知识工程

  承担科研项目情况

  ：

  1. 面向大模型的知识获取与定向内化关键技术研究，主持，国家级，2025-2027

  2. 中国科学院特别研究助理资助项目，主持，2024-2025

  3. 面向大模型的知识高效更新关键技术研究，主持，国家级，2024-2026

  4. 面向大模型的多维度认知能力评价，主持，企业合作，2023-2024

  5. 知识机理驱动的大模型泛化增强研究，主持，企业合作，2025-2026

  6. 面向社交媒体的事件建模与情感分析关键技术研究，参与，国家级，2025-2028

