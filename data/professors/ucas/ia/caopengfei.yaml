  9. Yang Zhou, Pengfei Cao, Yubo Chen, Qingbin Liu, Dianbo Sui, Xi Chen, Kang Liu,
  Jun Zhao. M2Edit: Locate and Edit Multi-Granularity Knowledge in Multimodal Large
