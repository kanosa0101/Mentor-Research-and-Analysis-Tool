  6. Pengfei Cao, Yubo Chen, Kang Liu, Jun Zhao, Shengping Liu, Weifeng Chong. HyperCore:
  Hyperbolic and Co-graph Representation for Automatic ICD Coding. ACL-2020 (CCF-A)

  7. Jiachun Li, Pengfei Cao, Zhuoran Jin, Yubo Chen, Jiexin Xu, Huaijun Li, Xiaojian
  Jiang, Kang Liu, Jun Zhao. Fixing the Broken Compass: Diagnosing and Improving Inference-Time
