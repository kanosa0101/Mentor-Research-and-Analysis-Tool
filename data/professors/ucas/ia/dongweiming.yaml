  获奖及荣誉

  基于自适应对比学习的任意图像风格迁移框架，中国电影美术学会“学术理论成果”奖，2023

  社会任职

  2021.04至今，中国电影美术学会理事、虚拟空间专业委员会委员

  2021.10至今，中国计算机学会计算艺术分会常务委员

