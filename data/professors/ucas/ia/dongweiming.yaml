  通讯地址:

  北京市海淀区中关村东路95号

  个人简历

  2016-11至今，        中国科学院自动化研究所模式识别国家重点实验室，研究员

  2010-11~2016-10，中国科学院自动化研究所模式识别国家重点实验室，副研究员

  2009-11~2010-10，中国科学院自动化研究所模式识别国家重点实验室，助理研究员

  2007-10~2009-10，中国科学院自动化研究所中欧信息、自动化与应用数学联合实验室，博士后

  2004-04~2007-06，法国国立信息与自动化研究院（INRIA）/法国亨利▪庞加莱南锡第一大学，博士

  2001-09~2004-01，清华大学计算机科学与技术系，工学硕士

  1997-09~2001-07，清华大学计算机科学与技术系，工学学士

  研究方向

  计算可视媒体、计算艺术

  承担科研项目情况

  * 科技创新2030-“新一代人工智能”重大项目，认知计算基础理论与方法研究，2020/11-2023/10

  * 快手，扩散模型的可解释性与可控性研究，2023/06-2024/07

  * 北京市自然科学基金-丰台轨道交通前沿研究联合项目，恶劣天气下列车前向障碍物检测关键技术研究，2023/01-2025/12

  * 国家自然科学基金重点项目，基于视觉认知的可视媒体合成与评价，2019/01-2023/12

  * NSFC企业创新发展联合基金重点项目，知识和数据共同驱动的小样本目标识别理论和方法，2021/01-2024/12

