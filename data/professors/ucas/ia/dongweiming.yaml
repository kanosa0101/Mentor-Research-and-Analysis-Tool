  4. Yuxin Zhang, Fan Tang, Weiming Dong, Haibin Huang, Chongyang Ma, Tong-Yee Lee,
  Changsheng Xu: A Unified Arbitrary Style Transfer Framework via Adaptive Contrastive
  Learning. ACM Transactions on Graphics 42(5): 169:1-169:16 (2023)

  5. Yuxin Zhang, Nisha Huang, Fan Tang, Haibin Huang, Chongyang Ma, Weiming Dong,
  Changsheng Xu: Inversion-Based Style Transfer with Diffusion Models. IEEE/CVF Conference
