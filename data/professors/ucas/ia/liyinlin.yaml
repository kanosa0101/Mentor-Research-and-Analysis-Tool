  个人简历

  李寅霖，中科院自动化所多模态人工智能系统全国重点实验室副研究员、硕导，研究方向为类脑视觉、机器人视觉、机器人操作学习。累计发表学术论文23篇 （SCI 12，EI
  9），其中第一作者7篇，通信/第二作者8篇，授权发明专利2项。作为项目负责人承担国家基金委青年基金项目等基金项目3项，承担多项研究院所、上市公司人工智能+探索及应用项目。相关算法、软件系统、机器人平台在无人厂房、智慧苗圃、铁路周界等场景中进行了落地探索，部分形成了产品级服务，获得中国自动化学会技术发明一等奖（自动化所排名第一，所内第二完成人）

  研究方向

  类脑视觉、机器人视觉、机器人操作学习

  承担科研项目情况

  （1）国家自然科学基金委员会，青年科学基金项目，面向机器人自主操作的人体上肢行为识别-模仿学习研究，2018-01-01 至 2020-12-31，主持

  （2）中船重工七一九所热能动力技术重点实验室开放课题, 基于多源信息融合及小样本学习的船舶舱室监控技术研究，2021-12 至 2023-12，主持

  （4）企业委托，苗木图像识别及智能标签系统，2019-12 至 2021-12，主持

  （5）企业委托，开放场景异常检测算法研发，2023-08至2023-12，主持

  代表论著

  (1) Yinlin Li, Peng Wang, Rui Li*, Mo Tao, Zhiyong Liu and Hong Qiao, A Survey of
  Multifingered Robotic Manipulation: Biological Results, Structural Evolvements and
  Learning Methods, Frontiers in Neurorobotics, 2022. (SCI, EI)

  (2) Rui Li, Yinlin Li, Xiaojie Su.  A Two-Step method for 4-pin Form-Closure Gripper
  with Grasping Force Optimization. Asian Journal of Control. Accept. 2021. (SCI,
  EI）

  (3) Yinlin Li, Lihao Jia, Yidao Ji, Rui Li, Event-triggered Guaranteed Cost Control
  of Time-varying Delayed Fuzzy Systems with Limited Communication, Measurement and
  Control, 2020. (SCI,EI)

  (4) Yinlin Li, Yang Qian, Xu Yang, Yuren Zhang, Activity and Relationship Modeling
  Driven Weakly Supervised Object Detection, International Conference on Pattern Recognition
  (ICPR), 2020. (EI)

  (5) Jiaxi Wu, Haowan Wu, Shanlin Zhong, Quqin Sun, Yinlin Li*. Learning Pre-Grasp
  Sliding Manipulation of Flat Objects in Cluttered Environments, ICRA, 2023. (EI)

  获奖及荣誉

  乔红、许礼进、朱延河、李寅霖、苏建华等，基于环境-信息融合的机器人高精度柔性作业关键技术及应用，中国自动化学会科学技术奖励，发明奖，一等奖，2018年

  专利成果

  (1) 李寅霖；杨旭；乔红。基于人-物体交互弱监督标签的物体检测方法，2021，已授权，CN111931703B

  (2) 席铉洋; 覃政科; 乔红; 李冯福; 李寅霖。 形状层级描述、平均形状和动态形状计算及形状匹配方法，2018，已授权，CN104794473B'
