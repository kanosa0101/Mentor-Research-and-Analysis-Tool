  个人简历

  田雨农，副研究员，2016年获北京科技大学工学学士学位，2022年获中国科学院大学工学博士学位，研究方向为

  特种机器人、具身智能和视觉伺服

  。研究成果发表学术论文20余篇，其中在TII、TIM、RAL等机器人领域权威期刊和IROS、ICRA、CASE等国际顶会上发表机器人方法与应用论文10篇；发表计算机应用类顶刊论文4篇；授权国家发明专利和国际PCT专利合计5项。

  研究方向

  特种机器人、具身智能、视觉伺服

  承担科研项目情况

  [1]

  国家自然科学基金委员会，青年基金项目，基于多源信息融合的现代化果园病虫害智能监测及预警方法研究，2023.01–2025.12，30万，

  项目负责人，在研。

  [2]

  国家电网科技项目，基于强化学习的智能装置仿人类脑控制与决策技术研究，2023.07-2024.12，179万，项目负责人，在研。

  [3]

  国家电网科技项目，基于具身反馈的配网带电作业优化技术研究，2024.07-2025.12，124万，项目负责人，在研。

  [4]

  国家电网科技项目，基于图像生成技术的变电设备目标检测与缺陷识别能力验证技术研究，2023.07-2024.12，30万，项目负责人，在研。

  [5]

  中远海运重工科技项目，液货船舱气体安全检测系统，2022.01-2023.12，82万，项目负责人，结题。

