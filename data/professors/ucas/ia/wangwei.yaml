  个人简历

  王伟 中国科学院自动化研究所副研究员。1997年在哈尔滨工业大学机器人研究所获博士学位，2005-2006年在美国University of Florida非线性控制与机器人实验室做高访学者。主要从事智能机器人、机器人数字化制造等方面的理论及应用研究。

  研究方向

  智能机器人

  承担科研项目情况

  主持国家自然科学基金项目、科技部科技支撑计划项目等五项。

  代表论著

  Ziyue Lin, Wenbo Xu, Wei Wang. A moving target tracking system of quadrotors

  with visual-inertial localization. 2023 IEEE International Conference on Robotics
  and Automation (ICRA), London, UK, 2023, pp. 3296-3302.

  Wenbo Xu, Ziyue Lin, Wei Wang. A localization and trajectory planning method

  for UAVs with visual-inertial odometry. 2022 IEEE/ASME International Conference
  on Advanced Intelligent Mechatronics (AIM), Sapporo, Japan, 2022, pp. 710-715.

  Zhikai Zhu, Wei Wang. A Partial Sparsification Scheme for Visual-Inertial Odometry.
  IEEE/ASME International Conference on Advanced Intelligent Mechatronics, Boston,
  MA, USA, pp.1983-1989, 2020.

  Linlin Shang, Wei Wang and Jianqiang Yi. Design and Gait Control of a Quadruped
  Robot with Low-Inertia Legs. IEEE International Conference on Automation Science
  and Engineering (CASE), Vancouver, Canada, pp.1511-1516, 2019.

  Xiaoqi Li, Wei Wang, Jianqiang Yi. Ground Substrate Classification for Adaptive
  Quadruped Locomotion. IEEE International Conference on Robotics and Automation (ICRA),
  Singapore, pp.3237-3243, 2017.

  获奖及荣誉

  2004年获王宽诚教育基金奖

  专利成果

  授权发明专利五项'
