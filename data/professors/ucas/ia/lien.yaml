bio_raw: "李恩\n/\n职　　称:\n研究员\n邮　　编:\n100190\n电子邮件:\nen.li@ia.ac.cn\n部门/实验室:\n中国科学院工业视觉智能装备技术工程实验室\n\
  通讯地址:\n北京市海淀区中关村东路95号\n个人简历\n2022-09~现在, 中国科学院工业视觉智能装备技术工程实验室, 副主任\n2016-10~现在,\
  \ 中国科学院自动化研究所, 研究员\n2010-11~2016-10,中国科学院自动化研究所, 副研究员\n2007-09~2010-10,中国科学院自动化研究所,\
  \ 助理研究员\n研究方向\n智能机器人系统、先进机器人控制、智能传感器技术\n承担科研项目情况\n（ 1 ）国家自然科学基金项目，面向受限空间作业的机器人环境感知与规划控制技术研究，主持，2023-01--2026-12\n\
  （ 2 ）国家自然科学基金项目，狭窄空间作业的蛇形机械臂优化设计与控制方法研究, 主持,  2019-01--2022-12\n（ 3 ）国家自然科学基金项目，混合结构液压柔性臂机器人的振动控制方法研究,\
  \ 主持, 2015-01--2017-12\n（ 4 ）国家重点研发计划课题，500kV 架空输电线路带电作业机器人技术研究, 主持, 2019-06--2022-05\n\
  （ 5 ）国家重点研发计划子课题，GIS竖直腔体长臂展检修机器人关键技术研究, 主持, 2019-06--2022-05\n（ 6 ）国家工信部高质量发展专项课题，高分辨光干涉气体传感器研制与应用，主持，2023-08--2026-07\n\
  （ 7 ）国家863重点项目子课题，典型功能构件设计与样机系统集成, 主持, 2007-09--2009-08\n（ 8）国家863计划项目子课题,机器人操作系统、软件仓库及模块化硬件平台开发,\
  \ 主持,  2012-01--2014-12\n（9）国家科技支撑计划子课题，全地形工程车控制器研制, 主持, 2013-01--2015-12\n（10）北京市科技创新专项课题,\
  \ 光干涉智能气体传感器研制及产业化, 主持, 2018-07--2021-6\n（11）北京市科技创新专项课题, 面向城市地下管廊巡检监测的实景三维和智能化技术研发应用，主持，2023-09--2025-09\n\
  （12）企业委托项目，晶体硅还原工序智能感知与优化决策技术,主持, 2020-03--2021-06\n（13）企业委托项目，面向电力行业的作业机器人系统研究及应用\
  \ ,主持, 2020-08--2021-05.\n（14）企业委托项目，复杂狭窄作业场景中超冗余度机器人机构设计与规划控制，主持, 2022.1-2022.12\n\
  （15）企业委托项目，小型轻量化机器人紧固件安装末端执行器研制, 主持, 2022.11-2024.5\n代表论著\n1. Mingrui Luo, En Li*,\
  \ Aoshun Zhang, Min Tan, and Zize Liang. A Bioinspired Coiled Cable-Driven Manipulator:\
  \ Mechatronic Design and Kinematics Planning With Multiconstraints, IEEE/ASME Transaction\
  \ on Mechatronics, vol. 28, no. 6, pp. 3155-3166, 2023.\n2. Dawei Xu, En Li*, Rui\
  \ Guo, Jiaxin Liu, Zize Liang. A Cable-Driven Hyper-redundant Manipulator: Obstacle-Avoidance\
  \ Path Planning and Tension Optimization. IEEE ROBOTICS & AUTOMATION Magazine, 2022,\
  \ 29(3):107-126.\n3. Minghao Chen, Yinghua Cao, Yunong Tian, En Li*, Zize Liang,\
  \ Min Tan. A Passive Compliance Obstacle Crossing Robot for Power Line Inspection\
  \ and Maintenance. IEEE Robotics and Automation Letters. vol. 8, no. 5, pp. 2772-2779,\
  \ May 2023.\n4. Teng Long, En Li*, Hu Yunqing, Lei Yang, Junfeng Fan, and Zize Liang,\
  \ Guo Rui. A vibration control method for hybrid-structured flexible manipulator\
  \ based on sliding mode control and reinforcement learning. IEEE Transactions on\
  \ Neural Networks and Learning Systems, 2021, 32(2), 841-852.\n5. Zishu Gao, En\
  \ Li*, Guodong Yang, Zize Liang, Dawei Xu. Object Reconstruction Based on Attentive\
  \ Recurrent Network from Single and Multiple Images, Neural Processing Letters,\
  \ 53(1), 653-670, 2021.\n6. Yunong Tian, En Li*, Zize Liang, Min Tan, and Xiongkui\
  \ He. Diagnosis of typical apple diseases: A deep learning method based on Multi-scale\
  \ Dense classification network, Frontiers Plant Science, 2021.10, 12: 698474.\n\
  7. Dawei Xu, En Li*, Zize Liang, Zishu Gao. Design and tension modeling of a novel\
  \ cable-driven rigid snake-like manipulator, Journal of Intelligent & Robotic Systems,\
  \ 2020, 99(2), 211-228.\n8. Lei Yang, En Li*, Teng Long, Junfeng Fan, Zize Liang.\
  \ A novel 3D path teaching system for arc welding robot based on stereo structured\
  \ light sensor, IEEE Sensors Journal, 2019, 19(2): 763-773.\n9. Yang Lei, Li En*,\
  \ Long Teng, Fan Junfeng,Tian yunong, Liang Zize. Automatic extraction and identification\
  \ of Narrow Butt Joint based on ANFIS before GMAW, International Journal of Advanced\
  \ Manufacturing Technology, 100(1), 609-622, 2019.\n10.Gao Zishu, Yang Guodong,\
  \ Li En, Zize Liang, Guo Rui. Efficient parallel branch network with multi-scale\
  \ feature fusion for real-time overhead power line segmentation. IEEE Sensors Journal,\
  \ 2021, 21(5): 12220-12227.\n获奖及荣誉\n1. 嵌入式油井压力实时采集系统与网络化监控技术， 2008年度中国机械工业科学技术二等奖。\n\
  2. 油气井井下压力实时采集装置与井口安全监控系统及应用， 2009年度北京市科学技术二等奖。\n3. 油气资源开采中的实时在线测井技术与系统及其应用，2014年度中国自动化学会技术发明奖一等奖。\n\
  4. 高纯晶体硅材料智能制造关键技术开发与应用，2018年度新疆自治区科技进步奖一等奖。\n5. 电力设备巡视及检修机器人关键技术及应用，2021年度中国电力科技创新奖特等奖。\n\
  6. 架空输电线路全程自主巡检机器人关键技术及应用，2022年度山东省科学技术奖技术发明二等奖。\n7. 特种环境复杂操作的连续体机器人系统控制关键技术及应用，\
  \ 2022年度中国发明协会发明创业奖创新奖一等奖。\n专利成果\n[1]\t李恩、章澳顺、罗明睿、杨国栋、梁自泽、谭民、景奉水、田雨农，绳索驱动蛇形机械臂控制方法、装置和设备，2023.1.11，ZL202111371378.9\n\
  [2]\t李恩、罗明睿、杨国栋、梁自泽、谭民、郭锐、李勇、刘海波，低光照弱对比环境下的深度相机视觉增强方法, 2023.1.13，ZL202011190396.2\n\
  [3]\t李恩、罗明睿、杨国栋、梁自泽、谭民、郭锐、李勇、刘海波，一种机器人多传感器融合感知与空间定位的装置及方法, 2022.3.2, ZL202011190385.4\n\
  [4]\t李恩、汪晗、杨国栋、梁自泽、谭民、张凯良、郭锐、李勇、刘海波；用于输电线路巡检机器人的动力臂和输电线路巡检机器人，2021.5.28，ZL201911057935.2.\n\
  [5]\t李恩、杨国栋、梁自泽、谭民、郭锐、李勇、刘海波、阳振峰、杨明博,多分裂输电线路作业机器人的上下线机构及方法，2021.4.2，202010137750.9\n\
  [6]\t李恩、徐大伟、梁自泽、杨国栋、谭民、景奉水；一种可蜷缩的蛇形机械臂；2020.06.16, CN201710350660.6\n[7]\t李恩、徐大伟、梁自泽、杨国栋、谭民、景奉水；具有三自由度的蛇形机械臂主体模块和蛇形机械臂，2019.11.4,ZL201710280187.9\n\
  [8]\t李恩，梁自泽，龙腾，谭民，一种光干涉气体浓度传感器系统，2019.04.02， ZL201610901835.3\n[9]\t李恩、谭民、梁自泽、丁磊、景奉水、龙腾、何峰，基于ARM处理器的四轴伺服电机运动控制卡及方法，2018.05.18,\
  \ ZL201610076855.1\n[10]\t李恩、梁自泽、龙腾、方灶军、谭民、汤盈忠、范俊峰、赵伟青，墙面抹灰机器人的专用控制器，20170801， ZL201510266681.0\n\
  社会任职\n中国科学院大学岗位教授；\n中国自动化学会平行控制专委会委员；\n中国职业安全协会应急产业服务专委会委员；\nIEEE PES电力信息通信人工智能分会常务理事。"
