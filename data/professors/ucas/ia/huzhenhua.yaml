bio_raw: "胡振华\n/\n2009.3 – 2012.8\t西安电子科技大学 博士学位\n2006.9 – 2008.12 西华大学 硕士学位\n2001.9\
  \ – 2005.7\t山东师范大学 学士学位\n职　　称:\n研究员\n邮　　编:\n100190\n电子邮件:\nzhenhua.hu@ia.ac.cn\n\
  部门/实验室:\n中国科学院分子影像重点实验室\n通讯地址:\n北京市海淀区中关村东路 95 号\n个人简历\n胡振华，中国科学院自动化研究所，研究员、博导，国家优青、北京市杰青。聚焦信息技术与生物医学的交叉融合，长期从事智能光学分子影像及相关信息技术研究。近五年以一作和通讯（含并列）发表高质量论文 40 余篇，包括在综合类 Nature 子刊 Nature Biomedical Engineering 2 篇、信息类 IEEE Trans、临床类Nature\
  \ Reviews Clinical Oncology等期刊发表了系列高水平论文。相关工作获 Nature 子刊专题评述及多位国际权威专家的“近红外二区荧光成像国际首次临床应用”评价。制订了近红外二区荧光成像团体标准，并与临床专家合作制定肝癌诊疗专家共识，推动技术标准化和临床应用规范化。获黄家驷生物医学工程奖和中华医学科技奖。主持基金委重点项目、科技部、北京市杰青等国家省部级项目。任国家一级学会中国图学学会理事及多个医学专委会常务委员、European\
  \ Journal of Nuclear Medicine and Molecular Imaging等国际期刊编委及多个国际学术期刊论文审稿人。培养的学生获北京市优秀毕业生、朱李月华奖学金等奖励。\n\
  研究方向\n智能生物医学成像模型与方法，智能生物医学成像系统，生物医学应用与临床转化\n承担科研项目情况\n国家自然科学基金青年项目 61302024\n项目名称:  基于混合谱的契伦科夫光学断层成像重建方法研究\n\
