bio_raw: '路卢

  /

  职　　称:

  副高级

  电子邮件:

  lu.lu@ia.ac.cn

  个人简历

  教育背景

  ：中国科学院自动化研究所计算机应用技术博士学位和上海交通大学电子科学与技术学士学位。

  基本信息

  ：现任中国科学院自动化研究所国家专用集成电路设计工程技术研究中心副研究员。

  研究领域

  ：集成电路设计与优化，EDA，算法IP等。

  长期从事集成电路设计方面的工作，致力于后端设计相关EDA工具的研究和开发，参加了多个重要芯片项目的研发和流片，并在嵌入式系统设计和工程方面拥有丰富经验。目前正开展区块链领域算法IP的研究。'
