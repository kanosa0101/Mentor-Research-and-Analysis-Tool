  个人简历

  个人简介：

  崔少伟，中国科学院自动化研究所多模态人工智能系统全国重点实验室，副研究员，智源青年学者，人工智能、自动化、计算机一级学会具身智能、机器人、认知系统等专委会委员。长期从事机器人视触觉传感、机器人灵巧操作方向研究，提出了GelStereo系列视触觉传感器、TacFlex具身仿真平台以及机器人视觉-触觉-语言-动作（TLA/VTLA）大模型等一系列代表性工作。作为负责人主持国自然青基、国自然联合课题、国家重点研发/国家重大专项-任务、北京市重点课题、北京市科委等项10余项。近五年，以第一/通讯作者在Nature子刊/TRO/ICRA
  等国际权威期刊和会议上发表 SCI/EI 检索论文50余篇。入选中国科学院特别研究助理人才计划、智源学者计划，获英特尔中国优秀创新奖、中国科学院院长优秀奖、BIRob
  最佳论文奖及4项IEEE国际会议最佳论文奖。任机器人领域国产英文期刊青年编委、担任国际国内会议程序委员会和作特邀报告10余次。网页：

  www.shaoweicui.com

  教育工作经历

  2022.07-至今    中国科学院自动化研究所 助理研究员、副研究员

  2017.09-2022.06 中国科学院自动化研究所 博士（导师：王硕 研究员）

  2013.09-2017.06 华南理工大学 机械与汽车工程学院 学士

  研究方向

  视触觉传感器；机器人操作大模型；灵巧手通才操作技能学习

  —To accelerate the world''s transition to human-machine symbiosis（加速世界向人机共生转变）

