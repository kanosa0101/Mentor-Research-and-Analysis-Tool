  部门/实验室:

  复杂系统认知与决策实验室-飞行器智能技术团队

  通讯地址:

  北京市海淀区中关村东路98号中国科学院自动化研究所

  个人简历

  1993.9-1997.7  北京科技大学  工业电气自动化  学士

  1997.9-2000.3  北京科技大学  模式识别与智能控制  硕士

  2000.3-2003.6  中国科学院研究生院  控制理论与控制工程  博士

  2003.7-2007.6  中国科学院自动化研究所 助理研究员

  2007.7-今  中国科学院自动化研究所  高级工程师

  研究方向

  移动机器人的导航控制与群体协同

  承担科研项目情况

  1. 基于动态开放环境的复杂任务规划；2. 多AGV导航控制与调度软件；3. 采样机器人集群系统研制；4. 气溶胶采样机器人研制；5. 大数据多模态交互协同关键技术；6.
  多AGV导航控制与调度软件；7. 激光导航AGV控制及调度系统研制与工程实施

  代表论著

  [1]Yuan Wu, Hai-Bing Zhu, Qing-Xiu Du, Shu-Ming Tang. A Survey of the Research Status
  of Pedestrian Dead Reckoning Systems Based on Inertial Sensors[J]. International
  Journal of Automation and Computing. 16(1), February 2019. pp. 65-83.

  [2]Yuan Wu, Haibing Zhu, Qingxiu Du, and Shuming Tang. A Pedestrian Dead-Reckoning
  System for Walking and Marking Time Mixed Movement Using an SHSs Scheme and a Foot-Mounted
  IMU[J]. IEEE SENSORS JOURNAL, VOL. 19, NO. 5, MARCH 1, 2019. pp. 1661-1671.

  [3]Jialin Lu, Shuming Tang, Haibing Zhu， Jinqiao Wang, Yunkuan Wang, A Review on
  Object Detection Based on Deep Convolutional Neural Networks for Autonomous Driving,
  2019 Chinese Control And Decision Conference (CCDC) . (EI)

  [4]Xin Huang, Shuming Tang, Lifu Zhang, Haibing Zhu, QIngxiu Du, Stereo Visual Odometry
  with Light and Adaptive Feature Tracking, 2019 IEEE 4th International Conference
  on Image，Vision and Computing (ICIVC).(EI)

  [5]Zhu Haibing、Yuan Kui，"A New Kind of Haptic Interface Used in Virtual Reality
  System", International Conference on Virtual Reality and its Application in Industry,  April
  9-12, 2002 Hangzhou China , pp209-213.

  [6]Zhu Haibing、Yuan Kui，"A New Kind of Force-reflecting Device and Its Control",
  2002 IEEE/RSJ International Conference on Intelligent Robots and Systems.

  社会任职

  民盟北京市科技委员会委员'
