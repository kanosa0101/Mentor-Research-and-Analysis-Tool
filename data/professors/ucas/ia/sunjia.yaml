  个人简历

  教育经历

  2012年09月—2018年06月，中国科学院自动化研究所，控制理论与控制工程，博士

  2009年09月—2012年03月，北京理工大学，光电学院，硕士

  2005年09月—2009年06月，中北大学，信息与通信学院，学士

  工作经历

  2018年07月—2020年07月，中国科学院自动化研究所，博士后

  2020年08月—2021年04月，中国科学院自动化研究所，助理研究员

  2021年04月—至今，中国科学院自动化研究所，副研究员

  研究方向

  智能机器人、机器人视觉感知、知识图谱

  承担科研项目情况

  1.国家自然科学基金青年项目，面向自主柔性作业机器人的轻量化视觉感知学习方法研究，2021.1-2023.12，课题负责人；

  2.北京市自然科学基金青年项目，样本受限条件下的视觉外观检测方法研究，2020.1-2021.12，课题负责人；

  3.中国博士后基金面上项目，基于小样本学习的精密光学器件表面瑕疵检测，2019.1-2020.6，课题负责人；

  4.国家重点研发计划，时空多尺度城市群大数据的分析推理与认知计算，2020.1-2022.12，子课题负责人；

  压机舱焊点自主柔性检测系统项目，大型企业委托，2018.10-2019.10，项目负责人

