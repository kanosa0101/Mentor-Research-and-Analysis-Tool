  个人简历

  2026.03~现在，    中国科学院自动化研究所，副研究员

  2021.07~2026.02， 中国科学院自动化研究所，助理研究员

  2016.09~2021.06，中国科学院自动化研究所，模式识别与智能系统，博士

  2012.09~2016.07， 山东大学，自动化，工学学士

  研究方向

  图机器学习，动态图机器学习，大模型推理，智能天气预报，智能医疗辅助

  承担科研项目情况

  (1)   多源降水观测数据的时空图网络模型与方法研究，项目负责人，国家自然科学基金，2023.01-2025.12

  (2)   癫痫复杂脑网络建模、预测与闭环调控研究，主要完成人，“新一代人工智能”国家科技重大专项课题，2021.12-2026.11

  (3)   支持卫生健康数据要素定义及规则推理的分层知识图谱，主要完成人，国家重点研发计划课题，2022.11-2025.10

  (4)   恶性肿瘤中医药防治智慧医疗研究，课题负责人，重点协同攻关项目，2024.02-2027.02

