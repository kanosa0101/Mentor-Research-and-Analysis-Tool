  个人简历

   2015.11至今      中科院自动化所“复杂系统管理与控制国家重点实验室”副研究员

   2015.03-2015.10   中科院自动化所“复杂系统管理与控制国家重点实验室”助理研究员

   2012.01-2015.03   中国科学技术大学“合肥微尺度物质科学国家实验室”副研究员

   2009.11-2011.12   德国柏林洪堡大学理论生物研究所博士后, 合作者：Susanne Schreiber教授

   2008.11-2009.10   德国马克斯-普朗克脑科学研究所博士后, 合作者：Kerstin Schmidt教授

   2008.09-2008.11   芬兰坦佩雷理工大学访问学者，合作者：Dr. Germán Gómez-Herrero

   2004.09-2008.09   博士研究生    德国马克斯-普朗克脑科学研究所 & 法兰克福大学物理系 （评定：very good / magna cum
  laude）， 导师：Wolf Singer教授

   2001.09-2004.07   硕士研究生    北京师范大学物理系  理论物理专业  理学硕士（免试推荐读研，2004年优秀硕士毕业生），导师：包景东教授

   1997.09-2001.07   大学本科生    北京师范大学物理系  物理学专业   理学学士

  研究方向

  智能机器人、脑机接口

  承担科研项目情况

  1. 类生命机器人智能, 参与, 中国科学院计划, 2022-06--2027-05

  2. 基于果蝇幼虫运动神经机制的仿生软体机器人控制理论, 课题负责人, 国家任务, 2023-01--2027-12

  3. 引入工作记忆机制的机器人视觉认知与运动决策融合模型研究, 负责人, 国家任务, 2021-01--2025-12

