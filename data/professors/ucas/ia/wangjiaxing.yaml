bio_raw: '王佳星

  /

  职　　称:

  副高级

  邮　　编:

  100190

  电子邮件:

  jiaxing.wang@ia.ac.cn

  部门/实验室:

  多模态人工智能系统全国重点实验室

  通讯地址:

  北京市海淀区中关村东路95号

  个人简历

  面向人民生命健康国家重大需求，长期从事康复医疗机器人（软体手康复机器人、上/下肢外骨骼康复机器人）和智能人机交互控制（脑机接口、增强现实、大模型与意图解码、功能评价）研究，开发了一系列脑机协同康复训练软硬件平台，与北京天坛医院、中国康复中心合作，开展了60余例临床试验推广，康复效果显著。相关研究成果以第一/通讯作者身份在国际知名期刊上发表SCI/EI
  学术论文14篇，授权国家发明专利10余项。入选第九届中国科协青年人才托举工程、中科院青年创新促进会、中国科学院院长优秀奖等。

  研究方向

  康复机器人、脑机接口、人机交互控制、人工智能与大模型

  承担科研项目：

  (1)

  国家自然科学基金-青年科学基金，面向脑卒中神经康复的运动想象脑机接口范式与解码算法研究，30万，项目负责人

  (2)

  科技部-国家重点研发计划，面向脑卒中及相关重症智能化康复的临床路径研究与康复系统研发，40万，子课题负责人，

  (3)

  科技部-国家重点研发计划，可恢复性弱能老人高相容性照护康复机器人技术与系统研发，80万，子课题负责人

  (4)

  中国科学院-青年创新促进会会员

  资助项目（人才类资助）

  ，80万，项目负责人

  (5)

  中国科学技术协会-青年人才托举工程资助项目（人才类资助），30万，项目负责人。

