  专利成果

  (1)

  发明专利：零校准迁移学习分类模型的训练方法、设备和存储介质，授权专利号：ZL202310558791.9.（第1作者）

  (2) 发明专利：基于自适应脑电通道选择的脑机接口解码加速方法及系统，授权专利号：ZL202111237839.3.（第1作者）

  获奖及荣誉

