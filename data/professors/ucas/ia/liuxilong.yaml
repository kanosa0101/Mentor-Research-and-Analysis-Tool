bio_raw: "刘希龙\n/\n职　　称:\n副研究员\n邮　　编:\n100190\n电子邮件:\nxilong.liu@ia.ac.cn\n部门/实验室:\n\
  中国科学院工业视觉智能装备技术工程实验室\n通讯地址:\n北京市，海淀区，中关村东路95号，自动化大厦708\n个人简历\n刘希龙，男，副研究员，目前就职于中国科学院自动化研究所，工业视觉智能装备技术工程实验室。主要研究方向是机器人视觉，工业3D成像技术，视觉测量和工业移动机器人。从事工作包括理论研究、工程研究与教学三个部分。其中理论研究的主要方向是基于视觉的机器人环境理解，通过对生物视皮层的模仿构建具有可解释性的视觉模型。另一方面，从行为学角度对人类导航、物体操作等技能进行建模，努力建立复杂视觉信号输入和机器人决策输出间的非规则式智能映射理论。发表SCI检索论文多篇，其中在IEEE\
  \ transaction 系列期刊上论文12篇。工程研究工作面向智能制造领域，针对柔性制造、高精度测量、检测、三维重建以及高速目标跟踪等任务设计视觉系统，针对目标分析、缺陷评估等复杂问题设计智能算法。作为第一发明人获得发明专利12余项，国际专利一项。代表性成果涉及工业3D成像技术。教学方面包括作为硕导培养硕士生，协助培养博士生以及开设课程。目前累积培养硕士生5名，博士生3名。在国科大开设硕士课程，其中基础课《机器人学》获得2018,\
  \ 2019, 2020年度人工智能学院优秀课程，2020年度国科大校级优秀课程。学生一作，本人通讯的一区论文10篇。\n研究方向\n视觉测量、机器人视觉感知、机器人控制\n\
  承担科研项目情况\n基于主动视觉系统的机器人认知智能研究，国家自然科学基金面上项目\n基于低空无人机视觉的智能巡检技术研究，国家自然科学基金青年面上项目\n四足机器人环境感知与自主跟随，国家高技术研究发展计划(863计划)\
  \ 课题子项\n操作型服务机器人动态非结构化环境描述与导航控制，北京市自然科学基金重点项目\n服务机器人广域环境感知和场景认知理论及应用，国家自然科学基金重点项目\n\
  小型轻量级六轴机械臂，北京海风智能科技有限责任公司\n服务机器人视觉导航算法开发，北京海风智能科技有限责任公司\n样品加热及振动检测平台，沈阳腾鳌真空技术有限公司\n\
  无人机相对定位设计验证平台，成飞611所\n基于智能感知的机器人识别、修复及磨抛全过程策略生成与优化，国家重点研发计划子课题\n代表论著\nLiu X, Cao\
