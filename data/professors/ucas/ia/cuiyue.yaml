bio_raw: '崔玥

  /

  职　　称:

  副研究员

  邮　　编:

  100190

  电子邮件:

  yue.cui@nlpr.ia.ac.cn

  部门/实验室:

  脑图谱与类脑智能实验室

  通讯地址:

  北京市海淀区中关村东路95号

  个人简历

  2016.10-现在  中国科学院自动化研究所，副研究员2012.5-2016.10 中国科学院自动化研究所，助理研究员2011.1-2012.1 澳大利亚新南威尔士大学医学系，研究助理

  研究方向

  脑疾病辅助诊断与预测，医学图像处理与分析，脑机接口手术导航

  承担科研项目情况

  （1）国家自然科学基金面上项目，阿尔茨海默病的脑血管网络研究，2024/01-2027/12，49万元，主持

  （2）国家自然科学基金面上项目，丘脑和默认网络的遗传组织模式及其在意识障碍疾病中的应用，2018/01-2021/12，60 万元，主持

  （3）科技创新2030-“脑科学与类脑研究”重大项目，微创脑机接口植入装置与系统，2021/12-2026/11，1384 万元，课题骨干

  代表论著

  1. Yue Cui, Haibin Huang, Jialu Liu, Mingyang Zhao, Chengyi Li, et al. FFCM-MRF:
  An accurate and generalizable cerebrovascular segmentation pipeline for humans and
  rhesus monkeys based on TOF-MRA, Computers in Biology and Medicine, 170: 107996,
  2024. （影响因子7.7，JCR Q1）

  2. Yue Cui, Chengyi Li, Yuheng Lu, Liang Ma, Long Cao, Shan Yu and Tianzi Jiang.
  Multimodal connectivity-based individualized parcellation and analysis for humans
  and rhesus monkeys, IEEE Transactions on Medical Imaging, in revision.（影响因子10.6，JCR
  Q1）

  3. Yue Cui, Haibin Huang, Jinquan Gao, Tianzi Jiang, Chen Zhang and Shan Yu. Mapping
  blood traits to the structural organization of the brain in rhesus monkeys, Cerebral
  Cortex, 33(2):247-257, 2023.（影响因子3.7）

  4. Yue Cui, Chao Li, Bing Liu, Jing Sui, Ming Song, et al. Consistent brain structural
  abnormalities and multisite individualized classification of schizophrenia using
  deep neural networks, British Journal of Psychiatry, 221(6):732-739, 2022.（影响因子10.5，JCR
  Q1）

  5. Yue Cui, Jiahao Dong, Yongfeng Yang, Hongyan Yu, Wenqiang Li, et al. White matter
  microstructural differences across major depressive disorder, bipolar disorder and
  schizophrenia: A tract-based spatial statistics study, Journal of Affective Disorders,
  260:281-286, 2020.（影响因子6.6，JCR Q1）

  6. Yue Cui, Bing Liu, Ming Song, Darren M. Lipnicki, Jian Li, Sangma Xie, et al.
  Auditory verbal hallucinations are related to cortical thinning in the left middle
  temporal gyrus of patients with schizophrenia, Psychological Medicine, 48(1):115-122,
  2018.（影响因子6.9，JCR Q1，引用69）

  7. Yue Cui, Ming Song, Darren M. Lipnicki, Yi Yang, Chuyang Ye, Lingzhong Fan, Jing
  Sui, Tianzi Jiang and Jianghong He. Subdivisions of the posteromedial cortex in
  disorders of consciousness, NeuroImage:Clinical, 20:260-266, 2018.（影响因子4.2）

  8. Yue Cui, Bing Liu, Yuan Zhou, Lingzhong Fan, Jin Li, Yun Zhang, et al. Genetic
  effects on fine-grained human cortical regionalization, Cerebral Cortex, 26(9):3732-3743,
  2016.（影响因子3.7）

  9. Yue Cui, Wei Wen, Darren M. Lipnicki, Mirza Faisal Beg, Jesse S. Jin, Suhuai
  Luo, Wanlin Zhu, Nicole A. Kochan, Simone Reppermund, Lin Zhuang, Pradeep Reddy
  Raamana, Tao Liu, Julian N. Trollor, Lei Wang, Henry Brodaty and Perminder S. Sachdev.
  Automated Detection of Amnestic Mild Cognitive Impairment in Community-Dwelling
  Elderly Adults: A Combined Spatial Atrophy and White Matter Alteration Approach,
  NeuroImage, 59(2): 1209-1217, 2012.（影响因子5.7，JCR Q1，引用78）

  10. Yue Cui, Perminder S. Sachdev, Darren M. Lipnicki, Jesse S. Jin, Suhuai Luo,
  Wanlin Zhu, Nicole A. Kochan, Simone Reppermund, Tao Liu, Julian N. Trollor, Henry
  Brodaty and Wei Wen, Predicting the Development of Mild Cognitive Impairment: A
  New Use of Pattern Recognition, NeuroImage, 60(2): 894-901, 2012. （影响因子5.7，JCR Q1）

  11. Yue Cui, Bing Liu, Suhuai Luo, Xiantong Zhen, Ming Fan, Tao Liu, et al. Identification
  of Conversion from Mild Cognitive Impairment to Alzheimer''s Disease Using Multivariate
  Predictors, PLoS One, 6(7): e21896, 2011.（影响因子3.7，引用288）

  专利成果

  1. 脑血管图像分割方法、装置、电子设备及存储介质，ZL202211689218.3，第一发明人。 2. 一种基于半监督学习的三维脑血管分割方法和装置，ZL202310560177.6，第一发明人。

  3. 基于自监督学习的脑血管分割方法及相关设备，ZL202310612754.1，第一发明人。

  4. 颅脑靶点定位方法、装置及存储介质，ZL202310850978.6，第一发明人。 5. 三维相机的自适应距离控制方法、装置及存储介质，ZL202310885425.4，第一发明人。

  6. 个体化脑功能区定位方法、装置、设备和存储介质，ZL202210627258.9，第一发明人。'
