  个人简历

  廖名学，高级工程师，中国科学院研究生院博士毕业，研究生导师，现工作于中国科学院自动化研究所复杂系统认知与决策实验室，主要研究领域为人工智能与分布式并行计算。作为负责人或核心骨干承担、参与国家重点项目二十余项，合作出版专著2本，授权发明专利14项，发表SCI/EI等该水平学术论文30余篇。

  研究方向

  人工智能与分布式并行计算

  代表论著

  [1]地形可视化分析与应用(著).国防工业出版社,2015.

  [2]并行性分析的数学原理(著).中国科学技术大学出版社,2014

  专利成果

  [1]基于超短波电台的节点带权子网最优频率选择方法

  [2]山区植被条件下电波传播损耗模型拟合方法

  [3]基于超短波电台的子网最优频率选择方法

  [4]基于超短波电台的无线通信台站站点规划部署方法

  [5]MANET 信息分发订购平台中短猝报文的传送方法

  [6]一种山区条件下的无线通信选频方法.

  [7]一种退化条件下的网络访问行为特征群体动态挖掘方法

  [8]VHF通信电台信道测量集优化选择方法及系统

  [9]VHF通信电台频谱池容量优化决策方法

  [10]一种卷积神经网络手写体识别排序稳定性的效果评估系统及方法

  [11]遵循通用信息交换协议规范的智能解码方法及解码器

  [12]一种遵循通用信息交换协议规范的智能编码器

  [13]一种航线冲突检测方法及装置

  [14]基于万有引用定律的社交网络社区集群挖掘方法及系统'
