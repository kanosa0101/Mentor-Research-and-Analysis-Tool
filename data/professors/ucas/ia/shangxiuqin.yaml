  通讯地址:

  北京市海淀区中关村东路95号自动化大厦

  个人简历

  (1) 2020-09 至 今, 中国科学院自动化研究所, 工业视觉智能装备技术工程实验室, 副研究员

  (2) 2019-10 至 2020-08, 中国科学院自动化研究所, 复杂系统管理与控制国家重点实验室, 副研究员

  (3) 2011-04 至 2019-10, 中国科学院自动化研究所, 复杂系统管理与控制国家重点实验室, 助理研究员

  研究方向

  工业视觉检测、自适应视点规划、应力与形变预测

  承担科研项目情况

  1.国家重点研发计划工业软件专项“基于视觉感知的复杂外形产品表面缺陷检测理论方法研究与应用”的课题“具有注意力机制的仿人多维融合成像感知与控制方法”子任务（2022YFB3303800），180万，2022年-2025年，子任务负责人。

  2.国家自然基金联合基金重点项目：“水凝胶复合材料增材制造方法及基础技术研究”（U1909218），50万，2020年-2023年，子课题负责人。

  3.横向项目：“仿人质检机器人的自主扫描路径规划技术研发”（E2D21710），150万，2022年-2024年，项目负责人。

  代表论著

  1.Shaohu Wang, Fangbo Qin, Yuchuang Tong, Xiuqin Shang, and Zhengtao Zhang. Probabilistic
  Boundary-Guided Point Cloud Primitive Segmentation Network. IEEE Transactions on
  Instrumentation and Measurement, 2023(72): 2529413-2529413. （SCI）

  2.Shaohu Wang,Yuchuang Tong, Xiuqin Shang, Zhengtao Zhang. Hierarchical Viewpoint
  Planning for Complex Surfaces in Industrial Product Inspection. IEEE-ASME Transactions
  on Mechatronics, 2023:1-11(online).（SCI）.

  3.Xiuqin Shang, Zhen Shen, Gang Xiong, Fei-Yue Wang, Sheng Liu*, Timo R. Nyberg,
  Huaiyu Wu, and Chao Guo. Moving from mass customization to social manufacturing:
  A Footwear Industry Case Study. International Journal of Computer Integrated Manufacturing.
  2019, 32(2):194-205 (SCI, Q2).

  4.Xiuqin Shang, Fei-Yue Wang, Gang Xiong*, Timo R. Nyberg, Yong Yuan, Sheng Liu,
  Chao Guo, Sen Bao. Social manufacturing for high-end apparel customization. IEEE/CAA
  Journal of Automatica Sinica. 2018, 5(2):489-500(SCI).

  5.Xiuqin Shang, Dayong Shen, Timo R. Nyberg, Fei-Yue Wang. A Heuristic algorithm
  for the fabric spreading and cutting problem in apparel factories. IEEE/CAA Journal
  of Automatica Sinica. 2019, 6(4):961-968. (SCI).

  6.Shen Zhen, Xiuqin Shang, Meihua Zhao, Xisong Dong, Gang Xiong, Fei-Yue Wang. A
  learning based method for error compensation in 3D printing. IEEE Transactions on
  Cybernetics. 2019, 49(11): 4042-4050. (SCI).

  7.Sheng Liu*, Xiuqin Shang, Changjian Cheng, Hongxia Zhao, Dayong Shen, Fei-Yue
  Wang. Heuristic algorithm for the container loading problem with multiple constraints.
  Computers & Industrial Engineering. 108(2017):149-164 (SCI).

  获奖及荣誉

  2019年度吴文俊人工智能科技进步二等奖：面向智能制造的3D个性化人体扫描测量与智能处理, 中国人工智能学会, 科技进步,省部二等奖, 2019(吴怀宇; 王飞跃;
  熊刚; 沈震; 杨卓; 贾金原; 王颖; 商秀芹; 董西松; 王泳)

  专利成果

  1. 发明专利：表面缺陷检测系统及方法, 专利号：202110412237.0,中国科学院自动化研究所，周倩玉，商秀芹，公开。申请日期：2021年4月16日，已授权，授权日期2022-6-27.3.

  2.发明专利：产品缺陷检测方法、电子设备、存储介质及程序产品，专利号：202111602331.9，中国科学院自动化研究所，吕承侃，商秀芹，公开。公开日期2022-5-10.

  4. 发明专利：工业产品图像的检测方法、装置、电子设备及存储介质。专利号：202111437815.2，中国科学院自动化研究所，刘浩天，吕承侃，商秀芹，公开。公开日期2022-4-22.
  申请日：2021-11-29

  5. 发明专利：视点路径规划方法、装置、电子设备及存储介质；中国科学院自动化研究所，王少虎，佟玉闯，商秀芹, 钟成，受理，申请号：2023102651576，
  2023年3月17日

  6.发明专利：基于点云的仿人三维扫描运动规划和控制方法；中国科学院自动化研究所，滨州魏桥国科高等技术研究院，刘浩天、佟玉闯、商秀芹，钟成，受理，申请号：202310519734.X，
  2023年5月10日'
