  个人简历

  高伟，中国科学院自动化研究所研究员，硕士生导师。主要研究方向：人工智能与计算机视觉、大数据与视觉定位、机器人导航定位等。高水平期刊上发表论文三十余篇，申请发明专利十余项。多次承担参与国家科研项目，包括国家重点研发计划、国家科技计划863、国家科技支撑计划、国家自然基金重点项目、国家自然基金面上项目等。

  研究方向

  人工智能与计算机视觉、大数据与视觉定位、机器人导航定位等

  承担科研项目情况

  1. Weakly supervised learning and graph neural networks for indoor visual localization
  of large buildings,National Natural Science Foundation of China,2022-2025.

  2. Intelligent generation of CAD models based on sketches,National Key R&D Program
  of China,2022-2025.

  3. 3D reconstruction of complex indoor scene combining geometry and semantics,National
  Natural Science Foundation of China,2019-2022.

  4. Image acquisition and 3D reconstruction for Chinese ancient architecture based
  on micro rotary unmanned aerial vehicle,National Natural Science Foundation of China,2015-2018.

  5. Inddor feature matching and pose estimation,National Key R&D Program of China,2016-2020.

  6. POI generation technology based on images,National High Technology R&D Program
  of China,2015-2017.

  7. Panoramic map real-time generation and rapid updating,National High Technology
  R&D Program of China,2013-2015.

  8. 3D modeling of Chinese ancient architectures by fusing structures and images,National
  Natural Science Foundation of China,2013-2015.

