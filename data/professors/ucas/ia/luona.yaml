bio_raw: "罗娜\n/\n2015.09-2020.01   中科院自动化研究所 模式识别与智能系统    博士\n2017.09-2018.09   美国新墨西哥大学\
  \    电子与电气工程        访问学者\n2012.09-2015.03   北京航空航天大学    光学工程                硕士\n\
  2008.09-2012.06   湖南科技大学         测控技术与仪器        学士\n职　　称:\n副研究员\n邮　　编:\n100190\n\
  电子邮件:\nluona2015@ia.ac.cn\n部门/实验室:\n脑图谱与类脑智能实验室\n通讯地址:\n北京市海淀区中关村东路95号，100190\n\
  个人简历\n2022.04-至今      中国科学院自动化研究所    副研究员\n2020.05-2022.03   中国科学院自动化研究所    助理研究员/三元博后\n\
  研究方向\n多模态融合方法；神经影像学；多组学；精神疾病；生物标记\n承担科研项目情况\n（1）中国科学院青年创新促进会项目, 2023144, 脑影像-多组学融合的关键技术研究,\
  \ 2023-01 至 2026-12, 80万元, 主持\n（2）国家自然科学基金青年科学基金项目, 82001450, 基于多模态协同分析的注意缺陷多动障碍的亚型分类和预后预测,\
  \ 2021-01-01 至 2023-12-31, 24万元，主持\n（3）博士后创新人才支持计划项目, BX20200364, 基于机器学习的亚型诊断研究,\
  \ 2020-05 至 2022-04, 63万元, 主持\n（4）中国科学院特别研究助理资助项目, E2S9220101, 屏状核参与抑制控制功能的神经电生理研究,\
  \ 2021-01 至 2022-12, 20万元, 主持\n（5）国家重点研发计划, 2022YFC3601200, 老年意识/认知障碍评估预警与多物理因子协同刺激干预关键技术及系统研发,\
  \ 2022-12 至 2025-12, 3600万元, 子任务负责人\n（6）国家重点研发计划科技创新2030项目, 2021ZD0200200, 脑图谱大数据分析与建模,\
  \ 2021-12 至 2026-11, 4000万元, 参与\n代表论著\n1.\tNa Luo, Jiaqi Zhang, and Tianzi Jiang.\
