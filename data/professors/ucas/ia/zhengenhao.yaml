  个人简历

  郑恩昊，研究员，研究方向为穿戴式人机接口、机器人智能和机器人运动控制。近年在相关领域发表论文30余篇，包括IEEE/ASME T-MECH、IEEE TNSRE、IEEE
  TBME、IEEE RA-L、IEEE ICRA、IEEE IROS等机器人领域顶级期刊和旗舰会议，获得多项国家发明专利和美国发明专利授权，研究成果曾获“神经义肢”创新技术竞赛单项奖、IEEE
  CBS最佳论文等。作为项目负责人/独立课题负责人承担了包括国家自然科学基金重大研究计划重点支持项目、科技部重点研发计划重点专项项目、国防科技创新特区重点项目、北京市自然科学基金-海淀联合基金前沿项目和国家重点实验室仪器设备研发项目等在内的多项国家和地方重点科研任务。担任IEEE
  TRO、IEEE/ASME T-MECH、IEEE TNSRE、IEEE TBME、IEEE RA-L等期刊审稿人。入选中科院“青促会”和中科院特聘研究骨干人才计划项目。

  研究方向

  生-机-电系统与融合，穿戴式机器人，机器人结构智能设计

  承担科研项目情况

  （1）国家自然科学基金委员会，面上项目，62073318，基于肌肉形态学信息的穿戴式人机接口基础理论研究，2021-01-01 至 2024-12-31，在研，主持

  （2）中华人民共和国农业部， GG专项项目/课题，NK2023020501，农业传感器及芯片共性智能关键技术，2023-12至今，在研，主持

  （3）深圳市腾讯计算机系统有限公司,腾讯Robotics X实验室,中国电子学会-腾讯Robotics X犀牛鸟专项

  研究计划,No.2023-09,穿戴式外肢体的形态自生成研究,2024-03 至 今,在研,主持

  （4）中国科学院，青促会项目，2023-01至今，在研，主持

