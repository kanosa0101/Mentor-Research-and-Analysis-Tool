  个人简历

  (1) 2021-03 至今, 中国科学院自动化研究所, 多模态人工智能系统全国重点实验室, 副研究员

  (2) 2019-07 至 2021-03, 中国科学院自动化研究所, 模式识别国家重点实验室, 助理研究员

  (3) 2017-08 至 2019-07, 中国科学院自动化研究所, 模式识别国家重点实验室, 博士后

  研究方向

  特定目标（伪装目标与低像素目标）的检测识别，鲁棒特征提取方法，脉冲神经网络

  承担科研项目情况

  1）脉冲神经网络在无人系统自主智能感知与控制中的应用，新一代人工智能国家科技重大专项独立课题，课题负责人，270万

  2）面向网络短视频的暴力内容识别与语义描述，国家自然科学青年基金项目，负责人，28.9万

  3）面向深度学习的直升机航巡数据的结构化分析和处理技术服务,国网通用航空有限公司,50.40万

