  通讯地址:

  北京市海淀区中关村东路95号智能化大厦1505房间

  个人简历

  副研究员，2009年获中国科学院大学（原中国科学院研究生院）模式识别与智能系统专业工学博士学位，2009年至2010年于新加坡南洋理工大学计算机工程系从事博士后研究工作，2010年加入中国科学院自动化研究所模式识别国家重点实验室，任助理研究员，2013年1月任副研究员至今，2019年美国加州大学洛杉矶分校公派访问学者。其主要研究方向为智能视觉监控、行人多特征识别等，作为课题负责人承担和完成国家自然科学基金、国家863计划课题3项，并作为执行负责人/课题骨干参加国家自然科学基金重点项目、科技部国家重点研发计划、北京科委重大专项课题多项。迄今已在国际/国内期刊、国际会议上发表/录用学术论文70余篇，以第一作者身份在顶级期刊IEEE
  T-PAMI, 顶级会议CVPR, ECCV发表论文多篇，谷歌学术引用5000余次，担任包括IJCV, IEEE TPAMI, IEEE T-IP, CVPR,
  WACV等多个知名国际期刊/会议审稿人。

  研究方向

  计算机视觉、模式识别

  承担科研项目情况

  项目负责人，国家自然科学基金（面上），面向开放环境的多模态交互式行人检索，50万，2024/01 – 2027/12课题骨干，科技创新2030新一代人工智能重大项目，面向人机协同任务的情境认知与效能优化，1957.03万，2023/03
  - 2026/02

  代表论著

  [1] D. Li, Z. Zhang, C. Shan, L. Wang, “Incremental Pedestrian Attribute Recognition
  via Dual Uncertainty-Aware Pseudo-Labeling,” IEEE Transactions on Information Forensics
  and Security (TIFS), 2023. [2] Y. Song, Z. Zhang, C. Shan, L. Wang, “Constructing
  Stronger and Faster Baselines for Skeleton-based Action Recognition,” IEEE Transactions
  on Pattern Analysis and Machine Intelligence (TPAMI), VOL. 45, NO. 2, 2023. [3]
  Y-F. Zhang, X. Wang, K. Jin, K. Yuan, Z. Zhang, L. Wang, R. Jin, and T. Tan, “AdaNPC:
  Exploring Non-Parametric Classifier for Test-Time Adaptation,” International Conference
  on Machine Learning (ICML), 2023. [4] Y-F. Zhang, Z. Zhang, D. Li, Z. Jia, L. Wang
  and T. Tan, “Learning Domain Invariant Representations for Generalizable Person
  Re-Identifification,” IEEE Transactions on Image Processing (TIP), vol. 23, pp.509
  - 523, 2022. [5] D. Li, Z. Zhang, K. Yu, K. Huang and T. Tan, “ISEE: An Intelligent
  Scene Exploration and Evaluation Platform for Large-Scale Visual Surveillance,”
  IEEE Transactions on Parallel and Distributed Systems (TPDS), 2019.

