  4.谭铁牛，王亮，张彰，单彩峰，贾真，基于生成式对抗网络的无偏映射零样本分类方法和装置，申请号：201930093484.1

  5.谭铁牛，张彰，王亮，胡学财，王海滨，“一种基于双向融合网络的显著性物体检测方法及装置”，公开号：109816100B,

