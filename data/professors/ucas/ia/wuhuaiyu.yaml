  个人简历

  研究领域

  计算机视觉，计算机三维图形学，视频图像处理，

  3D

  智能数字化打印

  个人主页

  http://www.sigvc.org/why

  简历

  吴怀宇，中国

  3D

  科技创新产业联盟副理事长。任职于模式识别国家重点实验室

  (NLPR)

  、中国

  -

  欧洲信息

  ,

  自动化与应用数学联合实验室

  (LIAMA)

  。

  分别于

  2000

  年

  7

  月和

  2003

  年

  3

  月在北京航空航天大学获“航空宇航推进理论与工程”专业学士学位和“气动声学与流体机械”专业硕士学位，

  2008

  年

  7

  月在中国科学院获“模式识别与智能系统”专业博士学位。

  2008

  年

  7

  月至

  2011

  年

  8

  月在北京大学信息学院做博士后、讲师，并获“北京大学优秀博士后”称号。

  2011

  年

  8

  月至今，在中国科学院自动化所模式识别国家重点实验室任助理研究员、副研究员。目前担任多个刊物的审稿人和程序委员会成员等学术任职，担任过

  ICCV/ CVPR/ ACCV

  审稿人、程序主席秘书、以及北京市科学技术委员会项目评审专家、国家自然科学基金评审专家、国家科技计划高新领域评审专家。

  主要研究领域包括

  3D

  智能数字化打印、计算机三维视觉、视觉形状感知分析与处理、视频图像处理、计算机交互图形学等。主持和参与国家自然科学基金（

  2

  项，其中因取得突出研究进展获首批国家青年科学基金

  -

  面上项目连续资助项目）、国家高技术研究计划

  863

  项目（

  4

  项）、中

  国

  博士后科学基金（一等）、北京市自然科学基金、南京市科技领军人才计划等多项国家重大科研课题。在计算机视觉

  /

  计算机图形学领域的

  IEEE Transactions on Visualization and Computer Graphics

  、

  IEEE Transactions on IP

  、

  IEEE Transactions on CSVT

  、

  IEEE Transactions on ITS

  、

  ICCV

  、

  CVPR

  等国际顶级期刊

  /

  会议上发表学术论文

  30

  余篇，相关技术申请国际

  /

  国家发明专利

  6

  项。著有《

  3D

  打印：三维智能数字化创造》（

  3D Printing: Three-Dimensional Creation via Intelligent Digitization

  ）一书。研究成果应用到国产

  3D

  影视动漫制作当中，如国产三维动画电影《麋鹿王》中的三维形状渐变，该动画片获得第

  13

  届中国电影华表奖优秀动画片奖、第

  27

  届中国电影金鸡奖最佳美术片提名奖。

  作为我国

  3D

  智能数字化打印领域的前沿领军人物，受《中国科学报》、《光明日报》、《中国自动化学会通讯》邀请撰写长篇技术评论并连载在

  2013

  年的最新版面上，标题分别为：《

  3D

  数字化与

  3D

  打印：用“虚拟”再造“现实”》、《

  3D

  数字化与

  3D

  打印：转向“中国智造”的产业机遇》、《智能数字化与

  3D

  打印：“中国智造”推动“全球第三次工业革命”》、《

  3D

  打印：智能数字化》。先后主持和参与高精度三维数码照相与智能立体打印系统、真实感三维人脸建模和编辑关键技术、基于随机回归森林与多源数据融合的高精度三维动态形状获取、流形调和分析的三维形状匹配与检索、立体视觉方法的三维运动捕捉系统研究及其应用、面向复杂非规则多运动对象的大规模全景动态光场采集与再现系统、虚实融合协同工作的集成环境和关键技术的科研工作，相关成果被

  CCTV

  新闻联播、中国科技网、

  CETV

  中国教育电视台等报道。

  学术任职

  目前担任多个国际刊物的评审专家和国际程序委员会成员等学术任职，是美国电气与电子工程师学会（

  IEEE

  ）、美国计算机协会（

  ACM

  ）、

  IEEE Computer Society

  会员，并担任过

  ICCV/ CVPR/ACCV

  国际程序委员会委员、程序主席秘书，以及北京市科学技术委员会项目评审专家、国家自然科学基金评审专家、国家科技计划高新领域评审专家。

