bio_raw: '张吉祥

  /

  职　　称:

  高级工程师

  邮　　编:

  100190

  电子邮件:

  jixiang.zhang@ia.ac.cn

  部门/实验室:

  中国科学院工业视觉智能装备技术工程实验室

  通讯地址:

  北京市海淀区中关村东路95号

  个人简历

  2005年毕业于北京交通大学；

  2010年毕业于中国科学院自动化研究所；

  现为中国科学院自动化研究所高级工程师。

  研究方向

  主要研究方向是模式识别与图像处理。

  近年来，聚焦于工业视觉缺陷检测领域，尤其是宽幅卷材和片材的视觉检测关键技术研究与智能检测装备的研制。

  承担科研项目情况

  [1] 基于机器视觉的宽幅玻璃缺陷检测技术研究；

  [2] 动车组整车及关键部件安全技术研究—复兴号动车组TEDS智能报警技术研究；

  [3] 基于视觉的红枣自动分选技术研究；

  [4] 室内移动机器人导航定位技术研究；

  [5] 物流自动化设备管理软件系统；

  [6] 红外图像目标识别技术。

  专利成果

  [1] 板材包边缺陷检测方法、系统、装置

  [2] 板材包边接缝定位方法、系统、装置；

  [3] 液压表自动产品检测装置、检测方法及读取方法；

  [4] 室内机器人视觉定位系统；'
