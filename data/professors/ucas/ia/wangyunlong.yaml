bio_raw: "王云龙\n/\n中国科学技术大学\n2014.08-2019.06    工学博士   研究生    导师： 谭铁牛 院士\n专业方向：模式识别与智能系统\n\
  毕业论文：光场图像增强与识别方法研究\n中国科学技术大学\n2010.08-2014.07    工学学士   本科生    导师： 关胜晓 副教授\n专业方向：自动化\n\
  毕业论文：基于图像的自动计数方法\n职　　称:\n副高级\n邮　　编:\n100190\n电子邮件:\nyunlong.wang@ia.ac.cn\n部门/实验室:\n\
  多模态人工智能系统全国重点实验室\n通讯地址:\n北京市海淀区中关村东路95号\n个人简历\n王云龙，中国科学院自动化研究所多模态人工智能系统实验室副研究员，硕士生导师。2014年获得中国科学技术大学自动化专业学士学位，2019年获得中国科学技术大学模式识别与智能系统方向博士学位，2024年获国家留学基金委（CSC）资助在新加坡南洋理工大学进行公派访学。主要从事计算成像、生物特征识别与计算机视觉等方面的研究，已在IEEE\
  \ T-PAMI、IJCV、IEEE TIP、IEEE TIFS、IEEE TCI、IEEE T-CSVT、IEEE TMM、自动化学报、计算机科学、中国图象图形学报和ICML、CVPR、ICCV、ECCV、AAAI、ACM\
  \ MM、IROS、IJCB等国际国内主流学术期刊和会议发表70多篇论文，包括CCF-A类23篇，其中第一作者和通讯作者25篇，出版著作1本，获得IJCB 2023最佳学生论文奖、IJCB\
  \ 2020最佳论文奖和中国知网高影响力论文（2011-2022），2022年《中国图象图形学报》优秀论文，申请29项国内发明专利，其中已授权22项，已公开7项，申请PCT国际专利4项，已公开4项，授权美国发明专利2项，获得2项软件著作权，参与制修订10项国家标准，其中已实施7项，1项公安行业标准；主持国家自然科学基金青年基金1项、国家重点研发计划项目子课题2项、青年科学家项目任务1项、天津市重点研发计划项目1项，与华为、国家能源集团等企业横向合作课题5项，同时作为项目骨干参与包括国家重大科研仪器研制项目1项、中国科学院科研仪器设备研制项目1项和多项面上项目。现为IEEE\
  \ Senior Member、《计算机科学》 编委会执行委员、AAAI、IJCB、CCBR等国际国内学术会议程序委员会委员，TPAMI、IJCV、IEEE TIP、IEEE\
  \ TNNLS、IEEE TIFS、自动化学报和CVPR、ICML、ICCV等期刊和会议的审稿人，中国图象图形学会视觉大数据专业委员会（CSIG-BVD）委员、中国人工智能学会模式识别专委会（CCAI-PR）委员、北京图象图形学会（BSIG）青工委委员，入选北京市科协青年人才托举工程、北京科协“千人进千企”产业特派员、曾获中国图象图形学学会科技进步奖二等奖，中国产学研合作创新与促进奖——产学研合作创新成果奖二等奖，CAAI-昇思MindSpore学术奖励基金优秀项目、Wiley中国高贡献作者奖。\n\
  研究方向\n计算成像、生物特征识别、计算机视觉、机器学习\n承担科研项目情况\n[1]面向石化运维场景的工业元宇宙眼动交互关键技术研发（24YFYSHZ00290），天津市重点研发计划院市合作项目，2024-10至2026-09，在研，项目负责人\n\
  [2]人工智能样本库模型库建设服务采购项目（XNYY-ZC-2024-190），国家能源集团技术服务项目，2024-12至2025-12，在研，项目负责人\n\
  [3] 互联网金融个人生物信息可信识别与隐私保护技术研究（2022YFC3310400）, 国家重点研发计划青年科学家项目，2022-10至2025-9，在研，任务负责人\n\
  [4] 基于计算光场混合成像的虹膜活体检测与识别（62006225），国家自然科学基金委青年基金项目，2021-01至2023-12，已结题，主持\n[5] 数据隐私和模型保护下的生物特征多方联合学习研究（CAAIXSJLJJ-2021-053A），中国人工智能学会-华为MindSpore学术奖励基金项目，2021-11至2022-10，已结题（优秀项目18/91），主持\n\
  [6] 虹膜及步态应用研究（2017YFC0821602），国家重点研发计划项目子课题，2018-02至2021-05，已结题，主持\n[7] 远距离虹膜识别模组产业化(2018SYHZ0001),\
  \ 吉林省、中国科学院省院合作资金项目，2018-01至2020-05，已结题，主持\n[8] 人工智能学科态势感知系统需求分析与系统测试（CNZC-KJHT-YJZC2019151），中国科学院计算机网络信息中心，2019-09至2020-06，已结题，主持\n\
  [9] 《公共安全 虹膜识别应用 算法测评方法》国家标准制修订项目（TC100/SC2-GB201903），全国安防标委会人体生物特征识别应用分技术委员会，2018-12至2020-12，结题，主持\n\
