  个人简历

  罗永康，工学博士，现任职于中国科学院自动化研究所多模态人工智能系统全国重点实验室，副研究员。主要从事机器人灵巧操作与视觉感知学习，以及智能系统方向的研究，探索灵巧操作机器人前沿技术，开发灵巧操作具身智能算法，提升机器人灵巧操作能力与精细操作能力，以及研究在小样本条件下的高效学习策略。发表相关研究论文26篇，包括IEEE
  Transactions on Robotics，IEEE Robotics and Automation Letters，IEEE Transactions
  on Cognitive and Developmental Systems，IEEE Transaction on Circus and System for
  Video Technology，IEEE Transactions on Industrial Informatics等国际期刊论文，以及ICRA，ICPR等国际会议论文。参与研发的Casia
  Hand系列仿人灵巧手机器人，获得2024年“

  日内瓦国际发明展金奖

  ”和展会特别奖“

  ISTA全球创新与发明奖

  ”。

  研究方向

  机器人学习，计算机视觉，智能系统

  承担科研项目情况

  1.

  中国科学院自动化研究所2035创新任务，神经拟态机器人，2021.1-2023.12，结题，主要完成人

  2.

  科技创新2030“新一代人工智能”重大项目，自主智能体灵巧精准操作学习方法研究与验证，2019.1-2023.12，结题，参与。

  3.

  工信部智能船舶专项子项，复杂海上场景的语义分割及弱小目标检测，2019.03-2021.09，结题，主持

  4.

  国家自然科学基金重点项目子课题，工业机器人三维视觉引导控制研究， 2017.01-2020.12, 结题，主持

  5.

  国家自然基金重大研究计划培育项目，基于注意-记忆-学习的机器人感知与作业，2018.01-2020.12，结题，主要完成人

  6.

  高端智能服务机器人产品产业化项目子课题，深圳市优必选科技有限公司，2017.11-2020.10, 结题，主要完成人

