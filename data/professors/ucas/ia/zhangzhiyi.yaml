  、特点：

  《月亮之上》是中国第一部太空科幻电影，

  讲述了地球上兔子镇的兔子大羿的宇宙历险故事。影片细腻描述了幻想中的

  各种星系、文明、生物，表现了波澜壮阔的太空场景，把

  现代人类对于进入太空的瑰丽想象和中国传统文化中关于月亮的传说完美地结合起来，在一个开阔的文化视野里探讨了已知和未知、人和自然、宇宙的秩序这样一些主题。

