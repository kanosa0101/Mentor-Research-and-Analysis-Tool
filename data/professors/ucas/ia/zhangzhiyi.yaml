  个人简历

  姓名

  张之益

  性别

  男

  职务

  研究中心常务副主任

  职称

  高级工程师

  个人主页

  联系方式

  zhiyi.zhang@ia.ac.cn

  简历

  1992．9年—1994.7年就读于北京电影学院美术系；

  1994年8月—2000年中科院自动化研究所一直从事计算机影像创作与研究。

  2000年任中科院自动化研究所科学艺术中心常务副主任。

  研究领域

  对数字影像、多媒体、流媒体进行研究及创作；

  在视频动作数据采集、处理和合成、柔性对象建模及其动力学、植物生长建模与可视化技术、

  3D

  模型的变形技术、微粒子控制及造型技术、群体动画分部与控制技术等计算机动画技术方面进行研究。

  学术任职

  2009.6-

  中科院自动化所高级工程师

  学术成就

  一、综述

  2000

  年开始组建中国科学院自动化所科学艺术研究中心，经过几年的不懈努力，形成了一支从基础研发到创作制作的结构完备的专业队伍，围绕数字影像、多媒体、流媒体三项核心技术展开了系列研究和创作实践，自主研发出高效的动画后期渲染系统，并在视频动作数据采集、处理和合成、柔性对象建模及其动力学、植物生长建模与可视化技术、

  3D

  模型的变形技术、微粒子控制及造型技术、群体动画分部与控制技术等计算机动画技术方面取得了一系列成果，搭建起一个符合中国国情、遵循现代商业规律的新平台，为具有国际水平的数字艺术作品的生产提供了从创作到制作的全方位的支持。

