  、内容梗概：

  《跃动的群众文化生活》这部短片通过对一家三代人的成长与生活轨迹的描写，真实再现了建国以来三个重要的历史阶段：改革开放之前的红色记忆、改革开放初期的多彩生活、迈进新世纪后的绚丽未来，展现了建国六十年来我国群众精神与物质文化生活的巨大变迁。

  9

  、主题：

  开放性：整个国家和人民群众的精神状态从封闭到开放，接受新鲜事物的能力提高，在观念上开始与国际主流接轨。

  多样性：人民群众在文化生活和生活方式两方面都呈现出多样化特征，精神文化被提到重要的地位，人民生活丰富多彩。

  包容性：中国传统文化已经面向全世界，在中外文化的交织与碰撞中，中国人表现出了大胸怀的兼容并蓄的精神与去粗取精的能力。'
