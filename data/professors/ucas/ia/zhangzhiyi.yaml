  《动物狂欢节》

  讲述的是一个关于音乐的现代中国童话。故事贴近儿童生活，制作精良。毛发的逼真性达到了世界先进水平。粒子流技术使风怪这样一个既具象又抽象的形象柔性的变幻游刃有余。

