  、特点：

  《小狐狸发明记》是一部寓教于乐的科普系列动画。借助活泼可爱的卡通形象及幽默生动的动画故事，推行“动画娱乐+知识传播”的崭新艺术形式，介绍科学发明和创新实践。致力于科学普及艺术化、枯燥教育娱乐化、民族文化国际化，紧跟时代步伐，传播科学知识，弘扬科学精神，在知识传播的同时，最大限度地发挥动画片的娱乐功能，将获得社会和经济的双重效益。

