  9

  、特点：

  《麋鹿王》以我国“国宝”级动物麋鹿为题材，讲了一个人和鹿之间仇恨和相爱的传奇故事。麋鹿仅产于我国，在中国古代曾经繁盛一时，对中国文化产生过深远的影响，却因战乱的历史原因在中国绝迹，后又失而复得。麋鹿的传奇昭示的是民族的传奇，《麋鹿王》的社会意义、历史意义和文化意义将是十分深远。

  《麋鹿王》在

  3D

  模型的变形技术上取得重大的突破，

  骨骼关节及形状的脚本控制、利用骨骼动力学模型及编程技术、解决了2D/3D动画的拉伸挤压控制；另外利用骨骼＋网格的变形技术的研究、改变了以前表情动画只用网格变形控制带来的失真问题。

