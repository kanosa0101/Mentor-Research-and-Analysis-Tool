  研究方向

  SLAM与三维重建

  承担科研项目情况

  1、基于多元特征的双目与IMU融合的稠密SLAM研究，国家自然科学基金青年基金，主持

  2、AR/MR环境下的跟踪定位与编辑生成，科技部工业软件重点专项，参与

  3、开放环境下的多模态视觉定位与增强，科技创新2030重大项目，参与

  4、室内挑战性环境下机器人视觉定位导航理论及应用，国家自然科学基金重点项目，参与

  5、基于RGB-D相机的SLAM与三维重建技术，南京地平线机器人技术有限公司，主持

