  个人简历

  刘宏斌，中国科学院自动化研究所研究员、博导，中

  国

  科学院香港创新研究院人工智能与机器人创新中心主任，多模态人工智能系统全国重点实验室智能微创医疗技术团队负责人。

  2020

  年入选中国科学院高层次人才计划，

  2021

  年入选国家高层次人才长期计划。

  刘宏斌研究员归国前任英国伦敦国王学院医疗机器人学教授

  ,

  触觉医疗机器人实验室主任。

  2020

  年全职加入中国科学院自动化所。为解决触感能力缺失这一当前制约微创手术效率及安全性的关键性难题，以实现手术微创化，数字化，智能化，标准化为目标，长期致力于研发经狭窄腔道的柔性微创机器人技术。所带领的实验室是国际上率先开展具有触觉感知的柔性手术机器人研发的团队之一。刘宏斌研究员在精准触觉传感技术、微创柔性机器人技术，多模态手术大模型的研究等方面取得了业内公认的开创性成果。作为项目负责人，多次获得代表英国工程物理领域最高水平的

  EPSRC

  基金会，欧盟委员会，

  InnovateUK

  及工业界的资助，在英期间科研经费累计达

  355

  万英镑。

  代表科研成果包括全球首个微创柔性神经外科机器人

  MicroNeuro

  、多模态手术大模型

  CARES Copilot

  和基于物理实时模拟的外科手术数字孪生系统

  PRIME

  。

  2022

  年，

  MicroNeuro

  荣获首届

  “

  中银香港科技创新奖

  ”

  ，是人工智能与机器人领域的唯一获奖者。这一成果被评委会评价为

  “

  使香港成为机器人神经外科研究领域的国际领导者，并彰显了香港在世界医疗机器人研究和神经外科临床研究领域的重要角色

  ”

  。共发表国际顶尖期刊与会议超过

  150

  余篇，

  H

  影响因子

  46

  。发明专利申请、授权

  50

  余项。主持和参与多个重大课题，累计研究经费超过亿元。

  研究方向

  1.微创器械智能感知系统研发（精密触觉传感，形状传感）

  2.多模态手术大模型研究

  （多模态智能体，医疗数字孪生）

  3.手术机器人智能辅助技术（具身智能人机交互，多模态机器人控制）

