bio_raw: "尹奇跃\n/\n职　　称:\n副研究员\n邮　　编:\n100190\n电子邮件:\nqyyin@nlpr.ia.ac.cn\n部门/实验室:\n\
  中国科学院自动化研究所复杂系统认知与决策实验室\n通讯地址:\n北京市海淀区中关村东路95号\n个人简历\n尹奇跃，中国科学院自动化研究所副研究员，硕士生导师。2017年于中国科学院大学获得博士学位，并于中国科学院自动化研究所工作至今。长期从事博弈决策尤其是智能体自主进化与多模态对齐研究，在相关领域发表高水平学术论文五十余篇，是国内外多个期刊与会议（如IEEE\
  \ TPAMI、IEEE TNNLS、IEEE TIP、IJCAI、AAAI等）审稿人，ICCCS2023指导委员会主席，人工智能学会智能决策专委会副秘书长，曾荣获中国指挥与控制学会科学技术进步奖一等奖，2022\
  \ IJCAI NeuroMMO银奖，2018 AIIDE星际争霸AI全球挑战赛季军，CCF-滴滴盖亚青年学者基金，以及中国图像图形学会高关注领域综述等荣誉。\n\
  研究方向\n博弈决策、机器学习、数据挖掘\n承担科研项目情况\n1. 博弈决策开源平台建设，100万\n2. 不完全信息下多智能体高效探索与协作算法及验证系统开发，80万\n\
  3. 多体博弈对抗策略演化技术协助研究与开发，19.3万\n4. 面向无人机集群对抗的多智能体自主学习研究，30万\n代表论著\n1. Qiyue Yin, Tongtong\
  \ Yu, Shengqi Shen et al. Distributed deep reinforcement learning: A survey and\
  \ a multi-player multi-agent learning toolbox. MIR, 2024.\n2. Qiyue Yin, Jun Yang,\
  \ Kaiqi Huang, et al. AI in human-computer gaming: Techniques, challenges and opportunities.\
  \ MIR, 2023, 20(3): 299-317.\n3. 尹奇跃, 赵美静, 倪晚成, 张俊格, 黄凯奇. 兵棋推演的智能决策技术与挑战. 自动化学报,\
  \ 2023, 49(5): 913-928.\n4. 尹奇跃, 黄岩, 张俊格, 吴书, 王亮. 基于深度学习的跨模态检索综述. 中国图象图形学报, 2021,\
  \ 26(6): 1368-1388.\n5. Qiyue Yin, Shu Wu, Liang Wang. Multiview clustering via\
  \ unified and view-specific embeddings learning, IEEE TNNLS, 2018, 29(11): 5541-5553.\n\
  获奖及荣誉\n1. 中国指挥与控制学会科学技术进步奖一等奖\n2. 2022 IJCAI NeuroMMO 银奖\n3. 2018 AIIDE星际争霸AI全球挑战赛\
  \ 季军\n4. CCF-滴滴盖亚青年学者基金\n5. 中国图像图形学会高关注领域综述\n专利成果\n[1].\t尹奇跃, 黄凯奇, 赵美静. 人机对抗分布式训练系统和方法.\
  \ CN202110489058.7. 已授权\n[2].\t尹奇跃, 黄凯奇, 赵美静. 人机对抗智能体策略制定方法. CN202110488990.8. 已授权\n\
  [3].\t黄凯奇, 尹奇跃, 张俊格; 徐沛. 基于深度强化学习网络构建多样化搜索策略的模型的方法. CN202111565916.8. 已授权\n[4].\t\
  黄凯奇, 赵美静, 尹奇跃. 一种人机对抗能力评估评测方法和系统. CN202111482468.5. 已授权\n[5].\t黄凯奇, 赵美静, 尹奇跃. 人机对抗行动预测方法、装置、电子设备和存储介质.\
  \ CN202110263555.5. 已授权\n[6].\t黄凯奇, 赵美静, 尹奇跃. 人机对抗知识数据混合驱动型决策方法、装置及电子设备. CN202110489056.8.\
  \ 已授权\n[7].\t黄凯奇, 赵美静, 尹奇跃. 人机对抗临机环境生成方法、装置、存储介质及设备. CN202111338899.4. 已授权\n社会任职\n\
  1. 人工智能学会智能决策专委会 副秘书长，2024至今\n2. ICCCS区域主席，2024\n2. ICCCS指导委员会 主席，2023"
