  个人简历

  李凯，中国科学院自动化研究所副研究员，硕士生导师，研究领域为博弈决策智能、深度强化学习等，2020 CCF-腾讯犀牛鸟科研基金优秀奖获得者，中国科学院大学人工智能学院及南京学院《计算博弈原理与应用》课程主讲教师，负责/参与国家自然科学基金、中科院先导专项子课题、新一代人工智能国家科技重大专项子课题、科技创新2030-“新一代人工智能”重大项目子课题等多项重要科研任务，在包括CCF-A类国际期刊会议（如NeurIPS、ICML、ICLR、AAAI、IJCAI、AAMAS等）上发表学术论文30余篇，获人工智能顶级会议AAAI
  2022卓越论文奖，申请/授权国家发明专利20余项，获多次国际竞赛冠军，在非完备信息博弈、多智能体系统、智能视觉感知等方面具有丰富的研究与应用经验，近年来围绕大规模复杂博弈环境下的智能决策问题，研发了一系列高水平决策AI，并构建了学界首个大规模不完美信息博弈研究平台OpenHoldem。

  研究方向

  博弈决策智能

  承担科研项目情况

  中科院A类先导科技专项子课题，负责人，2020.07~2025.06

  非规则对抗的博弈理论与智能方法，新一代人工智能国家科技重大专项子课题，负责人，2023.01~2025.12

  大规模复杂不完美信息博弈高效求解方法研究，CCF-腾讯犀牛鸟基金，负责人，2020.10~2023.12

  对抗态势感知基础理论和关键技术研究，科技创新2030“新一代人工智能”重大项目课题，核心骨干，2020.07~2023.06

