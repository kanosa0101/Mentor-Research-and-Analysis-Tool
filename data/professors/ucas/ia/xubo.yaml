bio_raw: '徐波

  /

  职　　称:

  研究员

  邮　　编:

  100190

  电子邮件:

  xubo@ia.ac.cn

  通讯地址:

  北京市海淀区中关村东路95号

  个人简历

  本科毕业于浙江大学；

  博士毕业于中国科学院自动化研究所

  现任中国科学院自动化研究所所长，中国科学院大学人工智能学院院长、复杂系统认知与决策国家级重点实验室主任。

  长期从事智能语音处理和人工智能技术研究和应用。主持多项国家支撑、863、973以及自然科学基金重点项目和课题。研究成果在教育、广电、安全等领域获得规模化应用。近年来重点围绕听觉模型、类脑智能、认知计算及决策智能等进行研究探索。

  个人主页：

  https://people.ucas.ac.cn/~xubo

  研究方向

  语音识别与合成；自然语言处理；

  类脑认知计算模型；决策智能

  等。

  获奖及荣誉

  曾获“中国科学院自然科学进步二等奖”“王选新闻科技技术一等奖”“中国科学院盈科优秀青年学者奖”，并获得“中国科学院十大双文明标兵”“中国科学院杰出青年”“新世纪百千万人才工程国家级人选”等荣誉称号，享受国务院政府特殊津贴。'
