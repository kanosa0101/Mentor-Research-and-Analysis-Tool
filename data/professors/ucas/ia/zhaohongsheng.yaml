  个人简历

  基本情况：

  2009年进入中国科学院自动化研究所综合信息系统研究中心，现为中国科学院自动化研究所高级工程师。

  主要从事RFID技术理论和应用研究，主持或参与制定多项国家/行业标准，已正式发布国家标准4项，行业标准1项；在国内外学术会议及期刊上发表论文10余篇；申请国内外国家发明专利10余项，已授权2项美国专利，7项中国专利。

  现从事智能任务规划理论及应用研究。

  研究方向

  现从事智能任务规划理论及应用研究。主要针对数学技术在

  相关领域的实际应用，为相关领域建模问题提供可解释性的解决方案。

  承担科研项目情况

  近5年作为项目负责人承研的项目：

  (1) 2019-09-12至2020-12-31 基于人工智能的实体行为建模技术

  (2) 2022-12-06至2023-10-31 智能管理架构建模及高精度时空配准技术研究

  (3) 2023-09-01至2024-12-25 系统智能演进环境构建研究

