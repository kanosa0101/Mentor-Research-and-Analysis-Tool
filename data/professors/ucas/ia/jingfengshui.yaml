  北京市海淀区中关村东路95号 100190

  个人简历

  1987.09-1991.07 安徽理工大学 本科生

  1991.09-1994.06 山东科技大学 硕士生

  1994.07-1999.02 山东农业大学 助教、讲师

  1999.03-2002.06 中国科学院自动化研究所 博士生

  2002.07-2004.9 中国科学院自动化研究所 助研

  2004.10-2014.9 中国科学院自动化研究所 副研究员

  2014.10- 中国科学院自动化研究所 研究员、博导

  研究方向

  机器人智能控制

  承担科研项目情况

  先后承担国家“863”计划、“高档数控机床与基础制造装备”专项、“智能制造装备”专项、“国家重点研发计划”、“国家自然科学基金”重点项目和“国家重大科学工程”等项目或任务
  20 余项，并取得了一系列创新成果，包括“五百米口径球面射电望远镜”FAST 馈源支持整体控制系统、FAST 反射面激光靶标维护机器人、多机器人协调大型船体分段对接系统、多机器人协调大型舱段轴孔装配系统和新型机器人控制器等，有关成果获得北京市科学技术二等奖和“FAST
  建设突出贡献单位”等荣誉。

