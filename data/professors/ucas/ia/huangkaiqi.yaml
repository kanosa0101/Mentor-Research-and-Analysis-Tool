  个人简历

  2004.3-2005.12 中科院自动化所 模式识别国家重点实验室 博士后

  2005.12-2010.6 中科院自动化所 模式识别国家重点实验室 副研究员，硕导

  2010.7- 2011.10 中科院自动化所 模式识别国家重点实验室 副研究员、博导

  2011.11-至今  中科院自动化所 模式识别国家重点实验室 研究员、博导

  2013.7-2018.5 中科院自动化所 智能感知与计算中心 副主任 研究员、博导

  2018.5-至今  中科院自动化所 智能系统与工程研究中心 主任 研究员、博导

  研究方向

  计算机视觉; 模式识别; 人机对抗：认知决策理论、模型及对抗性游戏模型设计 视觉监控应用: 物体检测,跟踪,分类识别以及行为理解关键技术。

  承担科研项目情况

  视频内容理解与分析，主持，国家自然科学优青，2014.1-2016.12

  基于视觉认知的视频目标分类和识别，主持，国家级，2009-01--2011-12

  视觉认知理论研究，主持，国家级，2008-07--2011-12

  国家863项目 面向增强现实的多特征融合的视频目标跟踪  负责人

  中科院知识创新工程重点项目 面向家居的智能视频监控系统  负责人

  国家重点实验室专项基金 面向视觉感知的图像理解  负责人

  973项目 数字内容理解  主要参与

  国家基金重点项目 动态图像语义理解  主要参与

