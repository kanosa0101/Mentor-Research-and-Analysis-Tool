bio_raw: '张桂刚

  /

  职　　称:

  副高级

  电子邮件:

  guigang.zhang@ia.ac.cn

  个人简历

  张桂刚，中国科学院自动化研究所

  ,

  副研究员，主要研究方向：飞机发动机智能故障诊断、人工智能、大数据、语义计算、智能机器人。

  一、教育经历

  (1)2009

  年

  6

  月，武汉大学计算机软件与理论博士研究生毕业；

  (2)2004

  年

  6

  月

  ,

  武汉大学软件工程专业硕士研究生毕业；

  (3)2000

  年

  6

  月，湖南大学计算机科学与技术专业本科毕业。

  二、工作经历

  (1) 2014.01

  至现在

  ,

  中国科学院自动化研究所

  ,

  副研究员；

  (2) 2016.6

  至

  2017.6,

  美国加州大学尔湾分校

  ,

  访问学者；

  (3) 2011.3

  至

  2014.1,

  清华大学

  ,

  博士后，助理研究员。

  三、主持的主要项目或课题

  1.

  发动机故障模式与故障特征数据库构建，重大专项，主持（课题负责人）；

  2.

  资源智能共建共享语义规则与处理机制研究，国家重点研发计划，主持（课题负责人）；

  3.

  时序大数据流下的海量规则并行处理研究，国家自然科学基金，主持（项目负责人）；

  4.

  基于数字孪生的轨道交通健康管理模型研究，北京市自然科学基金，主持（项目负责人）；

  5.

  基于机器学习的典型产品故障预测技术研究，重点基金，主持（项目负责人）

  6.

  人机混合驾驶机器人研究，横向，主持（项目负责人）；

  7.

  液压系统故障模拟器及知识图谱构建，横向，主持（项目负责人）；

  8.

  基于关联规则

  (AR)

  的飞机医生机器人，横向，主持（项目负责人）；

  9.

  飞机地面故障诊断与识别技术研究及地面故障诊断专家系统设计，横向，主持（项目负责人）；

  10.

  基于大数据的飞机及发动机故障诊断，横向，主持（项目负责人）；

  11.

  多轴智能螺纹装配系统开发，横向，主持（项目负责人）；

  12.

  人工智能反洗钱交易监测模型设计研究，横向，主持（项目负责人）；

  13.

  基于修理级别分析的维修资源规划技术研究，项目骨干；

  14.

  通用飞机实时状态监测与健康管理云平台技术研究，项目骨干；

  15.

  飞控及发动机系统参数模型及等效故障模拟器研究，项目骨干；

  16.

  飞行控制系统状态监测与故障特征参数识别技术研究，项目骨干；

  17.

  远程宽体客机综合健康管理机载系统体系架构及先进健康管理算法研究，项目骨干；

  18.

  民用飞机飞控系统故障预测与剩余寿命分析技术研究，项目骨干。

  四、主要发明专利

  1.

  基于

  CNN

  和

  LSTM

  的飞控系统剩余寿命预测方法

  ;

  2.

  基于人在回路的智能自学习故障诊断方法

  ;

  3.

  用于通用飞机的健康管理方法及系统

  ;

  4.

  基于自适应资源调配的地面健康管理方法、系统及装置

  ;

  5.

  一种数据查询方法及装置

  ;

  6.

  基于状态健康信息的剩余寿命远程预测方法、系统及设备

  ;

  7.

  互联网络平台的资源组织和调度优化方法

  ;

  8.

  一种基于语义的海量数据处理方法

  ;

  9.

  一种云程序设计方法

  ;

  10.

  一种云环境下海量数据资源管理框架

  .

