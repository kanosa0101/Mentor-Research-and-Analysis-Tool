  个人简历

  李琳琳，副研究员，2015年毕业于北京大学，2018年加入中科院自动化所微观重建与智能分析团队。

  面对微观脑图谱三维重建存在的诸多技术难题，进行了多项创新性科学研究，主要研究方向为微观脑图谱技术，

  相应成果在微观脑图谱研究方面得到重要应用，建立了国内微观尺度脑三维重构领域最完整的技术体系，

  对国内及国际上脑科学以及其他生命活动生理病理机制的研究产生重要影响。

  研究方向

  微观脑图谱技术研究

