  个人简历

  冯欣博士，现任中国科学院自动化研究所、中国科学院分子影像重点实验室副研究员，中国体视学学会青工委委员，目前主要围绕新一代医学影像技术——磁粒子三维断层成像开展技术研发工作，主持国家基金委原创探索计划项目、北京市自然科学基金-昌平联合基金前沿项目等多项重大科技项目，并作为骨干参与国家基金委国家重大科研仪器设备研制专项，致力于前沿影像技术创新与装备自主研制。所研发的技术授权国际发明专利1项、国家发明专利1项，部分技术已应用于世界首台灵长类动物MPI-CT融合成像系统（安装于中国科学院昆明动物所），成果累计发表论文20余篇，涵盖工程技术类IEEE
  Trans.期刊及生物医学类EBioMedicine和Journal of Investigative Dermatology等主流期刊。

  冯欣博士专注于生物医学影像新技术研发近十余年。博士期间师从美国马萨诸塞大学Anna Yaroslavsky教授，并在哈佛大学威尔曼光医学中心和麻省总医院接受培训并开展研究，期间所研发的皮肤影像技术获国际发明专利授权并实现临床应用；毕业后在全球医学影像三巨头之一GE医疗全球研发中心担任科研经理，积累了丰富的医学影像器械研发经验；自2020年9月加入中国科学院自动化研究所以来，面向高端影像装备自主创新的重大国家战略需求，积极投身新一代医学影像装备研制及智能化成像算法研发，已牵头研制多套磁粒子波谱仪和小动物磁粒子成像系统。

  目前主要研究方向：基于细菌磁小体的高灵敏高分辨磁粒子成像系统研制、快速磁滞修正重建算法研发、多色成像算法研发；肺部磁粒子成像技术研发；基于磁粒子传感的核酸检测技术研发等。

