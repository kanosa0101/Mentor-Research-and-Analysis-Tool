  [6]L.Y. Guo, Y. F. Lu*, et.al. Transformer-based Spiking Neural Networks for Multimodal
  Audio-Visual Classification, IEEE Transactions on Cognitive and Developmental Systems,
  2023. DOI: 10.1109/TCDS.2023.3327081.

  社会任职

  中国中国计算机学会数字农业专委会执行委员、中国自动化学会混合智能专委会委员计算机学会数字农业分会, 执行委员'
