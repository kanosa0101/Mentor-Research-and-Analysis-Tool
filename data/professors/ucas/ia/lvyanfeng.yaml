  个人简历

  吕彦锋，中国科学院自动化所副研究员、研究生导师、中国科学院特聘研究骨干。主要从事模式识别与智能系统，农业机器人的研究，近年来在IEEE TNNLS、IEEE TITS、IEEE
  TCDS等国际期刊会议发表论文三十余篇，主持了农业科技重大项目-农业机器人课题、科技创新2030“新一代人工智能”、国家自然科学基金、北京市自然科学基金等科研任务十余项，是中国计算机学会数字农业专委会执行委员、中国自动化学会混合智能专委会委员，担任国家自然科学基金、工信部、中关村首台套重大项目评审专家。

  研究方向

  类脑感认知、机器人多模态感知、具身智能等

  承担科研项目情况

  (1) 北京市自然科学基金, 联合基金项目, L211023, 基于受脑启发的小样本连续任务学习的轨道列车障碍物识别方法研究, 2021-12 至 2024-12,
  在研, 主持; (2) 科学技术部, 科技创新2030—“新一代人工智能”重大项目, 2020AAA0105900, 基于脉冲神经网络的感知-学习-决策神经网络模型,
  2020-11 至 2024-03,任务负责人

  代表论著

  [1]Y. F. Lu, J. W. Gao,  et.al, “A Cross-Scale and Illumination Invariance-Based
  Model for Robust Object Detection in Traffic Surveillance Scenarios,” IEEE Transactions
