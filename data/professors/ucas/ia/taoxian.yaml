  个人简历

  长期开展工业视觉智能质检的理论方法研究、关键技术攻关和成果应用转化。发表IEEE Transactions多篇（包括中科院Top期刊10余篇），ESI高被引论文2篇（单篇最高引用482次），“领跑者5000－中国精品期刊顶尖学术论文”1篇，授权发明专利20余项，主持国家自然科学基金面上项目1项，北京市自然科学基金面上项目1项，国家自然科学基金青年基项目1项，科技部科技创新2030-“新一代人工智能”重大项目子课题1项，横向课题10项，相关设备应用于中国工程物理研究院激光聚变中心和航天5院502所。入选中科院青年人才计划-创新促进会会员，IEEE
  Senior Member，中国人工智能协会智能光学成像专委会常务委员，中国自动化学会智能制造系统专委会委员，中国自动化学会混合智能专委会委员，机械工业出版社专家委员会委员，EI源刊《工程科学学报》和核心期刊《工矿自动化》青年编委，澳大利亚悉尼科技大学校外导师。曾获国际人工智能顶会CVPR
  2023 学术竞赛亚军1项和最具创新奖1项，CAAI工业视觉挑战赛冠军1项。2019 年获国家留学基金委（CSC）‘国家公派高级研究学者、访问学者、博士后’项目留学奖学金，在澳大利亚悉尼科技大学访问一年，开展视觉感知相关研究，获第十四届‘春晖杯’中国留学人员创新创业大赛高新技术组优胜奖。作为中科院自动化所工业视觉智能检测装备与产业化应用团队成员，获2022年度中国科学院科技促进发展奖。2023年，项目“基于混合监督特征学习的表面缺陷高速高精度在线检测关键技术及应用”获得中国仪器仪表学会科技进步三等奖

  研究方向

  机器视觉与智能感知 （工业智能检测）

  图像处理与模式识别（深度学习）

  机器人智能装备(精密测量、装配、控制）

