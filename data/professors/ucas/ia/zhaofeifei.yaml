  专利成果

  1.赵菲菲，梁倩，王桂香，曾毅，基于多模态融合的多脑区协同自主决策方法。

  2.赵菲菲，孔庆群，曾毅，白俊，基于视觉恐惧反应脑机制的应急避障方法。

  3.曾毅，赵菲菲，王桂香，复杂环境下人机自动障碍物检测和避障方法。

  4.白俊，曾毅，赵菲菲，孔庆群，运动检测方法及躲避和跟踪运动目标的方法。

  5. 赵宇轩，曾毅，王桂香，赵菲菲，基于多脑区协同计算的人类动作意图识别训练方法。

