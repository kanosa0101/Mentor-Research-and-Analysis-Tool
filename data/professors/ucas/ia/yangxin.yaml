  7. 《光学分子影像技术及其应用》，科学出版社，2010年

  8. 《生物特征识别理论与应用》（第二版），清华大学出版社，2009年

  9. 《生物特征识别技术理论与应用》（第一版），电子工业出版社， 2005年

  获奖及荣誉

