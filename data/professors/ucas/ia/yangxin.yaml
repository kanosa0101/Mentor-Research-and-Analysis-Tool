  个人简历

  杨鑫，博士，中国科学院自动化研究所研究员，中国科学院分子影像重点实验室主任，博士生导师。主要从事与智能医学相关的研究与应用工作。主持承担了多项国家级科研任务，包括科技部重点研发计划变革性技术、国家自然科学基金科学仪器专项、国家自然科学基金面向项目等，相关研究成果曾先后两次获得国家技术发明奖、以及国家科技进步奖。

  研究方向

  分子影像成像方法与成像设备

  承担科研项目情况

  1. 科技部 国家重点研发计划“变革性技术关键科学问题”重点专项：肝脏生物分子动态变化的活体超高灵敏成像检测，课题负责人

  2. 国家自然科学基金 国家重大科研仪器设备研制项目：小动物三维在体神经回路成像设备，项目负责人

  3. 国家自然科学基金  科学仪器基础研究专项：小动物在体自发荧光断层分子影像仪器设备，项目负责人

  4. 科技部 国家科技支撑计划：光学-核素-CT多模分子影像技术及设备研发，课题负责人

  5. 科技部 国家重点基础研究发展计划（973计划）：分子影像关键科学技术问题的研究，课题负责人

