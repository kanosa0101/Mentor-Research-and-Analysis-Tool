bio_raw: "孙哲南\n/\n职　　称:\n研究员\n邮　　编:\n100190\n电子邮件:\nznsun@nlpr.ia.ac.cn\n部门/实验室:\n\
  多模态人工智能系统全国重点实验室\n通讯地址:\n北京市海淀区中关村东路97号智能化大厦\n个人简历\n孙哲南，中国科学院自动化研究所研究员和博士生导师、中国科学院大学人工智能学院岗位教授、天津中科智能识别产业技术研究院院长，1999年在大连理工大学获工业自动化专业学士学位，2002年在华中科技大学获系统工程专业硕士学位，2006年在中国科学院自动化研究所获模式识别与智能系统专业博士学位并留所工作，担任IAPR生物特征识别技术委员会主席（IAPR\
  \ Fellow）、中国生物识别产业技术创新战略联盟秘书长、中国人工智能学会模式识别专委会副主任、中国图象图形学学会机器视觉专委会副主任和国际期刊IEEE Transactions\
  \ on Biometrics, Behavior, and Identity Science编委。主要研究方向是生物特征识别、模式识别、计算机视觉。主持和参与国家级科研项目20余项，在国际期刊和会议发表学术论文300余篇，获得发明专利授权50项，获得16项软件著作权，科研成果获得国家技术发明二等奖、国家专利优秀奖和中国图象图形学学会自然科学一等奖，入选国家“万人计划”科技创新领军人才和获得科技部中青年科技创新领军人才，获得中科院卢嘉锡青年人才奖，主持研发的虹膜识别和人脸识别核心技术孵化了三家高科技公司，相关产品在煤矿、银行、安全、手机等领域推广应用。\n\
  研究方向\n生物特征识别、模式识别、计算机视觉\n承担科研项目情况\n云网端协同的多模态可信人脸认证，国家自然科学基金联合基金项目\nAI物理对抗样本攻击和检测防御技术合作项目，企业委托项目\n\
  人脸识别深度特征模型的可解释性研究与应用，国家自然科学基金面上项目\n代表论著\n部分学术论文\n（1）Hongwen Zhang, Jie Cao, Guo\
