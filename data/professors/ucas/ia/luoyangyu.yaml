  北京市海淀区中关村东路100号中国科学院自动化研究所

  个人简历

  2003.10，北京航空航天大学 博士学位

  2006.6— 今 中国科学院自动化研究所 先后任助理研究员和副研究员，长期致力于智能机器人/无人平台理论及应用研究。在国家重点研发计划、国家自然科学基金、北京市自然科学基金、北京市科技计划等项目支持下，在机器人/无人平台运动规划、定位导航方向进行了深入探索，在国内外学术期刊和会议上发表论文四十余篇，获得授权发明专利十余项。是IEEE
  Transactions on Automation Science and Engineering、自动化学报等期刊审稿人，是国家自然科学基金同行评议专家。

  研究方向

  无人平台/机器人运动规划与自主定位导航

  承担科研项目情况

  1.  北京市自然科学基金委，北京市自然科学基金-海淀原始创新联合基金，L212009，基于非确定骨性标记的机器人辅助肩肘关节置换关键技术研究（子课题），2021-12至2024-12，在研，主持

  2.  北京市石景山区生产力促进中心，北京市科技计划“首都科技创新券项目”，20210323739158，基于混合现实的无切口骨科穿刺手术导航系统，2021-5至2022-06，结题，主持

  3. 中华人民共和国科学技术部，国家重点研发计划，2017YFE0121200，针对婴幼儿颅缝早闭的颅骨重塑手术机器人研究（联合承研），2019-01至2021-06，结题，主持

