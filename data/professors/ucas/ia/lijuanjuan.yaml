  个人简历

  教育经历

  2017年9月-2021年9月，北京理工大学，工学博士

  2008年9月-2010年7月，中国人民大学，经济学硕士

  2004年9月-2008年6月，中国人民大学，经济学学士

  工作经历

  2010年7月至今，历任中国科学院自动化研究所助理工程师、工程师、副研究员

  研究方向

  区块链技术与应用、决策智能

  代表论著

  发表学术论文80余篇，其中40余篇发表在中国科学院分区Top期刊、1区期刊以及CCF-A类期刊上，并入选ESI高被引论文、中国知网学术精要“高影响力论文”等。

  部分代表性论文如下：

  ● Juanjuan Li, Rui Qin, Sangtian Guan, Jiachen Hou, Fei-Yue Wang. Blockchain Intelligence:
  Intelligent Blockchains for Web 3.0 and Beyond, IEEE Transactions on Systems, Man,
  and Cybernetics: Systems, 10.1109/TSMC.2023.3348449, 2023.

  ● Juanjuan Li, Fei-Yue Wang, The TAO of blockchain intelligence for intelligent
  Web 3.0, IEEE/CAA Journal of Automatica Sinica, 10(12):2183-2186, 2023.

  ● Juanjuan Li, Junqing Li, Xiao Wang, Rui Qin, Yong Yuan, Fei-Yue Wang. Multi-Blockchain
  Based Data Trading Markets with Novel Pricing Mechanisms, IEEE/CAA Journal of Automatica
  Sinica, 10(12):2222-2232, 2023.

  李娟娟, 秦蕊, 丁文文, 王戈, 王坛, 王飞跃. 基于Web3的去中心化自治组织与运营新框架. 自动化学报, 49(5):985-998, 2023.

  ● Juanjuan Li, Rui Qin, Fei-Yue Wang. The Future of Management: DAO to Smart Organizations
  and Intelligent Operations, IEEE Transactions on Systems, Man, and Cybernetics:
  Systems, 53(6):3389-3399, 2023.

  ● Juanjuan Li, Xiaochun Ni, Yong Yuan, Fei-Yue Wang. A Novel GSP Auction Mechanism
  for Dynamic Confirmation Games on Bitcoin Transactions, IEEE Transactions on Services
  Computing, 15(3): 1436-1447, 2022.

  ● Juanjuan Li, Yong Yuan, Fei-Yue Wang. Analyzing Bitcoin Transaction Fees Using
  A Queueing Game Model, Electronic Commerce Research, 22:135-155, 2022.

  ● 李娟娟, 袁勇, 王飞跃. 基于区块链的数字货币发展现状与展望, 自动化学报, 47(4):715-729, 2021.

  ● Juanjuan Li, Yong Yuan, Fei-Yue Wang. A Novel GSP Auction Mechanism for Ranking
