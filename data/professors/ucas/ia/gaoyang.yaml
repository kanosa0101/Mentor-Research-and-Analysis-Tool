  个人简历

  研究领域是无人自主系统，在高可性无人自主系统研制方面有着扎实的理论基础和丰富的工程经验。作为项目负责人或第一实际负责人承担了多个国家重要项目，成果经鉴定达到国际领先水平。

  研究方向

  群体智能与博弈对抗

  承担科研项目情况

  嵌入式人工智能在飞机中的应用

  人工智能在飞机中的应用技术

  弱联通条件下水下立体攻防体系设计与仿真评估技术

  专利成果

  用于无人机决策的行为树模型可达性分析方法及装置

  用于无人机决策的行为树模型路径生成方法、装置及设备

  无人机智能决策模型训练方法及无人机智能决策方法

  无人机智能决策算力加速系统

  无人机自主机动决策方法、装置及无人机

  一种无人机对抗方法及装置

  基于通信中继的无人机编队协同目标分配方法

