  个人简历

  崔海楠，中国科学院自动化研究所副研究员，硕士生导师。2016年博士毕业于中国科学院自动化研究所，2011年本科毕业于华南理工大学计算机科学与技术专业。主要从事三维计算机视觉理论和应用研究，尤其专注于基于图像的大规模场景三维建模研究，已在IEEE
  TIP、ISPRS P&RS、CVPR、AAAI等国际期刊和会议发表论文30余篇。主要工作被三维建模主流代码库OpenMVG和Theia实现和开源。获得国家自然科学基金青年基金、面上项目、联合重点基金以及国家重点研发计划等多个国家项目资助，同时得到国内企业（华为、商汤和滴滴等）合作支持。

  研究方向

  三维计算机视觉，大规模场景三维建模

  承担科研项目情况

  2024-2027, 开放环境下机器人三维建图与定位, 国家自然科学基金-区域创新发展联合基金重点项目课题

  代表论著

  Peilin Tao, Hainan Cui, Mengqi Rong, Shuhan Shen. Revisiting Global Translation
  Estimation with Feature Tracks. IEEE CVPR 2024. (CCF-A,通讯作者)

  获奖及荣誉

  CCF-滴滴盖亚青年学者科研基金杰出项目

  专利成果

  胡占义, 崔海楠, 申抒含, 高伟. 一种融合附加信息的大场景三维重建方法. CN: CN104200523A

  社会任职

  1）2020--今, CSIG三维视觉专委会, 委员

  2）2019--今, CCF-CV专委简报编委会, 编委

  3）2013--今, ICCV, CVPR, ECCV, IJCAI, AAAI, TIP, ISPRS等国际会议和期刊审稿人'
