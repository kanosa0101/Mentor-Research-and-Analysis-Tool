  个人简历

  王健，副研究员，2016年获北京科技大学工学学士学位，2021年获中国科学院大学工学博士学位，研究方向为仿生机器人、水下机器人和智能控制。围绕“强续航”和“强智能”目标，开展了系列理论方法和关键技术攻关。研究成果发表学术论文40余篇，授权国家发明专利和国际PCT专利合计10余项，出版英文专著1部，入选中国科协青年人才托举工程（科协资助），获得中国科学院院长特别奖、中国科学院特别研究助理、中国科学院优秀博士论文、中国自动化学会优秀博士论文、IEEE最佳会议论文奖等荣誉。

  研究方向

  仿生机器人、水下机器人、智能控制

  承担科研项目情况

  [1]

  国家自然科学基金委员会，青年基金项目，仿生滑翔机器海豚的多模态优化设计及智能控制，2023.01–2025.12，项目负责人。

  [2]

  中国科协青年人才托举工程（科协资助），2024.01–2026.12，项目负责人。

  [3]

  中国科学院特别研究助理人才计划，2022.01–2023.12，项目负责人。

  [4]

  国家重点实验室，青年基金项目，仿生滑翔机器海豚的水下自主航行关键技术研究，2022.01–2022.12，项目负责人。

  [5]

  国家自然科学基金委员会，重点基金项目，水空跨介质仿生机器人多模态运动机理与控制，2023.01–2027.12，课题负责人。

