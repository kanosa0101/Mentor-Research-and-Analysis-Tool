  部门/实验室:

  多模态人工智能系统重点实验室

  通讯地址:

  北京市海淀区中关村东路95号

  个人简历

  研究领域：

  人工智能、社会计算、网络大数据分析挖掘

  工作简历：

  1990-1993年在陆汝钤院士的指导下，就读于中国科学院数学研究所；参与国家重点攻关项目（天马）专家系统开发环境的研制，该项目获国家科技进步二等奖。1993-1999年在中国科学院研究生院计算机学部任讲师，主持系统开发实验室工作并主讲人工智能相关课程，期间参与了多项国家课题的研究。1999-2001年赴德国人工智能研究中心（DFKI）进行交流访学，2001年被聘为DFKI研究科学家，为欧盟四国联合项目SAID和DFKI研究项目Presence的主要研制人员。2001-2006年在美国南加州大学创新技术研究所任研究助理，发展了基于多智能体交互的社会模拟技术；博士工作提出首个基于认知科学和心理学的社会因果推理计算模型，获南加州大学杰出学术成就奖。2006年9月加入中国科学院自动化研究所，任副研究员；2012年至今任研究员、博士生导师。主持多项国家自然科学基金项目及重点项目课题、国家重点研发计划课题、中国科学院及部委合作项目。2015年起担任中国科学院大学岗位教授等职。

  社会任职：

  担任《ACM Computing Surveys》、《IEEE Intelligent Systems》等国际期刊编委，多次应邀主编SCI/SSCI学术期刊专刊和组织本领域国际学术研讨会，任会议主席10余次及本领域主要国际会议的PC/SPC、领域或Session主席。先后担任ACM北京分会主席、中国人工智能学会理事、中国计算机学会大数据专家委执行委员、中国指控学会大数据科学与工程专委会常务委员、IEEE
  SMC学会Homeland Security专委会委员等职。

  担任学术会议PC/SPC/AC：AAAI、AAMAS、ACL、AILA、AMT、CCDM、CCF AI/Bigdata、CCIS、CogSci、ECAI、EMNLP、EUROMEDIA、GAMEON、IEEE
  ICBK、IEEE ISI、ICONIP、IIP、IJCAI、IVA、PAAMS、PRIMA、SMP、WI-IAT 等

