  个人简历

  张一帆，研究员，博导，目前主要从事视觉内容分析与高效计算、机器学习、智能决策等方面的研究。主持多项国家自然科学基金课题、中科院专项、企业委托项目。在IEEE T-PAMI、IEEE
  T-IP、IEEE T-CYB、IEEE T-MM等权威国际期刊和NeurIPS、CVPR、ICCV、ECCV、ICLR等顶级国际会议上发表论文四十余篇。现为中国计算机学会计算机视觉专委会委员，AVS国家标准工作组数字媒体内容描述组组长，IEEE1857.6标准工作组组长。中科院院长奖获得者，中科院青年创新促进会成员，中科院自动化所特聘研究骨干。

  研究方向

  机器学习（包括深度学习、强化学习、概率图模型等）；视觉内容分析与高效计算、人体行为识别；智能决策

  承担科研项目情况

  国家自然科学基金，“行为识别轻量化神经网络模型研究”，2023.1-2026.12, 负责人。

  科技部“新一代人工智能”重大项目子课题，“神经网络表示与压缩标准”，2019.12-2023.06，负责人。

  国家自然科学基金，“基于深度时空建模的人体动作识别”，2019.1-2022.12, 负责人。

  国家自然科学基金，“基于概率图模型的复杂行为识别”，2016.1-2019.12, 负责人。

  国家自然科学基金，“知识与数据混合驱动的概率图模型研究及在行为识别的应用”，2013.1-2015.12, 负责人。

  中科院青促会专项， 2014.7-2017.12, 负责人。

  中科院院长奖专项，2011.4-2012.12，负责人。

