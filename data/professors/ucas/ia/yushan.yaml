  个人简历

  余山，研究员，博士生导师，脑图谱与类脑智能实验室主任。2000年、2005年分别于中国科学技术大学获得生物学学士和博士学位，2005至2014年在德国马克斯普朗克脑研究所、美国国立精神健康研究所开展博士后研究，2014年回国加入中国科学院自动化研究所。研究方向包括脑网络的信息处理机制、脑启发的人工智能模型与算法、新一代植入式脑机接口系统等。迄今在神经科学与智能技术领域期刊和会议发表论文80余篇，研究得到国家自然科学基金委、科技部重点研发计划、中国科学院战略先导专项、科技创新2030重大项目等支持。

  在基础研究方面，围绕大脑信息表示与学习机制这一核心科学问题持续取得原创突破，并推动神经计算原理向类脑模型转化。代表性工作系统揭示了意识调控的神经动力学机制(Nature
  Communications 2025a)，发现了脑内运动系统空间位置编码的统一神经表征 (Nature Communications 2025b)，阐明了灵长类大脑基于正交低维流形空间与图式复用的快速学习机制(Nature
  Communications 2026)，构建了具备类人概念生成、理解与交流能力 (Nature Computational Science 2026)和连续学习能力（Nature
  Machine Intelligence 2019）的新型人工智能模型。

  在关键技术攻关方面，面向脑机接口创伤大、植入效率低等核心瓶颈，带领团队构建极微创植入式脑机接口技术体系并持续推进工程化落地。研制的激光微创颅骨开孔系统和柔性电极自动植入机器人在国际上率先实现柔性电极经
  300 微米颅骨微孔精准植入，核心装备“CyberSense”作为国内首台产品级柔性电极自动植入机器人交付重大科技设施，植入手术导航设备已在多家科研单位和相关企业投入应用，持续推动脑机接口关键装备的国产化突破。

  研究方向

  系统与计算神经科学、类脑智能和脑机接口

  承担科研项目情况

  近五年共主持项目5项，包括国家重点研发计划课题一项、中国科学院B类先导专项课题一项、科技创新2030-“脑科学与类脑研究”重大计划子课题一项等。

