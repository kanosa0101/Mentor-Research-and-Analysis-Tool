bio_raw: "刘康\n/\n职　　称:\n研究员\n邮　　编:\n100190\n电子邮件:\nkliu@nlpr.ia.ac.cn\n部门/实验室:\n复杂系统认知与决策实验室\n\
  通讯地址:\n北京市海淀区中关村东路95号\n个人简历\n刘康研究员，博士生导师;中国科学院大学人工智能学院岗位教授，北京智源人工智能研究院青年科学家。研究领域包括信息抽取、网络挖掘、问答系统等，同时也涉及模式识别与机器学习方面的基础研究。在人工智能、自然语言处理、知识工程等领域国际重要会议和期刊发表多篇学术论文，Google\
  \ Scholar引用1万余次。曾获第25届国际计算语言学大会COLING 2014最佳论文奖，中国中文信息学会汉王青年创新奖(2014年)，Google FocusedResearch\
  \ Award(2015、2016年)，中国中文信息学会“钱伟长中文信息处理科学技术奖”一等奖(个人排名第二，2018年)，北京市科学技术进步奖一等奖(个人排名第二，2019年)等奖项。2019年获得国家优秀青年基金项目支持，2020年入选中国科学院青年创新促进会优秀会员。\n\
  研究方向\n自然语言处理、人工智能、大模型、知识工程\n承担科研项目情况\n1.面向案件审判全流程的智能问答技术及平台，国家重点研发计划，2018.07-2021.06\n\
  2.跨模态暗知识可解释分析与转换，国家重点研发计划，2023.01.01-2025.12.31\n3.文本信息抽取与问答系统，国家自然科学基金优秀青年科学基金，2020.01-2022.12\n\
  4.基于神经符号学习的可解释性问答与对话，中国科学院重点部署项目\t，2020.01-2022.12\n代表论著\n(1) 赵军; 刘康; 何世柱; 陈玉博;\
  \ 张元哲 ; 《知识图谱—算法与实践》, 高等教育出版社, 2022\n(2) Dianbo Sui; Yubo Chen; Kang Liu; Jun Zhao;\
  \ Xiangrong Zeng; Shengping Liu ; Joint Entity and Relation Extraction with Set\
  \ Prediction Networks, IEEE Transactions on Neural Networks and Learning Systems,\
  \ 2023, /(/)\n(3) Zhao Yang; Yuanzhe Zhang; Pengfei Cao; Cao Liu; Jiansong Chen;\
  \ Jun Zhao; Kang Liu ; Information bottleneck based knowledge selection for commonsense\
  \ reasoning, Information Sciences, 2024, 660: 120134\n(4) Zhao Yang; Yuanzhe Zhang;\
  \ Dianbo Sui; Cao Liu; Jun Zhao; Kang Liu ; Representative Demonstration Selection\
  \ for In-Context Learning with Two-Stage Determinantal Point Process, Proceedings\
  \ of the 2023 conference on empirical methods in natural language processing (EMNLP\
  \ 2023), Singapore, 2023-12-06至2023-12-10\n(5) Zhongtao Jiang; Yuanzhe Zhang; Zhao\
  \ Yang; Jun Zhao; Kang Liu ; Alignment Rationale for Natural Language Inference,\
  \ The Joint Conference of the 59th Annual Meeting of the Association for Computational\
  \ Linguistics and the 11th International Joint Conference on Natural Language Processing\
  \ (ACL-IJCNLP 2021)，泰国，2021-8-1至2021-8-6\n获奖及荣誉\n（1）大规模知识图谱构建关键技术与应用, 北京市人民政府, 科技进步,\
  \ 省部一等奖, 2020(赵军; 刘康; 刘升平; 何世柱; 陈玉博; 张元哲; 任禾; 崇伟峰) (科研奖励)\n（2）大规模开放域文本知识获取与应用平台,\
  \ 中国中文信息学会, 钱伟长中文信息处理科学技术奖，一等奖, 其他, 2018(赵军; 刘康; 何世柱; 陈玉博) (科研奖励)\n专利成果\n1.201911276552.4\t\
