  个人简历

  左年明，男，研究员、博士生导师

  中国科学院自动化研究所，脑网络组研究中心（副主任）

  研究方向

  研究方向集中在脑机接口、脑机交互技术研究及应用；主要针对无线无创双向闭环脑机接口，这是未来脑机接口的必然趋势；研究无线可穿戴的脑信号检测硬件技术、认知解码算法、脑认知调控闭环技术（均为无创，包含硬件、算法、系统和成型装备），以期能以全新的模式理解脑认知过程，并实现脑智能科学真正走向临床和生活应用。

  目前已有完整的硬件、设备、系统和算法平台；部分技术在临床情绪障碍（抑郁、焦虑、睡眠障碍等）诊-疗开展批量的应用测试，建立了国际上本领域最大的数据库；在常规人群实时脑机交互、实时操控、情绪实时识别方面均有精彩应用。

  研究小组鼓励面向应用的原创基础研究，在国际代表性学术期刊论文、国际国内专利技术、创新性技术原型等方面均有持续产出。

  最新信息请访问

  ：

  https://nlpr.ia.ac.cn/users/zuonianming/index.htm

  。'
