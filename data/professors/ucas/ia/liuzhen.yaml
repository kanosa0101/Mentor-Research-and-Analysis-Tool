  个人简历

  2017-11~现在, 中国科学院自动化研究所, 副研究员

  2015-07~2017-10,中国科学院自动化研究所, 助理研究员

  2010-09~2015-06   中国科学院自动化研究所   工学博士

  2006-09~2010-06   南京航空航天大学   工学学士

  研究方向

  飞行器智能决策与控制

  多智能体博弈对抗

  智能控制

  承担科研项目情况

  1. 国家自然科学基金青年基金项目（61603384）：高超声速飞行器复合自适应浸入与不变控制方法研究，2017年01月—2019年12月，负责人；

  2. 科技部科技创新2030—“新一代人工智能”重大项目：“蜂群”系统群智行为训练与模型构建，2019年12月—2023年12月，子课题负责人；

  3. 中国科学院战略性先导科技专项（A类）：智能模拟对抗平台设计与实现，2021年06月—2022年12月，子课题负责人；

  4. 中国科学院战略性先导科技专项（A类）：面向虚实融合的算法研究与平台应用，2023年01月—2023年12月，课题负责人；

