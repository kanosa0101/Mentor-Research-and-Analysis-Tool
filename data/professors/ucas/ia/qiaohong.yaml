  个人简历

  乔红，中国科学院院士，第十四届全国政协委员，九三学社社员，中国科学院自动化研究所研究员。现担任多模态人工智能系统全国重点实验室主任，九三学社中央委员，世界机器人合作组织理事长（首任、现任）、

  IEEE

  总部会士委员会委员（负责

  IEEE

  会士遴选工作），中国自动化学会机器人智能专委会主任。当选

  IEEE

  会士，首次从中国内地当选并连任

  IEEE

  机器人与自动化学会管理委员会成员。受邀担任国际

  SCI

  期刊《

  Robotic Intelligence and Automation

  》主编，担任

  IEEE/ASME T-Mech

  高级编委，

  IEEE TNNLS

  、

  IEEE T-Cyber

  等国际期刊编委。

  乔红是机器人理论与应用领域专家和学术带头人，长期工作在机器人科研第一线，在受人启发的机器人决策、感知、控制及结构设计方面做出了系统性、创造性重要贡献。她基于人类整体性能高于单元性能的机理，首次发现并提出了机器人高精度操作中的高维“环境吸引域”方法，被国际期刊报道为“乔的概念”；通过对人体行为、肌肉骨骼系统和神经机制的借鉴和应用，提出了机器人高性能作业新途径，为我国机器人高端应用的推广做出贡献。研究成果获美国、加拿大等国著名学者的引用和成功应用，荣获国家自然科学奖二等奖、北京市科学技术一等奖、中国自动化学会技术发明一等奖，均排名第一。

  乔红研究员带领团队在广东省建立机器人产业化基地，开展工业机器人精密装配和高速分拣等单元技术和系统研发，获国家知识产权局优势单位、广东省知识产权示范单位，广东省中小企业公共服务示范平台等荣誉。'
