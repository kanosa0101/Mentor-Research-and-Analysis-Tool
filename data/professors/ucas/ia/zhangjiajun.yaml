  个人简历

  张家俊，中国科学院自动化研究所研究员、博士生导师，中国科学院大学岗位教授，主要研究方向为自然语言处理、语言模型及应用，获得国家优秀青年科学基金资助，入选中国科协首届青年人才托举工程、中国科学院青年创新促进会优秀会员和北京智源青年科学家，主持科技创新2030一“新一代人工智能”重大项目。发表CCF-A/B类论文100余篇，出版学术专著2部、译著1部。获得中国中文信息学会钱伟长中文信息处理科学技术奖一等奖、青年创新奖一等奖和北京市科学技术奖一等奖等。担任中国中文信息学会理事、青年工作委员会主任和机器翻译专委会副主任。多次担任ACL/EMNLP/COLING的(资深)领域主席，担任Artificial
  Intelligence、IEEE/ACM T-ASLP、ACM TALLIP和《自动化学报》等期刊的编委。

  研究方向

  自然语言处理、多语言多模态大模型与应用

  承担科研项目情况

  国家自然科学基金委员会, 优秀青年科学基金项目, 62122088, 机器翻译, 2022-01-01 至 2024-12- 31, 200万元, 在研, 主持

  中国科学技术部, 科技创新2030-“新一代人工智能”重大项目, 2022ZD0160600, 面向泛在场景的通 用视觉对话模型与应用验证, 2023-01 至
  2025-12, 2000万元, 在研, 主持

  代表论著

  (1) Jiajun Zhang; Long Zhou; Yang Zhao; Chengqing Zong ; Synchronous Bidirectional
  Inference for Neural Sequence Generation, Artificial Intelligence, 2020, 281: 1-19

  (2) Jiajun Zhang; Chengqing Zong. Exploiting Source-side Monolingual Data in Neural
  Machine Translation, EMNLP-2016.

  (3) Jinliang Lu; Jiajun Zhang ; Take a Closer Look at Multilinguality! Improve Multilingual
  Pre-Training Using Monolingual Corpora Only, Findings of EMNLP-2023, Singapore.

  (4) Feihu Jin; Jiajun Zhang; Chengqing Zong ; Parameter-efficient Tuning for Large
  Language Model without Calculating Its Gradients, EMNLP-2023, Singapore.

  (5) Qian Wang; Jiajun Zhang; Chengqing Zong ; Synchronous Inference for Multilingual
  Neural Machine Translation, IEEE/ACM Transactions on Audio, Speech, and Language
  Processing, 2022, 30: 1827-1839.

  (6) Jinliang Lu; Jiajun Zhang ; Towards Unified Multi-Domain Machine Translation
  With Mixture of Domain Experts, IEEE/ACM Transactions on Audio, Speech and Language
  Processing, 2023, 31: 3488-3498.

