  个人简历

  2026.04-至今  中国科学院自动化研究所 多模态人工智能系统全国重点实验室 研究员

  2019.10-2026.03 中国科学院自动化研究所 模式识别国家重点实验室（多模态人工智能系统全国重点实验室）副研究员

  2017.07-2019.09 中国科学院自动化研究所 模式识别国家重点实验室（多模态人工智能系统全国重点实验室） 助理研究员

  研究方向

  多媒体内容分析，数据挖掘，多模态大模型，跨模态检索与个性化推荐

  承担科研项目情况

  作为负责人主持了国家自然科学基金青年基金B类（原国家优青）、企业联合基金重点项目、国家重点研发计划青年科学家项目、某部委专项、北京市杰出青年基金、腾讯微信犀牛鸟专项、小米科研专项和快手科研专项等

  代表论著

  1. Shengsheng Qian, Dizhan Xue, Quan Fang, Changsheng Xu: Integrating Multi-Label
  Contrastive Learning With Dual Adversarial Graph Neural Networks for Cross-Modal
  Retrieval. IEEE Transactions on Pattern Analysis and Machine Intelligence. 45(4):
  4794-4811 (2023)

  2. Shengsheng Qian, Hong Chen, Dizhan Xue, Quan Fang, Changsheng Xu: Open-World
  Social Event Classification. WWW 2023: 1562-1571

  3. Shengsheng Qian, Dizhan Xue, Quan Fang, and Changsheng Xu. Adaptive Label-aware
  Graph Convolutional Networks for Cross-Modal Retrieval. IEEE Transactions on Multimedia,
  24: 3520-3532 (2022)

  4. Shengsheng Qian, Dizhan Xue, Huaiwen Zhang, Quan Fang, Changsheng Xu. Dual Adversarial
  Graph Neural Networks for Multi-¬Label Cross-Modal Retrieval. The Thirty-Fifth AAAI
  Conference on Artificial Intelligence (AAAI) 2021: 2440-2448.

  5. Shengsheng Qian, Jinguang Wang, Jun Hu, Quan Fang, Changsheng Xu. Hierarchical
  Multi-modal Contextual Attention Network for Fake News Detection. SIGIR 2021: 153-162.

  获奖及荣誉

  在IEEE/ACM Trans.期刊和CCF-A类会议上发表论文80余篇，相关成果获中国科学院优博、ACM MM 2016年最佳论文、2019年最佳论文提名、SIGIR
  2024年最佳论文提名、ICIG 2025年最佳论文等。

  专利成果

  [1] 徐常胜, 钱胜胜, 方全. 虚假新闻检测方法、装置、电子设备和存储介质. CN: CN113469214A, 2021-10-01.

  [2] 徐常胜, 钱胜胜, 方全. 基于有监督对比的跨模态检索方法、系统及设备. CN: CN113239214A, 2021-08-10.

  社会任职

  2019-09-01-今,中国计算机学会多媒体专业委员会委员

  2019-09-01-今,中国图象图形学学会多媒体专业委员会委员

  2017-07-01-今,IEEE TKDE/IEEE TMM/IEEE TCSVT和ACM MM/AAAI/CVPR/ICCV等国际期刊和国际会议审稿人'
