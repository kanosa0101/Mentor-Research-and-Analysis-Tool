bio_raw: "张兆翔\n/\n职　　称:\n研究员\n邮　　编:\n100190\n电子邮件:\nzhaoxiang.zhang@ia.ac.cn\n部门/实验室:\n\
  智能感知与计算研究中心\n通讯地址:\n北京市海淀区中关村东路99号智能化大厦\n个人简历\n张兆翔，博士，中国科学院自动化研究所智能感知与计算研究中心常务副主任，研究员、博士生导师，中国科学院大学岗位教授，中国科学院脑科学与智能技术卓越创新中心骨干，入选“教育部长江学者奖励计划”、“国家万人计划青年拔尖人才”和“教育部新世纪优秀人才支持计划”，曾获得北京市科学技术奖科技进步奖一等奖（排名第一）、中国人工智能学会吴文俊技术发明奖二等奖（排名第一）。张兆翔博士的研究兴趣包括：模式识别、计算机视觉与深度学习，具体研究方向包括：视觉认知计算、类脑学习和面向开放环境的视觉感知与理解，在本领域国际主流期刊与会议上发表论文200余篇，近五年来在IEEE\
  \ T-PAMI、IJCV、JMLR、IEEE T-IP、IEEE T-NN等顶级期刊与CVPR、ICCV、ECCV、NIPS、AAAI、IJCAI等顶级会议发表论文100余篇，申请专利55项，已授权24项，承担了国家自然科学基金重点项目、重点国际(地区)合作研究项目、企业联合重点支持项目、国家重点研发项目课题、北京市新一代人工智能重点研发项目等多项国家级科研项目和企业合作项目。张兆翔博士是IEEE高级会员、VALSE常务AC、中国计算机学会杰出会员、中国人工智能学会杰出会员、中国人工智能学会副秘书长、中国人工智能学会理事、中国人工智能学会模式识别专委会秘书长、中国图象图形学学会会员发展与服务委员会副主任、中国科学院学部科技规范与伦理研究中心学术顾问委员会委员。张兆翔博士是或者曾经是IEEE\
  \ T-CSVT、IEEE T-BIOM、Pattern Recognition、NeuroComputing 等知名期刊编委，担任CVPR、ICCV、AAAI、IJCAI、ACM\
  \ MM、ICPR、ACCV等国际会议的领域主席（Area Chair）。\n研究方向\n视觉认知计算、类脑学习和面向开放环境的视觉感知与理解\n承担科研项目情况\n\
  基于全脑神经观测的类脑神经网络计算建模与验证，国家自然科学基金国际（地区）合作交流项目\n动态开放环境下的持续目标感知与学习，国家自然科学基金联合基金项目\n\
