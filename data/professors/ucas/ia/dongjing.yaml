  个人简历

  董 晶，女，2010年博士毕业于中科院自动化研究所模式识别国家重点实验室，现任中国科学院自动化研究所多模态人工智能系统全国重点实验室研究员、博士生导师。董晶博士主要从事计算机视觉、生物特征识别、多媒体内容取证与安全前沿方向的技术研究。她曾入选国家高层次青年科技人才计划、先后以项目（课题）负责人承担4项国家自然科学基金、3项国家重点研发项目（课题）、国家重大专项子项及20余项省部级科研项目（课题）。在T-PAMI、TIFS、TCSVT等国际权威期刊及CVPR、AAAI、ACMM等学术会议上发表学术论文90余篇，申请发明专利30余项，其中已授权25项中国专利含3项美国专利。
  她现为中国人工智能学会(CAAI)理事、杰出会员；中国图象图形学学会(CSIG)理事、副秘书长；CSIG女科技工作者委员会秘书长；CSIG数字媒体取证与安全专委会常委、副秘书长；北京市女科协理事；北京图象图形学学会(BSIG)常务理事、青工委主任委员；中国科学院青年创新促进会会员；首都海智新型海智工作基地专家；美国电气电子工程师学会(IEEE)
  高级会员、IEEE亚太区执行委员（2017-2024）、IEEE亚太区奖励委员会主席（2023-2024）、IEEE亚太区可持续发展技术委员会主席（2019-2022）、IEEE亚太区女工程师委员会主席（2017-2018）、IEEE女工程师协会北京分会副主席（2018-2022）、IEEE信号处理协会（SPS）全球会员发展主席（2022-2024）、IEEE
  SPS多媒体取证专委会委员（2023-2026）；亚太信号与信息处理协会(APSIPA)多媒体安全取证专委会委员（2020-2025）；国际模式识别联合会（IAPR）出版委员会委员（2019-2024）、
  IAPR 《Newsletter》主编(2019-2022)， Elsevier 《Journal of Information Security and Application》国际期刊的副主编。她还曾担任IEEE
  青年计算与通讯技术大会组织委员会主席（2009-2010）、IEEE 北京女工程师领导力峰会大会主席（2019-2021）、中国人工智能大会组委会联席主席（2015-2017）及多个本领域国际国内权威学术会议期刊、科研项目的评审与学术交流组织工作。她曾荣获第10届全国信息隐藏暨多媒体信息安全大会优秀论文奖、2015国际通信及信号系统大会最佳论文奖、2016年度IBM学院奖、2018年度国际模式识别大会最佳科技论文奖、2019年度中国人工智能学会杰出贡献奖、2020年度CSIG石青云女科学家奖、2021年度北京青年优秀科技论文奖、2021年度CSIG科技奖二等奖（排名第一）、2021年度吴文俊人工智能科学技术奖（技术进步科普类）、中国发明协会2022年度发明创新奖一等奖（排名第一）、2022国家广电总局第二届广播电视和网络试听人工智能应用创新大赛深度合成技术应用类一等奖（排名第一），2023年度吴文俊人工智能科学技术奖(技术发明一等奖、排名第二）。

