  个人简历

  面向国家“海洋强国” 和“制造强国” 战略需求，长期从事机器人视觉与自主作业研究。在水下机器人方面，提出了水下结构光传感器设计与标定、水下机器人运动中稠密重建、水下机器人未知环境导航与建图、水下管道自主巡检等方法。在焊接机器人方面，提出了编码结构光传感器的设计与标定、微细焊缝初始点导引与跟踪、焊缝特征点准确提取、焊接机器人三维路径规划、复杂空间曲线焊缝实时跟踪与姿态优化等方法，并研发了具有自主知识产权的焊缝识别与跟踪系统，在机器人焊接生产线上得到批量应用。相关研究成果在国际知名期刊上发表
  SCI 学术论文40 余篇，以第一作者或通讯作者身份发表 JCR Q1 区 SCI 期刊论文 20 余篇（12 篇 IEEE Trans.），获授权国家发明专利
  20余项。 入选第七届中国科协青年人才托举工程（全国 444人，2022 年）、中科院青年创新促进会（全院 465 人，2022 年）、北京科协青年人才托举工程（2022年）、中科院首批特别研究助理（2019年）、中科院特聘研究骨干等。

  研究方向

  水下机器人，机器人视觉，机器人集成应用与智能制造

  承担科研项目情况

