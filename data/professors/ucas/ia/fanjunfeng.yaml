  [3] 国家自然科学基金-青年科学基金项目，基于视觉的水下焊接机器人焊缝提取与智能控制研究，2021-01至2023-12，主持。

  [4] 北京市自然科学基金-面上项目，混合式水下焊接机器人环境感知与自主作业方法研究，2023-01至20245-，主持。

  [5] 中国科学院-特聘骨干岗位（人才类资助），水下机器人环境感知与自主作业，2023-01至2027-12，主持。

  [6] 中国科学院青年创新促进会会员资助项目（人才类资助），基于结构光视觉的水下环境精细化三维感知，2022-01至2025-12，主持。

  [7] 中国科学院特别研究助理项目（人才类资助），仿生滑翔机器海豚水下环境感知与智能跟踪控制，2019-07至2021-07，主持。

