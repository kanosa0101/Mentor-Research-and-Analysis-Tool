  个人简历

  CCF杰出会员，主要研究领域为计算机图形图像、计算机视觉、点云处理、深度学习、人工智能、无人驾驶环境感知等。主持及参与多项国家重点研发计划、国家863项目、国家自然科学基金重点基金、面上基金、青年基金以及博士后基金等，获中国图学学会科技进步奖二等奖，教育部高等学校科学研究优秀成果奖（科学技术）二等奖，已经在国际国内期刊及会议上发表了八十余篇论文（AAAI会议、Siggraph
  Asia会议、ICCV会议、MICCAI会议、ACM MM会议、 IEEE　VR 会议、IEEE TPAMI期刊，IEEE TIP期刊、IEEE TGRS期刊、IEEE
  TOM期刊，ISPRS-J期刊， CGF期刊等），授权国际专利一项，国内专利二十余项，并申请了国内专利多项。与Momenta公司成立无人驾驶环境感知联合实验室，为实验室负责人。

  研究方向

  计算机图形图像、计算机视觉、点云处理、深度学习、人工智能、无人驾驶环境感知等

