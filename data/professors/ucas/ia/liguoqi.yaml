bio_raw: '李国齐

  /

  2007-08--2011-08   新加坡南洋理工大学   博士

  2004-09--2007-07   西安交通大学   硕士

  2000-09--2004-07   西安理工大学   学士

  职　　称:

  研究员、博士生导师

  电子邮件:

  guoqi.li@ia.ac.cn

  个人简历

  李国齐，中国科学院自动化所研究员、国家杰出青年基金获得者， 在Nature、Nature 子刊、Science 子刊、Proceedings of the IEEE、TPAMI等期刊和会议上发表论文 200余篇；主持国家自然科学基金重点项目、联合重点项目、科技部重点研发课题、北京市科委项目等20余项；担任IEEE
  TNNLS、IEEE TCDS、清华大学学报-自然科学版等多个国际期刊编委；曾入选北京市杰青、北京市智源学者，中国算力十大青年先锋人物、中国智能计算科技创新人物。

  研究方向

  类脑智能，类脑计算

  承担科研项目情况

  （ 1 ） 面向异构融合类脑芯片的计算架构研究, 负责人, 地方任务, 2021-12--2024-12

  （ 2 ） 基于多模态类脑芯片的模型构建与创新架构研究, 负责人, 国家任务, 2018-10--2023-12

  （ 3 ） 面向神经形态系统的离散态深度网络在线学习理论, 负责人, 国家任务, 2019-01--2022-12

  （ 4 ） 融合注意力机制的大规模脉冲神经网络模型与算法研究, 负责人, 国家任务, 2021-10--2024-10

  （ 5 ） 基于神经可塑性的类脑在线学习理论与方法, 负责人, 国家任务, 2023-01--2027-12

  （ 6 ） 异构融合类脑计算芯片及系统研究, 负责人, 国家任务, 2023-01--2026-12

  （ 7 ） 通用类脑计算模型与架构, 负责人, 国家任务, 2024-01--2028-12

  代表论著

  [1]H. Zheng, Y. Wu, L. Deng, Y. Hu and G. Li*, Going deeper with directly-trained
  larger spiking neural networks, Proceedings of the AAAI Conference on Artificial
  Intelligence (AAAI-21), pp. 11062-11070, 2021.

  [2]M. Yao, G.Zhao, H. Zhang, Y. Hu, L. Deng, Y.Tian,  B. Xu, G. Li,Attention Spiking
  Neural Networks, IEEE Transactions on Pattern Analysis and Machine Intelligence,
  2023, 45(8): 9393-9410;

  [3]M. Yao, J. Hu, Z. Zhou, L. Yuan, Y. Tian, B. Xu, G. Li*,Spike-driven Transformer,
  37th Conference on Neural Information Processing Systems (NeurIPS 2023), Accepted,
  2023.

  [4]L. Deng, G. Li*, H. Song, Y. Xie and L. Shi, Model Compression and Hardware Acceleration
  for Neural Networks: A Comprehensive Survey, Proceedings of the IEEE, vol. 108 (4),
  pp. 485-532, 2020.

  [5]W. Fang, Y. Chen, J. Ding, Z. Yu, T. Masquelier, D. Chen, L. Huang, H. Zhou,
  G. Li* and Y. Tian*, SpikingJelly: An open-source machine learning infrastructure
  platform for spike-based intelligence, Science Advances, Accepted, 2023.

  获奖及荣誉

  （1） 2023年中国算力十大青年先锋人物

  （2） 2022年DeepTech中国智能计算科技创新人物

  社会任职

  Associate Editor, IEEE Transactions on Neural Networks and Learning Systems

  Associate Editor, IEEE Transactions on Cognitive and Developmental Systems

  Associate Editor,Neuromorphic Computing and Engineering

  Associate Editor, Journal of Control and Decision

  Associate Editor, Frontiers in Neuroscience

  《控制与决策》编委'
