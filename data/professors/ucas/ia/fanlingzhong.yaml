  研究领域

  致力于绘制面向脑科学与脑疾病研究的新一代人类脑图谱(

  脑网络组图谱

  )，并建立其应用范式。聚焦特定认知功能的个体化脑图谱绘制，拟解决的关键科学问题包括：

  1. 如何利用机器学习、模式识别的方法，实现个体化脑图谱的构建；在此基础上，2. 如何解析特定认知功能的脑网络表征，为类脑智能研究提供借鉴？

  具体包括：利用多模态磁共振脑影像数据，发展个体化脑图谱绘制与验证的技术并构建可靠、稳定的个体化脑网络组图谱，并结合临床应用对图谱进行适用性评价；在此基础上，解析特定脑认知功能的脑网络表征，为理解脑的复杂功能提供帮助，进而为受脑科学知识启发的类脑智能研究提供借鉴。

