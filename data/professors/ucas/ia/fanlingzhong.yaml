  发表论文

  以主要完成人围绕脑网络组图谱的绘制方法、验证体系与适用性评价开展了系统研究，成功绘制出全新的人类脑图谱。目前，已在国际期刊，包括Cerebral Cortex、Human
  Brain Mapping、Journal of Neuroscience、NeuroImage等杂志上发表SCI收录论文共40余篇，第一（共同第一） 作者SCI论文14篇，已发表论文被引用2180余次(Google
  scholar H-index 22)。

