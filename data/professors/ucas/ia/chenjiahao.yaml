  个人简历

  陈

  嘉浩，中国科学院自动化研究所副研究员，从事仿人肌肉骨骼机器人、脑启发式运动控制和强化学习领域的研究。搭建了仿人骨骼、关节结构和肌肉驱动方式的肌肉骨骼机械臂，针对仿人肌肉骨骼机械臂中存在的高冗余、强耦合和强非线性控制难点，研究并提出了一系列受人体运动皮层-小脑-脊髓-肌肉协同激活机制启发的运动控制，强化学习，sim2real，柔顺和灵巧操作，和多任务持续学习方法。

  基于相关研究成果，近五年在IEEE TCYB、TSMCA、TMech、TASE、TCDS等国际SCI期刊上以第一/通讯作者发表论文11篇，发表位列本领域引用前1%的ESI高被引论文4篇（3篇第一作者），授权专利9项，相关成果获国内外院士、专家的广泛引用；主持国家自然科学基金青年科学项目，国家自然科学基金重大项目子课题，国家重点实验室青年基金等；获中国科学院优秀博士学位论文奖，北京市优秀博士学位论文提名奖，CAA-A类国际会议IEEE
  ICARM 2022机电一体化最佳论文(第一作者)，中国自动化学会技术发明一等奖等；目前担任SCI国际期刊Robotic Intelligence and Automation的Editorial
  Assistant，中国自动化学会机器人智能专业委员会副秘书长，曾任IEEE Robotics and Automation Society学生活动委员会全球联合主席。

  研究方向

  肌肉骨骼机器人，脑启发式运动控制，强化学习，类脑智能机器人，持续学习

