  荣誉及奖励

  2004年以第二完成人获北京市科学技术奖(基础研究类)一等奖。2008年以第一完成人获北京市科学技术奖(基础研究类)二等奖。2012年以第一完成人获北京市科学技术奖(技术发明类)一等奖。2013年以第一完成人获北京市发明专利奖一等奖、以第一完成人获中国专利优秀奖。2015年以唯一完成人获吴文俊人工智能科学技术奖一等奖。

  科研项目

  先后主持了国家自然科学基金重点项目、重大国际合作项目、通用联合基金重点支持项目、应急管理项目、国家杰出青年基金项目，国家863重点专项项目、目标导向类课题，国家242信息安全计划重点课题、中国科学院前沿科学重点研究项目、对外合作重点项目，北京市自然科学基金重点项目、海淀原始创新联合基金重点研究专题项目、重点国际合作项目等三十余项科研项目。'
