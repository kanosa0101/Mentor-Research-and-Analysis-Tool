research_direction_raw: 主要研究方向为人工智能安全、大模型安全等。作为项目负责人或者技术负责人，先后承担国家重点计划课题、工信部大模型服务平台等国家项目。相关研究成果发表在ACL、ICML、AAAI、EMNLP等知名国际学术会议。荣获钱伟长中文信息处理科学技术奖一等奖、中国网络空间安全协会2024十大优秀网络安全创新成果。入选中国科学院青年创新促进会。
