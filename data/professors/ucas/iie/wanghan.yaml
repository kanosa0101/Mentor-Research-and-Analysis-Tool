research_direction_raw: 王晗，现任中国科学院信息工程研究所副研究员，国家“优青”基金获得者。主要从事全同态密码算法的设计分析与应用，作为中科院先导项目的课题负责人和国家重点研发计划子课题负责人参与多个重大科研项目，在全同态算法、抗量子密码算法方面具有丰富的项目经验。科研方面的代表性成果包括：提出了新型同态等性检测方法，基于此方法设计出目前公钥尺寸最小的格基IBE方案和复杂度最低的函数自举算法、提出了可以打包GSW自举算法
