bio_raw: '王晨曦，中国科学院计算技术研究所，博士生导师。研究方向为面向数据中心构建跨编程语言、运行时、操作系统的人工智能系统、云计算系统软件。其研究成果发表在了OSDI、SOSP、PLDI、NSDI等系统领域顶级会议，以及TOCS等系统领域顶级期刊，并获得了OSDI
  2022 最佳论文奖、ACM Chinasys 新星奖、国家级青年人才等荣誉。此外，王晨曦还担任了OSDI、SOSP、ASPLOS、NSDI、PLDI、TACO等国际学术会议和期刊的评委。

  ----------

  2022年6月 — 今：中国科学院计算技术研究所，副研究员

  2018年10月 — 2022年5月：加州大学洛杉矶分校（UCLA），博士后

  2013年9月 — 2018年7月：中国科学院计算技术研究所，博士

  2009年9月 — 2013年7月：天津大学，计算机学院，本科'
