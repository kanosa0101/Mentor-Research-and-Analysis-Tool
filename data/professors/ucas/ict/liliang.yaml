bio_raw: '李亮，研究员，博士生导师，国家优秀青年基金获得者，中科院青创会会员。研究领域为生成式人工智能、多模态学习和大模型，发表CCF-A类期刊和会议论文90余篇，谷歌引用7000余次，获国际会议最佳论文奖4次（包括CCF-A类顶会ACM
  MM2024最佳论文奖），6项工作入选ESI高被引论文，编写译著1部；主持/参与科技部科技创新2030重大项目、973课题、NSFC应急管理重点项目、NSFC优青/面上/青年项目等20余项，担任中科院1区TOP期刊IEEE
  TMM等6个国内外期刊编委，CCF-A类级议ACL/NeurIPS/ICLR/AAAI/ACM MM领域主席，中国图象图形学学会多媒体专委会副秘书长和中国人工智能学会智能成像专委会副秘书长，参与组织15国内外学术会议。获2025年教育部技术发明一等奖、2024年中国图象图形学学会青年科学家奖、2022年浙江省科技进步一等奖、2020年吴文俊人工智能自然科学一等奖、2013中科院院长奖、2012年计算所所长特别奖、2008年亚太大学生机器人大赛国内赛和国际赛冠军。参与起草发布了全球首个内容自动化生产标准《机器生产内容自动化分级》，相关技术在华为、淘宝、大华、华数传媒等公司使用，服务于2022北京冬奥会等任务。

  2024年11月 — 至今：中科院计算所，研究员

  2017年9月 — 2024年11月：中科院计算所，副研究员

  2016年5月 — 2017年9月：中科院计算所，助理研究员

  2013年6月 — 2016年5月：中国科学院大学，博士后

  2008年7月 — 2013年6月：中国科学院计算技术研究所，工学博士

  2004年9月 — 2008年7月：西安交通大学，电信学院，工学学士'
