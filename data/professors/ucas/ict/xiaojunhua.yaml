bio_raw: 2008年于中国科学院计算技术研究所获工学博士学位。现为中国科学院计算技术研究所副研级高工。主要研究方向为计算机体系结构和微处理器设计，从事龙芯高性能处理器的研制，参与处理器结构设计、处理器性能分析、逻辑设计和处理器前瞻技术研究等。参与多项国家重大科研项目。出版教材1部，发表论文20余篇，曾获得中国计算机学会王选奖一等奖。
