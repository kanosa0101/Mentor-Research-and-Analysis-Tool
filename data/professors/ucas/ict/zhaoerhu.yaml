bio_raw: '赵二虎，男，博士，高级工程师，研究生导师，主要从事嵌入式智能计算系统、专用计算机系统、处理器微体系结构等方面的研究、教学和工程应用工作，专项中心智能计算平台研究组组长，成功研制领域首款专用智能计算机，突破了异构协同、全国产化、抗恶劣环境等关键技术，解决了强约束条件下多业务多模型实时智能加速难题，研究成果获得领域数十家单位的实质性应用。

  2021

  年获评中国科学院技术支撑人才。'
