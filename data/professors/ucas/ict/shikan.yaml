  国际基金会技术委员会委员，

  OpenHW

  亚洲工作组常委。曾任英特尔公司英国研发中心资深芯片设计工程师，兼任英特尔研究院研究科学家。研究聚焦

  FPGA

  、芯片敏捷设计与验证、云数据中心体系结构等，作为核心成员参与研发了英特尔首个数据处理器

  IPU

  并量产，曾获

  MICRO Top-Picks

  论文奖、两次获

  HiPEAC

  论文奖，一次最佳论文提名（

  FPT

  ），担任

  FPGA

  领域多个国际会议的

  TPC

  成员。独立出版中文著作《详解

  FPGA

  ：人工智能时代的驱动引擎》。'
