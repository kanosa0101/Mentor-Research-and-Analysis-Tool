bio_raw: 从事虚拟现实和智能人机交互技术研究，当前主要围绕动态开放世界三维建模与仿真开展智能算法研究。目前是CCF高级会员、CCF虚拟现实专委会委员、中国仿真学会青工委委员、CICC虚拟现实与人机交互专委会委员。研究成果受到公共安全、机器人、建筑设计、计算机仿真等多个交叉学科领域学者的引用和关注，自主研发的软件平台，在农业、交通、航天、电力、互联网等领域成功进行示范应用。
