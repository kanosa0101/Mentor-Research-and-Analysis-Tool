email: yinlongxiang@ict.ac.cn
bio_raw: '长期从事智能计算系统设计与优化相关工作。带领团队基于飞腾及海光CPU、寒武纪NPU、复旦微FPGA等国产关键算力器件完成多型智算系统原型研制，攻关高算力密度集成关键技术，服务工业智能、星载智能领域应用，基于科学院自研存算芯片完成OAM规范的存算一体智算系统原型研制，攻关存算芯片系统级集成关键技术。在DAC、EDL、IEDM等计算机与电子信息领域高水平期刊会议上发表论文20余篇。

  2021年9月 — 今：中国科学院计算技术研究所，高级工程师

  2018年7月 — 2021年9月：

  中国科学院计算技术研究所

  ，助理研究员

  2012年9月 — 2018年7月：北京大学，信息科学技术学院，博士生

  2008年9月 — 2012年7月：西北工业大学，软件与微电子学院，本科生'
