bio_raw: '叶剑，男，博士，现任中国科学院计算技术研究所高级工程师、硕士研究生导师，中国计算机学会普适计算专委会委员。作为负责人承担了国家重点研发计划、国家自然科学基金、国家

  863

  计划、国家科技支撑、国家科技基础条件平台等多项国家级课题的研究工作，并参与

  20

  余项国家和省部级课题的研究工作。在国内外期刊和国际会议发表论文

  70

  余篇，申请国家发明专利

  15

  项，软件著作权登记

  8

  项，曾获教育部科技进步一等奖、北京市科学技术一等奖和第十四届全国发明展览会金奖。目前担任国家自然科学基金和北京市自然科学基金网评专家，北京市朝阳区科委特聘评审专家，在人工智能、工业互联网和大数据等多个领域有深入的研究。'
