bio_raw: 李拓，中国科学院计算技术研究所处理器芯片全国重点实验室（原计算机体系结构国家重点实验室）副研究员、硕士生导师。2014年在新南威尔士大学获得计算机科学与工程博士学位，之后留校从事研究工作，期间担任新南威尔士大学网络安全研究中心（UNSW
  IFCYBER）学术成员，于2023年加入中国科学院计算技术研究所。围绕计算机体系结构、硬件设计、安全、容错等领域，已发表论文20余篇，主要成果发表在IEEE
  Transactions on Computers、IEEE Transactions on Dependable and Secure Computing、Design
  Automation Conference(DAC)、International Conference on Computer-Aided Design(ICCAD)、Design
  Automation and Test in Europe(DATE)等领域内国际顶级会议和期刊。曾担任ASP-DAC 2024会议的技术委员会成员和分会场主席。长期担任CCS、DAC、ICCAD、IEEE
  TCAD、IEEE TDSC、IEEE TVLSI等领域内高影响力会议和期刊的审稿人，并参与RISC-V Rocket Chip和香山（XiangShan）等开源社区贡献。
