bio_raw: '谭光明，中国科学院计算技术研究所研究员、博士生导师、高性能计算机研究中心主任、国家杰出青年基金获得者，参与了曙光系列高性能计算机包括曙光

  4000/5000/6000/7000

  系统研制。发表学术论文

  100

  余篇，包括

  CCF A

  类会议（

  SC

  、

  PPoPP

  、

  PLDI

  ）和

  Nature

  子刊等，曾任

  IEEE TPDS

  编委和多个国际会议的程序委员。曾获得国家科技进步奖二等奖、卢嘉锡青年人才奖和全国向上向善好青年称号等。'
