bio_raw: '王喆，计算机系统结构专业博士。主要研究方向是计算机系统安全，包括体系结构安全、系统虚拟化安全、操作系统安全、软硬件漏洞挖掘与利用等。现阶段主要的研究兴趣是系统安全与程序分析、编译、操作系统、虚拟化和体系结构的交叉研究。主持

  1

  项国家自然科学基金青年基金，同时作为骨干人员，承担多项国家

  863

  计划、国家自然科学基金重点项目、北京市科委重大专项、国防装备研发计划。近年来在计算机安全、软件工程和操作系统等领域的顶级国际会议和期刊上发表

  CCF-A

  类论文

  10

  余篇，包括

  IEEE Security & Privacy

  （

  Oakland

  ）、

  USENIX Security

  、

  USENIX ATC

  、

  ACM CCS

  、

  ACM ISSTA

  、

  IEEE TCAD

  、

  IEEE TDSC

  、

  IEEE TSE

  等。曾获

  2021

  年度国科大

  “

  领雁

  ”

  金奖、

  2020

  年度计算所

  “

  卓越之星

  ”

  等奖项和称号。

