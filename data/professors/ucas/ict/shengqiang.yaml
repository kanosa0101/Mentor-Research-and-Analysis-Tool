bio_raw: '盛强，中国科学院计算所副研究员、硕导，长期从事虚假和伪造内容鉴别、AIGC安全研究，近期主要关注AI生成虚假信息检测、AI信息污染的识别分析、AI生成内容的检测与溯源。在NeurIPS、ACL、AAAI、TKDE等国际会议期刊发表论文三十余篇，谷歌学术引用2400余次，多篇论文入选各会议期刊近五年引用TOP100（2025年8月）。连续担任ACM
  MM、ACL Rolling Review领域主席和NeurIPS等顶级会议审稿人，八次获评优秀，在CCF-A类会议SIGIR 2024和MM 2025主讲虚假信息检测三小时讲习班。曾获中国科学院院长奖、计算所所长特别奖、计算所“卓越之星”等荣誉。

  2025年11月至今：中国科学院计算技术研究所，副研究员

  2023年6月至2025年10月：中国科学院计算技术研究所，助理研究员

  2018年9月至2023年6月，中国科学院大学，工学博士

  2014年9月至2018年6月，北京邮电大学，工学学士'
