bio_raw: '邢晶，1982年1月出生于山东省德州市。

  2013年10月至今，中国科学院计算技术研究所，副研究员

  2011年7月-2013年9月，中国科学院计算技术研究所，助理研究员

  2004年9月-2011年7月，中国科学院计算技术研究所，计算机系统结构专业，硕博连读

  2000年9月-2004年7月，湖南科技大学，计算机科学与技术专业，本科'
