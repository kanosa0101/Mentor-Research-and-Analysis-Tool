bio_raw: '山世光，中国科学院计算所所务委员、研究员、博导，中国科学院大学岗位教授，计算所智能信息处理重点实验室主任，智能算法安全全国重点实验室副主任。他是IEEE
  Fellow，万人领军，基金委优青，国家百千万人才工程有突出贡献中青年专家，国务院特殊津贴专家，首届腾讯科学探索奖获得者，CCF青年科学家奖获得者。

  他的研究领域为人工智能，特别是计算机视觉、模式识别、深度学习、情感计算、大模型架构及垂域化、AI安全、AI4Science等。研究成果获2005年度国家科技进步二等奖，2015年度国家自然科学二等奖，2022年度CSIG自然科学一等奖，2024年度CSIG自然科学一等奖。他带领团队研发的人脸识别、图像理解等多种人工智能技术已应用于众多产品或系统中，取得了良好的经济和社会效益。

  他曾担任亚洲计算机视觉会议ACCV2022的大会共同主席，IEEE Face & Gesture国际会议的大会共同主席；曾应邀担任过CVPR, ICCV, ECCV,
  NeurIPS, ICML, AAAI, IJCAI, ACCV, WACV等数十次领域主流国际会议的领域主席。现/曾任IEEE TIP, CVIU, PRL,
  Neurocomputing, FCS等国际学术刊物的编委(AE)，以及《电子学报》、《中国图像图形学学报》、《计算机研究与发展》等国内期刊的编委。他是CCF青年工作委员会副主任、CAAI模式识别专委会副主任，CCF计算机视觉专委会常务委员，CSIG情感计算与理解专委会常务委员，曾任CAAI情感智能专委会副主任。他还是视觉与学习青年研讨会（VALSE）的共同发起人，VALSE指导委员会轮值主席。

  个人经历：

  2025年1月至今：智能算法安全全国重点实验室 副主任

  2011年11月至今：计算所智能信息处理重点实验室副主任/常务副主任/主任

  2014年1月-2014年12月：卡内基梅隆大学，访问学者

  2010年9月至今：中国科学院计算所，研究员

  2005年10月 – 2010年08月：中国科学院计算所，副研究员

  2004年08月 – 2005年09月：中国科学院计算所，助理研究员

  1999年09月 – 2004年07月：中国科学院计算所，博士生

  1997年09月 – 1999年07月：哈尔滨工业大学计算机学院，硕士生

  1993年09月 – 1997年07月：哈尔滨工业大学计算机学院，本科生'
