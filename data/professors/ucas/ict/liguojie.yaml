bio_raw: '李国杰，1943年5月生，1968年毕业于北京大学，1981年获中国科学院工学硕士学位，1985年获美国普渡大学博士学位。1987年回国工作于中国科学院计算技术研究所，1989年被聘为研究员。1990年被聘为国家智能计算机研究开发中心主任,1995年任曙光公司董事长兼总经理,1999年12月至2011年7月任中国科学院计算技术研究所所长。1995年当选中国工程院院士，2002年当选第三世界科学院院士。

  主要从事计算机体系结构、并行算法、人工智能、计算机网络等方面的研究，发表论文100多篇，合著英文专著4本，出版了报告论文集《创新求实录》。

  长期从事国家863计划高技术研究，现任国家“973计划”项目首席科学家。主持研制成功曙光1号并行计算机、曙光1000大规模并行机和曙光2000/曙光3000超级服务器,领导研制成功曙光4000超级服务器、曙光5000A高效能计算机，其中，曙光1号获1994年中国科学院科技进步特等奖和1995年国家科学技术进步二等奖；曙光1000获得1996年中国科学院科技进步特等奖和1997年国家科学技术进步一等奖。曙光2000和曙光3000分别获得2001年和2003年国家科技进步二等奖。领导计算所研制成功龙芯高性能通用CPU。

  1994年获得首届何梁何利基金科技进步奖，1995年被评为国家级有突出贡献的中青年专家，1999年获潘文渊研究杰出奖，2000年被评为全国先进工作者，2001年获得美国普渡大学电机学院杰出校友奖，2006年获得首届信息界学术大会最高学术大奖。

  第九届、十届全国人大代表，中共十七大代表。1999年12月至2011年7月任中国科学院计算技术研究所所长,兼任曙光公司董事长、中国计算机学会理事长、国家信息化专家咨询委员会信息技术与新兴产业专委会副主任、英文版学报《Journal
  of Computer Science and Technology》主编、中国科学院学位委员会副主席、中国科大计算机学院院长等职。'
