bio_raw: '张儒清，博士，中国科学院计算技术研究所副研究员，荷兰阿姆斯特丹大学访问学者，中国科学院青促会会员，中国科学院计算所学术新百星。长期从事信息检索、自然语言处理方向的研究，在本领域国际重要学术会议与期刊上发表学术论文60余篇（如SIGIR、ACL、NeurIPS、WWW、KDD等），获得EMNLP
  2024最佳论文奖（第一指导老师，唯一中国大陆团队）、NeurIPS 2024 Spotlight（Top 2.08%，第一指导老师）、全国信息检索大会CCIR优秀学生论文奖（一作）/最佳论文候选（第一指导老师）。

  主持中国科学院先导B课题、重点研发计划课题、国自然面上项目、国自然联合基金课题等；相关成果获得2024年钱伟长中文信息处理科学技术奖自然科学类一等奖；个人入选北京市“高创计划”青年人才托举工程、CCF优秀博士学位论文奖提名等；指导及联合指导的学生多次获得国家奖学金、计算所所长特别奖、中国科学院院长奖等。

  联合组织国际首届生成式信息检索论坛（SIGIR）、首届生成式信息检索讲习班（SIGIR-AP）、首届鲁棒信息检索论坛（SIGIR）以及首届鲁棒信息检索讲习班（SIGIR），担任中文信息学会信息检索专委会委员、计算机学会女工委委员、以及国内外多个会议程序委员会（高级）成员。相关成果在国际著名大学和科研机构参与的深度学习检索以及语义检索评测任务中，共6次获得第一名；研究形成的相关成果应用于国家相关业务单位以及百度搜索、今日头条、淘宝搜索、腾讯微信等互联网产品；

  2022年9月 — 今：中国科学院计算技术研究所，副研究员

  2022年10月 — 2023年10月：荷兰阿姆斯特丹大学，访问学者

  2019年7月 — 2022年9月：中国科学院计算技术研究所，助理研究员

  2014年9月 — 2019年7月：中国科学院计算技术研究所，博士生

  2010年9月 — 2014年7月：北京邮电大学，计算机学院，本科生'
