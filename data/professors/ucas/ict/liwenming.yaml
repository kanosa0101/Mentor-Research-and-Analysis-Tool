bio_raw: '李文明，研究员，博士生导师，中国科学院大学岗位教授。研究领域为数据流执行模型与微架构、数据流运行时与编译技术、高通量众核处理器芯片架构等，基于先进工艺成功流片多款数据流架构高通量处理器芯片，应用于数字信号、人工智能及视频处理等多领域融合高通量处理场景，取得了良好的经济和社会效益。在ISCA/HPCA/ASPLOS/DAC/TC/TPDS等高水平会议期刊发表论文50余篇，入选体系结构顶会ISCA2026
  Best Paper Candidate，申请专利80余项（已授权近50项）。主持国家重点研发计划项目、北京市科技新星计划、国自然青年基金、北自然联合基金、以及华为/中移动/空天院/之江实验室等联合项目。担任国科大本科生《数字电路》课程召集人及主讲教师。入选北京市科技新星计划，获北京市技术发明一等奖、中国产学研合作促进二等奖等奖励。

  教育及工作经历：

  2025年10月— 今：中国科学院计算技术研究所，研究员

  2018年10月 — 2025年9月：中国科学院计算技术研究所，副研究员

  2016年7月 — 2018年9月：中国科学院计算技术研究所，助理研究员

  2010年9月 — 2016年7月：中国科学院计算技术研究所，硕博连读

  2006年9月 — 2010年7月：山东科技大学，计算机科学与技术，本科生

  个人网页：

  http://people.ucas.edu.cn/~liwenming'
