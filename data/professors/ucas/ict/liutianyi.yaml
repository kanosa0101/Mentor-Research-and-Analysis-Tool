bio_raw: '刘天义，博士，中国科学院计算技术研究所副研究员。2022年于美国德克萨斯大学圣安东尼奥分校获得计算机科学专业哲学博士学位，并入选华为天才少年计划回国。2024年获得深圳市“鹏城优才”称号。从事计算机体系结构、云渲染系统、大模型系统等方面的研究。

  2025年9月 — 今：中科院计算所，副研究员

  2022年10月 — 2025年8月：华为，软硬件协同设计技术助理首席专家

  2017年8月 — 2022年8月：美国德克萨斯大学圣安东尼奥分校，博士生

  2014年9月 — 2017年7月：中国科学院大学，中科院计算所，硕士生

  2010年9月 — 2014年7月：河南大学，计算机与信息工程学院，本科生'
