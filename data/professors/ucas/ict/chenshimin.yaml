bio_raw: '<\/p>\n

  陈世敏，中科院计算所研究员，在清华大学计算机系获学士和硕士学位，在美国

  Carnegie Mellon University<\/span>获得计算机科学博士学位。主要研究方向为数据库系统和大数据处理。论文发表在包括

  SIGMOD, ISCA, VLDB, ASPLOS, ICDE, CIDR<\/span>等顶级国际会议和

  ACM TODS, IEEE TKDE<\/span>等顶级国际期刊，并获得

  ICDE\''04 Best Paper<\/span>，

  SIGMOD\''01 Runner-up Best Paper<\/span>，和

  2008<\/span>年体系结构国际会议年度顶级论文奖（

  Top Picks\''08<\/span>）。担任

  PVLDB 2017<\/span>，

  ICDE 2018<\/span>，

  ICDCS 2016<\/span>，

  CIKM 2014<\/span>等会议的

  PC Area Chair<\/span>，在

  ICDE<\/span>担任多届大数据新硬件技术的主要

  Workshop HardBD&Active<\/span>的

  Co-Chair<\/span>。在中国科学院大学担任岗位教授，讲授研究生

  “<\/span>大数据系统与大规模数据分析

  ”<\/span>课程和本科

  “<\/span>数据库系统

  ”<\/span>课程。<\/span><\/p>\n

  <\/p>'
