bio_raw: '中国科学院计算技术研究所副研究员，硕士生导师。主要研究基于计算机视觉的情感感知与理解方法，重点关注人脸表情分析、视线估计及其在孤独症早期客观评估等方面的应用。分别于

  2011

  年和

  2017

  年获北京航空航天大学工学学士和工学博士学位，

  2013-2015

  年访学于美国卡内基梅隆大学。主持

  2

  项国家自然科学基金

  (

  青年基金

  1

  项、面上项目

  1

  项

  )

  ，参与中科院国际合作项目等。在包括

  IEEE T-PAMI

  、

  IEEE T-IP

  、

  CVPR

  、

  ICCV

  、

  ECCV

  在内的领域内高水平期刊和会议上共发表论文

  20

  余篇，入选

  2020

  年度

  IEEE TIP

  下载量前

  25

  文章，获得相关国际学术竞赛冠军

  2

  次，中科院计算所优秀科研人员

  (2020

  年

  )

  ，担任

  IEEE T-PAMI

  、

  IEEE T-IP

  、

  IEEE T-AC

  、

  CVPR

  、

  ICCV

  、

  ECCV

  、

  ICLR

  等国际期刊和会议审稿人。

