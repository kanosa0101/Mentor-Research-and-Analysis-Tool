title: 副研究员
email: sunxiaoping@ict.ac.cn
bio_raw: '孙晓平于

  2007

  年中科院计算所毕业获得博士学位。研究方向为人工智能和文本语义计算，包括文本语义网络分析，文本摘要、分类、聚类，以及自然语言文本语义表达模型研究。成果已在

  IEEE Trans. on KDE

  ，

  IEEE Trans. on PDS

  ，

  FGCS

  ，

  CCPE

  等

  SCI

  国际刊物，以及

  WWW, ACL, CIKM

  等国际会议上发表。担任

  CloudCom2010-2013, CoopIS2009-2013

  ，

  APWeb-WAIM 2009

  和

  CIKM2010-2011

  等国际会议程序委员会委员。主持承担一项国家自然科学基金面上项目。参与

  973

  ，国家科技支撑项目，

  863

  项目，以及科技部重点研发项目。获

  2007

  年度北京市科技进步奖三等奖（第二完成人）'
