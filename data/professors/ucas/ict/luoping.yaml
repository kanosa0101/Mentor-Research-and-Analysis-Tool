title: 副研究员
supervisor: 博导
bio_raw: '研究兴趣主要集中在数据挖掘、人工智能、机器学习等相关领域的智能算法与模型研究，特别是富格式文档的语义认知计算，包括文档识别与理解、自然语言和表格的语义理解，并关注智能技术在金融、互联网领域的创新应用。近年，在数据挖掘、人工智能、大数据等领域的多个顶级国际会议（SIGKDD、NeurIPS、IJCAI、WWW、ICED、CIKM、ICDM）和期刊（TKDE、TIT、
  TKDD）上发表80多篇高质量论文；其中CCF A类期刊和会议论文近40篇；中国计算机学会优秀博士论文获得者；所指导的学生论文获得第21届国际信息和知识管理大会（CIKM
  2012，CCF B类）“最佳学生论文”奖，并两次获得数据挖掘领域国际主流学术会议“最佳论文提名奖”（CIKM 2010、SDM 2010）；曾任SIGKDD的Poster
  Session Chair, ICDM的Poster Session CHair，SIGKDD, ICDM, NLPCC等会议的领域主席，拥有10余项美国专利。同时，结合多年学术界和工业界的经验，曾为多个知名企业（腾讯、百度、上交所等）提供技术咨询，牵头撰写证监会监管科技3.0中“金融文档语义理解”行业工程方法建议书，在金融文档分析方面的工作获聘港交所证券期货业金融科技研究发展中心顾问。

  欢迎有志于研究的学生报考我的研究生（硕士、博士）！'
