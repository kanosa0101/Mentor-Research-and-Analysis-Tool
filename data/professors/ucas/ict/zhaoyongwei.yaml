bio_raw: '赵永威，2015年于华中科技大学获工学学士学位，2020年于中国科学院计算技术研究所获工学博士学位，现任中国科学院计算技术研究所副研究员。研究方向为智能处理器体系结构，在ISCA、MICRO、ASPLOS等CCF-A类会议和期刊上发表论文30余篇。曾获中国计算机学会优秀博士学位论文奖、MICRO
  2022最佳论文奖提名等荣誉。

