bio_raw: '2013年10月-现在，中国科学院计算技术研究所，高级工程师三级，普适计算研究中心自然人机交互课题组组长；

  2008年7月-2013年9月，中国科学院计算技术研究所，助理研究员一级，普适计算研究中心自然人机交互课题组组长；

  2007年7月-2008年7月，中国科学院计算技术研究所，助理研究员二级；

  2002年9月-2007年7月，中国科学院计算技术研究所，计算机应用技术，工学博士；

  1998年9月-2002年7月，内蒙古大学，计算机科学与技术，工学学士

  研究兴趣：

  语音识别，研究融合用户反馈的语音识别自适应学习技术；人机交互技术，研究基于音频和语音的新型终端人机交互技术；音频信号处理、音频检索和音频内容分析；残疾人人机交互和信息无障碍技术等；

  最新更新参见国科大教师主页：

  http://210.76.211.71/~wangxiangdong'
