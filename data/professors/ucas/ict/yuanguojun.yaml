bio_raw: '元国军，博士，硕士生导师，主持中科院先导B课题、科技创新2030课题、专项项目、面上基金等10多项研发任务，参与曙光6000、曙光7000超算网络架构和芯片研制，发表包括ISCA/SIGCOMM/SC/OFC/ECOC/ToN/TC/JOCN在内的计算机体系结构和网络领域论文40多篇，申请发明专利50余项，曾获得2023年中国电子学会科技进步二等奖（排名第2）和2024年北京市技术发明二等奖（排名第3）。

  2016年9月 — 今：中国科学院计算技术研究所，高级工程师

  2010年9月 — 2016年9月：中国科学院计算技术研究所，工程师

  2009年2月 — 2010年9月：中国科学院计算技术研究所，助理工程师

  2008年4月 — 2009年1月：奇梦达存储产品研发中心，研发工程师'
