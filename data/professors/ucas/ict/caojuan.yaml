bio_raw: '曹娟，研究员，博士生导师，中国科学院计算所前瞻研究实验室主任、数字内容合成与伪造检测实验室主任，中国科学院大学岗位教授，中国科学院“青年促进会”首批成员。获2024年公安部科学技术一等奖、2020年北京市科技进步一等奖、2020年北京市“三八红旗奖章”和2022年“世界互联网大会领先科技成果”奖。长期从事人工智能安全、虚假伪造信息检测、多媒体技术研究，在领域内主流期刊和会议发表论文100余篇，

  谷歌引用1万余次，其中第一作者单篇最高引用1175次。申请专利100余项，其中授权44项。主持国家级重点项目11项，其中千万级项目2项。

  面向国家安全重大需求，带领团队从算法创新、系统搭建、设备研制三个层面长期布局，研发了“AI识谣”虚假新闻检测平台、“睿鉴图灵”伪造检测专用模型及基于国产芯片的伪造检测专用设备，成果在多个国家重大任务中规模化部署使用。

  2019-09 至今, 中国科学院计算技术研究所, 研究员，前瞻研究实验室副主任、主任

  2016-01 至今, 中国科学院大学, 计算机学院, 教授

  2010-11 至 2011-11, 美国哥伦比亚大学, 电子系，访问学者

  2009-05 至 2009-09, 香港城市大学, 计算机系，访问学者

  数字内容合成与伪造检测实验室以“用技术让世界更可信”为使命，长期专注于数字内容安全方面的基础方法研究与应用实践，承担计算所“十四五”规划重点方向研究，主要研究人员包括曹娟研究员、唐胜研究员、唐帆副研究员、汪旦丁副研究员、李瑜副研究员、盛强助理研究员。研究方向包括：

  1. 数字内容伪造检测与溯源：

  人工智能生成内容（AIGC）技术与应用蓬勃发展，不断涌现里程碑式突破，但其恶意利用也带来了新的公共安全隐患，严重威胁国家安全和社会稳定。依托实验室研发的专用系统，我们重点关注检测溯源中的可泛化、可部署、可解释问题。

  2. 多模态虚假信息检测与验证：

  虚假信息泛滥风险已连续两次位居《全球风险报告》短期风险榜首。基于“AI识谣”系统积累的丰富数据，我们从多模态理解、推理分析、影响度量等角度出发，深度挖掘虚假信息特性，力求实现快速、准确、有依据的虚假信息检测。

  3. 数字内容可控生成：

  研究图像视频的定制化生成与编辑技术，并针对数字人场景探索身份-外观-运动的一体化生成框架。此外，伪造检测与内容生成有一体两面的关系，我们希望依靠利用生成技术来打击恶意伪造内容，研究面向安全场景的数据保护、水印等手段，降低伪造内容产生的负面影响。

  研究生培养理念：注重培养学生的综合能力，强调从学科前沿到落地实用贯通，个人成长与团队作战并重，做“顶天立地”的科研工作。

  （更多研究分享见公众号“数字内容合成与伪造检测”）'
