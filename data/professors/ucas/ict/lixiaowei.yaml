bio_raw: '李晓维：现任中国科学院计算所研究员（二级）、博士生导师，中关村实验室双聘研究员；曾任计算机体系结构国家重点实验室常务副主任（2011-2021）、计算机系统结构中科院重点实验室常务副主任（2006-2011）。担任IEEE
  CS TTTC副主席、JCST副主编，中国计算机学会（CCF）第12届理事会监事长、CCF第10届理事会常务理事，中国计量测试学会常务理事、集成电路测试专业委员会主任。曾获国家技术发明奖和国家科技进步奖、中科院自然科学奖和杰出科技成就奖，数次获省部级科学技术奖和教学成果奖、国际会议和国际期刊最佳论文奖；入选“国家百千万人才工程”并获“有突出贡献中青年专家”荣誉称号。

  工作/教育经历：

  2000年9月-今：中科院计算所，研究员

  1993年9月-2000年8月：北京大学，计算机系，副教授

  1991年9月-1993年8月：北京大学，计算机系，博士后

  1988年9月-1991年7月：中国科学院大学（中科院计算所），博士生

  1985年9月-1988年7月：合肥工业大学，计算机与信息学院，硕士生

  1981年9月-1985年7月：合肥工业大学，计算机与信息学院，本科生'
