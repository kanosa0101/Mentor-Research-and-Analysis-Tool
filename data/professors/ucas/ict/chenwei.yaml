bio_raw: '长期从事机器学习基本理论与方法方向的研究，担任中科院战略性先导科技专项项目负责人，在深度学习机理、分布式优化、安全可信应用等方面取得科研成果，在本领域国际重要学术会议与期刊发表学术论文70余篇（如ICML、NeurIPS、ICLR等），入选2021年度福布斯中国科技女性榜、2023年度麻省理工科技评论智能计算创新人物、2024年度中国科学院大学小米青年学者。担任本领域主要学术会议ICML、NeurIPS、AAAI的程序委员会高级领域主席、领域主席等。

  2022年2月 — 今：中国科学院计算技术研究所，研究员

  2011年7月 — 2022年2月： 微软亚洲研究院，Associate Researcher，Researcher，Lead Researcher，Principal
  Research Manager

  2006年9月 — 2011年7月：中国科学院数学与系统科学研究院，博士

  2002年9月 — 2006年7月：山东大学，数学与系统科学学院，学士'
