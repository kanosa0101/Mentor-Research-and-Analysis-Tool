bio_raw: '纪雯，博士、研究员、博士生导师。2007年进入中国科学院计算技术研究所从事博士后研究，出站后继续留所从事研究工作，先后任助理研究员（2009）、副研究员（2010）、研究员（2017）。2009年到香港理工大学、2014年和2018年到美国普林斯顿大学进行学术访问。研究方向为视觉处理器和多媒体系统，包括高性能视觉处理器、多媒体端边云计算系统、视觉编码与传输、智能多媒体计算、低碳计算、媒体经济学、优化理论与方法等。主持承担过国家重点研发计划课题2项、国家自然科学基金3项、北京市自然科学基金重点专项1项、北京市自然科学基金3项等多项科研项目的研究。在国际相关领域著名期刊（IEEE
  TMC, IEEE TMM, IEEE WC等）和会议发表论文100余篇，授权30余项国家发明专利，主持制定了3项企业标准、参与制定了1项国家标准、组织并参与制定了1项团体标准及1项国际标准。研究成果获得2023年第二届中国西部巾帼科技创新大赛金奖，2017年中国计算机学会科学技术奖技术发明奖，2015年、2016年连续两年获北京市科学技术奖，2016年中国专利优秀奖等，研究成果在相关单位获得重要应用。研究成果还获得国际期刊IJCS2021年度最佳论文奖，国际会议ISPA2020杰出论文奖，国际会议Platcon2015和GameNets2014最佳论文奖等。纪雯研究员是全国专业标准化技术委员会TC28/SC42人工智能标准化技术委员会和TC352中文新闻信息标准化技术委员会委员、IEEE高级会员、中国计算机学会高级会员、IEEE
  Digital Retina Systems Working Group (3161 WG)工作组 Vice Chair副组长、新一代人工智能产业技术创新战略联盟AI标准工作组数字视网膜系统专题组联合组长，担任过多个国际知名期刊的Guest/Associate Editor。

  国科大个人网页：https://people.ucas.edu.cn/~jiwen

  2017年10月— 今：中国科学院计算技术研究所，研究员

  2018年10月— 2018年11月：美国普林斯顿大学，访问学者

  2014年02月— 2015年02月：美国普林斯顿大学，访问学者

  2010年10月— 2017年09月：中国科学院计算技术研究所，副研究员

  2009年12月— 2010年09月：香港理工大学，访问学者

  2009年07月— 2010年09月：中国科学院计算技术研究所，助理研究员

  2007年01月— 2009年07月：中国科学院计算技术研究所，博士后

  2002年03月— 2006年12月：西北工业大学，通信与信息系统专业，博士生

  2000年09月— 2003年04月：西北工业大学，通信与信息系统专业，硕士生'
