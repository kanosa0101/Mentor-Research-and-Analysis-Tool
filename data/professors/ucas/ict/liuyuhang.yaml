bio_raw: '2017年9月— 今 ：中国科学院计算技术研究所，副研究员，硕士生导师，

  《中国计算机学会通讯》专栏作家，中国计算机学会高级会员，

  中国计算机学会职业道德与伦理委员会常委，

  《计算机体系结构国家重点实验室快讯》编委

  2016年1月—2017年9月：中国科学院计算技术研究所，助理研究员

  2013年9月—2015年9月：美国伊利诺伊理工大学，计算机科学系，博士后

  2007年9月—2013年7月：北京航空航天大学，计算机学院，硕博连读生'
