bio_raw: '蒋鑫龙，副研究员、硕士生导师。2011年于北京邮电大学获得学士学位，2018年博士毕业于中国科学院计算技术研究所。研究方向为模联网与多智能体协同，及其在医学和教育领域的应用。现为CCF普适计算专委委员，CAAI智慧医疗专委委员，参与IEEE
  FML、XAI等标准制定。在IEEE TKDE，AAAI等人工智能与普适计算领域发表论文近五十篇，申请国家发明专利37项（授权16项），软件著作权7项。入选“北京市海淀区专家库”，获得“中科院青促会”人才计划。

  工作经历：

  2020年10月—今：中国科学院计算技术研究所，副研究员

  2018年7月—2020年9月：中国科学院计算技术研究所，助理研究员

  2011年9月—2018年7月：中国科学院计算技术研究所，博士生

  2015年9月—2016年9月：美国加州大学欧文分校，公派博士研究生

  2007年9月—2011年7月：北京邮电大学，信息与通信工程学院，本科生'
