bio_raw: '谢梦瑶，女，中国科学院计算技术研究所副研究员，硕士生导师，2022年于中国科学院计算技术研究所获计算机系统结构专业博士学位。长期从事程序分析与优化、计算机系统安全等研究，包括二进制代码的分析变换及优化、动态编译、操作系统安全、处理器安全增强设计等。相关成果在体系结构、系统安全等领域的顶级国际会议/期刊上发表CCF-A类论文10余篇，申请/授权专利9项。连续两年在ACM
  CCS(CCF-A)上获奖，分别是CCS 2022最佳论文提名奖和CCS 2023杰出论文奖。主持1项国家制高点任务子课题，经费1314万，同时作为骨干人员承担中科院战略性先导B项目、国家自然科学基金面上项目等。曾获CCF体系结构博士学位论文激励计划提名奖，担任2024年CCF体系结构博士交流与学术辅导会议主席。

  2024年11月 — 今：中科院计算所，副研究员

  2022年7月 — 2024年10月：中科院计算所，特别研究助理

  2015年9月 — 2022年6月：中国科学院大学，中科院计算所，博士生

  2011年9月 — 2015年6月：郑州大学，信息工程学院，本科生'
