bio_raw: '李晓东博士，现为中国科学院计算技术研究所研究员、博士生导师、互联网基础技术实验室主任。兼任清华大学公共管理学院教授、清华大学互联网治理研究中心主任。伏羲智库的创办人。

  中国互联网络信息中心（CNNIC）原主任，互联网名称与数字地址分配机构（ICANN）原副总裁，互联网域名管理技术国家工程实验室原主任。中国信息化百人会、中国服务质量智库、两山智库等成员。

  笃信“互联网改变世界”并致力于互联网基础资源、数据分析、网络安全和治理等方面的行业服务、技术创新和政策研究，曾推动创建了中国互联网博物馆、互联网名称与数字地址分配机构（ICANN）北京合作中心、互联网域名管理技术国家工程实验室、中科院计算所互联网基础技术实验室、清华大学互联网治理研究中心和国科大网络创新与发展研究中心等。

  2014年曾作为互联网数字分配机构（IANA）职能移交协调工作组（ICG）全球30人工作组成员，于2016年参与推动完成了全球互联网核心职能管理权的移交工作。

  曾负责了国家域名全球服务平台规划建设和关键系统的研制工作、中文域名标准化和“.中国”国家顶级域名入根、国家互联网大数据平台规划等工作。

  1998年毕业于山东大学计算机科学系，2001年于中国科学院计算机网络信息中心获硕士学位，2004年于中国科学院计算技术研究所获博士学位。2009年、2011年、2016年分别在清华大学经济管理学院、北京大学光华管理学院和斯坦福大学商学院参加了高级管理人员培训。'
