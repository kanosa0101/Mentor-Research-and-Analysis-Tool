bio_raw: '长期从事高可靠计算机、安全芯片研发，博士毕业于中科院计算所计算机体系结构国家重点实验室，在中国航天科工集团二院七〇六所工作了14年。CCF高级会员，CCF容错计算专委会和集成电路设计专委会委员，中国宇航学会会员。

  2021年9月 — 今：中科院计算所，高级工程师

  2013年9月 — 2021年12月；中国航天科工集团二院七〇六所，高级工程师

  2007年4月 — 2013年8月：中国航天科工集团二院七〇六所，工程师

  2010年9月 — 2015年2月：中科院计算所计算机系统结构专业博士研究生'
