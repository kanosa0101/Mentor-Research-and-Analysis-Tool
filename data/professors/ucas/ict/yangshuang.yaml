bio_raw: '杨双，博士，中科院计算所副研究员，硕士生导师。研究领域为计算机视觉、模式识别、机器学习，目前主要以视频中运动模式的挖掘与学习为具体研究对象进行基础研究与应用性研究工作。目前累计发表学术论文18篇，获授权发明专利7项，软著1项，合编著作1部。获中科院计算所“学术百星”(2017)；所指导的研究生获VIPL最佳新人奖(2018)、所指导的本科生获中国科学院大学优秀本科毕业论文(2019)；获ActivityNet
  Challenge@IEEE CVPR中ASD (Active Speaker Detection) 任务第二名(2019)；带队研发的唇语识别系统获评中国人工智能多媒体信息识别技术竞赛“创新之星”(2019)、CCTV《机智过人》节目专题报道(2018)。

  2020年9月 — 至今：中科院计算所，副研究员

  2016年7月 — 2020年9月：中科院计算所，助理研究员

  2011年9月 — 2016年7月：中科院自动化所，博士'
