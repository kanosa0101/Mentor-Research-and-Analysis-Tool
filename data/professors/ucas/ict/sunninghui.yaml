bio_raw: '1985.09-1989.07：北京大学计算机系学习，获学士学位

  1989.09-1992.07：中科院计算所学习，获硕士学位

  1995.09-1999.07：中科院计算所在职博士，获博士学位

  1996.06-1997.06：美国Princeton大学访问学者

  1997.07-1999.02：中科院计算所智能中心研发部副主任

  1999.03-2000.02：中科院计算所智能中心研发部主任

  2000.03-2002.02：中科院计算所高性能计算机室主任

  2002.03-2005.10：国家智能计算机研究开发中心主任

  2005.10-2009.06： 中科院计算所所长助理兼副总工程师、中科院计算所系统结构研究部主任、中科院计算机系统结构重点实验室主任

  2009.07-2011.07： 中科院计算所常务副所长

  2011.07-2020.09：中科院计算所所长

  2011.10 - 至今：计算机体系结构国家重点实验室主任、学术委员会副主任

  2019年当选为中国工程院院士

  2020.10 - 至今：中科院计算所学术所长'
