bio_raw: '许晶，工学博士，2017 年硕士毕业于西安电子科技大学后加入中国科学院计算技术研究所，长期从事高性能互连网络方向研究，作为骨干参与多代高性能互连网络芯片（包括交换芯片与网卡芯片）的研发工作，并在面向大模型训练与推理的网络优化方面开展系统研究，发表多篇论文/专利。

  2025.11~至今    中国科学院计算技术研究所，高级工程师

  2019.9~2025.10

  中国科学院计算技术研究所

  ，中级工程师

  2017.6~2019.9

  中国科学院计算技术研究所

  ，助理工程师

  2020.9~2025.6   中国科学院大学，博士'
