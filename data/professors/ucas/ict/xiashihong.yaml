bio_raw: '2015–现在，中国科学院大学，岗位教授；

  2011–现在，中国科学院计算技术研究所，研究员；

  2009–现在，中国科学院计算技术研究所，博士生导师；

  2007–2008，Carnegie Mellon University，计算机学院机器人研究所，访问学者；

  2004–2010，中国科学院计算技术研究所，副研究员；

  2002–2003，中国科学院计算技术研究所，助理研究员；

  1999–2002，中国科学院大学，软件与理论，工学博士；

  1996-1999，中国科学院大学，应用数学，理学硕士；

  1992-1996，四川师范大学，数学，理学学士；

  现任前瞻研究实验室人体运动仿真研究组组长，主要在计算机图形学、虚拟现实、人工智能方向从事人体运动建模仿真基础交叉研究，目前研究兴趣包括虚拟数字人与智能人形机器人。

  国科大导师个人主页链接：http://people.ucas.ac.cn/~xiashihong'
