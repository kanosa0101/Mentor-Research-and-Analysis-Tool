bio_raw: '<\/span><\/p>

  范鑫鑫，中国科学院计算技术研究所副研究员，研究方向涵盖：可信机器学习、LLM可解释性、算法博弈。主持国家自然基金、中科院先导课题等项目5项，经费总计900余万。在学术方面，在USENIX
  Security、 SIGKDD、WWW、CIKM、ACM CSUR (2024 IF=28, Ranked 1\/147 in Computer Science
  Theory & Methods)、IEEE TPDS、IEEE TMC、IEEE TSC、IEEE TCE、ACM TWEB、The Innovation (2023
  IF=33.2)、计算机研究与发展等一系列计算机学科最具影响力期刊 (ACM CSUR)、计算机安全领域四大顶会 (USENIX Security)等期刊会议上发表论文60余篇。其中，1篇获得了最佳论文奖\/Microsoft
  Award-Honorable Mention (SCC’18)，2篇获得最佳论文奖提名 (IPCCC\''17, KSEM\''18)。系统方面，研制了“智能算法安全分析平台”、“网络数据分析挖掘系统”，已部署应用于多个单位。<\/p>

  2021年10月 — 今：中科院计算所，副研究员<\/p>

  2017年4月 — 2021年9月：中科院计算所，助理研究员<\/p>

  <\/p><\/div><\/div>'
