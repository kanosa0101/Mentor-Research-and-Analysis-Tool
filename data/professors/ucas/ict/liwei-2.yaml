title: 副研究员
supervisor: 硕导
email: liwei@ict.ac.cn
bio_raw: '1999年于北京理工大学计算机系获得硕士学位，2007年在中科院计算所获得工学博士学位，现为中科院计算所副研究员，硕士生导师。主要研究方向为分布式系统、云计算、大数据处理以及信息物理融合系统（Cyber-Physical
  Systems）。目前已合作发表学术专著一部，杂志、会议论文近50篇。

  从

  2002

  年起，作为课题负责人或者作为主要参与人员承担了多项相关国家科研任务，包括：国家自然科学基金面上项目、国家自然科学基金重点项目、国家发改委

  CNGI

  示范工程项目、国家高技术研究发展计划（

  863

  ），国家基础研究计划（

  973

  ）等。曾任计算机研究与发展杂志特约编委，

  GCC 2006

  国际会议程序委员会委员，

  GCC

  、

  IEEE Cluster Computing

  等国际会议的评阅人，计算机研究与发展以及

  IEEE Transaction on Computers

  等杂志的评阅人。'
