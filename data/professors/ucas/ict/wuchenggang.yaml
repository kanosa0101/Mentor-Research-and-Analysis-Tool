bio_raw: '武成岗，中国科学院计算技术研究所研究员级高级工程师，博士生导师，

  2001

  年于中国科学院计算技术研究所获博士学位。长期从事基于编译技术的软件安全技术的研究，旨在通过程序分析技术，增强软件的安全性、可靠性和高效性。在程序缺陷定位、二进制代码的分析变换及优化、运行时程序行为监测、安全防御等方面，有着较深的技术积累。发表论文

  30

  余篇，部分发表在

  TSE

  、

  ICSE

  、

  ASE

  、

  TPDS

  、

  TACO

  、

  SIGMETRICS

  、

  PACT

  、

  CGO

  、

  VEE

  、

  DATE

  等学术会议和期刊上，获得授权专利

  16

  项，软件著作权

  5

  项，并于

  2012

  年荣获北京市科学技术二等奖。担任国际学术会议

  CGO 2013

  大会主席、

  APPT 2013

  程序委员会主席，还担任

  CGO2015-2018

  、

  PPoPP2017-2018

  、

  PLDI2012

  、

  CCGrid 2015

  、

  ICPADS 2014

  、

  PPPJ2014

  等会议的程序委员会委员。

  武成岗是首个担任编译顶级国际学术会议

  CGO

  大会主席的国内学者，也是首次应邀参加编译旗舰会议

  PLDI

  程序委员会的两位国内学者之一。'
