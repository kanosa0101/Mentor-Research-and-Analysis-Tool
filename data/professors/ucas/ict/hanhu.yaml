bio_raw: '韩琥，中科院计算所研究员，博士生导师。

  2011

  年博士毕业于中科院计算所，之后分别在美国密歇根州立大学和谷歌从事生物特征识别研究工作，曾担任谷歌

  Abacus

  项目核心研发成员，

  2015

  年回到中科院计算所工作。主要研究方向为计算机视觉、模式识别、生物特征识别及医学影像分析，特别是由表及里的

  “

  表观

  -

  隐藏

  -

  内在

  ”

  多层次生物特征分析与识别及其在身心健康监测和疾病辅助诊断中的应用。在

  IEEE TPAMI / TIP / TIFS / TCSVT / TBIOM

  、

  PR

  、

  CVPR

  、

  ECCV

  、

  NeurIPS

  、

  MICCAI

  等国际期刊与会议上发表学术论文

  80

  余篇

  (

  详见谷歌学术

  )

  ，谷歌学术引用

  4700

  余次，

  H-Index: 35 (2022.4)

  。研究工作获得

  5

  项论文奖，包括

  2020

  年度

  IEEE

  信号处理学会

  (IEEE SPS)

  最佳论文奖，以及

  4

  次会议最佳论文

  /

  最佳学生论文

  /

  最佳海报论文奖

  (

  含国际会议

  IEEE FG2019

  最佳海报论文奖

  )

  ，

  4

  次获国际竞赛冠亚军。作为负责人承担国家重点研发子课题、基金重点子课题、基金面上、中科院对外合作及企业合作等课题

  10

  余项。担任国际期刊

  Pattern Recognition Associate Editor

  ，

  EURASIP Guest Editor,

  国际会议

  ICPR2020 Area Chair, IJCAI 2021 Senior PC, ISBI2022 Session Chair

  ，以及

  VALSE

  常务

  AC

  ；

  7

  次在

  ICCV / CVPR / FG / WACV / PRCV

  等国际会议上组织主会特别会议和学术论坛。

  国科大个人主页：

  http://people.ucas.ac.cn/~hhan

  研究组内个人主页：

  https://vipl.ict.ac.cn/people/~hhan'
