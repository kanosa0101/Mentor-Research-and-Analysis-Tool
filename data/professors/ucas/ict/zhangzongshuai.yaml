email: zhangzongshuai@ict.ac.cn
bio_raw: '主要从事边缘智能与协同计算、6G通感算智融合、移动边缘计算等关键技术与系统研发。在相关方向发表论文30余篇，申请发明专利20余项，出版著作2部。作为项目负责人/执行负责人和骨干人员参与10余项多项国家及省部级重要课题。

  2022.09-至今：中国科学院计算技术研究所，高级工程师

  2019.07-2022.09：中国科学院计算技术研究所，助理研究员

  2015.09-2019.06：中国科学院大学，计算机系统结构，博士

  2012.09-2015.07：中国科学院大学，电子与通信工程，硕士

  2007.09-2011.07：同济大学，通信工程，学士'
