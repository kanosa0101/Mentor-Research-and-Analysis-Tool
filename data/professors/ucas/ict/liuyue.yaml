bio_raw: 刘悦，博士，正高级工程师。长期从事互联网搜索与挖掘、信息检索、AI安全等方向研究。主持参加了多项国家级重大工程、重大项目，在多项关键技术上取得了突破性进展，直接组织和策划了40余项技术组件的标准化封装，系统衍生出的技术标准和数据标准已经成为工程建设的事实标准；发表学术论文80余篇，获得专利授权70余项、软著20余项，成果应用于国家多个重要行业和领域。曾任中国中文信息学会信息检索专委会秘书长，目前担任中国中文信息学会理事。获得国家技术发明二等奖1项、钱伟长中文信息处理科学技术一等奖1项，中国电子学会电子信息科学技术一等奖1项。
