bio_raw: '博士生导师，IEEE高级会员。中科院计算所无线通信技术研究中心副主任，研究方向为宽带无线通信技术，包括通信与计算融合、异构网络、协同传输、绿色无线电等。主持和承担了国家基金委、国家科技重大专项、北京市自然科学基金重大项目、科学院知识创新工程等多个项目。研究成果获得2011年北京市科学技术奖二等奖和2012年中国电子学会电子信息科学技术二等奖，入选“十二五”北京市基金优秀成果汇编。已在国际国内知名期刊和会议上发表论文超过150篇，其中包括以第一作者发表的IEEE系列期刊论文12篇，完成中文著作一本，英文书章三篇，已申请3项美国专利。获得IEEE
  WCSP2019，ICC2018，ISCIT2016，PIMRC2015，ICCS2014，WCNC2013最佳论文奖，2011年北京青年优秀科技论文一等奖。担任多个国际知名期刊的Associate/Guest
  Editor，获得2014年度IEEE TVT期刊最佳编辑奖，2017年度ETT期刊最佳编辑奖，2019年度China Communications以及电信科学期刊最佳编辑奖。

  2009年12月 — 今 ：中科院计算所，研究员

  2008年10月— 2009年12月：香港应用科学研究院，主任工程师

  2004年1月 — 2008年10月：香港大学，博士后

  2001年1月— 2003年12月：香港大学，电子电机工程系，博士生

  1997年9月— 2000年7月：东南大学，无线电工程系，硕士生

  1993年9月— 1997年7月：东南大学，无线电工程系，本科生'
