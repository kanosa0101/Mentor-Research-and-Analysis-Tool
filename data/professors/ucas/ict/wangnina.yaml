bio_raw: '主要研究内容包括面向6G的通感算智一体化、智能体通信及边缘智能等关键技术的研究。作为项目负责人、项目执行人或科研骨干先后参与了10余项国家级和省部级课题的研究。目前主持国家自然科学基金国际合作与交流项目、北京市自然科学基金项目等项目及课题的研究，在相关方向发表期刊及国际学术论文25余篇，申请发明专利15余项。

  2016年9月 — 今 ：中国科学院计算技术研究所，副研究员

  2012年7月 — 2016年9月 ：中国科学院计算技术研究所，助理研究员

  2007年9月— 2012年7月：北京邮电大学，信息与通信工程学院，硕博连读生

  2003年9月— 2007年7月：北京邮电大学，电信工程学院，本科生'
