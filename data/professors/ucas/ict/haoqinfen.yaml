bio_raw: '郝沁汾，2001年博士毕业于中科院计算所计算机系统结构专业，先后在联想集团、北京航空航天大学等单位工作，现为中科院计算所研究员/博导/国科大教授、中国计算机学会集成电路设计专业组执行委员、CCITA联盟秘书长、中国Chiplet团标（TCESA
  1248-2023）制订牵头人、IEEE P3468 Chiplet接口电路标准工作组组长。

  先后从事过高性能服务器、高端SMP服务器、高速缓存一致性互连芯片、CPU芯片的设计和研究工作，目前的研究方向为基于chip-let架构的处理器、基于芯片级光互连的计算机系统结构。

  参与多个国家级科研项目，多次获得国家科技进步奖、北京市科学技术奖等奖项，在国内外学术会议及核心刊物上发表学术文章50余篇，申请国内外发明专利100余项。'
