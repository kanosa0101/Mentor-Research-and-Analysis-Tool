bio_raw: '主要研究：计算机体系结构和芯片，智能机器人、智能硬件、数据计算芯片和计算系统

  想进一步了解我的研究信息，可访问个人主页：

  http://www.carch.ac.cn/~yinhes/

  2006年计算所博士毕业，留所参加工作。2008年晋升为副研究员，2014年晋升为研究员。参加工作期间，2012年获得国家技术发明奖二等奖，2015年获得了国家自然科学基金委优秀青年科学基金的资助，2016年担任中国计算机学会青年计算机科技论坛学术委员会主席。'
