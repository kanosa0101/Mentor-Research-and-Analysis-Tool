bio_raw: '陈云霁，男，1983年生，江西南昌人，中国科学院计算技术研究所研究员，博士生导师。他带领智能处理器研究中心，研制了国际上首个深度学习专用处理器芯片。相关技术广泛应用于多种手机和服务器产品中。他在ISCA、HPCA、ASPLOS、MICRO、ICSE、ISSCC、Hot
  Chips、IJCAI、IEEE TC、IEEE TPDS、IEEE TCAD、ACM TOCS和CACM等学术会议及期刊上发表论文100余篇，申请专利100余项，获得了ASPLOS和MICRO等计算机体系结构顶级国际会议最佳论文奖（亚洲迄今仅有的两次）。包括哈佛、斯坦福、麻省理工、谷歌等上百个国际知名机构跟踪引用他的学术论文开展深度学习处理器研究。因此，他被Science杂志评价为该方向的“先驱”和“领导者”。

  他曾获国家杰出青年科学基金、中国青年科技奖、全国创新争先奖、国家自然科学基金委“优秀青年基金”、教育部“青年长江学者”，并被MIT技术评论评为全球35位杰出青年创新者（2015年度）。他还曾两次获得中国科学院优秀导师奖。

  个人经历：

  2012

  年

  -至今，中科院计算所，研究员

  2009

  年

  -2012

  年

  ，中科院计算所，副研究员

  2007

  年

  -2009

  年

  ，中科院计算所，助理研究员

  2002

  年

  -2007

  年

  ，中科院计算所，硕博生

  1997

  年

  -2002

  年

  ，中国科大少年班，本科生'
