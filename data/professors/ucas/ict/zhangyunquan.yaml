bio_raw: '张云泉，博士，中国科学院计算技术研究所研究员，博士生导师，并行软件实验室主任。担任全国政协委员、中国计算机学会会士、高性能计算专业委员会秘书长、

  ACM

  中国高性能计算专家委员会主席、中国软件行业协会常务理事、中国智能计算产业联盟执行理事长、中国工业和应用数学学会副秘书长。曾任国家超算济南中心主任、中国计算机学会常务理事、国家自然科学基金委第十四届信息科学部专家评审组成员、中国计算机学会

  YOCSEF

  学术委员会主席。主要研究方向为高性能计算、并行算法与软件、并行计算模型等，已在国内外学术刊物上发表论文二百余篇，包括

  PPoPP

  （国内首次连续两年在

  PPoPP

  上发表学术论文）、

  SC

  （国内首次同一年度两篇论文）等

  CCF A

  类会议和

  Proceeding of the IEEE

  、

  TPDS

  、

  TACO

  等

  A

  类期刊。出版专著三本，译著八本，专利

  4

  项，软著

  8

  项。

  中国高性能计算机

  TOP100

  排行榜创始人和发布者，提出并系统阐述算力经济，

  PAC

  、

  CPC

  和

  ACM

  中国

  IPCC

  大赛创始人。一百多次担任国际会议程序委员会委员和共同主席。中科院《数据与计算发展前沿》副主编，一级学报《中国图象图形学报》、中国计算机学会会刊《计算机科学》、《计算机工程与科学》和《计算机科学与探索》编委。光明日报科普专家委员会委员，国家基因库高级顾问，青海省大数据与云计算咨询专家委员会委员，贵州省农业大数据专家委会会委员，内蒙古环球智库大数据发展中心专家委员会委员，郑州市智慧城市专家委员会委员，吕梁市大数据专家咨询委员会委员和政府转型专家顾问，江西抚州市算力专家咨询委员会执行主任。九三学社中央科技专委委员，中央科普工委委员，中央促进技术创新工作委员会委员。

  IEEE TC

