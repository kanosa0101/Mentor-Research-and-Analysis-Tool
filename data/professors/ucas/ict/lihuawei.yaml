bio_raw: '现任处理器芯片全国重点实验室副主任，中国计算机学会（CCF）集成电路设计专委主任，中国计量测试学会集成电路测试专委副主任兼秘书长，IEEE Design
  & Test、IEEE TVLSI、JCST、《计算机研究与发展》等期刊编委。曾获国家技术发明二等奖、北京市科技进步一等奖、CCF技术发明一等奖、5次国际会议/国际期刊最佳论文奖等。

  工作/教育经历：

  2008年10月 — 今 ：中科院计算所，研究员

  2001年10月 — 2008年9月 ：中科院计算所，副研究员

  2001年7月 — 2001年9月：中科院计算所，助理研究员

  2009年8月 — 2010年8月：美国UCSB大学，访问学者

  1996年9月— 2001年7月：中科院计算所，硕士生/博士生'
