bio_raw: '王瑞平博士于2003年获北京交通大学理学学士学位，2010年获中科院计算所工学博士学位，之后分别在清华大学、马里兰大学进行博士后研究，现为中科院计算所研究员，博士生导师。研究方向为计算机视觉与模式识别，重点关注真实开放环境下的视觉场景理解问题。

  目前在领域主流国际期刊和会议如IEEE TPAMI、TIP、IJCV、CVPR、ICCV、ECCV、ICML等发表论文120余篇，Google Scholar引用11,100余次，获授权国家发明专利10余项，带领研究生6次获得本领域国际学术竞赛冠亚军，研究成果在遥感、安防等领域获得推广应用。获得2015年度国家自然科学奖二等奖（第4完成人）、2022年度中国图象图形学学会自然科学奖一等奖（第1完成人）、2025年度中国电子学会科技进步一等奖（第5完成人）。

  担任Pattern Recognition、Neurocomputing等国际期刊编委，二十余次担任IEEE CVPR(2021/2022/2026)、ICCV(2021/2025)、ECCV(2022/2024/2026)、WACV(2018~2026)等国际会议领域主席，获得IEEE
  CVPR2019&2025/ ICCV2019/ FG2019/ ECCV2020/ NeurIPS2020/ ICML2022等国际会议杰出审稿人荣誉，先后在CVPR2015、ECCV2016、ICCV2019、ACCV2022等国际会议合作组织并主讲Tutorial。作为项目负责人先后承担科技部重点研发课题1项、NSFC青年科学基金B类（原优秀青年科学基金）项目1项、企业联合基金重点项目1项、面上项目2项。担任中国图象图形学学会青年工作委员会副主任，中国计算机学会计算机视觉专委会秘书长。

  工作经历：

  2017年10月-至今：中国科学院计算技术研究所，研究员

  2012年9月-2017年9月：中国科学院计算技术研究所，副研究员

  2012年7月-2012年9月：中国科学院计算技术研究所，助理研究员

  2010年11月-2011年10月：马里兰大学计算机系，Research Associate（助理研究员）

  2010年7月-2012年6月：清华大学自动化系，博士后（助理研究员）

  教育经历：

  2003年9月-2010年7月：中国科学院计算技术研究所硕博连读，获工学博士学位

  1999年9月-2003年7月：北京交通大学信息与计算科学专业，获理学学士学位

  个人主页：

  http://vipl.ict.ac.cn/people/rpwang/

  谷歌学术：

  https://scholar.google.com/citations?user=duIUwpwAAAAJ&hl=en'
