bio_raw: 赵晓芳，女，正高级工程师，中科院计算所高性能计算机研究中心（即国家智能计算机研究开发中心）主任。1988年毕业于西安电子科技大学计算机系，获工学学士学位，1991-1994年在清华大学计算机学习获工学硕士学位，1994-1999在中国科学院计算技术研究所攻读博士学位。1999年在计算所工作。目前主要从事下一代计算机体系结构、服务器系统安全保障技术等方面的研究。中国计算机学会会员、工程与工艺专委会委员。
