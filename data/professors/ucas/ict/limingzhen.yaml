title: 副研究员
email: limingzhen@ict.ac.cn
bio_raw: '长期从事高性能计算、科学智能（AI4Science）系统优化，AI系统优化等研究方向。以第一或通讯作者在SC、PPoPP、IEEE TPDS、IEEE
  TC、NeurIPS、ICPP、IPDPS等领域顶级会议与期刊发表论文多篇。作为项目负责人主持博新计划、国家自然科学基金青年基金、北京市自然科学基金青年项目，作为技术骨干参与多项国家重大项目。博士论文被评为获得中国计算机学会（CCF）高性能计算优秀博士学位论文、美国计算机协会（ACM）
  SIGHPC China优秀博士学位论文。曾多次担任国际知名会议期刊审稿人（ICPP、ICPADS、HPCChina、TPDS、TKDE、JSC、THPC等）。

  工作和学习简介：

  2025年10月 — 今：中科院计算所，副研究员

  2023年8月 — 2025年10月：中科院计算所，特别研究助理（获中国科学院“特助”资助项目资助），合作导师为谭光明研究员

  2017年9月 — 2023年6月：北京航空航天大学，计算机学院，博士（博士论文入选CCF高性能计算优秀博士学位论文、ACM SIGHPC China优秀博士学位论文），导师为刘轶教授、杨海龙教授

  2013年9月 — 2017年6月：北京航空航天大学，数学与系统科学学院，本科'
