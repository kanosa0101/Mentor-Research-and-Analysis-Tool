bio_raw: '【个人简历】 包括但不限于：

  2016年9月 — 至今 ：中国科学院计算技术研究所，高级工程师

  2008年9月 — 2016年9月：中国科学院计算技术研究所，助理研究员

  2006年7月 — 2008年9月：中国科学院计算技术研究所，研究实习员

  工学博士，计算所 “百星计划”入选者。ITU-T SG21 Q5工作组副报告人，全国信标委人工智能分委会智能计算工作组联合组长，全国信标委多媒体、物联网、人工智能分委会委员,中国通信标准化协会TC1
  WG1工作组副组长。负责和参与国家重点研发计划、自然科学基金等20余项国家及企业合作项目。在IEEE TPDS、TMC、INFOCOM、AAAI、ICDE等国内外重要期刊、会议发表论文40余篇；负责制订计算所首个ITU国际标准及首个通信行业重点标准，负责和参与制订ITU国际标准40余项，国家标准8项，通信行业标准20余项，授权国家发明专利20余项，软件著作权登记13项。荣获2020年国际电信联盟AI/ML
  in 5G全球技术挑战赛银奖，2024年度中国计算机学会科技成果奖科技进步一等奖，2025年中国通信标准化协会科学技术奖一等奖等奖项。所指导学生吴致远获2025年中国科学院院长优秀奖，2023年计算所所长特别奖，并入选2025年中国电子学会硕士学位论文激励计划。'
