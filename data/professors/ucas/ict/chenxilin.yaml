bio_raw: '陈熙霖博士，研究员，

  ACM / CCF / IAPR / IEEE Fellow

  。其主要研究领域为计算机视觉、模式识别、多媒体技术以及多模态交互。曾主持国家自然科学基金重大、重点项目、

  973

  计划课题、

  863

  计划项目等的研究，曾任

  IEEE Trans. on Image Processing

  和

  IEEE Trans. on Multimedia

  的

  AE

  ，目前担任

  Journal of Visual Communication and Image Representation

  的

  Senior AE

  、计算机学报和模式识别与人工智能的副主编。担任过

  FG2013 / 2018

  、

  ChinaMM 2018 / 2019

  和

  PRCV 2019 / 2020

  大会主席，并多次担任

  CVPR

  和

  ICCV

  等的领域主席，获

  CCV-CV

  杰出成就奖。陈熙霖博士在国内外重要刊物和会议上发表论文

  300

  多篇，先后获得国家自然科学二等奖一项，国家科技进步二等奖四项。

  实验室个人主页：

  https://vipl.ict.ac.cn/people/~xlchen

  Google Scholar

  ：

  https://scholar.google.com/citations?user=vVx2v20AAAAJ&oi=ao'
