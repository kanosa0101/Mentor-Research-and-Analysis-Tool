bio_raw: '主要从事星地通信频谱资源智能管理、星地协议安全检测、星地协议漏洞挖掘等关键技术与试验平台的研发。在相关方向发表论文30余篇，申请发明专利20项。出版专著/教材2部，其中《移动通信网络安全实验教材》被评为省部级教学成果奖。作为项目负责人、项目执行人主持或参与了多项重要科研课题。曾获《信息通信技术》期刊优秀论文奖。

  2025年10月—至今

