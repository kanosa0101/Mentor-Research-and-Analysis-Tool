bio_raw: 主要从事高通量众核处理器以及人工智能、图计算等加速结构研究，作为核心骨干参与高性能众核处理器Godson-T、高通量众核处理器DPU等多款众核芯片的研制。主持国家自然科学基金、国家重点研发计划、中科院先导等课题十余项。在包括ISCA、MICRO、HPCA、ASPLOS、TC、TPDS等在内的领域知名会议/期刊上发表学术论文100余篇，授权发明专利30余项。入选中科院青促会优秀会员，曾获北京市技术发明一等奖，CCF技术发明二等奖，北京市科学技术二等奖等奖励。
