bio_raw: '李栋，中国科学院计算技术研究所正高级工程师，主要从事操作系统内核和边缘计算系统方面的研究工作，旨在为万物互联和人机物融合时代的计算设备提供高可用、高安全、具备分布式智能计算能力的操作系统技术栈。发表高水平论文

  50

  余篇，部分发表在

  SEC

  、

  IPSN

  、

  ICDCS

  、

  JCST

  等学术会议和期刊上，获授权专利

  17

  项，先后承担和参与中科院先导专项、工信部国家重大专项、国家

  973/863

  项目、科技部重点研发计划等

  10

  余项国家级科研项目。主导研制了包括微内核操作系统

  SeawayOS

  和多个首创型边缘计算系统，先后获得第九届中国科学院科技成果转化奖、

  International Open Benchmark Council 2019

  年度

  AIOT

  技术创新奖、中国开放指令生态

  (RISC-V)

  联盟最佳生态贡献奖、新安盟金石奖、北京市科学技术三等奖等奖项。

  2022.9

  –至今，中国科学院计算技术研究所，正高级工程师，从事物端操作系统和边缘计算系统关键技术的研究

  2012.9

  –

  2022.9

  ，中国科学院计算技术研究所，副研究员，从事物端操作系统和边缘计算系统关键技术的研究

  2009.2

  –

  2012.9

  ，中国科学院计算技术研究所，助理研究员，从事物端计算系统关键技术的研究'
