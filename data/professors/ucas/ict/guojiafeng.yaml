bio_raw: '郭嘉丰，博士，中国科学院计算技术研究所研究员，中国科学院大学岗位教授，现任中国科学院计算技术研究所网络数据科学与技术重点实验室主任，大数据分析系统国家工程研究中心常务副主任，国家优青获得者，中科院青促会优秀会员，北京智源学者，联想青年科学家。长期从事信息检索、自然语言理解、机器学习与大数据分析系统方向的研究。在本领域国际重要学术会议与期刊上发表学术论文100余篇（如TKDE、SIGIR、AAAI、CIKM等），获得ACM
  CIKM 2011最佳论文奖，ACM SIGIR 2012最佳学生论文奖，ACM CIKM 2017最佳论文Runner-up奖，ACM WSDM 2022最佳论文奖。担任本领域国际重要学术期刊ACM
  TOIS、Information Retrieval Journal的编委以及主要国际会议的程序委员会高级评审委员、委员等，获得ACM CIKM 2017杰出评审委员。研究形成的相关成果应用于国家相关业务单位以及今日头条、搜狗等互联网公司，获得2020
  年国家技术发明奖二等奖 、2012年国家科技进步二等奖、2011年中国电子学会科技进步奖一等奖、2012年中国中文信息学会 “钱伟长中文信息处理科学技术奖——汉王青年创新奖”一等奖。

  2016年9月 — 今 ：中科院计算所，研究员

  2015年4月 — 2016年4月 ：美国麻省大学艾默斯特分校，访问学者

  2012年9月 — 2016年9月 ：中科院计算所，副研究员

  2009年7月 — 2012年9月：中科院计算所，助理研究员

  2004年9月 — 2009年7月：中国科学院大学，博士

  1999年9月— 2004年7月：中国科学技术大学，本科生'
