bio_raw: '刘宏，博士，副研究员，硕士生导师。

  2000年7月进入中科院计算所从事科研工作，2007年6月毕业于中科院计算所，获计算机应用技术专业博士学位。

  主要研究方向为图像和视频分析，多模态数据分析，人机交互等。在国家重点研发、国家自然科学基金、北京市自然科学基金等项目的支持下，带领团队长期从事视觉目标检测，图像特征提取和场景理解，多模态医学图像处理与识别，以及科技助残和具身智能等方面的科研工作。在计算机视觉和多媒体领域的知名学术会议和期刊上，已发表论文90多篇，申请和授权发明专利40余项，软件著作权10余项。

  现为中国计算机学会高级会员、IEEE会员，担任国内核心期刊《计算机辅助设计与图形学学报》，《电子学报》，国际SCI期刊IEEE Transactions on
  Cybernetics, Multimedia Tools and Applications, Sensors, Journal of Visual Communication
  and Image Representation等学术期刊，以及AAAI，MICCAI，MM，ICCV等学术会议的审稿人，国家基金委以及北京市科委项目评审专家。'
