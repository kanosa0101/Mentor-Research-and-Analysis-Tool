bio_raw: '2020

  年

  7

  月博士毕业于中国科学院大学，同时加入中国科学院计算技术研究所无线中心开展科研工作。主要从事卫星移动通信接入网关键技术研究、系统级仿真验证及核心技术产业化等方向工作，作为课题负责人或技术骨干组织

  /

  参与了多个项目的科研工作，包括国家重点研发计划项目“

  6G

  星地一体化按需确定性服务管控技术”、中科院弘光专项项目“空天地一体化网络卫星移动通信终端芯片研发及产业化”、战略性先导科技专项“

  5G

  矢量处理器及基带芯片研究”等，带领团队高质量完成了部分项目的验收，形成了一系列知识产权成果，包括在国内外重要学术期刊和国际会议上发表相关论文

  10

  余篇，申请国家发明专利

  17

  项，软著

  3

  项，并通过产业孵化推广科研成果应用于支撑我国高轨天通、低轨卫星互联网的系统建设。'
