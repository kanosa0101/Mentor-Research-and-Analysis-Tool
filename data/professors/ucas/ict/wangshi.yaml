bio_raw: 王石，博士，正高级工程师，知识工程课题组负责人。其研究方向聚焦于知识工程、自然语言处理、认知计算等领域，先后主持国家重点研发计划课题、国防专项、国家信息安全计划、北京市科技新星计划等项目10余项，发表ACL、EMNLP、AAAI等人工智能、知识工程等领域高水平论文30余篇，参与编写国家标准1项，任人工智能学会心智计算专委会副秘书长、中国指挥与控制学会大模型与决策智能专委会常务委员等职务，获2022年度中国通讯学会科技进步一等奖。更多信息见个人主页：https://ictkc.github.io。
