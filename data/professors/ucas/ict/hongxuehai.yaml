bio_raw: '2010/02

  –

  现在，中科院计算所信息技术战略研究中心。

  2016~2018

  兼任中科院计算机网络信息中心信息化战略与评估中心主任、研究员。

  2018

  年起兼博导。

  2009/09

  -

  2010/02

  ，中国科学院规划战略局规划处处长。

  2006/10 - 2009/03

  ，天津市科学技术委员会主任助理（挂职）。

  2003/10 - 2006/10

  ，中国科学院计算技术研究所，国家智能计算机研究中心副研究员、科研处副处长、大项目办主任。

  2001/10 - 2003/10

  ，北京大学，计算机科学技术系，博士后、副教授。

  1994/07 - 2001/10

  ，成都理工大学，计算机系，讲师、副教授。'
