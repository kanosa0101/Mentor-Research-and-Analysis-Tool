bio_raw: '长期专注于高通量众核处理器架构设计、软硬协同优化以及智能化设计等研究方向，作为核心骨干参与了多款成功流片的高通量众核处理器芯片的研制。以第一或通信作者在PIEEE、MICRO、HPCA、AAAI、SIGIR、TPDS、TKDE等领域顶级会议与期刊上发表论文30余篇，其研究成果被发表在ISCA、MICRO、HPCA、ASPLOS、NeurIPS、ICML及PIEEE、IEEE
  TPAMI、IEEE TPDS等领域顶级会议与期刊的论文广泛引用或作为基础架构使用。作为项目负责人或核心骨干，主持或参与了多项国家级科研任务，包括国家重点研发计划项目、国家自然科学基金青年项目和中国科学院先导C专项等。入选北京市科技新星计划、中国科学院青促会会员、CCF青年人才发展计划，并曾获得北京市技术发明一等奖等多项奖项，其博士论文被评为中国计算机学会优秀博士学位论文。曾担任ISCA、HPCA、MICRO、ICS等领域顶级会议的TPC或ERC委员。指导/联合指导的研究生连续五年荣获国家奖学金，获得字节“筋斗云人才计划”、腾讯青云计划、蚂蚁星计划、百度AIDU计划等Special
  Offer，毕业后就职于中科院计算所、华为、平头哥、英伟达、字节跳动、腾讯、百度等知名机构。

  工作与学习简介：

  2022年9月 — 今：中科院计算所，副研究员（入选中科院青促会成员）

  2020年7月 — 2022年9月：中科院计算所，特别研究助理（获中国科学院“特助”资助项目资助），合作导师为范东睿研究员

  2014年9月 — 2020年7月：中国科学院大学，中科院计算所，博士生（博士论文入选CCF优秀博士学位论文），导师为张志敏研究员

  2018年1月 — 2020年2月：美国加州大学圣塔芭芭拉分校，电子与计算机工程系，联合培养博士，合作导师为谢源教授'
