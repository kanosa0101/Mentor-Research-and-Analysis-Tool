bio_raw: '主要从事高性能计算机体系结构研究、硬件工程实现和计算机组成原理课程教学等工作。

  研究兴趣为面向数据中心的异构加速计算及软硬件可编程FPGA云服务系统等

  2000.09--2004.07 北京邮电大学电信工程学院通信工程专业本科学习

  2004.09--2011.07 中科院计算技术研究所计算机系统结构专业硕博连读研究生 （其间：2008.10--2010.09 美国伊利诺理工大学 国家公派联合培养博士生）

  2011.07--2014.09 中科院计算技术研究所助理研究员

  2014.09--2022.09 中科院计算技术研究所高级工程师（其间：2016.09-- 中国科学院大学岗位教师）

  2022.09

  --至今

  中科院计算技术研究所正高级工程师'
