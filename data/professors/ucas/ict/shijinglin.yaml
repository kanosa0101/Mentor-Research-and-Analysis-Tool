bio_raw: '石晶林，研究员，博士生导师，无线通信技术研究中心主任，移动计算与新型终端北京市重点实验室常务副主任，移动计算与智能通信北京市国际科技合作基地常务副主任。工信部6G无线技术工作组专家、科技部中青年科技创新领军人才、国务院政府特殊津贴获得者、科技北京百名领军人才。长期从事无线移动通信和网络技术领域的研究、核心设备研发等工作，自2001年来先后主持和参与国家宽带无线重大专项、国家重大基础研究计划（973）、国家高技术研究计划（863）、国家科技基础加强计划项目、国家发改委CNGI专项、北京市科技重大项目以及中国科学院弘光专项等重大项目近30项。拥有授权发明专利117项，在申发明专利43项，提交国内外无线通信技术标准提案37项。先后在IEEE
  Trans on Com、IEEE JSAC、WCNC、ICC等国内外学术刊物和著名学术会议上发表论文近200篇。以第一完成人荣获北京市科学技术二等奖一项，中国科学院北京分院科技成果转化奖特等奖一项。

  2006年12月-至 今中科院计算所 研究员

  2001年12月-2006年12月中科院计算所 副研究员

  1999年9月-2001年11月 北京邮电大学 博士后/副教授

  1996年9月-1999年7月 北京理工大学，信号与信息处理专业，获工学博士学位；

  1993年9月-1996年7月 云南大学，无线电电子学专业，获工学硕士学位；

  1989年9月-1993年7月 西南师范大学，应用物理专业，获理学学士学位；'
