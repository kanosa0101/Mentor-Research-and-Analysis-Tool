title: 高级工程师
bio_raw: 博士，高级工程师。2007年7月于中国科技大学教学改革试点班获理学学士学位，2014年7月于中国科学院计算技术研究所获工学博士学位。先后在中科院计算所、龙芯中科、清华大学、华为海思等单位工作，从事高性能处理器设计，异构计算，硬件安全和密码芯片，软件定义芯片等方向研究。参与过多项国家重大课题，发表论文4篇和专利6篇。
