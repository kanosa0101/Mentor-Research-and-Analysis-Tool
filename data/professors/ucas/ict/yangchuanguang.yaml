bio_raw: '研究方向为面向计算机视觉的Efficient AI，尤其是高效视觉识别与生成技术的研究，相关研究成果已发表在TPAMI、CVPR、ICCV、ECCV、NeurIPS、ICML等领域顶级期刊会议上，并荣获指控学会技术发明一等奖（序9）。入选博士后创新人才支持计划、CCF博士学位论文激励计划提名、中国科学院院长特别奖、计算所特别研究助理A类。

  2025年11月 — 至今：中国科学院计算技术研究所，副研究员

  2023年7月 — 2025年11月：中国科学院计算技术研究所，助理研究员

  2018年9月 — 2023年6月：中国科学院计算技术研究所，博士生

  2014年9月 — 2018年6月：山东师范大学，信息科学与工程学院，本科生'
