bio_raw: '郭瑞杰，中国科学院计算技术研究所正高工，现任智能算法安全重点实验室内容安全方向学术带头人、智能算法安全全国重点实验室副主任（拟）。作为搜索引擎与人工智能领域资深专家，曾任阿里巴巴搜索技术核心负责人、搜索中台及阿里云AI搜索负责人。他主导构建了支撑阿里核心业务的千亿级超大规模实时搜索系统，牵头建设服务阿里集团超6000个业务的搜索中台技术体系，并研发行业领先的企业级AI搜索云产品，服务全球数万家企业。此外，他还发起阿里巴巴战略开源项目——国产开源AI搜索引擎Havenask，已被多家头部企业广泛采用。

  2025年6月 — 今：中科院计算所，正高级工程师

  2009年1月 — 2025年6月：阿里巴巴，总监

  2008年8月 — 2009年1月：阿里巴巴，技术专家（顾问）

  2005年9月 — 2009年1月：中科院计算所，博士

  2003年9月 — 2005年7月：中科院计算所，硕士'
