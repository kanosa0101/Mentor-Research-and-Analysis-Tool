bio_raw: '田国敬，中科院计算所副研究员，

  CCF

  量子计算专业组首届执行委员，

  CCF

  理论计算机专委委员。主要研究方向是：量子算法设计、量子电路优化、量子非局域性、量子模拟等，目前共发表论文

  19

  篇，博士毕业论文被评为中国通信学会优秀博士学位论文（全国共

  10

  篇）。作为项目负责人，先后获得了北京市自然科学基金和国家自然科学基金青年项目的资助，并于

  2019

  年入选了博士后创新人才支持计划（全国计算机专业共

  16

  人）。

  2020

  年

  9

  月

  —

  今

  ：中科院计算所，副研究员

  2017

  年

  7

  月

  — 2020

  年

  9

  月：中科院计算所，助理研究员

  2014

  年

  6

  月

  — 2015

  年

  7

  月：新加坡国立大学，联合培养博士生

  2011

  年

  9

  月

  — 2017

  年

  7

  月：北京邮电大学，网络技术研究院，博士生'
