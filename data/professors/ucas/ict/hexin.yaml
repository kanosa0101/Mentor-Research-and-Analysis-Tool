bio_raw: '2025年10月 — 今：中国科学院计算技术研究所高性能计算机研究中心，研究员

  2016年11月 — 2025年10月：中国科学院计算技术研究所高性能计算机研究中心，副研究员

  2012年10月 — 2016年10月：荷兰代尔夫特理工大学 应用数学系 博士后 导师：Kees Vuik

  2008年9月 — 2012年10月：瑞典乌普萨拉大学  科学与工程计算 博士 导师：Maya Neytcheva

  2006年9月 — 2008年6月：西北工业大学 计算流体力学 硕士 导师：刘锋

  2002年9月 — 2006年6月：西北工业大学 飞行器动力工程 学士

  研究方向和成果简介：

  围绕国产工业仿真软件中的关键求解技术瓶颈，牵头开展系统性科研攻关。作为团队负责人，主持研制出高性能矩阵求解器X-Solver，该软件在电路设计、结构力学、飞行器与船舶设计、优化问题及城市交通等六个关键领域的国产工业仿真软件中获得规模化应用，显著提升其数值求解效率。X-Solver已部署于国家超算中心百P级以上规模国产高性能计算机系统，打破了国产超算平台对国外同类求解器的长期依赖，并为我国E级超级计算机系统的研制提供了关键基础软件支撑。'
