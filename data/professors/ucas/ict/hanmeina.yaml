bio_raw: '阚美娜，研究员，博士生导师。研究领域为计算机视觉，尤其具身视觉、迁移学习、人脸识别、图像编辑与生成等问题。相关成果在TPAMI、IJCV、CVPR、ICCV等相关领域主流国际期刊与会议上面发表论文60余篇，谷歌学术引用7000余次。作为负责人承担国家自然科学基金重点项目课题、优青项目、面上项目、青年项目等，并参与多项国家重点研发、基金重点、基金面上及企业合作等课题。此外，获IROS2025
  世界模型竞赛冠军、FG 2015 PaSC视频人脸识别竞赛第一名、ICCV 2015社会年龄估计竞赛第二名、CVPR 2017面部关键点定位第二名。获2014年中国计算机学会优秀博士学位论文奖、2014中科院优秀博士学位论文奖、2016年中国计算机学会青年人才发展计划、2018年中国图象图形学学会石青云女科学家奖青年奖、2019年北京市科技新星计划、中科院计算所优秀员工以及卓越之星等。

  2023年9月 — 今：中国科学院计算技术研究所，研究员

  2015年9月 — 2023年9月：中国科学院计算技术研究所，副研究员

  2013年9月 — 2015年9月：中国科学院计算技术研究所，助理研究员

  2007年9月 — 2013年7月：中国科学院计算技术研究所，博士

  2011年1月 — 2011年9月：新加坡南洋理工大学，交流生

  2003年7月— 2007年9月：山东大学，计算机学院，学士'
