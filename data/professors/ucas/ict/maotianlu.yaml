bio_raw: '毛天露，女，博士，中国科学院计算技术研究所副研究员，硕士生导师，中国计算机学会高级会员。曾主持或技术负责多项国家自然科学基金项目、国家重点研发计划课题、国家科技支撑计划、

  863

  项目、科技部公益行业专项等，在

  ICCV

  、

  IEEE VR

  、

  ECCV

  等领域顶级会议和

  IEEE Transactions on Visualization and Computer Graphics

  、

  Computer Graphics Forum

  、

  SCIENCE CHINA Information Sciences

  等

  SCI

  期刊发表多篇论文。

