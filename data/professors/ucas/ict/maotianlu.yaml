  【招生信息】

  希望你是有责任心、喜欢思考、逻辑性强、动手能力强的学生。如果有意向报考，欢迎提前邮件联系。课题组面向大三学生提供实习岗位，通过实习可以体验研究生阶段的学习和研究工作，更好地规划未来的学习。'
