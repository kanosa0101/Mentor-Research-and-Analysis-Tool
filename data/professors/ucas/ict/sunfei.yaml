bio_raw: '孙飞博士，为中国科学院计算技术研究所副研究员，入选中国科学院特聘研究骨干，现任CCIR专会委员以及CIPS青工委委员，长期从事自然语言处理、推荐系统以及算法安全等方向研究，研究成果广泛应用于淘宝、快手、字节等大型推荐系统中。主持或参与包括国家重点研发、中科院先导B等在内的多项算法安全方向重大科研任务。近年来，在TOIS、ACL、EMNLP、NeurIPS等国际顶级期刊会议上发表论文

  60余篇

  ，Google Scholar引用

  8000余次

  。连续入选

  Stanford 全球前2%科学家

  ，论文多次入选谷歌学术刊物指标榜单，其中

  第一作者论文单篇引用超2200次

  ，为CIKM近十年引用最高论文，论文另获国际顶会RecSys 2019最佳长文提名奖。长期担任TOIS、TACL、NeurIPS、ICML、ACL、IJCAI等顶级学术期刊会议（高级）评委。

  指导学生论文引用超2500次，多篇入选谷歌学术刊物指标榜单。支持学生参与学术服务和学术分享，学生多人次担任国际学术会议、期刊的PC/reviewer，在国际顶会WWW组织研讨会。多人受邀在全国性学术会议、学术社区、企业等进行报告分享。

  2022年8月 — 今：中科院计算所，副研究员

  2017年7月 — 2022年8月：阿里巴巴-达摩院  算法专家

  2012年7月 — 2017年7月：中国科学院大学，计算机学院，博士生'
