bio_raw: '官赛萍，博士，中国科学院计算技术研究所副研究员，中国科学院计算技术研究所新百星，研究方向包括数据价值提升、知识图谱等。在TKDE、KAIS、WWW、ACL等重要期刊和会议上发表论文30余篇，获2024年钱伟长中文信息处理科学技术奖自然科学类一等奖、2017年国际知识图谱会议ICBK最佳学生论文奖（一作）、软件学报2020年高影响力论文奖（一作），相关论文（通讯作者）入选2025年最具影响力SIGIR论文榜单。担任2019年ICDM
  Workshop on Data Science and Big Data Analytics会议的宣传主席；持续担任TPAMI、TII、TKDE、ACL、SIGIR、WWW等国际期刊和会议的审稿人/程序委员会委员/Area
  Chair；担任中国中文信息学会语言与知识计算专委会委员、信息检索专委会通讯委员。

  2024年10月 — 今：中国科学院计算技术研究所，副研究员

  2019年7月 — 2024年10月：中国科学院计算技术研究所，助理研究员

  2014年9月 — 2019年7月：中国科学院计算技术研究所，博士生

  2010年9月 — 2014年7月：北京化工大学，本科生'
