bio_raw: 张瀚文，2003年毕业于电子科技大学通信与信息工程学院，获学士学位，同年保送进入中国科学院计算技术研究所攻读硕博连读研究生，2009年获博士学位后留所工作。一直专注于未来互联网体系结构、移动网络方向的研究。作为项目负责人、技术负责人、核心骨干，参与了国家自然科学基金等16项国家科研项目；在国内外期刊和会议上发表论文20余篇；申请国家发明专利14项，其中已授权12项；获得软件登记授权10项；制定国家通信行业标准3项。
