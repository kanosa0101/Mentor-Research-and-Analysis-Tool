bio_raw: '2011.10~今：中国科学院计算技术研究所，副研究员

  2007.7~2011.9：中国科学院计算技术研究所，助理研究员

  2001.9~2007.7：中国科学院计算技术研究所计算机软件与理论专业，硕博

  近年来致力于将机器学习、数据挖掘算法应用于实际的数据分析场景，并结合实际场景进行有特色的大数据系统的设计与优化。在算法设计方面，提出无监督网络协议特征分词、网络协议类型分析等一系列方法，论文成果发表在国际顶级期刊JSAC和顶级会议INFOCOM、ICNP上。2012年获得ICNP最佳论文奖，是大陆研究团队20年来首次获此殊荣。2014年以来专注于大数据计算系统的设计，面向复杂数据关联分析场景研发了高性能图计算系统SQLGraph，基于内存压缩存储和并行算法加速，实现了单机亿级节点的图关系存储和秒级遍历，并且将图计算、关系查询、关系计算统一到SQL标准语言框架下。其性能不仅达到学术界领先水平，也超过当前工业界和开源社区代表性系统1至4个数量级，获得2019年DEXA最佳论文奖，受到金融等多领域的广泛关注和认可。领导研发的基于微内核的流式计算引擎，支持倾斜数据处理及动态任务调度，分布式处理性能是Flink的20-80倍，支持动态毫秒级垂直扩展及秒级水平伸缩，并支持秒级启动。目前正在领导研发的深度学习软件栈系统，结合了符号化模型编程高效率和命令式模型编程易用性的特点，向上实现了Tensorflow、Pytorch、Caffe2框架融合，向下通过神经编译器实现网络中间表示到LLVM虚拟机之间翻译，代码优化达到手动调优性能，便于对接底层各种专用加速芯片，方便运行时模型调试。'
