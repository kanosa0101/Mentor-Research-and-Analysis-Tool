bio_raw: '研究员、博士生导师，中科院计算技术研究所大数据研究院院长

  ，中科院计算所教育处处长，中科院计算所科协秘书长。大数据分析系统国家工程实验室开放知识计算方向负责人

  ，中国科普作家协会副理事长，中国计算机学会理事、杰出会员

  ，中国计算机学会科学普及工作委员会主任，中国计算机学会大数据专家委员会常务委员、

  大数据教材编委会委员，信息技术新工科产学研联盟大数据与智能计算工作委员会主任，河南省大数据与人工智能专家委员会秘书长

  ，郑州市大数据咨询委员会主任

  。国家自然科学基金评审专家、国家重点研发计划项目评审专家、全国专业标准化技术委员会委员。曾获国家科技进步二等奖

  。主要研究方向：大数据分析、开放知识网络计算、社交网络演化分析、网络与信息安全、隐私泄漏行为分析等。

  主要承担课题：主持了

  20

  余项国家级科研项目

  ，包括：国家自然科学基金重点项目、面上项目，，国家重点研发计划项目、课题，

  973

  计划子课题，

  863

  计划重点课题、国家科技支撑计划课题、国家发改委信息安全专项、中国科学院创新工程重点项目课题等。

  主要学术成果：在网络数据科学等领域发表论文

  200

  余篇

  ，其中包括国际会议上发表学术论文

  50

  余篇（包括：

  ACL

  、

  WWW

  、

  CIKM

  、

  WSDM

  、

  AAAI

  、

  IJCAI

  等），在数据安全、智能分析和综合性国际期刊上发表论文

  40

  篇。获授权发明专利

  61

  项，软件著作权

  27

  项

  。已出版《隐私数据泄露行为分析》、《开放网络知识计算》、《社交网络演化计算》等

  5

  部学术专著

  ，参与组织编写《大数据导论》教材。

  在科研工作之余，王元卓还积极投入科学传播和科学普及工作，

  2019

  年他被评为中国

  “

  十大科学传播人物

  ”

  。王元卓参加中科院科学公开课和走进校园的科学传播活动，央视少儿频道多次进行报道和专访，并作为主讲嘉宾受邀参加凤凰卫视的世纪大讲堂等科学传播节目录制。他还被受聘为中科院北京分院科普团队金牌讲师。

  2019

  年初王元卓给女儿手绘的《流浪地球》讲解图，被

  100

  余家媒体在微博发布，微博总阅读量超过

  1.5

  亿人次，引发数万人参与热议，被境外媒体翻译成英文进行了报道，央视、北京卫视等

  10

  多家电视台进行报道或专访，《中国青年报》、《北京科技报》等做了专题报道，他被网友称为

  “

  硬核科学家奶爸

  ”

  。王元卓创作的《科幻电影中的科学》系列手绘科普书籍，引发读者的广泛关注

  ，《科幻电影中的科学：科学家奶爸的宇宙手绘》更是成为青少年科普畅销书。'
