bio_raw: '2001年9月-2005年7月：北京大学电子信息科学与技术专业，获理学学士学位

  2005年9月-2008年7月：中国科学院计算技术研究所计算机科学专业，获工学硕士士学位

  2008年10月-2012年3月：英国南安普敦大学应用物理学院，获电子电气工程博士学位

  2012年2月-2013年1月：英国国家海洋学研究中心，博士后研究员

  2013年2月至今：中国科学院计算技术研究所，副研究员

  主要从事用于传感器网络的小型传感器研究，申请和授权有国际专利6项，国内专利8项。在英国留学期间研发的一套传感器作为南安普敦大学60周年60成果之一，曾被BBC等多家媒体报道，并收到多家公司的商业化意向标书。'
