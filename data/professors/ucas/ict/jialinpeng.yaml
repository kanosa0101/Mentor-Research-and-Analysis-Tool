title: 副研究员
email: jialinpeng@ict.ac.cn
bio_raw: '研究方向包括区块链性能优化、跨链互操作、联邦学习等，近年来在IEEE TPDS、IEEE TC等国内外知名期刊及会议上发表论文23篇。主持国家重点研发计划课题与子课题各1项（千万级1项），作为课题骨干参与国家重点研发计划、国家自然科学基金等项目12项。参与编制ISO、ITU-T、IEEE等国际标准22项、国内团体标准12项，授权发明专利20项。现为中国计算机学会区块链专委会执行委员、IEEE
  计算机协会区块链与分布式账本（IEEE C/BDL）标准工作组副主席、Blockchain期刊青年编委以及IEEE TC、IEEE TNET等期刊与会议审稿人等。

  2025年10月 — 今：中国科学院计算技术研究所，副研究员

  2023年06月 — 2025年09月：中国科学院计算技术研究所，助理研究员（特别研究助理）

  2017年09月 — 2023年06月：中国科学院计算技术研究所，计算机系统结构，博士（导师：孙毅）

  2013年09月 — 2017年06月：中国石油大学（北京），计算机科学与技术，学士'
