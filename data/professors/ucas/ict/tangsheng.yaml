bio_raw: 2006年3月博士毕业于中国科学院计算技术研究所（简称计算所）后留所工作，2008年3月起先后任副研究员和研究员、硕士生导师和博士生导师，中国计算机学会和中国图像图形学会多媒体专委会委员、国家重点研发计划项目专家。带领团队长期从事多媒体内容分析与理解、计算机视觉与机器学习、人工智能内容生成与伪造检测研究；作为项目负责人主持多项国家级科研项目；发表多媒体、计算机视觉、机器学习、人工智能领域的国际顶级会议（ICCV、CVPR、ECCV、ACM
  Multimedia、ICML、NeurIPS、AAAI、IJCAI、MICCAI）和国际顶级期刊（T-PAMI、TIP、TMM）论文40余篇，谷歌学术引用超6000余次，研发的多项图像视频分析、检索与识别、伪造检测系统已经在获得大规模应用。主持了2014年全国首届特定音视频检索识别挑战赛视频评测；带领团队在美国NIST举办的视频检索国际评测TRECVID
  2008和国际著名的ImageNet大规模视觉识别挑战赛(ILSVRC 2016)中取得优异成绩，并应邀做大会报告；在CCF A类国际顶级会议ICCV 2019长尾实例分割挑战赛、ACM
  Multimedia 2021多模态商品识别挑战赛夺冠。荣获国家自然科学二等奖1项、北京市科学技术一等奖3项、中国计算机学会科学技术一等奖1项、中国电子学会科学技术一等奖2项。
