bio_raw: '张玉成，男，工学博士，正高级工程师，中国科学院智能农业机械装备工程实验室副主任，科技部重点研发计划指南编写专家组成员，中科院“黑土粮仓”战略先导项目总体组成员，入选农业农村部“十四五”农业科研杰出人才培养计划。主要从事“第三代农机装备技术体系和标准化”研究，提出构建以智能算法为核心的第三代农机技术体系。

  近年来，承担了中国科学院“黑土粮仓”等重要科技任务10余项，完成了基于第三代农机技术体系的“鸿鹄”系列智能网联农机装备的研制并开展产业推广，带领团队建成国内在线数量最多的农机大数据平台，并在内蒙、山东、河南、安徽等地开展农业智能技术的落地与示范。

  2021年11月 — 今：中国科学院计算技术研究所，正高级工程师

  2019年9月 — 今：中科院智能农业机械装备工程实验室，副主任

  2019年12月 — 2021年10月：北京中科晶上科技股份有限公司，副总经理

  2014年10月 — 2019年12月：中国科学院计算技术研究所，高级工程师

  2011年7月 — 2014年9月：中国科学院计算技术研究所，助理研究员

  2007年9月 — 2011年6月：中国科学院计算技术研究所，计算机科学与技术，博士生

  2004年9月 — 2007年6月：电子科技大学，数据通信，硕士生

  2000年9月 — 2004年6月：电子科技大学，通信工程专，本科生'
