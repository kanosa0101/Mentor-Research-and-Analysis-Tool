bio_raw: '张蕊，中国科学院计算技术研究所副研究员，硕士生导师，研究方向为深度学习和处理器设计智能化，长期从事人工智能算法和处理器软硬件自动设计的研究。先后在人工智能相关领域的国际顶级期刊和会议上发表A类论文60余篇,包括IEEE
  Trans on PAMI、IEEE Trans onIP、NeurlPS、ICML、ICLR、AAAI、IJCAI等，申请专利三十余项。同时担任多个人工智能领域国际顶级会议的审稿人。先后获得世界互联网大会“领先科技奖”、北京市教育教学成果奖一等奖，多次荣获中科院计算所优秀科研人员称号。

