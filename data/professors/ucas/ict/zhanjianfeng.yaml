bio_raw: '詹剑锋，

  1976

  年出生于安徽太湖。

  2002

  年在中国科学院研究生院（培养单位软件技术研究所

  )

  获得工学博士学位（计算机软件与理论）。

  2002

  年

  7

  月份开始在国家智能中心

  (

  高性能计算机研究中心）工作。

  2004

  年

  3

  月聘任为副研究员，

  2005

  年

  3

  月聘任为硕士生导师。

  2010

  年

  10

  月聘任为博士生导师，

  2012

  年

  9

  月聘任为研究员。

  2013

  年

  7

  月

  1

  日担任先进计算机系统研究中心副主任。

  2018

  年创建

  International Open Benchmark Council

  ，并担任委员会主席。

  2022

  年

  2

  月

  23

  日，担任先进计算机系统研究中心主任。

  研究方向：

  实验室以输出对国际学术界和产业界有影响的理论、开源系统和工具为导向，开展基础研究，并发表高影响力论文。目前从事以下具体的研究工作（合作导师包括王磊高级工程师，高婉铃副研究员，罗纯杰副研究员）。

  （

  1

  ）、面向现代计算机负载（大数据、人工智能和互联网服务等）的统一抽象（

  unified abstractions)

  、指令集

  (ISA)

  、微体系结构和系统研究。研究新型计算的统一抽象、基于统一抽象的机器学习编译器、大数据系统。（

  2

  ）、开源计算机系统和开源芯片研究：

  High-fusion computer

  的开源计算机系统研究；基于观测

  -

  参考

  -

  融合

  -

  反馈环路的开源芯片设计方法及全景式负载分析工具；（

  3)

  、

  Benchmark science and engineering

  基础理论、方法和工具研究。发展独立于计量学

  (metrology)

  的

  benchmark

  科学与工程。

  了解

  我的研究兴趣、目标和愿景陈述

  以及

  教学兴趣与理念声明

  ，请访问我的个人主页

  : https://www.zhanjianfeng.org'
