bio_raw: '张钊，博士，中国科学院计算技术研究所副研究员。研究方向为数据挖掘与知识图谱，特别是知识的表示和应用研究。在

  TKDE

  、

  TOIS

  、

  KDD

  、

  SIGIR

  等会议和期刊发表文章

  30

  余篇。作为负责人承担国家自然科学基金青年项目、博士后面上基金等课题。获得

  CIKM 2023 Best Short Paper Award

  和

  DASFAA 2022 Best Student Paper Award

  。

