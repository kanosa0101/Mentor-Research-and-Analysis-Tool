bio_raw: '郭崎，中国科学院计算技术研究所研究员，研究方向为处理器芯片、人工智能。在ACM/IEEE Trans.及ISCA、MICRO、ASPLOS、PPoPP、AAAI、IJCAI、ICML、NeurIPS等发表论文百余篇，授权国内外发明专利百余项。获中国青年五四奖章、中国科学院青年科学家奖、中国计算机学会青年科技奖等。作为主要完成人，获国家自然科学二等奖、中国科学院杰出科技成就奖等。

  2019年至今：中国科学院计算技术研究所，研究员

  2015年 — 2019年：中国科学院计算技术研究所，副研究员

  2014年 — 2015年：CMU，博士后

  2012年 — 2014年：IBM中国研究院，研究员

  2007年 — 2012年：中国科学院计算技术研究所，硕博连读

  2002年 — 2007年：同济大学，计算机系，本科生'
