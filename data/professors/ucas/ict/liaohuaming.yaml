bio_raw: '2001年10月—至今，中国科学院计算技术研究所，副研究员，硕士研究生导师；

  2000年3月-2001年10月，中国科学院计算技术研究所，主要研究方向为数据集成、分布式数据处理技术，助理研究员；

  1998年4月-2000年3月，国家智能计算机研究开发中心，主要研究方向为数据集成、企业信息化，研究实习员；

  2008年7月博士毕业于中国科学院计算技术研究所；

  1998年4月硕士毕业于电子科技大学计算机学院。'
