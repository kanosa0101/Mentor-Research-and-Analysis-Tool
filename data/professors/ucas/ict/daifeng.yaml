bio_raw: '长期从事计算机视觉，视频图像分析与处理方向的研究工作，目前的研究兴趣为计算机视觉在智能农业中的应用。作为负责人承担了国家重点研发计划课题，国家自然科学基金面上项目，国家信息安全242计划项目等多个国家级项目。在NeurIPS/CVPR/ECCV/AAAI/IJCAI/IEEE
  T-MM/IEEE T-CSVT等国内外学术期刊和会议上发表论文近百篇，拥有授权发明专利10余项，长期担任IEEE T-CSVT, IEEE T-MM等国际期刊审稿人，NeurIPS/CVPR/ECCV/IJCAI/AAAI等顶级国际会议PC
  Member。获得2011年多媒体旗舰会议ICME最佳论文候选，2018年中国多媒体大会最佳论文奖与杰出展示奖。2014年获北京市科学技术一等奖。2022年获得世界物联网博览会金奖。研究成果批量应用于国家网络安全主管部门。

  工作经历：

  2024年10月 — 今：中国科学院计算技术研究所，研究员、博士生导师

  2021年12月 — 2024年10月：中国科学院计算技术研究所，副研究员、博士生导师

  2011年9月 — 2021年12月：中国科学院计算技术研究所，副研究员、硕士生导师

  2008年7月 — 2011年9月：中国科学院计算技术研究所，助理研究员

  学习经历：

  2002年9月 — 2008年7月：中国科学院计算技术研究所，计算机应用技术，博士

  1998年9月 — 2002年7月：清华大学，计算机科学与技术，本科'
