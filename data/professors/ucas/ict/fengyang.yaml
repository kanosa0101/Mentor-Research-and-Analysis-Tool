bio_raw: '冯洋，中国科学院计算技术研究所 研究员、博士生导师、自然语言处理团队负责人、“新百星人才引进计划”入选者，计算机学会杰出会员、人工智能学会首批杰出会员。在中科院计算所获得博士学位后，先后前往谢菲尔德大学和南加州大学信息科学研究所（USC/ISI）开展研究工作。担任中文信息学会青年工作委员会副主任、计算语言学专委会执行委员、ACL
  Rolling Review常任高级领域主席，多次担任ACL/EMNLP等国内外会议（高级）领域主席。获得国内首个“ACL最佳论文奖”，获人工智能学会“杰出贡献奖”、CCF自然语言处理专委会“青年新锐奖”、“钱伟长中文信息处理科学技术奖-汉王青年创新奖”一等奖，领导研发了百聆大模型并开放试用（https://nlp.ict.ac.cn/bayling），作为项目负责人主持国家重点研发计划、国家自然科学基金项目等，与华为、腾讯、百度、字节跳动等公司开展合作研究。

  2017年加入计算所后，指导及联合指导的学生获得“ACL最佳论文奖”（ACL开办50多年来国内首次）、“中国中文信息学会优秀博士学位论文”、“世界人工智能大会青年优秀论文奖”、“北京市优秀毕业生”、“腾讯犀牛鸟精英人才培养计划奖学金”等奖项，1人入围“CCF博士学位论文奖励计划”（共18人入围），有2人分别于直博三年级获得中科院计算所“所长特别奖（夏培肃奖）”和“所长特别奖”。支持学生参与学术服务和学术分享，指导的学生担任中文信息学会青工委学生工作委员会主任、国际会议ACL/NAACL/EACL
  ARR的领域主席，多人次担任全国性学术会议的程序委员会主席、学生研讨会主席，在国际顶级会议EMNLP举办3小时时长的Tutorial，作为国内唯一学者受邀参加国际对话评估研讨会，多人受邀在全国性学术会议、学术社区、企业等进行报告分享。'
