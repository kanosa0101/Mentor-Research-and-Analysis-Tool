bio_raw: '毕可平，中国科学院计算技术研究所副研究员，硕导，国家级青年人才。博士毕业于马萨诸塞大学阿默斯特分校，师从ACM SIGIR终身成就奖Gerard
  Salton Award获得者W. Bruce Croft教授。目前从事可信信息获取方面的研究，从大模型的诚实性，无害性，有用性三方面对基于检索增强的生成（RAG）开展研究，包括模型的置信度校准，通用文本及多模态的嵌入表征，服务RAG的检索，模型生成内容对信息获取生态的影响等。在SIGIR, WWW, WSDM,
  CIKM, TOIS, ACL, EMNLP等国际顶级期刊会议中发表论文50余篇。相关技术在百度、微软Outlook Search，蚂蚁集团小程序搜索，快手视频推荐等业务中。

  担任2025至2028 SIGIR Forum共同编辑，SIGIR-AP2025大会共同主席，ICTIR2026程序委员会共同主席，NTCIR-19宣传共同主席，NLPCC
  2025讲习班共同主席，SIGIR-AP2023注册主席。此外，担任中文信息学习信息检索委员会委员以及青年工作委员会委员，以及长期担任TOIS、SIGIR、WWW、CIKM、ACL、EMNLP等顶级学术期刊会议审稿人或领域主席。

  组织SIGIR2026服务RAG效用为中心的检索的讲习班，是CIKM2025多模态生成式搜索推荐Workshop的Keynote Speaker。指导的学生入选中国科协青年科技人才培育工程博士生专项计划，获得国家奖学金，朱李月华奖学金，比亚迪奖学金，易方达奖学金，所长优秀奖，以及获评三好学生标兵，优秀毕业生等。

  2024年10月 — 今：中科院计算所，副研究员

  2022年10月 — 2024年10月：中科院计算所，特别研究助理

  2021年8月 — 2022年8月：Microsoft MSAI，Applied Scientist II

  2015年9月 — 2021年6月：University of Massachusetts Amherst，CICS，Ph.D.

  2012年7月 — 2015年7月：百度网页搜索部，高级研发工程师(T5)

  2009年9月 — 2012年7月：北京大学，信息学院，硕士生

  2005年9月 — 2009年7月：南开大学，信息学院，本科生'
