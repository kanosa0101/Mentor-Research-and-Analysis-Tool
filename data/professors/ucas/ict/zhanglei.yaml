bio_raw: 张磊，博士生导师，正高级工程师，计算所学术百星，中科院青促会成员，中科院科技成果转化特等奖获得者，现任泛在中心物端计算实验室主任。2003年在成都电子科技大学计算机系获学士学位，2008年在中科院计算所获博士学位，2012-2013年在美国伊利诺伊理工和芝加哥大学任高级研究助理。张磊博士主要瞄准人工智能物联网方向，研究高效能芯片体系结构和空间操作系统，成果发表在Proceedings
  of IEEE，TC，TCAD，TVLSI，ISCA，MICRO，HPCA，DAC，DATE等国际顶级期刊和会议，2021年获得GLVLSI最佳论文奖。张磊团队在国内最早参与并推动开源指令系统RISC-V，先后成功完成基于RISC-V指令集的三代物端智能感知芯片设计和流片，数量级提升目前嵌入式和单片机的能力。2018年，物端团队创办计算所产业化公司中科物栖（www.jeejio.com），入选中国最具投资价值企业新芽榜50强、AIoT领域最具影响力创新企业Top10。张磊博士入选了2019年《财富》中国评选的40位40岁以下商业精英，2020年中关村高端领军人才聚集工程和海英人才计划。
