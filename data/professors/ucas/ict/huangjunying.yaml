bio_raw: '黄俊英，副研究员，硕导，近年来持续开展VLSI EDA与超导体系结构研究，主要研究方向包括VLSI EDA、超导EDA及超导加速架构。先后主持或参与国家自然科学基金青年项目、中科院先导A、先导C、制高点专项等国家级与省部级科研项目。在国际上率先提出了超导二值神经架构，并研发了超导SFQ电路全自动物理设计工具。研究成果在TC、TCAD、DAC、ICCAD、DATE、ICS等高水平期刊与会议上发表论文30余篇，受理发明专利20余项，获GLSVLSI
  2021最佳论文提名，通讯作者论文入选IEEE TC月度焦点论文（Featured Paper of the Month），并获北京市优秀人才、计算所优秀研究人员等荣誉。

