title: 研究员
supervisor: 博导
bio_raw: '经历：

  2003年本科毕业于南京大学，2008年获中科院计算所博士学位，2010-2012年普林斯顿大学博士后，现为中科院计算所研究员，先进计算机系统研究中心主任，中国科学院大学岗位教授，博士生导师，中国开放指令生态（RISC-V）联盟秘书长。

  学术：

  研究方向是计算机系统结构，包括数据中心体系结构、处理器芯片敏捷设计、开源芯片生态等。担任国家重点研发计划、自然基金委、中科院战略性先导科技专项、计算所-华为战略合作项目等重大项目及课题负责人，主持研制多款达到国际先进水平的系统，包括访存监控系统HMTT、标签化体系结构Labeled
  RISC-V原型芯片、面向芯片敏捷设计的RISC-V系统级原型验证服务SERVE平台等，相关技术已在华为、阿里、Intel等国内外企业应用。在国际会议期刊发表了50余篇论文，活跃于国际计算机体系结构学术前沿，长期受邀担任ASPLOS、ISCA、MICRO、SC等CCF-A类国际顶级会议程序委员会委委员，担任IEEE
  MICRO专刊特邀客座编辑、国际顶级论坛Dagstuhl Seminar共同主席。

  荣誉：

  入选华为2015年全球合作五个代表成果写入其年报、获阿里巴巴最佳合作项目奖。曾两次获计算所优秀论文一等奖，获“CCF-Intel青年学者”奖，入选2016年中国计算机大会特邀大会报告、ARM2018全球研究峰会三个特邀大会报告之一、中科院青年创新促进会优秀会员，获“CCF-IEEE
  CS”青年科学家奖、共青团中央“全国向上向善好青年”荣誉称号。

  任职：先后担任青年计算机科技论坛（YOCSEF）2018年度副主席，ACM China副主席，中国科学院青年创新促进会第三届与第四届理事，未来论坛青年理事与青年科学家创新联盟2019年度轮值主席，《中国计算机学会通讯》专栏主编等。

  工作经历

  2018.04 ~      先进计算机系统研究中心主任，中科院计算所

  2017.01 ~ 2018.04 先进计算机系统研究中心常务副主任，中科院计算所

  2015.05 ~ 2017.01 先进计算机系统研究中心副主任，中科院计算所

  2015.09 ~      研究员，中科院计算所

  2011.09 ~ 2015.08 副研究员，中科院计算所

  2010.10 ~ 2012.09 博士后，普林斯顿大学计算机系

  2008.09 ~ 2011.09 助理研究员，中科院计算所

  教育背景：

  2003.9 ~ 2008.09  工学博士，中科院计算所

  1999.09 ~ 2003.07 理学学士，南京大学计算机科学与技术系

  个人主页：

  http://acs.ict.ac.cn/baoyg/'
