title: 高级工程师
email: zhangwl@ict.ac.cn
bio_raw: '张文力，女，博士，高级工程师，现任先进计算机系统研究中心数据中心网络组组长，主要研究方向为网络栈系统结构和优化、大数据分析等。

  在中科院计算所取得计算机系统结构专业硕士和博士学位，曾先后负责过中科院计算所智能中心性能分析组、体系结构国家重点实验室性能分析组、先进计算机系统研究中心海云服务器团队、数据中心网络组等多个团队，并赴普林斯顿大学计算机系访学一年，合作导师李凯教授。长期从事面向可扩展应用的系统优化等方向研究工作，作为科研骨干参与曙光

  4000等系列

  高性能计算机研制等。当前重点研究面向物联网、移动互联网服务等新兴高并发低延迟的应用场景，研发高效高吞吐的数据中心网络关键技术以及原型验证系统。已研发了可定制的数据中心协议栈、高吞吐低延迟服务器等原型，在数据通路的各个关键环节，包括网关、网卡、驱动、协议栈、服务软件、数据库等，都进行基于数据内容的智能识别和优先调度。面向云服务系统的软硬件结合的系统设计，解决性能和

  QoS

  问题

  近期带领网络组（

  http://acs.ict.ac.cn/network/

  ）承担和参与了国家自然科学基金重点等项目，在研项目经费超千万。已发表译著

  1

  本，论文

  30

  余篇，授权专利

  3

  项。已协助指导博士和硕士研究生二十余名。'
