bio_raw: '毕经平，博士生导师，研究员。主要研究方向涵盖多模态大模型、世界模型、时序数据智能分析、智能网络等。中国计算机学会高级会员，全国网络与数据通信专业委员会委员。国内外多个会议或杂志的审稿人。卢嘉锡青年人才奖获得者，中科院青年促进会成员。主持参与国家973、国家 863、国家自然科学基金、领域专项等重要的纵向/横向项目超过100项。目前发表国内外重要杂志和会议文章150余篇，专利超过50项，专利转让8项，软件登记7项。主持的多个国家项目成功实现了产学研的结合，研发成果多项顺利实现产业化，用于我国的经济建设或技术转让。业余时间喜欢骑车、健身等运动。

  本课题方向面向人工智能、大数据分析和计算机网络等热门领域，就业情况非常好，绝大多数学生能满足个人第一志愿。95%学生就业在所属行业的绝对领头型企业或核心国家事业单位（如阿里、腾讯、头条等互联网公司，银行、科技部等国家事业单位），部分学生选择毕业后继续在国外深造。

  对报考学生的要求：1）熟练掌握计算机领域相关基础知识；2）具有较强的动手能力；3）热爱科研工作；4）做事主动、勤奋，团队合作能力强。'
