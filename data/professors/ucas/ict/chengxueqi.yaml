bio_raw: '程学旗，研究员、博士生导师，中国科学院计算技术研究所副所长，智能算法安全全国重点实验室主任，国家杰出青年科学基金获得者、国家高层次人才、北京学者、CCF会士、IEEE
  Fellow。长期从事网络数据科学、大数据分析系统、社会认知博弈、AI安全等方向研究。在重要学术会议和IEEE汇刊上发表论文300余篇，七次获得本领域顶级国际学术会议最佳论文奖，谷歌学术引用超过3.8万次，H指数94。获授权发明专利140余项。主持参加了多项国家级重大工程、重大项目。成果应用于国家多个重要行业和领域，获得国家技术发明二等奖1项、国家科技进步二等奖3项。兼任CCF理事、大数据专家委员会主任、中国数字经济50人论坛秘书长、中国中文信息学会副理事长、中国网络空间安全学会常务理事。

  学术服务：

  1. 计算机学报、计算机研究与发展、信息安全研究、大数据、信息通信技术等国内期刊编委

  2. Journal of Computer Science and Technology、IEEE transactions on Big Data、IEEE
  Transactions on Computational Social Systems等国际期刊编委

  3. 担任国际会议ACM WSDM2015、ACM CIKM 2019、ACM SIGIR2020等国际学术会议的共同大会主席'
