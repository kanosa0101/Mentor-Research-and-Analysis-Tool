bio_raw: '叶靖，中科院计算所计算机体系结构国家重点实验室副研究员、硕士生导师，中国计算机学会

  (CCF)

  容错计算专业委员会秘书长，中国计量测试学会集成电路测试专业委员会副秘书长。

  2014

  年在中科院计算所获博士学位，

  2008

  年在北京大学信息科学与技术学院获学士学位。研究方向包括集成电路测试与安全。

  作为项目负责人、课题负责人、执行负责人负责多项国家自然科学基金项目。已发表学术论文

  60

  余篇，包括

  EI

  论文

  40

  余篇，

  SCI

  论文

  10

  余篇，拥有

  10

  项授权发明专利，译著一本。研究成果被多家公司使用。曾获中国产学研合作创新成果奖二等奖、北京市科学技术奖二等奖、

  IEEE

  测试技术委员会

  E. J. McCluskey

  博士论文奖亚洲区第二名、

  IEEE SEMICON

  中国国际半导体技术大会最佳青年论文奖。

  自

  2016

  年起发起并举办了全国硬件安全年度论坛。是

  2021

  年

  IEEE International Test Conference in Asia (ITC-Asia)

  程序主席、

  2019

  年

  CCF

  全国容错计算学术会议程序主席，

  2018

  年

  CCF

  中国测试学术会议组委会主席，

  2018

  年

  IEEE

  亚洲测试会议

  (ATS)Tutorial Chair

  。

  主要研究方向一：

  EDA

  团队长期从事

  EDA

  研究与开发，主要包括面向集成电路故障的测试与诊断

  EDA

  工具、针对集成电路硬件木马或硬件漏洞的检测工具、面向

  Xilinx FPGA High Level Synthesis

  的设计空间自动探索优化工具、人工智能软硬件安全评估工具等。团队在测试领域已有十多年的研究积累，成果已在相关公司应用。

  主要研究方向二：安全芯片

  下一代安全芯片亟需解决至少两个关键问题：（

  1

  ）随着越来越多的设备接入整个网络，如何为每一个设备甚至每个芯片赋予独一无二的

  "

  身份证

  "

  ，以保证只有授权的设备能够运行在合法的范围中；（

  2

  ）随着量子计算机的出现，传统非对称加解密算法等已可被破解，如何在后量子时代提供安全加解密芯片。团队率先从这两个方面入手，开展了物理不可克隆函数芯片与后量子密码芯片等研究。

  2008

  年：北京大学 信息科学与技术学院 学士学位

  2014

  年：中科院计算所 博士学位 导师

  :

  李晓维研究员

  2014

  年：中科院计算所 计算机体系结构国家重点实验室 助理研究员

  2017

  年：中科院计算所 计算机体系结构国家重点实验室 副研究员

  ,

  硕导'
