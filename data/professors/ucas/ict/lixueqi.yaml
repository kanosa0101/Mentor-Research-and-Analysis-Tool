bio_raw: '2023年09月—至今：中国科学院计算技术研究所副研究员，硕士生导师（2024年1月起），课题组长

  其间，2024年01月—2025年01月，院重任局信息处借调，业务主管

  2021年07月—2023年09月：中国科学院计算技术研究所特别研究助理、助理研究员，课题组长

  2018年10月—2020年08月：美国加州大学圣塔芭芭拉分校，电机与计算机工程系，公派联合培养博士（导师：谢源教授）

  2014年09月—2021年06月：中国科学院计算技术研究所，计算机系统结构专业，博士生（导师：孙凝晖院士）

  2010年09月—2014年06月：中国地质大学（武汉），信息工程专业，本科生（李四光计划）'
