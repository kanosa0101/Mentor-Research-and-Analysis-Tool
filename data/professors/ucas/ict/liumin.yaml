bio_raw: 中国科学院计算技术研究所研究员、博士生导师，中国通信标准化协会理事，北京市科技新星。2013年11月至2014年11月，美国德克萨斯大学奥斯汀分校访问学者。先后承担国家自然科学基金重点项目及面上项目、国家973课题、工信部宽带无线重大专项、国家发改委中国下一代互联网（CNGI）项目10余项，在IEEE
  Transactions on Mobile Computing、IEEE Transactions on Parallel and Distributed Systems、IEEE
  Journal on Selected Areas in Communications、IEEE Transactions on Communications、IEEE
  Transactions on Wireless Communications、INFOCOM、MobiHoc、ICDCS、IJCAI等国内外重要学术期刊和国际会议上发表论文60余篇，获得专利授权33项（含标准核心专利8项），专利受理46项，软件登记16项。
