bio_raw: '张杰，中国科学院计算技术研究所副研究员、博士生导师。研究方向：计算机视觉与模式识别、人工智能安全、多模态大模型，在知名期刊会议TPAMI/IJCV/TIP/CVPR/ICCV等上发表论文50余篇，承担中国科学院先导B课题、国家信息安全计划、科技部青年科学家课题、基金委面上、青基等项目10余项，研究成果在华为手机、智能高铁、工业质检等场景得到规模化应用。获2024年CSIG自然科学奖一等奖（序5）、2024年中国铁道学会科技奖二等奖（序4）。先后入选北京市科技新星、姑苏领军人才计划、中国科学院青促会和微软青年学者铸星计划。担任NeurIPS、ACL领域主席、智能安全期刊青年编委。

  2019年9月 — 今 ：中国科学院计算技术研究所，副研究员

  2017年7月 — 2019年9月：中国科学院计算技术研究所，助理研究员

  2011年7月 — 2017年7月：中国科学院计算技术研究所，硕博连读'
