bio_raw: '吴海彬，高级工程师。研究方向为高通量众核体系结构与数据流计算架构，作为核心骨干参与多款先进工艺高通量数据流处理器芯片的流片。在ISCA、ASPLOS、DAC、TC、TPDS、TACO
  等国际会议和期刊发表论文 10 余篇，一作论文入选 ISCA 2026 最佳论文候选。

  2025年10月 — 今：

  中国科学院计算技术研究所

  ，高级工程师

  2021年9月 — 2025年10月：

  中国科学院计算技术研究所

  ，工程师

  2018年7月 — 2021年9月：中国科学院计算技术研究所，助理工程师

  2015年9月 — 2018年7月：中国科学院大学，计算机学院，硕士

  2011年9月 — 2015年7月：华中科技大学，计算机科学与技术学院，本科'
