title: 高级工程师
email: mayl@ict.ac.cn
bio_raw: '1995年中央民族大学 计算机系毕业获得学士学位。

  1999年北京工业大学计算机系毕业，获得硕士学位。

  1999年3月~2000年3月：北京爱尔达电子设备公司 工程师

  2000年4月~2001年3月 曙光天演信息技术有限公司，工程师

  2001年3月~2001年10月 联想研究院 工程师。

  2001年10月至今 中国科学院计算技术研究所网络存储分中心工作。2008年4月任高级工程师。

  基于目前工作已经申请专利6项。'
