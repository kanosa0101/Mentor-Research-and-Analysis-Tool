bio_raw: '刘垚圻博士毕业于中国科学院大学，留任计算所工作，入选计算所新百星计划。研究方向为计算机体系结构；天基容错计算；通导遥算一体化。现任中国计算机学会容错计算专委副秘书长、执行委员，中国通信学会数字孪生与系统仿真专委秘书、执行委员。主持或参与国家重点研发计划、科学院战略先导计划、科技委基础加强项目、北京市自然基金、中国科学院特别资助项目等10余项，发表论文30余篇，发明型专利50余项。曾获中国科学院院长奖、所长特别奖、北京市优秀毕业生、中国科学院大学优秀毕业生等荣誉。

  2024年11月 — 今：中国科学院计算技术研究所，副研究员

  2022年7月 — 2024年10月：中国科学院计算技术研究所，特别研究助理（A类）'
