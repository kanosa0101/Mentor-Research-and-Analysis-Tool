bio_raw: '本人现在的研究兴趣是大数据分析、机器学习（包括深度学习等）技术的应用，及其并行化加速。特别欢迎有数学、物理、统计学背景并且对计算机应用感兴趣的同学报考我的研究生。

  工作经历

  2012年10月至今，中国科学院计算技术研究所，副研究员

  2012年4月至2013年4月，美国田纳西大学，访问学者（合作导师为TOP500创始人、美国工程院院士Jack Dongarra教授）

  2007年7月至2012年9月，中国科学院计算技术研究所，助理研究员

  学习经历

  2003.9-2007.7,中国科学院计算技术研究所，工学博士

  2000.9-2003.7,北京师范大学数学系，理学硕士

  1997.9-2000.7,北京师范大学数学系，理学学士'
