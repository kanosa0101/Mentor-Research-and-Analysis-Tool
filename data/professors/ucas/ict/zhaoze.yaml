bio_raw: 主要研究方向为人工智能，具身智能、多模态医学数据处理，物联网技术等，对多模态融合的医学数据处理方法具有较深入的研究，与国内多家医疗机构建立合作关系。研究设计的系统覆盖医疗生命健康、环境监测以及文物保护等多个领域。作为主要研究人员负责及参加国内自然科学基金、国家重点研发专项，重点基础研究科技计划及国际合作等多项科研工作。在国内外重要的会议及期刊上发表科研论文40余篇，获得30余项发明专利授权。获北京市科学技术奖。
