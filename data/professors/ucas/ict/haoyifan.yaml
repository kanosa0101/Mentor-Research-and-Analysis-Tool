bio_raw: '郝一帆，男，

  1996

  ，安徽省阜阳市。现任中科院计算所高级工程师，主要研究方向是智能芯片架构。研究成果曾发表于

  MICRO

  、

  NeurIPS

  、

  ICLR

  、

  SCIS

  等国际会议和期刊。曾获

  MICRO 2022

  最佳论文提名。

  2023

  年

  9

  月 — 今：中科院计算所，高级工程师

  2021

  年

  7

  月 —

  2023

  年

  9

