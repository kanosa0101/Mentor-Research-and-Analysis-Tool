bio_raw: '陈益强研究员

  2003

  年博士毕业于中国科学院计算技术研究所，现担任计算技术研究所副所长，泛在计算系统研究中心主任、研究员、博士生导师。主要从事人工智能和普适计算方向研究，在多模态高精度感知、跨模态细粒度关联及脑疾病智能辅诊模型等研究方面取得成果，在

  IEEE TKDE

  ，

  AAAI

  等人工智能与普适计算领域国际重要期刊和会议上发表论文百余篇，获得包括

  IJCAI-FL

  最佳应用论文奖、

  IJIT

  十五周年最佳论文奖等在内的会议最佳论文奖

  6

  项，申请发明专利

  84

  项（授权

  47

  项），相关成果获得国家及省部级奖项

  7

  项。

