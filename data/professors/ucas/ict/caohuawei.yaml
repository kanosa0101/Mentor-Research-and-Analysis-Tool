bio_raw: '曹华伟，副研究员，博士生导师，中国科学院大学岗位教师。研究方向为高通量运行时系统、图计算系统等。先后主持国家重点研发计划课题，工信部专项、国自然青年基金、北京市面上基金和大数据专项等项目。图计算系统成果曾入选国家“十三五”科技创新成就展，图计算关键技术连续三届获得Green
  Graph500世界第一，以及IEEE/MIT/Amazon GraphChallenge全球冠军（2023和2025年）。近年来在ICLR、SIGIR、TPDS、TACO、TKDE等期刊会议发表论文30余篇。获北京市技术发明一等奖，国际会议SEKE和ISPA最佳论文奖，SRDS会议最佳论文提名，并入选计算所“新百星计划”。

  教育及工作经历：

  2019年10月 — 今：中国科学院计算技术研究所，副研究员

  2017年7月 — 2019年9月：中国科学院计算技术研究所，助理研究员

  2011年9月 — 2017年6月：北京邮电大学，博士生

  2014年9月 — 2016年9月：劳伦斯伯克利国家实验室，联培博士

  2007年9月 — 2011年6月：武汉大学，电信学院，本科生'
