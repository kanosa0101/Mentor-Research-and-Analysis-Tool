bio_raw: '许倩倩，中国科学院计算技术研究所研究员，博士生导师。研究方向为机器学习、跨媒体计算、知识图谱。主持国家自然科学基金青年科学基金A类、B类、联合基金重点、北京智源学者、中国科学院先导课题等项目10余项。发表CCF-A类论文100余篇（包括TPAMI
  20余篇），获2024年ACM MM Honourable Mention Award，并获NeurIPS/CVPR等CCF-A类国际会议竞赛冠军10余项。担任国际期刊TMM、TCSVT、ACM
  TOMM和Multimedia Systems编委，10余次担任CCF-A类国际会议领域主席。现/曾任CSIG青工委副秘书长、CSIG多媒体专委会副秘书长、CCF多媒体技术专委会副秘书长、CAAI深度学习专委会副秘书长。曾获中国图象图形学学会自然科学一等奖（第一完成人）、吴文俊人工智能自然科学一等奖（第三完成人）、吴文俊人工智能科技进步二等奖、浙江省技术发明二等奖、茅以升北京青年科技奖、中国图象图形学学会石青云女科学家奖、吴文俊人工智能优秀青年奖、中国人工智能学会最佳青年科技成果奖、ACM中国SIGMM新星，并入选首份AI华人女性青年学者榜单。研究成果成功应用于国家安全部门、阿里巴巴、百度等。

  2022.10—至今 中国科学院计算技术研究所智能信息处理重点实验室 研究员

  2018.03—2022.09 中国科学院计算技术研究所智能信息处理重点实验室 副研究员

  2015.10—2018.03 中国科学院信息工程研究所信息安全国家重点实验室 副研究员

  2015.07—2015.10 中国科学院信息工程研究所信息安全国家重点实验室 助理研究员

  2013.07—2015.07 北京大学国际数学中心 博士后

  2007.09—2013.07 中国科学院大学 计算机科学与技术学院 博士生

  2003.09

  —

  2007.07 中国矿业大学 计算机科学与技术学院 本科生'
