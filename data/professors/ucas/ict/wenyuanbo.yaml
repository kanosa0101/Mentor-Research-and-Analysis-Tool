bio_raw: '文渊博，中国科学院计算技术研究所副研究员、硕士生导师。研究方向为智能处理器系统软件和计算机系统自动设计，深度参与多款深度学习处理器的系统软件研发工作，在ASPLOS、MICRO、ICML、NeurIPS等顶级会议和期刊上发表论文30余篇。曾获2026年北京市“高创计划·青年人才托举工程“，2025年世界互联网领先科技奖，获2024年“CCF体系结构博士学位论文激励计划”。

  2024年10月 — 今：中国科学院计算技术研究所，副研究员

  2022年7月 — 2024年10月：中国科学院计算技术研究所，助理研究员

  2017年9月 — 2022年7月：中国科学技术大学，计算机学院，博士生

  2013年9月 — 2017年7月：中国科学技术大学，少年班学院，本科生'
