bio_raw: '2021年6月 — 今：中国科学院计算技术研究所，高级工程师

  2020年1月 — 2021年5月：中国石油大学(华东)，海洋与空间信息学院，副教授

  2014年7月 — 2019年6月：中国石油大学(华东)，计算机与通信工程学院，讲师

  2011年7月 — 2014年6月：中国科学院计算技术研究所，助理研究员

  2011年7月 — 2014年6月：中科院计算所，博士后

  2008年4月 — 2011年3月：日本北见工业大学，博士'
