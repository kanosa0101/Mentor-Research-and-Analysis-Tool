  研究领域

  主要研究兴趣为操作系统、中央处理器以及软硬件深度融合与协同设计等。近年来在国内外期刊和会议上先后发表和合作发表学术论文上百篇，获2005年度国家科技进步奖二等奖1项（排名第一）。指导和合作指导毕业博士、硕士百余人，其中多位获中国科学院院长奖学金。

