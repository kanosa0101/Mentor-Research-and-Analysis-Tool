  招生方向

  软件分析与系统安全操作系统深度设计，基础软硬件核心技术与应用

  教育背景

  1987-09--1993-07   哈尔滨工业大学   计算机系获得工学博士学位1983-09--1987-07   北京轻工业学院（现北京工商大学）   计算机应用专业获学士学位

