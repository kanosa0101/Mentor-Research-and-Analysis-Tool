bio_raw: "[中文]\n[English]\n研究领域\n招生信息\n教育背景\n工作经历\n专利与奖励\n出版信息\n指导学生\n基本信息\n邓小明\n\
  研究员 博士生导师\n中国科学院软件研究所\n电子邮件：\nxiaoming@iscas.ac.cn\n通信地址：北京市海淀区中关村南四街4号\n邮政编码：100190\n\
  研究领域\n主要研究领域为计算机视觉、虚拟现实和人机交互。\n在计算机视觉方面，着重研究人手/人体的三维姿态估计和外形重建、操作合成、数字人运动合成、三维场景重建与理解等。\n\
  在虚拟现实和人机交互方面，着重研究机械手灵巧操作、人形机器人运动控制、手势交互界面、多通道交互等。\n招生信息\n招生专业\n081203-计算机应用技术\n\
  招生方向\n人机交互技术，计算机视觉\n招生要求\n1. 研究生招生信息\n：\n招收博士和硕士研究生，招生专业背景不限(包含并不限于计算机、软件工程、自动化、数学等专业)。希望你热爱科学研究，具有扎实的数学基础和编程能力(Python、C/C++等），以及良好的中英文表达能力和自律能力。\n\
  具有ACM-ICPC、NOI等程序设计竞赛、三维计算机视觉、图形学背景者将优先考虑。\n2. 博士后招收信息\n：\n2026年招收博士后1名，研究方向及主要研究内容：\n\
  人手与物体跟踪与交互合成方向\n：从事人手跟踪、抓取生成、强化学习的前沿算法和系统研究，具有人体或人手运动控制、机械手操作生成等研究经验者优先，与海内外著名实验室密切合作，完成高水平科研成果。\n\
  教育背景\n2004-09--2008-03 中国科学院自动化研究所模式识别国家重点实验室 工学博士学位\n2001-09--2004-06 武汉大学 理学硕士学位\n\
  1997-09--2001-06 武汉大学 理学学士学位\n工作经历\n2010-06-今，中国科学院软件研究所，人机交互北京市重点实验室，计算机应用技术，助理研究员，副研究员\n\
  ，\n研究员\n2012-04-2013-06，新加坡国立大学, 电子与计算机工程系，计算机视觉与计算机图形学，Research Fellow\n2008-02-2010-06，中国科学院计算技术研究所，虚拟现实技术实验室，虚拟现实，博士后\n\
  社会兼职\n2024-08-18-今,中国计算机学会人机交互专业委员会, 委员\n2020-10-16-今,中国图象图形学学会三维视觉专业委员会, 委员\n2018-05-19-今,北京市人工智能学会,\
  \ 理事\n2013-10-22-今,中国计算机学会计算机视觉专业委员会, 委员\n专利与奖励\n[1] 2025年、2026年北京图像图形学会优秀导师奖\n\
