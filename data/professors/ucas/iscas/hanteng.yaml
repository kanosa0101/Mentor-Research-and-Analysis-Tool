  研究领域

  人机协同具身智能交互

  招生信息

  人机交互技术方向特别研究助理/博士后，博士/硕士研究生（保研），实习生。

  本方向聚焦“人机协同具身智能交互”这一国家战略性新兴课题，旨在通过神经科学、数理建模与信息技术交叉融合，破解人类

  智能与机器智能协同的核心瓶颈，推动感知一致性、冲突消解与共生进化的实现。研究基于组内已建立的认知处理与运动控制

  模型框架，扩展视触本体等多感官反馈机制；研发轻薄高效电触觉界面，提升触觉渲染和神经刺激能力；并构建视触一体化交

  互平台，服务具身智能、遥操作等应用场景。

  - （方向一）深入探讨人类交互行为的神经机制，建立多模态数据表征理论；

  - （方向二）设计交互原语和规则，探析不同组织机制下的交互与协同决策方法；

  - （方向三）实现视觉-触觉时空同步渲染，克服感官局限，拓展神经刺激；

  招生专业

  081203-计算机应用技术

