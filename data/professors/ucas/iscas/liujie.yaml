  刘 杰

  中国科学院软件研究所

  研究员

  软件工程技术研发中心/智能软件工程北京市重点实验室

  中国科学院大学 岗位教授、博士生导师

  中国科学院青年创新促进会会员

  中国计算机学会系统软件委员会执行委员

  Email: ljie###otcaix.iscas.ac.cn

  研究领域

  领域智能分析模型与系统（AI+软件工程+系统软件交叉）

  领域智能体的可靠构建

  ：智能体持续学习与演化、LLM约束解码、Text-to-SQL智能体、数据科学代码生成智能体。

  智能分析平台与大数据系统

  ：统计与 AI 算法模型库、量化分析工具、地球大数据系统。

  知识增强模型与语义运行平台

  ：

  知识图谱、领域本体建模与语义对象层构建，支撑智能分析与闭环执行。

  主要工作

  地球大数据EarthDataMiner 平台研发

  在中科院 A 类先导专项“地球大数据科学工程”支持下，带领团队研发 EarthDataMiner，突破超大规模遥感影像分布式计算与交互式分析云服务技术，实现 SDGs
  指标全流程在线计算。

  获 2024 北京市科技进步一等奖；获 2023 中国测绘学会测绘科技进步特等奖

  数据量化分析工具及智能体研发

  自主研发数据统计分析与机器学习算法及可视化工具，对标商业软件IBM SPSS等算法指标，基于大语言模型构建

  Text2SQL和数据分析智能体

  ，在国家高端智库和综合性工程咨询的中央企业开展应用。

  RISC-V 基础软件研究

  在中科院 A 类先导专项“RISC-V 基础软件”支持下，研究基于代码大模型的 RISC-V 软件包迁移技术，并集成到工具“睿迁”：

  https://rvpt.top/

  知识驱动的智能模型设计方法

  提出知识驱动的智能模型设计框架，深入研究知识提取、知识图谱构建技术，应用于咨询、医疗、智能设备、民航、法律、地球科学等多个领域。

  科研项目主持

  主持国家自然科学基金项目 2 项、国家重点研发计划课题 1 项、重点基金课题 1 项，以及其他 10 余项科研型项目。

  产学研合作

  主导多项与华为、京东、中航信、航天科工、航天科技、航空工业等企业的合作项目。

  学术成果

  发表论文 60 余篇，获得发明专利 10 项。指导研究生参加大数据竞赛，多次获奖。

  学术服务

  国家自然科学基金评审人，《计算机学报》《软件学报》审稿人，多个国际会议程序委员会成员/审稿人。

  教学工作

  在中国科学院大学讲授《机器学习系统》等研究生课程。

  最新动态

  2026.6  论文 被 软件工程顶级会议 ASE 2026 直接录用  115/1236（CCF A），提出代码大模型 语法约束解码优化技术，确保生成代码符合语法约束。

  2025.11 论文 ALERT: Adversarial Learning Enhanced Stability-aware Routing Transformer
  for Adaptive Depression Detection 被人工智能顶级会议AAAI 2026(CCF A) 录用，提出基于社交网络进行抑郁症检测的新方法

  2025.9 论文

  Segment Policy Optimization: Improved Credit Assignment in Reinforcement Learning

  被人工智能顶会 NeurIPS 2025 (CCF A) 录用，提出对 DeepSeek R1 的 GRPO 强化学习算法的改进探索。

  2025.8 论文

  Root Cause Analysis of RISC-V Build Failures via LLM and MCTS Reasoning

  被软件工程顶级会议 ASE 2025 (CCF A) 录用，跨架构软件包迁移根因分析。

  2025.3 参与的《可持续发展目标地球大数据评估关键技术及应用》获 2024 北京市科技进步一等奖。

  2024.8 论文

  Dynamic Scoring Code Token Tree: A Novel Decoding Strategy for Generating High-Performance
  Code

  被软件工程顶级会议 ASE 2024 (CCF A) 录用。

  2021.9.22 《中国科学报》报道：“地球大数据”有了自主研发的在线分析工具。

