  研究领域

  研究领域主要是基于马尔科夫模型及其扩展的概率并发系统的模型检验。作为模型检验的重要扩展，概率模型检验是热门前沿基础研究领域之一。学术成果在著名会议和杂志上发表，例如
  CAV、CONCUR、LICS、POPL、ETAPS／TACAS、LMCS、 AAAI、Inf. & Comp.等。论文请参考：

  http://iscasmc.ios.ac.cn/?page_id=819

