  团队研究方向

  本人现任验室智能安全团队负责人，主要从事智能算法测评、智能体安全等方向研究工作。团队聚焦高风险领域，围绕人工智能技术在算法模型、生成内容、代理行为等维度风险，开展安全测评、风险检测与防护技术研究。

