  研究领域

  程序分析

  从程序代码（源代码、字节码、二进制码）出发，自动或者半自动地分析程序的性质，寻找程序可能的缺陷，改善软件的质量。目前正在进行中的研究工作包括面向C/C++/Java/Python代码的静态和动态分析。

