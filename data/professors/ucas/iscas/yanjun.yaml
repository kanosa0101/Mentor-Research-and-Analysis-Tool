  学生指导

  欢迎有志于软件事业，有较好的计算机软件理论基础，并具有一定软件开发能力的优秀学子来课题组继续深造。课题组研究生曾多次获得国家奖学金、北京市优秀毕业生、中国科学院院长奖等荣誉。软件所的招生信息请见

  这里

