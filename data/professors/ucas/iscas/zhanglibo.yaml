  招生信息

  本课题组招收有志于从事科研事业的硕士、博士、实习生。目前课题组项目主要为面向国家需求和国际前沿的科学研究项目，部分为大型合作企业的应用项目。主要方向为人工智能，计算机视觉，代码理解。建议联系与报考之前，通过近几年发表的论文，对组内的研究方向和内容进行简单了解。研究组会对有志于科研的同学进行1对1的科研指导，大部分学生在入学前能够投出或发表一篇顶级科研成果，但这意味着你将投入大量的时间和辛苦的汗水，

  选择我们，科研和学术工作将几乎占据你整个学生生涯，建议慎重考虑后联系。

  由于名额有限，为了节约彼此时间，将沟通和面试工作约束在合理范围内，请仔细阅读招生要求后联系报考。

  保研/报考学生满足中国科学院大学和中国科学院软件研究所的基本要求，参见相关网站招生简章。

  科研工作涉及阅读大量英文文献，撰写论文需要具备良好的写作能力，出国交流需要一定的口语能力，因此，组内要求6级英语成绩500分以上（专业技术能力特别优异者可适当放宽）。

  组内硕士生大多数会选择转博，由于名额极其有限，因此对于转博/普博的学生要求至少发表过一篇学生第一作者的CCF A类论文。

  联系时间：根据之前经验，组内名额

  建议在大二下学期/大三上学期进行提前联系

  ，我们会及时组织组内的面试考核，尽早确定保研指标。当然，后续也需要顺利通过软件所组织的保研面试。

  工作环境：部门配备了良好的学习环境，组内具有出色的科研氛围，同时提供了充足的计算资源。

  关于生源：不设置本科/硕士的学校限制，也希望你相信通过自己的努力可以改变命运。认真的态度，全身心的投入，极致的热爱，都远比本科高校是哪里重要的多。

  关于诚信：如果明确拿到组里的保研名额，后续无论有多么优秀的学生出现，也不会对之前的同学造成影响。也希望保研同学慎重考虑，信守承诺，因为后续放弃指标会对我们造成很大的影响。通过保研的学生，组内鼓励大家提前学习相关基础知识后，一般要求提前进入实验室，且本科毕业设计需与硕士方向紧密相关。

  联系方式：如果读完以上信息，你依然决心从事科研事业，可以将简历发至libo@iscas.ac.cn

  招生指标：组内在中国科学院软件所/中国科学院大学南京学院/中国科学院杭高院均有招生指标，

  来信联系时请注明报考选择（报考学生会首先进行一轮计算机基础的远程笔试）。

  Starting from 2023, a PhD student in my group must gained

  at least 7 points

  and a master student must gained 3 points before defending his/her thesis. Following
  is the detailed caculation:

  A+（3.0 points）: T-PAMI/IJCV

  A  （2.5 points）: CVPR/ICCV/ECCV/NIPS/ICML/ICLR, T-IP

  A-（2.0 points）: AAAI/IJCAI, T-MM/T-CSVT/T-NNLS/T-ITS/PR/CVIU

  B  （1.5 points）: ICME/BMVC/ICRA/IROS

