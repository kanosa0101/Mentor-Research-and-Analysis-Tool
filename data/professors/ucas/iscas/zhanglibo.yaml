  基本信息

  张立波 研究员 博士生导师

  长期从事人工智能算法与应用的教学和科研，研究方向包括复杂场景下的目标检测与跟踪、长视频视觉定位、医学语义信息挖掘，深入探索了视觉内部语义关联和外部信息引导下的视频理解方法，提出了一系列有效提升目标检测、目标跟踪和视频生成等基础任务的算法框架，并开展了在基础科学中的实际应用，在协和、朝阳医院、阜外等多家医院实现了通过人工智能技术进行特定领域的医学辅助诊断。发表TPAMI、IJCV、NuerIPS、CVPR、ICCV等人工智能领域国际顶级会议/期刊论文80余篇，主持国家自然科学基金、国家揭榜挂帅、院重点研究计划等项目，曾获得中国人工智能学会学术奖励、中国科学院朱李月华奖，担任The
  Innovation期刊信息学方向编委，中国科学院信息技术与人工智能专委会委员，同时是中国作家协会会员和中国科普作家协会会员，出版图书获得科技部全国优秀科普图书、中国科学院优秀科普作品、中国龙奖提名，入选国家农家书屋推荐书目和中国计算机学会科普阅读推荐图书。

  电子邮件：

  libo@iscas.ac.cn

  研究方向：人工智能，计算机视觉，代码理解

  通信地址： 中关村南四街4号中国科学院软件研究所

