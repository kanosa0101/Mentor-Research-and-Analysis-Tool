  工作经历

  工作简历

  2008.10--今 中国科学院软件研究所 研究员

  2005.06--2008.09 中国科学院软件研究所 副研究员

  2003.11--2005.05 中国科学院软件研究所 博士后

  科研活动

  主要从事综合信息系统技术、智能软件工程、大数据分析以及系统仿真等方面的技术研究工作。近五年主持和参与国家重点研发计划、自然科学基金、装备预研等项目二十余项，在国内外重要学术刊物和国际会议上发表学术论文80余篇，其中CCF-A类期刊和会议论文40余篇。曾获省部级科技进步二等奖2项、中科院杰出科技成就奖1项。

