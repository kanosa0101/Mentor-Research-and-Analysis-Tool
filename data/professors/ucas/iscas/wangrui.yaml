  研究领域

  面向复杂数据智能处理与决策支持的国家重大需求，研究复杂数据的获取、特征提取、关联分析挖掘，以及数据驱动融合知识的博弈对抗策略生成优化等技术，为向智能认知决策方向发展提供理论方法和技术基础。

  招生信息

  ​招收硕士研究生，要求学生对研究具有较强兴趣、较好的编程能力，研究方向为：

  1、复杂数据智能处理

  2、博弈对抗智能决策

