  个人简介

  林鸿宇，中国科学院软件研究所中文信息处理实验室特聘岗位副研究员。2020年博士毕业于中国科学院软件研究所。主要研究方向为大语言模型、信息抽取及基于知识的自然语言理解。近年来在ACL/EMNLP/AIJ/IJCAI/AAAI等自然语言处理和人工智能领域国际顶级期刊及学术会议上发表论文50余篇，主持和参与包括国家自然科学基金面上/青年基金、国家自然科学基金重点项目在内和中国科学院战略先导A类项目在内的多项国家级、部委级项目，以及CCF-百度松果基金、腾讯微信犀牛鸟基金等在内的多项企业合作项目。曾获ACL
  2024 Area Chair Award、EDBT 2025 Best Paper Runner-Up、中国科学院院长奖特别奖、中国中文信息学会优博、中国中文信息学会钱伟长中文信息处理科学技术奖一等奖。

  研究方向

  大语言模型、自然语言处理、信息抽取

  教育背景

  2015-09--2020-07   中国科学院大学   博士2011-09--2015-06   厦门大学   学士

