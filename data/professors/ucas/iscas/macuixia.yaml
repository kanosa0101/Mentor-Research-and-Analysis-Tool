  研究领域

  人机交互技术，多模态大模型与AI智能体，多模态融合可视分析，视频智能处理

  草图用户界面，多通道融合交互技术，可视媒体计算

  人机信任与接管，智能座舱自然人机交互技术

  围绕自然用户界面的基础理论、关键技术及其在典型领域的应用展开研究，在笔和草图交互、多模态大模型与AI智能体、多模态融合可视分析、人机信任与协同、认知计算、可视媒体智能处理方法等方面进行了深入探索并取得了一些突破性成果。

  主持和作为课题骨干参与国家级、省部级课题30余项, 在IEEE TVCG 、IEEE TMM、IEEE  TIP、IEEE TAC、CVPR、ECCV、ICCV、AAAI、IJCAI、IEEE
  VIS等国际著名期刊和会议上发表论文60余篇,申请国家发明专利20余项。入选2012年中国科学院软件研究所杰出青年人才计划项目支持。相关成果获得2019“牛顿奖”中国奖（Newton
  Prize 2019,牛顿奖是世界范围的重要奖项之一，旨在通过英国科学与创新伙伴关系帮助解决全球发展挑战，颁发给推动经济发展和社会福利的最佳研究或创新）；获2015北京市科学技术一等奖。相关成果实现落地应用，获2024年度华为公司级优秀合作项目奖（全球遴选，前TOP1.8）；获2016中国科学院朱李月华优秀教师奖。获2021、2024、2026年中国科学院软件研究所优秀导师荣誉称号,指导学生获得北京市优秀毕业生、中科院院长奖。

