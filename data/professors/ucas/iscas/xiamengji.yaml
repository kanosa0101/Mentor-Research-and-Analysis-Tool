  [J/OL]. SIAM Journal on Computing, 2009, 38(5): 1970-1986. https://doi.org/10.1137/070690201.

  非负有理数值域

  3.

  Bulatov A, Dyer M, Goldberg L A, et al. The complexity of weighted Boolean #CSP
  with mixed signs

  [J/OL]. Theoretical Computer Science, 2009, 410(38-40): 3949-3961. https: //doi.org/10.1016/j.tcs.2009.06.003.

  有理数值域

