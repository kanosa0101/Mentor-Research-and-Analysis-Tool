  两组二分定理参考文献

  对已知的二分定理推广，无论是推广定义域，还是值域，还是函数形式，例如从对称函数到一般函数，还是函数集合的形式，例如从单点集到一般集合，还是问题框架，例如从#CSP问题到Holant问题，虽然很少公开在论文中被问到，都是明显的未解决问题。

  我对正在指导的前两篇博士论文，提出了文献方面的具体要求——尽量完整地分别整理出一般图与平面图的布尔定义域的计数问题的二分定理文献。

  一、一般图上布尔定义域的计数二分定理

  #CSP

  1.

  Creignou N, Hermann M. Complexity of Generalized Satisfiability Counting Problems[J/OL].
  Information and computation, 1996, 125(1): 1-12. https://doi.org/10.1006/inco.1996.0016.

  0-1

  值域

