  Cai J Y, Lu P, Xia M. The complexity of complex weighted Boolean #CSP [J/OL]. Journal
  of Computer and System Sciences, 2014, 80(1): 217-236. https://doi.org/10.1016/j.jcss.2013.
  07.003.

  复数值域

  Holant^*

  和Holant^c

