  个人简历

  2015—2021：中国科学院软件研究所计算机科学国家重点实验室主任

  2002年至今：中国科学院软件研究所二级研究员

  1993—2002：重庆大学计算机系教授

  2011—2021：澳大利亚Griffith大学集成智能研究所兼职教授

  1998—2002：加拿大Alberta大学和Simon Fraser大学计算机系访问教授

  1995—1996：美国Maryland大学高级计算机研究所访问学者

  1992—1993：法国Valenciennes理工学院博士后

  1991年：重庆大学计算机科学博士学位

  研究方向

  主要研究数据挖掘 (Association, Classification, Clustering, Document Summarization, Relational
  Data Mining)和人工智能 (Knowledge Representation and Reasoning, Semantic Web, Deep Learning)
  。

  代表性研究工作

  基于utility的关联规则挖掘方法，多源异构大数据的聚类融合方法，语义Web本体数据与规则的集成模型，人工智能回答集逻辑语言语义模型，以及逻辑程序的linear
  tabling推理方法等。主要成果发表在Artificial Intelligence (AIJ)、ACM Transactions on Computational
  Logic (TOCL)、IEEE Transactions on Knowledge and Data Engineering (TKDE)、The AAAI
  Conference on Artificial Intelligence (AAAI)、The International Joint Conference
  on Artificial Intelligence (IJCAI)、The ACM SIGKDD Conference on Knowledge Discovery
  and Data Mining (KDD)、The IEEE International Conference on Data Mining (ICDM)等

  国际学术期刊和会议

  。

