bio_raw: "[中文]\n[English]\n研究领域\n招生信息\n工作经历\n专利与奖励\n出版信息\n科研活动\n合作情况\n指导学生\n基本信息\n\
  陈伟  男\n博士生/硕士生导师  中国科学院软件研究所\n电子邮件： wchen@otcaix.iscas.ac.cn\n通信地址： 北京市海淀区中关村南四街四号中国科学院软件研究所5号楼6层\n\
  邮政编码： 100190\n研究领域\n中国科学院软件研究所 软件工程技术研发中心（\thttp://tcse.cn/\t）研究员，中国科学院特聘研究岗研究员，博士生/硕士生导师。长期从事软件工程和系统软件相关的研发工作，获得中国电子学会科技进步一等奖\t\
  1\t项、二等奖\t1\t项，软件所优秀青年人才等。作为负责人和技术骨干承担和参与多项国家重点研发计划项目\t/ 课题 / 子课题、国家自然科学基金项目、工信部高质量专项项目、所创新基金重大项目等；长期与国内头部互联网企业、软件研发企事业单位开展合作。在\t\
  ICSE、ISSTA、FSE、ASE、IMWUT等顶级会议和国内外高水平学术会议和期刊发表学术论文60余篇，获得\tACM SIGSOFT\t杰出论文奖，入选\t\
  “\t领跑者\t5000” \t中国精品科技期刊顶尖学术论文，申请发明专利 20 余项。担任 IEEE Transactions on Software Engineering、IEEE\
  \ Transactions on Services Computing、IEEE Transactions on Parallel and Distributed\
  \ Systems、软件学报、计算机科学、ISSTA、ICWS、APSEC、ICSS\t等多个学术期刊、国际会议的审稿人和国家自然科学基金同行评议人等。\n先后（共同）指导学生二十余人，获得中国软件开源创新大赛特等奖、一等奖，OW2\
  \ Programming Contest 一等奖，NASAC原型竞赛优胜奖等，多人次获得国家奖学金和优秀毕业生等荣誉。\n当前的主要研究兴趣点聚焦在AI Infrastructure\
  \ and AIoT，具体包括：\n大模型部署与推理优化，尤其面向资源受限的边、端计算场景，研究模型轻量化和推理优化相关技术；\n深度学习框架和编译器的缺陷分析与质量保障，当前主要聚焦在如PyTorch和TorchDynamo等框架和编译器的缺陷分析与测试；\n\
  人机物融合场景下的复杂AIoT系统，当前主要聚焦在基于智能体的Smart Home系统构建及其可靠性保障；\n智能化软件工程技术，当前主要关注基于LLM和RAG的漏洞检测，基于LLM的代码检查规则生成等；\n\
  云原生系统开发运维，如：函数服务(FaaS)构建及优化，FaaS部署与执行调度优化等。\n招生信息\n招收对AI4SE（如：智能化软件分析与测试）、AI Infra\
  \ and AI Native System（如：深度学习框架、LM推理引擎、agentic system）相关研究感兴趣的 博士生 / 硕士生 / 实习生 /\
  \ 访问学生(常年有效)，要求学生对研究具有较强兴趣、较强的动手能力和自我驱动力！\n联系方式：\nwchen AT otcaix.iscas.ac.cn\n\
