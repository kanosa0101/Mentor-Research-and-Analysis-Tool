  研究领域

  长期从事综合信息系统的总体技术研究， 主要研究方向是信息系统的体系结构、信息处理技术、数据管理与系统集成、面向服务计算、服务软件平台技术、指挥信息系统等。

  招生信息

  面向服务的计算、信息系统体系结构、异构信息系统的数据集成、指挥信息系统应用技术

