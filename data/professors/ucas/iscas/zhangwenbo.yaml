  工作经历

  中国科学院软件研究所，研究员，博士生导师。中国通信学会云计算与SaaS专家委员会委员，CCF委员。主要从事虚拟化技术、中间件技术等方面的研究开发工作，在云计算、软件服务质量保障、性能建模以及优化等方面有创新性研究成果，在国内外学术刊物和会议上发表了50余篇学术论文。曾主持过“核高基”重大专项、863课题、科技支撑计划等多个国家级项目。

  张文博曾担任COMPSAC 2012分论坛主席、Middleware 2014宣传主席， COMPSAC、QSIC、REFS、SOSE等国际会议会议程序委员会成员，及TSC、SPE、JSS等多个国际期刊的审稿人。他在大型网络系统的设计与平台软件关键技术研发方面有丰富的经验积累，已取得十余项技术发明专利，其负责研发的国产应用服务器OnceAS国内首家通过J2EE1.4兼容性认证。曾获国家科技进步奖二等奖一项，北京市科学技术一等奖一项，电子学会信息科学技术一等奖一项。

