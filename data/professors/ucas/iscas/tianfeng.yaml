bio_raw: '[中文]

  [English]

  教育背景

  工作经历

  教授课程

  基本信息

  中国科学院软件研究所副所长、二级研究员，国家级领军人才，

  国家科技进步二等奖第一完成人，享受国务院政府特殊津贴专家，国家科技创新2030—“新一代人工智能”重大项目、国家重点研发计划项目首席科学家。担任

  中国计算机学会人机交互专委会主任、

  中国图象图形学学会人机交互专委会主任、

  ACM SIGCHI中国分会主席（2011-2019）等职。担任ACM Transactions on Interactive Intelligent Systems
  (TiiS)等人机交互领域著名国际刊物编委，多次担任国际顶级及著名学术会议程序委员会委员(ACM CHI, WWW，IUI，MoblieHCI等)。在CHI，UIST，
  IJHCS等国内外重要期刊会议上录用/发表学术论文百余篇，合作出版专著2部、译著1部。技术成果已覆盖到国内30多个省市以及北美、欧洲、亚洲、非洲等多个国家，并在协和、天坛等大型三甲医院，国家跳水队、羽毛球队等多个国家队成功应用。作为第一完成人获得了2018年度国家科技进步二等奖、2015年度北京市科学技术一等奖。三次获得人机交互领域顶级会议ACM
  CHI 最佳论文提名奖， 两次获得人机交互领域顶级会议ACM UIST 最佳论文提名奖(Honourable Mention Award)。

  招生信息

  招收人机交互相关领域博士后、博士生、硕士生、实习生等。有意向请发邮件到tianfeng(at)iscas.ac.cn

