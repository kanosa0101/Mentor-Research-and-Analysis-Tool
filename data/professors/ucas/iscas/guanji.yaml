  研究领域

  量子计算与形式化方法的交叉研究：

  专注于量子系统的模型检测、可信量子机器学习、量子算法以及量子差分隐私等领域的探索。通过引入形式化验证技术，旨在提高量子算法和量子系统的可靠性与安全性。

  量子机器学习与算法优化

  ：开发适用于中等规模噪声量子设备的高鲁棒性量子机器学习模型，涉及高维数据分类、量子态判别等应用。研究涵盖了量子电路训练复杂性、非线性表达能力及量子计算加速效应，着力于提升量子机器学习在图像识别和量子纠缠检测等任务中的性能。

  量子工具链开发

  ：主导开发了VeriQ可信量子计算工具链，包括量子设计自动化、量子程序验证与分析、以及可信量子机器学习组件，为量子算法和电路的优化和验证提供完整支持。

  量子隐私保护与安全

  ：研究量子差分隐私机制，提出最优算法设计，以保障量子数据处理过程中的隐私与安全性，适用于实际量子计算应用场景。

  招生信息

  本人长期从事量子计算与形式化方法交叉领域的研究，并主导多个量子计算和量子机器学习的前沿项目，涵盖量子系统的模型检测、可信量子机器学习算法、量子电路优化、以及量子隐私保护等方向。欢迎具有量子计算、形式化方法等背景的同学加入团队，共同探索形式化方法在量子计算中的应用。

  我们提供的研究方向包括但不限于：

  •

  量子系统的模型检测与形式化验证

  •

  量子隐私保护机制及量子差分隐私

  •

  量子（机器学习）算法的设计与优化

  •

  噪声环境下量子计算资源的高效利用

  •

  可信量子计算工具链开发

  本人长期招生研究生、实习生和博士后，研究组经费充足。欢迎有志于在量子计算与形式化方法领域发展的优秀学子与我联系，共同推动该领域的创新与突破。联系邮箱：guanj@ios.ac.cn

