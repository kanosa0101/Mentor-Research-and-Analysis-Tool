  主要研究

  针对

  NISQ

  时代噪声影响，形式化（在严格数学证明基础上）验证和设计高鲁棒（抗噪声）和高隐私量子机器学习算法：

  定义了一个用于量子机器学习算法的局部鲁棒性、全局鲁棒性和差分隐私性等可信性质验证和分析的形式化框架：开发算法来形式化验证这些可信性质并通过验证信息来设计高鲁棒性（抗噪声）和具有隐私保护的量子机器学习算法，保障量子机器学习算法（在

  NISQ

  时代）的安全可靠运行。这系列工作作为量子计算领域仅有的两篇被接受的工作已经发表在国际计算机辅助验证最好的（中国计算机协会

  CCF A

  类）会议

  CAV 2021

  和

  2022

  上，以及安全领域国际四大会议（

  CCF A

  类）之一的

  ACM CCS 2023

  上，相关工具发表在软件工程旗舰会议（

  CCF A

  类）

  FM 2024

  上。这系列工作获得审稿人高度评价“

  It is an important first step on the field.

  ” “

  In any case, this is the first published algorithm for solving the given problem.

  ”开创了一个新的研究方向并取得突破。

  ​估计保真度的量子（指数）加速算法：

  与合作者利用量子奇异值变换和量子幅度估计等算法，设计出了首个针对低秩混合量子态的计算量子保真度的多项式算法，相比于已知的最好算法有指数级加速。我们技术上的贡献是，将酉算子的块编码推广至量子态的块编码，并将块编码的技术推广至在某些条件下不依赖于其条件数。此外该算法被进一步扩展去计算迹距离和熵等一些列重要的量子信息量。相关工作发表在国际信息论方向最好的期刊（

  CCF A

  类）

  IEEE TIT 2023

  和

  2024

  上。此外，因为量子算法的鲁棒性和隐私性主要依靠保真度及迹距离等度量来定义，所以这一系列量子（指数）加速算法可以在容错量子计算时代用于在量子计算机上验证量子算法的鲁棒性和隐私性。

  模型检测量子系统，用于形式化验证系统设计的正确性：

  提出多种量子时序逻辑用于表示量子系统的演化性质并开发模型检测算法来自动化检测量子系统（包括量子通讯协议、算法、程序等）的正确性，保证系统按照预期设计运行。这系列相关成果发表在形式化方法国际顶级或知名会议和期刊上，包括

  CCF A

  类：

  CAV 2024

  ，

  CCF B

  类：

  JCSS 2018

  、

  CONCUR 2021

  、

  TACAS 2022

  等。

  可信量子计算工具链

  VeriQ

  ：

  与应明生教授联合领导一个名为

  VeriQ

  的可信量子计算工具链的开发项目，其中包括

  (1) QDA

  （量子芯片设计自动化）、

  (2)

  量子程序验证和分析以及

  (3)

  可信量子机器学习。目前已经上线

  10

  个相关工具。

  VeriQ

  也是国际上第一个较为完整的可信量子计算工具链，为开发安全可靠的量子系统打下理论和工程基础。查看网站

  https://www.veri-q.com

  。

  量子噪声模拟器：

  基于张量网络，通过奇异值分解方法，提出高效含噪量子电路的模拟方法，能支持上百含噪量子比特电路近似模拟。相关成果发表在国际芯片设计自动化的三大会议之一

  DATE 2024

  上，并且相关技术已经获批国家发明专利。

  硬件对接：

  本人所开发的

  QDA

  工具和模型检测工具已经成功嵌入到所在团队开发的量子程序设计语言

  isQ

  中，用于量子电路的编译优化并保证其正确性，并对接国际领先的超导量子芯片

  “

  祖冲之二号

  ”

  ，促进软硬件融合，帮助量子芯片高效可靠运行。

