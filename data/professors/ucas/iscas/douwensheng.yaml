  研究领域

  我长期从事基础软件质量保障的理论、方法与技术研究。研究方向聚焦于两大交叉领域：

  面向基础软件的智能化软件工程（如AI4SE、LLM4SE、SE4AI等），以及智能化基础软件（如“AI+”基础软件、“Agent+”基础软件）

  。针对数据库系统、分布式系统、智能系统、具身智能系统等关键基础软件，提出了一系列高效的质量保障技术，相关成果已在TSE、TOSEM、ICSE、FSE、ASE、ISSTA、AAAI、VLDB、ICDE、EuroSys等高水平期刊与会议上发表论文70余篇（其中CCF
  A类国际期刊与会议论文40余篇），并多次获得ACM SIGSOFT杰出论文奖、软件学报高影响力论文奖。研究成果已在华为、阿里、腾讯、达梦、浪潮、金山等多家头部基础软件企业中获得实际应用，为满足重要领域的基础软件国产化替代提供了关键技术支撑。

  我入选中国科学院青年创新促进会优秀会员、中国科学院特聘研究员、中国科学院软件研究所杰出青年、微软亚洲研究院“铸星计划”学者，曾获中国计算机学会优秀博士学位论文奖、NASAC青年软件创新奖、中创软件人才奖等荣誉。受邀担任FCS青年编委、JCST青年编委，以及TOSEM、TOPLAS、TSE、TPDS等顶级国际期刊审稿人，并多次担任ICSE、FSE、ASE、ISSTA等顶级国际会议程序委员会委员。

  招生信息

  研究组长期招收对科研有浓厚兴趣的博士生、硕士生、实习生，致力于“

  AI+软件工程+基础软件

  ”的交叉研究，重点包括

  智能化软件工程

  （AI、大语言模型如何赋能软件工程的自动化与智能化）、

  智能化基础软件

  （如何利用AI增强数据库、分布式系统等基础软件的易用性、性能、可靠性等）、

  智能系统可信保障

  （AI原生基础软件本身的安全、可靠、可信）等方向。欢迎有意者在联系或报考前，阅读研究组

  近三年发表的论文

  ，以初步了解我们的研究方向与内容。

  我认为培养学生的独立科研能力是导师的首要责任。我们致力于营造开放、协作的学术环境，与学生共同探索前沿科学问题，助力每位学生成长为能独立解决重要科学问题的研究者。在这一理念引导下，研究组学生表现突出，多数学生能在入学一年内即可完成并投出顶级期刊或会议论文，多名毕业生获得CCF优秀博士学位论文奖、中国科学院优秀博士学位论文奖、中国科学院院长奖、三好学生标兵、国家奖学金等荣誉（详情参考

  我的个人主页

  ）。这也意味着，如果你选择加入，需要对科研怀有真诚的热爱，并愿意为之投入持续而专注的努力。

  研究组内名额有限，如有意向建议尽早通过邮件联系（建议大二下学期或大三上学期），我们期望申请人具备以下基本素质：（1）热爱编程，具备较强的动手实践能力；（2）具备团队协作意识，乐于共同推进科研工作；（3）态度积极主动，能主动承担并推进科研工作；（4）富有探索精神，勇于尝试并解决有难度的研究问题。

