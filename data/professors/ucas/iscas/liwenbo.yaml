  研究领域

  操作系统

  新型内核架构

  ：针对未来计算机系统在底层硬件异构性（指令集架构）和上层软件异构性（应用软件生态）的扩大化发展趋势，聚焦于瓶颈层的OS，以内核架构创新为突破口，以

  multi-kernel

  为重点，在系统架构、关键机制和软件形态等核心要素方面发展深度软件定义能力，从而极大提高操作系统的可塑性、适应性和生产力。

  多生态运行时

  ：突破操作系统在用户空间架构的经典设计，创建和发展可扩展软件生态（Linux、Windows、Android、鸿蒙等）运行时的

  新层级

  ，跨越应用生态被特定操作系统锁定的技术障碍，为既有应用生态的延续、新生应用生态的发展、异构应用生态的共生提供关键技术支撑。

  信息技术全栈

  ：面向我国对信息技术体系自主化、智慧化、生态化的既定目标，在

  信息基座（CPU*OS）

  、

  智能中枢（AI）

  、

  应用生态（App）

  等关键层级上，深度优化软硬件协同机制、大模型调优推理、多生态共存融合等赋能技术，逐步加强信息技术全栈的建设。

  虚拟化

  面向特定性质计算任务（如显示关键、存储关键、网络关键、计算关键等及其复合类型），聚焦桌面计算机的典型使用模式Multi-OS（“Host+Guests”），研究基于虚拟化的软件定义技术，从根本上提升信息系统整体的负载适应性、运行高效性和生态包容性。主要研究内容包括：

  HOST：主机关键设备（显示、存储、网络、加速器等）的

  快速路径

  技术

  VMM：非对称Multi-OS计算环境下的

  资源一体化

  技术

  GUEST：进程内特定计算类型的按需分离和

  非侵入卸载

  技术

