  简历

  1994年获中国科学技术大学计算机软件专业博士学位。1992~1993年作为合培博士工作于奥地利应用知识处理研究所。现为中国科学院软件研究所研究员，博士生导师，享受政府特殊津贴，新世纪百千万人才工程国家级人选，中科院软件所学位委员会主席、学术委员会委员。兼任国家“核高基”重大科技专项实施专家组成员、“十二五”国家863计划制造服务技术主题专家组成员、工信部电子科学技术委员会委员、全国信息技术标准化技术委员会委员、中国计算机学会系统软件专委会委员、中国科学院研究生院计算机科学与控制工程学位委员会副主席、国际开源中间件技术联盟OW2战略成员和技术指导委员会成员、第一届创业板专家咨询委员会委员、《软件学报》执行编委、《计算机研究与发展》、《计算机集成制造系统》等期刊编委等职。

  作为负责人或技术负责人先后承担多项国家973基础研究计划项目、国家自然科学基金重大、重点项目、国家863高技术计划重大、重点项目，以及国际合作科研课题。在网络分布式软件理论与构造方法、网络分布式软件的互操作理论与技术、以及网络分布式软件系统运行机理和关键技术等方面开展了系统深入的研究。出版学术著作1部，在国内外著名学术期刊和会议上发表论文100多篇，他引近350次（单篇论文最高他引56次），技术发明专利授权12项，获国家科技进步二等奖2次，中国科学院科技进步一等奖1次，北京市科技进步一等奖1次，中国高校科学技术二等奖1次，中创软件人才奖。

