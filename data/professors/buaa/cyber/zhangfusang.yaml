  科研成果

  张扶桑，博士、教授、博士生导师，国家优秀青年科学基金获得者，入选北京市科技新星，吴文俊人工智能优秀青年奖，

  ACM SIGMOBILE China新星奖，微软铸星学者，AIoT青年科学家。主要研究方向为智能物联网、智能感知与安全等。在顶级国际期刊/会议发表论文60余篇，包括IEEE
  JSAC, IEEE TMC, ACM MobiCom, USENIX NSDI，ACM UbiComp, ACM CoNEXT等。研究成果荣获移动计算与网络顶级会议MobiCom最佳论文提名奖，MobiCom最佳社区论文提名奖，UbiComp杰出论文奖，MobiQuitous最佳论文提名奖，CCF
  TPCI最佳论文奖、HHME PCC会议最佳论文奖。研究成果受到了中国科学报、著名科技新闻媒体《新科学家》等多家媒体的专访报道。主持国家自然科学基金优秀青年科学基金、面上基金、青年基金、北京市自然科学基金-小米创新联合基金、北京市科技新星交叉合作项目、腾讯犀牛鸟专项研究计划。

