  ◆

  教学及科研成果

  主持和区块链与数字货币、应用密码学、数据安全与隐私等领域国家重点研发计划项目4项，国家自然科学基金（重点）重点项目2项，国家自然科学基金面上项目4项，中国密码发展基金重点项目1项；发表论文240余篇，其中IEEE/ACM
  ToN, TIFS, TDSC, TC, TPDS, TITS, TVT, Eurocrypt, Asiacrypt, ACM CCS等顶级期刊和顶级会议论文40余篇，引用7500余次；申请发明专利120余项，转化专利10余项；获省部级科技奖励2项。出版教材和专译著7部；指导7名学生获中央网信办“网络安全优秀学生”奖励，1名学生获“北京市优秀毕业生”荣誉称号，1名学生获北京市优秀博士学位论文提名；获北京市高等教育教学成果二等奖1项，北航教育教学成果特等奖1项。

  ◆

  学术与社会服务

  曾任密码学会青年工作委员会副主任，现任密码学会区块链专委会副主任委员，密码学会密码协议专委会委员、密码学会密码应用工作委员会委员、计算机学会区块链专委会常务委员。担任100余个网络空间安全领域重要国际会议程序委员会委员，以及4个国际期刊编委。

  Curriculum Vitae  (CV)

  Qianhong  Wu received his Ph.D. in Cryptography from Xidian University in 2005.
  Since  then, he has been with Wollongong University (Australia) as an associate
   research fellow, with Wuhan University (China) as an associate professor, and  with
  Universitat Rovira i Virgili (Spain) as a research director. He is currently  a
  professor in Beihang University in China. His research interests include  cryptography,
  information security and privacy, blockchain and  cryptocurrency, AI security and
  privacy. He has been a holder/co-holder of  over 10 China/Australia/Spain funded
  projects. He has authored more than 40  patents and over 130 publications in leading
  journals and conferences. He has  served in the program committee of dozens of several
  international  conferences in information security and privacy.'
