bio_raw: '基本情况

  教育经历：

  2014—2019，北京航空航天大学，导航制导与控制，博士

  工作经历：

  2022至今，北京航空航天大学，网络空间安全学院，副教授

  2019—2022，北京航空航天大学，网络空间安全学院，博士后

  兼职情况：

  中国指挥与控制学会集群智能专委会委员

  中国指挥与控制学会青工委委员

  International Journal of Micro Air Vehicles青年编委

  主讲课程

  研究生课程：《无人系统安全》《软件安全》《无人集群系统智能自主控制》

  本科生课程：《自动控制基础》

  研究方向

  1. 无人系统安全与反制

  2. 具身智能安全

  教学科研成果

  获奖情况：

  1. 无人机蜂群自主协同决策与智能制导控制技术，技术发明一等奖，中国指挥与控制学会（省部级），2024

  2. 异构无人集群分布式协同博弈规划与智能控制技术，技术发明二等奖，中国指挥与控制学会（省部级），2026

  3. 无人机集群弹性重构技术及应用，科技进步二等奖，中国指挥与控制学会（省部级），2025

  4. 复杂通信条件下的大规模无人机集群自主协同飞行技术及应用，创新二等奖，中国发明协会（省部级），2024

  5. 工业无人机集群智能协同平台的研发与产业化，创新创业一等奖，苏州高新区（市区级），2025

  发明专利：

  1. 刘亦石、鲁超杰、董希旺等，一种网络攻击下无人机集群弹性安全编队方法及设备，专利号：2024116863353

  2. 刘亦石、鲁超杰、董希旺等，一种异构无人机集群弹性安全控制方法、装置、设备及介质，专利号：2024119187687

  3. 董希旺、刘亦石、任章等，一种智能集群一体化容错时变编队控制方法及系统，专利号：202011403524.7

  4. 董希旺、刘亦石、化永朝等，一种无人机集群弹性安全编队方法及系统，专利号：202210606870.8

  5. 李清东、刘亦石、董希旺等，一种弹性飞机容错飞行控制方法及系统，专利号：202011403952.X

  代表性论文：

  1. Yishi Liu, Zhang Ren, Jonathan Cooper. Integrated strategy for commercial aircraft
  fault-tolerant control. Journal of Guidance Control and Dynamics.

  2. Yishi Liu, Wenxin Li, Xiwang Dong. Resilient control for a flexible wing aircraft:
  An active output feedback approach. Aerospace Science and Technology.

  3. Yishi Liu, Xiwang Dong, Enrico Zio, Ying Cui. Event-triggered multiple leaders
  formation tracking for networked swarm system with resilience to noncooperative
  nodes. IEEE Transactions on Cybernetics.

  4. Yishi Liu, Xiwang Dong, Enrico Zio, Ying Cui. Active resilient secure control
  for heterogeneous swarm systems under malicious cyber-attacks. IEEE Transactions
  on Systems, Man, and Cybernetics: Systems.

  5. Yishi Liu, Xiwang Dong, Pengfei Shi, Zhang Ren, Jianwei Liu. Distributed fault-tolerant
  formation tracking control for multiagent systems with multiple leaders and constrained
  actuators. IEEE Transactions on Cybernetics.'
