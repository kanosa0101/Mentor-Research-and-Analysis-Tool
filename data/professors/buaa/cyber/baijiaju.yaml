bio_raw: '基本情况

  教育经历：

  2009年—2013年，西安电子科技大学计算机学院，工学学士

  2013年—2018年，清华大学计算机系，工学博士（导师：胡事民院士）

  工作经历：

  2018年—2021年，清华大学计算机系，博士后

  2021年—2023年，清华大学计算机系，助理研究员

  2023年—至今，北京航空航天大学网络空间安全学院，副教授

  兼职情况：

  中国网络空间安全学会出版工作委员会总干事

  中国计算机学会系统软件专委会/嵌入式系统专委会/网络与系统安全专委会执行委员

  《网络空间安全科学学报》青年编委

  主讲课程

  本科生课程：软件分析与安全、系统安全基础实验、网络安全实训

  研究方向

  系统软件安全

  操作系统

  程序分析

  教学科研成果

  从2013年起一直研究利用程序分析技术检测操作系统、数据库系统、网络协议栈等系统软件的缺陷和漏洞，在主流开源和国产系统软件中发现超五千个真实缺陷和漏洞。以第一/通讯作者身份在系统和安全会议期刊上发表40余篇学术论文（CCF-A类20余篇），并主持国家自然科学基金面上/青年项目、国家科技重大专项子课题、中央网信办支撑项目等20余个科研项目，研究成果应用于华为、腾讯、蚂蚁、航天科技等国内知名企业单位，获得10余项应用证明和感谢信。近三年获得400余个CVE/CNVD/CNNVD原创漏洞证书，有力支撑了开源和国产关键软件安全保障工作。

  获奖情况：

  1. 入选2024年中央网信办人才支持计划

  2. 获得2024年ACM ChinaSys新星奖

  3. 入选2025年中国电子学会青年人才托举工程

  4. 入选2025年小米青年学者

  5. 获得2026年中国电子学会和北京航空航天大学教学成果奖二等奖

  代表性论文：

  1. Jia-Ju Bai. BESA: Extending Bugs Triggered by Runtime Testing via Static Analysis.
  In EuroSys 2025. (唯一作者)

  2. Jia-Ju Bai, Rui-Nan Hu, Cheng Li, Jianjun Chen, Rui Chen, Zhenyu Guan. NetPuzz:
  Testing Network Printers via Fully Black-Box and Feedback-Guided Protocol Fuzzing.
  In IEEE TDSC 2026. (第一作者)

  3. Gui-Dong Han, Jia-Ju Bai*, Qiu-Ji Chen, Jiqiang Lu. Static Detection of TOCTOU
  Bugs Caused by Kernel Races. In USENIX Security 2026. (通讯作者)

  4. Zi-Xuan Fu, Jia-Ju Bai*, Hong-Bo Feng, Kang Chen. One DBMS, Two Modes, and a
  Bunch of Bugs: Catching Logic Bugs in Distributed DBMSs via Differential Testing.
  In SIGMOD 2026. (通讯作者)

  5. Fudong Wu, Qianhong Wu, Jia-Ju Bai*, Bo Qin, Zhenyu Guan, Willy Susilo. Network-Layer
  Differential Fuzzing for Ethereum. In IEEE TIFS 2026. (通讯作者)'
