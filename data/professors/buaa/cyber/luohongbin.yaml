  ◆

  教学及科研成果

  长期从事未来互联网体系结构与关键技术、空天地海网络一体化、无人机集群组网等研究。近年来，在

  IEEE Communications Surveys & Tutorials、IEEE Trans. on Networking、IEEE Journal on
  Selected Areas in Communications、IEEE Trans. on Parallel and Distributed Systems、IEEE
  Network等互联网领域国际权威刊物和会议发表论文60余篇，获国家授权发明专利26项（其中20项已转让/许可北京神州高铁股份有限公司、中兴通讯等使用），获国家发明二等奖（2014，排第四）、教育部技术发明一等奖（2013，排第三）等奖励。

  ◆

  学术与社会服务

  曾任

  IEEE Communications Letters编委、IEEE INFOCOM、IEEE GLOBECOM、IEEE ICC等国际会议的TPC成员；现任KSII
  Transactions on Internet and Information Systems等期刊编委、任IEEE GLOBECOM 2018国际会议NGNI
  Symposium的TPC Co-Chair。 任中国电子学院青年科学家俱乐部理事、中国通信学会青年工作委员会委员、北京通信学会理事等。

  Curriculum Vitae  (CV)

  Hongbin Luo received the B.S. degree from Beihang University in 1999 and the M.S.
  (with honors) and Ph.D. degrees in communications and information science from University
  of Electronic Science and Technology of China (UESTC), in June 2004 and March 2007,
  respectively.

  He is now a professor at Beihang University. From June 2007 to March 2017, he worked
  at the School of Electronic and Information Engineering, Beijing Jiaotong University.
  From September 2009 to September 2010, he was a Visiting Scholar at the Department
  of Computer Science, Purdue University. He has authored more than 60 peer-reviewed
  papers in leading journals (such as IEEE/ACM Transactions on Networking, IEEE Journal
  on Selected Areas in Communications) and conference proceedings. In 20

  22

  , he won the National Science Fund for Distinguished

  Young Scholars from the National Natural Science Foundation of China (NSFC). His
  research interests are in the wide areas of network technologies including routing,
  Internet architecture, and space-air-ground-integrated

  n

  etworking.'
