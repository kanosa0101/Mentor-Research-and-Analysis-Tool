  博士后研究员

  北京航空航天大学网络空间安全学院

  助理教授、副教授

  ◆

  研究领域

  低空/航空通信导航监视、机载网络、航空网络安全

  ◆

  科研成果

  面向空中交通管理系统发展亟需，长期从事低空/航空通信导航监视网络及安全研究。主持国家自然科学基金项目、北京市自然科学基金项目、国家重点研发计划项目子课题等纵向项目和企事业委托项目，参与工信部专项项目、民航安全能力建设项目。在IEEE
  COMST/IEEE WCM/IEEE JSAC/IEEE TWC等国际知名期刊/会议共发表论文50余篇，其中一作/通讯IEEE汇刊论文20余篇，谷歌学术引用2000余次，单篇最高引用600余次。参与国际民航组织远程驾驶航空器专家组和数据通信基础设施专家组工作。
  荣获中国指挥与控制学会科技进步一等奖、国家优秀留学生。荣获中国指挥与控制学会科技进步一等奖、教育部国家优秀留学生。

  ◆

  教学成果

  主讲本科生课程“数字信号处理”、“人工智能导论”和“信息系统安全基础”。主持北航—华为“智能基座”产教融合协同育人项目，发表教改论文多篇。指导本科生获得全国信息安全竞赛—作品赛一等奖。荣获北京市教学成果一等奖1项、二等奖1项目。'
