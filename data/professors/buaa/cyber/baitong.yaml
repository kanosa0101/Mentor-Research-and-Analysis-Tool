bio_raw: '基本情况

  教育经历：

  西北工业大学 通信工程 学士学位

  南安普顿大学（英国） 无线通信 硕士学位

  南安普顿大学（英国） 电子电气工程 博士学位

  工作经历：

  伦敦玛丽女王大学（英国）电子工程与计算机学院 博士后研究员

  北京航空航天大学 网络空间安全学院 助理教授、副教授

  主讲课程

  本科生课程：人工智能导论、数字信号处理

  研究方向

  低空通信

  低空监视

  运输航空通信

  机载网络

  航空网络安全

  教学科研成果

  科研：

  主持国家自然科学基金项目、国家重点研发计划项目子课题、国务院国资委课题、北京市自然科学基金项目和市级重点研发项目等纵向项目及企事业单位委托项目若干，参与工信部民机专项、国家重点研发计划项目和民航安全能力建设项目，在IEEE
  COMST/IEEE WCM/IEEE JSAC/IEEE TWC等国际知名期刊/会议共发表论文50余篇，其中一作/通讯期刊论文20余篇（含ESI高被引论文4篇），谷歌学术引用2000余次，单篇最高引用600余次。参与国际民航组织远程驾驶航空器专家组和数据通信基础设施专家组工作。荣获中国指挥与控制学会科技进步一等奖、国家优秀留学生。

  教学：

  主持北航-华为“智能基座”产教融合协同育人项目，出版教材3部，发表教改论文多篇，指导学生获得全国信息安全竞赛-作品赛一等奖。荣获北京市教学成果一等奖、二等奖和全国大学生信息安全竞赛“优秀指导教师”。'
