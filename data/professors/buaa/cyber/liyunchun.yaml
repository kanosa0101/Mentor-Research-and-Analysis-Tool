bio_raw: '基本情况

  教育经历：

  1995年于北京航空航天大学计算机科学与工程系获学士学位

  2000年于北京航空航天大学计算机学院获硕士学位

  2009年于北京航空航天大学计算机学院获博士学位

  工作经历：

  2010年赴美国伊利诺伊大学香槟校区计算机学院做访问学者

  1995年至今在北京航空航天大学聘任为助教、讲师、副教授、教授/博导

  兼职情况：

  CERNET/CNGI-CERNET2主干网北京航空航天大学核心节点主任

  中国高等教育学会教育信息化分会第七届理事会常务理事

  中国计算机用户协会网络应用分会第六届理事会常务理事

  教育部科技司教育管理信息化专家组专家

  主讲课程

  《并行程序设计》

  研究方向

  计算机网络

  网络安全

  并行计算

  大数据

  云计算

  教学科研成果

  在国内外学术刊物或会议上发表60余篇教学、科研论文。

  获奖情况：

  1. 2008年《大型分布式多媒体会议系统》项目获北京市科学技术进步二等奖

  2. 2009年《下一代智能安全网络产品研究》项目获得北京市科学技术进步三等奖

  3. 2017年获校级“工程硕士实习实践优秀成果获得者指导教师”

  4. 2019年获校级“优秀硕士学位论文指导教师”

  代表性论文：

  1. H. Zhou, Y. Li, J. Jia, W. Qi and H. Yang, "SparkOT: Diagnosing Operation Level
  Inefficiency in Spark," 2018 IEEE 20th International Conference on High Performance
  Computing and Communications; IEEE 16th International Conference on Smart City;
  IEEE 4th International Conference on Data Science and Systems (HPCC/SmartCity/DSS),
  Exeter, United Kingdom, 2018, pp. 692-699.

  2. H. Zhou, Y. Li, H. Yang, J. Jia and W. Li, "BigRoots: An Effective Approach for
  Root-Cause Analysis of Stragglers in Big Data System," in IEEE Access, vol. 6, pp.
  41966-41977, 2018.

  3. Yi. Liu, Y. Li, H. Zhou, J. Zhang, H. Yang and W. Li, " A fine-grained performance
  bottleneck analysis method for HDFS," Lecture Notes in Computer Science (including
  subseries Lecture Notes in Artificial Intelligence and Lecture Notes in Bioinformatics),
  v 11276 LNCS, p 159-163, 2018, Network and Parallel Computing - 15th IFIP WG 10.3
  International Conference, NPC 2018, Proceedings

  4. W. Qi, Y. Li, H. Zhou, W. Li and H. Yang, "Data Mining Based Root-Cause Analysis
  of Performance Bottleneck for Big Data Workload," 2017 IEEE 19th International Conference
  on High Performance Computing and Communications; IEEE 15th International Conference
  on Smart City; IEEE 3rd International Conference on Data Science and Systems (HPCC/SmartCity/DSS),
  Bangkok, 2017, pp. 254-261.

  5. Y. Li and Y. Xia, "Auto-scaling web applications in hybrid cloud based on docker,"
  2016 5th International Conference on Computer Science and Network Technology (ICCSNT),
  Changchun, 2016, pp. 75-79.'
