  密码算法分析

  有限域及其应用

  ◆

  科研成果

  从事序列密码理论研究，在环上导出序列的保熵性、非线性反馈移位寄存器等方面发表SCI论文20余篇。

  ◆

  科研项目

  非线性反馈移位寄存器的乘除法及应用，国家自然科学基金面上项目，主持

  整数剩余类环上压缩导出序列分布性质的研究，国家自然科学基金青年基金，主持

  二进制展开权位序列的性质，博士后科学基金面上资助，主持'
