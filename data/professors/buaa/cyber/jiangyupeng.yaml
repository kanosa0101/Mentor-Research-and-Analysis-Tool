bio_raw: '基本情况

  教育经历：

  2004—2008清华大学 数学与应用数学 学士

  2008—2013中国科学院数学与系统科学研究院应用数学博士

  工作经历：

  2013—2015中国科学院信息工程研究所博士后

  2015—2021中国科学院信息工程研究所助理研究员、副研究员

  2021至今北京航空航天大学网络空间安全学院副教授

  主讲课程

  密码算法分析

  信息安全数学基础

  研究方向

  序列密码理论

  非线性反馈移位寄存器

  计算数论

  教学科研成果

  从事序列密码理论研究，在环上导出序列的保熵性、非线性反馈移位寄存器等方面发表SCI论文20余篇。

  获奖情况：

  1. 2016年党政密码科技进步奖三等奖

  2. 2016年新世界数学奖博士论文优胜奖

  3. 2013年中国科学院院长优秀奖

  代表性论文：

  1. YZ Zhang and YP Jiang. ESCM: A Toolkit for Efficient and Secure Outsourced Computation
  With Multiple Keys. IEEE Transactions on Information Forensics and Security, 21:
  4135-4147 (2026).

  2. YP Jiang, M Li, JY Liu and DD Lin. Extending binary sequences to maximum length
  sequences. Designs, Codes and Cryptography, 94(9): 201 (2026).

  3. YP Jiang, M Li, Y Gao and DD Lin. On prefer-one sequences. Designs, Codes and
  Cryptography, 92(10): 3017-3032 (2024).

  4. YP Jiang. A relation between sequences generated by Golomb''s preference algorithm.
  Designs, Codes and Cryptography, 91(1): 285-291 (2023).

  5. YP Jiang, M Li and DD Lin. Proofs of Conjectures on Extremal Weight De Bruijn
  Sequences. IEEE Transactions on Information Theory, 69(8): 5357-5363 (2023).'
