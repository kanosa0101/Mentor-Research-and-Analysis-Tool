bio_raw: '基本情况

  教育经历：

  2009—2013，北京航空航天大学，高等工程学院（理科试验班），工学学士

  2013—2019，北京航空航天大学，电子信息工程学院，工学博士

  2016—2017，加拿大不列颠哥伦比亚大学，国家公派联合培养博士生

  工作经历：

  2019—2021，英国南安普顿大学，博士后

  2009-今，北京航空航天大学，网络空间安全学院，副教授

  兼职情况：

  IEEE Journal on Selected Areas in Communications, IEEE Communications Magazine,
  IEEE Wireless Communications, IEEE Transactions on Wireless Communications, IEEE
  Transactions on Communications, IEEE Transactions on Mobile Computing等国际期刊以及IEEE
  ICC、Globecom等国际会议审稿人

  主讲课程

  《信号与系统》

  《移动通信概论》

  研究方向

  1. 空天地一体化网络

  2. 无线安全与韧性网络

  3. 无线人工智能

  教学科研成果

  科研概述：

  随着卫星互联网与第六代移动通信系统的深度融合，空天地一体化网络、无线安全与韧性网络、无线人工智能已成为支撑新型信息基础设施建设与网络空间安全的关键前沿领域。围绕上述方向，重点研究深度强化学习、多智能体学习与分布式学习的理论与方法，及其在低轨巨型星座与无人机网络抗干扰通信、智能路由决策与无线资源管理中的应用。相关成果发表JCR
  Q1/CCF A论文20余篇（其中2篇入选ESI全球前1%高被引论文，1篇入选ESI研究前沿核心论文），谷歌学术引用1600余次，单篇最高SCI他引400余次。

  获奖情况：

  1. 2023年小米青年学者

  2. 2022年中国电子学会自然科学一等奖

  3. 2022年中国指挥与控制学会科技进步一等奖

  4. 第十二批北京航空航天大学“青年拔尖人才”支持计划

  5. 2020年北京航空航天大学优秀博士学位论文

  代表性论文：

  1. D. Liu, L. Jian, J. Ma, J. Situ, and L. Bai. Asynchronous Multi-Agent Reinforcement
  Learning Aided Packet-Routing for Space-Air-Ground Integrated Networks. IEEE Transactions
  on Mobile Computing, early access, Aug. 2026.

  2. L. Jian and D. Liu. Widening the Network Mitigates the Impact of Data Heterogeneity
  on FedAvg. In Proceedings of the 42nd International Conference on Machine Learning
  (ICML), PMLR, vol. 267, pp. 27399–27425, 2025.

  3. D. Liu, J. Zhao, C. Yang, and L. Hanzo. Accelerating Deep Reinforcement Learning
  With the Aid of Partial Model: Energy-Efficient Predictive Video Streaming. IEEE
  Transactions on Wireless Communications, vol. 20, no. 6, pp. 3734–3748, Jun. 2021.

  4. D. Liu, B. Chen, C. Yang, and A. F. Molisch. Caching at the Wireless Edge: Design
  Aspects, Challenges, and Future Directions. IEEE Communications Magazine, vol. 54,
  no. 9, pp. 22–28, Sep. 2016.（ESI高被引论文，ESI研究前沿核心论文）

  5. D. Liu and C. Yang. Energy Efficiency of Downlink Networks With Caching at Base
  Stations. IEEE Journal on Selected Areas in Communications, vol. 34, no. 4, pp.
  907–922, Apr. 2016.（ESI高被引论文）

  发明专利：

  1. 程然，刘栋. 一种基于比特翻转误差的差分隐私无线联邦学习方法，国家发明专利，受理中，申请号：202611603625.6

  2. 刘栋, 张千, 韩圣千, 杨晨阳, 王刚, 雷鸣. 一种多基站协作系统传输模式选择与用户接入方法，国家发明专利，已授权，专利号：ZL201310464811.2'
