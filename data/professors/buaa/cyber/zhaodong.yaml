  教学及科研成果

  赵东，长期从事复杂控制系统安全领域的前沿研究，发表国际著名期刊论文多篇，包括IEEE TAC论文4篇、Automatica论文3篇。研究成果获得多项奖励，包括山东省自然科学奖，IEEE计算智能学会旗下IJCNN2020最佳论文提名奖。受邀担任IEEE、IFAC
  等多个国际著名学会顶级汇刊的活跃审稿人，包括IEEE TAC、Automatica、IEEE TNNLS等刊物。入选国家海外高层次青年人才，主持和参与包括欧盟地平线计划项目、塞浦路斯院士基金、国家自然科学基金等多个国内外科研项目。

