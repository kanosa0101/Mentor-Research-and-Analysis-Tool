  Curriculum Vitae  (CV)

  With long-term research experience in machine learning and text data mining, he
  has published over 70 academic papers in renowned international conferences such
  as ICML, AAAI, ACL, MM, CIKM, IJCAI, SDM, and top-tier journals including TKDE,
  TIP, TOIS, TMM, TCYB, PR, and IF

  .

  The undertaken research projects include over 20 initiatives such as National Key
  Science and Technology Major Projects, National Natural Science Foundation Key Projects,
  General Projects, Beijing Natural Science Foundation General Projects, Equipment
  Preliminary Research, and the National 242 Information Security Special Program.
  The projects primarily focus on multimodal sensitive information detection based
  on multi-agent collaboration, domain-specific knowledge graphs, vertical domain
  large model training, multimodal large model threat localization and real-time remediation,
  among others. The research achievements have earned one Beijing Science and Technology
  Progress Second Prize and two China Council for the Promotion of International Trade
  Science and Technology Progress First Prizes, and have been widely applied across
  multiple sectors.'
