  IEEE TPAMI、TKDE、TPDS、TC、ACM TOIS、JMLR、WWW、NeurIPS、AAAI、IJCAI

  等国际旗舰学术期刊或会议发表论文100余篇，授权发明专利近30件，第一作者论文获

