bio_raw: '基本情况

  教育经历：

  2012年至2016年，西北工业大学，自动化学院，学士

  2016年至2019年，北京航空航天大学，自动化科学与电气工程学院，硕士

  2019年至2023年，英国The University of Warwick，工程学院，博士

  工作经历：

  2025年至今，北京航空航天大学，网络空间安全学院，副教授

  2023年至2025年，香港理工大学，航空及民航工程学系, 助理教授（研究）

  兼职情况：

  Advances in Astronautics（宇航学报英文版）青年编委

  多个国际学术会议技术委员会/程序委员会委员

  IEEE TASE、TII、TSE等期刊会议担任审稿人

  研究方向

  无人系统(无人飞行器等柔性结构)智能安全控制

  强化学习智能优化控制方法

  网络攻击安全控制

  空天集群组网安全

  集群智能决策与规划

  教学科研成果

  专注于飞行器等柔性结构的动力学建模、智能规划与安全控制理论及应用研究，在IEEE Trans. 等航空航天及控制领域期刊及会议发表录用论文20余篇（CAA A+类、中科院一区/Top
  等领域顶刊8 篇，顶级综述期刊1 篇），授权受理专利软著多项，主持香港理工大学纵向项目1 项，成果成功应用于某高速飞行器试验任务。研究团队长期招收博士、硕士和博士后，诚挚欢迎感兴趣的同学交流咨询。

  获奖情况：

  1. 国家级青年人才

  2. 香港理工大学战略引才计划

  3. 华威大学The University of Warwick国际学者引进计划

  4. 美国航空工程领域SCI国际期刊 ASCE JAE 2025年度最佳论文奖

  5. 美国ASCE JAE期刊2024年度杰出审稿人

  发明专利：

  1. 专注于飞行器等柔性结构的动力学建模、智能规划与安全控制理论及应用研究，在IEEE Trans. 等航空航天及控制领域期刊及会议发表录用论文20余篇（CAA
  A+类、中科院一区/Top 等领域顶刊8 篇，顶级综述期刊1 篇），授权受理专利软著多项，主持香港理工大学纵向项目1 项，成果成功应用于某高速飞行器试验任务。

  代表性论文：

  1. Xu, Yiwei, Xie, Jingjie*, Guo, Ge. “Enhancing transportation reliability: refined
  fault- tolerant control for fixed-wing AAVs under constraints and actuator imperfections.”
  IEEE Transactions on Intelligent Transportation Systems, 2025, 26(10): 17027-17040.

  2. Xu, Yiwei, Xie, Jingjie*, Guo, Ge. “Hybrid Resilient and Fault-Tolerant Control
  of Wind Turbines via Actor–Critic Reinforcement Learning With Prescribed Performance.”
  IEEE Transactions on Automation Science and Engineering, 2026, 23: 9033-9046.

  3. Jingjie Xie, Hongyang Dong, Xiaowei Zhao, Aris Karcanias. “Wind Farm Power Generation
  Control via Double-Network-Based Deep Reinforcement Learning.” IEEE Transactions
  on Industrial Informatics, 2022, 18(4): 2321-2330.

  4. Jingjie Xie, Hongyang Dong, Xiaowei Zhao. “Power Regulation and Load Mitigation
  of Floating Wind Turbines via Reinforcement Learning.” IEEE Transactions on Automation
  Science and Engineering, 2024, 21(3): 4328-4339.

  5. Jingjie Xie, Hongyang Dong, Xiaowei Zhao. “Wind Turbine Fault-Tolerant Control
  via Incremental Model-Based Reinforcement Learning.” IEEE Transactions on Automation
  Science and Engineering, 2025, 22: 1958-1969.'
