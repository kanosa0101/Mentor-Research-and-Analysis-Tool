bio_raw: '基本情况

  教育经历：

  2002—2010，北京航空航天大学电子信息工程学院，通信与信息系统，博士

  1998—2002，北京航空航天大学，电子工程，学士

  工作经历：

  2019.08至今，北京航空航天大学，网络空间安全学院，讲师

  2011.01—2019.08，北京航空航天大学，工程训练中心，讲师

  主讲课程

  本科生课程：《计算机组成原理》《操作系统原理与安全》《信息系统安全实验》

  研究方向

  1. 5G无线系统安全

  2. 可信计算与嵌入式系统安全

  3. 等离子体加工与刻蚀用电源及定制电压波形（TVW）调控

  4. 流量采集、溯源与可解释识别

  教学科研成果

  获奖情况：

  1. 北京航空航天大学优秀教学成果奖二等奖，2020

  2. 首届教育信息技术应用创新大赛“基于信创环境的安全连接建立”赛项一等奖（指导教师），中国教育技术协会，2024

  3. 北京航空航天大学教学成果奖三等奖，2019

  发明专利：

  1. 一种基于手套采集的手势识别方法及人机交互装置（第一发明人，已授权），专利号：CN201711432163.7

  2. 三维矩阵魔方密码锁（第二发明人），专利号：ZL201410403753.7

  3. 基于可信平台的嵌入式设备软件远程审计方法及装置（第四发明人），专利号：CN202210487820.2

  代表性论文：

  1. Jian Cui, Junlong Liu, Yan Zhang, Zhigang Huang, Yu Sun, Gang Wang. Design of
  a multi-channel synchronous pulse waveform generator based on GD32F407. Journal
  of Physics: Conference Series, 2026, 3235: 012043.

  2. Yan Zhang, Hongxuan Mu, Jian Cui, Zhenzi Feng, Junlong Liu, Zhigang Huang. Mechanism
  and Simulation of Ion Energy Distribution Control via Bias Voltage in Low-Temperature
  RF Capacitively Coupled Plasmas. 2026 IEEE International Conference on Computational
  Electromagnetics (ICCEM), 2026.

  3. Qi Shan, Jian Cui. LLM Guided Automated Security Analysis for 5G UE Control Plane
  Protocols. 2025 IEEE 25th International Conference on Communication Technology (ICCT),
  2025.

  4. Dawei Li, Yingpeng Zhang, Jian Cui, Di Liu, Yu Sun, Zhenyu Guan, Xu Wang. Remote
  Audit Scheme of Embedded Device Software Based on TPM. 2022 IEEE 8th International
  Conference on Big Data Security on Cloud (BigDataSecurity)/HPSC/IDS, 2022.

  5. 崔剑、麻开朗、孙钰、王豆、周君良. 面向加密流量分类的深度可解释方法. 计算机应用, 2022.'
