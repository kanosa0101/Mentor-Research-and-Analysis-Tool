bio_raw: '基本情况

  教育经历：

  2004年于华中科技大学获学士学位

  2007年于英国斯旺西大学获硕士学位

  2010年于英国斯旺西大学获博士学位

  工作经历：

  2011—2018年 电子信息工程学院副教授

  2018—2019年 网络空间安全学院副教授

  2019年至今，网络空间安全学院教授（国家级领军人才）

  2021—2025年 网络空间安全学院副院长

  2025—2026年 国际合作部部长兼港澳台事务办公室主任、国际学院院长

  2026年至今，网络空间安全学院院长

  兼职情况：

  政协北京市第十四届委员会委员

  中国科学技术协会第十次全国代表大会代表

  中国电子学会理事

  中国指挥与控制学会理事

  中国通信学会第六届青年工作委员会委员

  主讲课程

  通信原理

  信号与系统

  科学写作与报告

  研究方向

  通信网络安全

  无线宽带自组织网络

  无人机通信系统

  教学科研成果

  聚焦智能无人集群网络前沿理论与技术创新，研究方向包括通信网络安全、无线宽带自组织网络、无人机通信系统。发表学术论文百余篇，出版中英文学术专著9部。主持国家自然科学基金青年科学基金A类、优秀青年科学基金、联合基金重点、北京市自然科学基金杰出青年科学基金、国家重点研发计划课题等科研项目。获中国出版政府奖、国家科技进步二等奖、中国电子学会自然科学一等奖、中国指挥与控制学会科技进步一等奖、中国电子学会自然科学二等奖、茅以升北京青年科技奖。担任北京市政协委员、中国科学技术协会第十次全国代表大会代表、中国电子学会理事、中国指挥与控制学会理事、北京市科学技术协会人才工作专门委员会委员、IEEE
  Trans. Wireless Commun.、IEEE Trans. Mob. Comput.、IEEE Trans. Signal Process.、IEEE
  Wireless Commun. Lett.期刊编委、J. Commun. Inf. Networks期刊执行编委，入选IEEE通信学会、车辆技术学会杰出演讲者。指导学生获中国电子学会优秀博士学位论文、优秀硕士学位论文、中国指挥与控制学会优秀博士学位论文、北京市优秀博士学位论文提名、北京市优秀毕业生等奖项。'
