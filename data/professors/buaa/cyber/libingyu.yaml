bio_raw: '基本情况

  教育经历：

  2009—2013，吉林大学，计算机科学与技术，理学学士

  2013—2020，中国科学院大学，信息安全，工学博士

  工作经历：

  2022至今，北京航空航天大学网络空间安全学院，副教授，博士生导师

  2020—2022，北京航空航天大学网络空间安全学院，卓越百人博士后

  兼职情况：

  中国网络空间安全学会制度建设工作委员会委员

  中国网络空间安全学会网络与通信安全专委会执行委员

  中国计算机学会网络与系统安全专委会执行委员

  《Cybersecurity》《信息安全学报》青年编委

  主讲课程

  本博贯通课程：《现代密码学》

  本科生课程：《密码学》《密码学及应用实验》

  研究生课程：《互联网基础设施安全》

  研究方向

  1. 数字身份/信任管理

  2. 互联网基础设施安全

  3. 密码应用

  4. 软件供应链安全

  5. 智能体安全

  教学科研成果

  科研概述：

  主持国家和省部级等科研项目10余项，包括国家自然科学基金（面上、青年）、北京市自然科学基金面上、国家重点研发计划子课题、中国博士后科学基金（特别资助、面上资助），以及华为、奇安信、航天科技集团等单位委托科研项目；作为核心骨干参与国家重点研发计划、国家973计划、航天科技集团国际合作项目等多项国内外重大科研任务。在CCS、NDSS、WWW、IEEE
  TDSC、IEEE TIFS、IEEE/ACM ToN、《计算机研究与发展》等国内外学术会议和期刊发表论文50余篇。主持完成国家密码行业标准研究1项，申请和授权国内外发明专利20余项；相关科研成果实现转化应用，多项关键技术已应用于我国电子认证、互联网基础设施安全、漏洞检测、安全加密通信等领域；研制的4款密码设备获得国家密码管理局商用密码产品型号证书，实现国密产品海外出口。

  获奖情况：

  1. 2026年获得国家WXB网络安全科学技术奖二等奖

  2. 2025年入选国家网信领域创新人才支持计划

  3. 2022年入选北航青年拔尖人才支持计划

  代表性论文：

  1. Yijia Fang, Bingyu Li, Luchao Jin, et al. OrionLink: Single Sign-On with Oblivious
  Identity Brokers. NDSS 2027.

  2. Ruoxuan Xia, Bingyu Li, Zhenyu Chen, et al. Starlink in the Wild: Multi-Perspective
  Measurements via DNS. WWW 2026.

  3. Yang Yang, Bingyu Li, Qianhong Wu, et al. RandFlash: Breaking the quadratic barrier
  in large-scale distributed randomness beacons. IEEE TIFS, 2025.

  4. Yuexi Zhang, Bingyu Li, Jingqiang Lin, et al. Gopher: High-precision and Deep-dive
  Detection of Cryptographic API Misuse in the Go Ecosystem. ACM CCS 2024.

  5. Bingyu Li, Jingqiang Lin, Fengjun Li, et al. The Invisible Side of Certificate
  Transparency: Exploring the Reliability of Monitors in the Wild. IEEE/ACM ToN, 2022.

  发明专利：

  1. 李冰雨, 张志金童, 孙傲卓, 等. 一种支持票据隐私保护的单点登录透明化方法及系统, 2026-9, 中国, ZL 202311079891.X

  2. 李冰雨, 方翌佳, 肖佳乐, 等. 一种邮箱所有权验证方法、装置、设备及介质, 2025-11, 中国, ZL 2025 1 0109460.6

  3. 李冰雨, 张岳熙, 林璟锵, 等. 一种支持规则自动推导与跨库分析的密码误用检测方法、设备、介质及产品, 2025-9, 中国, ZL 2024 1 1477763.5

  4. 李冰雨, 方翌佳, 张志金童, 等. 一种面向分布式数字身份的可验证凭证生成方法及系统, 2025-9, 中国, ZL 2024 1 1415012.0

  5. 林璟锵, 李冰雨, 孙傲卓, 等. Certificate Monitor Service Reliability Detection Method for
  PKI Certificate Transparency System, 2026-4, 美国, US12598173B2'
