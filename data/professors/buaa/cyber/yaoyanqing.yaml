  & Electrical Engineering、IET Information Security、Indocrypt 2015、ICITS 2013等重要会议和期刊上发表高质量学术论文20余篇，申请发明专利4项，主持国家自然科学基金面上项目、国家自然科学基金青年基金项目、北京市自然科学基金面上项目、软件开发环境国家重点实验室自主研究课题、密码科学技术国家重点实验室开放课题、中央高校基本科研项目等，作为项目骨干参与国家重点研发计划等。指导的研究生获第六届全国密码技术竞赛一等奖、北京市普通高校优秀毕业生等荣誉。发表的主要论文如下：

