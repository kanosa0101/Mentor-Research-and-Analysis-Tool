  Curriculum Vitae (CV)

  Dr.Yanqing Yao

  received her Ph.D. degree in Computer Software and Theory from Beihang University,
  China in 2015 under the supervision of Prof. Zhoujun Li. From 2012 to 2014, she
  was a visiting student of Prof. Yevgeniy Dodis at the Department of Computer Science,
  Courant Institute of Mathematical Sciences, New York University in the United States.
  She received her B.S. degree and M.S. degree in the College of Mathematics and Information
  Science, Hebei Normal University, China in 2007 and 2010 respectively. She is currently
  an assistant professor and doctoral/master’s supervisor at the School of Cyber Science
  and Technology, Beihang University. Her research interests include Cryptography
  (e.g., Cryptography with Imperfect Randomness, Lattice-based Cryptography, Leakage-Resilient
  Non-Malleable Cryptography）, Searchable Encryption, Privacy Preserving Technologies,
  Cloud Computing Security, and Mathematical Foundations of Artificial Intelligence.
  She has published about 16 papers in

  CRYPTO 2015, IEEE Transactions on Information Forensics and Security

  , Information Sciences, Fuzzy Sets and Systems, Computers & Electrical Engineering,
  IET Information Security, Indocrypt 2015, ICITS 2013, etc. She has won the

  CACR Excellent Doctoral Dissertation Award

  , Beihang University“Up-and-coming Star in the Blue Sky”Award, etc.'
