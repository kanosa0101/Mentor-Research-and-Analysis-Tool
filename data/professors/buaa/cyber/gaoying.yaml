bio_raw: '基本情况

  教育经历：

  2003年于武汉大学获博士学位（硕博连读）

  工作经历：

  2018年至今北京航空航天大学网络空间安全学院 副教授 博士生导师

  2010—2011南洋理工大学数学系访问学者

  2005—2018北京航空航天大学数学与系统科学学院副教授

  2003—2005中科院数学与系统科学学院系统所博士后

  兼职情况：

  期刊《电子与信息学报》编委

  中国计算机学会计算机安全专业委员会执行委员

  中国中文信息学会大数据与隐私计算专委会委员

  中国工业与应用数学学会区块链专委会委员

  主讲课程

  信息安全数学基础（本科，大二，核心专业课）

  信息论与编码（本科，大二）

  网络空间安全导论（本科，大一，核心通识课）

  网络空间安全数学基础（研究生）

  研究方向

  安全多方计算，大模型安全，后量子密码，区块链

  教学科研成果

  主要研究方向包括隐私计算，联邦学习，大模型安全，公钥密码学，区块链等领域。发表学术论文50余篇，授权发明专利7项，其中专利转化1项。主持国家重点研发计划课题、国家自然科学专项课题、国家自然科学基金青年项目、数学天元基金、北京市科委项目课题、北京市面上基金等。近五年主讲5门本科生课程和2门研究生课程，已指导毕业研究生22人，正在指导硕士研究生7人，博士研究生12
  人。承担教改项目10余项，发表教改论文10余篇。

  获奖情况：

  1. 第三届网络空间安全产学协同育人优秀案例评选二等奖（排名1，2023年）

  2. 北京航空航天大学优秀共产党员（2023年）

  3. 全国密码技术竞赛优秀组织奖（2022年，2023年，2024年）

  4. 北京市教学成果二等奖（排名3，2022年）

  5. 北京航空航天大学“立德树人”优秀奖（2021年）

  发明专利：

  发表学术论文50余篇，授权发明专利7项，其中专利转化1项。

  代表性论文：

  1. Jie Ma, Ningyu He, Jinwen Xi, Mingzhe Xing, Haoyu Wang, Ying Gao(第一通信作者), Yinliang
  Yue, OpDiffer: LLM-Assisted Opcode-Level Differential Testing of Ethereum Virtual
  Machine. Proc. ACM Softw. Eng. 2(ISSTA): 1559-1582 (2025) (CCF A, 软件工程领域顶会)

  2. Ying Gao（唯一第一作者，通信作者）, Lin Qi, Xiang Liu, et al. Efficient Fuzzy Private Set
  Intersection from Fuzzy Mapping. In: Chung, KM., Sasaki, Y. (eds) Advances in Cryptology
  – ASIACRYPT 2024. ASIACRYPT 2024. Lecture Notes in Computer Science, vol 15489.
  Springer, Singapore. (CACR A，密码学三大顶级会议)

  3. Xiang Liu, Ying Gao(唯一通信作者). Scalable Multi-party Private Set Union from Multi-query
  Secret-Shared Private Membership Test. In: Guo, J., Steinfeld, R. (eds) Advances
  in Cryptology - ASIACRYPT 2023. Lecture Notes in Computer Science, vol 14438. Springer,
  Singapore. （CACR A，密码学三大顶会之一）

  出版教材:

  金海、裴庆祺、盖珂珂、高莹、微众银行，区块链技术原理，高等教育出版社，2022.

  高莹，信息安全数学基础，高等教育出版社，2024

  Ying Gao（唯一第一作者，通信作者）, Huanghao Deng, Zukun Zhu, Xiaofeng Chen, Yuxin Xie, Pei Duan,
  Peixuan Chen, Peafowl: Private Entity Alignment in Multi-Party Privacy-Preserving
  Machine Learning, IEEE Transactions on Information Forensics and Security, vol.
  20, pp. 2706-2720, 2025 （CCF A，信息安全领域顶刊）

  Ying Gao（共同第一作者，通信作者）, Yuanchao Luo, Longxin Wang, et al. 2024. Efficient Scalable
  Multi-Party Private Set Intersection(-Variants) from Bicentric Zero-Sharing. In
  Proceedings of the 2024 ACM SIGSAC Conference on Computer and Communications Security
  (CCS''24), October 14–18, 2024, Salt Lake City, UT, USA. ACM, New York, NY, USA,
  15 pages. (CCF A，网络空间安全领域四大顶级会议)'
