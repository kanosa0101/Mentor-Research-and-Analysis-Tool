  u

  科研成果

  主要研究领域为信息论与随机矩阵理论及其在

  无线通信安全、无人机集群对抗

  等领域的应用。通过随机矩阵理论探究多天线系统安全与可靠传输的根本极限，建立多天线无线通信系统性能的数学表征框架与优化方法，增强无线通信系统的传输与保密可靠性。主要成果发表在通信领域顶级期刊

  I

  EEE Transactions on Information Theory (TIT

  ，

  CCF-A

  )

  、网络与信息安全领域顶级期刊

  IEEE Transactions on Information Forensics and Security (TIFS

  ，

  CCF-A

  )

