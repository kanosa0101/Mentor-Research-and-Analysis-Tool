  ◆

  学习经历

  1996-2000

  年于烟台大学获理学学士学位

  2000-2003

  年于西安电子科技大学获工学硕士学位

  2005-2008

  年于英国伦敦大学皇家霍洛威学院获哲学博士学位

  ◆

  工作经历

  2008-2010

  年荷兰埃因霍温理工大学博士后研究人员

  2010-2011

  年法国巴黎高等师范学院博士后研究人员

  2011-2018

  年新加坡科技研究局资讯通信研究院科学家

  2018

  年至今北京航空航天大学教授

  ◆

  研究领域

  对称密码的安全分析、设计与现实应用

  ◆

  荣誉及奖励

  ◆

  个人简介

  吕继强，山东高密人，北京航空航天大学网络空间安全学院研究员

  /

  教授、博士生导师，北京航空航天大学学术委员会委员、网络空间安全学院学位委员会副主席、学术委员会委员，中国密码学会高级会员、密码算法专业委员会委员。

  2000

  年于烟台大学应用数学专业获理学学士，

  2003

  年于西安电子科技大学信息与通信工程专业获工学硕士（导师：王新梅教授），

  2008

  年于英国伦敦大学皇家霍洛威学院（

  Royal Holloway, University of  London

  ）信息安全专业获哲学博士（导师：

  Chris Mitchell

  教授）。

  2008

  年至

  2010

  年在荷兰埃因霍温理工大学（

  Eindhoven University of Technology

  ）从事博士后科研工作（合作导师：

  Sandro Etalle

  教授），

  2010

  年至

  2011

  年在法国巴黎高等师范学院（

  Ecole Normale Superieure

  ）从事博士后科研工作（合作导师：

  David Pointcheval

  教授），

  2011

  年至

  2018

  年在新加坡科技研究局资讯通信研究院（

  Institute for Infocomm Research,  Agency for Science, Technology and Research

  ）任科学家。研究方向为对称密码学、侧信道安全和白盒密码，主要从事了欧盟、法国、中国的四个理论性的科研基金项目和荷兰、德国、阿联酋、新加坡的四个实用性的工业项目，以唯一或第一作者发表理论研究型和应用研究型学术论文三十余篇，提出了分组密码的三个新的分析方法和现有分析方法的三个新技术，分析了国际上广泛使用的十五个分组密码加密算法的安全性并发表了比之前国际上发表的更好的安全分析结果，发表了全球移动通信系统

  GSM

  的

  A5/1

  流密码加密算法的详细实用的安全分析攻击，发表了国际认证加密竞赛

  CAESAR

  候选算法的安全分析攻击，发表了美国数据加密标准

  DES

  和高级数据加密标准

  AES

  的智能卡实现的能量分析攻击与实现，发表了美国消息认证码标准

  KMAC

  的白盒实现。

  ◆

  教学及科研成果

  主要从事了欧盟、法国、中国的四个理论性的科研基金项目和荷兰、德国、阿联酋、新加坡的四个实用性的工业项目，以唯一或第一作者在

  FSE

  、

  CT-RSA

  、《

  Designs,  Codes and Cryptography

  》等国际会议和国际期刊发表理论研究型和应用研究型学术论文三十余篇，提出了分组密码的三个新的分析方法和现有分析方法的三个新技术，分析了

  ISO

  国际标准、美国高级数据加密标准

  AES

  、日本电信电话公司加密算法

  Camellia

  、日本三菱公司加密算法

  MISTY1

  、韩国加密标准

  SEED

  和

  HIGHT

  、欧洲加密标准

  SHACAL-2

  、中国密码标准

  SM4

  、日本电子政务加密算法

  SC2000

  等国际上广泛使用的十五个分组密码加密算法的安全性并发表了比之前国际上发表的更好的安全分析结果，发表了美国数据加密标准

  DES

  和美国高级数据加密标准

  AES

  的智能卡实现的能量分析攻击与实现，发表了全球移动通信系统

  GSM

  的

  A5/1

  流密码加密算法的详细实用的安全分析攻击。

  ◆

  学术与社会服务

  中国密码协会密码算法专业委员会委员'
