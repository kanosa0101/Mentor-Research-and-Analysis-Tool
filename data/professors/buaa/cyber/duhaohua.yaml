bio_raw: '基本情况

  教育经历：

  2008—2012，北京航空航天大学工学学士学位

  2013—2015，伊利诺伊理工学院硕士学位

  2015—2019，伊利诺伊理工学院博士学位

  工作经历：

  2020年至今，北京航空航天大学网络空间安全学院讲师

  兼职情况：

  曾被IEEE/ACM TDSC, IEEE/ACM TMC, IEEE INFOCOM, IEEE IPCCC, IEEE MSN, BigCom等期刊/学术会议邀请审稿

  研究方向

  移动计算

  智能感知

  数据隐私保护

  物联网安全

  教学科研成果

  针对物联网场景下的通信传输安全、数据使用安全及用户隐私保护等问题在IEEE JSAC，ACM MobiCom等国际权威期刊及会议上发表论文十余篇并公开国家发明专利2项。论文列表如下：

  发明专利：

  1. 针对物联网场景下的通信传输安全、数据使用安全及用户隐私保护等问题在IEEE JSAC，ACM MobiCom等国际权威期刊及会议上发表论文十余篇并公开国家发明专利2项。

  代表性论文：

  1. Du, Haohua, Linlin Chen, Jianwei Qian, Jiahui Hou, Taeho Jung, and Xiang-Yang
  Li. "PatronuS: A System for Privacy-Preserving Cloud Video Surveillance." IEEE Journal
  on Selected Areas in Communications 38, no. 6 (2020): 1252-1261.

  2. Qian, Jianwei, Haohua Du, Jiahui Hou, Linlin Chen, Taeho Jung, and Xiangyang
  Li. "Speech Sanitizer: Speech Content Desensitization and Voice Anonymization."
  IEEE Transactions on Dependable and Secure Computing (2019).

  3. Du, Haohua, Linlin Chen, Taeho Jung, Xiang-Yang Li. "Influence of Influence on
  Social Networks: Information Propagation Causes Dynamic Networks." IEEE TPON(2019)

  4. Du, Haohua, Junze Han, Xuesi Jian, Taeho Jung, Cheng Bo, Yu Wang, and Xiang-Yang
  Li. "Martian: Message Broadcast via LED Lights to Heterogeneous Smartphones." IEEE
  Journal on Selected Areas in Communications 35, no. 5 (2017): 1154-1162.

  5. Du, Haohua, Junze Han, Qiuyuan Huang, Xuesi Jian, Cheng Bo, Yu Wang, Hongli Xu,
  and Xiangyang Li. "Message broadcast via LED lights to heterogeneous smartphones:
  poster." ACM MobiCom 2016.'
