bio_raw: '基本情况

  教育经历：

  2006—2011北京航空航天大学计算机软件与理论，工学博士

  2008—2009，University of Wollongong联合培养博士生

  工作经历：

  2011—2018北京航空航天大学计算机学院讲师

  2018年至今北京航空航天大学网络空间安全学院讲师/副教授

  主讲课程

  研究生课程：

  信息安全数学基础、密码学基础

  本科生课程：

  本科课程：信息安全数学基础、密码学基础、密码学课程实践

  研究方向

  公钥密码学

  密码协议

  教学科研成果

  在科研方面，紧紧围绕国家网络安全的战略需求，围绕区块链、数字货币、密钥管理、认证协议等当前热点问题展开研究，主持国家自然科学基金、教育部博士点基金、“十二五国家密码发展基金”、科学研究与研究生培养共建项目等课题10余项。从事信息安全领域密码协议的设计和分析等研究，在包括SCI期刊Information
  Sciences、Sensors、Computers &amp; Security等国际知名期刊和国际会议发表高水平学术论文近40篇，其中以第一作者发表SCI检索论文11篇（JCR分区Q1区论文6篇）；单篇文章被ISI数据库他引59次，Google数据库被引103次。已授权国家发明专利1项。

  重视加强学生科研能力、实践能力和创新能力的培养，指导的硕士研究生获得2016年网络安全奖学金、国家奖学金、北京航空航天大学优秀硕士学位论文等奖励。

  获奖情况：

  1. 2011年获北京航空航天大学“蓝天新秀奖”

  2. 2011年博士学位论文被评为北京航空航天大学优秀博士学位论文

  3. 2015年获北航教学成果奖三等奖

  2017年被评为优秀硕士学位论文指导教师。

  发明专利：

  已授权国家发明专利1项。'
