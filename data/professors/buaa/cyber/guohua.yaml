  开授课程

  本科课程：信息安全数学基础、密码学基础、密码学课程实践；

  研究生课程：信息安全数学基础、密码学基础。

  ◆

  教学及科研成果

  在科研方面，紧紧围绕国家网络安全的战略需求，围绕区块链、数字货币、密钥管理、认证协议等当前热点问题展开研究，主持国家自然科学基金、教育部博士点基金、“十二五国家密码发展基金”、科学研究与研究生培养共建项目等课题

  10

