  ◆

  科研成果

  长期从事基于博弈论和优化理论的通信网络资源分配问题研究。主持国家自然科学基金面上项目2项；参与国家重点研发计划2项，国家自然科学基金重点项目4项。已发表学术论文54篇，其中期刊论文39篇，其中SCI检索23篇、EI检索10篇；已发表国内外学术会议论文15篇，其中一篇获国际会议IEEE
  ICTC2015最佳论文奖(Best Paper Award)；出版学术专著1部，译著2部，授权国家发明专利7项。

  在研项目：

  1.

  国家自然科学基金

  -

  区域创新发展联合基金重点项目：低空智联网全域数据安全管控关键技术，

  2025.01-2028.12.

  2.

  科技部国家重点研发计划课题：空中交通多主体智能协同决策技术，

  2025.06-2028.05.

  3.

  国家自然科学基金民航联合基金重点项目：大型机场场面航空器航迹运行管控关键技术与验证，

  2024.01-2027.12.

  近期发表论文：

  1. G. Wang, Q. Qi, H. Yu, R. Han, L. Bai and J. Choi, "AdaDQ-KD: An Adaptive Dithering
  Quantization with Knowledge Distillation in Privacy-Preserving Federated Learning,"
  in IEEE Transactions on Vehicular Technology, doi: 10.1109/TVT.2026.3678103.

  2. G. Wang, Q. Qi, R. Han, L. Bai and J. Choi, P2CEFL: Privacy-Preserving and Communication
  Efficient Federated Learning with Sparse Gradient and Dithering Quantization, IEEE
  Transactions on Mobile Computing, vol.23, no.12, pp. 14722-14736, Dec. 2024.

  3. G. Wang, C. Zhao, Q. Qi, R. Han, L. Bai and J. Choi, Efficient Federated Learning
  via Joint Communication and Computation Optimization，IEEE Transactions on Vehicular
  Technology, Vol. 73, No. 8, pp. 11580-11592, Aug. 2024.

  4. Zhao C,Hu X,Wang G. PRGLight: A novel traffic light control framework with Pressure-based-

