bio_raw: '基本情况

  教育经历：

  2012年至2016年，哈尔滨工业大学，航天学院，学士

  2016年至2019年，哈尔滨工业大学，航天学院，博士

  2017年至2019年，新加坡国立大学，电子与计算机工程系，联合培养博士

  工作经历：

  2019年至2021年，新加坡国立大学，电子与计算机工程系，博士后

  2021年至2025年，北京航空航天大学，网络空间安全学院，副教授，博士生导师

  2025年至今，北京航空航天大学，网络空间安全学院，教授，博士生导师

  兼职情况：

  SCIENCE CHINA Information Sciences最佳审稿专家奖

  Journal of Automation and Intelligence最佳编委奖

  CAAI Transactions on Intelligence Technology青年编委

  IEEE Senior Member

  主讲课程

  算法设计与分析

  工控系统安全

  Java程序设计

  科研课堂

  社会课堂

  研究方向

  大模型多源感知推理

  空天飞行器组网安全

  无人系统智能规划控制

  教学科研成果

  长期从事大模型多源感知推理、空天飞行器组网安全、无人系统智能规划控制研究，在控制科学（Automatica、TAC、TCST）、计算网络（TDSC、TNNLS、TFS）、航空宇航（TAES、TGRS、TMECH）等国际权威刊物发表论文50余篇，8篇入选ESI高被引论文，出版国际专著2部，成果应用于多项国家重要飞行器型号。主持国家自然科学基金、科技部专项等课题。研究团队长期招收博士、硕士和博士后，同时欢迎感兴趣的同学交流学习。

  获奖情况：

  1. 国家级青年人才

  2. 亚洲控制学会Temasek青年学者奖

  3. 中国自动化学会自然科学一等奖

  4. 中国人工智能学会吴文俊技术发明奖一等奖

  5. 中国自动化学会优秀博士学位论文奖'
