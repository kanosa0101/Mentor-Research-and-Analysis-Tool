bio_raw: '基本情况

  教育经历：

  2003—2008大连理工大学，工学学士学位

  2008—2009英国帝国理工大学，工学硕士学位

  2009—2013英国帝国理工大学，工学博士学位

  工作经历：

  2014—2018，北京航空航天大学，电子信息工程学院讲师

  2018—2019，北京航空航天大学，网络空间安全学院讲师

  2019—2021，北京航空航天大学，网络空间安全学院副教授

  2021至今 北京航空航天大学，网络空间安全学院教授

  兼职情况：

  空天网络安全工信部重点实验室副主任

  区块链与物联网应用教育部重点实验室副主任

  中关村区块链产业联盟测评工作委员会主席

  中国指挥与控制学会智能指挥调度专委会常务委员

  IEEE 工业数字资产交易平台标准、碳资产交易机制标准工作组副主席

  主讲课程

  研究生课程：

  密码应用与安全

  本科生课程：

  国际工程基础（全英文）

  密码的奥秘

  数字电路基础

  科研课堂

  研究方向

  网络安全

  无人系统安全

  密码学

  人工智能

  教学科研成果

  关振宇，北京航空航天大学教授、博士生导师，国家杰出青年科学基金获得者。致力于网络空间安全学术前沿科技的理论与应用研究，在网络安全、区块链、人工智能等相关领域取得了丰富的研究成果。近五年，以第一作者/通讯作者发表TPAMI（IF:23.6）、TIP（IF:10.60）、TDSC（IF:7.20）、ACM
  CCS等期刊/会议论文40篇，高被引论文4篇，获ACM CCS杰出论文奖等最佳论文奖3项。获专利授权42项。主持国家自然科学基金杰出青年项目、面上项目、联合重点项目（叶企孙）等科研项目35项。成果应用于南海应急搜救、国家三大公共安全视频监控工程、某部应急指挥等场景，在我国边海防、公共安全防范体系等重要项目建设中发挥了关键的支撑作用。成果获吴文俊人工智能学会自然科学一等奖、教育部技术发明一等奖等省部级奖项6项。

  获奖情况：

  1. 2024年获国家自然基金杰出青年科学基金

  2. 2024年获吴文俊人工智能学会自然科学一等奖

  3. 2023年获北京市自然科学奖一等奖

  4. 2022年获中国发明协会发明创新奖一等奖

  5. 2022年获中国科技产业化促进会创新科技奖二等奖

  发明专利：

  获专利授权42项。

  代表性论文：

  1. Song Bian#, Zhou Zhang#, HaowePan, RaMao, ZiaZhao, Yier Jin, Zhenyu Guan*. HE3DB:
  AEfficient and Elastic Encrypted Database Via Arithmetic-And-Logic Fully Homomorphic
  Encryption, Proceedings of the 2023 ACM SIGSAC Conference oComputer and Communications
  Security, 2023: 2930-2944.（杰出论文奖）

  2. Dawei Li#, RuonaChen, QinjuWan, Zhenyu Guan*, Shizhong Li, MiXie, Jieyu Su, Jianwei
  Liu. Intelligent and fair IoV charging service based oblockchaiwith cross-area consensus,
  IEEE Transactions oIntelligent TransportatioSystems, 2023.

  3. Dawei Li#, Di Liu, YireQi, Feifei Liu, Zhenyu Guan*, Jianwei Liu. PUF-Based Lightweight
  AuthenticatioFramework for Large-Scale IoT Devices iDistributed Cloud. IEEE Network,
  2023, 37(4): 56-62.

  4. Zhenyu Guan#, Junpeng Jing#, XiDeng*, Mai Xu, Lai Jiang, Zhou Zhang, Yipeng Li.
  DeepMIH: Deep Invertible Network for Multiple Image Hiding, IEEE Transactions oPatterAnalysis
  and Machine Intelligence, 2022, 45(1): 372-390.（ESI高被引）

  5. Dawei Li#, RuonaChen, Di Liu, YingxiaSong, YangkuRen, Zhenyu Guan*, Yu Sun, Jianwei
  Liu. Blockchain-based authenticatiofor IIoT devices with PUF, Journal of Systems
  Architecture, 2022, 130: 102638-102638.

  代表性专著：

  关振宇，李大伟，刘昊，温晓晴.现场可编程门阵列中的变异感知和自适应时序优化方法，北京科学技术出版社，2021.

  伍前红，韩天煦，张宗洋，关振宇，尚涛. 区块链工程实验与实践，电子工业出版社，2021.

  李大伟，关振宇，李宗孝，刘建伟. 智能服务及其安全隐私保护技术，北京科学技术出版社，2021.

  张骞允，关振宇，施继婷，高跃. 物联网高速传输天线设计与应用，北京科学技术出版社，2021.

  毛剑，刘建伟，刘文懋，关振宇. 物联网安全——理论与技术，清华大学出版社，2024.

  更多兼职及社会服务：

  中关村区块链产业联盟技术标准组副主席

  CCF 区块链专委会执行委员

  CCF容错专委会执行委员

  工业互联网战略咨询专委会执行委员'
