  u

  学习经历

  2016.9 - 2020.7 中国科学院大学 博士学位

  2014.9 - 2016.7 哈尔滨工业大学 硕士学位

  u

  工作经历

  2026.02 - 至今，北京航空航天大学，副教授

  2023.12 - 2026.02，中国科学院信息工程研究所，副研究员

  2020.08 - 2023.12，中国科学院信息工程研究所，预聘副研/博士后

  u

  研究领域

  信息内容安全、智能决策生成、大语言模型、多模态、图神经网络、机器学习理论、隐私保护

  希望学生：

  1、具有良好的语文、数学、英语、编程能力；

  2、具有自驱力、责任感、同理心、团队合作精神；

  3、期待未来彼此信任、并肩作战、共同成长。

  欢迎同学报考硕士、博士研究生，欢迎有意向本科生提前进组学习，简历发至邮箱

  yinrong@buaa.edu.cn。

  u

  荣誉及奖励

  中国科学院特别研究助理项目（

  2020年，所内前3名）

  中国科学院信息工程研究所优秀引进人才称号

  中国科学院信息工程研究所所长特别奖

  中国科学院信息工程研究所优秀党员

