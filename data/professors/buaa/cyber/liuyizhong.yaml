bio_raw: '基本情况

  教育经历：

  2010—2014，北京航空航天大学，学士

  2015—2016，北京航空航天大学，硕士

  2016—2021，北京航空航天大学，博士

  2019—2020哥本哈根大学，联合培养博士

  工作经历：

  2021—2025，北京航空航天大学网络空间安全学院，助理教授

  2025年至今，北京航空航天大学网络空间安全学院，副教授

  兼职情况：

  担任中国电子学会网络空间安全专家委员会执行委员、CCF区块链专委会执行委员、大数据与隐私计算专委会执行委员，方滨兴院士“方班”辅导老师、主提问老师，担任ICBCTIS
  2023会议共同主席、第四届计算机大数据与人工智能国际会议ICCBDAI 2023共同主席，邓小铁院士主编国际期刊ELSP Blockchain青年编委、国际期刊Metaverse青年编委，CCF推荐会议WWW、TrustCom、Inscrypt、ICA3PP程序委员会委员，IEEE
  TPDS、IEEE TDSC、IEEE TMC、IEEE TII、IEEE TBD、IEEE TSMC、ACM TIT等多个国际重要期刊审稿人。

  主讲课程

  《信息网络安全》、《操作系统》、《科研课堂》、《区块链原理与技术》

  研究方向

  区块链

  密码学

  隐私计算

  数据安全

  人工智能安全等

  教学科研成果

  教学与人才培养：

  作为主讲教师承担《信息网络安全》、《操作系统》、《科研课堂》、《区块链原理与技术》教学工作；主持教育部产学协同项目2项，以第一作者发表教改论文2篇；主讲本科生课程5门、研究生课程1门，包括国家级一流本科课程1门、北航一流本科课程1门；指导省部级竞赛40人次，指导学生获全国大学生信息安全竞赛、中国研究生网络安全竞赛等省部级竞赛一等奖2项、二等奖4项、三等奖2项，获国家级大创2项，本人获省部级竞赛优秀指导教师3次；担任本科生班主任、专属导师、学业导师，学生获北京市优秀毕业生2人，北航优秀毕业生5人；获北航教学成果特等奖1项、二等奖1项

  发明专利：

  获得授权专利18项，受理专利10项。'
