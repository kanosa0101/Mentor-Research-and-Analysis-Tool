bio_raw: '基本情况

  教育经历：

  2011—2014，美国威斯康辛大学麦迪逊分校学士

  2015—2019，日本京都大学硕士、博士

  工作经历：

  2019—2021，日本京都大学助理教授

  2021年至今，北京航空航天大学网络空间安全学院副教授

  兼职情况：

  CCF容错计算专委常务委员

  第二届中国计算机学会芯片大会论坛主席

  CCS/CVPR/AAAI程序委员会委员

  TIFS/TDSC/TCAD/Journal of Cryptology审稿人

  研究方向

  同态加密

  应用密码学

  密码软硬件协同设计

  教学科研成果

  代表性论文：

  主要研究方向是同态加密、隐私保护计算与密码软硬件协同加速，于EUROCRYPT、IEEE S&amp;P、ACM CCS、NDSS、USENIX Security等多个领域的高水平会议及期刊发表论文四十余篇，获ACM
  CCS 2023杰出论文奖。主持国家重点研发计划青年科学家、国家自然基金委面上等项目，入选第九届中国科协青年人才托举工程；指导学生参加“金融密码杯”全国密码应用和技术创新大赛，获创新赛道二等奖、优秀领队奖，指导学生参加全国大学生信息安全竞赛获得一等奖，指导学生2人获北京市优秀毕业生、5人获校级优秀毕业生、5人获校级三好学生、4人获校级学业一等奖学金，协助指导1名学生获批国家自然科学基金青年学生基础研究项目；担任多个跨领域的国际会议与期刊的程序委员与审稿人,
  包括ACM CCS、CVPR及IEEE TIFS等。

  1. 其他发表论文：见https://sbian3.github.io/

  2. 研究团队长期招收密码学、信息安全、计算机体系结构及人工智能安全方向博士、硕士研究生，欢迎本科同学加入团队实习交流。

  获奖情况：

  1. 2022年“金融密码杯”全国密码技术大赛二等奖

  2. 2022年中国密码学会密码测评学术会议最佳论文奖

  3. 2023年中国发明协会发明创业奖创新奖二等奖

  4. 2023年ACM CCS杰出论文奖'
