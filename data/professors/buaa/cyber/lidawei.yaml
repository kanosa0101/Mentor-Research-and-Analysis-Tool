  工作经历：

  2018—2019，新加坡国立大学 访问学者

  2019.11—2023.7，北京航空航天大学网络空间安全学院，讲师

  2023.7—2025.11，北京航空航天大学网络空间安全学院，副教授

  2025.11至今，北京航空航天大学网络空间安全学院，研究员

  主讲课程

  密码学及应用实验

  科研课堂

  网络空间安全思维导论

  研究方向

  公钥密码学

  区块链

  硬件安全

  大模型内生安全

  教学科研成果

  发表学术论文及发明专利等成果60余项

  获奖情况：

  1. 2025年10月获 中组部“国家级青年人才”

  2. 2022年10月获 中国科协“青年人才托举工程”

  3. 2021年07月获 人力资源和社会保障部“全国技术能手”荣誉称号

  4. 2022年09月获 共青团中央/人社部“全国青年岗位能手”荣誉称号

  代表性论文：

  1. ARG: Testing Query Rewriters via Abstract Rule Guided Fuzzing, 2025 IEEE/ACM
  International Conference on Automated Software Engineering (ASE 2025)

  2. Aion: Robust and Efficient Multi-Round Single-Mask Secure Aggregation Against
  Malicious Participants , USENIX Security Symposium 2025

  3. LOGO-based Intellectual Property Right Protection Scheme for GANs on FPGA, IEEE
  Transactions on Dependable and Secure Computing

  4. Fully Anonymous Decentralized Identity Supporting Threshold Traceability with
  Practical Blockchain, International World Wide Web Conference (WWW 2025)

  5. CPAKA: Mutual Authentication and Key Agreement Scheme Based on Conditional PUF
  in Space-Air-Ground, IEEE Transactions On Dependable And Secure Computing'
