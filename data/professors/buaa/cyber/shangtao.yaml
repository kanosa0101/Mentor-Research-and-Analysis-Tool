  学习经历

  1995-2002年沈阳工业大学，本硕

  2003-2006年高知工科大学(日本)，工学博士

  工作经历

  2007-2009北京航空航天大学计算机学院，博士后

  2009-2014北京航空航天大学电子信息工程学院，讲师

  2014-2018北京航空航天大学电子信息工程学院，副教授

  2018-2021北京航空航天大学网络空间安全学院，副教授

  2021至今北京航空航天大学网络空间安全学院，教授

  研究领域

  网络安全、量子密码

  荣誉及奖励

  1）荣誉：唯实人才培育基金（海外优秀人才）项目，北京航空航天大学优秀党支部书记，北京航空航天大学优秀共产党员，北京航空航天大学教学名师，北京市优秀教师

  2）科研：获得中国指挥与控制学会科技进步一等奖，中国指挥与控制学会科技进步（技术发明类）二等奖，北京科技人才研究会麒麟科学技术奖-科技创新奖，中国电子学会科技进步二等奖，中国发明协会创业奖-创新奖二等奖。

  3）教学：获得京师奖高等教育教学成果奖一等奖，北京市高等教育教学成果奖二等奖，北京航空航天大学优秀教学成果奖特等奖、一等奖、二等奖，“凡舟”教育基金二等奖。

  4）人才培养：全国工程硕士实习实践优秀成果获得者，中国电子学会优秀硕士学位论文，北京市普通高校优秀本科毕业设计论文，北京航空航天大学优秀硕士学位论文，北京航空航天大学工程硕士实习实践优秀成果获得者，北京航空航天大学博士生卓越学术基金，全国大学生信息安全竞赛一等奖，CCF量子计算编程挑战赛一等奖，CIC悟空杯量子计算大赛特等奖。

  开授课程

  1）本科生课程

  ·《数据结构与程序设计基础》基础课64学时

  ·《量子密码》 专业课32学时

  2）研究生课程

  ·《信息系统安全》基础课32学时

  教学及科研成果

  1）科研：主持国家科技重大专项课题、国家重点研发计划子课题、国家自然科学基金项目、北京市自然科学基金、航空科学基金、安徽省重点实验室开放课题（重点项目）、中央高校基本科研业务费项目、教育部留学回国人员科研启动基金项目、中国博士后科学基金项目等项目。在PRA、TQE、TIFS、TSC、DCC、SCIENCE
  CHINA、密码学报、电子学报等期刊发表学术论文150余篇，授权发明专利30余项，转化发明专利5项，获批软件著作权3项，出版学术专著3部。

  出版专著：

  ·《Secure Quantum Network Coding Theory》，Springer，2020年3月，ISBN 978-981-15-3385-3。

  ·《Quantum Nonlinear Function Obfuscation Theory and Application》，Springer，2024年9月，ISBN
  978-981-97-6721-2。

  ·《大数据系统安全技术实践》，北京：电子工业出版社，2020年1月，ISBN 978-7-121-37424-1。

  2）教学：主讲课程“量子密码”获批校级一流本科课程建设项目，“信息网络安全”、“数据结构与程序设计”获评国家级一流本科课程。主持教育部信息安全教指委教改项目、教育部产学合作协同育人项目、中国高校产学研创新基金-北创助教项目、校级研究生精品课程建设项目。发表教改论文18篇，“量子密码课程教学实践”获评《计算机教育》杂志创刊20周年纪念活动二十佳论文。

  出版教材：

  ·《信息系统安全理论与技术》，北京：电子工业出版社，2024年11月出版，ISBN 978-7-121-49217-4。

  ·《网络空间安全导论（微课版）》，北京：清华大学出版社，2025年2月出版，ISBN 978-7-302-55011-2。

  ·《MATLAB基础及其应用教程》，北京：电子工业出版社，2014年8月出版，ISBN 978-7-121-23516-0。

  ·《MATLAB基础及其应用教程（第2版）》，北京：电子工业出版社，2019年7月出版，ISBN 978-7-121-36528-7。

  学术与社会服务

  1)学会工作

  中国电子学会网络空间安全专家委员会委员

  中国计算机学会网络与系统安全专业委员会委员

  信息技术新工科产学研联盟网络空间安全工作委员会委员

  中国电力发展促进会网络安全专业委员会委员

  中国电子学会信息论分会委员会委员

  中国网络空间安全学会量子计算安全专业委员会常务委员

  中国密码学会量子密码专业委员会委员

  中国计算机学会量子计算专业委员会委员

  中国电子学会高级会员

  中国指挥与控制学会高级会员

  北京市科协人才举荐评审专家（网络安全与密码学）

  2)编委工作：《电力信息与通信技术》，《信息安全研究》期刊

  3)会议主席：ICAIS2019 Workshop，IWCMC2020 Workshop，CQCC 2025分论坛，CQCC 2026分论坛'
