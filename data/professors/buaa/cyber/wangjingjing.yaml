  教学及科研成果

  王景璟，博士、教授、博士生导师，国家优秀青年科学基金获得者，入选中国科协青年人才托举工程，入选北京航空航天大学青年拔尖人才计划，

  IEEE Senior Member

  。主要研究领域为低空通信网络与安全、低空监管与数据治理等理论和工程应用，主持和参与了国家自然科学基金、国家重点研发计划、国家重大仪器研制项目等十余项课题。研究成果出版学术专著

  6

  部，发表领域内顶级期刊、会议论文百余篇，谷歌学术引用

