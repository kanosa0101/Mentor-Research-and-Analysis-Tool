  Curriculum   Vitae

  Dr.   Jingjing Wang

  (IEEE Senior Member)

  received his B.Sc.   degree in electronic information engineering from Dalian University
  of   Technology, Liaoning, China in 2014 and the Ph.D. degree in information and
    communication engineering from Tsinghua University, Beijing, China in 2019,  
  both with honors. From 2017 to 2018, he visited the next generation wireless   group
  chaired by Prof. Lajos Hanzo from University of Southampton, UK. Dr.   Wang is currently
  a Professor at the School of Cyber Science and Technology,   Beihang University,
  Beijing, China, and also a researcher both at Key   Laboratory of Space-Air-Ground
  Integrated Network Security, Ministry of   Industry and Information Technology,
  Beijing, China, and at Hangzhou   Innovation Institute, Beihang University, Hangzhou,
  China. His research   interests include wireless communications and security, low-altitude
    intelligent network, etc. He has published over 100 IEEE Journal/Conference  
  papers. He is currently serving as an Editor for the IEEE TCOM, IEEE TVT and   IEEE
  IoT. Dr. Wang was a recipient of the Best Paper Award of IEEE ICC, IEEE   WCSP and
  IEEE IWCMC.'
