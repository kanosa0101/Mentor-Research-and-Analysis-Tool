bio_raw: 王德庆，北京航空航天大学计算机学院教授，博士生导师。国家科技资源共享服务工程技术研究中心总工，CCF高级会员、大数据专委会委员，中文信息学会开源情报专委会委员、全国标准数字化标准化工作组（SAC/SWG29）委员、IEEE
  人才与管理服务工作组委员。主要研究方向为大模型、自然语言处理、图神经网络、科技大数据分析与挖掘。作为负责人承担重点项目1项，重点研发计划课题2项，自然基金2项，省部级课题5项，企业课题10项。作为负责人研发颠覆新技术感知响应平台、产业人才大数据平台、科技搜索2.0、科技情报监测预警平台、标准大数据平台。
  “国家科技资源大数据理解与融合分析”获省部级技术发明一等奖1项。在大数据分析、数据挖掘等顶级期刊TKDE发表SCI论文30篇，并在KDD、ACL等知名国际学术会议上发表论文30篇，授权专利3项；编写国家标准2项，获得软著3项。成果应用于科技部、航天二院等，服务国家安全、科技安全等重大任务。团队主页：https://ktl.buaa.edu.cn/
