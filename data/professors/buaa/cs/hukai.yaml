bio_raw: '胡凯，博士，教授，博士生导师，北京市计算机学会理事。北航计算机学院系统结构学科，分布式系统研究方向。2001年在北航计算机系获博士学位，2001~2003年在新加坡南洋理工大学任研究员（Research
  Fellow），参与多国合作的新加坡国家重点项目，合著英文专著《Anatomy of HCTS》（2006年,NUS Publishing）。2004年回国加入北航计算机学院。2011年受邀在法国雷恩一大短期客座访问，2014年在美国亚利桑那州立大学做访问学者。之前曾在航空院所工作多年，任主任设计师，主持和参与了多项航空系统大型项目研发。

  目前主要研究内容包括：

  区块链技术与数字经济：是国内较早从事区块链技术的研究学者之一，提出并发展了智能合约工程（SCE）、验证即服务（VaaS）等理论方法，在数字经济与区块链结合、数字经济园区规划和咨询、区块链数字治理、区块链可扩展性、多链互联和区块链形式化验证技术等方面具有深入研究和专利性成果。研发了北航区块链相关系统、浏览器、监控器、部署工具和区块链大数据管理系统（OpenData）等自主知识产权系列产品，已经应用在多个重要领域。

  分布式并行计算和网络：长期从事复杂计算环境下的分布式计算系统、高性能计算、航空航天电子总线，以及天地一体化网络信息技术研究等，提出和研究了基于狼群的可重组多集群计算理论并应用于实践,研发了多个应用软件系统。

  形式化设计与验证方法：与法国图卢兹计算机研究所（IRIT）和法国自动化所（INRIA）学术合作，成立了形式化方法联合研究实验室，研究基于模型驱动的形式化设计与验证方法，研发了多个模型转换、验证和自动代码生成工具，应用在航空航天安全关键实时系统、区块链和智能合约的验证等。

  2004年以来，培养博硕士研究生60余人，其中多人获校院优秀毕业生，就业单位多为航空航天和IT名企，多人到美、法等国深造和工作。主讲本科生课程《分布式计算原理》和《区块链与数字经济》，研究生学位课《分布式操作系统》。
  近年来在国内外重要学术期刊会议上发表SCI/EI检索论文60余篇，主编《网络计算新技术》（416页，科学出版社2001年出版），联合主编国家级“十一五”规划教材《分布式计算系统导论》（490余页，清华大学出版社2014年出版）。先后主持和参与多项国家自然基金、教育部产业基金、863重大项目、国家核高基项目、航空航天基金、以及多项航空航天领域项目。获得国家发明专利和软著40余项，2015年获航空基金委5年优秀成果奖，2018年中国产学研创新成果二等奖。

  联系方式： 办公电话：82339460电子邮件：hukai@buaa.edu.cn办公地点：北航新主楼G座G1041'
