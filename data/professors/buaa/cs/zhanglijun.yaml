bio_raw: '张力军，男，1971年生，北京航空航天大学计算机学院教学实验中心副主任。1998年北京航空航天大学自动控制系控制理论与应用专业博士毕业。目前主要研究方向：计算机网络技术，计算机应用系统开发。指导过三十余名硕士研究生。

  作为项目负责人主持完成了一项航空科学基金，并参加过多项国家自然科学基金和航空科学基金的研究工作。在国内外刊物和会议上发表学术论文二十余篇。负责本科生和研究生的“计算机网络实验”课程。先后获得过国家级教学成果二等奖、北京市教学成果一等奖、宝钢优秀教师奖等奖项。

  邮箱：ljzhang@buaa.edu.cn，电话：010-82317611，办公室：新主楼G807'
