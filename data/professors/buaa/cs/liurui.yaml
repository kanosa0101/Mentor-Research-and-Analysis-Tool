bio_raw: '刘瑞，男，博士，教授，博士生导师，现在北航软件开发环境国家重点实验室工作，担任国家科技资源共享服务工程技术研究中心总工，主要从事数据库、大数据管理及数据挖掘、自然语言处理、科技资源共享等方面的研究。此外，先后担任互联网标准化组织W3C顾问委员会代表、中国高等教育协会实验室分会特聘委员、中国分析测试协会高校分会特聘专家，中国林业科学研究院大型仪器设备开放共享管理委员会委员等。2008～2009曾在美国匹兹堡大学做访问研究。

  主讲计算机学院本科生核心课程“数据库系统原理”和研究生核心课程“数据挖掘”，已培养博士、硕士研究生90余名。曾获部级科技进步三等奖3项，发表SCI、EI学术论文40余篇，获得授权发明专利5项；撰写了30多篇研究咨询报告，支撑制定了3项国家政策。所制定的3项标准规范已在近全国5000家高校院所得到应用；支撑了多项国家的管理工作，包括：中央级新购仪器查重评议、中央级高校院所仪器设备开放共享评价考核、免税进口仪器开放共享海关监管等，在提升我国科研仪器利用效率等方面发挥了重要作用，产生了重大的社会和经济效益，受到了多个中央部委的好评。

  作为负责人共承担30余项课题，包括科技部重大专项4个，国家重点研发计划1个，国家自然基金项目2个。近几年承担的主要科研项目有：

  1. 重大科研基础设施和大型科研仪器国家网络管理平台（科技部重大专项）

  2. 大型科研仪器购置评议方法和规律研究（科技部重大专项）

  3. 数据挖掘关键技术研究（科技部重大专项）

  4. 科学数据权益保护基础与关键技术研究（国家重点研发计划）

  5. 基于公共服务的科技资源开放共享机制理论及实证研究（自然基金项目）

  6. 基于动态与异构场景的科学数据中心评价方法研究（自然基金项目）

  7. “科创中国”科研仪器设备案例库（中国科学技术协会）

  8. 国家科技重大专项科技成果信息汇交平台（国家科技部）

  9. 科技资源信息管理系统（国家科技部）

  10. 地调舆情跟踪与结构化（国家地质调查局）

  11. 中国科技资源共享网（国家科技部）'
