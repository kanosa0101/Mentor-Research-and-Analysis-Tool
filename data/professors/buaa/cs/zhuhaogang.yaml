bio_raw: '朱皞罡，北京航空航天大学计算机学院教授、博导，入选国家级人才计划，国家电子政务专家委员会委员，科技部重点研发计划首席科学家，雄安区块链实验室首席科学家。曾任英国卫生部国家健康研究院研究员，英国Moorfields眼科医院荣誉研究员。研究方向包括分布式安全可信计算、WEB3.0、医疗人工智能等。

  在分布式安全可信计算方向，主持“雄安数字身份体系”与“雄安链”核心技术研发，设计了基于区块链的法定数字身份与数据体系融合的新型数字身份体系，实现以个人为中心的数据治理，使“个人数据账户”落地雄安。担任科技部区块链专项国家重点研发计划《“网-信-安”一体化区块链性能模型及多层级持续协同优化关键技术研究》项目负责人，从区块链系统的“可度量性、规模可扩展性、全局可优化性”三个科学问题出发，实现区块链全局优化策略生成以及运行时持续优化。提出基于栈同步与知识计算化的算法拆分与算法路由，形成异构安全配置下的多方计算体系结构，实现以算法投放代替数据拷贝的“零拷贝”计算，并应用于多个国家医学与临床研究中心、跨境贸易、电子政务、工业互联网平台中。

  在医疗人工智能方向，擅长信息学与医学交叉领域的转化型研究，研究成果已被应用在多个政府、国际医院及企业产品中。提出了视神经纤维结构与功能关系量化模型，并在此基础之上提出了青光眼疾病恶化侦测模型ANSWERS，保持了至今为止最高准确率。提出了首个胎儿先天性心脏病筛查、诊断与质控模型体系，并日常应用于多家专病医联体医院。构建了CT三维影像“以图检图”方法，实现了医疗影像的实时语义检索。

  在IEEE Transactions on Medical Imaging、AAAI、Pattern Recognition、MICCAI、ACM International
  Conference on Multimedia、中国卒中杂志、Investigative Ophthalmology & Visual Science等期刊、会议发表学术论文80余篇，引用1800余次。承担多项政府、业界资助的项目，资助单位包括科技部、工信部、国家自然基金、中央网信办、北京市科学技术委员会、雄安新区管委会、英国国家健康研究院、国际防盲协会、Pfizer、Carl
  Zeiss Meditec等。'
