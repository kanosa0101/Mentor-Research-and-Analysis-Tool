bio_raw: '陈佳鑫，男，博士。先后于2009年、2012年和2017年获北航应用数学专业学士学位、数学专业硕士学位及计算机应用技术专业博士学位。2017至2018年间在纽约大学阿布扎比分校从事博士后研究工作。2018至2021年在起源人工智能研究院担任研究科学家，现为北京航空航天大学计算机学院副教授/硕士生导师。目前主要研究方向包括计算机视觉（智能视频分析、图像检索、三维视觉）、模式识别、机器学习等。作为核心成员参与多项国家自然科学基金项目、港澳台合作项目等。相关研究成果已发表论文23篇，包括IEEE
  Transactions on Image Processing (TIP)、IEEE Transactions on Pattern Analysis and
  Machine Intelligence (TPAMI)等顶级期刊；CVPR、ICCV、ECCV等计算机视觉领域顶级会议。协助指导博士生、硕士生多人。担任研究生学位课《机器学习》主讲教师。

  办公地址：北京航空航天大学新主楼G1003

  联系方式：

  jiaxinchen@buaa.edu.cn

  更多信息请参见个人主页：

  http://shi.buaa.edu.cn/chenjiaxin/zh_CN/index.htm'
