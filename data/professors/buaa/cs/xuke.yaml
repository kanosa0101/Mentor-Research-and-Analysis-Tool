bio_raw: 许可，男，1971年8月生，教授，博士生导师。分别于1993年7月和2000年3月在北京航空航天大学飞行器设计与应用力学系和计算机科学与工程系获学士和博士学位。现工作于北京航空航天大学计算机学院软件开发环境国家重点实验室。获"全国百篇优秀博士论文"奖和中创软件人才奖。入选北京市科技新星计划和教育部新世纪优秀人才支持计划。主持或作为学术骨干参与了国家自然科学基金、973和国家攀登计划等科研项目。其中，所负责的一项国家自然科学基金项目在结题时被基金委评为特优。现任《中国科学:信息科学》等期刊编委，曾任973项目首席科学家助理和项目专家组成员。主要从事算法与复杂性、数据挖掘和网络等方面的研究工作。
  在算法与难解问题的研究中，提出了国际上应用问题最广泛的难解实例产生模型RB，解决了经典CSP模型的平凡无解性问题，系列论文发表于AIJ、JAIR、TCS和PRE等计算机和物理领域的国际权威期刊和IJCAI等国际顶级会议。RB模型被广泛应用于国际算法竞赛和算法及相关领域的研究与教学，是国际公认的最大团等经典难解问题算法测试的主要标准之一，并被大篇幅写入图灵奖得主Knuth的《计算机程序设计艺术》、国内外教材、手册、指南、百科全书和专著等20余本书籍。
  在网络与数据挖掘研究方面，主持设计和开发了一个全球IPv6骨干网络拓扑探测系统，探测结果被来自全球145个国家和地区的研究者访问，并被Slashdot等多家知名IT网站转载或链接；研究了动态移动社交网络中路由协议的设计与优化；发现了交通网络中人群移动的新规律并对其进行了建模；针对在线社交网络信息传播的机制与优化，提出了新的信息传播模型；研究了文本情绪分类问题，主持设计和开发了国际上第一个针对中文微博的在线情绪分析系统MoodLens；提出了基于文本情绪分析的搜索概念（称为心情搜索），并通过大数据分析发现了愤怒是社交网络上最容易传播的情绪。相关成果发表于IEEE
  ToC、IEEE TPDS、PRE和JCMC等计算机、物理和传播学领域的国际权威期刊，以及IJCAI、AAAI、KDD和ACL等国际顶级会议。情绪传播的成果被BBC、CNN、华盛顿邮报、纽约时报、麻省理工技术评论、发现频道和新华网等来自90多个国家的数百家媒体报道，并被写入英中法德意等5种语言的10多本书籍，包括国外小学教材、本科教材、畅销书，以及计算机、政治、经济、新闻、心理学和金融等领域的著作。
