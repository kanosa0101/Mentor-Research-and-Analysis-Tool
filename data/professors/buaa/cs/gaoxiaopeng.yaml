bio_raw: 研究领域为计算机系统结构、嵌入式系统，当前主要研究内容包括复杂软件仿真测试验证、GPU并行、软件模拟器、FPGA及微处理器开发等。发表论文30余篇，申请国家专利10项；获国防科学技术进步2等奖1项、北京市科学技术进步2等奖1项、北京市教学成果奖1项。目前主讲研究生学位课《高等计算机体系结构》和本科生专业基础课《计算机组成原理》。
