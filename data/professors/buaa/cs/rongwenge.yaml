bio_raw: 荣文戈，男，北京航空航天大学计算机学院教授，博士生导师，IET Fellow，BCS Fellow，IEEE Senior Member，国际标准化组织/国际电工委员会C语言标准工作组（ISO/IEC
  JTC1/SC22/WG14）注册专家，国际电工委员会自主与人工智能应用伦理系统评估组（IEC/SEG10）注册专家，国家智慧城市标准化总体组副组长，全国信标委智慧城市标准工作组副组长，中国人工智能学会智能交互专委会委员。2010年于英国雷丁大学获博士学位，2003年于英国伦敦大学玛丽皇后学院获硕士学位，1996年于南京理工大学获学士学位。1996年-2002年在航天科技集团公司第710所担任软件开发工程师，2003年-2005年在北京神舟航天软件技术有限公司担任技术经理。主要研究方向为自然语言处理、机器学习、数据挖据和信息系统等，担任Frontier
  of Computer Science期刊Manager Editor（2010-2012），Computer Speech & Language期刊客座编辑（2020），INLG'2019
  Workshop Chair，WoWMoM'2017 Demo Chair，是ACL、EMNLP、COLING、NAACL、INLG、AAAI、IJCAI、ICWS等本领域多个主要会议的程序委员会委员。主持国家重点研发计划（课题）、国家自然基金、北京市科委、软件开发国家重点实验室等多个项目，并参与了多项863、质检公益等项目，在本领域重要学术期刊和会议上发表论文120余篇，承担本科生必修课《高级语言程序设计》、《面向对象程序设计与构造》、《计算机科学方法论》、《计算机导论与伦理学》，以及研究生选修课《航天型号软件工程》、留学生选修课《数据结构》等教学工作，主持3项校级教改项目，获2018年校级教学成果一等奖（6/7）。指导/协助指导研究生/本科毕设多人，其中7人获研究生国家奖学金，3人获校级优秀硕士论文，2人获校级本科优秀毕业论文。更多信息请访问个人主页：https://wgrong.github.io。
