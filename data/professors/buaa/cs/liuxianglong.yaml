bio_raw: 刘祥龙，北京航空航天大学教授，博士生导师，国家级领军人才，国家重点研发计划项目首席科学家，现任计算机学院党委书记、复杂关键软件环境全国重点实验室副主任、中国仿真学会视觉计算与仿真专委会副主任、国家人工智能标准化总体组治理专题组联合组长。刘祥龙教授长期从事安全可信人工智能的教学和科研，负责《人工智能安全导论》、《数据结构与程序设计》等本科和研究生国家级课程，发表TPAMI、IJCV、CVPR、ICLR等人工智能领域国际顶级期刊/会议论文160余篇，主持国家自然科学基金青年A类和B类项目、科技创新2030重大项目、国家重点研发计划项目等国家级项目。担任IEEE
  TNNLS、Pattern Recognition、《智能安全》等期刊编委，ACL、AAAI等国际会议领域主席。连续入选爱思唯尔中国高被引学者，获中国仿真学会科学技术一等奖、陕西省自然科学一等奖、中国电子学会青年科学家奖、北京市科技新星等。指导学生获得世界人工智能大会云帆奖、CSIG博士学位论文奖励计划、ACM
  MM最受关注演示论文奖、亚太多媒体大会最佳学生论文、IEEE低功耗计算机视觉挑战赛全球冠军、国家自然科学基金博士生项目、中国科协青年人才托举工程博士生专项计划、字节跳动奖学金、首都挑战杯特等奖等。
