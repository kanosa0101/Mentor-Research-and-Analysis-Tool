bio_raw: '潘俊君，博士，教授，博士生导师。本科、硕士毕业于西北工业大学计算机学院。2006年获全额奖学金，进入伯恩茅斯大学-英国国家计算机动画中心（NCCA）攻读博士学位，2010年博士毕业后在该中心从事博士后研究。2012年在美国伦斯勒理工大学的医学模拟、仿真与成像中心担任Research
  Associate。2013年11月，成为北京航空航天大学计算机学院副教授，2021年晋升为教授，并入选国家级青年人才项目。目前学会任职: 吴阶平医学基金会模拟医学部虚拟技术专委会副主任委员，中国虚拟现实产业联盟虚拟医疗专委会秘书长，中国仿真学会医疗仿真专委会秘书长，中华医学会数字医学分会青年委员等。

  主要研究方向包括：虚拟手术，计算机动画，医学可视化等。在IEEE Transactions on Medical Imaging， IEEE VR等国内外顶级及知名期刊、学术会议上发表60余篇学术论文，并担任多部国际期刊的评审人。授权专利12项（含美国专利2项），软件著作权7项，成果技术转化3项，是北航“青年拔尖人才”、“英国皇家学会牛顿基金”获得者。目前已承担包括3项国家自然科学基金，1项人社部优秀归国人员创新项目在内的20余项课题。作为项目骨干参与了国家自然学基金重大项目1项，国家重点研发计划2项。

  专注医工交叉领域，学术研究与系统研发并重。在英国期间，研发了世界首台直肠癌腹腔镜手术的虚拟训专注练系统，成果获得BBC及医学杂志的采访与报道。在美国期间，受NIH资助，与哈佛大学医学院合作开展了世界首台NOTES手术训练系统研发。回国后带领团队研发了具有我国自主知识产权的“虚拟腹腔镜手术综合训练系统（UniLapsim）”，已实现产业化并在多家医院、医学院应用。相关成果在国内外产生了重要的学术与社会影响力，受到央视新闻联播、经济频道、新华网、中国青年报、中国电子报等多家媒体关注及报道。2008年获得“伯恩茅斯大学学者”荣誉头衔。2019年获得英国Global
  Visiting Fellowship Award（全球获奖者5人）。2020年获得中国电子学会科技进步一等奖（虚拟手术关键技术及应用）和山东省科技进步奖二等奖
  (消化系肿瘤计算机辅助诊疗平台研发与临床应用)。2021年获“苏州相城区科技领军人才”称号，并入选国家级青年人才项目。'
