bio_raw: 欧阳元新，女，博士，教授，博士生导师，北京市高等学校青年名师奖获得者。一直从事自然语言处理、个性化兴趣挖掘与推荐服务等方面的研究，曾获北京市科学技术奖两项、参编北京市地方标准6项、授权并完成转化国家发明专利7项。先后承担了“北京首都国际机场二号航站楼公共广播系统及后续升级”、“世纪财富中心弱电系统工程”、“乌鲁木齐国际机场地面信息系统”、“澳门海关智能卡系统”、“澳门立法会电子会议系统”、“某公安局智能搜索系统”、“985工程”二期平台建设（天空地一体化综合信息服务支撑技术）、北京地区高等学校学科群建设（信息学科群）、“十七大/十八大电子会务辅助系统”、“北京市轨道交通自动售检票系统”、863计划主题项目“智慧城市（一期）”、863计划重大项目“智慧城市（二期）”、质检公益性行业科研专项“智慧城市基础通用29项国家标准研制”、国家国际科技合作计划“大飞机全生命周期数据活化与网络服务技术联合研发”、国家自然科学基金“基于社会化标签的个性化推荐技术研究”“结合学术与产业热点的高校课程内容组织与个性化学习关键技术研究”等大型科研项目。
