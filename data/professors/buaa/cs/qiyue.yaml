bio_raw: '齐越，博士，教授，博士生导师。虚拟现实/增强现实技术及应用国家工程实验室（北航）副主任，虚拟现实技术与系统全国重点实验室研究员。美国哈佛大学高级访问学者。主要从事虚拟现实/增强现实、计算机图形学、计算机视觉、人工智能等方面研究。近些年主持了国家自然科学基金、国家重点研发计划、国家863计划、国家科技支撑计划等科研项目。研究成果发表在《ACM
  Transactions on Graphics》、《IEEE Transactions on Visualization and Computer Graphics》、《Computer
  Graphics Forum》、《Pattern Recognition》、《Neural Networks》、《Computational Visual Media》、《中国科学：信息科学》、《软件学报》等国内外重要学术期刊，以及ACM
  SIGGRAPH ASIA、IEEE VR、ACM VRST等国际会议上，获IEEE VR 2025最佳论文奖，获中国发明专利授权40余项。获国家科技进步一等奖1项，教育部发明一等奖1项。

  联系方式  电子邮箱：

  qy@buaa.edu.cn'
