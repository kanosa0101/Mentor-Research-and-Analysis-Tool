bio_raw: '北航计算机学院教授，国家高层次人才。现任中国人工智能学会人工智能基础专业委员会主任。

  1993年中国科学院软件研究所研究生毕业，获博士学位。1993年7月-2018年7月在中国科学院软件研究所工作，分别于1995，1999年被聘为副研究员、研究员。分别于1998年1月-1999年1月，2000年2月-2002年2月在英国Leeds大学做访问学者、研究员。2008年9月-2009年3月在美国Cornell大学做访问科学家。2012年1月-2012年3月，英国剑桥大学牛顿数学研究所做访问学者。2018年7月至今，就职北京航空航天大学计算机学院。

  研究计算、信息与智能的数学原理。2008 - 2016年，提出编码树的概念、结构熵的度量，创立了《结构信息论》。2016 - 2024年，提出信息世界的层谱抽象科学范式，建立了包括信息演算理论、信息生成原理和信息解码原理为三大支柱的信息数学原理；建立了包括（观察）学习的信息理论、自我意识的信息理论和博弈/谋算理论为三大支柱的人工智能信息科学原理。2024年在科学出版社出版《人工智能科学
  — 智能的数学原理》和《人工智能原理 — 从计算到谋算的模型、原理与方法》专著。 目前主要研究“谋算智能机器原理”和“《孙子兵法》的人工智能原理”。'
