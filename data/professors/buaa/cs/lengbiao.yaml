bio_raw: '冷彪，北京航空航天大学计算机学院教授、博士生导师。2004年本科毕业于国防科技大学计算机学院，2009年博士毕业于清华大学计算机系。从2009年到2019年在北京航空航天大学计算机学院任讲师、副教授、教授。

  现研究方向主要包括智能体应用、多模态大模型、人工智能安全与强化学习。以第一作者或通讯作者发表学术论文60余篇，其中ESI高被引论文1篇，CCF A类论文10余篇，单篇最高引用次数过百。多篇论文收录在IEEE
  Trans. on Image Processing, IEEE Trans. on Visualization and Computer Graphics,
  IEEE Trans. on Multimedia, IEEE Trans. on Intelligent Transportation System, IEEE
  Trans. on Multimedia, IEEE Internet of Things Journal, IEEE Trans. on Neural Networks
  and Learning Systems等计算机领域顶级期刊和CVPR, ICCV, ACM MM, ECCV, AAAI, IJCAI等国际计算机视觉和人工智能顶级会议。

  主持纵向课题10余项，主要包括国家重点研发计划重点专项项目课题、国家自然科学基金面上项目、工信部高质量发展专项、国家信息安全专项、北京市自然科学基金项目、北京高等学校青年英才计划项目、国家教育部博士点基金项目、深圳市科创委基金项目等。作为项目核心骨干，积极参与了国家863计划信息技术领域主题项目“智慧城市（一期）”和重大项目“智慧城市(二期)”。

  指导毕业硕博研究生50余人，主要就业于高校、科研院所、航天科工集团、工商银行、农业银行、华为、字节跳动、快手等单位。

  本课题组常年面向北京航空航天大学及全国各高校招收硕士、博士研究生。同时热烈欢迎北航及其他院校的硕博研究生、本科生来实验室实习，参与各类科研课题与工程项目。期待各位同学前来交流探讨、共探学术前沿，联系方式：lengbiao@buaa.edu.cn。'
