bio_raw: '姜博，教授，博士生导师，CCF软件工程专委委员，CCF系统软件专委委员,北京市隐私计算与区块链高精尖中心研究员。主要研究方向为软件测试、系统安全和操作系统。他目前主持和参与的项目包括国家重点研发计划，国家自然科学基金面上项目和重点项目，以及多项企业（华为，腾讯，滴滴，中海油等）合作课题。近年来在国际知名期刊和会议共发表学术论文60余篇，包括多篇软件工程和系统软件领域的文章（ASE
  FSE VLDB IEEE TC JSA JSS IST IEEE T-Reliability IEEE TSC TOSEM），并4次获得国际会议最佳论文。他还担任COMPSAC,
  ICWS15, APSEC12, QSIC，QRS等国际会议的程序委员会委员，并作为TOSEM，TSE，JSS，IST，TSE，ASEJ，Science China
  Information Sciences, ASE, COMPSAC, QRS等多个期刊和会议的审稿人。他曾担任软件工程领域著名期刊的Journal of Systems
  and Software的Guest Editor。目前承担《操作系统》《操作系统课程设计》本科专业核心课程的教学。个人主页：http://jiangbo.buaa.edu.cn/

  联系方式：

  电邮：gongbell@gmail.com

  办公室：北航新主楼G1046'
