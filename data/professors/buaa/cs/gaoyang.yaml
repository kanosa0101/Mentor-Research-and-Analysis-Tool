bio_raw: '高阳，教授，博士生导师，国家级青年人才。2019年参加工作后于虚拟现实技术与系统全国重点实验室从事教学科研工作。在SIGGRAPH、IEEE VR、TVCG等图形学、VR/AR领域国内外知名期刊和会议发表文章60余篇。主持国家自然科学基金面上、北京市自然科学基金面上项目、国家重点研发计划课题等10余项，以及中国核电、三峡集团等企业委托项目多项。获2024年中国仿真学会科学技术一等奖（3/15）、2024年河南省科技进步一等奖（2/15）等省部级一等奖4项。兼任中国仿真学会医疗仿真专委会秘书、国际期刊《VRIH》青年编委、《计算机辅助设计与图形学报》编委等。

  主要研究方向为虚实融合场景建模仿真与交互、VR+医疗康复应用技术研究，包括可视化物理仿真、真实感绘制、虚拟人仿真及虚实融合脑机康复技术研究等。长期研究目标是围绕虚拟医疗及虚拟人体关键技术，探索从真实感图形仿真到物理、生理仿真及智能场景生成关键技术，实现沉浸感强、物理真实、智能可交互的VR/AR应用。

  目前担任信息大类本科生《数据结构与程序设计》和虚拟现实专业课《

  虚拟现实应用基础技术》主讲教师。长期接收本科生加入课题组进行科研实习。'
