bio_raw: '教授、博导，2012年入选教育部新世纪优秀人才支持计划。

  个人简介：

  1999年于北京航空航天大学获工学学士学位、2004年和2007年分别于电子科技大学获工学硕士和工学博士学位。2007年6月-2017年5月任职于北京交通大学电子信息工程学院，先后于2008年、2011年破格晋升副教授、教授，期间于2009年9月-2010年9月赴美国普渡大学计算机系做访问学者。2017年5月加入北京航空航天大学计算机学院。

  研究方向：

  未来互联网体系结构与关键技术、空天地海网络一体化、无人机集群组网。

  科研项目：

  近年主持的主要项目如下：

  国家重点研发计划课题：端网协同的高效可靠传输机制，2020.01-2022.12，主持，532万。

  学术论文：

  在互联网领域国际权威刊物和会议发表论文60余篇，近年发表的5篇代表性论文如下：

  [1]Hongbin Luo, Zhoubiao Liu, Shan Zhang, “Preventing DDoS Flooding Attacks With
  Cryptographic Path Identifiers in Future Internet,” IEEE Transactions on Network
  and Service Management, vol. 19, no. 2, pp. 1690 – 1704, June 2022.

  [2]Shan Zhang, Junjie Li, Hongbin Luo, Jie Gao, Lian Zhao, Xuemin Sherman Shen,
  “Low-Latency and Fresh Content Provision in Information-Centric Vehicular Networks,”
  IEEE Transactions on Mobile Computing, vol. 21, no. 5, pp. 1723 – 1738, May 2022.

  [3] Shan Zhang, Liudi Wang, Hongbin Luo, Xiao Ma, Sheng Zhou, “AoI-Delay Tradeoff
  in Mobile Edge Caching With Freshness-Aware Content Refreshing,” IEEE Transactions
  on Wireless Communications, vol. 20, no. 8, pp. 5329 – 5342, Aug. 2021.

  [4] Shan Zhang, Hongbin Luo, Junling Li, Weisen Shi, Xuemin Shen, “Hierarchical
  Soft Slicing to Meet Multi-Dimensional QoS Demand in Cache-Enabled Vehicular Networks,”
  IEEE Transactions on Wireless Communications, vol. 19, no. 3, pp. 2150 – 2162, Mar.
  2020.

  [5] Jiawei Li, Hongbin Luo, Shan Zhang, Shui Yu, Tilman Wolf, “Traffic Engineering
  in Information-Centric Networking: Opportunities, Solutions and Challenges,” IEEE
  Communications Magazine, vol. 56, no. 11, pp. 124 – 130, Nov. 2018.

  获奖情况：

  北京青年五四奖章（2015年）； 

  国家技术发明二等奖（2014年）； 

  教育部技术发明一等奖（2013年）； 

  中国电子学会电子信息科学技术一等奖（2012年）； 

  全国百篇优秀博士学位论文提名奖（2009年）； 

  四川省优秀博士学位论文（2009年）。'
