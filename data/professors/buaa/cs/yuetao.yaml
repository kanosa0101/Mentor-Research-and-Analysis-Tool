bio_raw: '岳涛，北京航空航天大学教授，博士生导师。2006年和2010年分别在加拿大获得硕士和博士学位，曾在Simula研究所担任首席研究员（研究教授）。研究方向包括软件测试、不确定性软件工程、模型驱动工程、量子软件工程；在软件工程领域共发表高质量学术论文170余篇。现担任国际期刊《ACM
  Transactions on Software Engineering and Methodology》（TOSEM）量子软件工程专栏主编，国际期刊《IEEE
  Transactions on Software Engineering》（TSE）、《Empirical Software Engineering》（EMSE）和《Software
  and System Engineering》（SoSyM）编委；曾担任多个国际会议（如MODELS）的程序委员会联合主席和国际会议（如ICSE、FSE、ASE）的审稿人。

  办公室G917

  办公电话 （010）82317496

  个人网站 https://yue-tao.github.io/'
