title: 教授
bio_raw: '张玉平，男，生于1966年11月，教授。

  1993年于北京师范大学数学系获得基础数学博士学位，攻读博士学位期间主要从事纯粹逻辑研究，专注于模型论的稳定性理论分析。同年进入北航计算机学院博士后流动站，1995年出站并留校，工作于北航计算机学院软件开发环境国家重点实验室。先后参加两项973项目，将逻辑方法应用于计算机科学前沿研究，特别是形式理论的极限研究；近期参加一项863项目，将形式证明及反证技术应用于设计软件测试有效算法。在纯粹理论研究方面，致力于独立性及可判定性的研究，使用数理逻辑的模型论工具，研究理论计算科学中所关注的某些逻辑系统和一些纯粹数学问题的内在逻辑性质。多年从事本科生《离散数学》课程的数理逻辑部分及研究生的《高级数理逻辑》课程的教学工作，努力探索一套适合于计算机科学的数理逻辑教学体系。'
