bio_raw: '百晓，博士，教授，博士生导师，研究方向为模式识别、计算机视觉、图像处理等。2001 年毕业于北京航空航天大学计算机系，获学士学位。于2006年在英国约克大学获得博士学位。2006年9月-2009
  年1 月在英国巴斯大学多媒体研究中心（Multimedia Technology Research Center）工作，任研究科学家（Research Scientist/Fellow），2009年2月起任北京航空航天大学计算机学院副教授。2015年5月，获评为博士生导师，2015年10月晋升为教授。在相关领域国际重要期刊和会议上发表论文百余篇，其中被SCI收录40余篇。作为项目负责人主持项目有国家级项目十余项。2009年被北京航空航天大学评为“北航航空百人”和“航天新星”。2010年入选中共中央组织部、共青团中央组织的“第十一批博士服务团”。2011年被评为“北航优秀研究生导师”。2012年被评为教育部“新世纪优秀人才”。2013年以第一完成人获中国电子学会自然科学一等奖（省部级一等奖）。2015年获得中国电子学会优秀科技工作者称号。2016年荣获中国科协颁发的第七届“全国优秀科技工作者”。现为国际模式识别著名期刊Pattern
  Recognition副主编，Pattern Recognition Letter客座编委。

  联系方式： 新主楼 G829， 电话：010-82339430，邮箱：baixiao@buaa.edu.cn'
