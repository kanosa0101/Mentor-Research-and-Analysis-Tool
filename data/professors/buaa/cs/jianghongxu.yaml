bio_raw: '姜宏旭：男，1976年出生，博士，研究员，博士生导师，虚拟现实技术与系统全国重点实验室、数字媒体北京市重点实验室成员。1998年7月于北京航空航天大学获学士学位，2003年12月于北航模式识别与智能系统专业获博士学位，2005年12月在北航计算机应用专业博士后出站，2006年至今在北航计算机学院任教，2016-2017年在美国加州大学洛杉矶分校DRL实验室从事动态神经网络计算方面访问研究。主要研究方向包括人工智能、遥感及计算机视觉、智能计算和嵌入式实时系统等，涉及人工智能算子重构、图算融合、智能模型压缩、模型编译优化与部署加速等多方面技术。

  近年承担了国家重点研发计划、装备预研、基金和企业合作等科技研发项目10余项，其中代表性研究课题包括：“多层次感知的算子协同编译优化技术”（国家科技创新2030-“新一代人工智能”项目中课题），“面向领域应用的智能算法软硬件协同计算优化技术”（

  部省联动国家重点研发计划

  项目中课题）、“面向NPU/FPGA平台的跨平台迁移和高效部署技术”（装发预研子课题）、“适合星上图像处理的深度卷积网络轻量化方法”（国家自然基金课题）、“面向智能控制的嵌入式硬件资源协同调度技术”（航天基金课题）、“边缘计算中硬件感知的编译加速技术”（海康威视合作课题）、“红外时敏目标自动识别跟踪技术”（航天企业合作课题）等。基于课题相关研究成果，已在在IEEE
  T-CSVT、T-GRS、Neurocomputing、The Journal of Supercomputing和《计算机学报》等重要刊物及国际会议上发表论文40余篇，获国家发明专利授权10余项。此外，团队研制了多款基于嵌入式处理器的图像视频实时智能处理单元，并在卫星、导弹和视频监控系统中进行了装备和测试验证，取得了良好的应用效益，相关成果也获国家技术发明二等奖1项、部级科技进步奖3项。

  指导博士、硕士研究生30余人次。讲授的本科生和研究生课程包括：《嵌入式系统设计实训》、《现代电子系统设计方法与工具》、《数字媒体技术及智能应用导论》等。

  E-mail：

  jianghx@buaa.edu.cn

  Phone：010-82314108 办公室：新主楼G811'
