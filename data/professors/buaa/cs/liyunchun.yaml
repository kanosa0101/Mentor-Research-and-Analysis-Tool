bio_raw: '李云春，男，汉族，博士，2010年赴美国伊利诺伊大学香槟分校（UIUC）计算机学院留学，进行并行程序性能分析的研究。现任北京航空航天大学网络信息中心主任，研究方向为大数据、云计算、并行计算、计算机网络、网络安全和教育信息化。

  长期从事计算机网络、网络空间安全、并行程序性能分析、计算机网络管理等技术的研发工作，主持开发了下一代智能安全网络产品开发平台、地球系统模式一体化集成开发环境、并行程序性能分析软件、校园无线网络管理系统、北航ihome校园社交门户平台等软件系统。近年来主持并参与完成863计划项目《地球系统模式一体化集成开发环境及示范应用研究》、《并行应用性能分析与低功耗管控技术的研究》、《E级超级计算机新型体系结构及关键技术路线研究》等十余项科研项目，目前，主持国家重点研发计划课题《大数据存储性能评测的新理论与方法和工具》，研究华为公司研发的新型大数据存储系统的性能评测技术，参与国家高技术研究发展计划（863计划）课题《基于中国云产品的混合云关键技术与系统》，研究在混合云平台上快速部署应用系统的方法和技术，同时，作为技术负责人，每年承担北航校园网络和信息化系统的集成和建设项目，推进高校智慧校园建设。在国内外学术刊物或会议上发表60余篇教学、科研论文，获批10余项专利，从事的《大型分布式多媒体会议系统》项目于2008年获北京市科学技术进步二等奖，《下一代智能安全网络产品研究》项目于2009年获得北京市科学技术进步三等奖，主讲《并行程序设计》、《高等计算机网络》和《计算机网络安全》等课程，2017年获“校级工程硕士实习实践优秀成果获得者”指导教师，2011年获计算机学院“优秀主讲教师”，已指导毕业研究生50余人。'
