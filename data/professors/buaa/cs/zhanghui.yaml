bio_raw: '张辉，男，博士，教授，博士生导师。1985年考入北航计算机学院，先后获得学士、硕士和博士学位。1997-2001，担任北航网络中心副主任。2007.2-2008.2在美国芝加哥大学/Argonne国家实验室访问研究，从事Grid
  Computing研究。现兼任国家科技资源共享服务工程技术研究中心副主任，负责科技资源信息整合、管理与共享服务的技术研发工作。

  主讲计算机学院核心课程“计算机网络”，获得宝钢优秀教师、学校“奖教金”、学院“优秀教学奖”等。获部级科技进步二等奖、中国电子学会科学技术奖一等奖各1项。发表SCI、EI学术论文80余篇，获得专利6项，参与撰写多项有关数据汇聚、管理、质量、服务及评估等方面的国家标准。已培养博士、硕士研究生80余名，2名获得校级优秀硕士毕业论文。牵头承担的主要科研项目有：

  ◎海量数据采集、传输、处理、挖掘的理论和方法研究（国家973项目，课题负责人）

  ◎中国科技资源共享网（国家科技平台项目，项目负责人）

  ◎国家自然基金项目成果共享研究（自然基金项目，项目负责人）

  ◎微生物数字化信息系统集成关键技术研发（国家863计划，课题负责人）

  ◎分布式科技资源体系及服务评价技术研究（国家重点研发计划，项目负责人）

  ◎多模态科技资源自动编码技术与工具库（“十四五” 国家重点研发计划，课题负责人）

  目前主要研究领域：计算机网络、数据安全、基于AI的网络安全

  招生要求：热爱编程，动手能力强，有协作精神。

  联系方式：

  电话：82338088电子邮件：hzhang@buaa.edu.cn'
