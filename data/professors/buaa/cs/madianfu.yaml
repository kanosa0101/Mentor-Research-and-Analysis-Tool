bio_raw: 马殿富，男，1960年生，教授，博士生导师。2001年至2011年任计算机学院院长。现任软件开发环境国家重点实验室副主任，教育部计算机类教学指导委员会秘书长，计算机学会教育工委主任，中国信标委SOA分委员会副组长，计算机工程教育专业认证专家。多年一直从事数理逻辑和软件工程建模与形式化方法等教学。2005年获国家教学一等奖，2014年获得国家教学二等奖。
  一直从事服务计算及中间件、非结构化数据组织与处理以及安全关键系统方面的研究工作。提出了面向服务的描述语言及Web服务运行平台的形式化验证方法，并带领团队开发了思讯Web服务中间件平台，成为四方国件联盟-国产中间件参考实现平台的重要组成。2006年起，围绕实时系统、以AADL语言为基础，提出了安全关键实时系统设计、分析、验证及自动代码生成方法。2010年开展非结构化数据组织与处理研究。现在主要从事安全关键系统研究，开展A级安全关键软件建模与验证机器软件开发与验证环境等研究。先后主持了973重大基础研究项目二级课题、国家863计划重点项目，核高基重大专项项目以及科技部科技平台、国防科工委、总装预研基金、自然基金等项目。近年来在国际学术会议及国内核心刊物发表论文40余篇。
