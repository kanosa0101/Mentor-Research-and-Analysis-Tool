bio_raw: '唐文忠，男，1968年生，博士，研究员，博士生导师。现任国家科技资源共享服务工程技术研究中心主任、中国航空工程科技发展战略研究院秘书长、中关村智慧城市产业与技术创新战略联盟常务理事长。

  主要从事人工智能、网络与信息安全、物联网、智慧城市等方向的研究工作。

  近年来主持和完成国家重大和重点科研项目十余项，包括：国家重点研发计划：电动汽车智能辅助驾驶关键技术研究与产品开发、城市信息模型（CIM）平台关键技术研究与示范、中小学科学教育智能导师关键技术研究及应用；自然基金面上项目：叶轮机械颤振稳定性的不确定性预测方法研究、面向生物医学领域领域的多模态学术图像不端检测技术研究；以及激光除草机器人、车联网数据分析平台、基于物联网的安全驾驶督导系统关键技术研究等。

  联系电话：010-82315082 办公室：新主楼D1013

  Email：tangwenzhong@buaa.edu.cn'
