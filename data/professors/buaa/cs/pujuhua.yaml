bio_raw: '蒲菊华，博士，教授，博士生导师，北京市科技新星，国家智慧城市标准总体组成员，中国计算机学会计算机教育专业委员会执行委员，国家一流本科课程主讲教师，北京市优秀教学团队核心成员。2005年博士毕业于北京航空航天大学计算机学院，后加入先进计算机应用技术教育部工程研究中心工作；2004年4月至7月在香港科技大学访问研究，2011年1月至2012年1月在美国佐治亚理工大学访问研究。长期从事智慧城市理论方法、关键技术和应用的研究，曾获教育部技术发明一等奖(数据活化的关键技术及其智慧城市应用），北京市科技进步二等奖(大型分布式多媒体会议系统)和三等奖(南水北调中线干线工程建设管理门户系统)，北京市教学成果一等奖等奖励。目前的主要研究领域为智慧城市、城市计算和大数据分析。与佐治亚理工大学、南加州大学、苏黎世联邦理工学院、阿卜杜拉国王科技大学、香港科技大学、香港城市大学等境外知名大学都有良好的合作关系。

  近年来，作为项目负责人和执行负责人，蒲菊华博士先后主持实施了国家自然科学基金项目2项、国家重点研发计划课题1项/子课题3项、863计划重点课题1项、“十一五”国家科技支撑计划重大项目1项，以及博士点创新基金、北京市市政科技项目、深圳市创新基金等省部级项目8项。并承担过包括南水北调中线干线工程建设管理系统、香港地下铁弱电系统、香港边境围网安防系统、人民大会堂电子会议系统等重大横向科研项目的研究。参与制定智慧城市国家标准5项，发表学术论文60余篇，授权国家发明专利近40项，并有多项获得转化。

  在教学与人才培养方面，蒲菊华博士讲授本科生核心课《数据结构与程序设计》和《计算机导论与伦理学》、研究生素养课《计算机职业素养践》、以及留学生课程《Data Structure》，是士谔书院学业导师。毕业生去向包括微软、360、百度、字节跳动、滴滴大数据实验室、网易等国内外知名企业、以及中信/农行/建行等银行系统工作，并有多名毕业生赴美国、加拿大和澳大利亚等知名大学深造。

  联系邮箱：pujh@buaa.edu.cn。

  联系电话：13910521181（微信同号）。

  办公地点：新主楼G944。'
