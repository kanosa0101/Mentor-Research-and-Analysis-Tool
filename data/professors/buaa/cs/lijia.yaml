bio_raw: '李甲，博士，教授，博士生导师，中国民主同盟盟员，

  国家高层次青年人才

  。2005年7月于清华大学电子工程系取得学士学位，2011年1月于中国科学院计算技术研究所取得博士学位。此后，曾于新加坡南洋理工大学、北京大学、盛大公司创新院等机构从事科研工作。2014年6月被聘为北京航空航天大学计算机学院副教授，现任北京航空航天大学计算机学院教授。目前是IEEE/CCF/CIE/ACM高级会员和IET会员，担任第十二届民盟中央青年工作委员会委员、中国计算机学会的计算机视觉专委委员和虚拟现实与可视化技术专委委员，以及中国图象图形学学会的视觉大数据专委委员和交通视频专委委员，兼任/曾任IET
  CV、IJMDEM、FCS等国际期刊的编委或青年编委。

  研究领域包括计算机视觉与人工智能技术，主要研究兴趣为视觉内容感知理解与生成。先后承担国家自然科学基金重点项目、面上项目、国家863计划课题等纵向与横向项目20余项。在IEEE
  TPAMI、IJCV等著名国际期刊以及ICCV、CVPR等著名国际会议发表论文90余篇，包括中国计算机学会推荐的A类论文40余篇；中国美国专利申请受理70余项（美国10项），授权40余项（美国9项）；出版Springer英文学术专著1部（第一作者）。

  2017年入选北京市科技新星计划，2016年入选“北航青年拔尖人才支持计划”，2012年分别获评为北京市优秀博士学位论文和中国科学院优秀博士学位论文；获2018年中国电子学会自然科学二等奖、2010年度教育部科学技术进步奖一等奖、CVMJ
  2019最佳论文提名奖、IEEE国际会议BigMM 2015唯一最佳论文奖、大规模互联网图像识别国际挑战赛WebVision 2018冠军、艺术品图像细粒度识别挑战赛FGVC8-iMet冠军等科技奖励。

  致力于培养高质量科研人才，近三年（2018-2021）共培养博士毕业生和硕士毕业生18人，其中2人获北京市优秀毕业生，8人获北航优秀毕业生，4人获北航优秀硕士学位论文，2人获校级工程硕士实习实践优秀成果奖。另有多名毕业生获国家奖学金、华为奖学金、国睿奖学金等奖励。

