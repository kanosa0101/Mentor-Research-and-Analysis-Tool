bio_raw: '胡海苗 北航计算机学院 研究员、博导，2012年获北航计算机应用技术专业工学博士学位，获2013年度“北京市优秀博士学位论文”奖。2008年至2009年在美国华盛顿大学（University
  of Washington）电子工程系访问。

  研究工作涉及智能感知、视频分析与理解等方面，具体包括：视频清晰成像、目标检测和目标属性识别等。主持了国家自然基金面上项目（2013年、2017年）、国家重点研发计划等项目，参与了国家重点研发计划项目（项目管理办公室主任）、国家973计划项目（973项目秘书）、国家863计划项目等。

  近年来，已在IEEE TIP、TCSVT、TMM、TGRS等重要国际期刊发表论文50余篇，授权美国和中国授权发明专利24项，获2011年度国家技术发明二等奖、2019年度国家科技进步二等奖，以及省部级奖励及荣誉2项。

  中国计算机学会多媒体专委会副秘书长，Frontiers of Computer Science等SCI期刊（青年）编委（AE）。

  承担了《数字图像工程基础》和《视频清晰成像技术》等多门本科生课程教学任务；在研究生指导过程中强调对学生知识与能力的培养、研究与应用的结合。已指导/协助指导毕业博士生、硕士生30余人（多人获校级优秀硕士论文、国家奖学金）。

