bio_raw: '汪淼，教授，博士生导师，2011年于西安电子科技大学获学士学位，2016年于清华大学计算机系获博士学位

  （导师：胡事民院士）

  ，2016-2018年于清华大学从事博士后研究，2018年起于北航虚拟现实技术与系统全国（国家）重点实验室从事计算机图形学、虚拟/增强现实等方面的教学与科研工作。主持国家自然科学基金面上、青年项目，参与国家自然科学基金重点项目、国际（地区）合作与交流项目、北京市科技计划新一代信息通信技术创新专项等。发表学术论文50余篇，获IEEE
  VR 2025最佳论文奖、CAD/Graphics 2023最佳论文奖、CVMJ年度最佳论文提名等。曾获国家科技进步二等奖（排名9）、中国图象图形学学会高等教育教学成果激励计划特等类（排名2）。入选教育部“CJ学者奖励计划”青年学者、中国科协青年人才托举工程、

  小米青年学者、北航青年拔尖人才

  。担任Multimedia Tools and Applications、Computer Animation and Virtual Worlds、《图学学报》期刊编委、

  Fundamental Research期刊青年编委

  ，ChinaVR 2024程序共同主席，IEEE VR、ISMAR、PG、CVM等国际会议程序委员。兼任第四届全国计算机科学技术名词委虚拟现实与人机交互名词分委员会秘书长、中国计算机学会虚拟现实与可视化技术专委会秘书长、秀湖会议AC学术秘书、中国仿真学会虚拟技术及应用专委会副主任、中国图学学会国际联络工委会秘书长、北京图象图形学学会理事等。

  具体研究内容请访问英文主页：

  http://miaowang.me

  。'
