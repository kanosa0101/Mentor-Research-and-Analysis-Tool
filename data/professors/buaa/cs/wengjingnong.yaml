bio_raw: '翁敬农，博士，研究员、籍贯，浙江。1988年毕业于北京航空航天大学计算机专业，本科毕业留校工作至今。曾任本科生辅导员、研究生指导主任、党总支副书记，软件学院副院长，校图书馆副馆长等。现任北京航空航天大学国际合作部部长、港澳台办公室主任、国际学院院长。兼任中国高等教育学会理事、外国留学生教育管理分会监事长。

  已主持或作为主要负责人完成各类科研项目20多项

  ，曾获部级科技进步二等奖2次

  。拥有自主创新的于面向“数字中国”的海量多源空间信息快速可视化软件平台，在

  海量多源空间信息的组织、快速可视化、空间运动对象管理

  方面取得创新成果，在《中国科学》、《科学通报》及重要国际会议上发表论文100多篇，获批软件著作权14项、授权专利1项。曾主讲《计算机体系结构》、《地理信息系统和数字地球》等课程，编著教材3本。曾获北京校教学成果奖

  二等奖2次、

  北航

  奖教金一等奖3次；曾连续4次获

  本科生课外科技活动

  优秀指导教师；5次

  获硕士论文

  优秀指导教师。

  2008年12月接受中国产经新闻报告的

  专访“翁敬农—做有准备的创新者

  ”。曾担任全国GIS论坛、数字中国高峰论坛的常务委员，是

  中国地理信息科学与技术知识体

  课题研究组的主要发起人。从1999年开始一直是科技部中小企业创新基金的评审专家，2010年

  GeoInfomatics

  国际会议

  程序委员会委员，2012年起任北京文创基金项目评审专家。

  曾出访数十个国家开展学术交流，作为中国政府代表团成员，自2013年始，在联合国外层空间委员会科技小组会及联合国外空委大会作报告10余次。2014年在世界宇航联大会上策划并举办首次国际空间教育论坛，任会议主席。2015年策划在联合国外空委总部举办“让空间探索插上艺术的翅膀”绘画展。兼任联合国附属空间科技教育亚太区域中心（中国）执行主任、亚太空间合作组织中国中心主任，是全球卫星导航系统国际委员会大会（ICG）工作组C中方负责人。

  主要研究方向：数字地球、地理信息系统、数据挖掘、来华留学教育等。'
