bio_raw: 刘轶，男，博士，教授，计算机学院中德联合软件研究所所长。毕业于西安交通大学计算机系，2000年获计算机系统结构专业博士学位。 主要研究方向：计算机系统结构及高性能计算、计算机网络。近年来先后主持国家自然科学基金项目“面向多核处理器的硬软件协作Transactional
  Memory系统结构”、国家863计划重大/重点项目“高效能计算机系统研制及关键技术研究”、“云计算关键技术及系统”、“新一代互联网技术综合实验环境”、及企业合作项目“高端容错服务器关键技术”、“面向电力应用的实时数据库系统软件”等。在对外学术交流方面，作为中方研究小组负责人与德国Fraunhofer协会下属研究所进行合作研究，双方进行了多次学术交流和人员互访。在国内外期刊及国际会议发表论文多篇，获得授权发明专利十余项，获北京市科技进步一等奖1项。
