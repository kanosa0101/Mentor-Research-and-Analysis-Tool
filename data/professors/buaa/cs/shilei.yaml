bio_raw: 时磊，现任北京航空航天大学计算机学院新技术研究所、大数据科学与脑机智能高精尖创新中心教授。2003、2008年毕业于清华大学计算机系，获工学学士、博士学位，其博士学位论文获清华大学计算机系优秀博士论文。曾任中科院软件所计算机科学国家重点实验室研究员(主任助理)、IBM中国研究院可视分析组研究经理、清华大学计算机系研究生团总支书记。博士及工作期间曾获全额资助在美国圣母大学、纽约大学、亚利桑那州立大学、IBM华生研究院、AT&T香农实验室、Yahoo实验室、国立台湾清华大学、微软亚洲研究院等著名研究机构学术访问十余次。主要研究方向为数据挖掘、数据可视化、人工智能。曾在TVCG,
  VIS, CHI, TKDE, KDD, VLDB, ICML, ICLR, NeurIPS, SIGCOMM, Infocom, TC, PIEEE等国际顶尖会议及期刊上发表百余篇研究论文，出版/参编图书3部。Google
  Scholar论文总引用4500余次，50 篇主要论文 SCI 引用上千次，包括美国科学院/工程院院士、欧洲/德国科学院院士、多篇 Nature 子刊正面评价。大数据开放平台得到全球
  76 个国家超 20 万次高端学者访问，包括图灵奖得主、ACM Fellow 等近百位学者邮件反馈，被诺奖热门候选人 Nature Reviews Materials
  论文列为基于大模型的材料合成挖掘基准数据代表。担任 KDD、VIS等A类会议 SPC/PC、SCI 期刊编委、Nature 子刊独立审稿人，亚太、中国可视化大会(短)论文主席，四次荣获IEEE可视分析大会挑战赛单项冠军及IBM研究部门可视分析贡献奖。主持6个国家重点、重大项目课题和国自然面上项目，主持/参与其他国家级、省部级、企业横向项目20余项（到账总经费逾千万元）。2016年度入选中国科学院青年创新促进会，2017年度入选中国科学院软件研究所杰出青年人才发展专项计划，2019年度入选北京航空航天大学青年拔尖人才支持计划，2022年获中国计算机学会技术发明一等奖(排名第二)。
