title: 副教授
email: xiechenhao@buaa.edu.cn
bio_raw: '解晨浩，男，博士，硕士生导师，毕业于美国休斯顿大学，电子电信工程专业。毕业后入职美国太平洋西北国家实验室高性能计算组，任博士后，获得突出博后奖。于2022年回国，现任北京航空航天大学计算机学院副教授。

  近年来从事计算机体系结构、高性能计算、移动通信系统方面研究。具体研究工作包括：基于图形处理器的体系结构优化、特有算法的软硬协同设计、异构加速器的评估与研究等。研究成果发表在HPCA、ISCA、ASPLOS、MICRO、TC、TMC等计算机领域顶级会议和期刊上。基于研究设计的智能动态协同虚拟现实渲染框架，开发了在新一代虚拟现实系统。设计的高效可扩展稀疏线性代数计算算法及内核被应用到了下一代分布式电网检测系统的研发中。

  近期主要研究内容包括但不限于扩展现实技术的体系结构优化研究、新一代异构超算的性能评估、高性能计算应用的软硬件协调优化研究。研究工作着眼于前沿芯片技术与新兴应用（如扩展现实应用，人工智能应用、高性能计算底层算法等），将硬件设计与应用程序特性有机结合以提升性能与响应速度，提高用户体验。'
