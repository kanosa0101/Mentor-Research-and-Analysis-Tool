bio_raw: '夏春和，教授，博士生导师，网络技术北京市重点实验室主任。2006年9月至2007年8月曾在美国University of Michigan大学计算机系做访问学者。近年来一直从事计算机网络及网络安全方面的研究工作，参与了863项目“分布式虚拟战场环境”、
  重大自然科学基金“NSFCnet网络互联技术研究”、中国航空工业总公司“金航网络”设计与建设等项目的研究工作；主持包括国家自然科学基金课题、NSFC-通用技术基础研究联合基金重点项目、863项目、北京市科委、北京教委等近20项科研任务，在网络动态防御、网络攻防知识表达、逻辑网络管理等方面做过深入研究。1996年评为北京市青年骨干教师。曾获省部级科技2等奖5项，中国人工智能学会科技奖1项，在《IEEE
  Transactions on Dependable and Secure Computing》、《IEEE Transactions on Information
  Forensics and Security》、《IEEE Communications Letters》、《计算机学报》、《计算机研究与发展》等重要刊物和国际会议上发表学术论文80余篇，其中SCI/EI检索论文50余篇，申请国家发明专利20项，已授权专利18项。

  目前主要研究方向为网络与信息安全、计算机网络对抗、云计算等。承担国家自然科学基金、NSFC-通用技术基础研究联合基金重点项目以及北京市教委等多项课题的研究任务。'
