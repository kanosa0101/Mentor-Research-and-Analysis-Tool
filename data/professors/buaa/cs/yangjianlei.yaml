bio_raw: '杨建磊，教授，博士生导师，国家级青年人才。2014年毕业于清华大学计算机科学与技术系获工学博士学位，随后至2016年在美国匹兹堡大学智能进化实验室从事博士后研究。2024年入选国家级青年人才计划。在计算机学院计算新技术研究所、大数据科学与脑机智能高精尖创新中心以及费尔北京研究院工作至今。

  研究领域包括：智能计算系统、机器学习系统、大模型计算加速、高能效智能芯片、存内计算架构等。目前在

  DAC

  、

  ICCAD

  、

  KDD

  、

  ICCV

  、

  ECCV

  、

  CIKM

  、

  TCAD

  、

  TC

  、

  TVLSI

  、

  TNNLS

  等高水平国际学术会议或期刊上发表论文

  100

  余篇。主持国家自然科学基金项目

  2

  项、国家重点研发计划

  2

  项、北京市自然科学基金

  -

  小米联合基金项目

  1

  项、

  CCF-

  腾讯犀牛鸟基金、

  CCF-

  百度松果基金、

  CCF-

  蚂蚁绿色计算基金等，参与国家核高基项目以及华为技术合作项目等。

  曾获奖励与荣誉：先后获得

  IBM

  公司与

  IEEE/ACM

  组织举办的

  TAU 2011

  供电网络仿真竞赛第一名和

  TAU 2012

  瞬态仿真竞赛第二名。

  2013

  年荣获

  IEEE ICCD

  国际会议最佳论文奖。

  2015

  年荣获

  ACM GLSVLSI

  国际会议最佳论文提名奖。

  2017

  年荣获

  IEEE ICESS

  最佳论文奖。

  2020

  年荣获

  ACM SIGKDD

  最佳学生论文奖。

  2020

  年荣获北京航空航天大学优秀教学成果奖（排名

  2

  ）。

  2021

  年荣获教育部产学合作协同育人项目优秀案例。

  2022

  年荣获

  ACM NANOARCH

  杰出组织贡献奖。

  2022

  年获华为公司挑战性技术难题“火花奖”。

  2022

  年荣获北京市优秀本科毕设指导教师（指导本科生成功流片一款

  MIPS CPU

  处理器芯片）。

  2023

  年荣获教育部产学合作协同育人优秀成果奖。

  2024

  年荣获教育部产学合作协同育人项目十周年典型案例。

  2024

  年荣获北京市优秀本科团队毕设指导教师（团队负责人，

  9

  名本科生成功流片两款国产自主可控

  LoongArch CPU

  处理器芯片）。

  目前是

  IEEE

  高级会员、

  ACM

  会员、

  CCF

  高级会员和中国电子学会会员，担任

  CCF

  集成电路设计专委执行委员、

  CCF

  计算机体系结构专委执行委员、

  CCF

  容错计算专委执行委员、中国能源研究会电力传感和智能分析专业委员会委员。担任

  Integration the VLSI

  （

  Elsevier

  ）期刊编委。担任

  DAC

  、

  ICCAD

  、

  KDD

  、

  AAAI

  、

  ASP-DAC

  、

  GLSVLSI

  、

  AICAS

  等国际学术会议程序委员会委员，担任

  DAC 2022

  国际会议

  PIM Track Co-Chair

  ，担任

  GLSVLSI 2018/2019

  国际会议

  CAD Track Chair

  ，担任

  FPT 2019/2025

  国际会议

  Publication Chair

  ，担任

  NANOARCH 2021/2022

  国际会议

  Special Session Chair

  ，担任

  2022/2023

  年

  TNANO

  期刊

  Special Issue

  的

  Guest Editors

  ，并作为

  TCAD

  、

  TC

  、

  TCAS-I

  、

  TNNLS

  、

  JETC

  等国际学术期刊的审稿人。

  目前承担《计算机组成》（国家级一流本科课程）、《计算机系统基础》、《计算机科学方法论》、《智能计算体系结构》与《深度学习系统》等课程的教学工作。

  联系方式：

  jianlei@buaa.edu.cn

  个人主页：

  https://shi.buaa.edu.cn/jianlei/zh_CN/index.htm'
