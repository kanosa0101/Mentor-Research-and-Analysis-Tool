bio_raw: '吕卫锋，教授、博士生导师。 1998年博士毕业于北京航空航天大学计算机系。现任北京航空航天大学副校长，虚拟现实技术与系统国家实验室主任。主要从事大数据挖掘理论与智慧城市应用方面研究工作，目前是中国软件行业协会秘书长、副理事长，中国航空教育学会副理事长，中国高等教育学会工程专业学位委员会副理事长，入选国家高层次青年人才计划。

  近年来先后主持完成多项国家自然基金、科技创新2030等国家级重大研究与工程项目。开展面向城市海量多源数据挖掘与应用、多领域大型信息系统开发方法及理论等方面研究，在国内外学术刊物及学术会议上正式发表学术论文百余篇，国家发明专利20余项
  。在教学方面多年担任计算机学院本科生与研究生的主讲教师，现为北航计算机学院研究生开设“程序设计语言原理与实践”学位课程，为本科生开设“离散数学”学位课程。参与编写
  “程序设计语言原理”及“算法设计与分析数字课程” 高等学校计算机教材。获北京市高等教育教学成果奖两项， 国家科技发明二等奖1项，国家科技进步二等奖1项，省部级科学技术一等奖4项。

  主要研究方向：海量信息处理、大数据分析、城市计算、数据活化。'
