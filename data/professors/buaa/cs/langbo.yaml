bio_raw: '郎波，女，博士，教授，博士生导师。1987年开始就读于北京航空航天大学，先后获得学士、硕士和博士学位，现工作于北京航空航天大学软件开发环境国家重点实验室。2005.9-2006.9作为访问学者，在美国Argonne国家实验室/芝加哥大学从事网格安全研究。

  多年来一直从事基于机器学习的大数据分析与管理、信息安全等方向上的研究工作。主持多项国家自然科学基金、863计划、“核高基”重大专项子课题等国家项目，并承担863重点项目、973项目的研究任务。对多种深度学习与机器学习模型有深入研究，在可解释深度学习、图神经网络、图像事件识别、深度网络训练优化等方面，提出了多种方法与算法，发表多篇CVPR、AAAI等顶级会议与SCI论文；在非结构化数据管理方向，合作提出了一种非结构化数据的四面体数据模型；在安全大数据分析方向，开展了安全威胁情报分析、恶意网络流量数据包检测与分析、恶意代码检测等研究工作。发表论文百余篇，单篇论文被引用110余次。获航空部科技成果二等奖、教育部科技进步一等奖各一次，并获863先进工作者称号。教学上，主讲本科生的《数据库系统原理》、研究生的《数据科学基础》等课程，独立编著“十一五”、“十二五”国家级规划教材《Java语言程序设计》，该教材获得首届全国优秀教材二等奖。指导工学硕士、工程硕士百余人，博士生二十余人。'
