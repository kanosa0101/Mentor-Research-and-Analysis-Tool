bio_raw: 李帅，北京航空航天大学教授、博士生导师，国家级领军人才，现任计算机学院副院长、虚拟现实技术与系统全国重点实验室党支部书记、中国仿真学会理事、中国仿真学会医疗仿真专委会主任、中国图象图形学学会虚拟现实专委会副主任、中国解剖学会智慧解剖分会副主任、北京市知识产权战略咨询委员会委员。长期从事虚拟现实、智慧医疗、具身智能等方向的研究，相关成果在IEEE
  TPAMI、ACM SIGGRAPH、IEEE TVCG、IJCV、IEEE TIP、AAAI、ICCV、CVPR等国际期刊和会议发表论文140多篇，获授权发明专利40多项，主持国家自然基金委青年科学基金项目A类等项目；获2024年中国仿真学会创新技术一等奖、2024年山东省技术发明一等奖、2023年中创软件人才奖、2021年中国产学研合作创新成果一等奖、2020年中国电子学会科技进步一等奖、2020年山东省科技进步二等奖、2010年国家科技进步奖一等奖等；担任The
  Innovation Informatics、VCIBA、计算机辅助设计与图形学学报等多个期刊编委；多次入选北航优秀博士、硕士论文指导教师。
