bio_raw: 沈旭昆，男，1965年生，博士，教授，博士生导师。担任虚拟现实技术与系统国家重点实验室副主任，担任中国系统仿真学会常务理事，兼任虚拟技术应用专业委员会主任；担任中国图学会常务理事，兼任数字媒体专业委员会主任。
  沈旭昆教授长期从事虚拟现实与可视化研究工作，特别是在虚实融合的协同工作环境技术、三维物体快速建模、几何变形与动画、多相流体交互与仿真技术等方面开展了深入的研究工作。近五年发表学术论文40余篇，合著专著2本，申请受理并获批国家发明专利20余项。2004年获国家科技进步二等奖1项，2009年获国家级教学成果二等奖1项，2010年获国家科技进步一等奖1项，2013年获教育部科技发明一等奖1项。获批主持了多项国家/部委级科研课题，包括：主持了国家科技部863计划重点项目“虚实融合的协同工作环境技术与系统”，科技部科技条件平台项目“中国数字科技馆-博览馆”、教育部面向21世纪教育振兴行动计划“现代远程教育工程网上公共资源建设”、北京市自然科学基金“大规模粒子系统物理模型加速器体系结构研究”等项目，其中中国数字科技馆也已开通服务并获世界信息峰会大奖，获科技部和中国科协的表彰；虚实融合的协同工作环境技术正在面向国家重大工程开展深入应用研究。开展了深入国际交流与合作，与英国爱丁堡大学、惠普中国研究院、微软亚洲研究院开展了学生联合培养和合作研究。
