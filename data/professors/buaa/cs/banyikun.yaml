bio_raw: 班义琨，北京航空航天大学计算机学院教授、博士生导师，国家级青年人才。于伊利诺伊大学厄巴纳-香槟分校（UIUC）计算机系获得博士学位，曾分别在北京大学和武汉大学获得硕士与学士学位。研究方向涵盖强化学习、大语言模型与具身智能等前沿领域，在NeurIPS、ICLR、JMLR、KDD、WWW等顶级会议及期刊发表论文40余篇，其中以一作或通讯作者身份发表20余篇，一作/通讯身份获得oral、spotlight等，多篇工作被机器之心、新浪等多家媒体报道。曾在美国多家知名企业担任科研实习生，其研究成果集成于亚马逊云平台、美国Instacart、美国梅森诊所等，曾参与美国NSF、DARPA、USDA
  AFRI等多项科研项目，曾与MIT-IBM Watson AI Lab、Princeton、Meta AI、Amazon AWS等机构深度合作。曾获得UIUC杰出博士论文奖提名、Siebel博士奖学金、UIUC
  Conference Presentation Award、WAIC"云帆奖"杰出候选人、NeurIPS Scholar Award等；现担任CCF大数据专家委员会委员、国家青年基金项目负责人等。
