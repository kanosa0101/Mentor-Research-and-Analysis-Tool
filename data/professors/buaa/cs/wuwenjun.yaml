bio_raw: '北京航空航天大学教授、博导。主持国家自然基金重点、国家重点研发计划、国家863计划、国家

  973计划

  等20余项课题，发表学术论文200余篇，出版中英文专著两部。担任国家人工智能标准总体组副组长、新一代人工智能专家组副组长、国务院学位委员会智能科学与技术学科评议组专家。主要研究方向包括：

  群体智能

  、大规模在线教育、AI for Science。'
