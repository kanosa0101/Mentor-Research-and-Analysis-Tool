bio_raw: '陆峰，男，教授，博士生导师。获批国家级青年人才项目、首都高端领军人才项目等。现任北京航空航天大学计算机学院教授、虚拟现实技术与系统全国重点实验室学术带头人。

  于清华大学自动化系获学士、硕士学位，于日本东京大学获博士学位并担任特任助理教授。曾在松下新加坡实验室、微软亚洲研究院等从事科研工作。

  主要研究方向

  ：

  具身智能

  、

  共身智能

  ；涵盖视觉与多模态感知、人机交互、虚拟/增强现实、智能硬件、认知与心理计算等方面。

  长期研究目标：

  让AI能够“精准快速”理解场景，并与人类“自然高效”协作，构建通用具身智能和共身智能硬软件平台，在重要行业以及日常生活中应用。

  在TPAMI、IJCV、TIP、TVCG、NeurIPS、Siggraph、CVPR、ICCV、ECCV、AAAI、CHI、IEEE VR等顶级期刊会议发表文章近百篇，被引8000余次（截止2025），获得CCF-A类顶会CHI最佳论文奖、IEEE
  VR最佳论文提名奖等。主持国家自然科学基金、科技部重点研发课题、北京市自然基金重点在内的各类纵向项目二十余项，成果服务国家安全、民航、高铁、医疗、消费等重要行业和领域，自研系统应用于首都机场、空管中心、高铁路网、医疗机构等；承担华为、VIVO、商汤、歌尔等知名企业委托项目，成果应用于鸿蒙电脑等产品。担任国内多个学会及专委会职务。是IEEE等国际组织的Senior
  Member，持续担任CVPR、ICCV、ECCV、NeurIPS、ACMMM等国际顶会的领域主席（Area Chair）。

  联系方式：lufeng@buaa.edu.cn

  更多详情可访问“感知交互增强智能（共身智能）实验室”： http://phi-ai.buaa.edu.cn/'
