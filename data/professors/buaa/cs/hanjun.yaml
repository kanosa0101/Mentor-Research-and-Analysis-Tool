bio_raw: '韩军，男，博士，教授，博士生导师。1990年毕业于北京理工大学自动控制系，1999至2003年在澳大利亚邦德大学计算机学院学习工作，获博士学位。现为北京航空航天大学计算机学院计算机新技术研究所（ACT）、大数据科学与脑机智能高精尖创新中心教授，兼任北京市计算机新技术重点实验室副主任、复杂产品先进制造系统教育部工程中心网络支撑研究室主任等。作为项目和课题负责人，主持负责了多项国家自然科学基金面上项目、国家自然科学基金重点项目、核高基重大专项等国家重点研发计划项目；作为技术负责人或主要研究人员参与了多项973项目、863重点项目等的研究工作。

  主讲北京航空航天大学研究生精品课程《算法设计与分析》。

  主要研究方向：人工智能、网络综合优化、现代计算方法、服务计算等。'
