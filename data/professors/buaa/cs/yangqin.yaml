bio_raw: '杨钦，男，1968年06月生，江苏省镇江人；北京航空航天大学计算机学院教授，博士生导师；复杂关键软件环境全国重点实验室学科带头人。

  电话：

  13901028534 Email：yangqin@buaa.edu.cn

  教育背景

  1987年 - 1991年 北京航空航天大学，飞行器设计与应用力学系，飞行器环境控制与安全救生专业，本科，获学士学位；

  1991年 - 1994年 北京航空航天大学，机电工程系，计算机图形学专业，硕士研究生，获硕士学位；

  1996年 - 2001年 北京航空航天大学，计算机学院，计算机软件与理论专业，博士研究生，获博士学位。

  工作经历

  1994年 - 1996年 北京航空航天大学，计算机学院，助教；

  1996年 - 2000年 北京航空航天大学，计算机学院，讲师；

  2000年 - 2008年 北京航空航天大学，计算机学院，副教授

  2008年 - 至今 北京航空航天大学，计算机学院，教授/博导；

  教学与科研工作

  主讲北航计算机学院《计算机图形学》、《算法分析与设计》课程。

  主要研究方向为计算机图形学、计算几何、计算力学、人工智能等方向。长期从事复杂地质结构三维建模、地质过程数值模拟、地质数字孪生和大规模地质模型三维可视化、生成式人工智能地质建模等领域的理论和算法研究。主持、参与了国家重点研发计划、国家重大专项等三十余项科研项目。

  软件产品开发

  从90年代开始从事地质行业信息化工作，依托北航在计算机科学和工程力学领域的深厚基础，深入学习地球科学理论，开展学科交叉；面向国家重大需求，聚焦三维地质建模和力学仿真技术，对标国际领先的地质软件技术公司，带领团队开发出了“深探地学建模软件”和“透明地球云计算引擎”，广泛应用于石油勘探开发、基础地质调查、城市与大型基础设施规划建设、地震与地质灾害防治等领域。

  2020年以来，带领团队开展“透明地质数字孪生云计算系统”的研究，通过整合“深探地学建模软件”和“透明地球云计算引擎”两个软件产品，构建包括地理信息、地质模型、工程模型和设备模型的全生命周期动态数字孪生体，融合物联网技术、三维建模技术、力学模拟技术和人工智能技术，实现虚实映射和数据驱动，服务于智慧油田、智慧矿山、智慧城市、智慧工程以及地震地质灾害防治等领域，助力地质相关行业的数字化转型和智能化升级。

  目前重点研究方向为生成式人工智能地质大模型（地下世界模型）技术，用于实现三维地质模型自动建模和多物理场正反演一体化智能建模。

  专著和标准

  出版专著

  《计算机图形学》（清华大学出版社）；

  《限定Delaunay三角网格剖分技术》（科学出版社）；

  《地下水三维可视化系统开发与应用》（地质出版社）；

  《地质体三维建模方法与技术指南》（地质出版社）。

  参与标准制定

  《三维地质模型数据交换格式（Geo3DML）》，行业标准；

  《浙江省矿区（矿山）三维地质建模技术要求》，团体标准。

  社会服务

  中国计算机学会会员；

  中国地质学会会员；

  中国自然资源学会资源大数据与人工智能分会副会长；

  中国石油学会石油物探专业委员会委员；

  中国石油和化工自动化应用协会人工智能分会学术委员；

  中国测绘学会软件与信息技术服务工作委员会委员；

  浙江省矿业联合会矿山数字化专业委员会副主任；

  浙江省矿业联合会矿产资源保护与监督专业委员会副主任；

  重大地质事件资源环境效应重庆市重点实验室学术委员会委员。'
