bio_raw: 梁晓辉，北京航空航天大学计算机学院教授，博士生导师，纽约州立大学石溪分校高级访问学者。现为计算机应用工程系主任，工作于虚拟现实技术与系统国家重点实验室。兼职主要包括北京图像图形学会副秘书长，中国图象图形学学会虚拟现实与可视化技术专业委员会委员，中国计算机学会人机交互专业委员会委员。
  长期从事虚拟现实方面的研究，主要研究方向为移动终端三维图形处理、基于气象数据的天气现象建模方法等。主持国家自然科学基金、国家863计划和北京市自然科学基金项目20余项，荣获国家科技进步一等奖1项，国家科技进步二等奖1项，省部级技术发明一等奖1项、科学技术进步一等奖2项，入选教育部2007年度“新世纪优秀人才支持计划”。
