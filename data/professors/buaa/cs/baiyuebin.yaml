bio_raw: '白跃彬，男，博士，教授，博士生导师，毕业于西安交通大学计算机系，获计算机系统结构专业博士学位。

  近年来带领分布式系统与网络研究组开展了新型智能计算系统、云操作系统性能优化、安全攸关系统与实时嵌入式操作系统、高动态复杂网络系统等方面的研究工作，主持并完成国家自然科学基金项目、863计划课题、973子项目、预研项目等30余项研究课题。其中承担的国家自然科学基金项目包括：“个人化流动科研环境关键问题研究”、“移动自组织网络中可靠服务确保方法研究”、“基于众核分核模型的VMM资源管理与调度方法研究”、“高动态无人机编队网络自适应路由方法研究”；已在重要国际会议上和学术刊物上发表论文120余篇；获授权发明专利33项、日本发明专利1项。主持研发的一款自主可控实时嵌入式操作系统已应用于重点型号；主持研发的大规模CPE管控系统已应用于电信运营商核心网络中。

  在教学及学生培养方面，主讲本科生专业课程《计算机体系结构》、《实时嵌入式应用系统》、《无线网络系统》；研究生专业课程《嵌入式系统》、《嵌入式软件系统》；出版教材《计算机系统结构---量化研究方法》（第四版）（译著）、《无线传感器网络》两部；目前已培养研究生50余名。

  目前正在承担国家自然科学基金项目、预研重点项目等多个研究项目。近期主要研究内容包括新型AI加速器结构及智能计算系统、云操作系统多粒度性能优化、面向安全攸关系统的实时嵌入式操作系统。'
