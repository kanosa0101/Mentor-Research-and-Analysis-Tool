bio_raw: 李舟军，男，1963年9月生，博士，教授，博士生导师。现任北京航空航天大学计算机学院信息安全系主任，智能信息处理研究所副所长、信息安全与智能信息处理研究室主任。现为国务院学位委员会网络空间安全学科评议组成员，中国网络空间安全协会常务理事，网络空间安全协会竞评演练工委会副主委，《信息安全学报》、《网络与信息安全学报》、《计算机科学》等期刊编委。IEEE、ACM、AAAI会员，中国计算机学会高级会员，数据库、计算机安全、理论计算机科学等专业委员会委员。曾任国际期刊《International
  Journal of Data Mining and Bioinformatics》和《International Journal of Granular Computing,
  Rough Sets and Intelligent Systems》编委，担任SDM、CIKM、BIBM、PRICAI、WAIM、GrC、NPC等10 多个国际学术会议的程序委员会委员。
  长期从事数据挖掘、文本挖掘、社交网络分析、信息检索、信息抽取、个性化推荐、人工智能与自然语言处理、自动问答与智能客服、网络与信息安全等领域的科研工作，取得了一系列具有国际先进水平的重要研究成果，在包括IEEE
  Transactions on Knowledge and Data Engineering、ACM Transactions on Intelligent Systems
  and Technology、IEEE Transactions on Cybernetics、IEEE Transactions on Multimedia、TOIS、BMC
  Genomics、BMC Bioinformatics、Information Sciences、Knowledge and Information Systems、Neurocomputing、Information
  Processing & Management、Journal of World Wide Web、The Computer Journal等顶级或重要SCI期刊，以及CCF
  A类会议AAAI、ACL、KDD、IJCAI、SIGIR、MM，CCF B类会议WSDM、CIKM、SDM、COLING、DASFAA、BIBM等发表200余篇学术论文，获ECIR
  2010 最佳论文奖，相关成果得到国际著名学者的好评。先后承担了包括国家自然科学基金重点和面上项目、国家863计划项目、国家242信息安全计划项目等20多个课题。合著出版两部教材，获部委级科技成果二、三等奖各一项。2000
  年获国内计算机软件界具重要影响的“中创软件人才奖”，2003 年获军队院校育才银奖，2004 年获全国优秀博士学位论文提名。已经培养毕业博士生30多人，硕士研究生100多人。
  目前领导的信息安全与智能信息处理研究室的主要研究方向为：数据挖掘与社交网络分析，人工智能与深度学习，自然语言处理、知识图谱构建及其应用（自动问答、社区问答、聊天机器人、自动客服等），网络与信息安全技术（软件安全漏洞挖掘与分析，安全协议分析，移动应用安全，工控系统安全等）。
