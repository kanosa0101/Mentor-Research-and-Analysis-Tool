bio_raw: '艾明晶，女，博士，教授。北京航空航天大学计算机学院国家级实验教学示范中心支部书记兼副主任，虚拟现实技术与系统国家重点实验室研究人员。兼任中国虚拟现实与可视化产业技术创新战略联盟（CVRVT）公共安全专业委员会秘书长，北京市高等教育学会计算机教育研究会第九届理事会常务理事，信息技术新工科产学研联盟-虚拟仿真实验资源建设工作委员会常务理事，全国高等院校计算机基础教育研究会实验教学专业委员会秘书长、在线教育专业委员会常务委员、理工专业委员会委员。

  主要研究方向为虚拟现实、图像处理、视频编码和嵌入式系统等。近年来主持并完成国家重要科研项目多项，包括国家863计划课题、总装预研项目、VR国家重点实验室自主课题等；参与完成国家863计划项目课题和国家自然科学基金项目多项。作为项目骨干，目前正在参与国家重点研发计划“

  城市空间采集、建模与虚实融合动态仿真系统

  ”项目和国家自然基金项目“

  基于虚实场景融合的跨相机目标重识别与轨迹关联技术

  ”；主持VR实验室自主课题“

  基于虚实场景融合的多目标跟踪与城市空间典型自然现象仿真

  ”。在国内学术期刊和国际学术会议上发表学术论文30余篇，发表教学论文10余篇。授权发明专利7项，申请发明专利9项，获得软件著作权3项。

  校精品课程、北航学院信息大类核心课程《大学计算机基础》课程负责人之一。主讲《大学计算机基础》和研究生课程《数字系统设计》。出版教材和译著共9部，其中《EDA设计实验教程》为“十一五”国家级规划教材。

  先后获得学校成飞奖教金、西飞奖教金、Nokia－北航奖教金、优秀班主任一等奖等奖励；曾获得学校优秀党支部书记、学校保密工作先进个人、本科教学迎评创优先进个人奖等荣誉称号；先后获得北航优秀教学成果奖一等奖2项、二等奖2项、三等奖6项。参与的项目“面向计算机专业核心能力培养的在线实验体系的研究与实践”2018年获得北京市优秀教学成果奖一等奖；获得北航2017年度、2019年度教学优秀奖二等奖。'
