bio_raw: '王静远，北航计算机学院教授、兼任北航经管学院兼聘教授，博士生导师。担任北航“数据智能研究中心”副主任、北京城市实验室副主任。毕业于清华大学计算机系，获工学博士学位。长期从事人工智能与大数据技术在智慧城市、交通管理、公共卫生等领域的应用基础研究，研究兴趣包括时空数据挖掘、可解释人工智能、城市计算与智慧城市等。在信息科学、管理科学、城市科学的交叉领域形成了一系列理论与实践应用并重、跨学科特色鲜明的科研成果。

  主持国家重点研发计划课题1项、国家自然科学基金国际(地区)合作与交流项目1项、重大研究计划项目培育项目1项、面上项目2项、青年基金项目1项，参与国家重点研发计划、国家自然基金重点项目、863“智慧城市”主题项目等国家和省部级级科研项目十余项。出版学术专著2部，发表学术论文50余篇，其中
  CCF A类期刊会议论文20余篇，ESI高引用论文1篇，包括

  IEEE TKDE

  、

  IEEE TMC

  、

  ACM TOIS

  、

  ACM KDD

  、

  AAAI

  、

  ACM Ubicomp

  、

  IEEE Infocom

  等数据挖掘与人工智能领域的顶级期刊和会议，2次获得国际会议的最佳论文奖。

  担任中国计算机学会高级会员、中国计算机学会杰出演讲者，在中国计算机学会、中国自动化学会、中国人工智能学会、中国管理科学与工程学会、中国管理现代化研究会、中国城市科学研究会等多个一级学会担任大数据与人工智能相关专委会的委员和常务理事等。担任ACM
  KDD China、ACM SIGSPATIAL China的执委会委员。担任中国疾病预防控制中心特聘专家、首都公共卫生高端智库理事、北京市应急领域青年学科带头人。曾获“北京市抗击新冠肺炎疫情先进个人”等荣誉称号，所带领的团队获评“全国科技系统抗击新冠肺炎疫情先进集体”，入选WDGC“全球前沿科技青年科学家”。担任

  Frontiers of Computer Science

  期刊Managing Editor、

  ACM Transactions on Intelligent Systems and Technology

  期刊编委、

  IET Smart Cities

  期刊创刊编委，常态化担任

  KDD

  、

  ICDM

  、

  CIKM

  、

  AAAI

  、

  IJCAI

  等多个CCF A/B类会议的程序委员会委员。

  申请国内外发明专利 20 余项，目前授权中国专利18项和美国专利3项。技术成果被中国移动、中国商飞、公安部第一研究所、华为、阿里云、京东城市、科大讯飞等企事业单位实际应用。所开发的LibCity时空数据开源软件在GitHub平台上获得包括美国麻省理工学院（MIT）、加州大学伯克利分校（UC
  Berkeley）、华盛顿大学内的50余个国内外研究机构和企业的广泛应用。在新冠肺炎疫情期间，牵头组建“北航新冠肺炎疫情大数据分析团队”，支撑了国务院联防联控机制、国家卫健委、科技部、外交部、北京市防控办、北京市疾控中心、北京冬奥组委等部门的疫情防控决策工作，受到《科技日报》、《中国教育报》、《光明日报》的报道。

  讲授《数据挖掘导论》、《计算机科学方法论》、《计算机导论与伦理学》等课程。作为指导老师带领学生获得全国“挑战杯”竞赛二等奖1项、北京市“挑战杯”竞赛特等奖1项、二等奖2项。指导的研究生获得“全国工信系统抗疫先进个人”、北京市优秀研究生毕业生、北航“十佳研究生”等。毕业生去向包括航天科工、微软亚洲研究院、高德地图、百度大数据实验室、阿里云、蚂蚁金服等国内外知名企业，并有多名毕业生赴康奈尔、卡耐基梅隆、宾夕法尼亚大学、南加州大学等美国知名大学深造。

  课题组主页参见:

  http://www.bigscity.com'
