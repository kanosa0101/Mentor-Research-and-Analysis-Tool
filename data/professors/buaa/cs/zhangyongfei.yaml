bio_raw: '张永飞

  ：男，博士，北航计算机学院教授，博士生导师，入选国家级青年人才计划。先后于2005年和2011年于北航获学士和博士学位，2001年留校任教。2007-2009年、2018-2019年分别在美国密苏里大学哥伦比亚分校和南加州大学访问。

  科研工作：

  主要从事人工智能、计算机视觉、具身智能等方面科研与应用工作，研究方向包括视觉智能分析理解、跨时空目标关联、视觉生成与质量评价、多模态视觉感知与知识图谱推理及其应用等。主持新一代人工智能重大项目课题、国家自然科学基金面上项目（2012/2017/2020/2024）、航天基金等基础研究项目，中国科协战略咨询项目和海康威视、中国电科、中船重工、中石油等合作研究/应用项目；参与国家重点研发计划（子课题负责人）、国家自然科学基金重点项目（子课题负责人）、973/863计划（技术骨干）、某型号研制（主任设计师）、浙江省“尖兵”计划项目（课题负责人）等多项科研项目任务。已在CVPR、AAAI、ACL和T-CVST、T-MM等领域重要国际期刊及学术会议上发表论文80余篇，申请发明专利近30项（已授权20余项），登记软件著作权10项，转让/许可专利或软件著作权10项，获省部级科技奖励2项。

  人才培养：

  讲授《人工智能导论》《信号与系统》《机器学习》等核心课程，具体负责北航“人工智能”微专业建设、“人工智能导论”通识课程建设等，参与编著教材专著4部，主持和参与教育教学项目10余项（校级重大1项、重点3项等），在《高等工程教育研究》、《计算机教育》发表教育教学论文10余篇，获中国人工智能学会教学成果激励计划一类成果（一等奖）（序2）、教育部虚拟教研室典型教学方法（序3）、校级教学成果特等奖1项（序2）、一等奖2项（序1、序2），“凡舟”奖教金1项（序1）。注重研究生知识、能力和素质全面培养，已指导或协助指导40余位博、硕士研究生，多人次获国家奖学金、北京市优秀毕业生等。指导本科生参加科技竞赛，获全国挑战杯一等奖、首都挑战杯特等奖、并多次在“互联网+”“冯如杯”等获奖。为人大附中等开设科研课堂，指导北京市英才计划学生，获丘成桐中学科学奖全国二等奖等。毕业生去向包括北航、重大等高校，航天科工、中国电科、百度、腾讯、阿里、亚马逊等国内外知名企业。

  学术服务：

  IEEE/CCF/CSIG高级会员，ACM/CAAI/CAA会员；中国科协/中国图象图形学学会图像数据生成与应用决策咨询专家团队首席专家、中国图象图形学报等期刊（青年）编委；曾任中国图象图形学学会咨询与评议工委会秘书长；中国计算机学会多媒体技术、计算机视觉、教育等专委会执行委员和科普工委会委员，中国图象图形学学会视觉大数据、多媒体、视频图像与安全等专委会和咨询与评议、青年等工委会委员，中国人工智能学会模式识别专委会和教育工委会委员，中国自动化学会模式识别与机器智能专委会委员等；多次组织科普活动、主讲科普报告，受聘科普中国专家，入选中国科协全国科普日优秀活动，获中国图象图形学学会科普先进工作者；多次担任CVPR、ICCV、AAAI、NeurIPS、MM等CCF
  A类会议（技术）程序委员会委员或审稿人，是T-PAMI、IJCV、T-IP、T-MM、T-CSVT等国际期刊和中国科学技术大学学报、西安交通大学学报、北航学报、电子学报、电子科大学报等国内期刊审稿人。

  联系方式

  ：新主楼G811；010-82314108； yfzhang@buaa.edu.cn。

  更多信息请参见个人主页：

  http://teacher.buaa.edu.cn/yfzhang/'
