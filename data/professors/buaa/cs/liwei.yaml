bio_raw: 李未，北京航空航天大学计算机学院教授，博士生导师，中国科学院院士，国务院学位委员会委员，第十、十一届全国政协委员，科技部专家顾问委员会委员，教育部咨询委员会委员，教育部计算机教学指导委员会主任，电子学会副理事长。
  李未院士是我国著名的计算机科学家。1943年6月8日出生，1966年北京大学数学与力学系毕业，1983年获英国爱丁堡大学计算机科学博士学位。2002-2009年任北京航空航天大学校长。李未院士在实用并发语言操作语义、形式理论序列和修正演算等方面取得了开创性研究成果。他对科学理论的进化、软件及其功能描述中的缺陷和程序错误的定位和修复进行了系统深入的研究，提出了关于版本序列的理论，建立了对错误进行修正的形式演算系统（R-演算）；设计了描述软件开发方法的形式语言，提出了可信软件开发方法的基本理论；在2007年和2010年分别出版了中英文专著《数理逻辑——基本原理与形式演算》。李未院士在我国率先倡导进行海量信息计算的理论与方法研究，曾两次担任国家重点基础研究发展规划（973）项目的首席科学家。李未院士1995年获国家自然科学奖二等奖一项，1997年获何梁何利科技进步奖一项，2004年获国家级科技进步二等奖一项，2005年获国家教学成果一等奖一项。
  李未院士任《中国科学：信息科学》中英文版和《Frontiers of Computer Science in China》的主编。在国际、国内学术刊物和国际学术会议发表学术论文百余篇，中文专著2部，英文专著1部。86年起担任博士生导师，培养博士后8名、博士研究生52名和硕士生百余人。
