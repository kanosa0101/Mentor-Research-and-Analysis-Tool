bio_raw: '李恬霖，博士，副教授，国家级青年人才，2025 年毕业于新加坡南洋理工大学。长期深耕大模型安全、具身智能安全、太空智算等前沿交叉领域，先后在 ICML、ICLR等国际顶级学术会议与权威期刊发表高水平学术论文
  40 余篇，受聘担任 CSS、ASE、ICML 等 20 余个国际高水平期刊与顶级学术会议审稿专家。相关研究成果广受国际关注，先后获亚洲新闻台专题专访、新加坡《海峡时报》及新加坡人工智能中心专题报道，并多次受邀为新加坡网络安全局、通讯及新闻部等官方机构作专项学术技术汇报。先后获得新加坡
  AISG PhD Fellowship、德国 DAAD AInet Fellowship、国家优秀自费留学生奖学金，获评 NeurIPS、AISTATS 国际顶会杰出审稿人，在
  AISG 可信媒体全球挑战赛中于全球 258 支参赛队伍中斩获季军，荣获 15 万元现金奖励及 35 万元科研配套资助。

  课题组长期招收优秀学生参与科研实习并承担相关项目任务，表现优异者将优先推荐赴海外合作院校深造或访学。定向推荐院校包括新加坡南洋理工大学、新加坡管理大学、香港中文大学（深圳）、澳大利亚格里菲斯大学等海内外知名高校；同时，优秀学生亦可获推荐前往海外知名大厂实习。'
