bio_raw: '郝爱民，男，博士，教授，北航计算机科学与技术博士生导师、北京协和医学院生物医学工程博士生导师。2006年博士毕业于北航计算机学院。现任虚拟现实/增强现实技术及应用国家工程实验室（北航）主任，虚拟现实技术与系统全国重点实验室（北航）副主任，工信部电子科技委委员，北京市计算机学会副理事长，中国虚拟现实产业与技术创新平台常务副理事长，中国仿真学会理事，中国仿真学会医疗仿真专委会主任委员，中关村标准化协会虚拟现实与元宇宙分技术委员会主任委员，中关村虚拟现实产业园区科协主席，虚拟仿真实验教学创新联盟技术工作委员会副主任委员，中华医学会数字医学分会常务委员。获国家科技进步一等奖1项，国家科技进步二等奖1项，省部级一等奖4项，二等奖2项，全国创新争先奖1项，中国产学研合作创新成果奖和创新奖各1项，国家教学成果一等奖1项，北京市高等教育教学成果特等奖1项。

  主要从事虚拟现实中的建模理论与绘制方法的研究与应用工作。近年来主持国家自然科学基金重大项目“可交互人体器官数字模型及虚拟手术研究”课题、国家自然科学基金重点项目“基于多源数据的可视模型与环境构建及其动态仿真”、中国医学科学院创新单元“虚拟人体及虚拟手术技术”、科技部重点研发计划“面向残障人群的复杂环境模拟及行为监测分析综合平台”课题、国家863计划“3D物理引擎及高效绘制技术”课题、国家科技攻关奥运专项“2008年北京奥运会开闭幕式创意仿真平台及逼真演示环境开发”、国家863计划项目“通用网络游戏引擎及示范应用”、教育部“全国硕士研究生入学统一考试网上报名系统”等多个项目。开展复杂对象建模与逼真绘制、三维游戏中的几何和物理引擎，以及人体器官数字模型和虚拟手术等方面的研究及应用。获批国家发明专利40余项，合著专著3部，在国内外学术刊物和会议上发表包括TVCG、PG、TPAMI、AAAI、TIP、IJCV、VR、CVPR等在内的学术论文150余篇。入选2006年度教育部新世纪优秀人才支持计划。负责信息大类专业核心基础课“数据结构与程序设计”教学工作。

  招生要求：具有良好的数学基础和文字表达能力，三维游戏开发、图形学或虚拟现实相关经验及浓厚的个人兴趣，有协作精神和较好的沟通能力。 联系方式：Email: ham@buaa.edu.cn，ham_buaa@163.com'
