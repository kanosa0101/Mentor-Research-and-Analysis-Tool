bio_raw: '张莉，教授，博士生导师。北京航空航天大学校学术委员会会员，校教学指导委员会副主任、校务委员会委员。2002-2011年曾担任北京航空航天大学计算机学院教学副院长，现为软件学院副院长、计算机学院软件工程研究所所长，软件工程国家级一流专业建设点负责人，国家级教学团队主要成员。

  曾担任全国软件工程领域专业学位研究生教育协作组组长、教育部理工类计算机基础课程教学指导分委员会委员。现为教育部软件工程专业教学指导委员会委员，全国高等学校计算机教育研究会副理事长。中国工程教育计算机专业认证委员会委员。计算机学会教育专委会副主任、软件工程专委常委。北京市教学名师，北京市“三八”红旗奖章、中创软件人才奖、宝钢全国优秀教师奖获得者。曾入选北京市科技新星计划、教育部"新世纪优秀人才支持计划"等。多次获得国家教学成果、北京市教学成果奖、部级科技进步奖等奖励。

  主讲本科生必修课“编译技术”、导论课“走进软件”、研究生学位课“软件体系结构”和“经验软件工程（实证软件工程）”。首届国家级一流本科课程负责人，教育部编译课程虚拟教研室负责人，101计划编译原理课程负责人。

  主要研究领域：智能软件工程、需求工程、模型驱动的方法和低代码、软件体系结构和产品线、经验软件工程、智能制造过程建模和协同运行等。先后主持和参加了国家自然科学基金、国家973项目、国家科技计划项目、国际合作项目和企业应用项目。在国际会议、国内外刊物上发表学术论文近200篇，多次担任国际学术会议程序委员会主席和程序委员会委员。

  欢迎有志于从事智能化软件工程学术研究、肯吃苦、有上进心的同学报考。

  欢迎更多的青年教师、博士后加入软件工程研究所团队。

  联系电话：82317649，邮箱：lily@buaa.edu.cn

  个人网页：

  http://shi.buaa.edu.cn/06453/zh_CN/index.htm'
