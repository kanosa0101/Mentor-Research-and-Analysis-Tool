bio_raw: '李波， 1986年在重庆大学计算机系获学士学位，1989年在西安交通大学计算机系获硕士学位，1993年在北航计算机系获博士学位，2002年在美国University
  of Washington做高级访问学者。现为北航人工智能研究院常务副院长，任数字媒体北京市重点实验室主任，是国家重点研发计划项目“公共安全监控视频安全共享与特征分析关键技术研究”项目负责人、国家973计划项目“数字媒体理解的理论与方法研究”首席科学家，某边海防视频处理型号总设计师，入选国家“百千万人才工程”国家级人选并授予“有突出贡献中青年专家，享受国务院政府特殊津贴。在科教管理工作方面，1995年—1997年曾任北航计算机系副主任，2002年-2017年期间先后任北航研究生院副院长、科技研发处处长、发展规划处处长等职务。

  曾兼任国家重点研发计划“云计算和大数据”重点专项实施方案编制组专家，国家民口863计划“虚拟现实与数字媒体技术”主题专家组成员，国家某部卫星应用技术专业组成员、国家自然科学基金委员会第十二届、十三届信息科学部评审组专家、中国计算机学会（CCF）多媒体技术专委会主任；现任国务院学位委员会第七届和第八届学科评议组（软件工程组）成员兼秘书长、教育部人工智能科技创新专家组工作组副组长、国家某部人工智能应用基础技术专家组成员，以及CCF理事、中国图像图形学学会常务理事等学术职务。作为发起人和组织者，2018年举办了“首届人工智能本科专业研讨会”，在国内倡导并成立了人工智能本科专业。

  目前主要研究方向为：计算机视觉，机器学习，知识推理，嵌入式智能系统，人工智能应用；与海康威视等行业龙头企业、公安应用部门建立了联合实验室。作为负责人已完成型号、预研、863计划、973计划、国家自然科学基金等课题40余项；在本领域TPAMI、TIP、TMM、TGRS以及CVPR、AAAI、ACL等重要期刊和国际学术会议发表学术论文140余篇，有授权国内外发明专利100余件。

  多项研究成果处于国际先进水平，并在实际系统中规模化应用，应用成效突出、经济社会效益显著。其中研制的边海防视频处理传输系统已在哨所、口岸和重点地区广泛安装；无人机传输与视频分析系统已用于十余型无人机；遥感图像融合与分析系统已用于6个系列40余颗卫星；监控视频分析系统已在公安部门广泛应用。获国家技术发明二等奖1项、国家科技进步二等奖1项、省部级科技进步奖10项。

  E-mail：boli@buaa.edu.cn'
