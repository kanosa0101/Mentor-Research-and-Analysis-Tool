bio_raw: 许润华，博士，北京航空航天大学计算机学院教授。主要研究领域包括数据隐私安全增强技术、密态计算、人工智能隐私安全，在ACM CCS、TDSC、TOIT、SRDS、ICDCS、CLOUD、AISec等国内外会议期刊上累计发表学术论文25篇，撰写英文专著2章节，申请授权美国专利6项，获得ACM
  CCS 2023杰出论文奖、2023年度中国区块链优秀论文奖励、IEEE CLOUD 2022最佳论文奖。主持国家自然科学基金青年项目1项，承担北航青年人才发展“双一流”
  引导专项1项。曾作为核心骨干参与美国NSF项目2项，美国NSA/DHS网络安全卓越学术中心项目1项。曾作为IBM研究院隐私安全方向研究科学家，参与IBM研究院联邦学习研究项目3项。担任IEEE
  TDSC、IEEE TIFS、Computer&Security、IEEE TPAMI、IEEE TII、IEEE JSAC、IEEE TSC、IEEE S&P、IEEE
  TMC、IEEE TNNLS、JISA等多个领域国际权威期刊和IEEE BigData、IEEE TPS等国际会议的程序委员会成员或审稿人，协助组织近六年IEEE
  CIC国际会议，参与创办并协助组织近六年IEEE TPS和IEEE CogMI国际会议。
