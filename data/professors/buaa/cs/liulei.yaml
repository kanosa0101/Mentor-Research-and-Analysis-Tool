bio_raw: '刘磊，北京航空航天大学计算机学院教授、博导。刘磊分别于大连理工大学、中国科学技术大学、中国科学院大学（中科院计算所）获得计算机科学与技术工学学士学位、软件系统设计硕士学位和计算机体系结构工学博士学位。刘磊于2014/07-2022/03在中科院计算所，计算机体系结构国家重点实验室工作，历任助理研究员、副研究员、研究生导师、课题组PI等；兼任国家超算中心（深圳）总工程师（2020/11/01-2021/11/30，中组部报备挂职干部）；美国罗彻斯特大学访问学者（2017/05-2018/04）。

  刘磊的研究涉及“云原生”的一系列关键领域，包括现代操作系统、新型内存系统、新计算机系统结构（量子计算机）、系统性能评测、优化及可扩展性等多个方面。自2011年起，刘磊带领其课题组研发了面向主流多核、多通道服务器，及异构内存体系的新内存资源管理系统原型；探索了新OS的智能化；探索了量子计算机体系结构、系统软件栈及支撑环境。相关研究成果以第一作者、通讯作者发表于ISCA,
  HPCA, PACT, IEEE TC, TPDS, ACM TACO, ICCD等领域内权威学术会议和刊物，并在业内产生了影响力；近十年，刘磊主持多项国家级项目（包括自然科学基金、重点研发计划、省重点研发等），及多项企业级项目（华为、OPPO等），成果应用广泛。

  刘磊学术任职广泛，两次担任国际权威学术会议主席，是第32届国际超级计算大会ACM ICS-2018（超算领域顶级学术会议）的大会主席、国际工作集特征研讨会IEEE
  ISWC-2020的大会主席；近年来40余次任职于领域内权威学术会议/刊物，担任程序委员会委员、外评委员、组委会成员、编委、审稿人等（包括15个顶级学术会议ISCA、MICRO、ASPLOS、HPCA、PACT、SC、ICS、PPoPP等；10余种ACM/IEEE权威学术刊物ACM
  TACO、ACM JETC、ACM TECS、ACM TRTS、IEEE TPDS等）。

  刘磊曾获得“中国科学院院长优秀奖”、“计算所优秀科研人员”、“计算所学术百星”、“国科大优秀毕业生”等荣誉；培养的研究生获得北京市优秀毕业生、国科大（计算所）优秀毕业生、优秀毕业论文及各类奖学金。

  刘磊个人主页：https://liulei-sys-inventor.github.io'
