bio_raw: '张日崇，博士，教授， 2011 年毕业于加拿大渥太华大学信息工程与技术学院，并获得计算机科学专业博士学位。主要从事机器学习、数据挖掘、和人工智能方面的研究及相关方法在大数据分析、自然语言处理、社交网络分析、知识图谱、推荐系统和众包系统方面的应用。目前，作为项目负责人主持国家自然科学基金1项，并作为科研骨干参与国家973计划、国家863计划、国家自然科学基金等多项重要研究课题。已在ACM
  Transactions on Information Systems, ACM Transactions on Information System Technology等高水平学术期刊和WWW,
  AAAI和IJCAI等学术会议上发表学术论文50余篇。曾荣获2010年度国家优秀自费留学生奖学金并于2011年入选北京航空航天大学“蓝天新秀”人才培养计划。现任《Frontiers
  of Computer Science》青年副主编，担任AAAI等高水平国际会议的程序委员会委员及IEEE TNNLP, TKDE等10余个高水平国际期刊的审稿人。目前承担《高级程序设计》、《组合数学》本科生课程及《信息检索》和《数据挖掘》研究生课程。
  教学和科研工作详情，请访问个人主页：http://act.buaa.edu.cn/zhangrc。 电邮: zhangrc@act.buaa.edu.cn 电话：010-82316342
  办公地点：新主楼G座521'
