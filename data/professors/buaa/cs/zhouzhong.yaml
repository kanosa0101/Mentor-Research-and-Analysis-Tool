bio_raw: '周忠，男，博士，教授，博士生导师，虚拟现实/增强现实技术及应用国家工程实验室(北京航空航天大学)副主任、虚拟现实技术与系统国家重点实验室固定研究人员。现任中国虚拟现实与可视化产业技术创新战略联盟公共安全专委主任、中国计算机学会《CCF技术动态》主编、中国计算机学会虚拟现实与可视化专委常务委员、ISO/IEC
  JTC1 SC24/WG9(虚拟现实/增强现实)专家组成员、虚拟现实产业联盟(IVRA)专家顾问委成员、全国信息标准化委员会图形图像与环境数据表示分委会虚拟现实与增强现实标准工作组成员等，曾任中国计算机学会虚拟现实与可视化专委秘书长（2007-2015）。

  长期从事虚拟现实技术与系统研究，先后主持国家863计划、国家自然科学基金、中国下一代互联网示范工程上的高清视频和虚拟现实研究课题十多项，作为技术负责人研制分布式虚拟环境运行平台BH
  RTI，应用于400多家单位，获2006年国家科技进步二等奖，负责研发光场采集与重建技术及装置，在中影集团应用，获2014年国家技术发明二等奖。获中国教科网CERNET二十年突出贡献奖、中国国际工业博览会创新奖等。在IEEE
  Trans. on Multimedia(TMM)、IEEE Trans. on Instrumental and Measurement(TIM)、ACM Trans.
  on Multimedia(ToMM)等国际著名期刊和IEEE VR、ICCV等顶级国际会议上发表论文77篇，获国家发明专利授权三十多项，出版专著1部。

  先后组织并担任多届中国虚拟现实大会ChinaVR、International Conference on Virtual Reality & Visualization(ICVRV)组织委员会共同主席；担任中国虚拟现实大会、ICVRV、VRCAI、ChinaGraphics等国际国内会议的程序委员会委员等。

  部分研究可参考：虚拟现实增强技术综述.中国科学.信息科学. 2015, 60(2):157-180

  讲授课程包括：《多媒体技术》、《人机交互》、《网络虚拟环境》、《分布式虚拟环境》等。

  联系方式。邮件：zz@buaa.edu.cn，办公室：新主楼G1012，实验室：新主楼G724-726'
