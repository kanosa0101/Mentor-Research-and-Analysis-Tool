bio_raw: '童咏昕，北京航空航天大学教授，博士生导师，国家级领军人才。2014年于香港科技大学获计算机科学与工程学博士学位，随后留校担任研究助理教授，2015年加入北京航空航天大学软件开发环境国家重点实验室工作。

  长期从事大数据与人工智能领域的研究工作。目前主要研究方向包括：联邦学习、时空大数据挖掘分析、数据库系统、大模型向量数据处理与群体智能等。近年来，先后主持国家自然基金杰青项目、优青项目、重点项目、国家重点研发计划课题等科研项目。共发表学术论文百余篇，其中以第一/通讯作者在TODS、VLDBJ、TKDE、TOIS、SIGMOD、SIGKDD、VLDB等CCF-A类期刊/会议上持续发表（含接受）论文80余篇，Google
  Scholar统计引用13000余次。

  曾获中国电子学会自然科学一等奖（排名1）、首届阿里巴巴“达摩院青橙奖”、数据库领域国际顶级会议VLDB 2014“杰出演示系统奖”、数据挖掘领域国际顶级竞赛 KDD
  Cup 2020冠军，并入选CCF-A类会议VLDB 2022最佳论文候选和2022年度“高校计算机专业优秀教师奖励计划”；

  担任《Frontiers of Computer Science》期刊的执行编委（Action Editor）、《IEEE Transactions on Knowledge
  and Data Engineering》、《IEEE Transactions on Big Data》和《Proceedings of the VLDB Endowment》等国际期刊编委（Associate
  Editor）、DASFAA 2024 和NDBC 2025等数据库与大数据领域国内外重要学术会议的程序委员会主席（PC Chair）和多个CCF-A类会议程序委员会领域主席（PC
  Area Chair）；也是中国计算机学会(CCF)杰出讲者、CCF会员与分部工作委员会副主任、CCF走进高校工作组组长。

  承担本科生课程《算法设计与分析》、研究生课程《数据挖掘》、《大数据处理前沿技术》、《隐私计算》与《程序设计与算法》的教学工作。主讲的慕课课程《算法设计与分析》入选国家级一流本科课程（

  https://www.icourse163.org/course/BUAA-1449777166

  ）。'
