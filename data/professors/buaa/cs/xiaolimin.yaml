bio_raw: '肖利民，博士，北航长聘教授、博导，计算机科学技术系主任，计算机系统结构研究所所长，校学术委员会委员，中国科学院大学客座博导，国家工信部电子科学技术委员会委员，中国工程院中国信息与电子工程科技发展战略研究中心专家委员会特聘专家，中国计算机学会大数据专家委员会委员、高性能计算专委会委员、容错计算专委会委员，中国电子学会云计算专家委员会委员。

  1993年于清华大学计算机系获计算机学士学位（主修）和物理学士学位（辅修），1996年和1998年于中科院计算所先后获计算机硕士和博士学位。1996-2005年在中科院计算所从事超级计算机系统研制工作，期间，曾于2001年作为政府特别研究员，到日本产业综合技术研究院（AIST）从事体系结构研究工作。

  长期从事超级计算机和服务器系统、大数据存储与智能处理、云计算平台与系统虚拟化、人工智能与机器学习、系统安全和人工智能安全等领域研发。承担30多项国家重点研发计划、国家自然科学基金、国家863计划、国家核高基重大专项等项目，取得一批重要成果。

  在超级计算机和服务器系统方面，组织和参与研制成功“深腾7000”、“深腾6800”、“深腾1800”、“深腾2600”、“曙光3000”、“曙光2000-II/I”多个型号的国产超级计算机和服务器系统。作为项目负责人或系统总设计师，组织研制成功“国家网格主结点——深腾6800超级计算机”、“深腾7000高效能计算机系统”、“深腾1800大规模计算机系统”等超算系统。

  在大数据存储与智能处理方面，取得跨域虚拟数据空间系统、大规模文件系统智能搜索方法、大规模并行文件系统密集型元数据I/O自适应优化方法、大规模分布式文件系统负载均衡和高可用技术、E级超级计算机系统中I/O自适应负载均衡技术、面向HDD和SSD异构存储系统的负载均衡方法、大规模音乐库智能检索系统、EB级卫星大数据存储架构理论与关键技术等成果。

  在云计算平台与系统虚拟化方面，取得新型分布式虚拟化系统DVMM、面向沉浸式科研数据处理的云计算统一资源框架与模型、分布式云计算环境中资源管理与调度方法、电子商务应用云计算平台、电子监管应用云存储系统、SDN控制器分布式基础云平台、云-端计算模式下虚拟桌面应用优化方法、国产MIPS多核处理器虚拟化技术、虚拟化环境下应用随需迁移技术等成果。

  在人工智能与机器学习方面，取得基于卷积神经网络的单目图像深度估计技术、基于深度学习的多摄像头下车辆重识别技术、基于机器学习的视频关键内容识别技术、基于深度学习的大规模并行系统运行时状态感知任务均衡调度技术、基于深度学习的大规模集群trace数据时序挖掘技术、基于机器学习的机器人智能抓取算法等成果。

  在系统安全和AI安全方面，取得基于龙芯CPU的自主计算机、低功耗安全嵌入式处理器芯片、高安全机载计算机整机系统、虚拟化系统安全防护技术、基于虚拟机的网络安全监控体系、基于安全专网的大数据高效传输技术、基于传输管控的虚拟化桌面协议数据防泄漏方法、虚拟机内文件和数据区域的完整性度量方法、密码算法并行化方法、深度学习中对抗样本识别与消减技术、基于噪声溶解的对抗样本防御方法等成果。

  获2001年、2003年、2004年、2005年国家科技进步奖二等奖，2019年北京市技术发明奖一等奖，2004年、2013年北京市科学技术奖一等奖，2000年中国科学院科技进步奖一等奖，2004年信息产业部信息产业重大技术发明奖，2000年中国科学院优秀青年学者奖，2004年、2005年科技部国家重点新产品奖，2009年国家自主创新产品奖，2008年教育部科技进步奖二等奖等奖励。

  发表SCI/EI检索论文240多篇。申请发明专利110多项，其中88项获授权，56项获企业应用。

  主讲本科专业基础课《计算机组成》、研究生专业课《计算机系统虚拟化的原理与实现》和《高性能计算机体系结构与设计》等课程。2006年被聘为博士生导师，指导的博士和硕士研究生中，已毕业博士11人、硕士50多人，主要就业于IBM、Microsoft、华为等IT企业，阿里、百度、网易等互联网企业，中国科学院、航空航天集团、美国Lawrence国家实验室等科研机构，电子科大、北航、公安大学等高校以及建行、农行等大型国企。

