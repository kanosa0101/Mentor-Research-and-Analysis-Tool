bio_raw: '李建欣，博士，教授，博士生导师，大数据科学与脑机智能高精尖创新中心研究员。2001年和2008年分别在北京航空航天大学计算机学院获工学学士和博士学位，2008年英国卢瑟福.阿普尔顿国家实验室访问，2011年微软亚洲研究院访问研究员，2015-2016年间美国卡内基梅隆大学CMU机器学习系访问学者。现为IEEE和ACM会员，计算机学会（CCF）高级会员，中国人工智能学会青工委委员，CCF大数据专委会委员等。

  主要研究方向：大数据分析与处理、机器学习和可信计算等。

  主持和参与了国家973、核高基重大专项、科技支撑、国家863计划、国家自然科学基金、香港RGC联合项目等，包括“网络空间大数据计算理论与技术”、“社交网络异常事件检测与图处理技术”、
  “虚拟计算环境聚合与协同机理研究”、“国产中间件参考实现平台”、“服务网格系统CROWN”、“分布式系统的信任管理技术”等。参与编著学术专著2部，在IEEE Transactions
  on Computers (TC), IEEE Transactions on Knowledge and Data Engineering(TKDE), IEEE
  Transactions on Dependable and Secure Computing (TDSC)和《中国科学》等国内外期刊以及WWW, IJCAI,
  AAAI, SRDS, Infocom等国际会议发表学术论文60余篇，获AAAI 2021等最佳论文奖，IEEE会议杰出贡献奖。获得国家技术发明专利20余项，曾获国家技术发明二等奖1项，国家科技进步二等奖2项，省部级科技进步一等奖4项，北京市教学成果一等奖1项；曾获“微软学者”和微软亚洲研究院“铸星计划”，北京市“科技新星”计划、教育部“新世纪优秀人才计划”、中国电子学会优秀科技工作者（十佳）等。

  现任Springer Journal of Cloud Computing、Big Data Mining and Analytics, Journal of
  Social Computing等国际期刊编委，多次担任KDD, IJCAI, ICDM, CIKM, AAAI, ICPADS等国际会议程序委员会委员，ACM
  Computing Surveys, IEEE Transactions on Computer, IEEE Transactions on Parallel
  and Distributed Systems等国际期刊审稿人。

  讲授本科生《离散数学-图论》, 《组合数学》，硕博研究生《云计算原理》，《网络计算实践讲堂》，留学生《OOP in Java》等课程。

  Email: lijx@buaa.edu.cn, lijx@act.buaa.edu.cn; tel:010-82339274, office：北航新主楼G506，主页：http://act.buaa.edu.cn/lijx'
