bio_raw: 北京航空航天大学计算机学院教授，博士生导师，国家级领军人才，虚拟现实技术与系统全国重点实验室副主任，中国计算机学会虚拟现实与可视化专业委员会副主任。2005年获北京航空航天大学工学博士学位，香港科技大学、美国普渡大学访问学者。
  主要从事虚拟现实、混合现实、计算机图形学等方面的研究工作。主持了国家自然科学基金重大项目课题、自然科学基金重点项目、重点研发计划课题等科研项目，在领域顶级国际期刊会议IEEE
  TVCG、IEEE VR、IEEE ISMAR等发表学术论文80余篇，获得国家科技进步一等奖、国家技术发明二等奖、中国计算机学会技术发明一等奖、中国电子学会科技进步一等奖、中国产学研创新成果一等奖、国家高等教育教学成果一等奖。担任领域顶级国际会议IEEE
  VR 2021-2023程序委员会主席，IEEE ISMAR 2021-2022程序委员会主席。担任CCF A类期刊IEEE TVCG编委、Science China
  Information Science 青年编委，图形学领域著名国际杂志IEEE CG&A编委，CCF A类中文期刊《软件学报》编委，任领域权威中文期刊《计算机辅助设计与图形学学报》副主编，任IEEE
  VGTC VR 2023-2024全球最佳博士论文评选委员会委员。
