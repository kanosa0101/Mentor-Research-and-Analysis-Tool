bio_raw: 盛浩，北京航空航天大学蓝天杰出教授、博士生导师，国家科技创新领军人才，IET Fellow。本硕博均就读于北京航空航天大学计算机学院，毕业后留校任教至今。长期从事智能计算、计算架构、数据科学等领域研究，以第一/通讯作者身份发表JCR
  Q1区/CCF A论文60余篇（其中ESI热点/高被引13篇），授权国家发明专利40余项，制定国家标准13项，牵头国家一码通用标准体系建设，获教育部技术发明一等奖、中国技术市场协会金桥奖一等奖等，连续四年入选全球前2%顶尖科学家榜单。担任智慧物流国家工程实验室副主任、文旅大模型及数据智能服务文化和旅游部技术创新中心副主任、中国人工智能学会自然计算与数字智能城市专委会副主任、全国信标委大数据技术专题组组长、人机融合智能专委会秘书长、国家重点研发计划“物联网与智慧城市关键技术及示范”专项总体组专家等
