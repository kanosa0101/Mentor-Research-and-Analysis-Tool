bio_raw: '黄迪，博士，教授，博士生导师，国家高层次青年人才，电气和电子工程师协会（IEEE）高级会员，中国计算机学会（CCF）杰出会员，中国人工智能学会（CAAI）杰出会员。分别于2005年和2008年在北京航空航天大学计算机学院获得学士和硕士学位，2011年在法国里昂中央理工大学获得博士学位。长期从事计算机视觉、模式识别、具身智能方向基础理论与关键技术的研究工作，具体内容涉及通用视觉模型构建与适配、多模态视觉感知（二维/三维目标检测与识别、视觉抓取）、视觉生成、生物特征识别及情感计算等。曾主持国家重点研发计划、国家自然科学基金、北京市自然科学基金、教育部博士点基金等基础研究项目和微软、阿里、美团、字节跳动等企业的合作应用项目，还作为主要成员参与了新一代人工智能重大专项、国家973/863计划、法国科研署计划等多项国内外研究任务。已在IEEE
  TPAMI、IJCV、CVPR、ICCV、ECCV、AAAI等领域内重要期刊和会议发表论文100余篇，谷歌学术引用12500余次；获授权发明专利20余项。曾获2013国际多媒体会议（ACM
  MM）情感计算竞赛（AVEC）第1名、2022国际机器人与自动化会议（IEEE ICRA）机器人抓取与操作竞赛第1名；2016国际生物特征识别会议（IEEE ICB）最佳墙报论文奖、2016中国生物特征识别会议（CCBR）最佳论文奖、2017
  国际计算机视觉大会（IEEE ICCV）Workshop（AMFG）最佳论文奖、2024国际面部与手势自动识别会议最佳学生论文提名奖等。研究成果应用于网安、公安、交通、医疗、体育等多个国家重要行业，成效显著。目前承担《机器学习》、《计算机科学方法论》和《科技论文写作》等本科生和研究生课程的教学工作。曾获吴文俊人工智能自然科学一等奖（排1）、中国图象图形学学会自然科学二等奖2项（排3、排4）、北京市教学成果一等奖（排4）、中国人工智能学会杰出贡献奖等荣誉，获评北京市课程思政名师。现任中国人工智能学会理事和智能交互专委会秘书长、中国计算机学会人工智能与模式识别专委会和计算机视觉专委会委员；是IEEE
  TPAMI、IJCV等学术期刊审稿人，多次担任CVPR、ICCV、AAAI、IJCAI、MM等CCF-A类会议的领域主席或程序委员。详细信息请见：

  https://irip.buaa.edu.cn/dihuang/index.html'
