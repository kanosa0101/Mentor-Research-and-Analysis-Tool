bio_raw: '马帅，博士，北京航空航天大学计算机学院教授，博士生导师。分别获得了北京大学和英国爱丁堡大学的两个博士学位，英国爱丁堡大学博士后，曾在美国贝尔实验室总部实习，在微软亚洲研究院访问。多年从事大数据理论与系统的研究，研究成果持续发表在数据库领域、数据挖掘、人工智能和系统等顶级会议(SIGMOD、VLDB、ICDE、WWW、MobiCom、USENIX
  ATC、ACL、AAAI、IJCAI) 和顶级期刊(TODS、VLDB Journal、TKDE、TMC、TKDD)，并且在美、英、法、俄、澳大利亚、比利时和香港等多个国家和地区的大学研究生课程上被讲解。(曾)担任VLDB
  Journal和IEEE Transaction On Big Data等编委；TODS、VLDB Journal、TKDE、JCSS、TCS等国际顶级期刊审稿人和SIGMOD、VLDB、ICDE、KDD等国际顶级会议程序委员；IEEE
  BigDataSE 2016大会副主席、IEEE ICDE Workshop CloudDB 2014大会共同主席、软件学报专刊《大数据管理技术》特邀编辑，ICDM
  2019 Demo主席等。2010获得数据库领域国际顶级会议VLDB唯一最佳论文奖；2012年入选微软青年教师“铸星计划”；2013获数据库领域国际知名会议WISE最佳挑战论文奖；2013年获青年国家人才称号；2015年入选微软亚洲研究院合作计划；2016年获数据挖掘与信息检索国际知名会议WSDM挑战赛最终排名第2名；2017年获中国电子学会科技进步特等奖(8/15)；2019年获数据挖掘领域国际知名会议ICDM候选最佳论文、国家人才称号。

  个人主页：https://mashuai-ms.github.io/

  邮箱：mashuai@buaa.edu.cn'
