bio_raw: '王睿杰，男，教授，国家级青年人才。2019年于上海交通大学计算机系获学士学位，2023年于美国伊利诺伊大学厄巴纳-香槟分校（UIUC）计算机系获博士学位。2024年于UIUC从事博士后研究，同年加入美国亚马逊公司从事大模型研究，2025年入职北京航空航天大学计算机学院。

  主要研究方向为开放动态环境下的可信高效人工智能，涵盖自然语言、图与时间序列等数据的理论技术研究。旨在开发多模态可泛化基础模型及系统，利用结构化知识实现可靠的感知、推理与决策，其应用涵盖推荐系统、智能体及科学计算等领域。在NeurIPS、ACL、KDD、WWW、SIGIR、INFOCOM等国际知名会议与期刊上发表论文40余篇，其中CCF-A类论文20余篇，包括NeurIPS、ACL、WWW、KDD等一作/通讯作者论文10余篇，获得IEEE
  DCOSS唯一最佳论文等奖项。作为技术负责人或核心骨干完成多项美国DARPA、NSF、半导体研究联盟SRC等资助项目，负责亚马逊电商大模型的后训练与落地应用，并与Meta、IBM、波音等国际企业进行合作，多项研究成果实现应用集成与成果转化，产生经济效益。曾组织国际会议CIKM研修教程及IEEE
  Big Data数据竞赛，长期担任TKDE、TOIS、TMC、NeurIPS、ICML、ICLR、KDD、ACL Rolling Review等20余个知名会议程序委员及期刊审稿人。

  长期招收对人工智能与大数据技术与系统感兴趣的同学加入研究团队（实习生/本科生/研究生/博士生等，学校不限），招生联系方式：

  ruijiew@buaa.edu.cn

  ，详见主页

  https://wjerry5.github.io

  。近期研究方向包括面向大模型对齐微调的强化学习（RLHF，RLVR等）、智能体与大模型复杂推理、以图为中心的多模态基础模型、面向科学计算的图学习与大模型，推荐系统等。'
