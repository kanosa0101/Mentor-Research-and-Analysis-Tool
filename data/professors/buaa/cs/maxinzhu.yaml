bio_raw: 马新柱，博士，教授，国家级青年人才。分别于2017年和2019年在大连理工大学取得学士及硕士学位。于2023年在悉尼大学取得博士学位后，前往香港中文大学开展博士后研究工作。2025年加入北京航空航天大学计算机学院担任副教授。目前主要研究方向为三维视觉、具身智能、AI4Science等，在CVPR、ICCV、ECCV、NeurIPS、ICLR、TPAMI、TIP等计算机视觉及人工智能领域顶级会议、期刊发表论文30余篇，相关成果应用在自动驾驶、机器人、科学发现等领域。
