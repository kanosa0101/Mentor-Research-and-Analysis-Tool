bio_raw: 曹庆华，教授，曾任北京航空航天大学计算机学院教学实验中心主任（我国计算机学科第一个国家级实验教学示范中心）， 现任高等理工学院院长、国家卓越工程师学院/未来空天技术学院常务副院长，承担研究生课程《数字系统自动化设计》、本科生课程《大学计算机基础》教学工作，出版《计算机网络实验教程》、《网络测试与故障诊断实验教程》等7本教材，获国家级教学成果一等奖一项、二等奖四项，北京市教学成果特等奖1项、一等奖4项。主持《国家知识产权局专利局专利辅助审查系统》、《航空发动机控制系统软件适航审定方法与流程研究》等重大科研项目8项，主要研究方向：高可靠高安全软件的设计、嵌入式计算机系统技术、教育数字化技术。
