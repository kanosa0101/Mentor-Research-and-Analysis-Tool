bio_raw: 袁源，教授，博士生导师。2015年博士毕业于清华大学计算机系，获北京市优秀毕业生，期间2014-2015曾在英国伯明翰大学做访问研究。于2015至2021年先后在新加坡南洋理工大学和美国密歇根州立大学从事博士后研究工作。2020年入选国家高层次青年人才项目。研究领域包括计算智能、机器学习、智能软件工程、多目标优化等。迄今为止，以第一作者在IEEE
  TSE、IEEE TEVC、AIJ、IEEE TASE、ACM TOSEM、ACM GECCO等国际顶级学术期刊和会议发表论文十余篇，谷歌学术总引用3200余次，4篇论文为ESI高被引论文，1篇论文入选中国百篇最具影响国际学术论文。作为项目骨干曾主持或参与02科技重大专项子项目、国家自然科学基金面上/青年项目等，获得中国物流与采购联合会科技发明一等奖
  1 项、中国仿真学会自然科学奖二等奖 1 项。目前担任 IEEE TETCI 副主编，曾担任IEEE TITS、Memetic Computing等多个权威国际期刊的客座编辑。多次担任ACM
  GECCO、IEEE CEC、ICSE、IJCAI等知名国际会议的专题分会主席和程序委员会委员，长期担任人工智能领域多个国际顶级期刊的审稿人。
