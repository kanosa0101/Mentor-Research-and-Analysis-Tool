bio_raw: '牛建伟，北京航空航天大学蓝天杰出二级教授，博士生导师，IEEE Fellow，北航具身智能机器人研究院副院长，美国卡内基梅隆大学访问学者，工业互联网产教融合国家级创新平台首席科学家，科技部重点研发计划首席科学家，中国仿真学会工业互联网专委会主任，浙江省“全省工业大数据与机器人智能系统重点实验室”主任，中国电子学会机器人分会总干事，IEEE
  IES 工业应用云和无线系统技术委员会中国区副主席。入选国家级人才，获得2013年教育部技术发明一等奖，2024年获得**科技进步奖一等奖。

  近年来主要从事智能嵌入式系统研发，曾主持了国家自然基金重点和面上项目、重点研发计划项目、国家科技支撑计划项目等。主持完成了国家重点研发计划项目“高**强实时嵌入式智能系统”、“机器人操作系统及开发环境研究与应用验证”、浙江省重点研发计划项目“新一代高性能工业机器人控制器**技术研发及产业化”、“基于数字载体与移动机器人的智能生产物流场景模型与应用平台”。承担的“宇航嵌入式操作系统”及“高可信虚拟化操作系统”等项目成果在多颗卫星上长期稳定运行。研发的工业机器人操作系统被国内多家头部机器人企业应用，解决了国产半导体晶圆搬运机器人操作系统瓶颈问题，产生经济效益数亿元。

  在国内外期刊和国际会议上发表学术论300余篇（包括CCF A类论文60多篇），其中ESI高被引论文10篇，H-index 67，google引用21000多次。获得MobiCom2024
  （CCF A类会议）、MobiCom 2022（CCF A类会议）、JNCA2021、PerCom 2020、IEEE System Journal 2018、JNCA
  2015、IEEE ICC 2013、IEEE WCNC 2013等10余篇最佳论文，出版学术著作2部，已授权130余项技术发明专利。

  主讲本科生核心课程“计算机组成“、”“计算机硬件基础”、研究生专业课程“嵌入式系统”等课程。近年来的研究方向是：具身智能；机器人操作系统；机器学习。

