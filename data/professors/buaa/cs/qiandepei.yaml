bio_raw: 钱德沛，男，教授，博士生导师，中国科学院院士。1977年毕业于西安交通大学计算机专业，1982年至1984年由国家公派在美国读研究生，1984年5月在美国德克萨斯州北德州立大学获硕士学位。1991年6月至92年3月作为高级访问学者，在德国汉诺威大学计算机系统结构与操作系统研究所进修工作。1992年起任教授，1996年被聘为博士生导师。自1996年起任国家863计划专家组专家，现任国家863计划“高效能计算机及应用服务环境”重大项目总体组组长、国家973计划信息领域咨询专家组成员、国家基金委重大研究计划“高性能科学计算的基础算法预科计算建模”指导专家组成员、CNGI专家委员会委员。
  曾主持完成国家自然科学基金、863计划、973计划、国际合作计划等多项课题的研究工作，发表论文300余篇，获国家科技进步二等奖一项，北京市科技进步一等奖一项。主要研究方向包括高性能计算机体系结构、分布式系统、众核处理器并行编程等。
