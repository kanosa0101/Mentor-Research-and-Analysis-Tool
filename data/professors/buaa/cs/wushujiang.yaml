title: 副教授
email: wushujiang@buaa.edu.cn
bio_raw: '巫蜀江，博士，副教授，国家海外高层次青年人才。2016年于北京航空航天大学计算机学院获学士学位，2023年于美国约翰霍普金斯大学计算机学院获博士学位。研究方向聚焦于Web安全与用户隐私保护，重点开展基于Web设备（如浏览器指纹）的追踪与防御、浏览器侧信道攻击等研究，并计划拓展至大模型安全，无人车/机安全领域。在工业界曾担任F5公司安全研究员，并曾在Meta（Facebook）从事安全研究实习，相关成果已应用于防御机器人攻击、反欺诈系统等商业产品。研究成果发表于USENIX
  Security、NDSS、CCS等安全领域四大顶会及WWW等网络顶会。曾多次担任USENIX Security会议Artifacts审稿人、ACM CCS程序委员会委员、ACM
  TOPS期刊审稿人，并担任MadWeb会议程序委员会委员及分会主席。本人非常欢迎对安全领域研究感兴趣的同学加入我的研究团队（实习生/研究生/博士生）。如有意向，请通过邮件联系：

  wushujiang@buaa.edu.cn'
