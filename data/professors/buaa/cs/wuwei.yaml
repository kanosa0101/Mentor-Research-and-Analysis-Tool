bio_raw: 吴威，男，1961年生，博士，教授，博士生导师，虚拟现实技术与系统国家重点实验室副主任，中国计算机学会虚拟现实专委会主任。主要从事虚拟现实与可视化技术、图形与图像技术、计算机视觉技术等研究。获得国家科技进步一等奖1次、国家科技进步二等奖2次、部级一等奖2次、部级二等奖1次，获得国家发明专利58项，在国内外重要期刊与会议上发表学术论文近120篇。
  2001年主持完成了山西省大型工程重点项目“山西省大运高速公路可视化信息管理系统”，集地理信息规划功能、高速公路建设数据库功能、高速公路设计全方位剖面功能为一体，有关研究成果获山西省优秀计算机软件一等奖、全国第八届优秀工程设计软件银质奖、山西省科学技术二等奖。
  2003年主持完成了国家“863”项目“面向信息对抗体仿真系统”，完成了国家“863”项目“大规模分布式虚拟逼真环境”，建立了分布式虚拟综合环境，支持全天候协同仿真训练应用，有关研究成果获中国高校科技进步一等奖、国家科技进步二等奖。
  2005年主持完成了国家重点基础研究发展计划“973”课题“分布式虚拟环境技术”、国家自然科学基金项目“三维地理信息可视化技术与系统”，建立了支持快速开发的仿真体系结构，研制了一套可以支持大规模、多盟员、跨路由的分布交互仿真运行平台。有关研究成果获北京市科技进步一等奖、国家科技进步二等奖。
  2007 年主持完成了国家科技攻关项目“基于下一代互联网（IPv6）的高性能视频传输与共享虚拟现实”，主持完成了国家“863”项目“面向仿真应用的无线自组织路由技术”，在全国建立了高清晰视频与共享虚拟现实应用示范节点，满足对虚拟现实技术应用研究需要，有关研究成果获上海国际工业博览会创新奖。
  2009年开始承担国家重点基础研究发展计划“973”课题“虚实混合环境的驱动引擎技术与系统”，研究了真实物体的数据快速获取、实时建模及虚实交互技术，研制了虚实混合环境的驱动引擎，研究成果应用在飞机装备维护训练与大型航海搜救模拟方面。有关图形平台的研究成果与应用获国家科技进步一等奖。
  2011年开始主持承担国家“863”课题“真实场景感知及数字化方法与装置”，研究自然现象获取与数据驱动技术，研制了一批自然现象数据获取实验设备，建立了大规模数据库，在真实数据获取与采用物理方程建模方面，获得一批国家专利，解决了国家在特殊领域有关重要问题，在影视后期制作中得到应用。
  吴威教授每年承担本科生课与研究生学位课的教学工作，2010年获得北京航空航天大学研究生教学一等奖。在硕士生培养方面，十多次获得校优秀硕士学位论文指导教师奖，在所指导博士生研究中，多名研究生获得校博士生创新基金，每年有一批学生赴美国交流与学习。在2012年获得中国系统仿真学会优秀博士论文指导教师奖。
