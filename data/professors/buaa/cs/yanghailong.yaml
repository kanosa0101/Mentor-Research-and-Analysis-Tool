bio_raw: '杨海龙，教授，博士生导师，国家高层次青年人才，CCF杰出会员，CCF体系结构专委会委员，CCF高性能计算专委会委员。现任计算机学院本科教学副院长，主要研究方向为深度学习编译优化技术、大模型训推系统、高性能计算、性能分析与优化、稀疏数值算法。主持国家重点研发计划项目、国家自然科学基金项目等多项国家级科研项目。目前已在SC、ISCA、ASPLOS、PLDI、ICSE、PPoPP、TPDS、TC、TOCS、TACO等国际顶级/知名会议和期刊上发表学术论文60余篇，授权发明专利22项。获校级教学优秀三等奖一项，校级优秀教材二等奖一项。担任CCF
  THPC期刊青年编委，TPDS、TC、PARCO、JPDC、FGCS、FCS等期刊审稿人，CLUSTER21国际会议体系结构程序委员会主席，PPoPP、ICPP、CLUSTER等国际会议程序委员会委员。曾获CCF高性能计算青年科技人才奖。指导北航超算队获得ASC世界大学生超算竞赛总决赛一等奖8项，累计获得国内外赛事奖项24项。指导学生多人获得校级优秀本科学位论文、校级优秀硕士学位论文、校级优秀博士学位论文、北京市优秀本科学位论文、CCF体系结构优秀博士学位论文、CCF高性能计算优秀博士学位论文、ACM
  SIGHPC优秀博士学位论文。

  电子邮箱：hailong.yang@buaa.edu.cn

  办公电话：010-82338785

  办公地址：北京航空航天大学新主楼G823

