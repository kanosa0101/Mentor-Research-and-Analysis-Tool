bio_raw: '1998和2007年获得浙江大学学士和美国伍斯特理工学院博士学位。2007年8月起，先后在美国伊利诺伊理工学院、纽约州立大学布法罗分校任教获终身教职，并晋升为讲席教授（SUNY
  Empire Innovation Professor）。2018年起任浙江大学求是讲席教授，现任计算机科学与技术学院院长、区块链与数据安全全国重点实验室常务副主任、上海浙江大学高等研究院院长。

  主要从事数据要素安全、人工智能安全与计算机应用等领域研究。主持多项科技部、国家自然科学基金委重点项目，曾获中国电子学会自然科学一等奖、浙江省自然科学一等奖、浙江省科学技术进步一等奖、IEEE安全技术委员会技术成就奖、美国国家科学基金会职业奖、纽约州立大学校长资深学者奖、Sigma
  Xi青年学者奖等。发表论文500余篇，获IEEE Infocom时间考验论文奖等最佳论文奖十余项，文章谷歌总引用次数61000余次，H-index为111。2016年当选国际电气与电子工程师学会（IEEE）会士，2021年当选国际计算机学会（ACM）会士，2022年当选中国计算机学会（CCF）会士，2024年当选美国科学促进会（AAAS）会士。

  目前担任国家数据专家咨询委员会委员、全国数据标准化技术委员会委员、中国网络空间安全学会常务理事、中国电子学会理事、中国密码学会理事、IEEE ISI Award
  评奖委员会主席，以及第九届欧美同学会理事、浙江省政协委员、浙江省知联会副会长等职务。'
