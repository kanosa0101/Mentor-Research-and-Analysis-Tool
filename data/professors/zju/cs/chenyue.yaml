bio_raw: '1967年生于北京。1990年本科毕业于北京大学数学系，同年8月考入美国康涅狄格大学研究生院，1992年取得数学硕士学位，1996年获得数学博士学位。

  1996年底回国，进入浙江大学数学系任教。1999年转入浙江大学计算机系。

  现为浙江大学计算机科学与技术学院教授，教育部高等学校计算机类专业教学指导委员会委员。

  主讲“数据结构基础”、“高级数据结构与算法分析”、“软件工程”、“数值分析”、“面向信息技术的沟通技巧”等课程，从事数据驱动教学、智能导学、医学图像处理等方向的研究。

  为国家精品在线开放课程“数据结构”、国家精品课程与精品资源共享课程“软件工程”、国家双语示范课程“数据结构与算法”、国家教学团队“程序设计系列课程教学团队”的负责人。程序设计能力标准化测试“PAT”和程序设计类教学辅助平台“拼题A”的创始人。在“中国大学MOOC”和网易“云课堂”平台开设在线开放课程“数据结构”，注册人数累计超过36万人。曾获国家优秀教学成果一、二等奖、浙江省优秀教学成果一等奖多项、宝钢优秀教师奖等。'
