bio_raw: '2000年9月博士毕业后留校任教，2002年12月被评为副教授，2007年12月被评为教授，2009年3月被评为博士生导师。现任浙江大学研究生院副院长、专业学位处处长、计算机软件研究所副所长，中国残疾人信息和无障碍技术研究中心副主任，阿里巴巴-浙江大学前沿技术联合研究中心（AZFT）副主任，全省无障碍感知与智能系统重点实验室主任。国家级高层次人才，

  “百千万人才工程”国家级人选，

  教育部“新世纪优秀人才支持计划”入选者，浙江省“新世纪151人才工程”第一层次培养人员。中国计算机学会（CCF）常务理事，CCF公益工委主任（2022-2028年），CCF青工委主任（2018-2020年），CCF
  YOCSEF主席（2013-2014年度）。全国信息技术标准化技术委员会（SAC/TC28/SC35）副主任委员（负责信息无障碍领域国家标准制定和推广实施）。

  主要研究方向有智能媒体计算、多模态大模型、智能体、信息无障碍等。作为项目负责人，已承担和完成国家863、973、国家自然科学基金、国家科技支撑计划、国家国际科技合作专项、国家重点研发计划等国家和省部项目20余项，负责重大企业合作和国际合作项目20多项。发表学术论文200多篇，其中包括CCF
  A类会议和期刊论文100余篇，获ACM Multimedia 2010最佳论文奖提名、AAAI 2012 Outstanding Paper Award（系该人工智能顶级国际会议1980年创办以来中国大陆学者首篇获奖论文）。出版著作3部，授权相关发明专利50余项。获2011年度国家科技进步二等奖，2007年度国家技术发明二等奖，2023、2019、2011、2010、2006年度浙江省科学技术一等奖等科技奖励。作为第一起草人制定信息无障碍领域国家标准3项，参与制定国家和行业标准5项。'
