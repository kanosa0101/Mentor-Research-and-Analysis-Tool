bio_raw: '郑乾，浙江大学计算机科学与技术学院、脑机智能全国重点实验室“百人计划”研究员，博士生导师，国家海外高层次青年人才（

  2021）

  ，VALSE EACC主席委员（

  第九届）

  。2017年从浙江大学博士毕业，此后在新加坡南洋理工大学

  ROSE Lab

  从事博士后研究，2022年加入浙江大学至今。研究方向主要为类脑视觉。发表CCF-A类论文50余篇，包括T-PAMI，CVPR，ICCV，ICML等，获ACM杭州分会“新星奖”（2024），主持国家自然科学基金面上项目，是

  国家自然科学基金重点项目、

  国家科技重大专项课题负责人，担任国际期刊PR、T-CDS、Neurocomputing编委，多个CCF-A类会议、期刊审稿人。

  团队依托浙江大学脑机智能全国重点实验室，实验室主任为

  潘纲

  教授。实验室聚焦

  类脑软硬件协同设计方法、类脑智能理论与应用方法

  等基础理论与关键技术。长期招收

  科研助理、博士后、博士研究生、硕士研究生、在读本科生，

  欢迎对相关方向感兴趣的同学

  进行联系。

  更多的信息请参考:

  https://q-zh.github.io/'
