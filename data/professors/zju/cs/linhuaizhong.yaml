bio_raw: '林怀忠，浙江大学副教授，

  博士生导师

  。

  主要从事

  计算机视觉内容智能生成（图像可控生成：图像风格迁移、图像修复、图像对抗生成、跨域图像迁移；视频的可控编辑，

  应用领域：虚拟数字人、虚拟换装

  ；三维内容只能生成：包括NERF、3D高斯等）、多模态大模型、空间智能、具身智能。

  面向文旅、教育、电力、汽车等领域，与支付宝、阿里、华为、美团等国内20家头部企业，联合开发了球幕/环幕沉浸式展示、复杂模型和超大艺术图像的基于web 的快速展示、艺术图像风格自动识别、地铁巡检系统、图案智能创意设计、图案知识图谱、可穿戴沉浸式展示SDK、舆情智能分析、面向文化遗产领域的智能检索与问答、文博机器人、人形机器人具身智能系统、考古动态场景三维采集装置、智能驾驶舱等20多套软件系统。在计算机视觉内容生成、大模型等方面发表论文100

  多篇，其中在人工智能、机器视觉等顶级会

  期刊和会议

  如CVPR、NIPS、AAAI、ICCV、ACM MM

  、IJCAI、CVIU、

  IET

  等论文30多篇，申请发明专利

  4

  0多项，是 TIP、AAAI、CVPR、TVCJ、Siggraph、NCA等top会议和期刊的审稿人。

  作为技术骨干

  承担项目70项

  。'
