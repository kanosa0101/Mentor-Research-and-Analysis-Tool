bio_raw: '工学博士，副教授，博士生导师，目前在

  浙江大学计算机辅助设计与图形学国家重点实验室

  工作，从事计算机图形学领域的研究和开发。2010 年回浙大工作之前就职于微软亚洲研究院，获得 3 项渲染相关的美国专利，成功完成了 1 项 XNA 软件工具的技术转化。2010年全职回浙大工作，并和周昆教授、侯启明博士一起建立了

  图形与并行系统实验室

  。作为课题负责人完成国家自然科学青年基金项目一项，承担面上项目一项；2012 年度作为课题负责人承担十二五 863 计划 3D 内容关键技术与应用系统主题项目的课题一项。在学术上，任重在计算机图形学的顶级会议
  ACM SIGGRAPH 和顶级期刊 ACM Transactions on Graphics 上发表真实感渲染相关论文6篇，在其他 SCI 索引的国际会议和期刊上发表论文十余篇。拥有美国专利4项，中国发明专利3项。担任第十八届太平洋图形学大会程序委员会成员和包括
  ACM  Transactions  on Graphics、IEEE  Transactions  on  Visualization  and  Computer
   Graphics、SIGGRAPH在内的多个图形学顶级期刊和会议的审稿人。

  更多信息见

  个人主页

  。

  欢迎对计算机技术充满热情，对做出影响学术界和工业界的成果怀有梦想的同学申请实验室的研究生。详情见

  此处

  。'
