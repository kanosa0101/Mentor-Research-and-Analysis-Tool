bio_raw: '林芃，浙江大学计算机学院、脑机智能全国重点实验室“百人计划”研究员，博士生导师，入选国家高层次青年人才引才计划，美国麻萨诸塞大学博士、麻省理工学院博士后，担任中国人工智能学会脑机融合与生物机器智能专委会委员、国际标准组织ISO/IEC新兴技术领域注册专家。主要研究方向是新型类脑计算系统，近年来在Nature
  Electronics, Nature Nanotechnology等世界知名学术期刊和会议发表文章50余篇，包括多篇Nature子刊封面论文，承担国家重点研发计划课题、浙江省基金委重大项目。

  本实验室长期招聘优秀硕士、博士研究生及博士后，也欢迎具有电子、材料、医学等交叉学科背景同学申请，欢迎对科研有兴趣的本科同学来课题组做研究，有机会发表高水平论文，有意者烦请邮件联系。'
