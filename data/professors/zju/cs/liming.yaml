bio_raw: '已主持国家自然科学基金面上项目5项。发表SCI检索论文160余篇，ESI高被引论文18篇，ESI热点论文4篇，国外出版专著9本，其中4本为ESI高被引。国外出版编书17本。两次获中国百篇最具影响国际学术论文证书（2010年，2012年），七次列入中国高被引学者榜单：2014年第1届（2015年2月2日）、2015年第2届（2016年2月27日）、2016年第3届（2017年2月27日）、2017年第4届（2018年1月19日）、

  2018年第5届（2019年1月17日）、

  2019年第6届（2020年5月7日）、

  2020年第7届（2021年4月22日）

  。2020年列入世界前10万科学家榜单、2021年（10月20日）列入全球前2%科学家（数值与计算数学）和前10万科学家（全部学科）榜单、

  2022年全球前2%科学家榜单（2023年10月4日发布）、

  2022全球前2%科学家职业生涯影响力榜单

  （2023年10月4日发布）、

  2023年全球前2%科学家榜单（2024年9月16日发布）、

  2023全球前2%科学家职业生涯影响力榜单（2024年9月16日发布）、

  2024年全球前2%科学家榜单（2025年9月19日发布）、

  2024全球前2%科学家职业生涯影响力榜单（2025年9月19日发布）

  。

  建立了：1）网络流量的广义柯西模型；2）网络泛洪攻击的可靠检测原理；3）确定网络流量记录长度的原理；4）广义分数阶高斯噪声模型；5）修正多分形高斯噪声模型；6）海水位的统计模型；7）确定海浪记录长度的原理；8）随机造波机的最优控制方法；9）随机疲劳机的最优控制方法；10）分数阶振动系统的各种响应的解析解；11）瑞利阻尼假设的数学解释；12）多分形广义柯西过程；13）网络流量的分形界；14）网络流量延迟的分形界；15）网络流量分形界和延迟界尺度因子的计算方法；16）Delta函数的分数阶导数的积分表示；17）多类负质量的数学模型；18）多类负阻尼的数学模型；19）多类频变质量（阻尼、刚度）的数学模型；20）多类频变固有频率的数学模型；21）分数阶欧拉-伯努利梁的解析解；

  22）一般

  频变振动方程及其解析解；

  23）分数阶随机振动理论基础；24）多类分数阶振动系统在分数阶高斯噪声激励下的解析解；25）

  多类分数阶振动系统在广义分数阶高斯噪声激励下的解析解；26）

  多类分数阶振动系统在分数阶布朗运动激励下的解析解；27）

  多类分数阶振动系统在分数阶Ornstein-Uhlenbeck过程激励下的解析解；

  28）

  多类分数阶振动系统在von Kármán谱激励下的解析解；

  29）

  多类分数阶振动系统在Pierson-Moskowitz谱激励下的解析解

  。美国科技媒体（

  "Computer Weekly News"、"Telecommunications Weekly"、"Computer, Networks and Communications"

  ，等）多次报道了他的多项科研成果。

  1971年，李明在江苏省少年乒乓球选拔赛上获得‌男子单打冠军。1972年，他担任第一届亚洲乒乓球竞标赛裁判员。他曾任无锡市业余体校男女少年班教练。'
