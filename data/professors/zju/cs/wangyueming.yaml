bio_raw: '王跃明，男，

  浙江大学计算机学院，求是特聘教授，

  国家级高层次人才。

  2007年毕业于浙江大学计算机科学与技术学院，获博士学位，2010年6月任浙江大学副教授，博士生导师，2016年12月晋升教授。研究方向：脑机接口，人工智能。

  近年来以第一

  /通讯作者发表Nature Human Behaviour, Nature Computational Science, Nature Communications,
  eLife, IEEE TPMAI, IEEE TIP, IEEE TNNLS, CVPR, IJCAI, ECCV等顶级/重要期刊及顶级国际会议论文70多篇，作为项目负责人，主持国家重点研发计划、国家自然科学基金重点项目等国家科研任务；构建了中国首例临床侵入式3D运动控制闭环脑机接口系统，实现了临床志愿者脑控机械手完成喝水、进食、握手、汉字书写等动作。成果入选中国高校十大进展（2016）。'
