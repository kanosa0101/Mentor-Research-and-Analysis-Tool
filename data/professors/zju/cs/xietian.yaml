bio_raw: 2008年本科毕业于浙江大学自动化专业，2013年博士毕业于浙江大学计算机科学与技术专业。分别任浙江大学博士后（2013-2015），美国休斯顿大学博士后（2016-2018），之江实验室高级研究专员（2018-2024）。2021年初经之江实验室职称评聘委员会评为副研究员。2024年9月起就职于浙江大学计算机辅助设计与图形系统（CAD&CG）全国重点实验室专职研究员。长期从事混合现实应用研究，搭建飞机维修诱导、医疗手术导航、自动驾驶虚拟仿真等系统多套。担任浙江省人工智能学会增强现实分会委员。
