bio_raw: 男，副研究员，2000年获浙江大学机械与能源工程学院机械制造及其自动化专业博士学位，同年进入浙江大学CAD&CG国家重点实验室从事博士后研究。2002年出站后赴香港城市大学从事高级访问学者研究。2003年留浙江大学计算机学院CAD&CG国家重点实验室工作。主要从事计算机辅助公差建模、设计知识检索与重用、三维模型检索、MEMS设计与仿真等方面的研究工作。发表论文近30篇。
