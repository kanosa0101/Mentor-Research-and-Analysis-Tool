bio_raw: '张宏鑫，1975年生, 浙江杭州人, 博士，副教授。

  1993年进入浙江大学应用数学系就读，1997年本科毕业并获学士学位。同年开始在浙江大学数学系CAGD科研组攻读博士研究生，师从王国瑾教授。2001年7月至11月在微软亚洲研究院做访问研究。2002年完成研究生学业，获理学博士学位。

  2002年赴香港科技大学计算机系作博士后访问研究工作。2003年回到浙江大学，进入CAD&CG国家重点实验室工作。2004年至2005年在德国亚琛工大做访问合作研究。后两次受法国领事馆的邀请，访问法国INRIA进行合作交流访问。近年来，已完成论文近70余篇,
  其成果发表在IEEE TVCG、ACM GM、ACM TOMM和CGF等国际顶级学术期刊，以及计算学报、软件学报等国内权威学术期刊。他的多篇论文被SCI/EI收录，并获得了较高的文献引用率，其中有三篇早期论文分别获得超过百次的他引，成为图形学中的经典工作。他荣获了包括教育部科技一等奖，ChinaGraph最佳论文奖、韩国CAD协会年度大奖等数个学术奖项。

  他具有扎实的数学和计算机图形理论基础，早期的主要研究兴趣为几何计算和可视计算，目前进一步开展了云计算、区块链以及人工智能等交叉领域的研究。最近他主要在从事大数据可视化方面的研究，对于城市高维异构数据如何有效处理和交互呈现，提出了一系列原创性方法。

  主要工作亮点包括：

  首创渲染云技术

  。在2010年至2015年期间，他主导研制的渲染云系统是阿里云历史上第一个实际商用的云平台系统，获得阿里巴巴王坚院士的高度评价和认可，后续该技术发展为阿里云批量计算服务。

  研发浙大研究生院业务系统

  。他带领团队历时三年研发的“浙江大学研究生信息系统”（

  http://grs.zju.edu.cn

  ）已成为浙江大学教务系统核心板块，顺畅服务于浙大近8万师生。

  研发建筑图纸识别关键技术

  。2015年至今，他与华为相关的研发团队合作，研发了用于5G信号覆盖计算的多项建筑图纸识别关键技术。

  除此以外，早期还主持或参与了商用电子邮件系统以及钢铁厂高炉可视化工程等多个实际项目。他

  是中国计算机学会（CCF）高级会员和浙江数字经济学会的理事，参与区块链相关标准制定。

  近年来，他作为负责人或主要成员参加国家面上项目和重点项目，以及国家973计划项目多项。他具有丰富的实际项目研究、开发和组织经验。最近他正致力于云计算与区块链等相关关键技术研究、开发与产品化工作，引领业界主流。

  欢迎有志于从事图形学、可视化与人工智能交叉性研发同学报考本组硕士和博士研究生。

  更多详细信息参见

  http://www.cad.zju.edu.cn/home/zhx'
