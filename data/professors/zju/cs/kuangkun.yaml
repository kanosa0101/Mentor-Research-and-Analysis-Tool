bio_raw: '况琨，

  浙江大学人工智能学院副教授，博士生导师，人工智能系副主任。主要研究方向为因果推理、数据挖掘、因果可信学习和智慧司法。在Cell Patterns, TPAMI,
  TKDE, ICML, NeurIPS, KDD等相关领域顶级期刊及会议上发表论文100余篇。作为项目/ 课题负责人承担国家重点研发专项、国家自然科学基金等项目，曾获ACM
  SIGAI中国新星奖，教育部、浙江省、中国人工智能学会和中国电子学会科技进步一等奖，中国图象图形学学会自然科学一等奖，浙江省教学成果特等奖等奖励。

  个人主页：

  https://kunkuang.github.io/'
