bio_raw: '陈华钧

  ，

  浙江大学求是特聘教授

  ，主要研究方向为

  人工智能、知识图谱、自然语言处理、AI for Science

  等，牵头发起中文开放知识图谱

  OpenKG

  ，以一作或通讯作者在

  Nature Machine Intelligence

  、

  Nature Biotechnology

  、

  Nature Computational Science

  ,  Nature Communications、

  ICLR、ICML、

  NeurIPS、IJCAI、AAAI、ACL、EMNLP、WWW、SIGIR、KDD、VLDB、Proceeding of IEEE、ACM Computing
  Survey、

  National Science Review

  等国际顶会顶刊上发表多篇论文。担任浙江省数智科技研究会副会长，中国人工智能学会知识工程专委会副主任，中国中文信息学会语言与知识计算专委会副主任。入选浙江省有突出贡献中青年专家，浙江省高层次人才特殊支持计划科技创新领军人才，斯坦福全球前2%顶尖科学家终身榜单（人工智能领域）。作为项目负责人及首席科学家主持科技部创新2030“

  新一代人工智能

  ”国家科技重大专项“

  知识增强的科学具身智能体平台及应用

  ”重大项目，并主持负责国家自然科学基金委重大研究计划重点项目、国家自然科学基金联合基金重点项目及多项重大企业合作项目。牵头或作为核心骨干获得省部及国家级科技奖5项，及浙江大学首届优秀教材奖一等奖、中国工信传媒出版集团优秀出版物一等奖等教材专著类奖。

  本团队长期招聘浙江大学

  百人计划 研究员、求是博士

  后、研发工程师等各类专职研究人员，有意者烦请邮件联系。

  学术服务

  浙江省数智科技研究会 副会长 （2022 - 今）

  中国人工智能学会知识工程专委会 副主任 （2018-2023）

  中国中文信息学会语言与知识计算专委会 副主任 （2016 - 今）

  中国中医药信息数字化分会 副会长 （2025- 今）

  浙江省大数据智能计算重点实验室 副主任 （2015 - 今）

  新华社媒体融合全国重点实验室 学术委员会委员 （2020 - 2025）

  Elsevier Big Data Research Journal (JCR Q1)  Editor in Chief （2019-2024）

  Data Intelligence Journal (MIT Press).  Advisory Board（2024 - 今）

  IEEE Computer Society Big Data STC.  Advisory Committee （2017 - 今）

  奖励荣誉

  浙江省有突出贡献中青年专家（2022）

  浙江省高层次人才特殊支持计划科技创新领军人才（2022）

  浙江省科学技术进步奖二等奖（排1，2023）：多图谱融合的电力知识大脑关键技术及应用

  浙江省科学技术进步奖二等奖（排1，2021）：面向数字商务的知识图谱构建与处理技术及产业化应用

  中国中文信息学会钱伟长科技奖一等奖（排2，2020）：千亿级商品知识图谱构建

  教育部高等学校科学技术奖技术发明一等奖（排3，2014）：基于语义图的知识服务平台及中医药应用

  阿里巴巴优秀学术合作奖：藏经阁知识图谱（2019）、多模态商品知识图谱（2022）

  深圳市科技进步一等奖（2022）、华为优秀技术合作项目奖（2022）：华为自动驾驶网络创新及产业化（ADN故障诊断知识图谱）

  《知识图谱导论》：

  “高被引图书TOP1%（2019-2023）”榜单、浙江大学首届优秀教材奖一等奖（2023）、电子工业出版社优秀作者（2021）

  《知识图谱：方法、实践与应用》：

  中国工信出版传媒集团优秀出版物一等奖（2020）、博文视点最具震撼力图书大奖（2019）

  中国计算机大会优秀论坛 ：知识图谱赋能数字经济（2018）、知识图谱赋能数字化转型（2021）、“知识图谱+语言模型”赋能通用AI（2023）

  国际语义网大会ISWC最佳论文奖（2006）、国际知识图谱联合会议IJCKG最佳论文奖（2021）、全国知识图谱大会CCKS最佳论文奖（2021）'
