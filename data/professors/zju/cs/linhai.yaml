bio_raw: '浙江大学

  CAD&CG

  国家重点实验室教授

  /

  博士生导师

  。

  多年来一直从事计算电磁学、计算机图形学、科学计算可视化等方面的研究。

  作为项目负责人承担国家自然科学基金项目四项，国家

  863

  高技术项目三项。曾于

  2000

  年

  9

  月赴英国

  De Montfort

  大学计算机系进行访问研究，参加了欧盟第五框架的项目

  VAKHUM

  和

  MultiMod

  的研究。

  林海作为项目负责人完成了国家

  863

  高技术项目“目标与环境电磁特性建模仿真软件系统（

  2002AA135020

  ）”，在此基础上，开发了具有自主知识产权的工业应用级目标与环境散射特性分析软件——电磁散射估算系统

  emX

  ，开发了基于

  MPI

  的高性能并行计算版本，包含了几何处理、目标散射场估算、电磁分析与目标成像、数据可视化等功能，具有友好的人机交互界面。目前已经实现高频电磁散射计算方法，包括几何光学法、物理光学法、等效电磁流法、图形电磁计算法、弹跳射线法、截断

  -

  增量长度绕射系数等，完成了基于光柱跟踪技术的快速精确的电磁波传播路径计算，同时也完成了基于

  CPU/GPU

  的异构并行环境的弹跳射线法和矩量法，有机地结合了计算机图形学、电磁场数值计算方法和并行计算。

  林海领导的课题组在科学计算可视化、信息可视化、面向领域的可视分析等方面取得了一系列重要研究成果。在研究面向领域的可视计算分析方面，提出了影像和数据的高效分割、分析和高效交互可视化等方法，自主研发了通用可视化计算平台，开展了在气象和地质领域海量复杂数据对象的属性分析。在可视化研究开发上与国内外的研究机构开展了的广泛合作，为埃克森美孚公司成功开发了河道仿真的地质可视化工具软件；在前期的国家科技计划项目和国家重点实验室自主研究课题中已先后开展了有关面向气象和地质体数据的可视分析系统、大型空间数据库管理、高性能空间分析、三维地理信息管理与可视化等方面的研究。'
