bio_raw: '潘之杰：男，博士，现任浙江大学智能汽车研究中心主任。主要从事计算机科学和汽车的交叉学科的研究，在智能电动车底盘线控技术、智能驾驶、无人系统、智慧城市智慧交通等领域提出了一系列新概念，并联手互联网物联网大数据云处理，推进其快速发展。在国内外杂志

  IEEE

  、

  SAE

  、

  JSAE

  等发表论文

  90

  余篇，拥有专利

  100

  余项，多次担任国际学术与技术交流会发表主题演讲。曾获“中国汽车工业科学技术奖一等奖”，“中国质量评价协会科技创新奖一等奖”，“全国工商联科学技术进步奖一等奖”，“浙江省科学技术奖一等奖”。'
