bio_raw: '浙江大学求是特聘教授、博导，入选2021年度国家高层次人才奖励计划,IEEE Fellow。分别于浙江大学、上海交通大学、新加坡国立大学获得学士、硕士、博士学位。2004–2006年在意法半导体公司担任研发工程师，2006–2008年于澳大利亚昆士兰大学脑科学研究所从事博士后研究，2008-2015年于新加坡科技研究局资讯通信研究院担任认知计算和机器人认知实验室主任，2014年起担任四川大学类脑计算研究中心主任。主要研究领域为类脑计算、神经形态计算与芯片、智能机器人等。主持科技部科技创新2030-“新一代人工智能”重大项目、

  国家自然科学基金重点、

  新加坡科技研究局等多个国家级项目。研究成果被国际科技媒体MIT Technology Review，Communicaitons of ACM, Science
  Daily等报道。研究成果获2012国际机器智能比赛第二名、2017年全国大学生类脑计算大赛特等奖、2016 IEEE Trans. On Neural Networks
  and Leanring Systems Outstanding Paper Award、2019 IEEE Com

  putational Intelligence Magazine Outstanding Paper Award、 2023 Neural Networks Best
  Paper Award等SCI一区期刊优秀论文奖等荣誉。获得2011 Institute for Infocomm Resarch (ASTAR, Singapore)
  Role Model Award, 2024 APNNS Outstanding Achievement Award 等荣誉。

  目前担任

  IEEE Transactions on Cognitive and Developmental Systems主编

  。

  学术服务：

  IEEE Trans. on Cognitive and Developmental Systems

  主编

  (Edior-In-Chief),2022-

  （期刊网址：

  https://cis.ieee.org/publications/t-cognitive-and-developmental-systems

  ）

  Neural Networks编委（Associate Editor）,2020-

  IEEE Trans. on Cognitive and Developmental Systems 编委（Associate Editor）,2016-2021

  IEEE Trans. On Neural Networks and Leanring Systems 编委（Associate Editor）,2012-2018

  Frontiers in Neuromorphic Engine

  ering 编委（

