bio_raw: 袁昕博士，1995年获浙江大学机械系机械制造专业的学士学位。1998年获浙江大学光仪系测试计量仪器技术及应用专业的硕士学位。2002年获浙江大学计算机系计算机应用专业的博士学位。同年赴香港科技大学从事医学图像的博士后研究。2004年任教于浙江大学计算机学院。研究方向是医学图像处理。已在国内外学术期刊和会议上发表论文20篇，其中EI收录7篇，SCI收录4篇。
