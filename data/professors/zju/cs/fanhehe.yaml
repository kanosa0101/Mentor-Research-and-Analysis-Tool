bio_raw: '范鹤鹤，浙江大学人工智能学院百人计划研究员。主要研究方向聚焦于人工智能前沿理论与交叉应用，涵盖计算机视觉、大语言模型、具身智能以及AI for
  Science。

  核心研究领域：

  具身智能系统层级架构

  ：

  针对通用具身智能，重点研发具身编译器、具身指令集架构以及具身动作执行器，构建软硬件解耦的系统级统一框架。

  “自由”智能体

  ：

  探索智能体在无显式任务指令下的自主目标生成、环境主动探索与持续学习机制（可以给自己找事情做的高阶智能体）。

  3D/4D场景理解与生成：

  推进人工智能在复杂、动态三维与四维物理空间中的多模态感知、三维重建与场景生成技术。

  AI 赋能药物与材料设计：

  依托大模型与分子级科学计算框架，加速新型分子结构设计、化学逆合成规划以及功能性材料与药物的智能筛选。

  招生与招聘：

  课题组长期招收博士后研究员、助理研究员，以及博士和硕士研究生。欢迎对上述研究方向抱有高度热情、具有扎实基础的优秀学者与同学邮件联系，加入相关科研项目。

  招生信息请参考 https://hehefan.github.io

  https://scholar.google.com/citations?hl=en&user=hVuflMQAAAAJ'
