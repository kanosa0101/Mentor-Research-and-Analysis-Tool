  （2023年，全国2人）、

  Intel中国学术英才

  （2023年，全国6人）、澳大利亚研究理事会（Australian Research Council，ARC）

  优秀青年基金

  （Discovery Early Career Researcher Award，DECRA）（2022年）、

  科睿唯安全球高被引科学家

  （2023、2024

  、2025

  年）、斯坦福大学“

  全球前 2% 顶尖科学家

  ”（2022、2023、2024

  、2025

  年）、

  Elsevier高被引中国学者

  （2020、2021、2022、2023

  、2024

  年）、

  世界人工智能大会优秀青年论文奖

