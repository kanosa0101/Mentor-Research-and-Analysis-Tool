bio_raw: '王文冠现任浙江大学计算机学院

  百人计划研究员

  ，博士生导师，

  国家优秀青年基金（海外）获得者

  ，IEEE Senior Member。

  2022-2023，

  任悉尼科技大学（University of Technology Sydney）

  讲师/助理教授

  （Lecturer），获

  澳洲优秀青年基金

  （DECRA）

  。

  2020

  ∼

  2022年，在苏黎世联邦理工学院（ETH Zurich）任

  博后

  研究员

  （Research Fellow）。2018

  ∼

  2019 年，先后任起源人工智能研究院（IIAI）

  研究员

  （Research Scientist）和

  资深研究员

  （Senior

  Scientist

  ）。

  2016-2018年，在加州大学洛杉矶分校（UCLA）访学。

  2018年获北京理工大学博士学位。

  指导学生获得国自然博士生基金、国家奖学金、中国科协博士生青托、竺可桢奖学金。

  长期

  招收博士后/博士/硕士/访问学生！

  欢迎本科生同学加入实验室开展科研训练或参加各类国家级大创项目

  ！

  研究方向：

  具身人工智能（Embodied AI），AI for Science

  ，

  神经-符号计算（Neuro-Symbolic Computi

  n

  g）等。

  学术成果：

  在顶级期刊及会议（如Nature Communications

  ，Cell Innovation，

  IEEE TPAMI，IJCV，ICLR，NeurIPS，CVPR，ICCV，ECCV，AAAI，SIGGRAPH Asia，ACMMM）发表学术论文

  120余篇

  。谷歌学术引用3万余次，H-index

  90

  。

  荣誉奖励：

  曾获

  《福布斯》

  中国青年海归菁英 100 人（2025年）、

  《麻省理工科技评论》

  中国AI100青年先锋（2025年）、

  青橙

  奖

  （2024年，全国15人）、

