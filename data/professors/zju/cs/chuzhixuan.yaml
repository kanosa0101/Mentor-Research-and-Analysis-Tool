bio_raw: '浙江大学百人计划研究员

  /

  博导，博士毕业于美国佐治亚大学，曾任职于阿里巴巴、蚂蚁集团。研究方向聚焦于安全可信大模型，以及大语言模型、多模态大模型在垂域场景中的安全可信应用。研究领域涵盖大模型的安全性、可解释性、公平性和因果性等关键问题，并致力于探索

  AI

  系统的伦理和价值观对齐，推动

  AI

  负责任发展。在人工智能、数据挖掘和数据库领域的顶级期刊和会议上发表

  50

  余篇论文，包括CCS、

  NeurIPS

  、

  ICLR

  、

  IJCAI

  、

  AAAI

  、

  ACL

  、

  KDD

  、

  ICDE

  、

  CIKM

  、

  TKDD

  、

  TNNLS

  等。多次担任国际顶级会议程序委员会委员和领域主席，并组织主持学术

  tutorials

  和

  workshops

  。'
