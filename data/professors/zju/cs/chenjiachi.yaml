bio_raw: '浙江大学计算机科学与技术学院，

  “百人计划”研究员。曾任中山大学软件工程学院副教授。博士毕业于澳大利亚莫纳什大学

  。主要研究领域为

  软件可靠性，

  在

  ICSE、

  FSE、ASE、

  ISSTA、

  TSE、TOSEM

  等软件工程领域高质量会议和期刊上发表论文

  70余

  篇，

  以第一/通讯作者

  4

  次获

  ACM SIGSOFT Distinguished Paper Award，

  包括

  CCF A类会议ICSE,ISSTA等。根据CSRanking榜单，

  2023-202

  5在软件工程领域排名

  全球第

  22位。

  入选

  Top 2%科学家榜单、2025年度中国电子学会“青年人才托举工程”、2025赋能中国区块链创新人物“区块链60人”，获得2025 CCF科技成果奖自然科学二等奖。

  主要研究兴趣

  ：智能合约可靠性、区块链数据分析、大模型技术与应用、程序分析、经验软件工程、软件仓库挖掘'
