  2023年12月 浙江省科技进步一等奖

  2024年10月 国家级教学名师

  2024年12月 霍英东教育基金会高等院校教育教学二等奖

  2025年12月 浙江省科技进步一等奖

  主要研究方向：

  计算机体系结构与系统软件（

  FPGA

  、软硬件协同、操作系统、虚拟化等），智能计算（大数据、云端边协同计算、人工智能、异构算力融合，大模型等），网络空间安全（隐私计算、多方安全、区块链等），智能教育（教育技术、教育数字化、

  AI for Education等

  ）。

  承担国家级科技项目20多项、横向重大项目几十项。

