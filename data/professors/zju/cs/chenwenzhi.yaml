  等国际高水平学术期刊或会议发表论文100多篇，获得国家发明专利授权50多项。研制的工控系统全生命周期内生安全主动防御大平台获2021年浙江省科技进步一等奖，研制的云网端新型融合计算架构及应用获2023年浙江省科技进步一等奖，研制的数据要素密态计算关键技术及应用获2025年浙江省科技进步一等奖。

  主要教学工作：

  担任《嵌入式系统》、《操作系统》、《计算机体系结构》、《高级计算机体系结构》、《深度学习——理论与实践》、《软件工程》、《SoC综合设计》等本科生和研究生博士生骨干课程的主讲老师，承担国家级省部级以上教学改革建设项目10多项，出版“十一五”和“十二五”国家级规划教材、重点教材等10多部，是国家级精品课程和国家级精品资源共享课程《嵌入式系统》负责人。

  牵头提出并践行了“系统能力培养”教学理念，构建了“基于软硬件课程贯通和分级分层次的系统能力培养创新体系”，获2018年国家级教学成果二等奖；牵头打造“学在浙大”“智云课堂”“研在浙大”“浙大先生”等典型案例，构建了“数智驱动的以学生成长为中心的全链路一体化的创新教学支撑平台”，荣获2023年国家级教学成果二等奖。

  高校信息化数字化智能化：

  近年来在教育技术、智能教育、异构算力构建等领域深入研究，致力于高校数字化改革探索和实践，在建设“网上浙大”过程中，协同相关部门和学院一起打造“浙大云计算”众筹式混合云、“浙大钉”智慧校园应用、“学在浙大”和“智云课堂”智能学习平台、“研在浙

  大”科研平台、“西湖之光”启真算力中心、“浙大先生”智能体平台等典型案

  例。'
