bio_raw: '陈文智，男，

  国家级高层次人才，

  浙江大学求是特聘教授，

  计算机和教育技术双博士生导师

  。现任浙江大学信息学部副主任，曾任浙江大学计算机学院副院长、浙江大学信息技术中心主任。

  教育部教育技术与人工智能教学指导分委员会副主任，浙江省高等学校信息化教学指导委员会主任，浙江省高教学会教育技术专委会理事长，浙江省计算机学会教育信息化专委会主任，浙江省卫生信息学会云计算专委会主任，担任多个学术期刊审稿专家，多个国际会议程序委员会委员。

  ARCLab实验室主任、

  “浙江大学——苹果公司”教育科技创新中心主任、

  “浙江大学——阿里巴巴”智云联合研究中心主任、AZFT智能计算系统实验室主任、“浙江大学——蚂蚁金服”金融科技研究中心联合主任、“浙江大学——安恒信息”前沿技术联合研究中心主任。

  主要获奖情况：

  获得

  国家级教学成果二等奖2项（均排名第1）、浙江省教学成果一等奖2项（均排名第1）、

  浙江省科技进步一等奖4项、浙江省科技进步二等奖1项。

  获得全国宝钢优秀教师奖、浙江大学永平教学贡献奖、浙江省教学名师、霍英东教育教学奖、国家级教学名师等荣誉称号。

  2007年1月 浙江省科技进步一等奖

  2013年11月 全国宝钢优秀教师奖

  2014年1月 浙江省科技进步二等奖

  2016年11月 浙江省教学成果一等奖（排名第1）

  2018年12月 国家级教学成果二等奖（排名第1 ）

  2020年9月 浙江大学永平教学贡献奖

  2021年1月 浙江省科技进步一等奖

  2021年1月 浙江省教学名师

  2022年1月 浙江省教学成果一等奖（排名第1）

  2023

  年7月 国家级教学成果二等奖（排名第

  1

