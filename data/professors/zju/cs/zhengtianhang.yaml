bio_raw: '郑天航，百人计划研究员

  /

  博导/国家优秀青年科学基金（海外）项目获得者。郑天航研究员致力于人工智能多维度攻防的研究。在人工智能安全领域，他近五年发表20篇左右论文，以第一作者发表7篇CCF-A长文。这些论文分别发表于
  TDSC、CCS、NDSS、ICML、TIFS、AAAI、ICCV、IJCAI、INFOCOM、UAI、EMNLP、MLSys 等会议期刊。根据谷歌学术搜索（Google
  Scholar），他的研究工作被引用超2000次。此外，他主持了国自然面上项目等多项国家级/省部级项目课题，他还担任了 IEEE TCSVT的编委与人工智能顶会
  ICML 和NeurIPS 的领域主席。'
