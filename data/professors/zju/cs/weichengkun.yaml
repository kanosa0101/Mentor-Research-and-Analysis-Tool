bio_raw: '魏成坤，浙江大学，“百人计划”研究员，计算机科学与技术学院，博士生导师，启真优秀青年学者。研究方向涵盖人工智能安全、数据隐私保护、可信计算、云网络软硬件协同系统架构。以第一

  /

  通讯作者在

  NDSS

  、

  CCS

  、

  USENIX Security

  、

  TIFS

  、

  TDSC

  、

  SIGCOMM

  、

  HPCA

  、

  ATC

  、

  ACL

  等

  CCF-A

  类国际顶会

  /

  期刊发表高水平论文

  20

  余篇，代表成果包括大模型内容检测攻击技术

  GradEscape

  、数据隐私训练架构

  DC-SGD

  、模型后门防御系统

  LMSanitator

  、云网络虚拟交换机架构

  Achelous

  等。

  主持国家自然科学基金、宁波市重点研发计划、浙江省博士后择优资助、

  CCF-

  蚂蚁科研基金、阿里云项目等。获“浙江省科技进步一等奖”、“

  NDSS 2024

  最佳论文奖

  ”

  、

  NeurIPS 2024

  大模型隐私挑战赛攻防双料冠军等荣誉，研究成果在企业和开源项目中得到广泛应用。

  欢迎博士/硕士/本科生，对数据安全（大模型安全）、高性能网络（软硬协同优化）、异构计算（FPGA、GPU）、系统结构（虚拟化、可信执行环境）等感兴趣的同学加入。

  招生要求：

  较好的编程能力、对未知领域有探索精神

  有自己喜欢的运动，并长期坚持

  Email：

  weichengkun@zju.edu.cn'
