bio_raw: 蒋家鑫，浙江大学百人计划研究员、博士生导师。本科毕业于山东大学，博士毕业于香港浸会大学，曾任新加坡国立大学计算机学院高级研究员。主要研究方向包括高性能图计算、动态图分析、图增强智能体与金融图智能。长期从事大规模图数据管理与分析研究，相关成果发表在
  SIGMOD、VLDB、ICDE、TKDE、WWW 等数据库与数据管理领域重要会议和期刊，发表论文近 30 篇。曾获 SIGMOD 最佳论文奖、VLDB 最佳系统演示奖、SIGMOD
  Record 研究亮点奖等荣誉。
