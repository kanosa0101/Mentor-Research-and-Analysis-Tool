bio_raw: '吴强（润松）

  1977年 生于福建长汀，祖籍福建莆田。

  2000年 中国美术学院国画系山水专业本科毕业，获学士学位。

  2005年 中国美术学院国画系山水专业研究生毕业，获硕士学位。

  2005年至今 浙江大学人文学院艺术系副教授,硕士研究生导师.'
