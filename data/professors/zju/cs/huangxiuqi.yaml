bio_raw: '黄修齐，博士，浙江大学计算机辅助设计与图形系统全国重点实验室专职研究员，是可视分析（

  ZJUVAI

  ）小组一员，在

  陈为

  教授的指导下开展工作。2024年6月于上海交通大学计算机科学与工程系获得工学博士学位，师从陈贵海教授、高晓沨教授。研究方向为分布式系统的数据管理与性能优化，在ACM/IEEE
  TON、IEEE TVCG、VLDB、ICDE、KDD、ICWS、DASFAA等国际顶尖期刊和会议发表10余篇论文。

  最近的研究兴趣包括：大模型时代的算力基础设施（数据存储改进、数据供给加速、资源扩缩调度、训练推理优化）、多模态模型的垂直领域应用（智慧医疗、可解释）。目前，我正在积极招收博士研究生与硕士研究生加入浙江大学可视分析小组，由陈为老师共同指导。欢迎有充分自驱力、有扎实基础的同学加入我们，并欢迎实习生，可提交申请至

  VAI简历投递

  。'
