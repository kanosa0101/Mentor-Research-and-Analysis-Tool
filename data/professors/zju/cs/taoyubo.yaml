bio_raw: '陶煜波，浙江大学计算机学院CAD&CG国家重点实验室副教授。于2003年、2009年分别获得浙江大学计算机科学与技术学士、博士学位。之后在浙江大学进行博士后研究。2010至2012年在英国贝德福德大学(University
  of Bedfordshire)作为博士后从事生物医学可视化的研究。2012年9月进入浙江大学计算机学院CAD&CG国家重点实验室工作，作为项目负责人已承担国家自然科学基金青年基金项目2项。

  研究方向是科学计算可视化、可视分析和电磁计算。已发表相关学术论文30余篇，包括IEEE Trans. on Visualization and Computer
  Graphics, IEEE Trans. on Image Processing, IEEE Trans. on Antennas and Propagation等本领域顶级期刊。截止2013年2月，发表论文被国际同行引用110余次。多次受邀参加国际学术期刊和会议的评审工作。'
