bio_raw: 杨坤 (1975.11-)，男，求是特聘教授，博士、博导。现任浙江大学环境与资源学院院长、污染环境修复与生态健康教育部重点实验室副主任。国家优秀青年科学基金获得者,
  入选国家万人计划科技领军人才、科技部中青年科技创新领军人才、教育部“新世纪优秀人才”、浙江省“151人才”、国家环境保护专业技术青年拔尖人才和"南太湖精英计划"领军型创新团队负责人，获1项国家自然科学二等奖、5项省部级科技奖励、中国环境科学学会青年科技奖、“Scopus
  未来科学之星”环境科学领域银奖和全国百篇优秀博士论文提名奖。2004年6月于浙江大学环境科学系获博士学位。2005年5月至2006年5月在美国麻州大学进行博士后研究工作。2008年4月至2010年4月在美国麻州大学进行访问研究。2010年12月晋升为教授。主要从事污染土壤修复、环境纳米材料、吸附材料与技术、环境界面行为等方面研究工作。至今,已在Chem.
  Rev.、Nat.Commun.、Angew、Environ. Sci. Technol.、Water Res.等国内外著名学术刊物上发表论文150多篇，已被SCI论文引用超过8000次；获10项国家发明专利授权；参加编写出版《环境纳米科学与技术》等6本专著/教材。兼任J.
  Zhejiang Univ.-Sci. A 副主编和《环境化学》编委等职。
