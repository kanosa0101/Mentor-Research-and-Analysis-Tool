bio_raw: '1989，1992毕业于西安交通大学，获自动控制专业学士和硕士学位，1996年3月毕业于西安电子科技大学，获信号处理专业博士学位，1996-1998年在西北工业大学计算机系从事博士后研究，1998年进入浙江大学计算机学院，2002年晋升教授，2003年聘为博士生导师。连续多年入选斯坦福2%顶尖科学家榜单（“终生科学影响力”和“年度科学影响力”）。

  现任“IEEE Journal of Selected Topics in Applied Earth Observations and Remote Sensing”
  副主编，“哈尔滨工业大学学报”、“计算机工程”、“信息融合学报”等杂志编委。

  中国电子学会信号处理分会委员，中国航空学会信息融合分会委员，中国体视学学会图像分析分会委员

  。主持国家自然科学基金7项，国家重点研发计划2项，发表学术论文200余篇（H-index 41, Google引用6800余次）。

  主要从事人工智能、数据挖掘、机器学习、信号处理研究。

  1992.09–1996.03 博士生,西安电子科技大学,信号与信息处理专业博士学位

  1989.09–1992.06 硕士生,西安交通大学,模式识别专业硕士学位

  1985.09–1989.06 本科生,西安交通大学,自动控制专业学士学位

  2002.12–至今 教授（2002）,博士生导师（2003年）,浙江大学计算机学院

  1998.04–2002.11 副教授,浙江大学计算机学院

  1996.04–1998.03 博士后,西北工业大学

  1999.08–2000.10 客座研究员,加拿大Concordia University

  2001.02–2001.08 客座教授,香港浸会大学

  2006.03–2007.01 客座教授,美国Carnegie Mellon University

  2010.07–2010.09 客座教授,澳大利亚National ICT Australia

  2015.10–2015.12 客座教授,澳门大学

  2016.03–2016.09 客座教授,澳大利亚Griffith University

  2017.10–2017.12 客座教授,澳门大学

  2018.10–2018.11 客座教授,澳大利亚Griffith University'
