bio_raw: '王新宇教授，浙江大学计算机系博士，博士生导师，主要从事软件分析、智能

  软件工程等方向的研究。近年来发表论文CCF A、CCF B类论文30余篇，作为负责人承担国家自然科学基金、重点研发计划等国家级课题7项，省部级课题4项，产业合作课题20余项，获得教育部科技进步一等奖1项，中国电子学会科技进步特等奖1项。提出一系列软件质量检测模型与程序测试算法，多项成果发表在TSE、ICSE等Top刊物/会议。首次提出了动态符号测试领域的最优化策略，获得ICSE
  2018杰出论文奖；提出一系列基于软件仓库挖掘的缺陷检测及程序文档自动化等新方法，多项成果发表在TSE、ASE等Top刊物/会议。为提交日志自动化生成领域建立了新基线，获得ASE
  2018杰出论文奖

  。

  2019.01至今

  博士生导师，教授 浙江大学计算机科学与技术学院

  2017.09-2019.01

