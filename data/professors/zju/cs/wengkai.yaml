bio_raw: '2018年入选中国高校计算机专业优秀教师奖励计划，曾获国家教学成果一等奖、二等奖各1项，浙江省教学成果一等奖2项，获2018年度浙江大学永平杰出教学贡献奖。

  在中国大学

  MOOC

  开设了

  C

  语言程序设计、

  Java

  语言程序设计等课程，是目前选课人数最多、最活跃的课程之一，是累计选课人数最多的教师之一，累计选课人次

  300

  余万，单次选课最高

  28

  万人，其中两门课程被认定为国家精品在线开放课程。

  主要研究方向

  嵌入式

  嵌入式实时操作系统：包括RTOS基础理论和实现，构件化RTOS和组件远程动态更新，协程在RTOS中的应用

  嵌入式系统评测：对嵌入式系统，包括操作系统和应用系统的功能、性能、能耗等的评测设计

  嵌入式系统应用：在工农业生产中的嵌入式产品开发

  嵌入式并行计算：SIMD在嵌入式上的编程支持，使用FPGA实现的神经网络加速

  传感网应用：使用WSN的室内定位研究，使用LoRa、ZigBEE、APRS等方式的传感网部署和应用

  编程语言

  新的语法结构的分析与比较研究，尤其关注针对并行和新的指令体系提供高级语言支持的问题

  编程语言在浏览器中的解释执行

  计算机教育

  尤其关注K-12编程教育，包括方法和工具'
