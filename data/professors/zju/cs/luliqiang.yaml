bio_raw: '长期招收保研/考研的博士生、硕士生，招收本科生加入实验室完成毕业设计。同时招收学术能力优秀、对量子计算感兴趣的博士后，并提供具有竞争力的薪酬（年薪不低于40万）及教职机会。

  欢迎积极上进、自我驱动力强、对科研感兴趣的同学与我联系：liqianglu@zju.edu.cn

  卢丽强，2022年6月加入浙江大学，担任百人计划研究员，博士生导师。本科毕业于北京大学信息科学技术学院，博士毕业于北京大学计算机学院。研究方向为量子计算机体系结构、量子计算交叉应用、人工智能芯片、软硬件协同设计等。入选全球前2%顶尖科学家榜单（

  美国斯坦福大学与爱思唯尔数据库发布

  ），近五年以一作/通讯作者身份发表50余篇体系结构领域、EDA领域论文，包括ISCA、MICRO、HPCA、ASPLOS、DAC、ICCAD、IEEE Micro等，并在MICRO
  2021、ASPLOS 2024、HPCA 2025、ISCA 2026

  做tutorial报告

  。曾担任浙江省科技厅智能计算、量子科技专项专家组专家，担任ISCA、HPCA、MICRO、ICCAD、DAC

  等会议TPC、FCS期刊青年编委

  。主持国家重点研发计划-青年科学家项目、国家自然科学基金委面上项目、浙江省杰青、浙江省科技厅重点研发计划-尖兵项目，与华为计算产品线、华为2012实验室、字节Seed部门、中国移动、中国工行、杭氧集团等企业开展深度合作。

  曾获得CCF体系结构青年科技奖、ACM SIGOPS 中国新星奖、北京大学优博、华为火花奖、浙江大学启真优秀青年、

  全球可持续发展青年

  等荣誉。于

  2022

  年

  7

  月发布了基于浙江大学自研天目量子芯片的全栈式量子计算云平台

  ——

  太元一号量子云平台

  ，集成了可视化编程框架、量子编译工具链、量子操作系统等核心组件。

  个人主页：

  https://liqianglu-zju.github.io/

  实验室团队：

  先进计算与新兴软件实验室（ACES，Advanced Computing and Emerging Software），详情请见ACES实验室公众号'
