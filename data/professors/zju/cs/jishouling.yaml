bio_raw: '纪守领，浙江大学长聘教授/求是特聘教授、博士生导师，可信人工智能研究中心主任，

  获美国佐治亚理工学院电子与计算机工程博士学位、佐治亚州立大学计算机科学博士，

  入选教育部长江学者（2022年度）、高层次科技创新人才（2022年度）、国家青年特聘专家（2017年度）

  。获网络系统安全四大顶会IEEE S&P 2025杰出论文奖、ACM CCS 2021最佳论文奖等10项最佳/优秀论文奖、

  全球黑客大会Pwnie Awards最具创新研究奖提名、

  爱思唯尔(Elsevier) “中国高被引学者” (Highly Cited Chinese Researchers) 、

  GSU杰出研究奖、ELSEVIER高引论文奖、

  中国国家优秀自费留学生奖、浙江大学“个推”青年创新奖、华为优秀技术成果奖、

  浙江大学先进工作者等奖励或荣誉称号。

  纪守领教授致力于人工智能安全、

  软件与系统安全、

  数据驱动安全、大数据分析等领域的研究。先后主持

  国家重点研发计划项目、

  国家自然科学基金重点项目、面上项目、浙江省自然科学基金杰青项目、浙江省重点研发计划“网络空间安全”重点专项、CCF-腾讯“犀牛鸟”科研基金、CCF-绿盟“鲲鹏”科研基金、CCF-启明星辰“鸿雁”科研基金、华为科研基金、阿里巴巴科研基金、蚂蚁金服科研基金等多项，作为技术负责人或项目骨干，参加美国NSF项目8项。发表CCF
  A类论文100余篇，出版英文专编著4部。

  招生信息

  ：

  ZJU NESA LAB 2027/2026级有3-4个博士名额、3-4个硕士名额，研究方向：可信人工智能（算法能力强者优先）、软件与系统安全（代码能力强者优先），欢迎申请！欢迎参加浙江大学计算机学院年夏令营！

