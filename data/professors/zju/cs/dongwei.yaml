bio_raw: '董玮，浙江大学计算机科学与技术学院教授、博导，教育部“长江学者奖励计划”特聘教授。现任计算机科学与技术学院副院长、浙江大学人工智能教育教学研究中心主任，

  曾任浙江大学

  信息技术中心副主任。

  2005年、2011年获浙江大学计算机科学与技术专业学士和博士学位，2012年2月留校工作，并分别于2012年底、2016年底被评为副教授、教授。中国计算机学会(CCF)杰出会员，ACM中国SIGMOBILE副主席，CCF物联网专委、CCF互联网专委、CCF分布式计算与系统专委执行委员、浙江省计算机学会嵌入式与物联网技术专委秘书长。

  曾获全国优博论文提名、CCF-Intel青年学者提升计划、浙江省杰出青年基金、浙江省

  高层次人才特殊支持计划青年拔尖人才

  、国家高层次人才特殊支持计划青年拔尖人才

  。

  主要研究方向包括具身智能物联网、边缘智能与算力网络、物联网数据安全等。主持与

  承担

  国家重点研发计划课题、

  国家自然科学基金、

  浙江省自然科学基金重大项目、浙江省重大研发计划

  等国家和省部级项目20多项。在ACM MobiCom、MobiSys、SenSys、UbiComp/IMWUT、CCS、USENIX NSDI、IEEE INFOCOM等著名国际会议以及IEEE/ACM
  Trans on Networking、IEEE Trans on Mobile Computing等著名国际期刊上发表论文200余篇，其中CCF A类及

  IEEE/ACM Trans

  论文100余篇。多次担任国际知名学术会议组委会成员、程序委员会委员。授权发明专利30余项，主编工信部/浙江省十四五规划教材1部（《从创意到原型：物联网应用快速开发》）、十四五国家重点出版物出版规划著作1部

  。

  以第一完成人，获2023年浙江省科技进步一等奖、2025年中国计算机学会技术发明二等奖、2021年中国计算机学会科技进步杰出奖。

  指导多位博士生获CCF优秀博士论文激励计划、国家自然科学基金博士生基金、

  华为天才少年计划

  等。

  个人主页

  ：

  https://dongw.emnets.cn'
