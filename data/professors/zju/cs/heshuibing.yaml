bio_raw: "何水兵，浙江大学计算机学院长聘教授、博士生导师，国家重点研发计划项目首席科学家，浙江省大数据智能计算重点实验室副主任，浙江大学智能存算系统实验室主任，\n\
  浙江大学计算机学院系统结构与脑机工程研究所副所长，浙江省工程师学会副理事长。曾任\n之江实验室副主任。\n华中科技大学博士，美国伊利诺伊理工大学博士后。\n中国计算机学会（CCF）第十三届会员代表、杰出会员、星级演讲者，CCF\
  \ 信息存储专委常委、体系结构专委常委。长期从事智能计算、存储系统、计算机体系结构等方向研究。主持或参与国家重点研发计划、国家自然科学基金重点 、 国家自然科学基金面上项目及华为、阿里巴巴、蚂蚁集团、浪潮等企业联合研究项目\
  \ 20 余项。在国际会议和期刊发表论文 100 多篇，包括 FAST、ASPLOS、MICRO、HPCA、EuroSys、ATC、SC、VLDB、TOCS、TC、TPDS、TOS\
  \ 等 CCF A 类论文近 50 篇。担任 NAS 2024 程序委员会主席、ChinaSys 2024 大会主席及 HPCA、ICDCS、IPDPS、ICPP\
  \ 等会议程序委员会委员，任 IEEE TC、IEEE TPDS编委、CCF THPC 编辑，获 2020 年 IEEE TPDS 优秀编辑奖。担任全国智能计算标准化工作组智能计算集群研究组召集人，参与\
  \ 2 项国家标准及 2 项国际标准研制。授权发明专利 50 余项，获软件著作权 10 项。获 2025 年世界互联网大会领先科技奖、2024 年浙江省科技进步一等奖、2023\
  \ 年浙江省科技进步一等奖、2025 年中国发明协会成果一等奖、2025 年算力中国年度重大突破成果奖。指导学生获\nASC25世界超算竞赛二等奖、\nASC24世界超算竞赛二等奖、2025\
  \ 年大学生信息存储技术竞赛自由赛一等奖、 2024 年大学生信息存储技术竞赛自由赛二等奖、2025 年大学生信息存储技术竞赛挑战赛三等奖、2025 ACM ChinaSys优秀博士论文奖、浙江大学优秀博士论文奖等。毕业生获蚂蚁集团蚂蚁星计划、腾讯青云计划等。\n\
  更多论文全文和项目信息请访问：\nhttps://shuibing9420.github.io/\n，团队成果代码开源在:\nhttps://github.com/ISCS-ZJU\n\
  。\n最近代表性研究成果：\nLongjiao Zhang, Rui Wang, Tongya Zheng, Ziqi Huang, Wenjie Huang,\
  \ Xinyu Wang, Can Wang, Mingli Song, Sai Wu, and\nShuibing He\n, ``\nEffective and\
  \ Efficient Distributed Temporal Graph Learning through Hotspot Memory Sharing\n\
  '', in Proceedings of the International Conference of Very Large Databases\nEndowment\n\
  (\nVLDB\n), 2025, (\nCCF A\n).\nWeijian Chen,\nShuibing He\n, Haoyang Qu, and Xuechen\
  \ Zhang, ``LeapGNN: Accelerating Distributed GNN Training Leveraging Feature-Centric\
  \ Model Migration'', in Proceedings of the 23rd USENIX Conference on File and Storage\
  \ Technologies (\nFAST\n), 2025, (\nCCF A\n).\nWeijian Chen,\nShuibing He\n, Haoyang\
  \ Qu, Ruidong Zhang, Siling Yang, Ping Chen, Yi Zheng, Baoxing Huai, and Gang Chen,\
  \ ``IMPRESS: An Importance-informed Multi-tier Prefix KV Storage System for Large\
  \ Language Model Inference'', in Proceedings of the 23rd USENIX Conference on File\
  \ and Storage Technologies (\nFAST\n), 2025, (\nCCF A\n).\nSiling Yang,\nShuibing\
  \ He\n, Wenjiong Wang, Yanlong Yin, Tong Wu, Weijian Chen, Xuechen Zhang, Xian-He\
  \ Sun, and Dan Feng, “GOPIM: GCN-Oriented Pipeline Optimization for PIM Accelerators”,\
  \ in Proceedings of the 31st IEEE International Symposium on High-Performance Computer\
  \ Architecture (\nHPCA\n), 2025, (\nCCF A\n).\nZhe Pan,\nShuibing He\n, Xu Li, Xuechen\
