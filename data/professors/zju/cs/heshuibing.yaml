  \ Yuan, Yangming Zhang, Xulin Yu, Yi Chen, Zeke Wang,\nShuibing He\n, and Wenzhi\
  \ Chen, “BM-Store: A Transparent and High-performance Local Storage Architecture\
  \ for Bare-metal Clouds Enabling Large-scale Deployment”, Proceedings of the 29th\
  \ IEEE International Symposium on High-Performance Computer Architecture (\nHPCA\n\
  ), 2023, (\nCCF A\n).\nRui Wang,\nShuibing He\n, Weixu Zong, Yongkun Li, and Yinlong\
  \ Xu, “XPGraph: XPline-Friendly Persistent Memory Graph Stores for Large-Scale Evolving\
  \ Graphs”, Proceedings of the 55th ACM/IEEE International Symposium on Microarchitecture\
  \ (\nMICRO\n), 2022, (\nCCF A\n).\nZheng Dang,\nShuibing He\n, Peiyi Hong, Zhenxin\
  \ Li, Xuechen Zhang, Xian-He Sun, Gang Chen, “NVAllo"
