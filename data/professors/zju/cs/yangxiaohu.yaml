bio_raw: '浙江大学区块链与数据安全全国重点实验室副主任

  、浙江大学计算机软件研究所副所长，曾任浙江大学软件学院常务副院长。

  长期从事金融科技、

  软件工程、区块链

  等方面的研发工作

  。2001年起与全球金融服务巨头——美国道富银行（State Street Corporation）合作成立浙江大学道富技术中心并担任中心主任，开展全球化金融软件系统研发，从十几人发展到上千人，成为浙江大学规模最大的国际合作项目，开发的上百个大规模金融软件在美国、欧洲、亚洲等市场投入运行，取得了很大成功，在国内外引起广泛注意，中央电视台、人民日报、美国《Boston
  Globe》、《CIO Magazine》、《Gartner Industry Research》等媒体均有报道，成为国际化产学研合作成功案例。基于这一产学研平台，在浙江大学软件学院设立“金融信息技术系”，培养了数百名软件技术和金融知识兼具的工程型、复合型、国际化人才。'
