bio_raw: 'CCF形式化方法专委、理论计算机科学专委执行委员，ACM SIGPLAN、SIGSAC会员，入选国家级高层次青年人才计划。主要研究方向为编程语言(程序分析与验证、程序合成与优化)、数理逻辑(自动定理证明)、软件安全(漏洞挖掘)。相关成果发表于编程语言(PLDI,
  OOPSLA)、形式化方法(CAV)、软件工程(ICSE, FSE, ISSTA, ASE, TOSEM)、安全(S&P, USENIX Security, TDSC)、系统(ASPLOS)等领域的CCF-A会议或期刊(包括浙大第一篇PLDI);获编程语言领域旗舰会议OOPSLA杰出论文奖、SIGSOFT杰出论文奖、Google
  Research Paper Rewards等奖项，发现Linux内核、MySQL数据库、Firefox浏览器等开源软件数百真实缺陷。担任相关领域顶级会议(POPL,
  PLDI, OOPSLA, FSE, ISSTA, ASE, CCS等)程序委员会委员(其中POPL, PLDI, OOPSLA均为浙大首次）。更多信息参见个人主页https://rainoftime.github.io/

  欢迎对相关话题感兴趣的同学(本科生、研究生, etc)加入我们的研究小组...(可联系pyaoaa@zju.edu.cn)'
