bio_raw: '现任浙江大学计算机科学与技术学院CAD&CG国家重点实验室长聘教授，教育部长江学者。曾任日本立命馆大学博士后，微软亚洲研究院网络图形组研究员,
  浙江省钱江学者特聘教授。主要研究兴趣为计算几何、物理仿真、3D打印和虚拟现实。2014年起受国家自然科学基金优秀青年基金资助， 2022年入选教育部长江学者奖励计划。

  详情请见：

  http://www.cad.zju.edu.cn/home/weiweixu/'
