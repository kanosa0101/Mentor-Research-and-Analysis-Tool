bio_raw: '浙江大学求是特聘教授，区块链与数据安全全国重点实验室首席研究员；智能汽车安全技术全国重点实验室首席科学家；贵州大数据安全工程研究中心创始主任。在中国计算机学会、中国管理科学学会、中国通信学会、中国网络空间安全学会、中国信息安全标准化委员会等社会机构中担任理事、常务委员、委员等职务。曾任360集团副总裁兼首席安全官、阿里巴巴集团副总裁及首席安全专家、网络安全应急技术国家工程实验室主任、APCERT副主席、中国网络空间安全协会副理事长等职。

  长年从事网络空间安全相关工作，在国家级网络安全能力和网络安全应急响应体系的研究设计与建设运营、数据安全治理、人工智能安全、国际合作等方面有丰富积累，并且具有政府、产业、研究和第三方机构经历和国内国际视野。两次获得国家科技进步一等奖（排名二、三），并获得新世纪百千万人才工程国家级人才、全国青年岗位能手、信息产业十大杰出青年、中国计算机学会杰出会员、亚太信息安全领袖成就等荣誉，享受国务院特殊津贴。'
