bio_raw: '陈建海，浙江大学计算机学院副教授，

  博导

  ，基础教学中心副主任，

  浙江大学人工智能教育教学研究中心《人工智能（理工农医）通识课程》团队负责人

  。浙江大学智能计算&系统实验室（Incas-lab）负责人，浙江大学智能计算创新创业实验室（ICE-lab）负责人，浙江大学网络系统安全隐私实验室（NESA-lab）联合负责人，浙江大学超算竞赛基地（ZJU
  SPC)负责人

  ，

  IEEE/ACM/CCF会员，CCF区块链专业委员会执行委员，澳大利亚斯威本科技大学访问学者。浙江省数字经济学会理事，浙江省人工智能+教育产学研联盟人工智能通识教育专业委员会主任，杭州市余杭区数字经济创新创业促进中心法人兼理事长，杭州未来科技城鲲鹏企业联盟理事。

  研究涉及云计算超算、区块链安全、人工智能大模型、数据挖掘，擅长区块链安全，云计算超算

  调度

  应用优化，人工智能、大模型、数据挖掘、联邦学习、推荐系统等。目前承担

  元宇宙数字身份、

  区块链方面的国家

  重点研发计划

  课题任务2项

  、主持省“尖兵”重点研发攻关计划项目1项，参与完成国家科技部支撑计划、国家重点研发计划、国家自然科学基金以及企业合作项目20余项。在INFOCOM、ICDE、

  AAAI、IJCAI、ACM CCS等

  会议

  以及IEEE TMC、TDSC、TPDS，T ON CYB(影响影子>10)

  等CCF A类国际重要学术会议与期刊上累计发表SCI/EI论文30余篇，获授权发明专利40余项及软著4项，参编IEEE供应链区块链应用标准1项，2018全球区块链专利百人榜31位（2018年2月由知翌科技发布）。

  长期从事计算机教育教学科研工作，具有丰富的产学研经历与系统开发实战经验积累，致力于推进人工智能、区块链、元宇宙等新兴技术知识普及。结合自身实践经验，面向政府、高校、企事业单位开展区块链、元宇宙等方面专题讲座，深入浅出、通俗易懂。

  近五年来，累计获得相关教学科研成果奖项超过20项，

  获2016年浙江省高等教育教学成果奖一等奖，获2018全国高等教育国家级教学成果奖二等奖，获2021年浙江省科技进步奖二等奖，2025浙江省教学成果特等奖、浙江大学教学成果奖一等奖、特等奖。具体来说：

  （1）

  依托浙江大学超算竞赛基地，超算人才培养方面，作为总教练，

  率领浙大超算队累计获得奖项超过10项，国际一等奖8项、二等奖1项，高性能冠军3项及打破世界纪录2项。具体地，获2014~2016年、2018年、2020-21、2022-23、2024、2025八届冲入ASC世界大学生超级计算机竞赛总决赛获一等奖，2022第十届ASC世界大学生超算预赛全球第一进入总决赛，2022美国SCC世界大学生超算大赛总决赛总排名第四和单项冠军奖，

  获2016、2022/23、2024世界最高计算性能冠军奖，2025世界最高应用性能（应用创新）奖，两次打破世界最高计算性能世界纪录，获2023、2025美国IndySCC世界大学生超算大赛总决赛冠军

  。

  （2）依托智能计算创新创业实验室（ICE-lab），在创新创业人才培养方面累计获得互联网+、挑战杯大学生创新创业大赛9项，包括省银3项、省金3、国金2、国银1。

  指导的“智能合约可视编辑器Designer项目（已开源）”获2018全球迅雷区块链应用开发大赛第一名，

  指导的“Tako智能合约在线服务系统”获2019“

  建行杯”

  第五届浙江省“互联网+”创新创业大赛银奖；

  指导的“阿蚂神护：为您提供全套数字版权保护及交易方案”获

  “建行杯”第七届浙江省国际“互联网+”大学生创新创业大赛

  金

  奖和第七届中国国际“互联网+”大学生创新创业大赛

  金

  奖；

  获得2022浙江省第十三届“

  挑战杯”

  大学生创业大赛金奖，获得第九届创青春中国青年创新创业大赛银奖（

  2022

  ）；

  指导“Mars智能合约一站式服务平台”、“

  可信AI先行者 - 人工智能模型安全评估与加固平台”两个项目获“建行杯”第九届浙江省国际互联网+大学生创新创业大赛银奖（2023）；指导“烛龙科技—全模态AIGC审核先行者”项目获得第十届浙江省国际创新大赛金奖（2024）以及2024中国国际大学生创新大赛金奖

  （2024）。

  ---------------------------------------------------------------------

  智能计算与系统实验室（Incas-lab）主页：

  http://vm.zju.edu.cn

  (Incas-lab)，面向人工智能大模型、数据挖掘、Web3、区块链安全和高性能计算等方向，招收硕士研究生以及博士研究生，以及

  校内SRTP本科生、毕业设计的学生等

  。特别，实验室招收硕士、博士，

  有意向请联系：chenjh919@zju.edu.cn。

  智能计算创新创业实验室，对人工智能、大模型、区块链、数据挖掘等方向，致力于有想法创新创业的同学，欢迎加盟组队立项参加创新创业大赛，

  http://ice.zju.edu.cn

  (Ice-lab)。浙大

  超算竞赛基地（ZJUSCT）面向全校本科生招收超算队成员，欢迎对高性能超算感兴趣的同学加盟，

  http://clusters.zju.edu.cn

  (浙大超算队)。

  欢迎对人工智能安全感兴趣的同学来nesa实验室

  http://nesa.zju.edu.cn

  (Nesa-lab)。'
