bio_raw: '夏鑫是浙江大学计算机科学与技术学院的求是特聘教授。在加入浙江大学之前，他曾担任华为技术有限公司软件工程应用技术首席专家（2021-2025）及实验室主任（2021-2024）。他的研究兴趣包括AI和软工、大模型、和经验软件工程。夏鑫已发表超过360篇学术论文，其中CCF
  A类期刊和会议长文160多篇，并获得了16项最佳或杰出论文奖，其中包括在ASE（2018-2021）、ICPC（2018、2020）、FSE（2025）、ICSE（2024）和MSR（2024）上获得的九项ACM
  SIGSOFT杰出论文奖。 迄今为止，夏鑫的谷歌引用达2.1万余次，H-index 77。 他于2022年获得了ACM SIGSOFT Early Career
  Researcher Award（亚太地区第一位获奖者），于2024年获得CCF NASAC青年软件创新奖。夏鑫在经验软件工程和AI4SE领域的贡献当选ACM
  Distinguished Member （2024）。

  夏鑫担任CCF软件工程专委常委，以及多个会议的指导委员会成员，如MSR、SANER和Internetware等。他参与组织了多个重要国际会议，如ICSE（2023-2025）和ASE（2016、2020-2021、2024）。他担任（或曾担任）ICSME
  2026、SANER 2023、TechDebt 2023和PROMISE 2021的程序委员会联席主席，以及Internetware 2023和FORGE（2024-2025）的大会联席主席。此外，夏鑫还是多个知名软件工程期刊的编委，包括CCF
  A类期刊TOSEM、CCF B类期刊EMSE、ASEJ和JSEP。'
