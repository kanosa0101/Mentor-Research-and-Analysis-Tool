bio_raw: '王琦，男，博士，教授、博士生导师。1983 年毕业于浙江大学化学系，获学士学位，同年考入本校攻读硕士学位，1986 年转为直接攻读博士学位，1988
  年初赴美国 Purdue 大学联合培养，1989 年底学成回国，1990 年获博士学位，留校化学系任教，1992 年晋升为副教授。1996 年赴日本大阪大学从事博士后研究，1998
  年回国，1999 年晋升为教授，2000 年评定为博士生导师。2000 年赴台湾科技大学做访问教授。2007 年赴日本大阪大学做访问教授。曾获业绩显著的浙江大学博士学位获得者，亿利达优秀教师奖，浙江大学优秀青年教师等称号。

  主要从事分子模拟与分子设计、锂离子电池材料、分子热力学、低温微量热学、薄膜成长与电子材料等方面的研究工作。近年来承担了国家自然科学基金重点项目（第二责任人）、面上项目、浙江省自然科学基金杰出青年团队项目（责任人）、校企合作等科研项目，在国际著名学术期刊
  Nature Nanotech., Nature Comm., JACS, Angew. Chem. Int. Ed., Chem, Adv. Mater.,
  Chem. Comm., Nano Lett., Nano Res., Nanoscale, Biomaterials, Sci. Rep., Chem. Eur.
  J., Soft Matter, J. Phys. Chem. B/C, Langmuir, Phys. Chem. Chem. Phys., ChemPhysChem,
  J. Chem. Phys., Phys. Rev. B, Biophys. J., J. Mater. Chem. B 及国内核心期刊上发表论文约 220 篇。有
  8 篇论文获浙江省自然科学优秀论文奖，两项科研成果通过部级鉴定。

  更多信息请访问我们课题组网页

  https://m.x-mol.com/groups/liuyingchun'
