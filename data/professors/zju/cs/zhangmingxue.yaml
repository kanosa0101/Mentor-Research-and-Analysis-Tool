bio_raw: '特聘研究员、博士生导师。主要研究方向为web安全（JS程序分析、恶意脚本检测）和软件安全（漏洞挖掘、合规分析）。2018年本科毕业于武汉大学计算机专业弘毅班，2022年博士毕业于香港中文大学计算机科学与工程学系，同年加入浙江大学。相关研究成果全部发表于CCF-A类国际顶级学术会议和期刊，包括IEEE
  S&P, USENIX Security, CCS, ICSE, ESEC/FSE, WWW, TIFS等，获得安全领域四大顶会CCS 2024杰出论文奖，担任相关领域顶级会议（NDSS
  2025, ICSE 2025, ISSTA 2024等）的程序委员会委员和CCF-A类期刊（TDSC 2025, TC 2024, TON 2023等）审稿人。详情见：

  https://zhangmx1997.github.io

  欢迎对相关领域感兴趣、有志于发表顶级学术论文的本科生、研究生联系我（mxzhang97@zju.edu.cn）。'
