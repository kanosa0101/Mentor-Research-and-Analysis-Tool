bio_raw: '欢迎保研/考研的博士/硕士研究生、本科SRTP竞赛/毕业设计等对科研感兴趣的本科生加入 Daily（Database & Big Data Analytics
  Laboratory）实验室。

  有意愿加入实验室的同学可发邮件到 zhikun@zju.edu.cn

  张治坤，浙江大学计算机科学与技术学院百人计划研究员、博士生导师，国家级高层次青年人才。曾任美国斯坦福大学访问助理教授、德国CISPA亥姆霍兹信息安全中心研究组组长、博士生导师。在此之前，他获得了浙江大学博士学位，并在CISPA从事博士后研究，他还曾是美国普渡大学的访问学者。他的研究方向包括可信人工智能、数据安全与隐私、以及差分隐私。治坤在顶级会议和期刊上发表了50余篇相关论文，其中包括40余篇CCF-A论文和27篇信息安全四大顶会论文。他曾获NDSS
  2024杰出论文奖（通讯作者）、ACM SIGSAC 新星奖、浙江大学与浙江省优秀博士论文提名奖（当年控制科学与工程学院仅1篇博士论文入围、全校仅29篇博士论文入围）、美国国家标准技术研究所（NIST）举办的“差分隐私合成数据集挑战赛”全球第二名。他曾主持国家优秀青年科学基金（海外）项目、国家青年科学基金项目和浙江省重点项目。

  曾组织信息安全四大顶会NDSS研讨会并担任联合主席，担任USENIX Security,CCS,NDSS,WWW,KDD,ICDE等CCF-A类会议程序委员会委员。

  个人主页：http://zhangzhk.com/publication/。'
