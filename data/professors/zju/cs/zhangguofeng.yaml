bio_raw: '浙江大学

  CAD&CG

  国家重点实验室教授，

  博士生导师。主要从事运动恢复结构、同时定位与地图构建、三维重建、增强现实、视频分割与编缉等方面的研究工作，尤其在同时定位与地图构建和三维重建方面的研究取得了一系列重要成果，研制了一系列相关软件，如

  ACTS, LS-ACTS, RDSLAM, RKSLAM

  等

  (

  下载网址：

  http://www.zjucvg.net )

  ，并开源了非连续特征跟踪

  ENFT

  、分段集束调整

  SegmentBA

  和高效的增量式集束调整

  EIBA

  等算法的源代码（详见

  https://github.com/ZJUCVG/

  ）。获全国百篇优秀博士学位论文奖、计算机学会优秀博士学位论文奖以及教育部高等学校科学研究优秀成果奖科学技术进步奖一等奖

  (

  排名第

  4)

  。'
