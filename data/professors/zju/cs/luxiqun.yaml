bio_raw: 陆系群，博士，副教授。1997年7月华南理工大学无线电研究所毕业，获工学博士学位。1996年7月到1997年7月香港大学计算机系研究助理，主要研究方向是图像子带编码和滤波器阵列设计等。1997年9月进入浙江大学计算机系工作。2001年8月获国家留学基金委资助以访问学者身份到美国佐治亚理工学院(Georgia Institute of Technology)进行为期一年的研究工作。目前主要从事图像保边滤波方法、目标跟踪、和三维重建等图像处理和计算机视觉方面的研究开发工作。
