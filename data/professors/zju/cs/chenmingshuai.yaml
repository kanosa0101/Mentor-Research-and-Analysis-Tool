bio_raw: '陈明帅，浙江大学百人计划研究员、博士生导师、启真学者，兼任浙江大学国际合作与交流处副处长、浙江大学滨江研究院党总支书记/副院长，CCF高级会员、形式化方法专委执行委员、系统软件专委通讯委员，杭州市钱江特聘专家，国家优秀青年基金（海外）获得者。2019年于中国科学院软件研究所获计算机软件与理论专业博士学位，导师为詹乃军研究员，同年获中国科学院院长特别奖（中科院软件所自1985年成立以来首获该奖项），此后赴德国RWTH
  Aachen从事为期3年的博士后研究工作，合作导师为Joost-Pieter Katoen教授。主要研究方向包括形式验证、程序理论、概率/量子系统、信息物理融合系统、AI4FM等，与合作者一起，提出新型安全攸关系统形式验证理论，解决了概率程序不动点估计、微分系统可达性判定、时滞系统高效控制生成等若干软件理论难题，研究成果应用于我国探月二期工程“嫦娥”三号、卫星姿轨控制等重大工程，在Inf.
  Compt.、IEEE Trans. Automat. Contr.、CAV、FM、

  OOPSLA、TACAS、IJCAR、

  ASE、ASPLOS等领域旗舰期刊/会议上发表学术论文50余篇。曾获ATVA杰出论文奖、FMAC最佳论文奖、Springer Nature计算机领域中国学者1%高影响论文，曾/现任Frontiers
  in Computer Science (Theoretical Computer Science)编委、《软件学报》专刊特约编辑、美国数学学会Mathematical
  Reviews评论员、ICFEM 2027程序委员会联合主席、QEST+FORMATS 2026程序委员会联合主席、CCF ChinaSoft 2026/2024论坛联合主席及CAV、OOPSLA、TACAS等10余个国际会议的程序委员会委员，并受邀在实时系统领域旗舰会议RTSS及ESWEEK上做专题报告。主持国家优秀青年科学基金项目（海外）、国家自然科学基金面上项目、浙江省自然科学基金重大项目、中国航天科技集团开放基金、CCF-华为胡杨林基金形式化专项与系统软件专项，作为项目骨干承担国家重点研发计划及浙江省尖兵领雁研发攻关计划。

  陈明帅所领导的

  形式验证课题组

  旨在基于具有严格数学基础的

  形式化方法

  （模型检验、定理证明、抽象解释等），研发程序和离散-连续混成系统的

  形式验证与生成

  技术，以确保新型安全攸关信息物理融合系统的可靠性和有效性，并致力于推动验证与生成方法的

  自动化

  。具体研究方向包括（但不限于）：

  数理逻辑与形式化验证

  编程语言与程序理论

  信息物理融合系统

  概率与量子系统

  AI驱动的验证与生成

  课题组长期招聘/招收

  博士后

  、

  博士/硕士研究生

  和

  研究助理/实习生

  。更多信息请参见课题组网站

  Formal Verification Group

  。'
