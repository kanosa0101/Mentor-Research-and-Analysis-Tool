bio_raw: '陈为，博导，浙江大学求是特聘教授，国家级高层次人才，CCF会士。

  现任浙江大学计算机辅助设计与图形系统全国重点实验室副主任，浙江大学艺术与考古图像数据实验室常务副主任

  。

  2002年-2021年，浙江大学计算机学院，讲师、副教授（2004）、教授（2009）；浙江大学计算机学院副院长(2017.9-2021.11)

  1996年-2002年，浙江大学应用数学系，获博士学位

  1992

  年

  -1996

  年，浙江大学应用数学系，获学士学位

  承担国家自然科学基金重点项目等十余项。“十三五”国家重点研发计划“云计算与大数据”重点专项专家组成员，“十四五”国家重点研发计划“先进计算与新兴软件”重点专项专家组成员。研究领域为大数据可视分析和人机混合智能。发表IEEE/ACM
  Transactions和IEEE VIS顶级期刊和会议论文100余篇，4篇论文获可视化领域顶级会议IEEE VIS最佳论文提名。出版教材/专著6部；承担国家自然科学基金重点项目等十余项。担任5个IEEE/ACM汇刊的编委和浙大创刊国际期刊Visual
  Informatics执行主编。研究成果获中国计算机学会技术发明奖一等奖1项（2020）、浙江省自然科学奖一等奖2项（2017、2021）、浙江省科技进步奖一等奖（2023）、教育部科技进步二等奖、浙江省科技进步二等奖等。

  陈为教授目前带领浙江大学VAI小组（https://zjuvai.cn）

  欢迎具有强烈上进心和良好的数学与编程基础的本科同学或研究生同学与我们联系（简历可投至https://zjuvailab.feishu.cn/share/base/form/shrcnJEMgFGgu6uCYHCknJAumVh）；

  我们期待

  有热情、有创造力、有团队精神的你

  加入我们团队共同探索未来。'
