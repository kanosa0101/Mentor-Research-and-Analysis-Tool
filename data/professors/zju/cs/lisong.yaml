bio_raw: '1. 学习与工作经历

  浙江大学求是特聘教授，二级教授，博士生指导教师；1963年1月出生于内蒙古乌海市，籍贯山东省诸城市；1982年7月毕业于内蒙古呼伦贝尔学院、1990年7月于内蒙古大学获硕士学位、1994年4月于浙江大学获博士学位；1996年6月于武汉大学博士后出站进入浙江大学数学系工作，被聘为副教授、2001年12月晋升为教授、2002年12月被评为博士生指导教师；曾分别担任数学系副主任（2004年11月-2009年7月）、数学科学研究中心副主任（2007年10月-）、数学系（学院级单位）副主任（2009年7月-2015年5月）、数学科学学院副院长（2015年5月-2017年8月）、浙江省数学会副理事长（2013年11月-2023年8月）、浙江省科协委员（2011年11月-2015年11月）。

  2. 科学研究

  (1)、研究领域：长期从事数据科学中的数学基础理论与算法的研究（包括；小波分析、压缩感知、低秩矩阵恢复、相位恢复等），是国际上较早开展压缩感知理论与低秩矩阵恢复理论研究的学者之一，与合作者一起解取得了一批原创性的研究成果（包括；解决了压缩感知奠基人之一

  ，

  ICM 1小时报告人E.Candes 以及国际杰出统计学家

  ，

  统计学最高奖

  “

  考普斯总统奖”

  得主蔡天文等提出的多个公开问题与猜想），受到国内外同行的广泛认可。

  到目前为止在国际数学、应用数学、数学与信息交叉以及数学与信号处理交叉等领域中的著名期刊上发表了100余篇学术论文（其中包括：Appl.Comput.Harmon.Anal,J.Approx.Theory,Adv.Comput.Math,Inverse.Problem,J.Four.Anal.Appl,IEEE.Trans.Inform.Theory,IEEE.Trans.Signal.Process等）。

  (2)、主持科研项目：到目前为止主持与完成了10项国家自然科学基金项目，其中重点项目2项（2015，2021）、面上项目5项（2000,2004,2007,2011,2020）、天元基金项目3项（2021,2022、2024）以及浙江省重大科技专项1项（2016）。

  (3)、科研奖励：共获得2项省部级自然科学奖，其中包括教育部自然科学二等奖1项（第一完成人，2013）；广东省自然科学二等奖1项（第三完成人，2023）。

  (4)、出版专著：受邀与合作者一起撰写了我国第一部大数据与数据科学专著系列之第4部“压缩感知的若干基本理论”（科学出版社出版，2024），该书目前已入选十四五时期国家重点出版物出版专项规划项目。

  3. 人才培养

  目前共指导毕业了15位博士研究生，31位硕士研究生，毕业研究生中多人获得国家级优秀青年人才项目，其中；沈益（博士毕业生，浙江理工大学）获得国家优秀青年基金（2020）、林俊宏（博士毕业生，浙江大学）入选中组部青年拔尖人才计划（2021）、李娜（硕士毕业生，山东财经大学）入选教育部长江学者奖励计划青年项目（2020）、冼军（博士后，中山大学）获得国家优秀青年基金（2014）。此外，多位毕业研究生分别入职国内高校以及著名企业（华为、字节跳动等），多位已经成为单位的业务骨干。

  4. 学术交流

  曾受邀访问过耶鲁大学、剑桥大学、佐治亚理工大学、加州大学洛杉矶分校、纽约大学克朗研究所、多伦多大学以及剑桥大学等多所国际著名学府，并做邀请报告。曾受邀前往剑桥大学牛顿研究所、加拿大班夫国际会议中心、德国黑森林国际会议中心以及中国三亚国际会议中心等著名学术机构参加重要国际会议，并做特邀报告,受邀参加第七届世界华人数学家大会并做特邀报告。

  5. 社会服务

  曾担任浙江省科协委员、中国数学会理事、浙江省数学会副理事长。曾多次担任国家自然科学基金委员会数理学部重点、人才与面上项目会评专家。目前担任浙江省数理医学会秘书长，浙江省高等学校数学类专业教学指导委员会委员、高校应用数学学报编委。'
