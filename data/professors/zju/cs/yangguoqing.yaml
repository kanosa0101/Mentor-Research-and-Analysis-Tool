bio_raw: '杨国青，男，教育部嵌入式系统工程研究中心副主任，浙江大学ESE工程中心主任，浙江大学常州工业技术研究院智能电子信息中心副主任。

  过去15年来，开展了嵌入式软件体系结构、嵌入式系统设计方法、无人驾驶交通机器人等研究，提出了面向汽车控制的基础支撑软件架构、基于模型驱动的汽车电子软件开发方法、发明了面向控制领域的专用建模语言SmartC，发明了面向智慧城市、低碳交通的智能新能源车辆。作为项目负责人相继承担并主持了“核高基”重大专项、多项科技部863项目以及浙江省科技厅项目等重点科研项目的开发，研制了国内首套符合OSEK标准的嵌入式实时操作系统-SmartOSEK
  OS，开发了国内首套基于模型驱动的实控系统开发环境-SmartOSEK IDE，开发了完全自主知识产权的硬件在环仿真测试系统-SmartController，发布了国内首个低速无人驾驶交通机器人

  智能萝卜车

  ，将智慧城市、低碳交通、平安城市建设需求与交通物联网技术、大数据、移动互联网技术成功融合，提出了面向中国城市发展的新能源交通分享模式。发表论文10余篇，授权专利15项。2012年获得教育部科学技术进步二等奖，浙江省科技进步一等奖。2014年获得国家技术发明二等奖。

  1）承担或负责的嵌入式相关的科研项目：

  2002年，主要负责人，国家863重大软件专向项目“面向大型机电设备状态监测与故障诊断的智能仪器嵌入式软件开发平台”。

  2003年，主要负责人，国家863重大软件专向项目“支持汽车电子的嵌入式软件平台。

  2004年，主要负责人，“面向汽车自动变速箱的嵌入式软件开发平台”，编号2004C21057。

  2004年，副组长，国家863重大软件专向项目“面向数字化设备的嵌入式软件平台。

  2005年，主要负责人，国家863重大软件专向项目“新型经济型轿车的嵌入式软件平台及关键电控系统开发。

  2006年，主要负责人，杭州市科技项目“车控电子嵌入式支撑软件平台”，编号20062412B01。

  2007年，课题组长，国家863重大软件专向项目“基于模型驱动的汽车电子安全软件开发技术。

  2008年，副组长，浙江省科技厅重点项目“基于AUTOSAR的汽车电子软件平台及发动机控制应用示范。

  2009年，副组长，“核高基”重大专项项目“汽车电子虚拟服务总线及其模型设计工具。

  2014年，课题组组长，“核高基”重大专项项目“汽车电子代码生成与缺陷管理系统研制”。

