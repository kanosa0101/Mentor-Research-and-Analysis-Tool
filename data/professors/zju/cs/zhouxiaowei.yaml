bio_raw: '周晓巍，浙江大学求是特聘教授，国家科技创新领军人才，国家重点研发项目首席科学家。研究方向主要为三维视觉与空间智能。近五年在相关领域的顶级期刊与会议上发表论文百余篇，多次入选CVPR最佳论文候选，成果在中船集团、中国兵器、华为、蚂蚁、商汤等头部企业的项目和产品中成功应用。曾获得浙江省自然科学一等奖，两次获得CCF优秀图形开源贡献奖，入选全球前2%顶尖科学家榜单、爱思唯尔中国高被引学者。培养学生获得CCF优博、国自然优秀学生基金。担任国际顶级期刊IJCV编委、顶级会议CVPR/ICCV领域主席，CSIG
  三维视觉专委会副主任，曾任图形学与混合现实研讨会（GAMES）执行委员会主席。

  更多信息请见个人主页：

  xzhou.me'
