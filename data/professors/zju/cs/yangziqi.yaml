bio_raw: 杨子祺，浙江大学百人计划研究员，博士生导师。本科毕业于华中科技大学，博士毕业于新加坡国立大学。担任CCF网络与系统安全专委会执行委员，长期担任网络与信息安全领域四大顶会IEEE
  S&P、ACM CCS程序委员会委员，CCF-A类会议AAAI、MM、NeurIPS等程序委员会委员，担任TDSC、TIFS 等顶刊常驻评审。深度参与制定强制性国家标准GB
  45438-2025《网络安全技术 人工智能生成合成内容标识方法》，研发强制性标准配套服务平台GCmark。曾获ACM AISec最佳审稿人、全国大学生信息安全竞赛优胜奖指导教师等奖项。主讲课程获评浙江省“名师名课”省级一流课程、入选教育部国家高等教育智慧教育平台人工智能通识课程。研究方向包括人工智能安全、大模型安全、智能体安全，发表安全四大论文及CCF-A类论文20余篇，主持和参与国家自然科学基金项目、科技部重点研发计划项目等多个国家级科研项目。
