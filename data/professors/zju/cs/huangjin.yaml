bio_raw: '黄劲博士、教授，主要研究计算机图形学中几何计算以及物理模拟方面的课题，2015年获国家优秀青年基金资助。

  研究受国家自然科学基金、通用汽车等项目的资助。取得的成果包括数十篇国际顶级学术期刊论文，目前担任CAGD、

  CGF期刊的Associated Editor，曾担任包括ACM SIGGRAPH在内的一些著名国际学术会议的程序委员会委员。'
