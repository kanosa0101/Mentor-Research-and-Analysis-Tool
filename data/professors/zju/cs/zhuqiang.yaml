bio_raw: '朱强，国家海外高层次人才，浙江省特聘专家，浙江大学求是特聘工程岗。现任职于浙江大学人工智能学院，浙江大学人工智能教育教学研究中心副主任，中国人工智能学会人机融合智能专委会副主任委员，以及中国高校计算机大赛-智能交互创新赛组委会主任委员。于2007年获得加州大学圣塔芭芭拉分校博士学位，随后在加州大学圣塔芭芭拉分校、美国微软总部和美国三菱电气研究院等国际知名机构任职。曾创办并担任三家美国人工智能初创企业的技术合伙人，积累了丰富的科研、技术孵化和产学研合作经验。

  课题组专注于人工智能前沿技术的研究，主要关注Recursive AI、Agentic AI、World Model、

  数据合成

  等方向。同时，我们致力于人工智能与地球科学、

  生物医药、

  教育、金融等领域的交叉研究与赋能，与蚂蚁金服、阿里巴巴、百度、航天科技、中国电信等企业保持密切合作。

  在过去五年中，主持/参与了多个国家级/省部级科研项目，包括国家自然科学基金重大项目“时空智能的自主化服务”（2024-2028，项目批准号：42394064）和国家科技创新2030“新一代人工智能”重大项目“人机协同的学习社群建构与支持技术”（2023-2027，课题编号：2022ZD0115904）等。

  我们长期招收博士后、研究生、本科实习生及科研助理人员，欢迎对大模型技术和学科交叉有浓厚兴趣的优秀学子加入课题组。如果您对此感兴趣，请联系

  zhuq@zju.edu.cn

  。'
