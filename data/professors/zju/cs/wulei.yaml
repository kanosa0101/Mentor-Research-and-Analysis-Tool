bio_raw: '研究方向

  1. 盆地分析

  ：重点关注中国中西部盆地（如柴达木盆地、鄂尔多斯盆地等）的构造变形与沉积演化特征，在此基础上分析其成盆机制和油气勘探意义，研究方法包括地震数据解释、野外地质考察、沉积学分析、构造物理和数值模拟等。

  2. 造山带与盆地构造耦合

  ：重点关注青藏高原北缘主要的造山带（如祁连山、阿尔金山、昆仑山等）与相邻沉积盆地之间的沉积、构造耦合分析，研究方法包括地震数据解释、野外地质考察、沉积分析、热年代学、物理和数值模拟等。

  3. 地表作用与深部过程耦合分析：

  重点关注中国中西部地区的风蚀作用、造山侵蚀、沉积作用等地表过程与深部构造变形、气候之间的响应关系，研究方法包括宇宙成因核素定年、高精度地形分析、地震数据解释、数值与物理模拟模拟等。

  教育及工作经历

  2023.1至今，浙江大学地球科学学院，教授，博导

  2015.1-2022.12，浙江大学地球科学学院，副教授，博导、求是青年学者

  2013.12-2014.12，浙江大学地球科学系，讲师

  2012.10 - 2013.10，美国加州大学戴维斯分校，访问学者

  2011.11 - 2013.12，浙江大学，博士后

  2011.7 - 2011.10，中海油上海分公司研究院

  2006.9 - 2011.6，浙江大学地球科学系，构造地质，博士

  2003.9 - 2006.3，浙江大学竺可桢学院，工程教育高级班

  2003.7-2006.6，浙江大学地球科学系 ，地质学专业，理学学士

  2002.10 - 2003.6，浙江大学计算机学院，工业设计专业，本科

  社会工作

  中国地震学会 构造地貌专业委员会，副主任委员

  中国地质学会 构造地质与地球动力学专业委员会，委员

  中国第四纪科学研究会，

  构造与气候专业委员会，委员

  浙江省地质学会 科普工作委员会，秘书长'
