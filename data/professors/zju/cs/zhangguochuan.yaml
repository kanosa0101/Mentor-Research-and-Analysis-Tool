bio_raw: '浙江大学计算机学院教授、计算机软件与理论（计算机学院）和运筹学与控制论（数学学院）博士生导师。

  1982-1989

  年就读于成都科技大学应用数学系，

  1989

  年

  6

  月获得中科院系统科学所硕士学位。

  1992-1995

  年在中科院应用数学所攻读博士学位，

  1995

  年

  6

  月获得运筹学博士学位。曾在奥地利格拉茨工业大学离散数学研究所和浙江大学高等数学研究所做博士后。自

  1998

  年

  6

  月起在浙江大学工作。

  2000

  年底晋升教授，

  2002

  年

  1

  月任博士生导师。

  2009

  年

  1

  月转入计算机学院，建立离散优化与算法研究组。

  1998

  和

  2000

  年访问香港中文大学计算机科学系和系统工程系。

  2001

  年获得德国洪堡基金，

  2001

  年至

  2004

  年先后在德国基尔大学和弗莱堡大学合作研究。法国

  INPG（2007）

  、日本京都大学

  （2010）

  、加拿大西蒙弗雷泽大学

  （2013）

  访问教授。

  2018

  年获得中国运筹学会科学技术奖“运筹研究奖”。主要研究兴趣包括离散优化、算法设计与分析和算法博弈论。是国内最早从事在线算法研究的学者，在

  Bin Packing，Scheduling

  等问题上得到重要的算法成果。

  2009

  年与德国波恩大学

  Bernhard Korte

  教授共同举办中德中心《芯片设计中的数学》讲习班。

  担任国际学术期刊

  《Asia-Pacific Journal of Operational Research》（2004-2013）

  ，

  《Parallel Computing》（2007-2013），《OMEGA-The International Journal of Management Science》（2010-2014），《Journal
  of Scheduling》（2012-），《Journal of Operations Research Society of China》（2016-）、《International
  Journal of Foundations of Computer Science》(2020-)、《Annals of Operations Research》(2021-)、《Journal
  of Combinatorial Optimization》(2024-)

  和国内中文期刊《运筹学学报》

  （2016-2024）

  编委。

  担任中国运筹学会常务理事

  （2008-2016）

  、中国运筹学会监事

  （2016-2020）

  、中国运筹学会副理事长

  （2020-2024,2024-2028）

  、

  Workshop on New Challenges in Scheduling Theory

  国际程序委员会委员

  （2008-）、International Symposium on Algorithms and Computation(ISAAC)

  顾问委员会委员

  （2015-）、International Computing and Combinatorics Conference(COCOON)

  指导委员委员

  （2018-）

  、亚洲算法与计算协会

  (AAAC)

  创始成员。'
