bio_raw: '童若锋，男，1969年4月出生，浙江大学计算机学院教授，博士生导师。浙江大学计算机学院CAD&CG国家重点实验室副主任。1996年浙江大学应用数学专业博士毕业，1999年10月至2001年9月日本广岛大学智
  能系统与造型实验室访问学者。承担了"

  基于人体姿态数据库的立体呈现与远程交互关键技术与系统

  "、“基于视频素材分析与融合的虚拟场景生成技术与系统”、“几何形状的修复和重建方法研究”等863、973 和国家自然科学基金的研究，并正在与Qualcomm等国际知名公司开展项目合作。研究兴趣包括：虚拟现实，计算机视觉、基于人工智能的辅助医学诊断。

  更详细介绍见实验室网站:

  http://give.zju.edu.cn'
