bio_raw: '赵永望，浙江大学，教授/博士生导师。担任ARINC653国际操作系统标准委员会委员（国内唯一委员）、国际信息技术安全评估标准(Common Criteria,CC)操作系统内核技术委员会委员、中国计算机学会(CCF)高级会员、CCF系统软件专委会和形式化方法专委会委员。任国际标准化组织
  ISO/IEC JTC1 SOA研究组组长、国家信标委分委会委员，起草4项ISO国际标准、12项国家标准。曾任新加坡南洋理工大学高级研究员。主要研究方向包括操作系统安全、形式化验证、编程语言原理等。主持和参与国家自然基金、核高基重大专项、重点研发计划、载人航天工程重点项目、工信部物联网创新项目等10余项，2011和2017年分别获得中国电子学会和山东省科技进步一等奖。相关研究成果得到美国波音、法国空客和国际知名实时操作系统厂商的认可，被纳入国际标准，并在开源实时操作系统社区产生影响力。

  目前招收博士后/博士/硕士/本科生，计算机或信息类方向均可，需要喜欢数学或编程。有兴趣的欢迎与我邮箱联系。

  具体信息详见：

  https://lvpgroup.github.io'
