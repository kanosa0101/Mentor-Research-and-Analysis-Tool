bio_raw: '顾实，浙江大学计算机科学与技术学院、脑机智能全国重点实验室长聘副教授，博士生导师，国家青年特聘专家（2017），入选福布斯中国“30岁以下30人“榜单。美国宾夕法尼亚大学（University
  of Pennsylvania）应用数学与计算科学专业博士，清华大学数理基础科学专业学士。研究方向为类脑智能与脑网络，论文发表于Nature Communications，Science
  Advances，PNAS，NeurIPS，ICML，ICLR等国际期刊或会议上，担任ICML、NeurIPS等会议的领域主席（Area Chair）和Nature、Science等期刊的审稿人。更多信息请参考：

  https://guslab.org

  长期招收科研助理、博士后、博士研究生、硕士研究生、在读本科生，欢迎对相关方向感兴趣的同学进行联系，可提前进组互相熟悉。'
