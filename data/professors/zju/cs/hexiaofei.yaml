bio_raw: '何晓飞教授是人工智能领域的国际杰出学者，在美国芝加哥大学获得计算机科学博士学位，曾在美国雅虎研究院工作，任职研究科学家。他与流形学习奠基人Partha
  Niyogi教授共同提出的保局投影算法是世界上第一个线性流形算法，在国际上掀起了基于图论的线性降维算法研究热潮。他与微软亚洲研究院合作提出的基于块结构的链接分析算法被誉为下一代互联网搜索引擎的核心算法，被国际上数十家IT专业媒体报道。在雅虎研究院曾领导关于查询语句分类、海量网页分类、广告关键字建议等项目的研究开发工作。目前主要从事机器学习、信息检索、计算视视觉的研究。

  详细主页可以见

  http://www.cad.zju.edu.cn/home/xiaofeihe/'
