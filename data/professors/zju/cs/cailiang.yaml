bio_raw: '蔡亮，研究员，博士生导师，国家级高层次人才计划领军层次入选者，

  中国计算机学会杰出会员，

  浙江大学区块链研究中心常务副主任，浙江大学国家制度研究院特聘研究员、可信数据研究中心主任，浙江省区块链技术研究院院长、浙江省可信数据要素研究院院长。兼任

  全国区块链和分布式记账技术标准化技术委员会副秘书长，中国计算机学会区块链专业委员会副主任、人工智能工作委员会人机对齐工作组组长。蔡亮教授的主要研究方向为区块链、数据要素、人工智能人机对齐。

  蔡亮是国家区块链创新应用试点行动计划的专家组副召集人，他先后参与了中央网信办、中国人民银行、工业和信息化部、国家卫健委、ISO、ITU-T、IEEE等多家权威机构的信息化标准制定，是我国区块链和元宇宙、数据要素领域著名专家。

  截至目前，蔡亮教授应邀为中共中央党校，中国延安干部学院，中央网信办，国家外交部、公安部、科技部、住建部、水利部等部委，全国社会保障基金理事会，国防大学，北京、上海、浙江、重庆、江苏、广东、四川、河南、湖南、江西、甘肃、山西、山东等各地区的政府领导进行多场区块链专题汇报。

  蔡亮教授相关观点和文章曾多次被中央电视台新闻联播、光明日报、人民日报、新华社、中国科学报、法制日报等多家主流媒体及网络媒体采用、转载。

  他主编了多本区块链领域的专著，在国家级核心期刊和国际会议上发表了数十篇论文，曾获得浙江省科技进步一等奖两次，教育部科技进步一等奖一次，研究成果在金融、大型企事业单位得到了广泛应用，取得了显著的社会效益和经济效益。

  蔡亮教授领导的区块链团队立足于国产自主可控联盟链底层技术平台研发，该平台在各大金融机构和国家部委的技术测评中均名列第一，也是国内第一批通过工信部标准院与信通院区块链标准测试并符合国家战略安全规划的区块链核心技术平台。基于该平台，团队已申请专利700余项，获得软件著作权100余项，出版区块链专业著作《区块链技术进阶与实战》，并参与制定区块链国标标准70余项，国家标准10余项，行业及团体标准70余项，总计150余项。同时，该平台已经应用于中国人民银行、中央网信办、住建部、国家市场监督管理总局、四大行、国家电网、沪深交易所、主流商业银行、中国电信、南方航空及谷歌、道富、微软等国际知名企业，产生了突出的社会与经济效益。

