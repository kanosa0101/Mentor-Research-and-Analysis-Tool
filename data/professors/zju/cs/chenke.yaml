bio_raw: '陈珂，浙江大学计算机科学与技术学院副研究员，硕士生导师。2007

  年浙江大学计算机数据库方向博士毕业，2011 年评为副研究员、硕士生导师。主要从事数据库系统和技术、海量信息检索、高效数据处理等方面的研究。近年来的研究重点是如何提升和优化数据处理和信息检索的效率，并改进数据库系统的性能。'
