bio_raw: 蓝磊现任浙江大学计算机辅助设计与图形系统全国重点实验室百人计划研究员。于厦门大学获得博士学位，随后在美国克莱蒙森大学和犹他大学从事博士后研究工作。研究方向主要包括物理仿真、几何建模与GPU并行计算等，在
  ACM Transactions on Graphics（TOG）、SIGGRAPH、SIGGRAPH Asia、AAAI 等国际顶级期刊和会议发表论文二十余篇。近年来主要围绕大规模可变形体仿真、高精度接触建模和机器人并行仿真训练等方向开展研究，承担国自然重点支持项目、
  科技部重大专项等项目，获国家级青年人才项目资助。
