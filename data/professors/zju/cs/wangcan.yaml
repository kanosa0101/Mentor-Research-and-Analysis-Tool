bio_raw: '王灿，浙江大学计算机学院教授，博士生导师。主要研究方向为人工智能、数据挖掘、大规模图智能算法与应用等。发表高水平学术论文100多篇，包括SIGKDD、WWW、AAAI、NeurIPS、IJCAI、CVPR、ICCV、ACM
  MM、SIGIR、ICDE等顶级国际会议长文和顶级国际学术期刊TKDE、TIP、TOIS论文等。授权发明专利20多项。获人工智能顶级会议AAAI 2012最佳论文奖（系该会议1980年创办以来中国大陆学者首篇获奖论文）、数据挖掘重要会议WSDM
  2025最佳论文奖、人工智能领域顶会ACL 2026杰出论文奖，ACM Multimedia 2010最佳论文奖提名。先后作为项目负责人承担国家自然科学基金面上项目、国家自然科学基金联合基金项目、浙江省自然科学基金重点项目、国家科技支撑计划子项目、国际和企业合作项目20多项。在大数据、金融风险防控、智能无障碍技术领域分别获得获2011年、2018年、2019年浙江省科学技术奖一等奖。

  2005年开始担任浙江大学程序设计竞赛队总教练。曾于2011年5月率浙江大学代表队在美国奥兰多夺得ACM国际大学生程序设计大赛世界总决赛冠军。2009年3月率浙江大学代表队在瑞典斯德哥尔摩夺得ACM国际大学生程序设计大赛世界总决赛银牌。2025年荣获“ICPC终身教练奖”。截至2026年，浙江大学已经连续23年晋级国际大学生程序设计大赛世界总决赛。2021年4月—2022年9月担任中国计算机学会NOI浙江省特派员，负责浙江省大学生和中小学生的算法竞赛组织工作。在学生程序设计能力培养上的实践获2014年国家级教学成果奖二等奖，2014年浙江省教学成果奖一等奖等奖项。'
