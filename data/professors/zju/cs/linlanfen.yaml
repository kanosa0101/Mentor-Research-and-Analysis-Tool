bio_raw: '林兰芬，博士，浙江大学计算机学院教授，博士生导师。现任浙江大学人工智能研究所副所长。曾担任浙江大学计算机学院院长助理、浙江省“十三五”重大科技研发攻关和成果转化应用咨询专家，浙江省科技厅“十二五”重大科技专项和成果转化工程咨询专家、“十一五”浙江省制造业信息化咨询专家组成员、

  IFIP WG5.8

  （国际信息处理联合会企业互操作工作组）成员等，担任

  TKDE, Neurocomputing

  ，

  JBHI

  ，

  AAAI

  ，

  MICCAI

  ，

  CSCWD

  等多个国际期刊和国际学术会议的评审专家。

  近年来主要围绕医学图像处理、大数据分析、推荐系统、数据挖掘等方向开展研究，已发表

  SCI/EI

  收录论文

  100

  多篇，

  包括领域顶级或者权威期刊

  TIP

  ，

  IJCV,

  TKDE

  ,

  TMM,

  T

  MI, IEEE T AFFECT COMPUT, Inf. F

  usion

  , JBHI

  和国际会议

  CVPR, AAAI, ICCV, IJCAI, ACM MM, MICCAI, SPIE, ISBI, EMBC

  等，获得

  SPIE Medical Imaging 2017

  ，

  InMed 2015

  最佳学生论文奖。主持国家重点研发计划项目课题、国家

  973

  计划项目子课题、国家

  863

  计划项目、国家科技支撑项目子课题等各类项目

  40

  余项；参与的项目获教育部科技进步二等奖

  1

  项、中国航空工业总公司部级科技进步三等奖

  1

  项、中国电子学会科学技术奖二等奖

  1

  项、中国电子学会电子信息科学技术奖三等奖

  1

  项、

  中国产学研合作创新与促进奖二等奖

  1

  项

  、

  CCF

  科学技术奖科技进步优秀奖

  1

  项。'
