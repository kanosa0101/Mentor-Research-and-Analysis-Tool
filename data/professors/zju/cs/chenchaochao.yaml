bio_raw: '陈超超，现任浙江大学人工智能学院百人计划研究员，博士生导师，国家优青，浙江省优青，主要研究方向为可信人工智能和大模型（隐私保护、安全攻防、公平鲁棒、可逆遗忘）。任IEEE高级会员、CCF高级会员。主持国家基金委青年科学基金项目B类（原优青）项目、国家重点研发计划课题、浙江省优青项目、浙江省“领雁”科技计划项目、CCF-蚂蚁基金等十余个课题，曾作为主要骨干获得了2020
  年度“CCF科学技术奖”-科技进步奖卓越奖、2021年度中国人工智能学会“优秀科技成果奖”、2023年度“CCF科技成果奖”-科技进步奖二等奖、以及2023年度中国人工智能学会吴文俊科技进步奖一等奖。曾在Cell子刊，ICML，NeurIPS，
  TKDE，TDSC等国际会议和期刊发表论文100余篇，引用量达8000余次，获得国内外发明专利授权200余项。担任NeurIPS、ICML、KDD等国际顶级会议领域主席，入选2024和2025年度斯坦福全球Top
  2%科学家榜单。

