bio_raw: '胡天磊，男，

  1982

  年

  10

  月出生，博士，副教授。

  2006

  年毕业于浙江大学计算机学院，获得计算机博士学位。

  2006

  年至今在浙江大学计算机学院工作。在数据库、互联网、人工智能等相关研究领域发表论文

  50

  余篇，大部分论文被

  EI

  、

  SCI

  检索。作为主要研究人员参与了国家

  863

  项目

  “大型通用数据库管理系统OSCAR V6.5研发及应用”，自然科学基金项目“自治数据库系统关键技术研究”，浙江省重大软件专项“大型互联网海量数据存储与处理平台”，重大横向项目“分布式数据库管理与系统开发”等多个研究项目的工作，上述项目的成果在网易互动娱乐有限公司的多个产品中得到了应用，并于2011年和2024年分别获得浙江省科技进步一等奖。'
