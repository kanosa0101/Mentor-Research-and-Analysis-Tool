bio_raw: '何钦铭

  ，

  浙江大学计算机学院教授，博士生导师；国家级教学名师、浙江大学求是特聘学者、中国计算机学会杰出教育奖获得者；

  教育部高等学校大学计算机课程教学指导委员会副主任委员，全国高校计算机基础教育研究会副会长，中国人工智能学会机器学习专委会常务理事，浙江省高校大学计算机课程教学指导委员会主任委员

  。

  曾获国家教学成果一等奖、二等奖，首届全国优秀教材二等奖（高等教育类），浙江省科技进步二等奖，

  浙江省教学成果一等奖、二等奖等；获教育部霍英东优秀青年教师、宝钢优秀教师、浙江省高校教学名师、中国“互联网+”大学生创新创业大赛优秀创新创业导师等荣誉。'
