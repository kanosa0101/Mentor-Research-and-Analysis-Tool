bio_raw: '沈浩頲，计算机科学与技术学院/网络空间安全学院“百人计划”研究员，博导。于复旦大学获得本硕学位后，赴宾夕法尼亚州立大学完成博士学位，先后任美国标准技术局研究员、佛罗里达大学电子和计算机工程系研究员、内华达大学计算机系长聘序列助理教授。2022年加入

  浙江大学网络空间安全学院，

  研究工作结合了计算机、数字电路、半导体工艺、新材料等交叉学科的技术，探

  索新兴技术为安全研究带来的新挑战和新机遇。

  团队目前招收对物联网安全具有浓厚兴趣的博士后/博士/硕士/本科生。尤其欢迎动手能力强且具电路设计、半导体器件、人工智能、或区块链任一方向背景的同学。'
