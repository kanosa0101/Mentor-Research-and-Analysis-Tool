bio_raw: '张明敏，博士，从1994年开始从事计算机图形学、图像处理、虚拟现实、计算机视觉等领域的教学和科研工作。

  曾主持或参加多个科研项目的研究工作（国家自然科学基金，863项目等），已发表论文150多篇，其中SCI收录论文60多篇.发表的期刊包括国际著名期刊(Computers
  & Graphics, The Journal of Visualization and Computer Animation) , 国内一级学报（计算机学报，软件学报、计算机辅助设计与图形学学报）等. 
  1999年有二篇论文分别获浙江省自然科学优秀论文一等奖和二等奖，在2001年, “虚拟现实中声像建模和实时绘制技术的研究”获中国高校自然科学二等奖，2012年

  数字化采矿关键技术与软件开发”获山东省科技进步一等奖，2013年，再获国家科技进步二等奖。'
