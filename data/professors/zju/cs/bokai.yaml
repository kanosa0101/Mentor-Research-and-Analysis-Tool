bio_raw: '浙江大学计算机科学与技术学院副教授，浙江大学网络空间安全研究中心成员。于2013年获香港理工大学电子计算学系博士学位，于2006、2009年获南京邮电大学计算机学院学士、硕士学位。主要研究方向为网络安全。曾在MICRO、HPCA、NDSS、INFOCOM、ToN、TIFS、TPDS等国际会议和期刊发表多篇论文。

  更多信息欢迎参见

  http://list.zju.edu.cn/kaibu

