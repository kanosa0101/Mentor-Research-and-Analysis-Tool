bio_raw: '2025.1 - ，就聚焦/思考两件事情：

  下一代的Scaling方式 —— Beyond Autoregression: Scaling dLLMs

  LLaDA2.0

  100B扩散语言模型，推理速度翻倍，效果跟AR自回归齐平。

  Huggingface：

  LLaDA2.0-Flash(100B MoE）

  LLaDA2.0-mini (16B MoE)

  Github:

  https://github.com/inclusionAI/LLaDA2.0

  训练框架：

  dFactory

  推理/服务化框架:

  Sglang PR

  报道：

  量子位

  机器之心

  2.

  大模型下半场的数据游戏

  何为下半场：

  姚顺雨blog

  Scaling的下半场重视的是

  数据密度

  而非数量，探索如何用 1% 的高质量数据撬动 100% 的性能提升。

  相关技术探索：数据合成、模型蒸馏、专家标注、评测闭环等。

  例如：

  HeartBench（人情味评测）

  2024，TableGPT

  TL；DR：在结构化数据上做Scaling，并入做多模态，解决数据流通、精准定量等问题。

  Huggingface：

  TableGPT2（月均下载量常年1w+，累积近20万，截至2026.1.1）

  、

  TableGPT-R1（Agentic版本）

  报道：

