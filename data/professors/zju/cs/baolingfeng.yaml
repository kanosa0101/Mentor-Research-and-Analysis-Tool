bio_raw: '鲍凌峰，浙江大学副教授，现任区块链与数据安全全国重点实验室主任助理。研究方向为区块链与软件工程，专注于智能合约安全与分析、智能化软件工程、软件安全与质量保障等领域。已在国内外高水平期刊和会议上发表论文90余篇，并获得ISSTA、ICSME、MSR等知名会议杰出论文奖。担任《Blockchain
  Research and Applications》期刊青年编委，多次担任ICSE、ESEC/FSE、ASE等软件工程顶级会议程序委员会委员，以及TSE、TOSEM等权威期刊审稿人。主持“国家网络空间安全“国家科技重大专项项目课题、乾元国家实验室纵向项目、国家自然科学基金面上项目等
  10 余项。

  更多信息请参见个人主页

  https://baolingfeng.github.io。'
