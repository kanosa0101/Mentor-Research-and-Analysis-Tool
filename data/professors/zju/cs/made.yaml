bio_raw: '马德，国家级青年人才，浙江大学计算机学院教授，博导， 主要研究方向为神经形态计算芯片(Neuromorphic)，神经网络处理器(NPU)，片上系统芯片(SoC)等，负责“达尔文”系列类脑计算芯片研发，成果获得“获2020世界互联网大会领先成果奖，入选“2021科创中国”先导技术（电子信息领域）榜单”，先后主持科技部重点研发项目，国家自然科学重点基金(区域创新)、面上项目、青年项目，科技部重点研发课题，浙江省“尖兵”项目等，在TVSLI，TCAD，TCDS，IJCAI等期刊与会议发表论文20余篇，获得发明专利30余项。

  学习经历:

  2004.9-2006.6 浙江大学竺可桢学院混合班          本科

  2006.9-2008.6 浙江大学电气工程学院              本科

  2008.9-2013.6    浙江大学超大规所               博士研究生

  2010.10-2011.01   法国傅立叶大学 VERIMAG实验室, 学习交流

  工作经历：

  2013年6月至2015年12月， 杭州电子科技大学电子信息学院， 讲师

  2014年5月至2014年8月，   欧洲微电子中心(IMEC), 访问学者

  2016年1月至2018年1月，   杭州电子科技大学电子信息学院， 副教授

  2018年2月至2018年12月， 浙江大学计算机科学与技术学院， 讲师

  2019年1月至今                    浙江大学计算机科学与技术学院，副教授，博导'
