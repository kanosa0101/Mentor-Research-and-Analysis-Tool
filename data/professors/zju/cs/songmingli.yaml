bio_raw: '2006年于浙江大学获得计算机科学与技术专业工学博士学位，攻读博士期间获得“微软学者”称号。

  主要研究兴趣包括图像信息处理、机器视觉与模式识别、深度模型知识重组、图机器学习等，

  在IEEE T-PAMI, IEEE T-IP, T-MM, T-SMCB, Information Sciences, Pattern Recognition,
  CVPR, ECCV and ACM MM等在内的会议和期刊上发表论文200余篇。

  担任Information Sciences, Journal of Visual Communication and Image Representation,
  Neural Processing Letters等国际期刊Associate Editor，并且是ACM Multimedia, ICIP, ICASSP,
  ICME, PCM, PSIVT and CAIP等国际会议的审稿专家和程序委员，另外还是IEEE T-PAMI,T-IP, T-VCG, T-KDE, T-MM,
  T-CSVT, TSMCB, IJCV, PR, INS, CVIU等期刊的特邀审稿专家。

  2022--现在，浙大城市学院，讲席教授

  2015--现在，浙江大学，教授

  2015，新加坡国立大学，访问教授

  2012–2014，美国华盛顿大学，访问学者

  2009，新加坡南洋理工大学，访问教授

  2007，香港理工大学，访问学者

  IEEE资深会员，ACM专业会员

  中国图象图形学会高级会员，中国指挥与控制学会高级会员，中国计算机学会会员，中国人工智能学会会员、中国能源研究会会员

  中国图象图形学会视觉大数据专委会委员、中国图象图形学会图像智能边缘计算专委会委员、

  中国能源研究会人工智能专委会委员

  视觉感知教育部-微软重点实验室（浙江大学）副主任

  浙大城市学院超大规模图数据高性能智能计算研究中心主任'
