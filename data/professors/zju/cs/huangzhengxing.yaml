bio_raw: 'Biography

  黄正行，男，浙江大学人工智能研究所教授，博士生导师。围绕医疗临床决策范式转变这一临床医学、信息科学和数据科学领域的交叉研究前沿，开展从数据到知识、从知识到决策的医疗多模态表征学习理论方法研究，成功应用于复杂疾病临床智能决策与精准诊疗。累计发表学术论文100余篇，其中以第一或通讯作者（含共同通讯）在Nature
  Medicine、NEJM AI、Science Advances、Nature Communications、Brain、IEEE-TBME等高水平期刊及AAAI、MICCAI等重要会议发表论文70余篇；成果被多篇综述、评论、年鉴及Nature、Nature
  Medicine、Nature Aging等权威期刊正面引用，并作为核心证据纳入临床专家共识；授权国家发明专利18项；现任中国中文信息学会理事和医疗健康与生物信息处理专委会副主任委员，Society
  for Artificial Intelligence in Medicine (AIME) 理事会成员（国内唯一当选学者）；担任医学人工智能核心期刊《Artificial
  Intelligence in Medicine》Executive Editor，Nature合作期刊《npj Digital Medicine》等6本高水平期刊的Associate
  Editor或编委；入选斯坦福大学/Elsevier发布的“World Top 2% Scientist”2025年度榜单；作为核心成员，荣获军队科学技术进步一等奖、中国电子学会科技进步一等奖、教育部高等学校科学研究优秀成果一等奖等3项省部级重要奖励。

  We are looking for self-motivated Postdoc/PhD/MSc/RA/Interns, who are interested
  in AI in Medicine. Please drop me an email with your CV and transcripts.

