bio_raw: '长期招收保研/考研的博士生、硕士生，暑期实习生以及科研助理。欢迎对科研感兴趣的同学与我联系：zhulinchao@zju.edu.cn。

  朱霖潮，浙江大学百人计划研究员、博士生导师。本科毕业于浙江大学计算机学院，博士毕业于悉尼科技大学，曾担任悉尼科技大学讲师。入选首届谷歌学术研究奖（2021）、福布斯中国30岁以下精英榜（2023）。主要研究方向为大语言模型、智能物理仿真，致力于实现对物理世界的精准预测和交互。曾获得美国国家标准总局TRECVID
  LOC竞赛冠军（2016）、THUMOS动作识别竞赛冠军（2015）、EPIC-KITCHENS第一视角动作识别竞赛冠军（2019，2020）、CVPR MABe多智能体行为建模竞赛冠军（2022）等8项国际竞赛冠军。曾担任Neurocomputing、CVIU客座编辑，国际会议领域主席（IEEE
  MLSP''21、ICIP''24、ECCV''24、NeurIPS''24、CVPR''25等），并多次

  组织

  国际会议专题研讨会。

  学术主页：

  https://ffmpbgrnn.github.io/'
