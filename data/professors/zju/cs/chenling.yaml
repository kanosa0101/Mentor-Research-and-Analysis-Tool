bio_raw: '陈岭，博士、教授、博导，浙江温岭人。1999年6月获浙江大学计算机系工学学士学位，2004年3月获浙江大学计算机学院工学博士学位（导师：

  陈纯

  教授、

  陈根才

  教授）并留校任教。2003年7月至10月在微软亚洲研究院网络媒体组作访问研究，2006年1月至2007年7月在英国诺丁汉大学

  混合现实实验室

  作博士后研究（导师：

  Steve Benford

  教授）。

  现任浙江大学计算机学院

  普适计算实验室

  主任、人工智能省部共建协同创新中心（浙江大学）产业治理智能化实验室主任、鸿程智慧城市大型软件研究院副院长、阿里巴巴-浙江大学前沿技术联合研究中心骨干、OPPO-浙江大学联合创新中心骨干、中国工程科技数据和知识技术研究中心骨干，入选浙江省青年科学家培养计划、浙江省“新世纪151人才工程”、浙江大学求是青年学者。

  主讲数据库系统课程，在网易云课堂开设

  数据库系统原理

  课程。

  研究方向为普适计算、人机交互、人工智能、数据挖掘、数据库，具体包括时序/时空数据挖掘和应用、基于移动/可穿戴设备的情境感知和智能交互、时态网络/知识图谱表示学习和推理、分布式数据管理/机器学习系统等。以项目/子项负责人承担国家和省部级科研项目10余项（国家科技重大专项2项、国家重点研发计划项目3项、国家自然科学基金项目2项、科技委项目3项、中国工程科技知识中心项目2项、浙江省科技计划重点项目3项、浙江省自然科学基金项目2项）。

  在IEEE TKDE、IEEE TMC、UbiComp、NeurIPS、AAAI等国际顶级期刊和会议上发表多篇论文。

  Google Scholar

  引用

  6000

  余次（H指数40）。入选全球前2%顶尖科学家榜单。获期刊DKE

  2015

  年度唯一最佳论文奖

  ，连获HHME 2015、2014最佳论文奖。获授权发明专利70余项。参与制定非结构化数据管理国家标准4项。获2021、2019年度浙江省科技进步一等奖。

  欢迎对实验室方向感兴趣、对科研工作有热情和梦想的同学加入。'
