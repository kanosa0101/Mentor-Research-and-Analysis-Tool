bio_raw: '应晶，男，博士，浙江大学计算机学院教授，博士生导师，浙江大学智能教育研究中心主任，

  浙江大学计算机软件研究所副所长

  。

  浙江大学计算机系分别获得学士、硕士、博士学位。

  2001

  年至

  2003

  年任杭州市信息化办公室副主任。

  2005

  年至

  2014

  年任浙江大学城市学院副院长。中国计算机学会软件工程专业委员会委员，杭州市数字经济人才协会会长，杭州市数字经济联合会副会长。曾获霍英东青年教师奖，入选教育部骨干教师计划，入选浙江省

  151

  人才工程。主持国家自然科学基金、国家

  863

  高科技计划等科研项目多项，已在国内外学术刊物及会议上发表论文

  八十

  余篇。主要从事软件开发方法、软件体系结构、软件工程、大数据等领域的研究工作。'
