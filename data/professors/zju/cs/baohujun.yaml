bio_raw: 鲍虎军，博士，国家杰出青年基金获得者，教育部长江学者特聘教授，浙江大学信息学部主任，中国计算机学会常务理事、计算机学会计算机辅助设计和图形学专业委员会主任。主要从事计算机图形学、计算机视觉和虚拟现实等方面的研究。所领导的团队曾获2001年首届国家创新研究群体科学基金的资助。作为首席科学家，先后二次承担了国家重大基础研究发展规划（973计划）项目虚拟现实和混合现实技术的研究。在国际上首次提出了微分域几何计算理论和方法，解决了网格曲面因线性逼近引发的难以形变编辑处理的难题；提出了复杂虚拟场景的简化逼近、全局光照明实时计算和复杂表面多投影画面无缝拼接的等创新技术，实现了大规模场景的高保真实时绘制和呈现；创新提出了视频场景的摄像机实时跟踪、时空一致的自动深度恢复和三维结构自动恢复等方法，有效解决了视频式虚实融合问题。在ACM
  TOG、IEEE TPAMI、IEEE TVCG等著名国际学术期刊和ACM SIGGRAPH、ICCV、CVPR等国际学术会议上发表学术论文100余篇，获授权国家发明专利10余项。有关研究成果被国内外学者广为引用，并在多本国际图形学专著、ACM
  SIGGRAPH课程和EUROGRAPHICS现状报告中得到评述。合作出版的著作专著一部、编著二部，其中《计算机真实感图形算法基础》获国家优秀科技图书二等奖。“复杂对象的几何表示和计算理论与方法”荣获2013年国家自然科学奖二等奖。所研发的虚拟环境的实时高保真绘制技术及其基础支撑软件平台，在会展业（如上海世博会）和各种训练模拟器中得到了成功应用，荣获2011年教育部高等学校优秀成果奖（科技进步奖）一等奖。指导和合作指导的二篇博士学位论文被评为全国百篇优秀博士论文，三篇被评为计算机学会优秀博士论文。因在科学研究和人才培养方面的工作，他荣获了2017年计算机学会王选奖。
