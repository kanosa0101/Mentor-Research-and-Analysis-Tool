bio_raw: '许海涛，浙江大学百人计划研究员，博士生导师。2015年12月博士毕业于威廉与玛丽学院，2016年1月至2018年5月于美国西北大学先后担任博士后、研究助理教授职位，2018年7月至2020年12月于亚利桑那州立大学担任
  tenure-track 助理教授。

  许博士主要从事网络黑灰产治理

  、大语言模型隐私与安全、攻击检测溯源

  、

  以及

  Web安全

  等领域的研究。其研究成果先后发表在USENIX Security、NDSS、ICSE、

  WWW、

  IMWUT/UbiComp、CHI、TIFS等国际顶级会议以及期刊，部分成果被华尔街日报、中国日报等主流媒体报道。

  招收博士后、博士生、硕士生、访问学生。申请者需具备扎实的网络/系统/安全领域研究基础，具有CTF竞赛获奖经历者将获优先考虑

  。'
