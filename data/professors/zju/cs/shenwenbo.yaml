bio_raw: '申文博，长聘副教授，博士生导师，CCF系统软件、体系结构、网络与系统安全专委执行委员。

  2015年获得美国北卡罗莱纳州立大学计算机博士学位，2015-2019担任三星美国研究院（Samsung Research America，硅谷）操作系统内核安全的技术负责人，2019年回国加入浙江大学计算机科学与技术学院。

  研究方向为操作系统安全

  ，AI系统安全

  ，云原生系统安全，软件供应链安全。

  在IEEE S&P, ACM CCS, USENIX Security, ASPLOS等计算机安全、系统、网络国际顶级会议、期刊发表论文60余篇，

  研究成果多次获得国际重要学术会议认可，获得

  IEEE S&P 2026（CCF-A 类国际会议）、ESORICS 2024、ACSAC 2022、AsiaCCS 2017、NDSS 2016（CCF-A
  类国际会议）

  等

  5项国际会议杰出论文奖

  。其中，作为唯一通讯作者获得

  IEEE S&P 2026 杰出论文奖、

  ESORICS 2024 唯一杰出论文奖（1/535）

  和

  ACSAC 2022 杰出论文奖（3/303，

  国内第一单位首次获得

  ）

  。

  主

  持科技部重点研发课题、国家自然科学基金-面上项目、青年科学项目等十余项科研项目。设计并流片浙大安全芯-求是一号（28纳米工艺），包含多种新型安全机制，与业界最新广泛部署ARM芯片安全方案相比具有显著优势。

  设计、实现并主导部署了体系化操作系统保护方案，部署超过亿部设备。

  研究成果获得蚂蚁学术合作优秀项目，系统与数据安全联合实验室优秀合作奖等奖项，并

  获得人民网、光明网专题报道。

  主导浙江大学操作系统课程和计算机系统贯通课程教学改革，主持省级教改项目《CPU-操作系统贯通人才培养课程建设》。被评为24年

  高校计算机专业优秀教师，22年

  教育部-华为“智能基座”优秀教师，浙江大学

  校级优秀班主任；

  获得

  第二届网络空间安全产学协同育人优秀案例一等奖等

  奖励

  。

  指导多名研究生获得

  国家奖学金、

  省奖学金和浙江大学奖学金；

  指导学生

  获得全国大学生计算机

  系统能力培养大赛（龙芯杯）一等奖，逐梦杯一等奖，全国大学生信息安全竞赛一等奖等奖项，本人获得 4

  次全国大赛优秀指导教师奖

  。

  英文主页

  https://wenboshen.org/

  。

  招收27年入学普博/直博，

  欢迎对系统安全具有浓厚兴趣和科研热情的同学联系咨询。

