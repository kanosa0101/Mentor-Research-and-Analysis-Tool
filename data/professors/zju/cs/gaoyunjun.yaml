bio_raw: '高云君，浙江大学求是特聘教授，博士生导师，国家杰出青年科学基金获得者（2020）、国家优秀青年科学基金获得者（2015），现为ACM SIGSPATIAL

  中国

  分会副主席，全省大数据智能计算重点实验室主任，浙江大学软件学院常务副院长

  ，浙江大学宁波国际科创中心常务副主任，浙江大学计算机软件研究所副所长

  。研究方向为数据库、大数据管理与分析、DB与AI融合。已在国内外顶级学术期刊或会议ACM Computing Surveys、TODS、VLDBJ、TKDE、

  TPDS、

  TOIS、TMC、SIGMOD、VLDB、ICDE、SIGKDD、SIGIR等发表论文200余篇，出版中英文学术专著4部、教材2本（含1本在线教材），授权发明专利40余项，登记软件著作权5项，并获ICDE
  2025最佳展示奖、VLDB 2024最佳研究论文提名、DASFAA 2024最佳论文、ICDE 2022最佳论文、ICDE 2019优秀论文（One of the
  Best Papers）、APWeb-WAIM 2018最佳论文、SIGMOD 2015最佳论文提名、ICDE 2015优秀论文等。主持国家杰出青年科学基金、优秀青年科学基金、国家重点研发计划、973计划、国家自然科学基金联合基金重点等

  20余项

  项目/课题，并获2024年度浙江省安全技术防范技术发明奖一等奖、2025年中国电子学会自然科学奖二等奖、2025年CCF科技成果奖自然科学二等奖、2019年度中国电子学会科技进步特等奖、2016年度教育部科技进步一等奖、2011年度浙江省科学技术一等奖。（曾/现）担任DSE执行主编（Managing
  Editor），TKDE、JCST、FCS、

  DAPD、

  DSE、《计算机研究与发展》等顶级

  /

  重要学术期刊（青年）编委/副编辑（Associate Editor），VLDB、ICDE、SIGIR、SIGSPATIAL、WISE等20余个

  顶级/重要

  国际学术会议的程序委员会/Workshop/Tutorial/宣传/出版

  /本地

  （共同）主席或领域主席，TODS、VLDBJ、TKDE、TMC、TPDS、《软件学报》、《计算机学报》、《中国科学：信息科学》等10余个国内外顶级学术期刊评审专家，SIGMOD、VLDB、ICDE、SIGKDD、SIGIR、WWW、IJCAI、AAAI等10余个顶级

  国际

  学术会议（资深）程序委员会委员。培养多名博/硕士生获得或入选

  KDD Cup 2022风电预测（Wind Power Forecast）赛道全球冠军（1/2046）、

  中国计算机学会（CCF）优秀博士学位论文奖、ACM SIGMOD中国优博奖、

  ACM SIGSPATIAL中国优博奖、ACM中国优博奖提名（全国仅2人）、

  浙江省优秀博士学位论文提名、中国电子学会硕士学位论文激励计划、浙江省优秀硕士学位论文、国家特聘青年专家、国家优秀青年科学基金（海外）

  、

  ACM SIGMOD中国新星奖、

  ACM SIGSPATIAL中国新星奖、

  浙江省杰出青年科学基金、甬江人才计划、华为天才少年、字节跳动筋斗云计划、蚂蚁集团蚂蚁星等。'
