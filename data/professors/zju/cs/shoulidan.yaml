bio_raw: 浙江大学计算机科学与技术学院教授、博导，新加坡国立大学计算机博士。近年来在数据管理与发现、数据准备、数据集成、数据查询分析的智能化领域开展研究，在大数据查询、多模态融合检索、数据智能隐私保护、工业数据智能等技术方面取得了一些创新的研究成果。作为负责人主持了国家重点研发计划项目、自然科学基金等纵向项目十余项，重大横向项目多项，授权国家发明专利数十项，2011年获浙江省科技进步一等奖，2020年教育部科学技术一等奖。在国内外刊物和会议发表论文100多篇，其中数十篇论文在数据库相关的
  CCF A 类刊物与会议 (TKDE, SIGIR, SIGMOD,VLDB, ICDE, ACM Multimedia等)上发表；担任大数据、人工智能重要国际会议VLDB、ICDE、SIGMOD、SIGIR、ACL、NeurIPS等的程序委员；担任国际大数据顶级会议VLDB
  2014的本地主席，中国计算机学会数据库专委会委员，ACM 会员。
