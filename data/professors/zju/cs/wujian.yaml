bio_raw: '欢迎对【医学人工智能】感兴趣的同学联系并报考(硕士/博士)

  欢迎【医学人工智能】相关领域博士后加盟

  吴健，浙江大学求是特聘教授、教育部长江学者、全省医学影像人工智能重点实验室主任、人工智能医疗器械标准化技术归口单位专家组专家、中国计算机学会理事、浙江省医疗数据产业研究会理事长。研究兴趣集中在医学人工智能，发表SCI/EI收录论文100余篇，引用1.9万余次，H-index
  57，单篇最高引用3800余次。国家发明专利授权58项，获国家医疗器械注册三类证1项，二类证4项。主持国家自然科学基金项目、国家重点研发项目等。获国家科技进步奖二等奖1项，省部科技进步一等奖5项。'
