bio_raw: '邵天甲，浙江大学CAD&CG全国重点实验室百人计划研究员、博士生导师，获国家自然科学基金优秀青年科学基金项目资助。加入浙大之前，他在英国利兹大学计算机学院（School
  of Computing, University of Leeds, UK）担任Lecturer（终身教职）。本科毕业于清华大学自动化系，博士毕业于清华大学高等研究院。研究方向是计算机图形学和三维视觉，包括三维场景重建，数字人、3D
  AIGC等。已在计算机图形学和视觉的顶级期刊和会议（ACM TOG, SIGGRAPH, TVCG, CVPR等）发表CCF-A类论文50余篇。他是ACM SIGGRAPH
  2022/2023程序委员，CVM 2022程序委员会共同主席，现担任国际期刊《The Visual Computer》和《Computers & Graphics》编委，中国电子学会虚拟现实分会秘书长。详情请见：

  https://tianjiashao.github.io'
