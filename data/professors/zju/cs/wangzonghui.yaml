bio_raw: '王总辉

  ，男，工学博士，浙江大学计算机科学与技术学院高级工程师、博士生导师，浙江大学

  系统结构与脑机工程研究所副所长

  ，

  国家人工智能应用中试基地（具身智能）前沿应用与测评实验室主任、学术委员会委员兼秘书

  ，浙江大学网信人工智能创新团队执行主任，浙江大学计算机体系结构实验室（ArcLab）副主任，第三届

  浙江省信息安全标准化技术委员会委员

  （2025-2030），长三角新能源汽车产业链联盟、浙江省汽车工业技术创新协会专家委员会专家，CCF大模型能力认证LMCC（青少年组）浙江省主席、LMCC（成人组）杭州、宁波、金华区域主席，《信息网络安全》期刊编委。

  近年来承担了50余项相关领域的“国家农业重大科技”、“国家重点研发计划”、“国家自然科学基金重大研究计划”、“核高基”、“新一代宽带无线移动通信网”等国家重大科技项目、有关部委/省级科研重大项目、先进技术研究重大项目和相关企事业科研重大项目。在CVPR、TDSC、TIFS、TCAD、USENIX
  Security、CCS、ICLR、ICML、ICCV、AAAI、IJCAI、EMNLP、HPCA、ASPLOS、SIGMOD、INFOCOM、WWW、C&S、IJIS、FCS、PR多个重要期刊和学术会议上发表了60多篇高水平学术论文，授权发明专利40余项，标准与规范10余项。曾获Frontiers
  of Computer Science（FCS）期刊的

  Test of Time Paper Award奖

  （2023年）；曾获

  浙江省自然科学奖三等奖

  （2023年）

  ；曾获

  王选新闻科学技术奖一等奖

  （国家级奖项，全国新闻科技最高奖，2025年）。

  长期承担《深度学习基础——理论与实践》、《数字逻辑设计》、《计算机体系结构》、《嵌入式系统》和《高级计算机体系结构》等课程的一线教学工作，作为骨干积极参与计算机系统方向课程的课程教学改革。获

  国家级教学成果二等奖

  （2018年）、浙江省教学成果一等奖（2016年）、国家级精品资源共享课（2013年）。《计算机体系结构》课程获教育部-华为“智能基座”课程奖教金（2023年）。《计算机体系结构》课程获教育部-华为“智能基座”联合工作组颁发的浙江大学-华为“智能基座”产教融合协同育人基地一流课程（2024年）。获英伟达“校园大使”（2024年）。指导学生参加ASC
  2024获二等奖（2024年）、ASC 2025获二等奖（2025年）、华为昇腾AI原生创新算子挑战赛（浙江大学专场）银奖（第2名）（2025年）。

  【实习生招募计划】

  我们诚邀对人工智能，特别是

  大语言模型

  、

  多模态大模型

  、

  具身智能模型

  领域充满热情的在校生加入团队，共同参与

  LLM/VLM/VLA + 体系结构/应用/安全

  等前沿课题研究。实习生将获得：

  1. 导师/高年级博士1对1指导，深度参与国家级/省部级/互联网头部企业科研项目

  2. 开放实验室资源，包括AI算力服务器与丰富数据集

  3. 论文发表与专利申请的全程支持

  4. 线上/线下实习均可（每周至少3天）

  要求：计算机/人工智能/网络空间安全等相关专业，有深度学习和大语言模型基础。

  收获：实习证明 + 推荐信 + 科研成果署名权

  长期接收简历投递：

  zhwang@zju.edu.cn

  （邮件标题请注明【实习生招募计划】）

  实验室地址：浙江大学玉泉校区'
