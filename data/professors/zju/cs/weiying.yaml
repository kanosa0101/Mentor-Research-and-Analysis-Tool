bio_raw: '欢迎对人工智能、机器学习及其前沿应用充满热情的同学加入我的研究团队！

  长期招收博士生、硕士生、研究助理和实习生

  。如果你对迁移学习、连续学习、基座模型或AI在科学计算中的应用感兴趣，期待与你一起探索前沿领域。我们致力于在高水平会议和期刊上发表高质量成果，提供丰富的研究资源和广阔的发展平台。

  感兴趣的同学请在实验室主页阅读详细信息和申请方式

  ：

  https://wei-ying.net/

  。

  魏颖，浙江大学“百人计划”研究员、博士生导师，入选国家高层次青年人才项目。

  2012

  年于华中科技大学获得学士学位，

  2017

  年于香港科技大学获得博士学位。曾于

  2023

  至

  2024

  年担任新加坡南洋理工大学计算机科学与工程学院“南洋”助理教授，

  2021

  至

  2023

  年担任香港城市大学计算机科学系助理教授，

  2017

  至

  2021

  年在腾讯人工智能实验室担任高级研究员。

  研究方向主要包括人工智能、机器学习（迁移学习、连续学习）、基座模型，以及人工智能在科学计算中的应用。在

  ICML

  、

  NeurIPS

  、

  ICLR

  等机器学习顶级会议及

  SCI

  一区期刊上共发表论文

  60

  余篇。曾获

  ICLR 2024

  年最佳论文奖提名、

  ACM SIGKDD 2014

  年最佳论文奖提名、

  2021

  年度腾讯犀牛鸟专项研究计划卓越奖、香港政府博士奖学金。现担任期刊

  TMLR

  的执行编辑，会议

  ICML

  、

  NeurIPS

  、

  ICLR

  的领域主席，以及

  AAAI

  高级程序委员等。'
