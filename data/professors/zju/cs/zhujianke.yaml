bio_raw: '浙江大学计算机科学与技术学院教授，IEEE资深会员。

  于2009年获计算机科学与工程博士学位，

  是

  同年度香港中文大学工程学院最优博士论文奖

  以及香港中文大学青年学者论文奖

  获得者

  。攻读博士期间曾

  作为访问学者

  于

  UIUC ECE系 Image

  Foundation

  and Processing Group交流。2009年1月进入瑞士ETH Zurich BIWI Computer Vision Lab

  进行博士后阶段研究。曾担任阿里巴巴-浙江大学前沿技术联合研究中心计算机视觉与视频分析实验室主任，主持的“俪知虚拟人”项目荣获阿里巴巴集团学术合作最佳项目奖。研究方向为：计算机视觉与模式识别

  。

  目前担任国际期刊Neurocomputing编委。是

  包括

  IEEE TPAMI

  /

  TIP/TNNLS

  、

  ACM Computing Survey

  /

  TOIS

  /

  TIST在内的多个

  国际

  期刊

  审稿人，以及AAAI/IJCAI/CVPR等会议的PC和SPC

  。

  Selected papers:

  [1]

  Wentong Li, Yuqian Yuan, Jian liu, Dongqi Tang, Song Wang, Jie Qin,

  Jianke

  Zhu*

  , Lei Zhang, “TokenPacker: Efficient Visual Projector for Multimodal LLM”,

  International Journal of Computer Vision (

  IJCV)

  , 2025.

  [2]

  Yisu Zhang,

  Jianke Zhu*

  , and Lixiang Lin, “FastMESH: Fast Surface Reconstruction by Hexagonal Mesh-based
  Neural Rendering”,

  Comput. Vis. Image Underst.

  , 2025.

  [3]

  Xiaolu Liu, Ruizi Yang, Song Wang, Junbo Chen,

  Jianke Zhu*

  , “Uncertainty-Instructed Structure Injection for Generalizable HD Map Construction”,

  CVPR2025

  .

  [4]

  Hanxun Yu, Wentong Li, Song Wang, Junbo Chen,

  Jianke Zhu*

  , “Inst3D-LMM: Instance-Aware 3D Scene Understanding with Multi-modal Instruction
  Tuning”,

  CVPR2025

  .

  [5]

  Wentong Li, Wenyu Liu,

  Jianke Zhu*

  , Miaomiao Cui, Risheng Yu, Lei Zhang, and Xiansheng Hua, “Box2Mask: Instance Segmentation
  by Level Set Evolution”,

  IEEE Trans. on Pattern Analysis and Machine Intelligences (T-PAMI)

  , 2024.

  [6]

  Zhuopeng Li, Chunming Wu, Liangjun Zhang, and

  Jianke Zhu*

  , “DGNR: Density-Guided Neural Point Rendering of Large Driving Scenes”,

  IEEE Transactions on Automation Science and Engineering

  , 2025.'
