bio_raw: 陈林博士，现为浙江大学百人计划研究员。之前为德克萨斯理工大学Tenure Track助理教授。他于2013年在浙江大学取得计算机专业博士学位，之后曾先后在柏林工业大学，慕尼黑工业大学等从事博士后工作。他的研究兴趣为理论计算机领域的近似算法和参数算法。他当前的研究重点为加性组合(additive
  combinatorics)理论与算法设计的结合，课题包括子集和(subset-sum)，背包(knapsack)，调度/排序(scheduling)，整数规划(integer
  programming)，双层优化(bi-level optimization)等。他的研究获得(美国)自然科学基金(NSF 1756014)，(中国)自然科学基金优秀青年科学基金项目（海外）的资助。
institutes: []
research_direction_raw: 算法与计算复杂性，组合优化，整数规划，加性组合理论
