bio_raw: '章敏，浙江大学百人计划研究员，国家级青年人才，计算机（纽约州立大学石溪分校）数学（浙江大学）双博士，数学与应用数学（浙江大学）学士，曾任哈佛大学博士后，哈佛医学院讲师，主持科技创新2030-“新一代人工智能”重大项目青年科学家项目，国自然青年基金，曾主持美国NIH
  Career Award, 入选百度AI华人女性青年学者榜，获国际医学核磁共振学会 Summa Cum Laude Merit Award（TOP5%）, 世界华人数学家联盟最佳论文奖，中国科协海外华人创新创业一等奖，浙江省科技进步一等奖，浙江省教学成果特等奖等一系列的基金和荣誉。致力于人工智能交叉研究，通过将数学的经典理论应用到人工智能算法研究中，针对不同的科学问题，提出切实有效的解决方案。主要研究方向：人工智能算法和理论，AIGC，AI
  for Science等。

  长期招收博士生，硕士生，本科生，博士后，有意者请联系（min_zhang@zju.edu.cn）

  浙江大学计算机学院DCD实验室章敏研究员团队招生.docx'
