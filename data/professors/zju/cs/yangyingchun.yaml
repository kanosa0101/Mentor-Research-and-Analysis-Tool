bio_raw: '浙江大学计算机学院副教授，博士，硕士生导师，

  ACM

  会员，计算机学会高级会员。

  2000

  年毕业于浙江大学电气学院，获控制理论与控制工程专业博士学位。

  2002

  年浙江大学计算机学院博士后出站留校任教。研究方向为模式识别与机器学习。曾主持国家自然科学基金、

  863

  计划、浙江省自然科学基金等多项国家级、省级科研项目。目前开展包括声纹识别、深伪语音鉴别、音乐可视化计算、遥感计算计算在内的研究工作。迄今已在国内外相关领域权威期刊及会议上发表高质量学术论文

  60

  余篇，出版专著

  1

  本，已获授权中国发明专利近二十项、美国专利一项、软件著作版权

  6

  项。'
