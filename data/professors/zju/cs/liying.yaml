bio_raw: '李莹，博士，浙江大学计算机学院副教授，浙江大学滨海产业技术研究院养老健康创新服务研究中心主任。2000年在浙江大学计算机软件专业获博士学位，2013年美国加州大学圣芭芭拉分校(UCSB)访问学者。入选浙江省新世纪151人才工程。长期从事服务计算、平台软件、业务过程管理等领域的研究及其产业化应用工作。作为负责人承担科研项目10余项，其中国家重大专项、国家科技支撑计划、国家863计划、国家自然科学基金项目等国家级项目6项。研发的钱塘中间件平台软件等成果获国家科学技术进步二等奖1项、省部级科技进步一等奖4项；已发表研究论文50余篇，其中SCI/EI收录30余篇；已授权国家发明专利60余项。

  他重点对现代服务业领域的共性支撑技术开展了相关研究，围绕复杂服务系统，发明了一系列核心技术，标志性成果有：1)负责研制具有自主知识产权的钱塘中间件平台软件，该平台通过Intel公司的专业测试、Sun公司认证，性能优于国际主流产品。该成果应用于电子商务、金融证券、电信服务、公共服务等七大行业，服务于以网易、中国电信、浙大网新、新中大、淘宝、北京方正为代表的80
  多家软件服务供应商，大幅减少了企业IT 建设与维护成本，增强了软件平台的自主可控、持续发展的能力。2）与中国电信融合通讯支撑与运营中心合作，研制电信ECP融合通讯产品及相关增值服务，在全国15个省市开通业务，已有600万用户。'
