bio_raw: 叶德仕，浙江大学计算机学院副教授。2005获得浙江大学数学系理学博士学位。研究方向为：计算机软件与理论，算法设计与分析，算法机制设计与博弈论等。至今发表国际期刊论文40多篇。主持国家自然科学青年科学基金１项和面上项目2项。
