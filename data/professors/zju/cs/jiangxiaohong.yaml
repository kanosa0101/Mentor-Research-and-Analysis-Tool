bio_raw: '姜晓红，博士，浙江大学计算机学院副教授。研究方向为分布式系统、云计算、中医药数据挖掘。教学上从事本科生专业核心课程《计算机组成》《计算机体系结构》和研究生学位课的《高级计算机体系结构》的教学工作。

  ACM/IEEE会员，中国计算机学会高级会员，计算机学会体系结构专委会委员。曾参加“分布式虚拟环境关键技术及应用研究”、“数字奥运博物馆”等多项国家自然科学基金项目。作为负责人承担并完成了二项国防科工委的预研基金项目；主持二项浙江省重点专项“基于HLA的大规模分布式仿真系统”“支持屏幕拼接的大规模集群渲染系统研究开发”。作为项目骨干参与了国家973项目“虚拟计算系统评测理论与方法研究”。作为负责人承担国家863重大专项“云计算一期”的课题“互联网语言翻译系统研制”(2011AA01A207）的子课题“基于海量语言资源的语言翻译分布并行处理技术”,以及国家自然科学基金项目“虚拟计算系统的能耗管理方法研究”。在国际期刊、国际会议上发表论文六十余篇。2015年获国家科技进步二等奖（6/10），2014年1月获国家教育部技术发明一等奖（5/6），2001年12月高校科学技术二等奖（4/6）。获授权专利15项，软件著作权5项。'
