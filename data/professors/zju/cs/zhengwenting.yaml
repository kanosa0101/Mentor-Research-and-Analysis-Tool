bio_raw: '浙江大学计算机学院

  CAD&CG

  国家重点实验室，副教授。

  1994

  年在浙江大学计算机系（混合班优秀生培养计划）获得工学学士学位，

  1999

  年在浙江大学应用数学系获得理学博士学位。

  1999

  年起在浙江大学任教，

  2001

  年晋升副高。曾任浙江大学南昌研究院首任技术总监。主要研究方向为计算机图形学、虚拟现实、可视化和三维

  GIS

  。近年来在国内外核心刊物及重要学术刊物上发表论文二十余篇，主持完成了多项

  863

  项目、国家重点研发项目子课题等纵向项目以及数十项企业合作横向科研项目。

  2006

  年获陆增镛

  CAD&CG

  高科技奖二等奖；

  2013

  年获中国测绘学会测绘科技进步奖一等奖、湖北省技术发明奖二等奖；获

  CVM2013

  国际学术会议最佳论文奖。'
