bio_raw: 浙江大学百人计划研究员，博导。本科毕业于北京大学，硕士毕业于中科院大学，博士毕业于芬兰奥卢大学。获得芬兰科学院博后奖金，2020年至2023年4月在芬兰奥卢大学担任tenure
  track助理教授，主持芬兰科学院、芬兰工作环境基金会等多个科研项目，并荣获奥卢大学2019最具科学领导力的青年学者奖。2023年底加入浙江大学网络空间安全学院，兼任奥卢大学客座教授。研究领域包括机器视觉、机器学习、情感计算、生物识别等。具体方向有微表情识别、基于视频的远程生理信号测量、生物特征识别、人脸活体检测、对抗攻击和伪造检测、多模态情感识别和内容生成等等。发表期刊和会议文章70余篇，包括高水平期刊和会议文章如IEEE
  TPAMI、TAC、SPM、PIEEE、IJCV、ICCV、CVPR等十余篇，谷歌学术检索H指数40，总引用8900，入选2022至2024年全球2%高被引学者。IEEE高级会员，IEEE
  MLSP委员会委员，ELLIS会员，CSIG情感计算与理解专委会常委，担任IEEE-TCSVT、IEEE-TMM、CVIU和IVC期刊副编辑。关于微表情的研究被麻省理工科技评论报道，远程心率测量文章获IEEE芬兰区2020年最佳学生论文奖。
