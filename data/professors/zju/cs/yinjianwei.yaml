bio_raw: '2001年获浙江大学计算机科学与技术专业博士，2008年

  美国佐治亚理工学院访问学者，同年晋升教授；2018年受聘浙江大学求是特聘教授。

  现任计算机科学与技术学院院长、

  软件学院院长、浙江大学宁波国际科创中心主任、

  全省数智服务技术重点实验室主任

  、浙江大学创新管理与持续竞争力研究中心副主任（

  国家哲学社会科学创新基地），历任浙江大学计算机科学与技术学院副院长（2017.9-2024.3）、浙江大学发展规划处处长（2024.3-2026.5）

  。

  国家杰出青年基金项目获得者（2019.1-2023.12），入选国家级人才计划（2017年）

  ，担任教育部软件工程专业教指委副主任委员（2026年）、

  IEEE TSC编辑（AE，2015年）

  、

  中国计算机学会服务计算专委主任委员（2020年-2023年，2022年度获评学会年度优秀专委）、中国计算学会理事（2020年-2023年）、

  工信部服务型制造联盟专家委员会副主任委员（2017年至今）、示范性软件学院联盟副理事长（2024年至今）、浙江省服务型制造协会会长、浙江省电子信息类教指委召集人、杭州市计算机学会副理事长（2023年至今）、浙

  江省科协常务理事、中国计算机学会2020年度杰出讲者。

  担任科技部“文化科技与现代服务业”国家重点研发计划专家组副组长、工信部工业互联网战略咨询委员会委员

  ，信息物理社会与可信服务计算教育部重点实验室学术委员会委员，

  服务计算顶会ICSOC2020名誉主席，

  CollaborateCOM2020、

  CBPM2015

  大会主席，IEEE

  ICWS2024、

  IEEE SCC2020、ICSOC

  2018

  、

  ICDCS2017 Application Track

  、

  IEEE

  CIC

  2015

  等国内外相关知名会议的程序委员会

  主席

  或共同主席，应邀在IEEE SSE2024、

  NCSC2017

  、

  CBPM2017

  等会议上做大会特邀报告，2016年应邀参加日本湘南会议，担任多个国际会议的程序委员会委员。

  在

  TC

  、TKDE、TPDS、TSC、HPCA、MICRO、ISSTA、CHI、IJCAI、AAAI、VLDB、SIGMOD

  等国际期刊及会议发表百余篇论文，多篇论文入选ESI高被引用论文，获得服务计算

  Top期刊/会议FedGraph2022、IEEE TII2021、IEEE TSC2017、

  ColllaborateCOM2020、IEEE SMDS2020、

  ICSOC2017

  最佳论文/亮点论文，指导学生获得ICSS2020、ICWS2019、CollaborateCOM2019、I

  EEE SCC2012

  最佳学生论文奖。2024年获得IEEE TCSVC专委会授予的Outstanding Leadership Award年度唯一奖项。

  主编或参编《量子计算系统与软件》（科学出版社，2026年待出版，

  入选国家科学技术学术著作出版基金

  ）、《数智浪潮-数智时代的认知与思维》（中信出版集团，2026年7月）、《Convergence in Crossover Service》

  (Springer出版社，2023年，入选国家科学技术学术著作出版基金)

  、

  《Mobile Service Computing》

  (Springer出版社，2020年)、《服务计算十讲》（机械工业出版社，2023年）、

  《数字长三角战略2024-引领数字中国》（浙江大学出版社，2024年）

  等专著；主编国家“十一五”重点规划教材《客户关系管理》（浙江大学出版社，2002年/2011年）教材；《

  “天眼”助力生态文明建设：卫星遥感技术在生态建设中的案例研究》案例，入选中国专业学位案例库（2022年）。

  承担或完成国家重点研发计划（项目负责人）

  、国家重大科

  技专项（项目负责人）

  、国家自然科学基金、

  863

  计划、国家科技支撑计划等

  10

  余项国家级重大项目，担任ISO TC215/ISO TC312委员会委员，

  主持发布2项ISO国际标准（ISO TS 5777：Service Network、ISO TS 5788：Service Pattern）、发布2项国家标准，

  与北控集团、恒生电子、神舟软件、杭氧集团等头部企业成立联合研究中心，牵头研制建木服务网络平台、太元量子软件、榫卯操作系统、坤为产品服务操作系统、高分网格等多个首台套系统，研究成果应用在淘宝、蚂蚁集团、中国电信、中国航天、网易、新华三、同花顺、恒生电子等

  50

  余家大型单位，获得10余项PCT国际发明专利授权、

  150余

  项国家发明专利授权，以第一或第二获奖人获得

  1

  项国家科技进步二等奖、

  7

  项省部级及国家级学会科学技术一等奖、1项中国专利银奖、1项2022日内瓦国际专利展金奖。

