bio_raw: '王志波，计算机科学与技术学院/网络空间安全学院教授，博士生导师，国家自然科学基金青A项目、优青获得者，网络空间安全学院副院长，区块链与数据安全全国重点实验室主任助理。

  2007年毕业于浙江大学信息学院自动化专业，获学士学位；2014年获美国田纳西大学诺克斯维尔分校计算机工程博士学位。曾任武汉大学计算机学院副教授和武汉大学国家网络安全学院教授。现为CCF杰出会员，ACM/IEEE/电子学会高级会员，网络空间安全学会青工委副主任、

  电子学会网络空间安全专家委员会副秘书长、电子学会物联网专家委员会青年常委、

  CCF物联网专委会常委、CCF网络与系统安全专委会常委、人工智能学会智能信息网络专委会常委、CCF大数据专家委员会委员、CCF网络与数据通信专委会委员、中国通信学会云计算与大数据应用委员会首届委员。

  主要研究方向包括

  智能

  物联网、

  人工智能安全、数据安全与隐私保护、

  端云大模型协同计算与安全

  。在网络与安全领域发表高水平论文170余篇，其中CCF 推荐的A类论文90余篇、ESI高被引论文九篇，入选

  全球前2%顶尖科学家榜单和

  爱思唯尔(Elsevier)中国高被引学者榜单，

  主持国自然青A、优青、联合基金重点项目、科技创新2030-新一代人工智能重大项目课题等国家级项目，研究成果服务于华为、阿里、蚂蚁金服、百度、浪潮、

  新华三、海康威视、

  杭州城市大脑等头部企业，授权发明专利20余项。受邀担任IEEE Transactions on Cloud Computing、电子学报英文版的期刊编委，USENIX
  Security、WWW、INFOCOM、ICDCS、KDD、AAAI等多个国际著名会议的大会程序委员。荣获电子学会自然科学一等奖、浙江省自然科学一等奖、湖北省自然科学一等奖和浙江省科技进步一等奖，IEEE
  可扩展技术专委会职业中期研究成就奖，IEEE HPCC 2019国际会议杰出论文奖、FUSION 2019和Bigcom 2023国际会议最佳学生论文奖，浙江大学信息学部个推青年创新奖，电子学会优秀科技工作者与先进工作者。

  招收博士后

  ，团队依托浙江大学区块链与数据安全全国重点实验室，与华为、阿里、蚂蚁金服等企业有良好的合作关系，待遇好、机会多，

  欢迎从事大模型/智能体安全、

  端云协同计算与安全、

  隐私计算等方向的博士与我联系。

  招收博士/硕士/本科生

  ，要求对物联网/人工智能/信息安全/边缘计算感兴趣。要求具备较好的数学基础、编程能力、英语读写能力和参与科研的激情。有兴趣的请与我邮箱联系。'
