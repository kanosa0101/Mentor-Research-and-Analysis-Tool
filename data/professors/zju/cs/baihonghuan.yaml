bio_raw: '教学课程：

  软件逆向工程高阶、密码学、软件保护技术、汇编语言、汇编语言程序设计基础、C程序设计、计算机科学基础

  研究方向：

  逆向工程(reverse engineering)

  主要成就：

  90年代初在学习了BASIC、PASCAL、Fortran、C等计算机语言后，意识到必须学习80x86汇编语言才能真正了解计算机的底层知识并与CPU对话，于是开始了漫长的学习汇编语言的过程。对汇编语言知识技能的掌握主要通过以下途径实现：阅读图书馆的所有原版汇编书籍、分析机房里提取的计算机病毒、用汇编语言写杀毒程序、分析并破解商用加密软件如Lock89、Lock93、Lock93NT、Lock95、KeyMaker、Bitlok、Lockup。2006年起开设《汇编语言程序设计》公选课，2009年开设《软件逆向工程技术》作为《汇编语言程序设计》的后续课程，培养了大批热衷于研究信息安全的学生。2015年起担任浙江大学信息安全战队AAA的指导老师，2020年AAA和腾讯eee、交大Oops、复旦******组成联合战队A*O*E打败美国队PPP，夺得DEFCON
  CTF 2020决赛冠军。2020年6月起，对开源虚拟机Bochs进行调试分析，目的是找出著名16位调试器Soft-ICE在Bochs虚拟机中发生崩溃的原因，在经历了9个月的艰辛调试后，即2021年3月，终于找到并修复了Bochs源代码中造成Soft-ICE崩溃的重大bug，解决了十多年来国内外一直悬而未决的难题。从此，学习汇编语言及逆向工程的学生拥有了一个在Bochs虚拟机环境下复活的调试利器——Numega
  Technology''s S-ICE。本人提交的Bochs虚拟机bug链接为:

  https://sourceforge.net/p/bochs/patches/558/

  If it runs, it can be cracked!

  http://cc.zju.edu.cn/bhh

  iceman@zju.edu.cn'
