bio_raw: '吴春明，男，籍贯浙江萧山，博士、教授、博士生导师，现任浙江大学系统结构与网络安全研究所副所长。长期从事新型网络体系结构、可重构网络与虚拟化、软件定义网络、网络测量、可编程网络、网络空间主动防御、工业互联网与内生安全等领域的科研工作，主持和参与了国家973重点基础研究发展计划、国家863高技术研究发展计划、国家自然科学基金、国家科技基础条件平台建设、国家重点研发计划等二十余项课题的研究与开发工作。曾担任国家“十二五”863信息领域网络与通信技术主题专家组专家，国家“十三五”重点研发计划“网络空间安全”专项编制组专家，国家2030科技专项“国家网络空间安全”重大项目实施方案编制组专家。

  授权和申请国家发明专利七十余件，发表学术论文八十余篇，其中虚拟机漏洞发现的研究成果荣获ACM CCS2021 Best Paper Awards；Scavenger、Autospear两项安全成果分别入选2021、2022世界黑帽大会BlackHat-Asia；面向可编程网络的低开销网络测量的研究成果在IEEE
  INFOCOM 2021上荣获了最佳论文候选奖，基于可编程交换机的高性能网络功能虚拟化部署框架在IEEE/ACM IWQoS 2021上荣获了最佳论文奖；共计发现云漏洞三十余项，获得包括Redhat、Oracle在内的全球知名厂商CVE致谢二十余件。'
