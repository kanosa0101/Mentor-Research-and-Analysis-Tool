bio_raw: '韩劲松，浙江大学计算机科学与技术学院教授，博导。2007年在香港科技大学计算机科学与工程学系获博士学位。研究工作主要集中在物联网安全、可信认证、智能感知和移动计算等方面。承担多项国家级重要科研项目，近年来在国际一流期刊与重要国际会议上发表论文百余篇；获2026年网络与分布式系统安全研讨会（

  NDSS）杰出论文奖、2019年IEEE 信息通信年会（INFOCOM）最佳论文奖、2019年全球通信会议（GLOBECOM）最佳论文奖、2021年

  INFOCOM最佳论文提名奖、2021年ACM 嵌入式网络传感器系统(SenSys)最佳论文提名奖、

  2011年香港信息及通讯科技奖最佳研究与创新奖，获选“高校计算机专业优秀教师奖励计划”，2018年ACM 西安优博指导教师。

  目前招收博士/硕士/访问学生，欢迎有较好的编程功底，对系统搭建有浓厚兴趣的同学

  报考咨询

  ，有底层开发经验和安全/控制/通信/电子背景者为佳。

