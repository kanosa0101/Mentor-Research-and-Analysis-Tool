bio_raw: '吴鸿智，浙江大学计算机科学与技术学院计算机辅助设计与图形学国家重点实验室教授、博士生导师。本科毕业于复旦大学计算机科学与工程系，博士毕业于美国耶鲁大学计算机科学系，师从Julie
  Dorsey和Holly Rushmeier教授。曾于微软亚洲研究院网络图形组担任访问学生。目前主要研究兴趣为计算机图形学与视觉、虚拟现实和三维重建。

  更多信息请访问网页http://hongzhiwu.com/'
