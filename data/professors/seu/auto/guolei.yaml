bio_raw: 郭雷，1966年4月生于山东曲阜。北京航空航天大学教授，飞行器抗干扰控制系统研究中心主任，飞行器控制一体化技术国防科技重点实验室副主任；国家杰出青年科学基金获得者、教育部长江学者特聘教授、中组部万人计划领军人才、国家有突出贡献中青年专家、国家级百千万人才工程入选者；兼任教育部“飞行器抗干扰控制理论及应用”长江学者创新团队、科技部“飞行器先进导航与控制系统技术”重点领域创新团队负责人，中国自动化学会导航制导与控制专业委员会主任，国防基础科研某领域、军科委某重大专项、基金委重大研究计划等专家组成员。分别于1988、1991和1997年获得曲阜师范大学学士、硕士和东南大学博士学位。1997至2000年先后为东南大学和法国南特中央理工大学（IRCCYN）博士后；2001至2006年曾先后获得英国皇家学会访问基金、日本JSPS外国特邀研究员基金，在英国拉夫堡大学、曼彻斯特大学和日本冈山县立大学合作研究。2003至2006年任东南大学教授，2006年至今先后任北京航空航天大学仪器科学与光电工程学院和自动化与电气工程学院教授，曾兼任北京航空航天大学人事处副处长、国际交叉科学研究院常务副院长。长期从事复杂系统抗干扰控制理论、飞行器自主导航与控制技术以及无人系统仿生智能领域的研究，发表SCI论文320余篇，授权发明专利150余项，出版学术专著6部；作为第一完成人曾获得2013年国家自然科学二等奖、2018年国家技术发明二等奖、2007年教育部自然科学一等奖、2017年国防技术发明一等奖以及2019年杨嘉墀科技奖一等奖等学术奖励。当选北京市第十四和十五届人大代表。
