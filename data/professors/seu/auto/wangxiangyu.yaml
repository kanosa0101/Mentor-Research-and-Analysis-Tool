  程序委员会主席，

  工业电子旗舰会议第43届IEEE工业电子学会学术年会(IECON 2017)共同出版主席，变结构控制旗舰会议第14届国际变结构系统会议(VSS 2016)出版主席，第七届电子工程与信息学国际学术会议(EEI
  2025)出版主席,

