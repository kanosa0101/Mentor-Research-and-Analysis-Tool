bio_raw: '王翔宇，江苏丰县人，东南大学青年首席教授、博士生导师，未来技术学院副院长(挂职)，控制理论与控制工程专业，国家级青年人才，紫金山英才C类人才。担任自动化学院学术委员会委员，江苏省自动化学会秘书长，江苏省科学技术协会第十一届委员，是江苏省优秀青年基金获得者，江苏高校“青蓝工程”优秀青年骨干教师培养对象，东南大学“至善青年学者”支持计划A层次入选者，江苏省科协“青年科技人才托举工程”入选者。2009年6月本科毕业于东南大学数学系，2014年6月博士毕业于东南大学自动化学院(专业为控制理论与控制工程，导师为李世华教授)，随后留校任教。博士学位论文获“2015年度东南大学优秀博士学位论文”。曾访问香港大学、美国德克萨斯大学圣安东尼奥分校、韩国岭南大学、澳大利亚墨尔本皇家理工大学和西悉尼大学。目前主要的研究方向为非光滑控制、抗干扰控制及其在多智能体系统分布式协调控制、飞行器系统控制、电力电子系统控制中的应用等。先后主持国家自然科学基金项目3项(包括面上项目2项、青年基金项目1项)，作为联合承研单位主持人参与

  KGJ某领域项目1项，

  作为合作单位主持人参与国家自然科学基金重点项目1项（排2），主持江苏省自然科学基金优秀青年基金、青年基金项目，航空科学基金项目等省部级项目多项，主持企业委托横向项目多项等。在国内外学术期刊和会议发表或录用论文100余篇，其中SCI论文70余篇，20余篇发表或录用在Automatica、IEEE
  Trans系列汇刊、《自动化学报》等权威期刊(包括一作Automatica和IEEE TAC长文3篇)。授权国内外发明专利26件，其中17件排1。以第二作者在科学出版社出版专著《滑模控制理论与应用研究》(2022)。

  在

  2023

  年

  IEEE

  第

  15

  届自抗扰控制研讨会

  (IEEE 13th Workshop on ADRC)

  和第八届控制工程与先进算法国际论坛

  (IWCEAA 2024)

  等会议和论坛做大会报告。

  获2023年度“东南大学青年五四奖章”，2023年度东南大学“科远至善人才基金”，2022年度教育部自然科学奖一等奖、2022年日内瓦国际发明展金奖、2018年度山东省高等学校科学技术奖一等奖、2014年度教育部自然科学二等奖、2025年度江苏省行业领域(电子信息领域)十大科技进展、华为公司“火花奖”等奖项，入选斯坦福2023年、2024年、2025年、2026年全球前2%科学家榜单。1篇论文入选2023年江苏省自然科学百篇优秀学术成果论文，获国内外学术会议最佳论文奖3项、优秀论文奖2项。作为副导师指导的硕士生李桂璞、王国栋(导师：李世华、王翔宇)分别获2018年度和2020年度江苏省优秀硕士学位论文、东南大学优秀硕士学位论文。作为指导教师指导的本科生黄赛金获2019年度东南大学校优秀本科生毕业设计。

  现任江苏省科协第十一届委员，江苏省自动化学会(5A级学会)秘书长，江苏省智能制造学会联合体副秘书长。任IEEE高级会员，中国自动化学会高级会员、机器人专委会委员和无人飞行器自主控制专委会委员，中国指挥与控制学会高级会员和具身智能专委会常务委员以及智能控制与系统、自抗扰控制等3个专委会委员。任国际SCI期刊IET
  Control Theory and Applications副编辑(Associate Editor)、国际SCI期刊International Journal
  of Micro Air Vehicles副编辑(Associate Editor)、国际期刊Advanced Mechatronics副编辑(Associate
  Editor)

  ，自抗扰控制旗舰会议2019年IEEE第13届自抗扰控制研讨会(IEEE 13th Workshop on ADRC)组委会主席，模型预测控制旗舰会议

