  )程序委员会主席，第6届国际自主系统大会(ISAS 2023)邀请组主席，第9届IEEJ感知、驱动、运动控制与优化国际会议(SAMCON 2023)财务主席，2017年中国自动化学会华东六省一市学术年会出版主席和2018年、2019年、2020年江苏省自动化学术年会(JACA)出版主席。在2024年第八届控制工程与先进算法国际论坛(IWCEAA
  2024)作大会报告，在2024年第四届近海风能波浪能国际学术创新论坛(IFOSWWE 2024)作大会报告，在2023年IEEE

  第15届自抗扰控制研讨会(IEEE 15th Workshop on ADRC)作大会主旨报告。担任2024年、2025年第15届、16届江苏省大学生机器人大赛副主任。担任2026全国中小学人工智能探究性学习训练营(南京)主要负责人。'
