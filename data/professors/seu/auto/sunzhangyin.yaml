bio_raw: '孙长银，

  中国自动化学会会士，

  1975

  年

  8

  月出生于安徽霍邱，四川大学理学学士（1996），东南大学工学硕士（2001）、工学博士（2004），

  香港中文大学博士后（2004），2006

  年晋升教授，

  2012

  年晋升二级教授。现为东南大学首席教授、校学术委员会委员、自动化学院学术委员会主任、学习机器研究中心主任，《自动化学报》副主编。

  2008

  年入选教育部新世纪优秀人才支持计划，

  2011

  获得国家杰出青年科学基金，

  2013

  年“智能机器人感知与控制”江苏高等学校优秀科技创新团队带头人，

  2016

  年被评为全国优秀科技工作者和东南大学优秀共产党员，中组部“万人计划”科技创新领军人才。

  2019

  年获批“自主无人系统协同控制理论及应用”国家创新群体项目学术带头人和“人在回路的混合增强智能”科技部“人工智能专项”重大项目首席科学家，国家自然科学基金委信息三处（含人工智能与自动化学科）十四五规划和中长期规划项目负责人，

  2020

  年获批江苏

  前沿引领

  基础研究

  专项（探索）领衔科学家。曾获2013年国家自然科学二等奖、2007年教育部自然科学一等奖、2020年教育部自然科学一等奖各1次。学术兼职有中国自动化学会副秘书长、常务理事、人工智能与机器人教育专委会主任，中国人工智能学会常务理事、智能控制与智能管理专业委员会主任。获中华人民共和国建国

  70

  周年纪念章一枚。'
