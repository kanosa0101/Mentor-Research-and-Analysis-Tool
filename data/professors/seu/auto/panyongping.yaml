bio_raw: 潘永平，东南大学教授、博士生导师。长期聚焦于智能机器人基础理论与应用研究，通过融合自动控制和机器学习理论提升机器人系统的自主性与实用性。累计发表学术论文200余篇，其中期刊论文超过140篇，并申请国家发明专利15项。担任IEEE机器人与自动化学会广州分会主席、Frontiers
  in Robotics and AI期刊专业主编，以及多个国际顶级期刊编委。曾入选国家海外引进高层次青年人才、广东省“珠江人才计划”青年拔尖人才、深圳市“鹏城孔雀计划”特聘岗位B类，获评Clarivate全球高被引学者、Elsevier中国高被引学者、斯坦福大学世界前2%科学家（年度和终身榜单）。
institutes: []
research_direction_raw: '机器人学：柔性驱动、交互控制、视觉伺服、灵巧操作、具身智能

  自动控制：自适应学习控制、系统辨识、扰动观测器、模型预测控制

  机器学习：神经网络、强化学习、高斯过程、类脑计算、VLA大模型'
