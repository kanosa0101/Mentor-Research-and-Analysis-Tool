bio_raw: '刘剑，自动化学院副教授，博士生导师。

  近年来，共发表或接收SCI/EI期刊论文70余篇，其中第一/通信作者SCI论文30余篇。申请与受理国家发明专利20余项。荣获2023年中国自动化学会自然科学一等奖，2021年中国自动化学会优秀博士学位论文奖，2021年吴文俊人工智能优秀博士学位论文奖，2020年北京市优秀毕业生等荣誉。主持多项国家级、省部级和其他各类基金项目，包括国家自然科学基金（青年基金、面上项目），江苏省基础研究计划青年基金，中国博士后创新人才支持计划，中国博士后科学基金面上资助等。担任IEEE/CAA
  Journal of Automatica Sinica青年编委、工程科学学报青年编委、智能科学与技术学报专题编委。

  -------------------------------------------------------------------------------------------------------------

  -----------

  -----------

  -----------

  ------

  研究兴趣

  ：自主无人系统智能控制、

  多机器人系统协作控制、多智能体系统博弈优化、全驱动水下机器人建模与控制、水下图像目标检测等。

  讲授课程：人工智能（本科生）、人工智能导论（外院本科生）、非线性系统分析与控制（研究生）。

  -------------------------------------------------------------------------------------------------------------

  -----------

  -----------

  -----------

  ------

  欢迎自动化、计算机、

  机械、

  数学及相关专业学生

  报考！

  科研四心：好奇心、是非（严谨）心、自信心、进取心！

  学生培养：

  追求质量、把控数量、见贤思齐、人人茁壮！

  共同目标：

  克己勤勉、求真务实、不论出处、止于至善！'
