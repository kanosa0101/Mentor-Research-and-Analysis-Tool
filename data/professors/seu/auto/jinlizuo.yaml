bio_raw: '中国航空学会信息融合专业委员会委员，

  IEEE

  、

  SPIE

  、

  ACM、中国自动化学会

  会员。

  2000

  年于东南大学获模式识别与智能系统博士学位，

  2002

  ～

  2004

  年日本东京大学生产技术研究所博士后，其间赴日本国立情报学研究所做访问研究。主要从事图像处理、计算机视觉、机器学习、人工智能、信息融合、无人系统等领域理论、算法与应用研究。承担国家自然科学基金重点项目和面上项目、国防预研基金项目、总装预研基金项目、航空科学基金项目、江苏省科技成果转化项目、江苏省社会发展面上项目、中电集团高校合作项目、航天科技集团科技合作项目、中兴通讯产学研合作项目等

  40

  余项，在国内外核心期刊与国际会议上发表学术论文

  120

  余篇，

  SCI

  、

  EI

  收录论文

  50

  余篇，

  发明专利

  10

  余件

  。

  研究方向

  1、

  图像处理与计算机视觉

  2、

  机器学习

  与

  人工智能

  3、

  智能感知

  与

  边缘计算

  4、

  多源信息融合

  5、

  自主无人系统

  讲授课程

  1、机器视觉（本科生研讨课）

  2、统计学习导论（研究生

  专业

  课）

  3、计算机视觉（博士生专业课）'
