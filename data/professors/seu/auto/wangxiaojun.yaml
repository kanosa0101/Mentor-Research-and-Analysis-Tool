bio_raw: '王晓俊

  ，

  1975.12

  生于江苏南京，

  工学博士，东南大学检测技术与自动化装置学科， 副教授

  、

  硕士生导师。

  主要研究方向：

  （1）嵌入式系统及智能仪器设计

  （2）

  微弱信号检测与处理技术

  （3）工业物联网与信息化系统

  近5年来，

  主持完成了国家、省、市级重点科技计划项目及企业委托课题二十余项，

  作为主要合作者参与国家重大仪器专项、国家自然科学基金、江苏省重点研发计划项目近十项。

  近年来，受企业委托，主持研发了多款高端智能测试设备，其中“数字局部放电综合测试仪”“20Hz~2MHz智能元件参数分析仪”、

  “100k

  Ω

  ~10PΩ超高阻分析仪”、“基于冲击响应法的5kV匝间耐压分析仪”、“2

  0kV交直流高压信号质量分析系统

  ”、“

  特种电容器绝缘性能分析系统

  ”、“新型数字安规动态测量与分析系统”等，均打破了同类设备完全被国外垄断的现状，并已产业化生产。

  主要研究兴趣： 针对困扰企业或行业发展的检测技术难题或高端设备研制需求，尤其是高速精密测量与信号处理、微弱信号处理、系统可靠性与抗干扰技术等方向技术难题，研究相关机理和解决方案，并研制可靠实用的测试设备及系统。

  招生方向：

  每年招收

  2~3名硕士研究生，

  欢迎

  对嵌入式系统

  、

  电力电子

  、高速

  数字

  信号处理

  、

  物联网感兴趣的学生加入本团队。

  联系方式：

  Email:

  101011042@

  seu.edu.cn'
