bio_raw: '东南大学首席教授，新加坡广智微芯（Mind PointEye）创始人，曾担任新加坡南洋理工大学工学部正教授招聘委员会委员、瓦伦堡(Wallenberg)-南洋理工大学校长博士后奖学金委员会委员、中国工业和信息化部中国大数据产业生态联盟主任专家委员、中国疏浚协会智能化专家组副组长。自2014起他连续9年被汤申路透（Thomson
  Reuters ）评为“高被引用研究者（Highly Cited Researcher）”（工程类和计算机科学类）以及“世界最有影响力的科学精英(The World''s
  Most Influential Scientific Minds)”，位列斯坦福大学2021年Top2%世界科学家新加坡南洋理工大学中的第一名。他连续多年被提名新加坡总统科学奖（2016,2017,2018,2019）。他的两篇AI学术文章在2017年被谷歌学术（Google
  Scholar）列为世界上“过去10年经过时间验证的Top 10人工智能经典文章”中的Top 2和Top 7。他提出的AI理论最近也得到了生物和脑神经学的直接生物验证，弥补了机器学习和脑学习机制之间的空白，解决了计算机之父冯·诺依曼（John
  von Neumann）60年前的关于人脑和计算机结构和能力的困惑。他提出的AI理论和算法被广泛应用于电力、能源、太空、控制、低功耗AI芯片光子芯片等领域以及被美国太空总署NASA、IBM等应用。他也是AI起步公司新加坡Mind
  PointEye和中国广智微芯的创始人。多次受邀在大型国际会议做AI主题报告，包括IEEE ICONIP、IEEE中国软件大会、世界架构师峰会等。他是Neurocomputing,
  Cognitive Computation, Neural Networks, 和IEEE Transactions on Cybernetics期刊的Associate
  Editor.

  主持的主要项目有：德国宝马集团和南洋理工大学未来汽车联合研究实验室人机交互，脑机交互以及汽车辅助驾驶项目，英国劳斯莱斯和南洋理工大学联合研究实验室海洋船舶导航决策辅助系统项目，新加坡科技工程和南洋理工大学先进机器人联合研究实验室场景识别和机器学习项目，台湾台达电子股份有限公司和南洋理工大学物联网联合研究实验室数据分析和视频项目。'
