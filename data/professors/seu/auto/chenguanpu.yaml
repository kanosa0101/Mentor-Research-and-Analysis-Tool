bio_raw: '陈冠溥，东南大学上岗研究员，双一流学科博士生导师、硕士生导师。于中国科技大学取得学士学位，中国科学院系统所取得博士学位，后赴瑞典KTH皇家理工学院开展博士后研究，

  与KTH、IC、NTU、Edinburgh等国际知名高校与科研机构保持良好合作。

  主要研究方向包括无人集群系统决策、电子网络安全与博弈、复杂系统鲁

  棒与泛化

  、AI驱动的多智能体学习等

  ，

  相关研究成果发表于控制领域顶刊IEEE TAC、Automatica，机器学习领域顶刊IEEE TPAMI、IEEE TNNLS，以及网络安全领域顶刊IEEE
  TIFS等，

  获中国控制会议(CCC)关肇直奖(排1)，IEEE国际控制和自动化大会(ICCA)最佳论文奖

  (排1)

  ，IEEE控制系统安全与

  隐私技术委员会(CSS TCSP)最佳学生论文荣誉提名奖

  (通讯)

  ，中科院院长奖等。担任IEEE CSS TCSP专委会成员，第23届欧洲控制会议邀请论坛主席，以及IEEE TAC、Automatica

  、IEEE TNNLS

  等20余国际旗舰期刊审稿人。

  招生长期开放，欢迎自动化、数学、计算机、人工智能等相关专

  业的学生报考博士和硕士研究生，同时欢迎感兴趣的博士后加入课题组，联系方式：guanpu_chen@seu.edu.cn'
