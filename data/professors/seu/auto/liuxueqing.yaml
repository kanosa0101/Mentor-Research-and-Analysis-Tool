bio_raw: '刘雪庆，讲师，硕士生导师。2019年于哈尔滨工业大学航天学院获得学士学位，2025年于清华大学自动化系获得博士学位，同年加入东南大学自动化学院/智能无人系统研究院。研究领域包括随机全驱系统的主动容错控制，动力学系统的内禀性安全控制、具身智能的安全性赋能等。参与多项国家级基金项目，以第一作者在IEEE
  Trans. Ind. Inform.、IEEE Trans. Cybern. 和IEEE Trans. Syst. Man Cybern. -Syst.等国际期刊/会议发表论文十余篇，授权多项国家发明专利。获清华大学优秀博士论文、北京市优秀毕业生推荐，三次国际会议Final
  Oral。

  本年度硕士招生计划为1-2人。欢迎随时至办公室进行交流，另可通过接收推荐免试研究生考核后，再进一步沟通。'
institutes: []
research_direction_raw: '随机全驱系统的主动容错控制

  。随机干扰为高端装备的智能运维提出了挑战，研究成果中所开创的随机框架，夯实了新一代全驱控制理论的基础，新方向有大量故障诊断与容错控制的前沿问题待解决。

  动力学系统的内禀性安全控制。

  机器人安全不仅在于避障，更在于故障下的自稳定性。方向以亚健康机器人为研究对象，将探索其失稳机理与自愈机制，构建面向复杂任务的内禀安全控制理论。

  具身智能的安全性赋能。

  安全是具身智能落地的关键瓶颈。研究将融合环境感知、行为决策与底层控制的动态安全屏障机制，突破动态交互场景下的主动防护技术，为具身智能的可靠部署提供理论支撑。'
