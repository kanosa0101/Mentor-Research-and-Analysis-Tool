bio_raw: '莫磊，男，

  广东中山人。

  2013

  年毕业于华南理工大学自动化科学与工程学院，获得工学博士学位（导师：胥布工教授）。随后赴浙江大学控制科学与工程学院、法国国立信息与自动化研究所（

  INRIA

  ）从事博士后研究，并于

  2019

  年加入东南大学自动化学院。

  现为美国电气电子工程师协会（

  IEEE

  ）会员、美国计算机协会（ACM）会员、中国自动化学会（

  CAA

  ）会员、中国计算机学会（

  CCF

  ）会员。

  主要研究方向为网络化系统（如信息物理系统

  CPS、无线传感器网络WSN

  ）中的估计与控制、资源调度、任务映射、

  边缘计算、近似计算、

  可靠性设计，及其在实际系统中的应用。近年来，在工业物联网、电路与系统、

  智能交通、云计算

  等领域相关国际期刊（

  如

  IEEE Transactions on Industrial Informatics

  、

  IEEE Transactions on Reliability、

  IEEE Internet of Things Journal

  、

  IEEE Transactions on Computer Aided-Design of Integrated Circuits and Systems

  、

  IEEE Journal on Emerging and Selected Topics in Circuits and Systems

  、

  IEEE Tran

  sactions on Intelligent Transportation Systems、

  IEEE Transactions on Cloud Computing、

  ACM Transactions on Sensor Networks

  ）和国际

  会议（

  如

  DATE、

  CODES+ISSS、

  ICCD

  、

  RTAS

  、

  IFAC World Congress

  ）上，

  发表学术论文六十余篇。此外，还担任了国际SCI

  期刊

  KSII Transactions on Internet and Information Systems、

  International Journal of Ad Hoc and Ubiquitous Computing

  副编委（

  Associate Editor

  ），国际SCI期刊

  IEEE Access

  、

  Electronics

  、

  Actuators、IET Electronics Letters

  客座编委（

  Guest Editor

  ），二十余次

  学术会议技术程序委员会委员（

  TPC Member

  ），以及多个国际期刊和会议审稿人。

  作为项目负责人，主持了国家自然科学基金青年项目、中国博士后基金、江苏省自然科学基金、浙江大学工业控制技术国家重点实验室开放课题、百度

  -

  东南大数据研究课题、江苏省智能网联汽车产业开放课题等研究项目，并作为主要研究人员参与了国家自然科学基金

  -

  广东联合重点项目、国家自然科学基金、海外和港澳学者合作基金、欧盟

  H2020

  等研究项目。

  曾获东南大学至善青年学者（

  A

  层次）、南京市留学人员科技创新择优资助（B层次）、华南理工大学一等奖学金、华南理工大学

  E+H

  企业奖学金、华南理工大学

  “

  优秀研究生

  ”

  、华南理工大学优秀博士论文创新基金、浙江大学高水平国际学术会议基金等奖励。'
