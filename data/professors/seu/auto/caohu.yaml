bio_raw: '曹虎，东南大学

  自动化学院青年首席

  教授

  ，博士生导师，硕士生导师

  ，国家

  级

  青年人才，

  斯坦福

  /

  爱思唯尔

  全球Top 2%科学家 。曾获

  中欧科学家论坛杰出青年科学家奖

  2025。

  主要研究方向包括

  机器人学习，

  具身智能，机器人感知，人工智能，人形机器人具身智能感知交互、导航与操作，无人驾驶等。博士毕业于德国慕尼黑工业大学（QS22），

  师从德国工程院院士、IEEE Fellow、国际知名机器人专家Alois Knoll教授。

  曾任慕尼黑工业大学机器人、人工智能与实时系统组高级研究员，苏黎世联邦理工大学与香港大学访问学者。

  并与 UC Berkeley, TUM, HKU, ETH Zürich, 牛津, 剑桥等国际知名高校保持长期合作。

  相关研究成果发表于

  IEEE TPAMI

  , TIP,

  SPM

  ,

  TAI

  ,

  TITS

  ,

  TIV

  ,

  T-MECH

  ,

  TCSVT,

  Sci China Inf Sci

  等权威期刊，以及计算机视觉与机器人领域的顶级会议

  CVPR

  ,

  ICCV

  ,

  ECCV

  ,

  ICML

  ,

  ICRA

  和

  IROS

  等国际顶级会议，

  谷歌引用10066余次。相关论文入选

  计算机视觉顶级会议ECCV近五年引用量Top 3论文（数据来源：Google Metrics

  ）和

  IEEE Xplore Innovation Spotlight

  （该栏目从

  IEEE Xplore

  数字图书馆收录的

  600

  多万篇技术文献中精选最具创新性的前沿研究）。

  担任中国具身智能大会

  (CEAI2025) “

  具身操作与持续学习”专题论坛主席、CEAI2026 "具身操作与空间智能"专题论坛主席、

  留德学者计算机学会

  (GCI)

  副主席，智能机器人青年专委会成员，具身智能专委会（筹）发起人，同时为第六届中德智能机器人论坛德国分论坛主席、

  IROS2025 Session Chair

  ,

  NeurIPS2026 Area Chair,

  Visual Intelligence

  期刊,

  Frontiers in Neurorobotics

  期刊和

  Artificial Intelligence and Autonomous Systems (AIAS)

  期刊副主编/编委，担任

  Nature Computational Science

  ,

  AI

  与机器人等

  30

  余顶级期刊与会议审稿人，被机器学习顶会ICML评为Gold Reviewer和医疗领域

  Top

  期刊

  IEEE TMI

  评为

  2022-2023

  年杰出审稿人

  。

  欢迎提前联系，

  联系方式：

  hu.cao@seu.edu.cn,

  欢迎：

  •

  本科生

  ：成绩优异、编程能力突出、英语良好、自驱力强，且有志于发表高水平论文

  和专利撰写

  ，参与

  SRTP等

  ；

  •

  保研学生

  ：鼓励优秀学生提前联系，互选导师；

  •

  硕/博申请者

  ：有意在东南大学继续深造的同学；

  •

  博士后

  ：期待加入，共同开展高水平研究

  （

  学校优先支持至善博士后）

  ；'
