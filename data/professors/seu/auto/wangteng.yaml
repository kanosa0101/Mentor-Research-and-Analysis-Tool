bio_raw: '2016年于美国Iowa State Univeristy获工学博士学位，2017年加入东南大学自动化学院。现为自动化学院副教授、博士生导师、至善青年学者。

  主持国家自然科学基金面上项目1项，国家自然科学基金青年基金项目1项，参与国家自然科学基金重点项目与科技部“新一代人工智能”重大项目各1项。在无人系统具身导航、

  自主定位、

  多模态环境感知及推理等领域发表包含IEEE TPAMI、

  IEEE TMM、IEEE TNNLS、

  IEEE RA-L、

  ICLR,  CVPR,  ECCV,  AAAI等国际顶级期刊或学术会议在内的论文30余篇，相关成果荣获中国自动化学会科技进步一等奖（6/7）。主要研究方向包括无人系统空间具身智能、视觉导航、机器人学等。

  更多信息请参见团队学术网站

  https://tengivy.github.i

  o/

  .'
