bio_raw: 黄永明，博士、博士生导师、副教授。从事人工智能、医工交叉、高性能嵌入式系统、助老\救援机器人、地震预警预报等方面的研究。江苏省自动化学会教工委副秘书长、江苏省六大人才高峰、江苏省科技副总、江苏省委组织部优秀“科技镇长团团员”、江苏省双创博士、南京建邺区创新创业领军人才；主持国家级课题1项、主持省部级课题3项、主持国防横向技装类项目3项、主持成果转化项目4项、主持其它横向课题20项；获得国家发明专利授权20余项；第一作者、通讯作者发表SCI论文近30篇，EI论文40余篇。
institutes: []
research_direction_raw: '（1） 机器人：救援机器人、运维机器人、医疗监护机器人；

  （2）人工智能：故障诊断、心电数据分析、情感计算、

  地震数据分析；

  （3）高性能嵌入式系统：心电带、地震数据采集仪、高速数据采集器

  每年在以上方向招收硕士生3-5名、博士生1-2名，邮箱：huang_ym@163.com,  huang_ym@seu.edu.cn'
