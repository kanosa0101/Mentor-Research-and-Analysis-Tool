bio_raw: '孟浩飞，东南大学自动化学院副研究员。

  2018

  年至

  2020

  年在华中科技大学从事博士后研究工作，入选华中科技大学学术前沿青年团队。研究方向包括复杂网络分布式协同控制、无人系统协同控制以及信息物理系统安全防护等，发表

  SCI

  论文

  10

  余篇，发表在

  IEEE Transactions on Automatic Control

  ，

  IEEE/ASME Transactions on Mechatronics

  等国内外期刊上，主持国家自然科学基金青年基金项目

  1

  项，主持复杂工程系统测量与控制教育部重点实验室开放课题

  1

  项，参与

  2

  项国家自然科学基金项目、

  1

  项

  JKW- GF

  科技创新特区项目以及

  1

  项南京市重大科技专项项目。

  招生计划：

  每年招收硕士研究生

  1~2

  名，欢迎相关专业的同学联系报考。'
