bio_raw: '周波，男，

  工学博士，东南大学自动化学院副院长，教授，博士生导师。主要从事移动

  /

  服务机器人及无人平台感知、导航和控制技术、工业机器人及先进制造技术等方面的研究，主持或参与国家自然科学基金

  6

  项，工信部科技专项2

  项，

  863

  项目

  2

  项，国家重点研发计划项目

  2

  项，

  江苏省科技成果转化项目

  6

  项，其它省部级项目及企业委托项目20多项。工作成果在国内外期刊和会议上发表

  SCI

  或

  EI

  收录论文

  90

  多篇，授权国家发明专利

  24

  项。现为

  中国自动化学会机器人专委会委员，机器人竞赛专委会委员，江苏自动化学会伺服与运动控制专委会副主任；并长期担任TRO、IJRR、T-Mech、TIE、RA-L、JFR、RCIM、RAS、AR、

  《自动化学报》、《控制理论与应用》、《机器人》、《控制与决策》、

  IEEE ICRA/IROS机器人顶会

  等国内外知名期刊、会议审稿人。'
institutes: []
research_direction_raw: '1

  、无人平台（无人车、无人机、无人船、水下机器人等）自主

  /

  半自主导航控制技术；

  2、腿足式

  （双足、四足）具身

  机器人环境感知、规划和步态稳定性控制技术；

  3

  、面向典型工艺应用的机器人复杂作业及智能制造技术；

  4

  、结合深度学习

  /

  强化学习方法（机制）的机器人学习技术。

  无人平台：

  无人车平台1           无人车平台2           自研无人机平台         自研穿梭机

  矿山无人驾驶                合作单位无人船              自制水下机器人

  校园环境无人车SLAM建图

  图书馆无人机SLAM建图

  腿足机器人：

  合作单位自制四足平台           云深处Lite2A               蔚蓝科技四足

  SEU-Unibot         自制双足          逐迹动力双足

  灵巧操作研究：

  Whole-body移动操作     多任务迭代学习力控操作  基于扩散模型的灵巧手操作   爬壁机器人'
