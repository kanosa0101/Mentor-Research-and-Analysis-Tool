bio_raw: '杨兴晨，国家级青年人才，东南大学青年首席教授。

  2020年博士毕业于上海交通大学机器人研究所，

  曾在美国西北大学/芝加哥康复中心、瑞士洛桑联邦理工学院和英国帝国理工学院学习和工作。

  致力于神经科学和机器人交叉研究，主持国家自然基金、江苏省前沿重点项目、江苏省重大项目课题、华为企业课题等项目；

  在Nature Human Behaviour、Nature Communications及IEEE汇刊发表论文30余篇，IEEE汇刊精选2篇；担任康复顶刊IEEE
  TNSRE副编委， Cyborg and Bionic Systems期刊青年编委（IF>18）及机器人顶会ICRA副编委等。

  每年招收博士研究生1-2名，硕士研究生2-3名。欢迎自动化、计算机、机械电子工程等相关专业的学生报考博士和硕士研究生（外校研究生请通过学校组织的夏令营后联系）。'
institutes: []
research_direction_raw: '课题组研究兴趣涵盖脑机接口、人机交互、仿生智能、外骨骼机器人、多域机器人等，代表性工作如下。

  1. 非侵入式脊髓神经接口

  2. 高通量超声神经接口

  3. 运动增强型脑机接口

  4. 跨域智能机器人

  5. 机器人视触觉感知'
