bio_raw: '符影杰

  ，

  男，

  1963

  年

  12

  月生，江苏南京人，东南大学自动化学院副教授、硕士生导师。1984

  年本科毕业于东南大学（原南京工学院）电子仪器与测量技术专业，1987

  年硕士毕业于山东大学（原山东工业大学）工业自动化专业，1990年博士毕业于浙江大学生物医学工程专业。1990年9月至今在东南

  大学自动化学院任教，承担2门本科课程、1门硕士生课程的教学工作，长期负责

  自动化

  学院本科生参加全国大学生电子设计竞赛的组织和指导工作；属“检测技术与自动化装置”二级学科，

  目前主要从事检测技术、

  智能仪器仪表设计与应用

  、计算机测控系统设计与应用方面的研究工作

  。'
