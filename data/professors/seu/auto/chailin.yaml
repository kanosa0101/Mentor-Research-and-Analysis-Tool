bio_raw: '《陪我变老》

  梧桐絮飘过桃李年华的梦想

  一个转身，粉笔灰落成了六朝松新的年轮

  陪我变老的东大，爱你无声

  发表于青春三行诗《我在东南大学的日子》，南京出版社，2025

  柴琳，1978年9月生，江苏南京人，博士，东南大学自动化学院教授（自动化学院2000年以来首位女教授

  ），院内从传统控制理论成功转型到模式识别领域第一人，博士生导师，美国德克萨斯大学圣安东尼奥分校访问学者，诗人。中国自动化学会会员、青工委委员，中国人工智能学会自然计算专委会委员，中国系统工程学会会员，江苏省自动化学会会员，江苏省信息技术应用学会具身智能专业委员会委员，江苏省人工智能学会模式识别专委会委员

  。

  主持国家自然科学基金、省自然科学基金等

  4

  项科研项目，作为主要成员参加多项国家自然科学基金以及省部级科研项目的研究工作，发表论文

  90

  余篇，其中被

  SCI

  收录30

  余篇，

  EI

  收录

  60

  余篇。

  2017

  年入选“六大人才高峰”高层次人才培养对象，2020年入选江苏省、盐城市“科技副总”人才培养对象。

  美国《数学评论》(Mathematical Reviews)

  评论员。

  研究方向包括模式识别(目标识别与跟踪、CT图像组学研究、遥感小目标检测、智能制造中的工业缺陷检测、生物监测、工艺流程强化学习研究等)，具身智能（机器人多源融合定位与路径规划，机器人多智能体强化学习控制），智能感知装备系统研制，非线性系统控制理论(PTZ控制、光电跟踪控制、无人机控制等)。

  人生格言：中等生的逆袭是一场漫长的修行，勤学的终身习惯、困境中的恒守、切实的执行力，方能静待花开。

  每年招生：电子信息专业（自动化、仪科、电气、信息、电子等均可）等背景的硕士研究生3-4名（包括支教、辅导员通道），博士1-2名（第二名一般为春季补录，需要在项目合作的基础上联合培养），非诚勿扰。

  PS：校内生源除了自动化学院，特别欢迎吴健雄学院、未来技术学院及其他电子信息类的优秀学子（尤其是未院同学根本不知道有我这位老师）

  吾心自有光明月，千古团圆永无缺。

  真正的知行合一，是不计较回报的付出，但要坚信总有人在适当的时候看到你的光芒，宛如天文望远镜看到的历史星“控”。

  没有小项目，只有小科研。只要能对国家新质生产力发展起到促进作用的科研项目都要做到极致的认真，不让“产学研”成为一句空话，真正体现黄大年式的“大科研”精神。

  本团队以国家人工智能引领下的高质量发展为需求，将智能制造、公共医疗、能源监控等领域的具体工程实践中亟需解决的问题与

  多源信息融合技术下的智能感知与控制进行了理论与实践的高度融合，真正做到了“科研从实践中来、到实践中去”，而非以片面追求高被引、帽子为目标，是一个有情怀、有温度的团队，欢迎致力于国家高端控制与人工智能理论研究及自动化事业发展的高级人才的加入。

  PS：本团队会针对各学生基础条件、职业规划一对一地制定培养方案，同时与产学研紧密融合，让每一位同学都能得到人工智能理论、软硬件开发等多方面技能的提升与锻炼，无需同学们自行联系实习单位，除研三期间应聘需要、欲来本团队刷实习者勿扰。

  实验室26年毕业生就业情况：

  博士生：南京某重点211直接入编教师（在校期间发表sci论文10篇，其中1区8篇），上海某电力行业国企

  硕士生：博世电器（硬件工程师），TCL电子（硬件工程师）、字节跳动（软件工程师），继续深造读博一名（硕士期间发表4篇sci）

  本团队部分科研成果应用场景展示如下：

  1. 医工交叉结合项目研发

  （1）如下与杭州某医院合作的世界上第一套“乳腺癌放射性皮炎预测系统”：

  （2）肺部、胃肠肿瘤图像分割软件，为COPD、胃肠肿瘤等慢病动态知识图谱系统中的跨模态对齐处理服务（与江苏省肿瘤医院、中大医院合作）：

  （3）口腔疾病筛查（包括龋洞、牙根周炎等）：正与一三甲医院洽谈，助力口腔疾病初步筛查工作，提高医生读片效率

  （4）基于增强个体差异的自适应特征选择微表情识别算法：无论你是真笑还是皮笑肉不笑，我们都能给你检测出来

  2.具身智能（实验室新兴方向）

  （1）灵巧手（与包金明、朱蔚萍老师合作）

  （2）智能机械臂

  （3）无人机整机研制

  其中无人机所带清障装置：

  3. 无人智能感知系统

  （1）结合物联网云端技术的室内安防系统研制：

  （2）第二代轻量化系统，可用于无人机边缘部署：

  （3）柔性数据采集系统：用于智能制造车间全方位工况信息采集处理，经

  4G上传MES系统

  （4）无人机室内定点智能巡检：待更新。。。

  4. 助力智能制造系统产测

  （1）低对比度场景下基于无监督小样本学习的工业异常检测（已成功应用于杰出校友企业南京华视智能科技有限公司）：

  （2）某大型智能家电企业产测平台的研发（代替了该企业原来严重依赖的某国际知名产测平台）：

  （3）

  集成工业总线、物联网通信、电能计量等功能的

  PCB板卡研发（在

  生产车间管理、实验室管理等场景中发挥数控网关作用

  ）

  (4) 用于新进研究生入门嵌入式系统研究的电源模块练习实例

  （5）准研一学生的优秀毕设：智能制造车间监测系统软硬件设计

  5. 小目标检测研究

  （1）水中杂质干扰下的目标检测（已应用于制药、食品、国防航空相关企业）：

  （2）遥感图像小目标检测，多源/无源域适应研究：再昏暗的视线、再恶劣的天气，即使没有源域数据、目标大小分布再杂乱，我们也能检测出所有的目标

  6. 运动目标检测

  （1）拥挤人群下的行人重识别跟踪与检测：几何运动特征、时空关系的自适应级联、动态视觉特征自适应更新相互结合

  7. 多模态融合技术研究

  （1）通过多模态融合获取互补信息的可见光与红外模态的目标检测，显著提升鲁棒性与泛化性，即使迁移到医学图像融合中也照样出色：

  你以为就这些？那些满天飞的多智能体控制理论我们也会，只不过能用在真实的场景中（涂布检测闭环控制、智能电网功率预测与控制），能用在实践中的公式才是好公式！

  想知道实验室其它更加精彩纷呈的成果，打开电脑来封邮件吧，绝对不会让你失望！'
