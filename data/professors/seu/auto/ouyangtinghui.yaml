bio_raw: '欧阳庭辉，东南大学青年首席教授，博导

  /

  硕导，国家高层次青年人才，全球前

  2%

  顶尖科学家。回国前担任日本筑波大学助理教授。

  2012

  年和

  2017

  年分别于武汉大学取得学士和博士学位。具有美国、加拿大、新加坡、日本多国留学和工作经历。

  长期从事大数据挖掘、异常检测、故障诊断、工业互联网和能源系统质量评估研究，在

  TCYBS

  、

  TNNLS

  、

  TIM

  、

  TETCI

  、

  ECM

  、

  Energy

  等计算机和能源领域国际高水平期刊发表论文

  80

  余篇, 研究成果得到国内外著名专家学者（如院士、

  IEEE Fellow

  等）的积极评价与引用。

  2022-2024连续多年入选斯坦福大学全球前2%顶尖科学家名单。主持并参与过多个国内外国家级科研项目，如中国“973”、加拿大NSFEC，新加坡CRP、日本JSPS、NEDO和CREST项目等。目前担任IEEE
  Transactions on Neural Networks and Learning Systems (TNNLS), IET Renewable Power
  Generation (IET RPG)等5个SCI期刊副编辑，以及多个SCI期刊客座编辑。担任日本学术振兴委员会（JSPS）项目评审专家。担任多个学术会议TPC成员和国际SCI期刊审稿专家。

  欢迎具有数学、自动化和电气工程相关专业背景的同学加入我们团队攻读硕士和博士学位。

  联系方式: thouyang@seu.edu.cn

  教育背景

  2012.09--2017.06， 武汉大学，工学博士，导师：查晓明教授；

  2015.09--2017.02， 美国爱荷华大学（University of Iowa），联合培养，导师：Andrew Kusiak教授；

  2008.09--2012.06,   武汉大学，工学学士；

  工作经历

  2025.03-至今，东南大学，教授

  2024.04-2025.02，日本筑波大学（University of Tsukuba），助理教授

  2023.04-2024.03，日本国立情报学研究所（NII），研究员（Researcher）

  2019.12-2023.03，日本国立产业与技术综合研究所（AIST），研究员（Researcher）

  2018.12-2019.12，  新加坡南洋理工大学（Nanyang Technological University），博士后，合作导师：Guang-Bin
  Huang教授

  2017.09-2018.09，加拿大阿尔伯塔大学（University of Alberta），博士后，合作导师：Witold Pedrycz教授

  学术兼职

  日本学术振兴委员会（JSPS）项目评审专家；

  IEEE Transactions on Neural Networks and Learning Systems (TNNLS)期刊，副编辑；

  IET Renewable Power Generation (IET RPG)期刊，副编辑；

  IET Digital Twins and Applications (IET DTA)期刊,  副编辑；

  Data Technologies and Applications (DTAA)期刊,  副编辑；

  Frontier in Energy Research期刊，副编辑；

  Embodied Intelligence and Robotics期刊，副编辑；

  Journal of Sensors期刊,  编辑；

  Scientific Report期刊,  编辑；

  Journal of Renewable and Sustainable Energy期刊，编辑咨询委员会成员；

  研究方向

  长期从事大数据挖掘、异常检测、故障诊断、工业互联网和能源系统质量评估研究，与美国、加拿大、新加坡、日本等多国高校和科研院所紧密合作。'
