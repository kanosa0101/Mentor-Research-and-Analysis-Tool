bio_raw: '王辰星，女，东南大学自动化学院副教授，本科国际交流秘书。2013年毕业于东南大学，2014-2016年在新加坡南洋理工大学计算机学院从事研究工作，2016年底入职自动化学院，曾

  主持和承担多项国家自然科学基金以及省、部级基金，与多家企业合作科技攻关项目，曾获江苏省“双创博士”人才资助、南京留学回国人员择优资助等。

  发表国际顶级期刊和CCF会议论文三十余篇，授权发明专利二十余项。教授本科生《数字与逻辑设计》（全英文）、《计算机图形学》，以及研究生《计算机视觉》等课程每年教学评价为优秀，曾获得东南大学授课竞赛三等奖，2022年“吾爱吾师”院系最受欢迎教师，2024年东南大学第14届“我最喜爱的研究生导师”十佳提名及院系优秀导师等。担任国家自然基金函评专家、江苏省及广东省科技咨询及评审专家，是中国计算机学会（CCF）会员、电气与电子工程师协会（IEEE）会员、中国图象图形学学会（CSIG）机器视觉专委会委员、江苏省自动化学会会员

  等，

  主要研究方向为光学成像、三维感知、信号/信息处理与检测、图形学、模式识别等。'
institutes: []
research_direction_raw: '[1] 光学三维测量、计算三维成像

  [2] 激光雷达（搭载无人机）/视觉SLAM 三维重建、点云处理及目标检测

  [3] 三维人体重建/姿态估计

  [4] 信号/图像处理、模式识别、图形学等'
