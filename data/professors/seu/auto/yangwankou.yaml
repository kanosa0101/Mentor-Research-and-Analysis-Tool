bio_raw: '杨万扣(

  1979

  年~)，

  江苏盐城人，

  博士，

  教授，

  博士生导师，

  硕士生导师，

  人工智能专业。先后入选斯坦福全球前2%科学家榜单，Research.com全球顶尖科学家排名。

  分别于2002年、2004年和2009年在南京理工大学获得学士、硕士和博士学位。

  曾在香港理工大学、美国北卡大学威明顿分校和悉尼科技大学从事研究工作，于2011年9月加入东南大学自动化学院。

  研究方向：

  (1) 模式识别与计算机视觉，

  多模态大模型

  ，

  目标检测跟踪定位，人体姿态估计，文本图像视频生成等

  (2) 机器人与智能无人系统，

  无人系统“感知-预测-决策-控制”，自主导航，无

  人机+AI等

  具备搭建国产自主可控智能系统的能力，涵盖无人机平台、AI计算平台与AI算法全链路研发与集成。

  相关模型与算法已适配并部署于华为、瑞芯微等国产芯片平台，可提供定制化的AI计算平台与算法解决方案。

  系统已实际应用于XX无人机、无人车及无人艇等多类无人平台。

  热忱欢迎对AI充满好奇心、激情和热情的朋友加入本实验室！

  本实验室长期

  诚聘博士后

  研究人员

  （研究方向：机器人、无人系统、人工智能）

  ，欢迎申报“

  至善博士后

  ”等人才计划。我们将提供极具竞争力的薪酬待

  遇与广阔的发展空间，

  具体面议

  .'
