bio_raw: '张凯锋，男，

  1977

  年生，东南大学自动化学院教授，博士生导师。

  2004

  年于东南大学获得“电力系统及其自动化”专业工学博士学位，

  2006

  年于东南大学“控制科学与工程”专业博士后出站。

  2013

  年作为国家公派访问学者在美国里海大学（

  Lehigh University

  ）访问交流，

  2016

  年作为国家公派高级访问学者在美国阿贡国家实验室（

  Argonne National Laboratory

  ）访问交流。曾获得国家技术发明二等奖

  1

  次（排名第

  5

  ），省部级奖励多次。'
