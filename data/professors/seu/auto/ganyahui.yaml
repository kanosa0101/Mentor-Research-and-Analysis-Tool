bio_raw: '甘亚辉，男，

  1985

  年

  6

  月生，山东滕州人，东南大学自动化学院副教授、硕士生导师。

  2007

  年本科毕业于山东大学自动化专业，

  2014

  年博士毕业于东南大学控制理论与控制工程专业（硕博连读），博士论文被评为东南大学优秀博士学位论文。主要从事工业机器人控制器设计、多机械臂协作控制、双臂协作机器人的研究工作。曾获得江苏省科学技术一等奖、

  CAA

  高等教育教学成果特等奖、南京市科技新锐力量等奖项和荣誉。目前主持国家自然科学基金项目

  1

  项、江苏省自然科学基金项目

  1

  项、企业委托项目多项，参与多项国家自然科学基金项目、国家重点研发计划和江苏省科技成果转化项目。'
