bio_raw: '陈泓材，副研究员，博士生导师。

  2018

  年博士毕业；

  2017年为杜克大学访问学者；

  2018年赴南方科技大学任副研究员；

  2021

  年

  11

  月从南方科技大学离职，加入东南大学自动化学院任副研究员，隶属于复杂工程系统测量与控制教育部重点实验室。申请人主要从事电磁环境、故障诊断、机器学习相关交叉领域的研究。近五年，在电磁对抗与防护、博弈对抗、EDA优化设计等领域已发表第一作者和通讯作者

  SCI

  论文四十多篇，大多数

  为

  IEEE Trans

  会刊。主持国家级、省部级和产学研项目多项。

  每年招收硕士3-4名，博士1-2名。海外博士不限名额，欢迎报考。

  International Students are Welcome for PhD degree. The topics focus on LLM applications
  for electronic designs.

  课题组常年招收实习生、研究助理，支持学生联合培养、课题合作等，从事大模型智能体（Agent）在垂直领域的研究工作，详情邮件联系。

  课题组主要研究方向：

  大模型驱动的微波电路设计：

  融合多模态感知、跨尺度协同优化、强化学习与生成式大模型前沿范式，构建具备自主认知决策的微波设计智能体 Agent，搭建从需求解析到成品输出的全链路自动化闭环，实现微波电路的智能化自主设计。

  大模型驱动博弈对抗指挥官：

  融合领域大模型、多智能体强化学习、对抗生成技术，攻克复杂动态博弈下自主智能决策短板，构建自主可控指挥官体系，实现态势感知‑推演评估‑策略生成的全链路智能闭环。

  云边协同自动部署智能体：

  面向异构 CPU/NPU/GPU 硬件，研发算子适配与边缘部署智能体，依托大小模型协同、大模型异构调度技术，构建高能效端侧 AI 与云边混合计算架构，突破边缘算力存储约束。

  2027年入学博士招生可提前联系，

  欢迎电子、信息、自动化和相关专业背景学生报考，要求211硕士以上学位，

  有SCI学术论文，IEEE Trans为佳。'
