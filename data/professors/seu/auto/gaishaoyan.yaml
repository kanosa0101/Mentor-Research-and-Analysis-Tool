bio_raw: '盖绍彦，博士，副教授，博导。主要研究方向为计算机视觉、三维测量以及图像处理，在视觉测量系统模型、标定、解相位、光栅校正以及三维点云处理、模式识别等方面进行较为深入地研究，承担国家自然科学基金、省自然科学基金等省部级项目多项，在科学出版社出版学术专著1部《光栅投影三维精密测量》，在领域内国际核心期刊Optics
  Express、Applied Optics、Optics and Lasers in Engineering，国内核心期刊《自动化学报》、《光学学报》等期刊发表论文论文20余篇次。获教育部科技进步奖二等奖1项。已获国家发明专利授权10余项，软件著作权3项。

  招生方向为：计算机视觉、模式识别、三维测量。'
