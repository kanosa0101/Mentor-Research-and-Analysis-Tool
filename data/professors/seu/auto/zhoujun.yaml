bio_raw: 周俊，男，1963年出生，1984年本科毕业于山东大学数学系自动控制专业，获理学学士学位，同年分配到南京14所从事机载雷达伺服系统的研制工作。1987年至1990年在东南大学自动控制系学习，获工学硕士学位，之后留校一直工作到现在。长期从事网络化系统工程研究与实现工作，具体为计算机信息集成与综合管理、大数据融合与信息智能化处理、计算机控制与优化、单片机应用产品的开发、图像数据处理及识别等，曾负责并承担多项科研项目，有多项科研成果获奖，并在国内核心期刊上发表论文数篇。
