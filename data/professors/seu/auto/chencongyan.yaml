bio_raw: '陈从颜，男，

  1969.10

  出生，东南大学自动化学院教授、博士生导师。

  1987

  年至

  1992

  年就读于清华大学，毕业后在马钢公司工作，

  1996

  年至

  2002

  年在东南大学自动控制系攻读研究生，先后获得硕士学位和博士学位，博士期间曾获得南瑞继保

  —

  东南大学优秀论文基金资助。

  2002.4

  年留校工作。近年来，先后有几十篇论文发表在包括美国核物理学报、先进机器人、控制理论与应用、电路与系统学报、中国激光等国内外核心刊物上，其中被

  SCI

  、

  EI

  收录5

  0

  余篇。已获发明专利授权或受理3

  0

  余项。曾以国家留学基金委访问学者身份赴意大利核物理研究院从事空间探测器研发与数据实时处理方面的科学研究。

  目前主要从事机器视觉与智能系统、大数据分析与故障诊断、

  检测技术与自动化装置、先进控制理论、

  智能制造、信号处理等领域研究工作。'
