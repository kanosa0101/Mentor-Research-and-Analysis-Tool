bio_raw: '个人基本信息

  温广辉，河南平顶山人，东南大学首席教授

  (

  二级教授

  )

  ，博士生导师，硕士生导师，

  IET Fellow

  ，

  中国青年科技奖获得者

  ，国家杰出青年科学基金获得者，

  教育部国家级青年人才入选者，国家优秀青年科学基金获得者，江苏国家应用数学中心副主任。2012年7月博士毕业于北京大学，长期从事分布式控制理论与控制工程、网络群体智能理论与技术、具身智能体控制与决策等领域的研究工作。在

  Nature

  子刊、NSR、

  Research

  、

  The Innovation、

  IEEE

  汇刊等领域顶刊和CCF-A类顶级会议（AAAI、IJCAI

  、

  ACM SIGKDD

  等）发表学术论文

  300

  余篇，出版学术专著

  5

  部，

  SCI

  他人引用过万次，获国际学术期刊最佳论文奖

  2

  次、国内外学术会议最佳论文奖

  6

  次。担任

  国际期刊

  Embodied Intelligence主编

  ，

  Automatica

  ,

  IEEE/ASME Trans.

  Mech

  atronics, IE

  EE Trans. Control of Network Systems, IEEE Trans. Neural Networks and Learning Systems,
  IEEE Trans. Industrial Informatics, IEEE Trans. Industrial Cyber-Physical Systems,

  IEEE Trans. Fuzzy Systems, IEEE J. Emerging and Selected Topics in Industrial Electronics,
  IEEE Trans. Intelligent Vehicles

  和

  Asian J. Control

  编委，

  获

  Asian J. Control

  、

  IEEE Trans. Industrial Informatics

  杰出编委奖

  。

  担任国内中文核心期刊《自动化学报》、《控制理论与应用》、《系统工程与电子技术》编委。曾任IEEE Trans. Systems, Man, and Cybernetics:
  Systems编委。主持国家杰青项目、优青项目，国自然企业联合重点项目、

  “叶企孙”科学基金重点项目

  ，科技部重点研发计划项目课题等

  30

  余项科研项目；申请国家发明专利

  90

  余项，授权

  72

  项；授权国际

  PCT

  专利

  1

  项（美国发明专利）。获国家一级学会技术发明一等奖1项

  （排名第

  1

  ）

  、科学技术奖一等奖

  1

  项（排名第

  1

  ），省部级奖项4项，日内瓦国际发明展金奖

  1

  项（排名第

  1

  ），

  ARC DECRA Fellow

  ，亚太神经网络学会青年杰出研究奖等学术荣誉。

  人才培养情况

  培养团队青年教师

  2

  人入选国家级青年人才计划；培养研究生中

  1

  人入选中国科协青年人才托举工程（赵丹）、1人入选国家一级学会青年人才托举工程（周艳）、

  5

  人入选中国科协青年托举工程博士生专项计划（栾萌，沈涵，付雨亮、戴海峰、王书旺）

  ，

  5

  人获国家一级学会优秀博士论文奖（赵丹，周艳，雷旭强、房肖、王利楠）、1人获中国自动化学会优秀硕士论文奖（沈涵），

  1

  人获东南大学优秀硕士论文奖（俞佳慧），1人获国自然

  青年学生基础研究

  项目

  (

  沈涵

  )，

  2

  名硕士毕业生赴澳大利亚皇家墨尔本理工大学攻读博士（全奖）；

  10余名在读研究生赴澳大利亚、新加坡、塞浦路斯和香港特别行政区进行学术交流

  ，

  指导

  2

  名本科生获江苏省普通高等学校本科优秀毕业设计，本科生

  SRTP

  项目成员留学美国哥伦比亚大学，新加坡国立大学等世界排名前

  100

  高校。

  团队科研方向

  团队面向国家

  “

  新一代人工智能

  ”

  发展战略

  ，积极

  响应国务院“人工智能+”行动的号召，

  以构筑我国群体智能与具身智能研究的先发优势为使命责任，围绕具身智能感知、具身智能决策与智能控制开展科学研究与技术攻关。

  具体科研方向包括

  :

  具身智能感知：

  网络化协同感知，具身感知与目标识别，

  分布式信息融合

  具身智能决策：

  安全

  运动规划，分布式优化与博弈对抗，

  强化学习及其在智能决策中的应用

  具身智能控制：

  具身智能体

  控制，

  AI

  驱动的协同控制，安全协同控制，具身群体系统涌现行为调控

  关于招生

  “

  得天下英才而育之

  ”

  ，是每位教师一生最大的心愿！热忱欢迎对相关科研方向感兴趣的同学们加入团队！

  联系方式：

  ghwen@seu.edu.cn

