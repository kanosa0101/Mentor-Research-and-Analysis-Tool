bio_raw: '钱堃，男，

  1982

  年生，江苏南京人，工学博士。东南大学自动化学院副教授，博士生导师。

  2004

  年毕业于东南大学自动控制系，获工学学士学位，

  2010

  年博士研究生毕业于东南大学自动化学院（硕博连读），获工学博士学位，并留校任教。

  2014.7-8

  在美国

  Lehigh University

  学习访问；受国家留学基金委

  公派访问学者项目

  资助，2021.10-2022.4在英国利物浦大学、2022.4-2022.10

  在

  伦敦国王学院访问。2014-今，硕导；2017-今，博导。现属于

  机器人工程系，模式识别与智能系统学科组。

  主要从事机器人感知与智能机器人系统技术方面的研究工作（详见研究兴趣）。近年来主持了国家自然科学基金项目

  2

  项、江苏省自然科学基金1项、广东省自然科学基金1项，参与了

  863

  重点项目

  1

  项、国家自然科学基金

  3

  项，国家重大科技专项课题

  1

  项、江苏省科技成果转化项目

  2

  项；承担了国家电网公司总部科技项目、海外项目等一批

  企业横向项目。

  研究成果发表在IEEE TCSVT、TIE、TIM、TCDS、ADVEI、RAS

  等国际期刊和ICRA、IROS等国际会议上

  ，总计发表论文8

  0余

  篇，其中

  第一作者或通讯作者

  SCI

  检索

  35篇

  。获得国家发明专利授权10

  项，申请国家发明专利

  6

  项，获得软件著作权

  6

  项。曾获得2017年中国自动化学会高等教育教学成果特等奖、全国首届教材奖二等奖。

  现为

  IEEE member

  、中国自动化学会会员、中国人工智能学会智能机器人委员会委员、江苏省自动化学会机器人竞赛工作委员会委员、江苏省发展改革委评审咨询专家。长期担任

  IEEE TRO、IEEE TIE、

  IEEE THMS

  、IEEE TIM、IEEE SENSORS JOURNAL、RAS、

  ADV ROBOTICS

  、

  J INTELL ROBOT SYST

  、NCAA、

  J BIONIC ENG

  、

  ICRA

  、

  IROS

  等国际期刊和会议的审稿人。

  招收研究生：

  每年招收博士研究生1名，硕士研究生3~4名（南京/无锡/苏州校区）。欢迎对智能机器人、计算机视觉、

  机器学习

  感兴趣的同学联系报考！'
institutes: []
research_direction_raw: '[1]机器人视觉、触觉感知

  [2]机器人操作技能学习

  [3]环境感知与

  SLAM

  [4]计算机视觉及应用

  Some examples and demos of our research:

  (1)Learning-based Robot Grasping

  Check out our paper for how a robot learns

  6D grasp pose from RGB-D cameras (

  JINT paper

  )

  and

  Sim2Real transfer learning

  (

  RAS paper

  )  and object pose estimation (

  TCDS paper

  ).

  (2) Learning-by-demonstration

  Imitation learning via video demontration (see our IEEE ICRA 2021, and

  TCDS

  paper)

  .

  Grasping skills of a dexterous hand can be learned from human tele-operation.

  (3)Tactile perception

  We propose a novel tactile-motor policy learning method to generalize tactile-guided
  robot manipulation skills from simulation to reality (

  RAS paper

  ) using the unsupervised adversarial domain adaptation of tactile images(

  TIM paper

  ).

  Tactile perception can also be used to manipulate deformable objects (e.g., cables)
  via Sim2Real skill learning (see our

  Automation in Construction paper

  )  or tactile servoing (see our TIE paper)

  (4)Environmental perception and SLAM

  Check out our

  pape

  r

  and

  code

  of Bag-of-Point-and-Line-Word Pairs for visual SLAM.

  Lidar SLAM of our Sipailou campus.

  3D Gaussian mapping of our Sipailou campus.

  Vison and lidar multi-modal perception of power transmission lines.

  For more details, please check out our publications on [

  github

  ]

  and

  [

  Researchgate

  ].'
