bio_raw: '魏延岭，男，博士，教授，博士生导师。

  博士毕业于哈尔滨工业大学，并先后在柏林工业大学

  (

  德国

  )

  、新加坡国立大学

  (

  新加坡

  )

  、鲁汶大学

  (

  比利时

  )

  从事博士后和高级研究员的研究工作。主持国家自然科学基金

  、国家重点研发计划项目

  (

  课题

  )

  等，作为课题骨干成员参加欧盟科研框架计划

  2020 (European Unions Horizon 2020 research and innovation programme under the Marie
  Sklodowska-Curie Grant 675080)

  等项目。在国际学术期刊和会议上发表论文三十余篇，其中以第一作者或通信发表在

  IEEE Trans.

  和

  Automatica

  期刊论文十余篇。

  担任

  Transactions of the Institute of Measurement and Control

  等国际学术期刊的副编辑和客座编辑，以及多个国际学术会议的程序委员会委员。

  热烈欢迎

  具有数学、机械、计算机等交叉背景的

  优秀学生

  来我们实验室攻读硕士和博士学位。'
