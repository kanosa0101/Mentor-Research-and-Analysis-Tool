bio_raw: '忻欣，

  国家级高层次人才，东南大学首席教授，博士生导师，东南大学复杂工程系统测量与控制教育部重点实验室主任，东南大学智能无人系统研究院执行院长。

  1987

  年以自动化系第

  2

  名的成绩毕业于中国科学技术大学，获得工学学士学位。

  1987

  年硕士生免试推荐至东南大学，师从中国科学院冯纯伯院士。

  1989

  年提前直接攻博，

  1991-1993

  年，获得日本文部省奖学金，作为中日联合培养博士生（师从冯纯伯院士和

  Hidenori Kimura

  教授）在日本大阪大学进行研究，

  1993

  年获得东南大学工学博士学位。

  2000

  年又获得日本东京工业大学博士

  (

  工学

  )

  学位。

  1993-1995

  年在东南大学从事博士后研究，

  1995-1996

  年任东南大学副教授，

  1996-1997

  年任日本新能源产业技术综合开发机构（

  NEDO

  ）最先端领域技术研究员，

  1997-2000

  年任东京工业大学助理教授，

  2000-2007

  年任冈山县立大学副教授，

  2008-

  2023年任冈山县立大学教授，曾任该校计算机和系统工程学院长助理、校国际交流中心副主任、系统工程系主任。正在组建有关机器人与智能系统的研究团队和实验室。

  热烈欢迎优秀学生来我们实验室攻读硕士和博士学位，诚挚邀请优秀青年人才加入我们的团队。每年计划招收硕士研究生

  4-5

  名、博士研究生

  2

  名、博士后

  1-2

  名

  。

  研究领域包括

  仿生智能机器人、人形机器人、四足机器人、

  机器人系统的智能和非线性控制理论和实验验证等。在

  IEEE Transactions on Automatic Control

  、

  IEEE Transactions on Robotics

  、

  Automatica

  等国际顶级学术期刊和重要国际会议上发表论文

  240

  多篇，出版专著

  6

  部，其中包括

  2014

  年由

  Springer

  出版的有关欠驱动机器人系统的非线性控制理论和实验验证成果的专著。

  1988

  年获第二届全国机器人学术会议优秀论文奖，

  2004

  年获日本计测与自动控制学会（

  SICE

  ）控制部门大会奖。参加过日本国家级重大科研项目

  3

  项，主持过日本国家科学研究基金项目

  6

  项，日本

  3

  个研究财团的研究基金项目

  5

  项。主持过中国博士后基金项目、中国国家自然科学基金青年项目等，目前主持中国国家自然科学基金面上项目、国家高层次人才项目和省双创人才项目。曾任国家

  973

  专家组成员、日本计测与自动控制学会控制理论委员会委员，现任中国自动化学会控制理论专业委员会委员

  、

  IFAC

  的

  Large Scale Complex Systems

  的技术委员会委员、

  IEEE

  高级会员等。曾担任过

  IEEE Control Systems Letters

  、日本计测与自动控制学会论文杂志、日本机器人学会论文杂志的编委以及

  50

  多个国际学术会议的程序委员会委员。现为Automatica编委。

  电子邮箱

  :

  xxin100@seu.edu.cn

  .'
