bio_raw: '蔡苗，江苏扬州人，中共党员，讲师，硕士生导师。2019年于南京理工大学自动化学院获得学士学位，2024年于清华大学自动化系获得博士学位，2025年加入东南大学自动化学院/智能无人系统研究院。研究领域包括复杂装备系统故障诊断与容错控制、安全控制的全驱系统方法、具身智能的可靠性与安全性等，主持和参与多项国家级和省部级基金项目，出版英文专著1部，以第一作者/通讯作者在Automatica、IEEE
  Trans.等国际期刊/会议发表论文十余篇。以第一完成人获首都前沿学术成果、3次国际会议最佳论文奖、

  清华大学优秀博士学位论文

  等，入选第十一届中国自动化学会青年人才托举工程。

  课题组隶属于周东华教授领衔的工业系统与高端装备智能运维实验室，欢迎自动化、计算机、电子信息和数学等相关专业的学生报考硕士研究生！

  硕士招生：每年1-2个硕士指标，实验室经费充足、兼顾理论研究与工程实践，欢迎本科生进组。'
