bio_raw: '王庆领，东南大学教授，博士生导师。

  主要从事多智能体系统、集群智能博弈、计算机视觉、强化学习等方面的研究。近年来主持国家自然科学基金、科技创新

  2030

  —“新一代人工智能”重大项目子课题、江苏省自然科学基金等项目

  10

  余项；入选江苏省“

  333

  工程”高层次人才

  、东南大学“我最喜爱的研究生导师”

  提名暨“学院优秀导师”

  、东南大学优秀本科生导师等。

  曾获中国发明协会创新奖二等奖，联合作战智能博弈挑战赛三等奖，江苏省教育教学与研究成果奖一等奖；指导学生获全国智能联合海上作战算法赛一等奖，中国自动化学会青年学术年会最佳理论论文奖等

  10

  余项。在国内外学术期刊和会议发表论文

  100

  余篇，其中

  SCI

  论文

  6

  0

  余篇，

  IEEE

  汇刊

  20

  余篇。

  现任《

  Journal of Applied Mathematics

  》、

  《弹箭与制导学报》、《信息与控制》等10余个期刊编委/青年编委；中国自动化学会高级会员、青年工作委员会副秘书长

  、无人飞行器自主控制专委会委员，

  中国人工智能学会自主无人系统专委会副秘书长，中国指挥与控制学会具身智能专委会委员，

  IEEE

  高级会员，美国数学评论

  (

  Mathematical Reviews

  )

  评论员

  。'
