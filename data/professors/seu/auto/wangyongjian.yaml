  --------------------------------------------------------------------------------------

  讲授课程

  本科生：《控制系统建模与分析综合设计Ⅱ》、《复杂系统与过程控制》（全英文）

  研究生：《人工智能及其应用》

  --------------------------------------------------------------------------------------

  研究兴趣及学生培养

  从科研兴趣出发启发学生，坚持理论方法与工程实际深度结合，鼓励从工业真实场景中提炼科学问题，不局限于纸面仿真研究。

  课题组主要开展两大方向研究：

  其一为工业装备全链条智能运维与可信控制，面向流程工业与机电装备系统，开展故障检测与诊断、故障溯源、故障预测、故障可视化、容错控制与自愈、性能评估的闭环体系研究。融合机理模型、机器学习数据驱动方法、AI
  大模型与行业工艺知识，重点攻关工业大数据建模的可解释性、智能系统可信安全等关键问题；探索大模型赋能下轻量化故障诊断小模型构建方法，实现多源异构复杂工业信息解析，支撑装备的可信感知、可信决策与可信运行。

  其二为面向钢铁工业场景的具身机械臂控制技术，瞄准钢厂高危岗位少人化、无人化的产业现实需求，围绕工业机械臂感知、柔性抓取、运动控制开展研究，开展算法仿真、样机研发与现场工况验证，推动机器人技术在冶金流程工业落地应用。

  🎓招生信息

  博士研究生：每年1名，欢迎具备控制科学与工程、机械工程、人工智能等相关背景的优秀同学联系报考；

  硕士研究生：四牌楼校区每年招收 2 名；苏州 / 无锡校区每年招收 1 名。

  如果你对上述方向抱有热情，欢迎邮件联系交流，期待我们彼此交流、共同成长😊。

