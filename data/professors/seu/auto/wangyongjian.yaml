bio_raw: '王永健，山东莱州人，东南大学副教授，硕士生、博士生导师，洪堡学者。

  课题组面向流程工业与机电装备智能化的现实痛点，开展

  全链条闭环故障智能诊断与具身机器人控制两大方向研究

  。 在智能运维方向，打通

  故障检测‑溯源‑预测‑可视化‑容错自愈‑性能评估

  完整研究链路，融合机理模型、机器学习与工业工艺先验知识，重点攻克工业大数据建模 “黑箱难解释” 的行业痛点；结合大模型技术凝练轻量化故障诊断小模型，实现多源异构复杂工业信息高效解析，推动智能诊断算法真正落地工业现场。

  在机器人方向，面向钢铁高温高危作业场景，开展

  钢厂具身操作机械臂关键控制技术研究

  ，瞄准钢铁企业少人化、无人化转型升级迫切需求，攻克复杂工况下机器人感知、抓取与运动控制难题，让机器人真正走进冶金生产一线。

  课题组坚持理论扎根工程实际，鼓励从真实工业场景提炼科学问题。已发表 SCI 论文 40 余篇、多篇 EI 会议论文；先后荣获校级优秀博士学位论文、香港博士后奖学金、江苏省青年托举人才、德国洪堡学者基金等。主持国家自然科学基金、江苏省自然科学基金及多项企业联合课题，获江苏省钢铁行业协会科学技术奖二等奖，参与多项国家级与横向产学研项目。

  兼任

  IEEE Trans

  、JPC、CEP、IECR 等期刊审稿人；IEEE 会员、中国自动化学会会员、中国人工智能学会会员，江苏省自动化学会普及与咨询工作委员会副主任兼秘书长。

