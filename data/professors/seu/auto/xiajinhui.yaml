bio_raw: '夏金辉

  ，东南大学“至善青年学者”

  ，入选中国电源学会高级会员、中国电工技术学会高级会员、国际电气与电子工程师协会会员（IEEE Member）。2014年获得大连理工大学学士学位，2020年获得大连理工大学博士学位（硕博连读）；2018-2019年获国家留学基金委（CSC）资助赴加拿大英属哥伦比亚大学（UBC）电气与计算机工程学院进行国家公派联合培养；硕博连读期间，曾获硕士/博士研究生国家奖学金（3次）、辽宁省优秀博士毕业生等荣誉。2020-2023年入职浙江大学控制科学与工程学院担任博士后/助理研究员，随后入职东南大学自动化学院。已在IEEE
  TIE/TSG/TSTE/TPEL等本领域权威期刊与国际会议上发表多篇学术论文，授权国家发明专利多项，参编国家级规划教材2本

  ，担任多个国际期刊与旗舰会议审稿人

  ，承担多项国家自然科学基金项目与省部级项目，参研国家自然科学基金重大项目课题、重点项目等。

  主要从事的研究方向如下：

  （1）

  非线性系统主动安全控制理论与方法

  （2）

  永磁同步电机系统高性能控制

  （3）

  智能电网信息物理安全

  相关成果应用于航空、新能源发电、智能电网

  、新能源汽车

  等前沿领域。

  欢迎有志于控制理论与控制工程的同学们加入，共同成长，实现价值。

  课题组经费充足，欢迎对相关方向感兴趣的自动化、电气工程、数学等相关专业保研/考研同学邮件联系。

  2027级保研/考研尚有名额，详情可邮件联系。'
