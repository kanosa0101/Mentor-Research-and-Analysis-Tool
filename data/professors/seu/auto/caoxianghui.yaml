bio_raw: '东南大学自动化学院教授、博士生导师，兼任网络空间安全学科博士生导师。曾获浙江大学竺可桢学院学士、控制学院博士学位，曾在美国伊利诺伊理工学院从事博士后研究。目前主要从事网络化系统的优化、控制与安全等方向的研究工作。

  欢迎报考博士/硕士，招生方向：

  网络化系统优化与控制、

  工业具身智能、

  无人系统智能安全控制等。'
