bio_raw: '丁润泽，

  国家级青年人才，东南大学青年首席教授。

  2024年博士毕业于香港城市大学，后继续从事博士后研究工作，研究方向为机器人、微型飞行系统的驱动和控制，致力于微小型机器人技术的研究。

  招收博士研究生与硕士研究生，

  欢

  迎

  自动化、计算机、机械电子工程等相关专业，

  熟悉编程、机械结构设计，与飞行控制的同学申请。欢迎东南大学本科生参与科研训练。2026级研究生欢迎联系。'
institutes: []
research_direction_raw: 实验室致力于微型机器人系统的前沿研究。我们将通过仿生结构、材料、物理智能以及环境交互策略，提升微型系统的驱动与控制性能。研究方向涵盖无人机导航、混合运动（hybrid
  locomotion）、跳跃运动控制、机器人步态控制等，相关成果已发表于npj Robotics, Science Robotics, TRO等期刊。
