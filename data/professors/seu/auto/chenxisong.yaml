bio_raw: '陈夕松，博士，东南大学自动化学院教授。先后于吉林大学、东南大学获得学士、硕士和博士学位。多年来从事控制科学与工程领域研究工作，主持或作为主要研究人员参与国家

  863

  项目、国家自然科学基金、江苏省自然科学基金、江苏省重大科技成果转化、江苏省重点研发计划项目，以及校企合作项目

  50

  余项。针对复杂工业过程系统，研究基于数据分析、先进控制、人工智能等方法的集成理论与技术，提出了多种适用于不同复杂对象的先进控制优化方法并成功应用。这些成果在石油石化、冶金等流程工业应用中取得了显著的社会效益和经济效益，获得江苏省科技进步一等奖，排名第一。发表学术论文

  80

  余篇，其中

  SCI

  收录

  28

  篇，

  EI

  收录

  32

  篇；授权发明专利

  48

  项，实用新型专利

  17

  项。近年来的研究兴趣主要集中在基于人工智能、优化控制等智能制造领域。'
