bio_raw: '张亚

  教授，博士生导师

  从事集群智能，强化学习，信息物理系统，

  网络安全

  等方面的研究。

  近年来承担科技创新2030重大项目课题、国家自然科学基金项目、

  装发预研

  等科研项目10余项。曾入选江苏省“六大人才高峰”高层次人才选拔培养资助项目和东南大学优秀青年教师科研资助计划。

  现为东南大学青年特聘教授，未来技术学院副院长，

  江苏省自动化学会青年工作委员会副主任，江苏省自动化学会教育工作委员会秘书长，

  江苏省自动化学会常务理事，中国自动化学会人工智能与机器人教育专业委员会委员，中国人工智能学会智能空天系统专业委员会委员，中国指挥与控制学会集群智能与协同控制专业委员会委员、虚拟现实与人机交互专委会委员，
  IEEE高级会员等，

  《指挥信息系统与技术》编委

  。

  在

  Automatica, IEEE 汇刊

  等发表论文

  100

  余篇，

  2008

  年入围关肇直奖。指导学生获得

  2022

  年指挥控制技术发展论坛优秀论文奖、

  第十八届中国智能系统会议优秀论文奖、

  第

  5

  届中国集群智能与协同控制会议最佳学生论文奖等。获得安徽省教学成果一等奖1项。

  曾获得“东南大学院系最受欢迎老师”、“东南大学院优秀导师”称号。'
institutes: []
research_direction_raw: '聚焦多智能无人系统领域，研究方向包括

  集群智能，强化学习，信息物理系统，

  网络安全

  等方面。

  欢迎自动化专业或具有数学或计算机、电子信息专业背景的学生报考。'
