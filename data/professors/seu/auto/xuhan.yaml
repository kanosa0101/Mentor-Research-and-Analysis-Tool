bio_raw: '徐涵，博士，研究方向包括计算机视觉、信息融合、图像增强等，相关

  研究成果发表

  IEEE TPAMI/

  TIP

  /JAS/

  TCI/TGRS/TIM、IJCV

  、

  Information Fusion

  等国际期刊论文和NeurIPS、

  CVPR

  、

  ICCV

  、

  AAAI

  、

  IJCAI等CCF A类会议

  40余

  篇，含ESI热点论文1篇、高被引论文7篇。

  入选2023-2025年“全球前2%顶尖科学家”榜单、江苏省科协青年科技人才托举工程，曾获吴文俊人工智能青年科技奖、

  湖北省自然科学二等奖（第三完成人）

  、

  中国人工智能学会博士学位论文激励计划（优博奖）

  、

  IEEE SPS Best Paper Award（最佳论文奖）

  、

  武汉大学研究生“十大学术之星”、研究生学术创新奖特等奖（校长奖）等。获批主持国家自然科学基金

  青年科学基金

  （C类）、江苏省基础研究（自然科学基金）项目，

  担任IEEE TPAMI/TIP/TNNLS/TCSVT、IJCV、Information Fusion等多个国际期刊和NeurIPS、ICML、CVPR

  、

  ICCV、

  ICLR

  、ECCV、AAAI等多个国际会议审稿人。

  欢迎自动化、计算机、电子信息和数学等相关专业的学生报考硕士研究生。

  指导本科生科研训练和毕业设计。'
