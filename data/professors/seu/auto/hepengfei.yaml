bio_raw: '何朋飞，1994年生，于2023年加入东南大学自动化学院任上岗副研究员，博士生导师，入选2025年香江学者奖励计划(合作导师：

  姚新

  )。主要学术方向为：大规模机器人路径规划问题，机器学习与图神经网络，智能优化算法，运筹优化。研究成果以第一作者身份发表在

  INFORMS Journal on Computing(UTD24), Transportation Science, European Journal of
  Operational Research

  等知名期刊。

  每年计划招收博士研究生1-2名（2027级博士有名额），硕士研究生2名(2027级剩余2个保研名额)

  ，

  欢迎

  数学、

  计算机、自动化

  等相关专业背景的本科生报考硕士研究生

  ，加入

  机电系统控制实验室

  。

  欢迎本科生参与科研训练，指导

  SRTP

  、本科毕设、论文和专利撰写。

  更多详细信息请查看个人主页：

  https://pengfeihe-angers.github.io/pengfeihe-angers.io/'
