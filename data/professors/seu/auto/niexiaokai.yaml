bio_raw: '东南大学至善青年学者，

  东南大学副教授，华为-东南大学网络群体智能联合创新实验室。博士毕业于英国谢菲尔德大学(The University of Sheffield)自动控制与系统工程专业，本科和硕士毕业于中南大学自动化专业以及控制科学与工程专业。负责和承担了多项英国

  EPSRC

  、

  Innovate UK

  等英国国家级和企业合作科研项目，主持国家自然科学基金项目，江苏省、广东省等省部级科研项目，重点实验室课题项目，以及华为合作项目课题等，参与国家自然科学基金、国家重点研发计划和省部级

  多项

  科研项目。

  入选江苏省高层次创新创业人才引进计划，获得南京市留学人员科技创新项目择优资助。

  研究方向包括人工智能与智能决策及其在通信网络、物联网、能源系统中的应用，

  自主智能系统，

  动力学系统辨识与控制及其在机器人系统、生物医学、智能电网、能源互联网等中的应用。研究成果发表在

  IEEE TWC/TCOM/

  TVT

  /

  J Nonlinear Science

  /

  Inverse Problems

  等智能通信网络与非线性动力学系统领域

  SCI

  期刊，担任多个领域内国际权威

  SCI

  期刊和会议论文评审人。

  欢迎专业

  基础扎实、英语水平较好

  的

  自动控制、计算机、电气及电子信息等相关背景

  学生报考研究生！

  V

  P'
