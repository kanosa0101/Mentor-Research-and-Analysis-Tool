bio_raw: '洪丹枫，东南大学教授，博士生导师，硕士生导师，德国洪堡学者，日本

  JSPS

  学者，国家级青年人才，科睿唯安全球“高被引科学家”，全球前

  2%

  顶尖科学家。德国慕尼黑工业大学（

  TUM

  ）博士，曾为德国宇航中心（

  DLR

  ）研究员兼

  “

  光谱视觉

  ”

  课题组组长、法国格勒诺布尔阿尔卑斯大学

  -

  傅立叶实验室（

  GIPSA Lab

  ）客座研究员、德国亥姆霍兹联合会人工智能研究院（

  HACUI

  ）

  AI

  科研顾问。主要研究方向为人工智能、多模态遥感、大模型、高光谱成像、地球科学、智能感知、计算机视觉等。在NRMP、

  IEEE TPAMI

  、

  IEEE TIP

  、

  IEEE GRSM

  、

  IEEE TCYB

  、

  IEEE TNNLS

  、

  RSE

  、

  ISPRS

  、

  The Innovation、The Innovation Geoscience、C

  VPR、ECCV、

  NeurIPS、AAAI、ACMMM

  等期刊会议发表论文200余篇，累计

  ESI

  热点论文

  24

  篇，

  ESI

  高被引论文

  63

  篇，

  Google Scholar

  引用34

  000+

  。获得《麻省理工科技评论》

  --

  中国智能计算创新人物奖、中国指挥与控制学会技术发明一等奖（序1）、

  中国指挥与控制学会

  青年科技奖、

  IEEE GRSS Highest Impact Paper Award

  、

  IEEE GRSS

  杰出青年奖（

  Early Career Award

  ）、

  AI100

  青年先锋、

  Remote Sensing

  青年科学家奖、国际高光谱顶级会议

  WHISPERS

  杰出论文奖（

  Jose Bioucas Dias

  奖、

  Paul Gader

  奖）、

  IEEE TGRS

  、

  IEEE JSTARS

  最佳审稿人奖、国家优秀自费留学生奖学金、

  Wiley

  中国开放科学高贡献作者奖、遥感新势力奖等。担任IEEE TPAMI、

  IEEE TIP

  、

  IEEE TCI

  、

  IEEE TGRS

  、

  Information Fusion

  等期刊副主编

  /

  编委。

  热忱欢迎数学、物理、计算机科学、人工智能、自动化、电子信息、地学等相关背景的优秀同学加入我们的团队，攻读硕士、博士学位，或从事博士后研究。

  联系方式：

  danfeng.hong@seu.edu.cn'
