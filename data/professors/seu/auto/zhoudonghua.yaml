bio_raw: '东南大学教授/博导、智能无人系统研究院首席科学家，矿山安全检测技术与自动化装备国家地方联合工程研究中心主任。为上海交通大学学士/硕士/博士、浙江大学博士后。曾任北京理工大学青年学术带头人、清华大学自动化系主任、山东科技大学副校长、教育部高等学校自动化类专业教学指导委员会主任、中国自动化学会副理事长、国务院控制科学与工程学科评议组成员、中国自动化学会故障诊断与安全性专委会主任。为中组部/科技部/教育部国家级专家、国家自然科学基金委创新群体负责人、全国高校黄大年式教师团队负责人、全国优秀科技工作者、山东省攀登计划专家。为IEEE/
  AAIA/IET / CAA  Fellow，Elsevier高被引学者。

  长期从事复杂装备安全性研究，以第一完成人获国家级奖励4项（含国家自然科学二等奖2项、全国创新争先奖1项、国家级教学成果二等奖1项），并荣获中国青年科技奖、首届中国自动化学会科技成就（个人）奖（共2人获奖）、首届全国优秀博士后奖、霍英东高校青年教师奖。

  热烈欢迎优秀学生来我们实验室攻读硕士和博士学位，诚挚邀请优秀青年人才加入团队。每年计划招收硕士研究生5

  -6

  名、博士研究生

  2-3

  名、博士后2

  -3

  名

