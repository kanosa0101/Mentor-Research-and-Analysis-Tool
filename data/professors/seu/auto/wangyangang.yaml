bio_raw: '王雁刚，男，1987年生，博士生导师。主要学术方向为：人工智能（立体视觉）、计算机图形学、人体动态三维重建。

  主持和承担了多项国家自然科学基金

  。

  2009

  年获东南大学工学学士学位，同年免试保送清华大学攻读博士学位。

  2014

  年博士毕业

  后进入微软亚洲研究院（

  MSRA

  ）网络图形组工作。

  2017

  年底加入东南大学自动化学院。目前

  担任

  中国图象图形学会智能图形专业委员会委员、三维视觉专业委员会委员；中国人工智能学会脑科学与人工智能专业委员会委员；

  IEEE/ACM member

  。

  曾入选

  第五届中国科协青年人才托举工程；

  江苏省“双创博士”人才；东南大学“至善学者”

  A

  层次人才。获

  东南大学第

  26

  届青年教师授课竞赛二等奖（

  9/194

  ）

  。

  更多详细信息请查看个人主页：

  www.yangangwang.com

  。'
