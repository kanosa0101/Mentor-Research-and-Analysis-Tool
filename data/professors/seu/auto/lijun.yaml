  李博士的机器人学与智能系统实验室（

  RISYS Lab

  ），现有在读全日制博士生

  8

  人、硕士生

  16

  人，合作副教授、讲师各一人。秉持科研应创造社会价值的理念开展产学研合作，他的团队创立了东大自动化学院—苏州苏瑞膜智能制造联合工程研发中心，与华为、青岛港、中核华兴、中交二航局、中船鹏力等单位建立紧密联系和合作关系，解决企业重大需求难题。近来年，李博士的团队正尝试视觉、调度、机器人的几款原型、样机的开发和产业化。

  研究方向

  1.

  智能机器人：

  机器人的任务理解、环境感知、行为决策与控制的理论方法研究与装备开发。目前重点围绕

  移动作业机器人

  研究基础大模型、自动驾驶与作业控制、自主编程、机器人学习、建筑建图与测绘等技术，开发爬壁机器人、物流机器人、建筑机器人、软体机器人等装备。

  2.

  模式识别与图像处理：

  工控、安监与质检等领域的模式识别与图像处理技术与装备研发。目前着重研究车道线

  /轨迹

  检测与跟踪、环境感知与作业引导、视频感知增强、异常状态与行为检测、尺寸与轮廓测量、表观缺陷检测、自动计数与校验等技术与装备；

  3.

  系统工程：

  大规模

  /

  超大规模优化、集群调度与控制的理论方法与应用研究。目前着重面向大规模

  /

  超大规模组合优化问题，如多重贯序排序问题、着色旅行商问题、复杂布局问题，研究其数学建模、进化分治求解、构造式

  /

  生成式优化算法设计的理论方法，以及开展多机大规模作业调度与控制（任务调度、路径规划、协作控制）的应用研究，开发相关优化与仿真软件、云

  -

  边

  -

  端协同的调度与控制系统。

