  东南大学智慧建造与运维国家地方联合工程研发中心，副主任。

  目前主要围绕物流、交通、建造、制造等领域的自动化、智能化、数字化建设需求，开展运筹优化、机器视觉、智能机器人等方向的研究。近年来，（

  1

  ）提出多机大规模作业系统的一体化调度与控制理论方法：以独创的着色旅行商问题（

  Colored Traveling Salesman Problem

  ）理论、运筹优化、机器学习、云计算、智能控制等方法与技术为核心，统一解决各领域同构

  /

  异构、有人

  /

  无人多机大规模作业系统的任务调度、路径规划与协作控制的难题，已在港口、物流仓储、建造等多个行业落地应用。（

  2

  ）拥有工程车辆自动驾驶和作业引导的核心视觉感知技术，涉及自适应车道线与极细缝隙的鲁棒精确跟踪、集装箱装卸智能识别定位、车

  -

  臂协同、多车协同控制等高精尖技术，已应用到集装箱轮胎吊自动驾驶和装卸、自主无轨移动焊接，推广场景还包括重载物流搬运、建筑吊装。（

  3

  ）拥有输送线上运动工件的尺寸偏差和表观缺陷的动态检测技术，广泛适用于中高速产线上各式工件的顶面、端面、侧面尺寸和表观在线检测，已在重大基础建设领域应用并首创钢筋套丝头加工偏差在线视觉测量系统。

  （

  4

  ）拥有目标清点与自动校验视觉技术，已形成贵重、重要小件清点样机装备并在多行业落地应用，可以进一步研究推广到其他静、动态小、微目标的精准计数上。（5）已形成便携式安监视觉工作站样机，实现了动火、人员劳保着装、行为异常、有害气体的一站式检测，可以单机和网络化部署，提供算法、软件、设备的定制化开发服务，已实现小批量应用。

