bio_raw: '杨

  超群，江西抚州人，东南大学自动化学院副教授，东南大学至善青年学者（A类），博士生导师，江苏省“双创”人才，国际电气与电子工程师学会(IEEE)高级会员（Senior
  MeMber），国际信息融合学会(ISIF)会员，中国航空学会信息融合分会无人系统专委会秘书长，定位与跟踪专委会委员，中国电子学会信号处理分会青年委员，中国自动化学会青工委和工业物联网技术与应用专委会委员。2014年于厦门大学海洋技术专业获学士学位，2019年于浙江大学电子与科学技术专业获博士学位（

  网络传感与控制（NESC）课题组，导师史治国教授（长江学者）

  )

  ，2019-2022年于中电科从事雷达装备及技术研发工作，2022年加入东南大学自动化学院。出版译著一部，发表SCI、EI

  等

  论文100余篇，申报和授权国防专利、发明专利20余项，主持和参与国家自然科学基金、江苏省自然科学基金、江苏省前沿技术研发等多项国家级、省部级和企业横向委托等科研项目。研究方向主要为智能

  信息处理与融合、工业互联网

  等。长期从事雷达信息与数据处理、多源数据融合的算法与工程应用研究，理论与工程经验丰富。

  曾担任多个学术会议如IEEE SAM2026、 国际信息融合大会（Fusion2025）、IEEE ICCC2024、ICAUS2022、ICSPS2024、中国信息融合大会2025的专题主席，以及多个会议的TPC
  Member等，曾在无人系统高峰论坛2025、

  ICSPS2025、IET 国际雷达会议2025等国内外学术会议上做受邀报告。

  目前还担任《现代雷达》

  《无人系统技术》期刊青年编委、Chinese Journal of Information Fusion期刊青年编委、

  多个SCI期刊如IEEE TSP/TAES/TII/SPL

  的审稿人、教育部学位论文抽检评审专家等。获得学术荣誉包括：IEEE MFI2026最佳学生论文奖、中国信息融合大会2025最佳论文奖、ICAUS2024最佳会议论文奖、

  自动化学报英文版国际学术会议优秀论文奖、

  ICAUS2022/2023最佳组织者奖等。

  译著出版，欢迎大家选购：

  解析组合多目标跟踪理论（Analytic Combinatorics for Multiple 【行情 报价 价格 评测】-京东

  ----------------------------------------------------------------------------------------------------------------------------

  专注于

  人工智能

  驱动的

  信息融合

  的基础理论与前沿技术研究工作，在人工智能、目标跟踪、信息融合、态势感知与评估、雷达视觉融合

  等方向沉淀深厚。

  热爱教学与科研工作，愿意与学生打成一片，形成

  亦师亦友

  的师生关系，凡事多为学生着想，

  宽严相济、

  共同努力，相互成就

  ，助力学生成才。

  欢迎数学、自动化、控制、计算机、通信、电子、水声等理工科专业学生报考联系，欢迎加入课题组！

  欢迎联系，硕士博士均可！

  目前尚有硕士名额，欢迎联系！

