bio_raw: '路小波，博士，二级教授，博士生导师。分别于上海交通大学、东南大学、南京航空航天大学获学士、硕士和博士学位，之后在东南大学电子学与通信博士后流动站做博士后研究。近年来主持完成国家、部省级项目及企业项目

  10

  多项，目前正在主持多项国家、省部级科研项目及企业委托项目。获国家科技进步二等奖

  1

  项，教育部自然科学一等奖1项，江苏省、公安部科技进步二等奖各

  1

  项，中国发明创新一等奖

  1

  项，中国产学研合作创新成果一等奖

  1

  项。获授权发明专利

  35

  项、软件著作权

  2

  项。在

  IEEE TPAMI

  、

  IEEE TIP

  、

  IEEE TCSVT

  、

  IEEE TITS

  、

  PR

  及

  CVPR、ICCV、AAAI

  等国际顶级期刊及会议上发表论文；与黄卫院士合编教材《智能运输系统（

  ITS

  ）概论（第二版）》由人民交通出版社出版。指导的研究生获智能交通领域全国优秀博士论文

  1

  篇，江苏省优秀博士论文

  1

  篇，

  中国人工智能学会吴文俊优秀博士论文提名1篇，

  东南大学优秀博士论文

  1

  篇、优秀硕士论文

  2

  篇。

