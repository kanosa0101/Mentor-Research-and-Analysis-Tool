bio_raw: '李中国，

  东南大学青年首席教授，

  国家级青年人才，博导/硕导。

  2017年获得曼彻斯特大学与吉林大学双本科学位，2021年获得曼彻斯特大学博士学位（校长奖学金、国家优秀自费留学生奖学金）。先后在伦敦大学学院、曼彻斯特大学担任助理教授，在拉夫堡大学从事博士后研究。研究聚焦于人工智能、学习控制、分布式优化及其在机器人系统中的应用。出版英文专著1部，在IEEE
  Transactions 和 Automatica 等期刊及会议上发表论文50余篇。

  每年计划招收博士研究生2名，硕士研究生3

  名

  。欢迎加入机电系统控制实验室（李世华教授团队）。

  主要研究兴趣包括：

  1.   异构机器人、具身智能感知、规划与控制

  2.   分布式多智能体系统优化、学习与控制

  3.   大语言模型及其在机器人和能源领域的应用'
