bio_raw: '欢迎

  ：

  东南本科科研生：学有余力，课题组组会本校生开放；不低于1年；

  本科毕设（与具身公司联合培养）：

  实验室保研者优先，目标：IROS/ICRA级别成果（导航/实用VLA等）；

  硕士保研（与具身公司联合培养）：东南夏令营优营后再联系，往年学生背景见“学生培养”一栏；

  博士生（与具身公司联合培养）：无IEEE Trans、RAL、CCF A、ICRA/IROS成果，暂不考虑；

  博士后：学校优先支持至善博士后

  推动

  具身智能/自主控制的发展与落地

  。

  邮件：sucas@seu.edu.cn

  , 请附简历

  苏金亚，男，1990年出生于山东，

  国家级青年人才(2022)、

  斯坦福

  全球前

  2%

  科学家榜单学者（2023-2025）、首届江苏青年科技人才U35培育(2025)、

  东南大学青年首席教授(2022,教授/

  博导，五四奖章获得者)、(前)

  英国阿伯丁大学高级讲师(2022,北美体系长聘副教授)、

  英国埃塞克斯大学讲师（2019）&荣誉高级讲师（青年学者奖，全校三人）、

  南京紫金山C类人才、小米青年学者、

  国家优秀自费留学生奖学金获得者(2015)

  。担任

  学院学术委员会委员、

  智能无人系统研究院固定人员、吴健雄学院班级学业导师、未来技术学院导师。

  2011年本科毕业于山东大学(威海)数学与统计学院，

  2016

  年博士毕业于英国拉夫堡大学航空与汽车工程系，随后在英国多所研究型大学--拉夫堡大学、埃塞克斯大学、阿伯丁大学--先后担任博士后

  、讲师（长聘）

  、高级讲师（长聘）

  。

  研究方向为：

  存在多源干扰不确定下的

  AI在环强自主系统智能感知、规划、控制及其一体化

  。在上述方向作为

  (

