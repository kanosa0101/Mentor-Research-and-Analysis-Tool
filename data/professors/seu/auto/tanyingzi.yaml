bio_raw: '谈英姿：

  女，

  1969

  年

  6

  月生，汉族，上海市人。

  1991

  年

  7

  月毕业于东南大学自控系获学士学位，

  2002

  年

  9

  月获东南大学博士学位，现为东南大学自动化学院副教授。

  致力于智能移动机器人的研究。在救援机器人和人形机器人方面已进行多年探索

  ,

  重点关注机器人的机动性、感知能力、定位建图能力、操作界面、远程操控性以及自主导航等

  ,

  长期指导并带领东南大学

  RoboCup

  机器人研究团队参加国内外

  RoboCup

  机器人比赛，并在国际国内比赛中多次获奖。自2006年作为东南大学智能车创新团队负责人，长期

  投身学生学科创新竞赛活动的组织和辅导工作。'
