bio_raw: 夏思宇，男，博士，东南大学自动化学院副教授，自动化学院行政助理，自动化学院模式识别与智能系统学科组组长，江苏省智能助老装备研究会理事，江苏省计算机学会图形图像专委会委员，江苏省人工智能学会人工智能基础与应用专委会委员，江苏省人工智能学会智能系统与应用专委会委员。博士毕业于东南大学自动化学院模式识别与智能系统专业。主要的研究方向为机器学习、模式识别、图像处理、计算机视觉等。2010-2011年作为国家留学基金委全额资助的访问学者在美国纽约州立大学布法罗分校计算机科学与工程系，从事机器学习理论与应用的研究。2012年6月至8月作为Research
  Fellow访问美国纽约州立大学布法罗分校协同学习媒体实验室(Synergetic Media Learning Lab)。2012年8月至2013年5月挂职南京市白下区科技局副局长。2013年7月至8月在美国里海大学工程与应用科学学院进行学习与交流。2014年入选江苏省“科技副总”岗位。2015年获教育部高校自然科学二等奖。2018年获江苏省煤炭学会煤炭科学技术进步奖三等奖。2015年9月至2016年8月作为江苏省第八批科技镇长团团员挂职盐城市大丰区科技局与江苏省大丰港经济开发区管委会。2016年被评为东南大学优秀党员。2018年4月至2019年4月在美国东北大学计算机与信息科学学院SmileLab实验室访问。2025年获第八届亚洲模式识别大会Best
  Paper Award Runner-up奖，计算机视觉顶会ICCV2025 Workshop AMFG的最佳论文奖。曾指导多名本科生与硕士研究生论文获校级与省级优秀毕业论文。在国内外学术刊物和会议上发表论文150余篇，其中部分工作发表在TIP、TMM、TEVC、TOMM、IJCAI、CVPR、AAAI、ICCV、ACM
  MM、IEEE VR、WACV、EMNLP等国外权威刊物或顶级会议上。申请专利50余项（目前已授权30项）。主持开发了色素性皮肤病多源影像AI辅助分析与疗效评价设备、矿用煤矸自动分离装置、钢球表面缺陷视觉检测设备、架空输电线路数字化验收装置、语音驱动3D数字人口型与表情生成、鹰眼系统、网球运动智能分析系统等并都已投入使用。
