bio_raw: '谢利萍，自动化学院副教授，博士生导师，东南大学至善学者（荣获两次），东南大学南通海洋高等研究院深海资源开发工程中心副主任。

  2011年获东南大学工学学士学位，2017年获东南大学工学博士学位（

  悉尼科技大学联合培养，师从魏海坤教授和陶大程教授

  ）。

  2017年留校任教后破格晋升为副教授。长期聚焦无人系统具身多模态感知与实时安全控制领域的研究，在国际学术期刊和国际会议上发表论文50余篇（其中中科院一区TOP和CCF-A类论文20余篇），包括国际顶级期刊和会议物TNNLS,TCYB,
  TII,TFS,TSMC-S,TMM,IJCAI等等。现担任IEEE TNNLS,IEEE TCYB,IEEE TBD,IEEE-TIP,NEUCOM等刊物审稿人，曾受邀担任NIPS,ICML,ICLR,ICDM2023 PC
  member, IJCAI-PRICAI2020 PC member，IscIDE2019 PC member等等。国家发明专利20余项。主持各类项目20余项，包括国家自然科学面上项目和青年项目，江苏省发展改革类专项重点项目等，累计科研经费近1000万元。现为江苏省人工智能学会模式识别专委会委员，江苏省自动化学会会员，中国计算机学会会员，电气电子工程师学会会员。

