bio_raw: '李奇，男，1963年8月生，江苏苏州人，

  九三学社

  成员，1986年3月参加工作，研究生学历，博士学位，

  东南大学

  教授，博士生导师。东南大学

  控制科学与工程

  一级学科学术带头人。享受国务院政府特殊津贴专家。

  现任南京市政协副主席，九三学社省委副主委、监督委主任、

  南京市委主委。'
institutes: []
research_direction_raw: '包括智能控制、优化方法和流程工业综合自动化等。先后主持国家

  863

  、

  国家自然科学基金

  等省部级科研项目30余项，发表论文

  SCI

  和

  EI

  论文收录40余篇。

  2003年8月－2004年8月，应诺贝尔奖获得者

  丁肇中

  教授邀请，在美国

  麻省理工学院

  （

  MIT

  ）进行高级访问研究，参与国际空间站阿尔法磁谱仪（AMS-02）研制。'
