bio_raw: 刘光灿，男，教授，主要研究低维模型与优化在机器学习、模式识别、计算机视觉、信号处理、序列预测等领域的应用。在高维数据的无监督、无损、低维表达方面取得了重要进展：提出低秩表示及其可学习化模型与理论，引领了无监督无损表示学习这一研究方向。发表IEEE
  T-IT、IEEE T-PAMI、NeurIPS、ICML等CCF A类论文50余篇，Google Scholar 引用10000多次。2016年获国家优青与江苏省杰青；2017年获教育部自然科学二等奖与吴文俊人工智能优秀青年奖，并入选科睿唯安ESI高被引学者榜单；2020年获CCF自然科学一等奖；2021年获中国电子学会自然科学一等奖。现为IEEE高级会员，担任ICML、NeurIPS等CCF
  A类会议的Area Chair。
