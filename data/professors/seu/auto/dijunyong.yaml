bio_raw: '翟军勇，博士，教授，博士生导师。

  2006

  年

  6

  月毕业于东南大学控制理论与控制工程专业，获工学博士学位。2025年入选“全球前2%顶尖科学家”榜单和“终身科学影响力排行榜”。

  2022

  年入选江苏省“

  333

  高层次人才培养工程”，

  2017

  年入选江苏高校“青蓝工程”中青年学术带头人，

  2014

  年入选江苏省“六大人才高峰”资助计划。近年来，主持国家自然科学基金

  4

  项，江苏省自然科学基金

  2

  项，教育部博士点专项基金，中国博士后基金，以及企业委托课题等项目。现为

  IEEE

  高级会员，中国人工智能学会智能空天系统专业委员会委员，中国自动化学会控制理论专业委员会随机系统控制分组委员。目前，担任本科生主干课程《自动控制原理》和研究生学位课程《线性系统理论》的教学工作。在国内外学术期刊和会议上发表论文

  200

  余篇，其中

  SCI

  收录

  120

  多篇；获国家发明专利授权

  12

  件。'
