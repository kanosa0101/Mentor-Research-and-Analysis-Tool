bio_raw: '张开华，男，教授，IEEE 高级会员，主要研究方向为

  资源受限的具身多模态智能感知，

  包含目标分割、跟踪、检测。重点围绕提升模型的精度、速度以及泛化性等方面，开展了系列较为深入的研究工作，并取得了一定的研究进展

  。

  发表IEEE T-PAMI、IJCV、IEEE T-IP、IEEE T-MM、IEEE T-CSVT、CVPR、ICCV、ECCV等国外顶级期刊与会议论文30余篇，Google
  Scholar 引用11000余次。2016、2022年两次入选江苏省333高层次人才培养工程；2017年获江苏省杰青；2018年获教育部自然科学一等奖（3/5）以及江苏省教学与研究成果（研究类）一等奖(4/5)；

  2020年度CCF科学技术奖自然科学二等奖(1/2)

  ；

  2022年度CCF-CV持久影响力工作奖(1/3)

  ；入选

  2022年

  人工智能全球最具影响力学者榜单（AI 2000）

  ，

  2023年度多媒体领域旗舰国际会议ICME最佳学生论文奖(通信作者)

  ；2017年国际人脸关键点定位竞赛冠军；2017年度ImageNet竞赛冠军；2022年度国际权威竞赛VOT-LT2022召回率评测冠军。现担任CCF A类会议

  ICML、NeurIPS、ICLR、AAAI

  的Are

  a Chair，以及JCR Q1 Top期刊

  Pattern Recognition、IEEE JSTARS

  的Associate Editor。

  团队招生：

  我们是一支践行“我为人人，人人为我”精神的团队，寻找同样对科研有深度热情的伙伴。

  招生名额：

  博士生（1名/年），硕士生（1-2名/年），并欢迎本科生参与科研训练 （

  News！

  https://automation.seu.edu.cn/2026/0725/c24459a578139/page.htm

  ）。我们相信，卓越的研究诞生于共享与协作。欢迎附简历申请，邮箱：zhangkaihua@seu.edu.cn。'
