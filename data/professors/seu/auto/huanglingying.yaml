bio_raw: '黄灵莹，女，博士毕业于香港科技大学，后在新加坡南洋理工从事博士后研究员。于2024年12月入职东南大学，国家级青年人才，东南大学青年首席教授，博士硕士生导师。博士期间获得香港科技大学理工学院2019-20年度在读博士卓越研究成果奖。多项研究成果的发表涵盖了控制领域顶级期刊，如
  Automatica，IEEE TAC, 信号处理领域顶级期刊 IEEE TSP, 计算机网络领域顶级期刊及会议 IEEE/ACM TON等。担任中国自动化学会故障诊断与安全性专业委员会委员，江苏省自动化学会委员智能优化与应用专委会委员，IEEE
  PRECEDE 2025宣传主席，

  Automatica，IEEE TAC等多个国际高水平期刊审稿人。东南大学吴健雄学院校友联络人、东南大学未来技术学院导师。

  欢迎优秀的东南本科

  参与科研训练，指导SRTP

  （学有余力）

  、本科毕设

  （本实验室保研者优先）

  、论文和专利撰写。

  欢迎硕博士研究生、博士后（学校优先支持至善博士后）加入

  机电系统控制实验室

  。

  每年计划招收博士研究生2名，硕士研究生3名

  （2026级保研生拿到东南夏令营入营资格后联系，课题组从优营学员中选拔，东南本校生线下沟通)

  。

  主要研究方向：

  （1）信息物理系统的隐私安全问题；

  （2）事件驱动的能源调度和实时重规划；

  （3）多智能体协同控制；

  （4）水下机器人。'
