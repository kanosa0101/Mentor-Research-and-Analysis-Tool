bio_raw: '方仕雄，工学博士，副研究员。

  2002

  年

  3

  月与

  2009

  年

  3

  月毕业于东南大学控制理论与控制工程专业，分别获工学硕士

  和工学

  博士学位。

  2004

  年至

  2006

  年受诺贝尔奖获得者

  丁肇中

  教授邀请，赴瑞士欧洲核子研究中心

  (CERN)

  进行合作研究，参与阿尔法磁谱仪（

  AMS-02

  ）粒子探测器控制系统研制工作

  。

  2019

  年

  10

  月

  -2020

  年

  4

  月，参与中国第

  36

  次南极考察内陆队，完成中国南极泰山站无人值守能源装备的部署实施。负责国家重点研发计划项目课题、国家科技支撑计划项目课题、国家国际科技合作重点项目课题、江苏省重点研发项目课题、上海市科技攻关项目课题和江苏省自然基金等

  30

  余项，获江苏省科技进步二等奖

  3

  项。'
