bio_raw: '武永宝，自动化学院副研究员，博士生导师，IEEE高级会员（Senior Member, IEEE）。长期从事随机复杂网络控制理论、网络安全协同控制理论与技术、多智能体系统博弈优化等领域的研

  究工作。入选全球前2%顶尖科学家榜单（2025年）、江苏省卓越博士后计划。共发表或接收SCI/EI期刊论文60余篇，其中IEEE汇刊论文和Automatica期刊论文25篇，第一/通信作者SCI论文35余篇。申请与受理国家发明专利10余项。主持多项国家级、省部级和其他各类基金

  项目，包括国家自然科学基金（面上项目、青年基金），江苏省基础研究计划青年基金，中国博士后科学基金特别资助，中国博士后科学基金面上资助等。

  荣获山东省高等学校科学技术奖，

  宝钢教育奖优秀学生奖、

  中国自动化学会第

  39

  届青年学术年会最佳理论论文奖等。担任《信息与控制》期刊的青年顾问团专家、《

  Complex Systems Stability & Control

  》期刊编委、《

  Journal of Intelligent Monitoring and Control Systems

  》期刊副编辑、国际

  SCI

  期刊《

  Electronics

  》客座编委，自动化学会青年工作委员会委员、人工智能与机器人教育专业委员会委员、智能无人系统建模与仿真专业委员会委员等。

