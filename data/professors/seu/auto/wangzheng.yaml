bio_raw: '汪峥，

  1973

  年生，东南大学自动化学院教授、博士生导师。

  1993

  年于长春光学精密机械学院获学士学位，

  1998

  年于东南大学自动化研究所获硕士学位，

  2001

  年于东南大学自动化研究所获博士学位；

  2001-2003

  年在上海交通大学机械与动力工程学院做博士后研究；

  2003

  年至今在东南大学自动化学院工作，

  2012

  年晋升教授、博士生导师。

  2009

  年

  1

  月至

  2010

  年

  1

  月、

  2017

  年

  8

  月至

  2018

  年

  2

  月两次受国家留学基金资助在麻省理工学院

  (MIT)

  做访问研究，分别任访问副教授及高级研究学者。研究领域包括：亚毫米波望远镜控制、控制科学在天文望远镜及仪器中的应用，

  优化方法与最优控制，系统工程

  ；主持国家自然科学基金重点项目1项、面上项目

  3

  项，

  IEEE

  高级会员

  。

  目前研究重心放在中国、美国、智利合作的LCT亚毫米波望远镜重建及性能升级，以及依托这一望远镜的国家自然科学基金重点项目：强柔性大干扰下LCT望远镜高精度指向控制。

  图1. 这是位于夏威夷Maunakea山顶(海拔4070m)的加州理工学院亚毫米天文台(Caltech Submillimeter Observatory, CSO)10.4m亚毫米波望远镜，现已退役、拆解，并将于2025年在智利Chajnantor高原（海拔5050m）重建为新的LCT亚毫米波望远镜（Leighton
  Chajnantor Telescope）。

  图2. 这是我2023年9月在夏威夷Maunakea山顶(海拔4070m)的加州理工学院亚毫米天文台(Caltech Submillimeter Observatory,
  CSO)10.4m亚毫米波望远镜工作时的照片，CSO望远镜附近建有多台一流的天文望远镜(光学、红外、亚毫米)和望远镜阵列：CSO，JCMT，SMA, Subaru,
  Keck ......'
