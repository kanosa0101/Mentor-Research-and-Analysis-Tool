bio_raw: '刘杉，副教授，硕士生导师。1996年出生，2018年本科毕业于北京航空航天大学，2022年博士毕业于清华大学。研究领域包括智慧交通、逆向强化学习、强化学习等，对即时配送、道路交通、轨道交通等多种模式的时空预测、车辆调度、路径规划等任务有持续研究。科研方面，入选中国科协青年人才托举工程、江苏省双创博士、东南大学至善青年学者，主持国家自然科学青年基金、江苏省自然科学青年基金，一作/通讯发表SCI论文十余篇，多项研究成果发表在Transportation
  Research Part C/D/E、IEEE TGRS/TIM、ICML等国际知名期刊会议。教学方面，获评全国高校自动化类专业青年教师讲课（说课）大赛二等奖、江苏省高校教师教学创新大赛一等奖、东南大学吾爱吾师-院系最受欢迎老师、东南大学优秀本科生导师。

  招生计划

  每年招收硕士研究生2-3名，欢迎相关专业的同学联系报考。

  欢迎本科生参与科研训练，指导数学建模、SRTP、本科毕设、论文专利撰写。

  组内风格

  师生尊重，教学相长，轻松活泼，严谨求实

  希望研途充实精彩，助力学生未来成长'
