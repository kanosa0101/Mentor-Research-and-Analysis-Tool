bio_raw: '王颖，女，1989年生，东南大学自动化学院副教授，博导，硕导，每年招收博士生1名，硕士生1~2名。

  目前在张凯锋教授的科研团队。2011年本科毕业于南京航空航天大学电气工程与其自动化专业，2014年硕士毕业于东南大学控制理论与控制工程专业，2018年博士毕业于东南大学控制理论与控制工程专业。2015.9-2017.3在美国阿贡国家实验室（Argonne
  National Laboratory）CSC联合培养，2017.3-2017.4在美国麻省理工学院访问交流。

  主要研究方向：电力系统调度与控制、电力市场、综合能源系统，人工智能方法在上述领域中的应用。

  联系方式：wyseu@seu.edu.cn'
institutes: []
research_direction_raw: '电力系统调度优化、电力市场、综合能源系统运行,人工智能在上述领域中的应用

  目前课题组

  特别亟需博士研究生2名：

  1. 电力市场机制设计，备用需求

  评估，电力调度优化相关方向的同学（偏向概率分析，优化建模，MILP优化，涉及一些电力市场规则、机制，经济学基础）

  2. 电力系统控制，多资源组织协调参与AGC调频等。'
