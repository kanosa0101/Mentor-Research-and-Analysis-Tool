bio_raw: '李新德，东南大学自动化学院教授，华中科技大学博士，新加坡国立大学博士后，美国佐治亚理工大学国家公派访问学者，IET Fellow，IEEE Senior
  Member，《科学中国人》封面人物，中国人工智能学会智能机器人专委会副主任委员，中国人工智能学会智能产品与产业工委会副主任委员、中国自动化学会智能制造系统专委会副主任委员等。

  主要研究方向：

  人工智能、机器视觉、机器感知、智能机器人、人机交互、无人系统等

  。

  承担包括863重点、国家自然科学基金重大研究计划项目、重点项目，面上项目、十三五预研重点项目、JKW163重点项目、JKW重大专项、江苏省重点研发计划重点项目等国家、省部级项目等40+项。在IEEE汇刊TIE、TII、
  TFS、TM 、TCDS、TIM、TASE等国内外权威期刊和会议发表SCI、EI收录的论文100余篇，3篇Book Chapter，3部著作（分别受国家出版基金、国家学术著作出版基金与国防工业出版社出版基金资助），授权国家发明专利27项，软件著作权9个。获国际科学贡献奖、全球人工智能与机器人杰出科学家奖、中国发明协会创新奖一等奖、中国自动化学会科技进步一等奖、中国发明协会成果奖一等奖、中国产学研合作创新奖（个人），日内瓦国际发明金、银奖、江苏省科学技术奖二等奖、省教学成果奖一等奖、人工智能学会最佳青年科技成果奖、十二五航空基金优秀成果奖等，并指导学生获得2019年首届贝式杯目标检测与识别挑战赛特等奖、2021年麒麟杯第二届东南大学全球校友创新创业大赛优胜奖、第二届发现东大独角兽智能制造大赛潜力之星称号等。'
