bio_raw: 徐宁，东南大学计算机科学与工程学院副教授、博导，国家高层次青年人才，国家EDA技术创新中心 PI，东南大学新一代人工智能技术与交叉应用教育部重点实验室主任助理，东南大学“紫金青年学者”。长期从事人工智能领域的研究，在
  ICML、NeurIPS、ICLR、IEEE TPAMI 等人工智能领域国际顶级会议和期刊上发表论文 60 余篇，带领团队研发了芯片设计领域大模型 ChipExpert。曾获吴文俊人工智能自然科学奖一等奖、CCF
  优秀博士学位论文奖，担任德国学术交流中心 AInet Fellow，机器学习三大会 ICML、NeurIPS、ICLR 领域主席、中国图象图形学学会（CSIG）国际合作与交流工委会秘书长、中国计算机学会（CCF）人工智能与模式识别专委会执行委员，指导学生获得基金委青年学生基础研究项目、中国科协青年人才托举工程博士生专项等，
institutes:
- 计算机科学系
