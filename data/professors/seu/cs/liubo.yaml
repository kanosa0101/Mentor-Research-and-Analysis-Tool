bio_raw: 研究兴趣包括算力网络路由与安全、网络大数据智能处理与用户行为分析、基于大模型的Agent拟人化研究，社交网络舆情感知与分析、用户画像与推荐、自然语言处理与智能问答、网络行为分析与安全防御。主持和参与科研项目31项（主持9项，参与21项），其中主持国家自然科学基金项目4项、横向项目5项，参与完成国家自然科学基金项目6项、省部级项目7项，作为技术骨干参与国家重点研发计划项目3项。申请和授权国家发明专利20项，
