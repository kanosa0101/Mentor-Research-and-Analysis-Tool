bio_raw: 在“江苏省网络与信息安全重点实验室”从事教学科研工作。主持多项国家级、省部级科研项目，累计在 CCF 推荐 A 类 ToN、TMC、TSC、EuroSys、INFOCOM、ICNP、DAC
  等国际会议和期刊上发表论文 30 余篇，申请并授权国家发明专利多项。从博士期间起，参加诺贝尔奖得主丁肇中教授领衔的 AMS02 实验，研发了面向 AMS 科学大数据应用的云计算资源管理系统。曾担任
  ACM 南京学生分会首届主席，全国高校云计算应用创新大赛组委会秘书，获得教育部科技发展中心颁发的“最佳组织奖”。现担任江苏省计算机学会云计算专委会、网络通信专委会委员，ACM
  SIGCOMM 2024 AE、IEEE MSN 2020、IEEE CSCWD 2018–2021、IEEE ToN、IEEE TSC 等多个国际会议、期刊的程序委员会成员或审稿人。
