bio_raw: 金嘉晖，博士，东南大学计算机科学与工程学院副院长，副教授，博士生导师。2015年毕业于东南大学计算机应用技术专业（导师：罗军舟），2016年4月加入东南大学，2019年晋升副教授。在读博期间（2012年8月-2014年8月），受国家留学基金委资助，在美国马萨诸塞大学阿默斯特分校MNIL实验室(Multimedia
  Networking & Internet Lab)从事分布式计算与大数据处理方向研究。目前主持国家自然科学基金面上项目、国家自然科学青年基金、江苏省自然科学基金，参与多项国家重点研发计划、国家自然基金重点项目、国家自然基金面上项目。长期参加诺贝尔奖得主丁肇中教授领衔的AMS02实验，参与研发了面向AMS科学大数据的分布式计算平台。相关成果发表在SIGMOD、KDD、TKDE等期刊会议。获得2014并行与分布式系统国际会议（ICPADS
  14）最佳论文候选奖、2016年ACM中国南京分会优秀博士论文奖；指导学生获挑战杯专项赛特等奖和一等奖、ACM MM 2025杰出论文奖、BESC 2025最佳学生论文奖、CSCWD
  2022最佳论文奖等。作为主要参与人员，获2022年国家级教学成果奖二等奖。（
