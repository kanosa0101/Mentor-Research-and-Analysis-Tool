bio_raw: 《计算机工程与设计》编委。在WSDM、NeurIPS、ACL、IJCAI、AAAI、ISWC、TOIS、TKDE、KBS、ESWA、EMNLP、IPM、中文信息学报等重要国内外重要期刊和会议发表论文60余篇，申请发明专利10余项，获授权发明专利7项。作为研究生导师，指导/协助指导博士/硕士研究生10余名，其中5人获得国家奖学金，1人获得博士新生奖学金，2人获得全国研究生数学建模比赛二等奖，2人获得全国研究生数学建模比赛三等奖。同时，担任本科人工智能专业主干课《自然语言处理》的主讲教师，以理论教学与实践操作相结合的方式开展综合性教学。
