bio_raw: 博士生导师、硕士生导师，2008年和2015年在南京大学计算机科学与技术系获得学士和博士学位，2015年在南京大学软件工程博士后流动站任博士后研究员，2017年在苏宁金融研究院任区块链首席研究员，2019年加入东南大学计算机科学与工程学院。主要从事计算机图形学、计算机视觉、区块链等方面的研究，主持国家自然科学基金青年基金、江苏省博士后科研资助计划、计算机软件新技术国家重点实验室开放课题等，并作为骨干参与国家高科技发展(863)计划项目、国家自然科学基金面上项目、江苏省科技支撑(工业)计划项目、江苏省产学研合创新资金前瞻性联合研究项目等多个科研项目。在重要国际学术期刊和会议发表论文近30篇，完成学术译著1部、申请发明专利19项并获授权，并获国家教育部科技进步奖二等奖。曾主导苏宁区块链黑名单共享平台系统、区块链-物联网动产质押系统等项目的研发，取得了显著成效，项目成果获中国银监会2018年度银行业信息科技风险管理课题研究三类成果奖。现任江苏省信息技术应用学会理事会副秘书长，江苏省信息技术应用学会多媒体技术专委会委员，江苏省计算机学会区块链专业委员会委员，南京市区块链应用协会副会长。
