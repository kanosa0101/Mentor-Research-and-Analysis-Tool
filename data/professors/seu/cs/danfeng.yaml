bio_raw: 单冯，副教授，博士生导师，东南大学“至善青年学者”，ACM省级分会新星奖获得者，江苏省优秀博士论文奖获得者。2016年于东南大学计算机应用技术专业获博士学位，导师罗军舟教授，随后加入东南大学计算机科学与工程学院。曾受国家留学基金委资助，在美国密苏里大学从事计算机网络与算法优化研究。作为项目负责人主持国家自然科学项目3项、航空科学基金1项，江苏省自然科学基金面上项目1项，作为主要成员参与多项国家重点研发计划、国家自然基金重点项目。在ToN、JSAC、TMC和INFOCOM等重要学术期刊和会议上发表学术论文40余篇，其中19篇发表于中国计算机学会CCF推荐A类期刊和会议上，另有12篇发表在SCI一区（JCR
  Q1）期刊上，共6篇发表期刊的影响因子IF>10。受邀担任JSAC、TOC、TWC、COMNET等国际著名期刊的审稿人。目前担任江苏省计算机学会云计算专委会秘书长，东南大学计算机拔尖学生培养基地书院负责人。曾获得东南大学优秀班主任标兵、东南大学优秀本科生导师、东南大学教育基金“思特奇未来之星”等荣誉称号。
