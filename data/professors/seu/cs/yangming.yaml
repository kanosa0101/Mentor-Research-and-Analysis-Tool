bio_raw: 东南大学计算机学院教授、博士生导师，中央某部委国家高层次人才，现任江苏省网络与信息安全重点实验室主任，中国通信学会通信安全技术委员会委员、中国指挥与控制学会安全应急共享知识专业委员会委员、江苏省计算机学会常务理事及网络空间治理专委会副主任，研究领域为计算机网络和网络安全。
