bio_raw: 肖国辉，正高级职称，东南大学博士生导师，国家级青年人才计划入选者。博士毕业于奥地利维也纳技术大学 (Vienna University of Technology)
  计算机学院，本、硕毕业于北京大学数学科学学院。曾任意大利博尔扎诺自由大学 (Free University of Bozen-Bolzano) 助理教授、挪威卑尔根大学
  (University of Bergen) 长聘副教授、挪威奥斯陆大学 (Univeristy of Oslo) 研究员。主要研究领域为知识工程、知识图谱、逻辑推理、自然语言处理、大语言模型技术。研究涉及基础理论、系统开发和实际用例。曾入选Aminer
  2023、2024年度AI2000全球最具影响力人工智能学者。主持开发了开源虚拟知识图谱系统Ontop，在学术界和工业界有广泛影响。共发表文章120余篇，包括期刊JAIR、SWJ、JWS、AAAI、JBR、JBI，会议IJCAI、AAAI、KR、ISWC、ICDT等。据2024年Google
  Scholar统计，引用数4000+，H-index为29。
