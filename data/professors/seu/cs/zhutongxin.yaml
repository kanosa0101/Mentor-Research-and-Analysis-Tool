bio_raw: ）。自2021年8月起在东南大学计算机科学与工程学院任教，目前在“江苏省网络与信息安全重点实验室”从事教学科研工作，主要研究方向为物联网、边缘计算、调度优化等。作为项目负责人主持国家自然科学基金面上项目和青年项目、江苏省自然科学基金青年项目。在IEEE
  INFOCOM、IEEE TMC等国际顶级会议和期刊发表论文二十余篇，担任多个国际知名会议和期刊的审稿人、并担任多个国际知名会议的TPC Member。曾获江苏省“双创博士
