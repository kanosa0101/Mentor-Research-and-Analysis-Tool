bio_raw: 月进入东南大学计算机科学与工程学院工作。曾获上海市优秀博士学位论文奖，长期从事网络科学与人工智能交叉研究，主要研究兴趣包括复杂网络信息挖掘、图机器学习、人工智能应用。先后主持国家自然科学基金、江苏省自然科学基金及教育部博士点基金项目，参与包括多项国家自然科学基金、国家重点研发计划在内的纵向科研基金项目。
