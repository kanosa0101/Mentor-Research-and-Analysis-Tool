bio_raw: 2011年3月毕业于东南大学计算机科学与工程学院，获工学博士学位，师从罗军舟教授。博士毕业后留校任教，在江苏省“网络与信息安全”重点实验室从事教学科研工作，主要研究方向为云计算与边缘计算。作为项目负责人主持科技创新2030重大专项课题、国家重点研发计划项目子课题、国家自然科学基金等多项国家级项目，并承担南钢集团、中国移动、江苏电网、顺丰科技、中车集团等多家行业知名企业的校企合作研究项目。相关成果获得国家级教学成果二等奖以及冶金科学技术特等奖。参加了丁肇中教授领导的
