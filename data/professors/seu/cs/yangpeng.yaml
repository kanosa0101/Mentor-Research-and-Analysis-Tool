bio_raw: 2006年博士毕业于东南大学计算机科学与工程学院，并留校任教；2007年2月至2009年1月，赴欧洲核子研究中心（CERN）参加诺奖得主丁肇中教授领导的大型国际合作AMS项目。现任东南大学未来网络研究中心主任（中心由李幼平院士创建）。主持国家自然科学基金项目、科技创新特区项目、江苏省未来网络前瞻性研究计划课题等多项，作为核心骨干成员参与多项国家自然科学基金项目、国家863研究计划课题、中国工程院咨询研究项目等国家、部省级研究项目
