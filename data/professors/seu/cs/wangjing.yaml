bio_raw: 王靖，东南大学计算机科学与工程学院助理研究员，研究方向包括机器学习、大模型、学习基因等，研究成果发表于国际期刊IEEE TPAMI、IEEE TNNLS、IEEE
  TCSVT，以及国际会议ICML、AAAI、IJCAI上。获得江苏省优秀博士学位论文奖、吴文俊优秀博士学位论文（提名）奖，主持国家自然科学基金、江苏省自然科学基金以及横向项目多项。
