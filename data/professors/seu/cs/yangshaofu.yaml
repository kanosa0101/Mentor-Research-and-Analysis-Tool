bio_raw: 杨绍富，教授，博士生导师。于 2016 年在香港中文大学机械与自动化工程系获博士学位。主要从事多智能体强化学习、分布式优化与博弈等基础理论及其应用研究。研究工作发表于
  Automatica、IEEE 汇刊系列（TPAMI、TAC、TIFS、TSP 等）、Science China 系列等国内外权威学术期刊上。主持国家自然科学基金青年项目、面上项目、装备预研教育部联合基金项目等。曾获中国仿真学会自然科学奖一等奖，入选中国科协青年人才托举工程、斯坦福全球前2%顶尖科学家、江苏省
  333 高层次人才培养工程（第三层次）、中组部第九批援藏干部等。
