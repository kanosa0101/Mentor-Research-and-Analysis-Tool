bio_raw: 他长期服务于数据挖掘与人工智能领域多个学术团队，受邀担任多个重要国际期刊编委，现任国产知名期刊群《The Innovation Informatics》学术编委，以及《The
  Innovation Reviews》和《The Innovation Insights》编委。担任中国计算机学会推荐A类国际会议的领域主席或程序委员会成员30余次，并多次担任《IEEE
  Transactions on Pattern Analysis and Machine Intelligence》《IEEE Transactions on
  Knowledge and Data Engineering》等国际期刊审稿人。
