bio_raw: 近年来，他围绕大模型智能体系统和科学垂域智能体系统展开理论技术攻关和示范应用研发，逐步形成从可执行工具供给、稳定任务规划、工作流与技能演化到角色智能体平台的完整研究路线。在人工智能领域，他累计发表ICLR、ICML、NeurIPS、KDD等CCF-A/B类论文40余篇，其中以第一作者或通讯作者身份发表CCF-A类论文25篇；在交叉学科领域，发表The
  Innovation、Nature Reviews Electrical Engineering等顶刊系列论文。
