bio_raw: 2008年3月获东南大学计算机应用技术专业博士学位，2009年10月－2010年11月受国家留学基金委资助， 赴美国University of Delaware信息与计算机系访问研究。东南大学SATAS（Software
  Analysis, Testing, Analytics, and Security）实验室负责人。主持或参加多项国家自然基金、国家重点研发计划项目以及与华为、奇虎360、江苏省电力设计院等大型企业的合作项目，获教育部提名国家自然科学奖二等奖。以第一作者在国内外期刊会议上发表多篇SCI、EI以及ISTP收录的论文，多个国内外著名学术期刊审稿人。中国计算机学会(CCF)软件专委会专委，江苏省计算机学会计算机软件专委会副主任。
