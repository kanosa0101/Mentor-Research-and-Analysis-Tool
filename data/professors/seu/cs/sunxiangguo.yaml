bio_raw: 孙相国，教授，博士生导师。加入东南大学以前，他曾在香港中文大学担任博后研究员，于东南大学获得博士学位，期间先后在微软亚洲研究院、杭州之江实验室、澳大利亚昆士兰大学等单位进行联合博士培养。他的研究方向聚焦于数据挖掘、在线社交网络与社会计算，并致力于探索面向社会网络的下一代通用人工智能。在SIGKDD,
  VLDB, TKDE, NeurIPS, ICML, ICLR, TheWebConf, EMNLP, WSDM, CIKM, TOIS, TNNLS, RecSys,
  IJCAI等国际顶尖会议期刊发表高水平论文40余篇。现担任中国人工智能学会-社会计算专委会副秘书长，以及多个知名期刊的青年副主编。
