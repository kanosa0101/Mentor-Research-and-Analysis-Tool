bio_raw: 多年从事航空领域军工项目研究，承担航空基金、国家自然科学基金和军工项目多项，早期研究内容包括复合材料结构分析、鸟撞以及飞机结构隐身性能仿真、虚拟仪器和雷达自动测试系统等工作，目前，主要从事专利挖掘和社会网络相关应用研究。
