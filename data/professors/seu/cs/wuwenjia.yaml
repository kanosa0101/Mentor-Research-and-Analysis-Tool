bio_raw: 吴文甲，博士，东南大学计算机科学与工程学院副教授、博士生导师。2006年本科毕业于东南大学计算机科学与技术专业，2013年获得东南大学计算机应用技术专业工学博士学位。主持完成2项国家自然科学基金项目。作为骨干人员参与多项国家重点研发计划项目和国家自然科学基金重点项目。在IEEE
  TMC、IEEE TVT、ACM TOSN、INFOCOM、计算机学报等国内外期刊会议上发表论文40余篇。授权国家发明专利10余项。承担数据结构、计算机网络及应用、移动互联网导论、专业阅读与写作等本科生课程。
