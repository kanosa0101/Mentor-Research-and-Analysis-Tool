bio_raw: 张竞慧，男，博士，东南大学计算机科学与工程学院教授、博士生导师，东南大学高分数据研究中心主任，江苏高分遥感产业联盟执行秘书长，IEEE CSCWD
  会议国际指导委员会秘书，中国计算机学会物联网专业委员会委员，江苏省计算机学会云计算、高性能计算专委会委员。曾赴瑞士欧洲核子中心 (CERN) 参加诺贝尔奖获得者丁肇中教授领导的
  AMS-02 实验，并参与建成东南大学AMS科学大数据处理中心。目前在江苏省网络与信息安全重点实验室从事教学科研工作，研究方向涉及分布式机器学习、边缘智能、边缘计算、云计算等方面。累计在
  IEEE TMC、IEEE TSC、ACM TOSN、IEEE TNSE、ACM TIST、WWW、KDD、AAAI、MM等CCF A/B和ACM/IEEE Trans国际期刊和会议发表论文
  30 多篇。作为项目负责人主持国家自然科学基金项目 3 项，主持国家科技创新2030—“新一代人工智能”重大项目/国家重点研发计划项目子课题 2 项、主持CCF-百度松果基金项目1项。获得
  2018 年度江苏省科协青年人才托举工程支持，并担任 IEEE TSC、Cluster Computing、CCPE 等多个期刊的客座编辑及特邀审稿人。申请国家发明专利10项，已授权7项。
