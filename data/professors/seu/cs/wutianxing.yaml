bio_raw: 吴天星，副教授、博导，获评江苏省“双创博士”、江苏省“科技副总”、南京市择优留学人才。两次入选东南大学“至善青年学者”支持计划（2021、2025）。主要研究方向：知识图谱、大语言模型、知识表示与推理、人工智能应用。曾获江苏省计算机学会优秀博士学位论文奖，SIGIR最佳短文提名，WISA最佳学生论文奖，CCKS最佳论文奖，OpenKG优秀开放资源奖。主持国家自然科学基金面上项目、青年项目，江苏省产学研合作项目等纵横向课题多项。在人工智能领域内国际期刊及会议发表论文80余篇，10余项国家发明专利获得授权。担任中国计算机学会信息系统专委会、自然语言处理专委会执行委员，CCF
  YOCSEF南京24-25年度主席，CCF南京执行委员，
