bio_raw: IEEE TVT、IEEE IoT-J等顶级会议和期刊上，发表一作/通信论文12篇，由国际知名出版社斯普林格出版学术专著2部，谷歌学术累计引用1160余次，以一作身份获得网络安全四大顶会Usenix
  Security 2024最佳论文奖和ACM CCS 2021最佳论文二等奖。博士后期间获得了软件工程顶会FSE的杰出论文奖，入选了2023年人力资源社会保障部“博士后创新人才支持计划”。
