bio_raw: 闫亚萍，副教授，硕士生导师，于2020年获北海道大学工学博士学位。主要从事计算机视觉方向的算法研究及其在图像异常检测、视觉质量评估、特征匹配等领域的应用。主持及参与多项国家自然科学基金和江苏省自然科学基金项目，入选江苏省“双创博士”，在国际著名学术期刊和会议上发表论文二十余篇，担任多个CCF-A类会议及期刊审稿人。
