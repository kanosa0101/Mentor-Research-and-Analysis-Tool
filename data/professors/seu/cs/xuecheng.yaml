bio_raw: 薛澄，副教授，硕导。2017年获得香港理工大学博士学位，期间在美国杜克大学进行学术访问。2019-2023年在香港中文大学和香港理工大学担任博士后、研究助理教授。近期研究方向为：医学影像智能分析，手术机器人，多模态大模型，具身智能等。在医学影像分析领域顶刊和顶会
