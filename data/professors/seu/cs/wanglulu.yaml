bio_raw: '先后主持和参与多项自然基金课题、国家重点研发计划、军内研究课题和任务。在《Information and Software Technology》、《Journal
  of Systems and Software》、《Science China: Information science》、《软件学报》、《计算机学报》等国内外著名期刊和会议发表学术论文20余篇，参与编著软件工程教材《软件架构：理论与实践》，参与译著《软件架构建模和仿真：Palladio方法》、《软件架构：Python语言实现》。'
