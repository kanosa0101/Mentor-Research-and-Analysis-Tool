bio_raw: 主要在计算机网络、分布式系统领域开展创新性与实用性相结合的研究工作，提出了多项新思路与新方法，相关成果已在包括EuroSys、VLDB、SIGCOMM等国际顶级会议和期刊上发表论文二十余篇。博士毕业后进入清华大学与深信服联合培养的博士后计划，负责创新业务孵化及应用，曾先后担任深信服创新研究院技术专家、中国科学院计算机网络信息中心天基网络项目副主任设计师。
