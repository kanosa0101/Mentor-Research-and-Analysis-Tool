bio_raw: 汪鹏，东南大学计算机科学与工程学院/人工智能学院教授，博士生导师。主要研究方向为大模型、知识图谱、自然语言处理等。已在国内外重要学术期刊(TKDE、TOIS、SCIS等)和会议(IJCAI、AAAI、NeurIPS、SIGIR、ACL、EMNLP、COLING、ISWC、CIKM等)上发表学术论文160余篇。担任IJCAI、AAAI、NeurIPS、ICML、ICLR、ACL、ACM
  MM等重要国际会议的程序委员和审稿人百余次，同时也是TKDE、TPAMI、中国科学、计算机学报等数十个国内外重要期刊审稿人。研究工作获得国家自然科学基金、国家重点研发计划等资助，并在多个重大场景得到落地应用。
