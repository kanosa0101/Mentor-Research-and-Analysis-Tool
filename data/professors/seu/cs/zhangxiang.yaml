bio_raw: 本人于2001毕业于南京航空航天大学计算机科学与技术系 并取得学士学位。2002年，作为硕士研究生进入东南大学计算机科学与工程学院，跟随瞿裕忠教授开展语义网的研究。本人于2001毕业于南京航空航天大学计算机科学与技术系
  并取得学士学位。2002年，作为硕士研究生进入东南大学计算机科学与工程学院，跟随瞿裕忠教授开展语义网的研究。2009年毕业后，留校进入东南大学软件学院工作至今。
  软件学院与计算机科学与工程学院于2010年合并。
