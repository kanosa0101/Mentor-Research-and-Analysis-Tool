bio_raw: 刘翔，博士。2016年在大连理工大学获得网络工程专业学士学位，在2023年获得东南大学计算机科学与技术专业博士学位。目前是东南大学和香港中文大学博士后。研究兴趣主要包括博弈论、拍卖机制设计、多智能体系统、强化学习等。在相关领域的国际顶级会议与期刊上（包括AIJ、JSAC、TMC、AAAI、IJCAI等）发表论文10余篇，并且担任AAAI、IJCAI等多个国际会议的PC
