bio_raw: 王爽，东南大学副教授，硕士生导师（欢迎感兴趣的保研、考研的同学联系，shuangwang@seu.edu.cn).2025年至今，副教授，2022年1月-2024年12月，东南大学讲师。
  2015年6月毕业于南京农业大学理学院，获理学学士学位；2020年毕业于东南大学计算机科学与工程学院，获工学博士学位。2021年11月至2022年11月，在麦考瑞大学做博士后研究。在IEEE
  Transactions on Computers、IEEE Transactions on Parallel and Distributed Systems、计算机学报等高水平国际国内期刊和ICSOC、CSCWD、IJCNN等高水平国际会议上发表论文，主持国家自然科学青年基金、江苏省自然科学基金项目，参与国家重点研发计划（青年科学家项目）等。
