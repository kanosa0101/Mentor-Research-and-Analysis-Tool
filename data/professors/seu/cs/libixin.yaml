bio_raw: 1969年8月出生，2001获得南京大学博士学位，2001-2003分别在芬兰、挪威和荷兰等地进行博士后研究工作。 2004年2月至今东南大学计算机科学与工程学院二级教授、博士生导师，东南大学软件工程研究所所长。2006年入选教育部新世纪人才培养计划、2011年度中创软件人才奖获得者、2次获得教育部科学技术奖（自然科学奖）二等奖。入选江苏省“青蓝工程”、“333工程”、“六大人才高峰”等人才计划。研究方向为智能软件开发与运维、软件缺陷检测与质量提升、软件安全与可信保障。从1999年开始，先后主持国家级、省部级项目以及大型企业合作项目40多项,
  在《China Science：Information Science》、《ACM Transactions on Software Engineering and
  Methodology》、
