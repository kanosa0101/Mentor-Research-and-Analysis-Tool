bio_raw: 2020年博士毕业于南京大学计算机科学与技术系，2018年8月至2019年8月在CSC的资助下到澳大利亚沃隆港大学进行学术交流访问。目前在所研究领域的权威期刊和顶级会议上发表论文60+篇，并主持多项国家/省部级项目。入选国家资助博士后研究人员计划、江苏省卓越博士后、东南大学紫金学者等人才支持计划；曾获CCF产学合作基金优秀项目案例
