bio_raw: 毕业于东北大学，获计算机软件与理论博士。香港科技大学、香港中文大学博士后，普渡大学高级访问学者。主持完成多项国家自然科学基金项目、江苏省自然科学基金项目，主持攻关完成多项企业生产难题。累计培养研究生120余名，其中留学生8名。发表研究论文50余篇，授权国家发明专利6项。
