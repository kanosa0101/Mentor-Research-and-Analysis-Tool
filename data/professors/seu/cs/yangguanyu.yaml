bio_raw: 东南大学计算机科学与工程学院、软件学院、人工智能学院副院长、教授、博士生导师，IEEE高级会员。中国图象图形学会医学影像专业委员会委员。东南大学生物医学工程专业博士（2008）、法国雷恩一大信号与图像处理专业博士（2009）、荷兰莱顿大学医学中心（LUMC，Leiden
  University）图像处理实验室博士后。长期从事医学人工智能、图像处理与分析、计算机辅助诊断与手术方面的研究。承担及参与国家重点研发计划、国家科技重大专项、国家自然科学基金、江苏省自然科学基金等项目十余项。发表包括
