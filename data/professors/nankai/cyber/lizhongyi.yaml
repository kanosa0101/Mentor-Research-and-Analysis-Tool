bio_raw: '李重仪，南开大学教授、博士生导师，国家优秀青年科学基金（海外）、天津市杰出青年基金获得者，天津市视觉计算与智能感知重点实验室副主任，天津市青年科技工作者协会副主任委员，现领导PI
  Lab: 摄影与成像实验室。主要研究方向为人工智能、计算机视觉与机器学习，聚焦计算成像、图像增强与复原、图像生成与编辑、多模态大语言模型等，已在TPAMI、TIP、NeurIPS、ICML、CVPR、ICCV等国际顶级期刊与会议发表论文150余篇，谷歌学术引用超30000次，其中第一作者单篇最高引用超过3000次，成果包括30篇ESI高被引论文与10篇ESI热点论文、9篇论文入选Oral/Highlight/Spotlight、多篇论文入选TPAMI/TIP
  Popular Documents、曾获IEEE信号处理学会（SPS）最佳论文奖、Engineering Applications of Artificial
  Intelligence最佳论文奖、MLMC最佳论文奖、Pattern Recognition最佳论文提名奖、世界人工智能大会青年优秀论文提名奖、《信号处理》优秀论文奖，授权国内外发明专利17项。研究成果已在华为国产AI平台、联发科天玑9300旗舰芯片、全球最大潜水社区PADI在线水下色彩还原系统、OPPO手机、腾讯生成大模型、商汤生成大模型、Stable
  Diffusion WebUI、新加坡Nanoveu、香港Perfection Aligner System等20余家国内外公司落地应用，并3次获得省部级科技论文一等奖、获得中国图象图形学学会自然科学奖二等奖、中国汽车工程协会科技进步二等奖、3次获得中国人工智能学会昇思MindSpore学术基金（其中两次获评优秀项目）、获得华为产学研优秀合作项目奖、科普作品入选中国科协“科普中国”2026年中国优质科普资源。研究成果被中国日报、中国青年报、科技日报、中国新闻网、中国科技网、中国高新网、中国科学技术协会、天津市人民政府新闻办公室、中宏网、科学网、今晚报、津云新闻等媒体报道。他连续6年(2021-2026)入选斯坦福全球前2%顶尖科学家榜（包括年度及终身影响力榜单），连续两年（2024-2025）入选科睿唯安全球高被引科学家、连续3年（2023-2025）入选爱思唯尔中国高被引学者、入选2025年ScholarGPS全球前0.05%顶尖学者榜单，入选2026年度Research.com全球顶尖科学家排名。曾受中共中央委员会主办的《光明日报》邀请，撰写人工智能专题文章。作为技术嘉宾，参与央视总台“科晚”栏目，围绕“AI能否代写论文”等热点问题，分享技术视角下的观察与思考。2026年受新华社邀请，参与“论文AI生成率检测存在的问题和学术、社会影响”重大主题采访，作为计算机领域专家提供技术分析与政策建议，相关观点被纳入调研报道，为有关部门建言献策提供重要参考。

