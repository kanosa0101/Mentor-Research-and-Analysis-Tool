bio_raw: '张玉，博士，南开大学网络空间安全学院副教授，国家实验室双聘人员，数据与网络安全联合研发中心副主任，浙江湖州人。2004年毕业于哈尔滨工业大学计算机科学与技术专业，获工学学士学位；2010年毕业于哈尔滨工业大学计算机系统结构专业，获工学博士学位（硕博连读）；博士毕业后进入南开大学工作。在学期间作为科研骨干参与多项国家级研究课题，包括国家863
  重点项目等。参加工作以后，作为课题负责人承担了国家重点研发计划、国家自然科学基金、教育部博士点基金以及多个横向项目等。作为国家实验室双聘工作人员，本课题组成员在学期间将有机会从事面向国家重大战略需求的研究工作，解决国家层面的“卡脖子”难题，接触到一流的学术研究资源，欢迎大家报考！

  目前部分科研方向：网络安全，AI安全，AI在农业育种中应用研究。

  1. 加密网络流量分类研究

  主要研究采用深度学习方法分析加密流量中承载的具体内容，包括加密流量采用什么协议传输的，加密流量中内容又是什么等。从事这个方向的同学将会学习并掌握如下内容：（1）传统机器学习中的分类方法；（2）深度学习中的分类方法；（3）当前主流的网络流量分类技术。达到的培养目标：通过分析加密流量能够知晓承载加密流量的协议、应用、app，以及特定协议的流量的具体内容，如分析加密视频流量，能够知晓对方正在看哪个视频。

  2. AI安全研究

  目前主要关注对抗样本攻击和检测，模型后门攻击和检测。从事这个方向的同学将会学习并掌握如下内容：（1）深度学习当前主要应用于机器视觉、自然语言处理及语音识别领域，因此从事AI安全研究，首先要从上述三个方向选择一个作为AI安全研究的落脚点；（2）需要学习对抗攻击和后门攻击的原理和常见方法；（3）在上述三大领域中选择一个具体的问题，如视觉领域的分类问题、目标检测问题、回归问题，针对该问题研究相应的对抗攻击技术和模型后门攻击技术；（4）针对上述攻击方法提出自己的的防御策略。
  达到的培养目标：能够对常见的基于深度学习的应用（视觉、自然语言处理、语音识别）提出攻击思路，并给出攻击原型系统。

  3. AI在农业育种中应用研究。

  主要研究如何利用机器视觉技术协助育种专家培育农作物新品种，目前主要关注水稻。从事这个交叉方向的同学将会学习并掌握如下内容：（1）需要掌握植物表型测量的有关知识，以及农作物育种的基本流程；（2）掌握机器视觉中常见任务的原理和当前已经达到的baseline性能指标，例如若要从事基于视觉的水稻产量预测研究工作，则需要掌握目前基于视觉的人群密度检测模型，并能够将这些模型移植到水稻稻穗计数任务中，以及提出针对性的改进思路。达到的培养目标：了解农作物品种培育的流程以及存在的常见的难题，掌握机器视觉中常见任务的主流深度学习模型（如目标检测、人群计数等），并能够将其灵活应用到农作物品种培育中，协助育种家解决育种过程中存在的难题，成为跨深度学习和农业两大领域的复合型人才。

  向浙江老乡推荐天津南开大学，欢迎全国各地学子报考南开！'
