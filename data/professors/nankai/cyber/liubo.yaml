bio_raw: '2026年加入南开大学软件安全

  实验室 (

  NKSSecLab

  )

  ，主要从事

  智能软件工程

  、

  软件安全

  、

  软件重构

  等研究。相关研究成果发表于ESEC/FSE，ASE，TSE等软件工程领域CCF-A类国际会议和期刊，详细信息请参考英文主页:

  http://lyoubo.github.io/

  目前课题组长期招收博士研究生和硕士研究生，欢迎对AI4SE、软件安全、程序分析、软件重构等研究方向感兴趣的同学加入，并常年招收本科实习生。希望在本科阶段提前从事科研工作、发表高质量学术论文的同学请与我联系，表现优异者可优先留在课题组或推荐至外校继续深造，个人简历发送到liubo26@nankai.edu.cn'
