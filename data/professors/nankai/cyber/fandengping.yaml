bio_raw: '范登平，1988年生，南开大学教授、博导，计算机科学与技术系主任、天津市视觉计算与智能感知重点实验室副主任、南开大学百名青年学科带头人，入选国家级“四青”人才。2019年从南开大学毕业并获得CCF优秀博士学位论文奖。毕业后曾任瑞士苏黎世联邦理工学院博士后，阿联酋起源人工智能研究院研究主管，研究方向为计算机视觉、多模态学习和医学图像分析。

  在伪装场景理解方向上有突出成果，如：1. 基于组-背景挖掘的搜索识别模型

  SINet-V2

  ，因系统地提出“

  伪装目标检测

  ” 任务(

  Demo

  )并取得高性能而被中国人工智能学会评定该技术取得国际领先水平，

  被

  天津新闻广播《我们爱科学》节目播报

  ，受邀在

  中央党报《学习时报》-科技前沿板块发表文章

  ，

  被英国权威杂志《New Scientist》报道。 2. 并行反向注意力网络

  PraNet

  可从结肠镜图像中精准地分割息肉，从而在MediaEval2020竞赛上取得精度指标冠军，被

  斯坦福2022年人工智能指数报告引用

  , 并被集成到华为算法库中(

  Ascend ModelZoo

  ,

  link

  )。

  公开16项

  中

  /美发明专利， 技术被用于三星、华为、阿里 (

  Kaleido-BERT

  被用于阿里电商搜索系统) 、日本LPIXEL公司。 发表高质量论文约20篇（含10篇TPAMI）：2篇

  CVPR最佳论文提名

  （入选率为0.8%和0.4%）、1篇NeurIPS研讨会

  最佳论文、

  获首届计图开发者大会

  杰出论文奖

  以及

  最具影响力（应用）论文奖

  、

  1篇

  世界人工智能大会青年优秀论文

  、

  Top-1 Most Cited Paper

  in MICCAI2020、

  Top-1 Most Cited Paper

  in IEEE TMI2020、

  13篇高被引论文（含

  5篇热点论文

  ），

  谷歌学术引用3.7万次，H指数64，8篇论文单篇引用超1000次（最高6000余次）。 是IEEE高级会员、CSIG杰出会员，担任IEEE TPAMI (SCI
  1区)/MIR编委、CVPR''23-26/MICCAI''24-25/NeurIPS''24-25/ICML‘26领域主席，主编1本中文学术专著， 获得CCF优秀博士学位论文奖、吴文俊优秀青年奖、吴文俊人工智能科学技术奖自然科学二等奖(排四)，2021-2024连续四年入选斯坦福全球前2%顶尖科学家榜单、

  入选2024年斯坦福全球前2%“终身科学影响力榜单”

  。代表作见主页：

  https://dengpingfan.github.io/

  招收计划

  ：

  依托

  南开大学计算机学院招收2027年硕士3名+博士3名

  （注：通常每年8月中下旬招满下一年度入学的研究生，可参加

  新芽计划

  ，

  优秀学生可直通最后一轮考核）

  、

  招收2027年

  深圳河套学院

  博士1名、

  招收2027年

  北京中关村学院

  博士1名

  。培育有理想的学生，具有充足的科研经费支持，根据科研需要鼓励和资助参与国内外学术交流以及赴海外合作课题组（瑞士-ETH Zurich、英国-牛津大学、阿联酋-MBZUAI、美国-哈佛大学、美国-约翰霍普金斯大学等）研修学习。详情咨询：fdp@nankai.edu.cn'
