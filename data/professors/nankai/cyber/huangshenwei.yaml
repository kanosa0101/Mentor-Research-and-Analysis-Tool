bio_raw: '个人简介

  黄申为，博士生导师，研究兴趣为图论及其应用、理论计算机科学。

  博士毕业于加拿大西蒙弗雷泽大学（Simon Fraser University），师从美国工业与应用数学会会士（

  SIAM Fellow

  ）Pavol Hell教授，博士论文荣获2016年度

  加拿大全国优秀博士论文

  ，2018年入选南开大学百名青年学科带头人。博士毕业后分别在澳大利亚新南威尔士大学与加拿大劳里埃大学从事博士后工作。主要从事图论及其应用和理论计算机科学等方面的研究，截止目前在AAAI等国际顶尖会议以及SIAM
  Journal on Discrete Mathematics和Theoretical Computer Science等国际顶尖期刊上共发表论文30余篇，与国外知名大学的学者建立了合作关系。主持国家以及天津市自然科学基金项目，现为中国运筹学会图论组合分会青年理事、天津市工业与应用数学学会理事、CCF理论计算机专委委员。

  招生信息

  本人招收数学和计算机方向的博士和硕士研究生（有图论和离散数学背景优先考虑），鼓励学生去国外深造，欢迎有志于从事科研探索和挑战性工作的同学联系我。

  工作经历

  2018/09-                     南开大学计算机学院

  2017/09-2018/08       加拿大劳里埃大学博士后

  2016/09-2017/08       澳大利亚新南威尔士大学研究助理

  2016/01-2016/08       加拿大西蒙弗雷泽大学博士后

