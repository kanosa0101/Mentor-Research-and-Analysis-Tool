bio_raw: '刘夏雷，现任南开大学教授博导，国家级四青人才，

  入选南开大学“百名青年学科带头人培养计划”，中国科协青年托举计划

  ，在此之前在英国爱丁堡大学从事博士后研究，于2019年获得西班牙巴塞罗那自治大学计算机科学博士学位。 主要研究领域为计算机视觉和模式识别，包括自监督学习、连续学习、小样本学习、长尾分布学习等，并在多种应用中验证（图像识别、检测、分割、人群计数、图像质量评价等）。更多信息详见

  个人主页：https://mmcheng.net/xliu/'
