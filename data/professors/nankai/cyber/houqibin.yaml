bio_raw: '侯淇彬，南开大学计算机学院副教授，国家级四青人才，博士生导师。

  主持

  国家自然科学基金委青年科学基金项目（B类）/面上项目/重大项目子课

  题等，

  入选第七届中国科协青年人才托举计划。

  目前已在IEEE TPAMI, CVPR, ICCV, NeurIPS等

  CCF推荐A类

  国际顶级计算机视觉相关杂志与会议

  发表论文50余篇

  ，

  谷歌学术引用26000余次

  ，详情请参见（https://scholar.google.com/citations?user=fF8OFV8AAAAJ&hl=en）。指导学生获批

  国家自然科学基金委博士生基金，入选中国科协青年科技人才培育工程博士生专项计划

  。

  曾获教育部自然科学奖一等奖、天津市自然科学一等奖、吴文俊人工智能科学技术奖自然科学二等奖项

  。

  更多信息可访问个人主页：

  https://houqb.github.io/。担任CSIG会员发展与服务工委会秘书长、天津市视觉计算与智能感知重点实验室副主任。

  本课题组

  的核心任务就是研究计算机视觉与人工智能，终极目标是让AI模型真正理解视觉世界

  。本课题组与华为、字节、快手、通义、VIVO等国内AI领域企业有校企合作，

  鼓励学生在进行学术研究的同时将学术成果在产业界落地应用

  。具体研究方向包括但不限于：

  空间智能

  视觉感知

  世界模型

  诚邀“实力派”队友加盟！组内项目经费充足，

  欢迎有较强科研经历且成绩优异的同学来本课题组学习与科研

  。本课题组多数硕士同学通过转博攻读博士学位，有读普博打算的同学须要具有较强的科研经历（在CVPR、ICCV、ECCV、NeurIPS等顶级会议发表过论文），如有兴趣可发送邮件附上简历到houqb
  at nankai.edu.cn（可联系在读学生了解组内情况，更多关于组内同学科研情况和已毕业学生就业去向可访问个人主页）。注：发送简历前，请务必认真阅读本课题组研究生招生说明（https://mmcheng.net/recruit/）。

  对于想来实习的本校本科生，由于精力实在有限，一般需要具有较好的学习成绩、编程基础以及自驱能力，主要职责为参与科研与项目。'
