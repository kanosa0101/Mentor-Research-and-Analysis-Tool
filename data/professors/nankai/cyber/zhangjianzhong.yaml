bio_raw: '个人简介

  毕业于南开大学，获学士、硕士、博士学位。目前为南开大学网络空间安全学院教授、博士生导师，物联网工程系主任，计算机学会高级会员。

  主要研究方向包括：网络大数据分析，网络安全，移动计算，软件定义网络等。参加和主持了国家重点研发计划项目、国家自然基金项目、天津市科技支撑计划重点项目、天津市人工智能重大专项项目、天津市自然基金重点项目、博士点基金项目等20余项，近几年国内外高水平期刊和国际会议上发表论文50余篇。担任计算机研究与发展、通信学报等期刊的审稿人。

  在教学方面，多年来一直从事计算机网络的教学工作，目前主要承担本科生的“计算机网络”（双语课程、校级精品课程）、“网络技术与应用”等课程、硕士生和博士生的“软件定义网络”课程。培养硕士研究生30余名、博士研究生6名。出版计算机网络相关教材11部，发表教学论文4篇，2009年获天津市教学成果一等奖，2009年、2017年获南开大学教学成果一等奖，2022年获天津市教学成果特等奖。

  获奖情况：

  天津市级教学成果特等奖：以立德树人为根本，产业实践为导向，能力培养为关键，信息技术为手段的“新工科”一流课程（群）建设与实践，2022年

  天津市级教学成果特等奖：以专业课程建设为核心，构建首个信息安全微专业，服务国家网络空间安全人才培养，2022年

  天津市级教学成果一等奖：理论与实践并重的计算机网络课程教材体系建设，2009年

  南开大学教学成果一等奖：以立德树人为根本，产业实践为导向，能力培养为关键，信息技术为手段的“新工科”一流课程（群）建设与实践，2022年

  南开大学教学成果一等奖：以专业课程建设为核心，构建首个信息安全微专业，服务国家网络空间安全人才培养，2022年

  南开大学教学成果一等奖：计算机与控制虚拟仿真实验教学中心建设，2017年

  南开大学教学获奖一等奖：适应21世纪技术发展要求，建设高质量计算机网络课程教材体系，2009年

  南开大学研究生教学成果一等奖：基于自主案例构建的工程专业学位复合创新型人才培养探索与实践，2022年

  南开大学教学获奖二等奖：融合系统能力培养的物联网工程专业建设，南开大学教学成果二等奖，2022

  南开大学教学成果二等奖：引导学生深度参与的教学模式探索与实践—以计算机网络类课程为例，2020年

  南开大学教学名师，2019年

  南开大学校级教学团队：计算机网络与系统安全教学团队，2022年

  南开大学优秀硕士学位论文指导教师，2016年

