bio_raw: '欢迎本科生加入课题组参与科研实习，进行智能网络与计算系统、3DGS 新型媒体传输与处理、LEO 低轨卫星网络等方向的研究。同时长期招收本科生参加各类(学科)竞赛、大学生创新创业等项目。课题组提供充足的算力资源和工作环境、以及优质的学术交流条件。

  师建新博士

  ，南开大学讲师（教学科研），于南开大学获得计算机科学与技术博士学位，师从徐敬东教授（全国高校计算机专业优秀教师），曾赴加拿大Simon Fraser University进行博士联合培养（2022.11–2024.10），师从刘江川教授（加拿大皇家学会会士、加拿大工程院院士、IEEE
  Fellow，https://www.cs.sfu.ca/~jcliu/）。博士期间长期从事于智能计算与资源管理、新型流媒体传输与处理、LEO 低轨卫星网络等方向的研究，在IEEE/ACM
  系列顶级会议与期刊上发表论文二十余篇。荣获 IEEE IWQoS 2025 最佳会议论文奖、IEEE Satellite 2023 最佳会议论文奖、NOSSADV/MMSys
  2024 Travel Grant 等多项学术荣誉，并长期担任多个国际知名期刊与会议审稿人。

