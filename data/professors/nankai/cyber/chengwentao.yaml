bio_raw: '程文韬，南开大学计算机学院副教授，2020年博士毕业于新加坡南洋理工大学，2020~2022年在阿里巴巴集团从事机器人视觉及激光定位算法研究工作。他的研究兴趣主要为三维计算机视觉，包括视觉SLAM、三维重建以及视觉定位等。他以第一作者身份在
  ICCV, ICRA, TIP 等计算机视觉和机器人领域顶级国际期刊和会议上发表多篇学术论文。更多信息请参考个人主页：

  https://wtchengcv.github.io/'
