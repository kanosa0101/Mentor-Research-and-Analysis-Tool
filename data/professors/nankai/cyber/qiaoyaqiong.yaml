bio_raw: '研究领域包括社交媒体安全、开源情报挖掘、虚假信息检测与溯源、深度伪造检测、大模型安全、知识图谱构建及应用、类脑智能等。在“SIGIR”、“ASE”、“AAAI”、’“WWW”、《通信学报》、“TKDD”等国内外重要期刊和会议上发表30 余篇，其中第一作者或通讯作者论文10余篇，申请专利10余项。现主持国家重点研发计划、国家自然科学基金面上等国家级项目，曾主持和参与国家和省部级科研项目10余项，荣获2023年河南省科学进步奖一等奖1项。曾任职于IBM，有丰富的大数据分析和数据挖掘经验。担任中国电子学会全国电子战大会第一届青年专家委员会委员、中国图像图形学学会数字媒体取证与安全专业委员会委员。

  长期接收本科生（年级、专业不限）提前加入课题组进行学术科研训练

  ，

  欢迎有意向与我邮件联系，

  表现优秀者将获得校内保研或至国内外优秀课题组深造推荐机会。

  现有2027年度入学非全日制博士名额，有意者请邮件联系。'
