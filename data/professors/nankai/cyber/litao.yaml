bio_raw: '南开大学计算机学院、密码与网络空间安全学院教授/博导，

  国家环境保护城市空气颗粒物污染防治重点实验室博士后，明尼苏达大学计算机科学与工程系访问学者

  。

  现任南开大学新一代人工智能发展战略研究院副院长，

  先进计算与关键软件（信创）海河实验室副主任，南开大学智能物联网教学团队负责人，

  计算机系统能力培养改革建设高校（南开大学）负责人，南开大学

  物联网工程专业首届主任，

  天津市教学名师奖后备人选，入选全国高校计算机专业优秀教师奖励计划、网信创新人才，

  天津市优秀科技特派员，天津科普大使，

  天津市中青年科技创新领军人才。

  现为中国计算机学会（CCF）杰出会员、体系结构专委会副主任，CCF南开大学学生分会督导主任，中国电子学会高级会员，中国人工智能学会会员；中国计算机学会通讯《计算》编委；中国科技辅导员协会人工智能普及教育专委会委员，中国医学装备协会眼科专业委员会委员。曾担任南开大学计算机与控制工程学院、软件学院院长助理，科学技术处副处长，党委网信办、大数据管理中心副主任，

  天津市青少年科技教育协会副理事长

  ，

  天津市津南区科协常委，

  CCF理事、

  天津分部副主席，

  YOCSEF天津分论坛主席。

  2014年建立南开大学智能计算系统研究室（

  https://ics.nankai.edu.cn），

  2017年9月发起并推动成立网络空间安全学院，2018年推动成功申报天津市网络与数据安全技术重点实验室。

  研究兴趣主要包括异构计算、智能物联网、区块链系统、人工智能、数字健康等领域，特别是计算机系统与人工智能交叉领域，主讲本科生专业必修课《计算机组成原理》《智能计算系统》《物联网前沿技术》等和研究生《高级计算机系统结构》《计算机控制技术》《神经网络工程》等课程，

  主持20多项国家和省部级基金项目以及校企合作项目，主持和参与获得天津市教学成果特等奖1项、天津市科技进步一等奖2项和二等奖1项、中国产学研合作科技创新二等奖1项，南开大学教学成果奖多项，多次指导大学生参加创新创业和竞赛活动并获得国家和省部级奖项，

  在TC、TPDS、TMC、INFOCOM、NeurIPS、AAAI、ACM Mulitimedia、MICCAI、计算机学报、软件学报、计算机研究与发展等期刊和会议上发表SCI/EI论文100余篇，出版和翻译教材著作10余部，申请专利和软件著作权10余项，专利和软著成果转化2项。

  欢迎优秀同学报考硕士和博士研究生，欢迎硕博士毕业生联系南开大学新一代人工智能发展战略研究院（https://cingai.nankai.edu.cn）和信创海河实验室（

  https://www.hl-it.cn

  ）的博士后和专业技术岗位。'
