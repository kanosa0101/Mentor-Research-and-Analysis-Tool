bio_raw: '张莹，南开大学教授、博导，计算机学院、密码与网络空间安全学院副院长，国家级青年人才、天津杰青、南开百青（A计划）。主要研究方向为跨媒体分析推理、知识图谱与大模型、人工智能等。在自然语言处理、人工智能、数据挖掘等领域国际重要会议和期刊（IEEE
  TIP、IEEE TKDE、NeurIPS、SIGIR、ACL、KDD等）发表多篇学术论文。主持十余项国家级和省部级科研项目。

  所属实验室为数据库与信息系统研究室，学术带头人为袁晓洁教授。实验室长期从事大型数据库系统、异构数据集成和Web信息检索与挖掘等方向的研究工作。曾完成国家863目标导向课题“无缝集成关系数据库系统的纯XML引擎研究与关键技术研究”，国家自然科学基金“云数据库查询模式集自动生成与检索关键技术研究”，天津市科委“大规模数据集分布式存储技术研究”等国家级和省部组科研课题30余项，发表高水平论文百余篇。

  详情见实验室主页：https://dbis.nankai.edu.cn/

  接收26年入学推免硕士生及博士生'
