bio_raw: '本人为南开大学计算机学院南开-百度联合技术实验室博士后，是王刚教授研究团队的一员。本人在攻读博士期间一直从事基于区块链的数据完整性审计相关问题研究，先后参与区块链相关天津市科技支撑项目 2 项、天津市自然科学基金项目 1 项

  。

  以第一作者身份在国内外重要会议及期刊上发表学术论文 3 篇，其中包括 CCF A 类中文期刊 1 篇，CCF B 类会议 1 篇。'
