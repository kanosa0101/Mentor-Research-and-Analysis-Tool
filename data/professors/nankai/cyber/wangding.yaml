bio_raw: '南开大学二级教授，博士/硕士生导师，教育部国家重大人才工程特聘教授（2025），

  国家优秀青年科学基金获得者（2022）

  ，计算机学院副院长、密码与网络空间安全学院副院长，中国青年科技工作者协会理事兼专委会副秘书长、中国密码学会理事、中国网络空间安全学会理事。

  现担任学院副院长，密码系主任，网络空间安全教师党支部书记，"密码科学与技术"专业负责人（多个榜单A+等级），国务院学位委员会全国密码专业学位教育指导委员会委员（2023年-），

  天津市网络与数据安全技术重点实验室主任

  （2026年-），

  数据与智能系统安全教育部重点实验室副主任

  （2023年-），

  抗量子计算密码北京市重点实验室副主任

  （2026年-），天津市商用密码行业协会副书记（2021年-），天津青联委员，中国中文信息学会大数据安全与隐私计算专委会常务委员、中国密码学会安全协议专委会委员，中国计算机学会计算机安全专委会委员，中国人工智能学会人工智能与安全专委会委员，全国高校密码数学挑战赛华北赛区联合召集人。

  2008年本科毕业于南开大学信息安全专业，2013年获得哈尔滨工程大学硕士学位，2017年获北京大学理学博士学位，2017年入选北京大学首批“博雅”博士后，2019年入选南开大学“百名青年学科带头人培养计划”,
  2020年入选天津市青年科技优秀人才，2021年入选中国"区块链60人"榜单, 2020-2025连续6年入选爱思唯尔“中国高被引学者”和斯坦福大学发布的“全球前2%顶尖科学家”榜单，
  2022年获得南开大学优秀班导师标兵、天津市教学成果特等奖、“

  强国青年科学家提名”

  称号（全国40人），2023年入选DeepTech "

  中国智能计算科技创新人物

  "，获得全国大学生信息安全竞赛优秀指导教师奖。2024年, 入选

  全国“青马工程”

  首批科技人才专项（全国50人）, 获得南开大学“优秀共产党员标兵”称号。

  近年来主持国家重点研发计划课题、国家自然科学基金（优青、面上、青年）、京津冀基础研究合作专项、天津市自然科学基金青年项目（A类）、天津市自然科学基金重点项目、中国博士后基金特别资助等项目20余项。以第一作者（或通讯作者）在

  IEEE S&P、ACM CCS、USENIX Security、NDSS

  和IEEE TDSC、IEEE TIFS、IEEE TCC、ACM TCPS等国内外刊物发表论文140余篇。其中，20篇入选Top 1% ESI高被引论文，5篇入选Top
  0.1% ESI热点论文，被引用8200余次，H-index为40。担任

  IEEE Transactions on Information Forensics and Security、Theoretical Computer Science

  、

  International Journal of Information Security

  、HCIS、CSA、《计算机研究与发展》、《电子与信息学报》、《网络空间安全科学学报》等12个国内外知名SCI/EI期刊的

  编委

  ，DSPP 2025、ICICS 2023、DSPP 2025、SPNCE 2020-2022、CS 2022、FCS 2021、SocialSec 2020、第十三届全国密码学与信息安全教学研讨会的

  程序委员会主席

  （PC Chair), 第十四届中国可信计算与信息安全学术会议(CTCIS 2021)程序委员会副主席，

  USENIX Security 2027

  、

  NDSS 2023-2025、ACM CCS 2022、PETS 2022-2024

  、ACSAC 2020-2024、IEEE EuroS&P 2025, FC 2025-2027, AsiaCCS 2027/2025/2022&2021、SEC
  2018-2021/2025、ICICS 2019-2026、INSCRYPT 2018-2022等30余个国际知名会议的TPC member。受邀在第22届国际并行处理算法与体系结构会议（ICA3PP
  2022）、中国密码学会2021年会(ChinaCrypt 2021)、安全协议进展国际会议(PSP 2021)、中国密码学会2020年全国电子认证技术交流大会（CICA
  2020）、麻省理工科技评论2020年区块链与数字经济发展论坛、第十一届国际网络空间安全学术会议(CSS 2019）、第十一届中国计算机网络与信息安全学术会议(CCNIS
  2018)、第六/七届全国网络与信息安全防护峰会（XDef 2016/2017）等国内外学术会议，作大会特邀报告（Keynote Speaker)40余次。

  关于口令密钥安全的一系列研究成果被ACM通讯、IEEE科技综览、MIT科技评论、美国福布斯、华尔街日报、英国每日邮报等200多个国际媒体报道，引起美国身份认证标准NIST
  SP800-63-3的修订，被引用并评价为口令猜测领域的“A seminal work(开创性工作)”、“A milestone work(里程碑式工作)”;
  关于密码协议的一系列研究成果被国际著名学者引用并评价为“A big breakthrough(重大突破)”、“An important finding（重要发现）”、“A
  crucial observation（关键发现）”，入选Elsevier“中国计算机科研成果赏析”和中信所“领跑者5000—中国精品科技期刊顶尖论文”。获得

  教育部自然科学奖一等奖

  (排名第2)和

  二等奖

  （排名第1），

  中国密码学会密码创新奖一等奖

  (全国2人/2年），

  蚂蚁InTech科技奖

  ，中国通信学会科技进步二等奖(排名第3），天津市科技进步二等奖（排名第2和第4），

  《中国科学：信息科学》2024年度优秀论文奖

  （热点论文），第十四届密码学与信息安全国际学术会议（INSCRYTP 2018）最佳论文奖，第12届全国密码学与信息安全教学研讨会最佳论文奖，《计算机科学》2020年度“突出贡献专家”，2021北京冬奥会“冬奥网络安全卫士”,
  北京大学学生年度人物，北京大学优秀毕业生，北京大学百篇优秀博士论文奖，

  中国计算机学会（CCF）优秀博士论文奖

  ，国际计算机学会（ACM）中国优秀博士论文奖（全国2人）、中国密码学会优秀青年奖等奖项。

  指导博士后获得

  国家自然科学基金青年基金4项，

  指导博士生获得

  国家自然科学基金青年学生基础研究项目2项

  （30万元/项），另外指导学生获得中国科协青托、CCF优秀大学生奖，国家网络安全奖学金，陈省身奖学金，国家奖学金，以及全国大学生信息安全竞赛最具创新创业价值奖（10项/年）、全国大学生信息安全竞赛一等奖、全国密码技术竞赛一等奖和二等奖、全国密码科普竞赛二等奖、“强网杯”全国网络安全挑战赛总决赛亚军等国家级各类奖项荣誉数十项；作为班主任，所带班级信安法20级获南开大学“周恩来班”称号，入选天津市先进学生集体。2023年，获得南开大学“教学育人先进个人”称号。2025年，

  实验室荣获南开大学青年五四奖章

  。

  目前，主持密码学与信息安全领域

  国家优秀青年科学基金项目

  （密钥安全，结题优秀）、

  国家重点研发计划课题

  （数字身份安全）、

  京津冀基础研究合作专项项目

  （认证密码协议）、

  中国工程院战略咨询项目

  （网安人才培养）、国家自然科学基金

  面上项目

  2项（人工智能安全）、以及

  华为、中国通号、CCF-蚂蚁

  等多家头部企业合作项目。欢迎有志攻读硕士博士学位、或者想尽早参与科研训练的优秀本科生，欢迎入职南开网安的青年学者、博士后，通过电子邮件直接与我联系 wangding@nankai.edu.cn
  。实验室位于计算机楼602、624、625。 欢迎加入我们，

  为中国密码与网络空间安全事业共同奋斗

  ！

  南开大学密码学与系统安全实验室简介： https://c5.rabbitpre.com/m2/GMdVTLZgXAO'
