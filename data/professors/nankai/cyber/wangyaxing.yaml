bio_raw: 王亚星，博士生导师，南开大学计算机学院副教授，入选南开大学百青计划。 他的研究兴趣包括 GAN、图像到图像的翻译、领域适应和终身学习。他以第一作者身份在
  IJCV、CVIU 以及 CVPR、ICCV、ECCV、NeurIPS、ICLR、ACM-MM 等计算机视觉和人工智能领域顶级国际期刊和会议上发表多篇学术论文。更多信息请参考个人主页：https://yaxingwang.netlify.app/author/yaxing-wang/
