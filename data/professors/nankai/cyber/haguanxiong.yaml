  [17] Mingyue Li, Chunfu Jia, Ruizhong Du, Wei Shao,

  Guanxiong Ha*

  . Dse-rb: A privacy-preserving dynamic searchable encryption framework on redactable
  blockchain[J]. IEEE Transactions on Cloud Computing (IEEE TCC，SCI 1区), 2022, 11(3):
  2856-2872.

  [18]

  哈冠雄

  , 贾巧雯, 陈杭, 贾春福. 无第三方服务器的基于数据流行度的加密去重方案[J]. 通信学报, 2022, 43(8): 17-29.

  科研项目

  ：

  [1]    国家自然科学基金委员会，国家自然科学基金面上项目，加密重复数据删除系统关键问题研究（项目编号：61972073），参与人。

  [2]    国家自然科学基金委员会，国家自然科学基金面上项目，Android应用防篡改新方法研究（项目编号：61972215），参与人。

  [3]    国家自然科学基金资助项目，代码虚拟化的分析方法研究(项目编号：62172238)，参与人。

  [4]    京津冀自然科学基金合作专项，面向可信数据空间的零信任数据安全架构关键技术研究(项目编号：25JJJJC0005)，参与人。

