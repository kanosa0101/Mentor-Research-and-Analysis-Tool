bio_raw: '从事信息安全，数据隐私保护，密码学及其应用等领域的研究工作多年，参与多项国家自然科学基金项目；发表相关SCI/EI论文近30篇，其中CCF-A类论文9篇；担任IEEE
  TDSC、I

  EEE TSC、

  IEEE ICC等国际高水平会议和期刊的审稿人。

  主要发表论文：

  [1]

  Guanxiong Ha

  , Chunfu Jia, Xiaowei Ge, Yuchen Chen, Xuan Shan. Similarity-aware Defense Scheme
  for Online Brute-force Attacks in Encrypted Deduplication[J]. IEEE Transactions
  on Dependable and Secure Computing (IEEE TDSC), DOI: 10.1109/TDSC.2025.3609514.

  (CCF-A，信息安全顶刊)

  [2]

  Guanxiong Ha

  , Yuchen Chen, Chunfu Jia, Keyan Chen, Rongxi Wang, Qiaowen Jia. Scalable Encrypted
  Deduplication Based on Location-hiding Secret Sharing of Data Keys[J]. IEEE Transactions
  on Computers (IEEE TC), 2025, 74(11): 3710-3721.

  (CCF-A)

  [3]

  Guanxiong Ha

  , Yuchen Chen, Zhipeng Cai, Chunfu Jia, Xuan Shan. Random Coding Responses for Resisting
  Side-channel Attacks in Client-side Deduplicated Cloud Storage[J]. IEEE Transactions
  on Services Computing (IEEE TSC), 2025, 18(3): 1697-1710.

  (CCF-A)

  [4]

  Guanxiong Ha

  , Xiaowei Ge, Chunfu Jia, Yuchen Chen, Zhen Su. Revisiting SGX-based Encrypted Deduplication
  via PoW-Before-Encryption and Eliminating Redundant Computations[J]. IEEE Transactions
  on Dependable and Secure Computing (IEEE TDSC), 2025, 22(3): 2037-2053.

  (CCF-A，信息安全顶刊)

  [5]

  Guanxiong Ha

  , Chunfu Jia, Yixuan Huang, Hang Chen, Ruiqi Li, Qiaowen Jia. Scalable and popularity-based
  secure deduplication schemes with fully random tags[J]. IEEE Transactions on Dependable
  and Secure Computing (IEEE TDSC), 2023, 21(3): 1484-1500.

  (CCF-A，信息安全顶刊)

  [6]    Xiaowei Ge,

  Guanxiong Ha

  , Chunfu Jia, Longwei Yang, Qiaowen Jia. PopeDup: Popularity-Based Encrypted Deduplication
  with Privacy Learning Attacks Resistance and Protected Thresholds[J]. IEEE Transactions
  on Information Forensics & Security (IEEE TIFS), 2025, 20: 7695-7708.

  (CCF-A，信息安全顶刊)

  [7]    Mingyue Li, Chunfu Jia, Ruizhong Du,

  Guanxiong Ha

  . Efficient Conjunctive Geometric Range Query over Encrypted Spatial Data with Learned
  Index[J]. IEEE Transactions on Computers (IEEE TC), (Early Accessed), DOI: 10.1109/TC.2025.3604470.

  (CCF-A)

  [8]    Caixia Ma, Weishuo Yuan, Xinyi Wang, Chunfu Jia, Ruizhong Du,

  Guanxiong Ha

  . Differentiated Privacy-preserving Task Assignment Scheme Based on Generative Adversarial
  Networks in Spatial Crowdsourcing[J]. IEEE Transactions on Computer-Aided Design
  of Integrated Circuits and Systems (IEEE TCAD), (Early Accessed), DOI: 10.1109/TCAD.2025.3638261.

  (CCF-A)

  [9]    Mingyue Li, Yuntao Li, Ruizhong Du, Chunfu Jia,

  Guanxiong Ha

  . Privacy-Preserving Image Retrieval With Deep Learning in Edge Computing[J]. IEEE
  Transactions on Mobile Computing (IEEE TMC), (Early Accessed), DOI: 10.1109/TMC.2025.3637042.

  (CCF-A)

  [10]

  Guanxiong Ha

  , Chunfu Jia, Xiaowei Ge, Jiawei Yuan, Hang Chen, Mingyue Li. Efficient and Anonymous
  Password-Hardened Encryption Services[J]. Information Sciences, 2024, 653: 119771.

  (CCF-B)

  [11] Caixia Ma, Chunfu Jia, Ruizhong Du,

  Guanxiong Ha

