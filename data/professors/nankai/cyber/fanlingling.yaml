supervisor: 博导
bio_raw: '南开大学副教授，博士生导师，南开大学百青青年学科带头人。于2019年6月在华东师范大学获得博士学位，2017年-2019年6月作为科研助理加入南洋理工大学，2019年6月-2020年10月在新加坡南洋理工大学担任博士后研究员，主要从事

  软件测试，软件安全，开源软件治理

  等

  研究

  。

  近五年发表40余篇高水平论文，其中CCF-A/SCI一区论文30余篇，包括ICSE，S&P，ASE，IEEE TSE，IEEE TDSC，ACM TOSEM，ESEC/FSE等。4次在软件工程领域顶级会议ICSE上获得ACM
  SIGSOFT Distinguished Paper Award。共同组织多个国际学术会议，担任Internetware’20的会议议程主席，APSEC’20的财务执行主席以及Poster
  Track Chair，同时担任多个国际顶级会议和期刊（CCF A）的审稿人，例如IEEE TSE， IEEE TDSC，TIFS，COSE等。

  最新成果请参考:

  https://lingling-fan.github.io/

  ******************************************************

  欢迎有意愿入职南开大学的博士，有志愿攻读博士/硕士研究生以及提前加入课题组进行科研学习的优秀本科生。

  ******************************************************'
