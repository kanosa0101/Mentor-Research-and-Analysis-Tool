bio_raw: '讲授课程

  操作系统（本科）

  计算机组成原理（本科，国家级一流课程）

  嵌入式软件设计与实践（硕士）

  移动云计算（硕士）

  部分教学成果

  2024年入选高校计算机专业优秀教师奖励计划

  2023年天津市教学成果特等奖--以能力培养为核心、工程素养培育为途径的全方位一流课程群建设与实践

  2022年天津市创新创业教育特色示范课程，课程思政示范课程

  2022年南开大学教学成果一等奖--以立德树人为根本，产业实践为导向，能力培养为关键，信息技术为手段的“新工科”一流课程（群）建设与实践

  2022年南开大学研究生教学成果奖一等奖--基于自主案例构建的工程专业学位复合创新型人才培养探索与实践

  研究生招生意向

  面向计算机学院和网络空间安全学院招生

  招收计算机软件与理论、计算机应用技术、计算机系统结构方向的学术硕士

  招收计算机技术方向的专业硕士

  招收计算机软件与理论、计算机系统结构方向的学术博士，招收计算机技术方向的专业博士，不定期招收在职博士生

  欢迎有工作热情、有代码能力、热爱系统领域的学生和我联系

  学习经历

  2001-2005 南开大学 计算机科学与技术系 学士

  2005-2011 南开大学 信息技术科学学院 博士

  2008-2009 美国加州大学洛杉矶分校（UCLA）

  部分科研项目

  国家自然科学基金--面向松耦合模式的资源异构分离系统优化方法研究

  国家重点研发计划--面向深度融合的异质物联网应用服务协同技术

  国家重点研发计划--面向CPU-GPU异构节点混合执行引擎

  科研奖励

  2024年河南省科技进步二等奖--边缘云网融合智能计算关键技术及应用

  2023年天津市科技进步二等奖--电网云边算力动态调度关键技术及规模化应用

  2021年天津市科技进步二等奖--能源互联网异构数据实时采集与智能计算关键技术及应用

  2021年天津市科技进步二等奖--基于云边端人员定位的综采工作面液压支架控制系统

  2020年天津市科技进步二等奖--智能肌电假手技术

