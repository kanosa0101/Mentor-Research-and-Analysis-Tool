bio_raw: '沈玮，南开大学计算机学院教授、博士生导师，中国科协青年人才托举工程、南开大学“百青计划”入选者。博士毕业于清华大学计算机系，目前研究工作主要关注于数据融合、知识图谱、大语言模型等。以第一作者或通讯作者在CCF-A类国际顶级会议期刊（ACM
  SIGMOD、ACM SIGKDD、WWW、IEEE ICDE、ACL、AAAI、IEEE TKDE）上发表论文20余篇。所发表一作/通讯论文被引用2300余次，其中一篇一作论文单篇引用次数超过1000次。先后主持国家自然科学基金面上项目、重点项目课题、青年项目，以及CCF-华为胡杨林基金、CCF-滴滴盖亚学者科研基金、CAAI-华为MindSpore学术奖励基金等多项产学研项目。曾获ACM中国新星奖提名奖、CCF-Intel青年学者提升计划、中国人工智能学会优秀博士论文奖、Google全球博士奖研金、天津市青年科技优秀人才。

  *****************************************************************************************************************************************************************************************************************

  研究生招生：每年可招收博士生和硕士生。欢迎对自然语言处理、知识图谱、大语言模型感兴趣的同学通过邮件（shenwei@nankai.edu.cn）与我联系。

  *****************************************************************************************************************************************************************************************************************

  教育、工作经历：

  2023.12-现在，南开大学，教授

  2017.12-2023.12，南开大学，副教授

  2014.7-2017.12，南开大学，讲师

  2012.11-2013.5，美国伊利诺伊大学香槟分校（UIUC），访问学者

  2009.9-2014.7，清华大学，工学博士，计算机科学与技术专业

  2005.9-2009.7，北京航空航天大学，工学学士

  获奖情况：

  2020年，中国科协青年人才托举工程

  2019年，天津市青年科技优秀人才

  2018年，ACM中国新星奖提名奖（年度共3名）

