bio_raw: '张海威，1980年生，天津市人。2008年获南开大学工学博士学位并留校担任教学科研工作，目前就职于南开大学信息技术科学学院计算机科学与信息安全技术系。主要研究方向为数据库、数据挖掘、信息检索、XML数据管理、图数据管理。参加工作以来一直从事与数据管理、数据挖掘相关的研究工作，参与了国家级和省部级课题6项。在对XML数据索引模型、XML模式提取技术以及XML相似度度量方法的研究中取得了大量成果，在国内外较高水平的期刊和会议上发表多篇论文，其中大部分被EI、ISTP收录。

  所属实验室为数据库与信息系统研究室，学术带头人为袁晓洁教授。实验室长期从事大型数据库系统、异构数据集成和Web信息检索与挖掘等方向的研究工作。曾成功开发NKSun分布式关系数据库核心存储与访问软件组件；完成863目标导向课题“无缝集成关系数据库系统的纯XML引擎研制与关键技术研究”；完成微软研究院的“基于互联网的自动问答系统设计”和天津市科委“大规模数据集分布式存储技术研究”等国家自然科学基金、863等国家级和省部级科研课题十余项，发表高水平论文五十余篇。

  实验室地址：http://cc.nankai.edu.cn/dbis/frontend/web/index.php

  接收24年入学推免硕士生及博士生，实验室介绍：https://s.wcd.im/v/1rjnnZ3r/

  报名链接：http://nku-dbis.mikecrm.com/GFRRNqq'
