supervisor: 博导
bio_raw: '南开大学网络空间安全学院教授、博士生导师；天津市网络与数据安全重点实验室主任；国家一流专业“信息安全”专业负责人。研究领域包括系统与网络安全、软件安全与恶意代码分析、可信计算等。承担973计划、重点研发、863计划、国家攀登计划和国家自然科学基金项目等12项，完成省部级项目10余项；发表论文120余篇。2019年获国家网络安全优秀教师奖，2016年获南开大学优秀博士学位论文指导教师称号，2001年获天津市自然科学2等奖。

  社会兼职主要包括：

  教育部高等学校教学指导委员会网络空间安全专业教学指导委员会委员；

  天津市人民政府学科评议组成员；

  《电子与信息学报》等期刊编委等。

  在研项目：

  1. 天津市科技局，天津市自然科学基金（重点）项目，

  代码虚拟化分析的关键问题研究（

  项目编号：20JCZDJC00640；执行时间：2020.04-2022.03），

  主持人

  2. 全国哲学社会科学工作办公室，研究阐释党的十九届四中全会精神国家社科基金重大项目，

  基于数据共享与知识复用的数字政府智能化治理研究

  （项目负责人：王芳；项目编号：20ZDA039；执行时间：2020.05-2023.04）之课题

  “政府数据安全风险识别与安全保障体系研究”

  ，

  课题负责人

  3. 国家自然科学基金委员会，国家自然科学基金面上项目，

  Android应用防篡改新方法研究

  （项目编号：61972215；执行时间：2020.01-2023.12），

  主持人

  4. 国家自然科学基金委员会，国家自然科学基金面上项目，

  加密重复数据删除系统关键问题研究

  （项目编号：61972073；执行时间：2020.01-2023.12），

  参与人

  5. 科技部，2019科技部国家重点研发计划项目（所属专项：变革性技术关键科学问题），课题名称：

  编码密码中的数学困难问题的研究

  （课题编号：2018YFA0704703）（所属项目名称：

  密码数学难题与密码系统的设计与分析

  （项目编号：2018YFA0704700）），课题承担单位：南开大学，课题负责人：符方伟（项目牵头承担单位：清华大学，首席专家：王小云），执行期限： 2019年11月至2024年10月，

