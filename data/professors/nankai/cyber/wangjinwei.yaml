bio_raw: '王金伟，教授，博导，南开大学网络空间安全学院，入选国家高层次人才和江苏省“333高层次”人才。研究方向包括人工智能安全、多媒体取证、信息隐藏等，现聚焦于AIGC鉴伪、NSFW检测、对抗取证、大模型鲁棒水印等。现主持和参与国家自然科学基金面上项目、企业联合重点项目等8项，省部级项目10余项，发表论文100余篇，其中SCI收录60余篇。

  荣获2023年河南省自然科学奖一等奖一项，2022年隐者联盟杰出论文，ChinaMFS2023年优秀论文，CIHW2023年优秀论文，ChinaMFS2024年优秀论文。

  曾担任人工智能与安全国际会议（ICAIS2020）程序委员会主席、CSIG中国取证与安全大会（ChinaMFS）宣传主席和程序委员会主席。现任中国图象图形学学会数字媒体取证与安全专委会副主任委员（兼任专委会党工作小组副组长）、江苏省网络空间全学会仿真与推演专委会秘书长（兼任专委会党建小组组长）、中国通信学会高级会员，CSIG高级会员。'
