supervisor: 博导
bio_raw: '郭春乐，南开大学副教授，博导，入选南开大学“百名青年学科带头人培养计划”，第十届中国科协青年托举计划，2023 OPEN100 开源贡献人才榜，2024、2025斯坦福全球前2%顶尖科学家榜，2024爱思唯尔中国高被引学者。研究内容包括计算成像、图像增强与复原等。谷歌学术引用1万余次，其中一作单篇最高引用2400余次。主持国自然、天津市青年项目（B类）以及华为、三星等资助的项目。参与组织2022-2025年VALSE大会，现任VALSE
  EAC、IEEE Journal of Oceanic Engineering（SCI二区）编委，CVPR 2026领域主席。

  主要研究方向：

  图像与视频修复与增强

  人工智能图像信号处理（如原始图像降噪）

  机器学习驱动的图像质量评估

  生成式图像修复

  多光谱色彩修复

  计算成像

