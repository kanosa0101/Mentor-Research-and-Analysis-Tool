bio_raw: '曾庆锴，南开大学计算机学院副教授、博士生导师，入选南开大学“百青计划”。博士毕业于圣母大学 (University of Notre Dame)，师从

  Meng Jiang

  教授，硕士毕业于伊利诺伊大学厄本那-香槟分校 (UIUC)。博士毕业后加入 Amazon 从事博士后科学家研究工作。

  研究方向聚焦于大语言模型与知识驱动智能推理，致力于

  构建融合结构化知识、信息检索与反馈对齐的可信大语言模型推理范式

  。围绕这一主线，系统开展结构化知识建模、科学文本挖掘（scientific text mining）、信息检索（information retrieval）以及检索增强生成（RAG）等方向的研究，重点探索知识与推理的协同建模、检索与推理的深度耦合，以及基于真实反馈的对齐优化机制，从而提升大模型在复杂任务中的推理可靠性、可解释性与一致性。以第一作者或通讯作者在数据挖掘、自然语言处理与人工智能领域CCF-A/B类国际会议期刊（ICLR、KDD、WebConf、CIKM、ACL、EMNLP、NAACL
  等）上发表论文多篇。

  更多信息请参考个人主页：https://qingkaizeng.github.io/

  谷歌学术主页：https://scholar.google.com/citations?user=Z9R_5-wAAAAJ&hl=en

  课题组目前尚有博士招生名额 1 个、硕士招生名额 1 个，并常年招收本科实习生。我们提供长期、系统的科研训练和导师一对一个性化指导，支持学生参与论文研究与学术发表，培养目标主要面向出国深造（2位）或国内保研（2位）。欢迎有志于学术研究、具备较强自驱力的同学加入，欢迎通过邮件或飞书联系：qingkai.zeng@nankai.edu.cn。'
