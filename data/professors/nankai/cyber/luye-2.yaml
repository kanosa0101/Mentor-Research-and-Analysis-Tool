bio_raw: "2010-2015 南开大学 计算机科学与技术系 保送直攻博 工学博士\n2006-2010 南开大学 计算机科学与技术系 工学学士\n卢冶，博士生导师，\n\
  南开大学“百青计划”获得者，2024年入选第一批天津市青年科技人才\n；中国计算机学会杰出会员(CCF Distinguished Membership)，CCF嵌入式系统专委会常务委员2024-2027，CCF天津执委会秘书长2024-2026、CCF\
  \ YOCSEF青年计算机科技论坛2022-2023 天津学术委员会主席、\n首批CCF标准工委委员，CCF技术公益大使；\nACM会员、中国电子学会CIE物联网青年专家组委员。研究方向：智能处理器芯片与系统、系统安全。主持国防科技、国家自然科学基金面上项目、天津市科技计划面上项目等7项，以及华为、蚂蚁、百度、Google、Intel等多项校企合作项目，具有坚实的大型计算机系统研发能力及丰富的技术管理经验。以第一作者或通信作者在体系结构及系统顶刊ACM\
  \ TACO、IEEE TC、TPDS、计算机研究与发展、软件学报等高水平发表论文30余篇，担任CCF A类ACM TACO、IEEE TC、IEEE TPDS、计算机研究与发展、软件学报、计算机学报等期刊审稿专家与客座编委，出版和翻译教材2部，获软件著作权十余项,\
  \ 发明专利十余项；主讲本科生课程《计算机系统设计》，研究生课程《高性能嵌入式体系结构——FPGA设计》。2023年突破华为面向全球公布的技术难题，获华为公司人工智能技术难题揭榜\n\
  “火花奖”（天津地区首次）\n，受任正非先生接见座谈。\n研究方向：\n聚焦端侧智能推理芯片与系统方向，面向国家重大战略需求， 开展系统性原创性研究\n端侧异构智能加速芯片设计\n\
  框架工具链系统的优化技术\n软件轻量化的应用部署方法\n讲授课程\n计算机系统设计（本科生）\n高性能嵌入式体系结构（研究生）\n招生意向\n招收计算机技术方向专业博士/计算机系统结构方向学术博士\n\
  招收计算机系统结构方向学术硕士\n招收计算机技术方向专业硕士\n欢迎热爱处理器芯片、系统框架、编译器/虚拟机领域，有系统代码能力并积极向上的青年学生与我联系\n\
  luye@nankai.edu.cn\n科研项目\n国家重点研发计划--面向深度融合的异质物联网应用服务协同技术\n国防科技项目--高性能****\n国家自然科学基金面上项目--高性能智能合约虚拟执行引擎与可信异构加速方法研究\n\
  国家自然科学基金青年基金--边缘智能神经网络自动压缩优化与异构加速方法\nt天津市科技支撑计划--面向飞腾处理器的稀疏化模型架构搜索与压缩方法研究\n天津市自然科学基金--面向边缘智能的嵌入式DNN模型压缩优化与计算计算技术\n\
  天津市优秀企业科技特派员基金--高性能区块链体系结构关键技术及性能优化研究\n处理器芯片全国重点实验室开放课题--面向国产处理器的DNN自动量化与应用研究\n\
  教育部产学研创新基金--基于FPGA的人工智能异构加速平台\n中国计算机学会CCF蚂蚁科研基金学者2021\n中国计算机学会CCF华为胡杨林基金学者2022\n\
  中国计算机学会CCF百度松果基金学者2023\n中国计算机学会CCF绿盟鲲鹏基金学者2024\n代表性论文（一作或通信）\nWinols: A Large-Tiling\
  \ Sparse Winograd CNN Accelerator on FPGAs, ACM TACO, 2024(体系结构类CCF A)\nPaVM:\n\
  A Parallel Virtual Machine for Smart Contract Execution and Validation, IEEE TPDS,\
  \ 2023 (\n体系结构类\nCCF A)\nDifferential Testing of Machine Translators based on Compositional\
  \ Semantics, IEEE TSE, 2023 (软件工程类 CCF A)\nTSC-VEE: A TrustZone-Based Smart\nContract\
  \ Virtual Execution Environment, IEEE TPDS,2023 (体系结构类CCF A)\n\uFEFF\nSmartVM: A\
  \ Smart Contract Virtural Machine for Fast on-Chain DNN Computations, IEEE TPDS,\
  \ 2022 (体系结构类 CCF A)\nElastic Significant Bit Quantization and Acceleration for\
  \ Deep Neural Networks, IEEE TPDS, 2021（体系结构类 CCF A）\nVecQ: Minimal Loss DNN Model\
  \ Compression With Vectorized Weight Quantization, IEEE TC, 2020（体系结构类 CCF A）\n\
  SAF-CNN：面向嵌入式FPGA的卷积神经网络稀疏化加速框架，计算机研究与发展，2023（CCF中文A，研究成果作为工信部第六届全国大学生集成电路创新创业大赛杯赛指定比赛平台）\n\
  FAQ-CNN:面向量化卷积神经网络的嵌入式FPGA加速框架，计算机研究与发展, 2022（CCF中文A）\n一种超低损失的深度神经网络量化压缩方法，软件学报,\
  \ 2021（CCF中文A）\n面向边缘计算的嵌入式FGPA卷积神经网络构建方法,2018（CCF中文A, 中国精品期刊顶尖学术论文奖）\nATOM: Architectural\
  \ Support and Optimization Mechanism for Smart Contract Fast Update and Execution\
  \ in Blockchain-based IoT, IoTJ,2021（SCI一区,中国电子学会物联网CIE2021年优秀学术期刊论文）\nTrusted-DNN:\
  \ A TrustZone-based Adaptive Isolation Strategy for Deep Neural Networks, ACM TURC\
  \ 2021（Best Paper Award）2021年ACM图灵大会最佳论文奖\n详情参见\nhttps://ics.nankai.edu.cn/12509/list.htm"
