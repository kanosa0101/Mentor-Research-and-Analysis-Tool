  2008.09—2018.06，某不敢说名字的985，学士、博士

  研究方向

  主要研究如何提升现代计算系统的安全性与可信性，研究内容覆盖应用程序、系统软件和处理器硬件等不同层次。相关技术可应用于云计算和机密计算基础设施，并为大模型与智能体的安全运行、敏感数据保护和不可信代码隔离提供系统支撑。

  应用程序隔离与运行时安全

  云平台需要同时运行大量来自不同用户的程序。安全沙箱和运行时隔离技术可以限制程序权限，防止恶意代码影响其他用户或控制服务器。

  相关研究构建了基于 gVisor 的安全沙箱，防止攻击者利用软件构建平台进行恶意挖矿 [S&P 22]；发现路径解析错误和系统状态不同步引发的容器逃逸问题 [CCS
  23, NDSS 26]；系统分析安全容器中不同组件之间的信任边界与攻击面 [FSE 26]。研究内容同时涵盖容器漏洞检测与运行时防护。

  可信系统软件与软硬件协同

  处理器可以通过可信执行环境建立受硬件保护的运行区域，使程序和数据在操作系统或云平台受到攻击时仍能得到保护。研究如何将可信硬件（如TEE）与操作系统、存储和云平台相结合，构建安全、高效且可实际部署的系统软件。

  相关工作参与研发了面向 Intel SGX 的开源库操作系统 Occlum 和基于 Rust 的通用操作系统 Asterinas；设计了面向多用户环境的安全 Kubernetes
  系统 [EuroSys 26]；发现 Intel SGX 安全文件系统中的安全问题，并提出可信存储方案 [FAST 25]。相关研究也涉及 TEE 内的隐私策略验证、多用户隔离、隐私计算和安全多方计算
  [DSN 21, TDSC 21, CLOUD 21, ISPA 20, CHES 26]，部分成果已应用于蚂蚁支付宝、字节豆包等实际系统。

  处理器与微体系结构安全

  处理器中的缓存、内存和计时机制在提升程序性能的同时，也可能泄露程序运行留下的痕迹。攻击者可以利用这些痕迹，在无法直接读取数据的情况下推测密码、程序行为或其他敏感信息。

  相关研究提出了动态调整虚拟机时钟的侧信道防御方法 [ESORICS 17]；利用处理器硬件虚拟化功能检测针对可信执行环境的攻击 [ICA3PP 18]；利用 CPU
  保存的程序执行记录发现和还原云平台中的恶意行为 [TIFS 22]；基于硬件事件进行侧信道 [SCN 16] ；基于 Rowhammer 的内存攻击 [Tsinghua
  19]。

