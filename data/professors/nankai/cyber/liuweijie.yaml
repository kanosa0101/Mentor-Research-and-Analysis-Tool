bio_raw: '简介

  刘维杰，南开大学副教授，主要从事系统安全方面的研究，研究领域包括 [应用运行时层]、[系统软件层]、[处理器与微体系结构层] 的安全问题。现任中国计算机学会网络与系统安全专委会、计算机安全专委会的执行委员，星绽开源社区技术指导委员会常务委员。

  在 IEEE S&P、CCS、NDSS、ASPLOS、EuroSys、FAST、FSE、DSN、ESORICS、CHES、TDSC、TIFS 等国际会议和期刊发表论文多篇，获授权国际专利多项。研究工作发现了
  Intel、Red Hat、阿里云等产品中的多项安全问题，获得多个 CVE/CNVD 编号；相关成果在字节跳动、阿里巴巴、腾讯等企业的生产系统或研发实践中得到应用。参与研发的
  Rust 安全操作系统项目入选“科创中国”开源创新榜单。

  主持国家自然科学基金、字节跳动星火计划和 CCF—企业联合基金等项目，曾参与国家“863”计划、国家自然科学基金重点项目，以及美国 NSF、NIH 等科研项目。

  本人长期与国内外知名高校的信息安全领域顶级教授合作，同时与工业界各大厂商有密切交流；可推荐优秀同学出国深造/大厂实习。欢迎有意研究 系统安全、虚拟化、可信执行环境TEE、AI隐私保护、Agent沙箱
  等方向的同学与我联系^^

  更多详情见英文主页：

  https://stanplatinum.github.io/

  工作经历

  2024.06—至今，南开大学，副教授

