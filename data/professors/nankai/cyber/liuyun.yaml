bio_raw: '刘云，南开大学计算机学院教授，博导，

  国家级青年人才

  ，在程明明教授领导的媒体计算实验室工作。曾任新加坡科技研究局（A*STAR）高级科学家（Senior Scientist）。曾在苏黎世联邦理工学院（ETH Zurich）计算机视觉实验室从事博士后研究，导师为

  Luc Van Gool 教授

  。在

  程明明教授

  的指导下，分别在2016年和2020年于南开大学获学士、博士学位，读博期间获得

  三次国家奖学金

  （2017年、2019年、2020年）、

  两次“南开十杰”

  （2019年、2020年）、以及

  “周恩来奖学金”

  （2020年）。主要研究方向为图像/视频/点云等的高效感知与分割、模型压缩与加速、多模态学习、多模态大模型及其个性化等。在计算机视觉、人工智能等顶级期刊和会议上发表了50余篇论文，

  含14篇IEEE TPAMI论文

  ，谷歌学术引用

  13000余次

  。

  连续多次入选斯坦福大学发布的“全球前2%顶尖科学家”榜单

  ，曾获天津市科学技术奖自然科学一等奖、吴文俊人工智能自然科学奖二等奖、天津市优秀博士学位论文等奖项。课题组有国家人才项目、国自科面上项目、天津市重点研发项目、南开百青项目等，并与华为、OPPO、新奥等公司保持密切合作，经费、计算资源充足。

  个人主页：https://yun-liu.github.io/

  谷歌学术：https://scholar.google.com/citations?user=UB3doCoAAAAJ

  课题组常年招收博士和硕士研究生，以及本科实习生，欢迎联系。'
