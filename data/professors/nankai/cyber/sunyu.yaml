bio_raw: '课题组常年招收本科实习生，欢迎有论文发表意愿和较强自驱力的同学加入我们！

  研究方向

  面向大模型

  的高质量数据准备：本研究方向聚焦数据获取、清洗、去重、配比、合成、评估、反馈，包括利用智能体构建自动化数据处理流程，设计数据质量评估与过滤策略，探索数据配比与模型学习方案，研究数据合成方法，评估数据价值和大模型性能反馈优化等。

  大规模高维向量数据管理：

  面向海量高维向量的存储与检索，研究高效索引、压缩量化、分布式查询优化及混合查询等问题。

  海量数据高效治理：针对物联网、金融、城市计算等场景中的海量时序、时空与关系数据，研究大模型驱动/具有性能保障的高效数据异常检测、缺失填补、错误修复、实体对齐、约束画像等技术。

  时序数据库系统：

  研究时序数据库内核技术，包括：面向时间戳的存储引擎、高效压缩算法、多维标签倒排索引、分布式降采样与查询优化，工作基于国产自研开源时序数据库IoTDB进行改进。

  教育经历

  2017.8-2022.7 清华大学 博士

  导师：宋韶旭（https://sxsong.github.io）

  2013.8-2017.7 南开大学 学士

