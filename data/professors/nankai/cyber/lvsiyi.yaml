bio_raw: '在研项目：

  分级安全可搜索加密关键技术研究，国家自然科学基金青年项目，在研

  中国博士后科学基金第73批面上资助，主持，已结题

  部分论文：

  [1] Ruixuan Wang,

  Siyi Lv*

  , et al; BOMAP: A Round-Efficient Construction of Oblivious Maps, IEEE Transactions
  on Dependable and Secure Computing, 2025. (CCF-A类期刊论文，唯一通讯作者)

  [2] Junjian Shi, Ye Han, Xiaojie Guo, Zekun Fei, Zheli Liu,

  Siyi Lv*

  , et al;

  SMPCache: Towards More Efficient SQL Queries in Multi-Party Collaborative Data Analysis,
  IEEE Transactions on Knowledge and Data Engineering, 2025. (CCF-A类期刊论文，共同通讯作者)

  [3]

  Siyi Lv,

  et al; LUNA: Efficient Backward-private Dynamic Symmetric Searchable Encryption
  Scheme with Secure Deletion in Encrypted Database, IEEE Transactions on Knowledge
  and Data Engineering, 2023, 0(0): 1-14. (CCF-A类期刊论文，唯一第一作者)

  [4] Peizhao Zhou, Xiaojie Guo, Pinzhi Chen, Tong Li,

  Siyi Lv*

  , and Zheli Liu; Shortcut: Making MPC-based Collaborative Analytics Efficient on
  Dynamic Databases, CCS 2024.(CCF-A类会议，唯一通讯作者)

  [5] Jingyu Jia, Xinhao Li, Tong Li*, Zhewei Liu, Chang Tan,

  Siyi Lv*

  , et al; ABSyn: An Accurate Differentially Private Data Synthesis Scheme with Adaptive
  Selection and Batch Processes, IEEE Transactions on Information Forensics & Security,
  Accepted with Mandatory Minor Revisions.(CCF-A类期刊论文，共同通讯作者)

  [6] Jingyu Jia, Chang Tan, Zhewei Liu, Xinhao Li, Zheli Liu,

  Siyi Lv*

  , Changyu Dong; Total Variation Distance Privacy: Accurately Measuring Inference
  Attacks and Improving Utility, Information Sciences, 2023.05, 626(0): 537-558 (SCI一区期刊论文，唯一通讯作者)

  [7]

  Siyi Lv

  , et al; New approach for efficient malicious multiparty private set intersection,
  Information Sciences, 2024.09,678(0). (SCI一区期刊论文，唯一第一作者)

  [8] Haobin Chen, Yue Yang,

  Siyi Lv*

  ; Revisiting Frequency-Smoothing Encryption: New Security Definitions and Efficient
  Construction, Cybersecurity, accept. (CCF-C类期刊论文，唯一通讯作者)

  [9] Chang Tan, Zhewei Liu, Zhengdao Li*, Jingyu Jia,

  Siyi Lv*

  , et al.; EdgeSyn: Privacy-preserving Data Publishing on Edge Network over Infinite
  Multimedia Data Stream, ACM Transactions on Multimedia Computing, Communications
  and Applications, 2024. (CCF-B类期刊论文，共同通讯作者)

