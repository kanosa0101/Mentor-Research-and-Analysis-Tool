  个人简介

  马玲，现为南开大学软件学院副教授。于2011年7月获得吉林大学工学硕士（计算机应用技术），导师是欧阳继红老师。主要研究方向为人工智能，研究工作主要是空间关系推理方法的研究。于2017年6月获得北京理工大学工学博士学位（计算机应用技术专业），导师是刘峡壁老师。攻读博士学位期间，曾赴美国埃默里大学（Emory
  University）生物医学工程专业学习两年，导师为Dr. Baowei Fei. 主要研究方向为图像分割、分类、检索、物体检测与识别等。目前的研究工作主要是医学图像处理与分析，包括
  CT 影像、超声影像、MRI 影像、以及高光谱影像中，器官的分割、病灶的定位与检测、疾病的识别与检索等。在Journal of Biomedical Informatics，Physics
  in Medicine and Biology，Computerized Medical Imaging and Graphics，IEEE Journal of
  Biomedical and Health Informatics，Medical Physics, 吉林大学（工学版）, SPIE Medical imaging,
  等国内外重要期刊及会议上以第一作者（或本人为第二作者，导师为第一作者）发表或录用论文10余篇。2017年获得北京理工大学优秀毕业生。

  ⋅ 2011.09 - 2017.06，北京理工大学，工学博士，计算机应用技术专业（导师：刘峡壁老师）

  ⋅ 2014.11 - 2016.11，美国埃默里大学（Emory University）, 访问学者（导师：Dr. Baowei Fei）

  ⋅ 2008.09 - 2011.07，吉林大学，工学硕士，计算机应用技术专业（导师：欧阳继红老师）

  ⋅ 2004.09 - 2008.07，吉林大学，理学学士，计算机科学与技术专业

