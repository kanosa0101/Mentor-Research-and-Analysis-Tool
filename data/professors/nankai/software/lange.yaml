  个人简介

  2013年至2024年于南开大学攻读本科、硕士和博士学位，期间作为课题骨干参与过多项国家重点研发计划课题。在自然语言处理、知识图谱、预训练语言模型等方面具有丰富的经验，相关科研成果发表于EAAI，BIBM等高水平期刊会议中。

