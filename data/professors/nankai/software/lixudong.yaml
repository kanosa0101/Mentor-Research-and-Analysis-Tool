  个人简介

  长期从事操作系统、分布式系统等领域的教学与研发，拥有多项国家发明专利，主要贡献包括：提出一种在实名制下信息安全保护系统，可确保用户身份不会任意泄露、最大化保护各方隐私；提出了一种面向统一接口调用的运行时系统，实现了分布式环境下的计算资源共享；提出了支持扩展功能的虚拟文件系统，可有效支持大数据密集型的业务处理，减少网络不必要的数据传输。

