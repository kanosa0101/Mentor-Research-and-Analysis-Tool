bio_raw: '张重群

  职称：讲师

  学历：博士

  所学专业：计算机科学

  研究方向：机器人、具身智能、计算机视觉

  电子邮箱：

  zhangzhongqun@nankai.edu.cn

  个人简介：

  张重群，南开大学软件学院讲师，获英国伯明翰大学计算机科学博士学位。曾任新加坡国立大学访问学者、华为伦敦研究所助理研究员，参与华为

  -

  瑞金医院多模态病理大模型项目。主要从事

  具身感知与交互

  领域的基础理论与技术应用研究，包括灵巧手操作、无人机视觉、眼动交互等方向。发表高水平论文

  20

  余篇，包括

  CVPR

  、

  ECCV

  、

  AAAI

  、

  ACM MM

  等，学术引用

  650

  余次。任指挥与控制学会首届具身智能专委会委员，并

  多次在领域内顶级会议上组织国际比赛与研讨会。

  本人是天津市软件体验与人机交互重点实验室（张海宁教授团队）的

  具身智能课题组

  指导教师，欢迎对相关项目感兴趣的学生联系我。更多信息请访问个人主页（

  https://zhongqunzhang.github.io/

  ）。

