  个人简介

  张圣林现为南开大学教授，博士生、硕士生导师，软件学院副院长（分管科研、学科建设和信息化），先进计算与关键软件（信创）海河实验室研究员。入选南开大学“百青计划”。主要研究方向为面向关键信息基础设施韧性保障的智能运维，包括异常检测、故障定位、根因分析和故障预测等。以第一或唯一通讯作者在CCF
  A类会议或期刊发表论文40余篇。谷歌学术被引4700余次。申请国内发明专利30项，其中13项已授权。主持国家自然科学基金项目2项， 横向项目30余项（与华为、字节跳动、腾讯、阿里巴巴、蚂蚁金服、中兴等合作）。荣获CCF
  A类会议FSE 2026唯一杰出工业论文奖，并三次荣获CCF B类会议ISSRE最佳论文奖，创该会议35年历史上个人获奖次数之最。获中国电子学会科技进步一等奖（第3完成人）、天津市科技进步一等奖、华为“最佳技术合作教授奖”、南开大学“良师益友”称号、麒麟软件“校企合作突出贡献奖”等荣誉。指导的研究生获得南开大学优秀硕士学位论文4项，南开大学研究生优秀毕业生1项。

  于2017年获清华大学工学博士学位（计算机科学与技术专业），2012年获西安电子科技大学工学学士学位（网络工程专业）。在攻读博士学位期间，曾经赴佐治亚理工学院学习。
  于2014-2017年在百度运维部实习， 并于2018-2019年在阿里巴巴从事访问学者研究。

  作为联合发起人，与清华大学裴丹教授共同创办了CCF智能运维挑战赛（网址：https://competition.aiops.cn/），并担任首届（2018年）和第六届（2023年）程序委员会主席。该赛事已连续成功举办八届，成为CCF互联网专委会三大年度活动之一，累计2500余支队伍、6000余人次参赛，有力促进了我国智能运维人才的交流培养与技术创新，为行业搭建了一个具有国际影响力的全新展示平台。在此基础上，与裴丹教授共同创办CCF
  OpenAIOps社区（网址：https://www.aiops.cn/），致力于通过开放的社区合作与群体智慧协同创新，促进智能运维领域研究人员与工程师开展开源创新算法与软件开发，推动智能运维生态繁荣发展。目前，社区提供了29种开源数据集，28种开源模型，5类评测榜单。截至目前，社区累计访问量超过140万人次，用户来自全球100多个国家和地区，成为国际范围内最具影响力的智能运维学术社区之一。

  先后20余次担任CCF A/B类国际会议程序委员会委员。此外，担任ISSRE 2024成果评估环节（Artifact Evaluation Track）主席。现任CCF互联网专委常务委员，CCF
  2026中国软件大会程序委员会共同主席、CCF 2025中国网络大会竞赛委员会共同主席，CCF软件工程专委、服务计算专委执行委员，曾担任CCF 2025中国网络大会宣传委员会主席，CCF青年计算机科技论坛（YOCSEF）天津学术委员会副主席（2023–2024）。

