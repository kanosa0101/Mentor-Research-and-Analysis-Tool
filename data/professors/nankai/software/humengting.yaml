  个人简介

  现为南开大学软件学院

  副教授

  ，于

  2021年

  6月获南开大学工学博士学位，博士期间在

  IBM研究院的自然语言处理组联合培养，校内导师为程仁洪教授，校外导师为赵石顽博士。研究方向包括自然语言处理、大模型、社交媒体内容分析（信息抽取、多模态情感分析等）。发表

  CCF-A/B类期刊和国际会议论文十余篇，包括

  ACL、

  EMNLP、

  TAC、

  WWW、

  KDD、

  AAAI等，主持国家青年基金、天津市青年基金以及多项横向项目。

