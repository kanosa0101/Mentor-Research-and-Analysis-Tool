bio_raw: '张玉志

  所属部门

  : 软件工程系

  电子邮件

  : zyz@nankai.edu.cn

  职 称

  : 讲席教授，博导

  学 历

  : 博士

  所学专业

  : 计算机系软件专业

  研究方向

  : 人工智能、软件工程

  个人简介

  1980-1985，清华大学计算机系，学士；

  1985-1987，清华大学计算机系，硕士；

  1987-1991，中科院计算所，博士。

  大学期间是学生活跃分子。创立清华大学学生系统科学研究会并任会长，担任清华学生科学技术协会主席。1985年作为学生代表参加胡锦涛为团长的青年代表团访问日本。是第一届免试研究生。

  1991-2016，在中科院计算所工作。

  期间担任曙光系列计算机产业化负责人，并成功创立曙光公司（今上市公司中科曙光）并任董事副总裁、深圳市对外经济合作促进会并任会长。

  2016年任软件学院院长。

  科研项目等情况

  先后承担20余项国家课题。包括国家863计划、基金、支撑计划、核高基、重点研发计划等。主要研究方向人工智能、模式识别、自然语言处理、知识库建设、数据标注等。其中，近年承担的“智能计算软件平台研制”课题是南开大学最大课题，取得了一系列突破。

  撰写论文等情况

  发表论文二十余篇，专利、软著20余项，专著一本。

  讲授课程

  本科生课程：创新研究与训练、人工智能导论。

  研究生课程：软件工程前沿、工程伦理。

  主要社会兼职

  科技部“先进计算与新兴软件”重点专项专家组成员；

  中国软件行业协会副理事长。'
