  个人简介

  副教授，硕士生导师。近年来主要从事机器学习与区块链技术的研究。参加并完成了国家自然科学基金、天津市科技攻关计划、企业合作项目等多项课题。

  2000年毕业于南开大学自动化专业，获本科学位。2003年毕业于南开大学模式识别专业，获硕士学位。2011年毕业于南开大学计算机应用技术专业，获博士学位。2019年至2020年获国家留学基金委资助，赴澳大利亚莫纳什大学做访问学者。

  科研项目、成果、获奖、专利等情况

  【荣誉与奖励】

  1. 2021年11月，获得华为云与计算“先锋教师”称号；

  2. 2018年12月，获得中国高校微信应用教育联盟“工作突出贡献奖”；

  3. 2018年9月，获得南开大学第八届“良师益友”奖；

  4. 2018年7月，获得泰达-华博杯“华侨华人创新创业大赛”二等奖；

  5. 2015年12月，获得南开大学“教学改革优秀奖”；

  6. 2014年11月，获得全国“2014年创业大赛创业实践挑战赛”银奖；

  7. 2014年7月，获得天津市“2014年创业实践挑战赛”金奖。

  8. 2010年6月，获得教育部-IBM高校合作项目“优秀教师奖”。

  【科研项目】

  1. 2019年12月 至 2022年12月，公共文化资源智能共建共享与管理平台关键技术研究（国家重点研发计划）

  2. 2021年9月 至 2022年9月，基于TAPD的软件工程DevOps综合实践教学（教育部-腾讯公司产学合作协同育人项目）

  3. 2021年3月 至 2022年3月，基于CloudBase的云开发实践基地建设（教育部-腾讯公司产学合作协同育人项目）

  4. 2020年12月 至 2022年12月，软件工程专业《数据科学》课程建设（教育部-IBM公司产学合作协同育人项目）

  5. 2020年09月 至 2021年8月，基于Flutter的移动互联网跨平台应用开发（教育部-谷歌公司产学合作协同育人项目）

  6. 2018年08月 至 2019年8月，激光系统数值预测系统功能验证软件试制（中国核工业理化工程研究院项目）

  7. 2014年01月 至 2016年12月 面向异构信息网络中近似图匹配的深度学习方法（高等学校博士学科点专项科研基金）

