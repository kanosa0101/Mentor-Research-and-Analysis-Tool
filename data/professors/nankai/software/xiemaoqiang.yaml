  个人简介

  现为南开大学软件学院教授，硕士生导师，软件学院副院长。在南开大学获得学士和博士学位。曾任软件工程系主任、软件学院院长助理。

  近年来主要从事机器学习、软件工程等方面的研究工作。主持国家自然科学基金、天津市自然科学基金各1项。作为主要完成人参加国家重点研发计划、国家自然科学基金、教育部科技重点项目、天津市科技攻关等多项项目，发表论文50余篇，其中SCI索引9篇。此外，主持同微软、搜狐视频、日立软件、美国明尼苏达大学的横向合作项目。

  设计开发基于AIGC的用户体验场景生成软件、基于光丝激光雷达的大气污染分析软件、全基因组致病基因智能预测系统PheGenEx、数据挖掘系统RoboMiner等多套智能软件系统。

  曾获天津市科技进步一等奖、教育部-华为“智能基座” 优秀教师、南开大学教学成果二等奖。讲授本科课程《机器学习导论》获天津市一流建设课程。指导学生获得天津市挑战杯特等奖、中国国际“互联网+”大学创新创业大赛天津赛区二等奖等。

