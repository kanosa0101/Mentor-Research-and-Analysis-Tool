  个人简介

  教授，博士生导师。研究方向为信息安全、软件工程，在相关研究领域发表论文

  100

  余篇，

  2014-2019

  连续六年入选爱思唯尔发布的计算机科学领域中国高被引学者榜单。主持国家、省部级自然基金重点项目多项，曾获部级科技进步三等奖、

  2019

  年天津市工程专业学位优秀指导教师，多次荣获南开大学优秀硕士学位论文指导教师，是天津市、浙江省、重庆市等多省市自然科学基金评审专家，教育部学位论文评审中心专家，天津市高级人民法院信息技术咨询专家，天津市第五届学科评议组以及天津市专业学位教育指导委员会

  计算机与安全工程组成员。

