  个人简介：

  朱先忠，男，1965年5月生，山东青岛人，高级工程师，南开大学软件学院特聘研究员。先后毕业于河海大学与哈尔滨工业大学计算机软件专业，获工学学士、工学硕士学位。

  毕业后在中国石化燕山石化公司,中国国家图书馆,中国数字图书馆有限责任公司、南开大学软件学院工作。一直从事计算机软件专业技术研发，参与多项国家重点科研项目的研发。

  主要研究领域：计算机语言设计，内容计算技术，大数据体系结构实现。拥有数字内容交互语言、数字资源库发布服务、内容链、内容大数据多项技术成果与应用。获得十几项国家发明专利。

  作为主要研究人员，参加了多个重点科研项目的研发：

  1. 国家科技支撑计划-《数字平面内容支撑技术平台》，负责《数字平面内容发布服务子平台》的研发，研究成果在国家数字图书馆工程中得到充分应用。

  2. 国家863项目-《支持数据驱动型应用的跨域共享与服务支撑平台研发》，负责开发了《数字图书馆内容的跨域共享服务》。

  3. 国家863重点项目-《基于高可信网络的数字内容服务系统开发及示范》，负责开发了《图书馆大众文化发布服务》。

  4. 国家科技支撑计划-《数字家庭服务关键技术研发与应用示范》。

  5. 国家科技支撑计划-《以书为媒介的阅读互动平台研发与应用》。负责《大众阅读互动平台的技术架构设计》与关键技术研发。

  6. 国家重点研发计划-《公共文化资源库群构建体系与智能化资源建设关键技术研究》，负责《公共文化资源库群构建体系》。

  7. 天津市重点研发计划-《基于文化大数据的内容出版聚合服务平台研发》，成果在天津出版传媒集团有限公司得到应用。

