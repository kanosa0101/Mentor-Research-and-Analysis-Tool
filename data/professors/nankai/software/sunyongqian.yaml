  个人简介

  孙永谦(

  Yongqian Sun

  )现为南开大学软件学院副教授, 于2018年获清华大学工学博士学位（计算机科学与技术专业）。博士期间在清华大学计算机科学与技术系

  NetMan

  实验室就读，导师为赵有健教师和

  裴丹

  教授。主攻智能运维方向（AIOps），包括Web应用（搜索引擎、电商网站等）中服务等业务的异常检测、异常定位、告警聚合收敛、故障定位分析等，期待大型互联网企业中的服务运维工作朝着智能化、精准化、高度自治化的方向发展。本人科研中注重科研问题的实际应用价值，追求产学研结合的科研成果。因此，博士在读期间与百度公司合作，通过3.5年的长期实习，挖掘大型Web应用在实际中存在的前沿问题，结合机器学习的算法解决一线运维难题。发表的一些成果已被多家大型互联网企业采用（如
  华为、腾讯、百度、蚂蚁金服等）。目前本人仍在 NetMan 实验室担任助理工作，主持或参加与多家企业的项目合作10余项，以期研究问题能在工业应用价值与科研价值中寻求最佳结合点。此外，与清华大学、中科院等联合发起OpenAIOps开放社区（https://www.aiops.cn），作为首席技术负责人举办第二届CCF
  AIOps挑战赛。2024年获得中国电子学会科技进步一等奖，ISSRE 2024国际会议上同时获得最佳学术论文和最佳工业论文。

  课题组现已与华为、字节跳动、阿里巴巴、腾讯、中兴、eBay、微软、中兴、网商银行、天津云账户等一流IT企业建立了合作关系，解决影响用户服务质量的问题。课题组长期欢迎更多优秀的研究生、本科生加入，共同解决学术价值与工业应用价值兼备的前沿难题，提高广大Web应用用户的体验！

