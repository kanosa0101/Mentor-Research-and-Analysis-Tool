  个人简介

  副研究员，硕士生导师。1997年毕业于南开大学数学试点（省身）班，2003年毕业于南开大学组合数学研究中心，获博士学位。2003年至2005年在清华大学数学科学系博士后流动站进修。2005年到南开大学软件学院工作。2010年至2011年获国家留学基金委资助，赴佐治亚理工学院电子工程系做访问学者。在国内外期刊及会议发表学术论文三十余篇，主持及参与国家级和省部级科研项目十余项，多次指导本科生和硕士研究生获得校级优秀毕业论文，是CCF、CMS、CSIAM、IEEE
  CS以及ACM等学术组织的会员，担任多个学术期刊和会议的审稿人。

