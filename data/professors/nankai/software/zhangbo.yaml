bio_raw: "张波\n所属部门\n: 软件工程系\n电子邮件\n: zhangb@nankai.edu.cn\n职 称\n: 教授\n学 历\n: 博士\n\
  导 师：\n硕士生导师\n所学专业\n: 电子工程\n研究方向\n: 自动驾驶，深度学习\n个人简介\n张波，汉族，籍贯陕西，生于 1972 年 5 月，中共党员。分别于\
  \ 1993 年、1996、2001 年获得西安交通大学、南开大学、香港城市大学学士、硕士、博士学位。自 2001 年 7 月起，任教于南开大学。曾于 2002-2013\
  \ 年任软件学院副院长，负责学院教学管理工作。现为南开大学软件学院教授。他曾从事语音识别研究，目前正在从事无人平台研发。\n教学与行政管理方面，自南开大学软件学院成立以来，负责制定软件学院\
  \ 2+2 转专业、高起本本科生教学计划、软件工程硕士教学计划、面向特殊行业（总后）的软件工程硕士教学计划。为本科生、研究生讲授“C++ 程序设计”、“面向对象软件方法学”、“自主驾驶导论”等课程。编著案例教材《Qt\
  \ 中的 C++ 技术》（电子工业出版社）。获国家示范性软件学院建设贡献奖（2011 年），教改项目“软件学院外籍优秀教师的引进和管理”获得校级教学成果 2 等奖（2009），获得香港金乔奖教金一等奖（2004\
  \ 年），南开大学精品课程建设奖（2004 年）。\n科研方面，曾与城市大学教授合作，承担香港教统局“基于语音技术的网络多媒体普通话教学系统”。与天津市公安局合作，承担公安部一个与语音识别相关的项目。为大唐重庆的一个发电厂等企业开发软件系统。目前正在进行的项目是为军方研发无人平台。\n\
  教育经历\n1989~1993 年，西安交通大学，计算机系，获学士学位。\n1993~1996 年，南开大学，计算机系，获硕士学位。\n1996~2001 年，香港城市大学，电子工程系，获博士学位。\n\
  工作经历\n自 2001 年 7 月起，任教于南开大学。曾于 2002-2013 年任软件学院副院长，负责学院教学管理工作。现为南开大学软件学院教授。\n科研项目、成果、论文、获奖等\n\
  科研项目\n2023.9--2025.7 多模态感知人机增效课题技术开发\n2021.9--2022.5 机械零件选型导引模块的开发\n2020.12–2022.7\
  \ 基于音频信号的设备异常检测\n2015.10–2016.2 胎心频率提取算法的研究与开发\n2013.9 –2016.2 计算机辅助发音训练中的深度神经网络研究\n\
  2014.6 –2016.5 Android 平台英语发音评测引擎的开发\n2005.8 –2007.5 基于语音技术的网络多媒体普通话教学系统\n2006.9\
  \ –2007.12 天津市重点人口声纹数据库\n2005.1 –2005.1 天津远洋面向对象软件技术支持\n2003.10–2005.5 津菱（天津）物流管理系统\n\
  2003.4 –2003.7 EPS-PS 文件中图像数据的抽取与恢复系统\n2006.11–2007.4 手持语音设备开发\n2003.2 –2003.6 发音人辨识系统\n\
  2001.12–2003.12 发言人定位器\n发表论文\nXi Gong, Xin Huang, Shanshan Chen, Bo Zhang. Enhancing\
  \ 3D Detection Accuracy in Autonomous Driving throughPseudo-LiDAR Augmentation and\
  \ Downsampling[C]//2024 International Conference on Image Processing, ComputerVision\
  \ and Machine Learning, ICICML 2024.\nZheng Zhang, Yanbin Zhao, Xiaoxi Fan, Bo Zhang.\
  \ Big Data Oriented Graph Division and Storage[C]//2023 IEEE8th International Conference\
  \ on Big Data Analytics (ICBDA). IEEE, 03-05 March 2023,p.47-52.\nLuyang Sun, Xiawei\
  \ Yue, Zheng Zhang, Bo Zhang. OpenCL implementation of a cascaded decompression\
  \ algorithmfor querying of big table data. Second International Conference on Electronic\
  \ Information Engineering, Big Data, andComputer Technology (EIBDCT 2023). January\
  \ 06-08, 2023, Xishuangbanna, China.\nTao Liu, Meiqian Duan, Luyang Sun, Bo Zhang.\
  \ An Auditory Measure for Anomaly Detection based on Auto\x02encoders. 2022 Asia\
  \ Conference on Algorithms, Computing and Machine Learning(CACML 2022). March 25-27,\
  \ 2022,Hangzhou, China.\nRenhang HONG, Yang ZHOU, Shenghe SHI, Bo ZHANG, Fast Clustering\
  \ for Redundancy Removal In Audio AnomalyDetection, Proceedings of 2022 7th International\
  \ Conference on Cloud Computing and Big Data Analytics (ICCCBDA),April 22-24, 2022,\
  \ Chengdu, China.\nShan Huang, Shenghe Shi, Bo Zhang, Application of Noise Adaptation\
  \ Layer for Phoneme Recognition with NoisyLabels, Proceedings of the 2021 1st International\
  \ Conference on Artificial Intelligence and Pattern Recognition(ICAIPR2021)，June\
  \ 25-27，2021，Beijing，China.\nYunhao Zhang, Bo Zhang, Zhenhui Zhou, “Zero-Copy Data\
  \ Transfer for an OpenCL API Remoting System”, Inter\x02national Conference on Cloud\
  \ Computing and Big Data Analytics(ICCCBDA-2019), April 10-13, 2020, Chengdu, China.\n\
  Chen Li, Bo Zhang, Shan Huang, Zhenhuan Liu, \"Using Noisy Word-level Labels to\
