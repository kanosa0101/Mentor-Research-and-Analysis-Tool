  ,International Conference on Computing and Pattern Recognition(ICCPR 2019), October\
  \ 23-25, 2019, Beijing, China.\nBo Zhang, Yuqin Gan, Yan Song, and Benlai Tang,\
  \ \"Application of Pronunciation Knowledge on Phoneme Recognitionby LSTM Neural\
  \ Network\", International Conference on Pattern Recognition, 2016, Cancun, Mexicon.\n\
  讲授课程\n本科生课程：高级语言程序设计 2-1，高级语言程序设计 2-2。\n研究生课程：自主驾驶导论。\n社会兼职\n无"
