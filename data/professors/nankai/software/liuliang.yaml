  招生：

  本人一直在代码一线，以互联网大厂、军工单位实际需求为牵引，聚焦操作系统、数据库等基础软件领域，专注于有实际价值的关键技术研究，深入参与开源社区，志在解决真问题，为互联网大厂、军工单位交付生产级系统（非玩具）。毕业生主要去向为：高校任教、读博深造，以及腾讯、字节、京东、拼多多、阿里巴巴、快手、美团、荣耀等企业。课题组长期招收博士后、博士生、硕士生以及本科生。欢迎对我们研究工作感兴趣的志同道合者与我们邮件(ll@nankai.edu.cn）联系。'
