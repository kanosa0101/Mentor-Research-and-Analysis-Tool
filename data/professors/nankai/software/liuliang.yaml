  个人简介：

  现任南开大学软件学院教授。研究

  方向为系统软件及其安全。近五年主持国家自然科学联合基金重点支持项目课题、军科委国防科技创新特区重点项目课题、工信部高质量发展专项课题、江苏省制造强省建设专项、国防型号等项目。研究成果、研制的系统被头部互联网公司、军用型号装备采用。连续多年获得学院科研

  TOP10。以第一或通讯作者在ASE、ICSME、TIFS、WWWJ、TNSE、JPDC、CN、IOTJ等国际会议、期刊上发表学术论文5

  0

  余篇，指导学生获得国际会议最佳论文、最佳学生论文

  4

  项，指导多名学生获得国家奖学金、省三好、省优硕。个人主页

  : https://www.sensordb.site

