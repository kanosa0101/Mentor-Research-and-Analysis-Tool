  个人简介

  工学博士，南开大学软件学院副教授。

  2013

  年于南开大学计算机与科学技术学院获计算机应用技术专业博士学位。自

  2003

  年在南开大学软件学院工作以来主持并完成了天津市自然科学基金项目、校企合作项目等多项课题。研究方向主要包括：软件系统架构、复杂信息系统集成、链接预测等。

