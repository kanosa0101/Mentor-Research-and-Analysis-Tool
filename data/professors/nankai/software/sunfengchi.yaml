  个人简介

  教授，硕士生导师，麻省理工学院（MIT）访问学者。1994年毕业于山东科技大学电气工程系，1998年毕业于山东科技大学信电学院获硕士学位，2003年7月毕业于南开大学获工学博士学位，2010年1月至2011年1月，获国家留学基金委资助赴麻省理工学院做访问学者，自2004年5月任南开大学软件学院讲师、副教授、教授，研究方向为机器学习、智能机器人系统，在国内外期刊及会议发表学术论文几十篇，主持及参与国家级和省部级科研项目十余项，获得山东省科技进步奖，曾指导本科生获“挑战杯”竞赛全国三等奖、微软全球嵌入式设计大赛提名奖。

  科研项目、成果、获奖、专利等情况

  主持和参与的部分项目

  ：

  1. 野外环境中基于自适应学习的移动机器人地形分类与建图， 国家自然科学基金项目

  2. 基于运动模式在线学习的移动机器人对运动目标的主动观测与最优跟踪，国家自然科学基金项目

  3. 未知环境下基于陆标动态配置的移动机器人主动同时定位与地图创建，国家自然科学基金青年基金项目

  4. 未知环境下移动机器人主动探索与建图，国家高技术计划项目

  5. 未知环境下基于多传感信息融合的多机器人协作主动探索与建图，国家自然科学基金项目

  6. 室内环境下基于WiFi无线信号场的移动机器人定位与导航，天津市自然科学基金面上项目

  7. 基于多传感信息融合的移动机器人运动目标识别与跟踪， 天津市自然科学基金项目

  撰写论文、专著、教材等

  发表的部分论文：

  [1] Yansong Gong, Fengchi Sun, Wenbin Zhu,etc.“A Two-Level Framework for Place Recognition
  with 3D Lidar Based on Spatial Relation Graph”，Pattern Recognition，Published online，2021.

  [2] Jing Yuan, Jingxin Cai, Xuebo Zhang, Qinxuan Sun, Fengchi Sun, and Wenbin Zhu,
  “Fusing skeleton recognition with face-TLD for human following of mobile service
  robots,” IEEE Transactions on Systems, Man, and Cybernetics: Systems, 2019, DOI:10.1109/TSMC.2019.2921974.

  [3] Jing Yuan, Fengchi Sun and Yalou Huang, "Optimal design of trajectory parameters
  and position tracking with balance for riderless bicycle," Optimal Control Applications
  and Methods, 2016, 37(1): 72-89.

  [4] Jing Yuan, Yalou Huang, Fengchi Sun, and Tong Tao, “Active exploration using
  a scheme for autonomous allocation of landmarks,” Robotica, 2014, 32(5): 757-782.

  [5]Meng Song,Fengchi Sun,Karl Iagnemma,Natural Landmark Extraction in Cluttered
  Forested Environments,IEEE International Conference on Robotics and Automation(ICRA),
