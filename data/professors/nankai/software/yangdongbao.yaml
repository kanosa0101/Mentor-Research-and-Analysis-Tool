  个人简介

  杨东宝，现任南开大学软件学院副教授，研究方向为计算机视觉，近期主要聚焦于开放世界感知、增量目标检测以及多模态内容理解等方向。在

  ICML

  、

  ICLR

  、

  CVPR

  、

  AAAI

  、

  ACM MM

  等国际会议与期刊上发表学术论文

  30

  余篇，其中以第一作者或通讯作者发表

  CCF-A

  类及

  SCI

  一区论文

  10

  余篇。主持国家自然科学基金青年基金、国家重点研发计划子课题等科研项目。

