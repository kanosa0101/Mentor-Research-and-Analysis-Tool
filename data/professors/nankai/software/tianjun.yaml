  个人简介：

  软件学院教授，副院长，博士生导师，具身智能联合实验室负责人，南开

  -金蝶数字化联合实验室负责人。2001年获得中国科学院计算机应用技术博士学位，2005年获得美国佛罗里达大学计算机信息科学博士学位。BDE Tech公司董事长、首席科学家，曾任国际蓝牙联盟技术架构审核理事会理事、通信委员会和低功耗委员会委员，黑莓手机美国研究院高级研究员、摩托罗拉美国研发中心高级工程师。曾是多项国家863计划项目的负责人，中国科学院创新工程重要方向项目和国家自然科学基金项目的主要负责人，发表学术论文40余篇，授权专利30多项，软件注册登记20多项，广泛应用于智能产品工业界，多家科技公司创始人，产研创领域包括人工智能、机器人、企业数智化、智能制造、医学AI等。

