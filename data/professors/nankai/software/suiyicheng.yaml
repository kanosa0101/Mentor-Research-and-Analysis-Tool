  个人简介

  分别于2020和2025年在南开大学软件学院获得学士学位和博士学位，攻读博士期间作为课题骨干参与多项国家重点研发计划课题和JKW重点课题。

  在学期间获评南开大学学生年度人物（每年评选十人）、南开大学周恩来奖学金（南开学生最高荣誉）和天津市优秀学生。

  主要研究方向为深度学习框架和人工智能应用，相关成果发表于ICDE、ASE、TSC、CCF THPC等期刊会议上。

