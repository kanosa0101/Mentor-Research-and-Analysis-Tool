  个人简介

  高楠，南开大学软件学院副教授，博士生导师，

  南开

  -

  天一人工智能联合实验室主任。

  2022

  年获得澳大利亚皇家墨尔本理工大学（

  R

  MIT

  ）计算机博士学位，师从

  F

  lora Salim

  教授。此后加入清华大学计算机系史元春教授团队，任水木学者博士后，并赴澳大利亚新南威尔士大学（

  UNSW

  ）访问。近年来在

  IMWUT

  、

  CHI

  、

  CSCW

  等领域顶级会议与期刊发表论文三十余篇，开源了迄今规模最大、模态最丰富的学生心理感知数据集

  En-Gage

  ，相关成果被澳大利亚

  ABC News

  专访并获全球百余家媒体报道。曾获

  IMWUT

  杰出论文奖（

  CCF

  -A

  ，

  一作）、

  UbiComp Workshop

  最佳论文奖（一作）、国家优秀自费留学生奖、

  DAAD AINet Fellow

  、清华大学水木学者等荣誉。目前担任

  IMWUT

  （

  CCF-A

  ）

  Associate Editor

  、

  CHI (CCF-A) Associate Chair

  ，中国计算机学会人机交互专委会与普适计算专委会执行委员，主持国家自然科学基金青年项目、中国博士后科学基金面上资助等课题。

  我的研究关心一个基本问题：

  当技术已经足以感知人的行为与情绪时，我们应当如何设计它，才能真正让人活得更好？

  围绕这个问题，我的工作一方面用感知技术量化那些难以被看见的个体状态与心理特质，另一方面探索合适的交互干预策略，让实验室里的

  模型

  变成能陪伴学生、支持家庭、服务真实场景的系统。

  我对计算机科学、心理学与教育学的交叉领域方面尤为关注，特别是大模型在

  心理健康

  、

  情感陪伴

  和家庭

  /

  学校教育领域的应用研究。

  我重视真实落地，鼓励学生在严谨的学术训练之外，参与产学研合作项目，看到自己的研究被真实地使用。

  如果你希望加入我的团队（实习生、硕士、博士或合作项目），

  欢迎访问我主页了解最新招生信息

  ：

  https://nancygao.com/

  。

