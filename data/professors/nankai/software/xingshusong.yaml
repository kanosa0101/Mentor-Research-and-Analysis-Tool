  个人简介

  2005年毕业于新加坡南洋理工大学机械宇航学院机器人中心，获博士学位。2005年开始在南开大学软件学院工作。在国内外期刊及会议发表学术论文二十余篇，参与国家级和省部级科研项目，多次指导本科生参加软件竞赛并获奖，担任多个期刊和会议的审稿人。

  科研项目、成果、获奖、专利等情况

  软件项目和专利：

  1. 企业区块链可视化配置工具 (

  github.com/EternallyAscend/Faber

  )

  2. 机器人即时通信软件 (

  github.com/drevilxing/IMRobot

  )

  3. 表面肌电信号分析 (

  youtu.be/fjuGRsQJuU0

  )

  4. 加密货币分析工具

  5. 区块链网络快速搭建平台，软件著作权，2021

  6. 校内物品交易软件，软件著作权，2021

  7. 远程显示设备上的凝视估计系统，专利申请，2021

