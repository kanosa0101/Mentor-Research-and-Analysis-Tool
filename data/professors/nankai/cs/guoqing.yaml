bio_raw: '郭青，南开大学计算机学院教授，博士生导师，国家级青年人才（海外），多次入选斯坦福全球Top 2%科学家。2019年加入新加坡南洋理工大学任博士后研究员，并于2020年获聘为瓦伦堡-南洋理工大学校长博士后（全球500选5人），2022年加入新加坡科技研究
  （A*STAR）前沿人工智能研究中心（CFAR）任高级研究员，2023年起新加坡国立大学兼职助理教授。曾获ICME最佳论文奖、ACM优秀博士论文奖等多项荣誉，在新加坡期间主持多项重大科研项目，累计科研经费约400万新币。主要研究方向可靠视觉感知及人工智能安全。在ICML、NeurIPS、ICLR、CVPR、ICCV、TPAMI、IJCV等A类会议及期刊上发表论文60余篇。现担任ICML、ICLR、NeurIPS、ICCV、CVPR、IJCAI领域主席，AAAI
  Senior PC，VALSE AC ，并在top期刊IEEE Trans. Image Process. 和Visual Intelligence 担任Associate
  Editor。

  若有意联系攻读博士及硕士学位，请填写表格信息：

  https://nankai.feishu.cn/share/base/form/shrcnGptKvaRfesIF3WPgdDMDlg，或

  发邮件到qing.guo@nankai.edu.cn , 主题设置为：硕士/博士-姓名-学校。'
