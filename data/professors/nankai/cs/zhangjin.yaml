bio_raw: '简要介绍：

  科研：

  当前科学研究的主要兴趣集中在以下2个方向：

  1.面向现代计算机系统性能提升的

  计算机系统

  方向：

  重点关注与嵌入式系统，边缘计算和虚拟化领域的相关问题。

  2.面向下一代计算机系统的

  脑数据处理

  方向：

  重点关注EEG，MRI，fMRI相关的脑信号处理问题。

  欢迎对上述方向有兴趣的同学和学者与我们联系，相聚于南开园内马蹄湖畔。

  当前工程技术领域的主要兴趣在于计算机系统在各个重大行业中的运用与赋能。近年来主要合作单位为：

  中海油能源发展股份有限公司（600968），国家电网有限公司（600795）等核心央企和美国波音公司（BA）等国际企业。

  教学：

  在面向本科生的

  计算机组成原理课程

  教学方面，

  目前我们已经自建了包含1296个节点的

  计算机原理知识框架

  以及相关配套课程资源以供分享。

  在面向研究生的

  移动云计算课程

  教学方面，

  目前我们已经自建了30余个

  移动云计算应用课程案例

  以供分享。

  衷心希望从事相关教学的各位老师与我们多多联系，互相学习和借鉴，

  也欢迎各位老师致信获取上述教学资源的最新版本。

  主要简历

  1998-2005 华中科技大学，学士、硕士

  2005-2008 南开大学，博士

  2008-至今 南开大学，教师

  主要服务工作：

  南开大学实验室设备处副处长

  中国高等教育学会实验室管理工作分会理事

  《实验室科学》副主编

  计算机系统方向国家级虚拟教研室成员

  主要成果和奖励：

  宝钢优秀教师奖

  唐立新优秀教师奖

  华为智能基座优秀教师

  国家级一流本科课程（线下）——计算机组成原理

  天津市课程思政示范课程

  天津市课程思政教学名师、教学团队负责人

  天津市创新创业教育特色示范课程

  天津市工程专业学位研究生优秀课程

  天津市工程专业学位研究生优秀指导教师

  2020年天津市科学技术进步二等奖 2项

  2018年天津市科学技术进步二等奖

  2011年天津市科学技术进步二等奖

