bio_raw: '刘晓光，现任南开大学计算机学院、网络空间安全学院教授，博士生导师，副院长，天津市政协委员，天津市河北区政协副主席，入选教育部新世纪人才计划，曾获宝钢优秀教师奖。主要研究领域包括搜索引擎、云存储和区块链系统等。在SCI一区和CCF
  A类期刊和会议上发表论文四十余篇，主持14项国家和省部级科研项目。入选2020年中国区块链创新人物60人。与百度、奇虎360、华为等企业建立了联合实验室或者科研合作项目，相关成果已经应用于企业的实际产品。(

  南开-百度联合实验室主页http://nbjl.nankai.edu.cn,招收学术博士、专业博士、学术硕士、专业硕士

