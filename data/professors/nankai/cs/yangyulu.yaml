bio_raw: '1996年3月获得日本庆应义塾大学计算机科学专业的博士（Ph.D）学位。

  1992年10月，提出了用于超大规模并行计算机，被命名为RDT (Recursive Diagonal Tours) 的结合结构。以其优良的综合特性（直径/平均距离小、Degree小、能嵌入Mesh等拓扑结构、含有潜在的分层构造、实装简单、充分的耐故障冗长性、适用节点数范围宽），在该领域有较大反响。

  1993年8月，提出了RDT上的使用矢量分解/组合方法的新的routing算法。同年，RDT成为了日本国家“重点领域研究：超并行机计划”的原形机的结合结构。

  1997年6月回国，开始在南开大学工作。讲授“高级计算机系统结构”等课程。获天津市第六届青年科技奖。'
