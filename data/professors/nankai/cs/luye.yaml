bio_raw: "卢冶，教授/博士生导师，\n国家级青年人才，南开大学百青，首批天津市青年科技人才\n；中国计算机学会CCF杰出会员，CCF嵌入式系统专委会常务委员2024-2027，CCF天津执委会秘书长2024-2026、CCF\
  \ YOCSEF第十三届天津学术委员会主席、\n首批CCF标准工委委员，CCF技术公益大使\n。研究方向：人工智能处理器芯片与系统、高性能嵌入式、异构计算、系统安全。主持国家级青年人才、天津市青年科技人才项目，主持国家某委、国家自然科学基金、天津市科技计划等项目，以及华为、蚂蚁、百度、Google等多项校企合作项目，具有坚实的大型智能系统研发能力及丰富的技术管理经验。以第一作者或通信作者在处理器芯片体系结构及系统顶刊ACM\
  \ TACO、IEEE TC、TPDS等发表论文30余篇，担任CCF A类期刊或会议审稿专家与客座编委，出版和翻译教材2部，出版专著1部，发明专利十余项；主讲本科生课程《计算机系统基础》，研究生课程《高性能嵌入式体系结构——FPGA设计》。2023年攻克华为面向全球公布的技术难题，获华为公司人工智能技术难题揭榜\n\
  “火花奖”（天津地区首次）\n，受邀与任正非先生座谈交流。\n研究方向：\n聚焦端侧智能推理芯片与系统方向，面向国家重大战略需求， 开展系统性原创性研究\n端侧异构智能加速芯片设计\n\
  框架工具链系统的优化技术\n软件轻量化的应用部署方法\n讲授课程\n计算机系统设计（本科生）\n高性能嵌入式体系结构（博士研究生/硕士研究生）\n招生意向\n\
  招收计算机技术方向专业博士/计算机系统结构方向学术博士\n招收计算机系统结构方向学术硕士\n招收计算机技术方向专业硕士\n欢迎热爱处理器芯片、系统框架、编译器/虚拟机领域，具备较强系统代码能力并积极向上的青年学生与我联系\n\
  luye@nankai.edu.cn\n有意申请者需符合条件: 完成体系结构与系统基本知识补充，达到B线水平(详见\nhttps://ysyx.oscc.cc/docs/\n\
  )或系统PA5水平(详见\nhttps://nju-projectn.github.io/ics-pa-gitbook/ics2025/)\n主持科研项目\n\
  国家重点研发计划--面向深度融合的异质物联网应用服务协同技术\n国家某委--高性能****\n国家自然科学基金面上项目--高性能智能合约虚拟执行引擎与可信异构加速方法研究\n\
  国家自然科学基金青年基金--边缘智能神经网络自动压缩优化与异构加速方法\n天津市科技支撑计划--面向飞腾处理器的稀疏化模型架构搜索与压缩方法研究\n天津市优秀企业科技特派员项目\n\
  处理器芯片全国重点实验室开放课题--面向国产处理器的DNN自动量化与应用研究\n教育部产学研创新基金--基于FPGA的人工智能异构加速平台\n华为昇腾芯片重大横向\n\
  2021中国计算机学会CCF蚂蚁科研基金\n2022中国计算机学会CCF华为胡杨林基金\n2023中国计算机学会CCF百度松果基金\n2024中国计算机学会CCF绿盟鲲鹏基金\n\
  部分代表性论文（一作或通信）\nFuXi-γ: Efficient Sequential Recommendation with Exponential-Power\
  \ Temporal Encoder and Diagonal-Sparse Positional Mechanism, SIGKDD 2026 (数据库系统类顶会\
  \ CCF A)\nCROSC: Compilation-Runtime Joint Optimization for Fast Smart Contract\
  \ Execution, IEEE TC, 2025 (体系结构类顶刊 CCF A)\nWinols: A Large-Tiling Sparse Winograd\
  \ CNN Accelerator on FPGAs, ACM TACO, 2024 (体系结构类顶刊 CCF A)\nPaVM:\nA Parallel Virtual\
  \ Machine for Smart Contract Execution and Validation, IEEE TPDS, 2023 (\n体系结构类顶刊\n\
  CCF A)\nDifferential Testing of Machine Translators based on Compositional Semantics,\
  \ IEEE TSE, 2023 (软件工程类顶刊 CCF A)\nTSC-VEE: A TrustZone-Based Smart\nContract Virtual\
  \ Execution Environment, IEEE TPDS,2023 (体系结构类顶刊 CCF A)\n\uFEFF\nSmartVM: A Smart\
  \ Contract Virtural Machine for Fast on-Chain DNN Computations, IEEE TPDS, 2022\
  \ (体系结构类顶刊 CCF A)\nElastic Significant Bit Quantization and Acceleration for Deep\
  \ Neural Networks, IEEE TPDS, 2021（体系结构类顶刊 CCF A）\nVecQ: Minimal Loss DNN Model\
  \ Compression With Vectorized Weight Quantization, IEEE TC, 2020（体系结构类顶刊 CCF A）\n\
  SAF-CNN：面向嵌入式FPGA的卷积神经网络稀疏化加速框架，计算机研究与发展，2023（CCF中文A类顶刊，研究成果作为工信部第六届全国大学生集成电路创新创业大赛杯赛指定比赛平台）\n\
  FAQ-CNN:面向量化卷积神经网络的嵌入式FPGA加速框架，计算机研究与发展, 2022（CCF中文A类顶刊）\n一种超低损失的深度神经网络量化压缩方法，软件学报,\
  \ 2021（CCF中文A类顶刊）\n面向边缘计算的嵌入式FGPA卷积神经网络构建方法,2018（CCF中文A类顶刊, 顶尖学术论文奖）\nTrusted-DNN:\
  \ A TrustZone-based Adaptive Isolation Strategy for Deep Neural Networks, ACM TURC\
  \ 2021（Best Paper Award, 2021年ACM图灵大会最佳论文奖）\n毕业生去向\n团队毕业博士硕士去向：高校教职、军队直招、直辖市公务员、央国企科研院所、字节跳动、华为人才计划、蚂蚁星Plan\
  \ A人才计划、腾讯、阿里、百度等头部企业\n详情参见\nhttps://ics.nankai.edu.cn/12509/list.htm"
