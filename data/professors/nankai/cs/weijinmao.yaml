bio_raw: '2001年毕业于华东理工大学信息学院，获工学博士学位，2006年于吉林大学计算机科学与技术学院博士后流动站出站。研究方向为机器学习，数据挖掘，生物信息学，生物医药及营养健康大数据。近年来以第一作者或通讯作者身份在IEEE
  Transactions on Knowledge and Data Engineering, Pattern Recognition, Cell Reports
  Methods, Bioinformatics, Briefings in Bioinformatics, IEEE/ACM Transactions on Computational
  Biology and Bioinformatics, IEEE Journal of Biomedical and Health Informatics, BMC
  Biology, Computational Intelligence, Expert Systems With Applications， BMC Bioinformatics,
  Neurocomputing, Knowledge-Based Systems，Applied Intelligence, Computing and Informatics，
  Entropy， Natural Language Engineering, Neural Processing Letters等期刊及 AAAI,IJCAI,CIKM,
  DASFAA,EMNLP等会议上发表60余篇论文，其中SCI（E）/EI/ISTP论文40余篇。参加国家"863"计划1项，科技部重点研发项目1项，主持国家自然基金2项，主持天津市应用基础及前沿技术研究计划项目3项，曾主持省科技发展计划项目1项，市科技成果产业化项目1项，参加国家自然科学基金2项，省科技发展计划2项，其他横向项目多项。获得发明专利7项，澳大利亚专利1项，软件著作权登记4项，获省科技进步三等奖1项。

  其他详情见：

  https://bigdata.nankai.edu.cn/weijm/list.htm

  http://bio.nankai.edu.cn/views/team/team.html'
