bio_raw: 李起成，南开大学教授，博导。在1997年至2007年期间就读于北京大学计算机系，获得学士学位与博士学位，博士期间的研究工作获得了教育部科技进步一等奖。毕业后加入IBM中国研究院，负责自然语言处理、对话系统、人机交互等相关的科研课题，带领数十名名研发人员落地了IBM全球首个基于云计算的三维互联网应用孵化平台。作为IBM中国研究院的主要研究人员，与IBM全球实验室合作设计并实现了IBM沃森平台中文命名实体识别服务。在人工智能和软件服务等相关领域的研究过程中发表论文数十篇，获得最佳论文奖一次；在全球各地获得发明专利70多项，拥有IBM发明大师称号。
