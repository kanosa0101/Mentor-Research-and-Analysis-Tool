bio_raw: '刘承威，南开大学密码与网络空间安全学院教授、博士生导师，

  国家级青年人才（海外）

  。

  主要研究方向包括软件安全、程序分析、开源软件安全、软件供应链安全、开源治理以及新型智能体软件安全与治理等。2023年于新加坡南洋理工大学获得博士学位，并在南洋理工大学继续从事博士后研究。2024年任南洋理工大学科研助理教授，2026年加入南开大学。近年来围绕开源软件生态安全、漏洞分析与治理、软件供应链风险识别、开源治理与智能体软件安全等方向开展系统研究。

  在科研成果方面，曾发表40余篇高水平论文，大部分相关工作发表于

  ICSE、FSE、ASE、ISSTA、USENIX Security、WWW、IEEE TSE

  等CCF-A类国际高水平会议和期刊，并曾3次获得

  ACM杰出论文奖

  。在学术服务方面，积极参与国际学术共同体建设，担任

  ICSE、FSE、ASE、ICSME、ACSAC

  等会议程序委员会成员，并长期担任

  TSE、TOSEM、TDSC、TIFS、EMSE

  等国际期刊审稿人。个人详细信息请访问 https://lcwj3.github.io/

  目前课题组长期招收博士后、博士研究生和硕士研究生，欢迎对软件安全、程序分析、开源软件治理、软件供应链安全及智能体软件安全等方向感兴趣的同学加入。 同时，也欢迎有志于在本科阶段开展科研训练、希望尽早参与高水平科研实践的本科生加入团队。邮件请发送到chengwei.liu@nankai.edu.cn'
