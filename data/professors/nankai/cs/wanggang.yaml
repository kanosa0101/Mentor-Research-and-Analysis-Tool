bio_raw: '王刚

  ，男，南开大学计算机学院、网络空间安全学院，院长助理，教授，博士生导师。

  2002年于南开大学获得控制理论与控制工程工学博士学位，留校任教至今。

  研究兴趣包括海量信息存储、并行与分布式计算、搜索引擎等。特别在分布式存储系统可靠性技术、云存储用户数据隐私保护、搜索引擎性能优化等方向取得一系列重要成果。近年来在计算机等领域国际顶尖学术期刊JSAC、TC、TOIS、TOS、TDSC、TPDS、RESS、MBE、Bioinformatics、Plos
  ONE及国际顶级学术会议VLDB（2011）、SIGIR（2013、2015、2016、2018）、WWW（2019）、HPDC（2019）、ICPP（2018）、AAAI（2019）、IJCAI（2019）、MM（2017、2019）、CIKM（2013、2014、2019）、DSN（2014）、SRDS（2016）、MSST（2012、2013、2016、2019）发表学术论文。主持国家863项目、国家自然科学基金项目、天津市自然科学基金项目等多项，主持与百度公司、奇虎360公司、华为公司等合作项目多项。为TNNLS、TCBB、TOS、RESS、CCPE、FGCS、Transactions
  on Industrial Informatics、Journal of Computer and System Sciences、Transactions on
  Nanobioscience等期刊会议的审稿人。现为担任中国计算机学会信息存储专委会执行委员，中国计算机学会理论计算机专委会执行委员。

  主要研究成果包括：

  1. 与百度公司等业界领先企业合作，长期从事搜索引擎性能优化技术的研究，提出适合并行处理的线性回归索引压缩算法和相应查询请求处理算法，成果发表在VLDB；提出适合新型存储介质的高速缓存算法，发表在SIGIR、CIKM、TOIS；提出基于文法的数据压缩算法及混合压缩算法，发表在SIGIR、WWW。其中，索引缓存算法成果应用于百度搜索引擎系统中，获百度“飞跃奖”。促成南开—百度联合实验室（百度和国内高校第一批联合实验室）和南开—百度协同创新中心的建立。

  2. 长期从事数据中心硬盘故障预测和主动容错技术的研究，提出基于BP-ANN、决策树、RNN等机器学习方法的硬盘故障预测模型，提出适合数据中心和主动容错机制的存储编码和可靠性分析模型，成果发表在JSAC、TC、TDSC、RESS、DSN、SRDS等。设计和实现的硬盘故障预测模型已应用于百度公司、奇虎360公司和华为公司等业界领先企业的数据中心。

  3. 长期从事并行算法的研究，提出采用GPU加速系统发育推断软件MrBayes的方法，在天河1号超算中64个节点的GPU集群上实现了相对串行算法最高1000倍以上的加速比，一系列成果发表在生物信息学顶尖期刊Bioinformatics和MBE上。设计和实现的GPU版MrBayes软件被全球几十个国家的科研团队下载数千次用于系统发育推断研究。

  教学方面，承担本科生《编译系统原理》、《并行程序设计》和研究生《并行计算技术》、《分布式系统》课程教学。已培养1名博士后出站，6名博士研究生获得学位，30余名硕士研究生获得学位，目前在学博士生4名、硕士生10名。主要教学成果包括：

  1. 指导博士生童健聪获得2013年首届百度奖学金（全球8人获奖）、入选IBM英才计划，2015年获得博士学位后入职百度、入选大搜索4S计划。

  2. 指导博士生马井玮的博士学位论文获得2017年天津优秀博士学位论文奖。

  3. 指导硕士生孔琰获得2019年天津市工程专业学位研究生优秀论文奖。

  4. 《并行计算技术》课程获得2019年度天津市工程专业学位优秀课程奖。

  5. 指导研究生获得2015年第一届全国高校云计算应用创新大赛二等奖。

  6. 指导研究生获得2019年全国区块链大赛二等奖。'
