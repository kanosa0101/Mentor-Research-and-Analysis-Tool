bio_raw: 2005年，南开大学信息技术科学学院控制理论与控制工程专业获博士学位；2005年至今，南开大学计算机学院计算机科学技术系任教。主要研究方向包括：车联网、智能驾驶、群智感知、物联网安全等。近年，主持和参与部委级、天津市课题6项，主持横向课题2项；在国内外高水平学术会议与期刊上发表学术论文30篇，其中EI检索25篇，作为第一作者或通讯作者发表13篇；独立或合作编写、翻译教材20本，其中列入“十二五”普通高等教育本科国家级规划教材5本、“十二五”国家重点图书4本；主讲本科生“可视化技术基础”、“物联网工程导论”课程，主讲硕士研究生“计算机网络技术”课程，获得天津市级教学成果一等奖与南开大学教学成果一等奖、二等奖各1项。
