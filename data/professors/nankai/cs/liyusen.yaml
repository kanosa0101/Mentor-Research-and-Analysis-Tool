bio_raw: '2013年博士毕业于新加坡南洋理工大学，2013~2016年在南洋理工大学从事博士后研究工作，2016年加入南开-百度联合实验室 (http://nbjl.nankai.edu.cn/)。主要研究领域为并行与分布式系统、计算机体系结构。近些年发表论文70余篇，包括
  ACM/IEEE TON、ACM TACO、IEEE TPDS、IEEE TC、IEEE TKDE、IEEE JSAC、EuroSys、ICDE、DAC、ACM
  Multimedia、ACM HPDC、PACT、ACM SPAA、IEEE ICDCS、IEEE IPDPS、ICPP 等相关领域高水平国际期刊和会议。主持/参与国家重点研发计划课题、国家自然科学基金重大项目课题、天津市人工智能重大专项、广东省重点研发课题、国家自然科学基金，天津市自然科学基金，字节、华为、百度、CCF-蚂蚁联合基金等科研项目。

