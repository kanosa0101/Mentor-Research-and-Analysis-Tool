bio_raw: '周宇

  ，南开大学计算机/密网学院教授、博导；北京中关村学院学院导师；中国图象图形学学会文档图像分析与识别专委会副秘书长、常务委员；中国图象图形学会旗舰英文期刊Visual
  Intelligence副主编，ICLR、NeurIPS、ACM MM、IJCAI等会议领域主席或资深程序委员；哈尔滨工业大学计算机系本硕博（导师

  高文

  院士、

  陈熙霖

  研究员），上海交通大学博士后（导师

  杨小康

  教授）；2012.04-2024.08于中科院信工所先后任助研、副研、硕导、博导、研究员。

  研究方向为计算机视觉、多模态人工智能、具身智能、自然语言处理、大模型及深度学习等，近期聚焦于可视文本处理/检测/识别/理解/安全（OCR）、多模态大模型（含理解与生成）、多模态智能体、终身学习、自监督学习等主题

  。研发的场景文本提取系统、GUI Agent、特定目标检测系统、钓鱼网站检测系统等应用于多个国家部委及企业，发挥关键作用。在国内外高水平会议及期刊如CVPR/ICCV/ECCV/NeurIPS/ICML/ICLR/IJCV/TMM等发表学术论文100余篇，其中

  在CCF(THU)-A类/SCI一区会议期刊发表论文近80篇（一作/通作近60篇、26年度近30篇）

  ，获得

  CCF-A类会议ACM MM 2021最佳论文提名奖（5/1942篇）

  、ACCV IWRR 2014最佳论文奖。团队核心技术获得ICDAR 2025复杂版面文档图像端到端机器翻译

  冠军

  、CSIG 2022票据识别与分析挑战赛

  冠军

  、2020年“中国人工智能·多媒体信息识别技术竞赛”手写&印刷文本OCR两项高校组

  冠军

  、ICDAR ReST 2023印章主体文字检测第三名等近10项学术竞赛奖项。主持

  国家重点研发计划课题

  &子课题、

  国家自然科学基金

  面上&青年基金项目、国家部委重大工程课题、中国博士后科学基金、企业委托等项目/课题多项。

  详细信息见个人主页：

  https://intimelab.github.io

  。

  招生：

  【

  博士招生

  】1) 27年入学博士生：1名；2) 中关村学院博士生：在北京中关村学院参与“具身多模态大模型”及“高效神经网络架构设计”两个项目，每周在中关村学院线下工作1~2天，与每位同学至少讨论1次，欢迎对中关村学院感兴趣的同学联系交流；

  【

  硕士招生

  】27年入学硕士生：已招满；

  【

  本科实习

  】欢迎本科生入组实习，但受限于算力瓶颈，每年只能少量接收，如果你自己可以租赁算力，我们可以合作。

  招生详细信息见：

  https://intimelab.github.io/stu

  。

