bio_raw: '工作经历：

  2016.7--2019.12 南开大学计算机学院 讲师

  2020.1--至今 南开大学计算机学院 副教授

  研究方向：

  图算法设计与分析、图论与组合优化、图神经网络

  主持的科研项目：

  1.

  国家自然科学基金青年项目，11701297，图的彩虹连通性和单色连通性，2018/01-2020/12

  2. 天津市自然科学基金青年项目，19JCQNJC14400，图的彩虹连通性的计算复杂性与算法研究，2019/04-2022/03

  3.

  智能信息处理山西省重点实验室开放课题基金，CICIP20118005，大规模复杂网络上相似性等度量的研究，2018/10-2020/09

  参与的科研项目：

  1.国家重点研发计划青年科学家项目，2022YFA1006400，图划分与图染色的理论和方法， 2022/12 至 2027/11，300万元

