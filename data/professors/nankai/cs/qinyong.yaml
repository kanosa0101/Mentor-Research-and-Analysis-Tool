bio_raw: 秦勇，1967年生人，南开大学杰出教授，博导。1996年博士毕业于中国科学院声学研究所，之后加入IBM中国研究院，并于2021年加入南开大学计算机学院。其主要研究方向包括：语音识别、语音合成、多模态人机交互、多模态情感计算、脑电波事件检测、自然语言处理、人脸和姿态合成等人工智能热点研究领域。其工作成果包括世界上第一个支持连续语音、说话人无关的的汉语普通话语音听写机、语音到语音的翻译系统、文本可视化技术、基于心理语言学的性格预测解决方案等。直接参与或领导了IBM若干个著名的软件产品或平台的研发工作，包括IBM
  ViaVoice语音听写机、IBM沃森人工智能平台和IBM沃森医疗。在重要学术会议和期刊如SIGCHI, ICASSP, Interspeech, ICPR,
  ICMI, EBioMedicine 上发表超过50篇论文； 接近100个技术专利，包括多个高价值专利。
