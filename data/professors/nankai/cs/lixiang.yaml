bio_raw: '李翔，南开大学计算机学院副教授，博士生导师，入选南开大学百青计划、南开大学五四青年奖章。主持国家自然科学青年基金。曾获2015年阿里巴巴天池大数据竞赛首届阿里移动推荐算法冠军（1/7186队伍）【央视科教频道《走近科学》专集报道了这一成果】，2016年滴滴研究院Di-Tech首届算法大赛全球总冠军（1/7664队伍），2020年首届“征图杯”校园机器视觉人工智能大赛亚军（2/953队伍），2022年计图jittor人工智能算法大赛冠军（1/154队伍），

  2022 粤港澳大湾区（黄埔）国际算法算例大赛（遥感目标检测赛道）亚军（2/116队伍），带领学生队伍参与AI竞赛累积至今总获奖奖金额度130余万。

  江苏省人工智能学会优秀博士论文奖，CCF优秀博士论文激励计划提名奖，入选博士后创新人才计划，吴文俊人工智能优秀青年奖，斯坦福2%顶尖科学家榜单。

  近年来团队小伙伴的收获：

  2025: 指导本科生获南开大学“火山杯”AI智能体创新应用大赛软件专业组

  一等奖

  2025: 第二届“吉林一号”杯长光卫星遥感应用青年创新创业大赛

  特等奖

  2025: CVPR workshop(The 4th Anti-UAV Workshop & Challenge)

  最佳论文奖

  2025: CVPR workshop(The 4th Anti-UAV Workshop & Challenge)Track 1赛道

  第一名

  2025: 指导本科生

  国家级创业训练项目

  立项

  2024: 指导本科生获

  南开大学优秀毕业论文

  2024: ISPRS第一技术委员会多模态遥感应用算法智能解译大赛“基于高分辨率可见光图像的感兴趣区域内部变化智能检测”赛道

  冠军

  2023: 指导本科生获

  重庆市优秀本科毕业论文（设计）

  2023: 第三届计图人工智能挑战赛

  二等奖

  2022: 粤港澳大湾区（黄埔）国际算法算例大赛遥感目标检测赛道

  亚军（2/116）

  2022: 第二届计图人工智能挑战赛一

  等奖（排名1/154）

  2022: 第五届开源创新大赛

  团体一等奖

  2020: 征途杯校园机器视觉人工智能大赛

  亚军（排名2/953）

  他的研究兴趣包括图像识别与检测，神经网络设计与模块分析，知识蒸馏与自监督学习。他以一作或共同一作身份在国际人工智能领域顶级会议NeurIPS、CVPR、ECCV、ICCV、IJCAI、AAAI及顶级期刊T-PAMI等发表多篇学术论文，Google学术总引用上万余次。其中2篇一作论文单篇引用分别达3300（SKNet）和1700（GFL）余次。SKNet被诺贝尔物理学奖、图灵奖得主Hinton教授团队重点跟进，GFL成为工业界主流轻量目标检测器
  YOLO 系列的标准配置。获CVMJ（影响因子17+）2022年度最佳论文提名奖，CVPR25 workshop最佳论文奖。

  他是“减论”科研服务IP的创始人，全网（B站、小红书、知乎等）粉丝数达4万+，累积播放量100万余次。近年来，他带领团队开辟了“智能科研服务”课题，部分研究成果已经发表CCF-A类论文，并落地应用于“减论”IP服务账号的每日全自动论文减辑服务。团队正在研发“减论”APP，一个国家级的统一科技入口平台，为所有科技工作者（包括学生、老师）提供一站式科研服务，团队持续招聘中，欢迎有各类技能经验的伙伴（例如APP前后端开发，算法等）联系并投递简历至
  xiang.li.implus@nankai.edu.cn，并备注标题【减论平台招聘】。

  他也是“新芽”训练营发起人之一，旨在为全国低年级本科同学打造科研入门的基础服务和交流平台。目前已经在少量高校试点，预计2026年“新芽计划”将普及推广到全国各大高校。

  更多信息请参考个人主页：http://implus.github.io/

  谷歌学术主页：https://scholar.google.com/citations?user=oamjJdYAAAAJ&hl=zh-CN

  团队招生按照程明明老师组的招生流程共同进行，先进行3轮考核，再在大组中进行导师分配。

  有意向的同学请投递简历至 xiang.li.implus@nankai.edu.cn

  我们大组多位老师也有卓工学院的博士名额，欢迎大家报考卓工学院：https://cee.nankai.edu.cn/'
