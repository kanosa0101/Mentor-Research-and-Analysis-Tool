bio_raw: '南开大学计算机学院教授、博士生导师，国家级青年人才、天津杰青、南开百青（A计划），数据与智能系统安全教育部重点实验室副主任，2015-2016年以国家公派访问学者身份在美国加州大学默塞德分校视觉与学习实验室进行访问研究。中国计算机学会计算机视觉专委会副秘书长，IEEE
  TAC编委，中国计算机视觉大会（CCCV 2017）和可视媒体计算大会（CVM 2017）组织委员会主席，视觉与学习青年学者研讨会（VALSE 2022）Workshop主席，国际计算机视觉与模式识别大会（CVPR
  2024-2026）领域主席，国际人工智能大会（AAAI 2024-2026）领域主席/资深程序委员。作为主要作者之一参与提出了2024年中国科协十大前沿科学问题第1位“情智兼备数字人与机器人的研究”。主持国基金重点项目，已发表PAMI/CVPR等CCF
  A类论文60余篇。更多信息请参阅我的主页 http://cv.nankai.edu.cn

  2026年保送入学研究生考核已经开始，欢迎感兴趣的同学通过邮件与我联系并提供以下信息：1）个人简历，2）英语六级成绩（建议480分以上），3）计算机视觉实践经验；如果自学过机器学习、计算机视觉书籍或在线课程，阅读过相关英文论文则更好，请一并附上情况介绍。

