bio_raw: '目前 2026 年（2023 级 / 2027 届）保研/直博名额较为充裕，欢迎报考。

  GrokCV 小组隶属于程明明老师领导的媒体计算实验室，可指导 / 联合指导的硕博名额较为充足，具体招生流程请参考程老师大组流程（https://mmcheng.net/recruit/）。若南开名额达到上限，优秀学生可推荐至南京大学/南京理工大学联合培养，师从国家杰青杨健教授、国家优青舒祥波教授。

  GrokCV 是一个研究方向和研究风格都非常鲜明的小组，在报名前请阅读「GrokCV 学术生存手册」(

  https://grokcv.site/group/

  )，并可通过

  https://grokcv.site/people/

  联系在读和往届同学，以确保自己与本小组相性相符。

  GrokCV 学术生存手册（2）：招生说明：https://grokcv.site/group/recruitment/

  GrokCV 学术生存手册（3）：进组须知与 FAQ：https://grokcv.site/group/lab-rules/

  GrokCV 学术生存手册（4）：博士的目标：https://grokcv.site/group/phd-ambition/'
