bio_raw: '2019年和2025年获得南开大学学士和博士学位，目前加入南开百度联合实验室（实验室主页：

  https://nbjl.nankai.edu.cn/

  ），主要研究领域为存储系统、机器学习系统、计算机体系结构，相关研究成果发表在FAST（存储系统领域顶尖学术会议）、SIGMOD（数据库三大顶会）、ICDE、TKDE、TACO、TPDS、TOS、MSST、ICPP、IPDPS
  等相关领域高水平国际期刊和会议上。

  个人主页：lixiao-c.github.io

