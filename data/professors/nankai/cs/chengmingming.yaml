title: 教授
bio_raw: '程明明，

  1985年出生于陕西乾县，现任

  南开大学杰出教授，计算机系主任。主持承担了国家杰出青年科学基金、优秀青年科学基金项目、科技部重大项目课题等。他的主要研究方向是计算机视觉和计算机图形学，在SCI一区/CCF
  A类刊物上发表学术论文100余篇（含IEEE TPAMI论文30余篇），h-index为77，论文谷歌引用4万余次，单篇最高引用4600余次，多次入选

  全球高被引科学家

  和

  中国高被引学者

  。技术成果被应用于华为、国家减灾中心等多个单位的旗舰产品。获得教育部自然科学一等奖2项、其他省部级科技奖2项。培养的3名博士生获得省部级优秀博士论文奖。现担任中国图象图形学学会副秘书长、天津市人工智能学会副理事长和顶级期刊IEEE
  TPAMI, IEEE TIP和《中国科学：信息科学》编委

  。

  通常每年8月中下旬招满下一年度入学的研究生，建议查看个人主页确认还有名额再联系：https://mmcheng.net/'
