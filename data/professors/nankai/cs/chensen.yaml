bio_raw: '陈森，教授，博导，南开百青，担任天津市网络与数据安全技术重点实验室副主任，网络空间安全学会青工委副秘书长，

  南开大学软件安全实验室（

  NKSSecLab

  ）

  负责人。 曾在新加坡南洋理工大学（NTU）从事科研助理教授工作，合作导师为

  Yang Liu（刘杨）

  教授。

  研究领域为

  软件安全

  ，研究方向为

  软件供应链安全

  。 聚焦代码与依赖的供应链安全，缓解漏洞与恶意威胁，构建可信软件。 荣获2026年度

  ACM SIGSOFT Early Career Researcher Award

  （早期生涯研究者奖，亚洲高校首位）。发表网安和软工领域CCF-A类高水平论文60余篇，获得

  CCF-A类国际顶会杰出论文奖7项

  。 参与国家科技重大专项1项，承担GF重点项目课题1项、国家重点研发计划重点专项任务2项、国自然面上项目、天津市科技发展重大专项课题1项、华为胡杨林基金等项目，
  研究工作在国家电网、中汽研、华为等企业落地应用，参与获得天津市科技进步一等奖1项。

  详细信息请参考英文主页: [https://sen-chen.github.io]'
