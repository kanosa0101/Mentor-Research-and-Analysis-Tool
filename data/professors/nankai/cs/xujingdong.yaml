bio_raw: '毕业于南开大学，获学士、硕士、博士学位。目前为南开大学计算机学院、网络安全学院教授、博士生导师，计算机网络与信息安全研究室负责人。计算机学会高级会员，ACM
  China SIGCOMM Chapter委员。主要研究方向包括：计算机网络、移动边缘计算、视频传输、软件定义网络、网络安全等。参加和主持了国家自然基金项目、天津市科技重大专项、天津市自然基金重点项目、博士点基金项目等20余项，近几年在IEEE
  Journal on Selected Areas in Communications (JSAC)、Transactions on Mobile Computing
  (TMC)、IEEE Internet of Things Journal(IoTJ)、IEEE IEEE Transactions on Emerging Topics
  in Computing (TETC)、China Communications、INFOCOM、ACM MM、IWQoS、ICC、GLOBECOM、WCNC等国内外高水平期刊和国际会议上发表论文60余篇，其中SCI一、二区论文10余篇，CCF
  A类论文12篇。在教学方面，多年来一直从事计算机网络的教学工作，目前主要承担本科生的“计算机网络（天津市级线下一流本科课程）”、“网络技术与应用（国家级线下一流本科课程）”课程、硕士生和博士生的“移动计算与无线网络”课程。培养硕士研究生60余名、博士研究生近20名。出版计算机网络相关教材11部，发表教学论文7篇，2009年获天津市教学成果一等奖，2015年被评为南开大学教学名师，2019年获全国高校计算机专业优秀教师，2022年获天津市教学成果特等奖2项。

  近期主持和参加的科研项目：

  超高清视频点播中基于纠删码的边缘云协同传输关键问题研究，国家自然基金，2022.1-2025.12

  面向智慧城市的云-边-端计算智能操作系统关键技术研究，天津市科技重大专项，2018.10-2021.9

  面向金融领域实时交易的区块链平台关键技术研究，天津市科技重大专项，2018.10-2021.9

  移动边缘计算卸载服务中资源管理关键问题研究，国家自然基金，2018.1-2020.12

  面向城市场景的车载自组织网络命名数据传输关键问题研究，国家自然基金，2018.1-2020.12

  面向车载自组织网络的命名数据传输关键问题研究，天津市自然基金项目，2016.7-2019.3

  面向多种类型大数据的实时检测与深度分析，天津市科技重大专项，2014.5-2017.5

