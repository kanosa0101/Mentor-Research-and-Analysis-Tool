bio_raw: '刘晗，南开大学密码与网络空间安全学院副教授，博士生导师，入选南开大学“百名青年学科带头人培养计划”。于2024年6月在华东师范大学获得博士学位，2022年2月-2024年6月在南洋理工大学联合培养，2024年9月-2026年2月在香港科技大学担任博士后研究员，主要从事

  软件安全，智能合约安全，软件供应链安全

  等

  研究，相关成果发表于USENIX Security, ASE, ICSE, FSE, ISSTA, TSE等安全领域与软件工程领域顶级会议与期刊，并在软件工程顶级会议上荣获ACM
  SIGSOFT Distinguished Paper Award。 担任多个国际顶级会议和期刊的审稿人，例如 ACM TOSEM, CyberSecurity,
  ICSE等。

  详细信息请参考英文主页：

  https://helayliu.github.io/

  课题组目前已无2027入学硕博名额

  ，欢迎有志于在本科阶段开展科研训练、希望尽早参与高水平科研实践的本科生加入团队。 邮件请发送到hanliu AT nankai DOT edu DOT cn.'
