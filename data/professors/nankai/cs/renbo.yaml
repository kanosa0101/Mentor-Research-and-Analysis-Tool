bio_raw: '任博于2015年于清华大学计算机科学与技术系获得工学博士学位。2015年7月至今于南开大学计算机系任教。主要研究领域为计算机图形学，计算机视觉，具身智能。近期研究方向包括基于物理/基于机器学习的流体模拟，三维场景重建与内容生成等。指导学生在国际顶级期刊会议（中科院一区，CCF
  A类）ACM TOG，SIGGRAPH，TVCG，TIP，CVPR，ICCV等发表文章二十余篇。

  入选中国图学学会青年托举计划，天津市“131”人才梯队，南开大学百名青年学科带头人培养计划。主持或参与多项国家自然科学基金青年/面上项目，国家重点研发计划课题与国家重点实验室开放课题。

  担任国际期刊Computers & Graphics编委，图形学顶级会议SIGGRAPH Asia 论文委员会委员。

  多次在国内图形学界会议（如CAD/CG大会、GAMES论坛等）上应邀进行或主持专题报告。参与ACM TOG，ACM SIGGRAPH，TPAMI，TVCG，CGF，JCST，CVM，CASA等期刊、会议的审稿，并担任SIGGRAPH
  Asia，CVM，Pacific Graphics等图形学国际会议的分会场主席， CVM，CASA，CAD Graphics会议论文委员会成员。

  国内学术服务性任职：

  中国图学学会理事会青年工作委员会委员，国际联络工作委员会委员

  CCF CAD&CG专委会委员

  CSIG智能图形专委会委员

  详细论文列表请访问主页http://ren-bo.net 。

  (注：因为没有给https机构交保护费，部分浏览器可能会声称网页“不安全”，聪明的同学你一定懂得怎么忽略这种“警报”）

  团队每年接收博士和硕士研究生数名，长期接收南开本科生（年级、专业不限）提前加入课题组（其他学校同学也欢迎远程）进行学术科研训练

  ，表现优秀者将获得校内保研或至国内外优秀课题组深造推荐机会。团队长期欢迎来自国内院校的相关方向研究生来南开访问交流。

  正在招收2027年入学年度的推免硕士生与直博/普博生

  （图形学流体仿真、三维视觉方向）

  ，希望通过自己的研究给人留下深刻印象的同学，欢迎通过邮件投递简历。

  敬请期待2028年度招生。

  此外，真诚建议各位同学进组/保研时不要只联系教授，多关注我院的讲师与副教授，他们非常有水平，大多只是因为年头没熬够。

  News:

  · （26.08）1篇论文被Pacific Graphics录用(CGF journal track)，近日将于个人主页公开。

  · （26.04）2篇论文被SIGGRAPH 2026大会conditionally accept，详见个人主页。

  · （26.03）2026年度CCF图形学启明星夏令营已开始启动筹备，感兴趣的同学敬请关注（4-5月份的）后续通知。

  · 1篇论文被TVCG录用，详见个人主页。

  · 1篇论文被SIG Asia大会录用(conference track)，详见个人主页。

  · 指导学生团队的大创作品获南开“校长杯”三等奖并入围天津市“挑战杯”大赛。

  · 1篇论文被SIGGRAPH 2025大会conditionally accept并发表于ACM TOG，详见个人主页。

  · 1篇论文被IEEE TPAMI录用，详见个人主页。'
