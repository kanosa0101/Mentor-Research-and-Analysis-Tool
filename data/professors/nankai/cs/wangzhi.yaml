bio_raw: '王志，教授，博士生导师，研究兴趣为计算机病毒分析与防治、二进制代码逆向分析。 项目组持续招聘多名科研助理、博士后，招收博士、硕士研究生，简历发送至zwang@nankai.edu.cn。

  研究工作经历：

  2012.7至今

  ：南开大学 密码与网络空间安全学院

  讲师、副教授、教授

  ，研究计算机病毒分析与防治技术、计算机病毒组件分析、威胁情报繁殖技术、针对机器人、无人机、工业控制等场景计算机病毒分析、大语言模型相关病毒分析；

  2005.3-2007.7

  : 美国Fortinet公司 反计算机病毒实验室

  病毒分析工程师

  ，手工分析DOS病毒、Windows病毒、Linux病毒、Word宏病毒、PHP脚本病毒等，基于FortiClient和FortiGate平台编写病毒检测规则，病毒事件应急响应；

  2009.6-2010.6

  : 新加坡管理大学(SMU) 信息系统学院(SIS) 信息安全实验室,

  Research Staff

  , 合作导师 Prof. Debin Gao，研究基于符号执行、污点分析、约束求解等形式化推理和验证技术的计算机病毒自动分析；

  2013.12-2015.12

  :英国伦敦大学皇家霍洛威(RUHL) 信息安全组(ISG)

  博士后

  , 合作导师 Prof. Lorenzo Cavallaro，研究基于机器学习算法分析和检测海量计算机病毒样本、计算机病毒的概念漂移问题。

