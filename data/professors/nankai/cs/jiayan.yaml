  项目资助：

  (1) 消费物联网设备逻辑漏洞挖掘与检测技术研究. 中国博士后科学基金第69批面上资助二等， 主持，8万

  (2) 碎片化消费物联网访问控制脆弱性分析. 国家自然科学基金青年科学基金项目. 2022-01 至 2024-12，主持，30万

  (3) AI+IoT安全发展战略研究. 中国新一代人工智能发展战略研究院开放课题，主持

  (4) 中国博士后科学基金第16批特别资助（站中），主持，18万

  (5) 状态驱动的灰盒物联网系统逻辑漏洞动态挖掘研究. 国家自然科学基金面上项目. 2026-01至2029-12，主持，63.8万

  (6) 面向电力场景的网络安全威胁感知技术研究. 企业横向. 2025-11至2026-11，主持，68.5万

