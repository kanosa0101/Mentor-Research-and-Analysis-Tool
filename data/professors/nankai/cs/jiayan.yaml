bio_raw: '南开大学百名青年学科带头人，副教授，博导。2020年12月于西安电子科技大学获信息安全专业博士学位，2018.11 - 2020.7于美国印第安纳大学XiaoFeng
  Wang研究组联合培养。中国计算机学会（CCF）计算机安全专业委员会、网络与系统安全专业委员会执行委员，中国中文信息学会大数据安全与隐私计算专业委员会委员，ACM、IEEE会员。曾获ACM中国新星奖（天津），天津市科学技术进步一等奖、二等奖，国家电网有限公司技术发明三等奖等奖励；指导本科生获全国大学生信息安全竞赛一等奖、全国密码技术竞赛一等奖。本人感兴趣的研究方向为探索和发现实际系统设计与实现中的未知安全问题，致力于做具有现实影响力的安全研究，包括漏洞挖掘、物联网安全、应用系统安全与隐私等方向。曾首次发现众多具有国际影响力的物联网平台安全问题，被授予多个CVE、CNVD漏洞编号，获诸多知名厂商认可与致谢（包括Apple、Amazon
  AWS、IBM、Microsoft、Google、Samsung、阿里巴巴、百度、苏宁等），引起OASIS MQTT国际标准委员会重视。相关成果公开发表于

  IEEE S&P，USENIX Security，CCS，Blackhat

  等学术界与工业界系统安全顶级会议，并被DARKReading采访报道。

  研究方向简介：

  （1）物联网安全与隐私（IoT Security & Privacy）：万物互联是未来信息社会发展的重要方向，涉及广泛的实体交互、复杂的技术栈和新应用场景（如智能家居），蕴含着大量的未知安全与隐私风险。此方向关注于研究物联网中尚未被探明的安全与隐私风险，指导未来设计出安全的物联网系统。(论文[1][3-6]]

  （2）漏洞挖掘与脆弱性分析 (Vulnerability Detection & Discovery)：未知攻，焉知防。实际可行的攻击一直在推动现实中的信息系统改进其安全性，也能帮助人们加深对系统本身的理解。此方向关注于研究如何自动化、系统地（以及脑洞大开地）发现系统中的安全漏洞与脆弱性。在理解系统的基础上，逆向分析、程序分析、形式化方法、模糊测试、AI都是帮助我们分析与理解系统的有力工具。(论文[1][3-6])

  （3）应用系统安全与用户侧安全（Application Security & Human Element）：生活中我们面临着各种各样的应用系统，“人”亦是网络空间安全中的重要组成部分。例如，用户对浏览器安全警告的无视、对软件和物联网及嵌入式系统的不安全配置、对App隐私政策的无视、等等。此方向关注于日常生活中的安全与隐私问题，涉及用户调研、安全与隐私可用性设计（Usable
  Privacy）、Web/浏览器安全、移动安全等。(论文[2][3])

  教授课程：

  本科-物联网安全（实验）、本科-网络安全技术（第三批国家级一流本科课程）

