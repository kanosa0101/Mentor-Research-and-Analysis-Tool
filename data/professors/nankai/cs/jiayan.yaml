  实验室具有自由平等的科研氛围，与国内外知名高校具有良好合作关系。

  欢迎本科所有年级同学与我邮件/飞书联系，加入实验室实习、合作大创与学科竞赛。

  预计可招收2027年入学博士1名，硕士1~2名，欢迎投递简历至邮箱联系！

  希望你：

  对网络系统安全与攻防技术热爱并感兴趣（self-motivated），喜欢动手实践

  诚实守信，讲道理，能沟通

  有责任心

  具有安全实践类竞赛获奖、0 day漏洞、论文项目经验的同学优先考虑

