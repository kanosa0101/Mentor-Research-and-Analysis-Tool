bio_raw: '1 个人介绍

  姜智卓，南开大学计算机学院百青副教授、博士生导师，主要研究方向为

  跨域数据融合，多模态数据处理，遥感图像处理

  等。在国内外权威期刊和学术会议上发表30余篇SCI/EI文章，申请发明专利30余项，已授权10余项。入选

  中国科协青年人才托举工程

  ，

  主持国家自然科学基金青年基金项目

  ，

  国家自然科学基金重大项目子课题，中国博士后科学基金特别资助项目

  ，

  作为异质数据融合专题负责人参与部委重点项目

  ，作为项目骨干成员参与国家自然科学基金委基础科学中心项目、重大项目，国家重点研发计划项目课题等国家及省市重大科研课题6项，

  荣获中国仿真学会创新技术一等奖

  、

  全国人工智能应用场景创新挑战赛全国总决赛特等奖

  及

  智能遥感专项赛特等奖。

  担任中国人工智能学会智能融合专委会秘书及委员，中国指挥与控制学会空天大数据与人工智能专业委员会委员、具身智能专委会委员，担任多个IEEE Trans期刊审稿人。

  面向电子信息、计算机、人工智能、数学等相关专业招收学博、专博和学硕、专硕，简历发送至：jiangzhizhuo@nankai.edu.cn。

  2 教育工作经历

  2025.09至今   南开大学      百青副教授，博导；

  2022.03-2025.09 清华大学      博士后   合作导师：何友院士

  2016.09-2022.01 清华大学      博士     导师：何友院士

  2010.09-2016.07 哈尔滨工业大学 本科+硕士

  3 招生信息

  本人2026年度第一次招生，招生按照程明明老师大组流程统一进行，程老师对于招生有清晰的文档说明：

  攻读硕士/博士：

  请查阅本组招生说明（https://mmcheng.net/recruit/）；

  本科生实习：

  请查阅本组实习生（新芽训练营）招募说明（https://mmcheng.net/undergraduate/）

  对于攻读博士研究生、硕士保研和本科实习，联系我时，请把个人简历、成绩单、科研证明材料一同发送至邮箱。

  需要着重提示的是，

  本小组科研任务较重

  ，更强调自主学习和自我驱动。此外，相较于专业能力，本小组格外注重申请者的

  做事情的态度、学术诚信和责任心

  。以下是对未来学生的预期：

  招生偏好：

  本小组以博士生为主，欢迎有志于攻读博士学位的保研同学；

  工作任务：

  本小组同学除科研工作外，均需承担项目任务，研究方向均来自国家及一线需求提炼出的科学问题；

  学生画像：

  有家国情怀，对学术钻研有热忱，乐观积极向上，有责任心、有担当；

  招生时段：

  大组每年八月中旬线下面试，为给前两轮线上面试预留充足时间，建议保研同学尽早联系；

  出差提醒：

  由于真实数据、计算资源等原因，本小组同学偶尔需要出差进行模型训练测试及算法部署等工作；

  毕业要求：

  从支撑博士/硕士学位论文的角度，对于博士，至少需要2篇SCI论文/A类会议论文且需为业内认可的工作（水刊劝退）；对于硕士：至少需要2篇业内认可的工作；

  工作推广：

  本小组沿袭团队的风格，所有论文不仅代码、权重、训练日志必须开源，还需提供论文中文翻译、中文解读博客、中文讲解视频，并及时回复 Github Issue。

  其他说明：

  本小组同学有机会到北京与清华大学同学一起工作、交流。

  请自我对照上述说明，若缺乏较强的自驱力和时间管理能力，或者并不认同本小组的风格和要求，请慎重联系。

