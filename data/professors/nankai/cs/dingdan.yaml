bio_raw: '丁丹，博士，南开大学计算机学院/密码与网络空间安全学院杰出教授，博士生导师，中组部国家特聘专家，北京市“海聚工程”特聘专家，海淀区“海英”人才，2018年度美国《财富》杂志中国“40岁以下40名商界精英”，毕业于清华大学计算机科学与技术系和美国加利福尼亚大学（戴维斯）计算机与电子工程系，曾参与国家973、863、航天、国家自然科学基金重大项目，以及美国自然科学基金、美国能源部和著名企业研发项目。主要研究方向：抗量子密码、全同态加密、计算机视觉、机器学习（深度学习）和神经网络、具身智能和机器人、人工智能芯片和密码芯片

  面向计算机、电子、密码和网络空间安全、数学专业招收2026级学博、专博和学硕、专硕，以及博士后，简历发送至：dingdan@nankai.edu.cn。

  本项目组常年招聘教授、副教授、讲师、研究员、副研究员，欢迎海内外优秀人才加入，欢迎依托南开大学申报海优人才，联系邮箱同上。'
