bio_raw: '工学博士，南开大学数据库与信息系统研究室成员，博士生导师。长期从事数据库系统实现、信息检索、知识图谱、信息系统集成等方向教学研究工作。主持国家基金面上项目1项、天津市项目2项、国家工程中心课题1项。在IJCAI、SIGIR、EMNLP、COLING、IEEE
  TII等高水平会议和期刊发表论文40篇，第一/通讯作者21篇(含SCI一区1篇、CCF A类会议3篇、SCI二区1篇、CCF B类会议7篇）；第一作者获授权发明专利7项、软件著作权4项，参与2项专利技术许可；主讲本科/研究生课3门，指导博士3名、硕士23名(毕业14名)；获国家一流本科课程、天津市科技进步一等奖、天津市优秀科技特派员等省部级及以上奖励4项、校级/协会奖励10项。

  研究室招收学术硕士、专业硕士和直接攻博研究生，欢迎计算机、信息安全、软件工程、自动化、智能等信息技术相关专业的保研和考研同学加盟。

  接收24年入学推免硕士生及博士生，实验室介绍：https://s.wcd.im/v/1rjnnZ3r/

  报名链接：http://nku-dbis.mikecrm.com/GFRRNqq'
