bio_raw: '刘哲理，博士（后），计算机学院院长、密码与网络空间安全学院常务副院长，国家高层次人才，数据与智能系统安全教育部重点实验室主任，宝钢优秀教师，中国新一代人工智能发展战略研究院智能网络安全研究中心主任，中国中文信息学会大数据安全与隐私计算专委会秘书长，南开大学百名青年学科带头人、天津市中青年科技领军人才

  ，

  教授，博士生导师。近五年，发表Usenix Security、CCS、NDSS、S&P、Eurocrypt、VLDB、ASE、ISSTA、IEEE TDSC、IEEE
  TKDE、IEEE TIFS、IEEE TC、IEEE TSC、IEEE INFOCOM等顶级期刊论文和会议40余篇，有11篇ESI高被引论文、2篇热点论文。主要研究方向为数据安全、人工智能安全等。

  目前主持国家自然科学基金重点项目、国家重点研发计划项目、国家密码科学基金重点项目、国防科技创新项目重点、工信部工业互联网创新工程等纵向课题10余项，与多家知名信息安全企业建立了合作关系，

  是华为数据库、腾讯广告的紧密合作伙伴，

  建立了“数据安全联合实验室”，主持智能卡操作系统、信息安全相关的横向课题20多项。获评天津市科技进步一等奖2项、二等奖3项，1项中国密码学会密码创新奖。

  目前主要在研的课题如下：

  1、

  基于密码学的数据隐私保护研究

  ：访问行为模式保护ORAM、密态数据集合运算、差分隐私等。

  2、

  密态数据库

  ：可搜索加密、SGX与密态数据计算等。

  3、

  人工智能安全

  ：人工智能后门攻击，联邦机器学习及隐私保护的机器学习算法研究。

  目前与腾讯、华为开展密文集合运算、数据脱敏、密态数据库的应用研究。 我有足够的科研经费、也盛产高水平论文，如果你对我的课题感兴趣并有志于从事信息安全方面的研究工作，欢迎与我联系（地址在计算机学院606、627），提前进入实验室实习。

  目前研究生指标充裕，有意向者可以和我联系。

