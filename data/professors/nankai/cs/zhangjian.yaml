bio_raw: '博士，南开大学密码与网络空间安全学院、计算机学院教授、博导，天津市网络与数据安全技术重点实验室副主任。兼任中国网络空间安全协会理事、副秘书长，中国网络空间安全协会竞评演练工作委员会副主任委员、中国计算机学会计算机安全专委会委员、天津市网络空间安全协会理事长等。曾任国家计算机病毒应急处理中心和计算机病毒防治产品检验中心常务副主任、亚洲反病毒者协会（AVAR）副主席，天津理工大学网络空间安全研究院院长等。长期从事我国计算机病毒防治、监测预警、应急处理技术、数据安全、人工智能安全的研究和网络犯罪打击防范工作，曾代表病毒中心向胡锦涛同志汇报我国计算机病毒防治工作。先后主持19项国家重点研发计划网络空间安全专项、国家“863”、国家发改委信息安全专项等国家和省部级项目。在TIFS、

  NeurIPS、

  ICASSP、EMNLP、Computers & Security等会议和期刊发表近50篇论文，先后主持多个国家和公安部行业标准编制工作，获得多项国家发明专利和软件著作权。曾获得公安部科学技术二等奖，“中国软件行业杰出青年”提名奖，天津市青年科技人才奖，天津市五一劳动奖章，天津市教学成果二等奖等。

  详细个人介绍和招生信息：

  欢迎访问南开大学张健教授主页'
