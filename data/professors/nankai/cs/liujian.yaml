bio_raw: '刘健，教授，博士生导师，南开大学大数据技术研究所副所长、药物化学生物学全国重点实验室PI。

  研究方向：

  长期从事人工智能、生物医药大数据、生物信息学等IT+BT交叉领域研究，近年来主要聚焦于肿瘤细胞图谱构建与多组学解析、肿瘤智能筛查与风险评估、肿瘤微生物组鉴定及人体微生物-宿主互作研究。

  工作经历：

  2014年-2019年 哈尔滨工业大学 计算机学院 讲师、副教授

  2019至今 南开大学 计算机学院 教授

  国家级/省部级重要科研项目：

  近年来完成/承担国家863计划、国家重大专项、国家重点研发计划、国家自然科学基金、天津市重点项目等科研项目10余项：

  1、国家863计划重大项目，生物大数据表述索引、搜索与存储访问关键技术研发（2007万）

  2、国家重大专项项目，新药信息化技术平台研究（544万）

  3、国家重点研发计划项目，微生物大数据分析技术与关键算法研发（329万）

  4、国家重点研发计划项目，面向合成生物系统的人工智能算法研究与应用（277万）

  5、国家自然科学基金项目，海量变异数据管理关键技术研究

  6、国家自然科学基金项目，

  人体微生物精细鉴定、注释可视化与多组学整合分析关键技术研究

  人才培养：

  近年来在

  Cell子刊、

  Nature Communications

  、Advanced Science、Nucleic Acids Research、

  Signal Transduction and Targeted Therapy、

  IEEE Transactions

  系列期刊等发表高水平论文60余篇，培养硕士、博士研究生以及国际留学生多人。

  招收计划：

  每年计划招收博士后1-2人，博士生2人，硕士生3人，硕博联合培养研究生1-2人。具有充足的科研经费支持，根据科研需要鼓励和资助参与国内外学术交流以及赴海外合作课题组进修。

  2026研究生推免招生名额所剩有限

  ，欢迎对人工智能、IT+BT、生物医药大数据、生物信息学等感兴趣的计算机软件相关专业同学尽早与我联系

  （jianliu@nankai.edu.cn)

  ，联系地址：天津市津南区海河教育园区同砚路38号南开大学计算机学院518、522室。详情请见中心主页：

  http://bio.nankai.edu.cn/index.html'
