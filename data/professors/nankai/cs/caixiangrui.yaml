bio_raw: "招生信息\n2027年推免研究生招生已启动。\n本科生科研实习：\n如果你对数据挖掘或者AI安全感兴趣，希望在本科期间发表高水平论文，欢迎与我联系，我们更看重科研兴趣和自驱力。\n\
  教育和工作经历\n2023至今，南开大学，计算机学院，副教授\n2019-2022，南开大学，网络空间安全学院，讲师\n2015-2017，新加坡国立大学，计算机科学，联合培养博士生，导师（Prof.\
  \ Beng Chin Ooi （黄铭钧教授））\n2013-2018，南开大学，计算机科学与技术，工学博士\n2009-2013，南开大学，信息安全，工学学士\n\
  研究兴趣\n我们聚焦于\n以数据为中心的智能系统（Data-Centric Intelligent Systems）\n，研究数据如何驱动智能系统的能力与行为，并保障其在真实场景中的可靠性与安全性，主要包括：\n\
  数据构建：\n研究高质量数据的构建方法，包括异构数据的合成、表示、筛选与评估，提升LLM与Agentic Systems的能力与泛化性。\n可信系统：\n研究系统鲁棒性与安全机制，聚焦模型安全攻防、用户行为建模与异常检测，提升系统在真实环境中的可靠性。\n\
  场景应用：\n面向智慧医疗、网络安全与社交媒体等复杂场景，构建安全可靠的智能系统解决方案。\n在研项目\n国家自然科学基金委员会，青年科学基金项目，电子医疗记录分析模型构建及其可解释性研究，2021-2023，结题，主持\n\
  天津市自然科学基金委员会，青年科学基金项目，电子医疗记录可解释分析关键技术研究，2020-2022，结题，主持\n国家自然科学基金委员会，联合基金重点项目，融合地理空间数据的人物行为与事件演化，2020-2023，结题，参与\n\
  中华人民共和国科学技术部，科技创新2030-“新一代人工智能”重大项目，跨模态医疗分析推理技术与系统，2019-2023，结题，参与\n中华人民共和国科学技术部，“网络空间安全治理”重点专项，\n\
  重要数据分类、识别与安全评估技术，2022-2025，在研，参与\n国家自然科学基金委员会，面上项目，跨域用户行为细粒度异常检测与可解释溯源，2026-2029，在研，主持\n\
  国家自然科学基金委员会，专项项目，数字技术支持下慢性病共病健康医疗服务动态监测和干预策略研究，2024-2027，在研，参与\n\uFEFF\n发表论文\n个人网站：https://dbis.nankai.edu.cn/2023/0322/c12139a506911/page.htm\n\
  Google Scholar: https://scholar.google.com/citations?user=Y9vuweEAAAAJ&hl=zh-CN"
