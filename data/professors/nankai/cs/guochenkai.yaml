bio_raw: '简介：

  副教授，博士生导师，CCF高级会员，软件工程、计算机安全、大数据分析、媒体取证与信息安全专委会执行委员，天津市（信创）海河实验室双聘研究员，天津市131工程创新人才、天开高教科技园高端创新人才。在智能软件工程、移动软件安全等领域具有多年研究经验。主持国家自然科学基金面上/青年、天津市自然科学基金面上/青年、天津市科技计划项目、省部级重点实验室开放课题等科研项目20余项。以第一或通信作者发表包括ICSE、ASE、ISSTA、TDSC、TSC、SIGIR、计算机学报等高水平期刊或会议论文40余篇，获得天津市科技进步二等奖1项、授权国家发明专利13项。荣获南开大学“教书育人”先进个人、南开大学“优秀班导师标兵”等称号，指导获得全国信息安全作品赛一等奖、最具投资价值奖，全国软件测试大赛二等奖，“兴智杯”人工智能大赛一等奖等奖项。

  欢迎对智能软件工程、信息安全有兴趣的同学可提前与我联系。课题组经费充足，科研氛围浓厚，根据研究情况给予丰厚津贴~

