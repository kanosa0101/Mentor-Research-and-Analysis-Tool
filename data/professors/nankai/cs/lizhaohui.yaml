bio_raw: '2000——2003，南开大学 信息技术科学学院 自动化系，博士研究生。

  2003.7——2018.4，南开大学 计算机与控制工程学院 计算机科学与信息安全系，副教授。

  2013——2014，美国 Baylor College of Medicine（贝勒医学院），生物信息学，访问学者。

  2018.5——今，南开大学 网络空间安全学院 信息安全系，副教授。

  主持或参与的科研项目：

  1、工业互联网数据可信交换共享服务平台项目，2020.11,工信部；

  2、信息安全本科专业在线课程建设，2019.3-2019.12，校级项目；

  3、针对恶意代码概念漂移问题的对抗学习方法研究，2019-2022，国家自然科学基金项目（面上）；

  4、保留格式及查询能力的云加密方案研究，2017-2020，国家自然科学基金项目（面上）；

  5、复杂网络环境下基于本体的计算机病毒自适应建模方法研究,国家自然科学青年基金（61004086），2009.8-2012.8；

  6、智能手机病毒传播原理及防治方法研究,天津自然科学基金（08JCYBJC12800）,2008.4-2011.3；

  7、复杂网络下基于语义建模的智能病毒防御技术研究,教育部博士点；

  8、基于保守混沌系统的新密码理论与方法研究,天津市自然科学基金，2007.4-2009.12；

  9、智能手机病毒的传播机理与防范研究,南开大学创新基金项目，2007.1-2008.12；

  10、混沌化理论用于多媒体信息加密的研究,天津市自然科学基金（023601411）,2002.7-2004.12；

  发表论文30余篇、软件著作权两项、编著或参编教材近十本。

  1、Zhaohui Li, Yiqing Wang, Zhi Wang, Zheli Liu, Jian Zhang, Min Li，Reversible Information
  Hiding Algorithm Based on Multi - Key Encryption，Wireless Communications and Mobile
  Computing，

  Published 16 November 2020；

  2、

  Ying-Wooi Wan, John Nagorski, Genevera Allen,

  Zhaohui Li

  , Zhandong Liu “Identifying Cancer Biomarkers through a network regularized cox
  model,”

  IEEE International Workshop on Genomic Signal Processing and Statistics (GENSIPS)

  , 2013. [

  pdf

  ]

  3、Yuan-Hung Lo, Eunah Chung,

  Zhaohui Li

  , Ying-Wooi Wan, Maxime M. Mahe, Min-Shan Chen, Taeko K. Noah, Kristin N. Bell,
  Hari Krishna Yalamanchili, Tiemo J. Klisch, Zhandong Liu, Joo-Seop Park, Noah F.
  Shroyer, “Transcriptional regulation by ATOH1 and its target SPDEF in the intestine”, Cellular
  and Molecular Gastroenterology and Hepatology, 2016.

  主讲课程：《信息对抗技术》《信息隐藏技术》等。

  担任《中国图形图象学报》、《电子信息学报》、《传感技术学报》、《西安交大学报》等多个刊物的审稿工作。'
