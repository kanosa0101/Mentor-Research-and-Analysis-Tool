bio_raw: '分别于清华大学和东京大学获学士学位和博士学位。2008年至2014年任东京大学生产技术研究所特任教员（历任助理教授、副教授）。2014年4月起任南开大学教授，大数据研究所所长，入选南开大学百人计划。研究方向为人工智能，大数据挖掘，自然语言处理和信息检索。具体研究内容包括时空数据挖掘，序列模式挖掘，问答系统，相似短语查找，推荐系统等。

  大数据所网页:

  http://bigdata.nankai.edu.cn'
