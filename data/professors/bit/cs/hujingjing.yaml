bio_raw: '个人信息

  胡晶晶，女，博士，北京理工大学计算机学院副教授，博士生导师。2005年于北京理工大学获计算机应用技术博士学位。目前主要从事网络安全、人工智能等领域的教学与科研工作。主持国家自然科学基金两项，其中结题1项，在研1项；主持国家重点研发计划两项，其中课题1项，子课题1项；主持并完成北京市青年英才项目；主持北京理工大学基础研究基金三项。在国内外学术刊物及会议上发表论文50余篇，其中SCI检索20余篇，EI检索30余篇。2009年获“北京理工大学软件学院最优秀教师”称号，2013年入选“北京市青年英才计划”。

  News: 每年计划招收博士生1人、硕士研究生3至4人，同时欢迎优秀的本科生加入实验室。

  科研方向

  智能安全、可信服务组合、智能规划

