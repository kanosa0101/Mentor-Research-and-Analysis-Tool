bio_raw: '个人信息

  吴心筱，博士，教授，博士生导师。在2010年7月在北京理工大学获得计算机应用技术工学博士学位，并获得北京理工大学优秀博士学位论文奖。2010年至2011年赴新加坡南洋理工大学计算机学院从事博士后研究。2011年12月加入北京理工大学计算机学院。2012年获得全国人工智能学会优秀博士学位论文奖。2013年入选校级优秀青年教师资助计划。在计算机视觉与人工智能顶级国际会议ICCV,CVPR,
  NeurIPS,ACM MM,AAAI,IJCAI以及SCI收录国际重要学术期刊IJCV, IEEE TIP, IEEE TNNLS, IEEE TMM, IEEE
  TCSVT, IEEE TCYB上发表多篇论文。负责国家自然科学基金，教育部博士点基金等多项科研项目。主要从事机器学习、计算机视觉、图像视频内容理解方向的研究。

  科研方向

  机器学习、计算机视觉、人工智能、图像视频内容理解

  代表性学术成果

