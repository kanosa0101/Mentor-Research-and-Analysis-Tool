  承担科研情况

  负责国家自然科学基金面上项目，国家自然科学青年基金，教育部博士点基金，北京理工大学优秀青年教师资助计划，北京理工大学基础研究基金；参与国家自然科学基金重大计划培育项目和国家973等项目。

