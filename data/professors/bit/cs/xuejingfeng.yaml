bio_raw: '个人信息

  薛静锋，教授，博士生导师。1998年7月毕业于北京理工大学计算机科学工程系，获学士学位，2003年4月毕业于北京理工大学计算机科学工程系（硕博连读），获博士学位，后留校工作。2005年11月至2006年11月受国家留学基金委资助，在美国加州大学圣迭戈分校（UCSD）做访问学者。2005年受聘副教授，2012年受聘教授。现任北京理工大学计算机学院副院长，软件评测中心主任，国家级大学计算机虚拟仿真实验教学中心主任，大学计算机公共课程群虚拟教研室负责人。

  科研方向

  网络安全，数据安全，软件安全，软件测试

  代表性学术成果

  [1] Huang Lu, Xue Jingfeng, Wang Yong, Chen Junbao, Lei Tianwei. Strengthening LLM
  ecosystem security: Preventing mobile malware from manipulating LLM-based applications.
  Information Sciences, 2024

  [2] Lei Tianwei, Xue Jingfeng, Wang Yong, Baker Thar, Niu Zequn. An empirical study
  of problems and evaluation of IoT malware classification label sources. Journal
  of King Saud University-Computer and Information Sciences, 2024

  [3] Niu Zequn, Xue Jingfeng, Wang Yong, Lei Tianwei, Han Weijie, Gao Xianwei. QARF:
  A Novel Malicious Traffic Detection Approach via Online Active Learning for Evolving
  Traffic Streams. Chinese Journal of Electronics, 2024

  [4] Chen Junbao, Xue Jingfeng, Wang Yong, Huang Lu, Baker Thar, Zhou Zhixiong. Privacy-Preserving
  and Traceable Federated Learning for data sharing in industrial IoT applications.
  Expert Systems with Applications, 2023

  [5] Kong Zixiao, Xue Jingfeng, Wang Yong, Zhang Qian, Han Weijie, Zhu Yufen. MalFSM:
  Feature Subset Selection Method for Malware Family Classification. Chinese Journal
  of Electronics, 2023

  承担科研情况

  国家自然科学基金项目：恶意代码演化机理及检测方法研究

  山东省重点研发计划项目：面向石油行业的安全可信云与动态态势感知系统建设及应用示范

  国家重点研发计划课题：虚实结合的沉浸式学习环境搭建

  高等学校博士学科点专项科研基金：基于有限自动机的软件行为建模及模型评价方法研究

  所获奖励

  北京市高等教育教学成果奖二等奖

  中国人工智能学会教学成果奖一等奖

  北京市课程思政示范课程

  北京高等学校优质本科教材

  北京市普通高校本科毕业设计（论文）优秀指导教师

  社会兼职

  教育部大学计算机课程教指委委员

  全国高等院校计算机基础教育研究会常务理事、理工专委会秘书长

  中国人工智能学会理事、智能信息网络专委会秘书长

  备注'
