bio_raw: '个人信息

  单纯，博士，副教授，计算机科学与技术、网络空间安全双学科硕士生导师，近年来一直在北京理工大学从事计算机相关专业的教学和科研工作，2005年8月赴爱尔兰国立高威大学访学1年。目前主要从事软件质量与评测、网络空间安全相关的研究工作。先后主持和参与国家重点研发计划子课题、国家自然科学基金，国家863、北京市科技专项、教育部博士点基金、企业合作等项目。以第一作者/通信作者在国内外期刊、学术会议上发表论文30余篇；获授权专利20余项，软件著作权4项；参编普通高等教育国家级规划教材1部；获省部级技术发明奖一等奖、北京市课程思政示范教学团队、北京理工大学优秀科技成果一等奖、北京理工大学优秀教育教学成果二等奖、北京理工大学青年教师教学基本功比赛优秀选手等多项奖励。荣获北京市总工会“奥运立功标兵”，北京市妇女联合会北京市“三八”红旗奖章。

  科研方向

  软件质量与评测、网络空间安全

