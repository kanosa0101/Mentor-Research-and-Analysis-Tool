bio_raw: '个人信息

  参加国家‘十五’‘十一五’和总装备部等多个纵向课题的研究工作，研究方向为数据挖掘、云计算、大数据应用等。发表学术论文30余篇，EI检索15篇。到校科研经费共计100多万。

  丰富的项目管理与研发经验。精通J2EE及其相关技术、面向对象技术、UML建模语言、分布式软件体系架构设计；精通IT项目开发与管理；对基于企业级Web应用开发有丰富的经验。

  科研方向

  数据挖掘云计算大数据应用软件项目管理

  代表性学术成果

  1．《Decrease of RMI Application Coupling Degree Based on Dynamic Proxy and Interceptor》，北京理工大学学报，英文版。2003年12月。

  2．《基于拦截器实现EJB容器方法调用》，北京理工大学学报，中文版。2004年2月。

  3．《基于JMX的应用服务器构件化设计》，计算机工程，2003.12，第29卷

  4．《基于动态代理提高RMI应用的伸缩性》，计算机工程与应用，2004.4。

  5．《基于JAAS实现分布式仿真应用的安全》，第6届Java技术及应用学术会议。

  6．《基于拦截器技术的中间件结构的设计与实现》，计算机应用研究，2004.5

  7．《基于JAAS实现用户认证和授权服务》，计算机工程与应用，2003.6 第39卷。

  8．《Simulation Resource Selection based on Local Optimization Method in Distributed
  Simulation Repository》，IEEM国际会议，北京。2009年10月。

  9．《IS Development Activities and Methodologies in Practice:A Survey of the IT Sector
  in China》，IEEM2009国际会议，香港。2009年12月。

  10．《A new marginal revenue based scheduling algorithmfor publish/subscribe systems》，ICSSSM2010国际会议，日本东京。2010年06月。

  11．《Chinese Microblog Sentiment Classification Considering Users` Reviews Based
  on Native Bayesian Algorithm》，FCICS 2014国际会议，北京，中国。2014.05

  12．《Comments-attached Chinese Microblog Sentiment Classification Based on Machine
  Learning Technology》，ICIC（国际智能计算学术会议） 2014，太原，中国。2014.08

  13．《DVT-PKM: an improved GPU based parallel K-Means algorithm》ICIC（国际智能计算学术会议） 2014，太原，中国。2014.08

  14．《Cluster center initialization parallel algorithm for K-Means algorithm》 ICCSSE
  2014，济南，中国。2014.04

  15．《Blind source separation of QAM signals by using a novel optimality of the Constant
  Modulus Algorithm》FCICS 2014国际会议，北京，中国。2014.05

  承担科研情况

  1. 高性能环境仿真云计算平台总装预言基金

  2. 系统集成平台设计与开发 447厂

  3. 动员演练-生产计划管理 447厂

  4. 仿真支撑平台技术研究

  所获奖励

  社会兼职

  备注'
