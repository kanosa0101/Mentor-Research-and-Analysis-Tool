bio_raw: '个人信息

  黄河燕，女，1963年10月出生，特聘教授，博士生导师。1983年毕业于武汉测绘学院计算技术专业获学士学位，1986年毕业于国防科技大学软件专业获硕士学位，1989年毕业于中国科学院计算技术研究所获博士学位。后留所工作，先后任助理研究员、副研究员、研究员；1997年至2008年在中科院计算机语言信息工程研究中心任研究员，副主任；2009年至2020年任北京理工大学计算机学院院长；现兼任语言智能处理与内容安全工信部重点实验室主任、北京市海量语言信息处理与云计算应用工程技术研究中心主任、教育部高等学校计算机类专业教学指导委员会副主任委员、中国人工智能学会和中国中文信息学会会士。

  主要科研方向为语言信息处理、大模型垂域应用、信息内容安全，主持承担了国家重点研发计划项目、国家自科基金重点项目、“863计划”项目等20多项省部级及以上科研攻关项目，获得了国家科技进步一等奖、二等奖，北京市科学技术一等奖，中国电子学会科学技术一等奖、中国人工智能学会科技进步一等奖等十余项国家级和省部级奖励，1997年获国务院政府特殊津贴，2014年当选“全国优秀科技工作者”。发表高水平学术论文200余篇，出版学术专著9部，获授权发明专利70余项。指导博士研究生获得中国中文信息学会和中国人工智能学会优秀博士学位论文/激励计划5人次。2021年荣获首届教育部-华为“智能基座”优秀教师奖。

  科研方向

  语言信息处理、大模型垂域应用、信息内容安全

