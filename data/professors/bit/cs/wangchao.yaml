bio_raw: "个人信息\n王焯，博士，特别副研究员，硕士生导师。\n2023年于清华大学计算机系获得工学博士学位，师从王建勇教授（IEEE Fellow, CAAI\
  \ Fellow）。2023年-2024年在蚂蚁集团任高级算法工程师（蚂蚁星），后加入北京理工大学计算机学院脑机接口与类脑智能研究中心。\n在TPAMI、NeurIPS、AAAI、WWW、IJCAI、JAD、JPM等数据挖掘、机器学习以及医疗领域的国际顶级会议和期刊发表论文10余篇，国家发明专利获授权1项。主持和参与国家自然科学基金重点项目、青年项目、科技部国家重点研发计划、江苏省科技计划重点项目等十余项。\n\
  课题组常年与哈佛大学、康奈尔大学、悉尼大学 、加州大学洛杉矶分校、香港科技大学、清华大学、中国科学院计算技术研究所等国际国内顶尖研究团队开展学术合作，与华为中央研究院、理想汽车、国家电网建立了长期校企合作关系。课题组每年招收多名博士和硕士研究生，欢迎对人工智能与脑科学等相关领域研究有兴趣的同学加入。\n\
  科研方向\n类脑智能算法，可解释学习，神经符号学习，大模型复杂推理\n代表性学术成果\n学术论文：\n[1]\nZhuo Wang\n, Wei Zhang,\
  \ Ning Liu, and Jianyong Wang. \"Learning Interpretable Rules for Scalable Data\
  \ Representation and Classification.\" IEEE Transactions on Pattern Analysis and\
  \ Machine Intelligence, 2024. (TPAMI, Full Paper, CCF-A, IF = 20.8)\n[2]\nZhuo Wang\n\
  , Wei Zhang, Ning Liu, and Jianyong Wang. \"Scalable Rule-Based Representation Learning\
  \ for Interpretable Classification.\" Advances in Neural Information Processing\
  \ Systems, 2021. (NeurIPS, Full Paper, CCF-A)\n[3]\nZhuo Wang\n, Wei Zhang, Ning\
  \ Liu, Jianyong Wang. \"Transparent Classification with Multilayer Logical Perceptrons\
  \ and Random Binarization.\" AAAI Conference on Artificial Intelligence, 2020. (AAAI,\
  \ Full Paper, Oral Presentation, CCF-A)\n[4]\nZhuo Wang\n, Jie Wang, Ning Liu, Caiyan\
  \ Liu, Xiuxing Li, Liling Dong, Rui Zhang, Chenhui Mao, Zhichao Duan, Wei Zhang,\
  \ Jing Gao, Jianyong Wang. \"Learning Cognitive-Test-Based Interpretable Rules for\
  \ Prediction and Early Diagnosis of Dementia using Neural Networks.\" Journal of\
  \ Alzheimer's Disease (2022). (JAD, Article, SCI, IF = 4.160)\n[5] Wei Zhang, Junbing\
  \ Yan,\nZhuo Wang\n, and Jianyong Wang. \"Neuro-Symbolic Interpretable Collaborative\
  \ Filtering for Attribute-based Recommendation.\" The Web conference, 2022. (WWW,\
  \ Full Paper, CCF-A)\n[6] Jie Wang,\nZhuo Wang\n, Ning Liu, Caiyan Liu, Chenhui\
  \ Mao, Liling Dong, Jie Li, Xinying Huang, Dan Lei, Shanshan Chu, Jianyong Wang,\
  \ and Jing Gao. \"Random Forest Model in the Diagnosis of Dementia Patients with\
  \ Normal Mini-Mental State Examination Scores.\" Journal of Personalized Medicine\
  \ 12, no. 1 (2022): 37. (JPM, Article, SCI, IF = 3.508)\n[7] Zhichao Duan, Xiuxing\
  \ Li, Zhenyu Li,\nZhuo Wang\n, and Jianyong Wang. \"Not Just Plain Text! Fuel Document-Level\
  \ Relation Extraction with Explicit Syntax Refinement and Subsentence Modeling.\"\
  \ In Findings of the 2022 Conference on Empirical Methods in Natural Language Processing,\
  \ 2022. (EMNLP, Full Paper, findings, CCF-B)\n[8] Bowen Dong*,\nZhuo Wang\n*, Zhenyu\
  \ Li, Zhichao Duan, Jiacheng Xu, Tengyu Pan, Rui Zhang, Ning Liu, Xiuxing Li, Jie\
  \ Wang, Caiyan Liu, Liling Dong, Chenhui Mao, Jing Gao, and Jianyong Wang. \"Toward\
  \ a Stable and Low-resource PLM-based Medical Diagnostic System via Prompt Tuning\
  \ and MoE Structure.\" Scientific Reports, 2023.\n[9] Wei Zhang, Yongxiang Liu,\n\
  Z\nhuo Wang\n, Jianyong Wang. Learning to binarize continuous features for neuro-rule\
  \ networks. In Proceedings of the Thirty-Second International Joint Conference on\
  \ Artificial Intelligence, 2023. (IJCAI, Full Paper, CCF-A)\n[10]\nZhuo Wang\n,\
  \ Rongzhen Li, Bowen Dong, Jie Wang, Xiuxing Li, Ning Liu, Chenhui Mao, Wei Zhang,\
  \ Liling Dong, Jing Gao, Jianyong Wang. Can LLMs like GPT-4 outperform traditional\
  \ AI tools in dementia diagnosis? Maybe, but not today.\n承担科研情况\n[1] 国家自然科学基金青年项目，可解释认知表征启发的大模型可信医疗辅助诊断，30\
  \ 万元，项目负责人；\n[2] 国家自然科学基金重点项目，大模型情感价值对齐认知及可信决策理论研究，231 万元，子课题负责人；\n[3] 江苏省科技计划重点项目，云边端融合的分布式多源协同学习理论方法与关键技术，750\
  \ 万元，项目骨干；\n[4] 科技部国家重点研发计划，不同年龄组痴呆队列、多组学生物标记及病理研究，1700 万元，项目骨干；\n[5] 国家自然科学基金重点基金\t\
  ，大规模关联数据管理的关键技术研究，290 万元，项目骨干；\n[6] 国家自然科学基金面上项目，多模态领域知识图谱的构建及其应用研究，54 万元，项目骨干\n\
  所获奖励\n社会兼职\n曾担任ACM SIGKDD、AAAI、ACM SIGIR、ACM Web Conference、CIKM、WSDM、ICDM、PKDD和PAKDD等国际顶级会议审稿人工作。\n\
  备注\n北京理工大学计算机学院脑机接口与类脑智能研究中心每年招收博士研究生和硕士研究生多名，欢迎感兴趣的同学联系我们！ 本中心常年招收脑机接口与类脑智能方向博士后研究员以及校企联合培养博士后研究员，优秀申请者可以推荐至学校参评特立博后和国际交流项目。\
  \ 此外，本中心长期招收校内外实习生，有继续深造意愿，希望攻读硕士/博士学位，掌握深度学习、脑科学基础、有竞赛经历申请者优先！中心研究经费充足，拥有多台华为昇腾910系列高性能显卡服务器和NVIDIA\
  \ L40S、A100以及H100高性能显卡计算集群，期待加入！最新文章列表可关注：https://scholar.google.com/citations?user=uXC8w-cAAAAJ&hl=zh-CN\n\
  脑机接口与类脑智能研究中心网站：https://bit-brilliant-lab.github.io/"
