bio_raw: '个人信息

  李子遇，北京理工大学计算机学院预聘副教授/研究员，博士生导师。

  主持 / 参与国家自然科学基金青年基金（C类），博士后基金，国家自然科学基金专项项目，国家重点研发计划课题等10余项国家 / 省部级项目，以第一作者 / 通讯作者在顶级期刊和会议发表论文30余篇，获中国脑机接口华瑙奖-年度中国脑机接口十大进展等。

  课题组常年与国际国内顶尖研究团队开展学术合作，并与多家企业建立了长期校企合作关系。每年招收多名博士和硕士研究生，欢迎对人工智能与脑科学等相关领域研究有兴趣的同学加入!

  科研方向

  主要研究领域为：脑功能数据智能解码与类脑智能，旨在通过理解脑、模拟脑、连接脑，最终实现对人类自身的赋能与对智能技术的革新。

