  承担科研情况

  [1] 国家自然科学基金青年项目，面向自然脑机交互的内部言语重建解码关键技术，主持，在研

  [2] 中国博士后科学基金面上项目，大模型驱动的内在言语感知脑机交互关键技术，主持，结题

  [3] 教育部重点实验室课题，大脑多尺度特性启发的决策神经网络理论与方法，主持，结题

  [4] 国家自然科学基金专项项目，人脑高级认知信息的高精度解码算法研究，项目骨干

  [5] 国家自然科学基金重点项目，大模型情感价值对齐认知及可信决策理论研究，项目骨干

  [6] 国家重点研发计划子课题，多模态交互式学习能力评估理论与方法，项目骨干

  [7] 国家自然科学基金重点项目，受大脑认知启发的类脑决策神经网络理论与方法，项目骨干

  [8] JKW重点项目，基于脑功能数据的***提取与***解码，项目骨干

  [9] 北京市自然科学基金重点项目，开放动态环境中基于记忆增强的智能体关键技术研究，项目骨干

  所获奖励

  2025年,中国脑机接口华瑙奖，年度中国脑机接口十大进展。

  2025年, 2th Chinese Conference on Brain-Machine Intelligence, Spotlight Poster

  2024年, 14th international Conference on Brain Inspired Cognitive Systems, Best Student
  Paper Award

  2024年, 1th Chinese Conference on Brain-Machine Intelligence, Spotlight Poster

  社会兼职

  中国神经科学学会   类脑智能分会   委员

  IEEE Member

  长期担任PatternRecognition、Neural Networks、Neurocomputing 等国际权威期刊审稿人，同时受邀担任NeurIPS、AAAI、ICLR、ICML、MICCAI等人工智能与医学影像领域顶级国际会议审稿人，以严谨学术态度参与成果评议，助力领域研究质量提升与学术规范建设。

  备注

  北京理工大学计算机学院脑机接口与类脑智能研究中心每年招收博士研究生和硕士研究生多名，欢迎感兴趣的同学联系我们！ 本中心常年招收脑机接口与类脑智能方向博士后研究员以及校企联合培养博士后研究员，优秀申请者可以推荐至学校参评特立博后和国际交流项目。
  此外，本中心长期招收校内外实习生，有继续深造意愿，希望攻读硕士/博士学位，掌握深度学习、脑科学基础、有竞赛经历申请者优先！中心研究经费充足，拥有多台华为昇腾910系列高性能显卡服务器和NVIDIA
  L40S、A100以及H100高性能显卡计算集群，期待加入！最新文章列表可关注：https://bit-ziyuli.github.io/

  脑机接口与类脑智能研究中心网站：https://bit-brilliant-lab.github.io/'
