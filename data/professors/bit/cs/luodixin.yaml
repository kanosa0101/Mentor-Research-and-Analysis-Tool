bio_raw: '个人信息

  罗迪新，长聘副教授，研究员，博士生导师。于上海交通大学获得学士和博士学位，博士在读期间于美国佐治亚理工学院访学。先后任加拿大多伦多大学和美国杜克大学博士后、研究员。主要研究方向为机器学习与人工智能，尤其是可控视频内容编辑与多模态学习。已发表领域顶级国际会议及期刊论文40余篇，其中以第一作者或通讯作者发表CCF-A类论文20余篇（包括TPAMI、TKDE、CVPR、ACM-Multimedia、IJCAI、AAAI、ICML、NeurIPS等），授权国家发明专利9项，主持国家自然科学基金项目、北京市自然科学基金面上项目、人工智能教育部重点实验室开放课题等。长期担任ICML、NeurIPS、WebConf、AAAI、ACM
  Multimedia等多个国际顶级会议程序委员，及TPAMI、TKDE、TNNLS等顶级期刊审稿人。

  招生计划：招收硕士生和博士生，同时欢迎优秀的本科生加入实验室。

  个人主页：https://dixinluo.github.io/

  科研方向

  机器学习、人工智能

  代表性学术成果

  本页面不常更新，最新科研进展和成果请见：

