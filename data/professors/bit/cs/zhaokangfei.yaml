bio_raw: '个人信息

  赵康菲，北京理工大学准聘教授、博士生导师，入选国家高层次人才。2014于中国科学技术大学计算机学院获工学学士学位，2019年于香港中文大学系统工程与工程管理学系获博士学位。2023年加入北京理工大学，此前先后于香港中文大学担任博士后研究员、腾讯人工智能实验室（Tencent
  AI Lab）担任高级研究员。主要研究方向为数据库、数据挖掘、人工智能。已发表计算机学会(CCF)推荐A类论文近20篇，其中包括数据库及数据挖掘领域顶级会议ACM
  SIGMOD、VLDB、ICDE, NeurIPS, 以及顶级期刊VLDB Journal、TKDE等。

  News: 每年计划招收博士生1名，硕士生2-3名，同时也欢迎对科研感兴趣的高年级本科生加入实验室。

  个人主页：https://kangfei.github.io

  科研方向

  ML/DL for Graphs and Database System, In-Databases ML

  Graph Analytics, Graph Data Management, Graph Algorithms

