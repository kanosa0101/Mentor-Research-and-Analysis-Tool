  承担科研情况

  1) 校企联合项目，数据安全核心技术与产业化推广

  2) 国家电网大数据中心，统计同态加密技术研究

  3) 教育部-中国移动联合基金：大数据安全关键技术研究

  4) 包括国家自然科学基金项目“跨语言文本分类关键技术研究”

  5) 某部级项目 “民族语言信息检索”

  6) 国家自然科学基金重点项目“基于本体的多策略民汉机器翻译研究”

  7) 973项目“互联网环境中文言语信息处理与深度计算的基础理论和方法”

  8) 国家信息中心数据安全项目

  9) 国家税务总局数据安全项目

  所获奖励

  社会兼职

  任国际期刊International Journal of Computer Mathematics（SCI）评阅人，国际期刊IPL（SCI）评阅人，国际期刊AICIT(EI)评阅人，国际期刊Optics
  & Laser Technology（SCI）评阅人，国际期刊GPB编辑，《计算机研究与发展》评审专家。另外为多个国际学术会议评阅人。

  备注

  近期实验室专注数据安全与AI的交叉方向，具体有：UEBA、数据水印与版权、同态加密等。

  实验室招收硕士生和博士生，在研期间，工作时间灵活，可以自由选择在实习基地或者实验室学习，并提供优质的研究和见习补贴。欢迎对数据安全、网络安全、人工智能热点领域感兴趣的同学报考。

  欢迎优秀本科生进课题组实习，目前实验室有本科实习生 10 人。'
