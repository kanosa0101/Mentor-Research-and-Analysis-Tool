bio_raw: '个人信息

  宋丹丹，长聘教授，博士生导师，人工智能教学研究中心主任。国家级青年人才、美国斯坦福大学访问学者、北京市青年英才、微软铸星计划青年学者、北京理工大学优秀青年教师。分别于2004年与2009年7月获清华大学计算机科学与技术系学士与博士学位，系优秀博士毕业生，清华大学综合优秀奖学金获得者。曾于2015年至2016年国家公派访问美国斯坦福大学，与美国科学院院士Wing
  H. Wong教授开展合作研究；2007年至2008年国家公派访问美国加州大学河滨分校，师从算法领域专家、ACMFellow、长江学者Tao Jiang教授。曾作为高级访问学者访问新加坡国立大学、香港城市大学、澳大利亚悉尼科技大学并建立长期合作关系。

  在学生指导方面，指导学生获得国际学术竞赛多项全球第一、国内创新创业比赛优胜奖等，多名学生获得北京市优秀毕业生、国家奖学金，学生论文获得优秀毕业论文等。学生毕业去向包括到美国、英国、澳大利亚、新加坡等国家以及清华大学、北京大学、中科院多个科研院所继续深造，进入字节、阿里、美团、腾讯、百度、京东、滴滴等公司，或中国工商银行、中国农业银行、北京电信、北京计算中心等企事业单位。

  科研方向

  人工智能、知识图谱、自然语言处理、知识增强的大语言模型等

