  承担科研情况

  主持国家自然科学基金青年基金、面上项目、优秀青年科学基金，杰出青年科学基金、联合基金重点项目、北京市杰青项目、广东省杰青项目、教育部霍英东青年教师基金。

  所获奖励

  2023年国家杰出青年科学基金

  2022教育部自然科学二等奖（排名第一）

  2019-2020入选全球前2%顶尖科学家榜单

  2020、2021、2022爱思唯尔中国高被引学者

  2019年北京市自然科学杰出青年基金

  2019 北京理工大学特立青年学者

  2018年国家优秀青年科学基金

  2018年教育部霍英东青年教师基金

  2016年广东省自然科学杰出青年基金

  2016年广东特支计划青年拔尖人才

  2016年深圳市青年科技奖

  2016年哈尔滨工业大学青年拔尖教授

  社会兼职

  担任中国计算机学会（CCF）杰出会员、生物信息学学会生物医学数据挖掘与计算专业组（筹）副主任、广东省生物信息学会常务理事、中国计算机学会生物信息学专业组委员、人工智能学会生物信息学与人工生命专委会委员、国际会议IEEE
  BIBM 2016 Tutorial共同主席、国际会议APBC14、APBC15、GIW/InCoB2015、GIW2016、ICBBB2020程序委员，担任多个国际期刊编委和四十余种SCI期刊的审稿人。

  备注'
