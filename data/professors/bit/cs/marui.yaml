bio_raw: '个人信息

  马锐，博士，副教授，北京理工大学OpenHarmony技术俱乐部主任，北京市课程思政教学名师，北京高校继续教育高水平教学团队带头人，北京理工大学教学名师，在计算机科学与技术/电子信息（软件工程和计算机技术专业）/网络空间安全三个学科和专业招收工学硕士和专业硕士研究生。近年来一直在北京理工大学从事计算机专业的教学和科研工作，2005年8月赴爱尔兰都柏林大学计算机与信息科学技术学院访问1年。目前主要从事模糊测试（协议、二进制软件、操作系统内核等）、代码检测、人工智能可解释性、敏感数据分析等方向的研究工作，主持了科技部重点研发计划课题、工信部产业基础再造和制造业高质量发展专项、北京市科技专项、CCF-鲲鹏基金、中科院网络测试技术重点实验室开放基金、国家铁路智能运输系统工程技术研究中心开放课题等项目，作为实际负责人主持了科技部重点研发计划课题，并作为主要研究人员参与了科技部重点研发计划项目、863计划项目、国防基础科研计划重点项目及国防科技工业预先研究项目等多项国家级和省部级项目，其中“云边协同的网络安全智能运营决策关键技术研发与应用”获“CCF科技成果奖”科技进步二等奖，“辅助决策支持系统开发工具的研究”获兵器工业集团公司科学技术奖三等奖；参与国家人工智能标准化总体组全国信标委人工智能分委会组织编写的《人工智能伦理治理标准化指南》，在国内外期刊、学术会议上发表论文70余篇，获授权国家发明专利40余项；出版著译10余部，《人工神经网络原理》获北京市精品教材，获北京高校第四届青年教师教学基本功比赛理工组三等奖，北京市高等教育教学成果二等奖三项。

  科研方向

  网络空间安全/人工智能/软件工程/OpenHarmony

