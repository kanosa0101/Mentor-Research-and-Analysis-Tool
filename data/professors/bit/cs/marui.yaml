  备注

  实验室已建立良好的复杂计算环境，配备了多台高性能服务器和工作站，具备多核专业级处理器（12代i9、至强W-2250、至强Gold 6248R等）、主流高端显卡（如
  RTX A6000，RTX 3090、RTX 3080Ti等）、大容量内存和快速存储系统，具备高速稳定的网络连接，内部网络环境和存储服务器（NAS）便于师生合作和资源共享，我们的实验室为研究生提供了广阔的研究空间和机会，鼓励有志于深入研究和探索的学生报考，与我们一起共同推动科学的进步和创新的发展！'
