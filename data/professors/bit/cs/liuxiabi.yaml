  [5] Han M, Pan L, Liu X. MA-Net: Rethinking Neural Unit in the Light of Astrocytes[C].
  Proceedings of the AAAI Conference on Artificial Intelligence (AAAI). 2024, 38(3):
  2040-2048.

  [6] Hai Z, Pan L, Liu X, et al. L2T-DLN: learning to teach with dynamic loss network
