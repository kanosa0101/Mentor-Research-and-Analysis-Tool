bio_raw: '个人信息

  刘峡壁，男，博士，教授，博士生导师。1972年10月生。2005年3月获北京理工大学计算机应用技术专业工学博士学位。博士学位论文为北京理工大学优秀博士学位论文。2005年3月至2008年7月任北京理工大学计算机学院讲师，2008年7月晋升副教授，2009年入选教育部新世纪优秀人才支持计划，2010年4月获聘博士生导师，2021年7月晋升教授。

  目前主讲本科生与研究生《人工智能》课程。目前主要科学研究兴趣包括机器学习、计算机视觉、模式识别、医学人工智能、智慧教育。已在NeurIPS、CVPR、AAAI、IEEE
  JBHI、IEEE TBME、Pattern Recognition等国内外一流学术刊物和会议上发表论文70余篇，出版人工智能教材2部、专著1部，主持国家自然科学基金、国家973计划项目子课题、教育部新世纪优秀人才支持计划等科研项目10余项，主持学校教改项目3项，获得国家发明专利10余项，获得兵器科学技术二等奖、兵工高校优秀教材二等奖、北京理工大学优秀教育教学成果一等奖等奖励。

  科研方向

  机器学习、计算机视觉、模式识别、医学人工智能、智慧教育

  代表性学术成果

  教材

  [1] 刘峡壁. 人工智能导论—方法与系统, 北京：国防工业出版社，2008.

  专著

  [1] 刘峡壁, 马霄虹, 高一轩. 人工智能：机器学习与神经网络, 北京：北京理工大学出版社，2023.

