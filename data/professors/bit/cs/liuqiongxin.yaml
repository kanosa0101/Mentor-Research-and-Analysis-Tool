bio_raw: '个人信息

  刘琼昕，女，博士，副教授，硕士生导师。1996 年 7 月起在北京理工大学计算机学院工作至今。研究方向包括：人工智能、机器学习、知识图谱、任务规划相关技术，主持和参与多项科技部科技支撑项目、863
  重大科研项目、自然科学基金、部委科技预研项目等，取得多项创新性成果。主讲本科生专业必修课《离散数学》、《机器学习》。

  科研方向

  1.知识图谱

  使用深度学习等方法研究知识推理、关系抽取等知识图谱构建的关键技术，研究知识图谱在多个领域的应用，包括搜索、推荐、问答等。

  2.基于AI的任务规划及相关技术

  针对复杂环境约束、任务约束和目标约束，应用群体智能方法（遗传算法、蚁群算法、粒子群算法等），研究多目标优化问题中协同任务分配、高维多目标规划、资源受限任务调度等关键技术。

  代表性学术成果

  20

  17

