bio_raw: '个人信息

  博士，硕士生导师，研究领域为自然语言处理、大模型及教育数据挖掘，承担及参与完成了国家科技重大专项、国家自然科学基金重点项目、北京市自然科学基金、国防预先研究课题等项目，参与发布多项行业标准及专利，在SCI\EI刊物发表论文二十余篇。招收计算机科学与技术、软件工程专业硕士参与重大专项等项目。

  科研方向

  大模型、自然语言处理、教育数据挖掘

  代表性学术成果

  专著《研究生教育资源配置理论与模型》《机器学习实践》

  承担科研情况

  国家科技重大专项子课题，主持，2026-2029，AMOLED 显示面板生产质量在线监测智能模型与良率提升软件研发及验证

  中国教育技术协会，主持，2025-2026，教育数据全生命周期智能治理与动态合规技术研究

  国家自然科学基金重点项目，参与，2019-2023，“互联网+”时代研究生教育管理变革与创新研究。

  所获奖励

  主讲《机器学习》获第三批国家一流课程

  主讲《机器学习实践》获工信部工程硕博士特色优质课程

  社会兼职

  工业大数据分析与集成应用工业和信息化部重点实验室委员

  备注'
