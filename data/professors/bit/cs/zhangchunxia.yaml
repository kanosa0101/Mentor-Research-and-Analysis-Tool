bio_raw: '个人信息

  张春霞，女，博士，北京理工大学计算机学院副教授。毕业于中国科学院计算技术研究所，获计算机软件与理论专业博士学位。曾在美国University of Vermont计算机科学系受国家留学基金委资助做一年访问学者。主要研究领域包括大数据分析与挖掘、自然语言处理、深度学习与人工智能、Web检索与知识抽取、多模态学习等。先后主持三项国家自然科学基金面上基金、国家自然科学基金青年项目、科技创新2030-“新一代人工智能”重大项目课题、国家973计划项目子课题、教育部产学合作协同育人项目，以及北京理工大学基础研究基金项目等多项课题。参与国家自然科学基金重大项目、国家自然科学基金面上项目、国防科技工业局项目、国家发展和改革委员会项目等多项课题。在TKDE、ESWA、AAAI和ACL国际期刊和国际会议等上发表六十多篇论文。参加美国国家标准与技术研究院NIST举办的第19届国际文本检索大会TREC竞赛，获相关实体发现(Related
  Entity Finding)竞赛综合测试第一名，获博客属性提取(Faceted Blog Distillation)竞赛综合测试第一名。获一项学校教育教学成果一等奖、四项学校教育教学成果二等奖、教育部双语教学示范课程。获省部级科学技术进步三等奖，获十多项国家发明专利授权。

  科研方向

  人工智能、大数据分析与挖掘、自然语言处理、深度学习、Web检索与知识抽取、多模态学习等。

