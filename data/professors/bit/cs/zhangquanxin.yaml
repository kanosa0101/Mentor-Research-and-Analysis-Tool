  制造企业主导的制造服务价值网融合关键使能技术，国家重点研发计划子课题，2018YFB1701402，2019.05-2023.04，65万，负责人

  移动传输XX，国家重点研发计划子课题，201920755003，2019.01-2020.12，50万，负责人

  XXX分析研究，国防项目，YXBLG20171，2017.12-2018.12，30万，负责人

