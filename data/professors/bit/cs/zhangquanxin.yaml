  Xue Yuan; Tan Yu-an; Liang Chen; Li Yuanzhang; Zheng Jun;

  Zhang Quanxin*

  , 6RootAgency: A digital signature-based root privilege management agency for cloud
  terminal devices, Information Sciences (SCI一区), 2018(444): 36-50, 2018.05

