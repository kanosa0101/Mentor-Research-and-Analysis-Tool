bio_raw: '个人信息

  1974年生，硕士生导师。作为项目负责人承担国家级、省部级科研项目10余项。主持或参与的项目包括国家自然科学基金面上项目、国家重点研发计划子课题、国家863课题、国防科技创新特区项目、国防预研基金、航天基金等。发表SCI检索论文10余篇(其中ESI高被引论文2篇)，以第一发明人获国家授权发明专利3项，获省部级科技进步奖2项。

  科研方向

  深度学习及其对抗技术、计算机视觉安全、信息安全等。

  代表性学术成果

  近年来发表的主要论文：

  Quanxin Zhang

  , Yuhang Zhao, Yajie Wang, Thar Baker, Jian Zhang, Jingjing Hu∗, Towards cross-task
  universal perturbation against black-box object detectors in autonomous driving,
  Computer Networks (SCI三区), 180 (2020) 107388, 2020.07

  Zhang Quanxin

  ; Zhang Xiaosong; Xue Yuan; Hu Jingjing*, A stealthy covert storage channel for
  asymmetric surveillance VoLTE endpoints, Future Generation Computer Systems (SCI一区),
  2020(102): 472-480, 2020.01

  Zhang Quanxin;

  Gong Hanxiao; Zhang Xiaosong; Liang Chen; Tan Yu-an*, A sensitive network jitter
  measurement for covert timing channels over interactive traffic, Multimedia Tools
  and Applications (SCI三区), 2019(78): 3493-3509, 2019.02

  Liang Chen; Tan Yu-an; Zhang Xiaosong; Wang Xianmin; Zheng Jun;

  Zhang Quanxin*

  , Building packet length covert channel over mobile VoIP traffics, Journal of Network
  and Computer Applications (SCI一区), 2018(118): 144-153, 2018.09

  Wei Hua; Hu Changzhen; Chen Shiyou; Xue Yuan;

  Zhang Quanxin*

  , Establishing a software defect prediction model via effective dimension reduction,
