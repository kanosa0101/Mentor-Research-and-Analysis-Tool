bio_raw: '个人信息

  副教授，博士生导师。于2004年和2010年在北京理工大学获得本科和博士学位，2008和2017年两次公派访问加州大学尔湾分校。主要研究方向包括系统仿真、大数据和人工智能等。在IEEE
  Trans MC、IEEE Trans Computers、IEEE Trans ITS、IEEE Trans SC等国际顶级期刊和会议上发表论文40多篇，在国际期刊Applied
  Computing and Intelligence、Frontiers in Big Data担任副编辑。获省部级科技奖励2项，校级科技奖励5项，指导学生获得国家级学科竞赛奖励3项，获得教学奖励5项。担任复杂系统建模与仿真全国重点实验室专家委员会专家；中国仿真学会“基于模型的体系/系统设计与仿真专业委员会”委员；中国指挥与控制学会建模与仿真专委会委员。承担和参与了国家重点研发计划项目、国家自然科学基金、国防基础科研项目、装备预研基金、型号研保项目等30余项科研项目。

  每年计划招收1名博士生和2名硕士生。欢迎对智能计算、军事智能仿真、边缘计算、联邦学习等方向有兴趣的同学加入课题组。

