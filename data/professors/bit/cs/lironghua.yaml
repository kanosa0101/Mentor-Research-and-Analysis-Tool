bio_raw: '个人信息

  李荣华，男，博士，教授，博士生导师，国家级青年人才。李博士于2013年毕业于香港中文大学，同年9月入职深圳大学计算机与软件学院，后于2018年3月加入北京理工大学计算机学院。他长期致力于图数据管理与挖掘、复杂网络分析、图论算法设计与分析、谱图理论的基础研究，并系统性地开展了知识图谱、图学习与大模型、高维向量检索及其在金融、制造、生命科学等交叉领域的应用研究。至今，他已在相关领域发表CCF-A类长文110余篇，研究成果获CCF自然科学二等奖、中国电子学会自然科学一等奖等。在人才培养方面，其指导的博士生获“CCF优博”、“博新计划”、“基金委博士生基础研究项目”、“中国科协博士生青托”等。在科研项目方面，他主持了国家自然科学联合基金重点项目、面上项目及国家重点研发计划课题等。具体信息详见个人主页(https://ronghuali.github.io)和实验室主页(https://gdilab.cn)。

  News: 每年计划招收博士生1人、硕士研究生3-4人，同时也欢迎优秀的高年级本科生加入实验室，表现优秀者将推荐至美国、澳洲、新加坡、中国香港等地继续深造 （注：符合以下条件之一的申请人将获优先考虑：1.
  踏实勤奋、自我驱动力强；2. 拥有ACM-ICPC等程序设计竞赛经验）。有意加入本课题组的学生请将个人简历发送至： lironghuabit@126.com

  科研方向

  图数据管理与挖掘，复杂网络分析、图论算法的设计与分析、谱图理论、向量检索、知识图谱、图学习与大模型、大模型Agent、大模型RAG、AI4Science、图计算及其在金融、制造、生命科学等交叉领域的应用。

