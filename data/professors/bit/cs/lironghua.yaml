  承担科研情况

  1. 基于原生图模型的分布式图存储和图计算方法与技术研究，国家自然科学基金联合基金重点项目

  2. 云边端协同管控系统的体系架构与安全评估，国家重点研发计划课题

  3. 面向大规模时序图数据的子图匹配查询处理研究，国家自然科学基金面上项目

  4. 面向大规模时态图数据的社区搜索关键技术研究，国家自然科学基金面上项目

  5. 大规模图数据的最大k边连通子图查询处理研究，国家自然科学基金青年基金项目

