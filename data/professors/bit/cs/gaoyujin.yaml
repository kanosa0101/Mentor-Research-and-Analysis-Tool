bio_raw: '个人信息

  高玉金，男，1974年生，河南新野人。本科和硕士研究生毕业于燕山大学，博士毕业于北京理工大学。博士期间从事层次视频多播传输技术的研究，2014年博士毕业后留校从事教学科研工作。目前在石峰教授的团队内从事多核计算机体系结构方面的研究。目前讲授硕士双语课程“软件工程与软件自动化”，本科课程“软件工程基础”，“大学计算机基础”以及指导本科生的“软件工程综合训练”。目前著作计算机类图书2本，申请专利一项。

  科研方向

  主要研究方向为计算机体系结构，片上网络系统等

  代表性学术成果

  TriBA体系结构和片上网络研究

  承担科研情况

  主持和参与企业合作项目多项，和多家企业保持长期合作关系。主持北京理工大学创新基金项目一项；参与国家自然科学基金项目4项，参与国防预研基金1项。在国内外著名期刊和国际会议上发表论文多篇。

  所获奖励

  社会兼职

  教育部考试中心专家命题组组长

  备注'
