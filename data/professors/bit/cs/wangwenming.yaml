  承担科研情况

  近年来部分纵向科研情况：

  1.国家自然科学基金委员会,国家自然科学基金重点项目（71834001）“互联网+”时代研究生教育管理变革与创新研究，参加

  2.中华人民共和国科学技术部，国家科技重大专项课题：科技创新2030-“新一代人工智能重大项目”（2019AAA0104903），面向医学人工智能服务的知识体系构建和应用研究，技术骨干

  3.国家自然科学基金委员会，国家自然科学基金项目（61502033），基于主题形式概念分析的文本处理关键技术研究，参加

  4.中华人民共和国科学技术部，国家重点研发计划子课题（2018YFB1003903），基于代码风格的程序员画像，参加

  5.中华人民共和国科学技术部，国家重点研发计划（2019YFB1406302），知识化加工与版权服务技术，参加

  近年来部分横向科研情况：

  1.航天长征火箭技术有限公司，测风激光雷达测风软件

  2.北京遥测技术研究所，海洋探测激光雷达数据处理软件研制

  3.哈尔滨工程大学，仿生多足机器人智能控制策略技术

  4.电子科技集团公司电子科学研究院，空中小平台布阵控制与交互呈现,

  5.北京电子工程总体研究所,仿真推演平台

  6.中国电子科技集团公司（54所），导航接收机数据采集与传输软件

  7.解放军海军总医院，虚拟手术培训软件系统

  8.中国船舶工业集团系统工程部，舰船灯光仿真系统研究

  9.解放军总装备部，环境仿真技术及实用化VR技术研究

  10.中国公安部（1所），二代身份证数字防伪系统

