bio_raw: '个人信息

  王文明，男，北京人，北京理工大学副教授、高级实验师，硕士生导师，湖南大学计算机专业硕士研究生毕业。现任职于北京理工大学计算机学院软件智能与软件工程研究所，从事教学及科研工作。主讲数据库技术及应用、多媒体技术、C语言程序设计、大学计算机基础等多门必修课，开设并主讲人机交互技术、汉语编程技术、计算机基础实验等多门实验选修课和通识选修课；具备参与国家重点攻关项目以及大型央企合作研发经历，具备大型机、小型机、工作站等环境开发经验；2004年获得全国计算机与信息技术高级工程师资格证书；主持或参与完成多项国家级、省部级重大研究课题以及部分央企重点研发项目；国内外发表专业论文30余篇，其中近20篇被三大检索收录；出版二十一世纪全国理工院校规划教材《计算机网络原理》、《操作系统概论》等各类专著和教材8部。近年来，研究方向主要集中在机器学习、人工智能、数据挖掘、计算机视觉、区块链应用等领域；同时关注双一流建设、人才培养、产学研一体化等研究领域。

  学生毕业方向：国家部委、科研院所、大型国企、金融机构、攻读博士

  科研方向

  机器学习，人工智能，数据挖掘，计算机视觉

  主要研发内容包括：

  1.互联网及智能软件开发（基于Android、iOS的移动增强现实智能场景交互与漫游，语音合成与辨析、web VR技术）

  2.区块链技术及应用（区块链1.0、2.0、3.0架构、相关技术研究及其应用平台开发、产品设计、制造）

  3.大数据智能分析与管理（分析、预测、管理、应用等）

  4.机器人技术（视觉、仿真、遥操作、水陆两栖排雷）

  5.视频图像分析（人脸识别、人体姿态估计、图像检索与分类、动态目标捕获、滞留物检测等应用）

  6.卫星导航系统（GPS、BDS、GLONASS和GALILEO）

  以上领域可供本科生、研究生论文选题参考。

  课题来源：国家部委、大型国企、大创项目等。

