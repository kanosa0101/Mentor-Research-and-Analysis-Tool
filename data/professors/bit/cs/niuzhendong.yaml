bio_raw: '个人信息

  1968年10月生于安徽临泉，1995年3月毕业于北京理工大学，获计算机应用专业博士学位。历任邮电部数据局工程师、匹兹堡大学LRDC博士后、卡内基梅隆大学计算机学院研究员和兼职研究员、中国数字图书馆公司技术总监、北京理工大学软件学院教授、博士生导师、副院长等。现任北京理工大学计算机学院教授、博士生导师、副院长、BIT-UTS数据挖据与服务技术联合研究中心中方主人，兼任匹兹堡大学信息学院兼职教授、中央编译局信息化专家委员会主任委员等学术职务。

  从事海量数字资源管理与数据挖掘、智能信息检索系统、智能教育技术、神经信息挖掘、数字图书馆技术、企业信息化、软件体系结构研究。主持和完成包括973课题在内的基础研究课题及国家重大工程项目10多项，在包括美国国家科学院院刊PNAS、Human
  Brain Mapping、World Wide Web、ICDM等在内的国际顶级学术期刊和国际主流会议发表论文100多篇。

  科研方向

  海量数字资源管理、数据挖掘、智能信息检索、智能教育技术、神经信息挖掘、数字图书馆技术、软件体系结构

  代表性学术成果

  1、 Linlin Zhu, YaoxinNie, Chunqi Chang, Jia-Hong Gao, Zhendong Niu*, Different patterns
  and development characteristics of processing written logographic characters and
  alphabetic words: An ALE meta-analysis, Human Brain Mapping , Volume 35, Issue 6,
   June 2014(SCI,2012 Impact Factor:6.878，通讯作者)

  2、 Sheng Huang,Zhendong Niu*, Chongyang Shi. Automatic construction of domain-specific
  sentiment lexicon based on constrained label propagation, ， Knowledge-Based Systems,Volume
  56, Pages 191-200 (January 2014)（SCI ，2012 Impact Factor: 4.104, *通讯作者）

  3、 Linlin Zhu#, Yang Fan#, Qihong Zou*, Jue Wang, Jia-Hong Gao, Zhendong Niu* ，Temporal
  reliability and lateralization of the resting-stat language network，PLoS ONE 9(1):e85880.
  doi:10.1371/journal.pone.0085880，January 2014 | Volume 9 | Issue 1 | e85880(SCI，2012
  Impact Factor: 3.73, *通讯作者）

  4、 Wei Chen, Zhendong Niu*,Xiangyu Zhao, Yi Li, AHybridRecommendationAlgorithmAdaptedinE-LearningEnvironments,
  World Wide Web，March 2014, Volume 17, Issue 2, pp 271-284 (SCI, 2012 Impact Factor:
