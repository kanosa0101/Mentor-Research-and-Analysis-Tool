  Factor: 4.104, *通讯作者）

  6、 Veronica Kwok*，Zhendong Niu*, Paul Kay，Ke Zhou，Lei Mo, Zhen Jin, Kwok-Fai So，Li
  Hai Tan，“Learning new color names produces rapid increase in gray matter in the
  intact adult human cortex”，PNAS 2011 108 (16) 6686-6688;  (SCI，2012 Impact Factor:
  9.73，*共同第一作者)

  承担科研情况

  完成和承担973课题、国家重大工程专项、国家自然基金、基础科研基金等国家级课题20多项，所负责的部分在研项目如下：

  - 国家自然基金课题，面向Web主观性文本意见挖掘研究,2014.1-2017.12，61370137

  - 新闻出版重大科技工程项目，“数字版权保护技术研发工程-数字内容分段控制技术研发”，2012.1-2015.12，GAPP_ZDKJ_BQ/01

  - 973课题， 中国语言加工脑机制的计算模型，2012-2016，2012CB720702

  所获奖励

  2004年获霍英东基金会青年教师奖励资助，2005年获得IBM全球高校教师创新奖励，2006年入选教育部新世纪优秀人才计划，2007年所主讲的《数字图书馆技术》入选国家首届双语示范课程。2010年在美国国家标准与技术局NIST举办的第19届国际文本检索大会获TREC2010获得TREC
  Blog综合测评第一和TREC实体综合测评第一。 2012、2013年分别获国防科技进步奖励、北京市教育成果奖励各1项。多次获校优秀博士论文指导教师，2013年所主讲的《内容管理与数字图书馆》入选国家来华留学英语授课品牌课程，获ACML2013优秀论文。

  社会兼职

  1. 匹兹堡大学信息学院兼职教授

  2. 国家基础教育资源共建共享联盟副主席

  3. 中央编译局信息化专家咨询委员会主任委员

  4. 中国索引学会副理事长

  备注'
