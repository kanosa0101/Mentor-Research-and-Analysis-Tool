bio_raw: '个人信息

  梁玮，教授，博士生导师，硕士生导师。2005年7月于北京理工大学计算机学院获工学博士学位。2014年至2015年在加州大学洛杉矶分校（ULCA）访问。作为项目负责人主持国家自然科学基金、重点研发课题、北京市自然科学基金、973子课题、企事业项目等多项。在国内外顶级和重要期刊、CCF
  A类期刊和会议上发表论文50余篇，包括IJCV、TVCG、SIGGRAPH Asia、CVPR、ICCV、NeurIPS、ICML、AAAI、IJCAI、ACM
  CHI、ACM MM、IEEE VR等。获卫星导航定位科学技术特等奖、教育部高等学校技术发明二等奖、兵器科学技术二等奖、交通运输协会科学技术二等奖、北京理工大学优秀科技成果奖一等奖。指导硕士获2021年中国电子学会优秀硕士论文，指导硕士2020、2021、2022连续三年获校优秀硕士论文。

  个人主页：https://liangwei-bit.github.io/web/

  科研方向

  计算机视觉、具身智能、人机交互

