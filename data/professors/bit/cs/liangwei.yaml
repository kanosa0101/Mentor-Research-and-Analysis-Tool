  承担科研情况

  主持国家自然科学基金、重点研发课题、北京市自然科学基金、973子课题、企事业项目等多项。

  所获奖励

  卫星导航定位科学技术特等奖；教育部高等学校技术发明二等奖；兵器科学技术二等奖；交通运输协会科学技术二等奖；北京理工大学优秀科技成果奖一等奖。

  指导硕士获2021年中国电子学会优秀硕士论文；指导硕士2020、2021、2022连续三年获校优秀硕士论文。

  社会兼职

