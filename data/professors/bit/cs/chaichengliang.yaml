bio_raw: "个人信息\n柴成亮，北京理工大学计算机学院预聘副教授（特别研究员），博士生导师，CCF优秀博士论文奖获得者。2015年和2020年分别于哈尔滨工业大学与清华大学获得学士和博士学位，2020-2022年于清华大学从事博士后研究。\n\
  累计共发表（含接收）SIGMOD、VLDB、TODS、VLDBJournal等国际顶级CCF-A类会议/期刊长文51篇，其中一作/通讯32篇。获得2025 北京市科技新星、2025\
  \ ACM 中国新星奖、2023 小米青年学者、Best of SIGMOD 2023 Papers、2021 福布斯中国 30 位 30 岁以下精英榜单等多项荣誉奖励。同时，与华为、阿里、腾讯混元、蚂蚁百灵、快手、百度等业界前沿公司\
  \ (或团队) 保持紧密合作。主要研究方向如下：\n1. Data Centric AI & Data Agent\n作为课题组的传统方向，主要聚焦于大语言模型（LLM）驱动的多模态数据分析方法，探索如何通过统一语义表征与检索增强机制实现文本、图像、表格等异构数据的高效融合与关联理解，并进一步通过成本估计与动态算子选择实现跨模态查询的智能优化与高效执行。研究重点涵盖面向大模型的数据准备、知识注入与检索增强技术以及查询优化策略的系统研究，旨在构建具备语义一致性、可扩展性与高效查询能力的智能分析体系，为复杂数据场景下的知识发现与智能决策提供更高效、更智能的技术支撑。\n\
  2.多模态大模型（MLLM）\n课题组聚焦多模态大模型对图像、文本等不同模态信息的理解与生成，自主构建和整理多模态数据，针对视觉理解与图像编辑等任务微调前沿图像生成模型及多模态大语言模型，形成从数据准备、模型优化到应用反馈与数据迭代的闭环。其中，由课题组主导研发的\
  \ AI 视觉解析工具 Edit Banana（累计获得 5.5k+ GitHub Stars），主要解决大模型生成图像难以二次修改的痛点，提升生成内容的可编辑性与使用灵活性。\n\
  3.前沿大模型评测与 AI for Science 数据准备\n此外，课题组持续跟踪前沿大模型的最新进展，围绕AI for Science 等新兴能力与应用场景开展评测及数据构建研究。研究关注\
  \ ALE (Agent Last Exam) 等长程任务，以及 EFE (Embodied First Exam) 等大模型与具身智能相结合的方向，探索构建能够反映复杂任务需求的评测场景与数据集，并结合评测发现开展数据准备，与前沿模型厂商进行合作。\n\
  课题组拥有充足的 GPU 算力资源，包括A100、A800、Pro 6000与丰富的API资源，同时具有深度的业界合作传统，为研究与实践提供有力支持。欢迎同学们加入课题组，一起站在Data\
  \ + AI的浪潮之巅，探索前沿，创造未来！\n科研方向\nData Centric AI & Data Agent, MLLM, Frontier Model\
