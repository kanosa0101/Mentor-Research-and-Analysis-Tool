bio_raw: '个人信息

  柴成亮，北京理工大学计算机学院预聘副教授（特别研究员），博士生导师，CCF优秀博士论文奖获得者。2015年和2020年分别于哈尔滨工业大学与清华大学获得学士和博士学位，2020-2022年于清华大学从事博士后研究。已发表CCF
  A类论文近40篇，包括SIGMOD、VLDB、ICDE、KDD、TKDE和VLDBJ。获得CCF优秀博士论文奖（全国Top 10）、ACM中国优秀博士论文奖（全国Top
  2）、入选福布斯中国30位30岁以下精英榜单、百度奖学金（全球Top10）等奖励。在学术服务方面，担任国际高水平SCI期刊JCST特约编辑； KDD、ICDE、VLDB、AAAI、ICDCS等多个国际顶级会议程序委员会委员；CCF前沿讲习班学术主任；中国数据库专委会执行委员；曾在国际顶级会议SIGMOD
  2021、KDD 2018、ICDE 2019做3小时辅导报告。

  研究方向1—以数据为中心的人工智能（data-centric AI）：在人工智能时代，算法、算力与数据成为不可或缺的三要素。现有研究主要关注人工智能算法，但是数据也是非常重要的。主要研究如何从数据的角度赋能人工智能模型，尤其是大语言模型。主要包括面向人工智能大模型的数据发现与选择、数据清洗与融合、数据标注和数据血缘等。

  研究方向2—数据湖与大模型: 在多源异构大数据时代，数据湖由于其能高效地以原始格式存储各种数据而得到广泛应用，其存储的数据能有效支持数据分析与人工智能算法。主要研究如何索引数据湖中数据、如何高效检索数据以支持大模型推理（检索增强RAG技术），如何提取和利用数据湖中蕴含的知识，如何利用大模型对湖中多模态数据进行高效准确分析。

  2024.12更新: 目前招收2025年入学的硕士生（考研）3-4人。每年计划招收硕士生3-4人，博士生1人。

  科研方向

  人工智能大模型、数据科学、数据湖、数据库系统

