bio_raw: '个人信息

  赵三元，女，北京理工大学计算机学院，副教授，硕士生导师，任全国高等院校计算机基础教育研究会智能技术应用专业委员会副秘书长，中国图象图形学会虚拟现实专委会委员，中国计算机学会多媒体专委会会员。获国家级教学成果奖二等奖一项，主持国家自然科学基金一项，在
  SCI 重要刊物上和计算机视觉三大顶会（CVPR、ECCV、ICCV）上发表多篇科研论文，担任多个 SCI 期刊审稿人，是多项顶级科研会议的程序委员会成员，科研方向为计算机视觉和虚拟现实。

  科研方向

  计算机视觉、深度学习、虚拟现实

  代表性学术成果

  1. JianJian Cao, Xiameng Qin, Sanyuan Zhao*, and Jianbing Shen. Bilateral Cross-Modality
  Graph Matching Attention for Feature Fusion in Visual Question Answering. IEEE Transactions
  on Neural Networks and Learning Systems. (SCI 一区， IF: 10.309)

  2. Gaojie Lin, Sanyuan Zhao*, Jianbing Shen:Video person re-identification with
  global statistic pooling and self-attention distillation. Neurocomputing 453: 777-789
  (2021) （SCI 二区, IF: 4.438）

  3. Zongji Zhao, Sanyuan Zhao,* Jianbing Shen:Real-time and light-weighted unsupervised
  video object segmentation network. Pattern Recognit. 120: 108120 (2021) （SCI 一区,
  顶刊, IF: 7.7407）

  4. Hao Li, Sanyuan Zhao*, Wenjun Zhao, Libin Zhang, Jianbing Shen: One-Stage Anchor-
  Free 3D Vehicle Detection from LiDAR Sensors. Sensors 21(8): 2651 (2021) （SCI 三
  区 , IF: 3.576）

  5. Hao Xin, Sanyuan Zhao, Mang Ye, Jianbing Shen, Cross-Modality Re-identification
  via Modality Confusion and Center Aggregation. ICCV 2021. （CCF A 类, 计算机视觉国际三大顶会之一）

  6. Yuanpei Liu, Junbo Yin, Dajiang Yu, Sanyuan Zhao*, Jianbing Shen: Multiple people
  tracking with articulation detection and stitching strategy. Neurocomputing 386:
  18-29 (2020)（SCI 二区, IF: 4.438）

  7. Junrong Wu, Zongzheng Wen, Sanyuan Zhao*, Kele Huang: Video semantic segmentation
  via feature propagation with holistic attention. Pattern Recognit. 104: 107268 (2020)
  （SCI 一区, 顶刊, IF: 7.7407）

  8. Tao Li, Zhiyuan Liang, Sanyuan Zhao*, Jiahao Gong, Jianbing Shen: Self-Learning
  With Rectification Strategy for Human Parsing. CVPR 2020: 9260-9269 （CCF A 类, 计算机视觉国际三大顶会之一）

  9. Qi Qi, Sanyuan Zhao*, Wenjun Zhao, Zhengchao Lei, Jianbing Shen, Libin Zhang,
  Yuanyuan Pang: High-speed video salient object detection with temporal propagation
  using correlation filter. Neurocomputing 356: 107-118 (2019) （SCI 二区, IF: 4.438）

  10. Tao Li, Sanyuan Zhao*, Qinghao Meng, Yufeng Chen, Jianbing Shen: A stable long-
  term object tracking method with re-detection strategy. Pattern Recognit. Lett.
  127: 119-127 (2019) （SCI 三区, IF: 3.255）

  11. Wenguan Wang, Hongmei Song, Shuyang Zhao, Jianbing Shen, Sanyuan Zhao, Steven
  C. H. Hoi, Haibin Ling: Learning Unsupervised Video Object Segmentation Through
  Visual Attention. CVPR 2019: 3064-3074 （CCF A 类, 计算机视觉国际三大顶会之一）

  12. Qi Qi, Sanyuan Zhao*, Jianbing Shen, Kin-Man Lam: Multi-scale Capsule Attention-
  Based Salient Object Detection with Multi-crossed Layer Connections. ICME 2019:
  1762-1767（CCF B 类）

  13. Zhengchao Lei, Sanyuan Zhao*, Hongmei Song, Jianbing Shen: Scene text recognition
  using residual convolutional recurrent neural network. Mach. Vis. Appl. 29(5): 861-871
  (2018)（SCI 四区, IF: 1.605）

  14. Hongmei Song, Wenguan Wang, Sanyuan Zhao*, Jianbing Shen, Kin-Man Lam: Pyramid
  Dilated Deeper ConvLSTM for Video Salient Object Detection. ECCV (11) 2018: 744-760（CCF
  B 类, 计算机视觉国际三大顶会之一）

