bio_raw: '个人信息

  付莹，长聘教授，国家级青年人才。先后从西安电子科技大学、清华大学、东京大学获本科、硕士、博士学位。已在IEEE TPAMI、IJCV等国际期刊和ICCV、CVPR等国际会议发表论文100余篇，获CCF
  A类会议ICML杰出论文奖。主要从事计算机视觉和人工智能等相关领域研究，主持国家自然科学基金重点项目等国家级项目/课题10余项，获中国图象图形学会科学技术进步奖一等奖、人工智能学会教学成果奖励计划一类、图象图形学会石青云女科学家奖、电子学会青年科学奖等。指导学生获日内瓦国际发明展金奖，国自然博士生基金、中国科协博士青托，国家一级学会优硕3人、优博提名2人，北京市优秀本科毕设3人，国家“挑战杯”金奖、特等奖2项等。

  每年招收博士生1名，硕士生2-3名。欢迎对计算机视觉、人工智能、计算摄像学、视频图像分析等相关领域研究有兴趣的同学们加入课题组。个人主页：https://ying-fu.github.io/

  科研方向

  计算机视觉、人工智能

