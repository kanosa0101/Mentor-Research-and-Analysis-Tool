bio_raw: '个人信息

  金乾坤，博士，副教授，硕士生导师，近年来一直在北京理工大学从事计算机相关专业的教学和科研工作，北京理工大学机电学院兵器科学技术博士后。目前主要从事建模&仿真和高性能计算、深度学习和强化学习、智能仿真与决策、知识图谱及推理方面的研究工作。主持973国家安全重大基础研究子课题1项、北京市自然科学基金项目1项，负责海军及空军多项装备训练仿真重点项目，参与国家重点研发项目、科技冬奥专项、教育部博士点基金等国家级和省部级项目多项。以第一作者/通信作者在国内外期刊、学术会议上发表论文20余篇；获授权专利2项；获得部级科技进步一等奖2项，三等奖1项，荣获工人先锋号、大规模活动复杂体系仿真技术及重大应用创新技术一等奖、国庆70周年服务保障先进个人、建党100周年服务保障先进个人等荣誉称号。开设本科课程“智能仿真及应用”和研究生课程“建模与仿真导论”。

  科研方向

  建模&仿真、高性能计算、深度学习与强化学习、智能仿真与决策、知识图谱及推理、人群仿真。

  代表性学术成果

  1. Peng Mei, Gangyi Ding, Qiankun Jin et al. Reconstruction and Optimization of
  Complex Network Community Structure under Deep Learning and Quantum Ant Colony Optimization
  Algorithm；Intelligent Automation & Soft Computing (DOI:10.32604/iasc. 2020.012813).
  (SCI Q2/3.401)

  2. Peng Mei, Fuquan Zhang*, Gangyi Ding, Qiankun Jin, Yangfan Jiao. Quantum-based
  creative generation method of dancing robot (doi:10.3389/fnbot. 2020.559366); Front.
  Neurorobot. (SCI Q2/3.493).

  3. Jin Qiankun, Ni Xunbo. Numerical Analysis of Dynamic Response of Ship Models
  Subjected to Underwater Explosion, International Journal of Nonlinear Sciences &
  Numerical Simulation, Volume 11, July 2010, Pages 201- 205. (SCI Q2/5.099).

  4. 倪训博, 金乾坤等. 中国手语指动作的标记体系. 哈尔滨工程大学学报. 2012 年7 月, 第33 卷,第7期,pp862-868.(Ei).

  承担科研情况

  1. 973国家安全重大基础研究(数字仿真部分)，主持

  2. 北京市自然科学基金，“基于多源感知数据的奶牛目标行为辨识研究”，负责

  3. 国家重点研发计划子课题，“城市灾害态势仿真推演与救援模拟技术”，负责

  4. 国庆70周年群众游行和观礼服务保障（集结与疏散），负责

  5. 建党100周年综合服务保障（集结与疏散），负责

  6. 科技东奥项目-运动员集结与疏散仿真，参与

  7. 某坦克虚拟装配仿真，专题负责

  8. 城市交通路网辨识与交通仿真，参与

  9. 量子仿真关键技术及应用研究，负责

  10. 火灾应急数字孪生仿真，参与

  11. 飞行器多领域科学计算可视化，负责

  12. 空中目标易损性及弹药威力评估仿真系统，负责

  13. 某制导性能测试系统仿真，参与

  14. 飞行模拟训练仿真，参与

  15. 大兴机场智能疏散与决策，参与

  16. 城市区域应急管理和决策系统，负责

  17. 战场环境医疗救护训练仿真，负责

  18. 电子政务系统优化仿真与辅助决策，负责

  所获奖励

  获得部级科技进步一等奖2项，三等奖1项。荣获工人先锋号、大规模活动复杂体系仿真技术及重大应用创新技术一等奖、国庆70周年服务保障先进个人、建党100周年服务保障先进个人等荣誉称号。

  社会兼职

  应急管理部信息研究院专家委评审专家，中国航天科技集团第八研究院专家委评审专家。兵工学报、系统仿真学报、计算机仿真审稿人。

  备注'
