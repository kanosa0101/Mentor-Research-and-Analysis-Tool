bio_raw: '个人信息

  辛欣，博士后，博士生导师。

  主要经历：

  [1] 2002-2006，清华大学，获学士学位。

  [2] 2006-2008，清华大学，导师：李涓子，获硕士学位。

  [3] 2008-2011，香港中文大学，导师：Irwin King&Michael R. Lyu，获博士学位。

  [4] 2011-2012，香港中文大学，博士后。

  [5] 2013-2014，微软铸星计划访问学者，导师：Chin-Yew Lin。

  [6] 2012-至今，北京理工大学，计算机学院，语言信息处理与社会计算团队，责任教授：黄河燕。

  科研方向

  理论方向：概率图模型、深度神经网络、强化学习

  应用方向：知识图谱、知识百科等知识工程领域、语言教育领域

  技术方向：多模态大语言模型的检索、推理

  主讲课程：《知识工程》、《人工智能与计算科学》

  代表性学术成果

  知识图谱及百科构建：

  [1] Zhengfei Xu, Sijia Zhao, Yanchao Hao, Xiaolong Liu, Lili Li, Yuyang Yin, Bo
  Li, Xi Chen, Xin Xin(通讯). Reverse Region-to-Entity Annotation for Pixel-Level Visual
  Entity Linking. AAAI 2025 (CCF A).

  [2] 董家暄，辛欣(通讯)，生浩然. OpenHowNet词内结构标注. 《中文信息学报》(2025).

  [3] 徐正斐，辛欣(通讯). 基于大语言模型的中文实体链接实证研究. 《自动化学报》(2025).

  [4] 王皓泽，辛欣(通讯). 动词驱动事件的共指关系中文语料库构建及大模型评测. 《中文信息学报》(2025).

  [5] 徐进，辛欣(通讯). 中文动词实现状态数据集构建.《中文信息学报》(2025).

  [6] 于知衡, 辛欣(通讯). 面向方位词的时空逻辑语义分析. 《软件学报》(已录用)。

  概率图模型：

  [1] Xin Xin, Jinlong Li, Zeqi Tan. N-ary Constituent Tree Parsing with Recursive
  Semi-Markov Model. In Proceedings of ACL 2021 (CCF A).

  [2] Rui Wang, Xin Xin(通讯), Wei Chang, Kun Ming, Biao Li, Xin Fan. Chinese NER with
  Height Limited Constituent Parsing. In Proceedings of AAAI 2019 (CCF A).

  [3] Xin Xin, Chunwei Lu, Yashen Wang, and Heyan Huang. Forecasting Collector Road
  Speeds Under High Percentage of Missing Data. In proceedings of AAAI 2015 (CCF A).

  [4] Xin Xin, Irwin King, Hongbo Deng and Michael R. Lyu, A Social Recommendation
  Framework Based on Multi-scale Continuous Conditional Random Fields, In procedings
  of CIKM 2009, pp. 1247-1256, 2009 (CCF B).

  [5] Xin Xin, Juanzi Li, Jie Tang and Qiong Luo, Academic Conference Homepage Understanding
  Using Constrained Hierarchical Conditional Random Fields, In proceedings of CIKM
  2008, pp. 1301-1310, 2008 (CCF B).

  承担科研情况

  [1] 国家自然科学基金面上项目，融合语言知识的中文神经句法结构预测方法 (62172044)，2022年1月-2025年12月，项目负责人。

  [2] 国家自然科学基金面上项目，融合知识图谱的文本个性化推荐机制研究（61672100），2017年1月-2020年12月，项目负责人。

  [3] 国家自然科学基金青年项目，融合异构信息的低秩分解推荐模型研究（61300076），2014年1月-2016年12月，项目负责人。

  所获奖励

  [1] 吴文俊人工智能科学技术奖-自然科学奖二等奖（第四完成人），中国人工智能学会，2019。

  [2] “师缘北理”教书育人表彰，北京理工大学，2021。

  [3] 北京理工大学优秀硕士学位论文(徐正斐同学)指导教师，北京理工大学，2025。

  [4] 北京理工大学优秀硕士学位论文(王睿同学)指导教师，北京理工大学，2019。

  [5] 入选北京理工大学优秀青年教师计划跨学科合作项目，2014。

  [6] 入选微软青年学者铸星计划，2013。

  社会兼职

  [1] 中国计算机学会自然语言处理专业委员会委员。

  [2] 中国中文信息学会计算语言学、语言与知识计算、社会媒体处理专委会委员。

  [3] 中国人工智能学会青年工作委员会委员。

  备注

  招收博士生、硕士生，高年级本科生，本课题组长期从事以多模态信息处理为基础的开放域知识图谱及百科构建相关工作，欢迎对我们团队研究方向感兴趣的同学和我联系。（更多信息请关注https://xxin1984.github.io/）'
