bio_raw: '个人信息

  袁武，工学博士学位。2007年7月毕业于中国科学院计算技术研究所。研究兴趣包括认知量化计算、常识图谱和普适学习。在IEEE Trans on Circuits
  and System for Video Technology, International Journey of Cartography and Geographical
  Information System (CaGIS)及计算机学报、遥感学报、测绘学报等国内外权威期刊及会议上发表10多篇论文，以及ISO/IEC JVT H.264/AVC视频编解码技术国际标准提案一项（JVT
  O016）。获得Motorola，Sony以及中科院计算所授予的多项学术奖励。 研发完全自主创新的TextNet泛在大数据计算平台（包括PersonNet，WorldNet），基于独创的时空认知智能，实现人类社会（个体、群体及关系）建模，行为意图理解和分析，为计算社会科学提供数据和知识支撑。相关理论与技术可以广泛应用于开源情报自动挖掘与分析服务，包括泛在网络人物画像与社会动态网络图谱构建、天地一体化的全球态势感知、疫情精准防控等。

  相关核心技术在重庆政务网以及智慧城市平台（全国第一家省级系统）已投入实际业务运营，在两江新区行政执法体制改革试点工作中发挥技术支撑作用，获2016年及2018年地理信息科技进步一等奖。荣获2016年、2018年地理信息科技进步一等奖（省部级）。

  科研方向

  信息检索与挖掘、机器学习、知识工程。

