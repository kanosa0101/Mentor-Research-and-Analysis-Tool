bio_raw: '个人信息

  石戈，博士，预聘副教授/特别研究员，博士生导师。2020年毕业于北京理工大学-计算机学院-智能处理与内容安全工信部重点实验室，获得计算机科学与技术博士学位。在ACL、EMNLP、TKDE等国际顶级期刊会议发表论文60余篇，ESI热点论文2篇，出版专著1部。主持或参与国家重点研发计划子课题、国家自然科学基金重点项目、面上项目、青年项目等多项，多次担任ACL（CCF
  A类）、COLING（CCF B类）等国际顶级会议领域主席。

  科研方向

  大模型预训练、知识图谱、AI for Health等。

