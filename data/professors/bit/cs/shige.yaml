  承担科研情况

  1.国家自然科学基金青年基金项目，基于多适配器解耦、融合的统一知识抽取方法研究，项目负责人

  2.XXXXXX预先研究项目，XXXXXX情绪识别，课题负责人

  3.北京市自然科学基金-海淀原始创新联合基金，基于大规模语言模型和个性化多组学数据的类风湿性关节炎精准诊疗模型研究，课题负责人

  4.中国人民解放军总医院合作开发项目，面向领域大模型构建的数据筛选技术，项目负责人

  5.国家自然科学基金重点项目，知识驱动的复杂场景多模态语义理解理论与方法，核心骨干

