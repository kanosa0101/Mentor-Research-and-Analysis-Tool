bio_raw: '个人信息

  裴明涛，北京理工大学计算机学院教授，博士生导师。2004年获北京理工大学计算机学院工学博士学位，2009年至2011年在美国加州大学洛杉矶分校作访问学者。中国计算机学会会员，中国计算机学会计算机视觉专委会委员，中国计算机学会普适计算专委会委员，中国图象图形学会多媒体专委会委员。目前主要科学研究方向为计算机视觉和模式识别。在国际重要学术期刊IEEE
  TIP，TMM，IEEE TITS，CVIU以及ICCV，AAAI，IJCAI等国际顶级会议上发表学术论文60余篇，获国家发明专利8项。

  个人主页：https://peimingtao.github.io

  科研方向

  计算机视觉，模式识别，人工智能

