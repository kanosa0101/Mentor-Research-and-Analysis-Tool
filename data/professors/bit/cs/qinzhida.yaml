bio_raw: '个人信息

  秦志达，计算机学院副研究员，助理教授，硕士生导师。研究方向为推荐系统，人工智能，图神经网络等，共发表KDD、SIGIR、TKDE、INFOCOM、ICML等顶级会议和期刊论文29篇，承担了国家自然科学基金青年项目，光明实验室开放课题、北京理工大学青年学术启动计划等一系列项目，参与了国家自然科学基金重点项目、重点研发计划、面上项目等多个纵向项目。担任ACM
  KDD，AAAI，TKDE，SIGIR，TNNLS等一系列顶级期刊与会议的审稿人。英文主页：https://zhidaqin.github.io/.

  Note：每年可招收3~4名硕士，本实验室以发表顶级会议为主，科研氛围浓厚，欢迎感兴趣的同学通过zanderqin@bit.edu.cn联系。

  科研方向

  1. 智能推荐系统，协同过滤

  2. 生成式人工智能，大语言模型，图神经网络

  3. 物联网，多智能体强化学习

