bio_raw: '个人信息

  王铁军，博士，教授，博士生导师。

  王铁军分别入选国家高层次人才特殊支持计划、国家特聘专家、国家开发银行特聘专家、北京市“海外高层次人才”、北京市政府特聘专家、中关村高端领军人才、北京市侨联特聘专家委员会委员。

  王铁军于美国哥伦比亚大学（Columbia University）获无线通信专业硕士学位；于美国加州大学（圣地亚哥） （University of California,
  San Diego）无线通信中心获得博士学位。王铁军先后师从于Dr. Richard D. Gitlin （贝尔实验室技术总监、美国工程院院士、IEEE终身院士），Dr.
  John G. Proakis （数字通信的奠基者和学术领袖、IEEE终身院士）。

  王铁军曾于世界最大的射频芯片设计、制造公司 RF Micro Devices, Inc. （RFMD）领导技术和策略发展；曾任爱立信（Ericsson）通信有限公司东北亚区（大中国区、日本、韩国）高级副总裁，并兼行业与企业事业部总裁。

  王铁军拥有六十余项已批准授权的发明专利，其中80%的专利已授权世界500强企业有偿使用，是知识产权发展中维权成功的范例，为世界科技进步和经济发展作出巨大贡献。

  王铁军作为中国致公党党员、致公党中央科技部委员、致公党北京市科技委员会副主任、政协委员积极参政议政，为国家科技创新献计献策。

  每年计划招收博士生1-2名、硕士研究生2名；同时非常欢迎优秀的高年级本科生加入实验室。

  招生要求：a. 诚实守信；b. 读博（研）学习目的明确；c. 喜欢数学，数学成绩优异（要出示高数、线性代数、概率论等数学课程成绩）；d. 热爱编程，编程能力强；e.
  英语水平优； f. 实干，动手能力强。

  实验室具备非常强的硬件、软件研发环境，并支持北京、深圳两地研发；实验室项目包括软硬件研发类、智慧应用场景落地类；此外每年开展针对学生的专项竞赛项目（有资金奖励）。

  国际知名科学家（Dr. Richard Gitlin, Dr. John Proakis, Dr. David Lyon, etc.）合作指导科研工作；表现优秀者将推荐至美国知名高校。

  有意加入实验室的学生请将个人简历发送至：lisa.ta@chinaentropy.com/ ronald.wang@chinaentropy.com

  科研方向

  工业物联网、人工智能、大数据，无线通信

  代表性学术成果

  王铁军在通信领域国际最高级学术刊物上发表了多篇被业界高度关注和广泛引用的论文，荣获2006年世界IEEE PIMRC最佳论文奖。

