  承担科研情况

  王铁军博士曾参与国家根CA的建设；曾在美国贝尔实验室 （Bell Labs）、Ericsson San Diego研发中心主导空时复用 MIMO CDMA、Doppler效应对OFMD系统的影响等科研项目；曾在美国RFMD与研发团队成功研制多款被NOKIA、Samsung、Sony
  Ericsson等广泛商用的射频芯片；回国后主持数十项物联网、人工智能等领域科技项目，设计并牵头实施了全国首个基于多模异构承载网络及边缘计算的人工智能工业物联网，为2022冬奥会提供物联网和大数据底座支撑，并以此为基础深入开展了智慧环保、智慧森防、智慧碳汇、智慧城市管理、智慧公安等多个行业的项目建设。部分项目已被列为国家工信部物联网示范项目。

  所获奖励

  (1)入选国家级“海外高层次人才引进计划”

  (2)入选北京市“海外高层次人才引进计划”

  (3)入选中关村高端领军人才

  (4)获中国侨界贡献（创新人才）奖

  (5)获发明创业奖-创新奖一等奖：基于多模异构承载网络及边缘计算的人工智能工业物联网技术及应用

  (6)获日内瓦国际发明展（Inventions of Geneva）金奖

  社会兼职

  (1)国家特聘专家

  (2)北京市政府特聘专家

  (3)国家开发银行特聘专家

  (4)北京市侨联特聘专家委员会委员

  (5)北京市海淀区政协委员

  (6)中国国际“互联网+”创新创业大赛评审专家

