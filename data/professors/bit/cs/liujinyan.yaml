bio_raw: '个人信息

  刘金艳，准聘教授，国家级青年人才。于香港大学计算机系获得博士学位（导师： Dr. Zhiyi Huang, Prof. Siu Ming Yiu），博士期间曾在Nanyang
  Technological University, Singapore (Host: Dr. Xiaohui Bei)和Georgia Institute of
  Technology, USA (Host: Dr. Rachel Cummings)访学。研究兴趣包括但不限于人工智能中的隐私保护与安全防御，机器人的模型学习与数据驱动，数据资源的在线学习与机制设计，和多智能体的协同控制与博弈研究等。在计算机科学的国际顶级会议/期刊NeurIPS,
  AAAI, AI, WINE等发表多篇学术论文，主持国家自然科学基金青年项目，担任中国计算机学会理论计算机专业委员会执行委员，担任NeurIPS, AAAI，ICML,
  TKDE, ICLR, ITCS等计算机会议/期刊程序委员会成员或审稿人。获得人工智能国际顶会AAAI 2020唯一最佳学生论文奖。

  每年计划招收1名博士研究生和3名硕士研究生，欢迎优秀本科生参与实验室科研，可推荐优秀学生赴海外知名高校学习。

  科研方向

  人工智能、具身智能、隐私安全、博弈论等

