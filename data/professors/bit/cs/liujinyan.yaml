  承担科研情况

  2022.01-2024.12，国家自然科学基金青年项目，62102026，基于隐私保护的拍卖机制和在线学习算法的研究，30万元，主持。

  2020.11-2027.12，北京理工大学高层次人才科研启动计划（海外高层次青年人才），100万元，主持。

  所获奖励

  人工智能国际顶会AAAI 2020最佳学生论文奖

  北京理工大学优秀人才奖 2022

