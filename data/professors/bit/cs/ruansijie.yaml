bio_raw: "个人信息\n阮思捷，助理教授、特别副研究员、硕士生导师，入选中国电子学会博士学位论文激励计划。主要研究时空数据挖掘、社会智能治理、城市计算。曾在新加坡南洋理工大学、微软亚洲研究院（MSRA）、京东集团访问。\n\
  主持国家自然科学基金、国家重点研发计划子课题、贵州省科技支撑计划、CCF产学合作基金等科研项目，在TPAMI、TKDE、KDD、ICML等高水平期刊或会议发表论文60余篇，参与编写行业/团体标准2项，申请/授权国家发明专利10余项，出版译著/教材2部。\n\
  获中国指挥与控制学会科学技术进步奖（技术发明类）一等奖、ACM SIGSPATIAL中国分会优博奖（全国每年1人）、国际会议最佳论文/最佳演示论文奖3次、KDD'25杰出程序委员、人民邮电出版社影响力译者等；作为指导教师带领学生获CCF-A类会议IJCAI'25挑战赛冠军、中国测绘学会全国大学生空间信息技术大赛特等奖等。\n\
  任中国计算机学会大数据专家委员会执行委员、ACM SIGSPATIAL中国分会执行委员、中华预防医学会公共卫生监测专业委员会青年委员、CCF-A类会议KDD'26高级领域主席、ICDE'24论坛主席、IJCAI'26高级程序委员等。\n\
  News：\n每年计划招收硕士生2~3名，欢迎勤奋、踏实、自驱力强的计算机、地理信息等相关专业的学生报考。同时，欢迎大二、大三学有余力的优秀本科生加入实验室。\n\
