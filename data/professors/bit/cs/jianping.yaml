bio_raw: '个人信息

  博士，讲师。2003年和2006年于山东大学获得工学学士和硕士学位，2010年于中科院自动化所模式识别国家重点实验室获得工学博士学位，师从宗成庆研究员；同年进入北京理工大学计算机学院工作至今，现于语言智能与社会计算团队从事自然语言处理及机器学习相关研究，学术带头人黄河燕教授（院长）。

  科研方向

  主要从事自然语言处理领域相关研究，具体包括篇章文本理解、机器翻译、知识挖掘、深度学习等。研究兴趣也涉及图像处理等领域。

  代表性学术成果

  1. Xiaohan She, Ping Jian*, Pengcheng Zhang and Heyan Huang. Leveraging hierarchical
  deep semantics to classify implicit discourse relations via mutual learning method.
  Transactions on Asian and Low-Resource Language Information Processing (TALLIP),
  2018. (SCI, 0.562)

  2. Xuewen Shi, Heyan Huang, Ping Jian*, and Yi-Kun Tang. Training set similarity
  based parameter selection for statistical machine translation. APWeb-WAIM 2018.
  (CCF C)

  3. Wenpeng Lu, Hao Wu, Ping Jian, Yonggang Huang, Heyan Huang. An empirical study
  of classifier combination based word sense disambiguation. IEICE TRANSACTIONS on
  Information and Systems, 2018. (SCI, 0.411)

  4. Ruiying Geng，Ping Jian*，Yingxue Zhang and Heyan Huang. Implicit discourse relation
  identification based on tree structure neural network. IALP 2017.

  5. Xuewen Shi, Heyan Huang, Ping Jian*, Yuhang Guo, Xiaochi Wei, and Yikun Tang.
  Neural Chinese word segmentation as sequence to sequence translation. SMP 2017.

  6. Chi Lu, Heyan Huang, Ping Jian, Dan Wang, Yidi Guo, A P-LSTM neural network for
  sentiment classification. PAKDD 2017. (CCF C)

  7. Hao Wu, Heyan Huang, Ping Jian, Yuhang Guo, Chao Su. BIT at SemEval-2017 Task
  1: Using semantic information space to evaluate semantic textual similarity, SemEval-2017.
  (Best Evaluation)

  8. Ping Jian*, Keming Chen and Chenwei Zhang. A hypergraph based context-sensitive
  representation technique for VHR remote sensing image change detection. International
  Journal of Remote Sensing, 2016. (SCI, 1.724).

  9. Xiaohan She, Ping Jian*, Pengcheng Zhang and Heyan Huang. Leveraging hierarchical
  deep semantics to classify implicit discourse relations via mutual learning method.
  NLPCC 2016.

  10. Wei Cheng, Yue Zhu, Yuansheng Song and Ping Jian*. Dimensional Sentiment Analysis
  for Chinese Words Based on Synonym Lexicon and Word Embedding. IALP 2016.

  11. Peidong Guo, Heyan Huang, Ping Jian and Yuhang Guo. Prosodic annotation enriched
  statistical machine translation. 10th International Symposium on Chinese Spoken
  Language Processing, 2016.

  12. Ping Jian*, Xiaohan She, Chenwei Zhang, Pengcheng Zhang and Jian Feng. Discourse
  relation sense classification systems for CoNLL-2016 Shared Task. CoNLL 2016.

  13. Yanlin Hu, Heyan Huang, Ping Jian and Yuhang Guo. Improving conversational spoken
  language machine translation via pronoun recovery. SMP 2015.

  14. Ying Fang, Heyan Huang, Ping Jian, Xin Xin and Chong Feng. Self-adaptive topic
  model: A solution to the problem of “rich topics get richer”. China Communications,
  2014. (SCI, 0.344)

  15. Keming Chen, Ping Jian, Zhixin Zhou, Jian’en Guo and Daobing Zhang. Semantic
  annotation of high-resolution remote sensing images via Gaussian process multi-instance
  multilabel learning. Geoscience and Remote Sensing Letters, 2013. (SCI, 1.809)

  承担科研情况

  主要主持项目：

  1. 2017.10 ~ 2021.9国家重点研发计划项目：大数据驱动的自然语言理解、问答和翻译，子课题负责人

  2. 2014.7~2016.6 国家863计划军口项目：***关联和检索技术，项目负责人

  3. 2013.1~2015.12国家自然科学基金青年项目：篇章结构分析及基于双语投射的篇章标注方法研究，项目负责人

  4. 2011.1~2012.12国家重点实验室开放课题项目：高性能汉语依存句法分析方法研究与系统实现，项目负责人

  5. 2013.1~2013.12 北京理工大学基础研究基金项目：基于篇章连贯性的统计机器翻译方法研究，项目负责人

  合作或参与项目：

  1. 2016.1~2018.12国家自然科学基金青年项目：基于非独立同分布学习理论的图模型词义消歧及领域适应方法研究，联合申请

  2. 2013.1~2017.12 国家973计划项目：互联网环境中文言语信息处理与深度计算的基本理论和方法，核心骨干

  3. 2015.1~2017.12 国家863计划项目：基于海量知识的语言信息智能理解与推理关键技术，骨干

  4. 2011.1~2012.12北理工优秀青年教师资助计划跨学科合作项目：基于Supply- Hub的供应物流协同运作管理机制与关键技术研究，联合申请

  所获奖励

  北京理工大学计算机学院“我心目中的好导师”称号，2015年

  社会兼职

  全国高等院校计算机基础教育研究会数据科学专委会副秘书长；

  中国计算机学会中文信息计算专委会通讯委员；

  ACM、CCF、CAAI、CIPS会员；

  EMNLP、Coling等国际会议评审人，软件学报、计算机研究与发展等期刊评审人；

  国家自然科学基金函评评审人。

  备注

  招收研究生及高年级本科生，如对相关研究方向感兴趣，请与我联系。'
