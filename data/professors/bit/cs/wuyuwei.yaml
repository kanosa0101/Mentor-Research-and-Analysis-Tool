bio_raw: '个人信息

  武玉伟，长聘副教授、特别研究员、博士生导师。 2014年7月于北京理工大学获得计算机应用技术工学博士学位，2014年8月至2016年8月赴新加坡南洋理工大学电气电子工程学院从事博士后研究，2016年10月加入北京理工大学计算机学院。武玉伟主要从事计算机视觉和机器学习等领域的研究；在中国计算机学会（CCF）推荐A类期刊/会议或中科院JCR
  1区期刊发表论文60余篇，出版教材2部；获中国人工智能学会优秀博士学位论文提名奖。作为负责人承担国家自然科学基金、北京市自然科学基金等项目。培养或合作培养学生中有1位获得ACM
  中国人工智能分会优秀博士学位论文奖，6位研究生获得北京理工大学校级优秀博士学位论文或优秀硕士学位论文。

  每年计划招收博士生2-3名，硕士生2名，欢迎对计算机视觉、机器学习等领域研究感兴趣的同学加入课题组。详细信息请访问https://wu-yuwei-bit.github.io/

  科研方向

  计算机视觉：语言驱动的视觉感知、机器人智能交互计算

  机器学习：非欧空间表示学习

