bio_raw: '个人信息

  博士。研究生导师。中国仿真学会秘书长，中国仿真学会环境建模仿真专业委员会委员，全国高等院校计算机基础教育研究会在线教育专委副秘书长。2007年和2010年获得北京航空航天大学学士和硕士学位，硕士毕业后获得国家留学基金委博士生奖学金赴法学习，2013年获得法国里尔中央理工学校（Ecole
  Centrale de Lille）博士学位。2014年2月进入北京理工大学计算机学院工作。主持国家自然科学基金等项目，曾发表多篇SCI检索国际期刊论文、多篇EI检索国际会议论文和国内核心期刊论文。国家级“大学计算机公共课教学团队”主要成员，承担本科生“人工智能与计算科学”、“计算机基础”、“C语言程序设计”、“计算机科学与程序设计”、“虚拟现实技术”和研究生“虚拟现实与人机交互”等课程教学任务，主持教育部产学合作教改项目2项，曾获国家级教学成果奖二等奖、北京市教育教学成果一等奖等奖项。

  科研方向

  计算机视觉，计算机图形学，虚拟现实，机器学习，计算机仿真

  代表性学术成果

