  承担科研情况

  主持和主持完成国家自然科学基金项目共8项、国家863高技术等国家级和国际合作项目15项。

  所获奖励

  以第一完成人获得全国高校技术发明二等奖1项、国防科学技术二等奖1项和三等奖1项、 兵器科学技术奖二等奖1项。

