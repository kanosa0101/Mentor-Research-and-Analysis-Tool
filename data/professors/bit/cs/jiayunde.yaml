bio_raw: '个人信息

  贾云得博士，北京理工大学计算机学院二级教授，博士生导师，北京理工大学学术委员会委员。1995年至1997年在美国卡内基-梅隆大学（CMU）计算机学院客座研究，2011年在澳大利亚国立大学（ANU）客座研究。发表学术论文200余篇，获得国家发明专利12项。

  http://iitlab.bit.edu.cn/mcislab/~jiayunde/

  科研方向

  计算机视觉、人工智能、认知计算、智能系统

  代表性学术成果

  近

  3

