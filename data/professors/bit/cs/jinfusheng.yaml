  备注

  欢迎对机器学习、大数据、区块链、人工智能等研究方向感兴趣的同学与我邮件联系。培养毕业的学生多数已经成为国家机关、科研院所、央企、国企，以及字节、拼多多、华为、阿里、百度、京东、360等单位的技术负责人。'
