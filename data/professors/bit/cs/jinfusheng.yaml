bio_raw: '个人信息

  金福生，博士，教授，博士生导师，数据科学与知识工程研究所副所长，数据科学与大数据技术教学研究中心主任，计算机学会高级会员，中国指挥与控制学会认知与行为专委会总干事，（国家自然科学基金、北京市信息化专家委，北京市科学技术委员会，中关村科技园区管理委员会）等评审专家，主持及参与了国家自然科学基金面上项目、国家科技重大专项、国家重点研发计划、发改委、北京市科委等国家级科研项目10余项，横向课题10余项，发表论文20余篇，申请和授权专利20余项。

  指导学生去向包括到美国西北大学、英国帝国理工大学、英国布里斯托大学、英国爱丁堡大学、德国慕尼黑大学、澳大利亚墨尔本大学继续深造，进入字节跳动、腾讯、阿里巴巴、拼多多、美团、百度、360、京东等公司，或中国工商银行、中国农业银行、中国银行、航天一院、航天二院、航天四院、中国船舶、华为等单位。

  科研方向

  软件架构、机器学习、深度学习、区块链、大数据、人工智能

