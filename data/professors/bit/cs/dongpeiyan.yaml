bio_raw: '个人信息

  北京理工大学计算机学院准聘教授，国家级青年人才，MIT-Novo Nordisk Fellow。同时，担任麻省理工学院访问科学家（2026–至今)，由 Anantha
  Chandrakasan 教授（MIT 副校长）和 Angela Belcher教授（MIT 生物工程系主任，美国三院院士） 联合指导。

  研究聚焦于高效AI算法与硬件协同设计，涵盖模型量化、剪枝、视觉Transformer及大语言模型加速，并有多颗 28nm CMOS AI 芯片的流片验证和FPGA
  Versal ACAP大模型异构计算的落地经验。研究成果发表于NeurIPS、TPAMI、HPCA、DAC、ICCAD等国际顶级会议。

  同时，致力于医学AI的应用研究，曾与Dana-Farber癌症研究所、宾夕法尼亚大学合作，建立无标记成像的癌症突变检测平台；与约翰霍普金斯医院合作高光谱卵巢癌检测系统"OVASEEK"。

  每年招收：硕士生2~3名，博士生1名。

  科研方向

  AI 芯片与加速器、大模型高效算法、智能医疗设备与生物发现

