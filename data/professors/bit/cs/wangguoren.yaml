bio_raw: '个人信息

  王国仁，男，1966年5月出生，博士，教授，博士生导师、国务院学科评议组成员、国家自然科学基金委信息学部专家评审组成员、 中国计算机学会数据库专业委员会副主任委员。入选国家级领军人才，授予“有突出贡献中青年专家”荣誉称号。分别于1988年、1991年和1996年获得东北大学计算机专业学士、硕士和博士学位。

  主持国家自然科学基金重点项目和广东联合基金重点项目、国家863计划项目等20余项。获得国家科技进步二等奖、辽宁省科技进步一等奖、教育部自然科学二等奖、辽宁省自然科学二等奖等省部级科学技术奖励共10项。

  指导的博士研究生获得国家百篇优秀论文提名奖2篇、辽宁省优秀博士论文2篇、中国计算机学会优秀论文1篇。

  每年招博士生1到2名，硕士生3到4名，欢迎对数据库领域研究有兴趣的同学加入课题组。

  科研方向

  不确定数据管理、数据密集型计算、可视媒体数据管理与分析、非结构化数据管理、分布式查询处理与优化技术（主要包括传感器网络和P2P对等计算）、生物信息学等。

  代表性学术成果

  发表学术论文300余篇，主要包括 IEEE Transactions on Knowledge and Data Engineering、 IEEE Transactions
  on Parallel and Distributed Systems、 IEEE Transactions on Systems Man and Cybernetics、ACM
  Transactions on Internet Technology等顶级学术期刊 和SIGMOD、VLDB、ICDE等顶级学术会议。

  （1）Guoren Wang, Junchang Xin, Lei Chen, Yunhao Liu. Energy-Efficient Reverse Skyline
  Query Processing over Wireless Sensor Networks. IEEE Trans. Knowledge and Data Engineering.
  24(7): 1259 - 1275 (2012). (CCF A类)

  （2）Guoren Wang, Bin Wang, Xiaochun Yang, Ge Yu: Efficiently Indexing Large Sparse
  Graphs for Similarity Search. IEEE Trans. Knowl. Data Eng. 24(3): 440-451 (2012).  (CCF
  A类)

  （3）Rong-Hua Li, Qiangqiang Dai, Lu Qin, Guoren Wang, Xiaokui Xiao, Jeffrey Xu Yu,
  Shaojie Qiao, Efficient Signed Clique Search in Signed Networks, ICDE 2018（CCF A类）

  （4）Yurong Cheng, Ye Yuan, Lei Chen, Christophe G. Giraud-Carrier, Guoren Wang: Complex
  Event-Participant Planning and Its Incremental Variant. ICDE 2017: 859-870.  (CCF
  A类)

  （5）Ye Yuan, Xiang Lian, Lei Chen, Jeffrey Xu Yu, Guoren Wang, Yongjiao Sun: Keyword
  Search over Distributed Graphs with Compressed Signature. IEEE Trans. Knowl. Data
  Eng. 29(6): 1212-1225 (2017)  (CCF A类)

  （6）Rui Zhu, Bin Wang, Xiaochun Yang, Baihua Zheng, Guoren Wang: SAP: Improving Continuous
  Top-K Queries Over Streaming Data. IEEE Trans. Knowl. Data Eng. 29(6): 1310-1328
  (2017)  (CCF A类)

  （7）Mei Bai, Junchang Xin, Guoren Wang, Luming Zhang, Roger Zimmermann, Ye Yuan,
  Xindong Wu: Discovering the k Representative Skyline Over a Sliding Window. IEEE
  Trans. Knowl. Data Eng. 28(8): 2041-2056 (2016)  (CCF A类)

  （8）Yurong Cheng, Ye Yuan, Lei Chen, Guoren Wang, Christophe G. Giraud-Carrier, Yongjiao
  Sun: DistR: A Distributed Method for the Reachability Query over Large Uncertain
  Graphs. IEEE Trans. Parallel Distrib. Syst. 27(11): 3172-3185 (2016)  (CCF A类)

  （9）Ye Yuan, Guoren Wang, Lei Chen, Haixun Wang: Graph similarity search on large
  uncertain graph databases. VLDB J. 24(2): 271-296 (2015)  (CCF A类)

  （10）Yuhai Zhao, Guoren Wang, Xiang Zhang, Jeffrey Xu Yu, Zhanghui Wang: Learning
  Phenotype Structure Using Sequence Model. IEEE Trans. Knowl. Data Eng. 26(3): 667-681
  (2014)  (CCF A类)

  （11）Ye Yuan, Guoren Wang, Lei Chen, Haixun Wang: Efficient Subgraph Similarity Search
  on Large Probabilistic Graph Databases. PVLDB 5(9): 800-811 (2012).  (CCF A类)

  （12）Ye Yuan, Guoren Wang, Haixun Wang, Lei Chen: Efficient Subgraph Search over
  Large Uncertain Graphs. PVLDB 4(11): 876-886 (2011).  (CCF A类)

  承担科研情况

  (1)国家自然科学基金重点项目：大图数据管理与分析的基础理论与关键技术研究 (61732003)

  (2)国家自然科学基金海外及港澳学者合作研究基金：面向社会计算的众包数据管理与分析技术研究（61729201）

  (3)国家自然科学基金广东联合基金重点项目：基于超云平台的社会化移动网络大数据管理与分析关键技术研究(U1401256)

  (4)国家杰出青年基金项目：不确定图数据管理与分析技术(61025007)

  (5)国家自然科学基金重点项目：不确定数据管理的理论与关键技术(60933001)

  (6)国家重点基础研究发展计划(973)：多模态可视媒体数据挖掘关键技术(2011CB302200-G)

  (7)国家高技术发展计划(863)：海量不确定异构数据的集成管理与分析技术

  所获奖励

  (1)2011年当选国家长江学者特聘教授

  (2)2010年获国家杰出青年科学基金

  (3)2014年国家百千万人才工程入选者

  (4)2014年国家级有突出贡献中青年专家

  (5)2011年国家科技进步二等奖: 面向现代服务业的空地一体化网络管理与远程故障诊断维护系统

  (6)2016年获高等学校科学技术进步一等奖：海量异构数据集成管理与分析技术及应用

  (7)2014年辽宁省科技进步一等奖：非结构化数据管理关键技术及应用

  (8)2008年辽宁省自然科学三等奖：XML数据管理技术

  社会兼职

  (1)第七届国务院学科评议组成员；

  (2)国家自然科学基金委信息学部专家评审组成员；

  (3)中国计算机学会数据库专业委员会副主任委员。

  备注'
