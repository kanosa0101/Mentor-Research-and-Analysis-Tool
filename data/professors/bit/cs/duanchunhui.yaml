  承担科研情况

  1. 北京市自然科学基金面上项目，面向物流场景的多维度RFID安全认证技术研究，2026/01-2028/12，项目负责人

  2. 国家自然科学基金青年科学基金项目，基于射频识别和计算机视觉技术的室内定位理论和方法研究，2020/01-2022/12，项目负责人

  3. 北京理工大学青年教师学术启动计划，2021/03至今，项目负责人

  4. 中国博士后科学基金面上资助，融合射频识别和计算机视觉技术的目标追踪方法研究，2019/05-2021/02，项目负责人

  5. 科技创新2030—“新一代人工智能”重大项目，面向智慧出行的城市群智感知验证系统，2019/12-2022/12，课题骨干

  6. 国家重点研发计划，面向工业生产环境的非传感器感知和多媒体信息自适应感知技术，2017/10-2021/09，参与人员

  所获奖励

  1. 段春晖 (6/13)，中国科技产业化促进会科技创新奖二等奖，2025

  2. 北京理工大学优秀硕士学位论文（薛佳伟）指导教师，2025

  3. 指导研究生多次获得国家奖学金、北京理工大学优秀毕业生等荣誉

