bio_raw: '个人信息

  段春晖，博士，副教授，博士生导师。2013年和2018年分别于清华大学软件学院获得学士和博士学位。2018年10月至2021年2月在清华大学担任博士后研究员，2021年3月加入北京理工大学计算机学院。主要研究方向包括智能物联网、移动计算、隐私与安全等。近年来在IEEE
  TMC、IEEE/ACM TON、ACM TOSN、IEEE INFOCOM、ACM UbiComp、ACM MobiCom、IEEE SECON、IEEE ICDCS等国际知名期刊和学术会议上发表论文30余篇。主持并参与多项国家和省部级科研项目，包括国家自然科学基金项目、北京市自然科学基金项目、中国博士后科学基金面上资助等。长期担任多个国内外会议和期刊（如PerCom、IPSN、TMC、TOSN、IoT-J、Tsinghua
  Science and Technology、计算机学报等）的程序委员会委员和审稿人。（详细信息请见个人主页：duanch.github.io）

  每年计划招收博士生1人、硕士生2人，同时欢迎优秀的本科生加入实验室。

  科研方向

  智能物联网、移动计算、隐私与安全等

