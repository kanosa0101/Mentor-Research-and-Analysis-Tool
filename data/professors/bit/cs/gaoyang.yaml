bio_raw: '个人信息

  博士生导师，主要从事大模型训练、文本自动生成技术，及其技术应用转化。发表国际期刊会议高水平论文60余篇，包括CCF A类、SCI等。担任AAAI, WebConf,
  ARR 等文本生成领域主席，国际期刊编委，高水平国际会议程序委员会委员，及期刊审稿人。主持研发DirectionAI智慧教育平台（http://directionai.cn）及其成果转化，以及明德基座大模型研发（MindLLM）和国产生态大模型建设，开源
  “端侧”对话大模型等一系列开源项目（https://github.com/DIRECT-BIT）。作为参与人获得中国电子学会科技进步奖一等奖，国防科技进步二等奖。爱丁堡大学访问学者，担任中国中文信息学会青工委，CCF
  大模型论坛执委，CCF YOCSEF委员等。

  科研方向

  大模型训练与原理、自主进化与推理思考模型、文本生成及其技术应用转化

