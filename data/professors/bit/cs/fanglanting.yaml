  承担科研情况

  动态图异常检测的稳定性与可解释性研究，国家自然科学基金(NSFC)面上基金项目, 2025-2028  （项目负责人）

  应急指挥调度情报资源管理与应用技术研究-多灾种情报研判分析及印证模型研究，应急管理部重点科技计划，2024-2026  （课题负责人）

  基于迁移学习的社交网络虚假新闻检测关键技术研究，国家自然科学基金(NSFC)青年科学基金项目（项目负责人）

