bio_raw: '个人信息

  北京理工大学计算机学院副教授。主要研究方向是图数据挖掘，包括可解释性、鲁棒性等算法问题和社交网络、空间数据等应用问题。主持、参与20余项国家级、省部级及企业合作科研项目。受邀担任NeurIPS，TKDE、ICLR、AAAI、计算机学报等多个顶级学术会议和期刊的程序委员会委员/审稿人。2018年于东南大学获博士学位，博士就读期间曾在新加坡南洋理工大学联合培养学习。2019年1月-2023年4月就职于东南大学，2024年5月就职于北京理工大学。

  每年计划招收博士、硕士研究生3人左右，同也欢迎优秀的本科生加入实验室。有意加入本课题组的学生请将个人简历发送至： ltfang@bit.edu.cn

  个人主页：https://fanglanting.github.io/

  科研方向

  社交网络分析、时空数据挖掘、图神经网络、鲁棒性机器学习、异常检测

