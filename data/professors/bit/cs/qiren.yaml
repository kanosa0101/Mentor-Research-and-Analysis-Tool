bio_raw: '个人信息

  齐忍，博士，预聘助理教授/特别副研究员，硕士生导师。2022年于天津大学获得博士学位，博士期间于美国俄亥俄州立大学（The Ohio State University）联合培养一年。2024年于电子科技大学博士后出站，同年加入北京理工大学计算机学院。主持国家自然科学基金面上项目、青年科学基金项目。发表SCI-1区、CCF-A类等高水平论文10余篇。担任《Current
  Bioinformatics》编委，IEEE International Conference on Bioinformatics and Biomedicine
  (BIBM) PC。担任 Briefings in Bioinformatics，Frontiers of Computer Science等SCI期刊审稿人。主要研究方向包括药物反应预测、单细胞数据分析、机器学习、生物信息学。

  科研方向

  生物信息学、药物研究、单细胞数据分析、自然语言处理

  代表性学术成果

  1. Ren Qi, Shujia Liu, Xingqi Hui, Alexey K Shaytan, Bin Liu.AI in drug development:
  advances in response, combination therapy, repositioning and molecular design [J].
  SCIENCE CHINA Information Sciences. 2025.(中科院SCI-1区，CCF A)

  2. Ren Qi, Anjun Ma, Qin Ma, Quan Zou. Clustering and classification methods for
  single-cell RNA-sequencing data [J]. Briefings in Bioinformatics . 2020, 21(4):
  1196-1208.(中科院SCI-1区, TOP, IF=11.622)

  3. Ren Qi, Jin Wu, Fei Guo, Lei Xu, Quan Zou. A spectral clustering with self-weighted
  multiple kernel learning method for single-cell RNA-seq data [J]. Briefings in Bioinformatics
  , 2021, 22(4): bbaa216. (中科院SCI-1区, TOP,IF=11.622)

  4. Ren Qi, Quan Zou. Trends and Potential of Machine Learning and Deep Learning
  Techniques in Drug Study at Single-cell Level [J]. Research, 2023, 6:0050. (中科院SCI-1区,
  IF=11.036)

  5. Mengting Niu, Chunyu Wang, Yaojia Chen, Quan Zou, Ren Qi*, Lei Xu*. CircRNA Identification
  and Feature Interpretability Analysis [J]. BMC Biology , 2024, 22:44.(中科院SCI-1区,
  TOP, IF=7.1，通讯作者)

  6. Zhecheng Zhou, Linlin Zhuo*, Xiangzheng Fu*, Juan Lv, Quan Zou, Ren Qi*. Joint
  masking and self-supervised strategies for inferring small molecule-miRNA associations
  [J]. Molecular Therapy: Nucleic Acid , 2024,35(1): 102103.  (中科院SCI-2区, TOP, IF=10.183，通讯作者)

  7. Ren Qi, Zehua Zhang, Jin Wu, Lijun Dou, Lei Xu, Yue Cheng. A new method for handling
  heterogeneous data in bioinformatics [J]. Computers in Biology and Medicine, 2024,
  170: 107937.  (中科院SCI-1区, TOP, IF=7.7)

  8. Ren Qi, Quan Zou. Special Protein or RNA Molecules Computational Identification
  [J]. International Journal of Molecular Sciences, 2023, 24(14):11312.(中科院SCI-2区,IF=6.2)

  9. 齐 忍, 朱鹏飞, 梁建青. 混杂数据的多核几何平均度量学习[J]. 软件学报, 2017, 28(11):2992-3001. (CCF-A类期刊，2017年中国机器学习会议最佳学生论文奖).

  10. Ren Qi, Fei Guo, Quan Zou. String kernels construction and fusion: a survey
  with bioinformatics application [J]. Frontiers of Computer Science , 2022,16(6):166904.
  (CCF-B类期刊, IF=4.2)

  11. Mingshuai Chen, Quan Zou, Ren Qi*, Yijie Ding*. PseU-KeMRF: A novel method for
  identifying RNA pseudouridine sites[J]. IEEE/ACM Transactions on Computational Biology
  and Bioinformatics, 2024. (CCF-B类期刊, 通讯作者）

  12. Pengfei Zhu, Ren Qi, Qinghua Hu, Qilong Wang, Changqing Zhang, Liu Yang. Beyond
  similar and dissimilar relations: a kernel regression formulation for metric learning.
  Twenty-Seventh International Joint Conference on Artificial Intelligence (IJCAI),
  2018.(CCF A类会议)

  13. Ren Qi, Quan Zou. Editorial: Machine learning methods in single-cell immune
  and drug response prediction [J]. Frontiers in Genetics , 2023, 14:1233078. (中科院SCI,
  IF=4.772)

  14. Ren Qi, Arun Kumar Sangaiah, Dariusz Mrozek, Quan Zou.  Machine Learning Techniques
  on Gene Function Prediction Volume II [J]. Frontiers in Genetics ,2022, 13:949285.
  (中科院SCI, IF=4.772)

  15. Juexin Wang, Anjun Ma, Yuzhou Chang, Jianting Gong, Yuexu Jiang, Ren Qi, et
  al. scGNN: a novel graph neural network framework for single-cell RNA-Seq analyses[J].
  Nature Communications , 2021,12(1):1-11. (Nature子刊，SCI-1区，TOP，IF=12.121)

  承担科研情况

  1.国家自然科学基金面上项目，基于单细胞多组学数据的细胞-药物反应预测深度强化学习模型的构建与研究，项目负责人。

  2. 国家自然科学基金青年科学基金项目，基于单细胞测序数据的药物反应预测研究，项目负责人。

  3. 浙江省博士后基金择优资助项目一等资助，精准医疗中单细胞测序数据分析方法的开发及应用，项目负责人。

  所获奖励

  2024年  ACM SIGBIO China 新星奖

  2023年 海南省科学技术奖自然科学奖三等奖（排名第二）

  2019年 天津市硕士研究生优秀学位论文奖

  2017年 中国机器学习会议最佳学生论文奖

  社会兼职

  《Current Bioinformatics》Editorial Board Member

  IEEE International Conference on Bioinformatics and Biomedicine (BIBM)  PC

  备注

  每年招收硕士生2名，欢迎坐得住、想得开、有计算机相关专业背景的学生报考！联系方式：rqi@bliulab.net.'
