bio_raw: '个人信息

  余皓然，副教授，博士生导师。2016年于香港中文大学信息工程系取得博士学位，2015至2016年到耶鲁大学进行交流访问。取得博士学位后，先后于香港中文大学信息工程系和美国西北大学电子与计算机工程系任博士后研究员。2020年加入北京理工大学计算机学院，任副教授。迄今共在AAAI、IJCAI、INFOCOM、TON、TMC、JSAC等CCF
  A类国际学术会议或期刊上发表20余篇论文。（本页面不常更新，详细信息请见个人主页：yu-haoran.github.io）

  科研方向

  研究方向为人工智能与博弈论的交叉融合，旨在利用深度学习、强化学习、贝叶斯学习及大语言模型等方法或工具，针对各类博弈场景，从数据中学习个体的行为偏好、建立博弈行为模型，并设计适用于动态不确定环境的算法或机制。（详见个人主页：yu-haoran.github.io）

