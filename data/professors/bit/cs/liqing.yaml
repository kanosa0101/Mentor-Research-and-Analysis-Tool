  承担科研情况

  [1] 国家自然科学基金重大研究计划培育项目，脑启发的神经网络新架构及训练学习新方法，70万，项目负责人

  [2] 国家自然科学基金青年科学基金项目，面向认知任务特异性脑龄预测的神经网络结构搜索算法研究，30万，项目负责人

  [3] 中央高校基本科研业务费，基于深度学习的脑状态解码与分类研究，5 万元，项目负责人

  [4] 国家杰出青年科学基金项目，脑功能数据分析与类脑算法研究，400 万元，项目核心成员

  [5] 科技部重点研发计划课题，多模态交互式学习能力评估理论与方法，300 万元，项目核心成员

  [6] 国家自然科学基金重点项目，受大脑认知启发的类脑决策神经网络理论与方法，287 万元，项目核心成员

  [7] JKW重点项目，基于脑功能数据的***提取与***解码，200 万元，项目核心成员

  [8] 北京市自然科学基金重点项目，开放动态环境中基于记忆增强的智能体关键技术研究，300 万元，项目核心成员

  所获奖励

  指导学生获得：

  [1] “灵犀慧视”——基于脑功能的神经指纹提取与脑认知解码，世纪杯 二等奖

  [2] 2024世界机器人大赛锦标赛BCI脑控机器人大赛 二等奖

  [3] PsySync——基于预训练大模型的脑启发心理测评  大创国家级立项

  社会兼职

  中国自动化学会生物控制论与生物医学工程专委会 委员

  中国计算机学会（CCF） 会员

  IEEE Member

  长期担任Neural Networks、Artificial Intelligence in Medicine、CMPB、ISA Transactions、数据采集与处理、MICCAI、CICAI等期刊会议审稿人

  备注

  北京理工大学计算机学院脑机接口与类脑智能研究中心每年招收博士研究生和硕士研究生多名，欢迎感兴趣的同学联系我们！ 本中心常年招收脑机接口与类脑智能方向博士后研究员以及校企联合培养博士后研究员，优秀申请者可以推荐至学校参评特立博后和国际交流项目。
  此外，本中心长期招收校内外实习生，有继续深造意愿，希望攻读硕士/博士学位，掌握深度学习、脑科学基础、有竞赛经历申请者优先！中心研究经费充足，拥有多台华为昇腾910系列高性能显卡服务器和NVIDIA
  L40S、A100以及H100高性能显卡计算集群，期待加入！最新文章列表可关注：https://scholar.google.com/citations?user=yNW6l7EAAAAJ&hl=zh-CN

