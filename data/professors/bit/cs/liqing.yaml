bio_raw: '个人信息

  李晴，博士，特别副研究员，硕士生导师，脑机接口与类脑智能研究中心副主任。

  2022年1月于北京师范大学获计算机应用技术博士学位，师从邬霞教授。2018年10月至2020年10月受国家留学基金委资助赴美国佐治亚大学公派留学，师从Tianming
  Liu（刘天明）教授。2022年2月至2024年1月于北京师范大学认知神经科学与学习国家重点实验室从事博士后研究工作，合作导师为贺永教授。随后加入北京理工大学计算机学院脑机接口与类脑智能研究中心。

  在MedIA、IEEE TBME、IEEE JBHI、软件学报、MICCAI、IPMI等国内外顶级期刊和会议上发表学术论文30余篇，授权国家发明专利2项。主持国家自然科学基金重大研究计划、青年科学基金、国家重点实验开放课题等项目，参与十余项国家级、省部级项目。

  课题组常年与哈佛大学、康奈尔大学、悉尼大学 、加州大学洛杉矶分校、香港科技大学、清华大学、中国科学院计算技术研究所等国际国内顶尖研究团队开展学术合作，与华为中央研究院、理想汽车、国家电网建立了长期校企合作关系。课题组每年招收多名博士和硕士研究生，欢迎对人工智能与脑科学等相关领域研究有兴趣的同学加入。

  科研方向

  主要研究方向为人工智能与脑科学，包括：深度学习、类脑算法、脑功能机制、模型优化等。

