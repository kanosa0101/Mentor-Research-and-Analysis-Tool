bio_raw: '个人信息

  吴之璟，计算机学院助理教授、副研究员、硕士生导师。2017年、2022年于清华大学计算机科学与技术系分别获得学士、博士学位，博士期间曾先后前往新加坡国立大学、皇家墨尔本理工大学访问交流，曾获中国中文信息学会优秀博士论文奖。2022年7月加入北京理工大学计算机学院，主要研究方向为信息检索、自然语言处理。

  科研方向

  信息检索、自然语言处理

  代表性学术成果

  [1] Guo-Biao Zhang,

  Zhijing Wu*

  , Tian Lan, Ding-Yuan Liu, Yu-Shi Zhu, Xian-Ling Mao. WikiREVIEW: A Multi-Perspective
  Review Framework for Automatic Wiki-Style Article Generation. Proceedings of the
  AAAI Conference on Artificial Intelligence (AAAI 2026, CCF-A).

  [2] Yidong Liang,

  Zhijing Wu*

  , Fan Zhang, Dandan Song, Heyan Huang. How Users Interact with Generative Information
  Retrieval Systems: A Study of User Behavior and Search Experience. Proceedings of
  the 48th International ACM SIGIR Conference on Research and Development in Information
  Retrieval (SIGIR 2025, CCF-A).

  [3] Yidong Liang,

  Zhijing Wu*

  , Yuchen He, Fengming Liang, Kexin Liu, Jiaxin Mao*. A flexible user study platform
  for generative information retrieval. Proceedings of the 48th International ACM
  SIGIR Conference on Research and Development in Information Retrieval (SIGIR 2025,
  CCF-A).

  [4] Bangde Du, Ziyi Ye,

  Zhijing Wu*

  , Monika Jankowska, Qingyao Ai*, Yiqun Liu. Understanding the Effect of Opinion
  Polarization in Short Video Browsing. Proceedings of the 48th International ACM
  SIGIR Conference on Research and Development in Information Retrieval (SIGIR 2025,
  CCF-A).

  [5] Runheng Liu, Heyan Huang, Xingchen Xiao,

  Zhijing Wu*

  . Zero-Shot Detection of LLM-Generated Text via Implicit Reward Model. Proceedings
  of the 39th Conference on Neural Information Processing Systems (NeurIPS 2025, CCF-A).

  [6] Dongshuo Liu,

  Zhijing Wu*

  , Dandan Song, Heyan Huang. A Persona-Aware LLM-Enhanced Framework for Multi-Session
  Personalized Dialogue Generation. Findings of the Association for Computational
  Linguistics: ACL 2025 (ACL 2025, CCF-A).

  [7] Bangde Du, Ziyi Ye, Monika Jankowska,

  Zhijing Wu

  , Qingyao Ai*, Yujia Zhou, Yiqun Liu*. EEG reveals the cognitive impact of polarized
  content in short video scenarios. Scientific Reports. 2025.

  [8] Changzhi Zhou,

  Zhijing Wu*

  , Dandan Song, Linmei Hu, Yuhang Tian, Jing Xu. Span-pair interaction and tagging
  for dialogue-level aspect-based sentiment quadruple analysis. Proceedings of the
  ACM Web Conference 2024 (WWW 2024, CCF-A).

  [9]

  Zhijing Wu*

  , Jiaxin Mao, Kedi Xu, Dandan Song, Heyan Huang. A passage-level reading behavior
  model for mobile search. Proceedings of the ACM Web Conference 2023 (WWW 2023, CCF-A).

  [10]

  Zhijing Wu

  , Jiaxin Mao, Yiqun Liu, Min Zhang, Shaoping Ma. Investigating Reading Behavior
  in Fine-grained Relevance Judgment. Proceedings of the 43rd International ACM SIGIR
  Conference on Research and Development in Information Retrieval. (SIGIR 2020, CCF-A)

  [11]

  Zhijing Wu

  , Jiaxin Mao, Yiqun Liu, Jingtao Zhan, Yukun Zheng, Min Zhang, Shaoping Ma. Leveraging
  Passage-level Cumulative Gain for Document Ranking. Proceedings of the ACM Web Conference
  2020 (WWW 2020, CCF-A).

  [12]

  Zhijing Wu

  , Ke Zhou, Yiqun Liu, Min Zhang, Shaoping Ma. Does Diversity Affect User Satisfaction
  in Image Search. ACM Transactions on Information Systems. (TOIS 2019, CCF-A).

  [13]

  Zhijing Wu

  , Jiaxin Mao, Yiqun Liu, Min Zhang, Shaoping Ma. Investigating Passage-level Relevance
  and Its Role in Document-level Relevance Judgment. Proceedings of the 42nd International
  ACM SIGIR Conference on Research and Development in Information Retrieval. (SIGIR
  2019, CCF-A).

  承担科研情况

  主持国家自然科学基金面上项目一项、青年项目一项

  所获奖励

  社会兼职

  备注

  每年招收2名硕士研究生，欢迎感兴趣的同学邮件联系。'
