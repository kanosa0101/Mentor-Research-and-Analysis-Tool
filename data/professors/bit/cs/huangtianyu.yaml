bio_raw: '个人信息

  北京理工大学计算机学院教授、博导、北京市青年教学名师、北京市优秀思想政治工作者. 2007年获北京理工大学计算机博士学位，2012-2013美国宾夕法尼亚大学计算机系访问学者。主持国家重点研发计划项目、国家自然科学基金、教育部博士点基金、预研项目、技术领域基金等纵向科研10余项；参加2008北京奥运会\2022北京冬奥会开闭幕式仿真、建党百年庆祝活动仿真、60\70周年国庆活动仿真、2010-2025中央电视台春节联欢晚会数字舞台仿真等；获省部级科技成果一等奖2项，发表学术论文 40余篇，授权国家发明专利60余项。主持国家级课程3门、北京市课程思政示范课1门，主持教育部产学合作协同育人项目4项；获国家教学成果二等奖1项，北京市教育教学成果一等奖2项，全国高校教师教学创新比赛一等奖、特等奖。兼任中国仿真学会理事、计算机学会虚拟现实与可视化专委会委员、《系统仿真学报》编委。

  科研方向

  计算机仿真、虚拟现实、数字表演、智慧教育

  代表性学术成果

  [1] Qi Li, Tianyu Huang*, Xiangchen Li. HME-KG: A method of constructing the human
  motion encoding knowledge graph based on a hierarchical motion model. International
  Journal of Modeling, Simulation, and Scientific Computing, 2024.

  [2] Dapeng Yan, Gangyi Ding, Kexiang Huang, Tianyu Huang*. Generating Natural Pedestrain
  Crowds by Learning Real Crowd Trajectories Through a Transformer-Based GAN. Visual
  Computer， 2024.

  [3] Lingyu Li, Tianyu Huang*，Yihao Li，Peng Li. Trajectory-BERT: Pre-training and
  fine-tuning bidirectional transformers for crowd trajectory enhancement. Computer
  Animation and Virtual Worlds, 2023.

  [4] Da Xiao, Tianyu Huang* , Yihao Li , Chang Liu , and Fuquan Zhang, A Lightweight
  Human Action Classification Method for Green IoT Sport Applications. Journal of
  Sensors, 2022.

  [5] Jingsi Yang, Tianyu Huang*, Gangyi Ding, lijie Li, Peng Li. A Multi-layer Parallel
  Simulation and Application for Live Performing. Journal of System Simulation. 2021.

  [6]

  李弋豪

  ,

  黄天羽

  *,

  李鹏

  ,

  丁刚毅

  . 基于密集人群的表演行为建模与仿真方法研究. 系统仿真学报. 2021, 30 (7): 1617-1625

  [7] 黄天羽*, 郭芸莹. 面向动作捕捉的非线性时间序列预测方法研究. 系统仿真学报. 2018, 30 (7): 2808-2815.

  [8] Tianyu Huang*, Mubbasir Kapadia, Norman I. Badler, Marcelo Kallmann. Path Planning
  for Coherent and Persistent Groups. IEEE International Conference on Robotics and
  Automation (ICRA)2014, Hongkong.

  [9] Tianyu Huang*, Haiying Liu, Gangyi Ding．Motion retrieval based on kinetic features
  in large motion database． ACM Conference on Multimodal Interaction 2012, USA.

  [10] 黄天羽*, 石崇德, 李凤霞。一种基于判别随机场模型的联机行为识别方法.计算机学报, 32(2).2009.2

  承担科研情况

  近5年主持国家纵向科研：

  [1] 国家重点研发计划“社会治理与智慧社会“专项项目负责人，2023-2026

  [2] 预研共用技术重点项目负责人，2024-2025

  [3] 国家自然科学基金面上项目负责人，2022-2025

  [4] 技术领域基金群体建模与认知仿真重点项目负责人，2020-2023

  [5] 国家重点研发计划“科技冬奥”专项项目课题负责人，2020-2022

  数字表演仿真工程：

  [1] 中央电视台春节联欢晚会数字仿真，2010-2025

  [2] 2023杭州亚运会残亚运会开闭幕式仿真，2022-2023

  [3] 2022北京冬奥会冬残奥会开闭幕式仿真，2020-2022

  [4] 2021建党百年庆祝大会仿真，2021

  [5] 2019 国庆70周年庆祝活动仿真，2019

  [6] 2018平昌冬奥北京8分钟文艺表演仿真，2017-2018

  [7] 2015首都抗战胜利70周年活动仿真，2015

  [8] 2009首都国庆60周年联欢晚会仿真，2009

  [9] 2008北京奥运会开闭幕式全景式智能仿真编排系统，2006-2008

  所获奖励

  [1] 国家教学成果二等奖

  [2] 主持国家级一流本科课程2门、国家级精品在线开放课1门

  [3] 全国高校教师教学创新大赛“部属正高组”一等奖

  [4] 全国混合式教学创新大赛特等奖

  [5] 省部级科技成果一等奖2项、三等奖3项

  [6] 北京市教育教学成果一等奖2项

  [7] 北京市青年教学名师奖

  [8] 主持北京市课程思政示范课程

  [9] 中国仿真学会2015、2017年度优秀论文

  [10] 称号：“北京市优秀思想政治工作者”、“科技冬奥专班优秀工作人员”、“杭州亚运会亚残运会个人贡献”、“北京冬奥会冬残奥会开闭幕式个人贡献”、”国庆70周年联欢活动仿真总设计”、“国庆60周年优秀工作者”、中华全国总工会授予的“全国工人先锋号”、北京市总工会授予的“奥运立功首都劳动奖状”、科技部授予的“科技奥运先进集体”、奥组委授予的“突出贡献纪念奖”等。

  社会兼职

  [1] 中国仿真学会理事、中国仿真学会数字体育专委会秘书长，中国仿真学会航空航天专委会委员

  [2] 中国计算机学会虚拟现实与可视化专委会委员

  [3]《系统仿真学报》编委

  备注

  课题组欢迎具有图形图像、工业仿真、人工智能、数字艺术、教育技术背景的同学报考。'
