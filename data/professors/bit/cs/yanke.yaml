bio_raw: '个人信息

  颜珂，预聘助理教授、特别副研究员，硕士生导师。2020年于哈尔滨工业大学（深圳）计算机学院获得博士学位。2020年至2022年在北京理工大学计算机学院从事博士后工作。主要研究方向包括自然语言处理、多模态学习、多标签学习、生物信息学等方面的研究。近年来在国际知名期刊上发表多篇论文，包括CCF
  A类论文和中科院一区等论文。授权多项专利。主持国家自然科学基金面上基金和青年基金、北京市自然科学基金海淀原始创新联合基金等项目。

  科研方向

  自然语言处理、多模态学习、多标签学习、生物信息学

  代表性学术成果

  发表SCI论文30余篇，其中1篇论文入选“高被引论文”。

  代表性论文：

  1.

  Ke Yan

  , Hongwu Lv, Jiangyi Shao, Shutao Chen, Bin Liu. TPpred-SC: multi-functional therapeutic
  peptide prediction based on multi-label supervised contrastive learning. Science
  China Information Sciences, 2024, 67(11): 212105. (中科院一区，CCF A)

  2.

  Ke Yan

  , Jiawei Feng, Jing Huang, Hao Wu. iDRPro-SC: identifying DNA-binding proteins and
  RNA-binding proteins based on subfunction classifiers. Briefings in Bioinformatics,
  2023, 24(4): bbad251. (中科院一区，CCF B)

  3. Jiangyi Shao, Qi Zhang,

  Ke Yan

  , Bin Liu. PreHom-PCLM: protein remote homology detection by combing motifs and
  protein cubic language model. Briefings in Bioinformatics, 2023, 24(6): bbad347.
  (中科院一区，CCF B，通讯作者)

  4. Tao Bai,

  Ke Yan

  , Bin Liu. DAmiRLocGNet: miRNA subcellular localization prediction by combining
  miRNA–disease associations and graph convolutional networks. Briefings in Bioinformatics,
  2023, 24(4): bbad212. (中科院一区，CCF B，通讯作者)

  5.

  Ke Yan

  , Yichen Guo, Bin Liu. PreTP-2L: identification of therapeutic peptides and their
  types using two-layer ensemble learning framework. Bioinformatics, 2023, 39(4):
  btad125. (中科院二区，CCF B)

  6.

  Ke Yan

  , Hongwu Lv, Yichen Guo, Wei Peng, Bin Liu. sAMPpred-GAT: prediction of antimicrobial
  peptide by graph attention network and predicted peptide structure. Bioinformatics,
  2023, 39(1): btac715. (中科院二区，CCF B)

  7.

  Ke Yan

  , Hongwu Lv, Yichen Guo, Yongyong Chen, Hao Wu, Bin Liu. TPpred-ATMV: therapeutic
  peptide prediction by adaptive multi-view tensor learning model. Bioinformatics,
  2022, 38(10): 2712-2718. (中科院二区 ，CCF B)

  8.

  Ke Yan

  , Xiaozhao Fang, Yong Xu, Bin Liu. Protein fold recognition based on multi-view
  modeling. Bioinformatics, 2019, 35(17): 2982-2990. (中科院二区，CCF B)

  9.

  Ke Yan

  , Hongwu Lv, Jie Wen, Yichen Guo, Yong Xu, Bin Liu. PreTP-Stack: prediction of therapeutic
  peptide based on the stacked ensemble learning. IEEE/ACM transactions on computational
  biology and bioinformatics, 2022, 20(2): 1337-1344. (中科院三区，CCF B)

  10.

  Ke Yan

  , Hongwu Lv, Jie Wen, Yichen Guo, Yong Xu, Bin Liu. Protein fold recognition based
  on auto-weighted multi-view graph embedding learning model. IEEE/ACM Transactions
  on Computational Biology and Bioinformatics, 2020, 18(6): 2682-2691. (中科院三区，CCF
  B)

  承担科研情况

  1. 国家自然科学基金面上项目，基于语用分析的治疗性多肽功能分析方法研究，项目负责人。

  2. 国家自然科学基金青年科学基金项目，基于多视角学习的治疗性多肽功能识别方法研究，项目负责人。

  3. 北京市自然科学基金海淀原始创新联合基金，面向抗体成药性高风险位点的蛋白质序列分析算法研究，项目负责人。

  4. 北京理工大学青年教师学术启动计划，项目负责人。

  所获奖励

  社会兼职

  CCF会员，担任多个国际期刊，例如PLoS Computational Biology、Bioinformatics、Briefings in Bioinformatics等的审稿人。

  备注

  本实验室招收硕士生，高年级本科生，有意者请邮件联系！ 提供良好的工作环境、学习气氛、计算资源和研究补助。'
