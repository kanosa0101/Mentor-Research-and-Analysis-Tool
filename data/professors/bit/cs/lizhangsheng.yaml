bio_raw: '个人信息

  李长升，北京理工大学计算机学院长聘教授，博士生导师，国家级青年人才计划获得者，国家重点研发计划首席科学家。2013年于中科院自动化所取得工学博士学位。主要研究方向包括多模态大模型、自动驾驶、具身智能等。在CCF
  A/IEEE汇刊等国际顶级会议及期刊上发表学术论文100余篇。其中，以第一作者发表CCF A/IEEE汇刊17篇。先后主持国家重点研发计划项目“社会治理与智慧社会科技支撑（平安中国）”重点专项项目、国家自然科学基金优秀青年科学基金、国家自然科学基金联合基金重点项目、173国防基础加强重点项目课题等项目10余项；参与国家自然科学基金重点项目、173国防基础加强重点项目、装发装备技术基础等。授权中国、美国、日本等国内外发明专利50余件。现担任多个国际顶级期刊和会议的审稿人、程序委员会委员、高级委员、领域主席等。

  News: 每年计划招收博士生1人、硕士研究生3至4人。 实验室与华为、蚂蚁金服、美团、百度、腾讯等行业巨头，以及众多海内外高校建立了合作机制，常态化开展学术合作及实习选派。特别欢迎本校保研同学提前进组。实验室提供浓厚的科研氛围与顶会/顶刊发表支持，助你赢在起跑线！

  科研方向

  多模态大模型、自动驾驶、具身智能等

