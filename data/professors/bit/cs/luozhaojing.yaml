bio_raw: '个人信息

  罗兆经，北京理工大学准聘教授、博士生导师、入选国家级青年人才。2019年在新加坡国立大学获得博士学位。2020至2023年在新加坡国立大学先后担任研究员、高级研究员。2023年12月加入北京理工大学计算机学院，主要从事结构化数据分析理论方法与系统的研究。在SIGMOD、VLDB、ICDE、AAAI等CCF推荐A类会议和TKDE等CCF推荐A类期刊发表了多篇论文。获得SIGMOD
  Systems Award（2024）、ICDE Best Paper Runner-Up（2018）、BDCAT Best Paper Award（2016）、中国计算机学会百名优秀大学生等奖项。
  参与开发的Apache SINGA分布式深度学习平台成为Apache顶级开源项目，被评为全球十大机器学习框架并且应用在了网易，新加坡中央医院，花旗集团，等十几个公司和机构。

  News: 每年计划招收博士生1名，硕士生2-3名，同时也欢迎对科研感兴趣的高年级本科生加入实验室。

  个人主页：https://zhaojingluo.github.io/

  科研方向

  大数据分析、结构化数据分析、人工智能、知识驱动机器/深度学习、模型正则化、大数据分析系统等

