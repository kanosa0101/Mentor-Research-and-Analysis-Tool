bio_raw: '个人信息

  黎有琦，预聘助理教授、特别副研究员，硕士生导师。2015年和2020年分别于北京理工大学计算机学院获得学士学位和博士学位（导师：李凡教授）。2020年至2022年在北京理工大学网络空间安全学院从事博士后工作（合作导师：祝烈煌教授、李凡教授）。主要研究方向包括物联网、群智感知、联邦学习、博弈论与激励机制设计、先进网络与数据安全、理论安全、人工智能安全、可信大数据系统、AI理论（PAC可学习理论、样本复杂度）。近年来在国际知名期刊上发表多篇论文，包括CCF
  A类论文和中科院一区论文，并且出版英文专著2部。主持国家重点研发计划子课题、国家自然科学基金和中国博士后面上资助等项目。

  科研方向

  物联网、群智感知、联邦学习、博弈论与激励机制设计、先进网络与数据安全、理论安全、人工智能安全、可信大数据系统、AI理论（PAC可学习理论、样本复杂度）

