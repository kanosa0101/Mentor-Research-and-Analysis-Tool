bio_raw: "个人信息\n宋红，北京理工大学计算机学院教授、博士生导师。国家级领军人才，教育部软件工程专业教学指导委员会委员、中国人工智能学会智能服务专业委员会常委、中国计算机学会数字医学分会委员、中国图像图形学会虚拟现实专业委员会委员。长期从事人工智能辅助诊断、多模态数据分析处理、增强现实手术导航研究。主持国自然联合基金重点项目、面上项目、国家重点研发计划课题、新一代人工智能国家科技重大专项课题等10余项。在TIP、TFS、TMI、TMM、CVPR等领域权威期刊和会议发表SCI论文100余篇，参与制定诊疗标准2项；参编专著/教材8部，申请/授权国家发明专利80余项，主持研制了3套手术导航系统，成果转化获批国家三类/二类医疗器械注册证6项。指导学生获第五届、第六届中国国际“互联网+”大学生创新创业大赛全国总决赛金奖2项、挑战杯一等奖1项，获评优秀创新创业导师。主持教育部－IBM精品课程1项、国家级双语示范课程1项，获北京市高等教育教学成果一等奖2项，北京理工大学教学成果奖特等奖、一等奖3项。获中国电子学会科技进步一等奖、中国人工智能学会吴文俊人工智能科技进步一等奖、中国产学研合作创新成果优秀奖等科研奖励7项。\n\
  个人主页：http://www.inavilab.com/sh\n科研方向\n图像智能分析处理、增强现实手术导航、医学大数据分析与人工智能辅助诊断。\n代表性学术成果\n\
  承担科研情况\n所获奖励\n[1]\t中国电子学会科技进步一等奖，2024\n[2]\t中国人工智能吴文俊人工智能科技进步奖一等奖，2023\n[3]\t中国产学研合作创新成果优秀奖，2019\n\
  [4]\t“Talent2000专用集成电路高层次自动设计系统”2004年获部级二等奖和校级一等奖\n[5]\t第六届中国国际“互联网+”大学生创新创业大赛全国总决赛金奖，优秀创新创业导师，2020\n\
  [6]\t第五届中国“互联网+”大学生创新创业大赛全国总决赛金奖，优秀创新创业导师，2019\n[7]\t教育部－IBM精品课程项目《SOA原理及实践》（排名1）\n\
  [8]\t国家级双语示范课程项目《C Programming Language》（排名1）\n[9]\t北京市高等教育教学成果一等奖，2013\n[10]\t\
  北京理工大学教学成果奖一等奖2项，2022\n社会兼职\n教育部软件工程专业教学指导委员会委员，中国人工智能学会智能服务专业委员会委员、中国图像图形学会虚拟现实专业委员会委员。\n\
  备注\n实验室长期招收博士/硕士研究生和高年级本科生，有意者请邮件联系！songhong@bit.edu.cn"
