bio_raw: '个人信息

  中科院软件所博士学位，美国伊利诺伊大学香槟分校访问学者，荷兰代尔夫特理工大学访问学者。北京理工大学计算机学院副教授。中国计算机学会人机交互委员会专家组成员。研究方向为人机交互、虚拟环境和虚拟制造。先后参加过多个大型企业信息化咨询和改造项目，熟悉离散制造行业的信息化事务和产业现状。在多通道人机交互、虚拟环境3D直接操作、虚拟环境的感知机制和核心算法、虚拟对象模型和行为构造、虚拟制造和虚拟装配技术、辅助设计技术等方面有浓厚的兴趣。曾参与了国家973、863、国家自然科学基金、国家十五和十一五国防预研等科研项目10多项。目前负责自然科学基金面上项目1项，国家重点实验室开放课题1项。在
  SCIENCE CHINA ,Journal of Computer Science and Technology（JCST）,软件学报，计算机研究与发展，辅助设计与图形学学报等一级学术期刊和高水平国际学术会议上发表论文30余篇。出版软件工程和计算机图形学教材3部。讲授的课程主要有：软件工程基础，计算机图形学。

  科研方向

  人机交互，虚拟现实，计算机辅助设计和虚拟制造

