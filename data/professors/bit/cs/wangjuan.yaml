bio_raw: '个人信息

  王娟，现任北京理工大学计算机学院副教授，硕士生导师。2005年在北京理工大学信息学院获得博士学位，同年到北京理工大学计算机学院工作。主讲计算机学院本科课程：数字逻辑、计算机组成原理、计算机组成与体系结构等课程。北京市计算机实验教学示范中心硬件平台的核心成员，主要负责硬件类课程相关课程的改革与建设。出版教材三部，在国内外学术期刊及学术会议上发表论文十余篇。

  科研方向

  计算机系统结构、基于FPGA的高性能计算技术、教育教学技术。

  代表性学术成果

  [1] Benshan Jiang,Juan Wang, Study of Applying HDL to Computer Hardware Practical
  Teaching, Computer Education, 2006(8):49-50(in Chinese)

  [2] Benshan Jiang,Juan Wang,Jie Hong, Preliminary Discussthe Reformof Computer Composition
  Principle Experiments,Researchand Exploration in Laboratory 2007(12):270-273(in
  Chinese).

  [3]Benshan Jiang,Juan Wang,Zhongmei Ma, The Triune Reform Method of Teaching, Experiments
  and Technological Campaigns to Pushan Effecton Hardware courses, Computer Education,
  2008(08) 32-33(in Chinese)

  [4]Yuan Tan, Xuelan Zhang,Yuanzhang Li,Juan Wang, HardDisk DMA Transmission Experiment
  Design Based on Box Virtual Machine, Computer Education, 2008(14):147-148(in Chinese)

  [5] Benshan Jiang,Juan Wang,Zhongmei Ma,The theory and practice teachingsystemin
  thecourse of Principles of computer organization, Computer Education, 2009(24):119-120(in
  Chinese)

  [6]Yuan Tan, Juan Wang, Quanxin Zhang,Kai Zhang, Pentium- Computer principle and
  interface technology, ISBN:9787111235729, China machine press, 2008(in Chinese)

  建成国家级精品资源共享课1项。

  获批兵工高校精品教材1本。

  承担科研情况

  1)北京理工大学十二五规划教材建设：计算机组成原理实验，2010，主持

  2)实践课重用设计方法学，构建系统化的计算机学科硬件实践系统体系，2013，北京理工大学教学改革项目，主持

  3)高等学校计算机教育研究会规划教材：微机原理和接口技术教材建设，2013~2014，主持

  4)主持教育部产学合作协同育人项目6项；

  5)主持北京理工大学校级教改项目2项；

  6)参与北京理工大学校级教改重点项目1项；

  7)参与教育部计算机类专业教学指导委员试点院校建设项目1项。

  所获奖励

  2009年北京理工大学三育人先进个人。

  2008年北京理工大学教育教学成果本科生项目二等奖。

  2005年北京理工大学优秀科技成果一等奖。

  北京理工大学校级教育教学成果二等奖2次；

  北京理工大学优秀科技成果奖 一等奖1次；

  “三育人”先进个人1次。

  社会兼职

  备注'
