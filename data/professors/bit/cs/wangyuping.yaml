bio_raw: '个人信息

  王瑀屏，博士，北京市青年英才。分别于2002年于东北大学计算机科学与技术系获学士学位，2005、2009年于清华大学计算机科学与技术系获硕士、博士学位2023年加入北京理工大学任长聘副教授，此前于清华大学计算机科学与技术系历任博士后、助理研究员、助理教授、准聘副教授。在国内外知名期刊会议上发表相关论文40余篇，其中包括编程语言领域的顶级会议OOPSLA，操作系统领域顶级会议USENIX
  ATC，计算机系统领域顶级期刊IEEE TOC，机器人系统领域顶级会议ICRA、IROS，计算机图形学领域顶级期刊IEEE TVCG等。曾获IEEE COMPSAC大会最佳论文奖。

  News: 每年计划招收博士生1名，硕士生2-3名，同时也欢迎对科研感兴趣的高年级本科生加入实验室。

  科研方向

  分布式数据库系统、机器人操作系统

