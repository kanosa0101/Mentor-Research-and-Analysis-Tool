  承担科研情况

  [1] 国家自然科学基金面上项目，基于规则挖掘的设备驱动缺陷检测方法，2019-2022，主持。

  [2] 北京市高等学校青年英才计划，面向移动平台的漏洞检测和隐私保护方法研究，2013-2015，主持。

  [3] 国家自然科学基金青年项目，基于访问模式分析的存储设备高效利用方法研究，2012-2014，主持。

  [4] 国家重大基础研究（973）计划，网络可视媒体的语义分析与信息整合，2011-2015，参加。

  [5] 国家高技术研究发展（863）计划项目，以支撑公众与企业服务为主的网络操作系统研制，2011-2013，参加。

  所获奖励

  [1] 北京高校第十二届青年教师教学基本功比赛工科类A组，三等奖，2021。

  [2] 第九届清华大学青年教师教学大赛，一等奖，2020。

  [3] 清华大学优秀班主任，二等奖，2016。

  [4] 清华大学教学成果奖，二等奖，2014。

  [5] 第六届清华大学青年教师教学大赛，二等奖，2014。

  [6] 入选北京市高等学校青年英才计划，2013。

