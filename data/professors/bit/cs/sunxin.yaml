bio_raw: "个人信息\n孙新，博士，副教授。目前主要从事自然语言处理、深度学习及大语言模型方向的研究。在科研项目方面，主持和承担了国家重点研发计划、科技部科技支撑、工业互联网创新发展工程、国防预研等多项国家级和省部级项目；作为项目负责人，还承担了横向科研课题10余项。科研成果方面，获得国防科技进步二等奖2项、国防科技进步三等奖2项；在SCI期刊和国际学术会议发表高水平论文40余篇，出版专著2部，授权国家发明专利15项、申请国家软件著作权12项。\n\
  在教学方面，荣获教育部-华为“智能基座”优秀教师、华为云与计算先锋教师称号。在课程建设上，主讲的《SQL Server数据库应用》课程获评北京高校优质本科课程；《大数据基础与应用》课程获评国家级一流本科课程，以及教育部—华为“智能基座”优秀教学资源奖。此外，参与课程《机器学习实践》获评全国首批工程类专业学位研究生在线示范课程。在教材建设方面，出版教材4本，其中《深度学习》入选教育部“战略性新兴领域十四五高等教育教材体系”，《数值分析》入选“十二五”高等学校精品规划教材。\n\
  在人才培养方面，主持教育部产学合作协同育人项目2项。指导的研究生中，多人荣获国家奖学金、北京市优秀毕业生及优秀硕士学位论文等荣誉；指导的多项本科毕业设计入选北京高校高水平人才交叉培养“实培计划”及北京理工大学校级重点项目。个人曾获北京理工大学“我爱我师—我最喜爱的老师”称号，两次被评为北京理工大学师德先进个人，并当选为北京理工大学第十五次党代会代表。\n\
