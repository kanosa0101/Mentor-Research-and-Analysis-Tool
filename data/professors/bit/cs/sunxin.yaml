  备注\n已毕业硕士研究生去向有字节、阿里、百度、腾讯、华为、美团等公司，北京邮电大学、航天二院、航天四院等高校和研究所，以及中国工商银行总行、中国建设银行总行、中国农业银行总行、中国光大银行总行、中国兵器工业集团、国家电网、国家烟草集团等单位。欢迎对机器学习、自然语言处理、人工智能等研究方向感兴趣的同学加入课题组，有意者请邮件联系：sunxin@bit.edu.cn。"
