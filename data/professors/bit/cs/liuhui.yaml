bio_raw: '个人信息

  刘辉，教授、博士生导师、教育部新世纪优秀人才、CCF杰出会员、CCF软件工程专委会秘书长。2008年从北京大学获得博士学位并加入北京理工大学计算机学院，2012-2013年在英国UCL进行访问研究，2013年入选教育部新世纪优秀人才和北京青年英才资助计划。目前主要研究“智能软件工程”，将人工智能和大数据技术应用于软件工程方面的研究工作。

  主持/参与了国家自然科学基金青年基金、国家自然科学基金面上项目、国家自然科学基金重点项目、国家自然基金重大项目、国家重点研发项目、教育部博士点基金等二十余项国家级科研项目。在IEEE
  TSE、ACM TOSEM、ICSE、FSE、ASE、ISSTA等中国计算机学会推荐的A类顶级国际期刊/会议上发表论文三十余篇。

  获得北京市技术发明二等奖、CCF A类国际会议ESEC/FSE2023 杰出论文奖、CCF A类国际会议ICSE 2022 杰出论文奖、CCF B类期刊IET
  Software Premium（Best Paper）Award、CCF B类会议RE 2021 最佳论文奖。担任中国计算机学会软件工程专委会常务委员、秘书长，软件智能与软件工程研究所副所长。担任CCF
  A类会议ASE、FSE、ISSTA 程序委员会委员、CCF B类国际知名期刊IET Software副主编以及EMSE和JSS的客座编辑。

  每年招收博士生1名，硕士生2-3名。欢迎对智能软件开发、大数据分析与挖掘、人工智能有兴趣的同学们加入课题组。毕业研究生大部分进入美团、阿里、华为、百度等IT企业，部分毕业生进入大学和科研院校继续从事科研工作。指导的两名硕士生先后以第一作者获得CCF
  A类国际会议ICSE 2022 杰出论文奖和CCF A类国际会议ESEC/FSE2023杰出论文奖。

  科研方向

  智能软件工程、数据挖掘、深度学习

