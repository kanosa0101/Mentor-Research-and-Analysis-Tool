  承担科研情况

  1. 国家自然科学基金青年科学基金项目，面向神经形态脉冲流的连续视觉表征模型研究，项目负责人；

  2. 博士后创新人才支持计划，时空特征联合优化的脉冲神经网络成像模型研究，项目负责人；

  3. 北理工青年教师学术启动计划，神经形态高速成像算法及其应用研究，项目负责人。

