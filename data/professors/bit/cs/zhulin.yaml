bio_raw: '个人信息

  朱林，计算机学院助理教授、特别副研究员、硕士生导师。2022年自北京大学计算机学院获得博士学位，2019年-2021年在鹏城实验室人工智能中心访问交流。主要研究方向为计算机视觉、神经形态视觉、图像处理、类脑计算等，研究成果发表在国际顶级期刊和会议IEEE
  TPAMI、IEEE TIP、CVPR、ICCV、AAAI、ACM MM等10余篇，申请国内外专利10余项，已授权10项。主持国家自然青年科学基金、博士后创新人才支持计划等项目，获2022年中国图象图形学学会优秀博士论文提名。

  本人每年招收硕士生2-4名，希望对科研有热情、编程能力强的同学加入团队，共同研究和发表高水平论文。本人所在的科研团队会提供非常优越的工作环境、计算资源、科研补助和国内外交流机会。请有兴趣加入的同学尽早联系，早日确定意向！

  更多信息请访问：

  实验室主页：http://vmcl.bit.edu.cn/   个人主页：https://linzhu.tech/

  科研方向

  计算机视觉，深度学习，神经形态视觉，脉冲神经网络，类脑计算

