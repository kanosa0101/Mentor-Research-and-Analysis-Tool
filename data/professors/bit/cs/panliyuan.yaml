bio_raw: '个人信息

  潘利源，博士生导师，2023年获国家级青年人才称号，于澳大利亚国立大学获得博士学位，并从事博士后研究。在计算机视觉与人工智能顶级国际会议和期刊CVPR, IEEE
  TPAMI, IEEE TIP上发表多篇论文。研究方向：计算机视觉相关

  Event camera; DP sensor; 3D vision; Low-level vision.

  个人主页： https://bitsslab.github.io

  科研方向

  计算机视觉相关

  Event camera; DP sensor; 3D vision; Low-level vision.

