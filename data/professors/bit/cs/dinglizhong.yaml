bio_raw: '个人信息

  丁立中，北京理工大学教授，博士生导师，国家级青年人才。研究课题包括深度统计学习理论和方法；大模型涌现机理与推理机制；多智能体环境建模与协同推理；图推理增强与可信图学习；统计假设检验与深度生成模型；因果学习与可解释人工智能；神经符号学习理论和方法。在ICML、NeurIPS、ICLR、AAAI、TPAMI、TNNLS等人工智能领域国内外顶级会议和期刊发表论文50余篇，长期担任ICML、NeurIPS、ICLR、AAAI、TKDE、TCYB、TNNLS等顶会顶刊审稿人。常年担任国家级青年人才评审专家，包括QC、YQ等。承担国家自然科学基金项目、面上项目、重点联合基金项目课题以及国家重点研发计划课题。围绕国产大模型全球竞争力与产业化路径撰写报告，被中央广播电视总台内参产品采纳并呈报中央主要领导，在决策咨询中发挥了重要作用。担任国际会议AIAAS
  2026的程序委员会主席。担任中国自动化学会模式识别与机器智能专业委员会委员、国际模式识别协会委员、中国图学学会数字媒体专业委员会委员、中国计算机学会数字医学分会执行委员，窦店人工智能应用专家委员会委员等。

  News: 每年计划招收博士生1~2人、硕士研究生3~5人，同时也欢迎优秀本科生加入实验室，表现优秀者将推荐至香港、新加坡、沙特、阿联酋继续深造。有意加入本课题组的学生请将个人简历发送至：
  6120220231@bit.edu.cn

  科研方向

  深度统计学习理论和方法，大模型涌现机理与推理机制，多智能体环境建模与协同推理，统计假设检验与深度生成模型，核方法与深度核方法，图推理增强（大模型、多智能体）与可信图学习，因果学习与可解释人工智能，神经符号学习理论和方法

