bio_raw: '个人信息

  副教授，博士生导师，曾以公派博士后在美国德州大学澳斯汀分校进行访问研究。近年来主持完成包括国家自然科学基金面上项目、教育部留学回国人员科研启动基金项目在内的多项智能视觉质量分析、图像与视频处理方面的研究工作，发表国际期刊论文20多篇（其中2篇论文入选ESI高被引论文，1篇高被引论文同时获得2020年度欧洲信号处理学会（EURASIP）最佳论文奖（Best
  Paper Award）），以第三完成人获2024年度中国图象图形学学会（CSIG）自然科学奖一等奖1项。担任中国计算机学会多媒体技术专委会委员、中国图象图形学学会多媒体技术专委会委员，IEEE
  TIP、IEEE TNNLS和IEEE TCSVT等国际学术期刊审稿人。

  指导研究生获得博士、硕士研究生国家奖学金，毕业研究生大部分进入中国银行、中国工商银行、微软、百度、华为、阿里、快手、佳期投资等企事业单位。每年计划招收博士生1名、硕士生2-3名，欢迎对视觉质量评价、机器学习、图像分析与理解等相关领域研究有兴趣的同学们加入课题组。

  科研方向

  视觉感知、图像与视频处理

