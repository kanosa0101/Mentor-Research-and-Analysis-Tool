bio_raw: '个人信息

  侯云钟，博士，北京理工大学准聘教授、博士生导师，国家级青年人才。于2018年和2023年分别自清华大学和澳大利亚国立大学获得学士及博士学位。2023-2025年任澳大利亚国立大学博士后研究员，曾主持多项由Google、OpenAI等机构资助的科研项目，并担任《计算机视觉高级专题》等课程的客座教师。2026年加入北京理工大学计算机学院，聚焦空间智能及具身智能研究。在IEEE
  TIP、CVPR、ICLR等CCF-A类期刊及会议发表论文10余篇，担任NeurIPS、CVPR、ACM MM等国际会议领域主席，并组织WWW’25多模态重识别专题Workshop等。

  个人主页：https://hou-yz.github.io

  招生计划：欢迎对所研究内容感兴趣的小伙伴，博士生1名/年，硕士生2-3名/年，同时欢迎本科保研同学提前加入课题组。

  科研方向

  1. 空间智能

  三维感知、大模型推理、智能体分析等。

  2. 具身智能

  世界模型、具身导航及问答等。

  3. 自主感知

  感知集群调度、无人机摄影摄像等。

  代表性学术成果

  1. Yejie Guo*, Yunzhong Hou*, Wufei Ma, Meng Tang, Ming-Hsuan Yang, “Pursuing Minimal
  Sufficiency in Spatial Reasoning,” [CCF A] ICLR; 2026. 共同一作

  2. Yunzhong Hou, Stephen Gould, and Liang Zheng, “Scalable Deep Color Quantization:
  a Cluster Imitation Approach,” [CCF A, Journal] IEEE Trans. on Image Processing;
  2024. 唯一一作

  3. Yunzhong Hou, Stephen Gould, and Liang Zheng, “Learning to Select Camera Views:
  Efficient Multiview Understanding at Few Glances,” [CCF A] CVPR; 2024. 唯一一作

  4. Yunzhong Hou and Liang Zheng, “Multiview Detection with Shadow Transformer (and
  View-Coherent Data Augmentation),” [CCF A] ACM MM; 2021. 唯一一作

  5. Yunzhong Hou, Zhongdao Wang, Shengjin Wang, and Liang Zheng, “Adaptive Affinity
  for Associations in Multi-Target Multi-Camera Tracking,” [CCF A, Journal] IEEE Trans.
  on Image Processing; 2022. 唯一一作

  6. Yunzhong Hou and Liang Zheng, “Visualizing Adapted Knowledge in Domain Transfer,”
  [CCF A] CVPR; 2021. 唯一一作

  7. Yunzhong Hou, Liang Zheng, and Stephen Gould, “Learning to Structure an Image
  with Few Colors,” [CCF A] CVPR; 2020. 唯一一作

  8. Yunzhong Hou, Liang Zheng, and Stephen Gould, “Multiview Pedestrian Detection
  with Feature Perspective Transformation,” [CCF B] ECCV; 2020. 唯一一作

  9. Yunzhong Hou, Stephen Gould, and Liang Zheng, “View-coherent correlation consistency
  for semi-supervised semantic segmentation,” [CCF B, Journal] Pattern Recognition;
  2024. 唯一一作

  10. Xingjian Leng, Jaskirat Singh, Yunzhong Hou, Zhenchang Xing, Saining Xie, Liang
  Zheng, “Repa-e: Unlocking VAE for End-to-End Tuning with Latent Diffusion Transformers,”
  [CCF A] ICCV; 2025.

  11. Yuwei Yang, Zeyu Zhang, Yunzhong Hou, Zhuowan Li, Gaowen Liu, Ali Payani, Yuan-Sen
  Ting, and Liang Zheng, “Effective Training Data Synthesis for Improving MLLM Chart
  Understanding,” [CCF A] ICCV; 2025.

  12. Xiaoxiao Sun, Yunzhong Hou, Weijian Deng, Hongdong Li, and Liang Zheng, “Ranking
  Models in Unlabeled New Environments,” [CCF A] ICCV; 2021.

  13. Changlin Song, Yunzhong Hou, Michael Randall Barnes, Rahul Shome, and Dylan
  Campbell, “Extreme Amodal Face Detection,” WACV; 2026 (Oral).

  14. Wenqi Shi, Yunzhong Hou, Sheng Zhou, Zhisheng Niu, Yang Zhang, and Lu Geng,
  “Improving Device-Edge Cooperative Inference of Deep Learning via 2-Step Pruning,”
  IEEE INFOCOM workshop; 2019. Impact: Model pruning for edge computing.

  承担科研情况

  1.国家自然科学基金项目“多视角多媒体物联网感知”，2026.01-2028.12

  所获奖励

  1. 2023、2025年两度获得CVPR杰出审稿人奖

  2. 2025年受邀在中国驻澳大利亚大使馆向1 名公参和2 名参赞汇报多视角感知方面的研究成果，获得积极评价。

  社会兼职

  2026 NeurIPS领域主席（Area Chair）

  2026 CVPR领域主席（Area Chair）

  2024-2026 ACM Multimedia领域主席（Area Chair）

  2024-2026 ICASSP领域主席（Area Chair）

  2025 WWW Workshop on Multimedia Object Re-ID主席（General Chair）

  长期担任Nature Communications、IEEE TPAMI、NeurIPS、CVPR等期刊和会议审稿人

  备注'
