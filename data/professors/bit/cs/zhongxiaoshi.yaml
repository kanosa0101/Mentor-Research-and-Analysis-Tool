bio_raw: '个人信息

  钟晓时，博士，北京理工大学计算机学院预聘副教授，特别研究员，博士生导师，国家级青年人才。本科毕业于北京航空航天大学，计算机科学与技术专业；博士毕业于新加坡南洋理工大学，计算机科学专业自然语言处理和生物信息学方向，导师为Erik
  Cambria（IEEE Fellow）和Jagath Rajapakse（IEEE Fellow）。攻读博士学位之前曾在香港科技大学和香港城市大学接受运筹学和仿真优化领域顶尖学者Jeff
  Hong（讲座教授）两年多的学术训练，学术思维和研究品味受Hong教授影响颇深。现在主要研究方向为数据分析、网络科学和自然语言处理。已经在计算机顶级会议ACL和WWW以及一些重要期刊发表多篇论文，并出版Springer英文专著一本。

  招生计划：每年招博士研究生1人，硕士研究生2～3人，同时欢迎高年级优秀本科生加入研究组。

  个人主页：https://xszhong.github.io

  科研方向

  数据分析、网络科学、社交网络、自然语言处理、大模型应用

