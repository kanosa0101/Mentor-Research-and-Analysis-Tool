  承担科研情况

  1、国家重点研发计划“政府间国际科技创新合作”重点专项“基于人工智能的腹腔镜直肠癌根治手术质量控制系统的研发与应用”（No.2024YFE0198300）中课题“人工智能辅助的直肠癌MRI诊断技术研究”，2024-2027，课题负责人.

  2、北京市自然科学基金-海淀原始创新联合基金资助项目《无托槽隐形矫治体系高效牙移动规律解析与矫治策略优化研究》（No.L242037），2024-2027，课题负责人.

  3、天津市科技局重点研发计划京津冀协同创新项目；“心脏超声AI基础模型的研究”（No.24YFXTHZ00250），2024-2027，课题负责人.

  4、北京市自然科学基金-丰台轨道交通前沿研究联合基金重点项目：以计算机视觉为核心的多传感器列车运行状态路侧感知理论与方法，2020-2022，课题负责人.

  5、国家自然科学基金项目：面向时间不耐受患者的脑MRI图像超分辨率算法研究(No. 61271374), 2013 – 2016,负责人.

  6、国家自然科学基金项目：目标运动突变和几何外观急剧变化的视觉跟踪(No. 61273273), 2013 – 2016, 参与人.

  7、北京市自然科学基金项目：基于集成学习的失业预警建模研究(No. 4122068), 2012 – 2014,负责人.

  8、国家自然科学基金项目：虚拟环境用户模型研究(No. 60773046), 2008 – 2010, 参与人.

  所获奖励

  1、作为通讯作者，论文“Quality-Aware Memory Network for Interactive Volumetric Image Segmentation.
  MICCAI (2) 2021: 560-570”在医学图像处理领域顶级会议MICCAI2022上被评为会议最佳论文。

  2、2023“上海•临港杯”人工智能全球创新大赛暨港澳大学生创客马拉松总决赛，指导留学生获金奖两项、银奖一项，并获优秀指导教师称号。

  3、2020年获校教育教学成果奖二等奖一项（排名第三）。

  4、指导硕士生张梅杰、魏海周、宋玉龙获得校优秀硕士学位毕业论文。

  5、2020年第九届“中国软件杯”大学生软件设计大赛总决赛，指导本科生获二等奖一项。

  6、2018年中国机器人大赛，指导学生参加获得三项二等奖。

  7、“青创北京”2023年“挑战杯”首都大学生课外学术科技作品竞赛中，指导学生获二等奖一项。

  社会兼职

  1、计算机学会高级会员，自动化学会会员，人工智能学会会员，生物医学工程学会会员，IEEE会员。

  2、作为CVPR、ICCV、ECCV、AAAI、IJCAI、ACMMM等国际会议，以及IEEE TPAMI、IEEE TIP、IEEE TMM、IEEE TCSVT、PR、计算机学报、自动化学报、电子学报等期刊的审稿人。

  备注

  招收硕士生，也欢迎高年级本科生进入实验室，可以通过Email和我联系。'
