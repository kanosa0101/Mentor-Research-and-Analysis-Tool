bio_raw: '个人信息

  李建武，博士，副教授，计算机学会高级会员，自动化学会会员，IEEE会员。分别于1997年、2000年、2003年于天津大学获学士、硕士、博士学位，2013年至2014年于哥伦比亚大学访学。研究兴趣包括：人工智能、机器学习、图像与视频处理，在CVPR、AAAI、ACMMM、IEEE
  TIP、PR、自动化学报等国内外重要会议或期刊上发表论文50余篇，主持或参与国家重点研发计划、国家自然科学基金、北京市自然科学基金等项目10余项。主讲《程序设计方法与实践》、《人工智能》、《离散数学》等课程。

  科研方向

  1.机器学习理论与方法

  深度学习、表示学习、强化学习、集成学习等。

  2.基于机器学习的图像与视频处理

  目标检测、分割与识别，图像去噪与超分辨率增强，医学图像增强、分割与检索。

