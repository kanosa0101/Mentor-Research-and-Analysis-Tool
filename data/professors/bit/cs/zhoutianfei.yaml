bio_raw: '个人信息

  周天飞，北京理工大学计算机学院教授，博士生导师，国家级青年人才。

  研究领域为人工智能、计算机视觉，最近比较关注多模态大模型方向。在国际顶级期刊和学术会议（如IEEE TPAMI、ICML、ICLR、NeurIPS、CVPR、ICCV、ECCV、AAAI）发表学术论文50余篇，第一作者论文获医疗图像分析领域顶会MICCAI的最佳论文奖（2022年）、世界人工智能大会青年优秀论文提名奖（2021年）、入选斯坦福“全球前2%顶尖科学家”榜单、带领学生在8个国际学术竞赛中获得冠军。担任IEEE
  TCSVT特邀编辑、Multimedia Tools and Applications副主编等。

  每年计划招生博士生1人，硕士研究生3-4人，同时欢迎高年级优秀本科生加入课题组。

  个人主页：https://www.tfzhou.com

  科研方向

  计算机视觉、人工智能、多模态学习、大模型、医疗影像分析

  代表性学术成果

