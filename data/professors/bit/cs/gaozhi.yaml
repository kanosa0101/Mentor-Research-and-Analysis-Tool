bio_raw: '个人信息

  高志，预聘副教授、特别研究员。分别于2017年6月和 2023年6月于北京理工大学获得计算机科学与技术学士和博士学位。2023年7月至 2025年6月于北京大学智能学院从事博士后研究。2025年6月加入北京理工大学计算机学院。高志主要从事计算机视觉和机器学习等领域的研究；在中国计算机学会（CCF）推荐A类期刊/会议或中科院JCR
  1区期刊发表论文20余篇；获ACM 中国人工智能分会优秀博士学位论文奖。作为负责人承担国家自然科学基金、北京理工大学科技创新计划等。个人主页https://zhigao2017.github.io/。

  从2026年起，每年计划招收博士生2名，硕士生2名，欢迎对计算机视觉、机器学习等领域研究感兴趣的同学加入课题组。

  科研方向

  计算机视觉、机器学习、多模态学习、AI智能体、黎曼几何

  代表性学术成果

  部分学术成果如下：

  (1) Xiaomeng Fan, Yuwei Wu, Zhi Gao, Mehrtash Harandi, Yunde Jia. Curvature Learning
  for the Generalization of Hyperbolic Neural Networks. IJCV 2025. (CCF-A)

  (2) Zhi Gao, Pengxiang Li, Bofei Zhang, Xiaojian Ma, Yue, Fan, Tao Yuan, Yuwei Wu,
  Yunde Jia, Song-Chun Zhu, Qing Li. Multi-modal Agent Tuning: Building a VLM-Driven
  Agent for Efficient Tool Usage. ICLR 2025.

  (3) Peilin Yu, Yuwei Wu, Zhi Gao, Xiaomeng Fan, Yunde Jia. Large-scale riemannian
  meta-optimization via subspace adaptation. CVIU 2025.

  (4) Pengxiang Li, Zhi Gao, Bofei Zhang, Tao Yuan, Yuwei Wu, Mehrtash Harandi, Yunde
  Jia, Song-Chun Zhu, Qing Li. FIRE: A Dataset for Feedback Integration and Refinement
  Evaluation of Multimodal Models. NeurIPS 2024. (CCF-A)

  (5) Zhi Gao, Yuntao Du, Xintong Zhang, Xiaojian Ma, Wenjuan Han, Song-Chun Zhu,
  Qing Li. CLOVA: A Closed-Loop Visual Assistant with Tool Usage and Update. CVPR
  2024. (CCF-A)

  (6) 高志, 武玉伟, 贾云得. 混合曲率空间中的几何自适应元学习方法. 计算机学报 2024. (CCF-A)

  (7) Zhi Gao, Chen Xu, Feng Li, Yunde Jia, Mehrtash Harandi, Yuwei Wu. Exploring
  Data Geometry for Continual Learning. CVPR 2023. (CCF-A)

  (8) Jin Chen, Zhi Gao, Xinxiao Wu, Jiebo Luo. Meta-causal Learning for Single Domain
  Generalization. CVPR 2023. (CCF-A)

  (9) Zhi Gao, Yuwei Wu, Xiaomeng Fan, Mehrtash Harandi, Yunde Jia. Learning to Optimize
  on Riemannian Manifolds. T-PAMI 2023. (CCF-A)

  (10) Zhi Gao, Yuwei Wu, Mehrtash Harandi, Yunde Jia. Curvature-Adaptive Meta-Learning
  for Fast Adaptation to Manifold Data. T-PAMI 2023. (CCF-A)

  (11) Zhi Gao, Yuwei Wu, Yunde Jia, Mehrtash Harandi. Hyperbolic Feature Augmentation
  via Distribution Estimation and Infinite Sampling on Manifolds. NeurIPS 2022. (CCF-A)

  (12) Zhi Gao, Yuwei Wu, Yunde Jia, Mehrtash Harandi. Curvature Generation in Curved
  Spaces for Few-Shot Learning.  ICCV 2021. (CCF-A)

  (13) Xiaomeng Fan, Zhi Gao, Yuwei Wu, Yunde Jia, Mehrtash Harandi. Learning a Gradient-free
  Riemannian Optimizer on Tangent Spaces. AAAI 2021. (CCF-A)

  (14) Zhi Gao, Yuwei Wu, Yunde Jia, Mehrtash Harandi. Learning to Optimize on SPD
  Manifolds.  CVPR 2020. (CCF-A)

  (15) Zhi Gao, Yuwei Wu, Xiaoxun Zhang, Jindou Dai, Mehrtash Harandi, Yunde Jia.
  Revisiting bilinear pooling: A coding perspective. AAAI 2020. (CCF-A)

  (16) Zhi Gao, Yuwei Wu, Mehrtash Harandi, Yunde Jia. A Robust Metric for Similarity-based
  Classification on the SPD Manifold. T-NNLS 2020. (中科院一区)

  (17) Zhi Gao, Yuwei Wu, Xingyuan Bu, Tan Yu, Junsong Yuan, Yunde Jia. Learning a
  Robust Representation via a Deep Network on Symmetric Positive Definite Manifolds.
  Pattern Recognition. 2019. (中科院一区)

  承担科研情况

  主持国家自然科学基金、北京理工大学科技创新计划等多项。

