bio_raw: '个人信息

  丁刚毅，重庆市彭水县人，1985年12月加入中国共产党，1988年6月本科毕业于北京大学力学系，1993年6月博士毕业于北京理工大学。1993年6月参加工作，北京理工大学研究员，博士生导师。2002年3月参与创办国家示范性软件学院并任副院长，2008年12月任院长至2018年4月，2017年9月兼任学校图书馆馆长。现任北京理工大学党委委员、校学术委员会委员、校学位委员会委员，北京市数字媒体技术实验教学示范中心主任、“数字表演与仿真技术”北京市重点实验室主任。

  科研方向

  软件工程、仿真技术、数字表演等

  代表性学术成果

  发表论文60余篇，教材专著5本，专利20项。

  承担科研情况

  承担包括国家自然科学基金、国家科技支撑计划、国防技术基础、总装预研等科研项目，主要涉及装备模拟训练仿真，大规模人群仿真，环境仿真，数字表演与创意仿真等。

  所获奖励

  曾获部级一等奖二项、二等奖三项、三等奖三项。

  社会兼职

  军委装发部仿真技术专业组成员，军委训管部模拟仿真专家组成员，教育部动画与数字媒体教学指导委员会副主任，文化部文化科技专家，中国计算机仿真协会副理事长等。

  备注'
