bio_raw: '个人信息

  李雪松，博士生导师，清华大学博士毕业。研究方向为机器人具身智能、脑启发智能、智能医学图像等领域。实验室目前搭建有多种智能本体操作学习平台，包括人形机器人、移动底盘与仿人形机器人、四足机器人、双主从机械臂等。主要研究方向为机器人智能控制和智能学习，3D空间智能感知与导航，基于图网络空间数据表征，脑启发推理智能等。已经发表40余篇SCI论文和会议论文，包括IROS，IEEE
  TKDE，IEEE TNNLS，ACM TOIS，AAAI，MIA, Neuroimage, Human Brain Mapping, MRM, IEEE Trans系列等机器人顶级会议论文、CCF
  A和图像处理顶级期刊，获得科技部重点研发计划、国家自然科学基金、北京市自然科学基金等多个项目资助，团队获得多项国际挑战赛冠军等。

  科研方向

  1）机器人智能操作研究（视觉推理、模仿学习、强化学习、仿真学习到现实场景迁移等）。

  2）基于三维空间场景的智能感知，机器在环境中的进化学习。

  3）基于视觉语言模型和人类操作数据引导的机器人推理学习研究。

  4）脑启发智能算法研究。

  5）智能脑成像处理。

