bio_raw: '个人信息

  马波，中国计算机学会会员，IEEE会员，北京理工大学计算机学院教授，博士生导师。于哈尔滨工业大学获得计算机应用技术工学博士学位，先后在香港理工大学电子与资讯工程学系和香港城市大学计算机科学系作访问研究。已在IEEE
  TNNLS、IEEE TCYB、IEEE TIP、IEEE TCSVT、IEEE TMM、 IEEE ICCV等期刊和会议上发表论文数十篇。主持国家自然科学基金面上项目、国家863计划项目、北京理工大学重大项目培育计划项目等科研项目10余项。曾入选北京理工大学优秀青年教师资助计划。为IEEE
  TCYB、 IEEE TIP、 IEEE TCSVT、 电子学报、自动化学报等期刊和会议的审稿人。

  科研方向

  计算机视觉、机器学习、图像分析与理解

