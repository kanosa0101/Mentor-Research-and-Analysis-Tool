bio_raw: '个人信息

  北京理工大学副教授，现任计算机网络攻防对抗研究所所长。在网络空间安全/电子信息（软件工程和计算机技术专业）/计算机科学与技术三个学科和专业招收工学硕士和专业硕士研究生。1993-2003年，就读于北京理工大学，获工学学士、硕士、博士学位。2003年参加工作，在北京理工大学从事教学科研工作，主要从事网络空间安全/机器学习/人工智能/软件工程等方向的教学研究工作。主讲《网络安全工程》、《网络空间安全技术》、《系统科学与工程》等多门北京理工大学本科生和研究生精品课程与明星课程，主讲《网络安全-应用技术与工程实践》慕课。主持国家重点研发计划课题、国防基础科研重大项目等科研项目十余项。获得教育部、工信部等省部级科技奖励3项。发表学术论文20余篇，获国家发明专利授权和软件著作权多项。出版网络空间安全方向专著2部，教材3部。担任多个部委的网络安全评审论证专家。

  科研方向

  网络空间安全/机器学习/人工智能/软件工程

  代表性学术成果

  [1] 闫怀志. 网络空间安全体系能力生成、度量及评估理论与方法研究. 北京: 科学出版社, 2020

  [2] 闫怀志. 网络空间安全系统科学与工程. 北京: 科学出版社, 2019

  [3] 闫怀志. 工业互联网安全体系理论与方法. 北京: 科学出版社, 2019

  [4] 闫怀志. 网络空间安全原理、技术与工程. 北京:电子工业出版社, 2017

  [5] 闫怀志. 网络安全-应用技术与工程实践. 北京: 高等教育出版社, 2020

  承担科研情况

  1. 国家重点研发专项：人类遗传资源云平台研发及安全标准规范体系，1163万元，负责人

  2. 工业和信息化部工业互联网创新发展专项：工业互联网安全态势感知平台，98万元，负责人

  3. 国防基础科研重大专项：XXX系统安全需求工程，负责人

  4. 国防基础科研：XXX系统安全漏洞分析技术，负责人

  5. 国家重大专项：XXX系统安全智能检测与国家重大任务保障，负责人

  6. 中兴通信科研基金专项：光通信安全体系，负责人

  7. 中央高校基础科研业务基金：网络安全中的人工智能与机器学习方法研究，负责人

  所获奖励

  1. 2013年1月，教育部技术发明二等奖

  2. 2009年12月，工信部科技进步三等奖

  3. 2007年12月，国防科工局科技进步三等奖

  社会兼职

  备注'
