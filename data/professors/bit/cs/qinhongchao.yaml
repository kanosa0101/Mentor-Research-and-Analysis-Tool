bio_raw: '个人信息

  秦宏超，预聘助理教授、特别副研究员，硕士生导师。2013、2015、2020年于东北大学获得学士、硕士和博士学位。2020-2022在北京理工大学从事博士后工作，2016年在新加坡管理大学担任研究助理。主要研究方向包括社区挖掘、新型图挖掘、知识图谱等。至今在SIGMOD、VLDB、ICDE、IEEE
  TKDE等CCF A类期刊/会议发表论文二十余篇。主持/参与多项国家自然科学基金和国家重点研发计划课题；多项大厂产学研合作项目、教育部协同育人项目。担任TKDE、KAIS、ICDE等期刊/会议的审稿人。多次指导学生在当前最前沿技术方向，如向量数据库、
  RAG知识检索等比赛获得佳绩。

  每年招收硕士研究生2-3名：希望你是一个努力的同学，不特别在乎眼前得失。

  详情可见 https://qinhc.github.io/

  科研方向

  [1] 社区挖掘、新型图挖掘、知识图谱

  [2] 金融反欺诈：在**银行票据欺诈识别应用中达到 9 中 5 的成绩

  [3] 向量数据库系统：100万向量，构建索引不到1分钟；单次混合查询不到0.05ms

  [4] RAG智能问答系统：回答余弦相似度达到 0.79，轻量化、易部署(16G 显存即可)

  热烈欢迎业界同行及校内外、跨学科的同仁们，携手开展项目合作与学术交流！

