  承担科研情况

  NSFC青年基金：面向时序超图的稠密子图挖掘技术研究，主持

  国家重点研发计划项目子课题：基于云边端协同的智能产线管控理论和方法研究，主持

  科技创新2030-重大项目：亿级节点时序图谱实时智能分析关键技术与系统，核心参与

  产学研合作：基于大模型的流动性预测，主持

  产学研合作：图计算支撑大模型GraphRAG关键技术研究，主持

  教育部产学合作协同育人项目：金仓数据库内核及应用技术课程建设，主持

  NSFC联合重点基金：基于原生图模型的分布式图存储和图计算方法与技术研究，参与

  CCF-华为胡杨林基金：面向时序超图的稠密子图挖掘技术研究，参与

  腾讯犀牛鸟微信专项：基于用户行为的搜索个性化排序，参与

