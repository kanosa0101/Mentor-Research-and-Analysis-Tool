bio_raw: "个人信息\n张奥千，长聘副教授，博士生导师。2013年和2018年分别于清华大学软件学院获得学士和博士学位。2018年至2020年在加拿大滑铁卢大学从事博士后工作。主要研究方向包括多源异构数据、物联网数据、时空数据、图数据质量与分析，机器学习，数据库等。至今已经在SIGMOD、VLDB、ICDE、TKDE等CCF\
  \ A类会议或期刊上发表多篇论文。担任各类顶级期刊及会议评审，如ICDE、JDIQ等。\nNews: 每年计划招收硕士研究生2人。同时也欢迎优秀的本科生加入实验室。有意加入本课题组的同学请将个人简历发送至aoqian.zhang@bit.edu.cn。（注：具有竞赛经验的将优先考虑）。\n\
  科研方向\n多源异构数据、物联网数据、时空数据、图数据质量与分析，机器学习，数据库，区块链\n代表性学术成果\n[1] Zijie Chen, Aoqian Zhang,\
  \ Shaoxu Song: Cleaning Time Series under Seasonal and Trend Constraints. Proc.\
  \ ACM Manag. Data 3(6): 308:1-308:26 (SIGMOD 2026)\n[2] Aoqian Zhang, Zexue Wu,\
  \ Yifeng Gong, Ye Yuan, Guoren Wang:Multivariate Time Series Cleaning under Speed\
  \ Constraints. Proc. ACM Manag. Data 2(6): 245:1-245:26 (SIGMOD 2025)\n[3] Zexue\
  \ Wu, Yifeng Gong, Aoqian Zhang*, Boyang Li: DTMamba : Dual Twin Mamba for Time\
  \ Series Forecasting. Tsinghua Science and Technology (to appear)\n[4] Haoyu Wang,\
  \ Aoqian Zhang, Shaoxu Song, Jianmin Wang: Streaming data cleaning based on speed\
  \ change. VLDB J. 33(1): 1-24 (VLDBJ 2024)\n[5] Aoqian Zhang, Shuqing Deng, Dongping\
  \ Cui, Ye Yuan, Guoren Wang: An Experimental Evaluation of Anomaly Detection in\
  \ Time Series. Proc. VLDB Endow. 17(3): 483-496 (VLDB 2023)\n[6] Xu Wang, Zhiwei\
  \ Zhang, Xiaochun Yang, Guoren Wang, Aoqian Zhang, George Yuan: Efficient Authentication\
  \ Processing for Spatial Keyword Queries in Hybrid Storage Blockchain. ICBCT 2022:\
  \ 22-30\n[7] Ye Yuan, Delong Ma, Aoqian Zhang, Guoren Wang: Consistent Subgraph\
  \ Matching over Large Graphs. (ICDE 2022): 2536-2548\n[8] Shaoxu Song, Fei Gao,\
  \ Aoqian Zhang, Jianmin Wang, Philip S. Yu: Stream Data Cleaning under Speed and\
  \ Acceleration Constraints. ACM Trans. Database Syst. 46(3): 10:1-10:44 (TODS 2021)\n\
  [9] Shaoxu Song, Yu Sun, Aoqian Zhang, Lei Chen, Jianmin Wang: Enriching Data Imputation\
  \ under Similarity Rule Constraints. IEEE Trans. Knowl. Data Eng. 32(2): 275-287\
  \ (TKDE 2020)\n[10] Shaoxu Song, Aoqian Zhang: IoT Data Quality. CIKM 2020: 3517-3518\n\
  [11] Richard Wu, Aoqian Zhang, Ihab F. Ilyas, Theodoros Rekatsinas: Attention-based\
  \ Learning for Missing Data Imputation in HoloClean. (MLSys 2020)\n[12] Aoqian Zhang,\
  \ Shaoxu Song, Yu Sun, Jianmin Wang: Learning Individual Models for Imputation.\
  \ (ICDE 2019): 160-171\n[13] Aoqian Zhang, Shaoxu Song, Jianmin Wang, Philip S.\
  \ Yu: Time Series Data Cleaning: From Anomaly Detection to Anomaly Repairing. Proc.\
  \ VLDB Endow. 10(10): 1046-1057 (VLDB 2017)\n[14] Aoqian Zhang, Shaoxu Song, Jianmin\
  \ Wang: Sequential Data Cleaning: A Statistical Approach. SIGMOD Conference 2016:\
  \ 909-924 (SIGMOD 2016)\n[15] Shaoxu Song, Aoqian Zhang, Lei Chen, Jianmin Wang:\
  \ Enriching Data Imputation with Extensive Similarity Neighbors. Proc. VLDB Endow.\
  \ 8(11): 1286-1297 (VLDB 2015)\n[16] Shaoxu Song, Aoqian Zhang, Jianmin Wang, Philip\
  \ S. Yu: SCREEN: Stream Data Cleaning under Speed Constraints. SIGMOD Conference\
  \ 2015: 827-841 (SIGMOD 2015)\n承担科研情况\n[1] 国家自然科学基金面上项目，高动态时序数据质量增强关键技术研究，项目负责人\n\
  [2]\t华为-CCF胡杨林基金，面向AI任务的表格数据治理，项目负责人\n[3]\t国家重点研发计划，区块链环境下海量多模态数据管理关键技术与系统(事务处理与可扩展共识)，课题负责人\n\
  [4]\t国家自然科学基金青年项目，面向分布式IoT数据的流式清洗关键技术研究，项目负责人\n[5]\t北京信息科学与技术国家研究中心面上项目，工业物联网数据清洗技术研究，项目负责人\n\
  所获奖励\n1) ACM北京分会新星奖，2024\n2) 清华大学紫荆学者，2018\n3) 清华大学林枫奖，2016\n社会兼职\n1) 多次参与计算机领域TKDE、JCST、JDIQ等期刊以及数据库领域PVLDB、ICDE、KDD、BigData等会议的评审工作，并担任Big\
  \ Data 2022-2026数据库会议的程序委员\n2) CCF数据库专业委员会执行委员\n3) 三级心理咨询师\n备注"
