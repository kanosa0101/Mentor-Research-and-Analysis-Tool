bio_raw: '个人信息

  李国政，长聘副教授。2021年7月自北京大学信息科学技术学院获得博士学位并入职北京理工大学计算机学院。入选中国科协青年人才托举工程，主要研究方向为：大数据可视分析，文档智能，智能交互，大模型应用等，在重大基础设施、金融保险科技、关键信息分析领域取得了积极的应用成果。研究成果发表在CCF-A类期刊和会议ACM
  KDD/CHI/UIST/CSCW, IEEE VIS/TVCG/TKDE、ICDE、ICSE和电子学报等共26篇，获得2024年和2025年IEEE PacificVis（Journal
  track）最佳论文提名奖。

  主持国家自然科学基金面上项目、青年项目、腾讯犀牛鸟专项研究计划项目，作为北理工负责人参与国家重点研发计划“工业软件”重点专项课题、国家自然科学基金联合基金重点支持项目、国铁集团重点项目等。

  每年招收2名硕士研究生。欢迎对于数据智能等研究方向感兴趣、踏实认真、动手能力强的同学加入，我会认真指导每一位同学，共同学习进步，一起做有意思的研究工作。

  更多信息请访问：https://guozhengli2021.github.io/homepage/

  科研方向

  大数据可视分析，智能交互，文档智能，大模型应用

