bio_raw: '个人信息

  高广宇，长聘教授，博士生导师，IBM全球卓越学者获得者，数据科学与知识工程研究所副所长。2013年于北京邮电大学和新加坡国立大学（2012-2013年）联合培养获博士学位，2013年10月至北京理工大学参加工作至今；2016年IBM访问学者，在IBM中国系统开发中心开展大数据智能研究；2019-2020年任北京市顺义区经信委副处级主任助理（挂职）。

  近年来共在国际顶级期刊和学术会议发表论文40多篇，出版中英文专著2本，申请国家发明专利12项（授权5项）。主持国家自然科学基金项目3项、装备预研基金1项、航天SAST基金1项、教育部协同育人项目4项、国防科研和企事业委托项目若干。

  作为负责人，获2026年曼谷IPITEX国际发明展金奖及INNOPA 特别奖、2025年北京理工大学教育教学成果一等奖、北京理工大学教学基本功比赛三等奖、最受欢迎的专业课教师等。作为指导教师，带领学生获CCF-A类会议ICCV2019之VisDrone挑战赛第二名（Honorable
  Mention）、2020年中国软件杯总决赛二等奖、2021年第七届中国国际“互联网+”大赛北京赛区复赛二等奖、IEEE UIC2015视频竞赛Nominate
  Video Award等。作为主要完成人，获2026年日内瓦国际发明展金奖、2025年纽伦堡国际发明展银奖、2025年中国电子学会电子教学成果大赛一等奖、2024北京理工大学优秀教育教学成果特等奖和2017年中国轻工业联合会科技进步奖三等奖。

  主要研究领域为计算机视觉、深度学习与多媒体分析，目前聚焦“受限监督下的语义分割与持续场景理解、多模态大模型推理与具身协同感知”等。

  个人主页：

  https://guangyu-ryan.github.io

  招生计划：欢迎对所研究内容感兴趣的小伙伴，博士生1名/年，硕士生2-3名/年，同时欢迎本科保研同学提前加入课题组。

  科研方向

  计算机视觉、深度学习、多模态推理、具身感知等。

