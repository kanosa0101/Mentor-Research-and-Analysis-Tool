  承担科研情况

  1. 主持国家自然科学基金面上项目“未知场景持续理解中的有限监督语义分割研究”，2025.01-2028.12.

  2. 主持国家自然科学基金面上项目“低质量监控视频中的行人理解方法研究”，2020.01-2023.12.

  3. 主持中国航天科技集团SAST基金项目“基于视觉原理的星载类脑高速目标探测识别技术”，2023.01-2024.12.

  4. 主持装备预研重点实验室基金项目“基于单光子阵列的光辐射测量技术研究”，2020.01-2023.06.

  5. 主持国防科工局基础产品创新计划某课题“***方法”，2024.01-2025.12.

  6. 主持国防科技173计划技术领域基金项目某课题“***方法研究”，2022.01-2023.12.

  7. 主持国家自然科学基金青年基金项目“基于演化学习的名人识别技术与名人库构建研究”，2015.01-2017.12.

  8. 主持北京环境特性研究所委托项目“渐进式舰船目标海场景合成”，2024.04-2024.12.

  9. 主持北京机电工程研究所委托项目“基于动态贝叶斯网络的装备决策效能评估模型构建及优化方法”，2023.07-2024.04.

  10. 主持教育部产学研协同育人项目“基于LinuxONE上超融合解决方案的探索与实现”，2019.01-2020.12.

  所获奖励

  1. 2026年曼谷IPITEX国际发明展金奖及INNOPA 特别奖（负责人）、2026年第51届日内瓦国际发明展金奖（主要完成人）、2025年第77届德国纽伦堡国际发明展银奖（主要完成人）。

  2. 2025年北京理工大学教育教学成果奖一等奖（负责人）、2025年中国电子学会教育教学成果大赛一等奖（主要完成人）、2024年北京理工大学教育教学成果特等奖（主要完成人）。

  3. 2021年获批北京理工大学研究生“课程思政”示范课（软件理论与工程）、2020年获批北京理工大学本科生“课程思政”示范课（程序设计方法实践）、2017年和2019年分别获批北京理工大学研究生精品课程。2018年北京理工大学第十一届青年教师教学基本功比赛三等奖。

  4. 2015，2016，2017和2019年连续获得IBM全球卓越学者奖。

  5. 2017年中国轻工业联合会科技进步奖三等奖“轻工产品大数据挖掘与全生命周期追溯关键技术研发与应用”，主要完成人之一。

  6. 北京理工大学年第十一届“我爱我师”评选活动荣获“我最喜爱的专业课老师”称号。

