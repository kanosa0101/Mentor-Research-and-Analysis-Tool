bio_raw: '个人信息

  刘驰，教授、博士生导师、国家级领军人才、北京理工大学计算机学院副院长、IEEE Fellow。

  2006年本科于清华大学电子工程系，2010年博士毕业于英国帝国理工学院电气和电子工程系，后在德国电信研究总院任博士后研究员，及在美国IBM TJ Watson研究中心和IBM中国研究院任研究主管。主要研究方向是：具身智能、物联网等。

  主持国家重点研发计划“工业软件”重点专项项目、国家重点研发计划“战略性科技创新合作“重点专项项目、国家优秀青年科学基金、国家自然科学基金联合重点项目3项，科技部高端外国专家引进计划5项、国家重点研发计划课题2项、以及X73、XX6等。发表CCF-A类论文百余篇、ESI高被引论文7篇，授权国内外发明专利60余项，登记软件著作权70余项，参与编著中英文书籍16本/节，谷歌引用1.3万余次，H
  index为54，

  入选全球前2%顶尖科学家榜单（终身科学影响力榜单、年度科学影响力榜单；2024-2026）、爱思唯尔中国高被引科学家（2024）。

  获中国电子学会自然科学一等奖(序1)、中国电子学会电子信息教学成果大赛一等奖(序1)、德国纽伦堡发明展金奖(序1)、北京理工大学优秀教育教学成果特等奖(序1)、CCF青年科技奖、青年北京学者、茅以升科学技术奖—北京青年科技奖、ACM
  SigKDD 2021最佳论文亚军、ACM MobiCom 2021最佳社区论文亚军、中国高校计算机教育大会优秀论文奖，

  及省部级一等奖1项、二等奖2项。编写的物联网教材入选

  工信部工程硕博士精品教材、全国高等学校计算机教育研究会优秀教材奖、北京理工大学精品教材

  ；培养的多名学生获得北京市优秀本科毕业设计论文、中国电子学会优秀硕士论文、北京理工大学最高奖学金徐特立奖学金等；作为指导教师带领学生获

  中国高校计算机大赛——人工智能创意赛全国总决赛特等奖、“挑战杯”首都大学生创业计划竞赛特等奖。

  现任

  智能信息技术北京市重点实验室主任、中国电子学会会士

  、英国工程技术学会会士（Fellow of IET）、英国计算机学会会士（Fellow of British Computer Society）、国家信息产业“十四五”规划专家顾问组成员、全国信标委技术委员会委员、北京专家联谊会理事、中国电子学会理事、中国计算机学会杰出会员，IEEE
  Transactions on Mobile Computing编委（CCF-A类），北京润丰中学科学副校长、北京理工大学计算机科学与技术学科责任教授和信息与电子学部委员等。曾任科技创新2030—大数据重大项目领军专家、中国工程院“十三五”战略性新兴领域高级咨询专家，IEEE
  Transactions on Network Science and Engineering编委并于2021年和2023年两次获得获杰出编委奖，CCF-A类会议SIGKDD、IJCAI、INFOCOM
  TPC（并获评2021年杰出程序委员），IEEE ICC 2020 Symposium on Next Generation Networking主席，中国科协第400期青年科学家论坛回顾暨“弘扬科学家精神”报告会执行主席等。

  科研方向

  物联网大数据处理技术

