  7. 逄金辉,陈秋萍. 基于模糊机会约束的博弈联盟收益[J].北京理工大学学报,2010,11:1383-1386.

  8. 逄金辉,张强. 模糊多目标两人零和博弈的Pareto策略[J].北京理工大学学报,2008,10:934-936

