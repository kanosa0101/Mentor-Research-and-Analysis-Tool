  2. Jinhui Pang, Xiang Chen, Shujin Li. The Shapley Values on Fuzzy Coalition Games
  with Concave Integral Form[J]. Journal of Applied Mathematics, 2014, 2014(4): 1-13(SCI四区）

  3. Jinhui Pang, Shujin Li. The Cores for Fuzzy Games Represented by the Concave
