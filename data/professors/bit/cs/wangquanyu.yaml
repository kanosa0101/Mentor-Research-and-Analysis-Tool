bio_raw: '个人信息

  王全玉，男，工学博士，硕士生导师，软件智能与软件工程研究所副所长。

  1991年于北京航空航天大学获得学士学位，1994年于哈尔滨船舶工程学院获得硕士学位，1997年于哈尔滨工业大学获得博士学位，并进入控制理论与控制工程博士后流动站工作，2002年进入北京理工大学任教，研究方向为计算机仿真、人机交互技术和机器人技术，于2005年学校公派赴英国UWE大学学习。

  先后主讲本科生、硕士研究生专业英语、操作系统、高级操作系统、人机交互技术课程；指导学生参加微软创新杯、Altera亚洲创新设计大赛、国家大学生创新计划并获奖；指导硕士研究生论文获北京理工大学优秀学位论文。

  先后主持或以主要完成人承担了国家核高基、国家重大专项、自然科学基金重大项目、教育部重大课题公关项目、北京市重大课题、国防科工委、解放军总装备部、海军后勤部、中船总公司系统工程部等多项科研任务。

  发表文章五十余篇，其中SCI检索6篇、EI检索16篇；获得国家专利3项，软件著作权8项。

  培养学生

  - 培养学生70余名，就业单位包括：

  - 互联网公司：百度、阿里、腾讯、字节跳动、网易、金山等。

  - 外企：IBM、Adobe、Nvidia等。

  - 通信：华为、联想、中国移动等。

  - 科研院所：电科院、航天二院等。

  - 金融保险：中行、农行、北京银行、中国人民保险等。

  科研方向

  智能人机交互、移动增强现实、教育大数据

  代表性学术成果

  1. Quanyu Wang; Kaixiang Zhang; Manjotho Ali Asghar. Skeleton-Based ST-GCN for Human
  Action Recognition with Extended Skeleton Graph and Partitioning Strategy. IEEE
  Access. 2022. Vol.10，doi: 10.1109/ACCESS.2022.3164711

  2. Quanyu WANG, Siyin LIU, Zhe WANG. A New Internet Architecture for Robot Remote
  Control. 2006 IEEE/RSJ INTERNATIONAL CONFERENCE ON Intelligent Robots and Systems
  October 9-14, 2006, Beijing, China.

  3. Quanyu WANG, Bin LU, Xin LIU,BITBot-A Modelling and Simulation Platform for Robots,IEEE-RAS
  International Conference on Humanoids Robots, Humanoids''08, Daejeon, Korea, December
  1-3, 2008, pp469-474

  4. WANG Quanyu, CAO Haifang, LIU Xin, An Internet Robot Tele-operating System,International
  Conferences on Robotics, Automation & MechatronicsIEEE CIS-RAM 2008, Chengdu, China

  5. Wang Quanyu, Mi Qing, Shen Pengyang, Liu Xin, Position/Attitude Resolving Simulation
  of a Shooting Device in a Projection System,(ICCASM 2010)V15,pp244-247

  6. 王全玉 米庆 刘昕,脆性物体破碎效果实时仿真研究, 《系统仿真学报》 2012年01期, pp30-34.

  7. 国家发明专利：一种采用多束光确定位置姿态的系统和方法，专利号：ZL2008101163759

  8. 国家发明专利：一种多通道的分布式绘制系统与方法，专利号：ZL2008101178148

  承担科研情况

  1. 互联网+时代研究生教育资源配置模式的理论研究-自然科学基金重点项目

  2. 实用化VR技术研究-国防科工委

  3. 世界一流大学和一流学科建设评价体系与推进战略研究-教育部重大课题公关项目

  4. 市属高校“双一流”建设问题及对策研究-北京市十三五重大课题

  5. 环境仿真技术及实用化VR技术研究-解放军总装备部

  6. 高逼真度破碎效果仿真研究-解放军总装备部

  7. 多媒体导航系统的迁移开发-国家核高基项目

  8. 工程机械模拟仿真训练系统-某部队

  9. 虚拟手术培训软件系统-海军总医院

  10. 导航接收机数据采集与传输软件-中国电子科技集团公司第54研究所

  所获奖励

  -航空航天部科技进步二等奖

  -兵器工业总公司科技进步三等奖

  -北京理工大学科学技术一等奖

  社会兼职

  中国计算机学会高级会员、虚拟现实专业委员会委员、IEEE会员

  备注'
