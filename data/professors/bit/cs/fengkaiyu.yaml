bio_raw: '个人信息

  冯恺宇，博士，北京理工大学计算机学院准聘教授，博士生导师，国家级青年人才。2012年获得北京航空航天大学学士学位，2018年获新加坡南洋理工大学博士学位。2018至2021年在新加坡南洋理工大学先后担任研究员、研究助理教授。2022年加入北京理工大学计算机学院。主要研究领域为图数据挖掘、社交网络分析、空间数据管理与挖掘。在VLDB、SIGMOD、ICDE、WWW等CCF推荐A类会议和TKDE等CCF推荐A类期刊发表了多篇论文，多次担任国际会议的程序委员会委员，包括SIGIR、KDD、ICDE、WSDM、CIKM，以及国际期刊的审稿人，包括TKDE、VLDB
  Journal、TODS、SIGSPATIAL、Information Science等。

  招生计划：每年招收博士生1人，硕士研究生2～4人。

  个人主页：https://fengkaiyu.github.io/

