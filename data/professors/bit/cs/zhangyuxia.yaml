bio_raw: '个人信息

  张宇霞，博士，北京理工大学计算机学院长聘副教授，博士生导师，CCF软件工程专委会、CCF开源发展委员会执行委员。研究领域为可持续开源软件生态、实证软件工程、智能化软件开发。在ICSE、FSE、TSE、TOSEM等顶级会议和期刊上发表论文30余篇。主持国家自然科学基金青年项目，主持国防科技重点实验室面上项目，作为单位第一负责人参与国家自然科学基金重点项目。受邀担任国际顶级期刊TSE，TOSEM，EmSE的审稿人，多次担任国际顶会FSE，ICSE程序委员会委员，担任ASE
  2024 Review Process共同主席、ICSME2022 publication主席、Saner2026 Journal First主席等。获得ICSE
  2022杰出论文奖、ESEC/FSE 2023杰出论文奖，入选第十届中国科协青年人才托举项目。

  科研方向

  智能化软件开发，可持续开源软件生态。主要内容为采用数据挖掘、机器学习、自然语言处理、大语言模型等方法分析并改进大规模复杂软件系统的开发效率和质量,构建新型软件开发范式；对海量开源软件开发及其社区生态持续发展有重点研究。

