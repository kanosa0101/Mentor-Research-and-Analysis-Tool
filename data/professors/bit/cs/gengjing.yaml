bio_raw: "个人信息\n耿晶，博士，北京理工大学计算机学院副教授，博士生导师。2015年12月于武汉大学测绘遥感信息工程国家重点实验室获得博士学位。2016年2月进入北京理工大学计算机学院开展研究工作，先后任博士后、特别副研究员，副教授。主要研究方向包括遥感影像智能解译、时空大数据挖掘。至今发表期刊或会议论文50余篇，主持或者参与十余项包括国家重点研发在内科研项目。\n\
