bio_raw: "个人信息\n车海莺，北京理工大学计算机学院数据科学与知识工程研究所副教授。北京理工大学博士,德国Karlsruhe大学信息工程博士后. 美国史蒂文斯理工学院访问学者。研究方向包括大数据分析，人工智能，区块链技术等，相关领域发表高水平学术文章20余篇，发明专利3项.\
  \ 作为主要完成人参与完成多项科技部重点研发计划项目和国家自然基金项目。\n主讲课程包括全英文《大数据分析》，全英文《人工智能和计算科学》、中文《智能软件工程》等。获北京理工大学教学名师，高校在线开放课程联盟联席会2025年会“优秀案例”，2025\
  \ 中国软件行业协会“人工智能+”新工科系列数字教材《智能软件工程》立项，2024教育部华为产学合作项目，2024教育部拓金计划项目《大数据分析》，2023年国家一流本科课程（线上一流课程）大数据技术导论）核心成员，\
  \ 2024留学北理我最喜爱的老师，2022北京理工大学迪文优秀教师、2021教育部华为栋梁之师，多项教育部重点教改项目等奖项。获得过IBM全球共享研究计划项目奖，IBM全球学者奖(Faculty\
  \ Awards) 多次获得国家留学基金委IBM 优秀教师奖教金等。出版教材《大数据分析与处理-实践者的研究方法》，《大数据导论》等专著3部。社会职务包括欧美同学会德奥分会理事，华为云与计算先锋教师，华为布道师，国家电子数据司法鉴定人，SAP学术与教育工作委员会委员，中国青少年基金会-SAP数字人才培育计划志愿者讲师等。\n\
