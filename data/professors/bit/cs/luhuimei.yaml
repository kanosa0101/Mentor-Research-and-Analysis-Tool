bio_raw: '个人信息

  陆慧梅，博士，副教授，博士生导师。CCF高级会员。2004年1月毕业于清华大学计算机系计算机科学与技术专业，获工学博士学位。主要研究领域是操作系统内核和计算机网络等。近年来作为项目负责人先后承担多个项目，包括国家自然科学基金、中国移动通信研究院开放项目和学校基础基金、学院基础基金项目等，并作为主要研究者参加863项目、国家自然科学基金重大研究计划面上项目、国防科工委基础科研项目等。北京理工大学“十五”先进科技工作者。依托科研工作，在国内外学术期刊和会议发表论文30余篇，获授权国家发明专利多项。

  科研方向

  1. 计算机网络体系、算法和协议，包括：车载自组织网络、容迟容断网络、内容为中心网络；

  2. 分布式系统与应用，如智能交通，涉及路况信息的收集、挖掘分析和分布等；

  3. 操作系统内核设计和实现。

