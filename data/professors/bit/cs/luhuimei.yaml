  [12]  华为科技基金项目，“具有层次结构且规模可扩展的组播路由协议HMR 的设计和实现”，1999.5~2000.9，主要完成人

  [13]  企业横向合作项目，“PIM 协议的设计和实现”，2000.10~2001.7，主要完成人

  所获奖励

  2018年指导本科生参加“龙芯杯”全国大学生计算机系统能力培养大赛，获得三等奖，被授予“优秀指导教师”；2022年指导本科生参加全国大学生计算机系统能力大赛操作系统设计赛功能挑战赛，获得二等奖，被授予“优秀指导教师”；2023年指导本科生参加全国大学生计算机系统能力大赛操作系统设计赛内核实现赛，获得一等奖，被授予“优秀指导教师”。

  社会兼职

  备注

  本实验室积极支持大三、大四同学参加操作系统大赛（https://os.educg.net/#/），如果您有兴趣，欢迎联系！'
