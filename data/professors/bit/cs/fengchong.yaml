bio_raw: '个人信息

  冯冲，博士、教授、博导，国家级科技创新领军人才。中国中文信息学会理事、机器翻译专委会副主任委员。2005年于中国科技大学计算机系获工学博士学位后，至2010年3月在中科院计算机语言信息工程研究中心从事语言信息处理领域研究开发和项目管理工作。2010年3月随团队调入北京理工大学计算机学院。现为计算机学院党委委员、语言智能和社会计算研究所副所长兼书记，同时担任北京市海量语言信息处理和云计算应用工程研究中心副主任、工信部信息智能处理与内容安全重点实验室副主任。担任TKDE、TOIS等国际顶级期刊审稿人；COLING、ACL、CCMT等国内外学术会议的领域主席和程序委员。

  专注从事语言信息处理技术二十余年。作为负责人承担国家重点研发计划项目、国家863计划项目、国家自然科学基金等各类科研项目20余项。所研制开发的技术和平台在解放军某部、国家安全部某局、国家计算机网络与安全管理中心、北京市科技情报所等部门部署运行，突破了关键技术，取得了显著效果，产生了良好效益。在TKDE、SIGIR、ACL等高水平国际期刊和会议发表论文100余篇。获中国电子学会科技进步一等奖、国防科技进步奖二等奖、北京市科技进步二等奖等省部级科技奖励6项。

  近十年来指导四十余名硕士、博士研究生。已毕业博士研究生主要去向为国内外知名高校（伦敦玛丽女王大学、北京理工大学、北京工业大学等）、国内外知名信息技术企业（京东顶尖青年技术天才计划、阿里星计划、百度aidu计划、微软亚研院等）。已毕业硕士研究生的主要去往国内外知名企业（腾讯、今日头条、中国银行等），或攻读博士继续深造（卡耐基梅隆大学、清华大学等）、研究机构（中科院信工所、航天X院、中电科X所等）。

  科研方向

  大语言模型预训练、垂直领域知识图谱、智慧医疗、机器翻译和多语处理、深度报告生成等人工智能相关领域。

