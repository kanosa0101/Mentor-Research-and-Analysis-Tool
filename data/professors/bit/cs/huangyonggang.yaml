bio_raw: '个人信息

  副教授、博士、硕士生导师。2005年和2012年在北京航空航天大学获得工学学士和工学博士学位。2016年至2017年在悉尼科技大学和迪肯大学访学。主持自科基金面上项目1项、青年项目1项、863子课题1项。参与核高基、973、863等10余项科研项目。在IEEE
  Transactions 等国际顶级期刊与会议上发表论文20余篇。

  每年招收两名硕士研究生，欢迎邮件交流。

  科研方向

  大模型技术及应用、智能体技术及应用。

  代表性学术成果

  [1] Yonggang Huang*, Jun Zhang, Lei Pan and Yang Xiang, "Privacy protection in interactive
  content based image retrieval," IEEE Transactions on Dependable and Secure Computing,
  Vol.17, pp.595-607, May. 2020.  (CCF A)

  [2] Yucheng Liu, Yonggang Huang* , Shoujin Wang, Wenpeng Lu, Huiyan Wu, “Modality
  coupling for privacy image classification”, IEEE Transactions on Information Forensics
  and Security, Vol.18, pp.4843-4853, Aug. 2023. (CCF A)

  [3] Yonggang Huang*, Longbing Cao, Jun Zhang, Lei Pan and Yuying Liu, “Exploring
  feature coupling and model coupling for image source identification,” IEEE Transactions
  on Information Forensics and Security, Vol.13, pp.3108-3121, Dec. 2018. (CCF A)

  [4] Yonggang Huang*, Jun Zhang, and Heyan Huang, “Camera model identification with
  unknown models,” IEEE Transactions on Information Forensics and Security, Vol.10,
  pp. 2692-2704, Dec. 2015. (CCF A)

  [5] Huiyan Wu, Yonggang Huang* and Guoshun Nan, “Doubled coupling for image emotion
  distribution learning”, Knowledge-Based Systems, Vol.260, pp.110107, Jan. 2023.
  (中科院 TOP)

  承担科研情况

  [1] 个性化情感图像分类与生成技术研究，自科基金面上项目，2020.1~2023.12，69.4万，主持。

  [2] 跨语图像检索中融合视觉信息的多语翻译与集成方法研究，自科基金青年项目，2014.1~2016.12，23万，主持。

  [3] 云服务与管理平台核心软件及系统，863子课题，2013.1~2015.12，141万，主持。

  [4] XX自动分析及模版生成工具， 航天一院项目，2024.1~2025.12，27万，主持。

  [5] 面向XX知识管理系统， 航天一院项目，2022.1~2023.6，40万，主持。

  [6] 智能化XX推送平台，航天一院项目，2020.1~2021.12，60万，主持。

  所获奖励

  社会兼职

  自科基金评审人，TIFS、TDSC、IJCAI等国际顶级期刊和会议审稿人。

  备注'
