bio_raw: '个人信息

  北京理工大学计算机学院副教授，北京理工大学—美国德州仪器物联网技术联合实验室主任。主讲的计算机学院本科课程：计算机体系结构、嵌入式计算系统、计算机组成原理。主讲全校研究生课程：嵌入式系统。自1985年保研进入嵌入式系统领域，致力于单片机C高级语言应用和ARM嵌入式处理器应用推广，多次带队参加全国大学生电子设计竞赛，编著国内第一本ARM书，第一本单片机C语言书。

  科研方向

  网络与信息安全，嵌入式系统，物联网

  代表性学术成果

  第一作者出版图书《ARM&Linux嵌入式系统教程》（第3版），北京市精品教材；《ARM嵌入式处理器结构与应用》（第2版），普通高等教育“十一五”国家级规划教材；《单片机的C语言应用程序设计》（第5版）等。

  承担科研情况

  机械与车辆学院合作项目汽车电子实时操作系统及其基础平台，TI第三方合作项目物联网教学平台。

  所获奖励

  获2014 第一届 全国大学生物联网设计竞赛（TI杯） 全国总决赛一等奖，获2011年“TI杯”——首届全国大学生物联网创新应用设计大赛全国一等奖，优秀指导老师奖等。

  社会兼职

  《单片机与嵌入式系统应用》杂志副主编，中国计算机学会微机（嵌入式系统）专委咨询委员会嵌入式系统专业顾问，嵌入式系统联谊会发起委员。

  备注'
