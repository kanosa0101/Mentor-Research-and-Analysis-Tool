bio_raw: '个人信息

  北京理工大学计算机系本科、硕士研究生，北京理工大学教育研究院教育技术学博士，美国加州大学UCSD分校访问学者。编写并出版了30余部计算机类图书和教育技术类专著，1部被评为首届全国优秀教材奖一等奖，4部入选教育部国家级十五和十一五规划教材，3部评为“北京市精品教材”，2部获得“科技部科普图书奖”。主持和参与多项纵向、横向科研项目和教改项目，到校科研经费逾百万元；教改成果曾获得北京市高等教育二等奖和校级特等奖等奖励；是国家级精品课程、国家级双语教学示范课、国家级优秀教学团队的主要完成人；在核心期刊和EI检索期刊发表科研论文和教改论文10余篇。北京理工大学“我爱我师”评选十佳教师、北京理工大学T-more优秀主讲教师一等奖、北京理工大学师德先进个人。

  科研方向

  电子游戏、游戏化应用、教育元宇宙

  代表性学术成果

  承担科研情况

  所获奖励

  社会兼职

  备注'
