bio_raw: '个人信息

  成雨蓉，北京理工大学计算机学院预聘副教授（特别研究员），博士生导师。中国计算机学会优秀博士论文提名奖获得者。2012年和2017年分别于东北大学计算机科学与工程学院获得学士和博士学位。先后于香港科技大学、北京理工大学担任助理研究员和博士后研究员。主要研究方向包括时空数据分析、众包数据管理与分析、联邦学习、数据共享、图数据管理、知识图谱查询与分析等。至今已发表包括TPDS、TKDE、KDD、VLDB、ICDE等CCF
  A类期刊或会议在内的相关学术论文近20篇。曾主持或参与8项纵向课题的研究。多次担任各类顶级期刊及会议评审，如TPDS, TKDE, WWWJ, SIGKDD,
  CIKM等。

  News: 每年计划招收博士生1人、硕士研究生3至4人，同时欢迎优秀的本科生加入实验室。（注：具有ACM程序设计竞赛、IEEE极限编程竞赛或者其它科技竞赛背景者将优先考虑）。

  科研方向

  时空数据分析、众包数据管理与分析、联邦学习、数据共享、图数据管理、知识图谱查询与分析等。

