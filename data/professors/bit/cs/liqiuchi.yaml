bio_raw: '个人信息

  李秋池，博士，北京理工大学计算机学院准聘教授，博士生导师，国家青年人才。2015年本科毕业于清华大学，2017-2020年担任欧盟玛丽居里学者，2021年在意大利帕多瓦大学获得博士学位。2021-2025年在丹麦哥本哈根大学先后担任博士后研究员，助理教授。2025年9月加入北京理工大学计算机学院。主要研究领域为量子自然语言处理。在ACL，NeurIPS,
  ICLR, WWW, AAAI, IJCAI等顶级会议和Nature Communications, Neural Networks, Information
  Fusion等顶级会议共发表论文40余篇。以第一作者获NAACL 2019（自然语言处理三大顶会之一）的Best Explainable NLP paper，获ACL
  2025杰出论文奖以及PRCV               2025最佳论文荣誉提名。担任ACL ARR 领域主席，SIGIR、AAAI程序委员会委员，并长期担任ICLR，NeurIPS，ICML等多个顶级会议的审稿人。

  每年计划招生博士生1人，硕士研究生3-4人，同时欢迎高年级优秀本科生加入课题组。

  个人主页：qiuchili.github.io

  科研方向

  自然语言处理、信息检索、人工智能，大语言模型，量子认知与交互

  代表性学术成果

  [1] Chen Zhang, Qiuchi Li, Dawei Song, Yan Gao, Yao Hu. “Towards the Law of Capacity
  Gap in Distilling Language Models”. The 63rd Annual Meeting of the Association for
  Computational Linguistics (ACL) 2025 (Outstanding Paper).

  [2] Ben Yao, Prayag Tiwari, Qiuchi Li*. “Self-supervised Pre-trained Neural Network
  for Quantum Natural Language Processing”. Neural Networks, Volume 184 (2025).

  [3] Ziyi Ye, Xiangsheng Li, Qiuchi Li, Qingyao Ai, Yujia Zhou, Wei Shen, Dong Yan
  and Yiqun Liu. “Learning LLM-as-a-Judge for Preference Alignment”. International
  Conference on Learning Representations (ICLR), 2025.

  [4] Qiuchi Li, Dimitris Gkoumas, Alessandro Sordoni, Jianyun Nie, and Massimo Melucci.
  “Quantum-inspired Neural Network for Conversational Emotion Recognition, ”Thirty-Fifth
  AAAI Conference on Artificial Intelligence (AAAI), 2021.

  [5] Qiuchi Li, Dimitris Gkoumas, Christina Lioma, Massimo Melucci. “Quantum-inspired
  Multi-modal Fusion for Video Sentiment Analysis, ” Information Fusion (Impact Factor:
  13.669), 2020.

  [6] Benyou Wang, Donghao Zhao, Christina Lioma, Qiuchi Li, Peng Zhang, and Jakob
  Grue Simonsen. “Encoding Word Order in Complex Embeddings,”International Conference
  on Learning Representations (ICLR), 2020.

  [7] Chen Zhang, Qiuchi Li, and Dawei Song.“Aspect-Based Sentiment Classification
  with Aspect-Specific Graph Convolutional Networks.” International Conference on
  Empirical Methods in Natural Language Processing and the 9th International Joint
  Conference on Natural Language Processing (EMNLP-IJCNLP), 2019.

  [8] Qiuchi Li*, Benyou Wang*, and Massimo Melucci. “CNM: An Interpretable Complex-Valued
  Network for Matching.” The North American Chapter of the Association for Computational
  Linguistics (NAACL), 2019. (*Equal Contribution) (Best Explainable NLP Paper)

  [9] Qiuchi Li, Jingfei Li, Peng Zhang, and Dawei Song. “Modeling Multi-Query Retrieval
  Tasks Using Density Matrix Transformation,” International ACM SIGIR Conference on
  Research and Development in Information Retrieval (SIGIR), 2015.

