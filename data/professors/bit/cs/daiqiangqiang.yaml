bio_raw: '个人信息

  代强强，北京理工大学计算机学院预聘副教授，博士生导师，入选2024年度CCF优博（全国仅10人）。2023年毕业于北京理工大学并获得博士学位，同年7月进入北京理工大学博士后流动站工作，2025年9月起任职于北京理工大学计算机学院。主要方向包括图数据挖掘与管理，大规模图数据并行算法设计等。在数据库领域顶级或重要会议与期刊上发表学术论文20余篇，包括SIGMOD、ICDE、WWW和TKDE等。作为项目负责人获批多项项目，包括国家自然科学基金青年项目、中国博士后创新人才支持计划、中国博士后科学基金面上项目。

  News：每年计划招收硕士生2-3人，博士生1人。

  个人主页：https://qq-dai.github.io

  科研方向

  图数据挖掘与管理、并行与分布式图算法、知识图谱、Graph for AI

