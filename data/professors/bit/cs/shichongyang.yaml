bio_raw: '个人信息

  施重阳，男，1980年8月出生，博士，副教授，悉尼科技大学访问学者。2002年获东北师范大学计算机本科学位，2004年获北京理工大学软件硕士学位，2011年于北京理工大学获得计算机博士学位，目前是北京理工大学计算机学院软件智能与软件工程研究所智能信息检索方向负责人。一直从事人工智能、大模型、自然语言处理、深度学习、智能信息检索、个性化推荐、意见与情感挖掘等方向的研究工作，在这些方向有丰富的研究经验，主持国家自然科学面上与青年基金、国家重点研发计划子课题、JW173项目、北理工-台北科技大学合作专项、中国科学院自动化所国家重点实验室开放课题及北京理工大学基础研究基金等多个纵向课题，同时也参与了多项国家自然科学基金项目及教育部新世纪人才资助项目等课题，主持多项横向课题，在TKDE、AAAI、WWW、SIGIR等国际高水平期刊及会议上发表论文50余篇。获软件著作权3项，国家专利17项。

  科研方向

  人工智能、大模型、自然语言处理、深度学习、数据挖掘、个性化推荐等。

  具体包括：

  大模型生成与控制（例如：可控AIGC生成，幻觉检测与干预，生成信息评价与控制等）

  智能信息检索与知识获取（找到事实的“真相”和“关联”）

  个性化预测与推荐（例如：预测你想看的新闻，推荐你想买的衣服等）

  社交网络情感与意见挖掘（例如：豆瓣评价、谣言和虚假新闻检测等）

