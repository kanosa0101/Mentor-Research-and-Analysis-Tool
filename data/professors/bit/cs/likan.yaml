bio_raw: '个人信息

  李侃，教授、博士生导师、国家重点研发计划评审专家、科技创新2030评审专家、国家863项目评审专家，北京市自然科学基金/重点基金评审专家、博士点基金/博士后基金评审专家，国际期刊NLPR主编。在澳大利亚、加拿大、中国香港等国家和地区任职或学术研究。目前主要从事机器学习、大语言模型及模式识别方面的研究。科研上主持了国家重点研发计划课题、国家973课题、863重大、国家自然科学基金、北京市自然科学基金等多项国家级和部级项目，获得了多项国防科技进步奖、公安部科技进步奖、中国指挥与控制学会科技成果奖、全国高校人工智能与大数据学术创新奖等科研奖励。在NeurIPS、ACL、ICLR、AAAI、IJCAI、TKDE等学术会议和国际期刊上发表学术论文百余篇，授权发明专利30余项，出版了专著《社交网络信息检索与传播》、《视觉人体动作识别》，和《研究生教育资源配置理论与模型》等，共同制定了国家标准《工业互联网平台
  工业机理模型开发指南》（GB/T44122-2024）等。

  教学上荣获教育部-华为“智能基座”优秀教师、北京市高等学校优秀专业课主讲教师、北京理工大学教学名师、T-more优秀教师、迪文优秀教师，参与建设“101计划”《机器学习》、《人工智能引论》课程。近五年主持了国家级新工科研究与实践项目、“机器学习MOOC课程建设、机器学习实践案例开发”等教育部产学研合作协同育人“华为”、“阿里云”、“微软”的新工科项目。主编教材《机器学习》、《深度学习》入选了教育部“战略性新兴领域十四五高等教育教材体系”，出版了教育部精品教材、北京市精品教材，《深度学习理论》、《人工智能：机器学习理论与方法》获得了国家出版基金资助。

  主讲《机器学习》课程：获评教育部“拓金计划”示范课程、北京市高校优质本科课程、华为“智能基座”金课、教育部-华为“智能基座”优秀课件，上线“国家高等教育智慧教育平台”，入选“高校在线开放课程联盟联席会”慕课十年典型、“新华思政”网课程思政示范案例。主讲的《机器学习实践》：获评全国首批工程类专业学位研究生在线示范课程。

  科研方向

  机器学习、大语言模型、模式识别

