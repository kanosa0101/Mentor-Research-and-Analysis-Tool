bio_raw: '个人信息

  李元章，男，博士，副教授。分别于2001、2004、2015年获北京理工大学计算机学士、硕士和博士学位，现为北京理工大学计算机学院数据存储技术团队成员。主要研究领域为存储安全、信息安全、嵌入式技术等。作为项目负责人主持了包括国家自然科学基金面上项目、工信部工业互联网课题、国防重点实验室研究基金、之江实验室开放基金等国家级/省部级科研项目10余项，获北京市青年英才计划资助。近几年以第一作者/通讯作者在TPDS、IJCAI等高水平期刊、会议发表研究论文40余篇，2篇论文入选ESI高被引论文。获国家发明专利授权10余项。承担本科生《汇编语言与接口技术》、研究生《嵌入式系统》的课程教学，主编及参编教材6部，多次获得北京市精品教材、兵工高校优秀教材奖。指导学生多次获得了全国大学生物联网设计竞赛、中国机器人及人工智能大赛一等奖。

  科研方向

  存储安全、人工智能安全、嵌入式系统

