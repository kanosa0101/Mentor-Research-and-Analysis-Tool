bio_raw: '个人信息

  王一拙，博士，副教授，分别于2000年、2005年在北京理工大学计算机学院获学士、博士学位，随后留校工作。主要研究方向为计算机体系结构、高性能计算、容错计算等。曾主持国家自然科学基金项目1项，参与国家自然科学基金项目6项，国家重点研发计划项目1项，国防预研项目等研究项目多项。目前已在国内外著名期刊和国际会议上发表论文70余篇，并多次在国际学术会议（PDP2018、ARC2017、ICPP2016、ICA3PP2015、NPC2014、DATE2013、HiPC2012、NPC2012等）上做报告。长期为ACM
  Trans. Archit. Code Optim. , IEEE Trans. Ind. Inform., J. Chem. Inf. Model. , J.
  Supercomput., Int. J. Parallel Program., Front. Comput. Sci. 等国际著名期刊审稿。曾受国家留学基金委资助，于2010年赴美国加州大学尔湾分校（UCI）访学1年。曾讲授课程有：数值分析、并行编程原理与实践、计算机体系结构性能评估方法、计算机图形学、面向对象程序设计、嵌入式系统等。

  科研方向

  计算机体系结构（Computer Architecture）

  并行程序设计（Parallel Programming Models, Languages and Tools）

  高性能计算（High Performance Computing）

  容错计算（Fault-Tolerant Computer Systems）

  嵌入式系统（Embedded Systems）

