bio_raw: '个人信息

  张志威，北京理工大学计算机学院长聘教授，博士生导师，入选国家级高层次人才计划。2010年获中国人民大学学士学位，2014年获香港中文大学博士学位，2014至2015年在香港中文大学从事博士后工作，2016年加入香港浸会大学，任职研究助理教授，2019年加入北京理工大学计算机学院。主要研究方向为大规模图计算、分布式机器学习系统、大数据分析系统、区块链等。曾主持参与了多个国家级重点科研项目，已发表计算机学会（CCF）推荐A类论文多篇，其中包括顶级会议ACM
  SIGMOD，KDD，ICDE及顶级期刊VLDB Journal等。多次担任如ACM SIGMOD，VLDB，AAAI等国际学术会议程序委员会委员。

  News: 每年计划招收博士生1人，硕士生3至4人，同时非常欢迎对科研感兴趣的高年级本科生提前加入实验室，有意加入本课题组的同学发送邮件至zwzhang@bit.edu.cn联系。News:
  每年计划招收博士生1人，硕士生3至4人，同时非常欢迎对科研感兴趣的高年级本科生提前加入实验室，有意加入本课题组的同学发送邮件至zwzhang@bit.edu.cn联系。

  科研方向

  大模型训推数据平台、高性能大数据分析系统、区块链、金融科技

