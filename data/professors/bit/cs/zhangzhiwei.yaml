  承担科研情况

  1.国家重点研发计划，湖仓融合架构下海量数据处理关键技术（2025-2027），项目负责人

  2.国家自然科学基金， 联合基金项目，多中心跨域湖仓融合架构关键技术（2024-2027），项目负责人。

  3.国家重点研发计划“区块链”重点专项，高并发可扩展区块链存储的基础理论与方法研究(2021-2024)，主要参与者。

  4. 国家自然科学基金，面上项目，多链环境下区块链数据管理关键技术研究（2021-2024），项目负责人。

  5. 国家重点研发计划“网络协同制造和智能工厂专项”，基于区块链的制造大数据价值交换理论与技术（2021-2023），课题负责人。

  6. CCF-华为创新计划，基于Opengause的海量防窜改数据管理关键基础研究（2021-2022），项目负责人。

  7. 国家自然科学基金重点项目，应用驱动的大图数据建模理论与算法研究（2020-2024），主要参与者。

  8. 国家自然科学基金青年项目，基于外存的海量知识图谱数据的查询处理（2017-2019），项目负责人。

  9. 香港研究资助局，Exploring the Structural Critical Entities in Big Attributed Graphs.（2019-2021）项目负责人。

  10. 香港研究资助局，A New Contraction & Expansion Framework for I/O Efficient Graph Processing，（2017-2019）项目负责人。

