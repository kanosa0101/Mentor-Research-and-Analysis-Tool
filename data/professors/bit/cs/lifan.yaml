bio_raw: '个人信息

  李凡，博士，教授，博士生导师。北京理工大学计算机学院先进网络与数据安全研究所所长。

  2008年5月毕业于美国北卡罗来纳大学，获工学博士学位；2004年1月毕业于美国特拉华大学，获硕士学位；1998年毕业于华中科技大学，获学士学位。

  长期从事计算机网络与移动计算领域的教学科研工作，主要研究方向包括智能感知、物联网、隐私保护、可穿戴计算、人机交互、移动计算、边缘计算、无线传感网、和车联网等。
  主持/参与国家自然科学基金青年项目、面上项目、重点项目、国家重点研发计划、省部级项目等多项。在ACM MOBICOM、IEEE INFOCOM、ACM UBICOMP、
  IEEE/ACM TON、IEEE TMC、IEEE TDSC、IEEE TPDS、IEEE TC等著名国际期刊及会议上发表SCI/EI检索学术论文200余篇；
  获IEEE VTS 2024年度、Tsinghua Science and Technology 2015年度最佳论文奖；IEEE MASS 2013、IEEE
  IPCCC 2013、ACM MOBIHOC 2014最佳论文奖。据Google Scholar 统计，论文总引用数达7000余次。 入选Stanford/Elsevier全球前2%顶尖科学家榜单。授权国家发明专利30余项。

  担任IEEE IPCCC程序委员会主席；IEEE BIGCOM、IPCCC出版主席；IWQoS宣传主席；ACM中国图灵大会成果展示主席；中国计算机学会物联网专委委员，ACM
  SIGBED CHINA常务委员。

  指导学生参加国家级竞赛，获全国一等奖6项、全国二等奖十余项；指导研究生获得中国通信学会优博、ACM SIGMOBILE China优博和国家奖学金等奖项；指导本科生参加国家级及北京市级大学生创新项目。已毕业硕士研究生去向有知名企事业单位、研究机构（中央办公厅、公安部、北京市政府、字节跳动、抖音、快手、华为、百度、中国银行、农业银行、中国电信、移动研究院、联通研究院、中国电科、航天五院等）、高校任教（北京理工大学、山东大学、华东理工大、北京工业大学、北京林业大学、伦敦大学、纳扎尔巴耶夫大学等）

  每年计划招收博士生1人、硕士研究生2~3人，同时欢迎优秀本科生加入实验室。

  欢迎访问个人主页：https://fli-bit.github.io/

  科研方向

  智能感知、物联网、隐私保护、可穿戴计算、人机交互、移动计算、边缘计算、无线传感网、和车联网等

