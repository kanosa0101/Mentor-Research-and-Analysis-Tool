bio_raw: '个人信息

  男，准聘教授，博导，国家级青年人才。主要研究深度学习与科技大数据挖掘，具体研究Information Extraction、Question Answering
  and Dialogue和Learn to Hashing等方向。担任计算机学会中文信息技术专委会委员，中文信息学会青工委执行委员以及语言与知识专委会委员；已在SIGIR、AAAI、IJCAI、ACM
  MM、SIGMOD、WWW、TOIS、TKDE等国际期刊会议上发表50余篇论文；指导学生分别获NLPCC 2019和ICKG 2020最佳论文奖；部分成果获中国电子学会科技进步一等奖(2018)和浙江省科技进步三等奖(2018)，正在承担或参与国家重点研发计划课题、国家自然科学基金重点项目和面上项目等10余项。主持研发了Hammer
  Scholar学术平台（hammerscholar.net）。所指导学生已在字节跳动、微软、百度、华为、阿里、滴滴研究院、小米科技、中科院信工所、英国爱丁堡大学等IT公司或科研院所就业或者继续深造。

  科研方向

  主要研究深度学习与科技大数据挖掘，具体研究Information Extraction、 Question Answering and Dialogue和Learn
  to Hashing等方向。

