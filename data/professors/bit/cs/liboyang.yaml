bio_raw: '个人信息

  李博扬，北京理工大学预聘助理教授、特别副研究员，入选北京市青年人才托举工程。2015年、2020年于东北大学获得学士和博士学位。2020-2023在北京理工大学从事博士后工作。主要研究方向包括时空数据分析、分布式数据管理、图分析与挖掘等，在VLDB、KDD、ICDE、IEEE
  TKDE等CCF A类期刊/会议发表论文十余篇，主持/参与多项国家自然科学基金和国家重点研发计划课题，担任KDD、IJCAI、IEEE TNSE等期刊/会议的审稿人。

  科研方向

  时空数据分析、分布式数据管理、图分析与挖掘、强化学习等

