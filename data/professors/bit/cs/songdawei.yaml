bio_raw: '个人信息

  【教育及工作经历】教授，博士生导师，兼任工信部语言工程和认知计算重点实验室副主任。 2000年7月毕业于香港中文大学系统工程与工程管理系，获博士学位；2000年9月至2005年7月任澳大利亚分布式系统技术研究中心高级科学家；2005年9月至2008年10月任英国开放大学知识媒体研究所高级讲师，兼任科研副所长；2008年11月至2012年2月任英国罗伯特戈登大学计算机学院讲席教授，兼任大学创新科技和可持续发展研究中心管委会委员；2012年3月至2018年2月任天津大学计算机学院“天津市千人计划”特聘教授。2018年3月加入北京理工大学计算机学院。

  【教学科研工作】长期从事信息检索、自然语言处理及人工智能领域的研究工作，旨在构建符合人类信息推理和认知特点的多模态信息获取、交互和知识发掘理论与方法，特别是近年来，倡导和推动国际新兴的基于量子力学理论的探索式信息检索与交互模型研究。在英国全职任教期间，作为负责人主持英国国家工程及物理科学基金（EPSRC）、英国皇家学会、英国国家信息系统委员会（JISC）、
  欧盟第六、第七框架和地平线2020项目12项。2012年回国后，主持国家自然科学基金重点和面上项目各1项，重点研发项目课题1项，参与国家973项目2项。已发表学术论文220余篇，其中包括ACM
  TOIS、IEEE TKDE、IEEE TNNLS、ACM TIST、JASIST等高水平SCI期刊论文以及AAAI、ACL、IJCAI、SIGIR、WWW等顶级国际会议论文100余篇。在国际评测会议TREC
  2006的专家搜索任务中，其领导团队研发的专家搜索系统在大多数性能指标上均取得第一名。获得国际计算语言学会2025年度会议（ACL2025）杰出论文奖、中国计算机学会自然语言处理与中文计算国际会议（NLPCC2022）最佳论文奖、国际信息检索理论会议（ICTIR2019）最佳论文提名奖、欧洲信息检索会议（ECIR2011）和国际信息检索理论会议（ICTIR2011）最佳论文奖，于2006年和2007年两次获得IBM创新成就奖。

  科研方向

  信息检索、自然语言处理、知识获取、人工智能、量子交互与认知

