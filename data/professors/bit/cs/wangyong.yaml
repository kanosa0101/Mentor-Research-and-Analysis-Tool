bio_raw: '个人信息

  王勇，博士，副教授，网络攻防技术研究所副所长，近年来一直在北京理工大学从事计算机专业教学科研工作，2004年至2005年在爱尔兰圣三一学院计算机科学与统计学院访学，招收计算机科学与技术、软件工程、计算机技术专业和网络空间安全专业的硕士研究生。

  主要研究领域为基于机器学习的软件分析与安全检测、联邦学习、区块链等。承担多项国家重点研发计划项目、国家自然科学基金项目、863计划项目、国防基础科研计划重点项目、国防科技工业预先研究项目、其他省部级项目。国已在知名国际期刊和会议上发表学术论文50余篇，出版翻译教材5部，授权国家发明专利20余项，撰写并公开实施团体标准3项。指导学生获得全国大学生信息安全竞赛二等奖、“中国软件杯”大学生软件设计大赛二等奖、“华为杯”中国研究生数学建模竞赛二等奖等，国防科技情报应用效果优胜奖等，建设教育部-华为“智能基座”产教融合协育人基地一流课程一门，获得北京理工大学优秀教育教学成果二等奖。

