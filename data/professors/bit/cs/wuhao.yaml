bio_raw: '个人信息

  吴昊，博士生导师。在北京理工大学获得工学学士、硕士、博士学位，专业计算机应用技术。现就职于北京理工大学计算机学院语言智能与社会计算研究所。主持或参与了多项国家级科研项目，包括国家重点基础研究发展计划（973）课题、国家重点研发计划课题和子课题、国家自然科学基金重点和面上项目等。博士期间研究论文被国际权威语义测评SemEval会议评选为“Best
  of SemEval 2017”。获中国电子学会科技进步一等奖等2项省部级科研奖励。

  科研方向

  自然语言处理、生物信息学、认知科学、认知神经科学。AI基础研究内容包括：大模型多任务/持续学习、思维链推理优化、检索增强生成、提示学习；AI应用研究内容包括：生物序列分析、行人/遥感/红外多模态检索、视觉/医学问答、知识图谱等。

