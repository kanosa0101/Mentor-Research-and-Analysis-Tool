bio_raw: '个人信息

  田东海，北京理工大学计算机学院副教授，硕士生导师，CCF系统软件专委会执行委员、CAAI智能信息网络专委会委员。2012年3月博士毕业于北京理工大学，获工学博士学位；2009年8月至2011年8月受国家留学基金委资助赴美国宾夕法尼亚州立大学进行联合培养；毕业留校后先后在软件学院和计算机学院工作。主要研究方向为软件安全，人工智能安全，恶意软件分析，网络安全，云计算安全等。近年来作为项目负责人主持了10余项纵向科研课题，包括：军委科技委领域基金、国家自然科学基金、军科院国防重点实验室基金、国家电网科技项目、CCF-绿盟科技“鲲鹏”科研基金、信息安全国家重点实验室开放课题、中科院网络评测技术重点实验室开放课题、上海市信息安全综合管理技术研究重点实验室开放课题。作为软件安全工程技术北京市重点实验室骨干成员参与了国家重点研发计划、国防基础研究计划等多个国家级和部级科研项目。目前以第一作者（或通信作者）在IEEE
  Transactions on Cloud Computing、Software: Practice and Experience、Computer Networks、Future
  Generation Computer Systems、Expert Systems With Applications、NDSS、ISC、SecureComm等国内外重要期刊和会议上发表论文30余篇，授权国家发明专利5项，出版学术专著1本，获得CICC科学技术发明二等奖1项。担任多个国际学术会议程序委员会委员，IEEE
  Transactions on Computers、IEEE Transactions on Dependable and Secure Computing、IEEE
  Transactions on Information Forensics and Security、Computers & Security、Computer
  Networks、Expert Systems With Applications、计算机学报等多个国内外重要期刊的审稿人。

  科研方向

  软件安全/AI安全/操作系统/云计算安全/大模型应用安全

