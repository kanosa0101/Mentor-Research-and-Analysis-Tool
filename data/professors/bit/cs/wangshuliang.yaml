bio_raw: '个人信息

  王树良，男，武汉大学博士，清华大学博士后，教授，博士生导师，北京理工大学电子政务研究院执行院长，第十一届全国青联委员，中国制造企业双创发展联盟副理事长，国家科技创新专项专家咨询组秘书长，教育部高等学校软件工程专业教学指导委员会委员，中国指挥与控制学会认知与行为专业委员会主任，数字政府建设服务联盟专家指导委员会委员，大数据系统软件国家工程研究中心技术指导委员会委员，Chinese
  Journal of Electronics编委。

  入选国家高层次领军人才、科技部领军人才、教育部新世纪优秀人才、CICC青年科学家等。

  主持国家重点研发计划项目、国家科技创新战略重大专项、国家自然科学基金项目等。

  获国家科学技术进步奖一等奖、全国优秀博士学位论文、中国指挥与控制学会技术发明一等奖等。

  每年招博士生1到2名，硕士生2到3名，欢迎对大数据智能有兴趣的同学加入课题组。指导学生获得IEEE Grc Best Paper、GSKI Best Paper、RSPSoc
  Merit Award、中国高校计算机大赛微信大数据挑战赛一等奖等。毕业学生已成为国家机关、高等学校、科研院所、央企、国企，以及华为、阿里、腾讯、百度、谷歌等单位技术负责人。

  科研方向

  大数据智能，具体包括聚类分析、智能推荐、因果推理、空间数据挖掘、社会智治技术等。

