  承担科研情况

  承担的部分科研项目

  1. 国家重点研发计划课题“肺部等软组织穿刺机器人精准安全控制技术”，在研，负责人

  2. 国家重点研发计划子课题“多智能体形式化规划知识表示与重规划方法”，在研，负责人

  3. 国家自然科学基金联合重点项目“融合软组织感知的关节置换机器人智能手术规划关键技术研究”，在研，主要参与人

  4. 国家重点研发计划课题“超大工作空间内多机器人协同作业规划研究”，完成，负责人

  5. 航天预研“空间机器人群体柔顺协同规划决策与控制技术研究”，在研，负责人

  6. 国家863计划重点项目子课题“颅颌面外科精确治疗机器人系统“，完成，负责人

  7. 国家自然科学基金“引入昆虫复视机制的粒子滤波算法及其视觉伺服应用研究“，完成，负责人

  8. 国家自然科学基金“基于模糊自适应粒子滤波的图像雅可比在线估计技术“，完成，负责人

  9. 国家863计划重点项目子课题“矢量格式综合录井图绘制“，完成，负责人

  10. 军口863项目“xxx多目标跟踪技术“，完成，负责人

  所获奖励

  1. 北京理工大学优秀科技奖、国防科技奖、军队科技奖各1项

  2. 北京理工大学优秀教育教学成果一等奖(排第一)、二等奖(排第一) 各1项

  3. 2019、2020连续两年获中国自动化学会颁发的中国机器人大赛优秀指导教师一等奖

  4. 荣获工信部人才交流中心颁发的2022 RoboCom机器人开发者大赛CAIR工程竞技赛优秀指导老师称号、以及2023睿抗机器人开发者大赛(RAICOM)北京赛区优秀指导老师称号。

  5. 中国人工智能学会认知系统与信息处理专委会2020年度杰出会员

  6. 北京理工大学“十一五”优秀创新团队主要成员

  7. 2022年度电子工业出版社优秀作译者奖，排名唯一。

  8. 欧洲信号处理协会2020年最佳论文奖1项（排第三）

  社会兼职

  1. 中国AI学会智能服务专委会第一届副主任、常委，及认知系统与信息处理专委会委员

  2. 中国自动化学会智能自动化专委会、及认知计算与系统专委会委员

  3. 中国计算机学会会员、第十三届会员代表

  4. 国家/北京市自然科学基金、科技部/工信部等项目奖励以及国内外刊会论文评审专家，参与组织学术会议等。

  备注

  指导学生成果

  1. 2015-2023指导学生参加中国机器人大赛暨RoboCup机器人世界杯中国赛、睿抗机器人开发者大赛等国家级比赛，获得一等奖12项（其中冠军1、亚军2、季军1），二等奖18项，三等奖20项。每年还指导学生承担国家级、北京市、校级的科创项目多项。

  2. 培养毕业的研究生中，有5位获国奖、8位校优秀学位论文、1位获得全国工程硕士优秀成果奖（同年全校仅3人），多名获北京市或校级优秀毕业生奖，研究生卢嘉琳的论文获ICCSIP
  2021最佳学生论文奖。毕业后从事职业包括大学教授、国家公务员、军队、银行、互联网、央企、研究所等。'
