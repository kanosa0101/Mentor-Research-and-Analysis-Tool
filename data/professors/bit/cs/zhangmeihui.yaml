bio_raw: '个人信息

  张美慧，北京理工大学计算机学院教授，博士生导师，入选国家级青年人才。于2013年毕业于新加坡国立大学，获计算机科学博士学位。2014年至2017年曾在新加坡科技设计大学工作，任助理教授。主要研究方向为大数据管理与分析、海量数据集成、新型数据库系统、区块链及人工智能等。
  已发表计算机学会（CCF）推荐A类论文近50篇，其中包括数据库及数据挖掘领域顶级会议ACM SIGMOD、VLDB、ICDE、KDD，以及顶级期刊VLDB Journal、TKDE等。近年来，先后主持参与了多个国家级重点科研项目，多次担任如ACM
  SIGMOD，VLDB，ACM MM等国际顶级学术会议程序委员会委员，以及如TKDE，VLDBJ，TODS等国际顶级期刊审稿人。担任VLDB理事会理事（截止目前国内仅有三位入选）、ACM/IMS
  Transactions on Data Science (TDS) 期刊副主编、Springer Distributed and Parallel Databases期刊领域主编、国际顶级会议IEEE
  ICDE 2018、 ICDE 2022领域主席、VLDB 2018、VLDB 2019、VLDB 2020、 VLDB 2023、ACM SIGMOD 2021、
  SIGMOD 2023副主编、DASFAA 2017及EDBT 2022 Demo Track及BOSS 2018 Workshop联合主席等。 荣获2019年度计算机学会CCF-IEEE
  CS青年科学家奖, 2020年度VLDB青年研究贡献奖（截止目前亚洲仅有两位），获VLDB 2019最佳论文奖、ICDE 2018最佳论文提名奖及ACM SIGMOD
  2019 突出研究奖。

  News: 每年计划招收博士生1名，硕士生3-4名，同时也欢迎对科研感兴趣的高年级本科生加入实验室。

  个人主页：https://zmeihui.github.io/

  科研方向

  大数据管理与分析、海量数据集成、新型数据库系统、区块链系统、人工智能等

