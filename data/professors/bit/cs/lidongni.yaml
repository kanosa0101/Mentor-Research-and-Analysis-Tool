bio_raw: '个人信息

  李冬妮，北京理工大学教授、博士生导师，计算机学院副院长。研究方向为垂类大模型、工业互联网、智能优化与仿真计算。近年来承担国家自然科学基金、军科委基础加强计划、装发预研、工业互联网创新工程、制造业高质量专项、产学研及企业技术攻关等项目。在IEEE
  TSMC、IEEE TASE、EJOR、IJPR等权威期刊和会议发表论文二十余篇，代表论著多次入选ESI高被引论文，多次获得IJPR等权威期刊最佳论文奖。与大型军工企业深度合作，主持研发智能优化排产软件、智能工艺规划软件等工业软件。四项专利技术已取得成果转化，在重点武器装备研制与生产中得到实际应用。近年来获得国家级教学成果二等奖、全国“挑战杯”特等奖、北京市教学成果一等奖、北京市师德标兵等荣誉。累计获得国家级奖励5项、省部级奖励10项。目前担任十六届北京市人大代表，围绕布局和发展人工智能产业的多项人大代表建议被列为北京市人大常委会重点督办的建议。

  科研方向

  垂类大模型（Domain-Specific Large Models）、工业互联网、智能优化与仿真计算、快速响应（Responsiveness）机理

  垂类大模型是AI技术的重要演进方向，是AI赋能千行百业的重要手段。目前主持研发产业链供应链韧性大模型，通过政产学研创新联合体的机制，以智能网联汽车和大型运输无人机的全球供应链为切入点，围绕供应链韧性机理模型、高质量行业数据集与基座大模型的深度融合开展关键技术攻关。欢迎联系报考博士生、硕士生，开展科创竞赛及产学研合作。

  联系方式：ldn@bit.edu.cn

