bio_raw: '个人信息

  黄华，国家级领军人才。分别于1996年、2001年和2006年在西安交通大学电信学院获得工学学士、硕士和博士学位。2007年晋升为副教授，2008年聘为博士生导师，2011年1月破格晋升教授。2012年3月调入北京理工大学。教授/博士生导师，智能信息技术北京市重点实验室副主任，主要从事图像/视频处理方面的研究工作。

  科研方向

  图像与视频处理

  代表性学术成果

  近五年发表论文近50篇，其中SCI检索论文近30篇；获授权国家发明专利20余项。xxx成果获2012年度教育部技术发明一等奖（第二完成人）。

  承担科研情况

  国家杰出青年基金：图像/视频的结构表达及应用，2015.1.1-2019.12.30

  国家自然科学基金重点项目：适应云计算环境的视频编码、传输与智能处理，2012.1-2016.12

  武器装备预先研究项目：xxx三维重建，2011.7-2014.12

  武器装备预先研究基金：xxx，2013.7-2015.6

  所获奖励

  2012年度教育部技术发明一等奖（第二完成人）

  2013年度中国计算机学会青年科学家奖

  社会兼职

  中国计算机学会理事、学术工作委员会副主任

  中国图像图形学会理事、多媒体专业委员会副主任和青年工作委员会副主任

  中国自动化学会副秘书长

  备注'
