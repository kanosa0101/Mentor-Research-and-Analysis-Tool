bio_raw: '个人信息

  张华平，北京理工大学计算机学院副院长，特聘教授，国家级领军人才，新疆天池英才，NLPIR实验室主任，博士生导师（每年拟招3名博士，5名硕士，1个博后），新疆大学博导（每年拟招1名博士，2名硕士），博士毕业于中国科学院计算技术研究所，知名汉语分词系统ICTCLAS创始人，中国人工智能学会多语种智能信息处理专业委员会秘书长，中国计算机学会杰出会员，信息社会50人论坛成员，全国社会舆情分析论坛主席，同时担任新疆大学、首都师范大学、西南政法大学兼职导师；中央网信办评审专家，公安部评审专家，中国计算机学会青年科技论坛YOCSEF委员，中国计算机学会普及工委委员，国家自然科学基金函评专家，北京市重点产业知识产权联盟专家、同时担任《Data
  Intelligence》《应用科技》编委；同时担任教育部学位中心博士学位论文、多个顶会顶刊评审专家。研究方向为：多语种智能信息处理、大数据搜索与挖掘、自然语言处理。张华平作为课题组长主持开发了国家自然科学基金、装发演示验证项目，国防创新特区课题、国防基础加强重点课题、国防先导计划、863、973、242等科研课题几十余项，曾牵头或前三获得省部级科技奖7项，其中国家BM科技奖一等奖（排名第一），国防科技进步奖二等奖2项（排名第一），新疆自治区科技进步一等奖1项（排名第二），钱伟长中文信息处理科学技术奖一等奖1项（排名第二）。发表《大数据智能分析》、《自然语言处理与应用》等专著6部。论文百余篇，SCI一区等高质量论文20余篇，所研制的NLPIR/ICTCLAS语义分析系统是中文自然语言处理领域引用最多的成果（国内外引用近3万次）。并作为特邀大数据技术专家，先后在中央电视台担任特约专家，引起学术界与产业界广泛关注。

  科研方向

  多语种智能信息处理、情报智能分析、大数据搜索与挖掘、自然语言处理

