  所获奖励

  1.2023年，获国家级领军人才荣誉称号

  2.2024年，面向*的文图音像多模态智能识别关键技术及应用, 国家**科学技术奖一等奖（排名第1）

  3.2023年，网络空间多语种内容*关键技术及应用, GF科技进步奖二等奖（排名第1）

  4.2022年，大数据**认知与生成关键技术及应用, GF科技进步奖二等奖（排名第1）

  5.2021年，汉维大数据语义智能分析关键技术及应用, 新疆自治区政府科技进步奖一等奖（排名第2）

  6. 2010年获得钱伟长中文信息处理科学技术奖一等奖（中文信息领域最高奖）

  7.指导的比赛获奖

  1)2023年 中国人工智能学会 多语种图像描述生成测评比赛，维吾尔语全国第一名，藏语第二名，蒙古语第二名。获奖研究生：李林翰

  2)2022年“上海-香港跨学科社交媒体分析联合评测”：“多语言语境下的情感分析赛道”决赛第一名；获奖研究生：蔡佳豪

  3)中国中文信息学会 临床事件抽取，第一名，康铠、宋若语、杜伦；中国健康信息处理会议(CHIP2021)；指导老师：张华平、郭宇航

