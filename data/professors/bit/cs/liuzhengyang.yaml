bio_raw: '个人信息

  刘正阳，男，博士，北京理工大学计算机学院长聘副教授（特别研究员），博士生导师。本科和博士毕业于上海交通大学，2019年12月加入计算机学院。研究方向为理论计算机科学，曾在理论计算机科学顶级会议STOC、CCC和人工智能顶级会议AAAI、WWW、AMAAS上发表多篇论文。

  欢迎对算法设计和数学感兴趣的本科、研究生加入实验室深造或科研实习。

  科研方向

  理论计算机科学，主要为算法博弈论、计算复杂性和在线学习。

  代表性学术成果

  本页面不常更新，详见个人主页：https://lozycs.github.io/

  承担科研情况

  1. 国家自然科学基金青年项目 2021.01-2023.12，主持。

  2. 国家自然科学基金面上项目 2025.01-2028.12，主持。

  3. 北京理工大学青年教师学术启动计划， 2020年1月-2022年12月，主持。

  所获奖励

  社会兼职

  CCF会员，理论计算机专委、计算经济学专委执行委员。

  长期担任IJTCS, FAW, IJCAI, AAAI程序委员会成员。

  担任STOC、SODA、ICALP、SAGT、ISAAC、TCS、SIAM Journal on Computing、Algorithmica等理论计算机科学会议期刊的审稿人。

  备注

  欢迎有意来读研以及打算在本科阶段接触科研的同学邮件联系。'
