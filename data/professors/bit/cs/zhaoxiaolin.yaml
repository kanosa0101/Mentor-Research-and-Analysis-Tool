bio_raw: '个人信息

  科研方向

  网络空间安全、隐私计算与保护、软件安全理论、数据库技术

  代表性学术成果

  1、基于李群的网络系统行为风险计算方法[J].信息安全学报, 2024

  2、Research on Network Behavior Risk Measurement Method Based on Traffic Analysis[J].
  Security and Communication Networks, 2023

  3、基于TOPSIS的多维网络安全度量模型研究[J].北京理工大学学报（自然科学版）, 2021

  4、Defending Application Layer DDoS attacks via Multidimensional Parallelotope[J].
  Security and Communication Networks, 2021

  5、Research on Network Risk Evaluation Method Based on a Differential Manifold[J].
  IEEE Access, 2020

  6、基于微分流形的网络攻防效用度量方法[J]. 清华大学学报（自然科学版）,2020

  7、专利：一种DDoS攻击下的网络系统安全风险评估方法，2022

  8、专利：一种多维多粒度的网络空间安全度量方法，2021

  9、专利：一种基于李群的网络系统风险度量方法，2020

  承担科研情况

  国家重点研发计划在研课题：《健身知识和线上指导数据安全与隐私保护技术研究》负责人

  国家自科基金重点国际合作在研：《移动互联环境下抑郁症主动智能筛查、评估、干预方法和隐私保护机制研究》技术负责人

  国家重点研发计划：《网络系统安全度量方法与指标体系》技术负责人、《金融风险防控关键技术标准研究》子课题负责人

  国家自然科学基金：《恶意代码演化机理及检测方法研究》

  863：《软件系统安全逆向性分析与系统》、《软件缺陷发现系统》技术负责人

  所获奖励

  北京市教学成果一等奖、二等奖

  两次获北京理工大学优秀共产党员，两次获北京理工大学师德标兵，一次获北京理工大学三育人先进称号。

  社会兼职

  备注'
