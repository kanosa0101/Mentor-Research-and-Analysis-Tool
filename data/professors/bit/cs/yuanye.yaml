bio_raw: '个人信息

  袁野，现为北京理工计算机学院教授、博士生导师、国家级领军人才。主持国家自然基金重点项目，科技部重点研发课题。曾获中国电子学会自然一等奖，教育部和辽宁省科技进步一等奖、全国优秀博士论文提名奖、中国计算机学会优秀博士论文奖。袁博士是中国计算机学会数据库专业委员会常委、大数据专家委员会委员、分布式系统专委委员、人工智能学会信息服务专委常委、中国计算机学会高级会员，IEEE、ACM高级会员。香港科技大学、香港中文大学、英国爱丁堡大学访问学者。在SIGMOD、VLDB、ICDE、VLDB
  Journal、IEEE Trans. TKDE、IEEE Trans. TPDS等重要学术会议和期刊上发表论文100余篇。

  NEWS: 每年计划招收博士生1-2人、硕士研究生4人，同时也欢迎优秀的高年级本科生加入实验室，表现优秀者将推荐至美国、欧洲、澳洲、香港、新加坡各地继续深造 （注：有ACM程序设计竞赛背景者将优先考虑）。有意加入本课题组的学生请将个人简历发送至：
  yuan-ye@bit.edu.cn

  科研方向

  主要研究方向：

  （1） 大数据管理与分析：包括数据共享与定价、图数据管理、时空数据管理、众包数据管理、不确定数据管理、数据质量、数据隐私保护等；

  （2） 基于大数据的人工智能包括：知识图谱、机器学习的可解释性、机器学习的公平性等；

  （3） 分布式大数据计算：包括联邦学习、大数据计算平台、分布式机器学习、区块链、云计算、边缘计算等。

