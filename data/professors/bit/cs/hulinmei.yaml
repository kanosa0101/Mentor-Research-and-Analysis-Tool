  承担科研情况

  1. 国家自然科学基金面上项目，融合知识的可解释多模态虚假信息检测方法研究， 2023/01-2026/12，在研，负责人。

  2. 国家青年自然科学基金项目，基于深度强化学习的新闻事件预测方法研究 ，2019/01-2021/12，结题，负责人。

  3. 北京智源人工智能研究院悟道基金项目，融合知识的增量预训练语言模型及其可解释性，2022/01-2022/12，在研，负责人

  4. 国家自然科学基金通用技术基础研究联合基金重点项目，基于网络行为的人物心理刻画方法，2020/01-2022/12，在研，参与

