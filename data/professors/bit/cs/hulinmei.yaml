bio_raw: '个人信息

  胡琳梅，预聘副教授/特别研究员，博士生导师、硕士生导师。2018年博士毕业于清华大学知识工程实验室KEG（实验室创立了国内第一大模型公司——智谱），荣获北京市优秀博士毕业生。2019年获得微软亚研院铸星计划支持（全亚洲12人），2023获AI华人女性青年学者（全球80人），2026年获得北京市科技新星。主持国家自然科学基金面上项目。发表CCF
  A类等高水平论文80余篇，Google学术引用次数近5000。担任中文信息学会青工委执行委员（17人），CCF大模型论坛执行委员。

  担任《Data Intelligence》期刊编委（中科院二区），担任《AI Open》期刊青年编委（IF：14.8），担任CCF A类会议ACL领域主席、IJCAI
  SPC，TKDE、TOIS、AAAI 等PC、审稿人。

  News：每年计划招收博士生2名，硕士生2名，欢迎勤奋、踏实、自驱力强的计算机、人工智能等相关专业的学生报考。

  已毕业硕士生4人，均发表CCF A 2篇以上，均获得校级优秀毕业生、国家奖学金等荣誉，3人曾在智谱实习，4位毕业生全部获得企业人才计划，包括美团北斗，美团、阿里、蚂蚁ssp
  offer。

  主页：https://www.aminer.cn/profile/53f3a233dabfae4b34ac12ac

  科研方向

  大语言模型推理、多模态大模型、知识增强大模型、虚假信息检测、AI交叉（生信、社会、教育）

  实验室在发表或投稿CCF A的情况下允许暑期实习（可推荐智谱实习），目前所有毕业生均参与暑期实习！欢迎希望在大模型方向深耕并产出高水平成果的同学们加入我们！请联系hulinmei@bit.edu.cn

