bio_raw: '个人信息

  张文耀，博士，江西萍乡人，现任北京理工大学计算机学院副教授，硕士生导师。

  1996年毕业于江西师范大学，获学士学位； 1999年毕业于北京理工大学，获硕士学位；2003年毕业于中国科学院软件研究所，获博士学位。2003年3月就职于北京理工大学计算机学院，教师。2014年9月至2015年9月，美国哈佛医学院，访问学者。

  目前主要从事科学可视化、医学影像处理、混合现实、人工智能与深度学习等方面的研究工作。累计主持：2项国家自然科学基金面上项目、1项国家自然科学基金面上合作项目、1项校基础研究基金项目、多项校企合作项目。作为主要成员，参与多项国家自然基金项目以及部委合作项目。累计发表学术论文近40篇，申报国家发明专利25项（正式授权17项），申报并获得计算机软件著作权13项。合作出版教材1部、译著1部。

  【详细情况，请参阅：https://wyz621.github.io】

  科研方向

  科学可视化、医学影像处理、混合现实、人工智能与深度学习

  代表性学术成果

  1. Wenyao Zhang*, Jianguo Ning, Manrui Zhang, Yuezhu Pei, Beichen Liu and BoSun.
  Multiresolution Streamline Placement based on Control Grids. Integrated Computer-Aided
  Engineering, Vol.21, No.1, pp. 47-57, 2014.

  2. Wenyao Zhang*, Yi Wang, Jianfeng Zhan, Beichen Liu, and Jianguo Ning. Parallel
  Streamline Placement for 2D Flow Fields. IEEE Transactions on Visualization and
  Computer Graphics, Vol. 19, No. 7, pp.1185-1198, July 2013.

  3. 张文耀,孙波,宁建国. 一种间隔基本均匀的三维流线放置方法. 授权专利号：ZL201210044458.8，授权公告日：2014-2-26.

  4. 张文耀, 宁建国, 王义. 一种适用于二维流场的并行流线放置方法.授权专利号：ZL201110452884.0，授权公告日：2013-12-25.

  5. 张文耀，宁建国. 一种拓扑驱动的平面流场流线放置方法. 授权专利号：ZL200910235656.0, 授权公告日：2011-07-20.

  承担科研情况

  主持并完成2项国家自然科学基金面上项目、1项国家自然科学基金面上合作项目、1项校基础研究基金项目、多项校企合作项目。作为主要成员，参与多项国家自然基金项目以及部委合作项目。

  所获奖励

  社会兼职

  CCF会员，ACM会员

  备注

  有关课题组和实验室的情况，请参阅：https://wyz621.github.io.'
