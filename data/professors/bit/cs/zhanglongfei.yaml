bio_raw: '个人信息

  张龙飞，博士，副教授，2005年8月博士毕业于北京理工大学计算机科学工程学院，同年留校于软件学院、计算机学院任教至今。2009年12月至2011年11月赴美国卡内基梅隆大学任访问科学家，“数字表演与仿真技术”北京市重点实验室副主任，“北京理工大学科研院—杭州申昊人工智能联合实验室”主任，担任《数字媒体技术与应用》《智能媒体计算》《数字媒体新技术专题》《数字图像处理与模式识别》《多媒体网络与流媒体网络》等本科与研究生课程30余门次，目前主要研究内容聚焦于“视频人员三维行为分析、预测与建”、“跨媒体知识库与常识库”“智能表演创意生成与评估”“体育内容理解与智能导播”等。

  科研方向

  多媒体信息检索、计算机视觉、机器学习和数字表演等

  代表性学术成果

  发表EI/SCI论文30余篇，教材专著2本，专利4项。

  承担科研情况

  承担包括国家自然科学基金、国家重点研发计划项目、国家科技支撑计划、博士点基金等科研项目，主要有近年来主持了国家重点研发计划课题“活动排演与训练仿真关键技术研究”、教育部高等学校博士学科点专项科研基金“基于协同注意的监控视频事件检测方法研究”、国家科技支撑计划课题“舞美整装接口设计与应用技术研究”“舞美设计与布景彩排关键技术研究与系统”“舞台视觉呈现集成仿真技术及系统”及“舞美创意设计集成技术与应用”、“特大城市交通拥堵治理超级仿真技术研究”等项目。作为主要负责人承担了“北京2008奥运会开闭幕式仿真编排训练与指挥系统”、“首都国庆60周年群众游行仿真编排训练与指挥系统”、“平昌冬奥会北京8分钟表演仿真”“国庆70周年群众游行仿真编排训练与指挥系统”等数字表演项目。

  所获奖励

  曾获部级一等奖“王选奖”、工人先锋号、首都国庆60周年先进个人、国庆70周年先进个人等。

  参加了NIST主办TRECVID SED（监控视频事件检测）竞赛并连续两年获得总成绩第一，及单项成绩第一，并获得“突出贡献奖（Outstanding Contributor）”。

  国际多媒体PCM2015会议最佳论文第二名（Best student paper runner up）.

  社会兼职

  担任CVIU、Nerocomputing、Multimedia tools and Appl.、ACM Multimedia等期刊及会议的审稿人或程序委员会成员，IEEE、ACM、CCF智能信息网络会员

  备注'
