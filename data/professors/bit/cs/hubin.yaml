bio_raw: '个人信息

  胡斌，教授、博士生导师。入选国家级领军人才，973首席科学家，享受国务院政府特殊津贴，英国工程技术学会会士。

  科研方向

  可穿戴计算、情感计算、心理生理计算

  代表性学术成果

  发表会议、期刊论文400余篇，入围科睿唯安高被引科学家；获发明专利授权21项、相关技术获批国家二类医疗器械许可。

  承担科研情况

  主持国家973计划、国家自然科学基金重点项目、多项欧盟和英国数字化精神健康项目、国家变革性技术“基于心理生理多模态信息的精神障碍早期识别与干预技术”等重大重点项目。

  所获奖励

  2020年甘肃省专利发明人奖、2019年国家专利金奖、2018年国家技术发明二等奖、2016年教育部技术发明一等奖；获2014年中国侨界创新人才奖等，被评为2020年全国先进工作者。

  社会兼职

  担任教育部计算机学科教指委委员、科技委委员、IEEE Transactions on Computational Social Systems主编、IEEE Transactions
  on Affective Computing编委等。

  备注'
