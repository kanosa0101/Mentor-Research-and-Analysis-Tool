bio_raw: '个人信息

  礼欣，博士，博士后。

  吉林大学学士、硕士，师从孙吉贵教授。香港浸会大学(Hong Kong Baptist University)博士（导师：William K. Cheung教授与Jiming
  Liu教授）、博士后，University of Waterloo 访问学者 (Host: Prof. Pascal Poupart)，University of
  Technology Sydney高级访问学者 (Host: Prof. Ivor W. Tsang). 目前主要从事强化学习、图学习的理论研究和技术应用。近年来以第一作者或通讯作者在ICML、NeurIPS、ICLR、KDD、IJCAI、AAAI、TPAMI、TCYB、、TKDE、TOIS等人工智能、机器学习领域的知名国际会议及期刊发表多篇学术论文。2010-2019年曾担任The
  IEEE Intelligent Informatics Bulletin助理执行编辑。

  在研究生培养方面、重视学生的国际交流，积极推荐学生赴香港浸会大学、香港理工大学、斯坦福大学、悉尼科技大学、新加坡A*STAR等世界知名学府及学术研究机构进行交流访问。指导本科生、硕士研究生、博士研究生发表多篇CCF
  A类会议论文，CCF A类/SCI一区期刊论文，并荣获国家奖学金。毕业研究生去向包括：微软、阿里巴巴、字节跳动、腾讯、京东、美团，滴滴等知名企业，或中国招商银行总行，中国工商银行总行，中科院电子所，中科院信工所，中国外交部等企事业单位。

  科研方向

  机器学习、深度(强化)学习、表示学习理论及应用，包括：

  复杂网络数据挖掘、城市计算、医疗及公共卫生领域的应用，如：疾病诊断/预测；

  以及深度学习/深度强化学习技术在工业大数据、机器人及特定领域的应用。

