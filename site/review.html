<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>本机核验工作台</title><link rel="stylesheet" href="ui.css"><style>
main{margin:24px auto;padding:0 22px;max-width:1380px}.review-head,.actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.review-head h1{margin:0}.review-layout{display:grid;grid-template-columns:340px minmax(0,1fr);gap:20px;margin-top:18px}.panel{padding:18px;background:#fff;border:1px solid var(--line);min-width:0}.filters{display:grid;grid-template-columns:1fr 1fr;gap:10px}.filters label:first-child{grid-column:1/-1}label{display:grid;gap:7px;font-size:13px;margin-bottom:12px}input,select,textarea{width:100%;padding:9px;border:1px solid var(--line);background:#fff}textarea{resize:vertical;line-height:1.7;min-height:80px}.queue{max-height:70vh;overflow:auto}.queue button{display:block;width:100%;text-align:left;margin:10px 0;padding:14px;line-height:1.6}.queue button[aria-current]{border-color:var(--accent);background:var(--soft)}.queue small{display:block;margin-top:5px}.badge{font-size:12px;color:var(--accent);background:var(--soft);border-radius:4px;padding:4px 8px}#message{padding:12px;line-height:1.7}#message:empty{display:none}.error,.blockers{background:#fff3e7;color:#805219;padding:12px;border-radius:6px;line-height:1.8}.success{background:var(--soft)}.notice{line-height:1.8;color:var(--muted)}details{margin:15px 0;border-top:1px solid var(--line);padding-top:12px}summary{cursor:pointer;padding:6px 0;font-weight:600}pre{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.7;background:#f7f8f5;padding:12px;max-height:420px;overflow:auto}.source-text{white-space:pre-wrap;line-height:1.8;overflow-wrap:anywhere;max-height:460px;overflow:auto}.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{min-width:0}.wide{grid-column:1/-1}.field details{margin:0 0 14px;font-size:12px}.field details summary{font-weight:400;color:var(--accent)}.check{display:flex;gap:8px;align-items:flex-start;line-height:1.7}.check input{width:auto;margin-top:5px}.suggestion{padding:10px 0;border-bottom:1px solid var(--line);overflow-wrap:anywhere}.suggestion p{line-height:1.7}.publish-box{border:1px solid var(--line);padding:16px;background:#f8faf7;margin-top:22px}.source-links{display:flex;gap:16px;flex-wrap:wrap;margin:14px 0}a{overflow-wrap:anywhere}.empty{padding:35px 10px;line-height:1.8;color:var(--muted)}.hash{font:12px monospace;overflow-wrap:anywhere}.diff-row{padding:8px 0;line-height:1.7;border-bottom:1px solid var(--line)}
@media(max-width:850px){.review-layout{grid-template-columns:1fr}.queue{max-height:300px}main{padding:0 14px}.field-grid{grid-template-columns:1fr}.wide{grid-column:auto}.review-head h1{font-size:26px}}
</style></head><body><main><div class="review-head"><h1>机会核验工作台</h1><span class="badge">仅本机维护</span><button id="reload" type="button">刷新队列</button></div><p class="notice">按当前申请轮次、截止时间和等待时长处理。规则建议需逐项核验，采纳或保存草稿不会发布。</p><div id="message" role="status" aria-live="polite"></div><div class="review-layout"><aside class="panel"><div class="filters"><label>搜索学校或项目<input id="search" type="search" placeholder="学校、院系、活动名称"></label><label>处理状态<select id="status-filter"><option value="">全部状态</option></select></label><label>处理范围<select id="priority-filter"><option value="">全部轮次</option><option value="current">当前轮次线索</option><option value="failures">来源失败或变化</option><option value="historical">历史参考</option></select></label><label>排序<select id="sort-filter"><option value="priority">优先处理</option><option value="deadline">截止时间</option><option value="waiting">等待最久</option></select></label><label>毕业年份<input id="year-filter" type="number" min="2000" max="2100" placeholder="如 2028"></label></div><p id="queue-count" class="muted"></p><div id="queue" class="queue"></div></aside><section class="panel" id="detail" aria-label="核验详情"><p class="empty">选择左侧项目，查看原文、建议、证据与发布阻塞原因。</p></section></div></main><script src="review.js"></script></body></html>
