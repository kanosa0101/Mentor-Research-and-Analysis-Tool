</div></header><main class="account-main"><h1 id="account-heading">登录后继续申请准备</h1><p>申请项目、材料、沟通记录、收藏与待办保存在你的账号下，可在不同设备登录使用。</p><section class="account-panel"><div id="account-tabs" class="account-tabs"><button type="button" data-account-mode="login">登录</button><button type="button" data-account-mode="register">注册账号</button></div><form id="account-form"><label>用户名<input id="account-username" name="username" autocomplete="username" minlength="3" maxlength="40" pattern="[A-Za-z0-9_.\-]{3,40}" required placeholder="3—40 位字母、数字或 _ . -"></label><label>密码<input id="account-password" name="password" type="password" autocomplete="current-password" minlength="12" maxlength="200" required></label><label id="account-confirm-label" hidden>再次输入密码<input id="account-confirm" type="password" autocomplete="new-password" minlength="12" maxlength="200"></label><p class="account-note">密码至少 12 位。当前尚不支持邮件找回，请妥善保存账号密码。</p><button type="submit" id="account-submit" class="primary">登录并继续</button></form><div id="account-signed-in" hidden><p>当前账号：<strong id="account-name"></strong></p><p><a id="account-continue" href="start.html">继续使用 →</a></p><details><summary>修改密码</summary><form id="password-form"><label>当前密码<input id="password-current" type="password" autocomplete="current-password" required></label><label>新密码<input id="password-new" type="password" autocomplete="new-password" minlength="12" maxlength="200" required></label><button id="password-submit" type="submit">保存新密码</button><p class="account-note">修改后其他设备将退出登录。</p></form></details><button id="account-logout" type="button">退出账号</button></div><p id="account-message" role="status" aria-live="polite"></p></section><p class="account-note">浏览导师和院校资料无需登录。旧浏览器收藏可在申请导航中预览并导入，不会自动上传。</p></main><script src="account.js?v=20261115-online1"></script></body></html>
